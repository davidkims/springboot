name: "Generative AI Catalog - MAX ECHO - Python"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_ID: ${{ github.run_id }}
      LOG_DIR: .github/echo_logs
      PUBLIC_DIR: public
      DATA_SUBDIR: data
      DOCS_SUBDIR: docs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Echo env snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR"
          exec > >(tee -a "$LOG_DIR/build.log") 2>&1
          ts(){ date '+%F %T.%3N'; }
          echo "[ECHO][$(ts)] STEP START: env-snapshot"
          echo "[ECHO] RUN_ID=$RUN_ID"
          echo "[ECHO] REPO=${GITHUB_REPOSITORY}"
          echo "[ECHO] REF=${GITHUB_REF}"
          echo "[ECHO] SHA=${GITHUB_SHA}"
          echo "[ECHO] RUNNER_OS=${RUNNER_OS}"
          echo "[ECHO] Python requested=3.11 actual=$(python -V 2>&1)"
          echo "[ECHO] Disk usage:"
          df -h | sed 's/^/[ECHO][DF] /'
          echo "[ECHO][$(ts)] STEP OK: env-snapshot"

      - name: Generate site via Python (MAX ECHO)
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG_DIR/build.log") 2>&1
          echo "[ECHO] STEP START: python-generator"
          python - <<'PY'
import os, sys, hashlib, json, textwrap, stat, traceback, time, platform

RUN_ID      = os.environ.get("RUN_ID","0")
LOG_DIR     = os.environ.get("LOG_DIR",".github/echo_logs")
PUBLIC_DIR  = os.environ.get("PUBLIC_DIR","public")
DATA_SUBDIR = os.environ.get("DATA_SUBDIR","data")
DOCS_SUBDIR = os.environ.get("DOCS_SUBDIR","docs")

def ts():
    return time.strftime("%Y-%m-%d %H:%M:%S", time.localtime()) + f".{int((time.time()%1)*1000):03d}"

def echo(msg):
    print(f"[ECHO][{ts()}] {msg}", flush=True)

def ensure_dirs():
    for d in [LOG_DIR, PUBLIC_DIR, os.path.join(PUBLIC_DIR, DATA_SUBDIR), os.path.join(PUBLIC_DIR, DOCS_SUBDIR)]:
        os.makedirs(d, exist_ok=True)
        echo(f"DIR READY: {d}")

def write_file(path: str, content: bytes, preview_lines: int = 10):
    t0 = time.time()
    size = len(content)
    sha  = hashlib.sha256(content).hexdigest()
    approx_lines = content.count(b"\n") + (0 if content.endswith(b"\n") else 1 if content else 0)
    echo(f"PRE-WRITE META: bytes={size} lines~={approx_lines} sha256={sha} path={path}")

    os.makedirs(os.path.dirname(path), exist_ok=True)
    echo(f"WRITE START: {path}")
    with open(path, "wb") as f:
        f.write(content)
    os.chmod(path, stat.S_IRUSR | stat.S_IWUSR | stat.S_IRGRP | stat.S_IROTH)

    size_fs = os.path.getsize(path)
    sha_fs  = hashlib.sha256(open(path,"rb").read()).hexdigest()
    lines_fs = 0
    with open(path, "r", encoding="utf-8", errors="replace") as f:
        for _ in f:
            lines_fs += 1

    echo(f"FILE CREATED: {path}")
    echo(f"FILE BYTES={size_fs}  LINES={lines_fs}  SHA256={sha_fs}")

    try:
        with open(path, "r", encoding="utf-8", errors="replace") as f:
            for i, ln in enumerate(f, 1):
                if i > preview_lines: break
                print(f"[ECHO][PREVIEW {os.path.basename(path)}:{i}] {ln.rstrip()}")
    except Exception as e:
        echo(f"PREVIEW SKIP: {e}")

    echo(f"WRITE OK: {path} (ms={int((time.time()-t0)*1000)})")

def inventory(root: str):
    echo(f"INVENTORY START: {root}")
    for base, _, files in os.walk(root):
        for name in sorted(files):
            p = os.path.join(base, name)
            try:
                sz = os.path.getsize(p)
                echo(f"INV FILE: {p} bytes={sz}")
            except Exception as e:
                echo(f"INV ERR: {p} ({e})")
    echo("INVENTORY OK")

def main():
    echo("STEP INIT")
    echo(f"PYTHON: {platform.python_version()} on {platform.platform()}")
    ensure_dirs()

    md = textwrap.dedent("""\
        # 생성형 AI 종류 총정리 (Echo-Generated)

        | 구분 | 기술 방식 | 대표 모델 / 서비스 | 주요 활용 분야 |
        |------|-----------|--------------------|----------------|
        | 텍스트 생성형 AI | LLM (Transformer) | GPT-3/4/5, Claude, Gemini, LLaMA, Mistral | 대화형 챗봇, 문서 작성, 요약, 번역, 코드 생성 |
        | 이미지 생성형 AI | Diffusion / GAN | DALL·E, Stable Diffusion, Midjourney, Adobe Firefly, StyleGAN | 일러스트, 광고 이미지, 콘셉트 아트, 합성 |
        | 음악·오디오 생성형 AI | WaveNet/Neural Vocoder/Diffusion | Suno, AIVA, Soundraw, OpenAI TTS, Azure TTS, So-VITS-SVC, RVC | 작곡, TTS, 보이스 체인지, 효과음 |
        | 영상·애니메이션 생성형 AI | Diffusion + Video Transformer | Runway Gen-2, Pika, Synthesia, HeyGen | 광고·티저, 애니, 유튜브 콘텐츠 |
        | 3D·모델 생성형 AI | NeRF/Point/Mesh | Point-E, Shap-E, Luma AI, Meshy | 게임·메타버스 오브젝트, 3D 디자인 |
        | 멀티모달 생성형 AI | Multimodal Transformer | GPT-4o, Gemini Advanced, Claude 3.5 Sonnet(Vision), Kosmos-2 | 텍스트·이미지·음성 통합, 시각 분석 |
        | 데이터·코드 생성형 AI | Code LLM/AutoML | GitHub Copilot, Tabnine, Replit Ghostwriter, Amazon CodeWhisperer | 코드·SQL 생성, 리팩터링, 분석 |

        > 본 파일은 GitHub Actions EchoOps로 자동 생성되었습니다.
    """)

    js = {
        "generated_at": RUN_ID,
        "categories": [
            {"name":"Text","tech":["LLM","Transformer"],"models":["GPT-3/4/5","Claude","Gemini","LLaMA","Mistral"],"use_cases":["chatbot","writing","summary","translation","code"]},
            {"name":"Image","tech":["Diffusion","GAN"],"models":["DALL·E","Stable Diffusion","Midjourney","Adobe Firefly","StyleGAN"],"use_cases":["illustration","ad","concept art","compositing"]},
            {"name":"Audio/Music","tech":["WaveNet","Neural Vocoder","Diffusion"],"models":["Suno","AIVA","Soundraw","OpenAI TTS","Azure TTS","So-VITS-SVC","RVC"],"use_cases":["music","tts","voice conversion","sfx"]},
            {"name":"Video","tech":["Diffusion","Video Transformer"],"models":["Runway Gen-2","Pika","Synthesia","HeyGen"],"use_cases":["ads","animation","youtube"]},
            {"name":"3D","tech":["NeRF","Point","Mesh"],"models":["Point-E","Shap-E","Luma AI","Meshy"],"use_cases":["game assets","metaverse","product design"]},
            {"name":"Multimodal","tech":["Multimodal Transformer"],"models":["GPT-4o","Gemini Advanced","Claude 3.5 Sonnet (Vision)","Kosmos-2"],"use_cases":["text-image-audio integration","vision qa"]},
            {"name":"Data/Code","tech":["Code LLM","AutoML"],"models":["GitHub Copilot","Tabnine","Replit Ghostwriter","Amazon CodeWhisperer"],"use_cases":["code gen","bug fix","sql","analysis"]},
        ],
    }

    csv = textwrap.dedent("""\
        category,tech,models,use_cases
        Text,"LLM|Transformer","GPT-3/4/5|Claude|Gemini|LLaMA|Mistral","chatbot|writing|summary|translation|code"
        Image,"Diffusion|GAN","DALL·E|Stable Diffusion|Midjourney|Adobe Firefly|StyleGAN","illustration|ad|concept art|compositing"
        Audio/Music,"WaveNet|Neural Vocoder|Diffusion","Suno|AIVA|Soundraw|OpenAI TTS|Azure TTS|So-VITS-SVC|RVC","music|tts|voice conversion|sfx"
        Video,"Diffusion|Video Transformer","Runway Gen-2|Pika|Synthesia|HeyGen","ads|animation|youtube"
        3D,"NeRF|Point|Mesh","Point-E|Shap-E|Luma AI|Meshy","game assets|metaverse|product design"
        Multimodal,"Multimodal Transformer","GPT-4o|Gemini Advanced|Claude 3.5 Sonnet (Vision)|Kosmos-2","text-image-audio integration|vision qa"
        Data/Code,"Code LLM|AutoML","GitHub Copilot|Tabnine|Replit Ghostwriter|Amazon CodeWhisperer","code gen|bug fix|sql|analysis"
    """)

    html = textwrap.dedent("""\
        <!doctype html>
        <html lang="ko">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Generative AI Catalog (EchoOps)</title>
        <style>
          body { font-family: system-ui, sans-serif; margin: 24px; }
          table { border-collapse: collapse; width: 100%; }
          th, td { border: 1px solid #ddd; padding: 8px; }
          th { background: #f5f5f5; }
        </style>
        <h1>생성형 AI 카탈로그</h1>
        <p>이 페이지는 GitHub Actions EchoOps로 자동 생성·배포됩니다.</p>
        <div id="table">Loading…</div>
        <script>
        (async function () {
          try {
            const res = await fetch('./data/generative_ai_catalog.json');
            const js = await res.json();
            const rows = (js.categories||[]).map(c => `<tr>
              <td>${c.name}</td>
              <td>${(c.tech||[]).join(', ')}</td>
              <td>${(c.models||[]).join(', ')}</td>
              <td>${(c.use_cases||[]).join(', ')}</td>
            </tr>`).join('');
            document.getElementById('table').innerHTML =
              `<table><thead><tr><th>구분</th><th>기술 방식</th><th>대표 모델</th><th>활용 분야</th></tr></thead><tbody>${rows}</tbody></table>`;
          } catch(e) {
            document.getElementById('table').textContent = '데이터 로드 실패';
            console.error(e);
          }
        })();
        </script>
        </html>
    """)

    # Paths
    out_md   = os.path.join(PUBLIC_DIR, DOCS_SUBDIR, "README_GENAI.md")
    out_js   = os.path.join(PUBLIC_DIR, DATA_SUBDIR, "generative_ai_catalog.json")
    out_csv  = os.path.join(PUBLIC_DIR, DATA_SUBDIR, "generative_ai_catalog.csv")
    out_html = os.path.join(PUBLIC_DIR, "index.html")

    # Write
    write_file(out_md,   md.encode("utf-8"))
    write_file(out_js,   json.dumps(js, ensure_ascii=False, indent=2).encode("utf-8"))
    write_file(out_csv,  csv.encode("utf-8"))
    write_file(out_html, html.encode("utf-8"))

    # Inventory
    inventory(PUBLIC_DIR)
    echo("STEP OK: all files generated")
    return 0

if __name__ == "__main__":
    try:
        sys.exit(main())
    except Exception as e:
        echo(f"STEP FAIL: {e}")
        traceback.print_exc()
        sys.exit(1)
PY
          echo "[ECHO] STEP OK: python-generator"

      - name: Echo tree and sizes
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG_DIR/build.log") 2>&1
          ts(){ date '+%F %T.%3N'; }
          echo "[ECHO][$(ts)] STEP START: tree-sizes"
          du -sh "$PUBLIC_DIR" | sed 's/^/[ECHO][DU] /'
          echo "[ECHO] TREE ↓"
          find "$PUBLIC_DIR" -type f -print0 | xargs -0 ls -l | sed 's/^/[ECHO][LS] /'
