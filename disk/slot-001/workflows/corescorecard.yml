# .github/workflows/mysql-init.yml

name: 🐬 MySQL Root Setup and DB Init

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  mysql-init:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧩 Install MySQL Server
        run: |
          echo "[+] Installing MySQL server..."
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server

      - name: 🔁 Start MySQL Service
        run: |
          echo "[+] Starting MySQL service..."
          sudo systemctl enable mysql
          sudo systemctl start mysql
          sudo systemctl status mysql || true
          sleep 5

      - name: 🔐 Configure MySQL Root Password
        run: |
          echo "[+] Reconfiguring MySQL root user for password login"
          sudo mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpass123'; FLUSH PRIVILEGES;" || echo "[!] Root password may already be set. Skipping."
          echo "[✔] Root user now uses password"

      - name: 🗃️ Create Logistics Database and Tables
        run: |
          echo "[+] Creating logistics DB and schema..."
          DB_PASSWORD=rootpass123
          SCRIPT=/opt/logistics/virtual_customer_data/init_db.sql
          sudo mkdir -p $(dirname $SCRIPT)
          echo "CREATE TABLE customers (customer_id INT PRIMARY KEY AUTO_INCREMENT, name VARCHAR(100) NOT NULL);" > $SCRIPT
          echo "CREATE TABLE card_transactions (" >> $SCRIPT
          echo "  transaction_id INT PRIMARY KEY AUTO_INCREMENT," >> $SCRIPT
          echo "  customer_id INT NOT NULL," >> $SCRIPT
          echo "  card_type ENUM('credit','debit') NOT NULL," >> $SCRIPT
          echo "  amount DECIMAL(10,2) NOT NULL," >> $SCRIPT
          echo "  transaction_time DATETIME DEFAULT CURRENT_TIMESTAMP," >> $SCRIPT
          echo "  FOREIGN KEY (customer_id) REFERENCES customers(customer_id));" >> $SCRIPT
          echo "INSERT INTO customers (name) VALUES ('Alice'),('Bob'),('Charlie');" >> $SCRIPT
          echo "INSERT INTO card_transactions (customer_id, card_type, amount) VALUES (1,'credit',250.00),(1,'debit',50.00),(2,'credit',120.00),(3,'debit',75.50);" >> $SCRIPT

          echo "[+] Creating database..."
          mysql -u root -p$DB_PASSWORD -e "CREATE DATABASE IF NOT EXISTS logistics;"

          echo "[+] Importing data..."
          mysql -u root -p$DB_PASSWORD logistics < $SCRIPT

          echo "[✔] MySQL logistics DB initialized" > .github/logs/mysql_init.log
