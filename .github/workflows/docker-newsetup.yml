name: 🏦 MEGA DB + BANKS EchoOps + 컨테이너 + 업그레이드 + AutoUP 통합

on:
  workflow_dispatch:
  schedule:
    - cron: '5,20,35,50 * * * *'

jobs:
  mega-db-bank:
    runs-on: ubuntu-latest

    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 📁 Echo 디렉토리 생성
      run: |
        set -e
        for d in echo_dirs echo_logs echo_containers/install echo_restart echo_upgrade echo_autoup/log; do
          mkdir -p .github/${d}
          echo "echo '[DIR] 생성됨: .github/${d}'" >> .github/echo_dirs/create_dirs.sh
        done
        chmod +x .github/echo_dirs/create_dirs.sh
        .github/echo_dirs/create_dirs.sh

    - name: 🏦 은행별 디렉토리/스크립트/SQL 에코 자동 생성
      run: |
        set -e
        BANKS="국민 우리 신한 하나 농협 기업 수협 씨티 SC제일 케이카카오토스 새마을금고 우체국 부산 대구 광주 전북 제주 산림조합 신협 한국씨티 JP모건 BOA HSBC UBS 도이치 한국스탠다드차타드 신용카드 롯데 삼성 현대 비씨 NH채움 하나카드 신한카드 우리카드 국민카드 기업카드 현대증권 미래에셋 NH투자 한국투자 신한투자 KB증권 삼성증권 키움 대신 신영"
        for B in $BANKS; do
          for d in autoup/log autoup/targets db/sql db/query db/exec db/log backup; do
            mkdir -p .github/echo_bank/$B/$d
            echo "echo '[DIR] 생성됨: .github/echo_bank/$B/$d'" >> .github/echo_autoup/log/dir_create.log
          done

          echo "#!/bin/bash" > .github/echo_bank/$B/autoup/autoup.sh
          echo "echo '[AUTOUP] $B 자동 업그레이드 실행'" >> .github/echo_bank/$B/autoup/autoup.sh
          echo "sudo apt-get update && sudo apt-get upgrade -y" >> .github/echo_bank/$B/autoup/autoup.sh
          chmod +x .github/echo_bank/$B/autoup/autoup.sh

          echo "#!/bin/bash" > .github/echo_bank/$B/backup/backup.sh
          echo "echo '[BACKUP] $B 백업 실행'" >> .github/echo_bank/$B/backup/backup.sh
          echo "tar czf /tmp/${B}_backup_$(date +%Y%m%d_%H%M).tar.gz /etc /var/lib /home" >> .github/echo_bank/$B/backup/backup.sh
          chmod +x .github/echo_bank/$B/backup/backup.sh

          echo "-- ${B} 초기화 및 거래 SQL" > .github/echo_bank/$B/db/sql/init_and_txn.sql
          echo "CREATE TABLE IF NOT EXISTS accounts (id SERIAL PRIMARY KEY, name TEXT, balance NUMERIC);" >> .github/echo_bank/$B/db/sql/init_and_txn.sql
          echo "CREATE TABLE IF NOT EXISTS transactions (id SERIAL PRIMARY KEY, account_id INT, amount NUMERIC, ts TIMESTAMP);" >> .github/echo_bank/$B/db/sql/init_and_txn.sql
          echo "INSERT INTO accounts (name, balance) VALUES ('사용자1', 1000), ('사용자2', 2000);" >> .github/echo_bank/$B/db/sql/init_and_txn.sql
          echo "INSERT INTO transactions (account_id, amount, ts) VALUES (1, -100, NOW()), (2, 100, NOW());" >> .github/echo_bank/$B/db/sql/init_and_txn.sql
        done

        chmod +x .github/echo_autoup/log/dir_create.log
        bash .github/echo_autoup/log/dir_create.log || echo "[WARN] dir_create.log 실패 무시"
    - name: 📜 요약
      run: |
        echo "[요약] 전체 에코 기반 디렉토리/스크립트/SQL 생성 완료
