name: "🧾 전송 로그 백업 + 대량 확장 + AutoUpgrade + I/O 모니터링 (FULL)"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *" # 5분마다 실행

permissions:
  contents: write

jobs:
  transfer_log_backup_full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRANSFER_LOG_DIR: /opt/logs/transfer
      BACKUP_DIR: /opt/backup/transfer
      PROVENANCE_DIR: provenance
      PROVENANCE_STORE_DIR: provenance/store
      EXT_URL_BASE: "https://raw.githubusercontent.com/davidkims/springboot/main/sample_logs"
      UPGRADE_LOG_DIR: /opt/logs/upgrade
      DISK_MONITOR_LOG: /opt/logs/disk_io.log

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 📂 필수 디렉토리·파일 선생성 (에코)
        run: |
          set -Eeuo pipefail
          echo "[ECHO] 필수 디렉토리 생성 중..."
          sudo install -d -m 0777 "$TRANSFER_LOG_DIR" "$BACKUP_DIR" "$UPGRADE_LOG_DIR"
          mkdir -p "$PROVENANCE_DIR" "$PROVENANCE_STORE_DIR"
          touch "$PROVENANCE_DIR/.provenance_index.json"
          echo "[]" > "$PROVENANCE_DIR/.provenance_index.json"
          echo "[OK] 필수 디렉토리 및 파일 생성 완료"

      - name: 🔄 시스템 패키지 자동 업그레이드 (AutoUpgrade)
        run: |
          set -Eeuo pipefail
          echo "[ECHO] 패키지 업그레이드 시작"
          sudo apt-get update -y
          sudo apt-get upgrade -y | tee "$UPGRADE_LOG_DIR/upgrade_$(date +%Y%m%d_%H%M%S).log"
          echo "[OK] 패키지 업그레이드 완료"

      - name: 📂 외부 샘플 로그 대량 다운로드 (curl)
        run: |
          set -Eeuo pipefail
          echo "[ECHO] 외부 샘플 로그 다운로드"
          for i in $(seq 1 10); do
            curl -fsSL "$EXT_URL_BASE/sample-$i.txt" -o "$TRANSFER_LOG_DIR/ext-sample-$i.txt" || echo "[WARN] 샘플 $i 다운로드 실패"
          done
          echo "[OK] 외부 로그 다운로드 완료"

      - name: 🏦 내부 전송 로그 대량 생성 (100개)
        run: |
          set -Eeuo pipefail
          sudo rm -f "$TRANSFER_LOG_DIR"/*.txt || true
          for i in $(seq 1 100); do
            TS=$(date +'%Y-%m-%d %H:%M:%S')
            AMOUNT=$((RANDOM % 900000 + 100000))
            LOG="[TRANSFER] $TS | 기업거래ID:$i | 송금금액:₩$AMOUNT 완료 | 계좌:110-123-4567$(printf '%02d' $i)"
            echo "$LOG" > "$TRANSFER_LOG_DIR/transfer-log-$i.txt"
          done
          echo "[OK] 내부 전송 로그 생성 완료"

      - name: 📦 백업 및 구조 유지
        id: backup
        run: |
          set -Eeuo pipefail
          TS_FOLDER=$(date +'%Y%m%d_%H%M%S')
          echo "ts_folder=$TS_FOLDER" >> "$GITHUB_OUTPUT"
          DEST="$BACKUP_DIR/$TS_FOLDER"
          sudo install -d -m 0777 "$DEST"
          sudo cp "$TRANSFER_LOG_DIR"/*.txt "$DEST/" || echo "[WARN] 백업할 로그 없음"
          echo "[OK] 백업 완료"

      - name: 📜 provenance.json 생성
        id: genprov
        run: |
          set -Eeuo pipefail
          PROV_FILE="${PROVENANCE_DIR}/.provenance_transfer_${{ steps.backup.outputs.ts_folder }}.json"
          mkdir -p "${PROVENANCE_STORE_DIR}/${{ steps.backup.outputs.ts_folder }}"
          TS=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > "$PROV_FILE" <<JSON
          {
            "type": "transfer_log_backup",
            "timestamp": "$TS",
            "status": "completed",
            "backup_file": "transfer-backup-${{ steps.backup.outputs.ts_folder }}",
            "workflow": "${{ github.workflow }}",
            "repository": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}"
          }
          JSON
          cp "$PROV_FILE" "${PROVENANCE_STORE_DIR}/${{ steps.backup.outputs.ts_folder }}/"
          echo "prov_path=$PROV_FILE" >> "$GITHUB_OUTPUT"

      - name: 📚 provenance 인덱스 업데이트
        id: provindex
        run: |
          set -Eeuo pipefail
          INDEX_FILE="${PROVENANCE_DIR}/.provenance_index.json"
          FILES=$(ls "${PROVENANCE_DIR}"/.provenance_transfer_*.json 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "[]" > "$INDEX_FILE"
          else
            { echo "["; i=0; for f in $FILES; do
                [ $i -gt 0 ] && echo ","
                cat "$f"
                i=$((i+1))
              done; echo "]"; } > "$INDEX_FILE"
          fi
          echo "index_path=$INDEX_FILE" >> "$GITHUB_OUTPUT"

      - name: 📈 디스크 I/O 모니터링 (성능 로그)
        run: |
          set -Eeuo pipefail
          echo "[ECHO] 디스크 I/O 상태 기록"
          iostat -xz 1 3 | tee "$DISK_MONITOR_LOG" || echo "[WARN] iostat 설치 필요"
          df -h | tee -a "$DISK_MONITOR_LOG"
          echo "[OK] 디스크 상태 기록 완료"

      - name: 📤 업로드 (로그, 백업, provenance, 모니터링)
        uses: actions/upload-artifact@v4
        with:
          name: transfer-backup-${{ steps.backup.outputs.ts_folder }}
          path: |
            ${{ env.TRANSFER_LOG_DIR }}/*.txt
            ${{ steps.genprov.outputs.prov_path }}
            ${{ steps.provindex.outputs.index_path }}
            ${{ env.UPGRADE_LOG_DIR }}/*.log
            ${{ env.DISK_MONITOR_LOG }}
          if-no-files-found: error

      - name: 📂 백업 구조 확인
        run: |
          set -Eeuo pipefail
          tree ${{ env.BACKUP_DIR }} -L 2 || echo "[WARN] tree 미설치"
          tree ${{ env.PROVENANCE_STORE_DIR }} || echo "[WARN] tree 미설치"
