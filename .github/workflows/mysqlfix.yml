name: 🐬 MySQL 8.x + robust echo/권한/가상 메일 수신 자동화

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  mysql-robust:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Echo/log/dir robust create
        run: |
          set -e
          echo "echo 'mkdir -p .github/echo'" ; mkdir -p .github/echo
          echo "echo 'mkdir -p .github/logs'" ; mkdir -p .github/logs
          echo "echo 'sudo mkdir -p /var/mail'" ; sudo mkdir -p /var/mail
          echo "echo 'sudo mkdir -p /var/run/mysqld'" ; sudo mkdir -p /var/run/mysqld
          echo "echo 'sudo chown mysql:mysql /var/run/mysqld'" ; sudo chown mysql:mysql /var/run/mysqld || true

      - name: 📦 시스템 전체 업그레이드 및 MySQL/Postfix robust 설치
        run: |
          set -e
          echo "echo 'sudo apt-get update -y'" ; sudo apt-get update -y | tee .github/echo/step-01-apt-update.txt
          echo "echo 'sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y'" ; sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y | tee .github/echo/step-02-apt-upgrade.txt
          echo "echo 'sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server postfix mailutils'" ; sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server postfix mailutils | tee .github/echo/step-03-apt-install.txt

      - name: 🧩 MySQL robust 데몬/소켓/권한 보장
        run: |
          set -e
          echo "echo 'sudo systemctl stop mysql || true'" ; sudo systemctl stop mysql || true
          echo "echo 'sudo pkill -f mysqld || true'" ; sudo pkill -f mysqld || true
          echo "echo 'sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld && sudo chmod 770 /var/run/mysqld'" ; sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld && sudo chmod 770 /var/run/mysqld
          echo "echo 'sudo systemctl start mysql'" ; sudo systemctl start mysql || true
          sleep 4

      - name: 🚨 MySQL robust root/robust_admin reset/privilege (2단계, echo+SQL 분리)
        run: |
          set -e

          # 1. skip-grant-tables (임시 비밀번호 초기화)
          echo "echo '[MySQL] skip-grant-tables entry'" | tee -a .github/echo/step-root-reset.txt
          sudo systemctl stop mysql || true
          sudo pkill -f mysqld || true
          sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld
          nohup sudo mysqld_safe --skip-grant-tables --skip-networking > .github/logs/mysql_skipgrant.log 2>&1 &
          sleep 10

          echo "echo \"UPDATE mysql.user SET authentication_string=PASSWORD('rootpass123'), plugin='mysql_native_password' WHERE User='root';\"" > .github/echo/root-reset.sql
          echo "UPDATE mysql.user SET authentication_string=PASSWORD('rootpass123'), plugin='mysql_native_password' WHERE User='root';" >> .github/echo/root-reset.sql
          echo "echo \"FLUSH PRIVILEGES;\"" >> .github/echo/root-reset.sql
          echo "FLUSH PRIVILEGES;" >> .github/echo/root-reset.sql

          echo "echo 'sudo mysql < .github/echo/root-reset.sql (skip-grant-tables)'" | tee -a .github/echo/step-root-reset.txt
          awk '!/^echo /' .github/echo/root-reset.sql | sudo mysql

          sleep 2
          sudo pkill -f mysqld || true
          sleep 2
          sudo systemctl start mysql
          sleep 4

          # 2. 정상모드에서 robust 권한/패스워드 강화(ALTER/CREATE/GRANT)
          echo "echo \"ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpass123';\"" > .github/echo/root-alter.sql
          echo "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpass123';" >> .github/echo/root-alter.sql
          echo "echo \"ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'rootpass123';\"" >> .github/echo/root-alter.sql
          echo "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'rootpass123';" >> .github/echo/root-alter.sql
          echo "echo \"FLUSH PRIVILEGES;\"" >> .github/echo/root-alter.sql
          echo "FLUSH PRIVILEGES;" >> .github/echo/root-alter.sql

          echo "echo 'sudo mysql < .github/echo/root-alter.sql (normal mode)'" | tee -a .github/echo/step-root-reset.txt
          awk '!/^echo /' .github/echo/root-alter.sql | sudo mysql

          # robust_admin 생성/권한 robust
          echo "echo \"CREATE USER IF NOT EXISTS 'robust_admin'@'%' IDENTIFIED WITH mysql_native_password BY 'robustpass123';\"" > .github/echo/admin-reset.sql
          echo "CREATE USER IF NOT EXISTS 'robust_admin'@'%' IDENTIFIED WITH mysql_native_password BY 'robustpass123';" >> .github/echo/admin-reset.sql
          echo "echo \"GRANT ALL PRIVILEGES ON *.* TO 'robust_admin'@'%' WITH GRANT OPTION;\"" >> .github/echo/admin-reset.sql
          echo "GRANT ALL PRIVILEGES ON *.* TO 'robust_admin'@'%' WITH GRANT OPTION;" >> .github/echo/admin-reset.sql
          echo "echo \"FLUSH PRIVILEGES;\"" >> .github/echo/admin-reset.sql
          echo "FLUSH PRIVILEGES;" >> .github/echo/admin-reset.sql

          echo "echo 'sudo mysql < .github/echo/admin-reset.sql (normal mode)'" | tee -a .github/echo/step-root-reset.txt
          awk '!/^echo /' .github/echo/admin-reset.sql | sudo mysql

          sleep 2

      - name: ✅ MySQL root robust 인증 체크
        run: |
          set -e
          echo "echo '[+] MySQL root robust password/auth test...'" | tee .github/echo/step-root-login.txt
          export MYSQL_PWD=rootpass123
          for i in 1 2 3; do
            echo "echo 'mysqladmin -u root ping'" | tee -a .github/echo/step-root-login.txt
            if mysqladmin -u root ping; then
              echo "echo '[✔] MySQL root password robustly authenticated!'" | tee -a .github/echo/step-root-login.txt
              break
            else
              echo "echo '[!] root login failed ($i). retrying...'" | tee -a .github/echo/step-root-login.txt
              sleep 3
            fi
          done

      - name: 📧 robust 인증 결과 메일 가상 발송
        run: |
          set -e
          echo "echo 'mkdir -p /tmp/echo/mail_send'" ; mkdir -p /tmp/echo/mail_send
          export MYSQL_PWD=rootpass123
          echo "echo 'mysql -u root -e SHOW DATABASES;'" ; mysql -u root -e 'SHOW DATABASES;' > .github/logs/mail_db_list.txt
          echo "echo 'mysql -u root -e SELECT * FROM mysql.user;'" ; mysql -u root -e 'SELECT * FROM mysql.user;' > .github/logs/mail_users.txt || true
          mailbody=".github/logs/mailbody.txt"
          {
            echo "MySQL robust 인증/권한/테스트 결과"
            echo "[SHOW DATABASES]"
            cat .github/logs/mail_db_list.txt
            echo "[mysql.user]"
            cat .github/logs/mail_users.txt
            echo "완료시각: $(date)"
          } > $mailbody
          to_addr=$(id ubuntu >/dev/null 2>&1 && echo ubuntu || echo root)
          subject="[MySQL robust] 인증/권한 결과 ($(date '+%Y-%m-%d %H:%M'))"
          echo "echo 'cat \$mailbody | mail -s ...'" ; cat $mailbody | mail -s "$subject" "$to_addr"

      - name: 📬 가상 메일 robust 수신함 출력
        run: |
          set -e
          echo "echo '[+] Show virtual mailbox (가상수신 결과)'" | tee .github/echo/step-100-mail-recv.txt
          if id ubuntu >/dev/null 2>&1; then
            echo "echo 'sudo cat /var/mail/ubuntu | tee -a ...'" ; sudo cat /var/mail/ubuntu | tee -a .github/echo/step-100-mail-recv.txt || echo '[No mail]' | tee -a .github/echo/step-100-mail-recv.txt
          else
            echo "echo 'sudo cat /var/mail/root | tee -a ...'" ; sudo cat /var/mail/root | tee -a .github/echo/step-100-mail-recv.txt || echo '[No mail]' | tee -a .github/echo/step-100-mail-recv.txt
          fi

      - name: 🟩 Directory/File Permission robust 체크
        run: |
          set -e
          echo "echo '[+] Directory & file permission check...'" | tee .github/echo/step-101-perm.txt
          echo "echo 'ls -lR .github/logs | tee -a ...'" ; ls -lR .github/logs | tee -a .github/echo/step-101-perm.txt || true
          echo "echo 'ls -lR .github/echo | tee -a ...'" ; ls -lR .github/echo | tee -a .github/echo/step-101-perm.txt || true
          echo "echo 'ls -lR /var/mail | tee -a ...'" ; ls -lR /var/mail | tee -a .github/echo/step-101-perm.txt || true
          echo "echo 'ls -lR /var/run/mysqld | tee -a ...'" ; ls -lR /var/run/mysqld | tee -a .github/echo/step-101-perm.txt || true
