name: 🧠 TradingAgents CI with Conda Env Creation + Echo + Test Download

on:
  push:
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/tradingagents.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test-tradingagents:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 [1] 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 [2] Miniconda 설치
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: "3.13"
          activate-environment: false  # ❗ 직접 생성할 예정

      - name: 🏗️ [3] Conda 환경 및 디렉토리 생성
        shell: bash
        run: |
          echo "============================================"
          echo "[🏗️] 3단계: Conda 환경 및 디렉토리 생성 중..."
          echo "============================================"

          echo "[📁] 디렉토리 생성: logs, output, site, scripts"
          mkdir -p logs output site scripts
          touch logs/.keep

          echo "[🐍] Conda 환경 생성: tradingagents"
          conda create -y -n tradingagents python=3.13
          echo "[✅] Conda 환경 생성 완료"
          echo "============================================"

      - name: 🔧 [4] 종속성 설치
        shell: bash
        run: |
          echo "============================================"
          echo "[🔧] 4단계: 종속성 설치 시작"
          echo "============================================"
          conda run -n tradingagents pip install --upgrade pip
          conda run -n tradingagents pip install -r requirements.txt
          echo "[✅] 종속성 설치 완료"
          echo "============================================"

      - name: 🔑 [5] 더미 API 키 환경 변수 설정
        run: |
          echo "============================================"
          echo "[🔑] 5단계: 더미 API 키 등록"
          echo "============================================"
          echo "FINNHUB_API_KEY=dummy_key" >> $GITHUB_ENV
          echo "OPENAI_API_KEY=dummy_key" >> $GITHUB_ENV
          echo "[✅] 환경 변수 등록 완료"

      - name: ▶️ [6] CLI 도움말 테스트
        run: |
          echo "============================================"
          echo "[▶️] 6단계: CLI 도움말 테스트 시작"
          echo "============================================"
          conda run -n tradingagents python -m cli.main --help || echo "[⚠️] CLI 도움말 실패했지만 무시됨"
          echo "[✅] CLI 테스트 완료"

      - name: 🧪 [7] TradingAgents 테스트 코드 다운로드 및 실행
        run: |
          echo "============================================"
          echo "[🧪] 7단계: 테스트 스크립트 다운로드 및 실행"
          echo "============================================"

          echo "[🌐] run_tradingagents.py 다운로드 중..."
          curl -sSfL -o run_tradingagents.py https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/run_tradingagents.py || {
            echo "[❌] run_tradingagents.py 파일을 찾을 수 없습니다!"
            exit 1
          }

          echo "[📄] 다운로드된 run_tradingagents.py 내용:"
          cat run_tradingagents.py

          echo "[🚀] Python 스크립트 실행 중..."
          conda run -n tradingagents python run_tradingagents.py
          echo "[✅] 스크립트 실행 완료"
          echo "============================================"
          echo "[✔] 테스트 성공"
          echo "============================================"

      - name: ✅ [8] 최종 완료 알림
        run: |
          echo "============================================"
          echo "[🎉] 모든 워크플로우 단계가 성공적으로 완료되었습니다!"
          echo "============================================"
