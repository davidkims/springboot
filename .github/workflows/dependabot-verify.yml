---
name: "🧪 Dependabot PR Verify (DB/Network/Omni smoke)"

'on':
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "compose/**"
      - ".github/workflows/**"
      - "requirements.txt"
      - "pom.xml"
      - "build.gradle*"
      - "package.json"

permissions:
  contents: read

jobs:
  smoke:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Engine up
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh || true
          if [ -f .github/echo_tools.sh ]; then start_docker; fi
          docker --version || true
          podman --version || true

      - name: Quick pull targets
        shell: bash
        run: |
          set -Eeuo pipefail
          for img in \
            docker.io/postgres:16 \
            docker.io/nginx:alpine \
            docker.io/grafana/loki:2.9.0; do
            (docker pull "$img" || podman pull "$img") || true
          done
