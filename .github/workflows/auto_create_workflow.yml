name: Auto Create Workflow File

on:
  schedule:
    - cron: '0 * * * *'  # 매시간 정각 실행
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # 워크플로우 파일 푸시 허용을 위해 필수

jobs:
  create-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout repository
        uses: actions/checkout@v4

      - name: 📂 디렉토리 자동 생성 (.github 및 disk 구조)
        run: |
          echo "[+] 디렉토리 생성 시작..."
          mkdir -p .github/workflows
          mkdir -p .github/scripts
          mkdir -p .github/logs

          echo "[+] 디스크 및 슬롯 디렉토리 생성 중..."
          mkdir -p disk/slot-001
          mkdir -p disk/slot-002
          mkdir -p disk/slot-logs

          echo "[✔] 디렉토리 생성 완료: .github/*, disk/slot-*"

      - name: 📝 워크플로우 YAML 파일 생성
        run: |
          echo "[+] 워크플로우 파일 생성 중..."
          {
            echo "name: Sample-Generated-Workflow"
            echo ""
            echo "on:"
            echo "  workflow_dispatch:"
            echo ""
            echo "jobs:"
            echo "  say-hello:"
            echo "    runs-on: ubuntu-latest"
            echo "    steps:"
            echo "      - name: 👋 Say Hello"
            echo "        run: echo 'Hello from generated workflow at \$(date)'"
          } > .github/workflows/generated_workflow.yml
          echo "[✔] .github/workflows/generated_workflow.yml 생성 완료"

      - name: ✅ Git Commit & Push
        run: |
          echo "[+] git 사용자 설정 중..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"

          echo "[+] 변경된 파일 스테이징 중..."
          git add .github/workflows/generated_workflow.yml disk/slot-* || echo "[!] 스테이징할 파일 없음"

          echo "[+] 커밋 시도 중..."
          git commit -m "🆕 Auto-create workflow + disk/slot 디렉토리 at $(date +'%Y-%m-%d %H:%M:%S')" || echo "[!] 커밋할 변경 없음"

          echo "[+] git push 실행 중..."
          git push || echo "[!] 푸시할 변경 없음"

          echo "[✔] 완료"
