name: 📊 Full Monitoring Stack Setup

on:
  workflow_dispatch:

jobs:
  setup_monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Create Monitoring Directories
        run: |
          echo "[📁] Creating base monitoring directories..."
          mkdir -p .monitoring/{influxdb,telegraf,graphite,victoriametrics,otel,statsd,zabbix,nagios,datadog,elastic,sql,scripts,python}
          echo "[✅] Directories created under .monitoring/"

      - name: 🐳 Install Docker CLI
        run: |
          echo "[🐳] Installing Docker CLI..."
          sudo apt-get update -y
          sudo apt-get install -y docker.io
          echo "[✅] Docker installed: $(docker --version)"

      - name: 🛠️ Generate InfluxDB & Telegraf Configs
        run: |
          echo "[🛠️] Generating InfluxDB & Telegraf Configs..."
          echo "[🛠️] Generating InfluxDB config..."
          cat << 'EOF' > .monitoring/influxdb/influxdb.conf
[meta]
  dir = "/var/lib/influxdb/meta"
[data]
  dir = "/var/lib/influxdb/data"
  engine = "tsm1"
[http]
  bind-address = ":8086"
EOF
          echo "[🛠️] Generating Telegraf config..."
          cat << 'EOF' > .monitoring/telegraf/telegraf.conf
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "YOUR_TOKEN"
  organization = "org"
  bucket = "metrics"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
[[inputs.mem]]
EOF
          echo "[✅] InfluxDB and Telegraf configs created"

      - name: 🚀 Launch InfluxDB & Telegraf
        run: |
          echo "[🚀] Launching InfluxDB & Telegraf..."
          echo "[🚀] Starting InfluxDB container..."
          docker run -d --name influxdb \
            -p 8086:8086 \
            -v $PWD/.monitoring/influxdb/influxdb.conf:/etc/influxdb/influxdb.conf \
            influxdb:2.0
          echo "[🚀] Starting Telegraf container..."
          docker run -d --name telegraf \
            --link influxdb \
            -v $PWD/.monitoring/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf \
            telegraf:1.20

      - name: 🛠️ Generate Graphite & StatsD Configs
        run: |
          echo "[🛠️] Generating Graphite & StatsD Configs..."
          echo "[🛠️] Generating Graphite config..."
          cat << 'EOF' > .monitoring/graphite/storage-schemas.conf
[default]
pattern = .*
retentions = 60s:30d
EOF
          echo "[🛠️] Generating StatsD example script..."
          cat << 'EOF' > .monitoring/statsd/example_statsd.py
#!/usr/bin/env python3
import statsd
c = statsd.StatsClient('localhost', 8125)
c.gauge('example.metric', 42)
EOF
          echo "[✅] Graphite and StatsD configs created"

      - name: 🚀 Launch Graphite & StatsD
        run: |
          echo "[🚀] Launching Graphite & StatsD..."
          echo "[🚀] Starting Graphite+StatsD container..."
          docker run -d --name graphite-statsd \
            -p 80:80 -p 2003-2004:2003-2004/udp \
            -v $PWD/.monitoring/graphite/storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf \
            graphiteapp/graphite-statsd

      - name: 🛠️ Generate VictoriaMetrics Config
        run: |
          echo "[🛠️] Generating VictoriaMetrics Config..."
          echo "[🛠️] No config needed for single-node VictoriaMetrics"

      - name: 🚀 Launch VictoriaMetrics
        run: |
          echo "[🚀] Launching VictoriaMetrics..."
          echo "[🚀] Starting VictoriaMetrics container..."
          docker run -d --name victoriametrics \
            -p 8428:8428 \
            victoriametrics/victoria-metrics:latest

      - name: 🛠️ Generate OpenTelemetry Collector Config
        run: |
          echo "[🛠️] Generating OpenTelemetry Collector Config..."
          echo "[🛠️] Generating Otel Collector config..."
          cat << 'EOF' > .monitoring/otel/collector-config.yaml
receivers:
  otlp:
    protocols:
      grpc:
      http:
exporters:
  logging:
    logLevel: debug
service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [logging]
EOF
          echo "[✅] Otel Collector config created"

      - name: 🚀 Launch OpenTelemetry Collector
        run: |
          echo "[🚀] Launching OpenTelemetry Collector..."
          echo "[🚀] Starting Otel Collector container..."
          docker run -d --name otel-collector \
            -p 4317:4317 -p 55681:55681 \
            -v $PWD/.monitoring/otel/collector-config.yaml:/etc/otel/config.yaml \
            otel/opentelemetry-collector:latest \
            --config /etc/otel/config.yaml

      - name: 🛠️ Generate Zabbix & Nagios Configs
        run: |
          echo "[🛠️] Generating Zabbix & Nagios Configs..."
          echo "[🛠️] Generating Zabbix minimal config..."
          cat << 'EOF' > .monitoring/zabbix/zabbix_server.conf
LogFile=/var/log/zabbix/zabbix_server.log
DBHost=postgres
DBName=zabbix
DBUser=zabbix
DBPassword=zabbix
EOF
          echo "[🛠️] Generating Nagios sample host config..."
          cat << 'EOF' > .monitoring/nagios/hosts.cfg
define host {
  host_name localhost
  address 127.0.0.1
  use generic-host
}
EOF
          echo "[✅] Zabbix and Nagios configs created"

      - name: 🚀 Launch Zabbix & Nagios
        run: |
          echo "[🚀] Launching Zabbix & Nagios..."
          echo "[🚀] Starting Zabbix server container..."
          docker run -d --name zabbix-server \
            -p 10051:10051 \
            zabbix/zabbix-server-pgsql:latest
          echo "[🚀] Starting Nagios container..."
          docker run -d --name nagios \
            -p 8080:80 \
            jasonrivers/nagios:latest

      - name: 🛠️ Install Datadog Agent
        run: |
          echo "[🛠️] Installing Datadog Agent..."
          DD_API_KEY=YOUR_DATADOG_API_KEY bash -c "$(curl -L https://s3.amazonaws.com/dd-agent/scripts/install_script.sh)"
          echo "[✅] Datadog Agent installed"

      - name: 🛠️ Generate Elastic Stack Configs
        run: |
          echo "[🛠️] Generating Elastic Stack Configs..."
          echo "[🛠️] Generating Elasticsearch yml..."
          cat << 'EOF' > .monitoring/elastic/elasticsearch.yml
cluster.name: "monitoring"
network.host: 0.0.0.0
http.port: 9200
EOF
          echo "[🛠️] Generating Kibana yml..."
          cat << 'EOF' > .monitoring/elastic/kibana.yml
server.host: "0.0.0.0"
elasticsearch.hosts: ["http://elasticsearch:9200"]
EOF
          echo "[✅] Elastic configs created"

      - name: 🚀 Launch Elastic Stack
        run: |
          echo "[🚀] Launching Elastic Stack..."
          echo "[🚀] Starting Elasticsearch container..."
          docker run -d --name elasticsearch \
            -p 9200:9200 \
            -v $PWD/.monitoring/elastic/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml \
            docker.elastic.co/elasticsearch/elasticsearch:8.0.0
          echo "[🚀] Starting Kibana container..."
          docker run -d --name kibana \
            -p 5601:5601 \
            -v $PWD/.monitoring/elastic/kibana.yml:/usr/share/kibana/config/kibana.yml \
            docker.elastic.co/kibana/kibana:8.0.0

      - name: 🗄️ Generate SQL Init Script
        run: |
          echo "[🗄️] Generating SQL Init Script..."
          echo "[🗄️] Generating SQL init script..."
          cat << 'EOF' > .monitoring/sql/init_metrics.sql
CREATE DATABASE monitoring;
\c monitoring
CREATE TABLE metrics (
  id SERIAL PRIMARY KEY,
  service VARCHAR(50),
  metric VARCHAR(50),
  value DOUBLE PRECISION,
  ts TIMESTAMP DEFAULT now()
);
EOF
          echo "[✅] SQL init script created"

      - name: 🐍 Generate Python Monitoring Script
        run: |
          echo "[🐍] Generating Python Monitoring Script..."
          echo "[🐍] Generating Python monitoring script..."
          cat << 'EOF' > .monitoring/scripts/monitor.py
#!/usr/bin/env python3
import requests, time
services = ["http://localhost:8086/health", "http://localhost/"]
for url in services:
    r = requests.get(url)
    print(f"{url} -> {r.status_code}")
    time.sleep(1)
EOF
          echo "[✅] Python script created"

      - name: ✅ Complete Setup
        run: |
          echo "[✅] All monitoring services configured and launched!"
