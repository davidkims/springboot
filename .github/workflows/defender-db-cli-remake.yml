name: "⚙️ Maven + Spring Boot: Auto-Setup + Install/Upgrade + Echo Perm + Release (Full Echo Suite)"

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: "프로젝트가 위치한 디렉토리 (pom.xml 경로)"
        required: true
        default: "."
      auto_create_project:
        description: "pom.xml 없을 때 자동 생성 (true/false)"
        required: true
        default: "true"
      project_config:
        description: "groupId:artifactId:packageName"
        required: false
        default: "com.example:demo-app:com.example.demo"
      spring_boot_version:
        description: "Spring Boot 버전 (예: 3.3.3). 비우면 유지"
        required: false
        default: "3.3.3"
      maven_version:
        description: "Maven 버전 (예: 3.9.9). 비우면 기본 사용"
        required: false
        default: ""
      run_tests:
        description: "빌드 전 테스트 실행 (true/false)"
        required: true
        default: "true"
      create_release:
        description: "버전 bump+태그+Release 생성 (true/false)"
        required: true
        default: "true"
      bump_type:
        description: "버전 증가 유형 (patch|minor|major)"
        required: false
        default: "patch"
      build_docker:
        description: "Docker 이미지 빌드/푸시 (true/false)"
        required: true
        default: "false"
      image_name:
        description: "Docker 이미지 이름 (비우면 ghcr.io/<owner>/<repo>)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write
  actions: read

env:
  JAVA_VERSION: "21"
  ECHO_ROOT: .github/echo_java
  OUT_DIR: .github/echo_java/out
  LOG_DIR: .github/echo_java/logs
  PERM_DIR: .github/echo_java/permissions
  ARTIFACT_DIR: .github/echo_java/artifacts
  TOOLS_DIR: .github/echo_java/tools
  SCRIPTS_DIR: .github/echo_java/scripts
  DOC_DIR: .github/echo_java/docs

jobs:
  build_and_release:
    name: "Build & (Optional) Release"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # (0) Echo 스택 부트스트랩 + 설정 파싱
      - name: "Parse project configuration"
        id: parse_config
        run: |
          set -Eeuo pipefail
          IFS=':' read -r GROUP_ID ARTIFACT_ID PACKAGE_NAME <<< "${{ inputs.project_config }}"
          echo "group_id=${GROUP_ID:-com.example}"                 >> "$GITHUB_OUTPUT"
          echo "artifact_id=${ARTIFACT_ID:-demo-app}"               >> "$GITHUB_OUTPUT"
          echo "package_name=${PACKAGE_NAME:-com.example.demo}"     >> "$GITHUB_OUTPUT"

      - name: "Bootstrap Echo Suite (dirs + tools + scripts)"
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_ROOT" "$OUT_DIR" "$LOG_DIR" "$PERM_DIR" "$ARTIFACT_DIR" "$TOOLS_DIR" "$SCRIPTS_DIR" "$DOC_DIR"

          cat > "$TOOLS_DIR/echo.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeo pipefail
          log(){ printf "[ECHO][%s] %s\n" "$1" "$2"; }
          ok(){ log OK "$*"; } warn(){ log WARN "$*"; } fail(){ log FAIL "$*"; exit 1; }
          section(){ printf "\n=== %s ===\n" "$*"; }
          is_true(){ [[ "${1,,}" == "true" ]]; }
          SH
          chmod +x "$TOOLS_DIR/echo.sh"

          cat > "$SCRIPTS_DIR/apply_permissions.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          section "Apply permissions"
          find . -name "*.sh" -path "./.github/echo_java/*" -exec chmod 755 {} \; && ok "chmod +x done"
          SH
          chmod +x "$SCRIPTS_DIR/apply_permissions.sh"

          cat > "$SCRIPTS_DIR/collect_artifacts.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          section "Collect artifacts"
          mkdir -p "$ARTIFACT_DIR"
          find "${1:-target}" -type f \( -name "*.jar" -o -name "*.war" \) -not -name "original-*.jar" -print -exec cp -v {} "$ARTIFACT_DIR/" \;
          ok "Collected -> $ARTIFACT_DIR"
          SH
          chmod +x "$SCRIPTS_DIR/collect_artifacts.sh"

          cat > "$SCRIPTS_DIR/create_spring_boot_project.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          GROUP_ID="$1"; ARTIFACT_ID="$2"; PACKAGE_NAME="$3"; SBV="$4"; TARGET="${5:-.}"
          section "Create Spring Boot Project ($GROUP_ID:$ARTIFACT_ID)"
          mkdir -p "$TARGET/src/main/java" "$TARGET/src/test/java" "$TARGET/src/main/resources" "$TARGET/src/test/resources"
          # pom.xml
          cat > "$TARGET/pom.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <parent>
              <groupId>org.springframework.boot</groupId>
              <artifactId>spring-boot-starter-parent</artifactId>
              <version>${SBV:-3.3.3}</version>
            </parent>
            <groupId>${GROUP_ID}</groupId>
            <artifactId>${ARTIFACT_ID}</artifactId>
            <version>0.1.0-SNAPSHOT</version>
            <properties>
              <java.version>21</java.version>
            </properties>
            <dependencies>
              <dependency>
                <groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId>
              </dependency>
              <dependency>
                <groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-actuator</artifactId>
              </dependency>
              <dependency>
                <groupId>com.h2database</groupId><artifactId>h2</artifactId><scope>runtime</scope>
              </dependency>
              <dependency>
                <groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-test</artifactId><scope>test</scope>
              </dependency>
            </dependencies>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.springframework.boot</groupId><artifactId>spring-boot-maven-plugin</artifactId>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF
          # DemoApplication
          PKG_DIR="$TARGET/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')"
          mkdir -p "$PKG_DIR"
          cat > "$PKG_DIR/DemoApplication.java" <<EOF
          package ${PACKAGE_NAME};
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RestController;
          @SpringBootApplication
          public class DemoApplication {
            @RestController static class Api {
              @GetMapping("/") public String hello() { return "Hello Echo!"; }
            }
            public static void main(String[] args){ SpringApplication.run(DemoApplication.class, args); }
          }
          EOF
          ok "Project created at $TARGET"
          SH
          chmod +x "$SCRIPTS_DIR/create_spring_boot_project.sh"

      - name: "Auto-create project if missing"
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          cd "${{ inputs.project_dir }}"
          if [ ! -f "pom.xml" ]; then
            is_true "${{ inputs.auto_create_project }}" || fail "pom.xml 없음 & auto_create_project=false"
            "${GITHUB_WORKSPACE}/${SCRIPTS_DIR}/create_spring_boot_project.sh" \
              "${{ steps.parse_config.outputs.group_id }}" \
              "${{ steps.parse_config.outputs.artifact_id }}" \
              "${{ steps.parse_config.outputs.package_name }}" \
              "${{ inputs.spring_boot_version }}" "."
            ok "Auto project created"
          else
            ok "pom.xml exists"
          fi

      # (1) JDK + Maven 캐시
      - name: "Set up Java (with Maven cache)"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            ${{ inputs.project_dir }}/pom.xml
            ${{ inputs.project_dir }}/**/pom.xml
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          overwrite-settings: true

      - name: "Install requested Maven (optional)"
        id: setup_maven
        run: |
          set -Eeuo pipefail
          MAV_VER="${{ inputs.maven_version }}"
          if [ -n "$MAV_VER" ]; then
            echo "[ECHO][INFO] Installing Maven $MAV_VER ..."
            BASE="$HOME/.local/apache-maven-$MAV_VER"
            if [ ! -d "$BASE" ]; then
              curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAV_VER}/binaries/apache-maven-${MAV_VER}-bin.tar.gz" -o /tmp/mvn.tgz
              mkdir -p "$HOME/.local"
              tar -xzf /tmp/mvn.tgz -C "$HOME/.local"
            fi
            echo "$HOME/.local/apache-maven-${MAV_VER}/bin" >> "$GITHUB_PATH"
            mvn -v
          else
            echo "[ECHO][INFO] Using default Maven"
            mvn -v
          fi

      - name: "Generate Maven Wrapper (if missing)"
        run: |
          set -Eeuo pipefail
          cd "${{ inputs.project_dir }}"
          [ -f mvnw ] || mvn -N -q wrapper:wrapper
          chmod +x mvnw || true

      - name: "Apply Echo permissions"
        run: |
          set -Eeuo pipefail
          "${GITHUB_WORKSPACE}/${SCRIPTS_DIR}/apply_permissions.sh"

      - name: "Pin / Upgrade Spring Boot version (if provided)"
        run: |
          set -Eeuo pipefail
          cd "${{ inputs.project_dir }}"
          SBV="${{ inputs.spring_boot_version }}"
          if [ -n "$SBV" ]; then
            if grep -q "<spring-boot.version>" pom.xml; then
              ./mvnw -q -DgenerateBackupPoms=false versions:set-property -Dproperty=spring-boot.version -DnewVersion="${SBV}"
            else
              sed -i "0,/<parent>/ s|<version>.*</version>|<version>${SBV}</version>|" pom.xml
            fi
            echo "[ECHO][OK] Spring Boot -> $SBV"
          else
            echo "[ECHO][OK] Keep current Spring Boot version"
          fi

      # (2) 빌드 + 아티팩트 수집 + 업로드(항상)
      - name: "Resolve & Build (tests optional)"
        id: build
        run: |
          set -Eeuo pipefail
          cd "${{ inputs.project_dir }}"
          if [[ "${{ inputs.run_tests }}" == "true" ]]; then
            ./mvnw -q -e -B clean verify
          else
            ./mvnw -q -e -B -DskipTests clean package
          fi
          "${GITHUB_WORKSPACE}/${SCRIPTS_DIR}/collect_artifacts.sh" "target"

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: ${{ env.ARTIFACT_DIR }}/*
          if-no-files-found: warn
          retention-days: 7

      # (3) Release (옵션)
      - name: "Compute next version & tag (if release)"
        if: ${{ inputs.create_release == 'true' }}
        id: rel
        run: |
          set -Eeuo pipefail
          cd "${{ inputs.project_dir }}"
          CURR="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          BASE="${CURR%-SNAPSHOT}"
          IFS='.' read -r MA MI PA <<< "${BASE:-0.1.0}"
          case "${{ inputs.bump_type }}" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            *)     PA=$((PA+1)) ;;
          esac
          NEXT="${MA}.${MI}.${PA}"
          ./mvnw -q -DgenerateBackupPoms=false versions:set -DnewVersion="${NEXT}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${NEXT} [skip ci]"
          fi
          git tag "v${NEXT}" || true
          git push --follow-tags
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: "Create GitHub Release"
        if: ${{ inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.next }}
          name: v${{ steps.rel.outputs.next }}
          files: ${{ env.ARTIFACT_DIR }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # (4) Docker (옵션): Dockerfile/.dockerignore 보장 + 이미지 이름 계산 + 빌드/푸시
      - name: "Ensure Dockerfile & .dockerignore (if missing)"
        if: ${{ inputs.build_docker == 'true' }}
        run: |
          set -Eeuo pipefail
          cd "${{ inputs.project_dir }}"
          if [ ! -f Dockerfile ]; then
            cat > Dockerfile <<'DOCKER'
            FROM eclipse-temurin:21-jre
            ARG JAR_FILE=target/app.jar
            WORKDIR /app
            COPY ${JAR_FILE} /app/app.jar
            EXPOSE 8080
            ENTRYPOINT ["java","-jar","/app/app.jar"]
            DOCKER
          fi
          if [ ! -f .dockerignore ]; then
            cat > .dockerignore <<'IGN'
            target/
            .git/
            .github/
            .idea/
            .vscode/
            IGN
          fi

      - name: "Resolve image name"
        id: img
        if: ${{ inputs.build_docker == 'true' }}
        run: |
          set -Eeuo pipefail
          if [ -n "${{ inputs.image_name }}" ]; then
            IMG="${{ inputs.image_name }}"
          else
            OWNER="${{ github.repository_owner }}"
            REPO="${GITHUB_REPOSITORY#*/}"
            IMG="ghcr.io/${OWNER}/${REPO}"
          fi
          IMG_LOWER="$(echo "$IMG" | tr '[:upper:]' '[:lower:]')"
          echo "value=${IMG_LOWER}" >> "$GITHUB_OUTPUT"
          echo "[ECHO][OK] Image = ${IMG_LOWER}"

      - name: "Login to GHCR"
        if: ${{ inputs.build_docker == 'true' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: "Compute JAR file for Docker build"
        id: jar
        if: ${{ inputs.build_docker == 'true' }}
        run: |
          set -Eeuo pipefail
          cd "${{ inputs.project_dir }}"
          JAR="$(ls target/*.jar 2>/dev/null | grep -v 'original-' | head -n 1 || true)"
          if [ -z "$JAR" ]; then
            echo "[ECHO][FAIL] No JAR found in target/"; exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "[ECHO][OK] JAR = $JAR"

      - name: "Build & Push Docker"
        if: ${{ inputs.build_docker == 'true' }}
        run: |
          set -Eeuo pipefail
          cd "${{ inputs.project_dir }}"
          IMG="${{ steps.img.outputs.value }}"
          TAG="$([ "${{ inputs.create_release }}" = "true" ] && echo "${{ steps.rel.outputs.next }}" || echo "dev")"
          docker build --build-arg JAR_FILE="${{ steps.jar.outputs.path }}" -t "${IMG}:${TAG}" .
          docker push "${IMG}:${TAG}"

      # (5) Echo 산출물 커밋
      - name: "Commit Echo outputs (if changed)"
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[ECHO] Update Echo Suite & project artifacts"
            git push
            echo "[ECHO][OK] Changes committed"
          else
            echo "[ECHO][OK] No changes to commit"
          fi
