name: 🏆 Echo-Driven MySQL+Oracle FullOps (대량 컨테이너/계정/DDL/교차DB)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  fullops:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass123
          MYSQL_DATABASE: sample_db
        ports:
          - 3306:3306

    env:
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass123
      MYSQL_DB: sample_db
      ORACLE_PWD: oraclepwd123
      ECHO_BATCH: 10
      MASS_USER: 8
      MASS_TABLE: 6
      MASS_TXN: 20

    steps:
      - name: 📦 [echo] Checkout
        uses: actions/checkout@v4

      - name: 🏗️ 대량 echo 디렉토리+에코 컨테이너 파일 선제 생성
        run: |
          # echo 디렉토리(컨테이너/DB별/시나리오별)
          for d in \
            .github/logs .github/error_logs .github/echo .github/echo/tmp .github/echo/logs \
            .github/echo/mysql .github/echo/mysql/logs .github/echo/mysql/ddl .github/echo/mysql/txn \
            .github/echo/mysql/replica .github/echo/mysql/user .github/echo/mysql/policy \
            .github/echo/mysql/container .github/echo/mysql/crossdb .github/echo/mysql/backup \
            .github/echo/oracle .github/echo/oracle/container .github/echo/oracle/logs \
            .github/echo/oracle/ddl .github/echo/oracle/txn .github/echo/oracle/replica \
            .github/echo/oracle/user .github/echo/oracle/policy .github/echo/oracle/crossdb \
            .github/echo/priv .github/echo/query .github/echo/client .github/echo/artifact \
            .github/echo/policy .github/echo/sec .github/echo/audit .github/echo/job \
            .github/echo/monitor .github/echo/bulk .github/echo/etl .github/echo/readonly; do
            echo "echo 'mkdir -p $d'"; mkdir -p $d
          done

          # 대량 컨테이너 echo 파일 생성
          for i in {1..${ECHO_BATCH}}; do
            echo "docker run --name echo-mysql-$i ... " > .github/echo/mysql/container/mysql_container_$i.sh
            echo "docker run --name echo-oracle-$i ... " > .github/echo/oracle/container/oracle_container_$i.sh
          done

      - name: 🏦 MySQL/Oracle 대량 DDL/계정/트랜잭션/교차DB 에코/실행
        run: |
          # MySQL 대량 테이블/DDL/계정/트랜잭션 echo 생성+실행
          for i in $(seq 1 $MASS_TABLE); do
            TBL="demo_table_$i"
            echo "CREATE TABLE IF NOT EXISTS $TBL (id INT PRIMARY KEY AUTO_INCREMENT, value VARCHAR(100));" > .github/echo/mysql/ddl/$TBL.sql
            MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER -D$MYSQL_DB < .github/echo/mysql/ddl/$TBL.sql 2>&1 | tee -a .github/echo/mysql/logs/ddl_exec.log || true
          done

          for i in $(seq 1 $MASS_USER); do
            U="user_$i"
            PW="pw_$i"
            echo "CREATE USER IF NOT EXISTS '$U'@'%' IDENTIFIED BY '$PW'; GRANT ALL ON $MYSQL_DB.* TO '$U'@'%';" > .github/echo/mysql/user/$U.sql
            MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER < .github/echo/mysql/user/$U.sql 2>&1 | tee -a .github/echo/mysql/logs/user_exec.log || true
          done

          for i in $(seq 1 $MASS_TXN); do
            TBL="demo_table_$((i % $MASS_TABLE + 1))"
            echo "INSERT INTO $TBL (value) VALUES ('value_$i');" >> .github/echo/mysql/txn/txn_batch.sql
          done
          MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER -D$MYSQL_DB < .github/echo/mysql/txn/txn_batch.sql 2>&1 | tee -a .github/echo/mysql/logs/txn_exec.log || true

          # Oracle 대량 echo DDL/계정/트랜잭션(DDL 파일 생성 위주, 실행은 실제 인스턴스에서)
          for i in $(seq 1 $MASS_TABLE); do
            echo "CREATE TABLE DEMO_TABLE_$i (ID NUMBER PRIMARY KEY, VALUE VARCHAR2(100));" > .github/echo/oracle/ddl/demo_table_$i.sql
          done
          for i in $(seq 1 $MASS_USER); do
            echo "CREATE USER USER_$i IDENTIFIED BY pw_$i; GRANT CONNECT, RESOURCE TO USER_$i;" > .github/echo/oracle/user/user_$i.sql
          done
          for i in $(seq 1 $MASS_TXN); do
            echo "INSERT INTO DEMO_TABLE_$((i % MASS_TABLE + 1)) (ID, VALUE) VALUES ($i, 'val_$i');" >> .github/echo/oracle/txn/txn_batch.sql
          done

          # 교차DB(에코): MySQL→Oracle, Oracle→MySQL 쿼리 예시
          echo "SELECT COUNT(*) FROM demo_table_1;" > .github/echo/mysql/crossdb/select_count_from_oracle.sql
          echo "SELECT COUNT(*) FROM DEMO_TABLE_1;" > .github/echo/oracle/crossdb/select_count_from_mysql.sql

          # 복제 정책, 동기화, 샘플 정책 echo (로직 예시)
          echo "-- MySQL→Oracle 복제(논리): mysqldump | SQL*Loader" > .github/echo/policy/mysql_to_oracle_replication_policy.txt
          echo "-- Oracle→MySQL 복제(논리): expdp/impdp | csv→LOAD DATA" > .github/echo/policy/oracle_to_mysql_replication_policy.txt
          echo "-- 교차DB 트랜잭션 정책 예: SAGA/2PC/동기화" > .github/echo/policy/crossdb_txn_policy.txt

          # 시나리오 에코 예시
          echo "시나리오: 대량 계정 생성/삭제, 대량 트랜잭션, DDL, 교차 쿼리, DB 복제, 정책 자동화 등" > .github/echo/scenario.txt

      - name: 🗄️ DB 상태/정책/감사/모니터 echo
        run: |
          # MySQL 현재 계정/권한 에코
          MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER -e "SELECT user,host,plugin FROM mysql.user;" > .github/echo/mysql/user/mysql_accounts_current.txt || true
          # 정책/감사/모니터
          echo "[정책] 비밀번호 복잡도, 만료 정책, 접속제한, 이중화 등" > .github/echo/policy/policy_examples.txt
          echo "[감사] 모든 DDL/DML 로그 추출, Access/Grant 변경 감사" > .github/echo/audit/audit_log_policy.txt
          echo "[모니터] 컨테이너 상태/쿼리 실행시간/접속수 모니터링 정책" > .github/echo/monitor/monitor_policy.txt

      - name: ⬆️ 결과 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: echo-db-fullops-${{ github.run_id }}
          path: |
            .github/echo/**/*
            .github/logs/*
            .github/error_logs/*
