# NTUSER.DAT 백업 & 복원 자동화 스크립트 (GitHub 기반)
# GitHub에서 백업/복원 도구를 다운로드하고, 필요한 프로그램 설치 및 기능 제공

$UserName = $env:USERNAME
$UserDir = "C:\Users\$UserName"
$NTUserFile = "$UserDir\NTUSER.DAT"
$BackupDir = "$UserDir\ProfileBackups"
$Now = Get-Date -Format "yyyyMMddHHmm"
$BackupFile = "$BackupDir\NTUSER.DAT.$Now.bak"
$GitRepo = "https://raw.githubusercontent.com/davidkims/ntuser-tools/main"

# 1. NTUSER.DAT 존재 확인 및 백업
if (!(Test-Path $NTUserFile)) {
    Write-Host "[\u274c] NTUSER.DAT 파일이 존재하지 않습니다: $NTUserFile" -ForegroundColor Red
    exit 1
}

if (!(Test-Path $BackupDir)) {
    New-Item -ItemType Directory -Path $BackupDir -Force | Out-Null
}

Copy-Item $NTUserFile $BackupFile -Force
Write-Host "[\ud83d\udcc1] 백업 저장됨: $BackupFile" -ForegroundColor Green

# 2. GitHub에서 복구 도구 다운로드
$ScriptList = @(
    "ntuser_restore.ps1",
    "ntuser_zip.ps1",
    "install_7zip.ps1"
)

foreach ($script in $ScriptList) {
    $url = "$GitRepo/$script"
    $dest = "$BackupDir\$script"
    Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
    Write-Host "[\u2b07] 다운로드 완료: $script" -ForegroundColor Cyan
}

# 3. 7-Zip 설치 확인 및 필요 시 자동 설치
$sevenZipPath = "${env:ProgramFiles}\7-Zip\7z.exe"
if (!(Test-Path $sevenZipPath)) {
    Write-Host "[\u26a0] 7-Zip 미설치 상태. 설치 중..." -ForegroundColor Yellow
    $installer = "$env:TEMP\7z.exe"
    Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z2301-x64.exe" -OutFile $installer
    Start-Process $installer -ArgumentList "/S" -Wait
    Write-Host "[\u2714] 7-Zip 설치 완료" -ForegroundColor Green
}

# 4. 완료 안내
Write-Host "`n[\u2705] 모든 작업 완료!" -ForegroundColor Cyan
Write-Host "- 복원: $BackupDir\ntuser_restore.ps1"
Write-Host "- 압축: $BackupDir\ntuser_zip.ps1"
Write-Host "- 복원 대상 지정: NTUSER.DAT.RESTORE 파일 생성 필요"
