name: 🔒 Integrated Blacklist Generator

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      enable_codeql:
        description: "Run CodeQL (heavy)."
        type: choice
        options: [ "false", "true" ]
        default: "false"

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

env:
  BLACKLIST_DIR: .github/blacklist
  ENABLE_SPAMHAUS: "true"
  ENABLE_EMERGING_THREATS: "true"
  ENABLE_ABUSEIPDB: "auto"
  ENABLE_OTX: "auto"
  ENABLE_PY_AUDIT: "auto"
  ENABLE_NPM_AUDIT: "auto"
  ENABLE_OWASP_DC: "true"   # ← CLI 버전 사용
  ENABLE_SEMGREP: "true"
  ENABLE_HIBP: "auto"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 Prepare dirs
        run: |
          set -euo pipefail
          mkdir -p "$BLACKLIST_DIR"/{raw,dist,logs}
          date -u +"version: %Y.%m.%dT%H:%M:%SZ" > "$BLACKLIST_DIR/version.txt"
          echo "[ECHO] 디렉토리 준비 완료"

      - name: 🧰 Setup Python & Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: ⬆️ Upgrade tooling
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -U pip-audit safety jq yq
          npm i -g npm@latest
          echo "[ECHO] 최신 도구 설치 완료"

      # -------------------------
      # 1) 네트워크/IP/도메인 블랙리스트
      # -------------------------
      - name: 🌐 Spamhaus
        if: env.ENABLE_SPAMHAUS == 'true'
        run: |
          set -euo pipefail
          echo "[ECHO] Spamhaus 수집"
          curl -fsSL https://www.spamhaus.org/drop/drop.txt  | grep -v '^;' > "$BLACKLIST_DIR/raw/spamhaus_drop.txt"
          curl -fsSL https://www.spamhaus.org/drop/edrop.txt | grep -v '^;' > "$BLACKLIST_DIR/raw/spamhaus_edrop.txt"
          cat "$BLACKLIST_DIR/raw/"spamhaus_*.txt | sort -u > "$BLACKLIST_DIR/dist/ip_blacklist_spamhaus.txt"
          wc -l "$BLACKLIST_DIR/dist/ip_blacklist_spamhaus.txt" | awk '{print "[ECHO] Spamhaus IP:", $1}'

      - name: ⚠️ Emerging Threats
        if: env.ENABLE_EMERGING_THREATS == 'true'
        run: |
          set -euo pipefail
          echo "[ECHO] Emerging Threats 수집"
          curl -fsSL https://rules.emergingthreats.net/blockrules/compromised-ips.txt > "$BLACKLIST_DIR/raw/et_ips.txt" || true
          (cat "$BLACKLIST_DIR/raw/et_ips.txt" 2>/dev/null || true) | grep -E '^[0-9]+' | sort -u > "$BLACKLIST_DIR/dist/ip_blacklist_et.txt" || true
          if [ -s "$BLACKLIST_DIR/dist/ip_blacklist_et.txt" ]; then
            wc -l "$BLACKLIST_DIR/dist/ip_blacklist_et.txt" | awk '{print "[ECHO] ET IP:", $1}'
          fi

      # -------------------------
      # 2) 패키지 블랙리스트
      # -------------------------
      - name: 🐍 pip-audit
        if: env.ENABLE_PY_AUDIT == 'true' || env.ENABLE_PY_AUDIT == 'auto'
        run: |
          set -euo pipefail
          if ls requirements*.txt Pipfile.lock poetry.lock 2>/dev/null | grep -q .; then
            echo "[ECHO] pip-audit 실행"
            pip-audit -f json -o "$BLACKLIST_DIR/dist/pip_audit.json" || true
          else
            echo "[ECHO] Python 종속성 없음"
          fi

      - name: 🛡️ safety (수정 버전)
        if: env.ENABLE_PY_AUDIT == 'true' || env.ENABLE_PY_AUDIT == 'auto'
        run: |
          set -euo pipefail
          if python -c "import pkgutil; exit(0 if pkgutil.find_loader('safety') else 1)"; then
            safety check --full-report --output json | tee "$BLACKLIST_DIR/dist/package_blacklist_safety.json" >/dev/null
            echo "[ECHO] safety 실행 완료"
          fi

      - name: 📦 npm audit
        if: env.ENABLE_NPM_AUDIT == 'true' || env.ENABLE_NPM_AUDIT == 'auto'
        run: |
          set -euo pipefail
          if ls package-lock.json yarn.lock pnpm-lock.yaml 2>/dev/null | grep -q .; then
            npm audit --json > "$BLACKLIST_DIR/dist/npm_audit.json" || true
          fi

      # -------------------------
      # 3) OWASP Dependency-Check (CLI 버전)
      # -------------------------
      - name: 🛠 Install OWASP Dependency-Check CLI
        if: env.ENABLE_OWASP_DC == 'true'
        run: |
          set -euo pipefail
          VERSION="9.2.0"
          echo "[ECHO] Installing Dependency-Check CLI v$VERSION"
          curl -sLO https://github.com/jeremylong/DependencyCheck/releases/download/v${VERSION}/dependency-check-${VERSION}-release.zip
          unzip dependency-check-${VERSION}-release.zip -d /opt/dependency-check
          chmod +x /opt/dependency-check/bin/dependency-check.sh

      - name: 🧪 Run Dependency-Check CLI
        if: env.ENABLE_OWASP_DC == 'true'
        run: |
          set -euo pipefail
          /opt/dependency-check/bin/dependency-check.sh \
            --project "BlacklistScan" \
            --scan . \
            --format JSON \
            --out "$BLACKLIST_DIR/dist"
          echo "[ECHO] Dependency-Check 실행 완료"

      # -------------------------
      # 4) 코드 패턴 블랙리스트
      # -------------------------
      - name: 🔎 Semgrep
        if: env.ENABLE_SEMGREP == 'true'
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci
          generateSarif: true
          output: ${{ env.BLACKLIST_DIR }}/dist/semgrep.sarif

      # -------------------------
      # 5) 변경점 / PR
      # -------------------------
      - name: 🧾 Build changelog
        run: |
          set -euo pipefail
          echo "### Blacklist Update $(date -u +"%Y-%m-%dT%H:%M:%SZ")" > "$BLACKLIST_DIR/CHANGELOG.md"
          git status --porcelain "$BLACKLIST_DIR" | awk '{print "- " $0}' >> "$BLACKLIST_DIR/CHANGELOG.md"

      - name: 📦 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blacklist-files
          path: .github/blacklist/

      - name: 🔀 Create PR if changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(security): update blacklists"
          title: "chore(security): update blacklists"
          body: |
            자동 생성된 블랙리스트 업데이트입니다.
            - 실행: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          branch: chore/update-blacklists
          delete-branch: true
          add-paths: |
            .github/blacklist/**
