name: 🐬 Full MySQL Workflow with Secure Password Handling

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  mysql-job:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass123
          MYSQL_DATABASE: sample_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass123
      MYSQL_DB: sample_db

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Prepare Directories
        run: |
          echo "[+] Creating directories..."
          mkdir -p sql export .github/queries backup

      - name: 🧼 Wait for MySQL Health or Restart
        run: |
          CID=$(docker ps -q --filter "ancestor=mysql:8.0")
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $CID)
            echo "[..] MySQL status: $STATUS (attempt $i)"
            if echo "$STATUS" | grep -q "healthy"; then
              echo "[✔] MySQL is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "[!] Restarting MySQL container..."
          docker logs $CID
          docker restart $CID
          sleep 10

      - name: 📄 Generate init.sql and Backup
        run: |
          echo "[+] Generating init.sql..."
          echo "USE sample_db;" > sql/init.sql
          echo "CREATE TABLE IF NOT EXISTS users (" >> sql/init.sql
          echo "  id INT AUTO_INCREMENT PRIMARY KEY," >> sql/init.sql
          echo "  name VARCHAR(100) NOT NULL" >> sql/init.sql
          echo ");" >> sql/init.sql
          echo "INSERT INTO users (name) VALUES ('Alice'), ('Bob'), ('Charlie');" >> sql/init.sql
          echo "" >> sql/init.sql
          echo "CREATE TABLE IF NOT EXISTS customers (" >> sql/init.sql
          echo "  customer_id INT AUTO_INCREMENT PRIMARY KEY," >> sql/init.sql
          echo "  customer_name VARCHAR(100) NOT NULL," >> sql/init.sql
          echo "  registered_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP" >> sql/init.sql
          echo ");" >> sql/init.sql
          echo "INSERT INTO customers (customer_name) VALUES ('Alice'), ('김철수'), ('김민지'), ('David');" >> sql/init.sql
          cp sql/init.sql backup/init.sql.backup

      - name: 📄 Generate credit_card_transactions.sql and Query
        run: |
          echo "[+] Generating credit_card_transactions.sql..."
          echo "USE sample_db;" > sql/credit_card_transactions.sql

          echo "CREATE TABLE IF NOT EXISTS credit_card_transactions (" >> sql/credit_card_transactions.sql
          echo "  transaction_id INT AUTO_INCREMENT PRIMARY KEY," >> sql/credit_card_transactions.sql
          echo "  customer_id INT NOT NULL," >> sql/credit_card_transactions.sql
          echo "  card_number VARCHAR(20) NOT NULL," >> sql/credit_card_transactions.sql
          echo "  amount DECIMAL(10,2) NOT NULL," >> sql/credit_card_transactions.sql
          echo "  transaction_time DATETIME DEFAULT CURRENT_TIMESTAMP," >> sql/credit_card_transactions.sql
          echo "  FOREIGN KEY (customer_id) REFERENCES customers(customer_id)" >> sql/credit_card_transactions.sql
          echo ");" >> sql/credit_card_transactions.sql

          echo "INSERT INTO credit_card_transactions (customer_id, card_number, amount) VALUES" >> sql/credit_card_transactions.sql
          echo "(1, '4111111111111111', 12000.50)," >> sql/credit_card_transactions.sql
          echo "(2, '5500000000000004', 8300.75)," >> sql/credit_card_transactions.sql
          echo "(3, '340000000000009', 42000.00)," >> sql/credit_card_transactions.sql
          echo "(1, '4111111111111111', 5500.00);" >> sql/credit_card_transactions.sql

          echo "[+] Generating credit_card queries..."
          echo "SELECT * FROM credit_card_transactions;" > .github/queries/credit_all.sql
          echo "SELECT customer_id, SUM(amount) AS total_amount FROM credit_card_transactions GROUP BY customer_id;" > .github/queries/credit_sum_by_customer.sql
          echo "SELECT card_number, COUNT(*) AS txn_count FROM credit_card_transactions GROUP BY card_number;" > .github/queries/credit_count_by_card.sql

      - name: ⚙️ Run Migration with Retry
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER < sql/init.sql
          MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER < sql/credit_card_transactions.sql

      - name: 🔄 Restart MySQL Container
        run: |
          CID=$(docker ps -q --filter "ancestor=mysql:8.0")
          docker restart $CID
          sleep 5

      - name: 🧹 Remove Old Queries
        run: |
          rm -f .github/queries/*.log

      - name: ▶️ Run Queries and Save Logs
        run: |
          for file in .github/queries/*.sql; do
            out=${file/.sql/.log}
            MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER -D $MYSQL_DB < "$file" > "$out"
          done

      - name: 📄 Export CSVs (Various Conditions)
        run: |
          echo "customer_name" > export/customers_like_kim.csv
          MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER -D $MYSQL_DB -B -e \
            "SELECT customer_name FROM customers WHERE customer_name LIKE '%김%';" \
            | tail -n +2 >> export/customers_like_kim.csv

          echo "customer_name,registered_at" > export/customers_latest_3.csv
          MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER -D $MYSQL_DB -B -e \
            "SELECT customer_name, registered_at FROM customers ORDER BY registered_at DESC LIMIT 3;" \
            | tail -n +2 >> export/customers_latest_3.csv

          echo "customer_id,customer_name,registered_at" > export/customers_all_sorted.csv
          MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER -D $MYSQL_DB -B -e \
            "SELECT customer_id, customer_name, registered_at FROM customers ORDER BY customer_name;" \
            | tail -n +2 >> export/customers_all_sorted.csv

      - name: 📂 Backup .env, .yml, .sql
        run: |
          TIMESTAMP=$(date '+%Y%m%d_%H%M%S')
          BACKUP_DIR=backup/config_backup_$TIMESTAMP
          mkdir -p $BACKUP_DIR
          echo "MYSQL_HOST=127.0.0.1" > .env
          echo "MYSQL_USER=$MYSQL_USER" >> .env
          echo "MYSQL_PASSWORD=$MYSQL_PASSWORD" >> .env
          echo "MYSQL_DATABASE=$MYSQL_DB" >> .env
          cp .env $BACKUP_DIR/.env
          find .github/workflows -name "*.yml" -exec cp {} $BACKUP_DIR/ \;
          find sql -name "*.sql" -exec cp {} $BACKUP_DIR/ \;

      - name: 📁 Upload All CSVs
        uses: actions/upload-artifact@v4
        with:
          name: all-customer-csvs
          path: export/*.csv

      - name: 📁 Upload Queries and Logs
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-customer-queries-and-logs
          path: .github/queries

      - name: 📁 Upload Full Config Backup
        uses: actions/upload-artifact@v4
        with:
          name: full-env-yml-sql-backup
          path: backup/config_backup_*
