name: 🐬 MySQL Full Setup, Migration & Auto Backup

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  mysql_full_pipeline:
    runs-on: ubuntu-latest

    env:
      MYSQL_IMAGE: mysql:8.0
      DB_NAME: example_db
      DB_USER: root
      DB_PASS: rootpass123
      ROOT_PASS: rootpass123
      MIGRATION_DIR: /opt/mysql/migrations
      BACKUP_DIR: /opt/backup/sql
      LEDGER_DIR: /opt/backup/ledgers

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Prepare Directories
        run: |
          echo "[+] Creating directories..."
          sudo mkdir -p "$MIGRATION_DIR" "$BACKUP_DIR" "$LEDGER_DIR"
          echo "[+] Setting permissions..."
          sudo chmod -R 777 /opt/mysql /opt/backup

      - name: 🧾 Generate SQL Migration File
        run: |
          echo "[+] Creating SQL migration file..."
          echo "
          CREATE TABLE IF NOT EXISTS accounts (
              id INT AUTO_INCREMENT PRIMARY KEY,
              name VARCHAR(50),
              balance DECIMAL(12,2)
          );
          CREATE TABLE IF NOT EXISTS corporate_transactions (
              transaction_id INT AUTO_INCREMENT PRIMARY KEY,
              corporate_name VARCHAR(100) NOT NULL,
              transaction_type VARCHAR(50) NOT NULL,
              amount DECIMAL(12,2) NOT NULL,
              transaction_date DATETIME DEFAULT CURRENT_TIMESTAMP
          );
          " | sudo tee "$MIGRATION_DIR/migrate.sql"

      - name: 🧪 Install MySQL Server
        run: |
          echo "[+] Installing MySQL server..."
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server || { echo "❌ MySQL installation failed"; exit 1; }

      - name: 🔐 Reset Root Password and Safe Mode
        run: |
          echo "[+] Resetting root password in safe mode..."
          sudo systemctl stop mysql
          sudo mkdir -p /var/run/mysqld
          sudo chown mysql:mysql /var/run/mysqld
          sudo mysqld_safe --skip-networking --skip-grant-tables &
          sleep 10
          echo "FLUSH PRIVILEGES; ALTER USER 'root'@'localhost' IDENTIFIED BY '${{ env.ROOT_PASS }}'; FLUSH PRIVILEGES;" | sudo mysql -u root
          sudo killall mysqld
          sleep 5
          sudo systemctl start mysql || { echo "❌ MySQL start failed"; exit 1; }

      - name: 🛠️ Create Database and User
        run: |
          echo "[+] Creating database and user..."
          mysql -u root -p"${{ env.ROOT_PASS }}" -e "CREATE DATABASE IF NOT EXISTS ${{ env.DB_NAME }};"
          mysql -u root -p"${{ env.ROOT_PASS }}" -e "CREATE USER IF NOT EXISTS '${{ env.DB_USER }}'@'localhost' IDENTIFIED BY '${{ env.DB_PASS }}';"
          mysql -u root -p"${{ env.ROOT_PASS }}" -e "GRANT ALL PRIVILEGES ON ${{ env.DB_NAME }}.* TO '${{ env.DB_USER }}'@'localhost';"
          mysql -u root -p"${{ env.ROOT_PASS }}" -e "FLUSH PRIVILEGES;"

      - name: 📥 Run Migration
        run: |
          echo "[+] Running migration..."
          mysql -u "${{ env.DB_USER }}" -p"${{ env.DB_PASS }}" "${{ env.DB_NAME }}" < "$MIGRATION_DIR/migrate.sql" || { echo "❌ Migration failed"; exit 1; }

      - name: 💹 Simulate High Volume Transactions
        run: |
          echo "[+] Simulating bulk transactions..."
          mysql -u "${{ env.DB_USER }}" -p"${{ env.DB_PASS }}" "${{ env.DB_NAME }}" -e "DELETE FROM corporate_transactions;"
          for i in $(seq 1 50); do
            COMPANY="Corp_$i"
            TYPE=$(if [ $((RANDOM%2)) -eq 0 ]; then echo 'Purchase'; else echo 'Sale'; fi)
            AMOUNT=$(( (RANDOM % 900000) + 10000 ))
            echo "INSERT INTO corporate_transactions (corporate_name, transaction_type, amount) VALUES ('$COMPANY', '$TYPE', $AMOUNT);"
          done | mysql -u "${{ env.DB_USER }}" -p"${{ env.DB_PASS }}" "${{ env.DB_NAME }}"

      - name: 🧾 Generate Transaction Ledger CSV
        run: |
          echo "[+] Generating transaction ledger CSV..."
          LEDGER_FILE="${LEDGER_DIR}/corporate_ledger.csv"
          echo "transaction_id,corporate_name,transaction_type,amount,transaction_date" > "$LEDGER_FILE"
          mysql -u "${{ env.DB_USER }}" -p"${{ env.DB_PASS }}" -D "${{ env.DB_NAME }}" -B -e "SELECT transaction_id, corporate_name, transaction_type, amount, transaction_date FROM corporate_transactions ORDER BY transaction_id;" | tail -n +2 >> "$LEDGER_FILE"
          echo "[+] Ledger saved: $LEDGER_FILE"

      - name: 🕒 Generate Timestamp and Port
        id: vars
        run: |
          echo "[+] Generating timestamp and port..."
          echo "timestamp=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "container=backup-mysql-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "host_port=$((RANDOM%1000+3307))" >> "$GITHUB_OUTPUT"

      - name: 🐳 Launch MySQL Backup Container
        run: |
          echo "[+] Launching backup container..."
          docker run -d \
            --name "${{ steps.vars.outputs.container }}" \
            -e MYSQL_ROOT_PASSWORD="${{ env.DB_PASS }}" \
            -e MYSQL_DATABASE="${{ env.DB_NAME }}" \
            -p "${{ steps.vars.outputs.host_port }}:3306" \
            "${{ env.MYSQL_IMAGE }}"
          sleep 30 || { echo "❌ Backup container failed to start"; exit 1; }

      - name: 🔐 Create .my.cnf File
        run: |
          echo "[+] Creating .my.cnf..."
          echo "[client]" > ~/.my.cnf
          echo "user=${{ env.DB_USER }}" >> ~/.my.cnf
          echo "password=${{ env.DB_PASS }}" >> ~/.my.cnf
          echo "host=127.0.0.1" >> ~/.my.cnf
          echo "port=${{ steps.vars.outputs.host_port }}" >> ~/.my.cnf
          chmod 600 ~/.my.cnf

      - name: 💾 Backup with mysqldump and Compress
        run: |
          echo "[+] Starting backup..."
          TIMESTAMP="${{ steps.vars.outputs.timestamp }}"
          BACKUP_FILE="${{ env.BACKUP_DIR }}/backup-${TIMESTAMP}.sql"
          ARCHIVE_FILE="${BACKUP_FILE}.gz"
          mysqldump "${{ env.DB_NAME }}" > "$BACKUP_FILE" || { echo "❌ Backup failed"; exit 1; }
          echo "[+] Compressing backup..."
          gzip -f "$BACKUP_FILE"
          echo "✅ Backup completed: $ARCHIVE_FILE"
          ls -lh "${{ env.BACKUP_DIR }}"

      - name: 🔍 Print Container Info
        run: |
          echo "📦 Container name: ${{ steps.vars.outputs.container }}"
