name: 🛡️ MEGA Scorecard + CodeQL + SARIF + Markdown + EchoOps + 업그레이드

on:
  workflow_dispatch:
  schedule:
    - cron: '2 */3 * * *'

jobs:
  scorecard_submit:
    name: 📄 Scorecard 성공 Job (제약 준수)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      security-events: none
      id-token: none

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🔮 Run Scorecard Action
        uses: ossf/scorecard-action@v2.4.2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          results_file_json: results.json

  post_analysis:
    name: 📊 결과 분석 + SARIF + Markdown + Echo + 업그레이드
    needs: scorecard_submit
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 📁 Echo 디렉토리 및 로그 스크립트 생성
        run: |
          set -e
          ECHO_DIRS=".github/echo_scorecard .github/echo_codeql .github/echo_logs .github/echo_upgrade site/scorecard"
          for dir in $ECHO_DIRS; do
            mkdir -p "$dir"
            echo "echo '[ECHO] 디렉토리 생성: $dir'" >> .github/echo_logs/create_dirs.sh
          done
          chmod +x .github/echo_logs/create_dirs.sh
          bash .github/echo_logs/create_dirs.sh

      - name: 🧪 Install CodeQL CLI
        run: |
          set -e
          VERSION=2.16.2
          mkdir -p codeql_bin
          curl -sLO https://github.com/github/codeql-cli-binaries/releases/download/v${VERSION}/codeql-linux64.zip
          unzip -q codeql-linux64.zip -d codeql_bin
          chmod +x codeql_bin/codeql/codeql
          sudo mv codeql_bin/codeql/codeql /usr/local/bin/codeql
          codeql version | tee .github/echo_codeql/codeql_version.txt

      - name: 🛡️ Install Scorecard CLI
        run: |
          set -e
          VER=4.10.3
          curl -sLO https://github.com/ossf/scorecard/releases/download/v${VER}/scorecard_${VER}_linux_amd64.tar.gz
          tar -xzf scorecard_${VER}_linux_amd64.tar.gz
          BIN=$(find . -type f -name scorecard | head -1)
          if [ -f "$BIN" ]; then
            chmod +x "$BIN"
            sudo mv "$BIN" /usr/local/bin/scorecard
            scorecard --version | tee .github/echo_scorecard/scorecard_version.txt
          else
            echo "::error ::[ERR] Scorecard 설치 실패: 바이너리 없음"
            exit 1
          fi

      - name: 📎 Convert Scorecard JSON to Markdown
        run: |
          set -e
          echo "# 🛡️ OSSF Scorecard 결과 요약" > site/scorecard/scorecard-summary.md
          if jq -e 'type == "object" and .repo.name and .score and .checks' results.json > /dev/null 2>&1; then
            jq -r '
              "### 프로젝트: \(.repo.name)\n\n" +
              "신력도 점수: \(.score) / 10\n\n" +
              "| 확인 | 통과 | 점수 | 사유 |\n|--------|------|--------|--------|\n" +
              (.checks[] |
                "| \(.name) | \(.pass) | \(.score) | \(.reason // "-") |"
              ) | join("\n")
            ' results.json >> site/scorecard/scorecard-summary.md
          else
            echo "⚠️ results.json 변환 실패(구조 오류)" >> site/scorecard/scorecard-summary.md
          fi
          echo "echo '[ECHO] Markdown 변환 완료'" >> .github/echo_logs/convert_md.sh

      - name: 📄 Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: 🪑 Analyze File Size & Log Echo
        run: |
          set -e
          du -ah . | sort -hr | head -n 30 > .github/echo_logs/top_sizes.txt || true
          du -sh . > .github/echo_logs/total_size.txt || true
          echo "echo '[ECHO] 파일 크기 분석 완료'" >> .github/echo_logs/file_size_check.sh

      - name: 📦 Upload Echo & Summary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-echo-results
          path: |
            site/scorecard/scorecard-summary.md
            .github/echo_scorecard
            .github/echo_codeql
            .github/echo_logs
