name: 🩺 Workflows Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # 매시간 정각(UTC 기준)

jobs:
  health-check:
    name: Health Check All Workflows
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub CLI가 자동으로 이 토큰을 사용합니다

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Install GitHub CLI
        run: |
          echo "[🚀] GitHub CLI 설치 중..."
          sudo apt-get update && sudo apt-get install -y gh
          echo "[✅] GitHub CLI 설치 완료"

      - name: 🔍 Health Check All Workflows
        run: |
          echo "[🔐] GitHub CLI 토큰 환경변수 설정 완료 — 별도 로그인 불필요"
          echo "[🩺] 워크플로우 헬스체크 시작..."
          FAILED=()
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            echo "[🔍] 파일 확인: $file"
            WF_NAME=$(basename "$file" | sed -E 's/\.(ya?ml)$//')
            echo "[🔄] '$WF_NAME' 워크플로우 최근 실행 상태 조회..."
            STATUS=$(gh run list --workflow "$WF_NAME" --limit 1 --json conclusion --jq '.[0].conclusion' 2>/dev/null)
            if [ -z "$STATUS" ]; then
              echo "[⚠️] '$WF_NAME' 워크플로우 실행 기록을 찾을 수 없습니다."
              FAILED+=("$WF_NAME")
            elif [ "$STATUS" != "success" ]; then
              echo "[❌] '$WF_NAME' 마지막 실행 상태: $STATUS"
              FAILED+=("$WF_NAME")
            else
              echo "[✅] '$WF_NAME' 워크플로우 정상"
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "[🚨] 헬스체크 실패 워크플로우: ${FAILED[*]}"
            exit 1
          fi

          echo "[🎉] 모든 워크플로우 헬스체크 통과"
