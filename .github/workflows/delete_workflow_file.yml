name: Auto Create Workflow File

on:
  schedule:
    - cron: '0 * * * *'  # 매시간 정각 실행
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create_workflow_file:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout repository
        uses: actions/checkout@v4

      - name: 📝 Generate workflow file with echo (줄마다 echo 방식)
        run: |
          echo "[+] 디렉토리 생성: .github/workflows"
          mkdir -p .github/workflows

          echo "[+] 워크플로우 YAML 생성 시작..."
          {
            echo "name: Sample-Generated-Workflow"
            echo ""
            echo "on:"
            echo "  workflow_dispatch:"
            echo ""
            echo "jobs:"
            echo "  say-hello:"
            echo "    runs-on: ubuntu-latest"
            echo "    steps:"
            echo "      - name: 👋 Say Hello"
            echo "        run: echo 'Hello from generated workflow'"
          } > .github/workflows/generated_workflow.yml

          echo "[✔] generated_workflow.yml 생성 완료"

      - name: ✅ Commit and push the file
        run: |
          echo "[+] git 사용자 정보 설정 중..."
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"

          echo "[+] 변경된 파일 스테이징"
          git add .github/workflows/generated_workflow.yml

          echo "[+] 커밋 시도"
          git commit -m "🆕 Auto-generated workflow file" || echo "[!] 커밋할 변경 사항 없음"

          echo "[+] git push 시작"
          git push || echo "[!] git push 실패 또는 변경사항 없음"

          echo "[✔] 워크플로 전체 완료"
