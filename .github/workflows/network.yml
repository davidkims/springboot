name: 🐳 도커/네트워크/라우터/권한 에코 자동화 및 업로드

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  echo-docker-network-info:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      # 1. 주요 디렉토리 생성 (에코)
      - name: 📁 에코 정보 디렉토리 생성
        run: |
          echo "echo 'mkdir -p .github/echo_network'" ; mkdir -p .github/echo_network
          echo "echo 'mkdir -p .github/echo_docker'" ; mkdir -p .github/echo_docker
          echo "echo 'mkdir -p .github/echo_permission'" ; mkdir -p .github/echo_permission

      # 2. 네트워크/라우터 에코 파일 생성
      - name: 📝 네트워크/라우터 정보 에코 파일 생성 및 실행
        run: |
          # 네트워크 정보
          echo "echo '#!/bin/bash'" > .github/echo_network/network_info.sh
          echo "echo 'ip a > .github/echo_network/network_status.txt'" >> .github/echo_network/network_info.sh
          echo "ip a > .github/echo_network/network_status.txt" >> .github/echo_network/network_info.sh
          echo "chmod +x .github/echo_network/network_info.sh" >> .github/echo_network/network_info.sh
          echo "echo './.github/echo_network/network_info.sh'" ; bash .github/echo_network/network_info.sh

          # 라우터 정보
          echo "echo '#!/bin/bash'" > .github/echo_network/router_info.sh
          echo "echo 'ip route > .github/echo_network/router_status.txt'" >> .github/echo_network/router_info.sh
          echo "ip route > .github/echo_network/router_status.txt" >> .github/echo_network/router_info.sh
          echo "chmod +x .github/echo_network/router_info.sh" >> .github/echo_network/router_info.sh
          echo "echo './.github/echo_network/router_info.sh'" ; bash .github/echo_network/router_info.sh

      # 3. 도커 에코 파일 생성 및 도커 네트워크 에코 파일 생성
      - name: 🐳 도커 에코 파일 생성 및 네트워크 정보 생성
        run: |
          # 도커 설치/버전 정보
          echo "echo '#!/bin/bash'" > .github/echo_docker/docker_install_info.sh
          echo "echo 'docker --version > .github/echo_docker/docker_version.txt 2>&1'" >> .github/echo_docker/docker_install_info.sh
          echo "docker --version > .github/echo_docker/docker_version.txt 2>&1" >> .github/echo_docker/docker_install_info.sh
          echo "chmod +x .github/echo_docker/docker_install_info.sh" >> .github/echo_docker/docker_install_info.sh
          echo "echo './.github/echo_docker/docker_install_info.sh'" ; bash .github/echo_docker/docker_install_info.sh

          # 도커 네트워크 정보
          echo "echo '#!/bin/bash'" > .github/echo_docker/docker_network_info.sh
          echo "echo 'docker network ls > .github/echo_docker/docker_networks.txt 2>&1'" >> .github/echo_docker/docker_network_info.sh
          echo "docker network ls > .github/echo_docker/docker_networks.txt 2>&1" >> .github/echo_docker/docker_network_info.sh
          echo "chmod +x .github/echo_docker/docker_network_info.sh" >> .github/echo_docker/docker_network_info.sh
          echo "echo './.github/echo_docker/docker_network_info.sh'" ; bash .github/echo_docker/docker_network_info.sh

      # 4. 권한 에코 파일 생성
      - name: 🔒 권한/유저 에코 파일 생성
        run: |
          # 현재 사용자 정보
          echo "echo '#!/bin/bash'" > .github/echo_permission/user_info.sh
          echo "echo 'id > .github/echo_permission/user_id.txt'" >> .github/echo_permission/user_info.sh
          echo "id > .github/echo_permission/user_id.txt" >> .github/echo_permission/user_info.sh
          echo "chmod +x .github/echo_permission/user_info.sh" >> .github/echo_permission/user_info.sh
          echo "echo './.github/echo_permission/user_info.sh'" ; bash .github/echo_permission/user_info.sh

          # 그룹 정보
          echo "echo '#!/bin/bash'" > .github/echo_permission/group_info.sh
          echo "echo 'groups > .github/echo_permission/user_groups.txt'" >> .github/echo_permission/group_info.sh
          echo "groups > .github/echo_permission/user_groups.txt" >> .github/echo_permission/group_info.sh
          echo "chmod +x .github/echo_permission/group_info.sh" >> .github/echo_permission/group_info.sh
          echo "echo './.github/echo_permission/group_info.sh'" ; bash .github/echo_permission/group_info.sh

      # 5. 결과 파일 확인
      - name: 📄 생성 파일 목록 확인 (에코)
        run: |
          echo "echo 'ls -l .github/echo_network/'" ; ls -l .github/echo_network/
          echo "echo 'ls -l .github/echo_docker/'" ; ls -l .github/echo_docker/
          echo "echo 'ls -l .github/echo_permission/'" ; ls -l .github/echo_permission/

      # 6. 모든 정보 아티팩트로 업로드
      - name: 📦 에코 정보 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: echo-all-info
          path: |
            .github/echo_network/network_status.txt
            .github/echo_network/router_status.txt
            .github/echo_docker/docker_version.txt
            .github/echo_docker/docker_networks.txt
            .github/echo_permission/user_id.txt
            .github/echo_permission/user_groups.txt
