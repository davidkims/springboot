name: 🗂️ 완전통합 DB/에코/Compose/권한/스크립트/설치/로그 자동화 (XXL++ Live)

on:
  workflow_dispatch:
    inputs:
      live_iter:
        description: "실시간 업데이트 반복 횟수 (기본 5)"
        required: false
        default: "5"
      live_sleep:
        description: "반복 간격(초) (기본 30)"
        required: false
        default: "30"
  schedule:
    - cron: '3,6,9,12,15,18,21,24,27,30,33,36,39,42,45,48,51,54,57 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-echo:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DEBIAN_FRONTEND: noninteractive
      MYSQL_ROOT_PASSWORD: rootpass123
      POSTGRES_PASSWORD: pgpass123
      DB_USER: runner
      DB_PASS: pw
      DB_NAME: sample_db
      LIVE_ITER: ${{ inputs.live_iter || '5' }}
      LIVE_SLEEP: ${{ inputs.live_sleep || '30' }}

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 에코 디렉토리/파일/스크립트/권한 대량 생성 (안전한 tee + shebang)
        shell: bash
        run: |
          set -Eeuo pipefail

          # 0) tee 대상 선생성
          mkdir -p .github/echo_db/dirs
          echo '#!/usr/bin/env bash' > .github/echo_db/dirs/mkdir_cmds.sh
          chmod +x .github/echo_db/dirs/mkdir_cmds.sh

          echo "===== [에코] 디렉토리 대량 생성 시작 ====="
          for d in \
            .github/echo_db/dirs \
            .github/echo_db/files \
            .github/echo_db/installs \
            .github/echo_db/upgrade \
            .github/echo_db/permissions \
            .github/echo_db/scripts \
            .github/echo_db/logs \
            .github/echo_db/services \
            .github/echo_db/compose \
            .github/echo_db/homebrew \
            .github/echo_db/choco \
            .github/echo_db/snap \
            .github/echo_db/cloud \
            .github/echo_db/marketplace \
            .github/echo_db/config \
            .github/echo_db/sql \
            .github/echo_db/dump \
            .github/echo_db/health \
            .github/echo_db/monitor \
            site live_snapshots
          do
            mkdir -p "$d"
            echo "echo 'mkdir -p $d'" | tee -a .github/echo_db/dirs/mkdir_cmds.sh >/dev/null
            echo "echo '[에코] $d 디렉토리 생성 완료'" | tee -a .github/echo_db/dirs/mkdir_cmds.sh >/dev/null
          done
          echo "===== [에코] 디렉토리 대량 생성 완료 ====="

          # 1) 패키지 설치/업그레이드 에코 스크립트
          DB_LIST="mysql-server mariadb-server postgresql sqlite3 mongodb redis-server"
          for pkg in $DB_LIST; do
            f=".github/echo_db/installs/${pkg}-apt-install.sh"
            u=".github/echo_db/upgrade/${pkg}-apt-upgrade.sh"
            b=".github/echo_db/homebrew/${pkg}-brew-install.sh"
            c=".github/echo_db/choco/${pkg}-choco-install.sh"
            s=".github/echo_db/snap/${pkg}-snap-install.sh"

            { echo '#!/usr/bin/env bash'; echo 'set -Eeuo pipefail'
              echo "echo '[에코] apt install $pkg'"
              echo "sudo apt-get -yq update"
              echo "sudo apt-get -yq install $pkg"
            } > "$f" && chmod +x "$f"

            { echo '#!/usr/bin/env bash'; echo 'set -Eeuo pipefail'
              echo "echo '[에코] apt upgrade $pkg (--only-upgrade)'"
              echo "sudo apt-get -yq update"
              echo "sudo apt-get -yq install --only-upgrade $pkg || true"
            } > "$u" && chmod +x "$u"

            { echo '#!/usr/bin/env bash'; echo "echo '[에코] brew install $pkg'"; echo "brew install $pkg"; } > "$b" && chmod +x "$b"
            { echo '#!/usr/bin/env bash'; echo "echo '[에코] choco install $pkg'"; echo "choco install $pkg"; } > "$c" && chmod +x "$c"
            { echo '#!/usr/bin/env bash'; echo "echo '[에코] snap install $pkg'"; echo "sudo snap install $pkg"; } > "$s" && chmod +x "$s"
          done

          # 2) 컨테이너 서비스 YAML
          for db in mysql postgres mongo redis; do
            yml=".github/echo_db/services/${db}-service.yml"
            {
              echo "# [에코] ${db} 컨테이너 예시"
              echo "services:"
              echo "  ${db}:"
              if [ "$db" = "mysql" ]; then
                echo "    image: mysql:8.0"
                echo "    environment:"
                echo "      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}"
                echo "    ports: [ '3306:3306' ]"
              elif [ "$db" = "postgres" ]; then
                echo "    image: postgres:15"
                echo "    environment:"
                echo "      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}"
                echo "    ports: [ '5432:5432' ]"
              elif [ "$db" = "mongo" ]; then
                echo "    image: mongo:7"
                echo "    ports: [ '27017:27017' ]"
              elif [ "$db" = "redis" ]; then
                echo "    image: redis:7"
                echo "    ports: [ '6379:6379' ]"
              fi
              echo "# [에코] ${db} 서비스 컨테이너 yaml 생성 완료"
            } > "$yml"
          done

          # 3) Docker Compose
          composefile=".github/echo_db/compose/all-db-compose.yml"
          {
            echo "# [에코] docker compose all-db"
            echo "version: '3.8'"
            echo "services:"
            echo "  mysql:"
            echo "    image: mysql:8.0"
            echo "    environment:"
            echo "      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}"
            echo "    ports: [ '3306:3306' ]"
            echo "  postgres:"
            echo "    image: postgres:15"
            echo "    environment:"
            echo "      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}"
            echo "    ports: [ '5432:5432' ]"
            echo "  mongo:"
            echo "    image: mongo:7"
            echo "    ports: [ '27017:27017' ]"
            echo "  redis:"
            echo "    image: redis:7"
            echo "    ports: [ '6379:6379' ]"
          } > "$composefile"

          { echo '#!/usr/bin/env bash'
            echo "set -Eeuo pipefail"
            echo "echo '[에코] docker compose up -d 실행 시도(가능한 경우만)'"
            echo "if docker compose version >/dev/null 2>&1; then"
            echo "  docker compose up -d || true"
            echo "else"
            echo "  echo '[WARN] docker compose 미탑재: 명령 기록만 수행'"
            echo "fi"
          } > .github/echo_db/compose/compose_echo.sh
          chmod +x .github/echo_db/compose/compose_echo.sh

          # 4) Marketplace 예시(참고 전용)
          cat > .github/echo_db/marketplace/postgresql-action.yml <<'YML'
          # 참고용: Marketplace 액션 사용 예시(실행 아님)
          - uses: harmon758/postgresql-action@v1
            with:
              postgresql version: '13'
              postgresql db: 'test_db'
              postgresql user: 'postgres'
              postgresql password: 'pgpass'
          YML

          # 5) 권한/유저 설정 에코(예시)
          for db in mysql postgres mongo redis; do
            perm=".github/echo_db/permissions/${db}-permission.sh"
            {
              echo '#!/usr/bin/env bash'
              echo 'set -Eeuo pipefail'
              echo "echo '[에코] $db 권한/유저 설정 예시 시작'"
              if [ "$db" = "mysql" ]; then
                echo "echo \"GRANT ALL PRIVILEGES ON *.* TO '${DB_USER}'@'%' IDENTIFIED BY '${DB_PASS}' WITH GRANT OPTION;\""
                echo "echo \"FLUSH PRIVILEGES;\""
              elif [ "$db" = "postgres" ]; then
                echo "echo \"CREATE USER ${DB_USER} WITH PASSWORD '${DB_PASS}';\""
                echo "echo \"GRANT ALL PRIVILEGES ON DATABASE ${DB_NAME} TO ${DB_USER};\""
              fi
              echo "echo 'chown -R runner:runner /var/lib/${db} || true'"
              echo "echo 'chmod 700 /var/lib/${db} || true'"
              echo "echo '[에코] $db 권한/유저 설정 예시 종료'"
            } > "$perm"
            chmod +x "$perm"
          done

          # 6) 설정 템플릿(.my.cnf / .pgpass)
          { echo '#!/usr/bin/env bash'
            echo 'set -Eeuo pipefail'
            echo 'cat > .github/echo_db/config/my.cnf <<CONF'
            echo "[client]"
            echo "user=${DB_USER}"
            echo "password=${DB_PASS}"
            echo "host=127.0.0.1"
            echo "port=3306"
            echo 'CONF'
            echo 'chmod 600 .github/echo_db/config/my.cnf'
          } > .github/echo_db/config/render_mycnf.sh
          chmod +x .github/echo_db/config/render_mycnf.sh
          .github/echo_db/config/render_mycnf.sh

          { echo '#!/usr/bin/env bash'
            echo 'set -Eeuo pipefail'
            echo 'cat > .github/echo_db/config/pgpass <<CONF'
            echo "127.0.0.1:5432:${DB_NAME}:${DB_USER}:${DB_PASS}"
            echo 'CONF'
            echo 'chmod 600 .github/echo_db/config/pgpass'
          } > .github/echo_db/config/render_pgpass.sh
          chmod +x .github/echo_db/config/render_pgpass.sh
          .github/echo_db/config/render_pgpass.sh

          # 7) 초기 SQL
          cat > .github/echo_db/sql/init_mysql.sql <<'SQL'
          CREATE DATABASE IF NOT EXISTS sample_db;
          CREATE TABLE IF NOT EXISTS sample_db.test (id INT PRIMARY KEY, val VARCHAR(64));
          INSERT INTO sample_db.test (id,val) VALUES (1,'hello'),(2,'world')
            ON DUPLICATE KEY UPDATE val=VALUES(val);
          SQL

          cat > .github/echo_db/sql/init_postgres.sql <<'SQL'
          -- 참고: DB 생성은 클러스터 레벨에서 수행됨
          -- psql -h 127.0.0.1 -U runner -c "CREATE DATABASE sample_db;"
          SQL

          cat > .github/echo_db/sql/init_sqlite.sql <<'SQL'
          CREATE TABLE IF NOT EXISTS test (id INTEGER PRIMARY KEY, val TEXT);
          INSERT INTO test(id,val) VALUES (1,'hello'),(2,'world');
          SQL

          # 8) 덤프 스크립트
          { echo '#!/usr/bin/env bash'
            echo 'set -Eeuo pipefail'
            echo "echo '[에코] mysqldump sample_db > dump/mysql_sample.sql'"
            echo "mysqldump --defaults-file=.github/echo_db/config/my.cnf sample_db > .github/echo_db/dump/mysql_sample.sql || true"
          } > .github/echo_db/dump/dump_mysql.sh
          chmod +x .github/echo_db/dump/dump_mysql.sh

          { echo '#!/usr/bin/env bash'
            echo 'set -Eeuo pipefail'
            echo "echo '[에코] pg_dump -d sample_db > dump/postgres_sample.sql'"
            echo "PGPASSFILE=.github/echo_db/config/pgpass pg_dump -h 127.0.0.1 -U ${DB_USER} -d ${DB_NAME} > .github/echo_db/dump/postgres_sample.sql || true"
          } > .github/echo_db/dump/dump_postgres.sh
          chmod +x .github/echo_db/dump/dump_postgres.sh

          { echo '#!/usr/bin/env bash'
            echo 'set -Eeuo pipefail'
            echo "echo '[에코] sqlite3 dump > dump/sqlite_sample.sql'"
            echo "sqlite3 ${GITHUB_WORKSPACE}/.github/echo_db/files/sample.sqlite '.read .github/echo_db/sql/init_sqlite.sql' || true"
            echo "sqlite3 ${GITHUB_WORKSPACE}/.github/echo_db/files/sample.sqlite '.dump' > .github/echo_db/dump/sqlite_sample.sql || true"
          } > .github/echo_db/dump/dump_sqlite.sh
          chmod +x .github/echo_db/dump/dump_sqlite.sh

          # 9) 헬스체크
          { echo '#!/usr/bin/env bash'
            echo 'set -Eeuo pipefail'
            echo "echo '[에코] 포트 체크 3306/5432/27017/6379'"
            echo "for p in 3306 5432 27017 6379; do"
            echo "  (timeout 1 bash -c \"</dev/tcp/127.0.0.1/\$p\") && echo \"[OK] port:\$p\" || echo \"[WAIT] port:\$p 닫힘\""
            echo "done"
          } > .github/echo_db/health/port_check.sh
          chmod +x .github/echo_db/health/port_check.sh

          { echo '#!/usr/bin/env bash'
            echo 'set -Eeuo pipefail'
            echo "echo '[에코] 프로세스 체크 mysqld/postgres/mongo/redis'"
            echo "for n in mysqld postgres mongo redis; do"
            echo "  pgrep -laf \"\$n\" >/dev/null 2>&1 && echo \"[OK] proc:\$n\" || echo \"[WAIT] proc:\$n 미동작\""
            echo "done"
          } > .github/echo_db/health/process_check.sh
          chmod +x .github/echo_db/health/process_check.sh

          # 10) 용량 모니터
          { echo '#!/usr/bin/env bash'
            echo 'set -Eeuo pipefail'
            echo "mkdir -p .github/echo_db/monitor"
            echo "LC_ALL=C du -ah . | LC_ALL=C sort -hr | head -n 30 > .github/echo_db/monitor/top_file_sizes.txt || true"
            echo "du -sh . > .github/echo_db/monitor/total_size.txt || true"
            echo "echo '[에코] 용량 분석 완료'"
          } > .github/echo_db/monitor/size_check.sh
          chmod +x .github/echo_db/monitor/size_check.sh

          # 11) 설치/권한 로그 스크립트
          { echo '#!/usr/bin/env bash'; echo "echo '[에코] DB 설치 완료 로그 기록'"; echo 'date'; } > .github/echo_db/logs/install_done_echo.sh
          chmod +x .github/echo_db/logs/install_done_echo.sh
          { echo '#!/usr/bin/env bash'; echo "echo '[에코] DB 권한 완료 로그 기록'"; echo 'date'; } > .github/echo_db/logs/permission_done_echo.sh
          chmod +x .github/echo_db/logs/permission_done_echo.sh

          # 12) 🔴 실시간 업데이트 전용 스크립트 (한 번 실행 시 snapshot/summary 갱신)
          cat > .github/echo_db/scripts/live_update.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ITER="$1"  # 숫자 태그
          NOW="$(date +'%Y-%m-%d %H:%M:%S %Z')"
          SNAP_DIR="live_snapshots/iter_${ITER}"
          mkdir -p "$SNAP_DIR"

          # 헬스/모니터 실행
          .github/echo_db/health/port_check.sh || true
          .github/echo_db/health/process_check.sh || true
          .github/echo_db/monitor/size_check.sh || true

          # SQLite 덤프(항상 가능)
          .github/echo_db/dump/dump_sqlite.sh || true
          # MySQL/PG 접속 가능 시 덤프 시도
          .github/echo_db/dump/dump_mysql.sh || true
          .github/echo_db/dump/dump_postgres.sh || true

          # site 리포트 갱신
          {
            echo "# EchoOps DB 통합 리포트 (Live)"
            echo ""
            echo "## 갱신 시각: ${NOW}"
            echo ""
            echo "## 덤프 존재 여부"
            for f in .github/echo_db/dump/*.sql; do
              [ -f "$f" ] && echo "- $(basename "$f") ✅" || true
            done
            echo ""
            echo "## 용량 상위 30개 파일"
            echo '```'
            [ -f .github/echo_db/monitor/top_file_sizes.txt ] && cat .github/echo_db/monitor/top_file_sizes.txt || echo "(생성 안 됨)"
            echo '```'
            echo ""
            echo "## 헬스체크 로그"
            echo '```'
            .github/echo_db/health/port_check.sh || true
            .github/echo_db/health/process_check.sh || true
            echo '```'
          } > site/index.md

          # 스냅샷 보관
          cp -r .github/echo_db/dump "$SNAP_DIR/" 2>/dev/null || true
          cp -r .github/echo_db/monitor "$SNAP_DIR/" 2>/dev/null || true
          cp site/index.md "$SNAP_DIR/" 2>/dev/null || true

          # Step Summary에 실시간 업데이트 반영
          {
            echo "### 🔄 Live Update #${ITER}"
            echo "- 시간: ${NOW}"
            echo "- 덤프 파일:"
            ls -1 .github/echo_db/dump/*.sql 2>/dev/null || echo "(없음)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          SH
          chmod +x .github/echo_db/scripts/live_update.sh

      - name: 🛠 실제 설치/업그레이드 실행 (비대화/에러 무시)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[에코] apt update 1회 실행"
          sudo apt-get -yq update

          DB_LIST="mysql-server mariadb-server postgresql sqlite3 mongodb redis-server"
          for pkg in $DB_LIST; do
            echo "[에코] 설치 시도: $pkg"
            sudo apt-get -yq install "$pkg" || echo "[$pkg] 설치 오류(무시)"
            echo "[에코] 업그레이드 시도: $pkg (--only-upgrade)"
            sudo apt-get -yq install --only-upgrade "$pkg" || echo "[$pkg] 업그레이드 오류(무시)"
          done
          echo "[에코] 설치/업그레이드 단계 종료"
          echo "[에코] 서비스 상태 확인(가능한 경우)"
          echo "sudo service mysql status || true"
          echo "sudo service postgresql status || true"
          echo "sudo service redis-server status || true"

      - name: 🧪 1차 측정/리포트 생성
        shell: bash
        run: |
          set -Eeuo pipefail
          .github/echo_db/scripts/live_update.sh "init"

      - name: 📡 실시간 업데이트 루프 (LIVE_ITER x LIVE_SLEEP초)
        shell: bash
        run: |
          set -Eeuo pipefail
          iters="${LIVE_ITER}"
          sleepsec="${LIVE_SLEEP}"
          echo "Live updates: ${iters}회, 간격 ${sleepsec}초"
          for i in $(seq 1 "${iters}"); do
            echo "[LIVE] 업데이트 #${i} 시작"
            .github/echo_db/scripts/live_update.sh "${i}" || true

            # 👉 중간 아티팩트 업로드(동일 이름으로 append)
            echo "[LIVE] 중간 아티팩트 업로드 #${i}"
            tar -czf "live_snapshots/snap_${i}.tgz" "live_snapshots/iter_${i}" || true
            echo "::group::upload-artifact (append #${i})"
            ghwf_artifact_name="echo-db-live"
            # actions/upload-artifact는 액션이므로 여기선 echo만; 실제 업로드는 다음 step에서 수행
            echo "::endgroup::"
            # 대기
            if [ "$i" -lt "${iters}" ]; then
              echo "[LIVE] ${sleepsec}초 대기..."
              sleep "${sleepsec}"
            fi
          done

      - name: 📦 아티팩트 업로드 (정적 + 라이브 스냅샷)
        uses: actions/upload-artifact@v4
        with:
          name: echo-db-live
          path: |
            .github/echo_db/dump/
            .github/echo_db/monitor/
            .github/echo_db/health/
            .github/echo_db/**/*.sh
            .github/echo_db/**/*.yml
            .github/echo_db/**/*.sql
            site/
            live_snapshots/

      - name: 🔎 최종 에코 산출물 마스킹 출력(cat)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[에코] 에코 파일/스크립트 전체 출력 시작"
          find .github/echo_db -type f -print0 | sort -z | xargs -0 -I{} sh -c 'echo "------------------"; echo "[에코][파일] {}"; sed -e "s/${{ env.MYSQL_ROOT_PASSWORD }}/****/g" -e "s/${{ env.POSTGRES_PASSWORD }}/****/g" -e "s/${{ env.DB_PASS }}/****/g" "{}" | cat; echo'
          echo "[에코] 에코 전체 출력 종료"

      - name: 🌐 Pages 설정
        uses: actions/configure-pages@v5

      - name: ⬆️ Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build-and-echo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
