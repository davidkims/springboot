name: Netstat Status Reporter

on:
  schedule:
    - cron: '0 0 * * *' # 매일 UTC 00:00에 실행
  workflow_dispatch:

jobs:
  check_and_report:
    runs-on: ubuntu-latest
    
    # 환경 변수 설정
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # SSH 키가 설정되어 있는지 확인
      - name: Validate SSH key secret
        run: |
          if [ -z "${{ env.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ ERROR: SSH_PRIVATE_KEY secret is empty or not set."
            echo "Please configure it in repository settings."
            exit 1
          fi

      # SSH 키를 사용하여 원격 서버에 접속하고 netstat 실행
      - name: Get netstat data from server
        id: netstat_data_step
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            echo "# 서버 네트워크 상태 보고서"
            echo ""
            echo "## $(hostname) 서버"
            echo ""
            echo "### 1. LISTEN 상태 포트"
            echo "```bash"
            netstat -lntp
            echo "```"
            echo ""
            echo "### 2. TCP 연결 상태별 통계"
            echo "```bash"
            netstat -ant | awk '{print $6}' | sort | uniq -c | sort -nr
            echo "```"
            echo ""
            echo "### 3. 주요 포트 점검 (80, 443)"
            echo "---"
            
            PORT_TO_CHECK="80 443"
            for PORT in $PORT_TO_CHECK; do
              if netstat -lnt | grep -q ":$PORT\s*LISTEN"; then
                echo "✅ Port $PORT is listening."
              else
                echo "❌ Port $PORT is NOT listening."
              fi
            done
            
            echo ""
            echo "---"
            echo "점검 시간: $(date '+%Y-%m-%d %H:%M:%S')"
      
      # Netstat 결과를 GitHub Issue에 등록
      - name: Create GitHub Issue report
        if: always()
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: 'Netstat Report - Server Status (${{ github.ref_name }})'
          content: ${{ steps.netstat_data_step.outputs.stdout }}
          token: ${{ secrets.GITHUB_TOKEN }}
          assignees: your-github-username
