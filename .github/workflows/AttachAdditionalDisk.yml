name: 🛠 Provision & Attach Additional Disk

on:
  workflow_dispatch:

jobs:
  expand-disk:
    runs-on: ubuntu-latest  # 실제론 self-hosted runner를 가리키도록 설정해야 합니다.
    env:
      AWS_REGION: ap-northeast-2          # 원하는 리전
      VOLUME_SIZE_GB: 200                 # 추가할 볼륨 크기(GB)
      DEVICE_NAME: /dev/xvdf              # EC2에 붙일 디바이스 이름
      MOUNT_POINT: /mnt/extra             # 마운트 지점
      FILESYSTEM: xfs                     # 사용할 파일 시스템(xfs, ext4 등)

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}

      - name: 📦 Create EBS Volume
        id: create_volume
        run: |
          echo "▶ Creating ${VOLUME_SIZE_GB}GiB EBS volume in $AWS_REGION..."
          AZ=$(curl -s http://169.254.169.254/latest/meta-data/placement/availability-zone)
          VOL_ID=$(aws ec2 create-volume \
            --region $AWS_REGION \
            --availability-zone $AZ \
            --size $VOLUME_SIZE_GB \
            --volume-type gp3 \
            --tag-specifications "ResourceType=volume,Tags=[{Key=Name,Value=ci-extra-disk}]" \
            --query VolumeId --output text)
          echo "✔ VolumeId=$VOL_ID"
          echo "::set-output name=volume_id::$VOL_ID"

      - name: ⏳ Wait for Volume to become available
        run: |
          aws ec2 wait volume-available --region $AWS_REGION --volume-ids ${{ steps.create_volume.outputs.volume_id }}
          echo "✔ Volume is now available."

      - name: 🔗 Attach Volume to this Instance
        run: |
          INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
          echo "▶ Attaching Volume ${ { steps.create_volume.outputs.volume_id }} to Instance $INSTANCE_ID at $DEVICE_NAME..."
          aws ec2 attach-volume \
            --region $AWS_REGION \
            --volume-id ${{ steps.create_volume.outputs.volume_id }} \
            --instance-id $INSTANCE_ID \
            --device $DEVICE_NAME
          echo "✔ Attach command issued."

      - name: ⚙️ Format & Mount
        run: |
          echo "▶ Installing filesystem tools..."
          sudo apt-get update -qq
          if [ "${FILESYSTEM}" = "xfs" ]; then
            sudo apt-get install -y xfsprogs
          else
            sudo apt-get install -y e2fsprogs
          fi

          echo "▶ Waiting for device node to appear..."
          for i in {1..10}; do
            [ -b "$DEVICE_NAME" ] && break
            echo "  - waiting for $DEVICE_NAME..."
            sleep 2
          done

          echo "▶ Creating filesystem ($FILESYSTEM) on $DEVICE_NAME..."
          if [ "${FILESYSTEM}" = "xfs" ]; then
            sudo mkfs.xfs -f $DEVICE_NAME
          else
            sudo mkfs.ext4 -F $DEVICE_NAME
          fi

          echo "▶ Mounting to $MOUNT_POINT..."
          sudo mkdir -p $MOUNT_POINT
          sudo mount $DEVICE_NAME $MOUNT_POINT
          echo "$DEVICE_NAME $MOUNT_POINT ${FILESYSTEM} defaults,nofail 0 2" | sudo tee -a /etc/fstab

      - name: 🧪 Validate Mount
        run: |
          echo "▶ 현재 디스크 사용 현황:"
          df -h $MOUNT_POINT
