name: 📨 Mailu 자동화 + Docker 복구/에코 통합

on:
  workflow_dispatch:

jobs:
  mailu-auto-full:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ [APT/도커/compose-plugin 완전 복구 및 환경보장]
        run: |
          set -e
          echo "echo '[APT/도커 완전 복구/에코/디렉토리/에러파일/포트까지 전체]'"
          mkdir -p .github/package-backup .github/error_logs .github/email_logs .github/email_echo

          # 미러/sources.list/sources.list.d 클린
          for i in {1..5}; do
            sudo rm -f /etc/apt/apt-mirrors.txt
            sudo sed -i '/mirror\+file:/d;/file:\/etc\/apt\/apt-mirrors.txt/d;/deb file:/d;/mirror+file:/d' /etc/apt/sources.list || true
            find /etc/apt/sources.list.d -type f \( -name '*.bak*' -o -name '*apt-mirrors*' -o -name '*.distUpgrade*' \) -exec sudo rm -f {} \; || true
            sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/lock /var/lib/dpkg/lock* /var/cache/debconf/*-old || true
            sleep 1
          done

          sudo apt-get clean
          sudo apt-get autoclean
          sudo apt-get update --fix-missing -y || true
          sudo apt-get upgrade --fix-missing -y || true

          # docker compose-plugin (moby-engine/moby-cli/docker-compose-plugin)
          for i in {1..5}; do
            sudo apt-get install --fix-missing -y moby-engine moby-cli docker-compose-plugin && break || sleep 2
          done

          sudo systemctl enable --now docker || true
          sudo usermod -aG docker $USER || true
          sleep 2

          docker --version > .github/email_logs/echo_docker_ver.txt || echo "[WARN] docker 미설치" > .github/email_logs/echo_docker_ver.txt
          docker compose version > .github/email_logs/echo_docker_compose_ver.txt || echo "[WARN] docker compose 미설치" > .github/email_logs/echo_docker_compose_ver.txt

          for port in 25 465 587 993 995 110 143; do
            sudo ufw allow $port/tcp || true
            echo "[포트허용] $port" >> .github/email_echo/echo_firewall.txt
          done

      - name: 📦 [Mailu compose.yaml + mailu.env (echo/실행/로깅)]
        run: |
          mkdir -p .github/email_logs/mailu

          echo "echo \"version: '2.4'\""           | tee  .github/email_logs/mailu/compose.yaml.echo
          echo "version: '2.4'"                   >> .github/email_logs/mailu/compose.yaml
          echo "echo 'services:'"                 | tee -a .github/email_logs/mailu/compose.yaml.echo
          echo "services:"                        >> .github/email_logs/mailu/compose.yaml
          echo "echo '  mail:'"                   | tee -a .github/email_logs/mailu/compose.yaml.echo
          echo "  mail:"                          >> .github/email_logs/mailu/compose.yaml
          echo "echo '    image: mailu/mailu:1.9'" | tee -a .github/email_logs/mailu/compose.yaml.echo
          echo "    image: mailu/mailu:1.9"       >> .github/email_logs/mailu/compose.yaml
          echo "echo '    env_file: mailu.env'"   | tee -a .github/email_logs/mailu/compose.yaml.echo
          echo "    env_file: mailu.env"          >> .github/email_logs/mailu/compose.yaml
          echo "echo '    ports:'"                | tee -a .github/email_logs/mailu/compose.yaml.echo
          echo "    ports:"                       >> .github/email_logs/mailu/compose.yaml
          echo "echo '      - \"25:25\"'"         | tee -a .github/email_logs/mailu/compose.yaml.echo
          echo "      - \"25:25\""                >> .github/email_logs/mailu/compose.yaml
          echo "echo '      - \"465:465\"'"       | tee -a .github/email_logs/mailu/compose.yaml.echo
          echo "      - \"465:465\""              >> .github/email_logs/mailu/compose.yaml
          echo "echo '      - \"587:587\"'"       | tee -a .github/email_logs/mailu/compose.yaml.echo
          echo "      - \"587:587\""              >> .github/email_logs/mailu/compose.yaml

          echo "echo 'SECRET_KEY=$(openssl rand -base64 32)'" | tee  .github/email_logs/mailu/mailu.env.echo
          echo "SECRET_KEY=$(openssl rand -base64 32)"        >  .github/email_logs/mailu/mailu.env
          echo "echo 'DOMAIN=example.com'"                   | tee -a .github/email_logs/mailu/mailu.env.echo
          echo "DOMAIN=example.com"                          >> .github/email_logs/mailu/mailu.env
          echo "echo 'HOSTNAMES=mail.example.com'"           | tee -a .github/email_logs/mailu/mailu.env.echo
          echo "HOSTNAMES=mail.example.com"                  >> .github/email_logs/mailu/mailu.env
          echo "echo 'ADMIN=testuser'"                       | tee -a .github/email_logs/mailu/mailu.env.echo
          echo "ADMIN=testuser"                              >> .github/email_logs/mailu/mailu.env
          echo "echo 'PASSWORD=$(date +%s | sha256sum | head -c 12)'" | tee -a .github/email_logs/mailu/mailu.env.echo
          echo "PASSWORD=$(date +%s | sha256sum | head -c 12)"        >> .github/email_logs/mailu/mailu.env

          echo "echo '[docker compose up Mailu 실행]'"
          docker compose -f .github/email_logs/mailu/compose.yaml --env-file .github/email_logs/mailu/mailu.env up -d \
            || echo "[WARN] Mailu docker compose 실패" > .github/email_logs/mailu/echo_up_warn.txt

      - name: 🗂️ [설치결과/echo파일/버전 출력]
        run: |
          echo "▶️ docker --version"
          cat .github/email_logs/echo_docker_ver.txt
          echo "▶️ docker compose version"
          cat .github/email_logs/echo_docker_compose_ver.txt
          echo "▶️ compose.yaml"
          cat .github/email_logs/mailu/compose.yaml
          echo "▶️ mailu.env"
          cat .github/email_logs/mailu/mailu.env
