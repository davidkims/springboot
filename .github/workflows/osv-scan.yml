name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '34 20 * * 2'
  push:
    branches: [ "main" ]

permissions:
  security-events: write
  contents: read

jobs:
  osv-scan:
    name: 🛡️ OSV-Scanner Full Flow
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Update & Install Required Packages (safe mode)
        run: |
          echo "[+] Updating APT and preparing environment..."
          sudo apt-get update -y

          echo "[!] Removing problematic firefox snap packages (if exist)..."
          sudo apt-get purge -y firefox || true
          sudo snap remove firefox || true
          sudo apt-mark hold firefox

          echo "[+] Upgrading packages..."
          sudo apt-get upgrade -y

          echo "[+] Installing: jq curl unzip git gh"
          sudo apt-get install -y jq curl unzip git gh

      - name: 🧪 Download and Run OSV Scanner (binary + retry + gh fallback)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "[🧪] Starting OSV Scanner download..."

          VERSION="1.7.1"
          FILENAME="osv-scanner_${VERSION}_linux_amd64"
          BINARY_NAME="osv-scanner"
          PRIMARY_URL="https://github.com/google/osv-scanner/releases/download/v${VERSION}/${FILENAME}"
          MIRROR_URL="https://mirror.example.com/${FILENAME}"  # 🔁 필요 시 대체

          DOWNLOAD_SUCCESS=false

          for attempt in {1..3}; do
            echo "[🌐] Attempt $attempt: Downloading from GitHub..."
            if curl -sSL --fail "$PRIMARY_URL" -o $BINARY_NAME; then
              echo "[✔] Download succeeded from primary URL"
              DOWNLOAD_SUCCESS=true
              break
            else
              echo "[!] Attempt $attempt failed"
              sleep 2
            fi
          done

          if [ "$DOWNLOAD_SUCCESS" = false ]; then
            echo "[⚠] Primary failed. Trying fallback mirror..."
            if curl -sSL --fail "$MIRROR_URL" -o $BINARY_NAME; then
              echo "[✔] Fallback download succeeded"
              DOWNLOAD_SUCCESS=true
            fi
          fi

          if [ "$DOWNLOAD_SUCCESS" = false ]; then
            echo "[🚨] All curl downloads failed. Trying gh release download..."
            gh release download "v${VERSION}" \
              --repo google/osv-scanner \
              --pattern "${FILENAME}" \
              --output $BINARY_NAME

            if [ ! -f $BINARY_NAME ]; then
              echo "[❌] gh release download failed. Aborting."
              exit 1
            else
              echo "[✔] gh release download succeeded"
            fi
          fi

          echo "[🔐] Making osv-scanner executable..."
          chmod +x $BINARY_NAME

          echo "[🚀] Running osv-scanner..."
          ./$BINARY_NAME -r --skip-git ./ | tee osv-results.txt

      - name: 📁 Convert to SARIF
        run: |
          echo "[📄] Converting output to SARIF..."
          ./osv-scanner -r --skip-git ./ --format sarif > osv-results.sarif
          echo "[✔] SARIF saved to osv-results.sarif"
          head -n 15 osv-results.sarif

      - name: 📤 Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
