name: 🏦 금융 자동화 - 업그레이드/컴파일/빌드/에코/이력/백업 All-in-One

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # 매일 02:00

jobs:
  finance-ci-all-in-one:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 대량 디렉토리/에코/로그/백업/업그레이드 생성 (echo)
        run: |
          set -e
          for d in \
            .github/echo_ts .github/echo_js .github/echo_java .github/echo_upgrade \
            .github/logs_ts .github/ts_projects .github/ts_bin .github/ts_backup .github/ts_dist_backup \
            .github/js_projects .github/js_backup .github/js_dist_backup \
            .github/java_projects .github/java_build .github/mvn_install \
            .github/build_history .github/build_logs .github/run_logs \
            .github/echo_compile .github/echo_build .github/echo_run .github/echo_result; do
            echo "echo 'mkdir -p $d'"
            mkdir -p "$d"
          done
          chmod 755 .github/*

      - name: 📦 Node.js/JavaScript, TypeScript, Java(Maven/JDK) 업그레이드 및 설치 (에코)
        run: |
          set -e
          # Node.js, npm 최신화
          echo "[UPGRADE] Node.js, npm, n(버전관리), TypeScript, Java(JDK), Maven" | tee .github/echo_upgrade/node_upgrade_start.txt
          sudo apt-get update -y
          sudo apt-get install -y curl gnupg2

          # Node.js 20.x LTS 설치 및 업그레이드 (최신화)
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node -v | tee .github/echo_upgrade/node_version.txt
          npm -v  | tee .github/echo_upgrade/npm_version.txt

          # npm 최신 업그레이드(sudo)
          sudo npm install -g npm@latest && npm -v | tee .github/echo_upgrade/npm_upgrade.txt
          
          # TypeScript 최신 업그레이드(sudo)
          sudo npm install -g typescript@latest && tsc -v | tee .github/echo_upgrade/tsc_upgrade.txt

          # Java JDK(최신 OpenJDK) 설치 및 업그레이드
          sudo apt-get install -y openjdk-17-jdk
          java -version 2>&1 | tee .github/echo_upgrade/java_version.txt

          # Maven 최신 설치(업그레이드)
          sudo apt-get install -y maven
          mvn -version | tee .github/echo_upgrade/mvn_version.txt

          echo "[UPGRADE] 모든 언어/빌드툴 최신화 완료" | tee .github/echo_upgrade/all_done.txt

          # 실행파일 복사
          for f in node npm tsc java mvn; do
            which $f | tee -a .github/echo_upgrade/executables.txt
            cp -a $(which $f) .github/ts_bin/ || true
            cp -a $(which $f) .github/mvn_install/ || true
          done

      - name: 📄 JS/TS/Java 샘플, tsconfig.json, pom.xml, 최신화 에코 파일 대량 생성
        run: |
          set -e
          # TypeScript
          echo "console.log('Hello, TypeScript!')" > .github/ts_projects/hello.ts
          echo "export function greet(name: string) { return 'Hello, ' + name + '!'; }" > .github/ts_projects/greet.ts
          echo "import { greet } from './greet'; console.log(greet('금융 자동화 업그레이드!'));" > .github/ts_projects/main.ts
          # tsconfig.json
          echo "{" > .github/ts_projects/tsconfig.json
          echo "  \"compilerOptions\": {" >> .github/ts_projects/tsconfig.json
          echo "    \"target\": \"es6\"," >> .github/ts_projects/tsconfig.json
          echo "    \"module\": \"commonjs\"," >> .github/ts_projects/tsconfig.json
          echo "    \"outDir\": \"./dist\"," >> .github/ts_projects/tsconfig.json
          echo "    \"strict\": true," >> .github/ts_projects/tsconfig.json
          echo "    \"esModuleInterop\": true" >> .github/ts_projects/tsconfig.json
          echo "  }," >> .github/ts_projects/tsconfig.json
          echo "  \"include\": [\"*.ts\"]" >> .github/ts_projects/tsconfig.json
          echo "}" >> .github/ts_projects/tsconfig.json

          # JavaScript
          echo "console.log('Hello, JavaScript! (업그레이드)');" > .github/js_projects/hello.js
          echo "function sum(a, b) { return a+b; } console.log('Sum:', sum(5,9));" > .github/js_projects/sum.js

          # Java 샘플
          mkdir -p .github/java_projects/src/main/java/com/fin/example
          echo "package com.fin.example; public class Main { public static void main(String[] args) { System.out.println(\"금융 Java 빌드(업그레이드)\"); }}" > .github/java_projects/src/main/java/com/fin/example/Main.java
          echo '<project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd"><modelVersion>4.0.0</modelVersion><groupId>com.fin</groupId><artifactId>finance-app</artifactId><version>1.0-SNAPSHOT</version><properties><maven.compiler.source>17</maven.compiler.source><maven.compiler.target>17</maven.compiler.target></properties><build><plugins><plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-compiler-plugin</artifactId><version>3.10.1</version></plugin></plugins></build></project>' > .github/java_projects/pom.xml

          # 최신화 에코 파일 대량 생성
          echo "[에코] 최신화/업그레이드 이력: $(date '+%Y-%m-%d %H:%M:%S')" > .github/echo_upgrade/upgrade_history_$(date +%Y%m%d_%H%M%S).txt
          echo "[에코] TypeScript/JavaScript/Java 소스, 빌드, 실행 결과 디렉토리 자동 생성 완료" > .github/echo_compile/echo.txt
          echo "[에코] 컴파일 및 빌드 시작 (업그레이드 포함)" > .github/echo_build/echo.txt

      - name: 🛠️ TypeScript 빌드/실행 및 에코, 백업
        run: |
          set -e
          cd .github/ts_projects
          tsc -p tsconfig.json | tee ../echo_compile/tsc_compile_$(date +%Y%m%d_%H%M%S).log
          ls -l dist > ../echo_compile/ts_dist_list_$(date +%Y%m%d_%H%M%S).txt
          node dist/main.js | tee ../echo_run/ts_run_$(date +%Y%m%d_%H%M%S).log
          cd ../..
          cp -a .github/ts_projects/dist/. .github/ts_dist_backup/
          cp -a .github/ts_projects/*.ts .github/ts_projects/tsconfig.json .github/ts_backup/
          echo "[에코] TypeScript 빌드/실행/백업/업그레이드 완료" >> .github/echo_result/ts_result_$(date +%Y%m%d_%H%M%S).txt

      - name: 🛠️ JavaScript 실행 및 에코, 백업
        run: |
          set -e
          node .github/js_projects/hello.js | tee .github/echo_run/js_hello_$(date +%Y%m%d_%H%M%S).log
          node .github/js_projects/sum.js | tee .github/echo_run/js_sum_$(date +%Y%m%d_%H%M%S).log
          cp -a .github/js_projects/*.js .github/js_backup/
          echo "[에코] JavaScript 실행/백업/업그레이드 완료" >> .github/echo_result/js_result_$(date +%Y%m%d_%H%M%S).txt

      - name: 🛠️ Maven(Java) 빌드/실행 및 에코, 백업
        run: |
          set -e
          cd .github/java_projects
          mvn clean compile | tee ../echo_compile/mvn_compile_$(date +%Y%m%d_%H%M%S).log
          mkdir -p ../java_build/
          cp -a target ../java_build/ || true
          cd ../..
          echo "[에코] Maven(Java) 빌드/백업/업그레이드 완료" >> .github/echo_result/java_result_$(date +%Y%m%d_%H%M%S).txt

      - name: 🗂️ 빌드/실행 로그/백업/이력 통합 에코
        run: |
          set -e
          find .github/ -type f | tee .github/build_logs/files_all_$(date +%Y%m%d_%H%M%S).log
          ls -ld .github/* | tee -a .github/build_logs/perm_owner_$(date +%Y%m%d_%H%M%S).log
          echo "[에코] 전체 빌드/실행/이력/로그/백업/업그레이드 파일 리스트 출력 완료" >> .github/echo_result/total_result_$(date +%Y%m%d_%H%M%S).txt

      - name: 🕓 빌드/업그레이드 이력(날짜별, 커밋별) 기록
        run: |
          set -e
          echo "빌드타임: $(date '+%Y-%m-%d %H:%M:%S')" > .github/build_history/last_build_time.txt
          echo "커밋 SHA: $GITHUB_SHA" > .github/build_history/last_build_commit.txt
          echo "[에코] 빌드/업그레이드 이력 파일 생성 완료" >> .github/echo_result/total_result_$(date +%Y%m%d_%H%M%S).txt

      - name: 📦 빌드/실행/로그/이력 artifacts 저장
        uses: actions/upload-artifact@v4
        with:
          name: finance-build-all-artifacts
          path: |
            .github/ts_dist_backup/
            .github/ts_backup/
            .github/js_backup/
            .github/java_build/
            .github/build_logs/
            .github/build_history/
            .github/echo_compile/
            .github/echo_build/
            .github/echo_run/
            .github/echo_result/
            .github/echo_upgrade/
