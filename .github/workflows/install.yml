name: 🗂️ MEGA-DB/거래/계좌/이체/유저/시뮬/설치/권한/대량/운영/유틸/Compose-통합

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  db-echo-mega:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 모든 echo/ledger/vaccount/tx/user/dir/scripts (Full Coverage)
        run: |
          for d in \
            .github/echo_db/dirs \
            .github/echo_db/files \
            .github/echo_db/installs \
            .github/echo_db/upgrade \
            .github/echo_db/permissions \
            .github/echo_db/scripts \
            .github/echo_db/logs \
            .github/echo_db/services \
            .github/echo_db/compose \
            .github/echo_db/homebrew \
            .github/echo_db/choco \
            .github/echo_db/snap \
            .github/echo_db/marketplace \
            .github/echo_db/backup \
            .github/echo_db/init \
            .github/echo_db/test \
            .github/echo_db/migration \
            .github/echo_db/import \
            .github/echo_db/export \
            .github/echo_db/serverinfo \
            .github/echo_db/errorlog \
            .github/echo_db/util \
            .github/echo_db/mass_db \
            .github/echo_db/mass_script \
            .github/echo_db/mass_query \
            .github/echo_db/ledger \
            .github/echo_db/vaccount \
            .github/echo_db/transfer \
            .github/echo_db/user \
            .github/echo_db/sim; do
            mkdir -p $d
          done

      - name: 📝 대량 거래/계좌/이체/유저/시뮬/쿼리/에코/스크립트 자동 생성 (API 제외)
        run: |
          set -e

          SERVICES="mysql postgresql sqlite3"
          MASS_CNT=10
          TX_TYPES="DEPOSIT WITHDRAWAL TRANSFER PAYMENT FEE"

          # 1. 유저, 계좌, 거래, 이체 대량 테이블/쿼리/시뮬 자동 생성
          for svc in $SERVICES; do
            # 유저
            for i in $(seq 1 $MASS_CNT); do
              echo "CREATE TABLE IF NOT EXISTS user_${svc} (user_id VARCHAR(50) PRIMARY KEY, name VARCHAR(50), email VARCHAR(100), reg_ts DATETIME);" \
                > .github/echo_db/user/${svc}_user_create.sql
              echo "INSERT INTO user_${svc} (user_id, name, email, reg_ts) VALUES ('user_${svc}_$i', 'User $i', 'user${i}@${svc}.com', CURRENT_TIMESTAMP);" \
                >> .github/echo_db/user/${svc}_user_insert.sql
            done
            # 계좌(가상/일반)
            for i in $(seq 1 $MASS_CNT); do
              acct="account_${svc}_$i"
              echo "CREATE TABLE IF NOT EXISTS $acct (account_no VARCHAR(50) PRIMARY KEY, user_id VARCHAR(50), type VARCHAR(10), balance INT, open_dt DATETIME);" \
                > .github/echo_db/vaccount/${svc}_${acct}_create.sql
              echo "INSERT INTO $acct (account_no, user_id, type, balance, open_dt) VALUES ('ACC${svc}$(printf %04d $i)', 'user_${svc}_$i', 'CHECKING', 100000, CURRENT_TIMESTAMP);" \
                >> .github/echo_db/vaccount/${svc}_${acct}_insert.sql
            done
            # 거래(원장, 유형별)
            for i in $(seq 1 $MASS_CNT); do
              ledger_tbl="ledger_${svc}_$i"
              echo "CREATE TABLE IF NOT EXISTS $ledger_tbl (tx_id INT PRIMARY KEY, account_no VARCHAR(50), tx_type VARCHAR(20), amount INT, balance INT, note VARCHAR(100), ts DATETIME);" \
                > .github/echo_db/ledger/${svc}_${ledger_tbl}_create.sql
              for tt in $TX_TYPES; do
                echo "INSERT INTO $ledger_tbl (tx_id, account_no, tx_type, amount, balance, note, ts) VALUES ($i, 'ACC${svc}$(printf %04d $i)', '$tt', $((10000+$i)), $((100000+$i)), '$tt Tx $i', CURRENT_TIMESTAMP);" \
                  >> .github/echo_db/ledger/${svc}_${ledger_tbl}_insert.sql
              done
            done
            # 이체(Transfer)
            for i in $(seq 1 $MASS_CNT); do
              transfer_tbl="transfer_${svc}_$i"
              echo "CREATE TABLE IF NOT EXISTS $transfer_tbl (tx_id INT PRIMARY KEY, from_acc VARCHAR(50), to_acc VARCHAR(50), amount INT, tx_type VARCHAR(20), ts DATETIME);" \
                > .github/echo_db/transfer/${svc}_${transfer_tbl}_create.sql
              echo "INSERT INTO $transfer_tbl (tx_id, from_acc, to_acc, amount, tx_type, ts) VALUES ($i, 'ACC${svc}$(printf %04d $i)', 'ACC${svc}$(printf %04d $((i+1)))', 5000, 'TRANSFER', CURRENT_TIMESTAMP);" \
                >> .github/echo_db/transfer/${svc}_${transfer_tbl}_insert.sql
            done
            # 시뮬레이션 실행 bash 예시(실행 명령 에코)
            for cat in user vaccount ledger transfer; do
              F=".github/echo_db/sim/${svc}_${cat}_sim_run.sh"
              echo "echo '[에코][시뮬] $svc $cat 대량 쿼리 시뮬레이션 실행'" > $F
              echo "for sql in .github/echo_db/$cat/${svc}_*.sql; do" >> $F
              if [ "$svc" = "mysql" ]; then
                echo "  echo \"[실행] mysql -uroot -prootpass123 test_db < \$sql\"" >> $F
              elif [ "$svc" = "postgresql" ]; then
                echo "  echo \"[실행] psql -U postgres -d test_db -f \$sql\"" >> $F
              elif [ "$svc" = "sqlite3" ]; then
                echo "  echo \"[실행] sqlite3 test.db < \$sql\"" >> $F
              fi
              echo "done" >> $F
            done
          done

          # 2. 대량/레거시 쿼리 자동 생성
          for i in $(seq 1 $MASS_CNT); do
            db="sampledb_$i"
            echo "CREATE DATABASE IF NOT EXISTS $db;" > .github/echo_db/mass_db/${db}_create.sql
            echo "DROP DATABASE IF EXISTS $db;" > .github/echo_db/mass_db/${db}_drop.sql
            user="user_$i"
            pw="pw_$i"
            echo "CREATE USER '$user'@'%' IDENTIFIED BY '$pw';" > .github/echo_db/mass_db/${user}_create.sql
            echo "GRANT ALL ON *.* TO '$user'@'%';" >> .github/echo_db/mass_db/${user}_create.sql
            tbl="table_$i"
            echo "CREATE TABLE $tbl (id INT PRIMARY KEY, value VARCHAR(100));" > .github/echo_db/mass_query/${tbl}_create.sql
            echo "INSERT INTO $tbl (id, value) VALUES ($i, 'Value_$i');" > .github/echo_db/mass_query/${tbl}_insert.sql
            echo "SELECT * FROM $tbl;" > .github/echo_db/mass_query/${tbl}_select.sql
            for j in $(seq 1 5); do
              echo "INSERT INTO $tbl (id, value) VALUES ($j, 'V${i}_$j');" >> .github/echo_db/mass_query/${tbl}_bulk_insert.sql
            done
          done

          # 3. DB별 설치/업그레이드/유틸리티/권한/테스트/Compose/Marketplace/로깅
          DB_LIST="mysql-server mariadb-server postgresql sqlite3 mongodb redis-server"
          for db in $DB_LIST; do
            echo "sudo apt-get update -y" > .github/echo_db/installs/$db-apt-install.sh
            echo "sudo apt-get install -y $db" >> .github/echo_db/installs/$db-apt-install.sh
            echo "sudo apt-get upgrade -y $db" > .github/echo_db/upgrade/$db-apt-upgrade.sh
            echo "brew install $db" > .github/echo_db/homebrew/$db-brew-install.sh
            echo "choco install $db" > .github/echo_db/choco/$db-choco-install.sh
            echo "sudo snap install $db" > .github/echo_db/snap/$db-snap-install.sh
            for feat in init backup test migration import export serverinfo errorlog util; do
              F=.github/echo_db/$feat/$db-$feat.sh
              echo "echo '[에코] $db $feat 스크립트'" > $F
            done
          done
          # Compose/서비스/Marketplace/권한
          for db in mysql postgresql mongodb redis; do
            yml=".github/echo_db/services/$db-service.yml"
            echo "services:" > $yml
            echo "  $db:" >> $yml
            echo "    image: $db:latest" >> $yml
            if [ "$db" = "mysql" ]; then
              echo "    environment:" >> $yml
              echo "      MYSQL_ROOT_PASSWORD: rootpass123" >> $yml
              echo "    ports: [ '3306:3306' ]" >> $yml
            elif [ "$db" = "postgresql" ]; then
              echo "    environment:" >> $yml
              echo "      POSTGRES_PASSWORD: pgpass123" >> $yml
              echo "    ports: [ '5432:5432' ]" >> $yml
            elif [ "$db" = "mongodb" ]; then
              echo "    ports: [ '27017:27017' ]" >> $yml
            elif [ "$db" = "redis" ]; then
              echo "    ports: [ '6379:6379' ]" >> $yml
            fi
          done

          composefile=".github/echo_db/compose/all-db-compose.yml"
          echo "version: \"3\"" > $composefile
          echo "services:" >> $composefile
          echo "  mysql:" >> $composefile
          echo "    image: mysql:8.0" >> $composefile
          echo "    environment:" >> $composefile
          echo "      MYSQL_ROOT_PASSWORD: rootpass123" >> $composefile
          echo "    ports: [ \"3306:3306\" ]" >> $composefile
          echo "  postgres:" >> $composefile
          echo "    image: postgres:15" >> $composefile
          echo "    environment:" >> $composefile
          echo "      POSTGRES_PASSWORD: pgpass123" >> $composefile
          echo "    ports: [ \"5432:5432\" ]" >> $composefile
          echo "  mongodb:" >> $composefile
          echo "    image: mongo:latest" >> $composefile
          echo "    ports: [ \"27017:27017\" ]" >> $composefile
          echo "  redis:" >> $composefile
          echo "    image: redis:latest" >> $composefile
          echo "    ports: [ \"6379:6379\" ]" >> $composefile

          echo "docker-compose up -d" > .github/echo_db/compose/compose_echo.sh

          marketfile=".github/echo_db/marketplace/postgresql-action.yml"
          echo "- uses: harmon758/postgresql-action@v1" > $marketfile
          echo "  with:" >> $marketfile
          echo "    postgresql version: '13'" >> $marketfile
          echo "    postgresql db: 'test_db'" >> $marketfile
          echo "    postgresql user: 'postgres'" >> $marketfile
          echo "    postgresql password: 'pgpass'" >> $marketfile

          # 권한
          for db in mysql postgresql mongodb redis; do
            perm=".github/echo_db/permissions/$db-permission.sh"
            if [ "$db" = "mysql" ]; then
              echo "GRANT ALL PRIVILEGES ON *.* TO 'runner'@'%' IDENTIFIED BY 'pw' WITH GRANT OPTION;" > $perm
              echo "FLUSH PRIVILEGES;" >> $perm
            elif [ "$db" = "postgresql" ]; then
              echo "CREATE USER runner WITH PASSWORD 'pw';" > $perm
              echo "GRANT ALL PRIVILEGES ON DATABASE test_db TO runner;" >> $perm
            fi
            echo "chown -R runner:runner /var/lib/$db" >> $perm
            echo "chmod 700 /var/lib/$db" >> $perm
          done

          # 로그 기록
          echo "[에코] DB 설치 완료 로그 기록" > .github/echo_db/logs/install_done_echo.sh
          date >> .github/echo_db/logs/install_done_echo.sh
          echo "[에코] DB 권한 완료 로그 기록" > .github/echo_db/logs/permission_done_echo.sh
          date >> .github/echo_db/logs/permission_done_echo.sh

      - name: 🏷️ 실제 설치/업그레이드 실행 (echo + 실제)
        run: |
          set +e
          for db in mysql-server mariadb-server postgresql sqlite3 mongodb redis-server; do
            echo "[에코] 설치 시도: $db"
            sudo apt-get update -y
            sudo apt-get install -y $db || echo "[$db] 설치 오류(무시)"
            echo "[에코] 업그레이드 시도: $db"
            sudo apt-get upgrade -y $db || echo "[$db] 업그레이드 오류(무시)"
          done
          echo "[에코] 모든 DB 설치/업그레이드 시도 완료"
          date

      - name: 🏷️ 전체 echo/시뮬/거래/계좌/이체/유저/스크립트/테스트/권한/로깅/출력
        run: |
          echo "[에코] 전체 echo/시뮬/거래/계좌/이체/유저/스크립트/테스트/권한/로그 출력 시작"
          find .github/echo_db -type f | sort | while read f; do
            echo "------------------"
            echo "[에코][파일] $f"
            cat $f
            echo
          done
          echo "[에코] 전체 출력 종료"
