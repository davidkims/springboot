name: "💽 SpringBoot Disk+Dirs — Online Resize + Echo + Commit/Push (no unmount)"

on:
  workflow_dispatch:
    inputs:
      disk_size_mb:
        description: "Initial disk image size (MB)"
        default: "1024"
        required: true
      resize_to_mb:
        description: "Online grow to this size (MB). Leave blank to keep current"
        default: ""
        required: false
      fs_type:
        description: "Filesystem: ext4 | xfs | btrfs"
        default: "ext4"
        required: true
      mount_point:
        description: "Mount point on runner"
        default: "/mnt/gh-disk"
        required: true
      dir_list:
        description: "Extra dirs (comma-separated) to create on mount+repo"
        default: "logs,tmp,backup,data,site,.github/echo_logs,.github/echo_scripts"
        required: true
      owner:
        description: "Owner (user)"
        default: "runner"
        required: true
      group:
        description: "Group"
        default: "runner"
        required: true
      dir_mode:
        description: "Directory permission (octal)"
        default: "0755"
        required: true
      commit_and_push:
        description: "Commit & push generated files? true|false"
        default: "true"
        required: true
      commit_message:
        description: "Commit message"
        default: "chore: add disk image + spring dirs + echo logs (auto)"
        required: true

permissions:
  contents: write

jobs:
  springboot-disk-dirs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DISK_IMG: disk.img
      LOG_DIR: .github/echo_logs
      ECHO_DIR: .github/echo_scripts
      GIT_USER_NAME: gh-actions-bot
      GIT_USER_EMAIL: gh-actions-bot@example.com

    steps:
      - name: 📂 Checkout (springboot)
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # allow push with GITHUB_TOKEN

      - name: 🧰 Init — FULL ECHO bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$ECHO_DIR"
          export PS4='+ [$(date "+%F %T")] ${BASH_SOURCE##*/}:${LINENO}:${FUNCNAME[0]:-main} ▶ '
          exec > >(tee -a "$LOG_DIR/00_full.log") 2>&1
          set -x

          run_cmd() { echo "[CMD] $*"; eval "$@"; }
          write_echo() {
            local target="$1"; shift
            mkdir -p "$(dirname "$target")"
            {
              echo '#!/usr/bin/env bash'
              echo 'set -Eeuo pipefail'
              echo 'export PS4='\''+ [$(date "+%F %T")] ${BASH_SOURCE##*/}:${LINENO}:${FUNCNAME[0]:-main} ▶ '\'''
              echo 'set -x'
              for line in "$@"; do echo "$line"; done
            } > "$target"
            chmod +x "$target"
            echo "[ECHO] Wrote echo script: $target"
          }
          export -f run_cmd write_echo
          write_echo "$ECHO_DIR/_helpers.sh" \
            'run_cmd() { echo "[CMD] $*"; eval "$@"; }' \
            'write_echo() {' \
            '  local target="$1"; shift' \
            '  mkdir -p "$(dirname "$target")"' \
            '  { echo "#!/usr/bin/env bash"; echo "set -Eeuo pipefail"; echo "export PS4='"'"'+ [$(date "+%F %T")] ${BASH_SOURCE##*/}:${LINENO}:${FUNCNAME[0]:-main} ▶ '"'"'"; echo "set -x"; for line in "$@"; do echo "$line"; done; } > "$target"' \
            '  chmod +x "$target"; echo "[ECHO] Wrote echo script: $target"' \
            '}'

      - name: 📦 Ensure FS tools (xfsprogs, btrfs-progs)
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/05_fs_tools.log") 2>&1
          set -x
          FST="${{ inputs.fs_type }}"
          if [[ "$FST" == "xfs" ]]; then
            run_cmd "sudo apt-get update -y"
            run_cmd "sudo apt-get install -y xfsprogs"
          elif [[ "$FST" == "btrfs" ]]; then
            run_cmd "sudo apt-get update -y"
            run_cmd "sudo apt-get install -y btrfs-progs"
          else
            echo "[ECHO] ext4 selected — e2fsprogs present on runners"
          fi

      - name: 🧱 Create disk image + mkfs (EXT4/XFS/Btrfs) — FULL ECHO
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/10_mkfs.log") 2>&1
          set -x
          SIZE_MB="${{ inputs.disk_size_mb }}"
          FST="${{ inputs.fs_type }}"
          run_cmd "dd if=/dev/zero of=\"${DISK_IMG}\" bs=1M count=0 seek=\"${SIZE_MB}\""
          case "$FST" in
            ext4)  run_cmd "sudo mkfs.ext4 -F \"${DISK_IMG}\"" ;;
            xfs)   run_cmd "sudo mkfs.xfs -f \"${DISK_IMG}\"" ;;
            btrfs) run_cmd "sudo mkfs.btrfs -f \"${DISK_IMG}\"" ;;
            *) echo "[ERROR] Unsupported fs_type: $FST"; exit 1 ;;
          esac
          run_cmd "ls -lh \"${DISK_IMG}\""
          write_echo "$ECHO_DIR/create_disk_${FST}.sh" \
            "dd if=/dev/zero of=\"${DISK_IMG}\" bs=1M count=0 seek=\"${SIZE_MB}\"" \
            "sudo mkfs.${FST} ${FST:+'-f'} \"${DISK_IMG}\"" \
            "ls -lh \"${DISK_IMG}\""

      - name: 🔗 losetup + mount (no unmount later) — FULL ECHO
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/20_mount.log") 2>&1
          set -x
          MNT="${{ inputs.mount_point }}"
          OWNER="${{ inputs.owner }}"
          GROUP="${{ inputs.group }}"
          run_cmd "sudo losetup -fP \"${DISK_IMG}\""
          LOOP_DEV="$(sudo losetup -j "${DISK_IMG}" | awk -F: '{print $1}')"
          [[ -z "$LOOP_DEV" ]] && { echo "[ERROR] loop device not found"; exit 1; }
          echo "[ECHO] LOOP_DEV=$LOOP_DEV"
          run_cmd "sudo mkdir -p \"${MNT}\""
          run_cmd "sudo mount \"${LOOP_DEV}\" \"${MNT}\""
          run_cmd "mount | grep ' on ${MNT} '"
          run_cmd "sudo chown -R \"${OWNER}:${GROUP}\" \"${MNT}\""
          run_cmd "ls -al \"${MNT}\""
          run_cmd "df -h \"${MNT}\""
          write_echo "$ECHO_DIR/_note_no_unmount.sh" \
            "echo '[NOTE] This run intentionally leaves ${MNT} mounted (no unmount per request).'" 

      - name: 📁 Create Spring Boot standard dirs (repo + mount) — FULL ECHO
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/30_spring_dirs.log") 2>&1
          set -x
          MNT="${{ inputs.mount_point }}"
          OWNER="${{ inputs.owner }}"; GROUP="${{ inputs.group }}"; MODE="${{ inputs.dir_mode }}"
          # Spring Boot standard structure + common dirs
          SB_DIRS=(
            "src/main/java"
            "src/main/resources"
            "src/test/java"
            "src/test/resources"
            "logs" "tmp" "backup" "data" "site"
            ".github/echo_logs" ".github/echo_scripts"
          )
          # Extra user-provided
          IFS=',' read -ra EXTRA <<< "${{ inputs.dir_list }}"
          for x in "${EXTRA[@]}"; do SB_DIRS+=("$(echo "$x" | xargs)"); done

          printf '%s\n' "${SB_DIRS[@]}" | sed '/^$/d' | sort -u > "$ECHO_DIR/.all_dirs.txt"
          while IFS= read -r d; do
            run_cmd "mkdir -p \"${d}\""
            run_cmd "sudo chown -R \"${OWNER}:${GROUP}\" \"${d}\""
            run_cmd "sudo chmod \"${MODE}\" \"${d}\""
            run_cmd "mkdir -p \"${MNT}/${d}\""
            run_cmd "sudo chown -R \"${OWNER}:${GROUP}\" \"${MNT}/${d}\""
            run_cmd "sudo chmod \"${MODE}\" \"${MNT}/${d}\""
            # ensure empty dirs get committed (gitkeep)
            if [ ! -e "${d}/.gitkeep" ]; then echo "" > "${d}/.gitkeep"; fi
            write_echo "$ECHO_DIR/mkdir_$(echo "$d" | tr '/' '_' ).sh" \
              "mkdir -p \"${d}\" \"${MNT}/${d}\"" \
              "sudo chown -R \"${OWNER}:${GROUP}\" \"${d}\" \"${MNT}/${d}\"" \
              "sudo chmod \"${MODE}\" \"${d}\" \"${MNT}/${d}\"" \
              "[ -e \"${d}/.gitkeep\" ] || : > \"${d}/.gitkeep\""
          done < "$ECHO_DIR/.all_dirs.txt"

          echo "[ECHO] Created $(wc -l < "$ECHO_DIR/.all_dirs.txt") directories (repo+mount)"

      - name: 📏 Online resize — ALWAYS (no skip) — FULL ECHO
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/40_resize.log") 2>&1
          set -x
          MNT="${{ inputs.mount_point }}"; FST="${{ inputs.fs_type }}"
          CUR_BYTES="$(stat -c%s "${DISK_IMG}")"
          CUR_MB=$(( (CUR_BYTES + 1048575) / 1048576 ))
          REQ_MB="${{ inputs.resize_to_mb }}"
          if [[ -z "$REQ_MB" ]]; then NEW_MB="$CUR_MB"; else NEW_MB="$REQ_MB"; fi
          echo "[ECHO] Current=${CUR_MB}MB, Requested=${NEW_MB}MB"
          if (( NEW_MB > CUR_MB )); then run_cmd "truncate -s ${NEW_MB}M \"${DISK_IMG}\""; else echo "[ECHO] No file growth needed"; fi
          LOOP_DEV="$(sudo losetup -j "${DISK_IMG}" | awk -F: '{print $1}')"
          [[ -z "$LOOP_DEV" ]] && { echo "[ERROR] loop device not found"; exit 1; }
          run_cmd "sudo losetup -c \"${LOOP_DEV}\""
          case "$FST" in
            ext4)  run_cmd "sudo resize2fs \"${LOOP_DEV}\"" ;;
            xfs)   run_cmd "sudo xfs_growfs \"${MNT}\"" ;;
            btrfs) run_cmd "sudo btrfs filesystem resize max \"${MNT}\"" ;;
            *) echo "[ERROR] Unsupported fs_type: $FST"; exit 1 ;;
          esac
          run_cmd "df -h \"${MNT}\""
          write_echo "$ECHO_DIR/resize_${FST}.sh" \
            "CUR_BYTES=\$(stat -c%s \"${DISK_IMG}\")" \
            "CUR_MB=\$(( (CUR_BYTES + 1048575) / 1048576 ))" \
            "NEW_MB=${NEW_MB}" \
            "[[ \$NEW_MB -gt \$CUR_MB ]] && truncate -s \${NEW_MB}M \"${DISK_IMG}\" || true" \
            "LOOP_DEV=\$(sudo losetup -j disk.img | awk -F: '{print \$1}')" \
            "sudo losetup -c \"\${LOOP_DEV}\"" \
            $([ "${{ inputs.fs_type }}" = "ext4" ] && echo "\"sudo resize2fs \\\"\${LOOP_DEV}\\\"\"" || true) \
            $([ "${{ inputs.fs_type }}" = "xfs" ] && echo "\"sudo xfs_growfs \\\"${MNT}\\\"\"" || true) \
            $([ "${{ inputs.fs_type }}" = "btrfs" ] && echo "\"sudo btrfs filesystem resize max \\\"${MNT}\\\"\"" || true)

      - name: 📊 Size reports (no broken-pipe) — FULL ECHO
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/45_sizes.log") 2>&1
          set -x
          mkdir -p .github/echo_monitoring
          # avoid broken pipe: guard with || true and use head safely
          run_cmd "du -ah . | sort -hr | head -n 50 > .github/echo_monitoring/top_file_sizes.txt || true"
          run_cmd "du -sh . > .github/echo_monitoring/total_size.txt || true"
          run_cmd "df -h > .github/echo_monitoring/df_all.txt || true"
          write_echo "$ECHO_DIR/size_reports.sh" \
            "mkdir -p .github/echo_monitoring" \
            "du -ah . | sort -hr | head -n 50 > .github/echo_monitoring/top_file_sizes.txt || true" \
            "du -sh . > .github/echo_monitoring/total_size.txt || true" \
            "df -h > .github/echo_monitoring/df_all.txt || true"

      - name: 📝 .gitignore (avoid committing disk.img, logs)
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/50_gitignore.log") 2>&1
          set -x
          echo -e "\n# auto-generated\n${DISK_IMG}\n*.img\n.github/echo_logs/*.log\n" >> .gitignore
          run_cmd "tail -n 20 .gitignore || true"
          write_echo "$ECHO_DIR/add_gitignore.sh" \
            "echo -e \"\\n# auto-generated\\n${DISK_IMG}\\n*.img\\n.github/echo_logs/*.log\\n\" >> .gitignore"

      - name: ✅ Commit & (optional) push — FULL ECHO
        if: ${{ inputs.commit_and_push == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/60_commit_push.log") 2>&1
          set -x
          git config user.name "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"
          TARGET_BR="${GITHUB_REF_NAME}"
          CURRENT="$(git rev-parse --abbrev-ref HEAD)"
          if [[ "$CURRENT" != "$TARGET_BR" ]]; then
            git fetch origin "$TARGET_BR" || true
            git checkout -B "$TARGET_BR" "origin/$TARGET_BR" 2>/dev/null || git checkout -B "$TARGET_BR"
          fi
          # add all created dirs (gitkeep ensures non-empty)
          mapfile -t DIRS < "$ECHO_DIR/.all_dirs.txt"
          git add .gitignore .github/echo_scripts .github/echo_logs .github/echo_monitoring "${DIRS[@]/#/.\/}"
          if git diff --cached --quiet; then
            echo "[ECHO] No changes to commit."
          else
            git commit -m "${{ inputs.commit_message }}"
            git push origin "$TARGET_BR"
            echo "[ECHO] Pushed to origin/$TARGET_BR"
          fi

      - name: 📦 Upload artifacts (logs + echo scripts)
        uses: actions/upload-artifact@v4
        with:
          name: springboot-disk-dirs-echo
          path: |
            .github/echo_logs/**
            .github/echo_scripts/**
            .github/echo_monitoring/**
          retention-days: 7

      # Per request: NO unmount/losetup detach step
