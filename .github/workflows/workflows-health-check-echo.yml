name: "🧹 Actions Failed Cleaner (Auto Token + Auto-Enable + FORCE Delete + Table Ingest + Echo)"

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "몇 시간 이내 실패 run 정리(기본 720=30일)"
        default: "720"
        required: true
      delete_limit:
        description: "최대 삭제 run 개수 상한"
        default: "1000"
        required: true
      dry_run:
        description: "실제 수행 대신 출력만 (true/false)"
        default: "false"
        required: true
      disable_on_failure:
        description: "최근 실행 실패한 워크플로우 Disable"
        default: "true"
        required: true
      enable_on_success:
        description: "연속 성공 시 비활성 워크플로우 Enable"
        default: "true"
        required: true
      success_streak:
        description: "재활성화 조건: 최근 연속 성공 횟수"
        default: "1"
        required: true
      protect_patterns:
        description: "보호 패턴(,로 구분, 예: 'health,deploy')"
        default: ""
        required: false
      policy_mode:
        description: "force_delete | pr_delete | backup_then_delete | backup_then_pr | disable_only"
        default: "force_delete"
        required: true
      commit_message_prefix:
        description: "커밋 메시지 접두사"
        default: "[FORCE-PURGE]"
        required: true
      advanced_json:
        description: "고급설정 JSON (예: {\"backup_branch\":\"workflow-purge-backup\",\"delete_branch_name\":\"workflow-purge-branch\",\"results_dir\":\"site/reports\",\"commit_results\":true})"
        default: "{}"
        required: false

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  TARGET_OWNER: "davidkims"
  TARGET_REPO: "springboot"

jobs:
  clean-and-toggle-and-purge:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Install openssl & jq & sqlite3 + Echo
        run: |
          set -Eeuo pipefail
          echo "[INIT] Installing openssl, jq, sqlite3 ..."
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y openssl jq sqlite3 >/dev/null 2>&1
          echo "[OK] Tools ready."

      - name: 🔑 Acquire Admin Token (Auto) — PAT → App → GITHUB_TOKEN
        id: tok
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_INSTALLATION_ID: ${{ secrets.APP_INSTALLATION_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          echo "[TOK] Start acquiring token ..."
          MASK(){ echo "::add-mask::$1"; }
          USE_TOKEN=""
          if [ -n "${GH_ADMIN_TOKEN:-}" ]; then
            echo "[TOK] Using provided GH_ADMIN_TOKEN (PAT)."
            USE_TOKEN="${GH_ADMIN_TOKEN}"
          elif [ -n "${APP_ID:-}" ] && [ -n "${APP_INSTALLATION_ID:-}" ] && [ -n "${APP_PRIVATE_KEY:-}" ]; then
            echo "[TOK] Minting GitHub App installation token ..."
            NOW=$(date -u +%s); IAT=$((NOW - 60)); EXP=$((NOW + 540))
            HEADER_BASE64=$(printf '{"alg":"RS256","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')
            PAYLOAD=$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$IAT" "$EXP" "$APP_ID")
            PAYLOAD_BASE64=$(printf '%s' "$PAYLOAD" | openssl base64 -A | tr '+/' '-_' | tr -d '=')
            UNSIGNED="${HEADER_BASE64}.${PAYLOAD_BASE64}"
            KEYFILE="app_private_key.pem"; printf "%s" "$APP_PRIVATE_KEY" > "$KEYFILE"; chmod 600 "$KEYFILE"
            SIGNATURE=$(printf '%s' "$UNSIGNED" | openssl dgst -sha256 -sign "$KEYFILE" | openssl base64 -A | tr '+/' '-_' | tr -d '=')
            JWT="${UNSIGNED}.${SIGNATURE}"; MASK "$JWT"
            INSTALL_TOKEN_JSON=$(curl -fsSL \
              -H "Authorization: Bearer ${JWT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -X POST "https://api.github.com/app/installations/${APP_INSTALLATION_ID}/access_tokens")
            USE_TOKEN=$(echo "$INSTALL_TOKEN_JSON" | jq -r '.token')
            [ -z "$USE_TOKEN" -o "$USE_TOKEN" = "null" ] && { echo "[ERR] Failed to mint installation token." >&2; exit 1; }
            MASK "$USE_TOKEN"; echo "[TOK] App installation token acquired."
          else
            echo "[TOK] No PAT/App creds. Checking if this job runs on the target repo ..."
            if [ "${{ github.repository_owner }}" = "${TARGET_OWNER}" ] && [ "${{ github.event.repository.name }}" = "${TARGET_REPO}" ]; then
              echo "[TOK] Using GITHUB_TOKEN on target repo."
              USE_TOKEN="${GITHUB_TOKEN}"
            else
              echo "[ERR] No token source available. Provide PAT or App creds, or run on target repo." >&2
              exit 2
            fi
          fi
          echo "::add-mask::$USE_TOKEN"
          echo "GH_ADMIN_TOKEN=$USE_TOKEN" >> "$GITHUB_ENV"
          echo "token_ready=true" >> "$GITHUB_OUTPUT"

      - name: 🧠 Resolve policy_mode → flags & parse advanced_json
        id: policy
        run: |
          set -Eeuo pipefail
          MODE="${{ github.event.inputs.policy_mode }}"
          ADV='${{ github.event.inputs.advanced_json }}'
          echo "[POLICY] mode=${MODE}"
          echo "[POLICY] advanced_json=${ADV}"
          # policy → flags
          HARD_DELETE="true"; PR_MODE="false"; BACKUP_BEFORE_DELETE="false"
          BACKUP_BRANCH="$(echo "${ADV}" | jq -r '.backup_branch // "workflow-purge-backup"')"
          DELETE_BRANCH_NAME="$(echo "${ADV}" | jq -r '.delete_branch_name // "workflow-purge-branch"')"
          RESULTS_DIR="$(echo "${ADV}" | jq -r '.results_dir // "site/reports"')"
          COMMIT_RESULTS="$(echo "${ADV}" | jq -r '.commit_results // false')"
          case "$MODE" in
            force_delete)        HARD_DELETE="true";  PR_MODE="false"; BACKUP_BEFORE_DELETE="false" ;;
            pr_delete)           HARD_DELETE="true";  PR_MODE="true";  BACKUP_BEFORE_DELETE="false" ;;
            backup_then_delete)  HARD_DELETE="true";  PR_MODE="false"; BACKUP_BEFORE_DELETE="true"  ;;
            backup_then_pr)      HARD_DELETE="true";  PR_MODE="true";  BACKUP_BEFORE_DELETE="true"  ;;
            disable_only)        HARD_DELETE="false"; PR_MODE="false"; BACKUP_BEFORE_DELETE="false" ;;
            *) echo "[WARN] Unknown policy_mode. Fallback=force_delete";;
          esac
          {
            echo "HARD_DELETE=${HARD_DELETE}"
            echo "PR_MODE=${PR_MODE}"
            echo "BACKUP_BEFORE_DELETE=${BACKUP_BEFORE_DELETE}"
            echo "BACKUP_BRANCH=${BACKUP_BRANCH}"
            echo "DELETE_BRANCH_NAME=${DELETE_BRANCH_NAME}"
            echo "RESULTS_DIR=${RESULTS_DIR}"
            echo "COMMIT_RESULTS=${COMMIT_RESULTS}"
          } >> "$GITHUB_ENV"
          echo "[POLICY] HARD_DELETE=${HARD_DELETE} PR_MODE=${PR_MODE} BACKUP_BEFORE_DELETE=${BACKUP_BEFORE_DELETE}"
          echo "[POLICY] RESULTS_DIR=${RESULTS_DIR} COMMIT_RESULTS=${COMMIT_RESULTS}"

      - name: 🛡️ Preflight & Config Echo
        run: |
          set -Eeuo pipefail
          echo "[CHECK] TARGET_OWNER=${TARGET_OWNER}"
          echo "[CHECK] TARGET_REPO=${TARGET_REPO}"
          echo "[CHECK] lookback_hours=${{ github.event.inputs.lookback_hours }}"
          echo "[CHECK] delete_limit=${{ github.event.inputs.delete_limit }}"
          echo "[CHECK] dry_run=${{ github.event.inputs.dry_run }}"
          echo "[CHECK] disable_on_failure=${{ github.event.inputs.disable_on_failure }}"
          echo "[CHECK] enable_on_success=${{ github.event.inputs.enable_on_success }}"
          echo "[CHECK] success_streak=${{ github.event.inputs.success_streak }}"
          echo "[CHECK] protect_patterns='${{ github.event.inputs.protect_patterns }}'"
          echo "[CHECK] policy_mode=${{ github.event.inputs.policy_mode }}"
          echo "[CHECK] commit_message_prefix='${{ github.event.inputs.commit_message_prefix }}'"
          echo "[CHECK] (derived) HARD_DELETE=${HARD_DELETE} PR_MODE=${PR_MODE} BACKUP_BEFORE_DELETE=${BACKUP_BEFORE_DELETE}"
          echo "[CHECK] (derived) BACKUP_BRANCH=${BACKUP_BRANCH} DELETE_BRANCH_NAME=${DELETE_BRANCH_NAME}"
          echo "[CHECK] (derived) RESULTS_DIR=${RESULTS_DIR} COMMIT_RESULTS=${COMMIT_RESULTS}"

      - name: 📄 Generate cleaner+purger program (scripts/failed_cleaner.sh)
        run: |
          set -Eeuo pipefail
          mkdir -p scripts
          cat > scripts/failed_cleaner.sh <<'BASH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          trap 'rc=$?; echo "[CLEANER][ERR] ${BASH_COMMAND} (rc=${rc})" >&2; exit $rc' ERR
          echoe(){ printf "%s\n" "$*"; }

          OWNER="${TARGET_OWNER}"; REPO="${TARGET_REPO}"; TOKEN="${GH_ADMIN_TOKEN}"
          LOOKBACK_HOURS="${LOOKBACK_HOURS:-720}"; DELETE_LIMIT="${DELETE_LIMIT:-1000}"; DRY_RUN="${DRY_RUN:-false}"
          DISABLE_ON_FAILURE="${DISABLE_ON_FAILURE:-true}"; ENABLE_ON_SUCCESS="${ENABLE_ON_SUCCESS:-true}"; SUCCESS_STREAK="${SUCCESS_STREAK:-1}"
          PROTECT_PATTERNS="${PROTECT_PATTERNS:-}"

          HARD_DELETE="${HARD_DELETE:-true}"; PR_MODE="${PR_MODE:-false}"; BACKUP_BEFORE_DELETE="${BACKUP_BEFORE_DELETE:-false}"
          BACKUP_BRANCH="${BACKUP_BRANCH:-workflow-purge-backup}"; DELETE_BRANCH_NAME="${DELETE_BRANCH_NAME:-workflow-purge-branch}"
          COMMIT_MESSAGE_PREFIX="${COMMIT_MESSAGE_PREFIX:-[FORCE-PURGE]}"
          RESULTS_DIR="${RESULTS_DIR:-site/reports}"

          API="https://api.github.com"
          HDR_AUTH="Authorization: Bearer ${TOKEN}"; HDR_ACC="Accept: application/vnd.github+json"; HDR_VER="X-GitHub-Api-Version: 2022-11-28"

          ts="$(date -u +%Y%m%d%H%M%S)"
          mkdir -p "${RESULTS_DIR}"
          CSV="${RESULTS_DIR}/actions_purge_${ts}.csv"
          JSONL="${RESULTS_DIR}/actions_purge_${ts}.jsonl"
          MD="${RESULTS_DIR}/actions_purge_${ts}.md"

          # CSV header
          echo "timestamp,repo,workflow_id,workflow_name,workflow_path,action,target_id,created_at,run_created_at,note" > "${CSV}"

          log_row(){ # action,target_id,note,workflow info present in env
            printf "%s,%s,%s,%s,%s,%s,%s,%s,%s,%s\n" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "${OWNER}/${REPO}" \
              "${wf_id:-}" "${wf_name//,/ }" "${wf_path:-}" \
              "$1" "$2" "${latest_created_at:-}" "${run_created_at:-}" "${3//,/ }" >> "${CSV}"
            printf '{"timestamp":"%s","repo":"%s/%s","workflow_id":"%s","workflow_name":"%s","workflow_path":"%s","action":"%s","target_id":"%s","created_at":"%s","run_created_at":"%s","note":"%s"}\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${OWNER}" "${REPO}" \
              "${wf_id:-}" "${wf_name//\"/\\\"}" "${wf_path:-}" \
              "$1" "$2" "${latest_created_at:-}" "${run_created_at:-}" "${3//\"/\\\"}" >> "${JSONL}"
          }

          api_get(){ curl -fsSL -H "${HDR_AUTH}" -H "${HDR_ACC}" -H "${HDR_VER}" "$1"; }
          api_post(){ curl -fsS -X POST -H "${HDR_AUTH}" -H "${HDR_ACC}" -H "${HDR_VER}" -H "Content-Type: application/json" -d "$2" "$1"; }
          api_put(){ curl -fsS -X PUT -H "${HDR_AUTH}" -H "${HDR_ACC}" -H "${HDR_VER}" -H "Content-Type: application/json" -d "$2" "$1"; }
          api_delete(){ curl -fsS -X DELETE -H "${HDR_AUTH}" -H "${HDR_ACC}" -H "${HDR_VER}" "$1"; }

          now_epoch="$(date -u +%s)"; cutoff_epoch=$(( now_epoch - LOOKBACK_HOURS*3600 ))

          # Markdown table init
          {
            echo "# Actions Purge Report (${ts} UTC)"
            echo ""
            echo "| timestamp | repo | workflow_id | workflow_name | workflow_path | action | target_id | created_at | run_created_at | note |"
            echo "|---|---|---:|---|---|---|---|---|---|---|"
          } > "${MD}"

          add_md_row(){ # same fields as CSV
            printf "| %s | %s | %s | %s | %s | %s | %s | %s | %s | %s |\n" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "${OWNER}/${REPO}" \
              "${wf_id:-}" "${wf_name//|/ }" "${wf_path:-}" \
              "$1" "$2" "${latest_created_at:-}" "${run_created_at:-}" "${3//|/ }" >> "${MD}"
          }

          echoe "[STEP] Fetch repo & default branch ..."
          repo_json="$(api_get "${API}/repos/${OWNER}/${REPO}")"
          default_branch="$(echo "${repo_json}" | jq -r '.default_branch')"
          base_ref_json="$(api_get "${API}/repos/${OWNER}/${REPO}/git/ref/heads/${default_branch}")"
          base_sha="$(echo "${base_ref_json}" | jq -r '.object.sha')"
          echoe "[INFO] default_branch=${default_branch} base_sha=${base_sha}"

          create_branch_if_missing(){
            local branch="$1"
            if curl -fsS -o /dev/null -H "${HDR_AUTH}" -H "${HDR_ACC}" -H "${HDR_VER}" "${API}/repos/${OWNER}/${REPO}/git/ref/heads/${branch}"; then
              echoe "[BRANCH] ${branch} already exists."; return 0
            fi
            echoe "[BRANCH] creating ${branch} from ${default_branch} (${base_sha})"
            [ "${DRY_RUN}" = "true" ] && { echoe "[DRY] create ref ${branch}"; return 0; }
            api_post "${API}/repos/${OWNER}/${REPO}/git/refs" "$(jq -n --arg ref "refs/heads/${branch}" --arg sha "${base_sha}" '{ref:$ref, sha:$sha}')" >/dev/null
          }

          get_file_sha(){ api_get "${API}/repos/${OWNER}/${REPO}/contents/$1?ref=$2" | jq -r '.sha'; }

          delete_file_on_branch(){
            local path="$1" branch="$2" msg="$3"
            local sha; sha="$(get_file_sha "${path}" "${branch}")"
            if [ -z "${sha}" ] || [ "${sha}" = "null" ]; then
              echoe "[DEL-FILE] Not found: ${path} on ${branch}"
              log_row "delete_file_skip" "${path}" "not_found_on_${branch}"
              add_md_row "delete_file_skip" "${path}" "not_found_on_${branch}"
              return 0
            fi
            echoe "[DEL-FILE] ${path} (sha=${sha}) on ${branch}"
            if [ "${DRY_RUN}" = "true" ]; then
              echoe "[DRY] DELETE ${path} on ${branch} msg='${msg}'"
              log_row "delete_file_dry" "${path}" "${branch}"
              add_md_row "delete_file_dry" "${path}" "${branch}"
              return 0
            fi
            curl -fsS -X DELETE -H "${HDR_AUTH}" -H "${HDR_ACC}" -H "${HDR_VER}" -H "Content-Type: application/json" \
              -d "$(jq -n --arg message "${msg}" --arg sha "${sha}" --arg branch "${branch}" '{message:$message, sha:$sha, branch:$branch}')" \
              "${API}/repos/${OWNER}/${REPO}/contents/${path}" >/dev/null
            log_row "delete_file" "${path}" "${branch}"
            add_md_row "delete_file" "${path}" "${branch}"
          }

          copy_file_between_branches(){
            local path="$1" from_branch="$2" to_branch="$3" msg="$4"
            local blob_json file_sha content_b64
            blob_json="$(api_get "${API}/repos/${OWNER}/${REPO}/contents/${path}?ref=${from_branch}")"
            file_sha="$(echo "${blob_json}" | jq -r '.sha')"
            if [ "${file_sha}" = "null" ] || [ -z "${file_sha}" ]; then
              echoe "[BACKUP] Skip copy (missing): ${path}"
              log_row "backup_skip" "${path}" "missing_on_${from_branch}"
              add_md_row "backup_skip" "${path}" "missing_on_${from_branch}"
              return 0
            fi
            content_b64="$(echo "${blob_json}" | jq -r '.content' | tr -d '\n')"
            if [ "${DRY_RUN}" = "true" ]; then
              echoe "[DRY] COPY ${path} ${from_branch} -> ${to_branch} msg='${msg}'"
              log_row "backup_dry" "${path}" "${to_branch}"
              add_md_row "backup_dry" "${path}" "${to_branch}"
              return 0
            fi
            curl -fsS -X PUT -H "${HDR_AUTH}" -H "${HDR_ACC}" -H "${HDR_VER}" -H "Content-Type: application/json" \
              -d "$(jq -n --arg message "${msg}" --arg content "${content_b64}" --arg branch "${to_branch}" '{message:$message, content:$content, branch:$branch}')" \
              "${API}/repos/${OWNER}/${REPO}/contents/${path}" >/dev/null
            log_row "backup" "${path}" "${to_branch}"
            add_md_row "backup" "${path}" "${to_branch}"
          }

          is_protected_workflow(){
            local name="$1" path="$2"
            if [ -z "${PROTECT_PATTERNS}" ]; then return 1; fi
            IFS=',' read -r -a pats <<< "${PROTECT_PATTERNS}"
            for p in "${pats[@]}"; do
              p_trim="$(echo "$p" | xargs)"; [ -z "${p_trim}" ] && continue
              if [[ "${name,,}" == *"${p_trim,,}"* ]] || [[ "${path,,}" == *"${p_trim,,}"* ]]; then
                return 0
              fi
            done
            return 1
          }

          # 필요 브랜치
          if [ "${BACKUP_BEFORE_DELETE}" = "true" ]; then create_branch_if_missing "${BACKUP_BRANCH}"; fi
          if [ "${PR_MODE}" = "true" ]; then create_branch_if_missing "${DELETE_BRANCH_NAME}"; fi

          workflows_json="$(api_get "${API}/repos/${OWNER}/${REPO}/actions/workflows?per_page=100")"
          count_wf="$(echo "${workflows_json}" | jq '.workflows | length')"
          echoe "[INFO] workflows=${count_wf}"

          deleted_runs=0; disabled_wf=0; enabled_wf=0; deleted_files=0; backed_up_files=0
          declare -a delete_paths

          now_epoch="$(date -u +%s)"; cutoff_epoch=$(( now_epoch - LOOKBACK_HOURS*3600 ))

          for ((i=0; i<count_wf; i++)); do
            wf_id="$(echo "${workflows_json}" | jq -r ".workflows[${i}].id")"
            wf_name="$(echo "${workflows_json}" | jq -r ".workflows[${i}].name")"
            wf_path="$(echo "${workflows_json}" | jq -r ".workflows[${i}].path")"
            wf_state="$(echo "${workflows_json}" | jq -r ".workflows[${i}].state")"
            echoe "[WF] id=${wf_id} name='${wf_name}' path='${wf_path}' state=${wf_state}"

            runs_all="$(api_get "${API}/repos/${OWNER}/${REPO}/actions/workflows/${wf_id}/runs?per_page=100&status=completed")"
            runs_len="$(echo "${runs_all}" | jq '.workflow_runs | length')"
            [ "${runs_len}" -eq 0 ] && echoe "[WF] No completed runs."

            # 실패 run 삭제
            for ((j=0; j<runs_len; j++)); do
              concl="$(echo "${runs_all}" | jq -r ".workflow_runs[${j}].conclusion // empty")"
              run_id="$(echo "${runs_all}" | jq -r ".workflow_runs[${j}].id")"
              run_created_at="$(echo "${runs_all}" | jq -r ".workflow_runs[${j}].created_at // empty")"
              [ -z "${concl}" ] && continue
              [ "${concl}" != "failure" ] && continue
              [ -z "${run_created_at}" ] && continue
              run_epoch="$(date -u -d "${run_created_at}" +%s || echo 0)"
              (( run_epoch < cutoff_epoch )) && continue
              echoe "[DEL-RUN] run_id=${run_id} conclusion=${concl} created_at=${run_created_at}"
              if [ "${DRY_RUN}" = "true" ]; then
                echoe "[DRY] DELETE /actions/runs/${run_id}"
                log_row "delete_run_dry" "${run_id}" ""
                add_md_row "delete_run_dry" "${run_id}" ""
              else
                api_delete "${API}/repos/${OWNER}/${REPO}/actions/runs/${run_id}" >/dev/null
                log_row "delete_run" "${run_id}" ""
                add_md_row "delete_run" "${run_id}" ""
              fi
              deleted_runs=$((deleted_runs+1))
              (( deleted_runs >= DELETE_LIMIT )) && echoe "[WARN] DELETE_LIMIT reached. stop." && break 2
            done

            latest_conclusion="$(echo "${runs_all}" | jq -r '.workflow_runs[0].conclusion // "none"')"
            latest_created_at="$(echo "${runs_all}" | jq -r '.workflow_runs[0].created_at // empty')"
            echoe "[WF] latest_conclusion=${latest_conclusion} latest_created_at=${latest_created_at}"

            # 실패 → Disable
            if [ "${latest_conclusion}" = "failure" ] && [ "${DISABLE_ON_FAILURE}" = "true" ]; then
              if is_protected_workflow "${wf_name}" "${wf_path}"; then
                echoe "[SKIP] Protected. Skip disable: ${wf_name}"
                log_row "disable_skip_protected" "${wf_id}" "${wf_path}"
                add_md_row "disable_skip_protected" "${wf_id}" "${wf_path}"
              else
                echoe "[DISABLE] workflow_id=${wf_id} name='${wf_name}'"
                if [ "${DRY_RUN}" = "true" ]; then
                  echoe "[DRY] PUT /actions/workflows/${wf_id}/disable"
                  log_row "disable_dry" "${wf_id}" ""
                  add_md_row "disable_dry" "${wf_id}" ""
                else
                  curl -fsS -X PUT -H "${HDR_AUTH}" -H "${HDR_ACC}" -H "${HDR_VER}" "${API}/repos/${OWNER}/${REPO}/actions/workflows/${wf_id}/disable" >/dev/null
                  log_row "disable" "${wf_id}" ""
                  add_md_row "disable" "${wf_id}" ""
                fi
                disabled_wf=$((disabled_wf+1))
              fi
            fi

            # 연속 성공 → disabled_* 이면 Enable
            if [ "${ENABLE_ON_SUCCESS}" = "true" ]; then
              streak=0
              for ((k=0; k<runs_len; k++)); do
                c="$(echo "${runs_all}" | jq -r ".workflow_runs[${k}].conclusion // empty")"
                [ -z "${c}" ] && break
                if [ "${c}" = "success" ]; then streak=$((streak+1)); else break; fi
              done
              echoe "[WF] success_streak_detected=${streak} (target=${SUCCESS_STREAK})"
              if [[ "${wf_state}" == disabled_* ]] && (( streak >= SUCCESS_STREAK )); then
                echoe "[ENABLE] workflow_id=${wf_id} name='${wf_name}'"
                if [ "${DRY_RUN}" = "true" ]; then
                  echoe "[DRY] PUT /actions/workflows/${wf_id}/enable"
                  log_row "enable_dry" "${wf_id}" ""
                  add_md_row "enable_dry" "${wf_id}" ""
                else
                  curl -fsS -X PUT -H "${HDR_AUTH}" -H "${HDR_ACC}" -H "${HDR_VER}" "${API}/repos/${OWNER}/${REPO}/actions/workflows/${wf_id}/enable" >/dev/null
                  log_row "enable" "${wf_id}" ""
                  add_md_row "enable" "${wf_id}" ""
                fi
                enabled_wf=$((enabled_wf+1))
              else
                log_row "enable_skip" "${wf_id}" "state=${wf_state} streak=${streak}"
                add_md_row "enable_skip" "${wf_id}" "state=${wf_state} streak=${streak}"
              fi
            fi

            # 정책에 따른 파일 삭제 흐름
            if [ "${HARD_DELETE}" = "true" ] && [ -n "${wf_path}" ] && [ "${wf_path}" != "null" ]; then
              if is_protected_workflow "${wf_name}" "${wf_path}"; then
                echoe "[SKIP] Protected. Skip file delete: ${wf_path}"
                log_row "delete_file_skip_protected" "${wf_path}" ""
                add_md_row "delete_file_skip_protected" "${wf_path}" ""
              else
                [ "${BACKUP_BEFORE_DELETE}" = "true" ] && {
                  echoe "[BACKUP] ${wf_path} -> branch ${BACKUP_BRANCH}"
                  copy_file_between_branches "${wf_path}" "${default_branch}" "${BACKUP_BRANCH}" "${COMMIT_MESSAGE_PREFIX} backup ${wf_path}"
                  backed_up_files=$((backed_up_files+1))
                }
                target_branch="${default_branch}"
                [ "${PR_MODE}" = "true" ] && target_branch="${DELETE_BRANCH_NAME}"
                echoe "[PURGE] Deleting workflow file on ${target_branch}: ${wf_path}"
                delete_file_on_branch "${wf_path}" "${target_branch}" "${COMMIT_MESSAGE_PREFIX} purge ${wf_path}"
                delete_paths+=("${wf_path}")
                deleted_files=$((deleted_files+1))
              fi
            fi
          done

          # PR 생성
          if [ "${PR_MODE}" = "true" ] && [ "${#delete_paths[@]}" -gt 0 ]; then
            title="${COMMIT_MESSAGE_PREFIX} purge ${#delete_paths[@]} workflow files"
            body="Auto purge of failed workflows.\nDeleted files:\n$(printf '%s\n' "${delete_paths[@]}")"
            echoe "[PR] Creating PR: ${DELETE_BRANCH_NAME} -> ${default_branch}"
            if [ "${DRY_RUN}" = "true" ]; then
              echoe "[DRY] POST /pulls title='${title}'"
              log_row "pr_create_dry" "${DELETE_BRANCH_NAME}" "${title}"
              add_md_row "pr_create_dry" "${DELETE_BRANCH_NAME}" "${title}"
            else
              api_post "${API}/repos/${OWNER}/${REPO}/pulls" \
                "$(jq -n --arg title "${title}" --arg head "${DELETE_BRANCH_NAME}" --arg base "${default_branch}" --arg body "${body}" '{title:$title, head:$head, base:$base, body:$body}')" >/dev/null
              log_row "pr_create" "${DELETE_BRANCH_NAME}" "${title}"
              add_md_row "pr_create" "${DELETE_BRANCH_NAME}" "${title}"
            fi
          fi

          echoe "[RESULT] deleted_runs=${deleted_runs} disabled_workflows=${disabled_wf} enabled_workflows=${enabled_wf} deleted_files=${deleted_files} backed_up_files=${backed_up_files}"

          # Markdown tail
          {
            echo ""
            echo "- deleted_runs: ${deleted_runs}"
            echo "- disabled_workflows: ${disabled_wf}"
            echo "- enabled_workflows: ${enabled_wf}"
            echo "- deleted_files: ${deleted_files}"
            echo "- backed_up_files: ${backed_up_files}"
          } >> "${MD}"

          # 최종 경로 출력
          echo "CSV_PATH=${CSV}" >> "$GITHUB_OUTPUT"
          echo "JSONL_PATH=${JSONL}" >> "$GITHUB_OUTPUT"
          echo "MD_PATH=${MD}" >> "$GITHUB_OUTPUT"
          BASH
          chmod +x scripts/failed_cleaner.sh
          echo "[OK] Program generated: scripts/failed_cleaner.sh"

      - name: ▶️ Run cleaner (Echo on)
        id: run_cleaner
        env:
          GH_ADMIN_TOKEN: ${{ env.GH_ADMIN_TOKEN }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours }}
          DELETE_LIMIT: ${{ github.event.inputs.delete_limit }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DISABLE_ON_FAILURE: ${{ github.event.inputs.disable_on_failure }}
          ENABLE_ON_SUCCESS: ${{ github.event.inputs.enable_on_success }}
          SUCCESS_STREAK: ${{ github.event.inputs.success_streak }}
          PROTECT_PATTERNS: ${{ github.event.inputs.protect_patterns }}
          COMMIT_MESSAGE_PREFIX: ${{ github.event.inputs.commit_message_prefix }}
          HARD_DELETE: ${{ env.HARD_DELETE }}
          PR_MODE: ${{ env.PR_MODE }}
          BACKUP_BEFORE_DELETE: ${{ env.BACKUP_BEFORE_DELETE }}
          BACKUP_BRANCH: ${{ env.BACKUP_BRANCH }}
          DELETE_BRANCH_NAME: ${{ env.DELETE_BRANCH_NAME }}
          RESULTS_DIR: ${{ env.RESULTS_DIR }}
        run: |
          set -Eeuo pipefail
          [ -z "${GH_ADMIN_TOKEN:-}" ] && { echo "[ERROR] No GH_ADMIN_TOKEN in env after Acquire step." >&2; exit 9; }
          echo "[RUN] Executing scripts/failed_cleaner.sh ..."
          ./scripts/failed_cleaner.sh
          echo "[DONE] Cleaner finished."

      - name: 🗃️ Create SQLite DB & ingest table from CSV (purge_events)
        env:
          RESULTS_DIR: ${{ env.RESULTS_DIR }}
        run: |
          set -Eeuo pipefail
          CSV="${{ steps.run_cleaner.outputs.CSV_PATH }}"
          DB="${RESULTS_DIR}/actions_purge.db"
          echo "[DB] Creating DB at ${DB}"
          mkdir -p "${RESULTS_DIR}"
          # 테이블 생성
          sqlite3 "${DB}" <<'SQL'
          PRAGMA journal_mode=WAL;
          CREATE TABLE IF NOT EXISTS purge_events (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            timestamp TEXT,
            repo TEXT,
            workflow_id TEXT,
            workflow_name TEXT,
            workflow_path TEXT,
            action TEXT,
            target_id TEXT,
            created_at TEXT,
            run_created_at TEXT,
            note TEXT
          );
          SQL
          # CSV 적재 (header 스킵)
          echo "[DB] Import CSV -> purge_events"
          tail -n +2 "${CSV}" | sqlite3 -csv "${DB}" ".import /dev/stdin purge_events"
          echo "[DB] Row count:"
          sqlite3 "${DB}" "SELECT COUNT(*) FROM purge_events;" | awk '{print "[DB] rows=" $0}'

      - name: 📦 Upload reports as artifacts (CSV/JSONL/MD/DB)
        uses: actions/upload-artifact@v4
        with:
          name: actions-purge-reports
          path: |
            ${{ steps.run_cleaner.outputs.CSV_PATH }}
            ${{ steps.run_cleaner.outputs.JSONL_PATH }}
            ${{ steps.run_cleaner.outputs.MD_PATH }}
            ${{ env.RESULTS_DIR }}/actions_purge.db

      - name: 💾 (Optional) Commit reports to repo
        if: env.COMMIT_RESULTS == 'true'
        env:
          RESULTS_DIR: ${{ env.RESULTS_DIR }}
          COMMIT_MESSAGE_PREFIX: ${{ github.event.inputs.commit_message_prefix }}
        run: |
          set -Eeuo pipefail
          echo "[GIT] Commit reports into repo (RESULTS_DIR=${RESULTS_DIR})"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${RESULTS_DIR}"
          git commit -m "${COMMIT_MESSAGE_PREFIX} store reports (CSV/JSONL/MD/DB)" || { echo "[GIT] Nothing to commit."; exit 0; }
          git push
