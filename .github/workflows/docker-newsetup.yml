name: 🐳 Docker 환경/에코/로그/디렉토리 존재 통합

on:
  workflow_dispatch:
  schedule:
    - cron: '10 3 * * *'

jobs:
  docker-full-setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Echo/Log/Backup/Dir/Init (All Directory Create + Logging)
        run: |
          set -e
          # Top-level directories
          for topdir in .github/echo .github/logs .github/backup .github/snapshot; do
            mkdir -p "$topdir"
            echo "echo 'mkdir -p $topdir'" | tee -a .github/echo/dir_create_top.log
          done
          touch .github/logs/echo_init.log
          echo "echo 'touch .github/logs/echo_init.log'" | tee -a .github/echo/dir_create_top.log
          # All docker-related echo/log directories
          for d in \
            .github/echo/docker \
            .github/echo/docker/install \
            .github/echo/docker/env \
            .github/echo/docker/image \
            .github/echo/docker/compose \
            .github/echo/docker/sample \
            .github/echo/dockerfile \
            .github/echo/dockerimage \
            .github/echo/dockerlogs \
            .github/echo/dockernetwork \
            .github/echo/dockervol \
            .github/echo/dockerbuild \
            .github/echo/dockerexec \
            .github/echo/dockertest \
            .github/echo/dockerconfig \
            .github/echo/dockerhealth \
            .github/echo/dockerbackup \
            .github/echo/dockerinit \
            .github/echo/dockerhistory \
            .github/echo/dockerresult \
            .github/echo/dockerstats \
            .github/echo/dockerdata \
            .github/echo/dockerrecovery \
            .github/echo/dockersnapshot \
            .github/echo/dockerrepo \
            .github/echo/dockerinfo \
            .github/echo/dockerstatus \
            .github/echo/dockerpolicy \
            .github/echo/dockeroutput \
            .github/echo/dockermonitor \
            .github/echo/dockeralert \
            .github/echo/dockerupgrade \
            .github/echo/dockercheck \
            .github/echo/dockeruser \
            .github/echo/dockersecret; do
              mkdir -p "$d"
              echo "echo 'mkdir -p $d'" | tee -a .github/echo/docker/dir_create.log
          done
          # All log/echo files (pre-touch)
          for logfile in \
            .github/echo/docker/dir_create.log \
            .github/echo/docker/echo_run.log \
            .github/echo/docker/step_error.log \
            .github/echo/docker/healthcheck.log \
            .github/echo/docker/backup_init.log \
            .github/echo/docker/snapshot_init.log \
            .github/echo/docker/docker_install.log \
            .github/echo/docker/docker_env_init.log \
            .github/echo/docker/docker_compose.log; do
              touch "$logfile"
              echo "echo 'touch $logfile'" | tee -a .github/echo/docker/echo_file_create.log
          done
          echo "echo '[Directory/Log/Echo/Backup/Snapshot All Created]'" | tee -a .github/echo/docker/dir_create.log
          echo "[Directory/Log/Echo/Backup/Snapshot All Created]" | tee -a .github/echo/docker/dir_create.log
          echo "ls -alR .github/echo" | tee -a .github/echo/docker/dir_create.log
          ls -alR .github/echo | tee -a .github/echo/docker/dir_create.log

      - name: Docker Install (echo script + real install, 100% echo)
        run: |
          set -e
          # echo script
          echo "echo '[Docker install/upgrade]'" > .github/echo/docker/install/docker_install.sh
          echo "echo 'sudo apt-get update -y'" >> .github/echo/docker/install/docker_install.sh
          echo "sudo apt-get update -y" >> .github/echo/docker/install/docker_install.sh
          echo "echo 'sudo apt-get install -y ca-certificates curl gnupg lsb-release'" >> .github/echo/docker/install/docker_install.sh
          echo "sudo apt-get install -y ca-certificates curl gnupg lsb-release" >> .github/echo/docker/install/docker_install.sh
          echo "echo 'sudo install -m 0755 -d /etc/apt/keyrings'" >> .github/echo/docker/install/docker_install.sh
          echo "sudo install -m 0755 -d /etc/apt/keyrings" >> .github/echo/docker/install/docker_install.sh
          echo "echo 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg'" >> .github/echo/docker/install/docker_install.sh
          echo "curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg" >> .github/echo/docker/install/docker_install.sh
          echo "echo 'echo \"deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \$(lsb_release -cs) stable\" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null'" >> .github/echo/docker/install/docker_install.sh
          echo "echo \"deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \$(lsb_release -cs) stable\" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null" >> .github/echo/docker/install/docker_install.sh
          echo "echo 'sudo apt-get update -y'" >> .github/echo/docker/install/docker_install.sh
          echo "sudo apt-get update -y" >> .github/echo/docker/install/docker_install.sh
          echo "echo 'sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin'" >> .github/echo/docker/install/docker_install.sh
          echo "sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin" >> .github/echo/docker/install/docker_install.sh
          chmod +x .github/echo/docker/install/docker_install.sh

          # real install (with echo+tee)
          echo '[Docker install/upgrade]' | tee -a .github/echo/docker/install/docker_install.log

          echo 'sudo apt-get update -y' | tee -a .github/echo/docker/install/docker_install.log
          sudo apt-get update -y 2>&1 | tee -a .github/echo/docker/install/docker_install.log

          echo 'sudo apt-get install -y ca-certificates curl gnupg lsb-release' | tee -a .github/echo/docker/install/docker_install.log
          sudo apt-get install -y ca-certificates curl gnupg lsb-release 2>&1 | tee -a .github/echo/docker/install/docker_install.log

          echo 'sudo install -m 0755 -d /etc/apt/keyrings' | tee -a .github/echo/docker/install/docker_install.log
          sudo install -m 0755 -d /etc/apt/keyrings 2>&1 | tee -a .github/echo/docker/install/docker_install.log

          echo 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg' | tee -a .github/echo/docker/install/docker_install.log
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg 2>&1 | tee -a .github/echo/docker/install/docker_install.log

          echo 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null' | tee -a .github/echo/docker/install/docker_install.log
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null 2>&1 | tee -a .github/echo/docker/install/docker_install.log

          echo 'sudo apt-get update -y' | tee -a .github/echo/docker/install/docker_install.log
          sudo apt-get update -y 2>&1 | tee -a .github/echo/docker/install/docker_install.log

          echo 'sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin' | tee -a .github/echo/docker/install/docker_install.log
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin 2>&1 | tee -a .github/echo/docker/install/docker_install.log

          echo '[Docker install steps complete]' | tee -a .github/echo/docker/install/docker_install.log

      - name: Docker env/compose/Dockerfile echo sample create
        run: |
          set -e
          echo "echo 'DOCKER_USER=runner'" | tee .github/echo/docker/env/docker.env
          echo "DOCKER_USER=runner" > .github/echo/docker/env/docker.env
          echo "echo 'DOCKER_PORT=8080'" | tee -a .github/echo/docker/env/docker.env
          echo "DOCKER_PORT=8080" >> .github/echo/docker/env/docker.env
          echo "echo 'DOCKER_DEBUG=true'" | tee -a .github/echo/docker/env/docker.env
          echo "DOCKER_DEBUG=true" >> .github/echo/docker/env/docker.env

          echo "echo 'version: \"3\"'" | tee .github/echo/docker/compose/docker-compose.yml
          echo "version: \"3\"" > .github/echo/docker/compose/docker-compose.yml
          echo "echo 'services:'" | tee -a .github/echo/docker/compose/docker-compose.yml
          echo "services:" >> .github/echo/docker/compose/docker-compose.yml
          echo "echo '  app:'" | tee -a .github/echo/docker/compose/docker-compose.yml
          echo "  app:" >> .github/echo/docker/compose/docker-compose.yml
          echo "echo '    image: hello-world'" | tee -a .github/echo/docker/compose/docker-compose.yml
          echo "    image: hello-world" >> .github/echo/docker/compose/docker-compose.yml
          echo "echo '    ports:'" | tee -a .github/echo/docker/compose/docker-compose.yml
          echo "    ports:" >> .github/echo/docker/compose/docker-compose.yml
          echo "echo '      - \"8080:80\"'" | tee -a .github/echo/docker/compose/docker-compose.yml
          echo "      - \"8080:80\"" >> .github/echo/docker/compose/docker-compose.yml

          echo "echo 'FROM ubuntu:24.04'" | tee .github/echo/dockerfile/Dockerfile
          echo "FROM ubuntu:24.04" > .github/echo/dockerfile/Dockerfile
          echo "echo 'RUN apt-get update && apt-get install -y nginx'" | tee -a .github/echo/dockerfile/Dockerfile
          echo "RUN apt-get update && apt-get install -y nginx" >> .github/echo/dockerfile/Dockerfile
          echo "echo 'CMD [\"nginx\", \"-g\", \"daemon off;\"]'" | tee -a .github/echo/dockerfile/Dockerfile
          echo "CMD [\"nginx\", \"-g\", \"daemon off;\"]" >> .github/echo/dockerfile/Dockerfile

      - name: Docker build/run/ps echo shell create
        run: |
          set -e
          echo "echo 'docker build -t sample-nginx -f .github/echo/dockerfile/Dockerfile .'" | tee .github/echo/dockerbuild/build_sample_nginx.sh
          echo "docker build -t sample-nginx -f .github/echo/dockerfile/Dockerfile ." >> .github/echo/dockerbuild/build_sample_nginx.sh
          chmod +x .github/echo/dockerbuild/build_sample_nginx.sh

          echo "echo 'docker run --rm -d -p 18080:80 --name nginx1 sample-nginx'" | tee .github/echo/dockerexec/run_sample_nginx.sh
          echo "docker run --rm -d -p 18080:80 --name nginx1 sample-nginx" >> .github/echo/dockerexec/run_sample_nginx.sh
          chmod +x .github/echo/dockerexec/run_sample_nginx.sh

          echo "echo 'docker ps -a'" | tee .github/echo/dockerstats/docker_ps.sh
          echo "docker ps -a" >> .github/echo/dockerstats/docker_ps.sh
          chmod +x .github/echo/dockerstats/docker_ps.sh

      - name: Show final tree/log (echo)
        run: |
          echo "ls -alR .github/echo" | tee .github/echo/docker/final_dirlist.log
          ls -alR .github/echo | tee -a .github/echo/docker/final_dirlist.log
