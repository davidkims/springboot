name: 📡 워크플로 이벤트 모니터링

on:
  workflow_dispatch: {}

  workflow_run:
    types:
      - requested
      - in_progress
      - completed

jobs:
  monitor-run:
    runs-on: ubuntu-latest

    steps:
      - name: 📝 워크플로 실행 세부 정보 기록
        run: |
          echo "이벤트: ${{ github.event.action }}"
          echo "워크플로: ${{ github.event.workflow_run.name }} (#${{ github.event.workflow_run.run_number }})"
          echo "상태: ${{ github.event.workflow_run.status }} / 결론: ${{ github.event.workflow_run.conclusion }}"
          echo "URL: ${{ github.event.workflow_run.html_url }}"

      - name: 📁 실행 메타데이터 저장
        run: |
          printf "이벤트: %s\n워크플로: %s #%s\n상태: %s\n결론: %s\nURL: %s\n" \
            "${{ github.event.action }}" \
            "${{ github.event.workflow_run.name }}" \
            "${{ github.event.workflow_run.run_number }}" \
            "${{ github.event.workflow_run.status }}" \
            "${{ github.event.workflow_run.conclusion }}" \
            "${{ github.event.workflow_run.html_url }}" \
          > run-${{ github.event.workflow_run.id }}.txt

      - name: 📂 런 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: workflow-run-${{ github.event.workflow_run.id }}
          path: run-${{ github.event.workflow_run.id }}.txt

      - name: 🔍 API를 통한 잡 목록 조회
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs \
            > jobs-${{ github.event.workflow_run.id }}.json

      - name: 📂 잡 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: workflow-jobs-${{ github.event.workflow_run.id }}
          path: jobs-${{ github.event.workflow_run.id }}.json
