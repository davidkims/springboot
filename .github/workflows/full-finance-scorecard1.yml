name: 🚀 Full Finance & Scorecard Setup

on:
  workflow_dispatch: # Allows manual triggering from the GitHub UI
  schedule:
    - cron: '0 0 * * 0' # 매주 일요일 00:00 UTC에 실행 (KST 기준 일요일 오전 9시)

jobs:
  full-setup:
    name: Full Setup and Scorecard Scan
    runs-on: ubuntu-latest # 최신 Ubuntu 환경 사용
    permissions:
      contents: read         # 리포지토리 코드 읽기 권한 (체크아웃 및 스코어카드 액션용)
      security-events: write # SARIF 결과를 GitHub 보안 탭에 업로드하기 위한 권한

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4 # 현재 리포지토리 코드 체크아웃

      - name: 📆 Set Date
        id: date # 이 step의 ID를 'date'로 설정하여 출력값을 참조할 수 있게 함
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT" # 현재 날짜를 YYYY-MM-DD 형식으로 GITHUB_OUTPUT에 저장

      - name: 🐳 CLI Tools 설치
        run: |
          echo "Installing necessary CLI tools..."
          sudo apt-get update
          sudo apt-get install -y jq curl unzip bc file # jq, curl, unzip, bc, file 설치

      - name: 🗂️ 디렉토리 준비
        # 필요한 모든 디렉토리들을 미리 생성합니다.
        run: |
          echo "Preparing directories..."
          mkdir -p .github/finance/ledgers \
                   .github/finance/files \
                   .github/scorecard/ledgers \
                   .github/scorecard/files \
                   .github/scorecard/sarif

      - name: 🧾 금융 원장 생성
        run: |
          F=".github/finance/ledgers/ledger_${{steps.date.outputs.date}}.csv"
          echo "name,date,amount,type,card_number" > "$F"
          for i in {1..50}; do
            TXN=$(date -d "$i days ago" +%F)
            TYPE=$( ((i%2)) && echo 신용 || echo 체크 )
            CARD="-"
            [[ "$TYPE" = "신용" ]] && CARD="4111$(printf "%012d" $RANDOM)"
            echo "Customer$i,$TXN,$((RANDOM%9000+1000)).00,$TYPE,$CARD" >> "$F"
          done
          echo "Finance ledger created at: $F"

      - name: 📄 보고서 생성 (Finance)
        run: |
          REPORT_FILE=".github/finance/files/report_${{steps.date.outputs.date}}.txt"
          echo "금융 거래 요약 리포트 - ${{steps.date.outputs.date}}" > "$REPORT_FILE"
          echo "Finance report created at: $REPORT_FILE"

      - name: 🧪 Run OpenSSF Scorecard and Generate SARIF ONLY
        # 핵심 변경: SARIF 파일만 생성하도록 설정합니다.
        # results_format: json 및 output_file 파라미터를 제거하여
        # Scorecard Action이 SARIF 변환에 집중하도록 합니다.
        uses: ossf/scorecard-action@v2.4.2 # 현재 가장 안정적인 v2.x.y 버전 사용
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          # SARIF 결과 파일의 이름을 지정합니다. 이 파일이 유효한 SARIF가 되어야 합니다.
          results_file: .github/scorecard/sarif/scorecard_${{steps.date.outputs.date}}.sarif
          # publish_results: true를 설정하면 Action이 직접 GitHub Code Scanning에 게시할 수 있습니다.
          # 여기서는 명시적인 'upload-sarif' step을 사용하기 위해 주석 처리합니다.
          # publish_results: true

      - name: 🧾 Scorecard 원장 생성
        run: |
          G=".github/scorecard/ledgers/scorecard_${{steps.date.outputs.date}}.csv"
          echo "item,score,comment" > "$G"
          for i in {1..20}; do
            C=$(( RANDOM % 2 ))
            COMMENT=$([ "$C" -eq 0 ] && echo "양호" || echo "개선필요")
            echo "SecurityCheck$i,$((RANDOM%101)),$COMMENT" >> "$G"
          done
          echo "Scorecard ledger created at: $G"

      - name: 📄 보고서 생성 (Scorecard)
        run: |
          OSS_REPORT_FILE=".github/scorecard/files/oss_report_${{steps.date.outputs.date}}.txt"
          echo "오픈소스 보안 점검 리포트 - ${{steps.date.outputs.date}}" > "$OSS_REPORT_FILE"
          echo "Open-source security report created at: $OSS_REPORT_FILE"

      - name: 📜 Provenance 생성
        run: |
          FINANCE_PROVENANCE_FILE=".github/finance/provenance_${{steps.date.outputs.date}}.json"
          echo "{\"type\":\"finance-ledger\",\"date\":\"${{steps.date.outputs.date}}\",\"ledger\":\"ledger_${{steps.date.outputs.date}}.csv\",\"report\":\"report_${{steps.date.outputs.date}}.txt\"}" > "$FINANCE_PROVENANCE_FILE"
          echo "Finance provenance created at: $FINANCE_PROVENANCE_FILE"

          SCORECARD_PROVENANCE_FILE=".github/scorecard/provenance_${{steps.date.outputs.date}}.json"
          echo "{\"type\":\"scorecard-report\",\"date\":\"${{steps.date.outputs.date}}\",\"ledger\":\"scorecard_${{steps.date.outputs.date}}.csv\",\"report\":\"oss_report_${{steps.date.outputs.date}}.txt\"}" > "$SCORECARD_PROVENANCE_FILE"
          echo "Scorecard provenance created at: $SCORECARD_PROVENANCE_FILE"

      - name: 🚀 Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .github/scorecard/sarif/scorecard_${{steps.date.outputs.date}}.sarif
          category: "OpenSSF Scorecard"

      # JSON report generation and upload will NOT happen here unless you manually generate it.
      # This step is removed as Scorecard action will no longer generate JSON directly here.
      # If you still require the JSON, you'd need to add a separate step here
      # that *manually runs the Scorecard CLI* with --format=json.
      # This means re-downloading/installing the Scorecard CLI or finding a way to persist it.
      # For the sake of resolving the SARIF issue, let's keep it simple.

      - name: 📁 Create Custom Output Directory and Copy Reports
        run: |
          CUSTOM_OUTPUT_DIR="custom_scan_reports"
          echo "[📁] Creating custom directory: ${CUSTOM_OUTPUT_DIR}..."
          mkdir -p "${CUSTOM_OUTPUT_DIR}"
          
          echo "[📄] Copying scorecard-results.sarif to ${CUSTOM_OUTPUT_DIR}/..."
          if [ -f ".github/scorecard/sarif/scorecard_${{steps.date.outputs.date}}.sarif" ]; then
            cp ".github/scorecard/sarif/scorecard_${{steps.date.outputs.date}}.sarif" "${CUSTOM_OUTPUT_DIR}/"
            echo "scorecard-results.sarif copied successfully."
          else
            echo "Warning: scorecard-results.sarif not found, skipping copy to custom directory."
          fi
          
          # Removed JSON copy here because the Scorecard action is not generating it in this config.
          # If you re-introduce JSON generation, remember to put this copy back.
          
          echo "[✅] Files copied to ${CUSTOM_OUTPUT_DIR}/. Listing contents:"
          ls -l "${CUSTOM_OUTPUT_DIR}"

      - name: ⬆️ Upload Custom Reports Directory as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-scan-reports-archive-${{steps.date.outputs.date}}
          path: custom_scan_reports/

      - name: 🩺 헬스체크
        run: |
          echo "Performing health checks..."
          docker info > /dev/null && echo "✅ Docker OK" || (echo "❌ Docker check failed"; exit 1)
          
          test -f ".github/scorecard/sarif/scorecard_${{steps.date.outputs.date}}.sarif" && echo "✅ Scorecard SARIF OK" || (echo "❌ Scorecard SARIF file not found"; exit 1)
          
          # Removed JSON file check here as Scorecard action is not generating it in this config.
          # test -f ".github/scorecard/files/results_${{steps.date.outputs.date}}.json" && echo "✅ Scorecard JSON OK" || (echo "❌ Scorecard JSON file not found"; exit 1)

          test -f ".github/finance/ledgers/ledger_${{steps.date.outputs.date}}.csv" && echo "✅ Finance Ledger OK" || (echo "❌ Finance Ledger file not found"; exit 1)
          
          grep -q "오픈소스 보안 점검" ".github/scorecard/files/oss_report_${{steps.date.outputs.date}}.txt" && echo "✅ Scorecard Report Content OK" || (echo "❌ Scorecard Report content check failed"; exit 1)
          
          echo "All health checks passed successfully!"
