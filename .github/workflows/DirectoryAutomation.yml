name: "🌐 NET + DNS Echo Suite (Upgrade + All Files + Commit)"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      doc_lang:
        description: "문서 언어 (ko|en)"
        required: true
        default: "ko"
      out_dir:
        description: "출력 디렉토리(에코 생성물 루트)"
        required: true
        default: ".github/echo_net"
      do_upgrade:
        description: "호스트 APT full-upgrade 수행 (true/false)"
        required: true
        default: "false"
      dns_stack:
        description: "DNS 스택 선택(systemd|dnsmasq)"
        required: true
        default: "systemd"
      commit_branch:
        description: "커밋/푸시 브랜치"
        required: true
        default: "main"
      commit_message:
        description: "커밋 메시지"
        required: true
        default: "net(dns): echo all configs + upgrade + scripts"
      make_artifact:
        description: "생성물 아티팩트 업로드 (true/false)"
        required: true
        default: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OUT_DIR: ${{ github.event.inputs.out_dir }}
      LANG_SEL: ${{ github.event.inputs.doc_lang }}
      DO_UPG: ${{ github.event.inputs.do_upgrade }}
      DNS_STACK: ${{ github.event.inputs.dns_stack }}
      BRANCH: ${{ github.event.inputs.commit_branch }}
      COMMIT_MSG: ${{ github.event.inputs.commit_message }}
      MAKE_ARTIFACT: ${{ github.event.inputs.make_artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: (옵션) Host Upgrade (apt update/upgrade + net-tools)  # patched for noble t64
        if: env.DO_UPG == 'true'
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y install --no-install-recommends \
            net-tools iproute2 dnsutils jq curl tcpdump iptables ufw \
            systemd-resolved dnsmasq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y full-upgrade

      - name: Prepare Echo directories
        run: |
          set -Eeuo pipefail
          mkdir -p \
            "${OUT_DIR}/templates/netplan" \
            "${OUT_DIR}/templates/systemd-resolved.conf.d" \
            "${OUT_DIR}/templates/sysctl.d" \
            "${OUT_DIR}/templates/iptables" \
            "${OUT_DIR}/templates/ufw" \
            "${OUT_DIR}/templates/dnsmasq.d" \
            "${OUT_DIR}/samples" \
            "${OUT_DIR}/scripts" \
            "${OUT_DIR}/docs" \
            "${OUT_DIR}/logs"

      - name: Echo ➜ 기본 네트워크/호스트 파일 샘플
        run: |
          set -Eeuo pipefail
          cat > "${OUT_DIR}/templates/resolv.conf.sample" <<'CONF'
          nameserver 1.1.1.1
          nameserver 8.8.8.8
          options edns0 trust-ad
          search localdomain
          CONF
          cat > "${OUT_DIR}/templates/hosts.sample" <<'CONF'
          127.0.0.1   localhost
          ::1         localhost
          127.0.1.1   host.local   host
          CONF
          cat > "${OUT_DIR}/templates/nsswitch.conf.sample" <<'CONF'
          hosts:          files resolve dns
          CONF
          cat > "${OUT_DIR}/templates/hosts.allow" <<'CONF'
          sshd: ALL
          CONF
          cat > "${OUT_DIR}/templates/hosts.deny" <<'CONF'
          ALL: ALL
          CONF

      - name: Echo ➜ systemd-resolved / dnsmasq / netplan / sysctl
        run: |
          set -Eeuo pipefail
          cat > "${OUT_DIR}/templates/systemd-resolved.conf.d/dns.conf" <<'CONF'
          [Resolve]
          DNS=1.1.1.1 8.8.8.8
          FallbackDNS=9.9.9.9
          Domains=~.
          DNSSEC=allow-downgrade
          DNSOverTLS=yes
          MulticastDNS=yes
          Cache=yes
          CONF
          cat > "${OUT_DIR}/templates/dnsmasq.conf" <<'CONF'
          domain-needed
          bogus-priv
          no-resolv
          server=1.1.1.1
          server=8.8.8.8
          cache-size=10000
          dnssec
          conf-dir=/etc/dnsmasq.d,*.conf
          CONF
          cat > "${OUT_DIR}/templates/netplan/01-netcfg.yaml" <<'YAML'
          network:
            version: 2
            renderer: networkd
            ethernets:
              eth0:
                dhcp4: true
                dhcp6: true
                nameservers:
                  addresses: [1.1.1.1,8.8.8.8]
                  search: [localdomain]
          YAML
          cat > "${OUT_DIR}/templates/sysctl.d/99-net-tuning.conf" <<'CONF'
          net.core.somaxconn = 4096
          net.core.netdev_max_backlog = 16384
          net.ipv4.tcp_syncookies = 1
          net.ipv4.tcp_fin_timeout = 15
          net.ipv4.ip_forward = 0
          net.ipv4.conf.all.rp_filter = 2
          net.ipv6.conf.all.disable_ipv6 = 0
          CONF

      - name: Echo ➜ 방화벽(UFW/iptables) 규칙 샘플
        run: |
          set -Eeuo pipefail
          cat > "${OUT_DIR}/templates/ufw/ufw.rules" <<'UFW'
          # ufw default deny incoming
          # ufw default allow outgoing
          # ufw allow 53
          # ufw allow 22/tcp
          UFW
          cat > "${OUT_DIR}/templates/iptables/rules.v4" <<'IPT'
          *filter
          :INPUT DROP [0:0]
          :FORWARD DROP [0:0]
          :OUTPUT ACCEPT [0:0]
          -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          -A INPUT -i lo -j ACCEPT
          #-A INPUT -p udp --dport 53 -j ACCEPT
          #-A INPUT -p tcp --dport 53 -j ACCEPT
          -A INPUT -p tcp --dport 22 -j ACCEPT
          COMMIT
          IPT

      - name: Echo ➜ DNS 캐시 샘플/문서/진단 스크립트
        run: |
          set -Eeuo pipefail
          cat > "${OUT_DIR}/samples/cache_table.json" <<'JSON'
          [
            {"name":"www.example.com.","type":"A","class":"IN","rdata":"93.184.216.34","ttl":3600,"cached_time":"2025-08-23T12:00:00Z","expire_time":"2025-08-23T13:00:00Z"}
          ]
          JSON
          cat > "${OUT_DIR}/scripts/show_dns.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          cat /etc/resolv.conf || true
          systemd-resolve --status || true
          dig example.com +dnssec +trace || true
          (command -v ss >/dev/null && ss -lnup | grep :53) || (netstat -lnup | grep :53) || true
          SH
          chmod +x "${OUT_DIR}/scripts/show_dns.sh"
          cat > "${OUT_DIR}/scripts/flush_dns.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          systemctl is-active --quiet systemd-resolved && sudo systemd-resolve --flush-caches || true
          systemctl is-active --quiet dnsmasq && sudo killall -HUP dnsmasq || true
          echo "[OK] DNS cache flushed"
          SH
          chmod +x "${OUT_DIR}/scripts/flush_dns.sh"
          cat > "${OUT_DIR}/scripts/apply_systemd_resolved.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          SRC="${1:-.github/echo_net/templates/systemd-resolved.conf.d/dns.conf}"
          DST="/etc/systemd/resolved.conf.d/dns.conf"
          sudo mkdir -p /etc/systemd/resolved.conf.d
          [ -f "$DST" ] && sudo cp -a "$DST" "${DST}.bak.$(date +%s)" || true
          sudo cp -a "$SRC" "$DST"
          sudo systemctl restart systemd-resolved
          systemd-resolve --status || true
          SH
          chmod +x "${OUT_DIR}/scripts/apply_systemd_resolved.sh"
          cat > "${OUT_DIR}/scripts/apply_dnsmasq.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          SRC="${1:-.github/echo_net/templates/dnsmasq.conf}"
          DST="/etc/dnsmasq.conf"
          [ -f "$DST" ] && sudo cp -a "$DST" "${DST}.bak.$(date +%s)" || true
          sudo cp -a "$SRC" "$DST"
          sudo systemctl enable --now dnsmasq
          sudo systemctl restart dnsmasq
          sudo systemctl status --no-pager dnsmasq || true
          SH
          chmod +x "${OUT_DIR}/scripts/apply_dnsmasq.sh"
          cat > "${OUT_DIR}/scripts/apply_netplan.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          SRC="${1:-.github/echo_net/templates/netplan/01-netcfg.yaml}"
          DST="/etc/netplan/01-netcfg.yaml"
          [ -f "$DST" ] && sudo cp -a "$DST" "${DST}.bak.$(date +%s)" || true
          sudo cp -a "$SRC" "$DST"
          sudo netplan generate
          sudo netplan apply
          SH
          chmod +x "${OUT_DIR}/scripts/apply_netplan.sh"
          cat > "${OUT_DIR}/scripts/apply_sysctl.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          SRC="${1:-.github/echo_net/templates/sysctl.d/99-net-tuning.conf}"
          DST="/etc/sysctl.d/99-net-tuning.conf"
          [ -f "$DST" ] && sudo cp -a "$DST" "${DST}.bak.$(date +%s)" || true
          sudo cp -a "$SRC" "$DST"
          sudo sysctl --system
          SH
          chmod +x "${OUT_DIR}/scripts/apply_sysctl.sh"
          cat > "${OUT_DIR}/scripts/apply_iptables.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          SRC="${1:-.github/echo_net/templates/iptables/rules.v4}"
          sudo iptables-restore < "$SRC"
          sudo iptables -S || true
          SH
          chmod +x "${OUT_DIR}/scripts/apply_iptables.sh"
          cat > "${OUT_DIR}/scripts/apply_ufw.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          # 예시: 주석 해제 후 사용
          # sudo ufw default deny incoming
          # sudo ufw default allow outgoing
          # sudo ufw allow 53
          # sudo ufw allow 22/tcp
          # sudo ufw enable
          sudo ufw status || true
          SH
          chmod +x "${OUT_DIR}/scripts/apply_ufw.sh"
          cat > "${OUT_DIR}/scripts/backup_and_apply.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          STACK="${1:-systemd}"
          ROOT=".github/echo_net"
          case "$STACK" in
            systemd) bash "${ROOT}/scripts/apply_systemd_resolved.sh" "${ROOT}/templates/systemd-resolved.conf.d/dns.conf" ;;
            dnsmasq) bash "${ROOT}/scripts/apply_dnsmasq.sh" "${ROOT}/templates/dnsmasq.conf" ;;
            *) echo "[ERR] unknown stack: $STACK" >&2; exit 1 ;;
          esac
          bash "${ROOT}/scripts/apply_sysctl.sh" "${ROOT}/templates/sysctl.d/99-net-tuning.conf"
          # netplan은 환경에 따라 신중히 적용
          # bash "${ROOT}/scripts/apply_netplan.sh" "${ROOT}/templates/netplan/01-netcfg.yaml"
          echo "[OK] ${STACK} stack applied"
          SH
          chmod +x "${OUT_DIR}/scripts/backup_and_apply.sh"

      - name: Echo ➜ README/INDEX
        run: |
          set -Eeuo pipefail
          if [ "${LANG_SEL}" = "en" ]; then
            cat > "${OUT_DIR}/docs/README.md" <<'MD'
            # NET + DNS Echo Suite
            Generates all network/DNS templates and apply scripts (systemd|dnsmasq).
            MD
          else
            cat > "${OUT_DIR}/docs/README.md" <<'MD'
            # NET + DNS Echo Suite
            네트워크/DNS 템플릿과 적용 스크립트를 에코 방식으로 전부 생성합니다.
            MD
          fi
          cat > "${OUT_DIR}/INDEX.md" <<'MD'
          # Index
          - docs/README.md
          - templates/: resolv.conf.sample, hosts.sample, nsswitch.conf.sample, systemd-resolved.conf.d/dns.conf,
                        dnsmasq.conf, netplan/01-netcfg.yaml, sysctl.d/99-net-tuning.conf,
                        iptables/rules.v4, ufw/ufw.rules, hosts.allow, hosts.deny
          - scripts/: show_dns.sh, flush_dns.sh, apply_*.sh, backup_and_apply.sh
          - samples/cache_table.json
          MD

      - name: Commit & Push
        run: |
          set -Eeuo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "${BRANCH}" ]; then
            git checkout -B "${BRANCH}"
          fi
          git add -A "${OUT_DIR}"
          if git diff --cached --quiet; then
            echo "[ECHO] 변경 없음"
          else
            git commit -m "${COMMIT_MSG}"
            git push origin "${BRANCH}"
          fi

      - name: Upload artifact
        if: env.MAKE_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: echo-net-suite
          path: ${{ env.OUT_DIR }}
