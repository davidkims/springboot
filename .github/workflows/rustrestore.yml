name: "🛡️ AutorunGuard (PowerShell) — build • test • artifact"

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "실행 모드: test(Once만) | install(설치 시뮬레이션+Once)"
        required: true
        default: "test"
        type: choice
        options: ["test", "install"]

permissions:
  contents: read

concurrency:
  group: autorunguard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🧩 Generate AutorunGuard.ps1 (EchoOps)
        shell: pwsh
        run: |
          $dstRepo = Join-Path $PWD 'scripts\AutorunGuard.ps1'
          $dstTools = 'C:\Tools\AutorunGuard.ps1'
          New-Item -Force -ItemType Directory -Path (Split-Path $dstRepo) | Out-Null
          New-Item -Force -ItemType Directory -Path (Split-Path $dstTools) | Out-Null

          @'
          # (여기에 이전에 드린 PowerShell 본문 전체 그대로)
          # --- 생략: AutorunGuard.ps1 내용 동일 ---
          '@ | Set-Content -Encoding UTF8 -Path $dstRepo

          Copy-Item -Force $dstRepo $dstTools
          Write-Host "[ECHO] Script generated at:"
          Write-Host " - Repo:  $dstRepo"
          Write-Host " - Tools: $dstTools"

      - name: 🧪 Syntax check (PowerShell)
        shell: pwsh
        run: |
          $script = Join-Path $PWD 'scripts\AutorunGuard.ps1'
          pwsh -NoProfile -Command "Get-Command -Name $script | Out-Null; Write-Host '[OK] parsed'"

      - name: ▶️ Test run (-Once)
        shell: pwsh
        run: |
          $script = Join-Path $PWD 'scripts\AutorunGuard.ps1'
          if ("${{ github.event.inputs.run_mode }}" -eq "install") {
            powershell -NoProfile -ExecutionPolicy Bypass -File $script -Install
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File $script -Once
          # 러너 콘솔 미리보기(있으면 최근 200줄)
          Get-Content "C:\ProgramData\AutorunGuard\guard.log" -ErrorAction SilentlyContinue | Select-Object -Last 200

      # ✅ 새로 추가: 로그를 워크스페이스로 복사 (업로드 가능하게)
      - name: 📄 Collect logs into workspace
        shell: pwsh
        run: |
          $src = 'C:\ProgramData\AutorunGuard\guard.log'
          $dst = Join-Path $PWD 'logs\guard.log'
          New-Item -ItemType Directory -Path (Split-Path $dst) -Force | Out-Null
          if (Test-Path $src) {
            Copy-Item $src $dst -Force
          } else {
            'No removable/CD volumes detected or log not created.' | Set-Content -Encoding UTF8 $dst
          }

      - name: 📦 Package & create artifact payload
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'autorunguard-package'
          New-Item -Force -ItemType Directory -Path $out | Out-Null
          Copy-Item -Force "scripts\AutorunGuard.ps1" $out
          Set-Content -Encoding UTF8 -Path (Join-Path $out 'README.txt') -Value @"
          AutorunGuard 배포 패키지

          설치(관리자 PowerShell):
            Set-ExecutionPolicy Bypass -Scope Process -Force
            .\AutorunGuard.ps1 -Install

          1회 점검:
            .\AutorunGuard.ps1 -Once

          제거:
            .\AutorunGuard.ps1 -Uninstall
          "@
          Compress-Archive -Path "$out\*" -DestinationPath "$PWD\autorunguard.zip" -Force

      - name: ⬆️ Upload artifact (v4)
        uses: actions/upload-artifact@v4
        with:
          name: autorunguard
          path: |
            autorunguard.zip
            scripts/AutorunGuard.ps1
            logs/guard.log
          if-no-files-found: warn
