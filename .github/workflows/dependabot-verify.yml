name: "Dependabot PR Verify DB Network Omni Smoke"

on:
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "compose/**"
      - ".github/workflows/**"
      - "requirements.txt"
      - "pom.xml"
      - "build.gradle*"
      - "package.json"

permissions:
  contents: read

jobs:
  smoke:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ECHO_TD: .github/echo_td
      ECHO_DW: .github/echo_dw
      ECHO_NET: .github/echo_net
      ECHO_OMNI: .github/echo_omni
      ECHO_LOG: .github/echo_logs
      DOCKER_NET: echo-net-test
      OMNI_IMAGE: omni-echo-test
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup echo tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${ECHO_TD}/sql/td_sim" "${ECHO_DW}/queries" "${ECHO_NET}" "${ECHO_OMNI}" "${ECHO_LOG}"
          cat > .github/echo_tools.sh <<'EOF'
          set -Eeuo pipefail
          echoe(){ echo "[ECHO] $*"; }
          warn(){ echo "[ECHO][WARN] $*" >&2; }
          faile(){ echo "[ECHO][FAIL] $*" >&2; exit 1; }
          have(){ command -v "$1" >/dev/null 2>&1; }
          retry(){ local t="$1"; shift; local s="$1"; shift; [ "${1:-}" = "--" ] && shift || true; local n=0; until "$@"; do n=$((n+1)); [ "$n" -ge "$t" ] && return 1; sleep "$s"; done; }
          ensure_podman(){
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends podman podman-docker slirp4netns uidmap containernetworking-plugins
            have podman || faile "podman not installed"
            podman info >/dev/null 2>&1 || true
          }
          resolve(){
            DOCKER_BIN="$(command -v /usr/bin/docker || true)"; [ -z "$DOCKER_BIN" ] && DOCKER_BIN="$(command -v docker || true)"
            PODMAN_BIN="$(command -v podman || true)"
            export DOCKER_BIN PODMAN_BIN
          }
          resolve
          ctr(){ if [ "${USE_PODMAN:-0}" = "1" ]; then [ -n "${PODMAN_BIN:-}" ] || faile "podman NA"; "$PODMAN_BIN" "$@"; else [ -n "${DOCKER_BIN:-}" ] || faile "docker NA"; "$DOCKER_BIN" "$@"; fi; }
          start_docker(){
            resolve
            if [ -n "${DOCKER_BIN:-}" ]; then
              set +e; "$DOCKER_BIN" info >/dev/null 2>&1; rc=$?; set -e
              if [ $rc -eq 0 ]; then USE_PODMAN=0; export USE_PODMAN; echo "USE_PODMAN=0" >> "$GITHUB_ENV"; echoe "engine=docker"; return 0; fi
              command -v service >/dev/null 2>&1 && { set +e; sudo -n service docker start >/dev/null 2>&1; "$DOCKER_BIN" info >/dev/null 2>&1 && { USE_PODMAN=0; export USE_PODMAN; echo "USE_PODMAN=0" >> "$GITHUB_ENV"; echoe "engine=docker"; return 0; }; set -e; }
            fi
            ensure_podman
            resolve
            USE_PODMAN=1; export USE_PODMAN; echo "USE_PODMAN=1" >> "$GITHUB_ENV"; echoe "engine=podman"
          }
          EOF
          chmod +x .github/echo_tools.sh

      - name: Engine up
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          start_docker
          echoe "Container engine ready: USE_PODMAN=${USE_PODMAN:-0}"
          ctr --version || true

      - name: Quick pull test images
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          TEST_IMAGES=(
            "postgres:16"
            "nginx:alpine" 
            "python:3.11-slim"
            "grafana/loki:2.9.0"
          )
          for img in "${TEST_IMAGES[@]}"; do
            echoe "Pulling ${img}"
            retry 3 2 -- ctr pull "$img" || warn "Failed to pull $img"
          done

      - name: Smoke test Postgres DB
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          cat > "${ECHO_TD}/sql/td_sim/smoke_schema.sql" <<'EOF'
          CREATE SCHEMA IF NOT EXISTS smoke_test;
          CREATE TABLE IF NOT EXISTS smoke_test.health_check(
            id SERIAL PRIMARY KEY,
            created_at TIMESTAMP DEFAULT NOW(),
            status TEXT DEFAULT 'ok'
          );
          INSERT INTO smoke_test.health_check(status) VALUES ('dependabot-smoke');
          EOF
          ctr network create "${DOCKER_NET}" >/dev/null 2>&1 || true
          ctr rm -f td-smoke >/dev/null 2>&1 || true
          ctr run -d --name td-smoke --network "${DOCKER_NET}" \
            -v "$PWD/${ECHO_TD}/sql/td_sim":/smoke:ro \
            -e POSTGRES_PASSWORD=test \
            postgres:16
          for i in $(seq 1 30); do 
            if ctr exec td-smoke pg_isready -U postgres >/dev/null 2>&1; then
              echoe "Postgres ready after ${i}s"
              break
            fi
            sleep 1
          done
          ctr exec -u postgres td-smoke psql -U postgres -d postgres -f /smoke/smoke_schema.sql
          COUNT=$(ctr exec -u postgres td-smoke psql -U postgres -d postgres -t -c "SELECT COUNT(*) FROM smoke_test.health_check;" | tr -d ' ')
          [ "$COUNT" -eq 1 ] || faile "DB smoke test failed: count=$COUNT"
          echoe "DB smoke test passed"

      - name: Smoke test Omni API
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          cat > "${ECHO_OMNI}/smoke_app.py" <<'EOF'
          from fastapi import FastAPI
          import os
          app = FastAPI(title="Smoke Test API")
          @app.get("/health")
          def health():
            return {"status": "ok", "test": "dependabot-smoke", "env": os.getenv("TEST_VAR", "default")}
          @app.get("/ping")  
          def ping():
            return {"pong": True}
          EOF
          cat > "${ECHO_OMNI}/Dockerfile.smoke" <<'EOF'
          FROM python:3.11-slim
          RUN pip install --no-cache-dir fastapi uvicorn
          WORKDIR /app
          COPY smoke_app.py /app/app.py
          EXPOSE 8000
          CMD ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
          EOF
          ctr build -t "${OMNI_IMAGE}:latest" -f "${ECHO_OMNI}/Dockerfile.smoke" "${ECHO_OMNI}"
          ctr rm -f omni-smoke >/dev/null 2>&1 || true
          ctr run -d --name omni-smoke --network "${DOCKER_NET}" \
            -p 8080:8000 \
            -e TEST_VAR=dependabot \
            "${OMNI_IMAGE}:latest"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echoe "Omni API ready after ${i}s"
              break
            fi
            sleep 1
          done
          HEALTH_RESP=$(curl -fsS http://localhost:8080/health)
          echo "$HEALTH_RESP" | grep -q "dependabot-smoke" || faile "API smoke test failed"
          PING_RESP=$(curl -fsS http://localhost:8080/ping)
          echo "$PING_RESP" | grep -q '"pong":true' || faile "API ping test failed"
          echoe "Omni API smoke test passed"

      - name: Smoke test Network proxy
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          cat > "${ECHO_NET}/nginx_smoke.conf" <<'EOF'
          events { worker_connections 1024; }
          http {
            upstream backend { server omni-smoke:8000; }
            server {
              listen 80;
              location /health { return 200 "nginx-ok\n"; add_header Content-Type text/plain; }
              location /api/ {
                proxy_pass http://backend/;
                proxy_set_header Host $host;
              }
            }
          }
          EOF
          ctr rm -f nginx-smoke >/dev/null 2>&1 || true
          ctr run -d --name nginx-smoke --network "${DOCKER_NET}" \
            -p 8088:80 \
            -v "$PWD/${ECHO_NET}/nginx_smoke.conf":/etc/nginx/nginx.conf:ro \
            nginx:alpine
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8088/health >/dev/null 2>&1; then
              echoe "Nginx ready after ${i}s"
              break
            fi
            sleep 1
          done
          NGINX_RESP=$(curl -fsS http://localhost:8088/health)
          echo "$NGINX_RESP" | grep -q "nginx-ok" || faile "Nginx smoke test failed"
          PROXY_RESP=$(curl -fsS http://localhost:8088/api/ping)
          echo "$PROXY_RESP" | grep -q '"pong":true' || faile "Nginx proxy test failed"
          echoe "Network proxy smoke test passed"

      - name: Smoke test Logs stack
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          ctr rm -f loki-smoke >/dev/null 2>&1 || true
          ctr run -d --name loki-smoke --network "${DOCKER_NET}" \
            -p 3100:3100 \
            grafana/loki:2.9.0 -config.file=/etc/loki/local-config.yaml
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3100/ready >/dev/null 2>&1; then
              echoe "Loki ready after ${i}s"
              break
            fi
            sleep 1
          done
          LOKI_RESP=$(curl -fsS http://localhost:3100/ready)
          echo "$LOKI_RESP" | grep -q "ready" || faile "Loki smoke test failed"
          echoe "Logs stack smoke test passed"

      - name: Integration test Full stack
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          echoe "Testing full integration chain..."
          
          DB_TEST=$(ctr exec -u postgres td-smoke psql -U postgres -d postgres -t -c "SELECT 'db-connected';" | tr -d ' ')
          echo "$DB_TEST" | grep -q "db-connected" || faile "DB integration failed"
          
          API_HEALTH=$(curl -fsS http://localhost:8080/health)
          echo "$API_HEALTH" | grep -q "dependabot-smoke" || faile "API integration failed"
          
          PROXY_API=$(curl -fsS http://localhost:8088/api/health)
          echo "$PROXY_API" | grep -q "dependabot-smoke" || faile "Proxy integration failed"
          
          LOKI_HEALTH=$(curl -fsS http://localhost:3100/ready)
          echo "$LOKI_HEALTH" | grep -q "ready" || faile "Logs integration failed"
          
          echoe "Full stack integration test passed"

      - name: Cleanup test containers
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh || true
          for container in td-smoke omni-smoke nginx-smoke loki-smoke; do
            ctr rm -f "$container" >/dev/null 2>&1 || true
          done
          ctr network rm "${DOCKER_NET}" >/dev/null 2>&1 || true
          echoe "Cleanup completed"

      - name: Smoke test summary
        shell: bash
        run: |
          echo "## Dependabot Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Database (PostgreSQL)**: Schema creation and data insertion" >> $GITHUB_STEP_SUMMARY
          echo "- **API Service (FastAPI)**: Health endpoints and responses" >> $GITHUB_STEP_SUMMARY  
          echo "- **Network Proxy (Nginx)**: Request forwarding and load balancing" >> $GITHUB_STEP_SUMMARY
          echo "- **Logs Stack (Loki)**: Log ingestion and storage" >> $GITHUB_STEP_SUMMARY
          echo "- **Integration**: End-to-end connectivity and data flow" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: All smoke tests passed" >> $GITHUB_STEP_SUMMARY
          echo "**Runtime**: ~5-10 minutes" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.actor }} (Dependabot PR)" >> $GITHUB_STEP_SUMMARY
