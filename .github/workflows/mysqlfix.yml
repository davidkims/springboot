name: 🐬 MySQL 8.x 완전 자동화 + 패스워드 워닝/노출방지 (MYSQL_PWD, echo, 재시도)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  mysql-init:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 시스템 전체 패키지 업그레이드 및 설치 (재시도/echo)
        run: |
          trycmd() {
            local cmd="$1"
            local max_try=3
            local n=1
            until eval "$cmd"; do
              echo "[!] $cmd 실패 ($n회). 3초후 재시도..."
              sleep 3
              ((n++))
              if [ $n -gt $max_try ]; then
                echo "[❌] $cmd 명령이 $max_try회 실패. 중단."
                exit 1
              fi
              echo "[+] $cmd 재시도 ($n/$max_try)..."
            done
          }
          echo "echo '[+] apt-get update -y'"
          echo '[+] apt-get update -y'
          trycmd "sudo apt-get update -y"

          echo "echo '[+] apt-get upgrade -y (시스템 전체 업그레이드)'"
          echo '[+] apt-get upgrade -y (시스템 전체 업그레이드)'
          trycmd "sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y"

          echo "echo '[+] apt-get dist-upgrade -y (커널/의존성 포함)'"
          echo '[+] apt-get dist-upgrade -y (커널/의존성 포함)'
          trycmd "sudo DEBIAN_FRONTEND=noninteractive apt-get dist-upgrade -y"

          echo "echo '[+] apt-get autoremove -y (불필요 패키지 정리)'"
          echo '[+] apt-get autoremove -y (불필요 패키지 정리)'
          trycmd "sudo apt-get autoremove -y"

      - name: 📂 Pre-create Directories (with echo)
        run: |
          echo "echo '[+] Creating log and data directories...'"
          echo '[+] Creating log and data directories...'
          echo "mkdir -p .github/logs"
          mkdir -p .github/logs
          echo "sudo mkdir -p /opt/logistics/virtual_customer_data"
          sudo mkdir -p /opt/logistics/virtual_customer_data
          echo "touch .github/logs/mysql_init.log"
          touch .github/logs/mysql_init.log

      - name: 🧩 Install MySQL Server (재시도, echo)
        run: |
          trycmd() {
            local cmd="$1"
            local max_try=3
            local n=1
            until eval "$cmd"; do
              echo "[!] $cmd 실패 ($n회). 3초후 재시도..."
              sleep 3
              ((n++))
              if [ $n -gt $max_try ]; then
                echo "[❌] $cmd 명령이 $max_try회 실패. 중단."
                exit 1
              fi
              echo "[+] $cmd 재시도 ($n/$max_try)..."
            done
          }
          echo "echo '[+] Installing MySQL server (최신).' "
          echo '[+] Installing MySQL server (최신).'
          trycmd "sudo apt-get update -y"
          trycmd "sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server"
          trycmd "sudo systemctl stop mysql || true"
          trycmd "sudo systemctl enable mysql"
          echo "echo '[+] MySQL install complete.'"
          echo '[+] MySQL install complete.'

      - name: 🚨 Start MySQL in --skip-grant-tables Mode for Root Reset (재시도, echo)
        run: |
          trycmd() {
            local cmd="$1"
            local max_try=3
            local n=1
            until eval "$cmd"; do
              echo "[!] $cmd 실패 ($n회). 3초후 재시도..."
              sleep 3
              ((n++))
              if [ $n -gt $max_try ]; then
                echo "[❌] $cmd 명령이 $max_try회 실패. 중단."
                exit 1
              fi
              echo "[+] $cmd 재시도 ($n/$max_try)..."
            done
          }
          echo "echo '[+] Starting MySQL in --skip-grant-tables mode for root auth reset...'"
          echo '[+] Starting MySQL in --skip-grant-tables mode for root auth reset...'
          trycmd "sudo systemctl stop mysql || true"
          echo "echo '[+] Launching mysqld_safe --skip-grant-tables &'"
          nohup sudo mysqld_safe --skip-grant-tables --skip-networking > .github/logs/mysql_skip.log 2>&1 &
          sleep 10
          echo "echo '[+] mysqld_safe --skip-grant-tables started.'"
          echo '[+] mysqld_safe --skip-grant-tables started.'

      - name: 🔑 Root 플러그인/패스워드 초기화 (skip-grant-tables, echo)
        run: |
          echo "echo '[+] Updating root plugin and password (skip-grant-tables)...'"
          echo '[+] Updating root plugin and password (skip-grant-tables)...'
          echo "UPDATE mysql.user SET plugin='mysql_native_password', authentication_string='' WHERE User='root' AND Host='localhost';" > .github/logs/root_reset.sql
          echo "FLUSH PRIVILEGES;" >> .github/logs/root_reset.sql
          echo "echo 'sudo mysql < .github/logs/root_reset.sql'"
          sudo mysql < .github/logs/root_reset.sql
          echo "echo '[+] Root plugin and password blanked.'"
          echo '[+] Root plugin and password blanked.'

      - name: 🚨 Kill skip-grant-tables and Restart MySQL (재시도, echo)
        run: |
          trycmd() {
            local cmd="$1"
            local max_try=3
            local n=1
            until eval "$cmd"; do
              echo "[!] $cmd 실패 ($n회). 3초후 재시도..."
              sleep 3
              ((n++))
              if [ $n -gt $max_try ]; then
                echo "[❌] $cmd 명령이 $max_try회 실패. 중단."
                exit 1
              fi
              echo "[+] $cmd 재시도 ($n/$max_try)..."
            done
          }
          echo "echo '[+] Stopping mysqld_safe --skip-grant-tables ...'"
          echo '[+] Stopping mysqld_safe --skip-grant-tables ...'
          trycmd "sudo pkill -f mysqld_safe || true"
          trycmd "sudo pkill -f mysqld || true"
          sleep 5
          echo "echo '[+] Restarting mysql service...'"
          echo '[+] Restarting mysql service...'
          trycmd "sudo systemctl start mysql"
          sleep 5
          trycmd "sudo systemctl status mysql || true"

      - name: 🔑 비밀번호 없이 root 로그인 → 패스워드 지정 (echo, MYSQL_PWD)
        run: |
          echo "echo '[+] Setting root password via ALTER USER in normal mode...'"
          echo '[+] Setting root password via ALTER USER in normal mode...'
          echo "ALTER USER 'root'@'localhost' IDENTIFIED BY 'rootpass123';" > .github/logs/root_reset2.sql
          echo "FLUSH PRIVILEGES;" >> .github/logs/root_reset2.sql
          echo "echo 'mysql -u root < .github/logs/root_reset2.sql'"
          mysql -u root < .github/logs/root_reset2.sql
          echo "echo '[+] ALTER USER root 완료.'"
          echo '[+] ALTER USER root 완료.'

      - name: ✅ Root 비밀번호 인증 테스트 (echo, MYSQL_PWD)
        run: |
          echo "echo '[+] Testing root password login...'"
          echo '[+] Testing root password login...'
          export MYSQL_PWD=rootpass123
          mysqladmin -u root ping || (echo "echo '[❌] Root password set failed!'" && echo '[❌] Root password set failed!' && exit 1)
          echo "echo '[✔] MySQL root password set and tested'"
          echo '[✔] MySQL root password set and tested'

      - name: 🗃️ Generate Full SQL Schema/Data File (with echo, bulk data)
        run: |
          SCRIPT=/opt/logistics/virtual_customer_data/init_db.sql
          echo "echo '[+] Generating SQL file for schema & bulk data...'"
          echo '[+] Generating SQL file for schema & bulk data...'
          {
            echo "-- logistics schema/tables"
            echo "DROP DATABASE IF EXISTS logistics;"
            echo "CREATE DATABASE logistics DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"
            echo "USE logistics;"
            echo "CREATE TABLE IF NOT EXISTS customers ("
            echo "  customer_id INT PRIMARY KEY AUTO_INCREMENT,"
            echo "  name VARCHAR(100) NOT NULL,"
            echo "  email VARCHAR(128),"
            echo "  registered_at DATETIME DEFAULT CURRENT_TIMESTAMP"
            echo ");"
            echo "CREATE TABLE IF NOT EXISTS card_transactions ("
            echo "  transaction_id INT PRIMARY KEY AUTO_INCREMENT,"
            echo "  customer_id INT NOT NULL,"
            echo "  card_type ENUM('credit','debit','prepaid') NOT NULL,"
            echo "  amount DECIMAL(10,2) NOT NULL,"
            echo "  merchant VARCHAR(100),"
            echo "  transaction_time DATETIME DEFAULT CURRENT_TIMESTAMP,"
            echo "  FOREIGN KEY (customer_id) REFERENCES customers(customer_id)"
            echo ");"
            echo "-- bulk customer data"
            echo "INSERT INTO customers (name, email) VALUES"
            for i in {1..10}; do
              n=$(printf "User%02d" $i)
              e=$(printf "user%02d@email.com" $i)
              echo "  ('$n', '$e')"$(if [ $i -lt 10 ]; then echo ','; else echo ';'; fi)
            done
            echo "-- bulk card_transactions"
            echo "INSERT INTO card_transactions (customer_id, card_type, amount, merchant, transaction_time) VALUES"
            for cid in {1..10}; do
              for j in {1..3}; do
                ctype=$([ $(( (cid+j) % 3 )) -eq 0 ] && echo "credit" || ([ $((j % 2)) -eq 0 ] && echo "debit" || echo "prepaid"))
                amt=$(awk "BEGIN {printf \"%.2f\", (RANDOM%10000)/100+10}")
                merch=$(printf "Merchant%02d" $j)
                d="2023-07-$((10+cid)) 12:$(printf "%02d" $((j*7+cid)))"
                sep=','
                [ $cid -eq 10 ] && [ $j -eq 3 ] && sep=';'
                echo "  ($cid, '$ctype', $amt, '$merch', '$d')$sep"
              done
            done
          } | sudo tee $SCRIPT

      - name: 🚦 MySQL DB/Table/Data Init & Import (재시도, echo, MYSQL_PWD)
        run: |
          trycmd() {
            local cmd="$1"
            local max_try=3
            local n=1
            until eval "$cmd"; do
              echo "[!] $cmd 실패 ($n회). 3초후 재시도..."
              sleep 3
              ((n++))
              if [ $n -gt $max_try ]; then
                echo "[❌] $cmd 명령이 $max_try회 실패. 중단."
                exit 1
              fi
              echo "[+] $cmd 재시도 ($n/$max_try)..."
            done
          }
          export MYSQL_PWD=rootpass123
          SCRIPT=/opt/logistics/virtual_customer_data/init_db.sql
          echo "echo '[+] Creating and importing DB/schema/data...'"
          echo '[+] Creating and importing DB/schema/data...'
          echo "mysql -u root < \$SCRIPT"
          trycmd "mysql -u root < \$SCRIPT"
          echo "echo '[✔] MySQL logistics DB initialized (all schema, data)'"
          echo '[✔] MySQL logistics DB initialized (all schema, data)' | tee .github/logs/mysql_init.log

      - name: 🛠️ MySQL Test Select All (재시도, echo, MYSQL_PWD)
        run: |
          trycmd() {
            local cmd="$1"
            local max_try=3
            local n=1
            until eval "$cmd"; do
              echo "[!] $cmd 실패 ($n회). 3초후 재시도..."
              sleep 3
              ((n++))
              if [ $n -gt $max_try ]; then
                echo "[❌] $cmd 명령이 $max_try회 실패. 중단."
                exit 1
              fi
              echo "[+] $cmd 재시도 ($n/$max_try)..."
            done
          }
          export MYSQL_PWD=rootpass123
          echo "echo '[+] Select all customers and transactions (log below)...'"
          echo '[+] Select all customers and transactions (log below)...'
          echo "mysql -u root -e 'SELECT * FROM logistics.customers;'"
          trycmd "mysql -u root -e 'SELECT * FROM logistics.customers;'"
          echo "mysql -u root -e 'SELECT * FROM logistics.card_transactions;'"
          trycmd "mysql -u root -e 'SELECT * FROM logistics.card_transactions;'"

      - name: 🟩 Permission 확인 (echo)
        run: |
          echo "echo '[+] Directory & file permission check...'"
          echo '[+] Directory & file permission check...'
          echo "ls -lR /opt/logistics/virtual_customer_data"
          ls -lR /opt/logistics/virtual_customer_data
          echo "ls -lR .github/logs"
          ls -lR .github/logs
