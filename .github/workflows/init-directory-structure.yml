name: 📃 Backup GitHub Workflows with Echo and Commit

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'  # 매 5분마다 실행

jobs:
  backup-workflows:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Prepare backup directory
        run: |
          echo "[🔧] Creating backup directory: .github/backup/workflows"
          mkdir -p .github/backup/workflows

      - name: 📝 Copy workflow files to backup dir
        run: |
          echo "[📝] Copying .yml and .yaml workflow files to backup directory"
          cp .github/workflows/*.yml .github/backup/workflows/ 2>/dev/null || echo "[ℹ️] No .yml files found."
          cp .github/workflows/*.yaml .github/backup/workflows/ 2>/dev/null || echo "[ℹ️] No .yaml files found."
          echo "[✅] Copy completed."

      - name: 🔍 Echo contents of each backed up workflow
        run: |
          echo "[🔍] Showing first 10 lines of each backed up workflow file..."
          for f in .github/backup/workflows/*.yml .github/backup/workflows/*.yaml; do
            [ -f "$f" ] || continue
            echo "=============================="
            echo "[📄] File: $f"
            echo "[📌] Preview (first 10 lines):"
            head -n 10 "$f"
          done
          echo "[✅] Preview complete."

      - name: 📅 Commit backup files (if inside Git repo)
        run: |
          if [ -d .git ]; then
            echo "[📅] Git repository detected. Preparing to commit."
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add .github/backup/workflows
            git diff --cached --quiet && echo "[ℹ️] No changes to commit." || (
              git commit -m "📃 Backup workflow files with echo outputs"
              echo "[✅] Commit completed."
            )
          else
            echo "[❌] Not a Git repository. Skipping commit."
          fi
