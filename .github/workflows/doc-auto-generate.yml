name: 📄 문서 자동화 & echo 로그 (디렉토리/패키지 업그레이드 완전 반영)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  auto-doc:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 [echo] 디렉토리 생성 및 echo 로그
        run: |
          mkdir -p .github/echo .github/tmp .github/result output data logs backup
          echo "echo 'mkdir -p .github/echo .github/tmp .github/result output data logs backup'"
          echo '[📁] .github/echo, .github/tmp, .github/result, output, data, logs, backup 디렉토리 생성...' | tee .github/echo/step-01.txt

      - name: 📥 [echo] 저장소 체크아웃
        run: |
          mkdir -p .github/echo
          echo "echo 'Checkout source...'"
          echo '[📥] 저장소 체크아웃...' | tee .github/echo/step-02.txt
      - uses: actions/checkout@v4

      - name: 🐍 [echo] 패키지 설치 및 업그레이드 (최신화)
        run: |
          mkdir -p .github/echo
          echo "echo 'sudo apt-get update -y && sudo apt-get upgrade -y'"
          sudo apt-get update -y | tee .github/echo/step-03.txt
          sudo apt-get upgrade -y | tee -a .github/echo/step-03.txt
          echo "echo 'sudo apt-get install -y python3 python3-pip python3-setuptools python3-venv'"
          sudo apt-get install -y python3 python3-pip python3-setuptools python3-venv | tee -a .github/echo/step-03.txt
          echo "echo 'pip3 install --upgrade pip setuptools wheel'"
          pip3 install --upgrade pip setuptools wheel | tee -a .github/echo/step-03.txt

      - name: 📝 [echo] README.md 자동 생성/수정 (echo로 py파일 생성)
        run: |
          mkdir -p .github/echo
          echo "echo '[📝] README.md 자동 생성/수정...'"
          echo '[📝] README.md 자동 생성/수정...' > .github/echo/step-04.txt

          echo "import datetime" | tee -a .github/echo/step-04.txt | tee gen_doc.py
          echo "now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')" | tee -a .github/echo/step-04.txt | tee -a gen_doc.py
          echo "with open('README.md', 'a', encoding='utf-8') as f:" | tee -a .github/echo/step-04.txt | tee -a gen_doc.py
          echo "    f.write(f'\\n## 워크플로우 자동 실행 로그\\n- 실행시각: {now}\\n')" | tee -a .github/echo/step-04.txt | tee -a gen_doc.py
          echo "print('[완료] README.md 자동 업데이트')" | tee -a .github/echo/step-04.txt | tee -a gen_doc.py

          echo "python3 gen_doc.py | tee -a .github/echo/step-04.txt"
          python3 gen_doc.py | tee -a .github/echo/step-04.txt

      - name: 🔄 [echo] 변경 파일 커밋 & 토큰 인증 푸시
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .github/echo
          echo "echo 'git config --global user.name \"github-actions[bot]\"'"
          git config --global user.name "github-actions[bot]"
          echo "echo 'git config --global user.email \"github-actions[bot]@users.noreply.github.com\"'"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "echo 'git add README.md'"
          git add README.md
          echo "echo 'git commit -m \"docs: README.md 자동 업데이트 [skip ci]\" || echo \"No changes\"'"
          git commit -m "docs: README.md 자동 업데이트 [skip ci]" || echo "No changes"
          echo "echo 'git push https://x-access-token:\${GH_TOKEN}@github.com/\${GITHUB_REPOSITORY}.git HEAD:main || echo \"Push skipped\"'"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || echo "Push skipped"

      - name: 🗂️ [echo] 생성 파일/디렉토리 목록 확인
        run: |
          mkdir -p .github/echo
          echo "echo 'ls -al .github/echo'"
          ls -al .github/echo | tee .github/echo/step-06.txt
          echo "echo 'ls -al .github'"
          ls -al .github | tee -a .github/echo/step-06.txt
          echo "echo 'ls -al'"
          ls -al | tee -a .github/echo/step-06.txt
          echo "echo 'tree -a -L 2'"
          tree -a -L 2 | tee -a .github/echo/step-06.txt || true
