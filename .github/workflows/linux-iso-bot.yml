name: "🏦 EchoOps v4: TD-SIM + SCD2 + CDC/Kafka + Security + Prom/Grafana + Omni GHCR Push+Sign"

permissions:
  contents: write
  packages: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      generate_rows:
        description: "샘플 거래 데이터 생성 건수"
        required: true
        default: "1500"
      commit_changes:
        description: "에코 산출물 커밋/푸시 (true/false)"
        required: true
        default: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ECHO_TD: .github/echo_td
      ECHO_DW: .github/echo_dw
      ECHO_NET: .github/echo_net
      ECHO_OMNI: .github/echo_omni
      ECHO_LOG: .github/echo_logs
      ECHO_SEC: .github/echo_sec
      ECHO_KAFKA: .github/echo_kafka
      ECHO_MON: .github/echo_mon
      IMAGE_REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      OMNI_IMAGE: omni-echo
      DOCKER_NETWORK: echo-net
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 🧰 Prepare Echo tools & dirs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${ECHO_TD}/sql/td_sim" "${ECHO_TD}/sql/teradata" \
                   "${ECHO_DW}/db" "${ECHO_DW}/queries" "${ECHO_DW}/scripts" \
                   "${ECHO_NET}/nginx" "${ECHO_OMNI}" "${ECHO_LOG}" \
                   "${ECHO_SEC}" "${ECHO_KAFKA}/events" \
                   "${ECHO_MON}/prometheus" "${ECHO_MON}/grafana/provisioning/datasources"
          cat > .github/echo_tools.sh <<'BASH'
          set -Eeuo pipefail
          echoe(){ echo "[ECHO] $*"; }
          faile(){ echo "[ECHO][FAIL] $*" >&2; exit 1; }
          retry(){ local t="$1"; shift; local s="$1"; shift; [ "$1" = "--" ] && shift || true; local n=0; until "$@"; do n=$((n+1)); [ "$n" -ge "$t" ] && return 1; sleep "$s"; done; }
          BASH
          chmod +x .github/echo_tools.sh
          . .github/echo_tools.sh
          echoe "Echo tools ready and directories prepared"

      - name: ⬆️ Mandatory system upgrade (non-interactive)
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y dist-upgrade
          sudo apt-get install -y sqlite3 jq python3 python3-pip docker.io gpg gnupg openssl
          echo "[UPGRADE][OK] $(date -Iseconds)" | tee -a "${ECHO_LOG}/upgrade.log"

      - name: 🔐 Docker login to GHCR (for push)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          echo "${GH_TOKEN}" | docker login "${IMAGE_REGISTRY}" -u "${IMAGE_OWNER}" --password-stdin

      - name: 🐍 Mandatory Teradata client install (retry; no-fail)
        shell: bash
        run: |
          set +euo pipefail
          set -u
          . .github/echo_tools.sh
          LOG="${ECHO_LOG}/td_client_install.log"
          python3 -m pip install --upgrade pip >>"$LOG" 2>&1
          retry 3 3 -- python3 -m pip install teradatasql >>"$LOG" 2>&1
          RC1=$?
          retry 2 3 -- python3 -m pip install teradatasqlalchemy >>"$LOG" 2>&1
          RC2=$?
          if [ "$RC1" -ne 0 ] || [ "$RC2" -ne 0 ]; then
            echo "[TD][WARN] teradata client partial/failed (rc1=${RC1}, rc2=${RC2})" | tee -a "$LOG"
          else
            echo "[TD][OK] teradata client installed" | tee -a "$LOG"
          fi
          exit 0

      - name: 🧾 Echo SQL:TD-SIM DDL (Dims incl. Bank/Card/Branch/Product/Channel + SCD2) & Fact + Queries
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          # ---------- SCHEMA & DIMS (SCD2 for customer) ----------
          cat > "${ECHO_TD}/sql/td_sim/001_schema.sql" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS td;

          -- SCD2 Customer Dimension
          CREATE TABLE IF NOT EXISTS td.dim_customer_scd2(
            sk             BIGSERIAL PRIMARY KEY,
            customer_bk    BIGINT NOT NULL,
            name           VARCHAR(100) NOT NULL,
            email          VARCHAR(200),
            effective_from TIMESTAMP NOT NULL,
            effective_to   TIMESTAMP,
            is_current     BOOLEAN NOT NULL DEFAULT TRUE,
            attrib_hash    TEXT NOT NULL
          );
          CREATE INDEX IF NOT EXISTS idx_customer_bk ON td.dim_customer_scd2(customer_bk);

          -- Other Conformed Dimensions
          CREATE TABLE IF NOT EXISTS td.dim_bank(
            bank_id BIGSERIAL PRIMARY KEY,
            bank_code VARCHAR(10) UNIQUE NOT NULL,
            bank_name VARCHAR(100) NOT NULL
          );
          CREATE TABLE IF NOT EXISTS td.dim_branch(
            branch_id BIGSERIAL PRIMARY KEY,
            bank_id   BIGINT NOT NULL REFERENCES td.dim_bank(bank_id),
            branch_code VARCHAR(20) NOT NULL,
            branch_name VARCHAR(100) NOT NULL
          );
          CREATE TABLE IF NOT EXISTS td.dim_product(
            product_id BIGSERIAL PRIMARY KEY,
            product_code VARCHAR(20) UNIQUE NOT NULL,
            product_name VARCHAR(100) NOT NULL,
            category VARCHAR(50)
          );
          CREATE TABLE IF NOT EXISTS td.dim_channel(
            channel_id BIGSERIAL PRIMARY KEY,
            channel_code VARCHAR(20) UNIQUE NOT NULL,
            channel_name VARCHAR(100) NOT NULL
          );
          CREATE TABLE IF NOT EXISTS td.dim_card(
            card_id BIGSERIAL PRIMARY KEY,
            card_bin VARCHAR(10) NOT NULL,
            brand    VARCHAR(20) NOT NULL
          );

          -- Accounts (ties customer SCD2 current row by BK)
          CREATE TABLE IF NOT EXISTS td.dim_account(
            account_id  BIGSERIAL PRIMARY KEY,
            customer_bk BIGINT NOT NULL,
            bank_id     BIGINT NOT NULL REFERENCES td.dim_bank(bank_id),
            opened_ts   TIMESTAMP DEFAULT NOW(),
            currency    CHAR(3) DEFAULT 'KRW'
          );

          -- Fact with extended FKs
          CREATE TABLE IF NOT EXISTS td.fact_transaction(
            txn_id      BIGSERIAL PRIMARY KEY,
            account_id  BIGINT NOT NULL REFERENCES td.dim_account(account_id),
            customer_sk BIGINT,  -- snapshot to SCD2 current row
            product_id  BIGINT REFERENCES td.dim_product(product_id),
            channel_id  BIGINT REFERENCES td.dim_channel(channel_id),
            card_id     BIGINT REFERENCES td.dim_card(card_id),
            amount      NUMERIC(18,2) NOT NULL,
            txn_type    VARCHAR(16) CHECK (txn_type IN ('DEBIT','CREDIT')),
            txn_ts      TIMESTAMP DEFAULT NOW()
          );

          -- Echo install log
          CREATE TABLE IF NOT EXISTS td.echo_install_log(
            installed_at TIMESTAMP DEFAULT NOW(),
            component    TEXT,
            detail       TEXT
          );

          -- SCD2 Upsert Function for Customer
          CREATE OR REPLACE FUNCTION td.scd2_upsert_customer(p_customer_bk BIGINT, p_name TEXT, p_email TEXT)
          RETURNS VOID AS $$
          DECLARE
            v_hash TEXT := md5(coalesce(p_name,'') || '|' || coalesce(p_email,''));
            v_curr td.dim_customer_scd2%ROWTYPE;
          BEGIN
            SELECT * INTO v_curr
              FROM td.dim_customer_scd2
              WHERE customer_bk = p_customer_bk AND is_current = TRUE
              ORDER BY effective_from DESC LIMIT 1;

            IF v_curr.sk IS NULL THEN
              INSERT INTO td.dim_customer_scd2(customer_bk,name,email,effective_from,effective_to,is_current,attrib_hash)
              VALUES (p_customer_bk,p_name,p_email,NOW(),NULL,TRUE,v_hash);
            ELSIF v_curr.attrib_hash <> v_hash THEN
              UPDATE td.dim_customer_scd2
                SET effective_to = NOW(), is_current = FALSE
                WHERE sk = v_curr.sk;
              INSERT INTO td.dim_customer_scd2(customer_bk,name,email,effective_from,effective_to,is_current,attrib_hash)
              VALUES (p_customer_bk,p_name,p_email,NOW(),NULL,TRUE,v_hash);
            END IF;
          END; $$ LANGUAGE plpgsql;
          SQL

          # ---------- SEED DATA ----------
          cat > "${ECHO_TD}/sql/td_sim/002_seed.sql" <<'SQL'
          -- Banks
          INSERT INTO td.dim_bank(bank_code,bank_name) VALUES
            ('KB','KB국민은행'),('NH','농협은행'),('WR','우리은행'),
            ('HN','하나은행'),('SH','신한은행')
          ON CONFLICT (bank_code) DO NOTHING;

          -- Channels
          INSERT INTO td.dim_channel(channel_code,channel_name) VALUES
            ('WEB','웹'),('MOB','모바일'),('ATM','ATM'),('BR','영업점')
          ON CONFLICT (channel_code) DO NOTHING;

          -- Products
          INSERT INTO td.dim_product(product_code,product_name,category) VALUES
            ('CHK','입출금','DEPOSIT'),('SAV','적금','DEPOSIT'),
            ('CRD','신용카드','CARD'),('LOAN','대출','LOAN')
          ON CONFLICT (product_code) DO NOTHING;

          -- Cards
          INSERT INTO td.dim_card(card_bin,brand) VALUES
            ('457812','VISA'),('541234','MASTERCARD'),('356000','JCB')
          ON CONFLICT DO NOTHING;

          -- Customers via SCD2 (10 customers)
          DO $$
          DECLARE i INT;
          BEGIN
            FOR i IN 1..10 LOOP
              PERFORM td.scd2_upsert_customer(i, '고객'||i, 'user'||i||'@bank.local');
            END LOOP;
          END $$;

          -- Branches (per bank)
          INSERT INTO td.dim_branch(bank_id,branch_code,branch_name)
          SELECT b.bank_id, b.bank_code||'-001', b.bank_name||' 본점'
          FROM td.dim_bank b
          ON CONFLICT DO NOTHING;

          -- Accounts per customer
          INSERT INTO td.dim_account(customer_bk, bank_id)
          SELECT c.customer_bk, (SELECT bank_id FROM td.dim_bank ORDER BY random() LIMIT 1)
          FROM (SELECT DISTINCT customer_bk FROM td.dim_customer_scd2) c;
          SQL

          # ---------- FACT LOAD (pure SQL with psql variable :N) ----------
          cat > "${ECHO_TD}/sql/td_sim/003_generate_txn.sql" <<'SQL'
          \set N 1000
          INSERT INTO td.fact_transaction(account_id, customer_sk, product_id, channel_id, card_id, amount, txn_type, txn_ts)
          SELECT
            a.account_id,
            (SELECT sk FROM td.dim_customer_scd2 s WHERE s.customer_bk = a.customer_bk AND s.is_current = TRUE LIMIT 1),
            (SELECT product_id FROM td.dim_product ORDER BY random() LIMIT 1),
            (SELECT channel_id FROM td.dim_channel ORDER BY random() LIMIT 1),
            (SELECT card_id FROM td.dim_card ORDER BY random() LIMIT 1),
            (random()*100000)::numeric(18,2),
            CASE WHEN random()>0.5 THEN 'CREDIT' ELSE 'DEBIT' END,
            NOW() - (random()*interval '10 days')
          FROM td.dim_account a
          CROSS JOIN generate_series(1, :N) g;
          SQL

          # ---------- SCD2 change example (for CDC demo) ----------
          cat > "${ECHO_TD}/sql/td_sim/004_scd2_change_example.sql" <<'SQL'
          SELECT td.scd2_upsert_customer(3,'고객03_개명','user3@bank.local');
          SQL

          # ---------- Analytic Queries ----------
          cat > "${ECHO_DW}/queries/11_daily_by_channel.sql" <<'SQL'
          SELECT date_trunc('day', f.txn_ts) AS day, ch.channel_name,
                 COUNT(*) txn_cnt, SUM(f.amount) total_amt
          FROM td.fact_transaction f
          JOIN td.dim_channel ch ON ch.channel_id=f.channel_id
          GROUP BY 1,2 ORDER BY 1 DESC, 2;
          SQL

          cat > "${ECHO_DW}/queries/12_top_products.sql" <<'SQL'
          SELECT p.product_name, COUNT(*) txn_cnt, SUM(f.amount) total_amt
          FROM td.fact_transaction f
          JOIN td.dim_product p ON p.product_id=f.product_id
          GROUP BY 1 ORDER BY total_amt DESC LIMIT 10;
          SQL

          echoe "DDL/Seeds/Fact/Queries emitted"

      - name: 🧱 Start TD-SIM (Postgres) & load schema/seeds/fact
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          retry 3 3 -- docker pull postgres:16
          docker network create "${DOCKER_NETWORK}" >/dev/null 2>&1 || true
          docker rm -f td-sim >/dev/null 2>&1 || true
          docker run -d --name td-sim --network "${DOCKER_NETWORK}" \
            -e POSTGRES_PASSWORD=postgres -p 5432:5432 \
            -v "$PWD/${ECHO_TD}/sql/td_sim":/td:ro postgres:16
          for i in $(seq 1 60); do
            if docker exec td-sim pg_isready -U postgres >/dev/null 2>&1; then break; fi; sleep 2; done
          docker exec -u postgres td-sim psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /td/001_schema.sql
          docker exec -u postgres td-sim psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /td/002_seed.sql
          docker exec -u postgres td-sim psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v N=${{ github.event.inputs.generate_rows }} -f /td/003_generate_txn.sql
          echo "[TD-SIM][OK] schema+seed+fact" | tee -a "${ECHO_LOG}/td_sim.log"

      - name: 🌐 Run Nginx (network server)
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          retry 3 3 -- docker pull nginx:alpine
          docker rm -f echo-nginx >/dev/null 2>&1 || true
          cat > "${ECHO_NET}/nginx/nginx.conf" <<'CONF'
          events {}
          http {
            server {
              listen 80;
              location /health { return 200 'OK'; add_header Content-Type text/plain; }
              location / { return 200 'OmniChannel Gateway (Nginx)'; add_header Content-Type text/plain; }
            }
          }
          CONF
          docker run -d --name echo-nginx --network "${DOCKER_NETWORK}" -p 8088:80 \
            -v "$PWD/${ECHO_NET}/nginx/nginx.conf":/etc/nginx/nginx.conf:ro nginx:alpine
          echo "[NET][OK] nginx :8088" | tee -a "${ECHO_LOG}/network.log"

      - name: 🧩 Build & run OmniChannel (FastAPI + Prom metrics) ➜ GHCR push (MANDATORY)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          cat > "${ECHO_OMNI}/app.py" <<'PY'
          from fastapi import FastAPI
          from datetime import datetime
          from prometheus_client import Counter, generate_latest, CONTENT_TYPE_LATEST
          from fastapi.responses import Response

          app = FastAPI(title="OmniChannel Echo API")
          hits = Counter("omni_hits_total", "Total hits", ["endpoint"])

          @app.get("/health")
          def health():
            hits.labels("/health").inc()
            return {"status":"ok","ts":datetime.utcnow().isoformat()}

          @app.get("/orders/{order_id}")
          def order(order_id:int):
            hits.labels("/orders").inc()
            return {"order_id":order_id,"status":"PAID","channel":"web"}

          @app.get("/accounts/{account_id}")
          def account(account_id:int):
            hits.labels("/accounts").inc()
            return {"account_id":account_id,"balance":123456.78,"currency":"KRW"}

          @app.get("/metrics")
          def metrics():
            return Response(generate_latest(), media_type=CONTENT_TYPE_LATEST)
          PY
          cat > "${ECHO_OMNI}/Dockerfile" <<'DOCKER'
          FROM python:3.11-slim
          RUN pip install --no-cache-dir fastapi uvicorn prometheus-client
          WORKDIR /app
          COPY app.py /app/app.py
          EXPOSE 8000
          CMD ["uvicorn","app:app","--host","0.0.0.0","--port","8000"]
          DOCKER
          retry 3 3 -- docker pull python:3.11-slim
          docker build -t "${OMNI_IMAGE}:latest" "${ECHO_OMNI}"
          docker tag "${OMNI_IMAGE}:latest" "${IMAGE_REGISTRY}/${IMAGE_OWNER}/${OMNI_IMAGE}:latest"
          docker tag "${OMNI_IMAGE}:latest" "${IMAGE_REGISTRY}/${IMAGE_OWNER}/${OMNI_IMAGE}:run-${{ github.run_number }}"
          docker rm -f omni >/dev/null 2>&1 || true
          docker run -d --name omni --network "${DOCKER_NETWORK}" -p 8090:8000 "${OMNI_IMAGE}:latest"
          echo "[OMNI][RUN] :8090/health & /metrics" | tee -a "${ECHO_LOG}/omni.log"
          docker push "${IMAGE_REGISTRY}/${IMAGE_OWNER}/${OMNI_IMAGE}:latest"
          docker push "${IMAGE_REGISTRY}/${IMAGE_OWNER}/${OMNI_IMAGE}:run-${{ github.run_number }}"
          echo "[OMNI][PUSH][OK]" | tee -a "${ECHO_LOG}/omni.log"

      - name: 🔏 Install cosign
        uses: sigstore/cosign-installer@v3.6.0

      - name: 🖊️ Sign & verify Omni image with cosign (Keyless OIDC)
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          IMG="${IMAGE_REGISTRY}/${IMAGE_OWNER}/${OMNI_IMAGE}:run-${{ github.run_number }}"
          cosign sign --yes "$IMG" | tee "${ECHO_LOG}/cosign_${{ github.run_number }}.log"
          cosign verify "$IMG" | tee -a "${ECHO_LOG}/cosign_${{ github.run_number }}.log"
          echo "[SIGN][OK] $IMG" | tee -a "${ECHO_LOG}/omni.log"

      - name: 📈 Prometheus + 📊 Grafana (scrape Omni /metrics)
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          retry 3 3 -- docker pull prom/prometheus:latest
          retry 3 3 -- docker pull grafana/grafana:latest
          cat > "${ECHO_MON}/prometheus/prometheus.yml" <<'YML'
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: 'omni'
              metrics_path: /metrics
              static_configs:
                - targets: ['omni:8000']
                  labels: {service: 'omni'}
          YML
          cat > "${ECHO_MON}/grafana/provisioning/datasources/prometheus.yaml" <<'YML'
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
          YML
          docker rm -f prometheus grafana >/dev/null 2>&1 || true
          docker run -d --name prometheus --network "${DOCKER_NETWORK}" -p 9090:9090 \
            -v "$PWD/${ECHO_MON}/prometheus/prometheus.yml":/etc/prometheus/prometheus.yml:ro \
            prom/prometheus:latest
          docker run -d --name grafana --network "${DOCKER_NETWORK}" -p 3000:3000 \
            -v "$PWD/${ECHO_MON}/grafana/provisioning":/etc/grafana/provisioning:ro \
            -e GF_SECURITY_ADMIN_PASSWORD=admin grafana/grafana:latest
          echo "[MON][OK] Prometheus:9090 Grafana:3000" | tee -a "${ECHO_LOG}/monitor.log"

      - name: ⚡ Kafka (KRaft) + CDC topic & events
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          retry 3 3 -- docker pull bitnami/kafka:3.7
          docker rm -f kafka >/dev/null 2>&1 || true
          docker run -d --name kafka --network "${DOCKER_NETWORK}" -p 9092:9092 \
            -e KAFKA_ENABLE_KRAFT=yes \
            -e KAFKA_CFG_NODE_ID=1 \
            -e KAFKA_CFG_PROCESS_ROLES=broker,controller \
            -e KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093 \
            -e KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092 \
            -e KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            bitnami/kafka:3.7
          sleep 10
          docker exec kafka bash -lc "kafka-topics.sh --create --if-not-exists --topic cdc.fin.dim_customer --bootstrap-server localhost:9092"
          docker exec -u postgres td-sim psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /td/004_scd2_change_example.sql
          docker exec -u postgres td-sim psql -U postgres -d postgres -At -c \
            "SELECT json_build_object('customer_bk',customer_bk,'name',name,'email',email,'effective_from',effective_from,'effective_to',effective_to,'is_current',is_current)::text FROM td.dim_customer_scd2 WHERE customer_bk=3 ORDER BY effective_from" \
            > "${ECHO_KAFKA}/events/customer_3.jsonl"
          docker exec -i kafka bash -lc "kafka-console-producer.sh --bootstrap-server localhost:9092 --topic cdc.fin.dim_customer" < "${ECHO_KAFKA}/events/customer_3.jsonl"
          echo "[CDC][OK] produced events for BK=3 to topic cdc.fin.dim_customer" | tee -a "${ECHO_LOG}/kafka.log"

      - name: 🔐 Security Echo Scripts (GPG/OpenSSL) + sample run
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          cat > "${ECHO_SEC}/gpg_quickgen.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          gpg --batch --yes --quick-gen-key "echo-bot <echo@local>" default default 0
          gpg --list-keys "echo-bot"
          SH
          cat > "${ECHO_SEC}/openssl_encrypt.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          echo "THIS IS SECRET" > secret.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in secret.txt -out secret.txt.enc -k "echo-pass"
          rm -f secret.txt
          SH
          chmod +x "${ECHO_SEC}/gpg_quickgen.sh" "${ECHO_SEC}/openssl_encrypt.sh"
          (cd "${ECHO_SEC}" && ./openssl_encrypt.sh)
          echo "[SEC][OK] OpenSSL sample encrypted" | tee -a "${ECHO_LOG}/security.log"
          (cd "${ECHO_SEC}" && ./gpg_quickgen.sh) || echo "[SEC][WARN] gpg quick-gen skipped/failed" | tee -a "${ECHO_LOG}/security.log"

      - name: 🗃️ Echo install table (SQLite) + snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          DB="${ECHO_DW}/db/echo_install.db"
          sqlite3 "${DB}" <<SQL
          CREATE TABLE IF NOT EXISTS echo_install_log(
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            installed_at TEXT DEFAULT (datetime('now')),
            component TEXT,
            detail TEXT
          );
          INSERT INTO echo_install_log(component,detail) VALUES
            ('system','upgrade done'),
            ('td-client','pip teradatasql/teradatasqlalchemy attempted'),
            ('td-sim','postgres:16 schema+seed+fact'),
            ('omni','built/pushed/signed to GHCR'),
            ('monitor','prometheus+grafana up'),
            ('kafka','topic+cdc produced'),
            ('security','openssl/gpg scripts run');
          SQL
          sqlite3 "${DB}" '.headers on' '.mode column' 'SELECT * FROM echo_install_log;' | tee "${ECHO_LOG}/echo_install_log.txt"
          echo "[ECHO][OK] install log recorded (sqlite)"

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-bundle
          path: |
            .github/echo_td
            .github/echo_dw
            .github/echo_net
            .github/echo_omni
            .github/echo_logs
            .github/echo_sec
            .github/echo_kafka
            .github/echo_mon

      - name: 🧾 Commit & push Echo outputs (best-effort)
        if: ${{ github.event.inputs.commit_changes == 'true' }}
        shell: bash
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          git config user.name "echo-bot"
          git config user.email "echo-bot@users.noreply.github.com"
          git add .github/echo_td .github/echo_dw .github/echo_net .github/echo_omni .github/echo_logs .github/echo_sec .github/echo_kafka .github/echo_mon || true
          if git diff --cached --quiet; then echoe "No changes to commit"; exit 0; fi
          git commit -m "EchoOps v4: SCD2+CDC/Kafka+Security+Monitoring+GHCR push/sign ($(date -Iseconds))"
          if [ -n "${GH_ADMIN_TOKEN:-}" ]; then
            REPO_URL="https://${GH_ADMIN_TOKEN}@github.com/${{ github.repository }}.git"
            git push "${REPO_URL}" HEAD:${{ github.ref_name }}
            echoe "Pushed changes to ${REPO_URL}"
          else
            echo "[WARN] GH_ADMIN_TOKEN missing; skip push" | tee -a "${ECHO_LOG}/commit.log"
          fi
