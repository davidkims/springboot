name: 🚀 Full Finance & Scorecard Setup (Stable v5.1.1)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write
  security-events: write

jobs:
  full-setup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        name: 📥 Checkout

      - name: 📆 Set Date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: 🐳 Docker & CLI 설치
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo systemctl start docker
          docker --version
          sudo apt-get update
          sudo apt-get install -y jq curl unzip bc file

      - name: 🗂️ 디렉토리 준비
        run: mkdir -p .github/finance/ledgers .github/finance/files .github/scorecard/ledgers .github/scorecard/files .github/scorecard/sarif

      - name: 🧾 금융 원장 생성
        run: |
          F=".github/finance/ledgers/ledger_${{steps.date.outputs.date}}.csv"
          echo "name,date,amount,type,card_number" > "$F"
          for i in {1..50}; do
            TXN=$(date -d "$i days ago" +%F)
            TYPE=$( ((i%2)) && echo 신용 || echo 체크 )
            CARD="-"
            [[ "$TYPE" = "신용" ]] && CARD="4111$(printf "%012d" $RANDOM)"
            echo "Customer$i,$TXN,$((RANDOM%9000+1000)).00,$TYPE,$CARD" >> "$F"
          done

      - name: 📄 보고서 생성 (Finance)
        run: echo "금융 거래 요약 리포트 - ${{steps.date.outputs.date}}" > .github/finance/files/report_${{steps.date.outputs.date}}.txt

      - name: ✅ Scorecard CLI 설치 (v5.1.1)
        run: |
          VERSION="5.1.1"
          B="scorecard_${VERSION}_linux_amd64"
          URL="https://github.com/ossf/scorecard/releases/download/v${VERSION}/${B}"
          curl -fsSL -o scorecard "$URL"
          file scorecard | grep ELF || (cat scorecard | head -20 && exit 1)
          chmod +x scorecard
          sudo mv scorecard /usr/local/bin/scorecard
          which scorecard
          scorecard --version

      - name: 🧾 Scorecard 원장 생성
        run: |
          G=".github/scorecard/ledgers/scorecard_${{steps.date.outputs.date}}.csv"
          echo "item,score,comment" > "$G"
          for i in {1..20}; do
            C=$(( RANDOM % 2 ))
            COMMENT=$((C)) && echo "SecurityCheck$i,$((RANDOM%101)),${COMMENT:+개선필요}${COMMENT:-양호}"
          done >> "$G"

      - name: 📄 보고서 생성 (Scorecard)
        run: echo "오픈소스 보안 점검 리포트 - ${{steps.date.outputs.date}}" > .github/scorecard/files/oss_report_${{steps.date.outputs.date}}.txt

      - name: 📜 Provenance 생성
        run: |
          echo "{\"type\":\"finance-ledger\",\"date\":\"${{steps.date.outputs.date}}\",\"ledger\":\"ledger_${{steps.date.outputs.date}}.csv\",\"report\":\"report_${{steps.date.outputs.date}}.txt\"}" > .github/finance/provenance_${{steps.date.outputs.date}}.json
          echo "{\"type\":\"scorecard-report\",\"date\":\"${{steps.date.outputs.date}}\",\"ledger\":\"scorecard_${{steps.date.outputs.date}}.csv\",\"report\":\"oss_report_${{steps.date.outputs.date}}.txt\"}" > .github/scorecard/provenance_${{steps.date.outputs.date}}.json

      - name: 🧪 SARIF 생성
        run: |
          scorecard --repo="${{github.repository}}" --format sarif --output-file ".github/scorecard/sarif/scorecard_${{steps.date.outputs.date}}.sarif" || echo "⚠️ 무시"

      - name: 🚀 SARIF 업로드
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .github/scorecard/sarif/scorecard_${{steps.date.outputs.date}}.sarif

      - name: 🩺 헬스체크
        run: |
          docker info > /dev/null && echo ✅ Docker OK || exit 1
          which scorecard && scorecard --version > /dev/null && echo ✅ Scorecard OK || exit 1
          test -f ".github/finance/ledgers/ledger_${{steps.date.outputs.date}}.csv" || exit 1
          test -f ".github/scorecard/sarif/scorecard_${{steps.date.outputs.date}}.sarif" || exit 1
          grep -q "보안 점검" ".github/scorecard/files/oss_report_${{steps.date.outputs.date}}.txt" || exit 1
