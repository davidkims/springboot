# 🗂️ MEGA-DB/거래/계좌/이체/유저/시뮬/설치/권한/대량/운영/유틸/Compose-통합 워크플로우

name: 🗂️ MEGA-DB/거래/계좌/이체/유저/시뮬/설치/권한/대량/운영/유틸/Compose-통합

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  db-echo-mega:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 Echo 디렉토리 대량 생성 (50개 이상 포함)
        run: |
          for d in \
            .github/echo_db/{dirs,files,installs,upgrade,permissions,scripts,logs,services,compose,homebrew,choco,snap,marketplace,backup,init,test,migration,import,export,serverinfo,errorlog,util,mass_db,mass_script,mass_query,ledger,vaccount,transfer,user,sim,teradata,dwh,cli,api,runtime,bin,output,verify,auth,containers,batch_insert,index,parallel_exec,select,aggregate,image,echo_img}; do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo_db/echo_dir_create.sh
            mkdir -p $d
          done

      - name: 🧾 계좌/유저/이체 90,000건 대량 SQL 생성 및 병렬 실행 스크립트 생성
        run: |
          MASS_CNT=90000
          BATCH=5000
          SERVICE="mysql"
          for i in $(seq 0 $((MASS_CNT/BATCH - 1))); do
            START=$((i * BATCH + 1))
            END=$(((i + 1) * BATCH))
            OUT=.github/echo_db/vaccount/${SERVICE}_batch_${i}.sql
            for j in $(seq $START $END); do
              echo "INSERT INTO account_${SERVICE} (account_no, user_id, type, balance, open_dt) VALUES ('ACC${SERVICE}${j}', 'user_${SERVICE}_${j}', 'CHECKING', 100000, CURRENT_TIMESTAMP);" >> $OUT
            done
          done
          echo "find .github/echo_db/vaccount/${SERVICE}_batch_*.sql | xargs -P 8 -I{} sh -c 'mysql -uroot -prootpass123 test_db < "{}"'" > .github/echo_db/parallel_exec/${SERVICE}_vaccount_insert_parallel.sh

      - name: 🧮 계좌별/유저별 집계 SELECT 쿼리 생성
        run: |
          echo "SELECT account_no, SUM(balance) as total_balance FROM account_mysql GROUP BY account_no;" > .github/echo_db/select/mysql_balance_sum.sql
          echo "SELECT user_id, SUM(amount) as total_tx FROM ledger_mysql GROUP BY user_id;" > .github/echo_db/select/mysql_tx_sum.sql

      - name: 🏦 Teradata 및 DWH 쿼리 자동 생성
        run: |
          echo "DATABASE dwh_db;" > .github/echo_db/teradata/dwh_schema_create.sql
          echo "CREATE TABLE dwh_account (account_id VARCHAR(50), user_id VARCHAR(50), amount INT);" >> .github/echo_db/teradata/dwh_schema_create.sql
          echo "SELECT user_id, SUM(amount) FROM dwh_account GROUP BY user_id;" > .github/echo_db/aggregate/dwh_tx_summary.sql

      - name: 🧰 Docker Compose 실행 + Teradata 실행 + GitHub Pages 시각화 스크립트 생성
        run: |
          echo "docker-compose -f .github/echo_db/compose/all-db-compose.yml up -d" > .github/echo_db/compose/compose_echo.sh
          echo "/opt/teradata/client/bin/bteq < .github/echo_db/teradata/dwh_schema_create.sql" > .github/echo_db/teradata/run_teradata.sh
          echo "gh-pages-publish site/public" > .github/echo_db/scripts/publish_github_pages.sh

      - name: 🏷️ 전체 Echo 및 생성 결과 출력
        run: |
          find .github/echo_db -type f | sort | while read f; do
            echo "------------------"
            echo "[파일] $f"
            cat "$f"
            echo
          done
