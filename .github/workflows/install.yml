name: 🏢 MEGA DB EchoOps + All-in-One 설치/에코/권한/콘테이너 통합

on:
  workflow_dispatch:
  schedule:
    - cron: '5,20,35,50 * * * *'

jobs:
  mega-echo:
    runs-on: ubuntu-latest
    steps:

    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 📁 필수 디렉토리/에코 생성
      run: |
        set -e
        for d in echo_{dirs,permissions,users,firewall,sql,img,containers,tools,logs,download}; do
          mkdir -p ".github/${d}"
          echo "echo '[ECHO] 디렉토리 생성: .github/${d}'" >> .github/echo_dirs/create_dirs.sh
        done
        chmod +x .github/echo_dirs/create_dirs.sh
        .github/echo_dirs/create_dirs.sh

    - name: 🔐 사용자/비밀번호 대량 에코 생성
      run: |
        set -e
        for i in $(seq 1 50); do
          echo "CREATE USER 'user_$i'@'%' IDENTIFIED BY 'pw_$i';" >> .github/echo_users/mysql_user.sql
          echo "echo '[ECHO] user_$i 생성'" >> .github/echo_users/user_echo.sh
        done
        chmod +x .github/echo_users/user_echo.sh

    - name: 🔓 권한 및 방패워 에코 설정
      run: |
        echo "GRANT ALL PRIVILEGES ON *.* TO 'user_%'@'%' WITH GRANT OPTION;" > .github/echo_permissions/mysql_grant.sql
        echo "sudo ufw allow 3306/tcp" > .github/echo_firewall/mysql_firewall.sh
        chmod +x .github/echo_firewall/mysql_firewall.sh

    - name: 🏛️ SQL/TABLE 에코 생성
      run: |
        for i in $(seq 1 10); do
          echo "CREATE TABLE IF NOT EXISTS table_$i (id INT PRIMARY KEY, val VARCHAR(100));" >> .github/echo_sql/table_create.sql
        done

    - name: 🖼️ 이미지 에코 대량 생성
      run: |
        for i in $(seq 1 5); do
          echo "convert -size 200x100 xc:white -gravity center -pointsize 20 -draw \"text 0,0 'Image $i'\" .github/echo_img/img_$i.png" >> .github/echo_img/gen_imgs.sh
        done
        chmod +x .github/echo_img/gen_imgs.sh

    - name: 📅 콘테이너 에코 생성 (MySQL/PostgreSQL)
      run: |
        echo "docker run -d --name mysql_test -e MYSQL_ROOT_PASSWORD=root -p 3306:3306 mysql:8.0" > .github/echo_containers/mysql.sh
        echo "docker run -d --name pg_test -e POSTGRES_PASSWORD=root -p 5432:5432 postgres:15" > .github/echo_containers/postgres.sh
        echo "docker run -d --name mongo_test -p 27017:27017 mongo" > .github/echo_containers/mongo.sh
        echo "docker run -d --name redis_test -p 6379:6379 redis" > .github/echo_containers/redis.sh
        echo "docker run -d --name oracle_xe -e ORACLE_PASSWORD=oracle -p 1521:1521 gvenzl/oracle-xe" > .github/echo_containers/oracle.sh
        echo "docker run -e 'ACCEPT_EULA=Y' -e 'SA_PASSWORD=Password123!' -p 1433:1433 -d mcr.microsoft.com/mssql/server:2022-latest" > .github/echo_containers/mssql.sh
        echo "docker run -d --name sqlite_test nouchka/sqlite3" > .github/echo_containers/sqlite.sh
        chmod +x .github/echo_containers/*.sh

    - name: 📂 서버 필수 다운로드 링크 기록
      run: |
        echo "MySQL CLI: https://dev.mysql.com/downloads/mysql/" > .github/echo_download/urls.txt
        echo "PostgreSQL CLI: https://www.postgresql.org/download/" >> .github/echo_download/urls.txt
        echo "MongoDB: https://www.mongodb.com/try/download/community" >> .github/echo_download/urls.txt
        echo "Redis: https://redis.io/download/" >> .github/echo_download/urls.txt
        echo "Oracle XE Docker: https://hub.docker.com/r/gvenzl/oracle-xe" >> .github/echo_download/urls.txt
        echo "MSSQL Server: https://learn.microsoft.com/en-us/sql/linux/sql-server-linux-setup" >> .github/echo_download/urls.txt
        echo "SQLite: https://sqlite.org/download.html" >> .github/echo_download/urls.txt

    - name: ⚡️ 서버 설치 스크립트 에코 (MySQL ~ MSSQL)
      run: |
        echo "sudo apt update && sudo apt install -y mysql-server mysql-client" > .github/echo_tools/mysql_install.sh
        echo "sudo apt install -y postgresql postgresql-client" > .github/echo_tools/postgres_install.sh
        echo "sudo apt install -y mongodb" > .github/echo_tools/mongodb_install.sh
        echo "sudo apt install -y redis-server" > .github/echo_tools/redis_install.sh
        echo "echo '[INFO] Oracle XE 는 Docker 이미지로 다루어지면 각 자바 설치 다운로드로 참조'" > .github/echo_tools/oracle_note.sh
        echo "echo '[INFO] MSSQL 는 Docker 또는 Microsoft 설치 가이드 참조'" > .github/echo_tools/mssql_note.sh
        echo "sudo apt install -y sqlite3" > .github/echo_tools/sqlite_install.sh
        chmod +x .github/echo_tools/*.sh

    - name: 🔧 전체 로그 및 결과 기록
      run: |
        echo "echo '[LOG] 모든 설치/에코/권한/생성 완료됨'" > .github/echo_logs/summary.sh
        chmod +x .github/echo_logs/summary.sh
