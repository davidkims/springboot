name: 📓 포트폴리오 + 워크플로 통계로 README & SECURITY 업데이트

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update_docs:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [16, 18, 20]
      max-parallel: 3
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_LATENCY_MS: 1000
      TMP_DIR: .tmp/${{ matrix.os }}-${{ matrix.node-version }}

    steps:
      - name: 🖥️ 환경 정보
        run: |
          echo "[🖥️] 실행 환경 정보 확인"
          echo "OS: ${{ runner.os }}"
          echo "Node.js 버전: ${{ matrix.node-version }}"

      - name: 📅 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 📅 Checkout 완료
        run: |
          echo "[📅] 레포지토리 체크아웃 완료"

      - name: 📦 캐시 설정 (pip, Prometheus)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            /tmp/prometheus-cache
          key: ${{ runner.os }}-cache-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-cache-
      - name: 📦 캐시 설정 완료
        run: |
          echo "[📦] 캐시 설정 완료"

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 📦 Node.js 설치 완료
        run: |
          echo "[📦] Node.js ${{ matrix.node-version }} 설치 완료"

      - name: 🔧 패키지 설치 (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "[🔧] Linux: apt-get로 시스템 패키지 설치 시작"
          sudo apt-get update -y
          echo "[🔧] apt 업데이트 완료"
          sudo apt-get install -y gh jq parallel
          echo "[✅] Linux 패키지 설치 완료"

      - name: 🔧 패키지 설치 (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "[🔧] macOS: brew로 시스템 패키지 설치 시작"
          brew update
          echo "[🔧] brew 업데이트 완료"
          brew install gh jq parallel
          echo "[✅] macOS 패키지 설치 완료"

      - name: 🔧 패키지 설치 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "[🔧] Windows: Chocolatey로 시스템 패키지 설치 시작"
          choco install git.install jq -y || Write-Host "[⚠️] git 또는 jq 설치 실패"
          Write-Host "[ℹ️] parallel 패키지가 Chocolatey에 없어 설치를 생략합니다."
          Write-Host "[✅] Windows 패키지 설치 완료 (parallel 생략)"

      - name: 🔍 패키지 버전 확인
        run: |
          echo "[🔍] gh 버전 확인"; gh --version || echo "[ℹ️] gh CLI not available"
          echo "[🔍] jq 버전 확인"; jq --version || echo "[ℹ️] jq not available"
          echo "[🔍] parallel 버전 확인"; parallel --version || echo "[ℹ️] parallel not available"

      - name: 🛡️ Generate SECURITY.md
        run: |
          echo "[🛡️] SECURITY.md 헤더 생성"
          echo 'cat <<EOF > SECURITY.md'
          echo '# Security Policy'
          echo ''
          echo '## Supported Versions'
          echo '| Version | Supported          |'
          echo '| ------- | ------------------ |'
          echo '| 5.1.x   | :white_check_mark: |'
          echo '| 5.0.x   | :x:                |'
          echo '| 4.0.x   | :white_check_mark: |'
          echo '| < 4.0   | :x:                |'
          echo ''
          echo '## Reporting a Vulnerability'
          echo 'Use this section to tell people how to report vulnerabilities.'
          echo ''
          echo '## Workflow Validation Checklist'
          echo "[🛡️] SECURITY.md cat EOF 파일 생성 시작"
          cat <<EOF > SECURITY.md
# Security Policy

## Supported Versions
| Version | Supported          |
| ------- | ------------------ |
| 5.1.x   | :white_check_mark: |
| 5.0.x   | :x:                |
| 4.0.x   | :white_check_mark: |
| < 4.0   | :x:                |

## Reporting a Vulnerability
Use this section to tell people how to report vulnerabilities.

## Workflow Validation Checklist
EOF
          echo "[🛡️] 워크플로 체크리스트 항목 추가 시작"
          for f in .github/workflows/*.{yml,yaml}; do
            base=$(basename "$f")
            echo "[🗒️] 워크플로 체크리스트 항목 추가: $base"
            echo "- [ ] $base: YAML syntax validation"      >> SECURITY.md
            echo "- [ ] $base: Permissions review"          >> SECURITY.md
            echo "- [ ] $base: Secret detection scan"        >> SECURITY.md
            echo "- [ ] $base: Dependency scanning enabled"  >> SECURITY.md
            echo "- [ ] $base: Container scanning enabled"   >> SECURITY.md
          done
          echo "[✅] SECURITY.md 생성 및 업데이트 완료"

      - name: 📋 Ensure TMP_DIR
        run: |
          echo "[📋] TMP_DIR 생성 시도: $TMP_DIR"
          mkdir -p "$TMP_DIR"
          echo "[✅] $TMP_DIR 생성 완료"

      - name: 📊 병렬 워크플로우 통계 수집
        run: |
          echo "[📊] 워크플로우 통계 마크다운(헤더) 생성"
          echo 'cat <<EOF > $OUTPUT_FILE'
          echo '## ⚙️ GitHub Actions 워크플로우 목록 및 통계'
          echo ''
          echo '| 워크플로우 이름 | 실행 수 | 성공 수 | 실패 수 | 성공률 |'
          echo '|----------------|--------:|--------:|--------:|--------:|'
          OUTPUT_FILE="$TMP_DIR/workflows.md"
          echo "[📊] 워크플로우 통계 마크다운 파일 cat EOF 생성 시작"
          cat <<EOF > "$OUTPUT_FILE"
## ⚙️ GitHub Actions 워크플로우 목록 및 통계

| 워크플로우 이름 | 실행 수 | 성공 수 | 실패 수 | 성공률 |
|----------------|--------:|--------:|--------:|--------:|
EOF
          echo "[📊] 각 워크플로우별 통계 계산 시작"
          parallel_stats() {
            f="$1"
            NAME=$(grep '^name:' "$f" | head -n1 | cut -d ':' -f2- | xargs)
            FILENAME=$(basename "$f")
            echo "[🔎] $FILENAME 통계 계산"
            RUNS=$(gh run list --workflow="$FILENAME" --limit 500 --json conclusion -q '.[] | .conclusion')
            TOTAL=$(echo "$RUNS" | wc -l)
            SUCCESS=$(echo "$RUNS" | grep -c success || true)
            FAILURE=$((TOTAL - SUCCESS))
            if [ "$TOTAL" -gt 0 ]; then
              RATE=$(awk "BEGIN {printf \"%.1f\", ($SUCCESS/$TOTAL)*100}")
            else
              RATE="N/A"
            fi
            echo "| $NAME | $TOTAL | $SUCCESS | $FAILURE | $RATE% |"
          }
          export -f parallel_stats
          CORES=2
          if command -v nproc >/dev/null 2>&1; then CORES=$(nproc); fi
          echo "[📊] 병렬 처리 코어수: $CORES"
          echo "[📊] 통계 마크다운에 데이터 추가 시작"
          echo "find .github/workflows ... | parallel ... >> \$OUTPUT_FILE"
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) \
            | parallel --no-notice -j $CORES parallel_stats {} >> "$OUTPUT_FILE"
          echo "[📊] 워크플로우 통계 마크다운 파일 생성 완료"
          echo "cat \$OUTPUT_FILE"
          cat "$OUTPUT_FILE"
          echo "[✅] 워크플로우 통계 수집 및 출력 완료"

      - name: 📝 README.md 생성
        run: |
          echo "[📝] README.md 헤더 생성"
          echo 'cat <<EOF > README.md'
          echo '# 프로젝트 포트폴리오'
          echo ''
          echo '## 워크플로우 통계'
          echo "[📝] README.md cat EOF 파일 생성 시작"
          cat <<EOF > README.md
# 프로젝트 포트폴리오

## 워크플로우 통계
EOF
          echo "[📝] 워크플로우 통계 파일 README에 추가"
          cat "$TMP_DIR/workflows.md" >> README.md
          echo "[✅] README.md 파일 생성 완료"

      - name: 📦 Prometheus 메트릭 저장
        if: runner.os == 'Linux'
        run: |
          echo "[📦] Prometheus 메트릭 파일 복사 시작"
          echo "sudo cp ..."
          sudo cp "$TMP_DIR/workflows.md" /opt/prometheus/data/${{ matrix.os }}-${{ matrix.node-version }}.md
          echo "mkdir -p prometheus_data"
          mkdir -p prometheus_data
          echo "cp ... prometheus_data"
          cp "$TMP_DIR/workflows.md" prometheus_data/${{ matrix.os }}-${{ matrix.node-version }}.md
          echo "[✅] 메트릭 저장 완료"

      - name: 📦 메트릭 아티팩트 업로드
        run: |
          echo "[📦] 메트릭 아티팩트 업로드 시작"
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-metrics-data
          path: prometheus_data/**

      - name: 🔍 Super-Linter
        run: |
          echo "[🔍] Super-Linter 실행 시작"
        uses: github/super-linter@v5
        env:
          VALIDATE_YAML: true
          VALIDATE_DOCKERFILE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ 동적 배지 & 태그 생성
        run: |
          echo "[🏷️] 배지 생성 요청"
          echo "curl -X POST ... shields.io"
          curl -X POST "https://img.shields.io/badge/build-passing-brightgreen"
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            TAG="v$(date +%Y.%m.%d.%H%M)"
            echo "[🏷️] 태그 생성: $TAG"
            echo "git tag $TAG"
            git tag "$TAG"
            echo "git push origin $TAG"
            git push origin "$TAG"
            echo "[✅] 태그 $TAG 생성 및 푸시 완료"
          fi

      - name: 🧹 클린업
        run: |
          echo "[🧹] 임시 파일/패키지 정리 시작"
          echo "rm -rf $TMP_DIR"
          rm -rf "$TMP_DIR"
          echo "rm -f prometheus.tar.gz"
          rm -f prometheus.tar.gz
          echo "[✅] 클린업 완료"

      - name: 🔁 Commit / Push or PR
        run: |
          echo "[🔁] 변경사항 커밋/푸시 확인"
          echo "git config ..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "git add ..."
          git add README.md SECURITY.md prometheus_data/ || echo "[ℹ️] add nothing"
          echo "git diff --cached --quiet"
          if git diff --cached --quiet; then
            echo "[ℹ️] 변경사항 없음, 종료"
            exit 0
          fi
          echo "[🔁] 커밋 및 푸시 실행"
          echo "git commit ..."
          git commit -m "문서: README & SECURITY 업데이트 [skip ci]"
          echo "git push origin HEAD:main"
          git push origin HEAD:main || (
            BRANCH="update-docs-$(date +%s)";
            echo "[🔁] PR용 임시 브랜치 생성: $BRANCH"
            echo "git checkout -b $BRANCH"
            git checkout -b "$BRANCH";
            echo "git push origin $BRANCH"
            git push origin "$BRANCH";
            echo "gh pr create ..."
            gh pr create --title "문서: README & SECURITY 업데이트" --body "자동 PR" --base main;
          )
