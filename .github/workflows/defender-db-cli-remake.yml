name: "🛡️ EchoSec v5: White-Hat Security Scan (stable, CLI Semgrep, fixed Gitleaks)"

on:
  workflow_dispatch:
    inputs:
      legal_ack:
        description: "외부 스캔 허용: 본인 소유/관리 시스템만. 'I OWN THIS' 입력 시 ZAP/Nmap 활성화"
        required: true
        default: "NO"
      target_url:
        description: "(선택) ZAP 대상 URL (https:// 포함)"
        required: false
        default: ""
      nmap_targets:
        description: "(선택) Nmap 대상 호스트/IP (공백 구분)"
        required: false
        default: ""
      enable_nmap:
        description: "Nmap 안전 스캔 실행 (true/false)"
        required: true
        default: "false"
      docker_image:
        description: "(선택) Trivy 이미지 스캔 대상 (예: ghcr.io/owner/app:tag)"
        required: false
        default: ""
      trivy_severity:
        description: "Trivy 심각도 필터 (예: CRITICAL,HIGH)"
        required: true
        default: "CRITICAL,HIGH"
      semgrep_config:
        description: "Semgrep 규칙 세트 (예: p/ci, p/security-audit 등)"
        required: true
        default: "p/ci"
      zap_max_time:
        description: "ZAP Baseline 최대 실행(초)"
        required: true
        default: "600"
      repo_path:
        description: "스캔할 코드 루트 경로(모노레포면 서브폴더)"
        required: true
        default: "."
      trivy_skip_files:
        description: "Trivy --skip-files (쉼표 구분 패턴들)"
        required: false
        default: ".github/migration/*.csv,**/*.csv,**/*.zip,**/*.jar,**/*.png,**/*.jpg,**/*.pdf"

  # 코드 스캔만 정기 실행 (외부 타겟 스캔은 수동+동의 필수)
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: read

env:
  ECHO_ROOT: ${{ github.workspace }}/.github/echo_sec
  ECHO_OUT:  ${{ github.workspace }}/.github/echo_sec/out
  ECHO_LOG:  ${{ github.workspace }}/.github/echo_sec/logs
  ECHO_TMP:  ${{ github.workspace }}/.github/echo_sec/tmp

concurrency:
  group: echoosec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: "🧩 Guard: 합법성 확인 & 디렉토리 준비"
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.legal.outputs.allowed }}
    steps:
      - uses: actions/checkout@v5
      - name: "디렉토리 준비"
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_OUT" "$ECHO_LOG" "$ECHO_TMP"
          echo "[ECHO][OK] dirs ready at $ECHO_ROOT"
      - id: legal
        name: "법적 동의(legal_ack) 검사"
        run: |
          if [[ "${{ inputs.legal_ack }}" == "I OWN THIS" ]]; then
            echo "allowed=true"  >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "[ECHO] allowed=$(sed -n 's/^allowed=//p' $GITHUB_OUTPUT)" | tee -a "$ECHO_LOG/guard.txt"
      - name: "요약"
        run: |
          {
            echo "### EchoSec Guard"
            echo "- allowed(ZAP/Nmap): \`${{ steps.legal.outputs.allowed }}\`"
            echo "- target_url: \`${{ inputs.target_url || 'N/A' }}\`"
            echo "- nmap_targets: \`${{ inputs.nmap_targets || 'N/A' }}\`"
            echo "- outputs: \`$ECHO_OUT\`"
          } >> "$GITHUB_STEP_SUMMARY"

  sast_and_secrets:
    name: "🔍 SAST/Secrets/Deps (Gitleaks + Semgrep CLI + Trivy FS)"
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: "SRC_DIR 계산"
        run: |
          set -Eeuo pipefail
          SRC_DIR="$(python3 -c 'import os;print(os.path.normpath(os.path.join(os.environ.get("GITHUB_WORKSPACE",""), "${{ inputs.repo_path }}")))' )"
          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"
          mkdir -p "$ECHO_OUT" "$ECHO_LOG" "$ECHO_TMP"
          echo "[ECHO][OK] SRC_DIR=$SRC_DIR"

      # ---- Gitleaks (공식 액션; args 미사용) ----
      - name: "Gitleaks (비밀키 탐지)"
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 조직 리포면 라이선스 필요: GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: "Gitleaks 결과 복사"
        run: |
          set -Eeuo pipefail
          test -f "results.sarif" && cp "results.sarif" "$ECHO_OUT/gitleaks.sarif" || touch "$ECHO_OUT/gitleaks.sarif"
          echo "[ECHO][OK] gitleaks -> $ECHO_OUT/gitleaks.sarif"

      # ---- Semgrep (권장: 네이티브 CLI) ----
      - name: "Semgrep 설치 (pipx)"
        run: |
          set -Eeuo pipefail
          python3 -m pip install --user pipx >/dev/null
          python3 -m pipx ensurepath
          ~/.local/bin/pipx install semgrep >/dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: "Semgrep 실행"
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          semgrep --version
          semgrep --config "${{ inputs.semgrep_config }}" --json --timeout 240 -o "$ECHO_OUT/semgrep.json" "${{ env.SRC_DIR }}" || true
          echo "[ECHO][OK] semgrep -> $ECHO_OUT/semgrep.json"
        # 참고: semgrep CI/배포 가이드는 AppSec Platform 기반 구성을 권장(원하면 토큰 연계해 GHAS 업로드도 가능). :contentReference[oaicite:3]{index=3}

      # ---- Trivy (FS) ----
      - name: "Trivy Filesystem"
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: "fs"
          scan-ref: "${{ env.SRC_DIR }}"
          scanners: "vuln,secret,misconfig,license"
          severity: "${{ inputs.trivy_severity }}"
          format: "sarif"
          output: "${{ env.ECHO_OUT }}/trivy-fs.sarif"
          timeout: "5m"
          ignore-unfixed: true
          skip-files: "${{ inputs.trivy_skip_files }}"

      - name: "아티팩트 업로드 (SAST/Secrets/Deps)"
        uses: actions/upload-artifact@v4
        with:
          name: echoosec-sast-secrets-deps
          path: |
            ${{ env.ECHO_OUT }}/gitleaks.sarif
            ${{ env.ECHO_OUT }}/semgrep.json
            ${{ env.ECHO_OUT }}/trivy-fs.sarif
          if-no-files-found: warn
          retention-days: 7

  container_scan:
    name: "🐳 Trivy Image (옵션)"
    needs: guard
    if: ${{ inputs.docker_image != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: "Trivy Image"
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: "image"
          image-ref: "${{ inputs.docker_image }}"
          severity: "${{ inputs.trivy_severity }}"
          format: "sarif"
          output: "${{ env.ECHO_OUT }}/trivy-image.sarif"
          timeout: "5m"
          ignore-unfixed: true
      - uses: actions/upload-artifact@v4
        with:
          name: echoosec-image
          path: ${{ env.ECHO_OUT }}/trivy-image.sarif
          if-no-files-found: warn
          retention-days: 7

  web_scan_zap:
    name: "🌐 ZAP Baseline (옵션)"
    needs: guard
    if: ${{ github.event_name == 'workflow_dispatch' && needs.guard.outputs.allowed == 'true' && inputs.target_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: "ZAP Baseline Scan"
        id: zap
        uses: zaproxy/action-baseline@v0.11.0
        continue-on-error: true
        with:
          target: "${{ inputs.target_url }}"
          rules_file_name: ""
          cmd_options: "-m ${{ inputs.zap_max_time }}"
        # 참고: Baseline은 수동 스파이더+패시브 스캔으로 안전합니다. :contentReference[oaicite:4]{index=4}
      - name: "ZAP 리포트 수집(가능 시)"
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_OUT"
          for f in report.html report.xml zap_report.html zap_report.xml; do
            [[ -f "$f" ]] && cp "$f" "$ECHO_OUT/" || true
          done
          ls -al "$ECHO_OUT" || true
      - uses: actions/upload-artifact@v4
        with:
          name: echoosec-zap
          path: |
            ${{ env.ECHO_OUT }}/report.html
            ${{ env.ECHO_OUT }}/report.xml
            ${{ env.ECHO_OUT }}/zap_report.html
            ${{ env.ECHO_OUT }}/zap_report.xml
          if-no-files-found: warn
          retention-days: 7

  http_header_audit:
    name: "🧪 HTTP 보안헤더 점검(샘플)"
    needs: guard
    if: ${{ github.event_name == 'workflow_dispatch' && needs.guard.outputs.allowed == 'true' && inputs.target_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: mkdir -p "$ECHO_ROOT/tools" "$ECHO_OUT"
      - name: "headers_audit.py 생성"
        run: |
          cat > "$ECHO_ROOT/tools/headers_audit.py" <<'PY'
          import sys, json, requests
          TARGET = sys.argv[1]
          MUST = [
            "strict-transport-security",
            "content-security-policy",
            "x-frame-options",
            "x-content-type-options",
            "referrer-policy",
            "permissions-policy",
          ]
          res = requests.get(TARGET, timeout=20, allow_redirects=True)
          headers = {k.lower(): v for k, v in res.headers.items()}
          report = {"target": TARGET, "status": res.status_code, "missing": [], "present": {}}
          for h in MUST:
              if h in headers: report["present"][h] = headers[h]
              else: report["missing"].append(h)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: "실행"
        run: |
          python3 -m pip install --upgrade pip requests >/dev/null
          python3 "$ECHO_ROOT/tools/headers_audit.py" "${{ inputs.target_url }}" | tee "$ECHO_OUT/http-headers.json"
      - uses: actions/upload-artifact@v4
        with:
          name: echoosec-http-headers
          path: ${{ env.ECHO_OUT }}/http-headers.json
          if-no-files-found: warn
          retention-days: 7

  nmap_safe:
    name: "📡 Nmap 안전 스캔(옵션)"
    needs: guard
    if: ${{ github.event_name == 'workflow_dispatch' && needs.guard.outputs.allowed == 'true' && inputs.enable_nmap == 'true' && inputs.nmap_targets != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -y && sudo apt-get install -y nmap && mkdir -p "$ECHO_OUT"
      - name: "Nmap 안전 옵션"
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          nmap -sV -T3 --top-ports 200 -oN "$ECHO_OUT/nmap.txt" -oX "$ECHO_OUT/nmap.xml" ${{ inputs.nmap_targets }} || true
          echo "[ECHO][OK] nmap -> $ECHO_OUT/nmap.[txt|xml]"
      - uses: actions/upload-artifact@v4
        with:
          name: echoosec-nmap
          path: |
            ${{ env.ECHO_OUT }}/nmap.txt
            ${{ env.ECHO_OUT }}/nmap.xml
          if-no-files-found: warn
          retention-days: 7

  summarize:
    name: "📑 요약"
    needs: [guard, sast_and_secrets, container_scan, web_scan_zap, http_header_audit, nmap_safe]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "결과 요약"
        run: |
          {
            echo "## EchoSec v5 실행 요약"
            echo "- legal_ack(외부스캔 허용): \`${{ needs.guard.outputs.allowed }}\`"
            echo "- 산출물: \`$ECHO_OUT\`"
            echo ""
            echo "| 카테고리 | 파일 |"
            echo "|---|---|"
            echo "| Secrets | gitleaks.sarif |"
            echo "| SAST | semgrep.json |"
            echo "| Deps/FS | trivy-fs.sarif |"
            echo "| Container(Optional) | trivy-image.sarif |"
            echo "| Web(Optional) | report.html/report.xml (또는 zap_report.*) |"
            echo "| HTTP Headers(Optional) | http-headers.json |"
            echo "| Nmap(Optional) | nmap.txt / nmap.xml |"
          } >> "$GITHUB_STEP_SUMMARY"
