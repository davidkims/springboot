name: "🌱 Spring Boot Maven + Scaffold Safe + Echo C/C Fullset (5min cadence)"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 실행

permissions:
  contents: write

env:
  ECHO_LOG: .github/echo_sb/logs
  ECHO_OUT: .github/echo_sb/out
  SITE_DIR: site/springboot

jobs:
  build-springboot:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare echo dirs
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"

      - name: Scaffold Spring Boot if missing
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR/scaffold"
          if [ ! -f pom.xml ]; then
            echo "[ECHO] No pom.xml found. Generating Spring Boot scaffold." | tee -a "$ECHO_LOG/main.log"
            curl -fsSL "https://start.spring.io/starter.zip?type=maven-project&language=java&groupId=com.example&artifactId=demo&name=demo&packageName=com.example.demo&javaVersion=21&dependencies=web,data-jpa,security,actuator,lombok" -o "$ECHO_OUT/starter.zip"
            unzip -q "$ECHO_OUT/starter.zip" -d "$ECHO_OUT/sb_scaffold"
            cp -r "$ECHO_OUT/sb_scaffold"/* "$SITE_DIR/scaffold/"
          else
            echo "[ECHO] Existing pom.xml detected, skipping scaffold." | tee -a "$ECHO_LOG/main.log"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build with Maven
        run: |
          set -Eeuo pipefail
          mkdir -p "$SITE_DIR/out"
          mvn -B -ntp clean package | tee -a "$ECHO_LOG/build.log"
          cp target/*.jar "$SITE_DIR/out/" || true

      - name: Generate C/C Fullset (manual run)
        run: |
          set -Eeuo pipefail
          mkdir -p "$SITE_DIR/cc"
          # SBOM
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.8.0:makeAggregateBom \
            -DoutputFormat=json -DoutputDirectory="$SITE_DIR/cc" | tee -a "$ECHO_LOG/cc.log"
          # License
          mvn -B -ntp org.codehaus.mojo:license-maven-plugin:2.3.0:aggregate-add-third-party \
            -DthirdPartyFilename="$SITE_DIR/cc/THIRD-PARTY.txt" | tee -a "$ECHO_LOG/cc.log"
          # Checksums
          : > "$SITE_DIR/cc/CHECKSUMS.sha256"
          find "$SITE_DIR/out" -type f -name "*.jar" -print0 | xargs -0 sha256sum >> "$SITE_DIR/cc/CHECKSUMS.sha256"
          # Signature mock
          echo "-----BEGIN SIGNATURE-----" > "$SITE_DIR/cc/SIGNATURE.asc"
          date -u >> "$SITE_DIR/cc/SIGNATURE.asc"
          echo "-----END SIGNATURE-----" >> "$SITE_DIR/cc/SIGNATURE.asc"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: springboot-echo-fullset-${{ github.run_id }}
          path: |
            site/springboot/**
            .github/echo_sb/logs/*

  cc-pack:
    # 5분마다 실행 (scaffold/빌드 스킵, C/C만 생성)
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare echo dirs
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"/cc

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Generate Scheduled C/C Pack
        run: |
          set -Eeuo pipefail
          mkdir -p "$SITE_DIR/cc"
          # SBOM
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.8.0:makeAggregateBom \
            -DoutputFormat=json -DoutputDirectory="$SITE_DIR/cc" | tee -a "$ECHO_LOG/cc.log"
          # License
          mvn -B -ntp org.codehaus.mojo:license-maven-plugin:2.3.0:aggregate-add-third-party \
            -DthirdPartyFilename="$SITE_DIR/cc/THIRD-PARTY.txt" | tee -a "$ECHO_LOG/cc.log"
          # Checksums
          : > "$SITE_DIR/cc/CHECKSUMS.sha256"
          find . -type f -name "*.jar" -print0 | xargs -0 sha256sum >> "$SITE_DIR/cc/CHECKSUMS.sha256" || true
          # Signature mock
          echo "-----BEGIN SIGNATURE-----" > "$SITE_DIR/cc/SIGNATURE.asc"
          date -u >> "$SITE_DIR/cc/SIGNATURE.asc"
          echo "-----END SIGNATURE-----" >> "$SITE_DIR/cc/SIGNATURE.asc"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: springboot-ccpack-${{ github.run_id }}
          path: |
            site/springboot/cc/**
            .github/echo_sb/logs/*
