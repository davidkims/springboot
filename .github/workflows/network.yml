name: 🌐 .github No files 에러 0% 보장 최종 워크플로우

on:
  workflow_dispatch:

jobs:
  force-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🛡️ 업로드 직전 .github 생성+dummy 파일
        run: |
          echo "현재 작업디렉토리: $PWD"
          GH=".github"
          # 1. 어떤 상황이든 현재 디렉토리에 .github 만들고 최소 2개 파일 넣음
          mkdir -p $GH/workflows $GH/force $GH/error_logs
          echo "force-upload" > $GH/force/dummy.txt
          echo "force-wf" > $GH/workflows/dummy.yml
          echo "force-log" > $GH/error_logs/dummy.txt
          echo "README for upload test" > $GH/README.md
          echo "[dummy]" > $GH/dummy.txt

          # 2. 강제로 "실제" 파일 개수 체크 (find)
          cnt=$(find $GH -type f | wc -l)
          echo "생성된 .github 파일 개수: $cnt"
          find $GH -type f | sort

          if [ "$cnt" -eq 0 ]; then
            echo "::error ::업로드 직전에도 .github에 파일이 1개도 없습니다!"
            exit 1
          fi

      - name: 📦 .github 업로드 (No files 에러 0%)
        uses: actions/upload-artifact@v4
        with:
          name: all-github-artifacts
          path: .github/**
          if-no-files-found: error
