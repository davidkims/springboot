# 워크플로우의 이름 설정
name: Multi-Server Netstat Reporter (Issue Report Only)

# 워크플로우를 실행할 조건 설정
on:
  # 매일 UTC 기준 00:00 (KST 09:00)에 실행
  schedule:
    - cron: '0 0 * * *'
  # GitHub UI에서 'Run workflow' 버튼으로 수동 실행 가능
  workflow_dispatch:

# 워크플로우에서 실행할 작업(jobs) 정의
jobs:
  check_and_report_netstat:
    runs-on: ubuntu-latest

    # GitHub Secrets에 등록된 서버 정보와 SSH 키를 워크플로우에 전달
    env:
      REPORT_TITLE: "Daily Netstat Report"
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      #----------------------------------------------------
      # 1. SSH를 통해 원격 서버에 접속하여 netstat 실행
      #----------------------------------------------------
      - name: Get netstat data from server
        id: netstat_data_step
        uses: appleboy/ssh-action@v0.1.7
        with:
          # 시크릿에 저장된 SSH 접속 정보 사용
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          # 실행할 셸 스크립트. 여러 명령어를 조합하여 실행 결과를 정리
          script: |
            echo "# 서버 네트워크 상태 보고서"
            echo ""
            echo "## $(hostname) 서버"
            echo ""
            echo "### 1. LISTEN 상태 포트"
            echo "```bash"
            netstat -lntp
            echo "```"
            echo ""
            echo "### 2. TCP 연결 상태별 통계"
            echo "```bash"
            netstat -ant | awk '{print $6}' | sort | uniq -c | sort -nr
            echo "```"
            echo ""
            echo "### 3. 주요 포트 점검 (80, 443)"
            echo "---"
            
            PORT_TO_CHECK="80 443"
            for PORT in $PORT_TO_CHECK; do
              if netstat -lnt | grep -q ":$PORT\s*LISTEN"; then
                echo "✅ Port $PORT is listening."
              else
                echo "❌ Port $PORT is NOT listening."
              fi
            done
            
            echo ""
            echo "---"
            echo "점검 시간: $(date '+%Y-%m-%d %H:%M:%S')"
            
      #----------------------------------------------------
      # 2. 결과 보고서 생성 및 GitHub Issue에 등록
      #----------------------------------------------------
      - name: Create GitHub Issue report
        uses: peter-evans/create-issue-from-file@v4
        with:
          # 이슈 제목을 동적으로 생성
          title: 'Netstat Report - Server Status (${{ github.ref_name }})'
          # SSH 접속 스크립트의 출력 결과를 이슈 내용으로 사용
          content: ${{ steps.netstat_data_step.outputs.stdout }}
          # GITHUB_TOKEN을 사용하여 이슈 생성 권한 부여
          token: ${{ secrets.GITHUB_TOKEN }}
          # 보고서를 할당할 사용자 지정 (선택 사항)
          assignees: your-github-username
