name: Setup Logistics Environment with Airflow DAG Validation & Security Check

on:
  workflow_dispatch:

jobs:
  build-environment:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout code
        uses: actions/checkout@v4

      - name: 📂 Create logistics directories
        run: |
          sudo mkdir -p /opt/logistics/{mysql,postgresql,oracle,mongodb,airflow,dags,test_logs,camunda,salesforce_flow,virtual_customer_data,scorecard/reports,aws,gcp,smtp,dotnet,node,java,python}
          sudo chmod -R 775 /opt/logistics
          mkdir -p .github/logs

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🐍 Copy Python Setup to Directory
        run: |
          echo "[COPY] Copying Python binaries to /opt/logistics/python"
          cp -r ${{ env.pythonLocation }}/* /opt/logistics/python || true

      - name: ☕ Setup Java 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: ☕ Copy Java Setup to Directory
        run: |
          echo "[COPY] Copying Java binaries to /opt/logistics/java"
          cp -r $JAVA_HOME/* /opt/logistics/java || true

      - name: 🔣 Setup .NET 7
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: 🔣 Copy .NET Setup to Directory
        run: |
          echo "[COPY] Copying .NET to /opt/logistics/dotnet"
          cp -r /usr/share/dotnet/* /opt/logistics/dotnet || true

      - name: 🟢 Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 🟢 Copy Node.js Setup to Directory
        run: |
          echo "[COPY] Copying Node.js to /opt/logistics/node"
          cp -r /opt/hostedtoolcache/node/* /opt/logistics/node || true

      - name: 🌬 Install Apache Airflow and Providers
        run: |
          echo "[LOG] Installing Apache Airflow and Providers"
          python -m pip install --upgrade pip
          pip install apache-airflow==2.6.0 \
            apache-airflow-providers-postgres \
            apache-airflow-providers-docker \
            apache-airflow-providers-amazon \
            apache-airflow-providers-google \
            apache-airflow-providers-smtp \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.6.0/constraints-3.10.txt"
          airflow db init
          echo "[DONE] Airflow and providers initialized" > .github/logs/airflow_setup.log
          sudo mkdir -p /opt/logistics/airflow
          cp -r ~/airflow/* /opt/logistics/airflow/ || true
          cp -r ~/.local/lib/python3.10/site-packages/airflow /opt/logistics/airflow/ || true

      - name: 🌬 Create Airflow Healthcheck DAG
        run: |
          echo "[DAG] Creating Airflow healthcheck DAG"
          mkdir -p ~/airflow/dags
          DAG_PATH=~/airflow/dags/airflow_healthcheck_dag.py
          echo "from airflow import DAG" | tee $DAG_PATH
          echo "from airflow.operators.bash import BashOperator" | tee -a $DAG_PATH
          echo "from datetime import datetime" | tee -a $DAG_PATH
          echo "" | tee -a $DAG_PATH
          echo "with DAG(" | tee -a $DAG_PATH
          echo "    'airflow_healthcheck_dag'," | tee -a $DAG_PATH
          echo "    start_date=datetime(2023, 1, 1)," | tee -a $DAG_PATH
          echo "    schedule_interval='@daily'," | tee -a $DAG_PATH
          echo "    catchup=False" | tee -a $DAG_PATH
          echo ") as dag:" | tee -a $DAG_PATH
          echo "    health_check = BashOperator(" | tee -a $DAG_PATH
          echo "        task_id='check_airflow_webserver'," | tee -a $DAG_PATH
          echo "        bash_command='curl -sf http://localhost:8080/health || exit 1'" | tee -a $DAG_PATH
          echo "    )" | tee -a $DAG_PATH
          echo "[DONE] Healthcheck DAG created" > .github/logs/airflow_healthcheck_dag.log
          sudo cp $DAG_PATH /opt/logistics/airflow/dags/

      - name: ▶️ Test Airflow DAG execution
        run: |
          echo "[TEST] Testing Airflow DAG airflow_healthcheck_dag"
          airflow dags test airflow_healthcheck_dag 2025-01-01 > /opt/logistics/airflow/test_logs/airflow_healthcheck_dag_test.log || echo "[❌] DAG test failed"

      - name: 🔐 Install OSSF Scorecard CLI
        run: |
          sudo apt-get update && sudo apt-get install -y wget unzip
          wget https://github.com/ossf/scorecard/releases/latest/download/scorecard-linux-amd64
          chmod +x scorecard-linux-amd64
          mv scorecard-linux-amd64 /opt/logistics/scorecard/scorecard

      - name: 🔎 Run Scorecard on DAGs directory
        run: |
          find /opt/logistics/airflow/dags -name "*.py" | while read file; do
            /opt/logistics/scorecard/scorecard --local . --repo=https://github.com/example/logistics --checks=Security-Policy --output-format=json --norepo --file="$file" > "/opt/logistics/scorecard/reports/$(basename $file).scorecard.json"
          done
          echo "[✔] Scorecard analysis complete"

      - name: 📦 Save Airflow DAGs and logs
        run: |
          ls -al /opt/logistics/airflow/dags
          cat /opt/logistics/airflow/test_logs/airflow_healthcheck_dag_test.log || true
          cat .github/logs/airflow_healthcheck_dag.log || true
