      - name: 🧩 Multi-service image builds and deployments
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          
          # Build Omni service (Enhanced)
          if [ "${RUN_OMNI}" = "true" ]; then
            cat > "${ECHO_OMNI}/app.py" <<'PY'
          import os
          import json
          import asyncio
          from datetime import datetime
          from typing import List, Dict, Any, Optional
          import psycopg2
          from psycopg2.pool import SimpleConnectionPool
          from fastapi import FastAPI, HTTPException, Query, BackgroundTasks
          from fastapi.responses import JSONResponse, Response
          from fastapi.middleware.cors import CORSMiddleware
          from prometheus_client import Counter, Histogram, Gauge, generate_latest, CONTENT_TYPE_LATEST
          
          # Environment configuration
          DB_HOST = os.getenv("DB_HOST", "td-sim")
          DB_PORT = int(os.getenv("DB_PORT", "5432"))
          DB_NAME = os.getenv("DB_NAME", "postgres")
          DB_USER = os.getenv("DB_USER", "postgres")
          DB_PASS = os.getenv("DB_PASS", "postgres")
          QUERIES_DIR = os.getenv("QUERIES_DIR", "/queries")
          SERVICE = os.getenv("SERVICE_NAME", "omni")
          
          # FastAPI app initialization
          app = FastAPI(
              title="Enhanced Omni Echo API",
              description="Multi-service DW + Metrics + Health + Slots",
              version="8.5.0"
          )
          
          # Add CORS middleware
          app.add_middleware(
              CORSMiddleware,
              allow_origins=["*"],
              allow_credentials=True,
              allow_methods=["*"],
              allow_headers=["*"],
          )
          
          # Database pool
          pool = None
          
          # Prometheus metrics
          REQ_COUNTER = Counter("omni_requests_total", "HTTP requests", ["path", "method", "status"])
          REQ_DURATION = Histogram("omni_request_duration_seconds", "Request duration", ["path"])
          ACTIVE_CONNECTIONS = Gauge("omni_db_connections_active", "Active DB connections")
          
          @app.on_event("startup")
          async def startup_event():
              global pool
              pool = SimpleConnectionPool(
                  minconn=2, maxconn=10,
                  host=DB_HOST, port=DB_PORT, 
                  dbname=DB_NAME, user=DB_USER, password=DB_PASS
              )
              
              # Initialize service tables
              with pool.getconn() as conn:
                  with conn.cursor() as cur:
                      cur.execute("""
                      CREATE SCHEMA IF NOT EXISTS omni;
                      CREATE TABLE IF NOT EXISTS omni.service_info(
                          id SERIAL PRIMARY KEY,
                          service_name VARCHAR(50) NOT NULL,
                          version VARCHAR(20),
                          build_time TIMESTAMP DEFAULT NOW(),
                          config JSONB,
                          status VARCHAR(20) DEFAULT 'active'
                      );
                      CREATE TABLE IF NOT EXISTS omni.service_events(
                          id BIGSERIAL PRIMARY KEY,
                          event_time TIMESTAMP DEFAULT NOW(),
                          event_type VARCHAR(50) NOT NULL,
                          event_data JSONB,
                          severity VARCHAR(20) DEFAULT 'info',
                          source VARCHAR(100)
                      );
                      CREATE TABLE IF NOT EXISTS omni.health_checks(
                          id BIGSERIAL PRIMARY KEY,
                          check_time TIMESTAMP DEFAULT NOW(),
                          status VARCHAR(20) NOT NULL,
                          response_time_ms INTEGER,
                          error_message TEXT,
                          service_instance VARCHAR(50)
                      );
                      """)
                      
                      # Log startup event
                      cur.execute(
                          "INSERT INTO omni.service_events(event_type, source, event_data) VALUES (%s, %s, %s)",
                          ("startup", SERVICE, json.dumps({"message": "Service started", "version": "8.5.0"}))
                      )
                      conn.commit()
              
              print(f"[{SERVICE}] Enhanced Omni service started")
          
          @app.on_event("shutdown")
          async def shutdown_event():
              global pool
              if pool:
                  pool.closeall()
          
          def execute_query_file(path: str) -> List[Dict[str, Any]]:
              sql_path = os.path.join(QUERIES_DIR, path)
              if not os.path.isfile(sql_path):
                  raise HTTPException(status_code=404, detail=f"Query file not found: {path}")
              
              with open(sql_path, "r", encoding="utf-8") as f:
                  sql = f.read()
              
              try:
                  conn = pool.getconn()
                  cur = conn.cursor()
                  cur.execute(sql)
                  
                  if cur.description:
                      cols = [desc[0] for desc in cur.description]
                      rows = cur.fetchall()
                      result = []
                      
                      for row in rows:
                          item = {}
                          for col, val in zip(cols, row):
                              if isinstance(val, datetime):
                                  item[col] = val.isoformat()
                              elif hasattr(val, '__float__'):
                                  item[col] = float(val)
                              else:
                                  item[col] = val
                          result.append(item)
                      
                      cur.close()
                      pool.putconn(conn)
                      return result
                  else:
                      cur.close()
                      pool.putconn(conn)
                      return []
              except Exception as e:
                  raise HTTPException(status_code=500, detail=str(e))
          
          def log_health_check(status: str, response_time: int, error: Optional[str] = None):
              try:
                  conn = pool.getconn()
                  cur = conn.cursor()
                  cur.execute(
                      "INSERT INTO omni.health_checks(status, response_time_ms, error_message, service_instance) VALUES (%s, %s, %s, %s)",
                      (status, response_time, error, SERVICE)
                  )
                  conn.commit()
                  cur.close()
                  pool.putconn(conn)
              except:
                  pass  # Don't fail health check due to logging error
          
          @app.middleware("http")
          async def metrics_middleware(request, call_next):
              start_time = datetime.utcnow()
              
              with REQ_DURATION.labels(path=request.url.path).time():
                  response = await call_next(request)
              
              REQ_COUNTER.labels(
                  path=request.url.path,
                  method=request.method,
                  status=response.status_code
              ).inc()
              
              return response
          
          @app.get("/health")
          async def health_check():
              start_time = datetime.utcnow()
              try:
                  conn = pool.getconn()
                  cur = conn.cursor() 
                  cur.execute("SELECT 1")
                  cur.fetchone()
                  cur.close()
                  pool.putconn(conn)
                  
                  response_time = int((datetime.utcnow() - start_time).total_seconds() * 1000)
                  log_health_check("healthy", response_time)
                  
                  return {
                      "status": "healthy",
                      "timestamp": datetime.utcnow().isoformat(),
                      "service": SERVICE,
                      "version": "8.5.0",
                      "response_time_ms": response_time
                  }
              except Exception as e:
