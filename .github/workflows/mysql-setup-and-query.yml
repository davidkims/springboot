name: 🐬 MySQL Setup & Echo-Based Migration + SELECT COUNT

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mysql-setup-and-query.yml
      - sql/init.sql

jobs:
  mysql-setup:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🕒 Wait for MySQL to be Ready
        run: |
          echo "[🕒] MySQL 컨테이너가 준비될 때까지 대기 중..."
          sleep 20

      - name: 📄 Create Migration Script (echo 방식)
        run: |
          echo "[📄] init.sql 생성 중..."
          mkdir -p sql
          echo "CREATE DATABASE IF NOT EXISTS sample_db;" > sql/init.sql
          echo "USE sample_db;" >> sql/init.sql
          echo "" >> sql/init.sql
          echo "CREATE TABLE IF NOT EXISTS users (" >> sql/init.sql
          echo "  id INT AUTO_INCREMENT PRIMARY KEY," >> sql/init.sql
          echo "  name VARCHAR(100) NOT NULL" >> sql/init.sql
          echo ");" >> sql/init.sql
          echo "" >> sql/init.sql
          echo "INSERT INTO users (name) VALUES ('Alice'), ('Bob'), ('Charlie');" >> sql/init.sql
          echo "[✔] init.sql 생성 완료:"
          cat sql/init.sql

      - name: ⚙️ Run Migration
        run: |
          echo "[⚙️] 마이그레이션 시작..."
          sudo apt-get update && sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -P 3306 -u root -prootpass123 < sql/init.sql
          echo "[✔] 마이그레이션 완료"

      - name: 🔎 Run SELECT COUNT Query
        run: |
          echo "[🔎] SELECT COUNT 쿼리 실행 중..."
          mysql -h 127.0.0.1 -P 3306 -u root -prootpass123 -D sample_db -e "SELECT COUNT(*) AS user_count FROM users;"
          echo "[✔] SELECT 완료"
