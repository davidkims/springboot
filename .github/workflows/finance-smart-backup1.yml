name: "email-servers-ULTRA-integrated-echo-only-with-monitoring-v7"

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Base domain for virtual accounts"
        required: false
        default: "example.local"
      user_count:
        description: "Number of virtual accounts per service"
        required: false
        default: "50"
      test_count:
        description: "Number of test emails per server"
        required: false
        default: "3"
      mta_choice:
        description: "apt·install MTA (none|postfix|exim4|opensmtpd)"
        required: false
        default: "none"
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE: /opt/email
      DOMAIN: ${{ github.event.inputs.domain || 'example.local' }}
      USER_COUNT: ${{ github.event.inputs.user_count || '50' }}
      TEST_COUNT: ${{ github.event.inputs.test_count || '3' }}
      SERVICES: "postfix exim4 opensmtpd mailhog maildev mailcatcher smtp4dev"
      MTA_CHOICE: ${{ github.event.inputs.mta_choice || 'none' }}
      MONO: .monitoring
      INF_BUCKET: metrics
      INF_ORG: org
      INF_USER: admin
      INF_PASS: "admin1234!"
      INF_TOKEN: "dev-token-123456"

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📁 Prepare dirs (services+bulk) & export absolute paths
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo mkdir -p "$BASE"; sudo chown -R "$USER:$USER" "$BASE"
          mkdir -p "$BASE"/{policies,reports,artifacts,global,tools,tmp}
          mkdir -p "${MONO}"/{influxdb,telegraf,graphite,victoriametrics,otel,statsd,scripts,python}
          for SVC in $SERVICES; do
            for d in bin config logs pid run spool queue tmp data certs keys users inbox outbox archive scripts env acl docs policies backups reports firewall permissions artifacts dll db; do
              mkdir -p "$BASE/$SVC/$d"
            done
            for i in $(seq -w 0001 1000); do
              mkdir -p "$BASE/$SVC/bulk/dir_$i"
            done
          done
          chmod -R 755 "$BASE"
          {
            echo "export BASE_ABS=$BASE"
            echo "export MONO=${MONO}"
            echo "export MONO_ABS=$(pwd)/${MONO}"
          } > "$GITHUB_WORKSPACE/.env_abs"

      - name: 📦 Base packages (no MTA conflicts) + Docker networks
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates apt-transport-https software-properties-common \
            curl wget git build-essential jq \
            ruby-full libsqlite3-dev apache2-utils openssl \
            swaks nginx clamav clamav-daemon
          sudo apt-get install -y --only-upgrade docker.io containerd || true
          sudo systemctl is-active --quiet docker || sudo systemctl start docker || true
          sudo systemctl enable --now nginx || true
          docker network create emailnet >/dev/null 2>&1 || true
          docker network create monnet   >/dev/null 2>&1 || true

      - name: 🧯 Install single MTA via apt (avoid mail-transport-agent conflicts)
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$MTA_CHOICE" in
            postfix)   sudo apt-get install -y postfix bsd-mailx ;;
            exim4)     sudo apt-get install -y exim4 exim4-daemon-light ;;
            opensmtpd) sudo apt-get install -y opensmtpd ;;
            none|"")   echo "[INFO] Skip apt MTA install." ;;
            *)         echo "[WARN] Unknown MTA_CHOICE=$MTA_CHOICE; skipping." ;;
          esac
          sudo systemctl stop postfix 2>/dev/null || true
          sudo systemctl stop exim4 2>/dev/null || true
          sudo systemctl stop opensmtpd 2>/dev/null || true
          sudo systemctl disable postfix exim4 opensmtpd 2>/dev/null || true

      - name: 📄 Global README / SECURITY
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            printf "This CI workspace provisions email servers for testing.\n"
            printf "MTAs are optional (single) and not started. Containers provide SMTP sinks.\n"
            printf "Monitoring uses InfluxDB2 + Telegraf. All files are generated via echo/printf only.\n"
          } > "$BASE/README.txt"
          {
            printf "# Security (Test Only)\n"
            printf "- Ephemeral CI; no real credentials.\n"
            printf "- Virtual users are randomly generated per run.\n"
            printf "- Outputs: users.csv, users.htpasswd(bcrypt), users.json per service.\n"
          } > "$BASE/policies/SECURITY.md"

      #######################################################################
      #                          ECHO DB (NEW)                              #
      #######################################################################

      - name: 🧩 Write echo-db helper (printf-only functions)
        shell: bash
        run: |
          set -Eeuo pipefail
          HELPER="$BASE/tools/echo_db.sh"
          : > "$HELPER"

          # Header
          printf '#!/usr/bin/env bash\nset -Eeuo pipefail\n\n' >> "$HELPER"
          printf 'DOMAIN=${DOMAIN:-example.local}\nUSER_COUNT=${USER_COUNT:-50}\n\n' >> "$HELPER"

          # util: ts + rand
          printf 'ts(){ date -u +"%Y-%m-%dT%H:%M:%SZ"; }\n' >> "$HELPER"
          printf 'rand(){ od -vAn -N4 -tu4 < /dev/urandom | tr -d " "; }\n\n' >> "$HELPER"

          # init schema + seed
          printf 'make_seed(){\n' >> "$HELPER"
          printf '  local SVC="$1"; local ROOT="$BASE/$SVC/db"; mkdir -p "$ROOT/migrations"\n' >> "$HELPER"
          printf '  printf "{\\"service\\":\\"%s\\",\\"version\\":1,\\"generated_at\\":\\"%s\\",\\"tables\\":[\\"users\\",\\"messages\\",\\"deliveries\\"]}\n" "$SVC" "$(ts)" > "$ROOT/schema.json"\n' >> "$HELPER"
          printf '  : > "$ROOT/SCHEMA_VERSION"; printf "1\n" > "$ROOT/SCHEMA_VERSION"\n' >> "$HELPER"
          printf '  : > "$ROOT/users.json"; : > "$ROOT/messages.json"; : > "$ROOT/deliveries.json"\n' >> "$HELPER"
          printf '  : > "$ROOT/users.csv";   : > "$ROOT/messages.csv";   : > "$ROOT/deliveries.csv"\n' >> "$HELPER"
          printf '  printf "id,username,email,password_hash,created_at\n" > "$ROOT/users.csv"\n' >> "$HELPER"
          printf '  printf "id,from,to,subject,body,created_at\n" > "$ROOT/messages.csv"\n' >> "$HELPER"
          printf '  printf "id,message_id,status,attempts,last_error,updated_at\n" > "$ROOT/deliveries.csv"\n' >> "$HELPER"

          # seed users/messages/deliveries
          printf '  printf "[\n" > "$ROOT/users.json"\n' >> "$HELPER"
          printf '  for i in $(seq 1 "$USER_COUNT"); do\n' >> "$HELPER"
          printf '    uid=$(printf "%04d" "$i"); u="user_${uid}"; mail="$u@$DOMAIN";\n' >> "$HELPER"
          printf '    ph="$(htpasswd -nbB "$u" "$u" | cut -d: -f2)";\n' >> "$HELPER"
          printf '    sep=","; [ "$i" -eq "$USER_COUNT" ] && sep=""\n' >> "$HELPER"
          printf '    printf "{\\"id\\":%s,\\"username\\":\\"%s\\",\\"email\\":\\"%s\\",\\"password_hash\\":\\"%s\\",\\"created_at\\":\\"%s\\"}%s\n" "$i" "$u" "$mail" "$ph" "$(ts)" "$sep" >> "$ROOT/users.json"\n' >> "$HELPER"
          printf '    printf "%s,%s,%s,%s,%s\n" "$i" "$u" "$mail" "$ph" "$(ts)" >> "$ROOT/users.csv"\n' >> "$HELPER"
          printf '  done\n' >> "$HELPER"
          printf '  printf "]\n" >> "$ROOT/users.json"\n' >> "$HELPER"

          printf '  MSGC=$(( USER_COUNT / 2 )); [ "$MSGC" -lt 1 ] && MSGC=1\n' >> "$HELPER"
          printf '  printf "[\n" > "$ROOT/messages.json"\n' >> "$HELPER"
          printf '  for i in $(seq 1 "$MSGC"); do\n' >> "$HELPER"
          printf '    mid=$(rand); from="noreply@$DOMAIN"; to="user_$(printf "%04d" "$i")@$DOMAIN";\n' >> "$HELPER"
          printf '    sub="hello-$SVC-$i"; body="echo body $SVC $i"; sep=","; [ "$i" -eq "$MSGC" ] && sep=""\n' >> "$HELPER"
          printf '    printf "{\\"id\\":%s,\\"from\\":\\"%s\\",\\"to\\":\\"%s\\",\\"subject\\":\\"%s\\",\\"body\\":\\"%s\\",\\"created_at\\":\\"%s\\"}%s\n" "$i" "$from" "$to" "$sub" "$body" "$(ts)" "$sep" >> "$ROOT/messages.json"\n' >> "$HELPER"
          printf '    printf "%s,%s,%s,%s,%s,%s\n" "$i" "$from" "$to" "$sub" "$body" "$(ts)" >> "$ROOT/messages.csv"\n' >> "$HELPER"
          printf '  done\n' >> "$HELPER"
          printf '  printf "]\n" >> "$ROOT/messages.json"\n' >> "$HELPER"

          printf '  printf "[\n" > "$ROOT/deliveries.json"\n' >> "$HELPER"
          printf '  for i in $(seq 1 "$MSGC"); do\n' >> "$HELPER"
          printf '    did=$(rand); status="queued"; att=0; sep=","; [ "$i" -eq "$MSGC" ] && sep=""\n' >> "$HELPER"
          printf '    printf "{\\"id\\":%s,\\"message_id\\":%s,\\"status\\":\\"%s\\",\\"attempts\\":%s,\\"last_error\\":null,\\"updated_at\\":\\"%s\\"}%s\n" "$i" "$i" "$status" "$att" "$(ts)" "$sep" >> "$ROOT/deliveries.json"\n' >> "$HELPER"
          printf '    printf "%s,%s,%s,%s,%s,%s\n" "$i" "$i" "$status" "$att" "" "$(ts)" >> "$ROOT/deliveries.csv"\n' >> "$HELPER"
          printf '  done\n' >> "$HELPER"
          printf '  printf "]\n" >> "$ROOT/deliveries.json"\n' >> "$HELPER"
          printf '}\n\n' >> "$HELPER"

          # plan migrations (generate migration scripts via printf)
          printf 'plan_migrations(){\n' >> "$HELPER"
          printf '  local SVC="$1"; local ROOT="$BASE/$SVC/db"; mkdir -p "$ROOT/migrations"\n' >> "$HELPER"

          # 001: deliveries.status -> {queued, sent, failed}; set "status":"queued" if missing; version=2
          printf '  printf "#!/usr/bin/env bash\nset -Eeuo pipefail\nROOT=\\"$ROOT\\"; jq \\". + {}\\" >/dev/null 2>&1\n" > "$ROOT/migrations/001_add_status_and_ver2.sh"\n' >> "$HELPER"
          printf '  printf "jq \x27(map(if .status == null then .status=\\"queued\\" else . end))\x27 \\"$ROOT/deliveries.json\\" > \\"$ROOT/deliveries.json.tmp\\" && mv \\"$ROOT/deliveries.json.tmp\\" \\"$ROOT/deliveries.json\\"\n" >> "$ROOT/migrations/001_add_status_and_ver2.sh"\n' >> "$HELPER"
          printf '  printf "printf \\"2\\n\\" > \\"$ROOT/SCHEMA_VERSION\\"\n" >> "$ROOT/migrations/001_add_status_and_ver2.sh"\n' >> "$HELPER"
          printf '  printf "jq \x27.stage=\\"m001\\" | .version=2\x27 \\"$ROOT/schema.json\\" > \\"$ROOT/schema.json.tmp\\" && mv \\"$ROOT/schema.json.tmp\\" \\"$ROOT/schema.json\\"\n" >> "$ROOT/migrations/001_add_status_and_ver2.sh"\n' >> "$HELPER"
          printf '  chmod +x "$ROOT/migrations/001_add_status_and_ver2.sh"\n' >> "$HELPER"

          # 002: messages.body -> messages.msg_body (rename); version=3
          printf '  printf "#!/usr/bin/env bash\nset -Eeuo pipefail\nROOT=\\"$ROOT\\";\n" > "$ROOT/migrations/002_rename_body_to_msg_body_ver3.sh"\n' >> "$HELPER"
          printf '  printf "jq \x27(map(.msg_body=.body | del(.body))\x27 \\"$ROOT/messages.json\\" > \\"$ROOT/messages.json.tmp\\" && mv \\"$ROOT/messages.json.tmp\\" \\"$ROOT/messages.json\\"\n" >> "$ROOT/migrations/002_rename_body_to_msg_body_ver3.sh"\n' >> "$HELPER"
          printf '  printf "printf \\"3\\n\\" > \\"$ROOT/SCHEMA_VERSION\\"\n" >> "$ROOT/migrations/002_rename_body_to_msg_body_ver3.sh"\n' >> "$HELPER"
          printf '  printf "jq \x27.stage=\\"m002\\" | .version=3\x27 \\"$ROOT/schema.json\\" > \\"$ROOT/schema.json.tmp\\" && mv \\"$ROOT/schema.json.tmp\\" \\"$ROOT/schema.json\\"\n" >> "$ROOT/migrations/002_rename_body_to_msg_body_ver3.sh"\n' >> "$HELPER"
          printf '  chmod +x "$ROOT/migrations/002_rename_body_to_msg_body_ver3.sh"\n' >> "$HELPER"

          # 003: users: add "active":true; version=4
          printf '  printf "#!/usr/bin/env bash\nset -Eeuo pipefail\nROOT=\\"$ROOT\\";\n" > "$ROOT/migrations/003_add_users_active_ver4.sh"\n' >> "$HELPER"
          printf '  printf "jq \x27(map(.active=true)\x27 \\"$ROOT/users.json\\" > \\"$ROOT/users.json.tmp\\" && mv \\"$ROOT/users.json.tmp\\" \\"$ROOT/users.json\\"\n" >> "$ROOT/migrations/003_add_users_active_ver4.sh"\n' >> "$HELPER"
          printf '  printf "printf \\"4\\n\\" > \\"$ROOT/SCHEMA_VERSION\\"\n" >> "$ROOT/migrations/003_add_users_active_ver4.sh"\n' >> "$HELPER"
          printf '  printf "jq \x27.stage=\\"m003\\" | .version=4\x27 \\"$ROOT/schema.json\\" > \\"$ROOT/schema.json.tmp\\" && mv \\"$ROOT/schema.json.tmp\\" \\"$ROOT/schema.json\\"\n" >> "$ROOT/migrations/003_add_users_active_ver4.sh"\n' >> "$HELPER"
          printf '  chmod +x "$ROOT/migrations/003_add_users_active_ver4.sh"\n' >> "$HELPER"

          printf '}\n\n' >> "$HELPER"

          # apply migrations in order
          printf 'apply_migrations(){\n' >> "$HELPER"
          printf '  local SVC="$1"; local ROOT="$BASE/$SVC/db";\n' >> "$HELPER"
          printf '  for m in "$ROOT"/migrations/*.sh; do [ -f "$m" ] || continue; echo "[MIGRATE] $SVC -> $(basename "$m")"; bash "$m"; done\n' >> "$HELPER"
          printf '}\n\n' >> "$HELPER"

          # verify counts + version
          printf 'verify_db(){\n' >> "$HELPER"
          printf '  local SVC="$1"; local ROOT="$BASE/$SVC/db";\n' >> "$HELPER"
          printf '  v=$(cat "$ROOT/SCHEMA_VERSION" 2>/dev/null || echo "unknown")\n' >> "$HELPER"
          printf '  uc=$(jq "length" "$ROOT/users.json" 2>/dev/null || echo 0)\n' >> "$HELPER"
          printf '  mc=$(jq "length" "$ROOT/messages.json" 2>/dev/null || echo 0)\n' >> "$HELPER"
          printf '  dc=$(jq "length" "$ROOT/deliveries.json" 2>/dev/null || echo 0)\n' >> "$HELPER"
          printf '  printf "%s|version=%s users=%s messages=%s deliveries=%s\\n" "$SVC" "$v" "$uc" "$mc" "$dc"\n' >> "$HELPER"
          printf '}\n' >> "$HELPER"

          chmod +x "$HELPER"

      - name: 🗄️ Generate echo DB seed (per service)
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$BASE/tools/echo_db.sh"
          for SVC in $SERVICES; do
            echo "[SEED] $SVC"
            make_seed "$SVC"
          done

      - name: 🧱 Plan migrations (printf-only) per service
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$BASE/tools/echo_db.sh"
          for SVC in $SERVICES; do
            echo "[PLAN] $SVC"
            plan_migrations "$SVC"
          done

      - name: 🚚 Apply migrations per service
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$BASE/tools/echo_db.sh"
          for SVC in $SERVICES; do
            echo "[APPLY] $SVC"
            apply_migrations "$SVC"
          done

      - name: 🔎 Verify DB & summarize
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$BASE/tools/echo_db.sh"
          : > "$BASE/reports/echo_db_summary.txt"
          for SVC in $SERVICES; do
            verify_db "$SVC" | tee -a "$BASE/reports/echo_db_summary.txt"
          done
          echo "[OK] Summary written to $BASE/reports/echo_db_summary.txt"

      #######################################################################
      #  (이하: 기존 컨테이너 기반 SMTP sinks, 테스트 메일 발송, 모니터링 등)   #
      #  - MailHog/MailDev/MailCatcher/smtp4dev 기동 (emailnet)             #
      #  - swaks로 $TEST_COUNT 만큼 테스트 메일 전송                         #
      #  - InfluxDB2 + Telegraf 구성 (monnet)                                #
      #  - 로그/리포트 및 db 디렉토리 아티팩트 업로드                        #
      #######################################################################

      - name: 📦 (샘플) Bring up MailHog as sink
        shell: bash
        run: |
          set -Eeuo pipefail
          docker rm -f mailhog >/dev/null 2>&1 || true
          docker run -d --name mailhog --network emailnet -p 1025:1025 -p 8025:8025 mailhog/mailhog:latest

      - name: ✉️ Send test emails to MailHog
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 "$TEST_COUNT"); do
            swaks --server 127.0.0.1:1025 --from "tester@$DOMAIN" --to "dest@$DOMAIN" \
              --header "Subject: test-$i" --body "hello-$i" --timeout 10 || true
          done

      - name: 📦 InfluxDB2 + Telegraf (minimal, echo/printf configs)
        shell: bash
        run: |
          set -Eeuo pipefail
          docker rm -f influxdb telegraf >/dev/null 2>&1 || true
          docker run -d --name influxdb --network monnet -p 8086:8086 \
            -e DOCKER_INFLUXDB_INIT_MODE=setup \
            -e DOCKER_INFLUXDB_INIT_USERNAME="$INF_USER" \
            -e DOCKER_INFLUXDB_INIT_PASSWORD="$INF_PASS" \
            -e DOCKER_INFLUXDB_INIT_ORG="$INF_ORG" \
            -e DOCKER_INFLUXDB_INIT_BUCKET="$INF_BUCKET" \
            -e DOCKER_INFLUXDB_INIT_ADMIN_TOKEN="$INF_TOKEN" \
            influxdb:2
          # minimal telegraf.conf via printf
          TELEG="$MONO/telegraf/telegraf.conf"
          printf "[agent]\n  flush_interval = \"5s\"\n  interval = \"5s\"\n" > "$TELEG"
          printf "[[outputs.influxdb_v2]]\n  urls=[\"http://influxdb:8086\"]\n  token=\"%s\"\n  organization=\"%s\"\n  bucket=\"%s\"\n" "$INF_TOKEN" "$INF_ORG" "$INF_BUCKET" >> "$TELEG"
          printf "[[inputs.internal]]\n" >> "$TELEG"
          docker run -d --name telegraf --network monnet -v "$TELEG:/etc/telegraf/telegraf.conf:ro" telegraf

      - name: 📦 Collect artifacts (DB + reports + minimal logs)
        uses: actions/upload-artifact@v4
        with:
          name: echo-db-and-reports
          path: |
            /opt/email/*/db/**
            /opt/email/reports/**
            /opt/email/README.txt
            /opt/email/policies/SECURITY.md
          if-no-files-found: warn
