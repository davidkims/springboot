name: 🧾 Multi-Transaction Backup (Per-Type Containers + Retention + Full Echo)

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  finance:
    runs-on: ubuntu-latest

    env:
      ROOT_PASS: rootpass123
      SQL_DIR: /opt/finance/sql
      BACKUP_DIR: /opt/finance/backups
      PROVENANCE_DIR: /opt/finance/provenance
      LOG_DIR: /opt/finance/logs
      HEALTH_DIR: /opt/finance/logs/health
      RETENTION_DAYS: 1
      TYPES: |
        bank_transfer
        check_card
        credit_card
        bitcoin
        stock
        futures

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🧹 Cleanup Old Files (Retention Policy:1 day)
        run: |
          echo "[🧹] Deleting files older than $RETENTION_DAYS day(s)..."
          find /opt/finance -type f -mtime +$RETENTION_DAYS -print -delete || echo "[⚠️] No old files found"

      - name: 📁 Prepare All Directories
        run: |
          echo "[📁] Creating all required directories..."
          sudo mkdir -p $SQL_DIR $BACKUP_DIR $PROVENANCE_DIR $LOG_DIR $HEALTH_DIR
          sudo chmod -R 777 /opt/finance
          echo "[✅] Directory tree:"
          tree /opt/finance || ls -R /opt/finance

      - name: 📝 Generate init.sql
        run: |
          INIT_FILE="$SQL_DIR/init.sql"
          echo "[📝] Generating init.sql at $INIT_FILE..."
          echo "CREATE TABLE IF NOT EXISTS transfers (
            id INT AUTO_INCREMENT PRIMARY KEY,
            type VARCHAR(30),
            amount DECIMAL(15,2),
            currency VARCHAR(5),
            status VARCHAR(20)
          );" > "$INIT_FILE"

          for TYPE in $TYPES; do
            echo "-- Inserts for $TYPE" >> "$INIT_FILE"
            for i in $(seq 1 100); do
              AMOUNT=$(( (RANDOM % 1000000) + 1000 ))
              STATUS=$([ $((RANDOM % 2)) -eq 0 ] && echo "completed" || echo "pending")
              echo "INSERT INTO transfers(type, amount, currency, status) VALUES('$TYPE', $AMOUNT, 'KRW', '$STATUS');" >> "$INIT_FILE"
            done
          done
          echo "[📄] Preview of init.sql:"
          head -n 20 "$INIT_FILE"

      - name: 🔁 Process each TYPE
        run: |
          for TYPE in $TYPES; do
            echo "[🔄] Processing: $TYPE"
            DB_NAME="db_${TYPE}"
            DB_USER="user_${TYPE}"
            DB_PASS="pass_${TYPE}"
            CONTAINER="mysql_${TYPE}"
            PORT=$((3307 + RANDOM % 1000))

            echo "[🐬] Starting container $CONTAINER..."
            docker run -d \
              --name $CONTAINER \
              -e MYSQL_ROOT_PASSWORD=$ROOT_PASS \
              -e MYSQL_DATABASE=$DB_NAME \
              -e MYSQL_USER=$DB_USER \
              -e MYSQL_PASSWORD=$DB_PASS \
              -v $SQL_DIR:/docker-entrypoint-initdb.d \
              -p $PORT:3306 \
              --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$ROOT_PASS --silent" \
              --health-interval=5s \
              --health-timeout=3s \
              --health-retries=10 \
              mysql:8.0

            echo "[⏳] Waiting for health..."
            HEALTH_LOG="$HEALTH_DIR/${TYPE}-health.log"
            for i in {1..10}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' $CONTAINER || echo "notfound")
              echo "  - Health $i: $STATUS" | tee -a "$HEALTH_LOG"
              docker inspect $CONTAINER >> "$HEALTH_LOG" 2>&1
              if [ "$STATUS" = "healthy" ]; then break; fi
              sleep 6
              if [ $i -eq 10 ]; then
                echo "[❌] Health check failed. Logs:"
                docker logs $CONTAINER >> "$HEALTH_LOG"
                docker stop $CONTAINER && docker rm $CONTAINER
                exit 1
              fi
            done

            echo "[🔎] Verifying data..."
            TABLE_LOG="$LOG_DIR/tables_${TYPE}.log"
            mysql -h 127.0.0.1 -P $PORT -u$DB_USER -p$DB_PASS -e "USE $DB_NAME; SHOW TABLES;" | tee "$TABLE_LOG"
            mysql -h 127.0.0.1 -P $PORT -u$DB_USER -p$DB_PASS -e "USE $DB_NAME; DESC transfers;" | tee -a "$TABLE_LOG"
            mysql -h 127.0.0.1 -P $PORT -u$DB_USER -p$DB_PASS -e "USE $DB_NAME; SELECT * FROM transfers LIMIT 5;" | tee -a "$TABLE_LOG"

            COUNT=$(mysql -h 127.0.0.1 -P $PORT -u$DB_USER -p$DB_PASS -N -e "USE $DB_NAME; SELECT COUNT(*) FROM transfers WHERE type='$TYPE' AND status='completed';")
            echo "✅ $COUNT completed records for $TYPE"

            if [ "$COUNT" != "0" ]; then
              FILE="$BACKUP_DIR/${TYPE}_backup.sql"
              echo "[💾] Dumping to $FILE"
              mysqldump --no-tablespaces -h 127.0.0.1 -P $PORT -u$DB_USER -p$DB_PASS $DB_NAME > "$FILE"
              head -n 10 "$FILE" || echo "[⚠️] Could not preview dump"

              PROV_FILE="$PROVENANCE_DIR/.provenance_${TYPE}.json"
              echo "[📜] Creating provenance file..."
              {
                echo '{'
                echo "  \"type\": \"$TYPE\","
                echo "  \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
                echo "  \"status\": \"completed\","
                echo "  \"backup_file\": \"$FILE\","
                echo "  \"workflow\": \"${{ github.workflow }}\","
                echo "  \"repository\": \"${{ github.repository }}\","
                echo "  \"run_id\": \"${{ github.run_id }}\","
                echo "  \"run_number\": \"${{ github.run_number }}\""
                echo '}'
              } > "$PROV_FILE"
              cat "$PROV_FILE"
            else
              echo "[⏭️] No completed data for $TYPE"
            fi

            docker stop $CONTAINER
            docker rm $CONTAINER
          done

      - name: 🗜️ Compress All SQL Backups
        run: |
          echo "[🗜️] Compressing all SQL backups..."
          cd $BACKUP_DIR
          ARCHIVE="finance-backups-$(date +%Y%m%d%H%M%S).tar.gz"
          tar -czf "$ARCHIVE" *.sql || echo "[⚠️] No SQL files to compress"
          echo "[📦] Archive: $ARCHIVE"
          ls -lh "$ARCHIVE"

      - name: 🗃️ Compress Full Directory Structure
        run: |
          echo "[🗃️] Backing up full /opt/finance directory..."
          FULL_ARCHIVE="/opt/finance/finance-full-$(date +%Y%m%d%H%M%S).tar.gz"
          tar -czf "$FULL_ARCHIVE" /opt/finance || echo "[⚠️] Failed full structure backup"
          echo "[📦] Full backup archive:"
          ls -lh "$FULL_ARCHIVE"
