name: 🏦 금융 자동화 통합 - 전체 echo/환경/보안/멀티모듈/빌드/스프링부트 최신화 (No Skip, No Blur, +DB echo)

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

jobs:
  finance-ci-allinone:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 주요 echo/로그/백업/보안/옵션/SpringBoot 생성
        run: |
          set -e
          for d in \
            .github/echo_ts \
            .github/echo_js \
            .github/echo_java \
            .github/echo_upgrade \
            .github/echo_spring \
            .github/echo_env \
            .github/echo_secret \
            .github/echo_buildopt \
            .github/echo_multimodule \
            .github/logs_ts \
            .github/ts_projects \
            .github/ts_bin \
            .github/ts_backup \
            .github/ts_dist_backup \
            .github/js_projects \
            .github/js_backup \
            .github/js_dist_backup \
            .github/java_projects \
            .github/java_build \
            .github/java_multi \
            .github/mvn_install \
            .github/springboot_projects \
            .github/springboot_build \
            .github/springboot_backup \
            .github/springboot_logs \
            .github/springboot_multi \
            .github/build_history \
            .github/build_logs \
            .github/run_logs \
            .github/echo_compile \
            .github/echo_build \
            .github/echo_run \
            .github/echo_result \
            .github/migration; do
            echo "echo 'mkdir -p $d'"
            mkdir -p "$d"
          done

      - name: 🔑 환경 변수/보안/옵션/멀티모듈 에코파일 생성
        run: |
          set -e
          # 환경
          echo "SPRING_PROFILES_ACTIVE=prod" > .github/echo_env/spring_profiles.env
          echo "JAVA_TOOL_OPTIONS=-Xms256m -Xmx1024m" >> .github/echo_env/spring_profiles.env
          echo "CI_BUILD_ID=$(date +%Y%m%d%H%M%S)" >> .github/echo_env/spring_profiles.env
          # 보안
          echo "SECRET_DB_PW=****" > .github/echo_secret/secret.env
          echo "SPRING_API_KEY=****" >> .github/echo_secret/secret.env
          # 빌드옵션
          echo "TS_BUILD_OPTS=--strict --target ES2020" > .github/echo_buildopt/ts_buildopt.txt
          echo "JAVA_BUILD_OPTS=-DskipTests=true -Dmaven.test.failure.ignore=true" > .github/echo_buildopt/java_buildopt.txt
          echo "SPRING_BUILD_OPTS=--debug --no-daemon" > .github/echo_buildopt/spring_buildopt.txt
          # 멀티모듈 gradle
          mkdir -p .github/springboot_multi/app-api/src/main/java/com/fin/appapi
          mkdir -p .github/springboot_multi/app-core/src/main/java/com/fin/appcore
          mkdir -p .github/springboot_multi/app-web/src/main/java/com/fin/appweb
          echo "rootProject.name = 'finance-multi'" > .github/springboot_multi/settings.gradle
          echo "include 'app-api', 'app-core', 'app-web'" >> .github/springboot_multi/settings.gradle

      - name: 🗄️ 각 환경별 DB echo config/.env/.sql 파일 자동생성
        run: |
          set -e
          # Typescript
          echo "// DB CONFIG ECHO" > .github/echo_ts/db_config.ts
          echo "export const DB_CONFIG = { host: 'localhost', user: 'finance', password: 'echo_pw', database: 'financedb', port: 3306 };" >> .github/echo_ts/db_config.ts
          echo "DB_HOST=localhost\nDB_USER=finance\nDB_PASS=echo_pw\nDB_NAME=financedb" > .github/echo_ts/.env
          echo "CREATE TABLE IF NOT EXISTS ts_sample (id INT PRIMARY KEY, amount DECIMAL(12,2), memo VARCHAR(100));" > .github/echo_ts/table_info.sql
          # JS
          echo '{ "host": "localhost", "user": "finance", "password": "echo_pw", "database": "financedb", "port": 3306 }' > .github/echo_js/dbinfo.json
          echo "DB_HOST=localhost\nDB_USER=finance\nDB_PASS=echo_pw\nDB_NAME=financedb" > .github/echo_js/.env
          echo "CREATE TABLE IF NOT EXISTS js_logs (id INT PRIMARY KEY, msg VARCHAR(255), created_at DATETIME);" > .github/echo_js/table_info.sql
          # Java
          echo "spring.datasource.url=jdbc:mysql://localhost:3306/financedb" > .github/echo_java/application.properties
          echo "spring.datasource.username=finance" >> .github/echo_java/application.properties
          echo "spring.datasource.password=echo_pw" >> .github/echo_java/application.properties
          echo "CREATE TABLE IF NOT EXISTS java_audit (id BIGINT AUTO_INCREMENT PRIMARY KEY, event VARCHAR(128), ts TIMESTAMP);" > .github/echo_java/table_info.sql
          # SpringBoot
          echo "spring:\n  datasource:\n    url: jdbc:mysql://localhost:3306/financedb\n    username: finance\n    password: echo_pw\n    driver-class-name: com.mysql.cj.jdbc.Driver" > .github/echo_spring/application.yml
          echo "CREATE TABLE IF NOT EXISTS spring_tasks (task_id INT AUTO_INCREMENT PRIMARY KEY, desc VARCHAR(255), completed BOOLEAN);" > .github/echo_spring/table_info.sql
          echo "MYSQL_USER=finance\nMYSQL_PW=echo_pw" > .github/echo_spring/.env
          # migration (예시 테이블)
          echo "CREATE TABLE IF NOT EXISTS customers (id INT PRIMARY KEY, name VARCHAR(50), grade CHAR(1), joined DATETIME);" > .github/migration/customer_table.sql
          echo "CREATE TABLE IF NOT EXISTS transactions (id INT PRIMARY KEY, customer_id INT, amount DECIMAL(16,2), date DATETIME);" > .github/migration/transaction_table.sql

      - name: 📦 Node.js/JavaScript, TypeScript, Java(Maven/JDK), SpringBoot 업그레이드 및 설치 (echo, fallback)
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y curl gnupg2 zip unzip wget
          # Node.js 20.x LTS, npm, TypeScript
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          sudo npm install -g npm@latest
          sudo npm install -g typescript@latest
          node -v | tee .github/echo_upgrade/node_version.txt
          npm -v  | tee .github/echo_upgrade/npm_version.txt
          tsc -v | tee .github/echo_upgrade/tsc_upgrade.txt
          # Java JDK
          sudo apt-get install -y openjdk-17-jdk
          java -version 2>&1 | tee .github/echo_upgrade/java_version.txt
          # Maven
          sudo apt-get install -y maven
          mvn -version | tee .github/echo_upgrade/mvn_version.txt
          # Spring Boot CLI (에러 시 fallback)
          set +e
          SPRINGBOOT_VER=$(curl -s https://api.github.com/repos/spring-projects/spring-boot/releases/latest | grep tag_name | cut -d'"' -f4 | tr -d 'v')
          echo "SPRINGBOOT_VER=$SPRINGBOOT_VER" | tee .github/echo_upgrade/springboot_version.txt
          wget -q "https://repo.spring.io/release/org/springframework/boot/spring-boot-cli/${SPRINGBOOT_VER}/spring-boot-cli-${SPRINGBOOT_VER}-bin.zip" -O /tmp/springboot.zip
          UNZIP_OUT=""
          if [ -s /tmp/springboot.zip ]; then
            UNZIP_OUT=$(unzip -o /tmp/springboot.zip -d /tmp/springboot_cli 2>&1)
            sudo cp -a /tmp/springboot_cli/spring-boot-cli-*/* /usr/local/
            ln -sf /usr/local/bin/spring /usr/local/bin/springboot || true
            spring --version | tee .github/echo_upgrade/springboot_cli_version.txt
            echo "[UPGRADE] Spring Boot CLI 정상 설치/업그레이드" | tee .github/echo_upgrade/springboot_cli_success.txt
          else
            echo "[ERROR] Spring Boot CLI 다운로드 실패, gradle 빌드로 fallback" | tee .github/echo_upgrade/springboot_cli_error.txt
            echo "$UNZIP_OUT" | tee .github/echo_upgrade/springboot_cli_unzip_error.txt
          fi
          set -e
          echo "[UPGRADE] 모든 언어/빌드툴/SpringBoot 최신화 완료" | tee .github/echo_upgrade/all_done.txt
          for f in node npm tsc java mvn spring; do
            which $f | tee -a .github/echo_upgrade/executables.txt || true
            cp -a $(which $f) .github/ts_bin/ || true
            cp -a $(which $f) .github/mvn_install/ || true
            cp -a $(which $f) .github/springboot_projects/ || true
          done

      - name: 📄 JS/TS/Java/Spring 샘플, tsconfig.json, pom.xml, build.gradle, 멀티모듈, 최신화 에코 파일로 생성
        run: |
          set -e
          # TypeScript
          echo "console.log('Hello, TypeScript!')" > .github/ts_projects/hello.ts
          echo "export function greet(name: string) { return 'Hello, ' + name + '!'; }" > .github/ts_projects/greet.ts
          echo "import { greet } from './greet'; console.log(greet('SpringBoot+MultiModule 자동화!'));" > .github/ts_projects/main.ts
          echo "{" > .github/ts_projects/tsconfig.json
          echo "  \"compilerOptions\": {" >> .github/ts_projects/tsconfig.json
          echo "    \"target\": \"es6\"," >> .github/ts_projects/tsconfig.json
          echo "    \"module\": \"commonjs\"," >> .github/ts_projects/tsconfig.json
          echo "    \"outDir\": \"./dist\"," >> .github/ts_projects/tsconfig.json
          echo "    \"strict\": true," >> .github/ts_projects/tsconfig.json
          echo "    \"esModuleInterop\": true" >> .github/ts_projects/tsconfig.json
          echo "  }," >> .github/ts_projects/tsconfig.json
          echo "  \"include\": [\"*.ts\"]" >> .github/ts_projects/tsconfig.json
          echo "}" >> .github/ts_projects/tsconfig.json
          # JavaScript
          echo "console.log('Hello, JavaScript! (SpringBoot+MultiModule)');" > .github/js_projects/hello.js
          echo "function sum(a, b) { return a+b; } console.log('Sum:', sum(8,12));" > .github/js_projects/sum.js
          # Java/Spring
          mkdir -p .github/java_projects/src/main/java/com/fin/example
          echo "package com.fin.example; public class Main { public static void main(String[] args) { System.out.println(\"금융 Java 빌드(SpringBoot, 멀티모듈)\"); }}" > .github/java_projects/src/main/java/com/fin/example/Main.java
          echo '<project xmlns="http://maven.apache.org/POM/4.0.0" ... </project>' > .github/java_projects/pom.xml
          mkdir -p .github/springboot_projects/src/main/java/com/fin/springboot
          echo "package com.fin.springboot; import org.springframework.boot.SpringApplication; import org.springframework.boot.autoconfigure.SpringBootApplication; @SpringBootApplication public class Application { public static void main(String[] args) { SpringApplication.run(Application.class, args); }}" > .github/springboot_projects/src/main/java/com/fin/springboot/Application.java
          echo 'plugins { id "org.springframework.boot" version "3.2.6" } ...' > .github/springboot_projects/build.gradle
          echo "plugins { id 'org.springframework.boot' version '3.2.6' }" > .github/springboot_multi/app-api/build.gradle
          echo "plugins { id 'java' }" > .github/springboot_multi/app-core/build.gradle
          echo "plugins { id 'java' }" > .github/springboot_multi/app-web/build.gradle

      - name: 🛠️ TypeScript 빌드/실행 및 에코, 백업
        run: |
          set -e
          cd .github/ts_projects
          tsc -p tsconfig.json | tee ../echo_compile/tsc_compile_$(date +%Y%m%d_%H%M%S).log
          ls -l dist > ../echo_compile/ts_dist_list_$(date +%Y%m%d_%H%M%S).txt
          node dist/main.js | tee ../echo_run/ts_run_$(date +%Y%m%d_%H%M%S).log
          cd ../..
          cp -a .github/ts_projects/dist/. .github/ts_dist_backup/
          cp -a .github/ts_projects/*.ts .github/ts_projects/tsconfig.json .github/ts_backup/
          echo "[에코] TypeScript 빌드/실행/백업/업그레이드 완료" >> .github/echo_result/ts_result_$(date +%Y%m%d_%H%M%S).txt

      - name: 🛠️ JavaScript 실행 및 에코, 백업
        run: |
          set -e
          node .github/js_projects/hello.js | tee .github/echo_run/js_hello_$(date +%Y%m%d_%H%M%S).log
          node .github/js_projects/sum.js | tee .github/echo_run/js_sum_$(date +%Y%m%d_%H%M%S).log
          cp -a .github/js_projects/*.js .github/js_backup/
          echo "[에코] JavaScript 실행/백업/업그레이드 완료" >> .github/echo_result/js_result_$(date +%Y%m%d_%H%M%S).txt

      - name: 🛠️ Maven(Java) 빌드/실행 및 에코, 백업
        run: |
          set -e
          cd .github/java_projects
          mvn clean compile | tee ../echo_compile/mvn_compile_$(date +%Y%m%d_%H%M%S).log
          mkdir -p ../java_build/
          cp -a target ../java_build/ || true
          cd ../..
          echo "[에코] Maven(Java) 빌드/백업/업그레이드 완료" >> .github/echo_result/java_result_$(date +%Y%m%d_%H%M%S).txt

      - name: 🛠️ SpringBoot 빌드/실행 및 에코, 백업
        run: |
          set -e
          cd .github/springboot_projects
          # gradle 빌드 - gradle wrapper가 없을 경우 시스템 gradle 사용
          if [ ! -f ./gradlew ]; then
            gradle build | tee ../springboot_logs/gradle_build_$(date +%Y%m%d_%H%M%S).log || true
          else
            ./gradlew build | tee ../springboot_logs/gradle_build_$(date +%Y%m%d_%H%M%S).log || true
          fi
          cp -a build ../springboot_build/ || true
          cd ../..
          cp -a .github/springboot_projects/* .github/springboot_backup/
          echo "[에코] SpringBoot 빌드/백업/업그레이드 완료" >> .github/echo_result/springboot_result_$(date +%Y%m%d_%H%M%S).txt

      - name: 🗂️ 빌드/실행 로그/백업/이력 통합 에코
        run: |
          set -e
          find .github/ -type f | tee .github/build_logs/files_all_$(date +%Y%m%d_%H%M%S).log
          ls -ld .github/* | tee -a .github/build_logs/perm_owner_$(date +%Y%m%d_%H%M%S).log
          echo "[에코] 전체 빌드/실행/이력/로그/백업/업그레이드 파일리스트 출력완료" >> .github/echo_result/total_result_$(date +%Y%m%d_%H%M%S).txt

      - name: 🕓 빌드/업그레이드 이력(날짜별, 커밋별) 기록
        run: |
          set -e
          echo "빌드시간: $(date '+%Y-%m-%d %H:%M:%S')" > .github/build_history/last_build_time.txt
          echo "커밋 SHA: $GITHUB_SHA" > .github/build_history/last_build_commit.txt
          echo "[에코] 빌드/업그레이드 이력 파일 생성" >> .github/echo_result/total_result_$(date +%Y%m%d_%H%M%S).txt

      - name: 📦 빌드/실행/로그/이력 유물 저장
        uses: actions/upload-artifact@v4
        with:
          name: finance-build-all-artifacts
          path: |
            .github/ts_dist_backup/
            .github/ts_backup/
            .github/js_backup/
            .github/java_build/
            .github/springboot_build/
            .github/springboot_backup/
            .github/build_logs/
            .github/build_history/
            .github/echo_compile/
            .github/echo_build/
            .github/echo_run/
            .github/echo_result/
            .github/echo_upgrade/
            .github/echo_spring/
            .github/springboot_logs/
            .github/echo_env/
            .github/echo_secret/
            .github/echo_buildopt/
            .github/echo_multimodule/
            .github/echo_ts/
            .github/echo_js/
            .github/echo_java/
            .github/migration/
