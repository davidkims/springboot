name: 🩺 Workflows Health Check

# 수동 실행과 매시간 실행(UTC 기준 매 정각)에 트리거
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  health-check:
    name: Health Check All Workflows
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Install GitHub CLI
        run: |
          echo "[🚀] GitHub CLI 설치 중..."
          sudo apt-get update && sudo apt-get install -y gh
          echo "[✅] GitHub CLI 설치 완료"

      - name: 🔐 Authenticate with GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[🔐] GitHub CLI 로그인 중..."
          echo "${GITHUB_TOKEN}" | gh auth login --with-token
          echo "[✅] GitHub CLI 인증 완료"

      - name: 🔍 Iterate workflows and check latest run status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[🩺] 워크플로우 헬스체크 시작..."
          FAILED=()
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            echo "[🔍] 파일 확인: $file"
            WF_NAME=$(basename "$file" | sed -E 's/\.(ya?ml)$//')
            echo "[🔄] '$WF_NAME' 워크플로우 최근 실행 상태 조회..."
            STATUS=$(gh run list --workflow "$WF_NAME" --limit 1 --json conclusion --jq '.[0].conclusion' 2>/dev/null)
            if [ -z "$STATUS" ]; then
              echo "[⚠️] '$WF_NAME' 워크플로우 실행 기록을 찾을 수 없습니다."
              FAILED+=("$WF_NAME")
            elif [ "$STATUS" != "success" ]; then
              echo "[❌] '$WF_NAME' 마지막 실행 상태: $STATUS"
              FAILED+=("$WF_NAME")
            else
              echo "[✅] '$WF_NAME' 워크플로우 정상"
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "[🚨] 헬스체크 실패 워크플로우: ${FAILED[*]}"
            exit 1
          fi

          echo "[🎉] 모든 워크플로우 헬스체크 통과"
