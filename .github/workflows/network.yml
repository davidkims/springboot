name: 🌐 .github 업로드 실패 영구방지 (직전 파일 강제 생성)

on:
  workflow_dispatch:

jobs:
  all-in-one-info:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🛡️ 업로드 직전 .github/ 폴더 및 dummy 파일 강제 생성 (절대 실패 방지)
        run: |
          GH=.github
          mkdir -p $GH/workflows $GH/error_logs $GH/force
          echo "force-upload" > $GH/force/dummy.txt
          echo "force-workflow" > $GH/workflows/dummy.yml
          echo "force-log" > $GH/error_logs/dummy.txt
          echo "[meta]" > $GH/README.md
          echo "[dummy]" > $GH/dummy.txt
          env > $GH/force/env.txt
          find $GH -type f | sort > $GH/force/file_list.txt

          cnt=$(find $GH -type f | wc -l)
          echo "최종 .github 파일 수: $cnt"
          if [ "$cnt" -eq 0 ]; then
            echo "::error ::.github 하위 파일이 1개도 없습니다!"
            exit 1
          fi

      - name: 🔍 [진단] 실제 파일 목록
        run: find .github -type f | sort

      - name: 📦 .github 전체 업로드 (실패 불가)
        uses: actions/upload-artifact@v4
        with:
          name: all-github-artifacts
          path: .github/**
          if-no-files-found: error
