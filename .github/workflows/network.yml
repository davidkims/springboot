name: 🌐 .github No files 업로드 에러 영구차단 (에코/경로/워크플로우/환경/필수 echo/dummy)

on:
  workflow_dispatch:

jobs:
  force-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🏗️ 에코 디렉토리/에코 파일/에코 path/워크플로우/강제 파일 생성 (전문가급)
        run: |
          set -e

          GH=".github"
          ECHO_PATH="$GH/echo_path"
          # 1. 에코 path 디렉토리 선제 생성
          mkdir -p "$ECHO_PATH"

          # 2. 에코 디렉토리 목록 선언
          ECHO_DIRS="$GH/echo_system $GH/echo_network $GH/echo_dns $GH/echo_route \
            $GH/echo_docker $GH/echo_containers $GH/echo_volume $GH/echo_logs \
            $GH/echo_permission $GH/echo_user $GH/echo_key $GH/echo_fileperm \
            $GH/echo_pkg $GH/echo_env $GH/echo_build $GH/echo_git \
            $GH/echo_backup $GH/echo_monitor $GH/echo_misc \
            $GH/workflows $GH/scripts $GH/cli_test $GH/error_logs $GH/echo_db $ECHO_PATH"

          # 3. 각 에코 디렉토리에 echo 파일/keep 파일/dummy 파일/에코 dir.sh 생성
          for d in $ECHO_DIRS; do
            mkdir -p "$d"
            echo "[dummy]" > "$d/dummy.txt"
            echo "[keep]"  > "$d/.keep"
            echo "echo '[에코] $d 생성됨'" > "$d/echo_dir.sh"
            echo "$d" >> "$ECHO_PATH/dir_path_list.txt"
          done

          # 4. .github 루트에도 파일 보장
          echo "# Github Meta" > "$GH/README.md"
          echo "[meta]" > "$GH/.keep"
          echo "[dummy-root]" > "$GH/dummy.txt"
          echo "This file guarantees upload!" > "$GH/dummy_forceupload.txt"
          echo ".github" >> "$ECHO_PATH/dir_path_list.txt"

          # 5. 워크플로우 예시 및 강제 파일
          echo "name: dummy-wf" > "$GH/workflows/dummy.yml"
          echo "# dummy workflow" > "$GH/workflows/dummy.md"

          # 6. error_logs/상태파일/에코 파일/환경변수 echo
          touch "$GH/error_logs/disabled_workflows.txt"
          touch "$GH/error_logs/init_check.log"
          touch "$GH/echo_misc/health.txt"
          env > "$GH/echo_env/env.txt"
          uname -a > "$GH/echo_env/uname.txt"
          date > "$GH/echo_env/date.txt"
          printenv | sort > "$GH/echo_env/env_all.txt"
          cat /etc/os-release > "$GH/echo_env/os-release.txt"

          # 7. 에코 path 디렉토리 내 전체 dir/file 목록 echo
          find "$GH" -type d | sort > "$ECHO_PATH/all_dir_list.txt"
          find "$GH" -type f | sort > "$ECHO_PATH/all_file_list.txt"

          # 8. 폴더/파일 목록 echo (워크플로우 로그에서도 확인)
          echo "[폴더 전체 목록]"
          cat "$ECHO_PATH/all_dir_list.txt"
          echo "[파일 전체 목록]"
          cat "$ECHO_PATH/all_file_list.txt"

          # 9. 강제 업로드 보장: 실제 파일 존재 여부 체크(0개면 에러 및 파일목록 로그 남기고 실패)
          filecount=$(find "$GH" -type f | wc -l)
          if [ "$filecount" -eq 0 ]; then
            echo "::error ::.github 폴더에 실제 파일이 생성되지 않음!"
            ls -alR
            exit 1
          fi

      - name: 🔍 [진단] .github 하위 실제 파일 목록 (업로드 직전)
        run: |
          echo "==== 실제 업로드 파일 리스트 ===="
          find .github -type f | sort

      - name: 📦 .github 전체 업로드 (실패 0%, 에코/경로/워크플로우/필수)
        uses: actions/upload-artifact@v4
        with:
          name: all-github-artifacts
          path: .github/**
          if-no-files-found: error
