name: "🏦 Teradata + DW + Omni EchoOps v8.0 (Slots+NIC+Kernel+Storage+Podman/Docker Fixes)"

on:
  workflow_dispatch:
    inputs:
      generate_rows:
        description: "샘플 거래 데이터 생성 건수"
        required: true
        default: "1000"
      run_network:
        description: "Nginx 리버스프록시 실행 (true/false)"
        required: true
        default: "true"
      run_omni:
        description: "옴니채널 서버(FastAPI) 실행 (true/false)"
        required: true
        default: "true"
      push_image:
        description: "옴니 이미지를 GHCR 푸시/서명 (true/false)"
        required: true
        default: "false"
      commit_changes:
        description: "에코 산출물 커밋/푸시 (true/false)"
        required: true
        default: "true"
      enable_firewall:
        description: "UFW 방화벽 활성화 (true/false)"
        required: true
        default: "false"
      slots_omni:
        description: "Omni 서버 슬롯 수(컨테이너 복제 개수)"
        required: true
        default: "1"
      install_nic_tools:
        description: "NIC 툴/드라이버 설치 (true/false)"
        required: true
        default: "true"
      upgrade_kernel:
        description: "커널 설치/업그레이드 (true/false)"
        required: true
        default: "false"
      storage_mode:
        description: "스토리지 모드 (none|local|nfs|cifs|s3|minio)"
        required: true
        default: "none"

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  packages: write
  actions: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ECHO_TD: .github/echo_td
      ECHO_DW: .github/echo_dw
      ECHO_NET: .github/echo_net
      ECHO_OMNI: .github/echo_omni
      ECHO_LOG: .github/echo_logs
      IMAGE_REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      OMNI_IMAGE: omni-echo
      DOCKER_NET: echo-net
      PROV_DIR: .github/echo_omni
      SLOTS_OMNI: ${{ github.event.inputs.slots_omni }}
      SLOTS_NGINX: 1
      SLOTS_TD: 1
      SLOTS_PROM: 1
      SLOTS_ALERT: 1
      SLOTS_LOKI: 1
      SLOTS_PROMTAIL: 1
      STORAGE_MODE: ${{ github.event.inputs.storage_mode }}

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 🧰 Engine utils + dirs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${ECHO_TD}/sql/teradata" "${ECHO_TD}/sql/td_sim" \
                   "${ECHO_DW}/db" "${ECHO_DW}/queries" \
                   "${ECHO_NET}/nginx" "${ECHO_NET}/logs" "${ECHO_NET}/promtail" "${ECHO_NET}/prometheus" \
                   "${ECHO_OMNI}" "${ECHO_LOG}"
          cat > .github/echo_tools.sh <<'BASH'
          set -Eeuo pipefail
          echoe(){ echo "[ECHO] $*"; }
          faile(){ echo "[ECHO][FAIL] $*" >&2; exit 1; }
          retry(){ local t="$1"; shift; local s="$1"; shift; [ "${1:-}" = "--" ] && shift || true; local n=0; until "$@"; do n=$((n+1)); [ "$n" -ge "$t" ] && return 1; sleep "$s"; done; }
          wait_http(){ local url="$1"; local max="${2:-60}"; local i=0; while true; do curl -fsS --max-time 3 "$url" >/dev/null 2>&1 && return 0; i=$((i+1)); [ "$i" -ge "$max" ] && return 1; sleep 1; done; }
          ensure_podman(){ sudo apt-get update -y; sudo apt-get install -y --no-install-recommends podman podman-docker slirp4netns uidmap containernetworking-plugins; command -v podman >/dev/null || exit 1; }
          resolve(){ DOCKER_BIN="$(command -v /usr/bin/docker || true)"; [ -z "$DOCKER_BIN" ] && DOCKER_BIN="$(command -v docker || true)"; PODMAN_BIN="$(command -v podman || true)"; export DOCKER_BIN PODMAN_BIN; }
          resolve
          ctr(){ if [ "${USE_PODMAN:-0}" = "1" ]; then [ -n "${PODMAN_BIN:-}" ] || faile "podman NA"; "$PODMAN_BIN" "$@"; else [ -n "${DOCKER_BIN:-}" ] || faile "docker NA"; "$DOCKER_BIN" "$@"; fi; }
          start_docker(){ resolve; if [ -n "${DOCKER_BIN:-}" ]; then set +e; "$DOCKER_BIN" info >/dev/null 2>&1; rc=$?; set -e; if [ $rc -eq 0 ]; then USE_PODMAN=0; export USE_PODMAN; echo "USE_PODMAN=0" >> "$GITHUB_ENV"; return 0; fi; command -v service >/dev/null 2>&1 && { set +e; sudo -n service docker start >/dev/null 2>&1; "$DOCKER_BIN" info >/dev/null 2>&1 && { USE_PODMAN=0; export USE_PODMAN; echo "USE_PODMAN=0" >> "$GITHUB_ENV"; return 0; }; set -e; }; fi; ensure_podman; resolve; USE_PODMAN=1; export USE_PODMAN; echo "USE_PODMAN=1" >> "$GITHUB_ENV"; }
          BASH
          chmod +x .github/echo_tools.sh

      - name: 🧯 containerd 충돌 가드 & 기본 패키지
        shell: bash
        run: |
          set -Eeuo pipefail; . .github/echo_tools.sh
          for f in /etc/apt/sources.list.d/docker*.list /etc/apt/sources.list.d/*docker*.list; do [ -f "$f" ] && sudo mv -f "$f" "${f}.disabled"; done
          printf "Package: containerd.io\nPin: release *\nPin-Priority: -1\n" | sudo tee /etc/apt/preferences.d/99-docker-containerd-pin >/dev/null
          sudo apt-get update -y
          sudo apt-get -y remove --purge containerd.io || true
          sudo apt-get -y -f install || true
          sudo dpkg --configure -a || true
          sudo apt-get install -y --no-install-recommends sqlite3 jq python3 python3-pip curl ca-certificates ufw gawk skopeo lvm2 xfsprogs btrfs-progs nfs-common cifs-utils s3fs awscli

      - name: 🔧 NIC 설치 + 커널 업그레이드(옵션)
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ github.event.inputs.install_nic_tools }}" = "true" ]; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends ethtool net-tools iproute2 pciutils usbutils lshw bridge-utils vlan ifenslave iperf3 linux-firmware "linux-modules-extra-$(uname -r)" || true
            sudo modprobe 8021q || true; sudo modprobe bonding || true
          fi
          if [ "${{ github.event.inputs.upgrade_kernel }}" = "true" ]; then
            if apt-cache policy linux-generic-hwe-24.04 | grep -q Candidate; then sudo apt-get install -y linux-generic-hwe-24.04
            elif apt-cache policy linux-generic-hwe-22.04 | grep -q Candidate; then sudo apt-get install -y linux-generic-hwe-22.04
            else sudo apt-get install -y linux-image-generic linux-headers-generic; fi
            uname -a | tee -a "${ECHO_LOG}/kernel_upgrade.log"
            echo "[KERNEL] kernel packages installed (reboot required)" | tee -a "${ECHO_LOG}/kernel_upgrade.log"
          fi

      - name: 🛞 컨테이너 엔진 준비
        shell: bash
        run: |
          set -Eeuo pipefail; . .github/echo_tools.sh
          start_docker
          echo "[ENGINE] USE_PODMAN=${USE_PODMAN:-0}"

      - name: 💾 스토리지 설치/마운트 (선택)
        shell: bash
        env:
          # 필요 시 리포지토리 시크릿/변수로 세팅
          NFS_SERVER: ${{ secrets.NFS_SERVER }}
          NFS_PATH: ${{ secrets.NFS_PATH }}
          CIFS_URL: ${{ secrets.CIFS_URL }}
          CIFS_USER: ${{ secrets.CIFS_USER }}
          CIFS_PASS: ${{ secrets.CIFS_PASS }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -Eeuo pipefail; . .github/echo_tools.sh
          MODE="${STORAGE_MODE:-none}"
          MNT="/mnt/storage"
          sudo mkdir -p "$MNT"
          case "$MODE" in
            none) echo "[STORAGE] skip";;
            local)
              # 로컬 가상 디스크 파일을 loop로 마운트 (Actions 환경 보호)
              IMG="/tmp/echo_storage.img"
              dd if=/dev/zero of="$IMG" bs=1M count=512 status=none
              mkfs.ext4 -F "$IMG"
              sudo mount -o loop "$IMG" "$MNT"
              echo "[STORAGE] local ext4 loop mounted at $MNT";;
            nfs)
              [ -n "${NFS_SERVER:-}" ] && [ -n "${NFS_PATH:-}" ] || { echo "[STORAGE][WARN] NFS_SERVER/NFS_PATH not set"; exit 0; }
              sudo mount -t nfs "${NFS_SERVER}:${NFS_PATH}" "$MNT"
              echo "[STORAGE] NFS mounted at $MNT";;
            cifs)
              [ -n "${CIFS_URL:-}" ] || { echo "[STORAGE][WARN] CIFS_URL not set"; exit 0; }
              sudo mount -t cifs "${CIFS_URL}" "$MNT" -o "username=${CIFS_USER:-guest},password=${CIFS_PASS:-},rw,dir_mode=0777,file_mode=0666,vers=3.0"
              echo "[STORAGE] CIFS mounted at $MNT";;
            s3)
              [ -n "${S3_BUCKET:-}" ] || { echo "[STORAGE][WARN] S3_BUCKET not set"; exit 0; }
              echo "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" | sudo tee /etc/passwd-s3fs >/dev/null
              sudo chmod 600 /etc/passwd-s3fs
              sudo s3fs "${S3_BUCKET}" "$MNT" -o url=https://s3.amazonaws.com -o use_path_request_style -o allow_other || true
              echo "[STORAGE] S3 mounted at $MNT (FUSE)";;
            minio)
              retry 3 3 -- ctr pull minio/minio:latest
              ctr rm -f minio >/dev/null 2>&1 || true
              ctr run -d --name minio --network "${DOCKER_NET}" --restart unless-stopped \
                -p 9000:9000 -p 9001:9001 \
                -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
                -v "$MNT":/data minio/minio:latest server /data --console-address ":9001"
              echo "[STORAGE] MinIO running (:9000 S3, :9001 console), data at $MNT";;
            *) echo "[STORAGE] unknown mode=$MODE";;
          esac

      - name: 🐍 TD Python 클라이언트
        shell: bash
        run: |
          set +e; python3 -m pip install --upgrade pip >/dev/null 2>&1
          python3 -m pip install teradatasql teradatasqlalchemy >/dev/null 2>&1 || true

      - name: 📝 DDL/쿼리 생성
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "${ECHO_TD}/sql/td_sim/001_schema.sql" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS td;
          CREATE TABLE IF NOT EXISTS td.dim_customer( customer_id BIGSERIAL PRIMARY KEY, name VARCHAR(100) NOT NULL, email VARCHAR(200), created_ts TIMESTAMP DEFAULT NOW() );
          CREATE TABLE IF NOT EXISTS td.dim_account( account_id BIGSERIAL PRIMARY KEY, customer_id BIGINT NOT NULL REFERENCES td.dim_customer(customer_id), bank_code VARCHAR(10), currency CHAR(3) DEFAULT 'KRW', opened_ts TIMESTAMP DEFAULT NOW() );
          CREATE TABLE IF NOT EXISTS td.fact_transaction( txn_id BIGSERIAL PRIMARY KEY, account_id BIGINT NOT NULL REFERENCES td.dim_account(account_id), amount NUMERIC(18,2) NOT NULL, txn_type VARCHAR(16) CHECK (txn_type IN ('DEBIT','CREDIT')), txn_ts TIMESTAMP DEFAULT NOW() );
          CREATE TABLE IF NOT EXISTS td.echo_install_log( installed_at TIMESTAMP DEFAULT NOW(), component TEXT, detail TEXT );
          SQL
          cat > "${ECHO_DW}/queries/01_daily_volume.sql" <<'SQL'
          SELECT date_trunc('day', txn_ts) AS day, COUNT(*) AS txn_count, SUM(amount) AS total_amount FROM td.fact_transaction GROUP BY 1 ORDER BY 1 DESC;
          SQL
          cat > "${ECHO_DW}/queries/02_top_customers.sql" <<'SQL'
          SELECT c.customer_id, c.name, SUM(CASE WHEN f.txn_type='CREDIT' THEN f.amount ELSE -f.amount END) AS net_flow
          FROM td.fact_transaction f JOIN td.dim_account a ON a.account_id=f.account_id JOIN td.dim_customer c ON c.customer_id=a.customer_id
          GROUP BY 1,2 ORDER BY net_flow DESC LIMIT 20;
          SQL

      - name: 🧾 장치 인벤토리(JSON) 생성 → 전파
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${ECHO_NET}"
          # 빈 SLOTS_OMNI 대비 안전 기본값
          SLOTS_OMNI="${SLOTS_OMNI:-1}"
          SLOTS_TD="${SLOTS_TD:-1}"; SLOTS_NGINX="${SLOTS_NGINX:-1}"; SLOTS_PROM="${SLOTS_PROM:-1}"; SLOTS_ALERT="${SLOTS_ALERT:-1}"; SLOTS_LOKI="${SLOTS_LOKI:-1}"; SLOTS_PROMTAIL="${SLOTS_PROMTAIL:-1}"
          NIC_JSON="$(ip -j link show 2>/dev/null || echo '[]')"
          OS_NAME="$(. /etc/os-release; echo "${NAME} ${VERSION_ID}")"
          jq -n --arg kernel "$(uname -r)" \
                --arg uname "$(uname -a)" \
                --arg os "$OS_NAME" \
                --argjson nic "${NIC_JSON:-[]}" \
                --argjson slots "$(jq -n --argjson omni ${SLOTS_OMNI:-1} --argjson td ${SLOTS_TD:-1} --argjson nginx ${SLOTS_NGINX:-1} --argjson prom ${SLOTS_PROM:-1} --argjson alert ${SLOTS_ALERT:-1} --argjson loki ${SLOTS_LOKI:-1} --argjson promtail ${SLOTS_PROMTAIL:-1} '{omni:$omni,td:$td,nginx:$nginx,prometheus:$prom,alertmanager:$alert,loki:$loki,promtail:$promtail}')" \
                '{ts: now|todate, kernel:$kernel, uname:$uname, os:$os, nic:$nic, slots:$slots}' \
            > "${ECHO_NET}/device_info.json"

      - name: 🕸️ 네트워크
        shell: bash
        run: |
          set -Eeuo pipefail; . .github/echo_tools.sh
          ctr network create "${DOCKER_NET}" >/dev/null 2>&1 || true

      - name: 🧱 TD-SIM(Postgres) 기동 + 적재
        shell: bash
        run: |
          set -Eeuo pipefail; . .github/echo_tools.sh
          retry 3 3 -- ctr pull postgres:16
          ctr rm -f td-sim >/dev/null 2>&1 || true
          ctr run -d --name td-sim --network "${DOCKER_NET}" --restart unless-stopped \
            -p 5432:5432 \
            -v "$PWD/${ECHO_TD}/sql/td_sim":/td:ro \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            -e POSTGRES_PASSWORD=postgres postgres:16
          for i in $(seq 1 60); do ctr exec td-sim pg_isready -U postgres >/dev/null 2>&1 && break; sleep 2; done
          ctr exec -u postgres td-sim psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /td/001_schema.sql
          COUNT="${{ github.event.inputs.generate_rows }}"
          ctr exec -u postgres td-sim bash -lc "psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO td.dim_customer(name,email) SELECT '고객'||i, 'user'||i||'@bank.local' FROM generate_series(1,10) AS s(i);
          INSERT INTO td.dim_account(customer_id, bank_code, currency)
          SELECT customer_id, CASE WHEN customer_id%5=0 THEN 'NH' WHEN customer_id%4=0 THEN 'KB' WHEN customer_id%3=0 THEN 'WR' WHEN customer_id%2=0 THEN 'HN' ELSE 'SH' END, 'KRW'
          FROM td.dim_customer;
          INSERT INTO td.fact_transaction(account_id, amount, txn_type, txn_ts)
          SELECT (SELECT account_id FROM td.dim_account ORDER BY random() LIMIT 1),
                 (random()*100000)::numeric(18,2),
                 CASE WHEN random() > 0.5 THEN 'CREDIT' ELSE 'DEBIT' END,
                 NOW() - (random()*interval '10 days')
          FROM generate_series(1, ${COUNT});
          SQL"

      - name: 🧩 Omni(FastAPI) 이미지 빌드 + 슬롯 수만큼 기동
        if: ${{ github.event.inputs.run_omni == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail; . .github/echo_tools.sh
          cat > "${ECHO_OMNI}/app.py" <<'PY'
          import os
          from datetime import datetime
          from typing import List, Dict, Any
          import psycopg2
          from psycopg2.pool import SimpleConnectionPool
          from fastapi import FastAPI, HTTPException, Query
          from fastapi.responses import JSONResponse, Response
          from prometheus_client import Counter, generate_latest, CONTENT_TYPE_LATEST
          DB_HOST=os.getenv("DB_HOST","td-sim"); DB_PORT=int(os.getenv("DB_PORT","5432"))
          DB_NAME=os.getenv("DB_NAME","postgres"); DB_USER=os.getenv("DB_USER","postgres"); DB_PASS=os.getenv("DB_PASS","postgres")
          QUERIES_DIR=os.getenv("QUERIES_DIR","/queries"); SERVICE=os.getenv("SERVICE_NAME","omni")
          POOL_MAX=int(os.getenv("POOL_MAX","3"))
          app=FastAPI(title="Omni Echo API (DW+Metrics+Slots)")
          pool=None
          REQ_COUNTER=Counter("omni_requests_total","HTTP requests",["path"])
          @app.on_event("startup")
          def _startup():
            global pool
            pool=SimpleConnectionPool(minconn=1,maxconn=POOL_MAX, host=DB_HOST,port=DB_PORT,dbname=DB_NAME,user=DB_USER,password=DB_PASS)
            with pool.getconn() as c:
              with c.cursor() as cur:
                cur.execute("""CREATE SCHEMA IF NOT EXISTS ledger;
                               CREATE TABLE IF NOT EXISTS ledger.service_event(
                                 id BIGSERIAL PRIMARY KEY, at TIMESTAMP DEFAULT NOW(),
                                 service TEXT, event TEXT, detail TEXT);
                               CREATE TABLE IF NOT EXISTS ledger.service_slot(
                                 service TEXT, slot_id INT, state TEXT DEFAULT 'ready',
                                 created_at TIMESTAMP DEFAULT NOW(),
                                 PRIMARY KEY(service,slot_id));
                            """)
                cur.execute("INSERT INTO ledger.service_event(service,event,detail) VALUES (%s,%s,%s)", (SERVICE,"startup","uvicorn up"))
                c.commit()
          @app.on_event("shutdown")
          def _shutdown():
            global pool
            if pool: pool.closeall()
          def run_sql_file(path:str)->List[Dict[str,Any]]:
            import os
            sql_path=os.path.join(QUERIES_DIR,path)
            if not os.path.isfile(sql_path): raise HTTPException(status_code=404, detail=f"SQL not found: {path}")
            with open(sql_path,"r",encoding="utf-8") as f: sql=f.read()
            try:
              conn=pool.getconn(); cur=conn.cursor(); cur.execute(sql)
              cols=[c[0] for c in cur.description]; rows=cur.fetchall()
              cur.close(); pool.putconn(conn)
              out=[]
              from decimal import Decimal
              for r in rows:
                item={}
                for k,v in zip(cols,r):
                  if isinstance(v, datetime): item[k]=v.isoformat()
                  elif isinstance(v, Decimal): item[k]=float(v)
                  else: item[k]=v
                out.append(item)
              return out
            except Exception as e:
              raise HTTPException(status_code=500, detail=str(e))
          @app.get("/health")
          def health(): REQ_COUNTER.labels("/health").inc(); return {"status":"ok","ts":datetime.utcnow().isoformat(),"svc":SERVICE}
          @app.get("/dw/daily-volume")
          def dw_daily_volume(): REQ_COUNTER.labels("/dw/daily-volume").inc(); return JSONResponse(run_sql_file("01_daily_volume.sql"), headers={"Cache-Control":"public, max-age=60"})
          @app.get("/dw/top-customers")
          def dw_top_customers(): REQ_COUNTER.labels("/dw/top-customers").inc(); return JSONResponse(run_sql_file("02_top_customers.sql"), headers={"Cache-Control":"public, max-age=60"})
          @app.get("/metrics")
          def metrics(): return Response(content=generate_latest(), media_type=CONTENT_TYPE_LATEST)
          @app.get("/slots")
          def list_slots():
            conn=pool.getconn(); cur=conn.cursor()
            cur.execute("SELECT service, slot_id, state, created_at FROM ledger.service_slot ORDER BY service, slot_id")
            rows=cur.fetchall(); cur.close(); pool.putconn(conn)
            return [{"service":r[0], "slot_id":r[1], "state":r[2], "created_at":r[3].isoformat()} for r in rows]
          @app.get("/slots/{service}/create")
          def create_slots(service:str, count:int=Query(1, ge=1, le=100)):
            conn=pool.getconn(); cur=conn.cursor()
            cur.execute("SELECT COALESCE(MAX(slot_id),0) FROM ledger.service_slot WHERE service=%s",(service,))
            base=cur.fetchone()[0]
            for i in range(1, count+1):
              cur.execute("INSERT INTO ledger.service_slot(service,slot_id,state) VALUES (%s,%s,%s) ON CONFLICT DO NOTHING",(service, base+i, "ready"))
            conn.commit(); cur.close(); pool.putconn(conn)
            return {"created":count, "service":service}
          PY
          cat > "${ECHO_OMNI}/Dockerfile" <<'DOCKER'
          FROM python:3.11-slim
          RUN apt-get update && apt-get install -y --no-install-recommends curl && rm -rf /var/lib/apt/lists/*
          RUN pip install --no-cache-dir fastapi uvicorn psycopg2-binary prometheus-client
          WORKDIR /app
          COPY app.py /app/app.py
          EXPOSE 8000
          ENV QUERIES_DIR=/queries DB_HOST=td-sim DB_PORT=5432 DB_NAME=postgres DB_USER=postgres DB_PASS=postgres
          HEALTHCHECK --interval=10s --timeout=3s --retries=5 CMD curl -fsS http://localhost:8000/health || exit 1
          CMD ["uvicorn","app:app","--host","0.0.0.0","--port","8000"]
          DOCKER
          retry 3 3 -- ctr pull python:3.11-slim
          ctr build -t "${OMNI_IMAGE}:latest" "${ECHO_OMNI}"
          for i in $(seq 1 ${SLOTS_OMNI}); do
            name="omni-$i"; ctr rm -f "$name" >/dev/null 2>&1 || true
            PORT_ARGS=""
            if [ "$i" -eq 1 ]; then PORT_ARGS="-p 8090:8000"; fi
            ctr run -d --name "$name" --network "${DOCKER_NET}" --restart unless-stopped \
              ${PORT_ARGS} \
              -v "$PWD/${ECHO_DW}/queries":/queries:ro \
              -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
              -e SERVICE_NAME="$name" -e DB_HOST=td-sim -e DB_PORT=5432 -e DB_NAME=postgres -e DB_USER=postgres -e DB_PASS=postgres -e POOL_MAX=3 \
              "${OMNI_IMAGE}:latest"
          done
          for i in $(seq 1 60); do curl -fsS http://localhost:8090/health >/dev/null 2>&1 && break; sleep 2; done

      - name: 🌐 Nginx RP(슬롯 라우팅) + Exporter
        if: ${{ github.event.inputs.run_network == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail; . .github/echo_tools.sh
          retry 3 3 -- ctr pull nginx:alpine
          retry 3 3 -- ctr pull nginx/nginx-prometheus-exporter:0.11.0
          UPSTREAM_SERVERS=""; for i in $(seq 1 ${SLOTS_OMNI}); do UPSTREAM_SERVERS="${UPSTREAM_SERVERS}    server omni-${i}:8000;\n"; done
          cat > "${ECHO_NET}/nginx/nginx.conf" <<CONF
          user nginx; worker_processes auto;
          error_log /var/log/nginx/error.log warn; pid /var/run/nginx.pid;
          events { worker_connections 1024; }
          http {
            log_format echo '\$remote_addr - \$remote_user [\$time_local] "\$request" \$status \$body_bytes_sent "\$http_referer" "\$http_user_agent" rt=\$request_time';
            access_log /var/log/nginx/echo.access.log echo;
            limit_req_zone \$binary_remote_addr zone=req_zone:10m rate=5r/s;
            limit_conn_zone \$binary_remote_addr zone=conn_zone:10m;
            map \$request_method \$is_options { default 0; OPTIONS 1; }
            upstream omni_upstream { least_conn;
          ${UPSTREAM_SERVERS} }
            server {
              listen 80;
              location = /health { return 200 "OK"; add_header Content-Type text/plain; }
              location = /nginx_status { stub_status; allow all; }
              location ~* \.(env|git|ht) { deny all; }
              set \$CORS "*";
              location /api/ {
                limit_req zone=req_zone burst=20 nodelay; limit_conn conn_zone 100;
                if (\$is_options) { add_header Access-Control-Allow-Origin \$CORS always; add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always; add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always; add_header Access-Control-Max-Age 86400 always; return 204; }
                add_header Access-Control-Allow-Origin \$CORS always; add_header Access-Control-Allow-Credentials "true" always;
                proxy_pass http://omni_upstream/; proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr; proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto \$scheme;
              }
              location /dw/ {
                limit_req zone=req_zone burst=20 nodelay;
                if (\$is_options) { add_header Access-Control-Allow-Origin \$CORS always; add_header Access-Control-Allow-Methods "GET,POST,OPTIONS" always; add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always; add_header Access-Control-Max-Age 86400 always; return 204; }
                add_header Access-Control-Allow-Origin \$CORS always; add_header Access-Control-Allow-Credentials "true" always; add_header Cache-Control "public, max-age=60";
                proxy_pass http://omni_upstream/dw/; proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr; proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto \$scheme;
              }
              location = / { add_header Content-Type text/plain; return 200 "OmniChannel Gateway (slots=${SLOTS_OMNI})"; }
            }
          }
          CONF
          ctr rm -f echo-nginx >/dev/null 2>&1 || true
          ctr run -d --name echo-nginx --network "${DOCKER_NET}" --restart unless-stopped \
            -p 8088:80 \
            -v "$PWD/${ECHO_NET}/nginx/nginx.conf":/etc/nginx/nginx.conf:ro \
            -v "$PWD/${ECHO_NET}/logs":/var/log/nginx \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            nginx:alpine
          ctr rm -f nginx-exp >/dev/null 2>&1 || true
          ctr run -d --name nginx-exp --network "${DOCKER_NET}" --restart unless-stopped \
            -p 9113:9113 \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            nginx/nginx-prometheus-exporter:0.11.0 -nginx.scrape-uri=http://echo-nginx/nginx_status

      # ===== Logs (Loki/Promtail) — 엔진 분기 =====
      - name: 📈 Logs (Docker engine) — Loki + Promtail(docker_sd)
        if: ${{ github.event.inputs.run_network == 'true' && env.USE_PODMAN != '1' }}
        shell: bash
        run: |
          set -Eeuo pipefail; . .github/echo_tools.sh
          retry 3 3 -- ctr pull grafana/loki:2.9.0
          retry 3 3 -- ctr pull grafana/promtail:2.9.0
          ctr rm -f loki >/dev/null 2>&1 || true
          ctr run -d --name loki --network "${DOCKER_NET}" --restart unless-stopped \
            -p 3100:3100 \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            grafana/loki:2.9.0 -config.file=/etc/loki/local-config.yaml
          cat > "${ECHO_NET}/promtail/config.yml" <<'YAML'
          server: { http_listen_port: 9080, grpc_listen_port: 0 }
          positions: { filename: /tmp/positions.yaml }
          clients: [ { url: http://loki:3100/loki/api/v1/push } ]
          scrape_configs:
            - job_name: docker
              docker_sd_configs: [ { host: unix:///var/run/docker.sock } ]
              relabel_configs:
                - { source_labels: ['__meta_docker_container_name'], regex: '/(echo-nginx|nginx-exp|omni.*|td-sim).*', action: keep }
                - { source_labels: ['__meta_docker_container_name'], target_label: container, regex: '/(.*)', replacement: '$1' }
              pipeline_stages: [ { docker: {} } ]
          YAML
          ctr rm -f promtail >/dev/null 2>&1 || true
          ctr run -d --name promtail --network "${DOCKER_NET}" --restart unless-stopped \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v /var/lib/docker/containers:/var/lib/docker/containers:ro \
            -v "$PWD/${ECHO_NET}/promtail/config.yml":/etc/promtail/config.yml:ro \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            grafana/promtail:2.9.0 -config.file=/etc/promtail/config.yml

      - name: 📈 Logs (Podman engine) — Loki + Promtail(file_sd)
        if: ${{ github.event.inputs.run_network == 'true' && env.USE_PODMAN == '1' }}
        shell: bash
        run: |
          set -Eeuo pipefail; . .github/echo_tools.sh
          retry 3 3 -- ctr pull grafana/loki:2.9.0
          retry 3 3 -- ctr pull grafana/promtail:2.9.0
          ctr rm -f loki >/dev/null 2>&1 || true
          ctr run -d --name loki --network "${DOCKER_NET}" --restart unless-stopped \
            -p 3100:3100 \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            grafana/loki:2.9.0 -config.file=/etc/loki/local-config.yaml
          cat > "${ECHO_NET}/promtail/config.yml" <<'YAML'
          server: { http_listen_port: 9080, grpc_listen_port: 0 }
          positions: { filename: /tmp/positions.yaml }
          clients: [ { url: http://loki:3100/loki/api/v1/push } ]
          scrape_configs:
            - job_name: nginx_files
              static_configs:
                - targets: [localhost]
                  labels:
                    job: nginx
                    __path__: /var/log/nginx/echo.access.log
          YAML
          ctr rm -f promtail >/dev/null 2>&1 || true
          ctr run -d --name promtail --network "${DOCKER_NET}" --restart unless-stopped \
            -v "$PWD/${ECHO_NET}/logs":/var/log/nginx:ro \
            -v "$PWD/${ECHO_NET}/promtail/config.yml":/etc/promtail/config.yml:ro \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            grafana/promtail:2.9.0 -config.file=/etc/promtail/config.yml

      - name: 🔥 (옵션) UFW 방화벽
        if: ${{ github.event.inputs.enable_firewall == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y ufw
          sudo ufw --force reset
          for p in 8088 8090 5432 9113 3100 9090 9093 22 443; do sudo ufw allow ${p}/tcp; done
          sudo ufw default deny incoming; sudo ufw default allow outgoing; sudo ufw --force enable
          sudo ufw status verbose | tee -a "${ECHO_LOG}/ufw.log"

