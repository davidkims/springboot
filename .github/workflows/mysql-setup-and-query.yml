name: 🌐 MEGA EchoOps + Docker Image/Auth/Run 통합

on:
  workflow_dispatch:
  schedule:
    - cron: '5,20,35,50 * * * *'

jobs:
  echo-mega:
    runs-on: ubuntu-latest

    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 📁 Echo 디렉토리 생성
      run: |
        set -e
        ECHO_DIRS="tools packages logs containers install restart upgrade exec compose services templates tests db elk grafana zipkin jenkins oracle postgres mongo redis kafka rabbitmq vault minio airflow spark camunda security codeql scorecard trivy ai images auth"
        mkdir -p .github/echo_dirs
        echo "#!/bin/bash" > .github/echo_dirs/create_dirs.sh
        for d in $ECHO_DIRS; do
          mkdir -p ".github/echo_${d}"
          echo "mkdir -p .github/echo_${d}" >> .github/echo_dirs/create_dirs.sh
          echo "echo '[ECHO] Directory created: .github/echo_${d}'" >> .github/echo_dirs/create_dirs.sh
        done
        chmod +x .github/echo_dirs/create_dirs.sh
        bash .github/echo_dirs/create_dirs.sh

    - name: 🔑 Docker 로그인 정보 Echo 생성
      run: |
        echo "echo '[AUTH] Docker Login 실행 중...'" > .github/echo_auth/docker_login.sh
        echo "echo \$DOCKER_PASSWORD | docker login -u \$DOCKER_USERNAME --password-stdin" >> .github/echo_auth/docker_login.sh
        chmod +x .github/echo_auth/docker_login.sh
        bash .github/echo_auth/docker_login.sh
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    - name: 🐳 이미지 Pull + 컨테이너 실행 (Echo 기반)
      run: |
        set -e
        CONTAINERS="kafka rabbitmq vault minio airflow spark camunda"
        for svc in $CONTAINERS; do
          echo "echo '[IMAGE] Pull: $svc'" >> .github/echo_images/pull_${svc}.sh
          echo "docker pull $svc" >> .github/echo_images/pull_${svc}.sh
          chmod +x .github/echo_images/pull_${svc}.sh
          bash .github/echo_images/pull_${svc}.sh || echo "[ERROR] 이미지 풀 실패: $svc" | tee -a .github/echo_logs/image_pull_errors.log

          echo "echo '[CONTAINER] Run: $svc'" >> .github/echo_containers/run_${svc}.sh
          echo "docker run -d --name $svc $svc || echo '[WARN] $svc 컨테이너 실행 실패'" >> .github/echo_containers/run_${svc}.sh
          chmod +x .github/echo_containers/run_${svc}.sh
          bash .github/echo_containers/run_${svc}.sh || echo "[ERROR] 컨테이너 실행 실패: $svc" | tee -a .github/echo_logs/container_run_errors.log
        done

    - name: 📊 상태 점검 및 요약 출력
      run: |
        set -e
        CONTAINERS="kafka rabbitmq vault minio airflow spark camunda"
        for svc in $CONTAINERS; do
          echo "[CHECK] $svc 상태 확인 중..." | tee -a .github/echo_tests/${svc}_health.log
          docker inspect --format='{{.Name}} => {{.State.Status}}' $svc >> .github/echo_tests/${svc}_health.log || echo "⚠️ $svc 상태 불명" >> .github/echo_tests/${svc}_health.log
        done
        docker ps -a | tee .github/echo_logs/docker_ps.log
        docker images | tee .github/echo_logs/docker_images.log
        echo "[SUMMARY] 컨테이너 상태 및 이미지 Pull 요약 완료" | tee -a .github/echo_logs/final_summary.log
