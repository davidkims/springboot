name: ♾️ Transfer Log Backup - Cron (60건 Infinite)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  transfer_log_backup:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      oracle:
        image: gvenzl/oracle-xe:18-slim
        env:
          ORACLE_PASSWORD: testpass
          ORACLE_ALLOW_REMOTE: "true"
        ports:
          - 1521:1521
        options: >-
          --health-cmd="bash -c 'echo SELECT 1 FROM dual | sqlplus -s system/testpass@//127.0.0.1:1521/XE | grep -q 1'"
          --health-interval=30s
          --health-timeout=5s
          --health-retries=12

    env:
      TRANSFER_LOG_DIR: /opt/logs/transfer
      BACKUP_DIR: /opt/backup/transfer
      PROVENANCE_DIR: provenance
      PROVENANCE_STORE_DIR: provenance/store

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⏳ Wait for databases to be ready
        run: |
          echo "[⏳] Waiting for MySQL…"
          until mysqladmin ping -h127.0.0.1 -uroot -ptestpass --silent; do sleep 5; done
          echo "[✅] MySQL is up"

          echo "[⏳] Waiting for PostgreSQL…"
          until pg_isready -h127.0.0.1 -U testuser; do sleep 5; done
          echo "[✅] PostgreSQL is up"

          echo "[⏳] Waiting for Oracle…"
          # service healthcmd already checks via sqlplus inside container
          until bash -c "exec 3<>/dev/tcp/127.0.0.1/1521"; do sleep 5; done
          echo "[✅] Oracle port is open"

      - name: 🔧 Initialize Oracle user via container
        run: |
          echo "[🔧] Creating Oracle user 'testuser' inside container…"
          ORACLE_CID=$(docker ps --filter ancestor=gvenzl/oracle-xe:18-slim --format '{{.ID}}')
          echo "CREATE USER testuser IDENTIFIED BY testpass;
                GRANT CONNECT, RESOURCE TO testuser;
                GRANT UNLIMITED TABLESPACE TO testuser;
                EXIT;" | docker exec -i $ORACLE_CID sqlplus -s system/testpass@//127.0.0.1:1521/XE \
            || echo "[⚠️] Oracle user init failed, continuing…"
          echo "[✅] Oracle user 'testuser' initialized"

      - name: 🔧 Configure MySQL user & permissions
        run: |
          echo "[🔧] Creating MySQL user 'testuser' and granting privileges…"
          mysql -h127.0.0.1 -uroot -ptestpass -e "
            CREATE USER IF NOT EXISTS 'testuser'@'%' IDENTIFIED BY 'testpass';
            GRANT ALL PRIVILEGES ON testdb.* TO 'testuser'@'%';
            FLUSH PRIVILEGES;
          "
          echo "[✅] MySQL user configured"

      - name: 🧪 Install Java & JDBC Drivers and Test Connections
        run: |
          echo "[☕] Installing Java JDK…"
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          java -version
          javac -version

          echo "[📁] Creating JDBC directories…"
          mkdir -p /opt/jdbc /opt/jdbc/test

          echo "[⬇️] Downloading JDBC drivers…"
          curl -L -o /opt/jdbc/mysql-connector-j.jar \
            https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/8.3.0/mysql-connector-j-8.3.0.jar
          curl -L -o /opt/jdbc/postgresql-jdbc.jar \
            https://jdbc.postgresql.org/download/postgresql-42.7.3.jar
          curl -L -o /opt/jdbc/ojdbc8.jar \
            https://repo1.maven.org/maven2/com/oracle/database/jdbc/ojdbc8/19.3.0.0/ojdbc8-19.3.0.0.jar

          echo "[📄] Generating JDBCTest.java…"
          {
            echo 'import java.sql.Connection;'
            echo 'import java.sql.DriverManager;'
            echo ''
            echo 'public class JDBCTest {'
            echo '    public static void main(String[] args) {'
            echo '        String type = args[0], url = "";'
            echo '        String user = "testuser", pw = "testpass";'
            echo '        switch(type) {'
            echo '            case "mysql": url = "jdbc:mysql://127.0.0.1:3306/testdb"; break;'
            echo '            case "postgres": url = "jdbc:postgresql://127.0.0.1:5432/testdb"; break;'
            echo '            case "oracle": url = "jdbc:oracle:thin:@127.0.0.1:1521:XE"; break;'
            echo '            default: System.err.println("Unsupported type "+type); System.exit(1);'
            echo '        }'
            echo '        try(Connection c=DriverManager.getConnection(url,user,pw))'
            echo '            { System.out.println("[✅] Connected to "+type); }'
            echo '        catch(Exception e)'
            echo '            { System.err.println("[❌] "+type+" failed: "+e.getMessage()); }'
            echo '}'
          } | tee /opt/jdbc/test/JDBCTest.java

          echo "[🚰] Compiling…"
          javac -cp "/opt/jdbc/*" /opt/jdbc/test/JDBCTest.java

          echo "[🧲] Testing MySQL…"
          java -cp "/opt/jdbc/*:/opt/jdbc/test" JDBCTest mysql || true

          echo "[🧲] Testing PostgreSQL…"
          java -cp "/opt/jdbc/*:/opt/jdbc/test" JDBCTest postgres || true

          echo "[🧲] Testing Oracle…"
          java -cp "/opt/jdbc/*:/opt/jdbc/test" JDBCTest oracle || true

          echo "[📂] JDBC contents:"
          tree /opt/jdbc || ls -lh /opt/jdbc/

      - name: 🔄 Remake BS logic
        run: |
          echo "[🔄] Starting Remake BS logic…"
          mkdir -p $BACKUP_DIR/bs
          echo "{ \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"type\": \"BS\" }" \
            > $BACKUP_DIR/bs/bs-$(date +%s).json
          chmod 644 $BACKUP_DIR/bs/*.json
          echo "[✅] Remake BS logic completed"

      - name: 🔄 Remake MIS logic
        run: |
          echo "[🔄] Starting Remake MIS logic…"
          mkdir -p $BACKUP_DIR/mis
          echo "MIS Report generated at $(date -u +'%Y-%m-%d %H:%M:%SZ')" \
            > $BACKUP_DIR/mis/mis-$(date +%s).txt
          chmod 644 $BACKUP_DIR/mis/*.txt
          echo "[✅] Remake MIS logic completed"
