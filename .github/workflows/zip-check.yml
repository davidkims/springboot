name: 📦 _provenance 강제 파일정리(1,000개 미만 보존) + echo/로그/검증

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  clean-provenance:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 📁 echo/로그/디렉토리 생성
        run: |
          mkdir -p .github/echo_zip .github/echo_logs
          echo "mkdir -p .github/echo_zip .github/echo_logs" > .github/echo_zip/echo_dirs.sh

      - name: 🗑️ _provenance 1,000개 초과 강제 삭제 (공백/특수문자 지원, echo 기록)
        run: |
          PROV_DIR="_provenance"
          KEEP_COUNT=1000
          LOG_FILE=".github/echo_logs/delete_provenance.log"
          ECHO_FILE=".github/echo_zip/delete_provenance.sh"

          if [ -d "$PROV_DIR" ]; then
            FILE_TOTAL=$(find "$PROV_DIR" -type f | wc -l)
            echo "echo '[INFO] $PROV_DIR 전체 파일 수: $FILE_TOTAL'" | tee -a "$ECHO_FILE"
            echo "[INFO] $PROV_DIR 전체 파일 수: $FILE_TOTAL" | tee -a "$LOG_FILE"
            if [ "$FILE_TOTAL" -gt "$KEEP_COUNT" ]; then
              # 오래된 순 정렬(접근시간X, 수정시간O), 파일명에 공백/특수문자 안전하게 처리
              DELETE_LIST=$(find "$PROV_DIR" -type f -printf '%T@ %p\n' | sort -n | head -n -$KEEP_COUNT | cut -d' ' -f2-)
              echo "$DELETE_LIST" | while IFS= read -r file; do
                echo "echo '[DELETE] $file'" | tee -a "$ECHO_FILE"
                echo "[DELETE] $file" | tee -a "$LOG_FILE"
                rm -f -- "$file"
              done
              REMAIN=$(find "$PROV_DIR" -type f | wc -l)
              echo "echo '[INFO] 삭제 후 남은 파일 수: $REMAIN'" | tee -a "$ECHO_FILE"
              echo "[INFO] 삭제 후 남은 파일 수: $REMAIN" | tee -a "$LOG_FILE"
            else
              echo "echo '[SKIP] $PROV_DIR 파일 수 $FILE_TOTAL (KEEP_COUNT=$KEEP_COUNT) → 삭제 불필요'" | tee -a "$ECHO_FILE"
              echo "[SKIP] $PROV_DIR 파일 수 $FILE_TOTAL (KEEP_COUNT=$KEEP_COUNT) → 삭제 불필요" | tee -a "$LOG_FILE"
            fi
          else
            echo "echo '[WARN] $PROV_DIR 디렉토리 없음'" | tee -a "$ECHO_FILE"
            echo "[WARN] $PROV_DIR 디렉토리 없음" | tee -a "$LOG_FILE"
          fi

      - name: 📋 정리 결과 검증/출력
        run: |
          find _provenance -type f | wc -l | tee .github/echo_logs/_provenance_final_count.txt || echo "0"
          ls -al _provenance | tee -a .github/echo_logs/_provenance_final_ls.txt || echo "_provenance not found"
          cat .github/echo_logs/delete_provenance.log || true
