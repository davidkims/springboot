name: 🐬 Full MySQL Workflow with Auto Recovery & Backup

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  mysql-job:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass123
          MYSQL_DATABASE: sample_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass123
      MYSQL_DB: sample_db

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Prepare Directories
        run: |
          mkdir -p sql export .github/queries backup

      - name: 🩺 Wait for MySQL Health or Restart
        run: |
          CID=$(docker ps -q --filter "ancestor=mysql:8.0")
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $CID)
            echo "[..] MySQL status: $STATUS (attempt $i)"
            if echo "$STATUS" | grep -q "healthy"; then
              echo "[✔] MySQL is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "[!] Restarting MySQL container..."
          docker logs $CID
          docker restart $CID
          sleep 10

      - name: 🗃️ Load SQL DB from Dump if Exists
        run: |
          if [ -f "sql/backup_dump.sql" ]; then
            echo "[+] Loading existing SQL dump into database..."
            MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER $MYSQL_DB < sql/backup_dump.sql
            echo "[✔] SQL dump loaded"
          else
            echo "[!] No backup_dump.sql found to load. Skipping."
          fi

      - name: 📄 Generate init.sql and Backup
        run: |
          echo "USE sample_db;" > sql/init.sql
          echo "CREATE TABLE IF NOT EXISTS users (" >> sql/init.sql
          echo "  id INT AUTO_INCREMENT PRIMARY KEY," >> sql/init.sql
          echo "  name VARCHAR(100) NOT NULL" >> sql/init.sql
          echo ");" >> sql/init.sql
          echo "INSERT INTO users (name) VALUES ('Alice'), ('Bob'), ('Charlie');" >> sql/init.sql
          echo "" >> sql/init.sql
          echo "CREATE TABLE IF NOT EXISTS customers (" >> sql/init.sql
          echo "  customer_id INT AUTO_INCREMENT PRIMARY KEY," >> sql/init.sql
          echo "  customer_name VARCHAR(100) NOT NULL," >> sql/init.sql
          echo "  registered_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP" >> sql/init.sql
          echo ");" >> sql/init.sql
          echo "INSERT INTO customers (customer_name) VALUES ('Alice'), ('김철수'), ('김민지'), ('David');" >> sql/init.sql
          cp sql/init.sql backup/init.sql.backup

      - name: 🔁 Check and Create Missing Tables
        run: |
          echo "[+] Checking and creating required tables if missing..."
          MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER $MYSQL_DB -e "SHOW TABLES LIKE 'customers';" | grep customers || {
            echo "[⚠️] 'customers' table missing. Creating..."
            echo "CREATE TABLE IF NOT EXISTS customers (" > sql/fix_customers.sql
            echo "  customer_id INT AUTO_INCREMENT PRIMARY KEY," >> sql/fix_customers.sql
            echo "  customer_name VARCHAR(100) NOT NULL," >> sql/fix_customers.sql
            echo "  registered_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP" >> sql/fix_customers.sql
            echo ");" >> sql/fix_customers.sql
            MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER $MYSQL_DB < sql/fix_customers.sql
            echo "[✔] 'customers' table created."
          }

          MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER $MYSQL_DB -e "SHOW TABLES LIKE 'credit_card_transactions';" | grep credit_card_transactions || {
            echo "[⚠️] 'credit_card_transactions' table missing. Creating..."
            echo "CREATE TABLE IF NOT EXISTS credit_card_transactions (" > sql/fix_credit_card_transactions.sql
            echo "  transaction_id INT AUTO_INCREMENT PRIMARY KEY," >> sql/fix_credit_card_transactions.sql
            echo "  customer_id INT NOT NULL," >> sql/fix_credit_card_transactions.sql
            echo "  card_number VARCHAR(20) NOT NULL," >> sql/fix_credit_card_transactions.sql
            echo "  amount DECIMAL(10,2) NOT NULL," >> sql/fix_credit_card_transactions.sql
            echo "  transaction_time DATETIME DEFAULT CURRENT_TIMESTAMP," >> sql/fix_credit_card_transactions.sql
            echo "  FOREIGN KEY (customer_id) REFERENCES customers(customer_id)" >> sql/fix_credit_card_transactions.sql
            echo ");" >> sql/fix_credit_card_transactions.sql
            MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER $MYSQL_DB < sql/fix_credit_card_transactions.sql
            echo "[✔] 'credit_card_transactions' table created."
          }

      - name: 💳 Simulate Transactions with Retry
        run: |
          echo "USE sample_db;" > sql/simulate_transactions.sql
          for i in $(seq 1 10); do
            cid=$(( (RANDOM % 3) + 1 ))
            amount=$(( (RANDOM % 100000) + 1000 ))
            echo "INSERT INTO credit_card_transactions (customer_id, card_number, amount) VALUES ($cid, '4111111111111111', $amount);" >> sql/simulate_transactions.sql
          done

          for retry in {1..3}; do
            if MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER $MYSQL_DB < sql/simulate_transactions.sql; then
              echo "[✔] Transaction simulation succeeded"
              break
            else
              echo "[!] Transaction simulation failed on attempt $retry"
              sleep 2
            fi
            if [ $retry -eq 3 ]; then
              echo "[x] Simulation failed after 3 attempts"
              exit 1
            fi
          done

      - name: 🧷 Backup SQL Dump using mysqldump
        run: |
          echo "[+] Performing mysqldump backup..."
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_FILE=sql/backup_dump_$TIMESTAMP.sql
          MYSQL_PWD=$MYSQL_PASSWORD mysqldump -h 127.0.0.1 -u $MYSQL_USER $MYSQL_DB > $BACKUP_FILE
          echo "[✔] Backup created at $BACKUP_FILE"
          ln -sf $BACKUP_FILE sql/backup_dump.sql
