name: 🏢 MEGA DB EchoOps + All-in-One 설치/에코/권한/컨테이너/복원/보안/미들웨어/금융/대량 SQL 통합

on:
  workflow_dispatch:
  schedule:
    - cron: '5,20,35,50 * * * *'

jobs:
  mega-echo:
    runs-on: ubuntu-latest

    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 📁 필수 디렉토리 및 echo 생성
      run: |
        set -e
        for d in echo_{dirs,permissions,users,firewall,sql,img,containers,tools,logs,download,backup,security,services,data,dump,query,tmp,var,finance,ledger,transaction,account,customer,exec,restart}; do
          mkdir -p ".github/${d}"
          echo "echo '[ECHO] 디렉토리 생성: .github/${d}'" >> .github/echo_dirs/create_dirs.sh
        done
        chmod +x .github/echo_dirs/create_dirs.sh
        .github/echo_dirs/create_dirs.sh

    - name: 🚀 컨테이너 대량 생성 + 설치 스크립트 + 실행 에코
      run: |
        set -e
        mkdir -p .github/echo_containers/install
        > .github/echo_containers/create_all.sh
        CONTAINERS=( \
          "mysql:8.0" "postgres:15" "mongo" "redis" "gvenzl/oracle-xe" \
          "mcr.microsoft.com/mssql/server:2022-latest" "nouchka/sqlite3" "cassandra" \
          "clickhouse/clickhouse-server" "bitnami/kafka:latest" "rabbitmq:3-management" \
          "minio/minio" "prom/prometheus" "vault" \
        )
        NAMES=( \
          "mysql_test" "pg_test" "mongo_test" "redis_test" "oracle_xe" \
          "mssql_test" "sqlite_test" "cassandra_test" \
          "clickhouse_test" "kafka_test" "rabbitmq_test" \
          "minio_test" "prometheus_test" "vault_test" \
        )
        for i in "${!CONTAINERS[@]}"; do
          cname="${NAMES[$i]}"
          image="${CONTAINERS[$i]}"
          echo "echo '[CREATE] $cname ($image) 컨테이너 실행'" >> .github/echo_containers/create_all.sh
          echo "docker run -d --name $cname $image || echo '[WARN] $cname 생성 실패'" >> .github/echo_containers/create_all.sh

          f=".github/echo_containers/install/install_$cname.sh"
          echo "#!/bin/bash" > "$f"
          echo "echo '[INSTALL] $cname 설치 중...'" >> "$f"
          echo "docker exec $cname echo '[OK] 내부 명령 실행 (샘플)'" >> "$f"
          chmod +x "$f"
        done
        chmod +x .github/echo_containers/create_all.sh

    - name: 🔁 컨테이너 및 서버 재기동 스크립트 생성
      run: |
        set -e
        CONTAINERS=(mysql_test pg_test mongo_test redis_test oracle_xe mssql_test sqlite_test cassandra_test clickhouse_test kafka_test rabbitmq_test minio_test prometheus_test vault_test)
        echo "#!/bin/bash" > .github/echo_restart/restart_all.sh
        for c in "${CONTAINERS[@]}"; do
          echo "echo '[RESTART] $c 컨테이너 재시작'" >> .github/echo_restart/restart_all.sh
          echo "docker restart $c || echo '[WARN] $c 재시작 실패 또는 없음'" >> .github/echo_restart/restart_all.sh
        done
        chmod +x .github/echo_restart/restart_all.sh

        echo "#!/bin/bash" > .github/echo_restart/reboot_server.sh
        echo "echo '[REBOOT] 서버 재시작 시도'" >> .github/echo_restart/reboot_server.sh
        echo "sudo reboot || echo '[WARN] CI 환경에선 재시작 생략됨'" >> .github/echo_restart/reboot_server.sh
        chmod +x .github/echo_restart/reboot_server.sh

    - name: ⚙️ 컨테이너 생성 실행 (필수)
      run: |
        bash .github/echo_containers/create_all.sh | tee .github/echo_logs/container_create.log

    - name: ⚙️ 설치 스크립트 전체 실행 (필수)
      run: |
        for f in .github/echo_containers/install/*.sh; do
          bash "$f" | tee -a .github/echo_logs/install_outputs.log
        done

    - name: 🔄 컨테이너 재기동 (필수)
      run: |
        bash .github/echo_restart/restart_all.sh | tee .github/echo_logs/restart_output.log

    - name: 🔄 서버 재시작 (CI 제한 있음, 필수로 시도)
      run: |
        bash .github/echo_restart/reboot_server.sh || echo "[INFO] 서버 재시작은 CI 환경에선 제한됨"

    - name: 📜 최종 로그 요약
      run: |
        echo "echo '[LOG] 전체 작업 완료: 컨테이너 생성 + 설치 + 재기동 ✅]'" > .github/echo_logs/final_summary.sh
        chmod +x .github/echo_logs/final_summary.sh
        .github/echo_logs/final_summary.sh
