name: 🏦 전체 금융기관 ALL-IN-ONE + AutoUP(오토업데이트/리부트/백업/3분간격)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/3 * * * *'

jobs:
  fintech-allbanks-fullops:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 에코/DB/원장/거래/도커/autoup/backup 디렉토리·에코 대량 생성
        run: |
          set -e
          BANKS="국민 우리 신한 하나 농협 기업 수협 씨티 SC제일 케이카카오토스새마을금고 우체국 부산 대구 광주 전북 제주 산림조합 신협 한국씨티 JP모건 BOA HSBC UBS 도이치 한국스탠다드차타드 신용카드 롯데 삼성 현대 비씨 NH채움 하나카드 신한카드 우리카드 국민카드 기업카드 현대증권 미래에셋 NH투자 한국투자 신한투자 KB증권 삼성증권 키움 대신 신영 유진 IBK투자 메리츠 한국예탁결제원 업비트 빗썸 코빗 고팍스 바이낸스 코인원 교보 삼성 한화 동양 현대 농협 메리츠 흥국 MG MG새마을 저축은행 리브핀 페이코 카카오페이 뱅크샐러드 암호화폐토스카카오뱅크타다토스증권웨이브 오픈뱅킹모든은행포함"
          # autoup/backup/cron/리부트 등 echo/디렉토리 대량 생성
          mkdir -p .github/echo/autoup .github/echo/autoup/log .github/echo/autoup/config .github/echo/autoup/test .github/echo/backup .github/echo/backup/log .github/echo/autoup/cron .github/echo/autoup/reboot
          echo "echo '[mkdir -p 자동화 전체 디렉토리 생성]'" | tee .github/echo/autoup/dir_create.log
          echo "echo '[autoup/backup/cron/reboot 디렉토리 생성 완료]'" | tee -a .github/echo/autoup/dir_create.log
          touch .github/echo/autoup/init.log
          touch .github/echo/backup/init.log

          # 은행사별 기존 echo 생성+autoup/backup
          for B in $BANKS; do
            for d in \
              .github/echo/bank/$B \
              .github/echo/bank/$B/ledger \
              .github/echo/bank/$B/txn \
              .github/echo/bank/$B/db \
              .github/echo/bank/$B/db/sql \
              .github/echo/bank/$B/db/query \
              .github/echo/bank/$B/test \
              .github/echo/bank/$B/log \
              .github/echo/bank/$B/report \
              .github/echo/bank/$B/docker \
              .github/echo/bank/$B/docker/env \
              .github/echo/bank/$B/docker/compose \
              .github/echo/bank/$B/dockerfile \
              .github/echo/bank/$B/autoup \
              .github/echo/bank/$B/autoup/log \
              .github/echo/bank/$B/backup \
              .github/echo/bank/$B/backup/log; do
                mkdir -p "$d" 2>/dev/null || true
                echo "echo 'mkdir -p $d'" | tee -a .github/echo/autoup/dir_create.log || true
            done
            # autoup 에코 파일
            echo "echo '[${B} autoup 자동화 스크립트]'" | tee .github/echo/bank/$B/autoup/autoup_script.sh
            echo "[${B} autoup 자동화 스크립트]" > .github/echo/bank/$B/autoup/autoup_script.sh
            chmod +x .github/echo/bank/$B/autoup/autoup_script.sh || true
            echo "echo '[${B} autoup 자동화 로그]'" | tee .github/echo/bank/$B/autoup/log/autoup.log
            echo "[${B} autoup 자동화 로그]" > .github/echo/bank/$B/autoup/log/autoup.log
            # backup 에코파일
            echo "echo '[${B} 오토 백업 샘플 스크립트]'" | tee .github/echo/bank/$B/backup/backup.sh
            echo "[${B} 오토 백업 샘플 스크립트]" > .github/echo/bank/$B/backup/backup.sh
            chmod +x .github/echo/bank/$B/backup/backup.sh || true
            echo "echo '[${B} 오토 백업 로그]'" | tee .github/echo/bank/$B/backup/log/backup.log
            echo "[${B} 오토 백업 로그]" > .github/echo/bank/$B/backup/log/backup.log
          done

      - name: 🛠️ autoup 패키지/서비스/오토리부트/백업 자동 설치·에코 (cron 포함)
        run: |
          set -e
          mkdir -p .github/echo/autoup/install .github/echo/autoup/cron .github/echo/autoup/reboot
          {
            echo "echo '[autoup 패키지/서비스 자동 설치 시작]'"
            echo "sudo apt-get update -y"
            echo "sudo apt-get install -y unattended-upgrades cron"
            echo "sudo systemctl enable unattended-upgrades"
            echo "sudo systemctl start unattended-upgrades"
            echo "sudo systemctl enable cron"
            echo "sudo systemctl start cron"
            echo "[autoup 설정/테스트/로그]"
            echo "sudo unattended-upgrade --dry-run"
          } > .github/echo/autoup/install/autoup_install.sh
          chmod +x .github/echo/autoup/install/autoup_install.sh

          # 오토리부트 echo 및 실제(테스트)
          echo "echo 'sudo systemctl enable reboot.target'" | tee .github/echo/autoup/reboot/reboot_enable.sh
          echo "sudo systemctl enable reboot.target" > .github/echo/autoup/reboot/reboot_enable.sh
          chmod +x .github/echo/autoup/reboot/reboot_enable.sh

          echo '[autoup 자동화 시작]' | tee -a .github/echo/autoup/install/autoup_install.log || true
          sudo apt-get update -y | tee -a .github/echo/autoup/install/autoup_install.log || true
          sudo apt-get install -y unattended-upgrades cron | tee -a .github/echo/autoup/install/autoup_install.log || true
          sudo systemctl enable unattended-upgrades | tee -a .github/echo/autoup/install/autoup_install.log || true
          sudo systemctl start unattended-upgrades | tee -a .github/echo/autoup/install/autoup_install.log || true
          sudo systemctl enable cron | tee -a .github/echo/autoup/install/autoup_install.log || true
          sudo systemctl start cron | tee -a .github/echo/autoup/install/autoup_install.log || true
          sudo unattended-upgrade --dry-run | tee -a .github/echo/autoup/install/autoup_install.log || true

      - name: 📄 autoup 주요 정책/cron/리부트/백업 에코 자동 생성
        run: |
          set -e
          mkdir -p .github/echo/autoup/config .github/echo/autoup/cron .github/echo/autoup/reboot .github/echo/backup
          # autoup 정책(더 많은 정책 확장)
          echo "echo 'APT::Periodic::Update-Package-Lists \"1\";'" | tee .github/echo/autoup/config/10periodic
          echo 'APT::Periodic::Update-Package-Lists "1";' > .github/echo/autoup/config/10periodic
          echo "echo 'APT::Periodic::Unattended-Upgrade \"1\";'" | tee .github/echo/autoup/config/20auto-upgrades
          echo 'APT::Periodic::Unattended-Upgrade "1";' > .github/echo/autoup/config/20auto-upgrades
          echo "echo 'Unattended-Upgrade::Remove-Unused-Dependencies \"true\";'" | tee .github/echo/autoup/config/30remove-unused
          echo 'Unattended-Upgrade::Remove-Unused-Dependencies "true";' > .github/echo/autoup/config/30remove-unused
          echo "echo 'Unattended-Upgrade::Automatic-Reboot \"true\";'" | tee .github/echo/autoup/config/40auto-reboot
          echo 'Unattended-Upgrade::Automatic-Reboot "true";' > .github/echo/autoup/config/40auto-reboot
          echo "echo 'Unattended-Upgrade::Automatic-Reboot-Time \"03:30\";'" | tee .github/echo/autoup/config/50auto-reboot-time
          echo 'Unattended-Upgrade::Automatic-Reboot-Time "03:30";' > .github/echo/autoup/config/50auto-reboot-time
          echo "echo 'APT::Periodic::AutocleanInterval \"7\";'" | tee .github/echo/autoup/config/60autoclean
          echo 'APT::Periodic::AutocleanInterval "7";' > .github/echo/autoup/config/60autoclean
          echo "echo '[autoup 정책 파일 전체 생성 완료]'" | tee .github/echo/autoup/config/dir_create.log

          # 오토리부트 정책/cron
          echo "echo '0 3 * * * root /sbin/reboot'" | tee .github/echo/autoup/cron/reboot_cron.txt
          echo '0 3 * * * root /sbin/reboot' > .github/echo/autoup/cron/reboot_cron.txt
          echo "echo '[reboot cron 등록]'"
          echo '[reboot cron 등록]' | tee -a .github/echo/autoup/cron/reboot_cron.txt

          # 오토 백업 샘플/cron 에코
          echo "echo '0 2 * * * root tar czf /tmp/backup_\$(date +%Y%m%d_%H%M).tar.gz /etc /var/lib /home'" | tee .github/echo/autoup/cron/backup_cron.txt
          echo '0 2 * * * root tar czf /tmp/backup_$(date +%Y%m%d_%H%M).tar.gz /etc /var/lib /home' > .github/echo/autoup/cron/backup_cron.txt
          echo '[backup cron 등록]' | tee -a .github/echo/autoup/cron/backup_cron.txt

          # 3분마다 autoup 전체 테스트/체크 cron echo
          echo "echo '*/3 * * * * root /usr/bin/unattended-upgrade -d >> /var/log/unattended-upgrades/autoup.log 2>&1'" | tee .github/echo/autoup/cron/autoup_cron.txt
          echo '*/3 * * * * root /usr/bin/unattended-upgrade -d >> /var/log/unattended-upgrades/autoup.log 2>&1' > .github/echo/autoup/cron/autoup_cron.txt
          echo '[autoup 3분 cron 등록]' | tee -a .github/echo/autoup/cron/autoup_cron.txt

      # 기존 은행/도커/DB/업그레이드/echo/권한/에러 무중단 step 반복
      # 추가 백업, autoup, cron 등록, 오토리부트 등 전체 echo/파일/디렉토리 자동화
