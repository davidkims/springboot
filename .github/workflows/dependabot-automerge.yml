name: "🤖 Dependabot Auto-Approve & Merge (safe)"

on:
  pull_request_target:
    types: [opened, synchronize, labeled]
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-approve (security/patch/minor only)
        if: |
          steps.meta.outputs.security-advisory-id != '' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (squash)
        if: |
          steps.meta.outputs.security-advisory-id != '' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        uses: peter-evans/enable-pull-request-automerge@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash

      - name: Comment when not auto-merging
        if: |
          !(steps.meta.outputs.security-advisory-id != '' ||
            steps.meta.outputs.update-type == 'version-update:semver-patch' ||
            steps.meta.outputs.update-type == 'version-update:semver-minor')
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ⚠️ 자동 머지 기준(보안·패치·마이너)에 해당하지 않아 유지보수자 검토가 필요합니다.
            - update-type: `${{ steps.meta.outputs.update-type }}`
            - dependency-type: `${{ steps.meta.outputs.dependency-type }}`
