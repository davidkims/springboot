name: 🔐 MEGA Secure CI + AutoUP + EchoOps + Pages + Backups + Security + Containers + Oracle

on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'

permissions:
  contents: read
  pull-requests: write
  id-token: write
  security-events: write
  pages: write

jobs:
  mega-secure-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DB_USER: root
      DB_PASS: rootpass123
      DB_NAME: sample_db

    steps:
    - name: 📂 Checkout Repository
      uses: actions/checkout@v4

    - name: 📁 Create Echo Directories (No Missing File)
      run: |
        set -e
        mkdir -p .github/echo_logs
        CREATE_SCRIPT=".github/echo_logs/create_dirs.sh"
        echo "#!/bin/bash" > $CREATE_SCRIPT
        for dir in .github/echo_{scorecard,codeql,logs,security,upgrade,autoup,pages,templates,backup,monitoring,containers,downloads} site/{scorecard,security,upgrade,pr,backup,html,downloads}; do
          mkdir -p "$dir"
          echo "echo '[ECHO] 디렉토리 생성: $dir'" >> $CREATE_SCRIPT
        done
        chmod +x $CREATE_SCRIPT
        bash $CREATE_SCRIPT

    - name: 🛡️ Install Security Tools
      run: |
        set -e
        sudo apt-get update -y
        sudo apt-get install -y jq curl python3-pip unzip mysql-client postgresql-client docker.io
        pip install bandit pip-audit
        curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

    - name: 🧪 Install Scorecard CLI
      run: |
        set -e
        VERSION="4.10.3"
        curl -sLO https://github.com/ossf/scorecard/releases/download/v${VERSION}/scorecard_${VERSION}_linux_amd64.tar.gz
        tar -xzf scorecard_${VERSION}_linux_amd64.tar.gz
        BIN=$(find scorecard_${VERSION}_linux_amd64* -type f -name scorecard | head -n1 || true)
        if [ -z "$BIN" ]; then
          echo "::error ::[ERR] Scorecard binary not found after extract."
          exit 1
        fi
        chmod +x "$BIN"
        sudo mv "$BIN" /usr/local/bin/scorecard
        scorecard --version

    - name: 🧾 Run Scorecard
      run: |
        set -e
        scorecard --repo=https://github.com/${{ github.repository }} --format sarif --no-upload > results.sarif
        scorecard --repo=https://github.com/${{ github.repository }} --format json --no-upload > results.json
        cp results.sarif site/scorecard/scorecard-results.sarif
        cp results.json site/security/security.json

    - name: 🔎 Run Bandit, pip-audit, Trivy
      run: |
        set -e
        bandit -r . -f json > site/security/bandit.json || true
        pip-audit -f json -o site/security/pip-audit.json || true
        trivy fs . --format json --output site/security/trivy.json || true

    - name: 🧰 Run CodeQL Init
      uses: github/codeql-action/init@v3
      with:
        languages: javascript

    - name: 📊 Run CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        output: site/security/codeql-results.sarif
        category: codeql-security-scan

    - name: 📦 Start Containers + Health Check
      run: |
        set -e
        SERVICES="vault:1.14 mysql:8 postgres:15 redis:7 gvenzl/oracle-xe:latest"
        HEALTH_LOG=".github/echo_logs/containers_health.sh"
        echo "#!/bin/bash" > $HEALTH_LOG
        for svc in $SERVICES; do
          NAME=$(echo $svc | tr '/:' '_')
          echo "[ECHO] Pulling $svc"
          docker pull $svc || true
          echo "[ECHO] Starting $svc"
          docker run -d --name ${NAME}_test $svc || true
          sleep 10
          if docker ps --filter "name=${NAME}_test" --filter "status=running" | grep -q ${NAME}_test; then
            echo "echo '[HEALTH] $svc is running ✅'" >> $HEALTH_LOG
          else
            echo "echo '[HEALTH] $svc failed ❌ - restarting...'" >> $HEALTH_LOG
            docker restart ${NAME}_test || true
          fi
        done
        chmod +x $HEALTH_LOG
        bash $HEALTH_LOG

    - name: 🗄️ DB Backups
      run: |
        set -e
        mysqldump -u${DB_USER} -p${DB_PASS} ${DB_NAME} > site/backup/mysqldump.sql || echo "[WARN] MySQL 백업 실패"
        pg_dump -U postgres -d ${DB_NAME} > site/backup/pgdump.sql || echo "[WARN] PostgreSQL 백업 실패"
        echo "exit" | sqlplus -S system/oracle@localhost @backup.sql > site/backup/sqlplus_backup.log || echo "[WARN] Oracle 백업 실패"

    - name: 📈 Save Upgrade Info
      run: |
        set -e
        apt list --upgradable 2>/dev/null | tee site/upgrade/upgradable.txt

    - name: 🔁 Create Auto PR for Upgrade
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        if [ -s site/upgrade/upgradable.txt ]; then
          gh pr create --title "🔄 패키지 업그레이드 PR" \
            --body "자동 생성된 PR입니다. 참고: site/upgrade/upgradable.txt" || true
        fi

    - name: 📦 Save Security Reports & Downloads
      uses: actions/upload-artifact@v4
      with:
        name: all-reports
        path: site/

    - name: 🌐 Upload GitHub Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/

    - name: 🚀 Deploy to GitHub Pages
      uses: actions/deploy-pages@v4

    - name: ⬆️ Auto Upgrade + Echo
      run: |
        set -e
        mkdir -p .github/echo_autoup
        cat <<'EOF' > .github/echo_autoup/autoup.sh
        #!/bin/bash
        echo "[AUTOUP] 시스템 자동 업그레이드 시작"
        sudo apt-get update -y && sudo apt-get upgrade -y
        echo "[AUTOUP] 완료"
        EOF
        chmod +x .github/echo_autoup/autoup.sh
        bash .github/echo_autoup/autoup.sh

    - name: 🔁 Schedule Reboot (1 min later)
      run: |
        echo "[REBOOT] 1분 후 자동 재시작 예약됨"
        sudo shutdown -r +1 || true
