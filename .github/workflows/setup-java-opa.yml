name: ☕ Java + 🛡️ OPA 설치 및 정책 테스트

on:
  workflow_dispatch:

jobs:
  setup-java-opa-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 저장소 체크아웃
        uses: actions/checkout@v4

      - name: ☕ Java 설치 (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 OPA 설치 (Open Policy Agent)
        run: |
          echo "[🛠️] 시작: OPA static binary 다운로드 및 설치"
          OPA_VERSION="v0.63.0"
          echo "[📥] 다운로드 중: https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          curl -sSL -o opa https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static
          echo "[🔑] 실행 권한 부여"
          chmod +x opa
          echo "[🚚] /usr/local/bin/opa로 이동"
          sudo mv opa /usr/local/bin/opa
          echo "[✔] OPA 설치 완료"

      - name: 📄 OPA 정책 파일(`allow.rego`) 생성
        run: |
          echo "[📄] 정책 디렉토리 생성: opa_policies/"
          mkdir -p opa_policies

          echo "[✍️] allow.rego 작성 시작"
          echo "package example" | tee opa_policies/allow.rego
          echo "" | tee -a opa_policies/allow.rego
          echo "default allow = false" | tee -a opa_policies/allow.rego
          echo "" | tee -a opa_policies/allow.rego
          echo "allow {" | tee -a opa_policies/allow.rego
          echo "  input.user == \"admin\"" | tee -a opa_policies/allow.rego
          echo "}" | tee -a opa_policies/allow.rego

          echo "[🧾] 작성된 정책 파일 내용:"
          cat opa_policies/allow.rego

          echo "[✔] 정책 파일 생성 완료: opa_policies/allow.rego"

      - name: 🧪 OPA 정책 평가 (opa eval)
        run: |
          echo "[🚀] OPA 정책 평가 시작 (admin 사용자)"
          echo '[INPUT] "user": "admin"'
          echo '{"user": "admin"}' | opa eval --input - --data opa_policies/allow.rego 'data.example.allow'

          echo "[🚀] OPA 정책 평가 시작 (guest 사용자)"
          echo '[INPUT] "user": "guest"'
          echo '{"user": "guest"}' | opa eval --input - --data opa_policies/allow.rego 'data.example.allow'

      - name: ✅ Java & OPA 정상 설치 확인
        run: |
          echo "[ℹ️] Java 버전 확인 중..."
          java -version
          echo "[✔] Java 설치 확인 완료"

          echo "[ℹ️] OPA 버전 확인 중..."
          opa version
          echo "[✔] OPA 설치 확인 완료"
