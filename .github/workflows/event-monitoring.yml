# .github/workflows/event-monitoring.yml
name: 📡 워크플로 전체 상황 모니터링 (All Workflows Monitoring:Dispatch + Schedule)

on:
  # 개별 워크플로우에서 repository_dispatch로 보낸 이벤트 수신
  repository_dispatch:
    types:
      - workflow_run

  # 5분마다 전체 워크플로우 폴링
  schedule:
    - cron: '*/5 * * * *'

  # 수동 실행도 지원
  workflow_dispatch: {}

jobs:
  monitor-all-runs:
    runs-on: ubuntu-latest

    steps:
      - name: ▶️ 모든 워크플로우 실행 목록 조회
        id: fetch_runs
        run: |
          echo "echo '[🔍] 모든 워크플로우 실행 목록 조회...'"
          echo '[🔍] 모든 워크플로우 실행 목록 조회...'
          curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=50" \
            > all-runs.json
          cat all-runs.json | jq '[.workflow_runs[] | {id, name, display_title, status, conclusion, run_number, html_url, created_at, updated_at, actor: .actor.login}]' > all-runs-summary.json

      - name: 📝 최신 워크플로우 10건 요약 로그
        run: |
          echo "echo '[📝] 최신 워크플로우 10건 요약...'"
          echo '[📝] 최신 워크플로우 10건 요약...'
          cat all-runs-summary.json | jq -r '.[:10][] | "[\(.id)] \(.display_title // .name) #\(.run_number) | 상태: \(.status)/\(.conclusion) | 실행: \(.actor) | URL: \(.html_url)"'

      - name: 📂 전체 워크플로우 실행 요약 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: all-workflow-runs-summary
          path: all-runs-summary.json

      - name: 🔄 각 워크플로우 실행 상세 감지 및 저장 (최대 10건)
        run: |
          echo "echo '[🔄] 각 워크플로우 실행 상세 감지 및 저장...'"
          echo '[🔄] 각 워크플로우 실행 상세 감지 및 저장...'
          mkdir -p runs-details jobs-details steps-details
          i=0
          for rid in $(cat all-runs-summary.json | jq -r '.[].id' | head -10); do
            # 워크플로우 실행 상세 정보
            echo "echo '[🟢] 워크플로우 실행 상세정보: $rid'"
            echo "[🟢] 워크플로우 실행 상세정보: $rid"
            curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$rid" > runs-details/run-$rid.json

            # 각 실행의 jobs(모든 job별 상태)
            echo "echo '[🔹] jobs 목록: $rid'"
            echo "[🔹] jobs 목록: $rid"
            curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$rid/jobs" > jobs-details/jobs-$rid.json

            # 모든 job별 step 상태까지 추출
            cat jobs-details/jobs-$rid.json | jq '[.jobs[] | {id, name, status, conclusion, started_at, completed_at, steps: [.steps[] | {name, status, conclusion}] }]' > steps-details/steps-$rid.json

            i=$((i+1))
            if [ $i -ge 10 ]; then break; fi
          done

      - name: 📦 모든 워크플로우 실행/잡/스텝 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: all-workflow-details
          path: |
            runs-details/
            jobs-details/
            steps-details/

      - name: 📋 모든 워크플로우 상황 집계 및 결과 출력
        run: |
          echo "echo '[📋] 모든 워크플로우 최신 상태 집계...'"
          echo '[📋] 모든 워크플로우 최신 상태 집계...'
          jq -r '.[] | "워크플로: \(.display_title // .name) (#\(.run_number))\n상태: \(.status)/\(.conclusion)\nURL: \(.html_url)\n-----"' all-runs-summary.json | head -40

      # 옵션: 필요시 각 최신 워크플로 ID를 변수로 전달해서 추가 액션 확장 가능
