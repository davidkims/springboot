name: 🏦 Bank Customer Provenance Certificates + Deploy

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 자정(UTC) 실행
  workflow_dispatch:       # 수동 실행 허용

permissions:
  contents: write
  id-token: write
  attestations: write
  pages: write

env:
  OUT_DIR: customer-provenance

jobs:
  generate-customer-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Create Output Directory
        run: |
          echo "[STEP] Creating output directory: $OUT_DIR"
          mkdir -p $OUT_DIR

      - name: 🧾 Generate Bank Customer Provenance Certificates
        run: |
          echo "[STEP] Generating customer JSON files"
          for i in $(seq -w 1 5); do
            echo "[INFO] Creating customer_data_${i}.json..."
            CUSTOMER_ID="BANK-CUST-${i}"
            CUSTOMER_NAME="Bank Customer ${i}"
            TRANSACTION_ID="TRX-${RANDOM}${i}000"
            AMOUNT=$((10000 + $i * 5000))
            CURRENCY="KRW"
            DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            GEN_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            cat <<EOF > $OUT_DIR/customer_data_${i}.json
{
  "provenance_type": "bank_customer_transaction",
  "customer_info": {
    "customer_id": "${CUSTOMER_ID}",
    "customer_name": "${CUSTOMER_NAME}"
  },
  "transaction_details": {
    "transaction_id": "${TRANSACTION_ID}",
    "amount": ${AMOUNT},
    "currency": "${CURRENCY}",
    "transaction_date": "${DATE}",
    "transaction_type": "deposit"
  },
  "metadata": {
    "generated_by": "GitHub Actions Workflow",
    "workflow_run_id": "${GITHUB_RUN_ID}",
    "workflow_run_number": "${GITHUB_RUN_NUMBER}",
    "repository": "${GITHUB_REPOSITORY}",
    "commit_sha": "${GITHUB_SHA}",
    "generation_date": "${GEN_DATE}"
  }
}
EOF
            echo "[✔] Created: $OUT_DIR/customer_data_${i}.json"
          done

      - name: 📦 Archive for GitHub Pages
        run: |
          echo "[STEP] Archiving files for GitHub Pages"
          mkdir -p site/customer-provenance
          cp $OUT_DIR/*.json site/customer-provenance/
          echo "<h1>Bank Customer Provenance Certificates</h1>" > site/index.html
          echo "<ul>" >> site/index.html
          for f in $OUT_DIR/*.json; do
            filename=$(basename "$f")
            echo "<li><a href=\"customer-provenance/$filename\">$filename</a></li>" >> site/index.html
          done
          echo "</ul>" >> site/index.html

      - name: 📤 Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: generate-customer-provenance
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
