name: 🔒 Encrypt All Workflow Files (GPG + OpenSSL)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # 매일 03:00

jobs:
  encrypt:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 📁 암호화/로그/에코 디렉토리 생성
        run: |
          for d in .github/encrypted_workflows .github/encrypt_logs .github/echo; do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo/encrypt_dirs.txt
            mkdir -p $d
          done
          echo "echo '[INFO] 디렉토리 생성 완료'" | tee -a .github/echo/encrypt_dirs.txt

      - name: 🔑 GPG 공개키 임포트 (시크릿 사용)
        if: ${{ secrets.GPG_PUBLIC_KEY != '' }}
        run: |
          echo "${{ secrets.GPG_PUBLIC_KEY }}" > .github/encrypt_logs/pubkey.asc
          gpg --import .github/encrypt_logs/pubkey.asc
          echo "echo '[INFO] GPG 공개키 임포트 완료'" | tee -a .github/echo/encrypt_gpg.txt
        env:
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}

      - name: 🔒 모든 워크플로우 GPG+OpenSSL 암호화 (echo/로그)
        run: |
          GPG_OK=0
          if gpg --list-keys | grep -q '@'; then
            GPG_OK=1
          fi
          PASS="${{ secrets.ENCRYPT_PASS }}"
          > .github/encrypt_logs/result.txt
          for f in .github/workflows/*.y*ml; do
            [ -f "$f" ] || continue
            BN=$(basename "$f")
            OUT1=".github/encrypted_workflows/${BN}.gpg"
            OUT2=".github/encrypted_workflows/${BN}.enc"
            # GPG 암호화
            if [ "$GPG_OK" = "1" ]; then
              echo "echo '[GPG 암호화] $f → $OUT1'" | tee -a .github/echo/encrypt_gpg.txt
              gpg --yes --batch --trust-model always --output "$OUT1" --encrypt --recipient "$(gpg --list-keys | grep uid | head -n1 | sed -E 's/.*<(.+)>/\1/')" "$f" \
                && echo "GPG Encrypted: $f → $OUT1" >> .github/encrypt_logs/result.txt \
                || echo "GPG 암호화 실패: $f" >> .github/encrypt_logs/result.txt
            else
              echo "echo '[GPG 암호화 SKIP] 공개키 없음: $f'" | tee -a .github/echo/encrypt_gpg.txt
              echo "GPG 암호화 SKIP: $f" >> .github/encrypt_logs/result.txt
            fi
            # OpenSSL 암호화
            if [ -n "$PASS" ]; then
              echo "echo '[OpenSSL 암호화] $f → $OUT2'" | tee -a .github/echo/encrypt_openssl.txt
              openssl enc -aes-256-cbc -salt -in "$f" -out "$OUT2" -k "$PASS" \
                && echo "OpenSSL Encrypted: $f → $OUT2" >> .github/encrypt_logs/result.txt \
                || echo "OpenSSL 암호화 실패: $f" >> .github/encrypt_logs/result.txt
            else
              echo "echo '[OpenSSL 암호화 SKIP] 비밀번호 없음: $f'" | tee -a .github/echo/encrypt_openssl.txt
              echo "OpenSSL 암호화 SKIP: $f" >> .github/encrypt_logs/result.txt
            fi
          done
          echo "echo '[INFO] 암호화 전체 작업 종료'" | tee -a .github/echo/encrypt_done.txt

      - name: 📝 암호화 결과 로그 출력 (에코)
        run: |
          echo "echo '[암호화 결과 로그]'"
          cat .github/encrypt_logs/result.txt || echo "No encrypt result log."

      - name: 📝 암호화 echo 파일 요약 출력 (옵션)
        run: |
          for f in .github/echo/*.txt; do
            echo "----- $f -----"
            cat $f
          done
