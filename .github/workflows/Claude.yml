name: 🤖 Claude CLI Install & Test

on:
  workflow_dispatch:

jobs:
  install-claude-cli:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟩 Install Node.js & npm
        run: |
          echo "echo '[🟩] Node.js & npm 설치...'"
          echo '[🟩] Node.js & npm 설치...'
          sudo apt-get update -y
          sudo apt-get install -y nodejs npm
          node -v
          npm -v

      - name: 🤖 Install Claude CLI
        run: |
          echo "echo '[🤖] Claude CLI 설치...'"
          echo '[🤖] Claude CLI 설치...'
          sudo npm install -g claude
          echo "echo '[🤖] Claude CLI 버전 확인...'"
          echo '[🤖] Claude CLI 버전 확인...'
          claude --version || echo '[⚠️] Claude CLI 버전 확인 실패'

      - name: 🧪 (Optional) Claude CLI 간단 테스트
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          echo "echo '[🧪] Claude CLI 테스트... (API 키 필요)'"
          echo '[🧪] Claude CLI 테스트... (API 키 필요)'
          if [ -z "$CLAUDE_API_KEY" ]; then
            echo '[⚠️] CLAUDE_API_KEY가 없습니다. 테스트를 건너뜁니다.'
            exit 0
          fi
          claude chat --api-key "$CLAUDE_API_KEY" --message "Hello, Claude!" || echo '[⚠️] Claude CLI 테스트 실패'
