name: 🛡️ Scorecard Binary Install + Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

env:
  SCORECARD_VERSION: "4.10.5"
  INSTALL_DIR: "/opt/scorecard"
  OUT_DIR: .github/scorecard
  TARGET_REPO: ${{ github.repository }}

jobs:
  scorecard-job:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Create install directory
        run: |
          sudo mkdir -p $INSTALL_DIR
          sudo chmod 777 $INSTALL_DIR

      - name: 🧾 Download & Install Scorecard CLI
        run: |
          echo "[+] Fetching Scorecard v${SCORECARD_VERSION}"
          ASSET="scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz"
          URL="https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/${ASSET}"
          wget -qO- "$URL" | tar xz
          chmod +x scorecard
          sudo mv scorecard $INSTALL_DIR/
          echo "$INSTALL_DIR" >> $GITHUB_PATH
          scorecard --version

      - name: 📂 Make output dir
        run: mkdir -p $OUT_DIR

      - name: 🧪 Scorecard JSON Scan
        run: |
          scorecard --repo=https://github.com/${TARGET_REPO} \
                    --format=json --show-details > $OUT_DIR/results.json

      - name: 📄 Convert JSON → SARIF
        run: |
          scorecard --repo=https://github.com/${TARGET_REPO} \
                    --format=sarif > $OUT_DIR/scorecard-results.sarif

      - name: 📤 Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.OUT_DIR }}/scorecard-results.sarif

      - name: 📦 Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-json
          path: ${{ env.OUT_DIR }}/results.json
