name: 🔁 Echo FullOps Universal:OS 감지 + 패키지 + 도구 + 템플릿

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  echo-fullops:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Repository Checkout
        uses: actions/checkout@v4

      - name: 📁 Echo 디렉토리 대량 생성
        run: |
          mkdir -p .github/echo_{pkgs,dirs,install,tools,templates,permissions,exec,logs}
          echo "echo '[ECHO] 디렉토리 생성 완료'" > .github/echo_dirs/create_dirs.sh

      - name: 📦 패키지 매니저 목록 에코 생성 (APT/YUM/DNF/ZYPPER/PACMAN 포함)
        run: |
          declare -A mgrs=(
            [apt]="curl wget git vim python3 default-jdk mysql-client nodejs npm"
            [yum]="curl wget git python3 java-11-openjdk mysql nodejs npm"
            [dnf]="curl wget git python3 java-11-openjdk mysql nodejs npm"
            [zypper]="curl wget git python3 java-11-openjdk mysql nodejs npm"
            [pacman]="curl wget git python3 jdk11-openjdk mysql nodejs npm"
            [pip]="requests flask pandas numpy"
            [npm]="eslint typescript http-server"
            [brew]="wget mysql node"
            [choco]="git vscode python nodejs"
            [snap]="code postman spotify"
          )
          for mgr in "${!mgrs[@]}"; do
            out=".github/echo_pkgs/${mgr}.txt"
            for pkg in ${mgrs[$mgr]}; do
              echo "$pkg" >> "$out"
              echo "echo '[ECHO] $mgr: $pkg'" >> ".github/echo_pkgs/log_${mgr}.sh"
            done
          done

      - name: 🛠️ 설치 스크립트 자동 생성 (모든 매니저)
        run: |
          for mgr in apt yum dnf zypper pacman pip npm brew choco snap; do
            in=".github/echo_pkgs/${mgr}.txt"
            out=".github/echo_install/install_${mgr}.sh"
            log=".github/echo_install/install_${mgr}_echo.sh"
            echo "#!/bin/bash" > "$out"
            echo "#!/bin/bash" > "$log"
            while read -r pkg; do
              echo "echo '[ECHO] 설치: $pkg'" >> "$log"
              case "$mgr" in
                apt) echo "sudo apt-get install -y $pkg" >> "$out" ;;
                yum) echo "sudo yum install -y $pkg" >> "$out" ;;
                dnf) echo "sudo dnf install -y $pkg" >> "$out" ;;
                zypper) echo "sudo zypper install -y $pkg" >> "$out" ;;
                pacman) echo "sudo pacman -S --noconfirm $pkg" >> "$out" ;;
                pip) echo "pip install $pkg" >> "$out" ;;
                npm) echo "npm install -g $pkg" >> "$out" ;;
                brew) echo "brew install $pkg" >> "$out" ;;
                choco) echo "choco install -y $pkg" >> "$out" ;;
                snap) echo "sudo snap install $pkg" >> "$out" ;;
              esac
            done < "$in"
            chmod +x "$out" "$log"
          done

      - name: 🔧 도구 설치 스크립트 (Docker, K8s, Terraform, AWS CLI)
        run: |
          echo "#!/bin/bash" > .github/echo_tools/install_tools.sh
          echo "echo '[TOOLS] 도구 설치 시작'" >> .github/echo_tools/install_tools.sh

          cat <<EOF >> .github/echo_tools/install_tools.sh
echo '[ECHO] Docker 설치'
curl -fsSL https://get.docker.com | bash

echo '[ECHO] Kubernetes (kubectl) 설치'
curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
chmod +x kubectl && sudo mv kubectl /usr/local/bin/

echo '[ECHO] Terraform 설치'
wget https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
unzip terraform_1.7.5_linux_amd64.zip
sudo mv terraform /usr/local/bin/

echo '[ECHO] AWS CLI 설치'
curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
unzip awscliv2.zip
sudo ./aws/install
EOF

          chmod +x .github/echo_tools/install_tools.sh

      - name: 📄 템플릿 파일 에코 생성 (.env, .json, .cfg)
        run: |
          echo "echo 'API_KEY=__REPLACE__'" > .github/echo_templates/.env.template
          echo '{ "apiKey": "__REPLACE__", "url": "https://example.com" }' > .github/echo_templates/config.json
          echo "[config]\nkey=__REPLACE__\nendpoint=https://example.com" > .github/echo_templates/app.cfg

      - name: 🔐 권한 설정 에코 스크립트
        run: |
          PERM=".github/echo_permissions/set_permissions.sh"
          echo "#!/bin/bash" > "$PERM"
          echo "echo '[PERMISSIONS] 권한 설정 시작'" >> "$PERM"
          for d in .github .github/echo_*; do
            echo "chmod -R 755 $d && chown -R \$USER:\$USER $d" >> "$PERM"
          done
          chmod +x "$PERM"

      - name: 🧠 OS 감지 분기 에코 스크립트 생성
        run: |
          DETECT=".github/echo_exec/os_detect.sh"
          echo "#!/bin/bash" > "$DETECT"
          echo "echo '[OS DETECT] 감지 시작'" >> "$DETECT"
          echo 'if [[ "$OSTYPE" == "linux-gnu"* ]]; then echo "Linux Detected"; fi' >> "$DETECT"
          echo 'if [[ "$OSTYPE" == "darwin"* ]]; then echo "macOS Detected"; fi' >> "$DETECT"
          echo 'if [[ "$OSTYPE" == "msys"* ]]; then echo "Windows (Git Bash) Detected"; fi' >> "$DETECT"
          chmod +x "$DETECT"

      - name: 🧬 통합 실행 스크립트 생성 (echo_run_all.sh)
        run: |
          OUT=".github/echo_exec/echo_run_all.sh"
          echo "#!/bin/bash" > "$OUT"
          echo "echo '[RUN] 전체 실행 시작'" >> "$OUT"

          for f in .github/echo_install/install_*.sh; do
            echo "bash $f | tee -a .github/echo_logs/$(basename $f).log" >> "$OUT"
          done

          echo "bash .github/echo_tools/install_tools.sh | tee -a .github/echo_logs/tools.log" >> "$OUT"
          echo "bash .github/echo_permissions/set_permissions.sh | tee -a .github/echo_logs/permissions.log" >> "$OUT"
          echo "bash .github/echo_exec/os_detect.sh | tee -a .github/echo_logs/os_detect.log" >> "$OUT"
          chmod +x "$OUT"

      - name: ✅ echo_run_all.sh 내용 출력
        run: cat .github/echo_exec/echo_run_all.sh
