name: ✨ OSSF Scorecard + Echo + PLACEHOLDER 대통합 자동화

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 5'

jobs:
  echo-scorecard-setup:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: write
      pull-requests: write

    steps:
      - name: 파일 채팅
        uses: actions/checkout@v4

      - name: 환경 설정 & 일괄화 데이터
        run: |
          echo "echo '[❄ Init] Echo directory structure'" | tee -a .github/echo/init_dirs.sh

          for base in scorecard template placeholder fix; do
            for sub in logs scripts test init converted; do
              mkdir -p .github/echo_${base}/${sub}
            done
          done

          echo 'API_KEY=PLACEHOLDER' > .github/echo_template/sample.env
          echo 'TOKEN=PLACEHOLDER' > .github/echo_template/sample.cfg
          echo '{ "secret": "PLACEHOLDER" }' > .github/echo_template/sample.json

      - name: 패키지 업그레이드 & jq 설치
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq curl tar

      - name: 패키지: OSSF Scorecard tar.gz 설치
        run: |
          VERSION="4.10.3"
          FILE="scorecard_${VERSION}_linux_amd64"
          TGZ="${FILE}.tar.gz"

          mkdir -p /tmp/scorecard_install && cd /tmp/scorecard_install
          curl -sLO https://github.com/ossf/scorecard/releases/download/v${VERSION}/${TGZ}
          tar -xzf ${TGZ}

          if [ -f "${FILE}/scorecard" ]; then
            chmod +x "${FILE}/scorecard"
            sudo mv "${FILE}/scorecard" /usr/local/bin/scorecard
          else
            echo "::error ::[ERROR] Scorecard binary not found"
            ls -R ${FILE}
            exit 1
          fi

          echo "echo '[✔️ Installed] Scorecard $(scorecard --version)'" | tee -a .github/echo_scorecard/init/install_scorecard.sh

      - name: 스코얻카드 실행 & 보안 검사 기능
        run: |
          mkdir -p .github/echo_scorecard/logs
          scorecard --repo=https://github.com/${{ github.repository }} --format=json \
            | tee .github/echo_scorecard/logs/scorecard.json

          jq '.checks[] | select(.score < 5)' .github/echo_scorecard/logs/scorecard.json \
            > .github/echo_scorecard/logs/scorecard_risks.json

          jq -r '. | "- **\(.name)**: \(.reason) (_score: \(.score))"' \
            .github/echo_scorecard/logs/scorecard_risks.json > SECURITY.md

      - name: PLACEHOLDER 타겟 자동 치환
        run: |
          sed 's/PLACEHOLDER/api_key_ABC123/' .github/echo_template/sample.env > .github/echo_placeholder/converted/env_fixed.env
          sed 's/PLACEHOLDER/super_token!/' .github/echo_template/sample.cfg > .github/echo_placeholder/converted/cfg_fixed.cfg

          jq 'walk(if type=="string" and test("PLACEHOLDER") then sub("PLACEHOLDER"; "real_secret") else . end)' \
            .github/echo_template/sample.json > .github/echo_placeholder/converted/json_fixed.json

      - name: 자동 PR 생성 (위험 항목 기반)
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "포스크리티 검사 결과 기반 정보 복구 & PLACEHOLDER 치환"
          branch: scorecard/fix-placeholder-${{ github.run_id }}
          title: "[자동] Scorecard Risk Fix + PLACEHOLDER Replaced"
          body: |
            ### ✔ Scorecard Risk + PLACEHOLDER
            - 포스크리티 검사 결과 기반 SECURITY.md 수정
            - .env, .cfg, .json PLACEHOLDER 치환 완료
            - 자동 Echo 파일 변경 복구

          labels: "auto-pr,security,fix"
          draft: false
