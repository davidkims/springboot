name: 🛰️ Echo 네트워크/라우터 정보 자동화

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # 매일 0시마다 실행

jobs:
  echo-network-info:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 네트워크/라우터 정보 디렉토리 생성 (에코)
        run: |
          echo "echo 'mkdir -p .github/echo_network'" ; mkdir -p .github/echo_network

      - name: 📝 네트워크 정보 스크립트/상태 파일 생성 (에코)
        run: |
          # 네트워크 정보 수집 스크립트
          echo "echo '#!/bin/bash'" > .github/echo_network/network_info.sh
          echo "echo 'ip a > .github/echo_network/network_status.txt'" >> .github/echo_network/network_info.sh
          echo "ip a > .github/echo_network/network_status.txt" >> .github/echo_network/network_info.sh
          echo "chmod +x .github/echo_network/network_info.sh" >> .github/echo_network/network_info.sh

          # 네트워크 정보 수집 실행 및 에코
          echo "echo './.github/echo_network/network_info.sh'" ; bash .github/echo_network/network_info.sh
          echo "echo 'cat .github/echo_network/network_status.txt'" ; cat .github/echo_network/network_status.txt

      - name: 📝 라우터 정보 스크립트/상태 파일 생성 (에코)
        run: |
          # 라우터 정보 수집 스크립트
          echo "echo '#!/bin/bash'" > .github/echo_network/router_info.sh
          echo "echo 'ip route > .github/echo_network/router_status.txt'" >> .github/echo_network/router_info.sh
          echo "ip route > .github/echo_network/router_status.txt" >> .github/echo_network/router_info.sh
          echo "chmod +x .github/echo_network/router_info.sh" >> .github/echo_network/router_info.sh

          # 라우터 정보 수집 실행 및 에코
          echo "echo './.github/echo_network/router_info.sh'" ; bash .github/echo_network/router_info.sh
          echo "echo 'cat .github/echo_network/router_status.txt'" ; cat .github/echo_network/router_status.txt

      - name: 📄 생성 파일 목록 확인 (에코)
        run: |
          echo "echo 'ls -l .github/echo_network/'"
          ls -l .github/echo_network/
