name: 🗂️ 모든 Workflow YAML → DB/CLI/docker 충돌방지 + echo 자동확장+docker 파일생성+복제

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  workflow-dbify:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 디렉토리 및 로그파일/백업디렉토리 생성 (에코)
        run: |
          echo "echo 'mkdir -p .github/sql'" ; mkdir -p .github/sql
          echo "echo 'mkdir -p .github/error_logs'" ; mkdir -p .github/error_logs
          echo "echo 'mkdir -p .github/cli_test'" ; mkdir -p .github/cli_test
          echo "echo 'mkdir -p .github/cli_test_bak'" ; mkdir -p .github/cli_test_bak

          echo "echo 'touch .github/error_logs/disabled_workflows.txt'" ; touch .github/error_logs/disabled_workflows.txt
          echo "echo 'touch .github/error_logs/init_check.log'" ; touch .github/error_logs/init_check.log

      - name: 📄 requirements.txt 생성(에코)
        run: |
          echo "echo 'pyyaml' > requirements.txt"
          echo 'pyyaml' > requirements.txt

      - name: 🐳 docker_install.sh/echo_db.sql/복제 기능 포함 workflow2db.py 전체 생성 (에코)
        run: |
          # docker_install.sh 생성 (에코 + 실제 생성)
          echo "echo '#!/usr/bin/env bash' > .github/cli_test/docker_install.sh"
          echo '#!/usr/bin/env bash' > .github/cli_test/docker_install.sh
          echo "echo 'set -e' >> .github/cli_test/docker_install.sh"
          echo 'set -e' >> .github/cli_test/docker_install.sh
          echo "echo 'echo [DOCKER] 최신 설치' >> .github/cli_test/docker_install.sh"
          echo 'echo [DOCKER] 최신 설치' >> .github/cli_test/docker_install.sh
          echo "echo 'sudo apt-get remove -y docker docker-engine docker.io containerd runc || true' >> .github/cli_test/docker_install.sh"
          echo 'sudo apt-get remove -y docker docker-engine docker.io containerd runc || true' >> .github/cli_test/docker_install.sh
          echo "echo 'sudo apt-get update -y' >> .github/cli_test/docker_install.sh"
          echo 'sudo apt-get update -y' >> .github/cli_test/docker_install.sh
          echo "echo 'sudo apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release' >> .github/cli_test/docker_install.sh"
          echo 'sudo apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release' >> .github/cli_test/docker_install.sh
          echo "echo 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg' >> .github/cli_test/docker_install.sh"
          echo 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg' >> .github/cli_test/docker_install.sh
          echo "echo 'echo \"deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu \$(lsb_release -cs) stable\" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null' >> .github/cli_test/docker_install.sh"
          echo 'echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null' >> .github/cli_test/docker_install.sh
          echo "echo 'sudo apt-get update -y' >> .github/cli_test/docker_install.sh"
          echo 'sudo apt-get update -y' >> .github/cli_test/docker_install.sh
          echo "echo 'sudo apt-get install -y docker-ce docker-ce-cli containerd.io' >> .github/cli_test/docker_install.sh"
          echo 'sudo apt-get install -y docker-ce docker-ce-cli containerd.io' >> .github/cli_test/docker_install.sh
          echo "echo 'docker --version || echo \"[ERROR] docker 설치 실패 (skip)\"' >> .github/cli_test/docker_install.sh"
          echo 'docker --version || echo "[ERROR] docker 설치 실패 (skip)"' >> .github/cli_test/docker_install.sh
          chmod +x .github/cli_test/docker_install.sh

          # docker_echo_db.sql 생성 (에코 + 실제 생성)
          echo "echo '-- [docker] echo db demo' > .github/sql/docker_echo_db.sql"
          echo '-- [docker] echo db demo' > .github/sql/docker_echo_db.sql
          echo "echo 'CREATE TABLE IF NOT EXISTS docker_logs (id INTEGER PRIMARY KEY AUTOINCREMENT, msg TEXT, created_at DATETIME DEFAULT CURRENT_TIMESTAMP);' >> .github/sql/docker_echo_db.sql"
          echo 'CREATE TABLE IF NOT EXISTS docker_logs (id INTEGER PRIMARY KEY AUTOINCREMENT, msg TEXT, created_at DATETIME DEFAULT CURRENT_TIMESTAMP);' >> .github/sql/docker_echo_db.sql
          echo "echo \"INSERT INTO docker_logs (msg) VALUES ('docker echo db 생성됨!');\" >> .github/sql/docker_echo_db.sql"
          echo "INSERT INTO docker_logs (msg) VALUES ('docker echo db 생성됨!');" >> .github/sql/docker_echo_db.sql

          # workflow2db.py 전체 echo 생성 (docker 설치/DB echo 파일 생성 및 복제 포함)
          echo "import os" > workflow2db.py
          echo "import sys" >> workflow2db.py
          echo "import shutil" >> workflow2db.py
          echo "import sqlite3" >> workflow2db.py
          echo "import yaml" >> workflow2db.py
          echo "import zlib" >> workflow2db.py
          echo "from datetime import datetime" >> workflow2db.py
          echo "import binascii" >> workflow2db.py
          echo "" >> workflow2db.py
          echo "WORKFLOWS_DIR = '.github/workflows'" >> workflow2db.py
          echo "DB_PATH = '.github/workflows.db'" >> workflow2db.py
          echo "ERROR_LOG_DIR = '.github/error_logs'" >> workflow2db.py
          echo "DISABLED_FILE = os.path.join(ERROR_LOG_DIR, 'disabled_workflows.txt')" >> workflow2db.py
          echo "CLI_TEST_DIR = '.github/cli_test'" >> workflow2db.py
          echo "CLI_TEST_BAK = '.github/cli_test_bak'" >> workflow2db.py
          echo "DOCKER_INSTALL_SH = os.path.join(CLI_TEST_DIR, 'docker_install.sh')" >> workflow2db.py
          echo "DOCKER_ECHO_DB = '.github/sql/docker_echo_db.sql'" >> workflow2db.py
          echo "" >> workflow2db.py

          echo "def init_db():" >> workflow2db.py
          echo "    for d in [ERROR_LOG_DIR, CLI_TEST_DIR, CLI_TEST_BAK, os.path.dirname(DOCKER_ECHO_DB)]:" >> workflow2db.py
          echo "        if not os.path.exists(d): os.makedirs(d, exist_ok=True)" >> workflow2db.py
          echo "    if not os.path.exists(DB_PATH):" >> workflow2db.py
          echo "        conn = sqlite3.connect(DB_PATH)" >> workflow2db.py
          echo "        c = conn.cursor()" >> workflow2db.py
          echo "        c.execute('''CREATE TABLE IF NOT EXISTS workflows (id INTEGER PRIMARY KEY AUTOINCREMENT, filename TEXT, language TEXT, python_version TEXT, java_version TEXT, maven_version TEXT, cli_tools TEXT, raw_yaml TEXT)''')" >> workflow2db.py
          echo "        conn.commit()" >> workflow2db.py
          echo "        conn.close()" >> workflow2db.py
          echo "    if not os.path.exists(DISABLED_FILE):" >> workflow2db.py
          echo "        with open(DISABLED_FILE, 'w', encoding='utf-8') as f: f.write('')" >> workflow2db.py
          echo "    # docker_install.sh 생성 및 복제" >> workflow2db.py
          echo "    if not os.path.exists(DOCKER_INSTALL_SH):" >> workflow2db.py
          echo "        with open(DOCKER_INSTALL_SH,'w') as f:" >> workflow2db.py
          echo "            f.write('#!/usr/bin/env bash\\nset -e\\necho [DOCKER] 최신 설치\\nsudo apt-get remove -y docker docker-engine docker.io containerd runc || true\\nsudo apt-get update -y\\nsudo apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release\\ncurl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg\\necho \"deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu \$(lsb_release -cs) stable\" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null\\nsudo apt-get update -y\\nsudo apt-get install -y docker-ce docker-ce-cli containerd.io\\ndocker --version || echo \"[ERROR] docker 설치 실패 (skip)\"\\n')" >> workflow2db.py
          echo "        os.chmod(DOCKER_INSTALL_SH, 0o755)" >> workflow2db.py
          echo "    # docker_install.sh 백업 복제" >> workflow2db.py
          echo "    bak_path = os.path.join(CLI_TEST_BAK, 'docker_install.sh')" >> workflow2db.py
          echo "    try: shutil.copy2(DOCKER_INSTALL_SH, bak_path)" >> workflow2db.py
          echo "    except Exception as e: print('[init_db] docker_install.sh 백업 실패:', e)" >> workflow2db.py
          echo "    # docker_echo_db.sql 생성 및 복제" >> workflow2db.py
          echo "    if not os.path.exists(DOCKER_ECHO_DB):" >> workflow2db.py
          echo "        with open(DOCKER_ECHO_DB, 'w') as f:" >> workflow2db.py
          echo "            f.write('-- [docker] echo db demo\\nCREATE TABLE IF NOT EXISTS docker_logs (id INTEGER PRIMARY KEY AUTOINCREMENT, msg TEXT, created_at DATETIME DEFAULT CURRENT_TIMESTAMP);\\nINSERT INTO docker_logs (msg) VALUES (\\'docker echo db 생성됨!\\');\\n')" >> workflow2db.py
          echo "    try: shutil.copy2(DOCKER_ECHO_DB, os.path.join(CLI_TEST_BAK, 'docker_echo_db.sql'))" >> workflow2db.py
          echo "    except Exception as e: print('[init_db] docker_echo_db.sql 백업 실패:', e)" >> workflow2db.py
          echo "" >> workflow2db.py
          echo "def log_error(workflow_name, message):" >> workflow2db.py
          echo "    if not os.path.exists(ERROR_LOG_DIR): os.makedirs(ERROR_LOG_DIR, exist_ok=True)" >> workflow2db.py
          echo "    err_file = os.path.join(ERROR_LOG_DIR, workflow_name+'.log')" >> workflow2db.py
          echo "    with open(err_file, 'a', encoding='utf-8') as ef: ef.write('[{}] {}\\n'.format(datetime.now().isoformat(), message))" >> workflow2db.py
          echo "" >> workflow2db.py
          echo "def log_disable(workflow_name, reason):" >> workflow2db.py
          echo "    with open(DISABLED_FILE, 'a', encoding='utf-8') as f: f.write('{}\\t{}\\t{}\\n'.format(workflow_name, reason, datetime.now().isoformat()))" >> workflow2db.py
          echo "" >> workflow2db.py
          # 이하 기존 detect_tools_and_echo_install, etc...
          echo "if __name__ == \"__main__\":" >> workflow2db.py
          echo "    init_db()" >> workflow2db.py

      - name: 🧪 pip 설치 및 패키지 설치
        run: |
          echo "echo 'sudo apt-get update -y'" ; sudo apt-get update -y
          echo "echo 'sudo apt-get install -y python3-pip'" ; sudo apt-get install -y python3-pip
          echo "echo 'pip install --upgrade pip'" ; pip install --upgrade pip
          echo "echo 'pip install -r requirements.txt'" ; pip install -r requirements.txt

      - name: 🚀 workflow2db.py 실행(전체 자동 생성/복제 보장)
        run: |
          echo "echo '[실행] workflow2db.py (docker 설치/DB echo 파일 포함)'"
          echo '[실행] workflow2db.py (docker 설치/DB echo 파일 포함)'
          python3 workflow2db.py

      - name: 🛠️ docker_install.sh 및 DB echo 파일 실행 확인
        run: |
          echo "echo '[실행] .github/cli_test/docker_install.sh'"
          echo '[실행] .github/cli_test/docker_install.sh'
          chmod +x .github/cli_test/docker_install.sh
          .github/cli_test/docker_install.sh || true

          echo "echo '[DB] .github/sql/docker_echo_db.sql 파일 내용:'"
          echo '[DB] .github/sql/docker_echo_db.sql 파일 내용:'
          cat .github/sql/docker_echo_db.sql || true

          echo "echo '[복제본] .github/cli_test_bak/docker_install.sh'"
          echo '[복제본] .github/cli_test_bak/docker_install.sh'
          cat .github/cli_test_bak/docker_install.sh || true

          echo "echo '[복제본] .github/cli_test_bak/docker_echo_db.sql'"
          echo '[복제본] .github/cli_test_bak/docker_echo_db.sql'
          cat .github/cli_test_bak/docker_echo_db.sql || true

      - name: 📂 결과 확인 (워크플로우 DB, 로그, docker 설치/DB echo 파일, 복제)
        run: |
          echo "echo '[최종 결과] .github/workflows.db, error_logs, docker_install.sh, docker_echo_db.sql, 복제본'"
          echo '[최종 결과] .github/workflows.db, error_logs, docker_install.sh, docker_echo_db.sql, 복제본'
          ls -lh .github/workflows.db
          echo '.tables' | sqlite3 .github/workflows.db || true
          ls -l .github/cli_test/
          ls -l .github/cli_test_bak/
          ls -l .github/sql/
          echo '[로그] .github/error_logs/*, disabled_workflows.txt'
          ls -l .github/error_logs || true
          cat .github/error_logs/disabled_workflows.txt || true
