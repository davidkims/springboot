name: 🛡️ Scorecard CLI Install + Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # 매주 일요일 실행

permissions:
  contents: read

env:
  SCORECARD_VERSION: "4.10.5"
  INSTALL_DIR: "/opt/scorecard"
  OUT_DIR: .github/scorecard
  TARGET_REPO: ${{ github.repository }}

jobs:
  scorecard-job:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📁 Create install directory
        run: |
          echo "[📁] Creating install directory: $INSTALL_DIR"
          sudo mkdir -p $INSTALL_DIR
          sudo chmod -R 777 $INSTALL_DIR

      - name: 🔽 Download Scorecard binary + echo validation
        run: |
          echo "[📦] Downloading Scorecard CLI v${SCORECARD_VERSION}..."
          BINARY="scorecard_${SCORECARD_VERSION}_linux_amd64"
          URL="https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/${BINARY}"
          echo "[🌐] Download URL: $URL"
          
          curl -fsSL -o scorecard "$URL"
          
          echo "[🧪] File type check:"
          file scorecard || (echo "[❌] Download failed or invalid file"; exit 1)

          echo "[🔐] Making binary executable..."
          chmod +x scorecard

          echo "[📁] Moving to $INSTALL_DIR..."
          mv scorecard $INSTALL_DIR/
          echo "$INSTALL_DIR" >> $GITHUB_PATH

          echo "[✅] Version Check:"
          $INSTALL_DIR/scorecard --version

      - name: 📂 Prepare output directory
        run: |
          echo "[📂] Creating output directory: $OUT_DIR"
          mkdir -p $OUT_DIR

      - name: 🧪 Run Scorecard JSON Scan
        run: |
          echo "[🧪] Running JSON scan..."
          scorecard --repo=https://github.com/${TARGET_REPO} \
                    --format=json --show-details > $OUT_DIR/results.json

      - name: 📄 Convert JSON to SARIF
        run: |
          echo "[📄] Converting to SARIF format..."
          scorecard --repo=https://github.com/${TARGET_REPO} \
                    --format=sarif > $OUT_DIR/scorecard-results.sarif

      - name: 📤 Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.OUT_DIR }}/scorecard-results.sarif

      - name: 📦 Upload JSON report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-json
          path: ${{ env.OUT_DIR }}/results.json
