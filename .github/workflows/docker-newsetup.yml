name: 🏦 전체 금융기관 ALL-IN-ONE + AutoUP + SQL Echo

on:
  workflow_dispatch:
  schedule:
    - cron: '*/3 * * * *'

jobs:
  fintech-autoup-fullops:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 은행별 디렉토리 및 autoup/log/sql 디렉토리 생성
        run: |
          set -e
          BANKS="국민 우리 신한 하나 농협 기업 수협 씨티 SC제일 케이카카오토스새마을금고 우체국 ..."
          for B in $BANKS; do
            for d in \
              .github/echo/bank/$B/autoup/log \
              .github/echo/bank/$B/autoup/targets \
              .github/echo/bank/$B/db/sql \
              .github/echo/bank/$B/db/query \
              .github/echo/bank/$B/db/exec \
              .github/echo/bank/$B/db/log; do
              mkdir -p "$d"
              echo "echo '[DIR] 생성됨: $d'" >> .github/echo/autoup/log/dir_create.log
            done
          done

      - name: 🛠️ autoup 설치 및 대상 분석
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y unattended-upgrades cron
          sudo systemctl enable --now unattended-upgrades
          sudo systemctl enable --now cron
          echo "echo '[AUTOUP] apt list 분석 시작'" > .github/echo/autoup/log/autoup_analyze.log
          apt list --upgradable 2>/dev/null | tee .github/echo/autoup/install/autoup_targets_all.txt
          echo "echo '[AUTOUP] 분석 완료 및 저장됨'" >> .github/echo/autoup/log/autoup_analyze.log

          BANKS="국민 우리 신한 하나 농협 기업 수협 씨티 SC제일 케이카카오토스새마을금고 우체국 ..."
          for B in $BANKS; do
            mkdir -p .github/echo/bank/$B/autoup/log .github/echo/bank/$B/autoup/targets
            cp .github/echo/autoup/install/autoup_targets_all.txt .github/echo/bank/$B/autoup/targets/autoup_targets.txt
            echo "echo '[AUTOUP] $B 대상 저장 완료'" >> .github/echo/bank/$B/autoup/log/target_copy.log
          done

      - name: 📅 SQL 자동 테이블/쿼리/실행 echo 생성
        run: |
          set -e
          BANKS="국민 우리 신한 하나 농협 기업 수협 씨티 SC제일 케이카카오토스새마을금고 우체국 ..."
          for B in $BANKS; do
            BASE=".github/echo/bank/$B/db"
            mkdir -p "$BASE/sql" "$BASE/query" "$BASE/exec" "$BASE/log"

            echo "CREATE TABLE IF NOT EXISTS ledger (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  bank_name VARCHAR(50),\n  account_no VARCHAR(20),\n  tx_type VARCHAR(10),\n  amount DECIMAL(15,2),\n  tx_time TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n);" > "$BASE/sql/create_ledger.sql"

            echo "INSERT INTO ledger (bank_name, account_no, tx_type, amount) VALUES\n('$B', 'ACC12345678', 'DEPOSIT', 100000.00),\n('$B', 'ACC12345678', 'WITHDRAW', 50000.00);" > "$BASE/query/insert_ledger.sql"

            echo "SELECT * FROM ledger WHERE bank_name = '$B';" > "$BASE/query/select_ledger.sql"

            echo "#!/bin/bash" > "$BASE/exec/run_queries.sh"
            echo "mysql -uroot -prootpass123 test_db < $BASE/sql/create_ledger.sql | tee $BASE/log/create.log" >> "$BASE/exec/run_queries.sh"
            echo "mysql -uroot -prootpass123 test_db < $BASE/query/insert_ledger.sql | tee $BASE/log/insert.log" >> "$BASE/exec/run_queries.sh"
            echo "mysql -uroot -prootpass123 test_db < $BASE/query/select_ledger.sql | tee $BASE/log/select.log" >> "$BASE/exec/run_queries.sh"
            chmod +x "$BASE/exec/run_queries.sh"
          done

      - name: 🔁 reboot/backup/autoup 크론 echo
        run: |
          mkdir -p .github/echo/autoup/cron
          echo '0 3 * * * root /sbin/reboot' > .github/echo/autoup/cron/reboot_cron.txt
          echo '0 2 * * * root tar czf /tmp/backup_$(date +%Y%m%d_%H%M).tar.gz /etc /var/lib /home' > .github/echo/autoup/cron/backup_cron.txt
          echo '*/3 * * * * root /usr/bin/unattended-upgrade -d >> /var/log/unattended-upgrades/autoup.log 2>&1' > .github/echo/autoup/cron/autoup_cron.txt
