name: 🔐 MEGA Secure CI + AutoUP + EchoOps + Pages + Backups + Security + Middleware FullOps

on:
  workflow_dispatch:
  schedule:
    - cron: "*/1 * * * *"

permissions:
  contents: read
  pull-requests: write
  id-token: write
  security-events: write
  pages: write

jobs:
  mega-fullops:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DB_USER: root
      DB_PASS: rootpass123
      DB_NAME: sample_db
      BASE: /opt/email
      DOMAIN: example.local
      USER_COUNT: 50
      TEST_COUNT: 3
      MIDDLEWARE: "mysql postgres oracle redis kafka vault airflow spark camunda"

    steps:
    - name: 📂 Checkout Repository
      uses: actions/checkout@v4

    - name: 📁 Create All Echo Directories
      run: |
        set -e
        for dir in \
          .github/scripts \
          .github/firewall \
          .github/echo_{scorecard,codeql,logs,security,upgrade,autoup,pages,templates,backup,monitoring,services,db,permissions} \
          site/{scorecard,security,upgrade,pr,backup,logs,templates}; do
          mkdir -p "$dir"
          echo "echo '[ECHO] 디렉토리 생성: $dir'" >> .github/echo_logs/create_dirs.sh
        done
        chmod +x .github/echo_logs/create_dirs.sh
        bash .github/echo_logs/create_dirs.sh

    - name: 🛠 Install Security & DB Tools
      run: |
        set -e
        sudo apt-get update -y
        sudo apt-get install -y jq curl python3-pip unzip mysql-client postgresql-client netcat-traditional iptables docker.io
        pip install bandit pip-audit
        curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

    - name: 🐳 Pull & Start Middleware Containers
      run: |
        set -e
        for svc in $MIDDLEWARE; do
          echo "[ECHO] Pull & Start $svc"
          docker pull $svc || true
          docker run -d --name ${svc}_test $svc || true
        done
        docker ps -a

    - name: 🧪 Install Scorecard CLI
      run: |
        set -e
        VERSION="4.10.3"
        curl -sLO https://github.com/ossf/scorecard/releases/download/v${VERSION}/scorecard_${VERSION}_linux_amd64.tar.gz
        tar -xzf scorecard_${VERSION}_linux_amd64.tar.gz
        BIN=$(find scorecard_${VERSION}_linux_amd64* -type f -name scorecard | head -n1 || true)
        if [ -z "$BIN" ]; then
          echo "::error ::[ERR] Scorecard binary not found after extract."
          exit 1
        fi
        chmod +x "$BIN"
        sudo mv "$BIN" /usr/local/bin/scorecard
        scorecard --version

    - name: 📊 Run Security Scans
      run: |
        scorecard --repo=https://github.com/${{ github.repository }} --format sarif --no-upload > results.sarif
        scorecard --repo=https://github.com/${{ github.repository }} --format json --no-upload > results.json
        bandit -r . -f json > site/security/bandit.json || true
        pip-audit -f json -o site/security/pip-audit.json || true
        trivy fs . --format json --output site/security/trivy.json || true
        cp results.sarif site/scorecard/scorecard-results.sarif
        cp results.json site/security/security.json

    - name: 🧰 Run CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: javascript

    - name: 📊 Analyze with CodeQL
      uses: github/codeql-action/analyze@v3
      with:
        output: site/security/codeql-results.sarif
        category: codeql-security-scan

    - name: 💾 Database Backups
      run: |
        mysqldump -u${DB_USER} -p${DB_PASS} ${DB_NAME} > site/backup/mysqldump.sql || echo "[WARN] MySQL 백업 실패"
        pg_dump -U postgres -d ${DB_NAME} > site/backup/pgdump.sql || echo "[WARN] PostgreSQL 백업 실패"
        echo "exit" | sqlplus -S system/oracle@localhost @backup.sql > site/backup/sqlplus_backup.log || echo "[WARN] Oracle 백업 실패"

    - name: 🔥 Firewall Setup
      run: |
        echo "#!/bin/bash" > .github/firewall/setup_firewall.sh
        echo "sudo iptables -A INPUT -p tcp --dport 22 -j ACCEPT" >> .github/firewall/setup_firewall.sh
        echo "sudo iptables -A INPUT -p tcp --dport 80 -j ACCEPT" >> .github/firewall/setup_firewall.sh
        echo "sudo iptables -A INPUT -p tcp --dport 443 -j ACCEPT" >> .github/firewall/setup_firewall.sh
        chmod +x .github/firewall/setup_firewall.sh
        bash .github/firewall/setup_firewall.sh || true

    - name: 📦 Save Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: site/security/

    - name: 📈 Save Upgrade Info
      run: |
        apt list --upgradable 2>/dev/null | tee site/upgrade/upgradable.txt

    - name: 🔁 Create Auto PR for Upgrade
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if grep -q ".*" site/upgrade/upgradable.txt; then
          gh pr create --title "🔄 패키지 업그레이드 PR" \
            --body "자동 생성된 PR입니다. 참고: site/upgrade/upgradable.txt" || true
        fi

    - name: 🌐 Upload GitHub Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/

    - name: 🚀 Deploy to GitHub Pages
      uses: actions/deploy-pages@v2

    - name: ⬆️ Auto Upgrade + Echo
      run: |
        echo "#!/bin/bash" > .github/echo_autoup/autoup.sh
        echo "echo '[AUTOUP] 시스템 자동 업그레이드 시작'" >> .github/echo_autoup/autoup.sh
        echo "sudo apt-get update -y && sudo apt-get upgrade -y" >> .github/echo_autoup/autoup.sh
        echo "echo '[AUTOUP] 완료'" >> .github/echo_autoup/autoup.sh
        chmod +x .github/echo_autoup/autoup.sh
        bash .github/echo_autoup/autoup.sh

    - name: 🔁 Schedule Reboot (1 min later)
      run: |
        echo "[REBOOT] 1분 후 자동 재시작 예약됨"
        sudo shutdown -r +1 || true
