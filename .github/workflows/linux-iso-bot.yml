name: "🏦 Teradata + DW + OmniChannel EchoOps v2 (Mandatory Upgrade + TD Client + Fixed TD-SIM + RP/DW + OCI Labels)"

on:
  workflow_dispatch:
    inputs:
      generate_rows:
        description: "샘플 거래 데이터 생성 건수"
        required: true
        default: "1000"
      run_network:
        description: "Nginx 네트워크 서버 실행 (true/false)"
        required: true
        default: "true"
      run_omni:
        description: "옴니채널 서버(FastAPI) 실행 (true/false)"
        required: true
        default: "true"
      commit_changes:
        description: "에코 산출물 커밋/푸시 (true/false)"
        required: true
        default: "true"
      push_image:
        description: "옴니채널 이미지를 GHCR 푸시 (true/false)"
        required: true
        default: "false"

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ECHO_TD: .github/echo_td
      ECHO_DW: .github/echo_dw
      ECHO_NET: .github/echo_net
      ECHO_OMNI: .github/echo_omni
      ECHO_LOG: .github/echo_logs
      IMAGE_REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      OMNI_IMAGE: omni-echo
      DOCKER_NET: echo-net

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 🧰 Prepare Echo tools & dirs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${ECHO_TD}/sql/teradata" "${ECHO_TD}/sql/td_sim" \
                   "${ECHO_DW}/db" "${ECHO_DW}/queries" \
                   "${ECHO_NET}/nginx" "${ECHO_OMNI}" "${ECHO_LOG}"
          cat > .github/echo_tools.sh <<'BASH'
          set -Eeuo pipefail
          echoe(){ echo "[ECHO] $*"; }
          faile(){ echo "[ECHO][FAIL] $*" >&2; exit 1; }
          retry(){
            local tries="$1"; shift
            local sleep_sec="$1"; shift
            [ "$1" = "--" ] && shift || true
            local n=0
            until "$@"; do
              n=$((n+1))
              if [ "$n" -ge "$tries" ]; then return 1; fi
              sleep "$sleep_sec"
            done
          }
          BASH
          chmod +x .github/echo_tools.sh
          . .github/echo_tools.sh
          echoe "Echo tools ready and directories prepared"

      - name: ⬆️ Mandatory system upgrade (non-interactive)
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          echoe "apt update/upgrade start"
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y dist-upgrade
          sudo apt-get install -y sqlite3 jq python3 python3-pip docker.io
          echo "[UPGRADE][OK] $(date -Iseconds)" | tee -a "${ECHO_LOG}/upgrade.log"

      - name: 🐍 Mandatory Teradata client install (with retries, never fail job)
        shell: bash
        run: |
          set +e
          set -u
          . .github/echo_tools.sh
          python3 -m pip install --upgrade pip >/dev/null 2>&1
          LOG="${ECHO_LOG}/td_client_install.log"
          echo "[TD][INFO] teradatasql install attempt" | tee -a "$LOG"
          retry 3 3 -- python3 -m pip install teradatasql >>"$LOG" 2>&1
          RC1=$?
          echo "[TD][INFO] teradatasqlalchemy install attempt" | tee -a "$LOG"
          retry 2 3 -- python3 -m pip install teradatasqlalchemy >>"$LOG" 2>&1
          RC2=$?
          if [ "$RC1" -ne 0 ] || [ "$RC2" -ne 0 ]; then
            echo "[TD][WARN] TD client install partial/failed (rc1=${RC1}, rc2=${RC2}). Continuing." | tee -a "$LOG"
          else
            echo "[TD][OK] TD client modules installed" | tee -a "$LOG"
          fi
          exit 0

      - name: 📝 Echo:TD SQL (Teradata dialect; artifact only)
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          cat > "${ECHO_TD}/sql/teradata/001_schema.sql" <<'SQL'
          -- Teradata dialect (artifact)
          CREATE DATABASE fin_data FROM DBC;
          REPLACE VIEW fin_data.v_dim_date AS
          SELECT CAST(CURRENT_DATE AS DATE) AS as_of_date;
          REPLACE MULTISET TABLE fin_data.dim_customer, NO FALLBACK (
            customer_id BIGINT NOT NULL,
            name VARCHAR(100) CHARACTER SET LATIN NOT CASESPECIFIC,
            email VARCHAR(200),
            created_ts TIMESTAMP(0)
          ) PRIMARY INDEX (customer_id);
          REPLACE MULTISET TABLE fin_data.dim_account, NO FALLBACK (
            account_id BIGINT NOT NULL,
            customer_id BIGINT NOT NULL,
            bank_code VARCHAR(10),
            currency CHAR(3),
            opened_ts TIMESTAMP(0)
          ) PRIMARY INDEX (account_id);
          REPLACE MULTISET TABLE fin_data.fact_transaction, NO FALLBACK (
            txn_id BIGINT NOT NULL,
            account_id BIGINT NOT NULL,
            amount DECIMAL(18,2),
            txn_type VARCHAR(16),
            txn_ts TIMESTAMP(0)
          ) PRIMARY INDEX (txn_id);
          REPLACE MULTISET TABLE fin_data.echo_install_log, NO FALLBACK (
            installed_at TIMESTAMP(0),
            component VARCHAR(64),
            detail VARCHAR(4000)
          ) PRIMARY INDEX (component);
          SQL
          echoe "Wrote Teradata dialect SQL (artifact only)"

      - name: 📝 Echo:TD-SIM(Postgres) DDL/DML + DW queries
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          cat > "${ECHO_TD}/sql/td_sim/001_schema.sql" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS td;
          CREATE TABLE IF NOT EXISTS td.dim_customer(
            customer_id BIGSERIAL PRIMARY KEY,
            name        VARCHAR(100) NOT NULL,
            email       VARCHAR(200),
            created_ts  TIMESTAMP DEFAULT NOW()
          );
          CREATE TABLE IF NOT EXISTS td.dim_account(
            account_id  BIGSERIAL PRIMARY KEY,
            customer_id BIGINT NOT NULL REFERENCES td.dim_customer(customer_id),
            bank_code   VARCHAR(10),
            currency    CHAR(3) DEFAULT 'KRW',
            opened_ts   TIMESTAMP DEFAULT NOW()
          );
          CREATE TABLE IF NOT EXISTS td.fact_transaction(
            txn_id     BIGSERIAL PRIMARY KEY,
            account_id BIGINT NOT NULL REFERENCES td.dim_account(account_id),
            amount     NUMERIC(18,2) NOT NULL,
            txn_type   VARCHAR(16) CHECK (txn_type IN ('DEBIT','CREDIT')),
            txn_ts     TIMESTAMP DEFAULT NOW()
          );
          CREATE TABLE IF NOT EXISTS td.echo_install_log(
            installed_at TIMESTAMP DEFAULT NOW(),
            component    TEXT,
            detail       TEXT
          );
          SQL

          cat > "${ECHO_TD}/sql/td_sim/002_seed.sql" <<'SQL'
          INSERT INTO td.dim_customer(name,email)
          SELECT '고객'||i, 'user'||i||'@bank.local' FROM generate_series(1,10) AS s(i);
          INSERT INTO td.dim_account(customer_id, bank_code, currency)
          SELECT customer_id,
                 CASE WHEN customer_id%5=0 THEN 'NH'
                      WHEN customer_id%4=0 THEN 'KB'
                      WHEN customer_id%3=0 THEN 'WR'
                      WHEN customer_id%2=0 THEN 'HN'
                      ELSE 'SH' END,
                 'KRW'
          FROM td.dim_customer;
          SQL

          # DW queries (FastAPI에서 읽어 실행)
          cat > "${ECHO_DW}/queries/01_daily_volume.sql" <<'SQL'
          SELECT date_trunc('day', txn_ts) AS day,
                 COUNT(*) AS txn_count, SUM(amount) AS total_amount
          FROM td.fact_transaction
          GROUP BY 1 ORDER BY 1 DESC;
          SQL

          cat > "${ECHO_DW}/queries/02_top_customers.sql" <<'SQL'
          SELECT c.customer_id, c.name,
                 SUM(CASE WHEN f.txn_type='CREDIT' THEN f.amount ELSE -f.amount END) AS net_flow
          FROM td.fact_transaction f
          JOIN td.dim_account a ON a.account_id=f.account_id
          JOIN td.dim_customer c ON c.customer_id=a.customer_id
          GROUP BY 1,2 ORDER BY net_flow DESC LIMIT 20;
          SQL

          chmod 644 "${ECHO_DW}/queries/"*.sql
          echoe "Wrote Postgres TD-SIM DDL/DML and DW queries"

      - name: 🕸️ Create Docker network
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          docker network create "${DOCKER_NET}" >/dev/null 2>&1 || true
          echo "[NET][OK] docker network '${DOCKER_NET}' ready" | tee -a "${ECHO_LOG}/network.log"

      - name: 🧱 Start TD-SIM (Postgres) & load schema (with retries)
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          retry 3 3 -- docker pull postgres:16
          docker rm -f td-sim >/dev/null 2>&1 || true
          docker run -d --name td-sim \
            --network "${DOCKER_NET}" \
            -e POSTGRES_PASSWORD=postgres -p 5432:5432 \
            -v "$PWD/${ECHO_TD}/sql/td_sim":/td:ro postgres:16

          # wait for ready
          for i in $(seq 1 60); do
            if docker exec td-sim pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 2
          done

          docker exec -u postgres td-sim psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /td/001_schema.sql
          docker exec -u postgres td-sim psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /td/002_seed.sql

          COUNT="${{ github.event.inputs.generate_rows }}"
          cat > "${ECHO_TD}/sql/td_sim/003_generate_txn.sql" <<SQL
          INSERT INTO td.fact_transaction(account_id, amount, txn_type, txn_ts)
          SELECT
            (SELECT account_id FROM td.dim_account ORDER BY random() LIMIT 1),
            (random()*100000)::numeric(18,2),
            CASE WHEN random() > 0.5 THEN 'CREDIT' ELSE 'DEBIT' END,
            NOW() - (random()*interval '10 days')
          FROM generate_series(1, ${COUNT});
          INSERT INTO td.echo_install_log(component,detail)
          VALUES ('td-sim','postgres:16 with td schema, rows='|| ${COUNT}::text);
          SQL

          docker exec -u postgres td-sim psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /td/003_generate_txn.sql
          echo "[TD-SIM][OK] Loaded schema and ${COUNT} rows" | tee -a "${ECHO_LOG}/td_sim.log"

      - name: 🧩 Build & run OmniChannel (FastAPI + psycopg2 + DW endpoints)
        if: ${{ github.event.inputs.run_omni == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          # FastAPI app with DW endpoints
          cat > "${ECHO_OMNI}/app.py" <<'PY'
          import os, json
          from datetime import datetime
          from typing import List, Dict, Any
          import psycopg2
          from fastapi import FastAPI, HTTPException
          from fastapi.responses import JSONResponse

          DB_HOST = os.getenv("DB_HOST", "td-sim")
          DB_PORT = int(os.getenv("DB_PORT", "5432"))
          DB_NAME = os.getenv("DB_NAME", "postgres")
          DB_USER = os.getenv("DB_USER", "postgres")
          DB_PASS = os.getenv("DB_PASS", "postgres")
          QUERIES_DIR = os.getenv("QUERIES_DIR", "/queries")

          app = FastAPI(title="OmniChannel Echo API (DW enabled)")

          def run_sql_file(path:str) -> List[Dict[str, Any]]:
            sql_path = os.path.join(QUERIES_DIR, path)
            if not os.path.isfile(sql_path):
              raise HTTPException(status_code=404, detail=f"SQL not found: {path}")
            with open(sql_path, "r", encoding="utf-8") as f:
              sql = f.read()
            try:
              conn = psycopg2.connect(
                host=DB_HOST, port=DB_PORT, dbname=DB_NAME,
                user=DB_USER, password=DB_PASS
              )
              cur = conn.cursor()
              cur.execute(sql)
              cols = [c[0] for c in cur.description]
              rows = cur.fetchall()
              cur.close(); conn.close()
              out = []
              for r in rows:
                item = {}
                for k, v in zip(cols, r):
                  if isinstance(v, (datetime,)):
                    item[k] = v.isoformat()
                  elif hasattr(v, "quantize"):  # Decimal
                    item[k] = float(v)
                  else:
                    item[k] = v
                out.append(item)
              return out
            except Exception as e:
              raise HTTPException(status_code=500, detail=str(e))

          @app.get("/health")
          def health():
            return {"status":"ok","ts":datetime.utcnow().isoformat()}

          @app.get("/orders/{order_id}")
          def order(order_id:int):
            return {"order_id":order_id,"status":"PAID","channel":"web"}

          @app.get("/accounts/{account_id}")
          def account(account_id:int):
            return {"account_id":account_id,"balance":123456.78,"currency":"KRW"}

          @app.get("/dw/daily-volume")
          def dw_daily_volume():
            return JSONResponse(run_sql_file("01_daily_volume.sql"))

          @app.get("/dw/top-customers")
          def dw_top_customers():
            return JSONResponse(run_sql_file("02_top_customers.sql"))
          PY

          # Dockerfile with psycopg2 and base OCI labels
          cat > "${ECHO_OMNI}/Dockerfile" <<'DOCKER'
          FROM python:3.11-slim
          LABEL org.opencontainers.image.title="omni-echo" \
                org.opencontainers.image.description="OmniChannel Echo API (FastAPI) + DW endpoints" \
                org.opencontainers.image.licenses="MIT"
          RUN pip install --no-cache-dir fastapi uvicorn psycopg2-binary
          WORKDIR /app
          COPY app.py /app/app.py
          EXPOSE 8000
          ENV QUERIES_DIR=/queries \
              DB_HOST=td-sim DB_PORT=5432 DB_NAME=postgres DB_USER=postgres DB_PASS=postgres
          CMD ["uvicorn","app:app","--host","0.0.0.0","--port","8000"]
          DOCKER

          chmod 644 "${ECHO_OMNI}/app.py" "${ECHO_OMNI}/Dockerfile"

          # build with dynamic OCI labels
          retry 3 3 -- docker pull python:3.11-slim
          CREATED="$(date -Iseconds)"
          REV="${GITHUB_SHA:-${{ github.sha }}}"
          SRC="https://github.com/${{ github.repository }}"
          docker build \
            --label "org.opencontainers.image.title=${OMNI_IMAGE}" \
            --label "org.opencontainers.image.source=${SRC}" \
            --label "org.opencontainers.image.revision=${REV}" \
            --label "org.opencontainers.image.created=${CREATED}" \
            -t "${OMNI_IMAGE}:latest" "${ECHO_OMNI}"

          # run with mounted queries and shared network
          docker rm -f omni >/dev/null 2>&1 || true
          docker run -d --name omni \
            --network "${DOCKER_NET}" \
            -p 8090:8000 \
            -e DB_HOST=td-sim -e DB_PORT=5432 -e DB_NAME=postgres -e DB_USER=postgres -e DB_PASS=postgres \
            -v "$PWD/${ECHO_DW}/queries":/queries:ro \
            "${OMNI_IMAGE}:latest"

          # wait health
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8090/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "[OMNI][OK] FastAPI at :8090 (DW endpoints ready)" | tee -a "${ECHO_LOG}/omni.log"

      - name: 🌐 Run Nginx (reverse proxy:/api/* -> omni, /dw/* -> omni/dw/*, /health)
        if: ${{ github.event.inputs.run_network == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          retry 3 3 -- docker pull nginx:alpine
          cat > "${ECHO_NET}/nginx/nginx.conf" <<'CONF'
          events {}
          http {
            server {
              listen 80;
              # health
              location = /health { return 200 "OK"; add_header Content-Type text/plain; }

              # Omni API proxy (/api/*)
              location /api/ {
                proxy_pass http://omni:8000/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }

              # DW proxy (/dw/* -> FastAPI /dw/*)
              location /dw/ {
                proxy_pass http://omni:8000/dw/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }

              # default landing
              location = / { return 200 "OmniChannel Gateway (Nginx)"; add_header Content-Type text/plain; }
            }
          }
          CONF
          chmod 644 "${ECHO_NET}/nginx/nginx.conf"

          docker rm -f echo-nginx >/dev/null 2>&1 || true
          docker run -d --name echo-nginx \
            --network "${DOCKER_NET}" \
            -p 8088:80 \
            -v "$PWD/${ECHO_NET}/nginx/nginx.conf":/etc/nginx/nginx.conf:ro \
            nginx:alpine
          echo "[NET][OK] nginx listening on :8088 (/health, /api/*, /dw/*)" | tee -a "${ECHO_LOG}/network.log"

      - name: 🏷️ (Optional) Push Omni image to GHCR + PROVENANCE log
        if: ${{ github.event.inputs.push_image == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_OWNER}/${OMNI_IMAGE}:latest"
          echo "${GITHUB_TOKEN}" | docker login "${IMAGE_REGISTRY}" -u "${IMAGE_OWNER}" --password-stdin
          docker tag "${OMNI_IMAGE}:latest" "${IMAGE}"
          docker push "${IMAGE}"

          # provenance log (best-effort)
          {
            echo "IMAGE=${IMAGE}"
            echo "PUSHED_AT=$(date -Iseconds)"
            echo "SOURCE=https://github.com/${{ github.repository }}"
            echo "REVISION=${{ github.sha }}"
            echo "LABELS:"
            docker inspect "${IMAGE}" --format '{{json .Config.Labels}}' 2>/dev/null || echo "{}"
            echo "LOCAL_LABELS:"
            docker inspect "${OMNI_IMAGE}:latest" --format '{{json .Config.Labels}}' 2>/dev/null || echo "{}"
          } | tee "${ECHO_OMNI}/PROVENANCE.txt" "${ECHO_LOG}/provenance.log"

      - name: 🗃️ Echo install table (SQLite) + snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          DB="${ECHO_DW}/db/echo_install.db"
          sqlite3 "${DB}" <<SQL
          CREATE TABLE IF NOT EXISTS echo_install_log(
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            installed_at TEXT DEFAULT (datetime('now')),
            component TEXT,
            detail TEXT
          );
          INSERT INTO echo_install_log(component,detail) VALUES
            ('system','upgrade done'),
            ('td-client','pip teradatasql/teradatasqlalchemy attempted'),
            ('td-sim','postgres:16 schema+seed'),
            ('network','${{ github.event.inputs.run_network }}'),
            ('omni','${{ github.event.inputs.run_omni }}');
          SQL
          sqlite3 "${DB}" '.headers on' '.mode column' 'SELECT * FROM echo_install_log;' | tee "${ECHO_LOG}/echo_install_log.txt"
          chmod -R a+rX .github/echo_* || true
          echo "[ECHO][OK] install log recorded (sqlite)"

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-bundle
          path: |
            .github/echo_td
            .github/echo_dw
            .github/echo_net
            .github/echo_omni
            .github/echo_logs

      - name: 🧾 Commit & push (best-effort; skip if no token)
        if: ${{ github.event.inputs.commit_changes == 'true' }}
        shell: bash
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          git config user.name "echo-bot"
          git config user.email "echo-bot@users.noreply.github.com"
          git add .github/echo_td .github/echo_dw .github/echo_net .github/echo_omni .github/echo_logs || true
          if git diff --cached --quiet; then
            echoe "No changes to commit"
            exit 0
          fi
          git commit -m "EchoOps v2+: RP(/dw/*,/api/*,/health) + FastAPI(DW) + OCI labels + provenance ($(date -Iseconds))"
          if [ -n "${GH_ADMIN_TOKEN:-}" ]; then
            REPO_URL="https://${GH_ADMIN_TOKEN}@github.com/${{ github.repository }}.git"
            git push "${REPO_URL}" HEAD:${{ github.ref_name }}
            echoe "Pushed changes"
          else
            echo "[WARN] GH_ADMIN_TOKEN missing; skip push" | tee -a "${ECHO_LOG}/commit.log"
          fi
