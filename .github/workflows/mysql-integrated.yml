name: 🐬 MySQL Full Setup, Migration & Auto Backup

on:
  schedule:
    - cron: '*/1 * * * *'  # every minute
  workflow_dispatch:

jobs:
  mysql_full_pipeline:
    runs-on: ubuntu-latest

    env:
      MYSQL_IMAGE: mysql:8.0
      DB_NAME: example_db
      DB_USER: root
      DB_PASS: rootpass123
      ROOT_PASS: rootpass123
      MIGRATION_DIR: /opt/mysql/migrations
      BACKUP_DIR: /opt/backup/sql
      LEDGER_DIR: /opt/backup/ledgers

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Prepare Directories
        run: |
          echo "[+] Creating directories..."
          sudo mkdir -p "$MIGRATION_DIR" "$BACKUP_DIR" "$LEDGER_DIR"
          sudo chmod -R 777 /opt/mysql /opt/backup

      - name: 📜 Create SQL Migration File
        run: |
          echo "[+] Generating migration SQL..."
          cat <<EOF | sudo tee "$MIGRATION_DIR/migrate.sql"
          CREATE TABLE IF NOT EXISTS accounts (
              id INT AUTO_INCREMENT PRIMARY KEY,
              name VARCHAR(50),
              balance DECIMAL(12,2)
          );
          CREATE TABLE IF NOT EXISTS corporate_transactions (
              transaction_id INT AUTO_INCREMENT PRIMARY KEY,
              corporate_name VARCHAR(100) NOT NULL,
              transaction_type VARCHAR(50) NOT NULL,
              amount DECIMAL(12,2) NOT NULL,
              transaction_date DATETIME DEFAULT CURRENT_TIMESTAMP
          );
          INSERT INTO accounts(name, balance) VALUES ('홍길동', 1000000);
          INSERT INTO corporate_transactions(corporate_name, transaction_type, amount) VALUES
            ('ABC Corporation', 'Purchase', 500000),
            ('XYZ Inc.', 'Sale', 250000);
          EOF

      - name: 🧪 Upgrade All Packages
        run: |
          echo "[+] Upgrading all packages..."
          sudo apt-get update && sudo apt-get upgrade -y

      - name: 🦖 Install MySQL Server
        run: |
          echo "[+] Installing MySQL server..."
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server

      - name: 🔐 Reset Root Password in Safe Mode
        run: |
          echo "[+] Resetting root password in safe mode..."
          sudo systemctl stop mysql
          sudo mkdir -p /var/run/mysqld
          sudo chown mysql:mysql /var/run/mysqld
          sudo mysqld_safe --skip-networking --skip-grant-tables &
          sleep 10
          echo "FLUSH PRIVILEGES; ALTER USER 'root'@'localhost' IDENTIFIED BY '${{ env.ROOT_PASS }}'; FLUSH PRIVILEGES;" | sudo mysql -u root
          sudo killall mysqld
          sleep 5
          sudo systemctl start mysql

      - name: 🛠️ Configure Database and User
        run: |
          echo "[+] Configuring DB and user..."
          mysql -u root -p"$ROOT_PASS" -e "CREATE DATABASE IF NOT EXISTS $DB_NAME;"
          mysql -u root -p"$ROOT_PASS" -e "CREATE USER IF NOT EXISTS '$DB_USER'@'localhost' IDENTIFIED BY '$DB_PASS';"
          mysql -u root -p"$ROOT_PASS" -e "GRANT ALL PRIVILEGES ON $DB_NAME.* TO '$DB_USER'@'localhost'; FLUSH PRIVILEGES;"

      - name: 📅 Run Migration
        run: |
          echo "[+] Running migrations..."
          mysql -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" < "$MIGRATION_DIR/migrate.sql"

      - name: 📊 Generate Transaction Simulation SQL
        run: |
          echo "[+] Generating transaction simulation SQL..."
          echo "USE $DB_NAME;" > simulate_transactions.sql
          for i in $(seq 1 60); do
            company="SimCorp_$i"
            type=$( [ $((i % 2)) -eq 0 ] && echo "Purchase" || echo "Sale" )
            amount=$(( RANDOM % 100000 + 10000 ))
            echo "INSERT INTO corporate_transactions(corporate_name, transaction_type, amount) VALUES ('$company', '$type', $amount);" >> simulate_transactions.sql
          done
          for retry in {1..3}; do
            if mysql -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" < simulate_transactions.sql; then
              echo "[✔] Transaction simulation succeeded"
              break
            else
              echo "[!] Transaction simulation failed on attempt $retry"
              sleep 2
            fi
            if [ $retry -eq 3 ]; then
              echo "[x] Simulation failed after 3 attempts"
              exit 1
            fi
          done

      - name: 📃 Export Ledger to CSV
        run: |
          echo "[+] Exporting ledger..."
          echo "transaction_id,corporate_name,transaction_type,amount,transaction_date" > "$LEDGER_DIR/ledger.csv"
          mysql -u "$DB_USER" -p"$DB_PASS" -D "$DB_NAME" -B -e "SELECT * FROM corporate_transactions;" | tail -n +2 >> "$LEDGER_DIR/ledger.csv"
          gzip -f "$LEDGER_DIR/ledger.csv"

      - name: 📊 Backup MySQL with Compression
        run: |
          echo "[+] Backing up MySQL DB..."
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BACKUP_FILE="$BACKUP_DIR/backup-$TIMESTAMP.sql"
          mysqldump "$DB_NAME" > "$BACKUP_FILE"
          gzip -f "$BACKUP_FILE"

      - name: 🔍 Upload Ledger & Backup
        uses: actions/upload-artifact@v4
        with:
          name: mysql-ledger-and-backup
          path: |
            ${{ env.LEDGER_DIR }}/*.gz
            ${{ env.BACKUP_DIR }}/*.gz

      - name: 📄 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.LEDGER_DIR }}
