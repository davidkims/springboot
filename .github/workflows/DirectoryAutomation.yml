name: DB CLI Remake Automation (배치형 리메이크 & robust 재설치/재생성)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  db-cli-remake-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DBCLI_DIR: .github/dbcli
      OUTPUT_DIR: .github/dbcli/output
      VA_DIR: .github/dbcli/virtual_accounts
      ORDER_DIR: .github/dbcli/orders
      USER_DIR: .github/dbcli/users
      TMP_SAFE_DIR: /tmp/dbcli_safe_tmp
      DB2_CLI_URL: "https://public.dhe.ibm.com/ibmdl/export/pub/software/data/db2/drivers/odbc_cli/linuxx64_odbc_cli.tar.gz"
      DB2_CLI_DIR: /opt/ibm/db2_cli
      MIN_FREE_MB: 500

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ 필수 도구 사전 설치 (확장적)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tree jq curl wget lsb-release || true

      - name: ♻️ [리메이크] DB CLI 디렉토리/파일/echo/패키지 robust 재설치 재생성 (상주 배치)
        run: |
          set -e
          # === Function Definitions ===
          MIN_FREE_MB=${MIN_FREE_MB:-500}
          check_free() {
            DIR="$1"
            MB=$(df -Pm "$DIR" | awk 'NR==2 {print $4}')
            if [ "$MB" -lt "$MIN_FREE_MB" ]; then
              echo "[❗][용량] $DIR 디스크 여유 $MB MB → $MIN_FREE_MB MB 이상 필요, 10초 후 재시도"
              df -h "$DIR"
              sleep 10
              return 1
            else
              echo "[✅][용량] $DIR 여유 $MB MB"
              return 0
            fi
          }
          robust_rmdir() {
            DIR="$1"
            if [ -d "$DIR" ]; then
              echo "[🧹][리메이크] $DIR 디렉토리 완전 삭제"
              rm -rf "$DIR" || { find "$DIR" -type f -delete; find "$DIR" -type d | tac | xargs -I {} rmdir {} 2>/dev/null; }
            fi
          }
          robust_mkdir() {
            TARGET="$1"
            robust_rmdir "$TARGET"
            while true; do
              check_free "$TARGET" || continue
              mkdir -p "$TARGET" && chmod 700 "$TARGET" && echo "[✅][∞][리메이크] $TARGET 생성 성공" && break
              echo "[⚠️][∞][리메이크] $TARGET 생성 실패 (재시도)"
              sleep 1
            done
          }
          robust_echo() {
            CONTENT="$1"
            TARGET="$2"
            DIR=$(dirname "$TARGET")
            robust_mkdir "$DIR"
            [ -f "$TARGET" ] && rm -f "$TARGET"
            while true; do
              check_free "$DIR" || continue
              echo "$CONTENT" > "$TARGET" && chmod 600 "$TARGET" && echo "[✅][∞][리메이크] $TARGET 파일 생성 성공" && break
              echo "[⚠️][∞][리메이크] $TARGET 파일 생성 실패 (재시도)"
              sleep 1
            done
          }
          robust_touch() {
            FILE="$1"
            DIR=$(dirname "$FILE")
            robust_mkdir "$DIR"
            [ -f "$FILE" ] && rm -f "$FILE"
            while true; do
              check_free "$DIR" || continue
              touch "$FILE" && chmod 600 "$FILE" && echo "[✅][∞][리메이크] $FILE 빈파일 생성 성공" && break
              echo "[⚠️][∞][리메이크] $FILE 빈파일 생성 실패 (재시도)"
              sleep 1
            done
          }

          # === 리메이크: 완전 새로 DB 디렉토리/파일/echo 생성 ===
          for DB in mysql mariadb postgresql sqlite redis clickhouse firebird db2; do
            robust_mkdir "$DBCLI_DIR/$DB"
          done
          robust_mkdir "$OUTPUT_DIR"
          robust_mkdir "$VA_DIR"
          robust_mkdir "$TMP_SAFE_DIR"
          robust_mkdir "$ORDER_DIR"
          robust_mkdir "$USER_DIR"

          # === 샘플 SQL, 더미 DB robust echo (기존 파일 삭제 후 재생성) ===
          robust_echo "SELECT VERSION();"        $DBCLI_DIR/mysql/demo.sql
          robust_echo "SELECT VERSION();"        $DBCLI_DIR/mariadb/demo.sql
          robust_echo "SELECT version();"        $DBCLI_DIR/postgresql/demo.sql
          robust_echo "SELECT sqlite_version();" $DBCLI_DIR/sqlite/demo.sql
          robust_echo "PING"                     $DBCLI_DIR/redis/demo.redis
          echo "INFO" >> $DBCLI_DIR/redis/demo.redis; chmod 600 $DBCLI_DIR/redis/demo.redis
          robust_echo "SELECT version();"        $DBCLI_DIR/clickhouse/demo.sql
          robust_echo "SELECT * FROM RDB\$DATABASE;" $DBCLI_DIR/firebird/demo.sql
          robust_echo "SELECT service_level, fixpack_num FROM sysibmadm.env_inst_info;" $DBCLI_DIR/db2/demo.sql

          for DB in mysql mariadb postgresql sqlite clickhouse firebird db2; do
            robust_echo "-- dummy database for $DB" "$DBCLI_DIR/$DB/dummy_db.sql"
            robust_touch "$DBCLI_DIR/$DB/dummy.db"
          done

          # === output 더미 robust 재생성 ===
          for DB in mysql mariadb postgresql sqlite redis clickhouse firebird db2; do
            robust_echo "[dummy output]" "$OUTPUT_DIR/${DB}_dummy.out"
          done

          # === 사용자 정보, 가상계좌 등 robust 재생성 ===
          robust_echo "user_id,user_name,permission,enabled" "$USER_DIR/users.csv"
          robust_echo "U001,홍길동,ADMIN,1" "$USER_DIR/users.csv"
          robust_echo "U002,김철수,USER,1" "$USER_DIR/users.csv"
          robust_echo "U003,이영희,USER,0" "$USER_DIR/users.csv"

          echo "[🧹][∞][리메이크] 기존 가상계좌 파일 전체 삭제"
          rm -f $VA_DIR/virtual_accounts_*.txt
          TS=$(date '+%Y%m%d_%H%M%S')
          VA_FILE="$TMP_SAFE_DIR/virtual_accounts_${TS}_$$.txt"
          robust_echo "account_id,account_number,customer_name,bank_code,open_date" "$VA_FILE"
          for i in $(seq 1 10000); do
            ACC_NUM="7000$(printf '%07d' $i)"
            CUST="User$(printf '%05d' $i)"
            BANK="B$(printf '%04d' $((1000 + ($i % 9000))))"
            DATE="$(date '+%Y-%m-%d')"
            echo "VA${i},${ACC_NUM},${CUST},${BANK},${DATE}" >> "$VA_FILE"
          done
          chmod 600 "$VA_FILE"
          mv "$VA_FILE" "$VA_DIR/"
          echo "[✅][∞][리메이크] $VA_FILE → $VA_DIR 이동 및 권한 최소화"
          ls -lh $VA_DIR/virtual_accounts_*.txt
          rm -rf $TMP_SAFE_DIR

      - name: ♻️ [리메이크] DB CLI 패키지 robust 재설치/강제 설치 (상주 배치 패턴)
        run: |
          set -e
          MIN_FREE_MB=${MIN_FREE_MB:-500}
          check_free() {
            DIR="$1"
            MB=$(df -Pm "$DIR" | awk 'NR==2 {print $4}')
            if [ "$MB" -lt "$MIN_FREE_MB" ]; then
              echo "[❗][용량] $DIR 디스크 여유 $MB MB → $MIN_FREE_MB MB 이상 필요, 10초 후 재시도"
              df -h "$DIR"
              sleep 10
              return 1
            else
              echo "[✅][용량] $DIR 여유 $MB MB"
              return 0
            fi
          }
          is_service_pkg() {
            case "$1" in
              mysql-client|mariadb-client|postgresql-client|redis-tools|clickhouse-client|firebird-utils) return 0 ;;
              *) return 1 ;;
            esac
          }
          robust_install_remake() {
            PKG="$1"
            CMD="$2"
            DESC="$3"
            echo "[♻️][리메이크] $PKG ($DESC) 완전 재설치 시작"
            # 무조건 재설치
            sudo apt-get remove -y "$PKG" || true
            sudo apt-get purge -y "$PKG" || true
            sudo apt-get update -y
            while true; do
              check_free "/" || continue
              sudo apt-get install -y --reinstall "$PKG" && command -v "$CMD" && echo "[✅][∞][리메이크] $PKG ($DESC) 재설치 성공"
              if command -v "$CMD" > /dev/null; then
                if is_service_pkg "$PKG"; then
                  echo "[🔄][∞][리메이크] $PKG 재설치 후 systemctl daemon-reload"
                  sudo systemctl daemon-reload && echo "[✅][∞][리메이크] systemctl daemon-reload 성공" || echo "[❗][∞][리메이크] systemctl daemon-reload 실패"
                fi
                break
              fi
              echo "[⚠️][∞][리메이크] $PKG ($DESC) 재설치 실패 (재시도)"
              sleep 1
            done
          }
          robust_install_remake "mysql-client"     "mysql"         "MySQL"
          robust_install_remake "mariadb-client"   "mariadb"       "MariaDB"
          robust_install_remake "postgresql-client" "psql"         "PostgreSQL"
          robust_install_remake "sqlite3"          "sqlite3"       "SQLite"
          robust_install_remake "redis-tools"      "redis-cli"     "Redis"
          robust_install_remake "clickhouse-client" "clickhouse-client" "ClickHouse"
          robust_install_remake "firebird-utils"   "isql-fb"       "Firebird"
          # IBM DB2 CLI는 아래와 같이 항상 덮어쓰기 방식 리메이크
          DB2_CLI_URL="${DB2_CLI_URL:-https://public.dhe.ibm.com/ibmdl/export/pub/software/data/db2/drivers/odbc_cli/linuxx64_odbc_cli.tar.gz}"
          DB2_CLI_DIR="${DB2_CLI_DIR:-/opt/ibm/db2_cli}"
          sudo rm -rf "$DB2_CLI_DIR"
          mkdir -p "$DB2_CLI_DIR"
          echo "[♻️][리메이크] IBM DB2 CLI 드라이버 항상 최신화 재설치"
          curl -LfsS "$DB2_CLI_URL" -o /tmp/db2cli.tar.gz
          tar -xzf /tmp/db2cli.tar.gz -C "$DB2_CLI_DIR" --strip-components=1
          chmod +x $DB2_CLI_DIR/clidriver/bin/db2cli
          export PATH="$PATH:$DB2_CLI_DIR/clidriver/bin"
          rm -f /tmp/db2cli.tar.gz
          which db2cli && db2cli validate -version || echo "[info] DB2 CLI 리메이크(재설치) 완료"
