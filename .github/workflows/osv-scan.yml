name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '34 20 * * 2'
  push:
    branches: [ "main" ]

permissions:
  security-events: write
  contents: read

jobs:
  osv-scan:
    name: 🛡️ Run OSV-Scanner with Fallback and Retry
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Install dependencies
        run: |
          echo "[+] Installing tools: jq, curl, unzip, git, gh"
          sudo apt-get update -y
          sudo apt-get install -y jq curl unzip git gh

      - name: 🧪 Download and Run OSV Scanner
        run: |
          echo "[🧪] Starting OSV Scanner download with retry and fallback..."

          PRIMARY_URL="https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_amd64_linux.tar.gz"
          MIRROR_URL="https://mirror.example.com/osv-scanner_amd64_linux.tar.gz"  # <--- 실제 미러 URL로 교체하세요

          for attempt in {1..3}; do
            echo "[🌐] Attempt $attempt: Downloading from primary URL..."
            if curl -sSL --fail "$PRIMARY_URL" -o osv-scanner.tar.gz; then
              echo "[✔] Download succeeded from primary URL"
              break
            else
              echo "[!] Primary download failed on attempt $attempt"
              if [ $attempt -eq 3 ]; then
                echo "[⚠] Trying fallback mirror URL..."
                if curl -sSL --fail "$MIRROR_URL" -o osv-scanner.tar.gz; then
                  echo "[✔] Fallback download succeeded"
                  break
                else
                  echo "[❌] Fallback download failed. Exiting."
                  exit 1
                fi
              fi
              sleep 2
            fi
          done

          echo "[📦] Extracting osv-scanner..."
          tar -xzf osv-scanner.tar.gz
          chmod +x osv-scanner

          echo "[🚀] Running osv-scanner..."
          ./osv-scanner -r --skip-git ./ | tee osv-results.txt

      - name: 📁 Convert to SARIF
        run: |
          echo "[📄] Converting to SARIF format..."
          ./osv-scanner -r --skip-git ./ --format sarif > osv-results.sarif
          echo "[✔] SARIF generated at osv-results.sarif"
          head -n 15 osv-results.sarif

      - name: 📤 Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
