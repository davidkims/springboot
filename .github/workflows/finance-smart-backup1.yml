name: "email-servers-ULTRA-integrated-echo-only-with-monitoring-v6"

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Base domain for virtual accounts"
        required: false
        default: "example.local"
      user_count:
        description: "Number of virtual accounts per service"
        required: false
        default: "50"
      test_count:
        description: "Number of test emails per server"
        required: false
        default: "3"
      mta_choice:
        description: "apt로 설치할 단일 MTA (none|postfix|exim4|opensmtpd)"
        required: false
        default: "none"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE: /opt/email
      DOMAIN: ${{ github.event.inputs.domain || 'example.local' }}
      USER_COUNT: ${{ github.event.inputs.user_count || '50' }}
      TEST_COUNT: ${{ github.event.inputs.test_count || '3' }}
      SERVICES: "postfix exim4 opensmtpd mailhog maildev mailcatcher smtp-sink"
      MTA_CHOICE: ${{ github.event.inputs.mta_choice || 'none' }}
      MONO: .monitoring
      INF_BUCKET: metrics
      INF_ORG: org
      INF_USER: admin
      INF_PASS: "admin1234!"
      INF_TOKEN: "dev-token-123456"

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📁 Prepare dirs (services+bulk) & export absolute paths
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo mkdir -p "$BASE"; sudo chown -R "$USER:$USER" "$BASE"
          mkdir -p "$BASE"/{policies,reports,artifacts,global,tools,tmp}
          mkdir -p "${MONO}"/{influxdb,telegraf,graphite,victoriametrics,otel,statsd,scripts,python}
          for SVC in $SERVICES; do
            for d in bin config logs pid run spool queue tmp data certs keys users inbox outbox archive scripts env acl docs policies backups reports firewall permissions artifacts; do
              mkdir -p "$BASE/$SVC/$d"
            done
            for i in $(seq -w 0001 1000); do
              mkdir -p "$BASE/$SVC/bulk/dir_$i"
            done
          done
          chmod -R 755 "$BASE"
          {
            echo "export BASE_ABS=$BASE"
            echo "export MONO=${MONO}"
            echo "export MONO_ABS=$(pwd)/${MONO}"
          } > "$GITHUB_WORKSPACE/.env_abs"

      - name: 📦 Base packages (no MTA conflicts) + Docker networks
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates apt-transport-https software-properties-common \
            curl wget git build-essential jq \
            ruby-full libsqlite3-dev apache2-utils openssl \
            swaks nginx clamav clamav-daemon
          sudo apt-get install -y --only-upgrade docker.io containerd || true
          sudo systemctl is-active --quiet docker || sudo systemctl start docker || true
          sudo systemctl enable --now nginx || true
          docker network create emailnet >/dev/null 2>&1 || true
          docker network create monnet   >/dev/null 2>&1 || true

      - name: 🧯 Install single MTA via apt (avoid mail-transport-agent conflicts)
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$MTA_CHOICE" in
            postfix)   sudo apt-get install -y postfix bsd-mailx ;;
            exim4)     sudo apt-get install -y exim4 exim4-daemon-light ;;
            opensmtpd) sudo apt-get install -y opensmtpd ;;
            none|"")   echo "[INFO] Skip apt MTA install." ;;
            *)         echo "[WARN] Unknown MTA_CHOICE=$MTA_CHOICE; skipping." ;;
          esac
          sudo systemctl stop postfix 2>/dev/null || true
          sudo systemctl stop exim4 2>/dev/null || true
          sudo systemctl stop opensmtpd 2>/dev/null || true
          sudo systemctl disable postfix exim4 opensmtpd 2>/dev/null || true

      - name: 📄 Echo global README / SECURITY / ACL / firewall templates
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$BASE/policies"
          : > "$BASE/README.txt"; {
            echo "This CI workspace provisions email servers for testing."
            echo "MTAs are installed (optional) but not started."
            echo "Containers: MailHog, MailDev, MailCatcher, smtp-sink."
            echo "Monitoring: InfluxDB2 + Telegraf."
          } >> "$BASE/README.txt"
          : > "$BASE/policies/SECURITY.md"; {
            echo "# Security (Test Only)"
            echo "- Do not store real credentials."
            echo "- Virtual users are generated per run."
            echo "- Outputs: users.csv, users.htpasswd (bcrypt), users.json."
          } >> "$BASE/policies/SECURITY.md"
          for SVC in $SERVICES; do
            d="$BASE/$SVC"
            mkdir -p "$d/firewall" "$d/permissions"
            f="$d/firewall/policy.conf"; : > "$f"; {
              echo "# Echo-only firewall policy for $SVC"
              echo "allow_tcp=1025,2025,3025,2525,8025,2080,3080"
              echo "deny_all_else=true"
            } >> "$f"
            p="$d/permissions/acl.txt"; : > "$p"; {
              echo "# ACL template for $SVC"
              echo "user:ci:rw"
              echo "user:scanner:r"
            } >> "$p"
            chmod 640 "$f" "$p"
          done

      - name: 👥 Generate virtual users (CSV/JSON/htpasswd) per service
        shell: bash
        run: |
          set -Eeuo pipefail
          USERS_CSV="$BASE/global/users.csv"
          USERS_JSON="$BASE/global/users.json"
          HTPASS="$BASE/global/users.htpasswd"
          : > "$USERS_CSV"; echo "svc,username,email,password" >> "$USERS_CSV"
          : > "$USERS_JSON"; echo "[" >> "$USERS_JSON"
          : > "$HTPASS"
          idx=0
          for SVC in $SERVICES; do
            for i in $(seq 1 $USER_COUNT); do
              u="user${i}"
              e="${u}@${DOMAIN}"
              pass="$(openssl rand -base64 18 | tr -d '\n=/' | cut -c1-16)"
              echo "${SVC},${u},${e},${pass}" >> "$USERS_CSV"
              if [ $idx -gt 0 ]; then echo "," >> "$USERS_JSON"; fi
              printf '  {"svc":"%s","username":"%s","email":"%s","password":"%s"}' "$SVC" "$u" "$e" "$pass" >> "$USERS_JSON"
              htpasswd -bB "$HTPASS" "$e" "$pass" >/dev/null
              idx=$((idx+1))
            done
          done
          echo "" >> "$USERS_JSON"; echo "]" >> "$USERS_JSON"
          chmod 640 "$USERS_CSV" "$USERS_JSON" "$HTPASS"

      - name: 🛠️ Echo configs for Monitoring (InfluxDB/Telegraf)
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$GITHUB_WORKSPACE/.env_abs"
          cfg="$MONO/influxdb/influxdb.conf"; : > "$cfg"; {
            echo 'reporting-disabled = true'
            echo 'bolt-path = "/var/lib/influxdb2/influxd.bolt"'
            echo 'engine-path = "/var/lib/influxdb2/engine"'
            echo 'http-bind-address = ":8086"'
          } >> "$cfg"
          tcfg="$MONO/telegraf/telegraf.conf"; : > "$tcfg"; {
            echo '[agent]'; echo '  interval = "10s"'; echo '  round_interval = true'
            echo ''
            echo '[[outputs.influxdb_v2]]'
            echo '  urls = ["http://influxdb:8086"]'
            echo '  token = "${INFLUX_TOKEN}"'
            echo '  organization = "${INFLUX_ORG}"'
            echo '  bucket = "${INFLUX_BUCKET}"'
            echo ''
            echo '[[inputs.cpu]]'; echo '  percpu = true'; echo '  totalcpu = true'
            echo '[[inputs.mem]]'
            echo '[[inputs.disk]]'; echo '  ignore_fs = ["tmpfs","devtmpfs","overlay"]'
            echo '[[inputs.net]]'
          } >> "$tcfg"

      - name: 🚀 Launch InfluxDB2 + Telegraf (absolute bind mounts)
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$GITHUB_WORKSPACE/.env_abs"
          docker rm -f influxdb telegraf >/dev/null 2>&1 || true
          docker run -d --name influxdb --network monnet \
            -p 8086:8086 \
            --mount type=bind,src="${MONO_ABS}/influxdb/influxdb.conf",dst=/etc/influxdb2/config.yml,ro \
            -e DOCKER_INFLUXDB_INIT_MODE=setup \
            -e DOCKER_INFLUXDB_INIT_USERNAME="${INF_USER}" \
            -e DOCKER_INFLUXDB_INIT_PASSWORD="${INF_PASS}" \
            -e DOCKER_INFLUXDB_INIT_ORG="${INF_ORG}" \
            -e DOCKER_INFLUXDB_INIT_BUCKET="${INF_BUCKET}" \
            -e DOCKER_INFLUXDB_INIT_ADMIN_TOKEN="${INF_TOKEN}" \
            influxdb:2.7
          sleep 8
          docker run -d --name telegraf --network monnet \
            --mount type=bind,src="${MONO_ABS}/telegraf/telegraf.conf",dst=/etc/telegraf/telegraf.conf,ro \
            -e INFLUX_TOKEN="${INF_TOKEN}" -e INFLUX_ORG="${INF_ORG}" -e INFLUX_BUCKET="${INF_BUCKET}" \
            telegraf:1.28

      - name: 📦 Launch SMTP test servers (MailHog/MailDev/MailCatcher + smtp-sink)
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$GITHUB_WORKSPACE/.env_abs"
          docker rm -f mailhog maildev mailcatcher smtp-sink >/dev/null 2>&1 || true

          # MailHog (SMTP 1025, UI 8025)
          docker run -d --name mailhog --network emailnet \
            -p 1025:1025 -p 8025:8025 mailhog/mailhog

          # MailDev (SMTP 2025, UI 2080)
          docker run -d --name maildev --network emailnet \
            -p 2025:1025 -p 2080:1080 maildev/maildev

          # MailCatcher (SMTP 3025, UI 3080)
          docker run -d --name mailcatcher --network emailnet \
            -p 3025:1025 -p 3080:1080 sj26/mailcatcher

          # smtp-sink: Postfix 이미지의 smtp-sink 바이너리 사용 (포트 2525, 수신 메일 저장)
          mkdir -p "$BASE/smtp-sink/data"
          docker run -d --name smtp-sink --network emailnet \
            -p 2525:2525 \
            --mount type=bind,src="${BASE}/smtp-sink/data",dst=/var/spool/mail \
            --entrypoint /usr/lib/postfix/sbin/smtp-sink \
            instrumentisto/postfix:latest \
            -d "%d.%H.%M.%S" 0.0.0.0:2525 /var/spool/mail/mail-%s.eml

      - name: 🔐 Nginx BasicAuth + security headers (echo-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$GITHUB_WORKSPACE/.env_abs"
          WEB_USER="admin"
          WEB_PASS="$(openssl rand -base64 18 | tr -d '\n=/' | cut -c1-16)"
          mkdir -p "$BASE/global"
          : > "$BASE/global/web-auth.env"; { echo "WEB_USER=$WEB_USER"; echo "WEB_PASS=$WEB_PASS"; } >> "$BASE/global/web-auth.env"
          htpasswd -bBc "$BASE/global/web.htpasswd" "$WEB_USER" "$WEB_PASS"

          sudo mkdir -p /etc/nginx/snippets /etc/nginx/sites-available /etc/nginx/sites-enabled
          tmp_hdr="$(mktemp)"; : > "$tmp_hdr"; {
            echo 'add_header X-Content-Type-Options "nosniff" always;'
            echo 'add_header X-Frame-Options "SAMEORIGIN" always;'
            echo 'add_header Referrer-Policy "no-referrer-when-downgrade" always;'
            echo 'add_header X-XSS-Protection "1; mode=block" always;'
            echo 'add_header Content-Security-Policy "default-src '\''self'\'' '\''unsafe-inline'\''; img-src data: *; connect-src *;" always;'
          } >> "$tmp_hdr"
          sudo mv "$tmp_hdr" /etc/nginx/snippets/security-headers.conf

          tmp_site="$(mktemp)"; : > "$tmp_site"; {
            echo 'server {'
            echo '  listen 9001;  auth_basic "Restricted";'
            echo "  auth_basic_user_file $BASE/global/web.htpasswd;"
            echo '  location /mailhog { proxy_pass http://127.0.0.1:8025/; include /etc/nginx/snippets/security-headers.conf; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }'
            echo '  location /maildev { proxy_pass http://127.0.0.1:2080/; include /etc/nginx/snippets/security-headers.conf; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }'
            echo '  location /mailcatcher { proxy_pass http://127.0.0.1:3080/; include /etc/nginx/snippets/security-headers.conf; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }'
            echo '}'
          } >> "$tmp_site"
          sudo mv "$tmp_site" /etc/nginx/sites-available/email-proxy.conf
          sudo ln -sf /etc/nginx/sites-available/email-proxy.conf /etc/nginx/sites-enabled/email-proxy.conf
          sudo nginx -t
          sudo systemctl reload nginx
          echo "[INFO] Nginx UI: http://localhost:9001/{mailhog|maildev|mailcatcher} (user:$WEB_USER pass:$WEB_PASS)"

      - name: 🛡️ ClamAV DB 업데이트 + 대량 테스트 스캔 (nounset-safe, echo-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          tmpc="$(mktemp)"; : > "$tmpc"
          echo "DatabaseMirror database.clamav.net"          >> "$tmpc"
          echo "DNSDatabaseInfo current.cvd.clamav.net"      >> "$tmpc"
          echo "UpdateLogFile /var/log/clamav/freshclam.log" >> "$tmpc"
          echo "NotifyClamd /etc/clamav/clamd.conf"          >> "$tmpc"
          echo "ScriptedUpdates yes"                         >> "$tmpc"
          echo "CompressLocalDatabase no"                    >> "$tmpc"
          sudo mv "$tmpc" /etc/clamav/freshclam.conf
          sudo chown root:root /etc/clamav/freshclam.conf
          sudo chmod 644 /etc/clamav/freshclam.conf
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam || true

          eicar='X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*'
          mkdir -p "$BASE/tmp"; printf '%s\n' "$eicar" > "$BASE/tmp/EICAR.txt"
          for SVC in $SERVICES; do
            mkdir -p "$BASE/$SVC/tmp"
            for i in 1 2 3 4 5; do printf '%s\n' "$eicar" > "$BASE/$SVC/tmp/EICAR_${SVC}_$i.txt"; done
          done
          clamscan -r --no-summary "$BASE" > "$BASE/reports/clamav_scan.txt" 2>&1 || true
          chmod 644 "$BASE/reports/clamav_scan.txt" || true

      - name: ✉️ Massive send tests with swaks (to all servers)
        shell: bash
        run: |
          set -Eeuo pipefail
          SENDER="sender@${DOMAIN}"
          declare -A TARGETS
          TARGETS[mailhog]=127.0.0.1:1025
          TARGETS[maildev]=127.0.0.1:2025
          TARGETS[mailcatcher]=127.0.0.1:3025
          TARGETS[smtp-sink]=127.0.0.1:2525
          for SVC in "${!TARGETS[@]}"; do
            hostport="${TARGETS[$SVC]}"
            for n in $(seq 1 $TEST_COUNT); do
              RCVR="rcpt${n}@${DOMAIN}"
              swaks --to "$RCVR" --from "$SENDER" --server "${hostport%:*}" --port "${hostport#*:}" \
                --timeout 10 --data "Subject: CI $SVC test $n\n\nHello from CI $SVC\n" \
                >> "$BASE/reports/send_${SVC}.log" 2>&1 || true
            done
          done

      - name: 📦 Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: email-ci-artifacts
          path: |
            /opt/email/reports/*
            /opt/email/global/*
            /opt/email/*/firewall/policy.conf
            /opt/email/*/permissions/acl.txt
            /opt/email/smtp-sink/data/*
