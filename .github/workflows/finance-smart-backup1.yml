name: "🔒 Integrated Blacklist (1-min · keyless-safe · DC fallback · echo · no-missing-files)"

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: blacklist-integrated
  cancel-in-progress: true

env:
  # Base dirs
  BLACKLIST_DIR: .github/blacklist
  REPORT_DIR: .github/blacklist/report
  EXPORT_DIR: .github/blacklist/export
  SNAPSHOT_DIR: .github/blacklist/snapshots
  ARCHIVE_DIR: .github/blacklist/archive
  LATEST_DIR: .github/blacklist/latest
  NET_DIR: .github/blacklist/networks
  PKG_DIR: .github/blacklist/packages
  CODE_DIR: .github/blacklist/code
  SUMMARY_DIR: .github/blacklist/summary

  # Toggles (all free)
  ENABLE_SPAMHAUS: "true"
  ENABLE_EMERGING_THREATS: "true"
  ENABLE_PY_AUDIT: "auto"
  ENABLE_NPM_AUDIT: "auto"
  ENABLE_SEMGREP: "true"

  # Dependency-Check (installed to RUNNER_TEMP; NO KEY REQUIRED)
  DC_VERSION: "9.2.0"
  # DC_HOME / DC_DATA are set at runtime from RUNNER_TEMP

  # Optional secret (will be used automatically if present)
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🧭 Init (time/temp/env)
        id: init
        shell: bash
        run: |
          set -euo pipefail
          RUN_DATE_UTC="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "RUN_DATE_UTC=${RUN_DATE_UTC}" >> "$GITHUB_ENV"
          echo "LOGFILE=.github/blacklist/logs/run_${RUN_DATE_UTC}.log" >> "$GITHUB_ENV"
          # Install path & data path in user temp (no sudo, cache-safe)
          echo "DC_HOME=${RUNNER_TEMP}/dependency-check" >> "$GITHUB_ENV"
          echo "DC_DATA=${RUNNER_TEMP}/dc-data" >> "$GITHUB_ENV"
          echo "SNAP_DIR=.github/blacklist/snapshots/${RUN_DATE_UTC}" >> "$GITHUB_ENV"
          echo "[ECHO] ▶ Start @ ${RUN_DATE_UTC}"
          echo "[ECHO] RUNNER_TEMP=${RUNNER_TEMP}"

      - name: 🧰 Ensure base packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends curl unzip jq git python3-pip ca-certificates rsync
          if ! command -v node >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends nodejs npm
          fi
          python3 -m pip install --user --upgrade pip pip-audit || true
          python3 -m pip install --user semgrep || true
          echo "[ECHO] Base tools ready"

      - name: 📁 Create directories & placeholders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "$BLACKLIST_DIR"/{raw,dist,logs} \
            "$REPORT_DIR" \
            "$EXPORT_DIR"/{json,txt,csv,html} \
            "$SNAPSHOT_DIR" "$ARCHIVE_DIR" "$LATEST_DIR" \
            "$NET_DIR"/{spamhaus,et,all} \
            "$PKG_DIR"/{python,npm,dc} \
            "$CODE_DIR"/semgrep \
            "$SUMMARY_DIR" \
            "$SNAP_DIR"/{networks,packages,code,summary,logs}
          # Placeholders so later steps never fail
          : > "$NET_DIR/all/ip_blacklist_spamhaus.txt"
          : > "$NET_DIR/all/ip_blacklist_et.txt"
          echo "{}" > "$PKG_DIR/dc/dc_report.json"
          echo "<html><body>no report</body></html>" > "$PKG_DIR/dc/dc_report.html"
          echo "{}" > "$CODE_DIR/semgrep/semgrep.json"
          echo "{}" > "$PKG_DIR/npm/npm_audit.json"
          echo "{}" > "$PKG_DIR/python/pip_audit.json"
          touch "$EXPORT_DIR/.gitkeep" "$EXPORT_DIR/json/.gitkeep" "$EXPORT_DIR/html/.gitkeep" "$EXPORT_DIR/csv/.gitkeep" "$EXPORT_DIR/txt/.gitkeep"
          echo "[ECHO] Dirs & placeholders ready" | tee -a "$LOGFILE"

      - name: 💾 Cache DC data (in RUNNER_TEMP)
        uses: actions/cache@v4
        with:
          path: ${{ env.DC_DATA }}
          key: dc-data-${{ env.DC_VERSION }}-${{ runner.os }}
          restore-keys: dc-data-${{ env.DC_VERSION }}-

      - name: 🛠 Install OWASP Dependency-Check (to RUNNER_TEMP)
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] DC install start v${DC_VERSION}" | tee -a "$LOGFILE"
          rm -rf "${DC_HOME}" || true
          mkdir -p "${DC_HOME}" "${DC_DATA}"
          cd "${RUNNER_TEMP}"
          curl -sSL -o dc.zip "https://github.com/jeremylong/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip" || true
          if unzip -q dc.zip -d "${RUNNER_TEMP}"; then
            CANDIDATE="$(find "${RUNNER_TEMP}" -maxdepth 1 -type d -name 'dependency-check*' | head -n1 || true)"
            if [ -n "$CANDIDATE" ]; then
              mv "$CANDIDATE" "${DC_HOME}"
              chmod +x "${DC_HOME}/bin/dependency-check.sh" || true
              echo "DC_READY=true" >> "$GITHUB_ENV"
              echo "[ECHO] DC installed at ${DC_HOME}" | tee -a "$LOGFILE"
            else
              echo "DC_READY=false" >> "$GITHUB_ENV"
              echo "[WARN] DC folder not found; placeholder mode" | tee -a "$LOGFILE"
            fi
          else
            echo "DC_READY=false" >> "$GITHUB_ENV"
            echo "[WARN] DC unzip failed; placeholder mode" | tee -a "$LOGFILE"
          fi
          rm -f dc.zip || true

      - name: 🌐 Fetch Spamhaus (quiet, always file)
        if: env.ENABLE_SPAMHAUS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] Spamhaus fetch start" | tee -a "$LOGFILE"
          : > "$BLACKLIST_DIR/raw/spamhaus_drop.txt"
          : > "$BLACKLIST_DIR/raw/spamhaus_edrop.txt"
          # quiet to console; write to files
          curl -fsSL https://www.spamhaus.org/drop/drop.txt  | grep -v '^;' | tee "$BLACKLIST_DIR/raw/spamhaus_drop.txt"   >/dev/null || true
          curl -fsSL https://www.spamhaus.org/drop/edrop.txt | grep -v '^;' | tee "$BLACKLIST_DIR/raw/spamhaus_edrop.txt" >/dev/null || true
          cat "$BLACKLIST_DIR/raw/"spamhaus_*.txt 2>/dev/null | sort -u | tee "$BLACKLIST_DIR/dist/ip_blacklist_spamhaus.txt" >/dev/null || echo -n > "$BLACKLIST_DIR/dist/ip_blacklist_spamhaus.txt"
          cp -f "$BLACKLIST_DIR/dist/ip_blacklist_spamhaus.txt" "$NET_DIR/all/ip_blacklist_spamhaus.txt" || true
          echo "[ECHO] Spamhaus IP count: $(wc -l < "$NET_DIR/all/ip_blacklist_spamhaus.txt" 2>/dev/null || echo 0)" | tee -a "$LOGFILE"
          echo "[ECHO] Spamhaus fetch done" | tee -a "$LOGFILE"

      - name: 🌐 Fetch EmergingThreats (quiet, always file)
        if: env.ENABLE_EMERGING_THREATS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] ET fetch start" | tee -a "$LOGFILE"
          : > "$BLACKLIST_DIR/raw/et_compromised_ips.txt"
          curl -fsSL https://rules.emergingthreats.net/blockrules/compromised-ips.txt \
            | grep -E '^[0-9]+\.[0-9]+' | sort -u \
            | tee "$BLACKLIST_DIR/dist/ip_blacklist_et.txt" >/dev/null || echo -n > "$BLACKLIST_DIR/dist/ip_blacklist_et.txt"
          cp -f "$BLACKLIST_DIR/dist/ip_blacklist_et.txt" "$NET_DIR/all/ip_blacklist_et.txt" || true
          echo "[ECHO] ET IP count: $(wc -l < "$NET_DIR/all/ip_blacklist_et.txt" 2>/dev/null || echo 0)" | tee -a "$LOGFILE"
          echo "[ECHO] ET fetch done" | tee -a "$LOGFILE"

      - name: 🐍 pip-audit (optional)
        if: env.ENABLE_PY_AUDIT != 'false'
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] pip-audit start" | tee -a "$LOGFILE"
          if ls requirements*.txt pyproject.toml setup.cfg setup.py 2>/dev/null | grep -q .; then
            (python3 -m pip_audit -f json || true) | tee "$PKG_DIR/python/pip_audit.json" >/dev/null
          else
            echo "{}" > "$PKG_DIR/python/pip_audit.json"
            echo "[ECHO] No Python lockfiles; skip" | tee -a "$LOGFILE"
          fi

      - name: 📦 npm audit (optional)
        if: env.ENABLE_NPM_AUDIT != 'false'
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] npm audit start" | tee -a "$LOGFILE"
          if ls package-lock.json yarn.lock pnpm-lock.yaml 2>/dev/null | grep -q .; then
            (npm audit --json || true) | tee "$PKG_DIR/npm/npm_audit.json" >/dev/null
          else
            echo "{}" > "$PKG_DIR/npm/npm_audit.json"
            echo "[ECHO] No JS lockfiles; skip" | tee -a "$LOGFILE"
          fi

      - name: 🔍 Semgrep (optional)
        if: env.ENABLE_SEMGREP == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] Semgrep start" | tee -a "$LOGFILE"
          semgrep --version || true
          (semgrep ci --dry-run --config p/ci -o "$CODE_DIR/semgrep/semgrep.json" || semgrep --config p/ci -o "$CODE_DIR/semgrep/semgrep.json" || echo "{}" > "$CODE_DIR/semgrep/semgrep.json") 2>>"$LOGFILE"
          echo "[ECHO] Semgrep done" | tee -a "$LOGFILE"

      - name: 🧪 Dependency-Check (keyless-safe with fallback)
        shell: bash
        env:
          DC_READY: ${{ env.DC_HOME }}
        run: |
          set -euo pipefail
          echo "[ECHO] DC execution start" | tee -a "$LOGFILE"
          mkdir -p "$PKG_DIR/dc" "$EXPORT_DIR/json" "$EXPORT_DIR/html"
          # helper: write placeholders
          write_placeholders() {
            echo "{}" > "$PKG_DIR/dc/dc_report.json"
            echo "<html><body>no report</body></html>" > "$PKG_DIR/dc/dc_report.html"
            cp -f "$PKG_DIR/dc/dc_report.json" "$EXPORT_DIR/json/dc_report.json" || true
            cp -f "$PKG_DIR/dc/dc_report.html" "$EXPORT_DIR/html/dc_report.html" || true
          }
          if [ ! -x "${DC_HOME}/bin/dependency-check.sh" ]; then
            echo "[WARN] DC not installed; using placeholders" | tee -a "$LOGFILE"
            write_placeholders
          else
            # Try with API key if present
            set +e
            CMD=("${DC_HOME}/bin/dependency-check.sh" \
              --project "BlacklistScan" \
              --scan . \
              -f JSON -f HTML \
              --out "$PKG_DIR/dc" \
              --data "$DC_DATA" \
              --failOnCVSS 0)
            if [ -n "${NVD_API_KEY:-}" ]; then
              CMD+=("--nvdApiKey" "${NVD_API_KEY}")
            fi
            "${CMD[@]}" 1>>"$LOGFILE" 2>>"$LOGFILE"
            EC=$?
            if [ $EC -ne 0 ]; then
              echo "[WARN] DC online run failed (ec=$EC). Trying --noupdate..." | tee -a "$LOGFILE"
              "${DC_HOME}/bin/dependency-check.sh" \
                --project "BlacklistScan" \
                --scan . \
                -f JSON -f HTML \
                --out "$PKG_DIR/dc" \
                --data "$DC_DATA" \
                --noupdate \
                --failOnCVSS 0 1>>"$LOGFILE" 2>>"$LOGFILE"
              EC=$?
            fi
            set -e
            # Normalize or placeholders
            if [ -f "$PKG_DIR/dc/dependency-check-report.json" ]; then
              mv -f "$PKG_DIR/dc/dependency-check-report.json" "$PKG_DIR/dc/dc_report.json"
            fi
            if [ -f "$PKG_DIR/dc/dependency-check-report.html" ]; then
              mv -f "$PKG_DIR/dc/dependency-check-report.html" "$PKG_DIR/dc/dc_report.html"
            fi
            [ -s "$PKG_DIR/dc/dc_report.json" ] || [ -s "$PKG_DIR/dc/dc_report.html" ] || write_placeholders
            cp -f "$PKG_DIR/dc/dc_report.json" "$EXPORT_DIR/json/dc_report.json" || true
            cp -f "$PKG_DIR/dc/dc_report.html" "$EXPORT_DIR/html/dc_report.html" || true
          fi
          echo "[ECHO] DC execution finished" | tee -a "$LOGFILE"

      - name: 🧾 Summary generation
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] Summary generation" | tee -a "$LOGFILE"
          SUMMARY_JSON="$SUMMARY_DIR/summary_${RUN_DATE_UTC}.json"
          SUMMARY_MD="$SUMMARY_DIR/summary_${RUN_DATE_UTC}.md"
          # JSON
          {
            echo "{"
            echo "  \"run_at_utc\": \"${RUN_DATE_UTC}\","
            echo "  \"spamhaus_count\": $(wc -l < "$NET_DIR/all/ip_blacklist_spamhaus.txt" 2>/dev/null || echo 0),"
            echo "  \"et_count\": $(wc -l < "$NET_DIR/all/ip_blacklist_et.txt" 2>/dev/null || echo 0),"
            echo "  \"files\": {"
            while IFS= read -r -d '' f; do
              sz=$(wc -c < "$f" 2>/dev/null || echo 0)
              bn="${f#./}"
              echo "    \"${bn}\": ${sz},"
            done < <(find "$EXPORT_DIR" "$PKG_DIR/dc" -type f -print0 2>/dev/null)
            echo "    \"_end\": 0"
            echo "  }"
            echo "}"
          } > "$SUMMARY_JSON"
          # MD
          {
            echo "# Blacklist Summary (${RUN_DATE_UTC})"
            echo ""
            echo "- Spamhaus: $(wc -l < "$NET_DIR/all/ip_blacklist_spamhaus.txt" 2>/dev/null || echo 0) IPs"
            echo "- EmergingThreats: $(wc -l < "$NET_DIR/all/ip_blacklist_et.txt" 2>/dev/null || echo 0) IPs"
            echo ""
            echo "## Files (bytes)"
            while IFS= read -r -d '' f; do
              sz=$(wc -c < "$f" 2>/dev/null || echo 0)
              echo "- ${f#./}: $sz"
            done < <(find "$EXPORT_DIR" "$PKG_DIR/dc" -type f -print0 2>/dev/null)
          } > "$SUMMARY_MD"
          # Console short list
          echo "[ECHO] ===== Result files ====="
          while IFS= read -r -d '' f; do
            sz=$(wc -c < "$f" 2>/dev/null || echo 0)
            echo "[ECHO] file: ${f#./}, size(bytes): ${sz}"
          done < <(find "$EXPORT_DIR" "$PKG_DIR/dc" -type f -print0 2>/dev/null)
          echo "[ECHO] ========================"
          echo "[ECHO] Summary created → $SUMMARY_JSON, $SUMMARY_MD" | tee -a "$LOGFILE"

      - name: 🗂 Snapshot & latest sync
        shell: bash
        run: |
          set -e
          echo "[ECHO] Snapshot & latest sync" | tee -a "$LOGFILE"
          mkdir -p "$SNAP_DIR/summary" "$SNAP_DIR/packages/dc" "$SNAP_DIR/networks" "$SNAP_DIR/code/semgrep"
          rsync -a "$EXPORT_DIR"/ "$SNAP_DIR/summary/" --exclude '.gitkeep' || true
          rsync -a "$PKG_DIR/dc/" "$SNAP_DIR/packages/dc/" --exclude '.gitkeep' || true
          rsync -a "$NET_DIR/all/" "$SNAP_DIR/networks/" --exclude '.gitkeep' || true
          rsync -a "$CODE_DIR/semgrep/" "$SNAP_DIR/code/semgrep/" --exclude '.gitkeep' || true
          mkdir -p "$LATEST_DIR"
          rsync -a --delete "$EXPORT_DIR"/ "$LATEST_DIR/" --exclude '.gitkeep' || true

      - name: 📝 Commit & push (if changed)
        shell: bash
        run: |
          set -e
          echo "[ECHO] Commit & push (if changed)" | tee -a "$LOGFILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$BLACKLIST_DIR" || true
          if ! git diff --cached --quiet; then
            git fetch --unshallow || true
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git commit -m "chore(blacklist): update outputs @ ${RUN_DATE_UTC}"
            git push || git push --force-with-lease
            echo "[ECHO] Pushed updates" | tee -a "$LOGFILE"
          else
            echo "[ECHO] No changes to commit" | tee -a "$LOGFILE"
          fi
