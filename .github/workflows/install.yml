name: 🏢 MEGA DB Echo FullOps + Install + Eco + Execute Unified

on:
  workflow_dispatch:
    inputs:
      COUNT:
        description: "Number of tables/users (default: 100)"
        required: false
        default: "100"
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  mega-echo:
    runs-on: ubuntu-latest
    env:
      COUNT: ${{ github.event.inputs.COUNT || '100' }}

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 Prepare Directories and Root Password SQL
        run: |
          mkdir -p .github/echo_db/{preinit,echo_mysql,permissions,firewall,logs,run_scripts,backup,sarif,stats,grants,results,upgrade,elk,kafka,dwh,bteq,sqlite,postgres,accounts,passwords,install_notes,echo_table,echo_sql,echo_user,echo_grant,echo_drop,echo_alter,echo_truncate,echo_analyze}
          echo "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpass123'; FLUSH PRIVILEGES;" > .github/echo_db/preinit/mysql_root_password.sql

      - name: 🛠️ Install MySQL and Set Root Password
        run: |
          sudo apt-get update -y && sudo apt-get upgrade -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server sqlite3 postgresql-client net-tools ufw
          sudo sed -i 's/^bind-address.*/bind-address = 0.0.0.0/' /etc/mysql/mysql.conf.d/mysqld.cnf || true
          sudo systemctl restart mysql || sudo service mysql restart
          sudo mysql -e "$(cat .github/echo_db/preinit/mysql_root_password.sql)"

      - name: 💾 Setup MySQL Auth Config File
        run: |
          echo '[client]' > .github/echo_db/echo_mysql/my.cnf
          echo 'user=root' >> .github/echo_db/echo_mysql/my.cnf
          echo 'password=rootpass123' >> .github/echo_db/echo_mysql/my.cnf
          echo 'host=127.0.0.1' >> .github/echo_db/echo_mysql/my.cnf
          echo 'protocol=TCP' >> .github/echo_db/echo_mysql/my.cnf

      - name: 🔐 MySQL Root Permissions Echo
        run: |
          echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf -e \"SHOW GRANTS FOR 'root'@'localhost';\" | tee .github/echo_db/permissions/root_grants.txt" > .github/echo_db/permissions/mysql_grants_check.sh
          chmod +x .github/echo_db/permissions/mysql_grants_check.sh
          bash .github/echo_db/permissions/mysql_grants_check.sh

      - name: 🚧 Firewall and Network Checks
        run: |
          echo "sudo ufw status verbose" > .github/echo_db/firewall/check.sh
          echo "sudo netstat -tuln | grep 3306" >> .github/echo_db/firewall/check.sh
          chmod +x .github/echo_db/firewall/check.sh
          bash .github/echo_db/firewall/check.sh | tee .github/echo_db/firewall/status.log

      - name: 🛏️ Generate Tables, Users, SQL
        run: |
          for i in $(seq 1 $COUNT); do
            T="mega_table_$i"
            U="user_$i"
            PW="pw_$i"
            echo "CREATE TABLE IF NOT EXISTS $T (id INT PRIMARY KEY AUTO_INCREMENT, value VARCHAR(255));" > .github/echo_db/echo_table/$T.sql
            echo "INSERT INTO $T (value) VALUES ('sample_data_$i');" > .github/echo_db/echo_sql/insert_$T.sql
            echo "SELECT * FROM $T;" > .github/echo_db/echo_sql/select_$T.sql
            echo "CREATE USER IF NOT EXISTS '$U'@'%' IDENTIFIED BY '$PW';" > .github/echo_db/echo_user/$U.sql
            echo "GRANT SELECT, INSERT ON $T TO '$U'@'%';" > .github/echo_db/echo_grant/grant_$U.sql
            echo "SHOW GRANTS FOR '$U'@'%';" > .github/echo_db/grants/grants_$U.sql
            echo "DROP TABLE IF EXISTS $T;" > .github/echo_db/echo_drop/drop_$T.sql
            echo "ALTER TABLE $T ADD COLUMN created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP;" > .github/echo_db/echo_alter/alter_$T.sql
            echo "TRUNCATE TABLE $T;" > .github/echo_db/echo_truncate/trunc_$T.sql
            echo "ANALYZE TABLE $T;" > .github/echo_db/echo_analyze/analyze_$T.sql
          done

      - name: 📃 Generate SQL Execution Scripts
        run: |
          for kind in table sql user grant drop alter truncate analyze; do
            echo "#!/bin/bash" > .github/echo_db/run_scripts/init_${kind}.sh
            chmod +x .github/echo_db/run_scripts/init_${kind}.sh
          done
          for i in $(seq 1 $COUNT); do
            T="mega_table_$i"
            U="user_$i"
            for kind in table sql user grant drop alter truncate analyze; do
              fpath=".github/echo_db/echo_${kind}/${kind}_${T}.sql"
              [ -f "$fpath" ] && echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf test_db < $fpath || echo '[WARN] Failed: $fpath'" >> .github/echo_db/run_scripts/init_${kind}.sh
            done
            echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf -e \"$(cat .github/echo_db/grants/grants_$U.sql)\" | tee .github/echo_db/results/grants_$U.log" >> .github/echo_db/run_scripts/init_grant.sh
          done

      - name: 📁 Backup, Stats, SARIF
        run: |
          mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf -e "SHOW TABLES IN test_db;" | tee .github/echo_db/stats/show_tables.log || echo '[WARN] show tables failed'
          mysqldump --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf test_db > .github/echo_db/backup/mysql_backup.sql || echo '[WARN] mysqldump failed'
          echo '{ "version": "2.1.0", "runs": [{ "tool": { "driver": { "name": "mockql" } }, "results": [{ "message": { "text": "SQL execution success" } }] }] }' > .github/echo_db/sarif/mock_result.sarif

      - name: 🚀 GitHub Pages Upload
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .github/echo_db
          publish_branch: gh-pages

      - name: ☁️ AWS S3 Upload (Optional)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'ap-northeast-2'
        run: |
          aws s3 cp --recursive .github/echo_db/backup/ s3://your-bucket-name/echo_db/backup/ || echo '[WARN] S3 upload failed'

      - name: 🧠 Echo System Notes for Kafka/ELK
        run: |
          echo "Kafka/ELK/Spark/Airflow/BTEQ: install via Docker or manual." > .github/echo_db/install_notes/tools_notes.txt

      - name: 📄 Final Dump
        run: |
          find .github/echo_db -type f | sort | while read f; do
            echo "--- $f"
            cat "$f" || echo "(read failed)"
          done
