name: 📦 Build Python Package & Report

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 📁 Create required directories
        run: |
          echo "[📁] Creating directories..."
          mkdir -p build logs dist site
          echo "[✅] Directories ready."

      - name: 📦 Install extended Python packages
        run: |
          echo "[📦] Installing Python tools..."
          python -m pip install --upgrade pip

          pip install build setuptools wheel twine
          pip install flake8 black isort mypy pylint bandit
          pip install pytest pytest-cov hypothesis
          pip install sphinx myst-parser sphinx-autobuild furo
          pip install pandas numpy matplotlib scipy
          pip install fastapi flask httpx requests uvicorn
          pip install safety pip-audit
          pip install types-requests types-PyYAML types-setuptools

          echo "[✅] All packages installed."

      - name: ⚙️ Auto-generate requirements.txt
        run: |
          if [ ! -f requirements.txt ]; then
            echo "[⚙️] Creating requirements.txt..."
            echo "pandas" > requirements.txt
            echo "fastapi" >> requirements.txt
            echo "uvicorn" >> requirements.txt
            echo "pytest" >> requirements.txt
            echo "[✅] requirements.txt generated."
          else
            echo "[✅] requirements.txt exists. Skipping."
          fi

      - name: ⚙️ Generate pyproject.toml/setup.py if missing
        run: |
          echo "[⚙️] Checking for build metadata..."
          if [ ! -f pyproject.toml ] && [ ! -f setup.py ]; then
            echo "[⚠️] Creating fallback pyproject.toml..."
            echo "[build-system]" > pyproject.toml
            echo "requires = [\"setuptools\", \"wheel\"]" >> pyproject.toml
            echo "build-backend = \"setuptools.build_meta\"" >> pyproject.toml
            echo "" >> pyproject.toml
            echo "[project]" >> pyproject.toml
            echo "name = \"demo-package\"" >> pyproject.toml
            echo "version = \"0.0.1\"" >> pyproject.toml
            echo "description = \"Fallback build project\"" >> pyproject.toml
            echo "authors = [{name = \"GitHub Actions\"}]" >> pyproject.toml
            echo "" >> pyproject.toml
            echo "[tool.setuptools.packages.find]" >> pyproject.toml
            echo "include = [\"finance_app*\"]" >> pyproject.toml
            echo "exclude = [\"tests*\", \"logs*\", \"migrations*\", \"setup_guides*\", \"workflow_docs*\"]" >> pyproject.toml
            echo "[✅] pyproject.toml generated."

            echo "[⚙️] Creating fallback setup.py..."
            echo "from setuptools import setup, find_packages" > setup.py
            echo "setup(name='demo-package', version='0.0.1', packages=find_packages(include=['finance_app*']))" >> setup.py
            echo "[✅] setup.py generated."
          else
            echo "[✅] pyproject.toml/setup.py already exist."
          fi

      - name: 🧾 Generate PyPI Trusted Publisher Info
        run: |
          echo "[📜] Writing PyPI publisher info..."
          mkdir -p .github site
          FILE=.github/pypi-publisher-info.txt
          echo "🔐 PyPI Trusted Publisher Info" > $FILE
          echo "" >> $FILE
          echo "📌 Repository Owner: davidkims" >> $FILE
          echo "📌 Repository Name : springboot" >> $FILE
          echo "📌 Workflow File   : .github/workflows/python-publish.yml" >> $FILE
          echo "📌 Environment     : pypi" >> $FILE
          echo "📌 Workflow Ref    : davidkims/springboot/.github/workflows/python-publish.yml@refs/heads/main" >> $FILE
          echo "" >> $FILE
          echo "✅ Use above values in PyPI Trusted Publisher settings." >> $FILE
          cp $FILE site/
          echo "[✅] Publisher info copied to site/"

      - name: 🔒 Save pip freeze lock
        run: |
          echo "[🔒] Saving pip freeze snapshot..."
          pip freeze > logs/requirements.lock.txt
          cp logs/requirements.lock.txt site/
          echo "[✅] Freeze lock saved."

      - name: 🔐 Run pip-audit and save report
        run: |
          echo "[🔍] Running pip-audit..."
          pip-audit -f markdown -o site/pip-audit-report.md || echo "[⚠️] Vulnerabilities found"
          echo "[✅] pip-audit complete."

      - name: 🧪 Run Tests
        run: |
          echo "[🧪] Running tests..."
          if [ -d "tests" ]; then
            pytest tests | tee logs/test.log
            cp logs/test.log site/
            echo "[✅] Tests done."
          else
            echo "[⚠️] No tests directory. Skipping."
          fi

      - name: 🧹 Run Lint & Type Checks
        run: |
          echo "[🧹] Running lint/type checks..."
          flake8 . || echo "[⚠️] flake8 warnings"
          black . --check || echo "[⚠️] black format issues"
          isort . --check-only || echo "[⚠️] isort order issues"
          mypy . || echo "[⚠️] mypy type warnings"
          echo "[✅] Lint complete."

      - name: 🏗️ Build Distributions
        run: |
          echo "[🏗️] Building package..."
          python -m build
          echo "[✅] dist/:"
          ls -lh dist/

      - name: 📦 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: 🌍 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
        continue-on-error: true
