name: 🚀 999999% 완전체 TS 자동보완/홈페이지/네트워크/권한/보안/에코/복구/로깅/디렉토리 자동화

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  full-autofill:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Git Checkout
        uses: actions/checkout@v4

      - name: 🛡️ 필수/확장/예외/백업 디렉토리 전체 생성 & 에코 로깅 (최상위 안전)
        run: |
          set -e
          DIRS=(
            ".github/ts_doc_autofill"
            ".github/ts_doc_autofill/logs"
            ".github/ts_doc_autofill/echo"
            ".github/ts_doc_autofill/sample_docs"
            ".github/echo_permission"
            ".github/echo_network"
            ".github/echo_upload"
            ".github/echo_upgrade"
            ".github/echo_homepage"
            ".github/echo_security"
            ".github/echo_recovery"
            ".github/echo_backup"
            ".github/echo_tmp"
            "site/uploads"
            "site/logs"
            "site/public"
            "site/tmp"
          )
          for d in "${DIRS[@]}"; do
            mkdir -p "$d"
          done
          # 에코파일+백업파일/복구파일 동시생성
          for d in "${DIRS[@]}"; do
            bname=$(basename "$d")
            echo "echo 'mkdir -p $d'" > ".github/ts_doc_autofill/echo/mkdir_${bname}.txt"
            echo "[BACKUP][$(date +%F_%T)] $d" > ".github/echo_backup/backup_${bname}_$(date +%Y%m%d_%H%M%S).txt"
            echo "[RECOVERY][$(date +%F_%T)] $d" > ".github/echo_recovery/recover_${bname}_$(date +%Y%m%d_%H%M%S).txt"
          done
          echo "echo '전체 디렉토리/에코/업로드/백업/복구/임시/홈페이지 준비 완료'" | tee .github/ts_doc_autofill/echo/ready.txt

      - name: 📝 자동보안/권한/네트워크/복구/임시 에코 및 예외허용 (에러 없는 방식)
        run: |
          set -e
          # 권한/보안
          echo "whoami > .github/echo_permission/whoami.txt" > .github/echo_permission/whoami.sh
          whoami > .github/echo_permission/whoami.txt
          echo "id > .github/echo_permission/id.txt" > .github/echo_permission/id.sh
          id > .github/echo_permission/id.txt
          echo "ls -l /etc/sudoers > .github/echo_permission/sudoers.txt" > .github/echo_permission/sudoers.sh
          ls -l /etc/sudoers > .github/echo_permission/sudoers.txt || echo "[WARN] sudoers 접근 불가" > .github/echo_permission/sudoers.txt
          echo "sudo -l > .github/echo_permission/sudo_l.txt" > .github/echo_permission/sudo_l.sh
          sudo -l > .github/echo_permission/sudo_l.txt || echo "[WARN] sudo -l 불가" > .github/echo_permission/sudo_l.txt
          echo "getent group sudo > .github/echo_permission/sudo_group.txt" > .github/echo_permission/sudo_group.sh
          getent group sudo > .github/echo_permission/sudo_group.txt || echo "[WARN] sudo group 불가" > .github/echo_permission/sudo_group.txt
          echo "cat /etc/passwd > .github/echo_security/passwd.txt" > .github/echo_security/passwd.sh
          cat /etc/passwd > .github/echo_security/passwd.txt
          echo "cat /etc/shadow | grep runner > .github/echo_security/shadow_runner.txt" > .github/echo_security/shadow_runner.sh
          sudo cat /etc/shadow | grep runner > .github/echo_security/shadow_runner.txt || echo "[WARN] shadow 접근 불가" > .github/echo_security/shadow_runner.txt
          # 네트워크
          echo "ip a > .github/echo_network/ip_a.txt" > .github/echo_network/ip_a.sh
          ip a > .github/echo_network/ip_a.txt
          echo "route -n > .github/echo_network/route_n.txt" > .github/echo_network/route_n.sh
          route -n > .github/echo_network/route_n.txt
          echo "ss -tulpn > .github/echo_network/ss_tulpn.txt" > .github/echo_network/ss_tulpn.sh
          ss -tulpn > .github/echo_network/ss_tulpn.txt || netstat -tulpn > .github/echo_network/ss_tulpn.txt || true
          echo "cat /etc/hosts > .github/echo_network/hosts.txt" > .github/echo_network/hosts.sh
          cat /etc/hosts > .github/echo_network/hosts.txt
          echo "cat /etc/resolv.conf > .github/echo_network/resolv.txt" > .github/echo_network/resolv.sh
          cat /etc/resolv.conf > .github/echo_network/resolv.txt
          # 복구/임시
          echo "echo '[RECOVERY] 시스템 복구 에코'" > .github/echo_recovery/recover.sh
          echo "[임시파일] $(date)" > .github/echo_tmp/tmp_$(date +%Y%m%d_%H%M%S).txt
          # 업로드/홈페이지
          echo "echo 'UPLOAD_PATH=site/uploads'" > .github/echo_upload/upload_path.sh
          echo "UPLOAD_PATH=site/uploads" > .github/echo_upload/upload_path.txt
          echo "echo '홈페이지 업로드 테스트 에코'" > .github/echo_upload/upload_test.sh
          echo "업로드 테스트입니다." > .github/echo_upload/upload_test.txt
          echo "<html><body><h1>업로드 홈페이지 자동화 샘플</h1></body></html>" > site/uploads/index.html
          echo "echo '<html>...</html>' > site/uploads/index.html" > .github/echo_upload/index_html.sh

      - name: ⚡ 시스템 패키지 업데이트/업그레이드 및 복구/로깅
        run: |
          set -e
          echo "echo 'sudo apt-get update -y && sudo apt-get upgrade -y'" > .github/echo_upgrade/apt_upgrade.sh
          sudo apt-get update -y | tee .github/echo_upgrade/apt_update.log || echo "[ERROR] update 실패" >> .github/echo_upgrade/apt_update.log
          sudo apt-get upgrade -y | tee .github/echo_upgrade/apt_upgrade.log || echo "[ERROR] upgrade 실패" >> .github/echo_upgrade/apt_upgrade.log

      - name: 🗄️ 설정/tsconfig.json 생성 및 복구 에코
        run: |
          cat <<EOF | tee tsconfig.json
          {
            "compilerOptions": {
              "target": "ES6",
              "module": "commonjs",
              "outDir": "dist",
              "esModuleInterop": true
            }
          }
          EOF
          echo "echo 'tsconfig.json 생성'" > .github/ts_doc_autofill/echo/tsconfig.txt
          echo "[BACKUP] tsconfig.json" > .github/echo_backup/backup_tsconfig_$(date +%Y%m%d_%H%M%S).txt

      - name: 📝 자동보완 서버코드 자동생성/복구/백업 (echo)
        run: |
          cat <<'EOF' | tee .github/ts_doc_autofill/autofill-server.ts
          import express, { Request, Response } from 'express';
          import fs from 'fs';
          import path from 'path';
          import bodyParser from 'body-parser';

          const app = express();
          const PORT = process.env.PORT || 3070;

          app.use(bodyParser.json({ limit: '5mb' }));

          function ensureDirectoriesAndEchoFiles() {
            const dirs = [
              '.github/ts_doc_autofill',
              '.github/ts_doc_autofill/logs',
              '.github/ts_doc_autofill/echo',
              '.github/ts_doc_autofill/sample_docs',
            ];
            dirs.forEach((d) => {
              if (!fs.existsSync(d)) {
                fs.mkdirSync(d, { recursive: true });
                fs.writeFileSync(path.join('.github/ts_doc_autofill/echo', `mkdir_${path.basename(d)}.txt`), `echo "mkdir -p ${d}"\n`);
              }
            });
            fs.writeFileSync('.github/ts_doc_autofill/echo/server_start.txt', `echo "서버가 시작되었습니다."\n`);
          }
          ensureDirectoriesAndEchoFiles();

          function autoCompleteDocument(content: string): string {
            if (content.length < 20) return content + "\n\n[자동보완 예시] 더 많은 내용을 입력해 주세요.";
            return content + "\n\n[AI 자동보완]: 내용이 더 풍부해졌습니다. 감사합니다.";
          }

          app.post('/autofill', (req: Request, res: Response) => {
            const { docContent } = req.body;
            if (typeof docContent !== 'string') return res.status(400).json({ error: 'docContent required' });
            const result = autoCompleteDocument(docContent);
            fs.writeFileSync('.github/ts_doc_autofill/logs/last_autofill.txt', `입력: ${docContent}\n\n출력: ${result}\n`);
            return res.json({ autofilled: result });
          });

          app.get('/health', (_, res) => res.json({ status: 'ok', ts: new Date().toISOString() }));

          app.listen(PORT, () => {
            fs.appendFileSync('.github/ts_doc_autofill/logs/server.log', `[${new Date().toISOString()}] 서버 시작\n`);
            console.log(`🚀 TS Doc Autofill Server running on http://localhost:${PORT}`);
          });
          EOF
          echo "echo 'autofill-server.ts 생성'" > .github/ts_doc_autofill/echo/autofill-server.txt
          echo "[BACKUP] autofill-server.ts" > .github/echo_backup/backup_autofill-server_$(date +%Y%m%d_%H%M%S).txt

      - name: ⚡ npm 프로젝트/패키지 설치 및 에코/복구/백업/예외
        run: |
          if [ ! -f package.json ]; then
            echo "echo 'npm init -y'" > .github/ts_doc_autofill/echo/npm_init.txt
            npm init -y
          fi
          echo "echo 'npm install express body-parser @types/express @types/node ts-node typescript --save'" > .github/ts_doc_autofill/echo/npm_install.txt
          npm install express body-parser @types/express @types/node ts-node typescript --save || npm install --force
          echo "[BACKUP] package.json" > .github/echo_backup/backup_package_$(date +%Y%m%d_%H%M%S).txt

      - name: 🟢 서버 실행 명령/테스트 curl 에코/로깅/예시
        run: |
          echo "echo 'npx ts-node .github/ts_doc_autofill/autofill-server.ts'" > .github/ts_doc_autofill/echo/run_server.txt
          echo "echo 'curl -X POST http://localhost:3070/autofill -H \"Content-Type: application/json\" -d \"{\\\"docContent\\\":\\\"예시 입력\\\"}\"'" > .github/ts_doc_autofill/echo/curl_test.txt
          echo "[BACKUP] run_server/curl_test" > .github/echo_backup/backup_runserver_$(date +%Y%m%d_%H%M%S).txt

      - name: 🧪 자동보완 서버 기동 (백그라운드)
        run: |
          nohup npx ts-node .github/ts_doc_autofill/autofill-server.ts > .github/ts_doc_autofill/logs/server_run.log 2>&1 &
          sleep 4
          echo "[BACKUP] server_run.log" > .github/echo_backup/backup_server_run_$(date +%Y%m%d_%H%M%S).txt

      - name: 🛠️ 문서 자동보완 API 테스트 (curl)
        run: |
          curl -X POST http://localhost:3070/autofill -H "Content-Type: application/json" -d '{"docContent":"이력서 자기소개는"}' | tee .github/ts_doc_autofill/logs/curl_autofill.log
          echo "[BACKUP] curl_autofill.log" > .github/echo_backup/backup_curl_autofill_$(date +%Y%m%d_%H%M%S).txt

      - name: 🗂️ 홈페이지/업로드 경로 파일/설정/샘플 자동 생성/백업
        run: |
          echo "<html><body><h1>Upload Home</h1><form method='post' enctype='multipart/form-data'><input type='file' name='file'/><button>업로드</button></form></body></html>" > site/uploads/index.html
          echo "[BACKUP] index.html" > .github/echo_backup/backup_index_$(date +%Y%m%d_%H%M%S).txt
          echo "UPLOAD_PATH=site/uploads" > .github/echo_upload/upload_path.txt
          echo "[BACKUP] upload_path" > .github/echo_backup/backup_upload_path_$(date +%Y%m%d_%H%M%S).txt

      - name: 🕵️‍♂️ 최종 echo/로그/권한/백업/복구 상태 점검
        run: |
          echo "[CHECK] .github/ts_doc_autofill"
          tree .github/ts_doc_autofill || ls -lR .github/ts_doc_autofill
          echo "[CHECK] .github/echo_permission"
          ls -l .github/echo_permission
          echo "[CHECK] .github/echo_network"
          ls -l .github/echo_network
          echo "[CHECK] .github/echo_upload"
          ls -l .github/echo_upload
          echo "[CHECK] .github/echo_backup"
          ls -l .github/echo_backup
          echo "[CHECK] site/uploads"
          ls -l site/uploads
          echo "[CHECK] site/public"
          ls -l site/public || true
