name: 🚀 Init Slot Directory with Auto-Rotation & Logging

on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'  # 매 1분마다 실행

permissions:
  contents: write

concurrency:
  group: slot-dir-init-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  setup-slot:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔁 Rotate slot directories (keep max 5)
        run: |
          echo "[+] Rotating disk slots (max 5)..."
          cd disk || mkdir disk && cd disk
          if [ "$(ls -d slot-* 2>/dev/null | wc -l)" -ge 5 ]; then
            OLDEST=$(ls -d slot-* | sort | head -n 1)
            echo "[🗑️] Deleting oldest slot: $OLDEST"
            rm -rf "$OLDEST"
          fi
          NEXT_SLOT_NUM=$(ls -d slot-* 2>/dev/null | sed 's/slot-//' | sort -n | tail -n 1 | awk '{print $1+1}')
          if [ -z "$NEXT_SLOT_NUM" ]; then NEXT_SLOT_NUM=1; fi
          SLOT_NAME="slot-$(printf '%03d' $NEXT_SLOT_NUM)"
          echo "[+] Creating new slot: $SLOT_NAME"
          mkdir -p "$SLOT_NAME"
          echo "$SLOT_NAME" > ../.next_slot_name.txt

      - name: 📁 Prepare directory structure and dummy files
        run: |
          SLOT=$(cat .next_slot_name.txt)
          echo "[+] Preparing directory structure for $SLOT"

          mkdir -p disk/$SLOT/{.github,data,docker,output,site,logs,workflows}
          mkdir -p .github/{workflows,logs}
          mkdir -p data/transactions
          mkdir -p docker/mysql
          mkdir -p site
          mkdir -p output

          echo "Dummy workflow" > .github/workflows/example.yml
          echo "Transaction data" > data/transactions/test.csv
          echo "Docker log" > docker/mysql/info.txt
          echo "Site index" > site/index.html
          echo "Exported output" > output/result.txt
          echo "Workflow init at $(date -u)" > .github/logs/workflow_start.log

      - name: 🗃️ Copy all project files to slot
        run: |
          SLOT=$(cat .next_slot_name.txt)
          echo "[+] Copying files into disk/$SLOT"
          cp -r .github disk/$SLOT/
          cp -r data disk/$SLOT/
          cp -r docker disk/$SLOT/
          cp -r output disk/$SLOT/
          cp -r site disk/$SLOT/
          cp .github/workflows/*.yml disk/$SLOT/workflows/ 2>/dev/null || true

      - name: 📜 Write execution log to slot.log
        run: |
          SLOT=$(cat .next_slot_name.txt)
          LOGFILE="disk/$SLOT/logs/slot.log"
          {
            echo "========== SLOT EXECUTION LOG =========="
            echo "Slot Name:     $SLOT"
            echo "Timestamp:     $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Run ID:        ${{ github.run_id }}"
            echo "Run Number:    ${{ github.run_number }}"
            echo "Actor:         ${{ github.actor }}"
            echo "Workflow:      ${{ github.workflow }}"
            echo "========================================"
          } >> "$LOGFILE"

      - name: 📂 Show final slot structure
        run: |
          SLOT=$(cat .next_slot_name.txt)
          echo "[+] Final structure for $SLOT"
          tree disk/$SLOT || ls -R disk/$SLOT
