name: 🗂️ Auto Expand .github Directories (1min)

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  expand-github-dir:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 🧮 Detect next .github/autogen/slot-XXX number
        id: detect
        run: |
          mkdir -p .github/autogen
          echo "[🔍] Scanning .github/autogen/ for existing slot-* directories..."
          EXISTING=$(find .github/autogen -maxdepth 1 -type d -name 'slot-*' | sed 's|.*/slot-||' | sort -n)
          echo "$EXISTING" | sed 's/^/[📁] Found: slot-/'

          LAST_SLOT=$(echo "$EXISTING" | sort -n | tail -n 1)
          if [ -z "$LAST_SLOT" ]; then
            NEXT_SLOT=001
          else
            NEXT_SLOT=$(printf "%03d" $((10#$LAST_SLOT + 1)))
          fi

          echo "next_slot=slot-$NEXT_SLOT" >> $GITHUB_OUTPUT
          echo "[➡️] Next slot: slot-$NEXT_SLOT"

      - name: 🧱 Create next slot directory and files
        run: |
          SLOT_NAME=${{ steps.detect.outputs.next_slot }}
          DIR=".github/autogen/$SLOT_NAME"
          echo "[🆕] Creating directory: $DIR"
          mkdir -p "$DIR"

          echo "# $SLOT_NAME" > "$DIR/README.md"
          echo "Slot: $SLOT_NAME" > "$DIR/info.txt"
          echo "Generated: $(date -u)" >> "$DIR/info.txt"

          echo "[✔] Created $DIR with echo files"

      - name: 🔗 Update symbolic link to latest slot
        run: |
          SLOT_NAME=${{ steps.detect.outputs.next_slot }}
          echo "[🔗] Updating symlink: .github/slot-latest -> autogen/$SLOT_NAME"
          rm -rf .github/slot-latest
          ln -s "autogen/$SLOT_NAME" .github/slot-latest
          echo "[📂] Listing .github contents:"
          ls -l .github/

      - name: 🔀 Create Pull Request (Tokenless)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🗂️ Add .github/autogen/${{ steps.detect.outputs.next_slot }} + update symlink"
          branch: autogen-${{ steps.detect.outputs.next_slot }}-$(date +'%Y%m%d-%H%M%S')
          title: "🗂️ Add .github/autogen/${{ steps.detect.outputs.next_slot }}"
          body: |
            This PR contains:
            - Created `.github/autogen/${{ steps.detect.outputs.next_slot }}`
            - Added `README.md` and `info.txt` via echo
            - Updated `.github/slot-latest` symlink
          delete-branch: true
