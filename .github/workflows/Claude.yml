name: 🤖 Claude CLI Install & npx Version Check

on:
  workflow_dispatch:

jobs:
  install-claude-cli:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟩 Install Node.js & npm
        run: |
          echo "echo '[🟩] Node.js & npm 설치...'"
          echo '[🟩] Node.js & npm 설치...'
          sudo apt-get update -y
          sudo apt-get install -y nodejs npm
          node -v
          npm -v

      - name: 🤖 Claude CLI npx 실행 및 버전 확인
        run: |
          echo "echo '[🤖] Claude CLI (npx) 버전 확인...'"
          echo '[🤖] Claude CLI (npx) 버전 확인...'
          npx --yes claude --version || echo '[⚠️] Claude CLI 버전(npx) 확인 실패'
