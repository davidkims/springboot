name: "🛡️ Echo & OSSF Scorecard 자동 설치/자동화"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: '13 5 * * 3'

jobs:
  echo-security:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Install Tools (curl, jq, gh, yq, unzip)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl jq gh yq unzip tree

      - name: 🧱 Install OSSF Scorecard (fixed tar.gz)
        run: |
          VERSION="4.10.3"
          curl -sLO https://github.com/ossf/scorecard/releases/download/v${VERSION}/scorecard_${VERSION}_linux_amd64.tar.gz
          tar -xzf scorecard_${VERSION}_linux_amd64.tar.gz
          BIN=$(find . -type f -name scorecard | head -1)
          chmod +x "$BIN"
          sudo mv "$BIN" /usr/local/bin/scorecard
          scorecard --version

      - name: 📁 Create Echo Directories (mass)
        run: |
          for base in codeql scorecard dependabot template placeholder permission; do
            for sub in init log result config policy fix converted scripts test env; do
              mkdir -p .github/echo_${base}/${sub}
            done
          done

      - name: 📄 Create Echo Sample Files (multi-type)
        run: |
          for ext in env cfg json sql md sh py js rs txt; do
            for i in $(seq 1 10); do
              echo "echo '[${ext^^}] Echo $i'" > .github/echo_template/sample_$i.$ext
              for base in codeql scorecard dependabot; do
                echo "echo '[${base^^}] script $i for $ext'" > .github/echo_${base}/scripts/echo_${base}_${ext}_$i.sh
              done
            done
          done

      - name: 🔍 Run Scorecard + extract risky items
        run: |
          mkdir -p .github/echo_scorecard/result
          scorecard --repo=https://github.com/${{ github.repository }} --format=json > .github/echo_scorecard/result/scorecard.json
          jq '.checks[] | select(.score < 5)' .github/echo_scorecard/result/scorecard.json > .github/echo_scorecard/result/scorecard_risks.json

      - name: 📄 Generate SECURITY.md
        run: |
          echo "# 🔐 Auto-generated Scorecard Risk Summary" > SECURITY.md
          jq -r '. | "- **\(.name)**: \(.reason) (_score: \(.score))"' .github/echo_scorecard/result/scorecard_risks.json >> SECURITY.md

      - name: 🧬 Replace PLACEHOLDER in Templates
        run: |
          echo 'API_KEY=PLACEHOLDER' > .github/echo_template/sample.env
          echo 'TOKEN=PLACEHOLDER' > .github/echo_template/sample.cfg
          echo '{ "secret": "PLACEHOLDER" }' > .github/echo_template/sample.json

          sed 's/PLACEHOLDER/my_api_key_123/' .github/echo_template/sample.env > .github/echo_placeholder/converted/sample.env
          sed 's/PLACEHOLDER/super_token!/' .github/echo_template/sample.cfg > .github/echo_placeholder/converted/sample.cfg
          jq 'walk(if type == "string" and test("PLACEHOLDER") then sub("PLACEHOLDER"; "real_secret_key") else . end)' \
            .github/echo_template/sample.json > .github/echo_placeholder/converted/sample.json

      - name: 🔁 Commit + Auto PR (Security/Echo/Fix)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          BRANCH="auto/echo-scorecard-$(date +%s)"
          git checkout -b $BRANCH

          git add .github/echo_* SECURITY.md
          git commit -m "🔐 Auto Scorecard Fix, Echo Files, Placeholder Patch"
          git push origin $BRANCH

          gh pr create \
            --title "🔧 Echo + Scorecard + PLACEHOLDER Fix" \
            --body "This PR includes:\n- OSSF Scorecard risk items\n- PLACEHOLDER replacement\n- Mass echo file generation." \
            --base main --head $BRANCH
