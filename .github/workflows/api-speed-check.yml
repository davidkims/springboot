name: ♻️ API Speed Precheck

on:
  workflow_call:

jobs:
  check-api:
    runs-on: ubuntu-latest
    env:
      API_LIST: |
        https://api.github.com
        https://httpbin.org/get
      MAX_LATENCY_MS: 1000

    steps:
      - name: 📡 Measuring API speed
        run: |
          mkdir -p site/api_check
          echo "[" > site/api_check/result.json

          index=0
          for url in $API_LIST; do
            echo "[🌐] Checking: $url"
            start=$(date +%s%3N)
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            end=$(date +%s%3N)
            latency=$((end - start))

            echo "  {" >> site/api_check/result.json
            echo "    \"url\": \"$url\"," >> site/api_check/result.json
            echo "    \"status\": \"$status\"," >> site/api_check/result.json
            echo "    \"latency_ms\": $latency" >> site/api_check/result.json

            index=$((index+1))
            if [ $index -lt $(echo "$API_LIST" | wc -l) ]; then
              echo "  }," >> site/api_check/result.json
            else
              echo "  }" >> site/api_check/result.json
            fi
          done
          echo "]" >> site/api_check/result.json

      - uses: actions/upload-artifact@v4
        with:
          name: api-speed-result
          path: site/api_check/result.json
