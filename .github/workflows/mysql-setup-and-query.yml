name: 🐬 Full MySQL Workflow with Secure Password Handling

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  mysql-job:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass123
          MYSQL_DATABASE: sample_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Prepare Directories
        run: |
          echo "[+] 디렉토리 생성 중..."
          mkdir -p sql
          mkdir -p export
          mkdir -p .github/queries
          mkdir -p backup
          echo "[✔] 디렉토리 구조 생성 완료"

      - name: 🩺 Wait for MySQL Health or Restart
        run: |
          echo "[+] MySQL 컨테이너 상태 확인 중..."
          CID=$(docker ps -q --filter "ancestor=mysql:8.0")
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $CID)
            echo "[..] 현재 상태: $STATUS (시도 $i)"
            if echo "$STATUS" | grep -q "healthy"; then
              echo "[✔] MySQL 컨테이너 정상 작동"
              exit 0
            fi
            sleep 2
          done
          echo "[❌] 상태 확인 실패. 컨테이너 재시작 중..."
          docker logs $CID
          docker restart $CID
          sleep 10

      - name: 📄 Generate init.sql and Backup
        run: |
          echo "[+] init.sql 생성 및 백업 중..."
          echo "USE sample_db;" > sql/init.sql
          echo "CREATE TABLE IF NOT EXISTS users (" >> sql/init.sql
          echo "  id INT AUTO_INCREMENT PRIMARY KEY," >> sql/init.sql
          echo "  name VARCHAR(100) NOT NULL" >> sql/init.sql
          echo ");" >> sql/init.sql
          echo "INSERT INTO users (name) VALUES ('Alice'), ('Bob'), ('Charlie');" >> sql/init.sql
          echo "" >> sql/init.sql
          echo "CREATE TABLE IF NOT EXISTS customers (" >> sql/init.sql
          echo "  customer_id INT AUTO_INCREMENT PRIMARY KEY," >> sql/init.sql
          echo "  customer_name VARCHAR(100) NOT NULL," >> sql/init.sql
          echo "  registered_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP" >> sql/init.sql
          echo ");" >> sql/init.sql
          echo "INSERT INTO customers (customer_name) VALUES ('Alice'), ('김철수'), ('김민지'), ('David');" >> sql/init.sql
          cp sql/init.sql backup/init.sql.backup
          echo "[✔] init.sql 생성 및 백업 완료"

      - name: ⚙️ Run Migration with Retry
        run: |
          echo "[+] MySQL Client 설치 중..."
          sudo apt-get update && sudo apt-get install -y mysql-client
          echo "[+] init.sql 적용 시도..."
          MYSQL_PWD=rootpass123 mysql -h 127.0.0.1 -u root -p < sql/init.sql
          echo "[✔] 마이그레이션 완료"

      - name: 🔄 Restart MySQL Container After Completion
        run: |
          echo "[+] 컨테이너 재시작 중..."
          CID=$(docker ps -q --filter "ancestor=mysql:8.0")
          docker restart $CID
          sleep 5
          echo "[✔] 컨테이너 재시작 완료"

      - name: 🧹 Remove Old Query Files
        run: |
          echo "[🧹] 기존 쿼리 및 로그 삭제 중..."
          rm -f .github/queries/*.sql
          rm -f .github/queries/*.log
          echo "[✔] 삭제 완료"

      - name: 🆕 Recreate Customer Query Files using echo
        run: |
          echo "[+] 신규 고객 쿼리 파일 생성 중..."
          echo "SELECT * FROM customers;" > .github/queries/customers_all.sql
          echo "SELECT COUNT(*) AS total_customers FROM customers;" > .github/queries/customers_count.sql
          echo "SELECT customer_name FROM customers WHERE customer_name LIKE '%김%';" > .github/queries/customers_like_kim.sql
          echo "SELECT customer_name, registered_at FROM customers ORDER BY registered_at DESC;" > .github/queries/customers_latest.sql
          echo "[✔] 생성된 쿼리 목록:"
          ls -l .github/queries/*.sql

      - name: ▶️ Run Customer Queries and Save Logs
        run: |
          echo "[▶️] 쿼리 실행 및 로그 저장 중..."
          MYSQL_PWD=rootpass123 mysql -h 127.0.0.1 -u root -p -D sample_db < .github/queries/customers_all.sql > .github/queries/customers_all.log
          MYSQL_PWD=rootpass123 mysql -h 127.0.0.1 -u root -p -D sample_db < .github/queries/customers_count.sql > .github/queries/customers_count.log
          MYSQL_PWD=rootpass123 mysql -h 127.0.0.1 -u root -p -D sample_db < .github/queries/customers_like_kim.sql > .github/queries/customers_like_kim.log
          MYSQL_PWD=rootpass123 mysql -h 127.0.0.1 -u root -p -D sample_db < .github/queries/customers_latest.sql > .github/queries/customers_latest.log
          echo "[✔] 로그 저장 완료"

      - name: 📤 Export customers_like_kim.csv
        run: |
          echo "[+] '%김%' 고객 검색 결과를 CSV로 저장 중..."
          echo "customer_name" > export/customers_like_kim.csv
          MYSQL_PWD=rootpass123 mysql -h 127.0.0.1 -u root -p -D sample_db -B -e \
            "SELECT customer_name FROM customers WHERE customer_name LIKE '%김%';" \
            | tail -n +2 >> export/customers_like_kim.csv
          echo "[✔] export/customers_like_kim.csv 생성 완료"
          cat export/customers_like_kim.csv

      - name: 📁 Upload CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: customers-like-kim-csv
          path: export/customers_like_kim.csv

      - name: 📁 Upload Queries and Logs
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-customer-queries-and-logs
          path: .github/queries

      - name: 📁 Upload init.sql Backup
        uses: actions/upload-artifact@v4
        with:
          name: init-sql-backup
          path: backup/init.sql.backup
