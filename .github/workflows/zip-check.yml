name: 📦 .github 내부 ZIP 백업 및 내부 업로드 자동화

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  zip-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 📁 에코/백업/로그/디렉토리 다중 생성 (echo 기록)
        run: |
          # 에코 디렉토리 최우선 생성 (tee 오류 방지)
          echo "echo 'mkdir -p .github/echo_zip'" | tee .github/echo_dirs_init.sh
          mkdir -p .github/echo_zip

          DIRS=".github/echo_zip .github/zip_backup .github/echo_logs .github/echo_zip/extra1 .github/echo_logs/archive"
          for d in $DIRS; do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo_zip/echo_dirs.sh
            mkdir -p "$d"
          done

          ECHO_FILES=".github/echo_zip/echo_dirs.sh .github/echo_zip/ls_echo_zip.sh .github/echo_zip/zip_backup_template.sh .github/echo_zip/echo_init.sh"
          for f in $ECHO_FILES; do
            echo "echo '에코 파일 생성: $f'" | tee -a .github/echo_zip/echo_files_created.log
            touch "$f"
          done

      - name: 🗂️ .github 내부 폴더/워크플로우/파일 ZIP 백업 및 내부 저장 (에코+로그)
        run: |
          TS=$(date +%Y%m%d_%H%M%S)
          ZIP_FILE=".github/github_internal_backup_$TS.zip"  # zip 파일을 .github 안에 바로 저장
          ECHO_SH=".github/echo_zip/zip_github_internal_$TS.sh"
          LOG_FILE=".github/echo_logs/zip_github_internal_$TS.log"

          # .github/zip_backup, .github/echo_zip, .github/echo_logs 등은 제외(선택)
          echo "echo 'zip -r $ZIP_FILE .github -x *.github/zip_backup* *.github/echo_zip* *.github/echo_logs*'" | tee -a "$ECHO_SH"
          echo "zip -r $ZIP_FILE .github -x '*.github/zip_backup*' '*.github/echo_zip*' '*.github/echo_logs*'" >> "$ECHO_SH"

          echo "[INFO] $(date '+%F %T') zip -r $ZIP_FILE .github (내부에 저장)" | tee -a "$LOG_FILE"
          zip -r "$ZIP_FILE" .github -x '*.github/zip_backup*' '*.github/echo_zip*' '*.github/echo_logs*' | tee -a "$LOG_FILE"

          echo "echo '[OK] .github 내부 백업 → $ZIP_FILE'" | tee -a "$ECHO_SH"
          echo "[OK] $(date '+%F %T') .github 내부 백업 완료: $ZIP_FILE" | tee -a "$LOG_FILE"
          chmod +x "$ECHO_SH"

      - name: 📋 .github 내 백업 zip 및 에코/로그 파일 리스트 확인
        run: |
          echo "echo 'ls -al .github'" | tee -a .github/echo_zip/ls_github_dir.sh
          ls -al .github | tee -a .github/echo_logs/ls_github_dir.log

          echo "echo 'ls -al .github/echo_zip'" | tee -a .github/echo_zip/ls_echo_zip.sh
          ls -al .github/echo_zip | tee -a .github/echo_logs/ls_echo_zip.log

          echo "echo 'ls -al .github/echo_logs'" | tee -a .github/echo_zip/ls_echo_logs.sh
          ls -al .github/echo_logs | tee -a .github/echo_logs/ls_echo_logs.log

          echo "echo 'cat .github/echo_zip/echo_dirs.sh'" | tee -a .github/echo_zip/ls_echo_zip.sh
          cat .github/echo_zip/echo_dirs.sh | tee -a .github/echo_logs/ls_echo_zip.log
