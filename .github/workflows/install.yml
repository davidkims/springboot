name: 🧼 자동 최대 용량 파일 삭제 (스킵 및 안전 처리 포함)

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  delete-largest:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Create .github/echo_logs directory
        run: |
          mkdir -p .github/echo_logs

      - name: 📦 Find largest valid target
        id: largest
        run: |
          echo "[INFO] 디렉토리 용량 상위:" | tee .github/echo_logs/du_start.txt
          du -ah . 2>/dev/null | sort -hr | head -n 20 | tee .github/echo_logs/largest_list.txt

          # 보호 대상 제외 필터
          LARGEST=$(du -ah . 2>/dev/null | sort -hr | awk '!($2 ~ /^\.($|\/|git|github|\/README\.md|\/echo_logs)/)' | head -n 1 | cut -f2-)

          if [ -z "$LARGEST" ]; then
            echo "[SKIP] 삭제할 유효한 대상이 없습니다. 다음 단계로 진행."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "[SELECTED] 삭제 대상: $LARGEST"
            echo "largest=$LARGEST" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔁 Delete if valid (skip otherwise)
        if: steps.largest.outputs.skip == 'false'
        run: |
          set -e
          TARGET="${{ steps.largest.outputs.largest }}"
          COUNT=0
          MAX_TRIES=50

          echo "[START] 삭제 대상: $TARGET"

          while [ -e "$TARGET" ]; do
            echo "[TRY #$COUNT] $TARGET 삭제 시도"
            rm -rf "$TARGET" || echo "[WARN] 삭제 실패: $TARGET"
            sleep 2

            if [ -e "$TARGET" ]; then
              echo "[STILL EXISTS] $TARGET 아직 존재함. 재시도."
            else
              echo "[SUCCESS] $TARGET 삭제 완료 ✅"
              break
            fi

            COUNT=$((COUNT+1))
            if [ $COUNT -ge $MAX_TRIES ]; then
              echo "::warning ::[WARNING] 삭제 50회 초과: $TARGET 삭제 실패 - 다음 단계로 진행"
              break
            fi
          done

      - name: 📝 Generate delete report
        run: |
          echo "🧹 삭제 결과 요약" > .github/echo_logs/deleted_report.txt
          if [ "${{ steps.largest.outputs.skip }}" == "false" ]; then
            echo "삭제된 항목: ${{ steps.largest.outputs.largest }}" >> .github/echo_logs/deleted_report.txt
          else
            echo "삭제된 항목 없음 (유효 대상 없음)" >> .github/echo_logs/deleted_report.txt
          fi
          ls -lh . >> .github/echo_logs/deleted_report.txt
          cat .github/echo_logs/deleted_report.txt

      - name: 📤 Upload delete report artifact
        uses: actions/upload-artifact@v4
        with:
          name: delete-report
          path: .github/echo_logs/deleted_report.txt

      - name: 💬 Comment on PR (if pull_request)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('.github/echo_logs/deleted_report.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🧹 삭제 결과 보고서:\n\n\`\`\`\n${report}\n\`\`\``
            });
