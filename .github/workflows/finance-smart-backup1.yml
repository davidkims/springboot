name: "email-servers-ULTRA-integrated-echo-only-with-monitoring-v7"

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Base domain for virtual accounts"
        required: false
        default: "example.local"
      user_count:
        description: "Number of virtual accounts per service"
        required: false
        default: "50"
      test_count:
        description: "Number of test emails per server"
        required: false
        default: "3"
      mta_choice:
        description: "apt로 설치할 단일 MTA (none|postfix|exim4|opensmtpd)"
        required: false
        default: "none"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE: /opt/email
      DOMAIN: ${{ github.event.inputs.domain || 'example.local' }}
      USER_COUNT: ${{ github.event.inputs.user_count || '50' }}
      TEST_COUNT: ${{ github.event.inputs.test_count || '3' }}
      SERVICES: "postfix exim4 opensmtpd mailhog maildev mailcatcher smtp4dev"
      MTA_CHOICE: ${{ github.event.inputs.mta_choice || 'none' }}
      MONO: .monitoring
      INF_BUCKET: metrics
      INF_ORG: org
      INF_USER: admin
      INF_PASS: "admin1234!"
      INF_TOKEN: "dev-token-123456"

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📁 Prepare dirs (services+bulk) & export absolute paths
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo mkdir -p "$BASE"; sudo chown -R "$USER:$USER" "$BASE"
          mkdir -p "$BASE"/{policies,reports,artifacts,global,tools,tmp}
          mkdir -p "${MONO}"/{influxdb,telegraf,graphite,victoriametrics,otel,statsd,scripts,python}
          for SVC in $SERVICES; do
            for d in bin config logs pid run spool queue tmp data certs keys users inbox outbox archive scripts env acl docs policies backups reports firewall permissions artifacts dll; do
              mkdir -p "$BASE/$SVC/$d"
            done
            for i in $(seq -w 0001 1000); do
              mkdir -p "$BASE/$SVC/bulk/dir_$i"
            done
          done
          chmod -R 755 "$BASE"
          {
            echo "export BASE_ABS=$BASE"
            echo "export MONO=${MONO}"
            echo "export MONO_ABS=$(pwd)/${MONO}"
          } > "$GITHUB_WORKSPACE/.env_abs"

      - name: 📦 Base packages (no MTA conflicts) + Docker networks
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates apt-transport-https software-properties-common \
            curl wget git build-essential jq \
            ruby-full libsqlite3-dev apache2-utils openssl \
            swaks nginx clamav clamav-daemon
          sudo apt-get install -y --only-upgrade docker.io containerd || true
          sudo systemctl is-active --quiet docker || sudo systemctl start docker || true
          sudo systemctl enable --now nginx || true
          docker network create emailnet >/dev/null 2>&1 || true
          docker network create monnet   >/dev/null 2>&1 || true

      - name: 🧯 Install single MTA via apt (avoid mail-transport-agent conflicts)
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$MTA_CHOICE" in
            postfix)   sudo apt-get install -y postfix bsd-mailx ;;
            exim4)     sudo apt-get install -y exim4 exim4-daemon-light ;;
            opensmtpd) sudo apt-get install -y opensmtpd ;;
            none|"")   echo "[INFO] Skip apt MTA install." ;;
            *)         echo "[WARN] Unknown MTA_CHOICE=$MTA_CHOICE; skipping." ;;
          esac
          sudo systemctl stop postfix 2>/dev/null || true
          sudo systemctl stop exim4 2>/dev/null || true
          sudo systemctl stop opensmtpd 2>/dev/null || true
          sudo systemctl disable postfix exim4 opensmtpd 2>/dev/null || true

      - name: 📄 Echo global README / SECURITY / ACL / firewall / sample files / DLL
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$BASE/policies"
          : > "$BASE/README.txt"; {
            echo "This CI workspace provisions email servers for testing."
            echo "MTAs are optional (single) and not started. Containers provide SMTP sinks."
            echo "Monitoring uses InfluxDB2 + Telegraf. All files are generated via echo/printf only."
          } >> "$BASE/README.txt"
          : > "$BASE/policies/SECURITY.md"; {
            echo "# Security (Test Only)"
            echo "- Ephemeral CI; no real credentials."
            echo "- Virtual users are randomly generated per run."
            echo "- Outputs: users.csv, users.htpasswd(bcrypt), users.json per service."
          } >> "$BASE/policies/SECURITY.md"
          # 서비스별 정책/방화벽/권한 템플릿 + 샘플 파일 + DLL 100개
          for SVC in $SERVICES; do
            fdir="$BASE/$SVC/firewall"; pdir="$BASE/$SVC/permissions"; sdir="$BASE/$SVC/scripts"; edir="$BASE/$SVC/data"
            mkdir -p "$fdir" "$pdir" "$sdir" "$edir"
            f="$fdir/policy.conf"; : > "$f"; {
              echo "# Echo-only firewall policy for $SVC"
              echo "allow_tcp=1025,1026,1081,8025,8026,2527"
              echo "deny_all_else=true"
            } >> "$f"; chmod 640 "$f"
            p="$pdir/acl.conf"; : > "$p"; {
              echo "# Echo-only permissions for $SVC"
              echo "user=$USER"
              echo "mode=0755"
            } >> "$p"; chmod 640 "$p"
            # 샘플 에코 파일 200개
            for i in $(seq -w 001 200); do
              echo "sample-$SVC-$i" > "$edir/sample_$i.txt"
            done
            # DLL 100개 (더미 내용)
            ddir="$BASE/$SVC/dll"
            for i in $(seq -w 001 100); do
              df="$ddir/lib${i}.dll"
              : > "$df"; {
                echo "; Fake DLL placeholder for $SVC"
                echo "; Generated for CI testing only"
                echo "EXPORTS"
                echo "    Function${i} @${i}"
              } >> "$df"
            done
          done

      - name: 📚 Generate users (CSV/JSON/htpasswd) via echo
        shell: bash
        run: |
          set -Eeuo pipefail
          ufile="$BASE/global/users.csv"; jfile="$BASE/global/users.json"; hfile="$BASE/global/users.htpasswd"
          : > "$ufile"; echo "service,username,password,email" >> "$ufile"
          : > "$jfile"; echo "[" >> "$jfile"
          : > "$hfile"
          idx=0
          for SVC in $SERVICES; do
            for i in $(seq -w 001 "$USER_COUNT"); do
              USERNAME="${SVC}_user_$i"
              PASS="$(openssl rand -base64 18 | tr -d '\n=/' | cut -c1-16)"
              EMAIL="${USERNAME}@${DOMAIN}"
              echo "${SVC},${USERNAME},${PASS},${EMAIL}" >> "$ufile"
              if [ $idx -gt 0 ]; then echo "," >> "$jfile"; fi
              printf '  {"service":"%s","username":"%s","password":"%s","email":"%s"}' "$SVC" "$USERNAME" "$PASS" "$EMAIL" >> "$jfile"
              htpasswd -Bbn "$USERNAME" "$PASS" >> "$hfile"
              idx=$((idx+1))
            done
          done
          echo "" >> "$jfile"; echo "]" >> "$jfile"

      - name: 🛠️ Monitoring configs (InfluxDB2 + Telegraf) — echo only
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$GITHUB_WORKSPACE/.env_abs"
          icfg="$MONO/influxdb/influxdb.conf"; : > "$icfg"
          echo 'reporting-disabled = true'                       >> "$icfg"
          echo 'bolt-path = "/var/lib/influxdb2/influxd.bolt"'  >> "$icfg"
          echo 'engine-path = "/var/lib/influxdb2/engine"'      >> "$icfg"
          echo 'http-bind-address = ":8086"'                     >> "$icfg"
          tcfg="$MONO/telegraf/telegraf.conf"; : > "$tcfg"
          echo '[agent]'                                         >> "$tcfg"
          echo '  interval = "10s"'                              >> "$tcfg"
          echo '  round_interval = true'                         >> "$tcfg"
          echo ''                                                >> "$tcfg"
          echo '[[outputs.influxdb_v2]]'                         >> "$tcfg"
          echo '  urls = ["http://influxdb:8086"]'               >> "$tcfg"
          echo '  token = "${INFLUX_TOKEN}"'                     >> "$tcfg"
          echo '  organization = "${INFLUX_ORG}"'                >> "$tcfg"
          echo '  bucket = "${INFLUX_BUCKET}"'                   >> "$tcfg"
          echo ''                                                >> "$tcfg"
          echo '[[inputs.cpu]]'                                  >> "$tcfg"
          echo '  percpu = true'                                 >> "$tcfg"
          echo '  totalcpu = true'                               >> "$tcfg"
          echo '[[inputs.mem]]'                                  >> "$tcfg"
          echo '[[inputs.disk]]'                                 >> "$tcfg"
          echo '  ignore_fs = ["tmpfs","devtmpfs","overlay"]'    >> "$tcfg"
          echo '[[inputs.net]]'                                  >> "$tcfg"

      - name: 🚀 Launch monitoring containers (abs bind)
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$GITHUB_WORKSPACE/.env_abs"
          docker rm -f influxdb telegraf >/dev/null 2>&1 || true
          docker run -d --name influxdb --network monnet \
            --mount type=bind,src="${MONO_ABS}/influxdb/influxdb.conf",dst=/etc/influxdb2/config.toml,ro \
            -p 8086:8086 influxdb:2.7
          sleep 5
          docker exec influxdb influx setup -u "$INF_USER" -p "$INF_PASS" -o "$INF_ORG" -b "$INF_BUCKET" -t "$INF_TOKEN" -f >/dev/null 2>&1 || true
          docker run -d --name telegraf --network monnet \
            -e INFLUX_TOKEN="$INF_TOKEN" -e INFLUX_ORG="$INF_ORG" -e INFLUX_BUCKET="$INF_BUCKET" \
            --mount type=bind,src="${MONO_ABS}/telegraf/telegraf.conf",dst=/etc/telegraf/telegraf.conf,ro \
            telegraf:1.30

      - name: ✉️ Launch SMTP test containers (smtp4dev replaces smtp-sink)
        shell: bash
        run: |
          set -Eeuo pipefail
          # MailHog (SMTP:1025, UI:8025)
          docker rm -f mailhog >/dev/null 2>&1 || true
          docker run -d --name mailhog --network emailnet -p 1025:1025 -p 8025:8025 mailhog/mailhog
          # MailDev (SMTP:1081 -> 1025, UI:9080 -> 1080)
          docker rm -f maildev >/dev/null 2>&1 || true
          docker run -d --name maildev --network emailnet -p 1081:1025 -p 9080:1080 maildev/maildev
          # MailCatcher (SMTP:1026, UI:8026)
          docker rm -f mailcatcher >/dev/null 2>&1 || true
          docker run -d --name mailcatcher --network emailnet -p 1026:1025 -p 8026:1080 sj26/mailcatcher
          # smtp4dev (SMTP:2527 -> 25, UI:3001 -> 80)  ← smtp-sink 대체
          docker rm -f smtp4dev >/dev/null 2>&1 || true
          docker run -d --name smtp4dev --network emailnet -p 2527:25 -p 3001:80 rnwood/smtp4dev

      - name: 🛡️ ClamAV DB 업데이트 + 대량 테스트 스캔 (echo-only, nounset-safe)
        shell: bash
        run: |
          set -Eeuo pipefail
          tmpc="$(mktemp)"; : > "$tmpc"
          echo "DatabaseMirror database.clamav.net"          >> "$tmpc"
          echo "DNSDatabaseInfo current.cvd.clamav.net"      >> "$tmpc"
          echo "UpdateLogFile /var/log/clamav/freshclam.log" >> "$tmpc"
          echo "NotifyClamd /etc/clamav/clamd.conf"          >> "$tmpc"
          echo "ScriptedUpdates yes"                         >> "$tmpc"
          echo "CompressLocalDatabase no"                    >> "$tmpc"
          sudo mv "$tmpc" /etc/clamav/freshclam.conf
          sudo chown root:root /etc/clamav/freshclam.conf
          sudo chmod 644 /etc/clamav/freshclam.conf
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam || true
          # EICAR 문자열(변수확장 방지)
          eicar='X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*'
          mkdir -p "$BASE/tmp"; printf '%s\n' "$eicar" > "$BASE/tmp/EICAR.txt"
          for SVC in $SERVICES; do
            mkdir -p "$BASE/$SVC/tmp"
            for i in 1 2 3 4 5; do printf '%s\n' "$eicar" > "$BASE/$SVC/tmp/EICAR_${SVC}_$i.txt"; done
          done
          clamscan -r --no-summary "$BASE" > "$BASE/reports/clamav_scan.txt" 2>&1 || true
          chmod 644 "$BASE/reports/clamav_scan.txt" || true

      - name: 📤 Massive send tests (swaks → all SMTP containers)
        shell: bash
        run: |
          set -Eeuo pipefail
          # 대상 포트 맵
          echo "mailhog,127.0.0.1,1025"    >  "$BASE/global/smtp_targets.csv"
          echo "maildev,127.0.0.1,1081"    >> "$BASE/global/smtp_targets.csv"
          echo "mailcatcher,127.0.0.1,1026">> "$BASE/global/smtp_targets.csv"
          echo "smtp4dev,127.0.0.1,2527"   >> "$BASE/global/smtp_targets.csv"
          # 송신
          : > "$BASE/reports/send.log"
          while IFS=, read -r name host port; do
            echo "[TARGET] $name $host:$port" >> "$BASE/reports/send.log"
            for n in $(seq 1 "$TEST_COUNT"); do
              swaks --to "rcpt${n}@${DOMAIN}" --from "sender${n}@${DOMAIN}" \
                --server "$host" --port "$port" --timeout 10 \
                --h-Subject "CI Test $name #$n" \
                --data "Test body $name #$n $(date -u +%FT%TZ)" \
                >> "$BASE/reports/send.log" 2>&1 || echo "[WARN] $name #$n failed" >> "$BASE/reports/send.log"
            done
          done < "$BASE/global/smtp_targets.csv"

      - name: 📦 Upload artifacts (configs, reports, users)
        uses: actions/upload-artifact@v4
        with:
          name: email-ci-artifacts
          path: |
            /opt/email/**
            .monitoring/**
