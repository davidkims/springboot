name: 🌐 All-in-One 시스템/네트워크/도커/보안/설치/빌드 자동화 (에코+진단+오류에코)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  all-in-one-info:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 주요 디렉토리 일괄 생성 (에코)
        run: |
          for d in \
            .github/echo_system .github/echo_network .github/echo_dns .github/echo_route \
            .github/echo_docker .github/echo_containers .github/echo_volume .github/echo_logs \
            .github/echo_permission .github/echo_user .github/echo_key .github/echo_fileperm \
            .github/echo_pkg .github/echo_env .github/echo_build .github/echo_git \
            .github/echo_backup .github/echo_monitor .github/echo_misc ; do
            echo "echo 'mkdir -p $d'" ; mkdir -p $d
          done

      - name: 🔐 권한/보안/유저 정보 에코 파일 생성 (오류 메시지까지 에코)
        run: |
          set -e
          echo "who > .github/echo_user/who.txt" | tee .github/echo_user/who.sh
          (who > .github/echo_user/who.txt 2> .github/echo_user/who.err || echo "[에러] who 실행 실패" > .github/echo_user/who.err)
          
          echo "w > .github/echo_user/w.txt" | tee .github/echo_user/w.sh
          (w > .github/echo_user/w.txt 2> .github/echo_user/w.err || echo "[에러] w 실행 실패" > .github/echo_user/w.err)

          echo "cat /etc/passwd > .github/echo_user/passwd.txt" | tee .github/echo_user/passwd.sh
          (cat /etc/passwd > .github/echo_user/passwd.txt 2> .github/echo_user/passwd.err || echo "[에러] passwd 읽기 실패" > .github/echo_user/passwd.err)

          echo "sudo cat /etc/shadow | grep runner > .github/echo_user/shadow_runner.txt" | tee .github/echo_user/shadow.sh
          (sudo cat /etc/shadow | grep runner > .github/echo_user/shadow_runner.txt 2> .github/echo_user/shadow_runner.err || echo "[에러] shadow 읽기 실패" > .github/echo_user/shadow_runner.err)

          echo "getent group sudo > .github/echo_permission/sudo_group.txt" | tee .github/echo_permission/sudo_group.sh
          (getent group sudo > .github/echo_permission/sudo_group.txt 2> .github/echo_permission/sudo_group.err || echo "[에러] sudo group 조회 실패" > .github/echo_permission/sudo_group.err)

          echo "ls -l /etc/sudoers > .github/echo_permission/sudoers.txt" | tee .github/echo_permission/sudoers.sh
          (ls -l /etc/sudoers > .github/echo_permission/sudoers.txt 2> .github/echo_permission/sudoers.err || echo "[에러] sudoers 읽기 실패" > .github/echo_permission/sudoers.err)

          echo "ls -l /etc/ssh/sshd_config > .github/echo_permission/sshd_config.txt" | tee .github/echo_permission/sshd.sh
          (ls -l /etc/ssh/sshd_config > .github/echo_permission/sshd_config.txt 2> .github/echo_permission/sshd_config.err || echo "[에러] sshd_config 읽기 실패" > .github/echo_permission/sshd_config.err)

          echo "sudo -l > .github/echo_permission/sudo_l.txt" | tee .github/echo_permission/sudo_l.sh
          (sudo -l > .github/echo_permission/sudo_l.txt 2> .github/echo_permission/sudo_l.err || echo "[에러] sudo -l 실패" > .github/echo_permission/sudo_l.err)

          echo "cat ~/.ssh/authorized_keys > .github/echo_key/authorized_keys.txt" | tee .github/echo_key/authorized_keys.sh
          (cat ~/.ssh/authorized_keys > .github/echo_key/authorized_keys.txt 2> .github/echo_key/authorized_keys.err || echo "[에러] authorized_keys 없음 또는 읽기 실패" > .github/echo_key/authorized_keys.err)

          echo "ls -alR /etc > .github/echo_fileperm/etc_perm.txt" | tee .github/echo_fileperm/etc_perm.sh
          (ls -alR /etc > .github/echo_fileperm/etc_perm.txt 2> .github/echo_fileperm/etc_perm.err || echo "[에러] /etc 권한 일부 없음" > .github/echo_fileperm/etc_perm.err)

      - name: 📦 패키지/설치 정보 및 서버 설치 (에코 + 진단 + 에러 에코)
        run: |
          set +e
          echo "dpkg -l > .github/echo_pkg/dpkg_list.txt" | tee .github/echo_pkg/dpkg_list.sh
          (dpkg -l > .github/echo_pkg/dpkg_list.txt 2> .github/echo_pkg/dpkg_list.err || echo "[에러] dpkg -l 실패" > .github/echo_pkg/dpkg_list.err)
          echo "pip freeze > .github/echo_pkg/requirements.txt" | tee .github/echo_pkg/pip.sh
          (pip freeze > .github/echo_pkg/requirements.txt 2> .github/echo_pkg/pip.err || echo "[에러] pip freeze 실패" > .github/echo_pkg/pip.err)
          echo "env > .github/echo_env/env.txt" | tee .github/echo_env/env.sh
          (env > .github/echo_env/env.txt 2> .github/echo_env/env.err || echo "[에러] env 실패" > .github/echo_env/env.err)

          # held/broken 패키지 진단
          echo "dpkg --get-selections | grep hold > .github/echo_pkg/held_packages.txt" | tee .github/echo_pkg/held_pkg.sh
          (dpkg --get-selections | grep hold > .github/echo_pkg/held_packages.txt 2> .github/echo_pkg/held_packages.err || echo "[에러] hold 패키지 없음" > .github/echo_pkg/held_packages.err)
          echo "apt-mark showhold > .github/echo_pkg/apt_mark_showhold.txt" | tee .github/echo_pkg/apt_mark_showhold.sh
          (apt-mark showhold > .github/echo_pkg/apt_mark_showhold.txt 2> .github/echo_pkg/apt_mark_showhold.err || echo "[에러] apt-mark showhold 실패" > .github/echo_pkg/apt_mark_showhold.err)
          echo "apt-get check > .github/echo_pkg/apt_check.txt 2>&1" | tee .github/echo_pkg/apt_check.sh
          (apt-get check > .github/echo_pkg/apt_check.txt 2> .github/echo_pkg/apt_check.err || echo "[에러] apt-get check 실패" > .github/echo_pkg/apt_check.err)

          echo "cat /etc/apt/sources.list > .github/echo_pkg/apt_sources.txt" | tee .github/echo_pkg/sources.sh
          (cat /etc/apt/sources.list > .github/echo_pkg/apt_sources.txt 2> .github/echo_pkg/apt_sources.err || echo "[에러] sources.list 없음" > .github/echo_pkg/apt_sources.err)

          echo "sudo apt-get update" | tee .github/echo_pkg/apt_update.sh
          (sudo apt-get update | tee .github/echo_pkg/apt_update.log 2> .github/echo_pkg/apt_update.err || echo "[에러] apt-get update 실패" > .github/echo_pkg/apt_update.err)

          echo "sudo apt-get install -y nginx mysql-server docker.io" | tee .github/echo_pkg/apt_install.sh
          (sudo apt-get install -y nginx mysql-server docker.io | tee .github/echo_pkg/apt_install.log 2> .github/echo_pkg/apt_install.err || echo "[에러] apt-get install 실패" > .github/echo_pkg/apt_install.err)

          echo "cat /var/log/apt/term.log > .github/echo_pkg/apt_term_log.txt" | tee .github/echo_pkg/apt_term_log.sh
          (cat /var/log/apt/term.log > .github/echo_pkg/apt_term_log.txt 2> .github/echo_pkg/apt_term_log.err || echo "[에러] apt term.log 없음" > .github/echo_pkg/apt_term_log.err)

          echo "cat /var/log/apt/history.log > .github/echo_pkg/apt_history_log.txt" | tee .github/echo_pkg/apt_history_log.sh
          (cat /var/log/apt/history.log > .github/echo_pkg/apt_history_log.txt 2> .github/echo_pkg/apt_history_log.err || echo "[에러] apt history.log 없음" > .github/echo_pkg/apt_history_log.err)

          echo "sudo apt-get -f install" | tee .github/echo_pkg/apt_fix.sh
          (sudo apt-get -f install | tee .github/echo_pkg/apt_fix.log 2> .github/echo_pkg/apt_fix.err || echo "[에러] apt-get -f install 실패" > .github/echo_pkg/apt_fix.err)

          echo "sudo dpkg --configure -a" | tee .github/echo_pkg/dpkg_conf.sh
          (sudo dpkg --configure -a | tee .github/echo_pkg/dpkg_conf.log 2> .github/echo_pkg/dpkg_conf.err || echo "[에러] dpkg --configure -a 실패" > .github/echo_pkg/dpkg_conf.err)

          echo "python3 --version > .github/echo_pkg/python.txt" | tee .github/echo_pkg/python.sh
          (python3 --version > .github/echo_pkg/python.txt 2> .github/echo_pkg/python.err || echo "[에러] python3 --version 실패" > .github/echo_pkg/python.err)
          echo "java -version > .github/echo_pkg/java.txt 2>&1" | tee .github/echo_pkg/java.sh
          (java -version > .github/echo_pkg/java.txt 2> .github/echo_pkg/java.err || echo "[에러] java -version 실패" > .github/echo_pkg/java.err)
          echo "node --version > .github/echo_pkg/node.txt" | tee .github/echo_pkg/node.sh
          (node --version > .github/echo_pkg/node.txt 2> .github/echo_pkg/node.err || echo "[에러] node --version 실패" > .github/echo_pkg/node.err)
          echo "npm --version > .github/echo_pkg/npm.txt" | tee .github/echo_pkg/npm.sh
          (npm --version > .github/echo_pkg/npm.txt 2> .github/echo_pkg/npm.err || echo "[에러] npm --version 실패" > .github/echo_pkg/npm.err)
          echo "gradle --version > .github/echo_pkg/gradle.txt" | tee .github/echo_pkg/gradle.sh
          (gradle --version > .github/echo_pkg/gradle.txt 2> .github/echo_pkg/gradle.err || echo "[에러] gradle --version 실패" > .github/echo_pkg/gradle.err)
          echo "mvn -v > .github/echo_pkg/maven.txt" | tee .github/echo_pkg/maven.sh
          (mvn -v > .github/echo_pkg/maven.txt 2> .github/echo_pkg/maven.err || echo "[에러] mvn -v 실패" > .github/echo_pkg/maven.err)

      # (이하 동일 - 모든 echo/실행/에러 결과를 별도 파일에 기록하도록 패턴 통일)

      - name: 📦 모든 정보/에코 파일 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: all-echo-artifacts
          path: .github/echo_*/**
