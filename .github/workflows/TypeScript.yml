name: 🟦 TypeScript 설치/업그레이드/다중 에코/tsconfig 자동화/파일 분산복사

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  typescript-setup:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 주요/추가 디렉토리/에코/로그 생성 (echo)
        run: |
          set -e
          for d in \
            .github/echo_ts \
            .github/logs_ts \
            .github/ts_projects \
            .github/ts_bin \
            .github/ts_backup \
            .github/ts_dist_backup \
            .github/ts_tmp \
            .github/ts_install; do
            echo "echo 'mkdir -p $d'"
            mkdir -p "$d"
          done
          echo "echo 'chmod 755 ...'"
          chmod 755 .github/echo_ts .github/logs_ts .github/ts_projects .github/ts_bin .github/ts_backup .github/ts_dist_backup .github/ts_tmp .github/ts_install

      - name: 📄 다수 TypeScript 파일 및 tsconfig.json 에코 자동 생성
        run: |
          set -e
          # hello.ts
          echo "echo \"console.log('Hello, TypeScript!')\" > .github/ts_projects/hello.ts"
          echo "console.log('Hello, TypeScript!')" > .github/ts_projects/hello.ts
          echo "echo '에코: .github/ts_projects/hello.ts 생성됨'" | tee -a .github/echo_ts/echo_file.log
          # greet.ts
          echo "echo \"export function greet(name: string) { return 'Hello, ' + name + '!'; }\" > .github/ts_projects/greet.ts"
          echo "export function greet(name: string) { return 'Hello, ' + name + '!'; }" > .github/ts_projects/greet.ts
          echo "echo '에코: .github/ts_projects/greet.ts 생성됨'" | tee -a .github/echo_ts/echo_file.log
          # main.ts
          echo "echo \"import { greet } from './greet'; console.log(greet('GitHub Actions'));\" > .github/ts_projects/main.ts"
          echo "import { greet } from './greet'; console.log(greet('GitHub Actions'));" > .github/ts_projects/main.ts
          echo "echo '에코: .github/ts_projects/main.ts 생성됨'" | tee -a .github/echo_ts/echo_file.log
          # tsconfig.json
          echo "echo '{' > .github/ts_projects/tsconfig.json"
          echo "{" > .github/ts_projects/tsconfig.json
          echo "  \"compilerOptions\": {" >> .github/ts_projects/tsconfig.json
          echo "    \"target\": \"es6\"," >> .github/ts_projects/tsconfig.json
          echo "    \"module\": \"commonjs\"," >> .github/ts_projects/tsconfig.json
          echo "    \"outDir\": \"./dist\"," >> .github/ts_projects/tsconfig.json
          echo "    \"strict\": true," >> .github/ts_projects/tsconfig.json
          echo "    \"esModuleInterop\": true" >> .github/ts_projects/tsconfig.json
          echo "  }," >> .github/ts_projects/tsconfig.json
          echo "  \"include\": [\"*.ts\"]" >> .github/ts_projects/tsconfig.json
          echo "}" >> .github/ts_projects/tsconfig.json
          echo "echo '에코: .github/ts_projects/tsconfig.json 생성됨'" | tee -a .github/echo_ts/echo_file.log
          # 권한
          chmod 755 .github/ts_projects/*.ts .github/ts_projects/tsconfig.json

      - name: 📦 Node.js, npm, TypeScript 설치/업그레이드 (에코)
        run: |
          set -e
          echo "echo '[Node.js 및 npm 최신 패키지 설치 및 업그레이드]'"
          echo '[Node.js 및 npm 최신 패키지 설치 및 업그레이드]'
          echo "echo 'sudo apt-get update -y && sudo apt-get install -y nodejs npm curl'"
          sudo apt-get update -y
          sudo apt-get install -y nodejs npm curl

          echo "echo '[Node.js 업그레이드 시도 (n 사용)]'"
          curl -L https://raw.githubusercontent.com/tj/n/master/bin/n -o n && bash n lts || true
          export PATH="/usr/local/bin:$PATH"

          echo "echo '[npm 최신 버전 업그레이드]'"
          npm install -g npm@latest || true
          echo "echo '[npm, npx, node 버전 확인]'"
          npm -v
          npx -v
          node -v

          echo "echo '[TypeScript 최신 설치/업그레이드]'"
          npm install -g typescript@latest
          tsc -v
          which tsc

          echo "echo '[tsc 심볼릭 링크 .github/ts_bin 에 복사]'"
          ln -sf $(which tsc) .github/ts_bin/tsc
          chmod 755 .github/ts_bin/tsc

          # 설치 파일/실행 파일 백업 디렉토리에 복사
          echo "echo '[tsc, node 실행파일 등 복사 및 설치 디렉토리 백업]'"
          cp -a $(which tsc) .github/ts_install/tsc
          cp -a $(which node) .github/ts_install/node
          cp -a $(which npm) .github/ts_install/npm
          cp -a $(which npx) .github/ts_install/npx
          chmod 755 .github/ts_install/*

      - name: 🛠️ TypeScript 컴파일, 결과/설치 파일 분산 복사 및 권한 확인 (에코)
        run: |
          set -e
          echo "echo '[hello.ts, greet.ts, main.ts → dist/ 컴파일]'"
          tsc -p .github/ts_projects/tsconfig.json

          echo "echo '[컴파일 결과 dist/ 권한 755 설정]'"
          chmod -R 755 .github/ts_projects/dist

          echo "echo '[main.js 실행 테스트]'"
          node .github/ts_projects/dist/main.js | tee .github/logs_ts/main_run.log

          echo "echo '[컴파일 결과 dist 백업 디렉토리 복사]'"
          cp -a .github/ts_projects/dist/. .github/ts_dist_backup/

          echo "echo '[ts 파일 및 tsconfig.json 백업]'"
          cp -a .github/ts_projects/*.ts .github/ts_projects/tsconfig.json .github/ts_backup/
          chmod 755 .github/ts_backup/*

          echo "echo '[실행 로그 및 결과 파일 리스트]'"
          ls -lR .github/ts_projects/ | tee .github/logs_ts/ls.log
          ls -lR .github/ts_backup/ | tee -a .github/logs_ts/ls.log
          ls -lR .github/ts_dist_backup/ | tee -a .github/logs_ts/ls.log
          ls -lR .github/ts_install/ | tee -a .github/logs_ts/ls.log

      - name: 🗂️ 결과 파일/권한 에코 출력
        run: |
          set -e
          echo "echo '[에코/로그/TS 프로젝트 디렉토리 파일 리스트]'"
          echo '[에코/로그/TS 프로젝트 디렉토리 파일 리스트]'
          find .github/ -type f | tee .github/logs_ts/files_list.log

          echo "echo '[권한 및 오너 정보 확인]'"
          ls -ld .github/echo_ts .github/logs_ts .github/ts_projects .github/ts_bin .github/ts_backup .github/ts_dist_backup .github/ts_tmp .github/ts_install | tee -a .github/logs_ts/perm_owner.log
