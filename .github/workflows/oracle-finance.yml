name: Oracle Finance Setup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Oracle XE container
        run: |
          echo "[🚀] Starting Oracle XE container"
          docker run -d --name oracle-xe -p 1521:1521 -e ORACLE_PASSWORD=oracle gvenzl/oracle-xe:21-full
          echo "Waiting for database to be ready..."
          for i in {1..30}; do
            sleep 5
            status=$(docker logs oracle-xe 2>&1 | grep -c "DATABASE IS READY")
            if [ "$status" -gt 0 ]; then
              echo "Oracle is ready"
              break
            fi
          done
      - name: Create finance schema and table
        run: |
          echo "[📦] Creating finance schema"
          docker exec oracle-xe bash -c "echo 'CREATE USER finance IDENTIFIED BY finance;' | sqlplus -s system/oracle@localhost/XEPDB1"
          docker exec oracle-xe bash -c "echo 'GRANT CONNECT, RESOURCE TO finance;' | sqlplus -s system/oracle@localhost/XEPDB1"
          echo "[📄] Creating transactions table"
          docker exec oracle-xe bash -c "cat <<'SQL' | sqlplus -s finance/finance@localhost/XEPDB1
CREATE TABLE transactions (
  id NUMBER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
  amount NUMBER(15,2),
  currency VARCHAR2(3),
  status VARCHAR2(20)
);
EXIT;
SQL"
      - name: Clean up
        if: always()
        run: |
          echo "[🧹] Cleaning up container"
          docker rm -f oracle-xe
