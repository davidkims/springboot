name: "🔒 Defender Watchdog"

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: defenderdb
          MYSQL_USER: defender
          MYSQL_PASSWORD: defenderpass
          MYSQL_INITDB_SKIP_TZINFO: 1
          MYSQLD_OPTS: "--host-cache-size=0 --ssl=0 --pid-file=/tmp/mysqld.pid"
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install watchdog requests mysqlclient

      - name: Build Docker image
        run: docker build -t defender-bot .

      - name: Show MySQL logs
        run: docker logs $(docker ps -qf name=mysql)

      - name: Run watchdog
        run: |
          docker run --rm --network host \
            -e MYSQL_HOST=127.0.0.1 \
            -e MYSQL_USER=defender \
            -e MYSQL_PASSWORD=defenderpass \
            -e MYSQL_DATABASE=defenderdb \
            defender-bot
