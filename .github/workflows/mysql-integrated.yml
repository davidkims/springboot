name: 🧾 Multi-Transaction Backup (Per-Type Containers)

on:
  schedule:
    - cron: '*/1 * * * *'  # 매 1분마다 자동 실행
  workflow_dispatch:        # 수동 실행도 가능

jobs:
  finance:
    runs-on: ubuntu-latest

    env:
      ROOT_PASS: rootpass123
      SQL_DIR: /opt/finance/sql
      BACKUP_DIR: /opt/finance/backups
      TYPES: |
        bank_transfer
        check_card
        credit_card
        bitcoin
        stock
        futures

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Create SQL & Backup Directories
        run: |
          echo "[+] Preparing SQL and backup directories..."
          sudo mkdir -p $SQL_DIR $BACKUP_DIR
          sudo chmod -R 777 /opt/finance

          echo "[+] Creating base init.sql"
          echo "CREATE TABLE IF NOT EXISTS transfers (
            id INT AUTO_INCREMENT PRIMARY KEY,
            type VARCHAR(30),
            amount DECIMAL(15,2),
            currency VARCHAR(5),
            status VARCHAR(20)
          );" > $SQL_DIR/init.sql

          echo "[+] Generating per-type insert SQL files..."
          for TYPE in $TYPES; do
            echo "-- Inserts for $TYPE" > $SQL_DIR/${TYPE}_insert.sql
            for i in $(seq 1 100); do
              AMOUNT=$(( (RANDOM % 1000000) + 1000 ))
              CURRENCY="KRW"
              STATUS=$([ $((RANDOM % 2)) -eq 0 ] && echo "completed" || echo "pending")
              echo "INSERT INTO transfers(type, amount, currency, status) VALUES('$TYPE', $AMOUNT, '$CURRENCY', '$STATUS');" >> $SQL_DIR/${TYPE}_insert.sql
            done
            cat $SQL_DIR/${TYPE}_insert.sql >> $SQL_DIR/init.sql
          done
          echo "[✔] All insert SQL generated."

      - name: 🔁 Loop over Transaction Types
        run: |
          echo "[🔁] Looping through transaction types..."
          for TYPE in $TYPES; do
            DB_NAME="db_${TYPE}"
            DB_USER="user_${TYPE}"
            DB_PASS="pass_${TYPE}"
            CONTAINER="mysql_${TYPE}"
            PORT=$((3307 + RANDOM % 1000))

            echo "🚀 Starting container: $CONTAINER for $TYPE on port $PORT"
            docker run -d --rm \
              --name $CONTAINER \
              -e MYSQL_ROOT_PASSWORD=$ROOT_PASS \
              -e MYSQL_DATABASE=$DB_NAME \
              -e MYSQL_USER=$DB_USER \
              -e MYSQL_PASSWORD=$DB_PASS \
              -v $SQL_DIR:/docker-entrypoint-initdb.d \
              -p $PORT:3306 \
              mysql:8.0

            echo "⏳ Waiting for MySQL to initialize for $TYPE..."
            sleep 30

            echo "🔍 Checking for completed transactions for $TYPE..."
            STATUS=$(mysql -h 127.0.0.1 -P $PORT -u$DB_USER -p$DB_PASS -N -e "USE $DB_NAME; SELECT COUNT(*) FROM transfers WHERE type='$TYPE' AND status='completed';")
            echo "✅ $STATUS completed $TYPE transactions found"

            if [ "$STATUS" != "0" ]; then
              FILE="$BACKUP_DIR/${TYPE}_backup.sql"
              echo "💾 Backing up $TYPE to $FILE"
              mysqldump --no-tablespaces -h 127.0.0.1 -P $PORT -u$DB_USER -p$DB_PASS $DB_NAME > $FILE
              echo "[✔] Backup saved for $TYPE"
            else
              echo "⏭️ No completed $TYPE transactions. Skipping backup."
            fi

            docker stop $CONTAINER
          done

      - name: 🗜️ Compress All Backups
        run: |
          echo "[🗜️] Compressing backup files..."
          cd $BACKUP_DIR
          ARCHIVE_NAME="finance-backups-$(date +%Y%m%d%H%M%S).tar.gz"
          tar -czf $ARCHIVE_NAME *.sql
          echo "[✔] Created archive: $ARCHIVE_NAME"
