name: 📡 워크플로 전체 상황 모니터링 (최대 1000건, jq null/rate-limit 완전 방어)

on:
  repository_dispatch:
    types: [workflow_run]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  monitor-all-runs:
    runs-on: ubuntu-latest

    steps:
      - name: ▶️ 최신 1000건 워크플로우 실행 목록 수집 (페이지네이션, null-safe, rate-limit-safe)
        id: collect_runs
        run: |
          echo "echo '[🔍] 최신 1000건 워크플로우 실행 목록 수집...'"
          echo '[🔍] 최신 1000건 워크플로우 실행 목록 수집...'
          > all-runs-arrays.json
          RATE_LIMITED=0
          for page in $(seq 1 10); do
            echo "echo '[🔎] 페이지: $page'"
            echo "[🔎] 페이지: $page"
            resp=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100&page=$page")
            msg=$(echo "$resp" | jq -r '.message // empty')
            if [[ "$msg" == *"rate limit"* ]] || [[ "$msg" == *"API rate limit exceeded"* ]]; then
              echo "echo '[🚨] API Rate Limit 초과 - 수집 중단'"
              echo '[🚨] API Rate Limit 초과 - 수집 중단'
              RATE_LIMITED=1
              break
            fi
            # null일 경우 빈 배열로 대체
            runs=$(echo "$resp" | jq '.workflow_runs // []')
            echo "$runs" >> all-runs-arrays.json
          done
          # rate limit에 걸렸으면 빈 배열로 만들기
          if [ "$RATE_LIMITED" -eq 1 ]; then
            echo "[]" > all-runs-flat.json
            echo "[]" > all-runs-summary.json
            echo "RATE_LIMITED=1" >> $GITHUB_ENV
            exit 0
          fi
          # 파일 합치기 및 null-safe
          cat all-runs-arrays.json | jq -s 'add' > all-runs-flat.json || echo "[]" > all-runs-flat.json
          if [ ! -s all-runs-flat.json ]; then
            echo "[]" > all-runs-flat.json
          fi
          jq '[.[] | {id, name, display_title, status, conclusion, run_number, html_url, created_at, updated_at, actor: (if .actor then .actor.login else "" end)}]' all-runs-flat.json > all-runs-summary.json || echo "[]" > all-runs-summary.json
          if [ ! -s all-runs-summary.json ]; then
            echo "[]" > all-runs-summary.json
          fi

      - name: 📝 최신 워크플로우 20건 요약 로그
        if: env.RATE_LIMITED != '1'
        run: |
          echo "echo '[📝] 최신 워크플로우 20건 요약...'"
          echo '[📝] 최신 워크플로우 20건 요약...'
          if [ -s all-runs-summary.json ]; then
            cat all-runs-summary.json | jq -r '.[:20][] | "[\(.id)] \(.display_title // .name) #\(.run_number) | 상태: \(.status)/\(.conclusion) | 실행: \(.actor) | URL: \(.html_url)"'
          else
            echo "echo '[⚠️] 워크플로우 데이터 없음'"
            echo '[⚠️] 워크플로우 데이터 없음'
          fi

      - name: 📂 전체 워크플로우 실행 요약 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-workflow-runs-summary
          path: all-runs-summary.json

      - name: 🔄 각 워크플로우 실행 상세 감지 및 저장 (최대 1000건, null-safe)
        if: env.RATE_LIMITED != '1'
        run: |
          echo "echo '[🔄] 각 워크플로우 실행 상세 감지 및 저장(최대 1000건)...'"
          echo '[🔄] 각 워크플로우 실행 상세 감지 및 저장(최대 1000건)...'
          mkdir -p runs-details jobs-details steps-details
          ids=$(cat all-runs-summary.json | jq -r '.[].id' | head -1000)
          i=0
          for rid in $ids; do
            echo "echo '[🟢] 워크플로우 실행 상세정보: $rid'"
            echo "[🟢] 워크플로우 실행 상세정보: $rid"
            run_resp=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$rid")
            echo "$run_resp" > runs-details/run-$rid.json

            echo "echo '[🔹] jobs 목록: $rid'"
            echo "[🔹] jobs 목록: $rid"
            jobs_resp=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$rid/jobs")
            echo "$jobs_resp" > jobs-details/jobs-$rid.json

            # step 추출 (jobs가 null이어도 에러 없이 처리)
            cat jobs-details/jobs-$rid.json | jq '[.jobs // [] | .[] | {id, name, status, conclusion, started_at, completed_at, steps: [.steps // [] | .[] | {name, status, conclusion}] }]' > steps-details/steps-$rid.json

            i=$((i+1))
            if [ $i -ge 1000 ]; then break; fi
          done

      - name: 📦 모든 워크플로우 실행/잡/스텝 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-workflow-details
          path: |
            runs-details/
            jobs-details/
            steps-details/

      - name: 📋 모든 워크플로우 최신 상태 집계
        if: env.RATE_LIMITED != '1'
        run: |
          echo "echo '[📋] 최신 40건 워크플로우 상태 집계...'"
          echo '[📋] 최신 40건 워크플로우 상태 집계...'
          if [ -s all-runs-summary.json ]; then
            jq -r '.[] | "워크플로: \(.display_title // .name) (#\(.run_number))\n상태: \(.status)/\(.conclusion)\nURL: \(.html_url)\n-----"' all-runs-summary.json | head -40
          else
            echo "echo '[⚠️] 워크플로우 데이터 없음'"
            echo '[⚠️] 워크플로우 데이터 없음'
          fi
