name: "🐧 Linux 최신 설치 & Cloud-Init Seed ISO + Echo 권한 (Echo Everywhere)"

on:
  workflow_dispatch:
    inputs:
      distro:
        description: "배포판 (ubuntu|debian|rocky|alma|fedora)"
        default: "ubuntu"
        required: true
      release_hint:
        description: "버전 힌트 (ubuntu: 24.04 / debian: 12 등, 비우면 자동)"
        default: ""
        required: false
      hostname:
        description: "호스트명"
        default: "fin-linux"
        required: true
      username:
        description: "관리자 사용자명"
        default: "finops"
        required: true
      ssh_public_key:
        description: "접속용 공개키 (ssh-ed25519/ssh-rsa)"
        default: ""
        required: false
      packages:
        description: "설치 패키지 목록"
        default: "vim curl git htop unzip"
        required: false
      region:
        description: "타임존/로케일 (예: Asia/Seoul|en_US.UTF-8)"
        default: "Asia/Seoul|en_US.UTF-8"
        required: true
      upload_artifacts:
        description: "생성물 아티팩트 업로드 여부"
        default: "true"
        required: true
      do_upgrade:
        description: "런너 apt full-upgrade 실행"
        default: "false"
        required: true
      combine_base_iso:
        description: "배포판 ISO 자동 다운로드 후 seed 포함 합본 ISO 추가 생성"
        default: "true"
        required: true

jobs:
  build-seed-iso:
    runs-on: ubuntu-latest
    steps:
      - name: "[ECHO] 시작"
        run: |
          set -euo pipefail
          echo "[INIT] Linux Seed ISO + 권한 에코 워크플로우 시작"

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "환경 변수/디렉토리 준비 + Echo Helper"
        id: prep
        run: |
          set -euo pipefail
          export ECHO_ROOT=".github/echo_linux"
          mkdir -p "$ECHO_ROOT"/{logs,seed,out,snippets,scripts,ssh,dirs,iso_src}
          echo "ECHO_ROOT=$ECHO_ROOT" >> $GITHUB_ENV
          cat > "$ECHO_ROOT/echo.sh" <<'EOS'
          echoe(){ printf "%s %s\n" "[$(date +'%F %T')]" "$*"; }
          EOS
          . "$ECHO_ROOT/echo.sh"
          echoe "[DIR] 구조 생성 완료: $ECHO_ROOT"
          # 내부 기본값: create_sample_dirs는 입력 없이 기본 true로 처리
          echo "CREATE_DIRS=true" >> $GITHUB_ENV

      - name: "선택적 시스템 업그레이드 (런너)"
        if: ${{ github.event.inputs.do_upgrade == 'true' }}
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          echoe "[UPGRADE] apt update/upgrade 실행"
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y dist-upgrade || true
          sudo apt-get -y autoremove || true
          echoe "[UPGRADE] 완료"

      - name: "도구 설치 (genisoimage/xorriso/cloud-utils)"
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          echoe "[PKG] 도구 설치"
          sudo apt-get update -y
          sudo apt-get install -y genisoimage xorriso cloud-guest-utils jq sed wget p7zip-full
          echoe "[PKG] 설치 완료"

      - name: "입력값 정규화 및 기본값 계산"
        id: inputs
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          DISTRO="${{ github.event.inputs.distro }}"
          REL_HINT="${{ github.event.inputs.release_hint }}"
          HN="${{ github.event.inputs.hostname }}"
          USERNAME="${{ github.event.inputs.username }}"
          SSH_KEY="${{ github.event.inputs.ssh_public_key }}"
          PKGS="${{ github.event.inputs.packages }}"
          REGION="${{ github.event.inputs.region }}"
          TZ="${REGION%%|*}"
          LOCALE="${REGION##*|}"
          COMBINE="${{ github.event.inputs.combine_base_iso }}"
          # 기본 릴리즈 힌트
          case "$DISTRO" in
            ubuntu)  [ -z "$REL_HINT" ] && REL_HINT="24.04" ;;
            debian)  [ -z "$REL_HINT" ] && REL_HINT="12" ;;
            rocky)   [ -z "$REL_HINT" ] && REL_HINT="9" ;;
            alma)    [ -z "$REL_HINT" ] && REL_HINT="9" ;;
            fedora)  [ -z "$REL_HINT" ] && REL_HINT="40" ;;
            *) echo "지원하지 않는 distro: $DISTRO" >&2; exit 1 ;;
          esac
          echo "DISTRO=$DISTRO"     >> $GITHUB_ENV
          echo "REL_HINT=$REL_HINT" >> $GITHUB_ENV
          echo "HOSTNAME=$HN"       >> $GITHUB_ENV
          echo "USERNAME=$USERNAME" >> $GITHUB_ENV
          echo "SSH_KEY=$SSH_KEY"   >> $GITHUB_ENV
          echo "TZ=$TZ"             >> $GITHUB_ENV
          echo "LOCALE=$LOCALE"     >> $GITHUB_ENV
          echo "PKGS=$PKGS"         >> $GITHUB_ENV
          echo "COMBINE=$COMBINE"   >> $GITHUB_ENV
          echoe "[INPUT] DISTRO=$DISTRO REL_HINT=$REL_HINT HOSTNAME=$HN USER=$USERNAME TZ=$TZ LOCALE=$LOCALE"

      - name: "서버 접근 권한 에코 스니펫 생성 (sudo/sshd/firewall)"
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          SNIP="${ECHO_ROOT}/snippets"
          echoe "[SNIPPET] sudoers"
          cat > "${SNIP}/sudoers_${USERNAME}" <<EOF
          # /etc/sudoers.d/${USERNAME}
          ${USERNAME} ALL=(ALL) NOPASSWD:ALL
          EOF
          echoe "[SNIPPET] sshd_config.d"
          cat > "${SNIP}/sshd_${USERNAME}.conf" <<'EOF'
          # /etc/ssh/sshd_config.d/99-custom.conf
          PasswordAuthentication no
          PermitRootLogin no
          PubkeyAuthentication yes
          ChallengeResponseAuthentication no
          UsePAM yes
          EOF
          echoe "[SNIPPET] 방화벽(ufw) 초기 규칙"
          cat > "${SNIP}/ufw_init.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ufw --force reset || true
          ufw default deny incoming
          ufw default allow outgoing
          ufw allow 22/tcp
          ufw --force enable
          ufw status verbose || true
          EOF
          chmod +x "${SNIP}/ufw_init.sh"
          echoe "[SNIPPET] 완료"

      - name: "권한 적용 스크립트(배포 후 서버에서 실행) 생성"
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          SCRIPTS="${ECHO_ROOT}/scripts"
          echoe "[SCRIPT] 사용자/권한/디렉토리 스크립트 생성"
          cat > "${SCRIPTS}/apply_permissions.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          echo "[RUN] 사용자/권한/디렉토리/sshd/ufw 구성"
          USERNAME="${USERNAME:-finops}"
          adduser --disabled-password --gecos "" "$USERNAME" || true
          usermod -aG sudo "$USERNAME" || true
          install -d -m 700 -o "$USERNAME" -g "$USERNAME" "/home/$USERNAME/.ssh"
          if [ -f /root/seed/ssh/authorized_keys ]; then
            install -m 600 -o "$USERNAME" -g "$USERNAME" /root/seed/ssh/authorized_keys "/home/$USERNAME/.ssh/authorized_keys"
          fi
          # sudoers
          install -m 440 /root/seed/snippets/sudoers_${USERNAME} /etc/sudoers.d/${USERNAME}
          # sshd
          install -d -m 755 /etc/ssh/sshd_config.d
          install -m 644 /root/seed/snippets/sshd_${USERNAME}.conf /etc/ssh/sshd_config.d/99-custom.conf
          systemctl restart ssh || systemctl restart sshd || true
          # ufw
          bash /root/seed/snippets/ufw_init.sh || true
          # 샘플 디렉토리
          if [ "${CREATE_DIRS:-true}" = "true" ]; then
            mkdir -p /srv/app /var/log/app /opt/fin && chown -R "$USERNAME":"$USERNAME" /srv/app /var/log/app /opt/fin
          fi
          echo "[DONE] 권한/디렉토리 구성 완료"
          EOF
          chmod +x "${SCRIPTS}/apply_permissions.sh"
          # 변수 치환용 env 템플릿
          cat > "${SCRIPTS}/env.seed" <<EOF
          export USERNAME="${USERNAME}"
          export CREATE_DIRS="${CREATE_DIRS}"
          EOF

      - name: "cloud-init user-data / meta-data 생성 (Seed ISO 내용)"
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          SEED="${ECHO_ROOT}/seed"
          mkdir -p "$SEED"/{nocloud,ssh,snippets}
          # SSH 키 저장
          if [ -n "${SSH_KEY}" ]; then
            echo "${SSH_KEY}" > "${SEED}/ssh/authorized_keys"
          else
            echo "# 여기에 ssh 공개키를 넣으세요" > "${SEED}/ssh/authorized_keys"
          fi
          # user-data
          PKG_LINE=$(echo "$PKGS" | sed 's/[ ,]\+/ /g' | sed 's/ /, /g')
          cat > "${SEED}/nocloud/user-data" <<EOF
          #cloud-config
          hostname: ${HOSTNAME}
          manage_etc_hosts: true
          locale: ${LOCALE}
          timezone: ${TZ}
          users:
            - default
            - name: ${USERNAME}
              groups: [sudo, adm, netdev]
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              ssh_authorized_keys:
                - $(head -n1 "${SEED}/ssh/authorized_keys")
          package_update: true
          packages: [ ${PKG_LINE} ]
          runcmd:
            - [ bash, -lc, "echo '[CLOUD-INIT] seed 배치 시작'" ]
            - [ bash, -lc, "install -d -m 755 /root/seed/snippets /root/seed/ssh /root/seed/scripts" ]
            - [ bash, -lc, "cp -a /media/seed/snippets/* /root/seed/snippets/ || true" ]
            - [ bash, -lc, "cp -a /media/seed/ssh/* /root/seed/ssh/ || true" ]
            - [ bash, -lc, "cp -a /media/seed/scripts/* /root/seed/scripts/ || true" ]
            - [ bash, -lc, "USERNAME='${USERNAME}' CREATE_DIRS='${CREATE_DIRS}' bash /root/seed/scripts/apply_permissions.sh" ]
            - [ bash, -lc, "echo '[CLOUD-INIT] 완료'" ]
          final_message: "Seed 완료: ${HOSTNAME} (user: ${USERNAME})"
          EOF
          # meta-data
          cat > "${SEED}/nocloud/meta-data" <<EOF
          instance-id: iid-${HOSTNAME}-$(date +%s)
          local-hostname: ${HOSTNAME}
          EOF
          # seed 포함 자원 복사
          cp -a "${ECHO_ROOT}/snippets" "${SEED}/"
          cp -a "${ECHO_ROOT}/scripts"  "${SEED}/"
          echoe "[SEED] user-data/meta-data 생성 완료"

      - name: "Seed ISO 생성 (NoCloud)"
        id: seed
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          OUT="${ECHO_ROOT}/out"
          mkdir -p "${ECHO_ROOT}/iso_src/seed"
          cp -a "${ECHO_ROOT}/seed/nocloud" "${ECHO_ROOT}/iso_src/seed/"
          cp -a "${ECHO_ROOT}/seed/snippets" "${ECHO_ROOT}/iso_src/seed/"
          cp -a "${ECHO_ROOT}/seed/ssh"      "${ECHO_ROOT}/iso_src/seed/"
          cp -a "${ECHO_ROOT}/seed/scripts"  "${ECHO_ROOT}/iso_src/seed/"
          genisoimage -output "${OUT}/seed.iso" -volid cidata -joliet -rock "${ECHO_ROOT}/iso_src/seed"
          echo "seed_iso=${OUT}/seed.iso" >> $GITHUB_OUTPUT
          echoe "[ISO] Seed ISO 생성: ${OUT}/seed.iso"

      - name: "배포판 ISO URL 계산 및 자동 다운로드"
        id: baseiso
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          case "$DISTRO" in
            ubuntu)  BASE_URL="https://releases.ubuntu.com/${REL_HINT}/ubuntu-${REL_HINT}-live-server-amd64.iso" ;;
            debian)  BASE_URL="https://cdimage.debian.org/debian-cd/current/amd64/iso-dvd/debian-${REL_HINT}.0.0-amd64-DVD-1.iso" ;;
            rocky)   BASE_URL="https://download.rockylinux.org/pub/rocky/${REL_HINT}/isos/x86_64/Rocky-${REL_HINT}-x86_64-minimal.iso" ;;
            alma)    BASE_URL="https://repo.almalinux.org/almalinux/${REL_HINT}/isos/x86_64/AlmaLinux-${REL_HINT}-latest-x86_64-minimal.iso" ;;
            fedora)  BASE_URL="https://download.fedoraproject.org/pub/fedora/linux/releases/${REL_HINT}/Server/x86_64/iso/Fedora-Server-dvd-x86_64-${REL_HINT}-1.2.iso" ;;
          esac
          echo "BASE_URL=$BASE_URL" >> $GITHUB_ENV
          echoe "[INFO] ${DISTRO} 기본 ISO (참고/다운로드): ${BASE_URL}"
          mkdir -p ${ECHO_ROOT}/out
          wget -O ${ECHO_ROOT}/out/base.iso "$BASE_URL" || echoe "[WARN] 기본 ISO 다운로드 실패(오프라인?)."

      - name: "합본 ISO 생성 (xorriso graft, 부팅정보 유지)"
        if: ${{ github.event.inputs.combine_base_iso == 'true' }}
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          if [ ! -s "${ECHO_ROOT}/out/base.iso" ]; then
            echoe "[SKIP] base.iso 미존재 → 합본 생략"
            exit 0
          fi
          # base.iso에 /seed 트리 graft (부팅정보 keep)
          xorriso \
            -indev  "${ECHO_ROOT}/out/base.iso" \
            -outdev "${ECHO_ROOT}/out/base-with-seed.iso" \
            -map "${ECHO_ROOT}/iso_src/seed" /seed \
            -boot_image any keep
          echoe "[ISO] 합본 생성: ${ECHO_ROOT}/out/base-with-seed.iso"
          # Ubuntu Autoinstall 안내 힌트 기록
          cat > ${ECHO_ROOT}/logs/autoinstall_hint.txt <<'EOF'
          [Ubuntu Autoinstall 힌트]
          부팅 메뉴에서 'e' 입력 후, 커널 라인 끝의 '---' 뒤에 아래를 추가하세요:
            autoinstall ds=nocloud;s=/cdrom/seed/
          저장/부팅(통상 Ctrl+X 또는 F10)하면 NoCloud Seed를 /cdrom/seed에서 읽습니다.
          (다른 배포판은 두-ISO 방식으로 cloud-init seed 활용 권장)
          EOF

      - name: "로그/결과 요약"
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          echoe "[SUMMARY] 생성 파일"
          ls -alh ${ECHO_ROOT}/out || true
          ls -alh ${ECHO_ROOT}/seed || true
          echoe "[HINT] 두-ISO 방식: 1) 배포판 ISO 2) seed.iso (NoCloud)"
          echoe "[HINT] 합본 사용 시 Ubuntu는 커널 파라미터에 'autoinstall ds=nocloud;s=/cdrom/seed/' 추가"

      - name: "아티팩트 업로드"
        if: ${{ github.event.inputs.upload_artifacts == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-seed-iso-and-echo
          path: |
            .github/echo_linux/out/seed.iso
            .github/echo_linux/out/base.iso
            .github/echo_linux/out/base-with-seed.iso
            .github/echo_linux/seed/**
            .github/echo_linux/snippets/**
            .github/echo_linux/scripts/**
            .github/echo_linux/logs/**
            .github/echo_linux/iso_src/**
          retention-days: 14
