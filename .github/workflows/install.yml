name: 🏢 MEGA DB Echo FullOps + 설치 + Eco + 실행 통합

on:
  workflow_dispatch:
    inputs:
      COUNT:
        description: "테이블/사용자 수 (default: 100)"
        required: false
        default: "100"
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  mega-echo:
    runs-on: ubuntu-latest
    env:
      COUNT: ${{ github.event.inputs.COUNT || '100' }}

    steps:
      - name: 📂 체크아웃
        uses: actions/checkout@v4

      - name: 📁 에코 디렉토리/에코 테이블/에코 쿼리/방화벽/패스워드/계정 대량 생성 (설치 전)
        run: |
          COUNT=${COUNT:-100}
          mkdir -p .github/echo_db/{echo_dirs,echo_tables,echo_sql,echo_passwords,echo_accounts,firewall,permissions,run_scripts,logs,results,grants}
          for i in $(seq 1 $COUNT); do
            echo "CREATE TABLE IF NOT EXISTS account_table_$i (id INT AUTO_INCREMENT PRIMARY KEY, username VARCHAR(255), pw VARCHAR(255));" > .github/echo_db/echo_tables/create_account_table_$i.sql
            echo "INSERT INTO account_table_$i (username, pw) VALUES ('user_$i', 'pw_$i');" > .github/echo_db/echo_sql/insert_account_table_$i.sql
            echo "CREATE USER 'user_$i'@'%' IDENTIFIED BY 'pw_$i'; GRANT ALL PRIVILEGES ON test_db.* TO 'user_$i'@'%';" > .github/echo_db/echo_accounts/create_user_$i.sql
          done
          echo "echo '[FIREWALL] 포트 상태 확인'" > .github/echo_db/firewall/check.sh
          echo "sudo ufw status verbose" >> .github/echo_db/firewall/check.sh
          echo "sudo netstat -tuln | grep 3306" >> .github/echo_db/firewall/check.sh
          chmod +x .github/echo_db/firewall/check.sh
          echo "echo '[PERMISSIONS] 루트 비밀번호: rootpass123'" > .github/echo_db/permissions/root_password.sh
          echo "mysql -uroot -prootpass123 -e \"SHOW GRANTS FOR 'root'@'localhost';\"" >> .github/echo_db/permissions/root_password.sh
          chmod +x .github/echo_db/permissions/root_password.sh

      - name: 🧱 MySQL + 시스템 설치 및 업그레이드 + 재기동
        run: |
          sudo apt-get update -y && sudo apt-get upgrade -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server sqlite3 postgresql-client net-tools ufw
          sudo sed -i 's/^bind-address.*/bind-address = 0.0.0.0/' /etc/mysql/mysql.conf.d/mysqld.cnf || true
          sudo systemctl restart mysql || sudo service mysql restart
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpass123'; FLUSH PRIVILEGES;"
          echo "[OK] MySQL 설치 및 root 패스워드 설정 완료"

      - name: 🛠️ 생성된 에코 SQL/테이블/계정 실행 및 생성 결과 확인
        run: |
          COUNT=${COUNT:-100}
          for i in $(seq 1 $COUNT); do
            mysql -uroot -prootpass123 test_db < .github/echo_db/echo_tables/create_account_table_$i.sql || echo "[WARN] 테이블 생성 실패: $i"
            mysql -uroot -prootpass123 test_db < .github/echo_db/echo_sql/insert_account_table_$i.sql || echo "[WARN] INSERT 실패: $i"
            mysql -uroot -prootpass123 < .github/echo_db/echo_accounts/create_user_$i.sql || echo "[WARN] 계정 생성 실패: $i"
          done
          mysql -uroot -prootpass123 -e "SHOW TABLES;" | tee .github/echo_db/logs/mysql_tables.log

      - name: 🔐 권한 및 방화벽 상태 출력
        run: |
          bash .github/echo_db/permissions/root_password.sh | tee .github/echo_db/logs/root_grants.log
          bash .github/echo_db/firewall/check.sh | tee .github/echo_db/logs/firewall_status.log

      - name: 📦 전체 에코 결과 출력 확인
        run: |
          find .github/echo_db -type f | sort | while read f; do
            echo "--- $f"
            cat "$f" || echo "(읽기 실패)"
          done
