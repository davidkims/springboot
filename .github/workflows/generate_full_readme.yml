name: 🧾 Update README with Portfolio + Workflow Stats

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update_readme:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📁 Ensure .tmp Directory
        run: mkdir -p .tmp

      - name: 🔧 Install GitHub CLI
        run: |
          echo "[🔧] GitHub CLI 설치 중..."
          sudo apt-get update
          sudo apt-get install -y gh
          echo "[✅] 설치 완료"

      - name: 📊 Collect Workflow Stats
        run: |
          echo "[📊] 워크플로우 통계 수집 중..."
          OUTPUT_FILE=".tmp/workflows.md"
          echo "## ⚙️ GitHub Actions 워크플로우 목록 및 통계" > "$OUTPUT_FILE"
          echo "" >> "$OUTPUT_FILE"
          echo "| 워크플로우 | 성공률 | 실행 수 | 성공 수 | 실패 수 | 재시작 |" >> "$OUTPUT_FILE"
          echo "|------------|--------|--------:|--------:|--------:|--------:|" >> "$OUTPUT_FILE"

          for f in .github/workflows/*.yml; do
            NAME=$(grep '^name:' "$f" | head -n1 | cut -d ':' -f2- | xargs)
            FILE=$(basename "$f")
            RUNS=$(gh run list --workflow="$FILE" --limit 100 --json conclusion -q '.[] | .conclusion' || echo "")
            TOTAL=$(echo "$RUNS" | wc -l)
            SUCCESS=$(echo "$RUNS" | grep -c "success" || true)
            FAILURE=$((TOTAL - SUCCESS))
            RATE=$(awk "BEGIN {print ($TOTAL>0) ? sprintf(\"%.1f\", $SUCCESS/$TOTAL*100) : \"N/A\"}")
            echo "| $NAME | $RATE% | $TOTAL | $SUCCESS | $FAILURE | [재실행](https://github.com/${{ github.repository }}/actions/workflows/$FILE) |" >> "$OUTPUT_FILE"
          done

      - name: 🧾 Generate README.md
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          TIME=$(date '+%Y-%m-%d %H:%M:%S KST')
          {
            echo "# 👨‍💻 김병권 포트폴리오"
            echo ""
            echo "> 🧠 항상 배우며 성장합니다. 자기개발 BGM: [🎵 YouTube Link](https://www.youtube.com/watch?v=G8lvQRALa6s)"
            echo ""
            echo "[![🧾 Update README](https://github.com/${REPO}/actions/workflows/generate_full_readme.yml/badge.svg)](https://github.com/${REPO}/actions/workflows/generate_full_readme.yml)"
            echo ""
            echo "## 🧑‍💻 개발자 소개"
            echo "- 이름: 김병권"
            echo "- 전문: 백엔드, DevOps, GitHub Actions 자동화"
            echo "- 기술: Java, Spring Boot, Python, Docker, SQL"
            echo ""
            echo "## 📅 마지막 업데이트: $TIME"
            echo "## 📌 브랜치: $BRANCH"
            echo ""
            echo "## 🔧 워크플로우 상태 배지"
            for wf in .github/workflows/*.yml; do
              FILE=$(basename "$wf")
              echo "- [![${FILE}](https://github.com/${REPO}/actions/workflows/${FILE}/badge.svg)](https://github.com/${REPO}/actions/workflows/${FILE})"
            done
            echo ""
            cat .tmp/workflows.md
          } > README.md

      - name: 🔁 변경사항 감지 및 Push or PR 생성
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "[⏭️] 변경 없음"
          else
            echo "[✅] 변경 감지됨 - Push 시도"
            if git pull --rebase origin main; then
              git add README.md
              git commit -m "Docs: Update README with workflow stats [skip ci]"
              git push
              echo "[🚀] Push 완료"
            else
              echo "[⚠️] rebase 실패 - PR 생성"
              BRANCH="update-readme-$(date +%s)"
              git checkout -b "$BRANCH"
              git add README.md
              git commit -m "Docs: Update README with workflow stats [skip ci]"
              git push origin "$BRANCH"
              gh pr create --title "Docs: Update README" \
                --body "README 자동 생성 (워크플로우 통계 포함)" \
                --label "documentation,auto-generated" \
                --base main
            fi
          fi

      - name: ✅ Auto-Approve & Merge (PR 존재 시)
        if: success()
        run: |
          PR_ID=$(gh pr list --search "Update README" --state open --json number -q '.[0].number' || true)
          if [ -n "$PR_ID" ]; then
            gh pr review $PR_ID --approve
            gh pr merge $PR_ID --merge
            echo "[🤖] PR 자동 승인 및 머지 완료"
          fi
