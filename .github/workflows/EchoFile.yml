name: "🛡️ Echo 기반 보안 자동화 + 템플릿 + Placeholder 생성"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 2 * * 5'

jobs:
  full-echo-secure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧰 필수 서비스 설치 (gh, jq, yq, scorecard, etc)
        run: |
          echo "[Install] 설치 시작..."
          sudo apt update -y
          sudo apt install -y curl jq yq tree lsof sudo ssh python3-pip
          npm install -g @githubnext/scorecard-cli
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /usr/share/keyrings/githubcli-archive-keyring.gpg >/dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list
          sudo apt update && sudo apt install gh -y
          pip install codeql

      - name: 📁 Echo 디렉토리 및 권한 Snapshot 생성
        run: |
          for d in .github/echo_{template,security,codeql,dependabot,permission,placeholder}; do mkdir -p "$d"; done

          whoami > .github/echo_permission/whoami.txt
          id > .github/echo_permission/id.txt
          cat /etc/passwd > .github/echo_permission/passwd.txt
          sudo cat /etc/sudoers > .github/echo_permission/sudoers.txt
          getent group sudo > .github/echo_permission/sudo_group.txt
          sudo -l > .github/echo_permission/sudo_l.txt

      - name: 🧾 .env/.yml/.cfg 템플릿 자동 생성
        run: |
          echo "DB_HOST=PLACEHOLDER_HOST" > .github/echo_template/sample.env
          echo "version: '3'\nservices:\n  web:\n    image: PLACEHOLDER_IMAGE" > .github/echo_template/sample.yml
          echo "[config]\nname=PLACEHOLDER_NAME" > .github/echo_template/sample.cfg

          echo "echo 'DB_HOST=PLACEHOLDER_HOST'" > .github/echo_template/echo_env.sh
          echo "echo 'version: ... PLACEHOLDER_IMAGE'" > .github/echo_template/echo_yml.sh
          echo "echo '[config] ... PLACEHOLDER_NAME'" > .github/echo_template/echo_cfg.sh

      - name: 🛡️ 보안 템플릿 자동 생성 (CodeQL/Dependabot/Scorecard)
        run: |
          echo -e "name: CodeQL\non:\n  push:\n    branches: [\"main\"]\njobs:\n  analyze:\n    runs-on: ubuntu-latest\n    steps:\n    - uses: actions/checkout@v4\n    - uses: github/codeql-action/init@v3\n      with:\n        languages: javascript\n    - uses: github/codeql-action/analyze@v3" > .github/codeql.yml
          echo -e "version: 2\nupdates:\n  - package-ecosystem: \"npm\"\n    directory: \"/\"\n    schedule:\n      interval: \"daily\"" > .github/dependabot.yml
          echo "# Security Policy\nPlease report vulnerabilities to: security@PLACEHOLDER_DOMAIN" > .github/SECURITY.md

          echo "echo '[Scorecard] 실행: scorecard --repo=https://github.com/${{ github.repository }}'" > .github/echo_security/echo_scorecard.sh
          echo "scorecard --repo=https://github.com/${{ github.repository }}" >> .github/echo_security/echo_scorecard.sh

      - name: 🧪 자동 Placeholder 파일(.sh/.sql/.md/.json) 생성
        run: |
          echo "#!/bin/bash" > .github/echo_placeholder/echo_placeholder.sh
          echo "echo 'PLACEHOLDER_SCRIPT'" >> .github/echo_placeholder/echo_placeholder.sh

          echo "-- PLACEHOLDER SQL STATEMENT" > .github/echo_placeholder/sample.sql
          echo "echo '-- PLACEHOLDER SQL'" > .github/echo_placeholder/echo_sql.sh

          echo "# PLACEHOLDER Documentation" > .github/echo_placeholder/sample.md
          echo "echo '# PLACEHOLDER Documentation'" > .github/echo_placeholder/echo_md.sh

          echo '{ "key": "PLACEHOLDER_VALUE" }' > .github/echo_placeholder/sample.json
          echo "echo '{ \"key\": \"PLACEHOLDER_VALUE\" }'" > .github/echo_placeholder/echo_json.sh

          echo 'fn main() { println!("PLACEHOLDER"); }' > .github/echo_placeholder/sample.rs
          echo 'print("PLACEHOLDER")' > .github/echo_placeholder/sample.py
          echo 'console.log("PLACEHOLDER")' > .github/echo_placeholder/sample.js

      - name: 📤 Upload All Echo Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: full-echo-security-placeholder
          path: |
            .github/echo_*
            .github/codeql.yml
            .github/dependabot.yml
            .github/SECURITY.md
