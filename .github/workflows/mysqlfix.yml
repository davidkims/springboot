name: 🐬 MySQL 8.x + 가상 메일 수신 + ATM 기기 robust 설치/로깅/메일결과 통합

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  mysql-email:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Echo/로그/메일/소켓/메일박스/ATM 디렉토리 선제 생성 (모든 환경 대응)
        run: |
          set -e
          echo "echo 'mkdir -p .github/echo'" ; mkdir -p .github/echo
          echo "echo 'mkdir -p .github/logs'" ; mkdir -p .github/logs
          echo "echo 'mkdir -p .github/atm'" ; mkdir -p .github/atm
          echo "echo 'mkdir -p /tmp/echo'" ; mkdir -p /tmp/echo
          echo "echo 'sudo mkdir -p /var/mail'" ; sudo mkdir -p /var/mail
          echo "echo 'sudo mkdir -p /var/spool/mail'" ; sudo mkdir -p /var/spool/mail
          echo "echo 'sudo mkdir -p /var/run/mysqld'" ; sudo mkdir -p /var/run/mysqld
          echo "echo 'sudo chown mysql:mysql /var/run/mysqld'" ; sudo chown mysql:mysql /var/run/mysqld || true
          if id ubuntu >/dev/null 2>&1; then
            echo "echo 'touch /var/mail/ubuntu (pre-create)'" ; sudo touch /var/mail/ubuntu
            echo "echo 'chown ubuntu:ubuntu /var/mail/ubuntu'" ; sudo chown ubuntu:ubuntu /var/mail/ubuntu || sudo chown ubuntu /var/mail/ubuntu || true
            echo "echo 'touch /var/spool/mail/ubuntu (pre-create)'" ; sudo touch /var/spool/mail/ubuntu
            echo "echo 'chown ubuntu:ubuntu /var/spool/mail/ubuntu'" ; sudo chown ubuntu:ubuntu /var/spool/mail/ubuntu || sudo chown ubuntu /var/spool/mail/ubuntu || true
          else
            echo "echo 'ubuntu 계정 없음, root용 메일박스 사용'" | tee .github/echo/ubuntu-missing.txt
            echo "echo 'touch /var/mail/root'" ; sudo touch /var/mail/root
            echo "echo 'touch /var/spool/mail/root'" ; sudo touch /var/spool/mail/root
            echo "echo 'chown root:mail /var/mail/root'" ; sudo chown root:mail /var/mail/root || true
            echo "echo 'chown root:mail /var/spool/mail/root'" ; sudo chown root:mail /var/spool/mail/root || true
          fi

      - name: 📦 시스템 전체 패키지 업그레이드 및 설치 (echo/재시도/로그)
        run: |
          set -e
          trycmd() {
            local cmd="$1"
            local logfile="$2"
            local max_try=3
            local n=1
            until eval "$cmd" >> "$logfile" 2>&1; do
              echo "[!] $cmd 실패 ($n회). 3초후 재시도..." | tee -a "$logfile"
              sleep 3
              ((n++))
              if [ $n -gt $max_try ]; then
                echo "[❌] $cmd 명령이 $max_try회 실패. 중단." | tee -a "$logfile"
                exit 1
              fi
              echo "[+] $cmd 재시도 ($n/$max_try)..." | tee -a "$logfile"
            done
            echo "[✔] $cmd 성공." | tee -a "$logfile"
          }
          echo "echo '[+] apt-get update -y'" ; echo '[+] apt-get update -y' | tee .github/echo/step-01-apt-update.txt
          trycmd "sudo apt-get update -y" ".github/echo/step-01-apt-update.txt"
          echo "echo '[+] apt-get upgrade -y'" ; echo '[+] apt-get upgrade -y' | tee .github/echo/step-02-apt-upgrade.txt
          trycmd "sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y" ".github/echo/step-02-apt-upgrade.txt"
          echo "echo '[+] apt-get dist-upgrade -y'" ; echo '[+] apt-get dist-upgrade -y' | tee .github/echo/step-03-dist-upgrade.txt
          trycmd "sudo DEBIAN_FRONTEND=noninteractive apt-get dist-upgrade -y" ".github/echo/step-03-dist-upgrade.txt"
          echo "echo '[+] apt-get autoremove -y'" ; echo '[+] apt-get autoremove -y' | tee .github/echo/step-04-autoremove.txt
          trycmd "sudo apt-get autoremove -y" ".github/echo/step-04-autoremove.txt"

      - name: 📬 메일 서버(Postfix + mailutils) 설치/로컬모드 (echo/재시도/로그)
        run: |
          set -e
          echo "echo 'mkdir -p /tmp/echo/mail'" ; mkdir -p /tmp/echo/mail
          trycmd() {
            local cmd="$1"
            local logfile="$2"
            local max_try=3
            local n=1
            until eval "$cmd" >> "$logfile" 2>&1; do
              echo "[!] $cmd 실패 ($n회). 3초후 재시도..." | tee -a "$logfile"
              sleep 3
              ((n++))
              if [ $n -gt $max_try ]; then
                echo "[❌] $cmd 명령이 $max_try회 실패. 중단." | tee -a "$logfile"
                exit 1
              fi
              echo "[+] $cmd 재시도 ($n/$max_try)..." | tee -a "$logfile"
            done
            echo "[✔] $cmd 성공." | tee -a "$logfile"
          }
          echo "echo '[+] Installing Postfix (Local only) & mailutils for virtual mailbox...'" ; echo "[+] Installing Postfix (Local only) & mailutils for virtual mailbox..." | tee .github/echo/step-05-mailutils.txt
          echo "postfix postfix/mailname string github-actions.local" | sudo debconf-set-selections
          echo "postfix postfix/main_mailer_type string 'Local only'" | sudo debconf-set-selections
          trycmd "sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postfix mailutils" ".github/echo/step-05-mailutils.txt"
          echo "echo 'sudo systemctl restart postfix'" ; sudo systemctl restart postfix
          echo "echo 'sudo ls -l /var/mail || sudo ls -l /var/spool/mail'" ; sudo ls -l /var/mail || sudo ls -l /var/spool/mail

      - name: 🧩 MySQL 8.x robust 설치/초기화/권한/소켓/비번 리셋/24.04 완전대응
        run: |
          set -e
          echo "echo 'sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld && sudo chmod 770 /var/run/mysqld'" ; sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld && sudo chmod 770 /var/run/mysqld
          sudo systemctl stop mysql || true
          sudo pkill -f mysqld || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server
          for i in 1 2 3; do
            sudo systemctl start mysql || true
            sleep 7
            if sudo systemctl status mysql | grep -qi 'active (running)'; then break; fi
            if [ $i -eq 3 ]; then
              sudo journalctl -u mysql | tail -30
              echo "[❌] MySQL 데몬 기동 실패!"; exit 1
            fi
          done
          echo "echo 'sudo mysql로 root 비밀번호 재설정'" ; echo "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpass123';" | sudo mysql
          echo "echo 'sudo mysql로 FLUSH PRIVILEGES;'" ; echo "FLUSH PRIVILEGES;" | sudo mysql
          sleep 2

      - name: 🏧 ATM 기기 robust 설치 (atm-cli 시뮬레이터)
        run: |
          set -e
          echo "echo '[ATM] ATM CLI(시뮬레이터) robust 설치 시작'" | tee .github/echo/step-atm-install.txt
          sudo apt-get install -y npm nodejs || sudo apt-get install -y nodejs
          npm install -g atm-cli || {
            echo "ATM CLI NPM 글로벌 설치 실패 → 시뮬레이터 파일 직접 생성" | tee -a .github/echo/step-atm-install.txt
            cat <<EOT > .github/atm/atm-sim.sh
            #!/bin/bash
            echo '[ATM] Virtual ATM Transaction: Withdraw 10000 KRW'
            echo 'Transaction complete. Remaining: 90000 KRW'
            exit 0
            EOT
            chmod +x .github/atm/atm-sim.sh
            echo "[ATM] 직접 ATM 시뮬레이터 생성 완료" | tee -a .github/echo/step-atm-install.txt
          }
          echo "atm --version" | tee -a .github/echo/step-atm-install.txt
          atm --version 2>&1 | tee -a .github/echo/step-atm-install.txt || true
          echo "[ATM] Test Run" | tee -a .github/echo/step-atm-install.txt
          atm withdraw 10000 2>&1 | tee -a .github/echo/step-atm-install.txt || .github/atm/atm-sim.sh | tee -a .github/echo/step-atm-install.txt
          echo "[ATM] ATM 설치 및 시뮬 실행 종료" | tee -a .github/echo/step-atm-install.txt

      - name: ✅ MySQL root robust 인증 및 DB/테이블 robust 생성 (echo/중복OK)
        run: |
          set -e
          export MYSQL_PWD=rootpass123
          for i in 1 2 3; do
            echo "echo 'mysql -u root -prootpass123 -e SHOW DATABASES;'" ; if mysql -u root -prootpass123 -e 'SHOW DATABASES;'; then
              echo "echo '[✔] MySQL root 패스워드 인증 성공!'" ; echo "[✔] MySQL root 패스워드 인증 성공!" | tee -a .github/echo/step-root-login.txt
              mysql -u root -prootpass123 -e "CREATE DATABASE IF NOT EXISTS logistics;"
              mysql -u root -prootpass123 -D logistics -e "
                CREATE TABLE IF NOT EXISTS echo_log (
                  id INT AUTO_INCREMENT PRIMARY KEY,
                  step_name VARCHAR(128),
                  echo_cmd TEXT,
                  executed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                  status VARCHAR(32) DEFAULT 'success',
                  message TEXT
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;"
              exit 0
            else
              echo "echo '[!] root 인증 실패($i). 3초후 재시도...'" ; echo "[!] root 인증 실패($i). 3초후 재시도..." | tee -a .github/echo/step-root-login.txt
              sleep 3
            fi
          done
          echo "echo '[❌] MySQL root 인증 실패! 전체 중단.'" ; echo "[❌] MySQL root 인증 실패! 전체 중단." | tee -a .github/echo/step-root-login.txt
          exit 1

      - name: 📧 모든 결과 요약 이메일 "가상발송" (ATM/DB/로그 포함)
        run: |
          set -e
          export MYSQL_PWD=rootpass123
          # DB/테이블 robust (중복OK)
          mysql -u root -prootpass123 -e "CREATE DATABASE IF NOT EXISTS logistics;"
          mysql -u root -prootpass123 -D logistics -e "
            CREATE TABLE IF NOT EXISTS echo_log (
              id INT AUTO_INCREMENT PRIMARY KEY,
              step_name VARCHAR(128),
              echo_cmd TEXT,
              executed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              status VARCHAR(32) DEFAULT 'success',
              message TEXT
            ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;"
          mysql -u root -prootpass123 -D logistics -e "INSERT INTO echo_log (step_name, echo_cmd, status, message) VALUES ('mail', '모든 결과 메일발송시작', 'start', NOW());"
          echo "echo 'mkdir -p /tmp/echo/mail_send'" ; mkdir -p /tmp/echo/mail_send
          echo "echo '[+] Sending All Results Email (ATM, DB, 로그 포함)...'" ; echo '[+] Sending All Results Email (ATM, DB, 로그 포함)...' | tee .github/echo/step-999-mail-send.txt
          # 주요 로그 모으기
          echo '========= ATM 설치 및 트랜잭션 결과 =========' > .github/logs/mail_result_all.txt
          cat .github/echo/step-atm-install.txt >> .github/logs/mail_result_all.txt
          echo '' >> .github/logs/mail_result_all.txt
          echo '========= DB 정보 =========' >> .github/logs/mail_result_all.txt
          mysql -u root -prootpass123 -e 'SHOW DATABASES;' >> .github/logs/mail_result_all.txt
          echo '' >> .github/logs/mail_result_all.txt
          echo '========= echo_log 테이블(최근 10건) =========' >> .github/logs/mail_result_all.txt
          mysql -u root -prootpass123 -D logistics -e 'SELECT * FROM echo_log ORDER BY id DESC LIMIT 10;' >> .github/logs/mail_result_all.txt
          echo '' >> .github/logs/mail_result_all.txt
          echo '========= 디렉토리/파일 권한 =========' >> .github/logs/mail_result_all.txt
          ls -lR .github/atm | head -30 >> .github/logs/mail_result_all.txt || true
          ls -lR .github/echo | head -30 >> .github/logs/mail_result_all.txt || true
          ls -lR .github/logs | head -30 >> .github/logs/mail_result_all.txt || true
          echo '' >> .github/logs/mail_result_all.txt
          echo '========= 실행 환경 =========' >> .github/logs/mail_result_all.txt
          uname -a >> .github/logs/mail_result_all.txt
          echo '========= 완료시각 =========' >> .github/logs/mail_result_all.txt
          date >> .github/logs/mail_result_all.txt
          # 메일 발송
          if id ubuntu >/dev/null 2>&1; then
            to_addr="ubuntu"
          else
            to_addr="root"
          fi
          subject="[MySQL+ATM 자동화] 전체 결과 리포트 ($(date '+%Y-%m-%d %H:%M'))"
          cat .github/logs/mail_result_all.txt | mail -s "$subject" "$to_addr"
          mysql -u root -prootpass123 -D logistics -e "INSERT INTO echo_log (step_name, echo_cmd, status, message) VALUES ('mail', '모든 결과 메일발송완료', 'success', NOW());"

      - name: 📬 가상 메일 수신함 robust 출력 (echo/권한/존재보장)
        run: |
          set -e
          echo "echo 'mkdir -p /tmp/echo/mail_recv'" ; mkdir -p /tmp/echo/mail_recv
          echo "echo '[+] Show virtual mailbox (가상수신 결과)'" ; echo '[+] Show virtual mailbox (가상수신 결과)' | tee .github/echo/step-100-mail-recv.txt
          if id ubuntu >/dev/null 2>&1; then
            sudo touch /var/mail/ubuntu
            sudo chown ubuntu:ubuntu /var/mail/ubuntu || sudo chown ubuntu /var/mail/ubuntu || true
            sudo touch /var/spool/mail/ubuntu
            sudo chown ubuntu:ubuntu /var/spool/mail/ubuntu || sudo chown ubuntu /var/spool/mail/ubuntu || true
            sudo cat /var/mail/ubuntu | tee -a .github/echo/step-100-mail-recv.txt || \
            sudo cat /var/spool/mail/ubuntu | tee -a .github/echo/step-100-mail-recv.txt || \
            echo '[No mail]' | tee -a .github/echo/step-100-mail-recv.txt
          else
            sudo touch /var/mail/root
            sudo chown root:mail /var/mail/root || true
            sudo touch /var/spool/mail/root
            sudo chown root:mail /var/spool/mail/root || true
            sudo cat /var/mail/root | tee -a .github/echo/step-100-mail-recv.txt || \
            sudo cat /var/spool/mail/root | tee -a .github/echo/step-100-mail-recv.txt || \
            echo '[No mail]' | tee -a .github/echo/step-100-mail-recv.txt
          fi
          echo '[+] Virtual mailbox dump complete.' | tee -a .github/echo/step-100-mail-recv.txt

      - name: 🟩 Directory/File Permission 확인 (echo/파일)
        run: |
          set -e
          echo '[+] Directory & file permission check...' | tee .github/echo/step-101-perm.txt
          ls -lR .github/atm | tee -a .github/echo/step-101-perm.txt || true
          ls -lR .github/logs | tee -a .github/echo/step-101-perm.txt || true
          ls -lR .github/echo | tee -a .github/echo/step-101-perm.txt || true
          ls -lR /var/mail | tee -a .github/echo/step-101-perm.txt || true
          ls -lR /var/spool/mail | tee -a .github/echo/step-101-perm.txt || true
          ls -lR /var/run/mysqld | tee -a .github/echo/step-101-perm.txt || true
