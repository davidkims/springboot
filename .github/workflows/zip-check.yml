name: 📦 저장소 + 복제본 zip 압축 + gh repo clone (GH_TOKEN, 재시도/에러방지) + echo/로그

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  zip-and-clone:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 📁 에코/백업/로그 디렉토리 생성 (echo)
        run: |
          mkdir -p .github/echo_zip .github/zip_backup .github/echo_logs
          echo "mkdir -p .github/echo_zip .github/zip_backup .github/echo_logs" > .github/echo_zip/echo_dirs.sh

      - name: 🗂️ [1] 현재 저장소 전체 zip 압축 (에코/로그)
        run: |
          TS=$(date +%Y%m%d_%H%M%S)
          ZIP_FILE=".github/zip_backup/original_repo_all_$TS.zip"
          ECHO_SH=".github/echo_zip/zip_original_repo_$TS.sh"
          LOG_FILE=".github/echo_logs/zip_original_repo_$TS.log"
          echo "echo 'zip -r $ZIP_FILE .'" | tee -a "$ECHO_SH"
          echo "zip -r $ZIP_FILE ." >> "$ECHO_SH"
          echo "[INFO] $(date '+%F %T') zip -r $ZIP_FILE ." | tee -a "$LOG_FILE"
          zip -r "$ZIP_FILE" . | tee -a "$LOG_FILE"
          echo "echo '[OK] 현재 저장소 전체 ZIP → $ZIP_FILE'" | tee -a "$ECHO_SH"
          echo "[OK] 현재 저장소 전체 ZIP → $ZIP_FILE" | tee -a "$LOG_FILE"
          chmod +x "$ECHO_SH"

      - name: 🛠️ [2] gh CLI 설치
        run: |
          type gh || (sudo apt-get update -y && sudo apt-get install -y gh)
          gh --version | tee .github/echo_logs/gh_cli_version.log

      - name: 🛠️ [3] davidkims/springboot 저장소 복제 (GH_TOKEN 사용, 재시도)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CLONE_DIR="springboot_clone"
          ECHO_CLONE=".github/echo_zip/clone_repo.sh"
          LOG_CLONE=".github/echo_logs/clone_repo.log"

          if [ -d "$CLONE_DIR" ]; then
            echo "기존 $CLONE_DIR 디렉토리 삭제" | tee -a "$LOG_CLONE"
            rm -rf "$CLONE_DIR"
          fi

          echo "echo 'gh repo clone davidkims/springboot $CLONE_DIR'" | tee -a "$ECHO_CLONE"
          echo "gh repo clone davidkims/springboot $CLONE_DIR" >> "$ECHO_CLONE"

          MAX_RETRY=3
          COUNT=0
          SUCCESS=0
          until [ $COUNT -ge $MAX_RETRY ]; do
            gh repo clone davidkims/springboot "$CLONE_DIR" 2>&1 | tee -a "$LOG_CLONE"
            if [ -d "$CLONE_DIR" ] && [ -f "$CLONE_DIR/README.md" ]; then
              SUCCESS=1
              break
            fi
            COUNT=$((COUNT+1))
            echo "[RETRY] gh repo clone 시도 $COUNT / $MAX_RETRY" | tee -a "$LOG_CLONE"
            sleep 2
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "[ERROR] springboot_clone 복제 실패! 워크플로우 실패 처리" | tee -a "$LOG_CLONE"
            exit 1
          fi

      - name: 🗂️ [4] 복제된 저장소 전체 zip 압축 (에코/로그)
        run: |
          TS=$(date +%Y%m%d_%H%M%S)
          CLONE_DIR="springboot_clone"
          ZIP_FILE=".github/zip_backup/clone_repo_all_$TS.zip"
          ECHO_SH=".github/echo_zip/zip_clone_repo_$TS.sh"
          LOG_FILE=".github/echo_logs/zip_clone_repo_$TS.log"
          echo "echo 'zip -r $ZIP_FILE $CLONE_DIR'" | tee -a "$ECHO_SH"
          echo "zip -r $ZIP_FILE $CLONE_DIR" >> "$ECHO_SH"
          echo "[INFO] $(date '+%F %T') zip -r $ZIP_FILE $CLONE_DIR" | tee -a "$LOG_FILE"
          zip -r "$ZIP_FILE" "$CLONE_DIR" | tee -a "$LOG_FILE"
          echo "echo '[OK] 복제된 저장소 전체 ZIP → $ZIP_FILE'" | tee -a "$ECHO_SH"
          echo "[OK] 복제된 저장소 전체 ZIP → $ZIP_FILE" | tee -a "$LOG_FILE"
          chmod +x "$ECHO_SH"

      - name: 📋 결과 확인/검증(에코/로그/ls)
        run: |
          echo "echo 'ls -al .github/zip_backup'" | tee -a .github/echo_zip/ls_zip_backup.sh
          ls -al .github/zip_backup | tee -a .github/echo_logs/ls_zip_backup.log
          echo "echo 'ls -al .github/echo_zip'" | tee -a .github/echo_zip/ls_echo_zip.sh
          ls -al .github/echo_zip | tee -a .github/echo_logs/ls_echo_zip.log
          echo "echo 'ls -al .github/echo_logs'" | tee -a .github/echo_zip/ls_echo_logs.sh
          ls -al .github/echo_logs | tee -a .github/echo_logs/ls_echo_logs.log
          echo "echo 'ls -al springboot_clone'" | tee -a .github/echo_zip/ls_clone_dir.sh
          ls -al springboot_clone | tee -a .github/echo_logs/ls_clone_dir.log || echo "복제 디렉토리 없음"
