name: "🔒 Integrated Blacklist Generator (1-min · mandatory DC · keyless-safe · echo · mass dirs · cache-safe)"

on:
  schedule:
    - cron: "*/1 * * * *"   # every minute (GitHub may delay/skip)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: blacklist-integrated
  cancel-in-progress: true

env:
  # Root/output dirs
  BLACKLIST_DIR: .github/blacklist
  REPORT_DIR: .github/blacklist/report
  EXPORT_DIR: .github/blacklist/export
  SNAPSHOT_DIR: .github/blacklist/snapshots
  ARCHIVE_DIR: .github/blacklist/archive
  LATEST_DIR: .github/blacklist/latest

  # Sub trees
  NET_DIR: .github/blacklist/networks
  PKG_DIR: .github/blacklist/packages
  CODE_DIR: .github/blacklist/code
  SUMMARY_DIR: .github/blacklist/summary

  # Free feeds toggles
  ENABLE_SPAMHAUS: "true"
  ENABLE_EMERGING_THREATS: "true"

  # Local/free tools
  ENABLE_PY_AUDIT: "auto"
  ENABLE_NPM_AUDIT: "auto"
  ENABLE_SEMGREP: "true"

  # Dependency-Check
  DC_VERSION: "9.2.0"
  DC_HOME: /opt/dependency-check
  # DC_DATA is set at runtime from $RUNNER_TEMP (see init step)
  # NVD_API_KEY intentionally NOT required

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: "📂 Checkout"
        uses: actions/checkout@v4

      - name: "🧭 Init (env/time/temp paths)"
        id: init
        shell: bash
        run: |
          set -euo pipefail
          RUN_DATE_UTC="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "RUN_DATE_UTC=${RUN_DATE_UTC}" >> "$GITHUB_ENV"
          echo "LOGFILE=.github/blacklist/logs/run_${RUN_DATE_UTC}.log" >> "$GITHUB_ENV"
          echo "DC_DATA=${RUNNER_TEMP}/dc-data" >> "$GITHUB_ENV"
          echo "dc_data=${RUNNER_TEMP}/dc-data" >> "$GITHUB_OUTPUT"
          echo "run_date=${RUN_DATE_UTC}" >> "$GITHUB_OUTPUT"
          echo "[ECHO] ▶ Workflow start @ ${RUN_DATE_UTC}"
          echo "[ECHO] Runner temp: ${RUNNER_TEMP}"

      - name: "🧰 Ensure base packages (apt)"
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] Installing base packages"
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends curl unzip jq git python3-pip
          if ! command -v node >/dev/null 2>&1; then
            echo "[WARN] node not found, installing nodejs/npm"
            sudo apt-get install -y --no-install-recommends nodejs npm
          fi
          python3 -m pip install --user --upgrade pip pip-audit || true
          python3 -m pip install --user semgrep || true
          echo "[ECHO] Base tools ready"

      - name: "📁 Create mass directories"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "$BLACKLIST_DIR"/{raw,dist,logs} \
            "$REPORT_DIR" \
            "$EXPORT_DIR"/{json,txt,csv,html} \
            "$SNAPSHOT_DIR" "$ARCHIVE_DIR" "$LATEST_DIR" \
            "$NET_DIR"/{spamhaus,et,all} \
            "$PKG_DIR"/{python,npm,dc} \
            "$CODE_DIR"/semgrep \
            "$SUMMARY_DIR"
          SNAP_DIR="$SNAPSHOT_DIR/$RUN_DATE_UTC"
          mkdir -p "$SNAP_DIR"/{networks,packages,code,summary,logs}
          echo "SNAP_DIR=$SNAP_DIR" >> "$GITHUB_ENV"
          echo "[ECHO] Directories created (snapshot: $SNAP_DIR)" | tee -a "$LOGFILE"

      - name: "🗂️ Bootstrap placeholders (echo)"
        shell: bash
        run: |
          set -euo pipefail
          echo "# Blacklist Outputs" > "$BLACKLIST_DIR/README.md"
          echo "{ \"generated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"version\": 1 }" > "$BLACKLIST_DIR/manifest.json"
          # dotfiles to keep dirs
          while read -r d; do touch "$d/.gitkeep"; done <<'EOF'
          .github/blacklist
          .github/blacklist/report
          .github/blacklist/export
          .github/blacklist/export/json
          .github/blacklist/export/txt
          .github/blacklist/export/csv
          .github/blacklist/export/html
          .github/blacklist/snapshots
          .github/blacklist/archive
          .github/blacklist/latest
          .github/blacklist/networks
          .github/blacklist/networks/spamhaus
          .github/blacklist/networks/et
          .github/blacklist/networks/all
          .github/blacklist/packages
          .github/blacklist/packages/python
          .github/blacklist/packages/npm
          .github/blacklist/packages/dc
          .github/blacklist/code
          .github/blacklist/code/semgrep
          .github/blacklist/summary
          EOF
          echo "[ECHO] Placeholders ready" | tee -a "$LOGFILE"

      - name: "💾 Cache DC data (restore)"
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: ${{ steps.init.outputs.dc_data }}
          key: dc-data-${{ env.DC_VERSION }}-${{ runner.os }}
          restore-keys: |
            dc-data-${{ env.DC_VERSION }}-
            dc-data-

      - name: "🏗️ Prepare IDC (DC_HOME/DC_DATA dirs)"
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] Prepare IDC dirs"
          sudo mkdir -p "${DC_HOME}" || true
          mkdir -p "${DC_DATA}" || true
          sudo chmod -R 755 "${DC_HOME}" || true
          echo "[ECHO] DC_HOME=${DC_HOME}, DC_DATA=${DC_DATA}"

      - name: "⬇️ Install Dependency-Check (zip → /opt)"
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] Installing DC v${DC_VERSION}"
          cd "${RUNNER_TEMP}"
          rm -f dependency-check.zip || true
          URL="https://github.com/jeremylong/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip"
          for i in 1 2 3; do
            if curl -fsSL -o dependency-check.zip "$URL"; then break; fi
            echo "[WARN] DC zip download retry $i"
            sleep $((i*2))
          done
          if [ ! -s dependency-check.zip ]; then
            echo "[WARN] DC zip download failed → placeholder mode"
            echo "DC_READY=false" >> "$GITHUB_ENV"
          else
            rm -rf "${RUNNER_TEMP}/dependency-check-unzip" && mkdir -p "${RUNNER_TEMP}/dependency-check-unzip"
            if unzip -q dependency-check.zip -d "${RUNNER_TEMP}/dependency-check-unzip"; then
              CANDIDATE="$(find "${RUNNER_TEMP}/dependency-check-unzip" -maxdepth 1 -type d -name 'dependency-check*' | head -n1 || true)"
              if [ -n "$CANDIDATE" ]; then
                sudo rm -rf "${DC_HOME}"
                sudo mv "$CANDIDATE" "${DC_HOME}"
                sudo chmod +x "${DC_HOME}/bin/dependency-check.sh" || true
                echo "DC_READY=true" >> "$GITHUB_ENV"
                echo "[ECHO] DC installed to ${DC_HOME}"
              else
                echo "DC_READY=false" >> "$GITHUB_ENV"
                echo "[WARN] DC folder not found → placeholder mode"
              fi
            else
              echo "DC_READY=false" >> "$GITHUB_ENV"
              echo "[WARN] unzip failed → placeholder mode"
            fi
          fi

      - name: "🌐 Spamhaus/ET fetch (fail-safe)"
        shell: bash
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          # Spamhaus
          echo "[ECHO] Spamhaus fetch start"
          {
            curl -fsSL https://www.spamhaus.org/drop/drop.txt  | grep -v '^;' || true
            echo
            curl -fsSL https://www.spamhaus.org/drop/edrop.txt | grep -v '^;' || true
          } > "$BLACKLIST_DIR/raw/spamhaus_all.txt" || true
          awk '{print $1}' "$BLACKLIST_DIR/raw/spamhaus_all.txt" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+' || true > "$BLACKLIST_DIR/dist/ip_blacklist_spamhaus.txt"
          cp -f "$BLACKLIST_DIR/dist/ip_blacklist_spamhaus.txt" "$NET_DIR/all/ip_blacklist_spamhaus.txt" || echo -n > "$NET_DIR/all/ip_blacklist_spamhaus.txt"
          echo "[ECHO] Spamhaus IP count: $(wc -l < "$NET_DIR/all/ip_blacklist_spamhaus.txt" 2>/dev/null || echo 0)"

          # Emerging Threats
          echo "[ECHO] Emerging Threats fetch start"
          curl -fsSL https://rules.emergingthreats.net/blockrules/compromised-ips.txt \
            -o "$BLACKLIST_DIR/raw/et_compromised.txt" || true
          sort -u "$BLACKLIST_DIR/raw/et_compromised.txt" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+' || true > "$BLACKLIST_DIR/dist/ip_blacklist_et.txt"
          cp -f "$BLACKLIST_DIR/dist/ip_blacklist_et.txt" "$NET_DIR/all/ip_blacklist_et.txt" || echo -n > "$NET_DIR/all/ip_blacklist_et.txt"
          echo "[ECHO] ET IP count: $(wc -l < "$NET_DIR/all/ip_blacklist_et.txt" 2>/dev/null || echo 0)"

      - name: "🐍 pip-audit (auto, safe)"
        if: env.ENABLE_PY_AUDIT == 'true' || env.ENABLE_PY_AUDIT == 'auto'
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] pip-audit start"
          if ls requirements*.txt pyproject.toml setup.cfg setup.py 2>/dev/null | grep -q .; then
            (python3 -m pip_audit -f json || true) > "$PKG_DIR/python/pip_audit.json" 2>/dev/null || echo "{}" > "$PKG_DIR/python/pip_audit.json"
          else
            echo "{}" > "$PKG_DIR/python/pip_audit.json"
            echo "[ECHO] No Python lockfiles → skip"
          fi

      - name: "🧪 safety (keyless-safe output)"
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] safety start"
          python3 -m pip install --user safety || true
          # Always produce a JSON (even if empty)
          if python3 -m safety check --bare >/dev/null 2>&1; then
            (python3 -m safety check --json || true) > "$PKG_DIR/python/safety.json" 2>/dev/null || echo "{}" > "$PKG_DIR/python/safety.json"
          else
            echo "{}" > "$PKG_DIR/python/safety.json"
          fi

      - name: "📦 npm audit (auto, safe)"
        if: env.ENABLE_NPM_AUDIT == 'true' || env.ENABLE_NPM_AUDIT == 'auto'
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] npm audit start"
          if ls package-lock.json yarn.lock pnpm-lock.yaml 2>/dev/null | grep -q .; then
            (npm audit --json || true) > "$PKG_DIR/npm/npm_audit.json" 2>/dev/null || echo "{}" > "$PKG_DIR/npm/npm_audit.json"
          else
            echo "{}" > "$PKG_DIR/npm/npm_audit.json"
            echo "[ECHO] No JS lockfiles → skip"
          fi

      - name: "🔎 Semgrep (safe)"
        if: env.ENABLE_SEMGREP == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] Semgrep start"
          (python3 -m semgrep --config p/ci --json --exclude .git || true) > "$CODE_DIR/semgrep/semgrep.json" 2>/dev/null || echo "{}" > "$CODE_DIR/semgrep/semgrep.json"
          echo "[ECHO] Semgrep done"

      - name: "💾 Cache DC data (save)"
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.init.outputs.dc_data }}
          key: dc-data-${{ env.DC_VERSION }}-${{ runner.os }}

      - name: "🛡️ Dependency-Check run (keyless multi-fallback)"
        shell: bash
        env:
          NVD_API_KEY: ""   # intentionally empty (keyless)
        run: |
          set -e
          echo "[ECHO] DC execution start" | tee -a "$LOGFILE"
          mkdir -p "$PKG_DIR/dc" "$EXPORT_DIR/json" "$EXPORT_DIR/html"

          if [ "${DC_READY:-false}" != "true" ] || [ ! -x "${DC_HOME}/bin/dependency-check.sh" ]; then
            echo "[WARN] DC not installed → creating placeholders" | tee -a "$LOGFILE"
            echo "{}" > "$PKG_DIR/dc/dc_report.json"
            echo "<html><body>no report</body></html>" > "$PKG_DIR/dc/dc_report.html"
          else
            # Common args
            DC_ARGS=( --project "BlacklistScan"
                      --scan "."
                      --format JSON --format HTML
                      --out "$PKG_DIR/dc"
                      --data "$DC_DATA"
                      --failOnCVSS 0
                      --cveValidForHours 8760 )
            # If we truly want to respect keyless limits, add a delay to reduce 403
            DC_ARGS+=("--nvdApiDelay" "6000")

            # Try 1: normal run (may 403 without key)
            if ! "${DC_HOME}/bin/dependency-check.sh" "${DC_ARGS[@]}"; then
              echo "[WARN] DC try#1 failed → trying --noupdate" | tee -a "$LOGFILE"
              # Try 2: no update (works if cache already exists)
              if ! "${DC_HOME}/bin/dependency-check.sh" "${DC_ARGS[@]}" --noupdate; then
                echo "[WARN] DC try#2 (--noupdate) failed → placeholders" | tee -a "$LOGFILE"
                echo "{}" > "$PKG_DIR/dc/dc_report.json"
                echo "<html><body>no report</body></html>" > "$PKG_DIR/dc/dc_report.html"
              fi
            fi

            # Normalize filenames (if produced)
            [ -f "$PKG_DIR/dc/dependency-check-report.json" ] && mv -f "$PKG_DIR/dc/dependency-check-report.json" "$PKG_DIR/dc/dc_report.json"
            [ -f "$PKG_DIR/dc/dependency-check-report.html" ] && mv -f "$PKG_DIR/dc/dependency-check-report.html" "$PKG_DIR/dc/dc_report.html"
            [ -f "$PKG_DIR/dc/dc_report.json" ] || echo "{}" > "$PKG_DIR/dc/dc_report.json"
            [ -f "$PKG_DIR/dc/dc_report.html" ] || echo "<html><body>no report</body></html>" > "$PKG_DIR/dc/dc_report.html"
          fi

          # Export copies
          cp -f "$PKG_DIR/dc/dc_report.json" "$EXPORT_DIR/json/dc_report.json" || echo "{}" > "$EXPORT_DIR/json/dc_report.json"
          cp -f "$PKG_DIR/dc/dc_report.html" "$EXPORT_DIR/html/dc_report.html" || echo "<html><body>no report</body></html>" > "$EXPORT_DIR/html/dc_report.html"
          echo "[ECHO] DC execution finished" | tee -a "$LOGFILE"

      - name: "🧾 Summary (safe, no glob errors)"
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] Summary generation"
          SUMMARY_JSON="$SUMMARY_DIR/summary_${RUN_DATE_UTC}.json"
          SUMMARY_MD="$SUMMARY_DIR/summary_${RUN_DATE_UTC}.md"

          # JSON summary
          {
            echo "{"
            echo "  \"run_at_utc\": \"${RUN_DATE_UTC}\","
            echo "  \"spamhaus_count\": $(wc -l < "$NET_DIR/all/ip_blacklist_spamhaus.txt" 2>/dev/null || echo 0),"
            echo "  \"et_count\": $(wc -l < "$NET_DIR/all/ip_blacklist_et.txt" 2>/dev/null || echo 0),"
            echo "  \"files\": {"
            find "$EXPORT_DIR" "$PKG_DIR/dc" -type f 2>/dev/null | while read -r f; do
              sz=$(wc -c < "$f" 2>/dev/null || echo 0)
              bn="${f#./}"
              echo "    \"${bn}\": ${sz},"
            done
            echo "    \"_end\": 0"
            echo "  }"
            echo "}"
          } > "$SUMMARY_JSON"

          # MD summary
          {
            echo "# Blacklist Summary (${RUN_DATE_UTC})"
            echo
            echo "- Spamhaus: $(wc -l < "$NET_DIR/all/ip_blacklist_spamhaus.txt" 2>/dev/null || echo 0) IPs"
            echo "- EmergingThreats: $(wc -l < "$NET_DIR/all/ip_blacklist_et.txt" 2>/dev/null || echo 0) IPs"
            echo
            echo "## Files (bytes)"
            find "$EXPORT_DIR" "$PKG_DIR/dc" -type f 2>/dev/null | while read -r f; do
              sz=$(wc -c < "$f" 2>/dev/null || echo 0)
              echo "- ${f#./}: $sz"
            done
          } > "$SUMMARY_MD"

          # Console preview
          echo "[ECHO] ===== Result files ====="
          find "$EXPORT_DIR" "$PKG_DIR/dc" -type f 2>/dev/null | while read -r f; do
            sz=$(wc -c < "$f" 2>/dev/null || echo 0)
            echo "[ECHO] file: ${f#./}, size(bytes): ${sz}"
          done
          echo "[ECHO] ========================"

      - name: "🗃️ Snapshot & latest sync"
        shell: bash
        run: |
          set -e
          echo "[ECHO] Snapshot & latest sync"
          SNAP_DIR="$SNAP_DIR"
          mkdir -p "$SNAP_DIR"
          rsync -a "$BLACKLIST_DIR/" "$SNAP_DIR/" --exclude "snapshots/*" --exclude ".git" || true
          rm -rf "$LATEST_DIR" && mkdir -p "$LATEST_DIR"
          rsync -a "$EXPORT_DIR/" "$LATEST_DIR/" || true

      - name: "📝 Commit changes (if any) with rebase"
        shell: bash
        run: |
          set -e
          echo "[ECHO] Commit & push (if changed)" | tee -a "$LOGFILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$BLACKLIST_DIR" || true
          if ! git diff --cached --quiet; then
            git fetch --unshallow || true
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git commit -m "chore(blacklist): update outputs @ ${RUN_DATE_UTC}"
            git push || (git pull --rebase && git push)
            echo "[ECHO] Pushed updates" | tee -a "$LOGFILE"
          else
            echo "[ECHO] No changes to commit" | tee -a "$LOGFILE"
          fi
