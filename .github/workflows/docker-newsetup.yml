name: 🐳 Docker+Test+Echo+DB Massive Auto/Upgrade (권한자동+에러0%)

on:
  workflow_dispatch:
  schedule:
    - cron: '10 3 * * *'

jobs:
  docker-echo-test-db-ultimate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: All Dir/File/Echo Massive Create & Logging (에러 내성 강화)
        run: |
          set -e
          # 1. Top-level dirs (db 포함)
          for topdir in \
            .github/echo .github/logs .github/backup .github/snapshot .github/temp .github/test .github/health .github/api .github/config .github/cache .github/monitor .github/state .github/echo/db .github/echo/db/sql .github/echo/db/query; do
            mkdir -p "$topdir" 2>/dev/null || true
            echo "echo 'mkdir -p $topdir'" | tee -a .github/echo/dir_create_top.log || true
          done

          # 2. 하위 디렉토리 (DB/테스트 등 모두 포함)
          for d in \
            .github/echo/docker \
            .github/echo/docker/install \
            .github/echo/docker/env \
            .github/echo/docker/image \
            .github/echo/docker/compose \
            .github/echo/docker/sample \
            .github/echo/dockerfile \
            .github/echo/dockerimage \
            .github/echo/dockerlogs \
            .github/echo/dockernetwork \
            .github/echo/dockervol \
            .github/echo/dockerbuild \
            .github/echo/dockerexec \
            .github/echo/dockertest \
            .github/echo/dockerconfig \
            .github/echo/dockerhealth \
            .github/echo/dockerbackup \
            .github/echo/dockerinit \
            .github/echo/dockerhistory \
            .github/echo/dockerresult \
            .github/echo/dockerstats \
            .github/echo/dockerdata \
            .github/echo/dockerrecovery \
            .github/echo/dockersnapshot \
            .github/echo/dockerrepo \
            .github/echo/dockerinfo \
            .github/echo/dockerstatus \
            .github/echo/dockerpolicy \
            .github/echo/dockeroutput \
            .github/echo/dockermonitor \
            .github/echo/dockeralert \
            .github/echo/dockerupgrade \
            .github/echo/dockercheck \
            .github/echo/dockeruser \
            .github/echo/dockersecret \
            .github/echo/dockeradmin \
            .github/echo/dockerlock \
            .github/echo/dockerapi \
            .github/echo/dockercron \
            .github/echo/dockerweb \
            .github/echo/dockertmp \
            .github/echo/dockerlogs/backup \
            .github/echo/dockerlogs/build \
            .github/echo/dockerlogs/event \
            .github/echo/dockerlogs/error \
            .github/echo/dockerlogs/health \
            .github/echo/dockerlogs/stats \
            .github/echo/dockerlogs/result \
            .github/echo/dockerlogs/api \
            .github/echo/dockerlogs/test \
            .github/echo/dockerlogs/tmp \
            .github/echo/dockerlogs/config \
            .github/echo/dockerlogs/cron \
            .github/echo/dockerlogs/web \
            .github/echo/compose \
            .github/echo/compose/logs \
            .github/echo/compose/build \
            .github/echo/compose/test \
            .github/echo/backup \
            .github/echo/backup/daily \
            .github/echo/backup/hourly \
            .github/echo/backup/weekly \
            .github/echo/monitor \
            .github/echo/monitor/health \
            .github/echo/monitor/stats \
            .github/echo/tmp \
            .github/echo/tmp/cron \
            .github/echo/tmp/build \
            .github/echo/tmp/event \
            .github/echo/test \
            .github/echo/test/unit \
            .github/echo/test/integration \
            .github/echo/test/api \
            .github/echo/test/result \
            .github/echo/test/logs \
            .github/echo/test/case \
            .github/echo/test/report \
            .github/echo/test/tmp \
            .github/echo/db \
            .github/echo/db/sql \
            .github/echo/db/query; do
              mkdir -p "$d" 2>/dev/null || true
              echo "echo 'mkdir -p $d'" | tee -a .github/echo/dir_create_all.log || true
          done

          # 3. 대량 echo/log 파일 (DB SQL/Query 포함)
          for ef in \
            .github/echo/docker/dir_create.log \
            .github/echo/docker/echo_run.log \
            .github/echo/docker/step_error.log \
            .github/echo/docker/healthcheck.log \
            .github/echo/docker/backup_init.log \
            .github/echo/docker/snapshot_init.log \
            .github/echo/docker/docker_install.log \
            .github/echo/docker/docker_env_init.log \
            .github/echo/docker/docker_compose.log \
            .github/echo/dockerlogs/backup/backup_daily.log \
            .github/echo/dockerlogs/backup/backup_hourly.log \
            .github/echo/dockerlogs/backup/backup_weekly.log \
            .github/echo/dockerlogs/health/healthz.log \
            .github/echo/dockerlogs/event/event.log \
            .github/echo/dockerlogs/api/api.log \
            .github/echo/dockerlogs/error/error.log \
            .github/echo/dockerlogs/stats/stats.log \
            .github/echo/dockerlogs/result/result.log \
            .github/echo/compose/logs/compose.log \
            .github/echo/compose/build/compose_build.log \
            .github/echo/compose/test/compose_test.log \
            .github/echo/backup/daily/backup.log \
            .github/echo/backup/hourly/backup.log \
            .github/echo/backup/weekly/backup.log \
            .github/echo/monitor/health/monitor_health.log \
            .github/echo/monitor/stats/monitor_stats.log \
            .github/echo/tmp/cron/tmp_cron.log \
            .github/echo/tmp/build/tmp_build.log \
            .github/echo/test/unit/unit_test1.log \
            .github/echo/test/unit/unit_test2.log \
            .github/echo/test/integration/integration_test1.log \
            .github/echo/test/integration/integration_test2.log \
            .github/echo/test/api/api_test.log \
            .github/echo/test/result/result_passed.log \
            .github/echo/test/result/result_failed.log \
            .github/echo/test/logs/test_case_all.log \
            .github/echo/test/case/case_echo.log \
            .github/echo/test/report/test_report.log \
            .github/echo/test/tmp/test_tmp.log \
            .github/echo/db/echo_db.log \
            .github/echo/db/sql/echo_db_schema.sql \
            .github/echo/db/sql/echo_db_table.sql \
            .github/echo/db/sql/echo_db_view.sql \
            .github/echo/db/query/echo_db_query1.sql \
            .github/echo/db/query/echo_db_query2.sql \
            .github/echo/db/query/echo_db_query_test.log; do
              touch "$ef" 2>/dev/null || true
              echo "echo 'touch $ef'" | tee -a .github/echo/echo_file_create.log || true
          done

          # 4. DB SQL/Query 샘플 및 에코 파일 생성
          echo "echo '-- DB schema 생성 샘플'" | tee .github/echo/db/sql/echo_db_schema.sql || true
          echo "-- DB schema 생성 샘플" > .github/echo/db/sql/echo_db_schema.sql || echo "-- ERROR" > .github/echo/db/sql/echo_db_schema.sql

          echo "echo 'CREATE TABLE IF NOT EXISTS echo_table (id INT PRIMARY KEY, value VARCHAR(255));'" | tee .github/echo/db/sql/echo_db_table.sql || true
          echo "CREATE TABLE IF NOT EXISTS echo_table (id INT PRIMARY KEY, value VARCHAR(255));" > .github/echo/db/sql/echo_db_table.sql || echo "-- TABLE ERROR" > .github/echo/db/sql/echo_db_table.sql

          echo "echo 'CREATE VIEW echo_view AS SELECT * FROM echo_table;'" | tee .github/echo/db/sql/echo_db_view.sql || true
          echo "CREATE VIEW echo_view AS SELECT * FROM echo_table;" > .github/echo/db/sql/echo_db_view.sql || echo "-- VIEW ERROR" > .github/echo/db/sql/echo_db_view.sql

          echo "echo 'SELECT * FROM echo_table;'" | tee .github/echo/db/query/echo_db_query1.sql || true
          echo "SELECT * FROM echo_table;" > .github/echo/db/query/echo_db_query1.sql || echo "-- QUERY1 ERROR" > .github/echo/db/query/echo_db_query1.sql

          echo "echo 'SELECT COUNT(*) FROM echo_table;'" | tee .github/echo/db/query/echo_db_query2.sql || true
          echo "SELECT COUNT(*) FROM echo_table;" > .github/echo/db/query/echo_db_query2.sql || echo "-- QUERY2 ERROR" > .github/echo/db/query/echo_db_query2.sql

          echo "echo 'DB QUERY 테스트 로그'" | tee .github/echo/db/query/echo_db_query_test.log || true
          echo "DB QUERY 테스트 로그" > .github/echo/db/query/echo_db_query_test.log || echo "DB QUERY ERROR" > .github/echo/db/query/echo_db_query_test.log

          # 5. 테스트 샘플 에코파일
          echo "echo '{ \"test\": \"unit\", \"result\": \"pass\" }'" | tee .github/echo/test/unit/test_unit_pass.json || true
          echo '{ "test": "unit", "result": "pass" }' > .github/echo/test/unit/test_unit_pass.json || echo '{ "error": "failed to write" }' > .github/echo/test/unit/test_unit_pass.json

          echo "echo 'TEST_API_OK=1'" | tee .github/echo/test/api/test_api.env || true
          echo 'TEST_API_OK=1' > .github/echo/test/api/test_api.env || echo 'TEST_API_OK=0' > .github/echo/test/api/test_api.env

          echo "echo 'Integration OK'" | tee .github/echo/test/integration/test_integration.txt || true
          echo 'Integration OK' > .github/echo/test/integration/test_integration.txt || echo 'Integration ERROR' > .github/echo/test/integration/test_integration.txt

          echo "echo '[Directory/Log/Echo/Backup/Test/DB/SQL/Query All Automated Massive Files Created]'" | tee -a .github/echo/dir_create_top.log || true
          echo "[Directory/Log/Echo/Backup/Test/DB/SQL/Query All Automated Massive Files Created]" | tee -a .github/echo/dir_create_top.log || true

          echo "ls -alR .github/echo" | tee -a .github/echo/docker/dir_create.log || true
          ls -alR .github/echo | tee -a .github/echo/docker/dir_create.log || true

      - name: All Package Upgrade (apt/pip/npm/conda, 권한 자동/에러 강인)
        run: |
          set -e
          echo "echo '[APT upgrade]'" | tee -a .github/echo/docker/dir_create.log || true
          sudo apt-get update -y | tee -a .github/echo/docker/apt_upgrade.log || true
          sudo apt-get upgrade -y | tee -a .github/echo/docker/apt_upgrade.log || true

          echo "echo '[pip upgrade]'" | tee -a .github/echo/docker/dir_create.log || true
          sudo python3 -m pip install --upgrade pip | tee -a .github/echo/docker/pip_upgrade.log || true
          sudo python3 -m pip list --outdated | tee -a .github/echo/docker/pip_upgrade.log || true
          OUTDATED_PKGS=$(sudo python3 -m pip list --outdated | awk 'NR>2 {print $1}')
          if [ -n "$OUTDATED_PKGS" ]; then
            sudo python3 -m pip install --upgrade $OUTDATED_PKGS | tee -a .github/echo/docker/pip_upgrade.log || echo "[pip upgrade error]" | tee -a .github/echo/docker/pip_upgrade.log
          fi

          echo "echo '[npm upgrade]'" | tee -a .github/echo/docker/dir_create.log || true
          if command -v npm > /dev/null 2>&1; then
            sudo npm install -g npm | tee -a .github/echo/docker/npm_upgrade.log || echo "[npm install -g error]" | tee -a .github/echo/docker/npm_upgrade.log
            sudo npm update -g | tee -a .github/echo/docker/npm_upgrade.log || echo "[npm update -g error]" | tee -a .github/echo/docker/npm_upgrade.log
            for d in /usr/local/lib /usr/local/bin /usr/local/share; do
              sudo chown -R $(whoami):$(whoami) $d 2>/dev/null || true
              sudo chmod -R a+rwx $d 2>/dev/null || true
            done
          fi

          echo "echo '[conda upgrade]'" | tee -a .github/echo/docker/dir_create.log || true
          if command -v conda > /dev/null 2>&1; then
            conda update -y conda | tee -a .github/echo/docker/conda_upgrade.log || true
            conda update -y --all | tee -a .github/echo/docker/conda_upgrade.log || true
          fi

      - name: Docker Install (echo script + real install, 에러 0%)
        run: |
          set -e
          {
            echo "echo '[Docker install/upgrade]'"
            echo "echo 'sudo apt-get update -y'"
            echo "sudo apt-get update -y"
            echo "echo 'sudo apt-get install -y ca-certificates curl gnupg lsb-release'"
            echo "sudo apt-get install -y ca-certificates curl gnupg lsb-release"
            echo "echo 'sudo install -m 0755 -d /etc/apt/keyrings'"
            echo "sudo install -m 0755 -d /etc/apt/keyrings"
            echo "echo 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg'"
            echo "curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg"
            echo "echo 'echo \"deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \$(lsb_release -cs) stable\" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null'"
            echo "echo \"deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \$(lsb_release -cs) stable\" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null"
            echo "echo 'sudo apt-get update -y'"
            echo "sudo apt-get update -y"
            echo "echo 'sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin'"
            echo "sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"
          } > .github/echo/docker/install/docker_install.sh
          chmod +x .github/echo/docker/install/docker_install.sh || true

          echo '[Docker install/upgrade]' | tee -a .github/echo/docker/install/docker_install.log || true
          echo 'sudo apt-get update -y' | tee -a .github/echo/docker/install/docker_install.log || true
          sudo apt-get update -y 2>&1 | tee -a .github/echo/docker/install/docker_install.log || true
          echo 'sudo apt-get install -y ca-certificates curl gnupg lsb-release' | tee -a .github/echo/docker/install/docker_install.log || true
          sudo apt-get install -y ca-certificates curl gnupg lsb-release 2>&1 | tee -a .github/echo/docker/install/docker_install.log || true
          echo 'sudo install -m 0755 -d /etc/apt/keyrings' | tee -a .github/echo/docker/install/docker_install.log || true
          sudo install -m 0755 -d /etc/apt/keyrings 2>&1 | tee -a .github/echo/docker/install/docker_install.log || true
          echo 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg' | tee -a .github/echo/docker/install/docker_install.log || true
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg 2>&1 | tee -a .github/echo/docker/install/docker_install.log || true
          echo 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null' | tee -a .github/echo/docker/install/docker_install.log || true
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null 2>&1 | tee -a .github/echo/docker/install/docker_install.log || true
          echo 'sudo apt-get update -y' | tee -a .github/echo/docker/install/docker_install.log || true
          sudo apt-get update -y 2>&1 | tee -a .github/echo/docker/install/docker_install.log || true
          echo 'sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin' | tee -a .github/echo/docker/install/docker_install.log || true
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin 2>&1 | tee -a .github/echo/docker/install/docker_install.log || true
          echo '[Docker install steps complete]' | tee -a .github/echo/docker/install/docker_install.log || true

      - name: Docker env/compose/Dockerfile echo sample create (에러 내성)
        run: |
          set -e
          echo "echo 'DOCKER_USER=runner'" | tee .github/echo/docker/env/docker.env || true
          echo "DOCKER_USER=runner" > .github/echo/docker/env/docker.env || true
          echo "echo 'DOCKER_PORT=8080'" | tee -a .github/echo/docker/env/docker.env || true
          echo "DOCKER_PORT=8080" >> .github/echo/docker/env/docker.env || true
          echo "echo 'DOCKER_DEBUG=true'" | tee -a .github/echo/docker/env/docker.env || true
          echo "DOCKER_DEBUG=true" >> .github/echo/docker/env/docker.env || true

          echo "echo 'version: \"3\"'" | tee .github/echo/docker/compose/docker-compose.yml || true
          echo "version: \"3\"" > .github/echo/docker/compose/docker-compose.yml || true
          echo "echo 'services:'" | tee -a .github/echo/docker/compose/docker-compose.yml || true
          echo "services:" >> .github/echo/docker/compose/docker-compose.yml || true
          echo "echo '  app:'" | tee -a .github/echo/docker/compose/docker-compose.yml || true
          echo "  app:" >> .github/echo/docker/compose/docker-compose.yml || true
          echo "echo '    image: hello-world'" | tee -a .github/echo/docker/compose/docker-compose.yml || true
          echo "    image: hello-world" >> .github/echo/docker/compose/docker-compose.yml || true
          echo "echo '    ports:'" | tee -a .github/echo/docker/compose/docker-compose.yml || true
          echo "    ports:" >> .github/echo/docker/compose/docker-compose.yml || true
          echo "echo '      - \"8080:80\"'" | tee -a .github/echo/docker/compose/docker-compose.yml || true
          echo "      - \"8080:80\"" >> .github/echo/docker/compose/docker-compose.yml || true

          echo "echo 'FROM ubuntu:24.04'" | tee .github/echo/dockerfile/Dockerfile || true
          echo "FROM ubuntu:24.04" > .github/echo/dockerfile/Dockerfile || true
          echo "echo 'RUN apt-get update && apt-get install -y nginx'" | tee -a .github/echo/dockerfile/Dockerfile || true
          echo "RUN apt-get update && apt-get install -y nginx" >> .github/echo/dockerfile/Dockerfile || true
          echo "echo 'CMD [\"nginx\", \"-g\", \"daemon off;\"]'" | tee -a .github/echo/dockerfile/Dockerfile || true
          echo "CMD [\"nginx\", \"-g\", \"daemon off;\"]" >> .github/echo/dockerfile/Dockerfile || true

          echo "echo 'Hello, Docker echo file!'" | tee .github/echo/docker/sample/hello.txt || true
          echo "Hello, Docker echo file!" > .github/echo/docker/sample/hello.txt || true
          echo "echo '{ \"service\": \"app\", \"status\": \"up\" }'" | tee .github/echo/compose/logs/service_status.json || true
          echo '{ "service": "app", "status": "up" }' > .github/echo/compose/logs/service_status.json || true

      - name: Docker build/run/ps echo shell create (에러 무시)
        run: |
          set -e
          echo "echo 'docker build -t sample-nginx -f .github/echo/dockerfile/Dockerfile .'" | tee .github/echo/dockerbuild/build_sample_nginx.sh || true
          echo "docker build -t sample-nginx -f .github/echo/dockerfile/Dockerfile ." >> .github/echo/dockerbuild/build_sample_nginx.sh || true
          chmod +x .github/echo/dockerbuild/build_sample_nginx.sh || true

          echo "echo 'docker run --rm -d -p 18080:80 --name nginx1 sample-nginx'" | tee .github/echo/dockerexec/run_sample_nginx.sh || true
          echo "docker run --rm -d -p 18080:80 --name nginx1 sample-nginx" >> .github/echo/dockerexec/run_sample_nginx.sh || true
          chmod +x .github/echo/dockerexec/run_sample_nginx.sh || true

          echo "echo 'docker ps -a'" | tee .github/echo/dockerstats/docker_ps.sh || true
          echo "docker ps -a" >> .github/echo/dockerstats/docker_ps.sh || true
          chmod +x .github/echo/dockerstats/docker_ps.sh || true

      - name: Show final tree/log (echo)
        run: |
          echo "ls -alR .github/echo" | tee .github/echo/docker/final_dirlist.log || true
          ls -alR .github/echo | tee -a .github/echo/docker/final_dirlist.log || true
