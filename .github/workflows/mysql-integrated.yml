name: 🐬 MySQL Full Setup, Migration & Auto Backup

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  mysql_full_pipeline:
    runs-on: ubuntu-latest

    env:
      MYSQL_IMAGE: mysql:8.0
      DB_NAME: example_db
      DB_USER: root
      DB_PASS: rootpass123
      ROOT_PASS: rootpass123
      MIGRATION_DIR: /opt/mysql/migrations
      BACKUP_DIR: /opt/backup/sql
      LEDGER_DIR: /opt/backup/ledgers

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Prepare Directories
        run: |
          echo "[+] Creating migration, backup, and ledger directories..."
          sudo mkdir -p "$MIGRATION_DIR" "$BACKUP_DIR" "$LEDGER_DIR"
          sudo chmod -R 777 /opt/mysql /opt/backup

      - name: 🗞️ Create SQL Migration File
        run: |
          echo "[+] Writing SQL migration file..."
          echo "
          CREATE TABLE IF NOT EXISTS accounts (
              id INT AUTO_INCREMENT PRIMARY KEY,
              name VARCHAR(50),
              balance DECIMAL(12,2)
          );
          CREATE TABLE IF NOT EXISTS corporate_transactions (
              transaction_id INT AUTO_INCREMENT PRIMARY KEY,
              corporate_name VARCHAR(100) NOT NULL,
              transaction_type VARCHAR(50) NOT NULL,
              amount DECIMAL(12,2) NOT NULL,
              transaction_date DATETIME DEFAULT CURRENT_TIMESTAMP
          );
          INSERT INTO accounts(name, balance) VALUES ('홍길동', 1000000);
          INSERT INTO corporate_transactions(corporate_name, transaction_type, amount) VALUES ('ABC Corporation', 'Purchase', 500000);
          INSERT INTO corporate_transactions(corporate_name, transaction_type, amount) VALUES ('XYZ Inc.', 'Sale', 250000);
          " | sudo tee "$MIGRATION_DIR/migrate.sql"

      - name: 🚪 Upgrade All & Install MySQL Server
        run: |
          echo "[+] Updating and upgrading all packages..."
          sudo apt-get update && sudo apt-get dist-upgrade -y || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server || { echo "❌ MySQL 설치 실패"; exit 1; }
          sudo find /etc/firefox /etc/apport/native-origins.d /etc/apport/blacklist.d -type d -empty -delete || true

      - name: 🔐 Reset Root Password in Safe Mode
        run: |
          echo "[+] Resetting MySQL root password..."
          sudo systemctl stop mysql
          sudo mkdir -p /var/run/mysqld
          sudo chown mysql:mysql /var/run/mysqld
          sudo mysqld_safe --skip-networking --skip-grant-tables &
          sleep 10
          echo "FLUSH PRIVILEGES; ALTER USER 'root'@'localhost' IDENTIFIED BY '${ROOT_PASS}'; FLUSH PRIVILEGES;" | sudo mysql -u root
          sudo killall mysqld
          sleep 5
          sudo systemctl start mysql || { echo "❌ MySQL 시작 실패"; exit 1; }

      - name: 🛠️ Setup Database and User
        run: |
          echo "[+] Creating database and granting permissions..."
          mysql -u root -p"$ROOT_PASS" -e "CREATE DATABASE IF NOT EXISTS $DB_NAME;"
          mysql -u root -p"$ROOT_PASS" -e "CREATE USER IF NOT EXISTS '$DB_USER'@'localhost' IDENTIFIED BY '$DB_PASS';"
          mysql -u root -p"$ROOT_PASS" -e "GRANT ALL PRIVILEGES ON $DB_NAME.* TO '$DB_USER'@'localhost';"
          mysql -u root -p"$ROOT_PASS" -e "FLUSH PRIVILEGES;"

      - name: 📅 Simulate Bulk Transactions
        run: |
          echo "[+] Generating transaction simulation SQL..."
          echo "USE $DB_NAME;" > simulate_transactions.sql
          for i in $(seq 1 60); do
            company="SimCorp_$i"
            type=$( [ $((i % 2)) -eq 0 ] && echo "Purchase" || echo "Sale" )
            amount=$(( RANDOM % 100000 + 10000 ))
            echo "INSERT INTO corporate_transactions(corporate_name, transaction_type, amount) VALUES ('$company', '$type', $amount);" >> simulate_transactions.sql
          done
          mysql -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" < simulate_transactions.sql

      - name: 📊 Run SQL Migration
        run: |
          echo "[+] Running migration SQL..."
          mysql -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" < "$MIGRATION_DIR/migrate.sql"

      - name: ✅ Verify Data
        run: |
          echo "[+] Verifying data..."
          mysql -u "$DB_USER" -p"$DB_PASS" -e "USE $DB_NAME; SHOW TABLES; SELECT * FROM accounts; SELECT COUNT(*) FROM corporate_transactions;"

      - name: 🕒 Generate Timestamp and Port
        id: vars
        run: |
          echo "[+] Generating timestamp and port..."
          echo "timestamp=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "container=backup-mysql-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "host_port=$((RANDOM%1000+3307))" >> "$GITHUB_OUTPUT"

      - name: 🚣 Launch MySQL Backup Container
        run: |
          echo "[+] Launching container..."
          docker run -d \
            --name "${{ steps.vars.outputs.container }}" \
            -e MYSQL_ROOT_PASSWORD="$DB_PASS" \
            -e MYSQL_DATABASE="$DB_NAME" \
            -p "${{ steps.vars.outputs.host_port }}:3306" \
            "$MYSQL_IMAGE"
          sleep 30 || { echo "❌ 컨테이너 시작 실패"; exit 1; }

      - name: 🔐 Create .my.cnf
        run: |
          echo "[+] Creating ~/.my.cnf file..."
          echo "[client]" > ~/.my.cnf
          echo "user=$DB_USER" >> ~/.my.cnf
          echo "password=$DB_PASS" >> ~/.my.cnf
          echo "host=127.0.0.1" >> ~/.my.cnf
          echo "port=${{ steps.vars.outputs.host_port }}" >> ~/.my.cnf
          chmod 600 ~/.my.cnf

      - name: 📂 mysqldump and Compress
        run: |
          echo "[+] Dumping and compressing backup..."
          TIMESTAMP="${{ steps.vars.outputs.timestamp }}"
          BACKUP_FILE="$BACKUP_DIR/backup-${TIMESTAMP}.sql"
          gzip -c <(mysqldump "$DB_NAME") > "${BACKUP_FILE}.gz" || { echo "❌ 백업 실패"; exit 1; }
          ls -lh "$BACKUP_DIR"

      - name: 🔍 Print Container Info
        run: |
          echo "📦 Container Name: ${{ steps.vars.outputs.container }}"

      - name: 📤 Generate Ledger File
        run: |
          echo "[+] Creating ledger file..."
          mysql -u "$DB_USER" -p"$DB_PASS" -e "SELECT * FROM $DB_NAME.corporate_transactions INTO OUTFILE '$LEDGER_DIR/corporate_ledger.csv' FIELDS TERMINATED BY ',' ENCLOSED BY '"' LINES TERMINATED BY '\n';" || echo "(로컬 컨테이너에서만 사용 가능 - 무시 가능)"

      - name: 📅 Upload Backup and Ledger
        uses: actions/upload-artifact@v4
        with:
          name: mysql-ledger-and-backup
          path: |
            ${{ env.BACKUP_DIR }}/*.gz
            ${{ env.LEDGER_DIR }}/*.csv
