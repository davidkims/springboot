name: 🐬 MySQL Cron Migration & Daily Query Regeneration

on:
  schedule:
    - cron: '*/5 * * * *'        # 매 5분마다 실행
    - cron: '0 23 * * *'         # (KST 기준) 다음날 08:00 → UTC 23:00 전일 실행
  workflow_dispatch:

jobs:
  mysql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass123
          MYSQL_DATABASE: sample_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 📁 Prepare Directories
        run: |
          mkdir -p sql
          mkdir -p export
          mkdir -p .github/migration
          echo "[✔] 디렉토리 생성 완료"

      - name: 🧹 Daily 08:00 초기화 시 기존 쿼리 삭제 및 새로 생성
        if: github.event.schedule == '0 23 * * *'
        run: |
          echo "[🌅] 아침 08시: 기존 쿼리 삭제 후 재생성"
          rm -f .github/migration/*.sql .github/migration/*.log

          # 신규 고객 정보 쿼리
          echo "SELECT * FROM customers WHERE DATE(registered_at) = CURDATE();" > .github/migration/daily_customers.sql

          # 신규 거래 정보 쿼리 (샘플: 거래 테이블이 있다 가정)
          echo "SELECT * FROM transactions WHERE DATE(transaction_time) = CURDATE();" > .github/migration/daily_transactions.sql

          echo "[✔] 신규 고객/거래 쿼리 생성 완료"
          ls -al .github/migration/

      - name: 🩺 Wait for MySQL Health or Restart
        run: |
          CID=$(docker ps -q --filter "ancestor=mysql:8.0")
          for i in {1..30}; do
            if docker inspect --format='{{.State.Health.Status}}' $CID | grep -q "healthy"; then
              echo "[✔] MySQL is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "[❌] Healthcheck failed. Restarting..."
          docker logs $CID
          docker restart $CID
          sleep 10

      - name: 📄 Generate init.sql
        run: |
          echo "USE sample_db;" > sql/init.sql
          echo "CREATE TABLE IF NOT EXISTS users (id INT AUTO_INCREMENT PRIMARY KEY, name VARCHAR(100));" >> sql/init.sql
          echo "INSERT INTO users (name) VALUES ('Alice'), ('Bob'), ('Charlie');" >> sql/init.sql
          echo "" >> sql/init.sql
          echo "CREATE TABLE IF NOT EXISTS customers (customer_id INT AUTO_INCREMENT PRIMARY KEY, customer_name VARCHAR(100), registered_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);" >> sql/init.sql
          echo "INSERT INTO customers (customer_name) VALUES ('Alice'), ('Bob'), ('David');" >> sql/init.sql
          echo "" >> sql/init.sql
          echo "CREATE TABLE IF NOT EXISTS transactions (id INT AUTO_INCREMENT PRIMARY KEY, customer_id INT, amount DECIMAL(10,2), transaction_time TIMESTAMP DEFAULT CURRENT_TIMESTAMP);" >> sql/init.sql
          echo "INSERT INTO transactions (customer_id, amount) VALUES (1, 100.0), (2, 200.5);" >> sql/init.sql

      - name: ⚙️ Run Migration
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -u root -prootpass123 < sql/init.sql || {
            docker restart $(docker ps -q --filter "ancestor=mysql:8.0")
            sleep 10
            mysql -h 127.0.0.1 -u root -prootpass123 < sql/init.sql || exit 1
          }

      - name: 🔍 Generate Standard Queries + Logs
        run: |
          echo "SELECT COUNT(*) FROM users;" > .github/migration/select_users.sql
          echo "SELECT COUNT(*) FROM customers;" > .github/migration/select_customers.sql
          echo "SELECT customer_name, COUNT(*) FROM customers GROUP BY customer_name;" > .github/migration/group_by_customers.sql
          echo "SELECT u.name, c.customer_name FROM users u JOIN customers c ON u.name = c.customer_name;" > .github/migration/join_users_customers.sql

          mysql -h 127.0.0.1 -u root -prootpass123 -D sample_db < .github/migration/select_users.sql > .github/migration/select_users.log
          mysql -h 127.0.0.1 -u root -prootpass123 -D sample_db < .github/migration/select_customers.sql > .github/migration/select_customers.log
          mysql -h 127.0.0.1 -u root -prootpass123 -D sample_db < .github/migration/group_by_customers.sql > .github/migration/group_by_customers.log
          mysql -h 127.0.0.1 -u root -prootpass123 -D sample_db < .github/migration/join_users_customers.sql > .github/migration/join_users_customers.log

      - name: 📤 Export customers.csv
        run: |
          echo "customer_id,customer_name,registered_at" > export/customers.csv
          mysql -h 127.0.0.1 -u root -prootpass123 -D sample_db -B -e \
            "SELECT customer_id, customer_name, registered_at FROM customers;" \
            | tail -n +2 >> export/customers.csv

      - name: 📁 Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: customers-csv
          path: export/customers.csv

      - name: 📁 Upload Migration Queries + Logs
        uses: actions/upload-artifact@v4
        with:
          name: migration-sql-and-logs
          path: .github/migration
