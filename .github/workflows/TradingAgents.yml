name: 🤖 TradingAgents Full Setup & Test

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CONDA_ENV_NAME: tradingagents
  CONDA_PKGS_DIR: /home/runner/conda_pkgs_dir
  FINNHUB_API_KEY: dummy_key
  OPENAI_API_KEY: dummy_key

jobs:
  setup-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Step 1:Checkout
        uses: actions/checkout@v4

      - name: 🔧 Step 2:Install GitHub CLI
        run: |
          echo "[🔧] Installing GitHub CLI..."
          sudo apt-get update && sudo apt-get install -y gh
          echo "[✅] GitHub CLI installed"

      - name: 🧪 Step 3:Install Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          activate-environment: ${{ env.CONDA_ENV_NAME }}
          python-version: 3.10
          auto-activate-base: false
          environment-file: ""
          use-mamba: true

      - name: 🏗️ Step 4:Setup directories and env
        shell: bash
        run: |
          echo "[📁] Creating directories..."
          mkdir -p logs output site scripts/tests tradingagents/graph
          touch logs/.keep
          echo "[✅] Directories ready"

      - name: 📄 Step 5:Generate requirements.txt
        shell: bash
        run: |
          echo "[📄] Generating requirements.txt..."
          echo "openai" > requirements.txt
          echo "finnhub-python" >> requirements.txt
          echo "langgraph" >> requirements.txt
          cat requirements.txt

      - name: 📦 Step 6:Install dependencies
        shell: bash
        run: |
          echo "[📦] Installing dependencies..."
          conda run -n $CONDA_ENV_NAME pip install --upgrade pip
          conda run -n $CONDA_ENV_NAME pip install -r requirements.txt || echo "[⚠️] pip install failed"

      - name: 📦 Step 7:Generate dummy module (echo-based)
        shell: bash
        run: |
          echo "[📦] Generating dummy module..."
          cat << 'EOF' > tradingagents/graph/trading_graph.py
class TradingAgentsGraph:
    def __init__(self, debug=False, config=None):
        print("TradingAgentsGraph initialized")

    def propagate(self, ticker, date):
        return None, {"action": "BUY", "ticker": ticker, "date": date}
EOF

          echo 'DEFAULT_CONFIG = {"example": "value"}' > tradingagents/default_config.py
          touch tradingagents/__init__.py
          touch tradingagents/graph/__init__.py
          echo "[✅] Dummy module created"

      - name: 🧪 Step 8:Generate run_tradingagents.py (echo-style)
        shell: bash
        run: |
          echo "[🧠] Generating run_tradingagents.py..."
          cat << 'EOF' > run_tradingagents.py
print("[🧠] STEP 1: Importing modules...")
try:
    from tradingagents.graph.trading_graph import TradingAgentsGraph
    from tradingagents.default_config import DEFAULT_CONFIG
except ImportError as e:
    print("[❌] Import failed:", e)
    exit(1)

print("[⚙️] STEP 2: Initializing graph...")
ta = TradingAgentsGraph(debug=True, config=DEFAULT_CONFIG.copy())

print("[📈] STEP 3: Calling propagate()...")
_, decision = ta.propagate("NVDA", "2024-05-10")

print("[💡] STEP 4: Decision result:")
print(decision)
EOF
          cp run_tradingagents.py scripts/tests/
          echo "[✅] Test script ready"

      - name: 🧪 Step 9:Run test
        shell: bash
        run: |
          echo "[🧪] Running test script..."
          conda run -n $CONDA_ENV_NAME python run_tradingagents.py || echo "[❌] Test failed"
          echo "[✅] Test complete"

      - name: 📂 Step 10:Upload logs/artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tradingagents-outputs
          path: |
            logs/
            output/
            site/
            scripts/tests/run_tradingagents.py

      - name: 📦 Step 11:Git Commit & PR (if changed)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[📝] Checking for changes..."
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "[ℹ️] No changes to commit."
          else
            COMMIT_MSG="🧠 Auto: Generated tradingagents setup and test"
            git commit -m "$COMMIT_MSG"
            git push origin HEAD:autogen/tradingagents || echo "[⚠️] Branch push failed"

            echo "[🔀] Creating PR..."
            gh pr create --title "$COMMIT_MSG" --body "This PR was auto-generated by workflow" --base main --head autogen/tradingagents || echo "[⚠️] PR creation failed"
          fi
