name: "🌍 Spring Boot + Maven FullOps (Multi-DB Matrix + Echo + SBOM + Release + C/C Pack)"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *" # 5분마다 C/C Pack

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [h2, mysql, postgres, oracle]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: demo
          MYSQL_USER: demo
          MYSQL_PASSWORD: demopass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demopass
          POSTGRES_DB: demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U demo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      oracle:
        image: gvenzl/oracle-xe:21-slim
        env:
          ORACLE_PASSWORD: demopass
          APP_USER: demo
          APP_USER_PASSWORD: demopass
        ports: ["1521:1521"]
        options: >-
          --health-cmd="echo 'SELECT 1 FROM dual;' | sqlplus -s demo/demopass@localhost:1521/XEPDB1"
          --health-interval=30s
          --health-timeout=10s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK + Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Scaffold application.yml (DB profiles)
        run: |
          set -Eeuo pipefail
          mkdir -p src/main/resources
          case "${{ matrix.db }}" in
            mysql)
              cat > src/main/resources/application.yml <<'YML'
              spring:
                datasource:
                  url: jdbc:mysql://localhost:3306/demo
                  username: demo
                  password: demopass
                  driver-class-name: com.mysql.cj.jdbc.Driver
                jpa:
                  hibernate:
                    ddl-auto: update
                  show-sql: true
              YML
              ;;
            postgres)
              cat > src/main/resources/application.yml <<'YML'
              spring:
                datasource:
                  url: jdbc:postgresql://localhost:5432/demo
                  username: demo
                  password: demopass
                  driver-class-name: org.postgresql.Driver
                jpa:
                  hibernate:
                    ddl-auto: update
                  show-sql: true
              YML
              ;;
            oracle)
              cat > src/main/resources/application.yml <<'YML'
              spring:
                datasource:
                  url: jdbc:oracle:thin:@localhost:1521/XEPDB1
                  username: demo
                  password: demopass
                  driver-class-name: oracle.jdbc.OracleDriver
                jpa:
                  hibernate:
                    ddl-auto: update
                  show-sql: true
              YML
              ;;
            *)
              cat > src/main/resources/application.yml <<'YML'
              spring:
                datasource:
                  url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
                  driver-class-name: org.h2.Driver
                  username: sa
                  password:
                jpa:
                  hibernate:
                    ddl-auto: update
                  database-platform: org.hibernate.dialect.H2Dialect
              YML
              ;;
          esac
          echo "[ECHO] application.yml created for ${{ matrix.db }} profile"

      - name: Build & Test
        run: |
          set -Eeuo pipefail
          mvn -B clean verify -Dspring.profiles.active=${{ matrix.db }} | tee build_${{ matrix.db }}.log

      - name: Generate SBOM + Hash
        if: ${{ matrix.db == 'mysql' }}
        run: |
          mkdir -p .github/echo_storage/out
          mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
          sha256sum target/*.jar > .github/echo_storage/out/checksums.txt
          echo "[ECHO] SBOM + checksums generated."

      - name: Generate C/C Pack
        if: ${{ matrix.db == 'mysql' }}
        run: |
          mkdir -p .github/echo_storage/cc_pack
          TS=$(date +%Y%m%d%H%M%S)
          echo "/* Auto C file for compliance */" > .github/echo_storage/cc_pack/cc_${TS}.c
          echo "// Auto header file" > .github/echo_storage/cc_pack/cc_${TS}.h
          tar -C .github/echo_storage/cc_pack -czf .github/echo_storage/cc_pack/cc-pack_${TS}.tar.gz .
          echo "[ECHO] C/C Pack archived."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: springboot-${{ matrix.db }}-${{ github.run_id }}
          path: |
            target/*.jar
            build_${{ matrix.db }}.log
            .github/echo_storage/**
