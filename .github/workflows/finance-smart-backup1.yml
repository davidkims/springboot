name: 🔒 Integrated Blacklist Generator (Mandatory DC, Fail-safe & Echo)

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  BLACKLIST_DIR: .github/blacklist
  REPORT_DIR: .github/blacklist/report
  ENABLE_SPAMHAUS: "true"
  ENABLE_EMERGING_THREATS: "true"
  ENABLE_PY_AUDIT: "auto"     # 파이썬 종속성 파일 있으면 실행
  ENABLE_NPM_AUDIT: "auto"    # JS 락파일 있으면 실행
  ENABLE_SEMGREP: "true"
  # OWASP DC는 "필수" 실행
  DC_VERSION: "9.2.0"         # 필요 시 최신으로 조정
  DC_HOME: /opt/dependency-check
  DC_DATA: /opt/dependency-check/data

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🧭 Echo start
        run: |
          echo "[ECHO] ▶ 통합 블랙리스트 워크플로우 시작"
          echo "[ECHO] 브랜치: $(git rev-parse --abbrev-ref HEAD)"
          echo "[ECHO] 커밋: $(git rev-parse --short HEAD)"

      - name: 📁 Prepare directories
        run: |
          set -e
          mkdir -p "$BLACKLIST_DIR"/{raw,dist,logs} "$REPORT_DIR"
          date -u +"version: %Y.%m.%dT%H:%M:%SZ" > "$BLACKLIST_DIR/version.txt"
          echo "[ECHO] 디렉토리 준비 완료: $BLACKLIST_DIR / $REPORT_DIR"

      - name: 🧰 Setup Python & Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: ⬆️ Install/Upgrade CLI tools
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y unzip
          python -m pip install --upgrade pip
          pip install -U pip-audit safety semgrep jq yq
          npm i -g npm@latest
          echo "[ECHO] 도구 설치/업그레이드 완료 (pip-audit, safety, semgrep, jq, yq, unzip, npm)"

      # ------------------------------------
      # 0) OWASP Dependency-Check (필수 실행, CLI 설치 + 캐시)
      # ------------------------------------
      - name: ♻️ Cache OWASP DC Data (NVD DB)
        id: cache-dc
        uses: actions/cache@v4
        with:
          path: ${{ env.DC_DATA }}
          key: dc-data-${{ env.DC_VERSION }}-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/build.gradle*', '**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml', '**/requirements*.txt', '**/Pipfile.lock', '**/poetry.lock') }}
          restore-keys: |
            dc-data-${{ env.DC_VERSION }}-${{ runner.os }}-

      - name: 🛠 Install OWASP Dependency-Check CLI (mandatory)
        run: |
          set -e
          echo "[ECHO] OWASP Dependency-Check CLI 설치 시작 v${DC_VERSION}"
          sudo rm -rf "${DC_HOME}"
          curl -sSL -o dc.zip "https://github.com/jeremylong/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip"
          sudo mkdir -p "${DC_HOME}" "${DC_DATA}"
          sudo unzip -q dc.zip -d /opt
          sudo mv "/opt/dependency-check-${DC_VERSION}" "${DC_HOME}"
          sudo chmod +x "${DC_HOME}/bin/dependency-check.sh"
          rm -f dc.zip
          echo "[ECHO] OWASP Dependency-Check CLI 설치 완료 (HOME=${DC_HOME}, DATA=${DC_DATA})"

      - name: 🧪 Run OWASP Dependency-Check (JSON)
        run: |
          set -e
          echo "[ECHO] Dependency-Check 실행 시작"
          "${DC_HOME}/bin/dependency-check.sh" \
            --project "BlacklistScan" \
            --scan . \
            --format JSON \
            --out "${BLACKLIST_DIR}/dist" \
            --data "${DC_DATA}" \
            --failOnCVSS 0 || { echo "[WARN] Dependency-Check 실행 경고(취약점 발견/일부 오류) - 계속 진행"; true; }
          # 산출물 표준화
          if [ -f "${BLACKLIST_DIR}/dist/dependency-check-report.json" ]; then
            mv -f "${BLACKLIST_DIR}/dist/dependency-check-report.json" "${BLACKLIST_DIR}/dist/owasp_dc.json"
          fi
          if [ -s "${BLACKLIST_DIR}/dist/owasp_dc.json" ]; then
            echo "[ECHO] OWASP DC 결과 파일 크기(bytes): $(wc -c < "${BLACKLIST_DIR}/dist/owasp_dc.json")"
          else
            echo "[ECHO] OWASP DC 결과 없음/빈 파일"
            : > "${BLACKLIST_DIR}/dist/owasp_dc.json"
          fi
          echo "[ECHO] Dependency-Check 실행 종료"

      # ------------------------------------
      # 1) 네트워크/IP 블랙리스트 (공개 피드, fail-safe)
      # ------------------------------------
      - name: 🌐 Spamhaus (DROP/EDROP) — fail-safe
        if: env.ENABLE_SPAMHAUS == 'true'
        run: |
          set -u
          echo "[ECHO] Spamhaus 수집 시작"
          mkdir -p "$BLACKLIST_DIR/raw" "$BLACKLIST_DIR/dist"

          if ! curl -fsSL https://www.spamhaus.org/drop/drop.txt \
            | grep -v '^;' > "$BLACKLIST_DIR/raw/spamhaus_drop.txt" 2>/dev/null; then
            echo "[WARN] spamhaus_drop.txt 다운로드/정제 실패 → 빈 파일 생성"
            > "$BLACKLIST_DIR/raw/spamhaus_drop.txt"
          fi

          if ! curl -fsSL https://www.spamhaus.org/drop/edrop.txt \
            | grep -v '^;' > "$BLACKLIST_DIR/raw/spamhaus_edrop.txt" 2>/dev/null; then
            echo "[WARN] spamhaus_edrop.txt 다운로드/정제 실패 → 빈 파일 생성"
            > "$BLACKLIST_DIR/raw/spamhaus_edrop.txt"
          fi

          cat "$BLACKLIST_DIR/raw/"spamhaus_*.txt 2>/dev/null | sort -u > "$BLACKLIST_DIR/dist/ip_blacklist_spamhaus.txt" || true

          if [ -s "$BLACKLIST_DIR/dist/ip_blacklist_spamhaus.txt" ]; then
            wc -l "$BLACKLIST_DIR/dist/ip_blacklist_spamhaus.txt" | awk '{print "[ECHO] Spamhaus IP 수:", $1}'
          else
            echo "[ECHO] Spamhaus 결과 없음"
          fi
          echo "[ECHO] Spamhaus 수집 종료"

      - name: ⚠️ Emerging Threats (IP) — fail-safe
        if: env.ENABLE_EMERGING_THREATS == 'true'
        run: |
          set -u
          echo "[ECHO] Emerging Threats 수집 시작"
          mkdir -p "$BLACKLIST_DIR/raw" "$BLACKLIST_DIR/dist"

          if ! curl -fsSL https://rules.emergingthreats.net/blockrules/compromised-ips.txt \
            > "$BLACKLIST_DIR/raw/et_ips.txt"; then
            echo "[WARN] et_ips.txt 다운로드 실패 → 빈 파일 생성"
            > "$BLACKLIST_DIR/raw/et_ips.txt"
          fi

          (cat "$BLACKLIST_DIR/raw/et_ips.txt" 2>/dev/null || true) | grep -E '^[0-9]+' | sort -u > "$BLACKLIST_DIR/dist/ip_blacklist_et.txt" || true

          if [ -s "$BLACKLIST_DIR/dist/ip_blacklist_et.txt" ]; then
            wc -l "$BLACKLIST_DIR/dist/ip_blacklist_et.txt" | awk '{print "[ECHO] ET IP 수:", $1}'
          else
            echo "[ECHO] ET 결과 없음"
          fi
          echo "[ECHO] Emerging Threats 수집 종료"

      # ------------------------------------
      # 2) 패키지 블랙리스트 (pip-audit / safety / npm audit)
      # ------------------------------------
      - name: 🐍 pip-audit (조건 실행)
        if: env.ENABLE_PY_AUDIT == 'true' || env.ENABLE_PY_AUDIT == 'auto'
        run: |
          set -e
          echo "[ECHO] pip-audit 사전 점검"
          if ls requirements*.txt Pipfile.lock poetry.lock 2>/dev/null | grep -q .; then
            echo "[ECHO] pip-audit 실행"
            pip-audit -f json -o "$BLACKLIST_DIR/dist/pip_audit.json" || { echo "[WARN] pip-audit 경고/오류 - 계속 진행"; true; }
            if [ -s "$BLACKLIST_DIR/dist/pip_audit.json" ]; then
              echo "[ECHO] pip-audit 결과 크기(bytes): $(wc -c < "$BLACKLIST_DIR/dist/pip_audit.json")"
            else
              echo "[ECHO] pip-audit 결과 없음/빈 파일"
            fi
          else
            echo "[ECHO] Python 종속성 파일이 없어 pip-audit 건너뜀"
          fi

      - name: 🛡️ safety (옵션 충돌 제거, 항상 json)
        if: env.ENABLE_PY_AUDIT == 'true' || env.ENABLE_PY_AUDIT == 'auto'
        run: |
          set -e
          echo "[ECHO] safety 실행"
          safety check --json | tee "$BLACKLIST_DIR/dist/package_blacklist_safety.json" >/dev/null || { echo "[WARN] safety 경고/오류 - 계속 진행"; true; }
          if [ -s "$BLACKLIST_DIR/dist/package_blacklist_safety.json" ]; then
            echo "[ECHO] safety 결과 크기(bytes): $(wc -c < "$BLACKLIST_DIR/dist/package_blacklist_safety.json")"
          else
            echo "[ECHO] safety 결과 없음/빈 파일"
          fi

      - name: 📦 npm audit (조건 실행)
        if: env.ENABLE_NPM_AUDIT == 'true' || env.ENABLE_NPM_AUDIT == 'auto'
        run: |
          set -e
          echo "[ECHO] npm audit 사전 점검"
          if ls package-lock.json yarn.lock pnpm-lock.yaml 2>/dev/null | grep -q .; then
            echo "[ECHO] npm audit 실행"
            (npm audit --json || true) | tee "$BLACKLIST_DIR/dist/npm_audit.json" >/dev/null
            if command -v jq >/dev/null 2>&1 && [ -s "$BLACKLIST_DIR/dist/npm_audit.json" ]; then
              CRIT=$(jq '.metadata.vulnerabilities.critical // 0' "$BLACKLIST_DIR/dist/npm_audit.json" 2>/dev/null || echo 0)
              HIGH=$(jq '.metadata.vulnerabilities.high // 0' "$BLACKLIST_DIR/dist/npm_audit.json" 2>/dev/null || echo 0)
              echo "[ECHO] npm audit 요약 - critical: ${CRIT}, high: ${HIGH}"
            else
              echo "[ECHO] npm audit 결과 없음/빈 파일 또는 jq 미설치"
            fi
          else
            echo "[ECHO] JS 락파일이 없어 npm audit 건너뜀"
          fi

      # ------------------------------------
      # 3) 코드 패턴 블랙리스트 (Semgrep)
      # ------------------------------------
      - name: 🔎 Semgrep (p/ci) — 로컬 전용
        if: env.ENABLE_SEMGREP == 'true'
        run: |
          set -e
          echo "[ECHO] Semgrep 실행 (p/ci, 로컬 전용)"
          semgrep --config p/ci --json --error --timeout 0 --max-target-bytes 10485760 \
            > "$BLACKLIST_DIR/dist/semgrep.json" 2> "$BLACKLIST_DIR/logs/semgrep.stderr" || { echo "[WARN] Semgrep 경고/오류 - 계속 진행"; true; }
          if [ -s "$BLACKLIST_DIR/dist/semgrep.json" ]; then
            echo "[ECHO] Semgrep 결과 크기(bytes): $(wc -c < "$BLACKLIST_DIR/dist/semgrep.json")"
          else
            echo "[ECHO] Semgrep 결과 없음/빈 파일"
          fi
          echo "[ECHO] Semgrep 실행 종료"

      # ------------------------------------
      # 4) 결과 요약 및 리포트 인덱스
      # ------------------------------------
      - name: 📊 Build summary (sizes)
        run: |
          set -e
          echo "[ECHO] ===== 결과 요약 ====="
          for f in "$BLACKLIST_DIR/dist/"*; do
            [ -e "$f" ] || continue
            echo "[ECHO] 파일: $(basename "$f"), 크기(bytes): $(wc -c < "$f")"
          done
          echo "[ECHO] ====================="

          # 간단한 인덱스 JSON 생성
          jq -n \
            --arg ver "$(cat "$BLACKLIST_DIR/version.txt" | awk '{print $2}')" \
            --arg ts "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --argfile dc "${BLACKLIST_DIR}/dist/owasp_dc.json" \
            --argfile sg "${BLACKLIST_DIR}/dist/semgrep.json" \
            '{
              version: $ver,
              generated_at: $ts,
              sources: {
                spamhaus_ip: "dist/ip_blacklist_spamhaus.txt",
                emerging_threats_ip: "dist/ip_blacklist_et.txt",
                owasp_dependency_check: "dist/owasp_dc.json",
                pip_audit: "dist/pip_audit.json",
                safety: "dist/package_blacklist_safety.json",
                semgrep: "dist/semgrep.json",
                npm_audit: "dist/npm_audit.json"
              }
            }' > "$REPORT_DIR/index.json" 2>/dev/null || { echo "[WARN] 요약 인덱스 생성 경고 - 계속 진행"; true; }
          echo "[ECHO] 요약 인덱스 생성 완료: $REPORT_DIR/index.json"

      # ------------------------------------
      # 5) 변경 사항이 있을 경우 자동 PR 생성
      # ------------------------------------
      - name: 🔍 Check diff
        id: diff
        run: |
          set -e
          echo "[ECHO] 변경사항 검사 시작"
          git add "$BLACKLIST_DIR" || true
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "[ECHO] 변경사항 없음 → PR 생성 생략"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "[ECHO] 변경사항 존재 → PR 생성 예정"
          fi

      - name: 🌿 Create Pull Request
        if: steps.diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(blacklist): update feeds & reports"
          title: "chore(blacklist): update feeds & reports"
          body: |
            자동 생성된 블랙리스트/리포트 갱신 PR입니다.
            - OWASP Dependency-Check (필수)
            - Spamhaus / Emerging Threats (fail-safe)
            - pip-audit / safety / npm audit
            - Semgrep (p/ci)
            - 요약 인덱스: ${{ env.REPORT_DIR }}/index.json
          branch: chore/blacklist-update
          add-paths: |
            ${{ env.BLACKLIST_DIR }}
          delete-branch: true
