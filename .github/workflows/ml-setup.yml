name: 📦 ML 프로그램 설정 및 파일 생성

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  setup-ml-environment:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Docker 및 필수 패키지 설치
        run: |
          echo "[+] Docker 및 필수 패키지 설치 시작..."
          
          # Remove conflicting packages if they're installed
          sudo apt-get remove -y containerd containerd.io

          # Update package list
          sudo apt-get update -y
          
          # Install required packages
          sudo apt-get install -y jq curl unzip bc python3-pip docker.io

          echo "[✔] Docker 설치 완료"
          
      - name: 📂 디렉토리 및 파일 구조 생성
        run: |
          echo "[+] 디렉토리 및 파일 생성 시작..."
          mkdir -p .github/ml
          mkdir -p .github/ml/models
          mkdir -p .github/ml/scripts
          mkdir -p .github/ml/logs
          
          echo "[+] requirements.txt 생성"
          echo "tensorflow" > .github/ml/requirements.txt
          echo "numpy" >> .github/ml/requirements.txt
          echo "scikit-learn" >> .github/ml/requirements.txt
          echo "pandas" >> .github/ml/requirements.txt
          echo "[✔] requirements.txt 생성 완료"
          
          echo "[+] Python 파일 생성"
          echo "import tensorflow as tf" > .github/ml/scripts/train_model.py
          echo "import numpy as np" >> .github/ml/scripts/train_model.py
          echo "from sklearn.datasets import load_iris" >> .github/ml/scripts/train_model.py
          echo "from sklearn.model_selection import train_test_split" >> .github/ml/scripts/train_model.py
          echo "from sklearn.preprocessing import StandardScaler" >> .github/ml/scripts/train_model.py
          echo "" >> .github/ml/scripts/train_model.py
          echo "# 데이터 로딩 및 전처리" >> .github/ml/scripts/train_model.py
          echo "data = load_iris()" >> .github/ml/scripts/train_model.py
          echo "X = data.data" >> .github/ml/scripts/train_model.py
          echo "y = data.target" >> .github/ml/scripts/train_model.py
          echo "scaler = StandardScaler()" >> .github/ml/scripts/train_model.py
          echo "X_scaled = scaler.fit_transform(X)" >> .github/ml/scripts/train_model.py
          echo "" >> .github/ml/scripts/train_model.py
          echo "X_train, X_test, y_train, y_test = train_test_split(X_scaled, y, test_size=0.3, random_state=42)" >> .github/ml/scripts/train_model.py
          echo "" >> .github/ml/scripts/train_model.py
          echo "# 모델 구축" >> .github/ml/scripts/train_model.py
          echo "model = tf.keras.Sequential([" >> .github/ml/scripts/train_model.py
          echo "    tf.keras.layers.Dense(64, activation='relu', input_shape=(X_train.shape[1],))," >> .github/ml/scripts/train_model.py
          echo "    tf.keras.layers.Dense(32, activation='relu')," >> .github/ml/scripts/train_model.py
          echo "    tf.keras.layers.Dense(3, activation='softmax')" >> .github/ml/scripts/train_model.py
          echo "])" >> .github/ml/scripts/train_model.py
          echo "" >> .github/ml/scripts/train_model.py
          echo "model.compile(optimizer='adam', loss='sparse_categorical_crossentropy', metrics=['accuracy'])" >> .github/ml/scripts/train_model.py
          echo "" >> .github/ml/scripts/train_model.py
          echo "# 모델 학습" >> .github/ml/scripts/train_model.py
          echo "model.fit(X_train, y_train, epochs=10, batch_size=32)" >> .github/ml/scripts/train_model.py
          echo "" >> .github/ml/scripts/train_model.py
          echo "# 모델 평가" >> .github/ml/scripts/train_model.py
          echo "loss, accuracy = model.evaluate(X_test, y_test)" >> .github/ml/scripts/train_model.py
          echo "print(f'Test Accuracy: {accuracy*100:.2f}%')" >> .github/ml/scripts/train_model.py
          echo "[✔] Python 파일 생성 완료"
          
          echo "[+] 모델 학습 로그 파일 생성"
          touch .github/ml/logs/training_log.txt
          echo "[✔] 학습 로그 파일 생성 완료"
          
      - name: 🐍 ML 패키지 및 종속성 설치
        run: |
          echo "[+] Python 패키지 설치 시작..."
          pip install -r .github/ml/requirements.txt
          echo "[✔] Python 패키지 설치 완료"

      - name: 🔄 Docker 컨테이너에서 ML 모델 실행
        run: |
          echo "[+] Docker 컨테이너 실행 및 모델 학습 시작..."
          echo "[INFO] Dockerfile 위치: .github/ml/Dockerfile"
          docker build -t ml-model -f .github/ml/Dockerfile .
          docker run --name ml-training-container ml-model
          echo "[✔] 모델 학습 완료 및 Docker 컨테이너 실행 완료"

      - name: 📦 결과 저장 및 업로드
        run: |
          echo "[+] 모델 결과 업로드 준비"
          mkdir -p .github/ml/models
          echo "[INFO] 모델을 Docker 컨테이너에서 복사 중..."
          docker cp ml-training-container:/path/to/model .github/ml/models/
          echo "[✔] 모델 결과 업로드 완료"

      - name: 📝 로그 파일 확인
        run: |
          echo "[+] 학습 로그 파일 확인"
          cat .github/ml/logs/training_log.txt
          echo "[✔] 학습 로그 파일 확인 완료"

      - name: 📜 Python 명령어 호출 및 모델 학습 실행
        run: |
          echo "[+] Python 모델 학습 시작..."
          python3 .github/ml/scripts/train_model.py >> .github/ml/logs/training_log.txt 2>&1
          echo "[✔] Python 모델 학습 완료"

      - name: 🔄 도커 컨테이너에서 파일 호출 및 생성
        run: |
          echo "[+] Docker 컨테이너에서 파일 호출 및 생성 시작..."
          docker exec ml-training-container bash -c "echo '[+] 생성된 모델 파일 확인'; ls /path/to/model"
          docker exec ml-training-container bash -c "echo '[+] 생성된 파일 내용 확인'; cat /path/to/model/some_model_file"
          echo "[✔] 파일 호출 및 생성 완료"
