name: "📦 Transfer Log Backup + Disk IO + Auto Upgrade (FULL-OPS)"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  full-transfer-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TRANSFER_LOG_DIR: /opt/logs/transfer
      BACKUP_DIR: /opt/backup/transfer
      PROVENANCE_DIR: provenance
      PROVENANCE_STORE_DIR: provenance/store
      CURL_SOURCE_URL: "https://example.com/provenance/latest.json" # 정식 다운로드 경로
      PKG_LIST: "sysstat curl wget coreutils"

    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 📁 디렉토리 및 권한 생성
      run: |
        set -Eeuo pipefail
        echo "[ECHO] 필수 디렉토리 생성"
        sudo mkdir -p "$TRANSFER_LOG_DIR" "$BACKUP_DIR" "$PROVENANCE_DIR" "$PROVENANCE_STORE_DIR"
        sudo chmod -R 777 "$TRANSFER_LOG_DIR" "$BACKUP_DIR" "$PROVENANCE_DIR" "$PROVENANCE_STORE_DIR"
        ls -ld "$TRANSFER_LOG_DIR" "$BACKUP_DIR" "$PROVENANCE_DIR" "$PROVENANCE_STORE_DIR"

    - name: 🔄 필수 패키지 설치 및 업그레이드
      run: |
        set -Eeuo pipefail
        echo "[ECHO] 패키지 설치 및 업그레이드"
        sudo apt-get update -y
        sudo apt-get install -y $PKG_LIST
        sudo apt-get upgrade -y

    - name: 📝 전송 로그 파일 생성 또는 다운로드
      run: |
        set -Eeuo pipefail
        FILE_NAME=".provenance_transfer_$(date +%Y%m%d_%H%M%S).json"
        FILE_PATH="$PROVENANCE_DIR/$FILE_NAME"

        echo "[ECHO] 전송 로그 생성 시작: $FILE_PATH"
        # curl로 다운로드 시도
        if curl -fsSL "$CURL_SOURCE_URL" -o "$FILE_PATH"; then
          echo "[ECHO] 원격 전송 로그 다운로드 성공"
        else
          echo "[ECHO] 원격 다운로드 실패 → 로컬에서 더미 로그 생성"
          echo "{\"status\":\"generated\",\"timestamp\":\"$(date)\"}" > "$FILE_PATH"
        fi
        ls -lh "$FILE_PATH"

    - name: 📊 디스크 I/O 상태 기록
      run: |
        set -Eeuo pipefail
        LOG_FILE="$TRANSFER_LOG_DIR/disk_io_$(date +%Y%m%d_%H%M%S).log"
        echo "[ECHO] 디스크 I/O 상태 수집: $LOG_FILE"
        iostat -x 1 3 | tee "$LOG_FILE" || echo "[WARN] iostat 실행 실패"
        df -h | tee -a "$LOG_FILE"
        lsblk | tee -a "$LOG_FILE"

    - name: 💾 대량 데이터 생성 (I/O 테스트)
      run: |
        set -Eeuo pipefail
        echo "[ECHO] 대량 파일 생성 시작 (/tmp/io_test)"
        mkdir -p /tmp/io_test
        for i in $(seq 1 5); do
          dd if=/dev/zero of=/tmp/io_test/testfile_$i bs=10M count=10 status=progress
        done
        ls -lh /tmp/io_test

    - name: 📤 전송 로그 및 디스크 I/O 로그 백업
      uses: actions/upload-artifact@v4
      with:
        name: "transfer-backup-logs"
        path: |
          ${{ env.TRANSFER_LOG_DIR }}
          ${{ env.PROVENANCE_DIR }}
        if-no-files-found: warn
        compression-level: 6

    - name: 📦 전송 로그 백업 → /opt/backup
      run: |
        set -Eeuo pipefail
        echo "[ECHO] 백업 디렉토리에 복사"
        sudo cp -r "$TRANSFER_LOG_DIR"/* "$BACKUP_DIR"/ || echo "[WARN] 로그 복사 실패"
        sudo cp -r "$PROVENANCE_DIR"/* "$BACKUP_DIR"/ || echo "[WARN] 전송 로그 복사 실패"
        ls -lh "$BACKUP_DIR"
