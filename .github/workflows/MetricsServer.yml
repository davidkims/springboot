name: 📊 Metrics Server Setup & Real-time Data Collection

on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'  # 매분 실행

jobs:
  setup_and_collect:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Generate setup_metrics.sh script
        run: |
          echo '#!/usr/bin/env bash' > setup_metrics.sh
          echo 'set -e' >> setup_metrics.sh

          echo '[🛠️] Updating package lists and upgrading all packages...' >> setup_metrics.sh
          echo 'sudo apt-get update' >> setup_metrics.sh
          echo 'sudo apt-get upgrade -y' >> setup_metrics.sh
          echo '[✅] System packages upgraded.' >> setup_metrics.sh

          echo '[🛡️] Backing up existing data and config...' >> setup_metrics.sh
          echo 'TIMESTAMP=$(date +%Y%m%d%H%M%S)' >> setup_metrics.sh
          echo 'for DIR in /opt/prometheus/data /opt/grafana/data /opt/elasticsearch/data \\' >> setup_metrics.sh
          echo '           /opt/logstash/config /opt/kibana/config /opt/influxdb/data /opt/telegraf/conf; do' >> setup_metrics.sh
          echo '  if [ -d "$DIR" ]; then' >> setup_metrics.sh
          echo '    BK="${DIR}_backup_${TIMESTAMP}"' >> setup_metrics.sh
          echo '    sudo mkdir -p "$BK"' >> setup_metrics.sh
          echo '    sudo cp -a "$DIR/." "$BK/"' >> setup_metrics.sh
          echo '    echo "[✅] Backed up $DIR → $BK"' >> setup_metrics.sh
          echo '  else' >> setup_metrics.sh
          echo '    echo "[⚪️] $DIR not found, skipping backup"' >> setup_metrics.sh
          echo '  fi' >> setup_metrics.sh
          echo 'done' >> setup_metrics.sh
          echo '' >> setup_metrics.sh

          echo '[🛠️] Creating all required directories...' >> setup_metrics.sh
          echo 'sudo mkdir -p /opt/prometheus/data /opt/grafana/data /opt/elasticsearch/data \\' >> setup_metrics.sh
          echo '                 /opt/logstash/config /opt/kibana/config /opt/influxdb/data \\' >> setup_metrics.sh
          echo '                 /opt/telegraf/conf' >> setup_metrics.sh
          echo 'echo "[✅] Directories created."' >> setup_metrics.sh
          echo '' >> setup_metrics.sh

          echo '[🛠️] Installing Prometheus...' >> setup_metrics.sh
          echo 'sudo apt-get install -y prometheus' >> setup_metrics.sh
          echo 'echo "[✅] Prometheus installed."' >> setup_metrics.sh
          echo '' >> setup_metrics.sh

          echo '[🛠️] Installing Grafana prerequisites...' >> setup_metrics.sh
          echo 'sudo apt-get install -y apt-transport-https software-properties-common wget gnupg' >> setup_metrics.sh
          echo 'sudo mkdir -p /etc/apt/keyrings' >> setup_metrics.sh
          echo 'curl -sL https://apt.grafana.com/gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/grafana.gpg > /dev/null' >> setup_metrics.sh
          echo 'echo "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main" | sudo tee /etc/apt/sources.list.d/grafana.list' >> setup_metrics.sh
          echo 'sudo apt-get update' >> setup_metrics.sh
          echo 'sudo apt-get install -y grafana' >> setup_metrics.sh
          echo 'echo "[✅] Grafana installed."' >> setup_metrics.sh
          echo '' >> setup_metrics.sh

          echo '[🛠️] Installing Elasticsearch...' >> setup_metrics.sh
          echo 'curl -sL https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor | sudo tee /usr/share/keyrings/elasticsearch-archive-keyring.gpg > /dev/null' >> setup_metrics.sh
          echo 'echo "deb [signed-by=/usr/share/keyrings/elasticsearch-archive-keyring.gpg] https://artifacts.elastic.co/packages/7.x/apt stable main" | sudo tee /etc/apt/sources.list.d/elasticsearch.list' >> setup_metrics.sh
          echo 'sudo apt-get update' >> setup_metrics.sh
          echo 'sudo apt-get install -y openjdk-11-jdk elasticsearch' >> setup_metrics.sh
          echo 'echo "[✅] Elasticsearch installed."' >> setup_metrics.sh
          echo '' >> setup_metrics.sh

          echo '[🛠️] Installing Logstash...' >> setup_metrics.sh
          echo 'sudo apt-get update' >> setup_metrics.sh
          echo 'sudo apt-get install -y logstash' >> setup_metrics.sh
          echo 'echo "[✅] Logstash installed."' >> setup_metrics.sh
          echo '' >> setup_metrics.sh

          echo '[🛠️] Installing Kibana...' >> setup_metrics.sh
          echo 'sudo apt-get update' >> setup_metrics.sh
          echo 'sudo apt-get install -y kibana' >> setup_metrics.sh
          echo 'echo "[✅] Kibana installed."' >> setup_metrics.sh
          echo '' >> setup_metrics.sh

          echo '[🛠️] Installing InfluxDB & Telegraf...' >> setup_metrics.sh
          echo 'curl -sL https://repos.influxdata.com/influxdata-archive_compat.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/influxdata-archive_compat.gpg > /dev/null' >> setup_metrics.sh
          echo 'echo "deb [signed-by=/etc/apt/trusted.gpg.d/influxdata-archive_compat.gpg] https://repos.influxdata.com/ubuntu jammy stable" | sudo tee /etc/apt/sources.list.d/influxdb.list' >> setup_metrics.sh
          echo 'sudo apt-get update' >> setup_metrics.sh
          echo 'sudo apt-get install -y influxdb telegraf' >> setup_metrics.sh
          echo 'echo "[✅] InfluxDB & Telegraf installed."' >> setup_metrics.sh

          chmod +x setup_metrics.sh
          echo "[✅] setup_metrics.sh 생성 및 실행 권한 부여 완료."

      - name: 🚀 Run setup_metrics.sh with strict mode
        run: |
          echo "[🚀] Executing setup_metrics.sh with -e..."
          sudo bash -e setup_metrics.sh

      - name: 📡 Collect real-time workflow metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[📡] Fetching latest 5 workflow runs from GitHub API..."
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=5" \
            > workflow_metrics.json
          echo "[✅] Metrics saved to workflow_metrics.json"
          head -n 20 workflow_metrics.json || true
