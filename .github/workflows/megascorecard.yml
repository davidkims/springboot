name: 🛡️ MEGA Scorecard + CodeQL + EchoOps + AutoUpgrade

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * 0'  # 매주 일요일 10분 간격

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  secure-analyze:
    runs-on: ubuntu-latest

    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 📁 Echo 디렉토리 및 구조 생성
      run: |
        set -e
        mkdir -p .github/echo_logs
        echo "#!/bin/bash" > .github/echo_logs/create_dirs.sh
        chmod +x .github/echo_logs/create_dirs.sh
        for dir in .github/echo_scorecard .github/echo_codeql .github/echo_logs .github/echo_security .github/echo_upgrade site/scorecard site/security site/upgrade site/pr; do
          mkdir -p "$dir"
          echo "echo '[ECHO] 디렉토리 생성: $dir'" >> .github/echo_logs/create_dirs.sh
        done
        bash .github/echo_logs/create_dirs.sh

    - name: 🧪 Run Scorecard (No Upload)
      run: |
        set -e
        echo "[ECHO] Scorecard 실행 시작"
        scorecard --repo=https://github.com/${{ github.repository }} --format sarif --no-upload > results.sarif
        scorecard --repo=https://github.com/${{ github.repository }} --format json --no-upload > results.json
        echo "[ECHO] Scorecard 결과 파일 저장"
        cp results.sarif site/scorecard/scorecard-results.sarif
        cp results.json site/security/security.json

    - name: 🧪 Run CodeQL (if supported)
      uses: github/codeql-action/init@v3
      with:
        languages: 'java'

    - name: 🧪 Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      continue-on-error: true

    - name: 🔁 Weekly Upgrade Test (echo logging)
      run: |
        set -e
        echo "#!/bin/bash" > .github/echo_upgrade/weekly_upgrade.sh
        echo "echo '[AUTOUP] apt-get update -y'" >> .github/echo_upgrade/weekly_upgrade.sh
        echo "sudo apt-get update -y" >> .github/echo_upgrade/weekly_upgrade.sh
        echo "echo '[AUTOUP] apt-get upgrade -y'" >> .github/echo_upgrade/weekly_upgrade.sh
        echo "sudo apt-get upgrade -y" >> .github/echo_upgrade/weekly_upgrade.sh
        chmod +x .github/echo_upgrade/weekly_upgrade.sh
        bash .github/echo_upgrade/weekly_upgrade.sh | tee site/upgrade/upgrade.log

    - name: ✅ Create Upgrade PR
      uses: peter-evans/create-pull-request@v6
      with:
        commit-message: "🔁 weekly auto upgrade results"
        title: "🔁 weekly upgrade: dependencies updated"
        body: |
          This PR contains results from the automated weekly upgrade process.

          - All APT packages updated
          - See full log in `site/upgrade/upgrade.log`
        branch: auto/upgrade-${{ github.run_id }}
        delete-branch: true
