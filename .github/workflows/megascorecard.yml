name: 🛡️ MEGA Scorecard + CodeQL + EchoOps + AutoUpgrade

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * 0'  # 매주 일요일 10분 간격

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  security-fullops:
    runs-on: ubuntu-latest

    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 📥 Scorecard CLI 설치
      run: |
        set -e
        VERSION="4.10.3"
        echo "[ECHO] Scorecard CLI 다운로드 시작"
        curl -sLO https://github.com/ossf/scorecard/releases/download/v${VERSION}/scorecard_${VERSION}_linux_amd64.tar.gz
        tar -xzf scorecard_${VERSION}_linux_amd64.tar.gz
        BIN=$(find scorecard_${VERSION}_linux_amd64* -type f -name scorecard | head -1 || true)
        if [ -z "$BIN" ]; then
          echo "::error ::[ERR] Scorecard binary not found after extract."
          exit 1
        fi
        chmod +x "$BIN"
        sudo mv "$BIN" /usr/local/bin/scorecard
        scorecard --version
        echo "[ECHO] Scorecard CLI 설치 완료"

    - name: 📁 디렉토리 생성 (Echo 기반)
      run: |
        set -e
        mkdir -p .github/echo_logs
        echo "#!/bin/bash" > .github/echo_logs/create_dirs.sh
        for dir in .github/echo_scorecard .github/echo_codeql .github/echo_logs .github/echo_security .github/echo_upgrade site/scorecard site/security site/upgrade site/pr; do
          echo "mkdir -p $dir" >> .github/echo_logs/create_dirs.sh
          echo "echo '[ECHO] 디렉토리 생성: $dir'" >> .github/echo_logs/create_dirs.sh
        done
        chmod +x .github/echo_logs/create_dirs.sh
        bash .github/echo_logs/create_dirs.sh

    - name: 🧪 Scorecard 분석 실행
      run: |
        set -e
        echo "[ECHO] Scorecard 실행 시작"
        scorecard --repo=https://github.com/davidkims/springboot --format sarif --no-upload > results.sarif
        scorecard --repo=https://github.com/davidkims/springboot --format json --no-upload > results.json
        echo "[ECHO] Scorecard 결과 파일 저장"
        cp results.sarif site/scorecard/scorecard-results.sarif
        cp results.json site/security/security.json

    - name: 🧪 CodeQL Init
      uses: github/codeql-action/init@v3
      with:
        languages: 'java'

    - name: 🧪 CodeQL 분석
      uses: github/codeql-action/analyze@v3
      continue-on-error: true

    - name: 🔁 주간 자동 업그레이드 (APT)
      run: |
        set -e
        echo "#!/bin/bash" > .github/echo_upgrade/weekly_upgrade.sh
        echo "echo '[AUTOUP] apt update 수행'" >> .github/echo_upgrade/weekly_upgrade.sh
        echo "sudo apt update -y" >> .github/echo_upgrade/weekly_upgrade.sh
        echo "echo '[AUTOUP] apt upgrade 수행'" >> .github/echo_upgrade/weekly_upgrade.sh
        echo "sudo apt upgrade -y" >> .github/echo_upgrade/weekly_upgrade.sh
        chmod +x .github/echo_upgrade/weekly_upgrade.sh
        bash .github/echo_upgrade/weekly_upgrade.sh | tee site/upgrade/upgrade.log

    - name: ✅ 업그레이드 PR 자동 생성
      uses: peter-evans/create-pull-request@v6
      with:
        commit-message: "🔁 weekly auto upgrade results"
        title: "🔁 Weekly Upgrade: APT Packages"
        body: |
          This PR was automatically generated by the weekly upgrade workflow.
          - See `site/upgrade/upgrade.log` for full details.
        branch: auto/upgrade-${{ github.run_id }}
        delete-branch: true
