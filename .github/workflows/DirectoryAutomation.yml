name: Spring Boot + DB CLI Integration Full Automation

on:
  workflow_dispatch:

jobs:
  springboot-dbcli:
    runs-on: ubuntu-latest

    env:
      DBCLI_DIR: .github/dbcli
      OUTPUT_DIR: .github/dbcli/output
      GH_EMAIL: github-actions[bot]@users.noreply.github.com
      GH_USER: github-actions[bot]

    steps:
      - name: 📦 Checkout Spring Boot Repository
        uses: actions/checkout@v4

      - name: 🛠️ Install Java & Gradle (for Spring Boot)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐧 Install DB Server & CLI Tools
        run: |
          echo "[🐧] apt-get update"
          sudo apt-get update

          echo "[🐬] Install MySQL Server & Client"
          sudo apt-get install -y mysql-server mysql-client

          echo "[🐘] Install PostgreSQL Server & Client"
          sudo apt-get install -y postgresql postgresql-client

          echo "[📁] Install SQLite3 CLI"
          sudo apt-get install -y sqlite3

          echo "[🔥] Install Firebird CLI"
          sudo apt-get install -y firebird-utils

          echo "[🧊] Install Redis Server & CLI"
          sudo apt-get install -y redis-server redis-tools

          echo "[📦] Install ClickHouse Server & Client"
          sudo apt-get install -y clickhouse-server clickhouse-client

          echo "[🟦] Try to install MSSQL CLI (sqlcmd) via apt (may fail if repo not added)"
          if sudo apt-get install -y mssql-tools; then
            echo "[✅] MSSQL sqlcmd 설치 성공"
            echo "SQLCMD_INSTALLED=1" >> $GITHUB_ENV
          else
            echo "[⚠️] MSSQL sqlcmd 설치 실패: Microsoft 공식 repo 필요"
            echo "SQLCMD_INSTALLED=0" >> $GITHUB_ENV
          fi

      - name: 🟢 Start All DB Servers
        run: |
          echo "[🟢] Start MySQL server"
          sudo service mysql start
          echo "[🟢] Start PostgreSQL server"
          sudo service postgresql start
          echo "[🟢] Start Redis server"
          sudo service redis-server start
          echo "[🟢] Start ClickHouse server"
          sudo service clickhouse-server start
          echo "[🟢] All DB servers started"

      - name: 📂 Create Directories for DBCLI & Output
        run: |
          echo "[📂] Create directories"
          mkdir -p $DBCLI_DIR/mysql
          mkdir -p $DBCLI_DIR/postgresql
          mkdir -p $DBCLI_DIR/sqlite
          mkdir -p $DBCLI_DIR/redis
          mkdir -p $DBCLI_DIR/firebird
          mkdir -p $DBCLI_DIR/clickhouse
          mkdir -p $DBCLI_DIR/output
          mkdir -p $DBCLI_DIR/mssql

      - name: 📄 Create Various Sample SQL/Command Files
        run: |
          echo "[📄] MySQL: Table, Insert, CRUD"
          echo "CREATE DATABASE IF NOT EXISTS demo;" > $DBCLI_DIR/mysql/demo.sql
          echo "USE demo; CREATE TABLE IF NOT EXISTS users (id INT PRIMARY KEY AUTO_INCREMENT, name VARCHAR(50));" >> $DBCLI_DIR/mysql/demo.sql
          echo "INSERT INTO users (name) VALUES ('Alice'), ('Bob');" >> $DBCLI_DIR/mysql/demo.sql
          echo "SELECT * FROM users;" >> $DBCLI_DIR/mysql/demo.sql
          echo "UPDATE users SET name='Charlie' WHERE name='Alice';" >> $DBCLI_DIR/mysql/demo.sql
          echo "DELETE FROM users WHERE name='Bob';" >> $DBCLI_DIR/mysql/demo.sql

          echo "[📄] PostgreSQL: Table, Insert, CRUD"
          echo "CREATE DATABASE demo;" > $DBCLI_DIR/postgresql/demo.sql
          echo "\\c demo" >> $DBCLI_DIR/postgresql/demo.sql
          echo "CREATE TABLE IF NOT EXISTS users (id SERIAL PRIMARY KEY, name VARCHAR(50));" >> $DBCLI_DIR/postgresql/demo.sql
          echo "INSERT INTO users (name) VALUES ('Alice'), ('Bob');" >> $DBCLI_DIR/postgresql/demo.sql
          echo "SELECT * FROM users;" >> $DBCLI_DIR/postgresql/demo.sql
          echo "UPDATE users SET name='Charlie' WHERE name='Alice';" >> $DBCLI_DIR/postgresql/demo.sql
          echo "DELETE FROM users WHERE name='Bob';" >> $DBCLI_DIR/postgresql/demo.sql

          echo "[📄] SQLite: Table, Insert, Select"
          echo "CREATE TABLE users (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT);" > $DBCLI_DIR/sqlite/demo.sql
          echo "INSERT INTO users (name) VALUES ('Alice'), ('Bob');" >> $DBCLI_DIR/sqlite/demo.sql
          echo "SELECT * FROM users;" >> $DBCLI_DIR/sqlite/demo.sql

          echo "[📄] Redis: Basic Commands"
          echo "SET user:1 Alice" > $DBCLI_DIR/redis/demo.redis
          echo "SET user:2 Bob" >> $DBCLI_DIR/redis/demo.redis
          echo "GET user:1" >> $DBCLI_DIR/redis/demo.redis
          echo "KEYS *" >> $DBCLI_DIR/redis/demo.redis

          echo "[📄] ClickHouse: Table, Insert, Select"
          echo "CREATE TABLE IF NOT EXISTS users (id UInt32, name String) ENGINE = Memory;" > $DBCLI_DIR/clickhouse/demo.sql
          echo "INSERT INTO users VALUES (1, 'Alice'), (2, 'Bob');" >> $DBCLI_DIR/clickhouse/demo.sql
          echo "SELECT * FROM users;" >> $DBCLI_DIR/clickhouse/demo.sql

          echo "[📄] MSSQL: Table, Insert, Select"
          echo "CREATE TABLE users (id INT PRIMARY KEY, name NVARCHAR(50));" > $DBCLI_DIR/mssql/demo.sql
          echo "INSERT INTO users VALUES (1, 'Alice'), (2, 'Bob');" >> $DBCLI_DIR/mssql/demo.sql
          echo "SELECT * FROM users;" >> $DBCLI_DIR/mssql/demo.sql

      - name: 🚀 Start Spring Boot App (Background)
        run: |
          echo "[🚀] Run Spring Boot app in background"
          nohup ./gradlew bootRun > springboot_app.log 2>&1 &
          echo "[🚀] Spring Boot running at http://localhost:8080"
          sleep 20  # App 기동 대기

      - name: 🏃 Run All Sample Queries and Save Output
        run: |
          echo "[🏃] Run MySQL sample"
          sudo mysql -u root < $DBCLI_DIR/mysql/demo.sql > $OUTPUT_DIR/mysql_demo.out 2>&1 || echo "[⚠️] MySQL 실행 실패"

          echo "[🏃] Run PostgreSQL sample"
          sudo -u postgres psql -f $DBCLI_DIR/postgresql/demo.sql > $OUTPUT_DIR/psql_demo.out 2>&1 || echo "[⚠️] PostgreSQL 실행 실패"

          echo "[🏃] Run SQLite sample"
          sqlite3 :memory: < $DBCLI_DIR/sqlite/demo.sql > $OUTPUT_DIR/sqlite_demo.out 2>&1 || echo "[⚠️] SQLite 실행 실패"

          echo "[🏃] Run Redis sample"
          while read line; do redis-cli $line; done < $DBCLI_DIR/redis/demo.redis > $OUTPUT_DIR/redis_demo.out 2>&1 || echo "[⚠️] Redis 실행 실패"

          echo "[🏃] Run ClickHouse sample"
          clickhouse-client --multiquery < $DBCLI_DIR/clickhouse/demo.sql > $OUTPUT_DIR/clickhouse_demo.out 2>&1 || echo "[⚠️] ClickHouse 실행 실패"

          if [ "${{ env.SQLCMD_INSTALLED }}" = "1" ]; then
            echo "[🏃] Run MSSQL sample"
            sqlcmd -S localhost -U SA -P 'YourPassword123!' -i $DBCLI_DIR/mssql/demo.sql > $OUTPUT_DIR/mssql_demo.out 2>&1 || echo "[⚠️] MSSQL 실행 실패"
          else
            echo "[⚠️] MSSQL sqlcmd 미설치 - MSSQL 샘플 실행 스킵"
          fi

      - name: 📨 Copy MySQL Error Log (Optional)
        run: |
          echo "[🪵] Copy MySQL error.log"
          mkdir -p $DBCLI_DIR
          sudo cp /var/log/mysql/error.log $DBCLI_DIR/mysql_error.log || echo "[⚠️] MySQL error.log 미존재"
          sudo chown $USER:$USER $DBCLI_DIR/mysql_error.log || true

      - name: 📝 Show Output Directory Structure
        run: |
          echo "[📝] .github/dbcli/output 디렉토리와 파일 리스트"
          tree .github/dbcli || ls -R .github/dbcli

      - name: 🟦 GitHub 자동 커밋/푸시 (.github/dbcli 전체)
        if: ${{ env.GITHUB_TOKEN == '' && env.GH_PAT != '' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "[🟦] 자동 커밋/푸시 시작"
          git config --global user.email "${GH_EMAIL}"
          git config --global user.name "${GH_USER}"
          git add .github/dbcli
          git status
          git commit -m "자동: .github/dbcli DBCLI 예시, 출력, 로그 추가 [skip ci]" || echo "[ℹ️] 커밋할 변경사항 없음"
          git push "https://${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || echo "[⚠️] 자동 푸시 실패"
