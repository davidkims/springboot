name: 🔒 모든 워크플로 파일 암호화(GPG + OpenSSL)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # 매일 03:00

jobs:
  encrypt:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 📁 Create encryption/log/echo directories
        run: |
          for d in .github/encrypted_workflows .github/encrypt_logs .github/echo; do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo/encrypt_dirs.txt
            mkdir -p $d
          done
          echo "echo '[INFO] Directory creation done'" | tee -a .github/echo/encrypt_dirs.txt

      - name: 🔑 Import GPG public key (if provided)
        run: |
          if [ -n "${{ secrets.GPG_PUBLIC_KEY }}" ]; then
            echo "${{ secrets.GPG_PUBLIC_KEY }}" > .github/encrypt_logs/pubkey.asc
            gpg --import .github/encrypt_logs/pubkey.asc
            echo "echo '[INFO] GPG public key imported'" | tee -a .github/echo/encrypt_gpg.txt
          else
            echo "echo '[INFO] No GPG public key provided, skip GPG encryption'" | tee -a .github/echo/encrypt_gpg.txt
          fi

      - name: 🔒 Encrypt all workflows with GPG + OpenSSL (echo/log)
        run: |
          # Check if GPG key is imported
          GPG_OK=0
          gpg --list-keys | grep -q '@' && GPG_OK=1

          PASS="${{ secrets.ENCRYPT_PASS }}"
          > .github/encrypt_logs/result.txt

          for f in .github/workflows/*.y*ml; do
            [ -f "$f" ] || continue
            BN=$(basename "$f")
            OUT1=".github/encrypted_workflows/${BN}.gpg"
            OUT2=".github/encrypted_workflows/${BN}.enc"
            # GPG encryption
            if [ "$GPG_OK" = "1" ]; then
              echo "echo '[GPG encryption] $f → $OUT1'" | tee -a .github/echo/encrypt_gpg.txt
              gpg --yes --batch --trust-model always --output "$OUT1" --encrypt --recipient "$(gpg --list-keys | grep uid | head -n1 | sed -E 's/.*<(.+)>/\1/')" "$f" \
                && echo "GPG Encrypted: $f → $OUT1" >> .github/encrypt_logs/result.txt \
                || echo "GPG encryption failed: $f" >> .github/encrypt_logs/result.txt
            else
              echo "echo '[GPG SKIP] No public key: $f'" | tee -a .github/echo/encrypt_gpg.txt
              echo "GPG SKIP: $f" >> .github/encrypt_logs/result.txt
            fi
            # OpenSSL encryption
            if [ -n "$PASS" ]; then
              echo "echo '[OpenSSL encryption] $f → $OUT2'" | tee -a .github/echo/encrypt_openssl.txt
              openssl enc -aes-256-cbc -salt -in "$f" -out "$OUT2" -k "$PASS" \
                && echo "OpenSSL Encrypted: $f → $OUT2" >> .github/encrypt_logs/result.txt \
                || echo "OpenSSL encryption failed: $f" >> .github/encrypt_logs/result.txt
            else
              echo "echo '[OpenSSL SKIP] No password: $f'" | tee -a .github/echo/encrypt_openssl.txt
              echo "OpenSSL SKIP: $f" >> .github/encrypt_logs/result.txt
            fi
          done
          echo "echo '[INFO] Encryption job finished'" | tee -a .github/echo/encrypt_done.txt

      - name: 📝 Show encryption result log (echo)
        run: |
          echo "echo '[Encryption result log]'"
          cat .github/encrypt_logs/result.txt || echo "No encryption result log."

      - name: 📝 Show echo file summary (optional)
        run: |
          for f in .github/echo/*.txt; do
            echo "----- $f -----"
            cat $f
          done
