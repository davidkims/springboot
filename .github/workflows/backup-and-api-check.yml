name: ♻️ Watch & Retry Failed Workflows Until Success

on:
  schedule:
    - cron: '*/5 * * * *'  # 매 5분
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  retry-failed:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup GitHub CLI
        uses: cli/cli-action@v2

      - name: 🔐 Authenticate with PAT
        run: gh auth login --with-token <<< "${{ secrets.GH_PAT }}"

      - name: ♻️ Detect and Retry Failed Workflows
        run: |
          echo "[🔍] Fetching recent failed workflow runs..."

          FAILED_WORKFLOWS=$(gh run list --limit 20 --json databaseId,name,status,conclusion,headBranch \
            --jq '.[] | select(.status == "completed" and .conclusion == "failure") | .name' | sort | uniq)

          echo "[📋] Failed workflows detected:"
          echo "$FAILED_WORKFLOWS"

          for wf in $FAILED_WORKFLOWS; do
            echo "▶️ Retrying workflow: $wf"

            # 실행 중인 동일 워크플로우가 있으면 skip
            INPROGRESS=$(gh run list --workflow "$wf" --json status --jq '.[] | select(.status == "in_progress")')
            if [ -n "$INPROGRESS" ]; then
              echo "⏭️ Already running: $wf → skipping"
              continue
            fi

            # 재시작
            gh workflow run "$wf"
            echo "🔁 Re-triggered workflow: $wf"
          done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
