name: 🏦 전체 금융기관 ALL-IN-ONE + AutoUP + 업그레이드 분석 + 변경 추적

on:
  workflow_dispatch:
  schedule:
    - cron: '*/3 * * * *'

jobs:
  fintech-autoup-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 디렉토리 생성 (에코, 로그, 정책, 비교)
        run: |
          set -e
          BANKS="국민 우리 신한 하나 농협 기업 수협 씨티 SC제일 케이카카오토스새마을금고 우체국 부산 대구 광주 전북 제주 산림조합 신협 한국씨티 JP모건 BOA HSBC UBS 도이치 한국스탠다드차타드 신용카드 롯데 삼성 현대 비씨 NH채움 하나카드 신한카드 우리카드 국민카드 기업카드 현대증권 미래에셋 NH투자 한국투자 신한투자 KB증권 삼성증권 키움 대신 신영 유진 IBK투자 메리츠 한국예탁결제원 업비트 빗썸 코빗 고팍스 바이낸스 코인원 교보 삼성 한화 동양 현대 농협 메리츠 흥국 MG MG새마을 저축은행 리브핀 페이코 카카오페이 뱅크샐러드 암호화폐토스카카오뱅크타다토스증권웨이브 오픈뱅킹모든은행포함"
          mkdir -p .github/echo/autoup/{log,config,cron,reboot,install,targets,compare} .github/echo/backup/log

          for B in $BANKS; do
            for d in \
              .github/echo/bank/$B/autoup/log \
              .github/echo/bank/$B/autoup/targets \
              .github/echo/bank/$B/autoup/compare; do
              mkdir -p "$d"
            done
          done

      - name: 🛠️ 패키지 설치 및 사전 상태 기록
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y unattended-upgrades cron
          sudo systemctl enable --now unattended-upgrades
          sudo systemctl enable --now cron
          dpkg -l | tee .github/echo/autoup/compare/pkg_before.txt

      - name: 📦 업그레이드 가능한 패키지 확인 및 저장
        run: |
          set -e
          apt list --upgradable 2>/dev/null | tee .github/echo/autoup/install/autoup_targets_all.txt
          BANKS="국민 우리 신한 하나 농협 기업 수협 ..."  # 동일 BANKS 사용
          for B in $BANKS; do
            cp .github/echo/autoup/install/autoup_targets_all.txt .github/echo/bank/$B/autoup/targets/autoup_targets.txt
          done

      - name: 🔧 정책 구성
        run: |
          set -e
          mkdir -p .github/echo/autoup/config
          echo 'APT::Periodic::Update-Package-Lists "1";' > .github/echo/autoup/config/10periodic
          echo 'APT::Periodic::Unattended-Upgrade "1";' > .github/echo/autoup/config/20auto-upgrades
          echo 'Unattended-Upgrade::Remove-Unused-Dependencies "true";' > .github/echo/autoup/config/30remove-unused
          echo 'Unattended-Upgrade::Automatic-Reboot "true";' > .github/echo/autoup/config/40auto-reboot
          echo 'Unattended-Upgrade::Automatic-Reboot-Time "03:30";' > .github/echo/autoup/config/50auto-reboot-time
          echo 'APT::Periodic::AutocleanInterval "7";' > .github/echo/autoup/config/60autoclean

      - name: ⏱️ cron 등록 (reboot/backup/autoup)
        run: |
          echo '0 3 * * * root /sbin/reboot' > .github/echo/autoup/cron/reboot_cron.txt
          echo '0 2 * * * root tar czf /tmp/backup_$(date +%Y%m%d_%H%M).tar.gz /etc /var/lib /home' > .github/echo/autoup/cron/backup_cron.txt
          echo '*/3 * * * * root /usr/bin/unattended-upgrade -d >> /var/log/unattended-upgrades/autoup.log 2>&1' > .github/echo/autoup/cron/autoup_cron.txt

      - name: 🔄 실제 업그레이드 실행 (옵션)
        run: |
          set -e
          # 실제 자동 업그레이드 실행. 원하지 않으면 아래 라인 주석 처리
          sudo unattended-upgrade -d | tee .github/echo/autoup/log/unattended_upgrade_run.log

      - name: 🧠 실행 후 패키지 비교 및 변경점 추출
        run: |
          set -e
          dpkg -l | tee .github/echo/autoup/compare/pkg_after.txt
          diff .github/echo/autoup/compare/pkg_before.txt .github/echo/autoup/compare/pkg_after.txt > .github/echo/autoup/compare/pkg_diff.txt || true

          awk '/^> /{print $0}' .github/echo/autoup/compare/pkg_diff.txt > .github/echo/autoup/compare/pkg_new_version.txt || true

          BANKS="국민 우리 신한 하나 농협 기업 수협 ..."  # 동일 BANKS 사용
          for B in $BANKS; do
            cp .github/echo/autoup/compare/pkg_new_version.txt .github/echo/bank/$B/autoup/compare/pkg_change_summary.txt
          done
