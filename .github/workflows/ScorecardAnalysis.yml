name: OpenSSF Scorecard Scan

on:
  push:
    branches:
      - main  # Adjust to your default branch name (e.g., master, develop)
  pull_request:
    branches:
      - main  # Adjust to your default branch name (e.g., master, develop)
  # You can also schedule scans, for example, weekly
  schedule:
    - cron: '30 1 * * 0' # Runs every Sunday at 01:30 UTC

jobs:
  scorecard:
    name: Run OpenSSF Scorecard Analysis
    runs-on: ubuntu-latest # Uses a fresh Ubuntu environment for each run
    permissions:
      contents: read         # Required to allow the action to read your repository code
      security-events: write # Required to allow the action to upload SARIF results to GitHub Code Scanning

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Checks out your repository code into the runner environment

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2 # Uses the official Scorecard GitHub Action
        with:
          # repo_token is a GitHub Actions secret automatically provided.
          # It grants permissions for the action to interact with GitHub's APIs
          # (e.g., fetch repository metadata for analysis).
          repo_token: ${{ secrets.GITHUB_TOKEN }}

          # results_file specifies the name of the file where the SARIF results will be stored.
          # The action automatically handles converting its output to SARIF.
          results_file: scorecard-results.sarif

          # publish_results: true would directly publish to Code Scanning.
          # However, explicitly using 'github/codeql-action/upload-sarif'
          # provides more control and clarity, especially when debugging.
          # Uncomment the line below if you prefer the action to directly publish:
          # publish_results: true

      - name: Upload Scorecard results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3 # Uploads the generated SARIF file to GitHub Code Scanning
        with:
          sarif_file: scorecard-results.sarif # Path to the SARIF file generated by the Scorecard action
          # category helps distinguish this scan from other scans in GitHub Code Scanning UI
          category: "OpenSSF Scorecard"
