name: 📁 Auto Expand Slot & Validate YAML

on:
  schedule:
    - cron: '*/1 * * * *'  # 매 1분마다 실행
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  expand-slot:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Detect next slot number
        id: detect
        run: |
          echo "[🔢] Detecting next slot number..."
          PREFIX=".github/autogen/slot-"
          EXISTING=$(find .github/autogen -maxdepth 1 -type d -name "slot-*" | wc -l)
          NEXT=$(printf "slot-%03d" $((EXISTING + 1)))
          echo "next_slot=$NEXT" >> $GITHUB_OUTPUT
          echo "[➡️] Next slot: $NEXT"

      - name: 📁 Create slot directory and copy workflows
        run: |
          SLOT=${{ steps.detect.outputs.next_slot }}
          SLOT_DIR=".github/autogen/$SLOT"
          mkdir -p "$SLOT_DIR/workflows"
          echo "[📂] Copying .github/workflows to $SLOT_DIR/workflows"
          cp .github/workflows/*.yml "$SLOT_DIR/workflows/" || echo "[⚠️] No workflows copied"

      - name: 🛠️ Create relaxed .yamllint.yml via echo
        run: |
          echo "[🛠️] Creating .yamllint.yml with relaxed rules..."
          echo "extends: default" > .yamllint.yml
          echo "" >> .yamllint.yml
          echo "rules:" >> .yamllint.yml
          echo "  line-length:" >> .yamllint.yml
          echo "    max: 300" >> .yamllint.yml
          echo "    level: warning" >> .yamllint.yml
          echo "  document-start:" >> .yamllint.yml
          echo "    present: false" >> .yamllint.yml
          echo "  truthy:" >> .yamllint.yml
          echo "    allowed-values: ['true', 'false', 'on', 'off', 'yes', 'no']" >> .yamllint.yml
          echo "  comments:" >> .yamllint.yml
          echo "    require-starting-space: false" >> .yamllint.yml
          echo "  trailing-spaces:" >> .yamllint.yml
          echo "    level: warning" >> .yamllint.yml
          echo "[✔] .yamllint.yml created"

      - name: 🧪 Retryable Lint with yamllint
        run: |
          echo "[🔍] Installing yamllint..."
          pip install --quiet yamllint
          SLOT_NAME=${{ steps.detect.outputs.next_slot }}
          TARGET=".github/autogen/$SLOT_NAME/workflows"
          MAX_RETRIES=3
          RETRY_COUNT=1
          while [ $RETRY_COUNT -le $MAX_RETRIES ]; do
            echo "[🤪] Attempt $RETRY_COUNT/$MAX_RETRIES: yamllint checking..."
            yamllint -c .yamllint.yml "$TARGET" && break || {
              echo "[❌] Lint failed on attempt $RETRY_COUNT"
              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep 2
            }
          done
          if [ $RETRY_COUNT -gt $MAX_RETRIES ]; then
            echo "[🚩] All $MAX_RETRIES attempts failed — continuing anyway (non-blocking)"
          fi

      - name: 📝 Add metadata files
        run: |
          SLOT=${{ steps.detect.outputs.next_slot }}
          echo "Slot generated at $(date -u)" > ".github/autogen/$SLOT/info.txt"
          echo "# Auto Slot: $SLOT" > ".github/autogen/$SLOT/README.md"
          ln -sfn "$SLOT" .github/slot-latest
          echo "[📄] info.txt and README.md added"

      - name: 🔀 Create Pull Request (no force-push)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "📁 Slot Expand: ${{ steps.detect.outputs.next_slot }}"
          branch: "slot-expand/${{ steps.detect.outputs.next_slot }}"
          title: "📁 Auto Expand: ${{ steps.detect.outputs.next_slot }}"
          body: |
            This PR includes:
            - All .yml copied from `.github/workflows`
            - Slot created: `.github/autogen/${{ steps.detect.outputs.next_slot }}`
            - Relaxed yamllint validation (non-blocking)
            - README.md and info.txt generated
          delete-branch: true
