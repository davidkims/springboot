name: 🚀 MEGA EchoOps + DB/Containers/ELK + Kafka/RabbitMQ/Vault + CodeQL/Security + 무한 Echo 확장

on:
  workflow_dispatch:
  schedule:
    - cron: '5,20,35,50 * * * *'

jobs:
  mega-echoops:
    runs-on: ubuntu-latest
    steps:

    - name: 📂 Checkout Repository
      uses: actions/checkout@v4

    - name: 📁 Create echo directories (Fix missing create_dirs.sh)
      run: |
        set -e
        mkdir -p .github/echo_dirs
        ECHO_SH=.github/echo_dirs/create_dirs.sh
        echo "#!/bin/bash" > $ECHO_SH
        for d in tools packages logs containers install restart upgrade exec compose services templates tests db elk grafana zipkin jenkins oracle postgres mongo redis kafka rabbitmq vault minio airflow spark camunda security codeql scorecard trivy; do
          mkdir -p ".github/echo_${d}"
          echo "echo '[ECHO] Directory created: .github/echo_${d}'" >> $ECHO_SH
        done
        chmod +x $ECHO_SH
        $ECHO_SH

    - name: 🔄 APT Update + Fix held packages
      run: |
        sudo apt-get update -y && sudo apt-get upgrade -y
        sudo apt-get autoremove -y
        sudo apt-get install -f -y
        sudo apt-mark unhold containerd docker.io || true
        sudo apt-get purge -y containerd containerd.io || true

    - name: ⚙️ Install Required Packages
      run: |
        set -e
        PKGS="curl wget git unzip jq cron ufw zsh htop vim tree gnupg2 lsb-release build-essential software-properties-common ca-certificates apt-transport-https"
        sudo apt-get install -y $PKGS
        for pkg in $PKGS; do
          echo "echo '[PKG] Installed: $pkg'" >> .github/echo_packages/install_$pkg.sh
        done

    - name: 🐳 Install Docker & Compose + Fix Echo Path
      run: |
        curl -fsSL https://get.docker.com -o get-docker.sh && sh get-docker.sh
        sudo systemctl enable docker
        sudo systemctl start docker
        sudo usermod -aG docker $USER || true
        sudo chmod 666 /var/run/docker.sock
        mkdir -p .github/echo_tools
        docker --version | tee .github/echo_tools/docker_version.txt || echo "docker version >> .github/echo_tools/docker_version.txt"

    - name: 🧱 Generate Template Files (.env/.cfg/.json)
      run: |
        mkdir -p .github/echo_templates
        echo "DB_USER=admin" > .github/echo_templates/sample.env
        echo "config.enabled=true" > .github/echo_templates/sample.cfg
        echo '{"service":"echoops","version":"1.0"}' > .github/echo_templates/sample.json

    - name: 📄 Generate docker-compose.yml + Echo
      run: |
        cat <<EOF > docker-compose.yml
        version: '3.8'
        services:
          kafka:
            image: bitnami/kafka
            ports: ["9092:9092"]
          rabbitmq:
            image: rabbitmq
            ports: ["5672:5672", "15672:15672"]
          vault:
            image: hashicorp/vault
            ports: ["8200:8200"]
          minio:
            image: minio/minio
            command: server /data
            ports: ["9000:9000"]
          airflow:
            image: apache/airflow
            ports: ["8081:8080"]
          spark:
            image: bitnami/spark
            ports: ["8088:8088"]
          camunda:
            image: camunda/camunda-bpm-platform
            ports: ["8089:8080"]
        EOF
        mkdir -p .github/echo_compose
        cp docker-compose.yml .github/echo_compose/docker-compose.yml

    - name: 🚀 Start Containers
      run: |
        docker compose up -d
        docker ps -a | tee .github/echo_logs/docker_ps.log

    - name: 🛡️ Run Security Scanners
      run: |
        mkdir -p .github/echo_security
        echo "gh codeql execute ..." > .github/echo_security/codeql_scan.sh
        echo "scorecard --repo=. ..." > .github/echo_security/scorecard_scan.sh
        echo "trivy fs . ..." > .github/echo_security/trivy_scan.sh

    - name: 🧪 Container Health Checks
      run: |
        for svc in kafka rabbitmq vault minio airflow spark camunda; do
          echo "[CHECK] $svc 상태 확인 중..." | tee -a .github/echo_tests/${svc}_health.log
          docker inspect --format='{{.Name}} => {{.State.Status}}' $svc || echo "⚠️ $svc 상태 불명" >> .github/echo_tests/${svc}_health.log
        done

    - name: 📊 Summary Echo
      run: |
        echo "[SUMMARY] 모든 작업 완료됨" | tee .github/echo_logs/final_summary.log
        find .github -type f >> .github/echo_logs/final_summary.log
