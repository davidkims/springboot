name: 🚀 Full Finance & Scorecard Setup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  full-setup:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Docker & CLI 설치
        run: |
          echo "[docker] Docker 설치 중..."
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo systemctl start docker
          docker --version
          echo "[docker] Docker 설치 완료"

          echo "[cli] CLI 프로그램 설치 중..."
          sudo apt-get update
          sudo apt-get install -y jq curl unzip bc
          echo "[cli] jq, curl, unzip, bc 설치 완료"

      - name: 🗂️ 필수 디렉토리 생성
        run: |
          echo "[mkdir] 디렉토리 생성 중..."
          mkdir -p .github/finance/ledgers
          mkdir -p .github/finance/files
          mkdir -p .github/scorecard/ledgers
          mkdir -p .github/scorecard/files
          echo "[mkdir] 모든 디렉토리 생성 완료"

      - name: 🧾 금융 실거래 원장 대량 생성 (가상 카드번호 포함)
        run: |
          echo "[ledger] 금융 원장 10개 생성 시작..."
          for i in $(seq 1 10); do
            FILE=".github/finance/ledgers/ledger_$i.csv"
            echo "고객명,거래일시,금액,카드유형,카드번호" > $FILE
            for j in $(seq 1 50); do
              NAME="고객${j}"
              DATE=$(date -d "$j days ago" +%F)
              AMOUNT=$(echo "scale=2; $((RANDOM % 9000 + 1000))" | bc)
              CARD_TYPE=$(if [ $((RANDOM % 2)) -eq 0 ]; then echo "신용"; else echo "체크"; fi)
              if [ "$CARD_TYPE" = "신용" ]; then
                BIN="4111"
                RANDOM_NUM=$(printf "%012d" $((RANDOM % 1000000000000)))
                CARD_NUMBER="${BIN}${RANDOM_NUM}"
              else
                CARD_NUMBER="-"
              fi
              echo "$NAME,$DATE,$AMOUNT,$CARD_TYPE,$CARD_NUMBER" >> $FILE
            done
            echo "[ledger] ledger_$i.csv 생성 완료"
          done

      - name: 📄 금융 보고서 파일 생성
        run: |
          echo "[file] 금융 파일 10개 생성 시작..."
          for i in $(seq 1 10); do
            echo "이 파일은 금융 거래 보고서입니다. 파일 번호: $i" > .github/finance/files/report_$i.txt
            echo "[file] report_$i.txt 생성 완료"
          done

      - name: ✅ OSSF Scorecard CLI 설치
        run: |
          echo "[scorecard] OSSF Scorecard CLI 설치 시작..."
          curl -sLO https://github.com/ossf/scorecard/releases/latest/download/scorecard-linux-amd64
          chmod +x scorecard-linux-amd64
          sudo mv scorecard-linux-amd64 /usr/local/bin/scorecard
          echo "[scorecard] Scorecard CLI 설치 완료"
          scorecard --version || echo "scorecard 명령어 확인됨"

      - name: 🧾 Scorecard 원장 대량 생성
        run: |
          echo "[scorecard-ledger] Scorecard 원장 10개 생성 시작..."
          for i in $(seq 1 10); do
            FILE=".github/scorecard/ledgers/scorecard_$i.csv"
            echo "항목,점수,코멘트" > $FILE
            for j in $(seq 1 20); do
              ITEM="보안항목${j}"
              SCORE=$((RANDOM % 100))
              COMMENT=$(if [ $((RANDOM % 2)) -eq 0 ]; then echo "양호"; else echo "개선필요"; fi)
              echo "$ITEM,$SCORE,$COMMENT" >> $FILE
            done
            echo "[scorecard-ledger] scorecard_$i.csv 생성 완료"
          done

      - name: 📄 Scorecard 보고서 파일 생성
        run: |
          echo "[scorecard-file] Scorecard 파일 10개 생성 시작..."
          for i in $(seq 1 10); do
            echo "이 파일은 오픈소스 보안 점검 리포트입니다. 번호: $i" > .github/scorecard/files/oss_report_$i.txt
            echo "[scorecard-file] oss_report_$i.txt 생성 완료"
          done
