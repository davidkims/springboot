name: 📞 Update README with Portfolio + Workflow Stats + Auto Rerun

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update_readme:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📅 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Install GitHub CLI
        run: |
          echo "[🔧] GitHub CLI 설치 중..."
          sudo apt-get update
          sudo apt-get install -y gh
          gh --version

      - name: 📊 Collect Workflow Stats
        run: |
          echo "[📊] 원호 환상 통계 수집..."
          mkdir -p .tmp
          OUTPUT_FILE=".tmp/workflows.md"
          echo "## ⚙️ GitHub Actions 원호 목록 및 통계" > "$OUTPUT_FILE"
          echo "" >> "$OUTPUT_FILE"
          echo "| 원호 이름 | 실행 수 | 성공 수 | 실패 수 | 성공률 |" >> "$OUTPUT_FILE"
          echo "|----------------|--------:|--------:|--------:|--------:|" >> "$OUTPUT_FILE"

          for f in .github/workflows/*.yml; do
            NAME=$(grep '^name:' "$f" | head -n1 | cut -d ':' -f2- | xargs)
            FILENAME=$(basename "$f")
            echo "[🔍] 처리 중: $NAME ($FILENAME)"

            RUNS=$(gh run list --workflow="$FILENAME" --limit 100 --json conclusion -q '.[] | .conclusion' || echo "")
            TOTAL=$(echo "$RUNS" | wc -l)
            SUCCESS=$(echo "$RUNS" | grep -c "success" || true)
            FAILURE=$(($TOTAL - $SUCCESS))
            if [ "$TOTAL" -gt 0 ]; then
              RATE=$(awk "BEGIN {printf \"%.1f\", ($SUCCESS/$TOTAL)*100}")
            else
              RATE="N/A"
            fi

            echo "| $NAME | $TOTAL | $SUCCESS | $FAILURE | $RATE% |" >> "$OUTPUT_FILE"
          done

          cat "$OUTPUT_FILE"

      - name: 📂 Ensure .tmp Directory
        run: |
          echo "[📁] .tmp 디렉토리 존재 여부 확인"
          mkdir -p .tmp

      - name: 📜 Generate README.md
        run: |
          echo "[📄] README.md 생성 중..."
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S KST')
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"

          {
            echo "# 👨‍💻 김병권 포토필로 자리서"
            echo ""
            for badge in .github/workflows/*.yml; do
              FILE=$(basename "$badge")
              echo "[![Workflow: $FILE](https://github.com/${REPO}/actions/workflows/$FILE/badge.svg)](https://github.com/${REPO}/actions/workflows/$FILE)"
            done
            echo ""
            echo "자동으로 관리되는 프로젝트입니다. 매 시간 정각에 업데이트됩니다."
            echo ""
            echo "## 🧑‍💻 개발자 소개"
            echo "- 이름: 김병권"
            echo "- 분야: 백엔드, GitHub Actions, 보안 자동화"
            echo "- 스택: Python, Java, Spring Boot, FastAPI, Docker, PostgreSQL, MySQL"
            echo ""
            echo "## 📅 마지막 업데이트"
            echo "- $TIMESTAMP"
            echo ""
            echo "## ✅ 현재 브랜치"
            echo "- $BRANCH"
            echo ""
            cat .tmp/workflows.md
          } > README.md

      - name: 📤 Commit & Push Changes
        run: |
          echo "[🔁] 변경사항 확인 및 Git 설정"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --exit-code --quiet README.md; then
            echo "[⏭️] 변경사항 없음"
          else
            echo "[✅] 변경사항 감지됨 - Pull 후 Push 시도"
            if git pull --rebase origin main; then
              echo "[🔄] rebase 성공"
              git add README.md
              git commit -m "Docs: Update README with workflow stats [skip ci]"
              git push
              echo "[🚀] 정상 Push 완료"
            else
              echo "[⚠️] rebase 실패 - PR 자동 생성 시도"
              BRANCH="update-readme-$(date +%s)"
              git checkout -b "$BRANCH"
              git add README.md
              git commit -m "Docs: Update README with workflow stats [skip ci]"
              git push origin "$BRANCH"
              gh pr create --title "Docs: Update README with workflow stats" --body "자동 생성된 PR입니다." --base main --label "documentation,auto-generated" --reviewer "${{ github.actor }}"
              echo "[📦] PR 생성 완료"
            fi
          fi

      - name: 🔁 Auto-rerun Failed Workflows
        run: |
          echo "[🔁] 최근 실패 워크플로우 재실행 중..."
          gh run list --limit 10 --json databaseId,conclusion -q '.[] | select(.conclusion != "success") | .databaseId' | while read -r ID; do
            echo "[🔁] 워크플로우 ID $ID → 재실행"
            gh run rerun "$ID" || echo "[⚠️] 실패"
          done
