name: 🔒 Integrated Blacklist Generator (Every 1 min · Mandatory DC · Fail-safe · Echo · Mass Dirs)

on:
  schedule:
    - cron: "*/1 * * * *"   # 1분마다 (GitHub이 지연/스킵할 수 있음)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: blacklist-integrated
  cancel-in-progress: true

env:
  # 루트/결과 디렉터리
  BLACKLIST_DIR: .github/blacklist
  REPORT_DIR: .github/blacklist/report
  EXPORT_DIR: .github/blacklist/export
  SNAPSHOT_DIR: .github/blacklist/snapshots
  ARCHIVE_DIR: .github/blacklist/archive
  LATEST_DIR: .github/blacklist/latest
  # 서브(대량 생성 대상)
  NET_DIR: .github/blacklist/networks
  PKG_DIR: .github/blacklist/packages
  CODE_DIR: .github/blacklist/code
  SUMMARY_DIR: .github/blacklist/summary

  # 공개 피드만 사용
  ENABLE_SPAMHAUS: "true"
  ENABLE_EMERGING_THREATS: "true"

  # 로컬/무료 도구
  ENABLE_PY_AUDIT: "auto"
  ENABLE_NPM_AUDIT: "auto"
  ENABLE_SEMGREP: "true"

  # OWASP Dependency-Check (필수 실행)
  DC_VERSION: "9.2.0"
  DC_HOME: /opt/dependency-check
  DC_DATA: /opt/dependency-check/data

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🧭 Echo start & env
        run: |
          echo "[ECHO] ▶ 통합 블랙리스트 워크플로우 시작"
          echo "[ECHO] 브랜치: $(git rev-parse --abbrev-ref HEAD)"
          echo "[ECHO] 커밋: $(git rev-parse --short HEAD)"
          echo "RUN_DATE_UTC=$(date -u +%Y%m%dT%H%M%SZ)" >> $GITHUB_ENV
          echo "LOGFILE=.github/blacklist/logs/run_$(date -u +%Y%m%dT%H%M%SZ).log" >> $GITHUB_ENV
          echo "[ECHO] 실행 시각(UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: 📁 Create mass directories
        run: |
          set -e
          mkdir -p \
            "$BLACKLIST_DIR"/{raw,dist,logs} \
            "$REPORT_DIR" \
            "$EXPORT_DIR"/{json,txt,csv,html} \
            "$SNAPSHOT_DIR" "$ARCHIVE_DIR" "$LATEST_DIR" \
            "$NET_DIR"/{spamhaus,et,all} \
            "$PKG_DIR"/{python,npm,dc} \
            "$CODE_DIR"/semgrep \
            "$SUMMARY_DIR"
          SNAP_DIR="$SNAPSHOT_DIR/$RUN_DATE_UTC"
          mkdir -p "$SNAP_DIR"/{networks,packages,code,summary,logs}
          echo "SNAP_DIR=$SNAP_DIR" >> $GITHUB_ENV
          echo "[ECHO] 디렉터리 생성 완료 (스냅샷: $SNAP_DIR)" | tee -a "$LOGFILE"

      - name: 🗂️ Bootstrap placeholder files via echo
        run: |
          set -e
          echo "# Blacklist Outputs" > "$BLACKLIST_DIR/README.md"
          echo "{ \"generated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"version\": 1 }" > "$BLACKLIST_DIR/manifest.json"
          for d in "$BLACKLIST_DIR" "$REPORT_DIR" "$EXPORT_DIR" "$SNAPSHOT_DIR" "$ARCHIVE_DIR" "$LATEST_DIR" \
                   "$NET_DIR/spamhaus" "$NET_DIR/et" "$NET_DIR/all" \
                   "$PKG_DIR/python" "$PKG_DIR/npm" "$PKG_DIR/dc" \
                   "$CODE_DIR/semgrep" "$SUMMARY_DIR" \
                   "$SNAP_DIR" "$SNAP_DIR/networks" "$SNAP_DIR/packages" "$SNAP_DIR/code" "$SNAP_DIR/summary" "$SNAP_DIR/logs"; do
            touch "$d/.gitkeep"
          done
          echo "[ECHO] 플레이스홀더/매니페스트 생성" | tee -a "$LOGFILE"

      - name: 🧰 Setup Python & Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: ⬆️ Install/Upgrade CLI tools
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y unzip
          python -m pip install --upgrade pip
          pip install -U pip-audit safety semgrep jq yq
          npm i -g npm@latest
          echo "[ECHO] 도구 설치/업그레이드 완료 (pip-audit, safety, semgrep, jq, yq, unzip, npm)" | tee -a "$LOGFILE"

      # -------------------------------
      # 0) OWASP Dependency-Check (필수)
      # -------------------------------
      - name: ♻️ Cache OWASP DC Data (NVD DB)
        id: cache-dc
        uses: actions/cache@v4
        with:
          path: ${{ env.DC_DATA }}
          key: dc-data-${{ env.DC_VERSION }}-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/build.gradle*', '**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml', '**/requirements*.txt', '**/Pipfile.lock', '**/poetry.lock') }}
          restore-keys: |
            dc-data-${{ env.DC_VERSION }}-${{ runner.os }}-

      - name: 🛠 Install OWASP Dependency-Check CLI (robust, echo)
        run: |
          set -e
          echo "[ECHO] DC 설치 시작 v${DC_VERSION}" | tee -a "$LOGFILE"
          echo "DC_READY=false" >> $GITHUB_ENV
          sudo rm -rf "${DC_HOME}"
          sudo mkdir -p "${DC_HOME}" "${DC_DATA}"
          curl -sSL -o /tmp/dc.zip "https://github.com/jeremylong/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip" || echo "[WARN] DC ZIP 다운로드 실패" | tee -a "$LOGFILE"
          if [ -f /tmp/dc.zip ]; then
            sudo unzip -q /tmp/dc.zip -d /opt || echo "[WARN] DC ZIP 해제 실패" | tee -a "$LOGFILE"
            FOUND="$(ls -d /opt/dependency-check-* 2>/dev/null | head -n1 || true)"
            if [ -n "$FOUND" ] && [ -d "$FOUND" ]; then
              sudo mv "$FOUND" "${DC_HOME}" || true
              if [ -f "${DC_HOME}/bin/dependency-check.sh" ]; then
                sudo chmod +x "${DC_HOME}/bin/dependency-check.sh"
                echo "DC_READY=true" >> $GITHUB_ENV
                echo "[ECHO] DC 설치 완료 (HOME=${DC_HOME}, DATA=${DC_DATA})" | tee -a "$LOGFILE"
              else
                echo "[WARN] DC 실행 파일 없음 → 자리표시자 유지" | tee -a "$LOGFILE"
              fi
            else
              echo "[WARN] DC 설치 경로 탐색 실패 → 자리표시자 유지" | tee -a "$LOGFILE"
            fi
            rm -f /tmp/dc.zip
          else
            echo "[WARN] DC ZIP 미존재 → 자리표시자 유지" | tee -a "$LOGFILE"
          fi
          # 자리표시자 보장
          mkdir -p "$PKG_DIR/dc"
          [ -f "$PKG_DIR/dc/dc_report.json" ] || echo "{}" > "$PKG_DIR/dc/dc_report.json"
          [ -f "$PKG_DIR/dc/dc_report.html" ] || echo "<html><body>no report</body></html>" > "$PKG_DIR/dc/dc_report.html"

      - name: 🔎 DC 실행 (JSON + HTML, fail-safe, echo/복사 보장)
        run: |
          set -e
          echo "[ECHO] DC 실행 단계 시작" | tee -a "$LOGFILE"
          mkdir -p "$PKG_DIR/dc" "$EXPORT_DIR/json" "$EXPORT_DIR/html"
          if [ "${DC_READY:-false}" != "true" ]; then
            echo "[WARN] DC_READY=false → 실행 생략, 자리표시자 유지" | tee -a "$LOGFILE"
          else
            if ! "${DC_HOME}/bin/dependency-check.sh" \
                  --project "BlacklistScan" \
                  --scan . \
                  --format JSON \
                  --format HTML \
                  --out "$PKG_DIR/dc" \
                  --data "$DC_DATA" \
                  --failOnCVSS 0 ; then
              echo "[WARN] DC 실행 경고/오류 발생(계속 진행)" | tee -a "$LOGFILE"
            fi
            [ -f "$PKG_DIR/dc/dependency-check-report.json" ] && mv -f "$PKG_DIR/dc/dependency-check-report.json" "$PKG_DIR/dc/dc_report.json"
            [ -f "$PKG_DIR/dc/dependency-check-report.html" ] && mv -f "$PKG_DIR/dc/dependency-check-report.html" "$PKG_DIR/dc/dc_report.html"
          fi
          [ -f "$PKG_DIR/dc/dc_report.json" ] || echo "{}" > "$PKG_DIR/dc/dc_report.json"
          [ -f "$PKG_DIR/dc/dc_report.html" ] || echo "<html><body>no report</body></html>" > "$PKG_DIR/dc/dc_report.html"
          cp -f "$PKG_DIR/dc/dc_report.json" "$EXPORT_DIR/json/dc_report.json" || true
          cp -f "$PKG_DIR/dc/dc_report.html" "$EXPORT_DIR/html/dc_report.html" || true
          echo "[ECHO] DC 실행/표준화/복사 완료" | tee -a "$LOGFILE"

      # ------------------------------------
      # 1) 네트워크/IP 블랙리스트 (공개 피드, fail-safe)
      # ------------------------------------
      - name: 🌐 Spamhaus (DROP/EDROP) — fail-safe
        if: env.ENABLE_SPAMHAUS == 'true'
        run: |
          set -u
          echo "[ECHO] Spamhaus 수집 시작" | tee -a "$LOGFILE"
          mkdir -p "$NET_DIR/spamhaus"
          if ! curl -fsSL https://www.spamhaus.org/drop/drop.txt | grep -v '^;' > "$NET_DIR/spamhaus/drop.txt" 2>/dev/null; then
            echo "[WARN] drop.txt 실패 → 빈 파일" | tee -a "$LOGFILE"; > "$NET_DIR/spamhaus/drop.txt"
          fi
          if ! curl -fsSL https://www.spamhaus.org/drop/edrop.txt | grep -v '^;' > "$NET_DIR/spamhaus/edrop.txt" 2>/dev/null; then
            echo "[WARN] edrop.txt 실패 → 빈 파일" | tee -a "$LOGFILE"; > "$NET_DIR/spamhaus/edrop.txt"
          fi
          cat "$NET_DIR/spamhaus/"*.txt 2>/dev/null | sort -u > "$NET_DIR/all/ip_blacklist_spamhaus.txt" || true
          [ -s "$NET_DIR/all/ip_blacklist_spamhaus.txt" ] || echo "" > "$NET_DIR/all/ip_blacklist_spamhaus.txt"
          wc -l "$NET_DIR/all/ip_blacklist_spamhaus.txt" | awk '{print "[ECHO] Spamhaus IP 수:", $1}' | tee -a "$LOGFILE"
          echo "[ECHO] Spamhaus 수집 종료" | tee -a "$LOGFILE"

      - name: ⚠️ Emerging Threats (IP) — fail-safe
        if: env.ENABLE_EMERGING_THREATS == 'true'
        run: |
          set -u
          echo "[ECHO] Emerging Threats 수집 시작" | tee -a "$LOGFILE"
          mkdir -p "$NET_DIR/et"
          if ! curl -fsSL https://rules.emergingthreats.net/blockrules/compromised-ips.txt > "$NET_DIR/et/ips.txt"; then
            echo "[WARN] ET ips.txt 실패 → 빈 파일" | tee -a "$LOGFILE"; > "$NET_DIR/et/ips.txt"
          fi
          (cat "$NET_DIR/et/ips.txt" 2>/dev/null || true) | grep -E '^[0-9]' | sort -u > "$NET_DIR/all/ip_blacklist_et.txt" || true
          [ -s "$NET_DIR/all/ip_blacklist_et.txt" ] || echo "" > "$NET_DIR/all/ip_blacklist_et.txt"
          wc -l "$NET_DIR/all/ip_blacklist_et.txt" | awk '{print "[ECHO] ET IP 수:", $1}' | tee -a "$LOGFILE"
          echo "[ECHO] Emerging Threats 수집 종료" | tee -a "$LOGFILE"

      # -------------------------
      # 2) 패키지 블랙리스트
      # -------------------------
      - name: 🐍 pip-audit (auto, fail-safe)
        run: |
          set -e
          echo "[ECHO] pip-audit 사전 점검" | tee -a "$LOGFILE"
          mkdir -p "$PKG_DIR/python"
          if ls requirements*.txt Pipfile.lock poetry.lock 2>/dev/null | grep -q .; then
            echo "[ECHO] pip-audit 실행" | tee -a "$LOGFILE"
            (pip-audit -f json || true) | tee "$PKG_DIR/python/pip_audit.json" >/dev/null
          else
            echo "[ECHO] Python 종속성 파일 없음 → 자리표시자 생성" | tee -a "$LOGFILE"
            echo "{}" > "$PKG_DIR/python/pip_audit.json"
          fi

      - name: 🛡️ safety (json only, fail-safe)
        run: |
          set -e
          echo "[ECHO] safety 실행" | tee -a "$LOGFILE"
          mkdir -p "$PKG_DIR/python"
          (safety check --json || true) | tee "$PKG_DIR/python/safety.json" >/dev/null
          [ -s "$PKG_DIR/python/safety.json" ] || echo "{}" > "$PKG_DIR/python/safety.json"

      - name: 📦 npm audit (auto, fail-safe)
        run: |
          set -e
          echo "[ECHO] npm audit 사전 점검" | tee -a "$LOGFILE"
          mkdir -p "$PKG_DIR/npm"
          if ls package-lock.json yarn.lock pnpm-lock.yaml 2>/dev/null | grep -q .; then
            echo "[ECHO] npm audit 실행" | tee -a "$LOGFILE"
            (npm audit --json || true) | tee "$PKG_DIR/npm/npm_audit.json" >/dev/null
            [ -s "$PKG_DIR/npm/npm_audit.json" ] || echo "{}" > "$PKG_DIR/npm/npm_audit.json"
          else
            echo "[ECHO] JS 락파일 없음 → 자리표시자 생성" | tee -a "$LOGFILE"
            echo "{}" > "$PKG_DIR/npm/npm_audit.json"
          fi

      # -------------------------
      # 3) 코드 정적분석 (Semgrep)
      # -------------------------
      - name: 🔎 Semgrep (p/ci, 로컬, fail-safe)
        run: |
          set -e
          echo "[ECHO] Semgrep 실행 (p/ci, 로컬 전용)" | tee -a "$LOGFILE"
          mkdir -p "$CODE_DIR/semgrep"
          (semgrep ci --no-suppress-errors --config p/ci --json || true) | tee "$CODE_DIR/semgrep/semgrep.json" >/dev/null
          [ -s "$CODE_DIR/semgrep/semgrep.json" ] || echo "{}" > "$CODE_DIR/semgrep/semgrep.json"
          echo "[ECHO] Semgrep 결과 생성" | tee -a "$LOGFILE"

      # -------------------------
      # 4) Export / Latest / Snapshot 동기화
      # -------------------------
      - name: 🚚 Copy artifacts to export/latest/snapshot
        run: |
          set -e
          echo "[ECHO] 복사/동기화 시작" | tee -a "$LOGFILE"
          mkdir -p "$EXPORT_DIR/json" "$EXPORT_DIR/txt" "$EXPORT_DIR/html"
          # networks
          cp -f "$NET_DIR/all/ip_blacklist_spamhaus.txt" "$EXPORT_DIR/txt/ip_blacklist_spamhaus.txt" || true
          cp -f "$NET_DIR/all/ip_blacklist_et.txt" "$EXPORT_DIR/txt/ip_blacklist_et.txt" || true
          # packages
          cp -f "$PKG_DIR/python/pip_audit.json" "$EXPORT_DIR/json/pip_audit.json" || true
          cp -f "$PKG_DIR/python/safety.json" "$EXPORT_DIR/json/safety.json" || true
          cp -f "$PKG_DIR/npm/npm_audit.json" "$EXPORT_DIR/json/npm_audit.json" || true
          cp -f "$PKG_DIR/dc/dc_report.json" "$EXPORT_DIR/json/dc_report.json" || true
          cp -f "$PKG_DIR/dc/dc_report.html" "$EXPORT_DIR/html/dc_report.html" || true
          # code
          cp -f "$CODE_DIR/semgrep/semgrep.json" "$EXPORT_DIR/json/semgrep.json" || true

          # latest 갱신
          rsync -a --delete "$EXPORT_DIR/" "$LATEST_DIR/"

          # snapshot 보관
          rsync -a "$EXPORT_DIR/" "$SNAP_DIR/"

          echo "[ECHO] 복사/동기화 완료" | tee -a "$LOGFILE"

      # -------------------------
      # 5) 요약 파일 생성(ECHO)
      # -------------------------
      - name: 🧾 Generate summaries (JSON/MD via echo)
        run: |
          set -e
          echo "[ECHO] 요약 파일 생성" | tee -a "$LOGFILE"
          SUMMARY_JSON="$SUMMARY_DIR/summary_${RUN_DATE_UTC}.json"
          SUMMARY_MD="$SUMMARY_DIR/summary_${RUN_DATE_UTC}.md"
          # JSON 요약
          {
            echo "{"
            echo "  \"run_at_utc\": \"${RUN_DATE_UTC}\","
            echo "  \"spamhaus_count\": $(wc -l < "$NET_DIR/all/ip_blacklist_spamhaus.txt" 2>/dev/null || echo 0),"
            echo "  \"et_count\": $(wc -l < "$NET_DIR/all/ip_blacklist_et.txt" 2>/dev/null || echo 0),"
            echo "  \"files\": {"
            for f in "$EXPORT_DIR"/**/* "$PKG_DIR/dc/dc_report.html" 2>/dev/null; do
              if [ -f "$f" ]; then
                sz=$(wc -c < "$f" 2>/dev/null || echo 0)
                bn=$(echo "$f" | sed 's#^./##')
                echo "    \"${bn}\": ${sz},"
              fi
            done
            echo "    \"_end\": 0"
            echo "  }"
            echo "}"
          } > "$SUMMARY_JSON"

          # MD 요약
          {
            echo "# Blacklist Summary (${RUN_DATE_UTC})"
            echo ""
            echo "- Spamhaus: $(wc -l < "$NET_DIR/all/ip_blacklist_spamhaus.txt" 2>/dev/null || echo 0) IPs"
            echo "- EmergingThreats: $(wc -l < "$NET_DIR/all/ip_blacklist_et.txt" 2>/dev/null || echo 0) IPs"
            echo ""
            echo "## Files (bytes)"
            for f in "$EXPORT_DIR"/**/* "$PKG_DIR/dc/dc_report.html" 2>/dev/null; do
              if [ -f "$f" ]; then
                sz=$(wc -c < "$f" 2>/dev/null || echo 0)
                echo "- $(echo "$f" | sed 's#^./##'): $sz"
              fi
            done
          } > "$SUMMARY_MD"

          # 콘솔 요약
          echo "[ECHO] ===== 결과 요약 ====="
          for f in "$EXPORT_DIR"/**/* "$PKG_DIR/dc/dc_report.html" 2>/dev/null; do
            if [ -f "$f" ]; then
              sz=$(wc -c < "$f" 2>/dev/null || echo 0)
              echo "[ECHO] 파일: $(echo "$f" | sed 's#^./##'), 크기(bytes): ${sz}"
            fi
          done
          echo "[ECHO] ====================="

      # -------------------------
      # 6) 변경사항 자동 커밋/PR (변경 있을 때만)
      # -------------------------
      - name: 🧪 Detect changes
        id: changes
        run: |
          set -e
          echo "[ECHO] 변경사항 검사 시작" | tee -a "$LOGFILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$BLACKLIST_DIR" || true
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "[ECHO] 변경 없음" | tee -a "$LOGFILE"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "[ECHO] 변경 감지됨" | tee -a "$LOGFILE"
          fi

      - name: 🪵 Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -e
          MSG="chore(blacklist): update outputs at ${RUN_DATE_UTC}"
          git commit -m "$MSG"
          echo "[ECHO] 커밋 완료: $MSG" | tee -a "$LOGFILE"

      - name: 🔀 Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/blacklist-${{ env.RUN_DATE_UTC }}
          title: "chore(blacklist): update outputs at ${{ env.RUN_DATE_UTC }}"
          commit-message: "chore(blacklist): update outputs at ${{ env.RUN_DATE_UTC }}"
          body: |
            Automated blacklist & reports update.
            - Run at (UTC): ${{ env.RUN_DATE_UTC }}
            - See `${{ env.BLACKLIST_DIR }}` for details.
          labels: |
            automated
            security
