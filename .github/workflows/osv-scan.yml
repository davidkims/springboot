name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '34 20 * * 2'
  push:
    branches: [ "main" ]

permissions:
  security-events: write
  contents: read

jobs:
  osv-scan:
    name: 🛡️ OSV-Scanner
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Update & Install Required Packages
        run: |
          echo "[+] Updating APT and upgrading packages..."
          sudo apt-get update -y
          sudo apt-get upgrade -y
          echo "[+] Installing: jq curl unzip git gh"
          sudo apt-get install -y jq curl unzip git gh

      - name: 🧪 Download and Run OSV Scanner with Retry + Fallback
        run: |
          echo "[🧪] Downloading osv-scanner binary..."

          VERSION="1.7.1"
          FILENAME="osv-scanner_${VERSION}_linux_amd64"
          PRIMARY_URL="https://github.com/google/osv-scanner/releases/download/v${VERSION}/${FILENAME}"
          MIRROR_URL="https://mirror.example.com/${FILENAME}"  # ❗ 미러 필요 시 교체

          for attempt in {1..3}; do
            echo "[🌐] Attempt $attempt: Downloading from primary..."
            if curl -sSL --fail "$PRIMARY_URL" -o osv-scanner; then
              echo "[✔] Download succeeded from primary URL"
              break
            else
              echo "[!] Attempt $attempt failed"
              if [ $attempt -eq 3 ]; then
                echo "[⚠] Trying fallback mirror..."
                if curl -sSL --fail "$MIRROR_URL" -o osv-scanner; then
                  echo "[✔] Fallback download succeeded"
                  break
                else
                  echo "[❌] Fallback failed. Exiting"
                  exit 1
                fi
              fi
              sleep 2
            fi
          done

          chmod +x osv-scanner
          echo "[🚀] Running osv-scanner..."
          ./osv-scanner -r --skip-git ./ | tee osv-results.txt

      - name: 📁 Convert to SARIF
        run: |
          echo "[📄] Converting output to SARIF..."
          ./osv-scanner -r --skip-git ./ --format sarif > osv-results.sarif
          echo "[✔] SARIF saved to osv-results.sarif"
          head -n 15 osv-results.sarif

      - name: 📤 Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
