name: DB CLI Remake Automation (최신 DB CLI robust 설치 포함, 모든 구문 오류 방지)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  db-cli-remake-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DBCLI_DIR: .github/dbcli
      OUTPUT_DIR: .github/dbcli/output
      VA_DIR: .github/dbcli/virtual_accounts
      ORDER_DIR: .github/dbcli/orders
      USER_DIR: .github/dbcli/users
      TMP_SAFE_DIR: /tmp/dbcli_safe_tmp
      DB2_CLI_URL: "https://public.dhe.ibm.com/ibmdl/export/pub/software/data/db2/drivers/odbc_cli/linuxx64_odbc_cli.tar.gz"
      DB2_CLI_DIR: /opt/ibm/db2_cli
      MIN_FREE_MB: 500

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ 필수 도구 및 DB CLI 사전 설치(확장)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tree jq curl wget lsb-release mariadb-client percona-toolkit || true

      - name: ♻️ 리메이크 robust 생성/삭제/echo/df/정수 robust
        run: |
          set -e

          robust_mkdir() {
            DIR="$1"
            if [ -e "$DIR" ] && [ ! -d "$DIR" ]; then
              echo "[⚠️][robust] $DIR: 파일이 디렉토리 이름과 충돌, 파일 삭제"
              rm -f "$DIR"
            fi
            mkdir -p "$DIR"
            chmod 700 "$DIR"
          }

          MIN_FREE_MB=${MIN_FREE_MB:-500}
          check_free() {
            DIR="$1"
            robust_mkdir "$DIR"
            MB=$(df -Pm "$DIR" 2>/dev/null | awk 'NR==2 {print $4}')
            if ! [[ "$MB" =~ ^[0-9]+$ ]]; then
              echo "[❗][robust] $DIR df 결과 비정상 (MB='$MB'), MB=0으로 처리"
              MB=0
            fi
            if [ "$MB" -lt "$MIN_FREE_MB" ]; then
              echo "[❗][용량] $DIR 디스크 여유 $MB MB → $MIN_FREE_MB MB 이상 필요, 10초 후 재시도"
              df -h "$DIR" || true
              sleep 10
              return 1
            else
              echo "[✅][용량] $DIR 여유 $MB MB"
              return 0
            fi
          }

          robust_rm() {
            TARGET="$1"
            if [ -f "$TARGET" ]; then
              rm -f "$TARGET"
              echo "[🧹][robust] $TARGET 파일 삭제"
            elif [ -d "$TARGET" ]; then
              rm -rf "$TARGET"
              echo "[🧹][robust] $TARGET 디렉토리(및 하위 전체) 삭제"
            fi
          }

          robust_echo() {
            CONTENT="$1"
            TARGET="$2"
            DIR=$(dirname "$TARGET")
            robust_mkdir "$DIR"
            if [ -e "$TARGET" ]; then
              if [ -d "$TARGET" ]; then
                echo "[⚠️][에러] $TARGET (echo 대상이 디렉토리, robust_rm로 삭제 후 파일 생성)"
                robust_rm "$TARGET"
              else
                rm -f "$TARGET"
              fi
            fi
            echo "$CONTENT" > "$TARGET"
            chmod 600 "$TARGET"
            echo "[✅][robust] $TARGET robust echo 파일 생성 성공"
          }
          robust_append() {
            TARGET="$1"
            LINE="$2"
            DIR=$(dirname "$TARGET")
            robust_mkdir "$DIR"
            if [ -e "$TARGET" ] && [ -d "$TARGET" ]; then
              echo "[⚠️][에러] $TARGET (append 대상이 디렉토리, robust_rm로 삭제 후 빈파일 생성)"
              robust_rm "$TARGET"
              touch "$TARGET"
              chmod 600 "$TARGET"
            elif [ ! -e "$TARGET" ]; then
              touch "$TARGET"
              chmod 600 "$TARGET"
            fi
            echo "$LINE" >> "$TARGET"
          }
          robust_touch() {
            FILE="$1"
            DIR=$(dirname "$FILE")
            robust_mkdir "$DIR"
            if [ -e "$FILE" ] && [ -d "$FILE" ]; then
              echo "[⚠️][에러] $FILE (touch 대상이 디렉토리, robust_rm로 삭제 후 빈파일 생성)"
              robust_rm "$FILE"
            fi
            touch "$FILE"
            chmod 600 "$FILE"
            echo "[✅][robust] $FILE robust 빈파일 생성 성공"
          }

          robust_rmdir() {
            DIR="$1"
            [ -d "$DIR" ] && rm -rf "$DIR"
          }

          for DB in mysql mariadb percona postgresql sqlite redis clickhouse firebird db2; do
            robust_mkdir "$DBCLI_DIR/$DB"
          done
          robust_mkdir "$OUTPUT_DIR"
          robust_mkdir "$VA_DIR"
          robust_mkdir "$TMP_SAFE_DIR"
          robust_mkdir "$ORDER_DIR"
          robust_mkdir "$USER_DIR"

          robust_echo "SELECT VERSION();"        $DBCLI_DIR/mysql/demo.sql
          robust_echo "SELECT VERSION();"        $DBCLI_DIR/mariadb/demo.sql
          robust_echo "SELECT VERSION();"        $DBCLI_DIR/percona/demo.sql
          robust_echo "SELECT version();"        $DBCLI_DIR/postgresql/demo.sql
          robust_echo "SELECT sqlite_version();" $DBCLI_DIR/sqlite/demo.sql
          robust_echo "PING"                     $DBCLI_DIR/redis/demo.redis
          robust_append "$DBCLI_DIR/redis/demo.redis" "INFO"
          robust_echo "SELECT version();"        $DBCLI_DIR/clickhouse/demo.sql
          robust_echo "SELECT * FROM RDB\$DATABASE;" $DBCLI_DIR/firebird/demo.sql
          robust_echo "SELECT service_level, fixpack_num FROM sysibmadm.env_inst_info;" $DBCLI_DIR/db2/demo.sql

          for DB in mysql mariadb percona postgresql sqlite clickhouse firebird db2; do
            robust_echo "-- dummy database for $DB" "$DBCLI_DIR/$DB/dummy_db.sql"
            robust_touch "$DBCLI_DIR/$DB/dummy.db"
          done

          for DB in mysql mariadb percona postgresql sqlite redis clickhouse firebird db2; do
            robust_echo "[dummy output]" "$OUTPUT_DIR/${DB}_dummy.out"
          done

          robust_echo "user_id,user_name,permission,enabled" "$USER_DIR/users.csv"
          robust_append "$USER_DIR/users.csv" "U001,홍길동,ADMIN,1"
          robust_append "$USER_DIR/users.csv" "U002,김철수,USER,1"
          robust_append "$USER_DIR/users.csv" "U003,이영희,USER,0"

          echo "[🧹][∞][리메이크] 기존 가상계좌 파일 전체 삭제"
          rm -f $VA_DIR/virtual_accounts_*.txt
          TS=$(date '+%Y%m%d_%H%M%S')
          VA_FILE="$TMP_SAFE_DIR/virtual_accounts_${TS}_$$.txt"
          robust_echo "account_id,account_number,customer_name,bank_code,open_date" "$VA_FILE"
          for i in $(seq 1 10000); do
            ACC_NUM="7000$(printf '%07d' $i)"
            CUST="User$(printf '%05d' $i)"
            BANK="B$(printf '%04d' $((1000 + ($i % 9000))))"
            DATE="$(date '+%Y-%m-%d')"
            robust_append "$VA_FILE" "VA${i},${ACC_NUM},${CUST},${BANK},${DATE}"
          done
          chmod 600 "$VA_FILE"
          mv "$VA_FILE" "$VA_DIR/"
          echo "[✅][∞][리메이크] $VA_FILE → $VA_DIR 이동 및 권한 최소화"
          ls -lh $VA_DIR/virtual_accounts_*.txt
          rm -rf $TMP_SAFE_DIR

      - name: 최신 DB CLI 추가 설치 (옵션, 에러 무시)
        run: |
          sudo apt-get install -y mysql-client-8.0 mysql-client-core-8.0 mariadb-client-10.6 || true
          sudo apt-get install -y postgresql-client-16 postgresql-client-common || true
          sudo apt-get install -y clickhouse-client || true
          sudo apt-get install -y firebird-utils || true
