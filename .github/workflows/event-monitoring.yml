name: 📦 전문가 분산/집계/설치/암호화/리메이크/스냅샷 자동화 (MySQL 완전 에러방지 포함)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [workflow_run]
  schedule:
    - cron: '*/5 * * * *'

jobs:
  all-in-one-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 [백업 디렉토리 초기화]
        run: |
          mkdir -p .github/package-backup
          find .github/package-backup -type f -delete

      - name: 🚀 [패키지 최신화/venv+설치내역 암호화+FS체크+백업/echo/권한에러 안전]
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get upgrade -y || true

          mkdir -p encrypted-data/installed-packages

          APT_LIST_FILE=".github/pkglist-apt.txt"
          if [ -f "$APT_LIST_FILE" ]; then
            PKGS=$(grep -v '^#' "$APT_LIST_FILE" | tr -s ' ' '\n' | grep -v '^\s*$' | sort -u | tr '\n' ' ')
          else
            PKGS="wget gnupg ca-certificates lsb-release openjdk-11-jre apt-transport-https python3 python3-pip python3-venv curl tree jq"
          fi

          > installed-apt-echo.txt

          for p in $PKGS; do
            BIN=$(dpkg -L $p 2>/dev/null | grep -E "/bin/|/sbin/" | head -1 || true)
            CONF=$(dpkg -L $p 2>/dev/null | grep -E "/etc/" | head -1 || true)
            for file in $BIN $CONF; do
              if [ -f "$file" ]; then
                bakfile="$(echo $file | sed 's|/|_|g').bak"
                if sudo cp -aP "$file" ".github/package-backup/$bakfile" 2>/dev/null; then
                  echo "[BAK] $file → .github/package-backup/$bakfile" >> installed-apt-echo.txt
                else
                  echo "[WARN] $file .bak 백업 실패(권한/존재)" >> installed-apt-echo.txt
                fi
              fi
            done
            if dpkg -s $p &>/dev/null; then
              sudo apt-get install --only-upgrade -y $p
              ver=$(dpkg -s $p | grep '^Version:' | awk '{print $2}')
              echo "[APT] $p $ver UPGRADED $(date +%Y-%m-%dT%H:%M:%S)" >> installed-apt-echo.txt
            else
              sudo apt-get install -y $p
              ver=$(dpkg -s $p | grep '^Version:' | awk '{print $2}')
              echo "[APT] $p $ver INSTALLED $(date +%Y-%m-%dT%H:%M:%S)" >> installed-apt-echo.txt
            fi
            BIN=$(dpkg -L $p 2>/dev/null | grep -E "/bin/|/sbin/" | head -1 || true)
            if [ -n "$BIN" ] && [ -x "$BIN" ]; then
              echo "[FS] $BIN exists & executable" >> installed-apt-echo.txt
            else
              echo "[FS][WARN] $p: No /bin/ or /sbin/ binary found or not executable" >> installed-apt-echo.txt
            fi
            dpkg -L $p | xargs -r ls -ld 2>/dev/null | head -10 >> installed-apt-echo.txt || true
          done

          VENV_DIR="collector-tmp/pip-venv"
          python3 -m venv "$VENV_DIR"
          . "$VENV_DIR/bin/activate"

          PIP_LIST_FILE=".github/pkglist-pip.txt"
          if [ -f "$PIP_LIST_FILE" ]; then
            PKGSPY=$(grep -v '^#' "$PIP_LIST_FILE" | tr -s ' ' '\n' | grep -v '^\s*$' | sort -u | tr '\n' ' ')
          else
            PKGSPY="requests"
          fi

          > installed-pip-echo.txt

          python -m pip install --upgrade pip

          for p in $PKGSPY; do
            SITE_DIR=$(python -c "import site; print(site.getsitepackages()[0])")
            if [ -d "$SITE_DIR/$p" ]; then
              bakfile="$(echo $SITE_DIR/$p | sed 's|/|_|g').bak"
              if cp -a "$SITE_DIR/$p" ".github/package-backup/$bakfile" 2>/dev/null; then
                echo "[BAK] $SITE_DIR/$p → .github/package-backup/$bakfile" >> installed-pip-echo.txt
              else
                echo "[WARN] $SITE_DIR/$p .bak 백업 실패" >> installed-pip-echo.txt
              fi
            fi
            if python -m pip show $p &>/dev/null; then
              python -m pip install --upgrade $p
              ver=$(python -m pip show $p | grep ^Version: | awk '{print $2}')
              echo "[PIP] $p $ver UPGRADED $(date +%Y-%m-%dT%H:%M:%S)" >> installed-pip-echo.txt
            else
              python -m pip install $p
              ver=$(python -m pip show $p | grep ^Version: | awk '{print $2}')
              echo "[PIP] $p $ver INSTALLED $(date +%Y-%m-%dT%H:%M:%S)" >> installed-pip-echo.txt
            fi
            if python -c "import $p" 2>/dev/null; then
              echo "[FS] pip module '$p' import OK" >> installed-pip-echo.txt
            else
              echo "[FS][WARN] pip module '$p' import FAIL" >> installed-pip-echo.txt
            fi
            python -c "import $p, os; print('[FS] installed at', os.path.dirname($p.__file__))" 2>> installed-pip-echo.txt || true
          done

          deactivate

          openssl enc -aes-256-cbc -pbkdf2 -salt -in installed-apt-echo.txt -out encrypted-data/installed-packages/apt-installed-echo.txt.enc -k "package-password"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in installed-pip-echo.txt -out encrypted-data/installed-packages/pip-installed-echo.txt.enc -k "package-password"
          rm -f installed-apt-echo.txt installed-pip-echo.txt

          for d in /usr/bin /usr/local/bin /etc "$VENV_DIR/lib/python3.*/site-packages"; do
            [ -d "$d" ] && sudo find $d -name '*.bak' -exec bash -c 'sudo cp -aP "$0" .github/package-backup/ || echo "[WARN] $0 .bak 복사 실패"' {} \; 2>/dev/null || true
          done

          if [ -d .github/package-backup ]; then
            sudo chown -R $USER:$USER .github/package-backup/ || echo "[WARN] .github/package-backup chown 실패" >> .github/package-backup/echo_permission.txt
            sudo chmod -R u+rwX .github/package-backup/ || echo "[WARN] .github/package-backup chmod 실패" >> .github/package-backup/echo_permission.txt
          else
            echo "[WARN] .github/package-backup 디렉토리 없음" >> .github/package-backup/echo_permission.txt
          fi

          echo '[초기화 및 패키지 최신화/설치내역 암호화+FS체크+백업/echo/권한에러 안전] 완료' > clean.log

      - name: 📂 [분산 디렉토리 생성] 병렬 처리
        run: |
          dirs="collector-data elk-data docker-data encrypted-data snapshot runs-details jobs-details steps-details collector-tmp remake-batch remake-batch/sample remake-batch/logs"
          echo $dirs | xargs -n 1 -P 8 bash -c 'mkdir -p "$0"; echo "[생성] $0" > "$0/echo_dir.txt"'
          tree -a > snapshot/dirs_tree_init.txt || ls -lR > snapshot/dirs_tree_init.txt

      - name: 🔐 [데이터 생성+암호화] 병렬화
        run: |
          (
            echo '기존 데이터 샘플 1' > collector-data/old-data-1.txt
            echo '기존 데이터 샘플 2' > collector-data/old-data-2.txt
            sha256sum collector-data/old-data-1.txt > collector-data/old-data-1-sha256.txt
            sha256sum collector-data/old-data-2.txt > collector-data/old-data-2-sha256.txt
            cp collector-data/old-data-1.txt encrypted-data/old-data-1.txt
            cp collector-data/old-data-2.txt encrypted-data/old-data-2.txt
            openssl enc -aes-256-cbc -pbkdf2 -salt -in encrypted-data/old-data-1.txt -out encrypted-data/old-data-1.txt.enc -k oldpassword &
            openssl enc -aes-256-cbc -pbkdf2 -salt -in encrypted-data/old-data-2.txt -out encrypted-data/old-data-2.txt.enc -k oldpassword &
            wait
            rm -f encrypted-data/old-data-1.txt encrypted-data/old-data-2.txt
            sha256sum encrypted-data/old-data-1.txt.enc > encrypted-data/old-data-1-sha256.txt
            sha256sum encrypted-data/old-data-2.txt.enc > encrypted-data/old-data-2-sha256.txt
          ) &

          (
            echo '신규 데이터 샘플 1' > collector-data/new-data-1.txt
            echo '신규 데이터 샘플 2' > collector-data/new-data-2.txt
            sha256sum collector-data/new-data-1.txt > collector-data/new-data-1-sha256.txt
            sha256sum collector-data/new-data-2.txt > collector-data/new-data-2-sha256.txt
            cp collector-data/new-data-1.txt encrypted-data/new-data-1.txt
            cp collector-data/new-data-2.txt encrypted-data/new-data-2.txt
            openssl enc -aes-256-cbc -pbkdf2 -salt -in encrypted-data/new-data-1.txt -out encrypted-data/new-data-1.txt.enc -k newpassword &
            openssl enc -aes-256-cbc -pbkdf2 -salt -in encrypted-data/new-data-2.txt -out encrypted-data/new-data-2.txt.enc -k newpassword &
            wait
            rm -f encrypted-data/new-data-1.txt encrypted-data/new-data-2.txt
            sha256sum encrypted-data/new-data-1.txt.enc > encrypted-data/new-data-1-sha256.txt
            sha256sum encrypted-data/new-data-2.txt.enc > encrypted-data/new-data-2-sha256.txt
          ) &
          wait

      - name: 🧹 [리메이크 배치/로그/샘플] xargs로 병렬 생성
        run: |
          seq 1 10 | xargs -I{} -P 5 bash -c 'echo "샘플 데이터 {} - $(date +%Y%m%d%H%M%S)" > remake-batch/sample/sample_data_{}.txt'
          seq 1 5 | xargs -I{} -P 5 bash -c 'echo "로그 기록 {} - $(date +%Y-%m-%dT%H:%M:%S)" > remake-batch/logs/log_{}.log'
          echo "[샘플/로그 데이터 생성 완료]" > remake-batch/batch_done.txt

      - name: 🐘 [TimescaleDB/Postgres 15 설치(GPG 최신화)]
        run: |
          wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor | sudo tee /usr/share/keyrings/postgresql.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-15 postgresql-server-dev-15
          wget --quiet -O - https://packagecloud.io/timescale/timescaledb/gpgkey | gpg --dearmor | sudo tee /usr/share/keyrings/timescale-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/timescale-archive-keyring.gpg] https://packagecloud.io/timescale/timescaledb/ubuntu/ $(lsb_release -c -s) main" | sudo tee /etc/apt/sources.list.d/timescaledb.list
          sudo apt-get update -y
          sudo apt-get install -y timescaledb-2-postgresql-15 timescaledb-2-loader-postgresql-15 timescaledb-tools timescaledb-toolkit-postgresql-15
          echo '샘플 TimescaleDB 데이터' > collector-data/sample-tsdb.txt
          sha256sum collector-data/sample-tsdb.txt > collector-data/sample-tsdb-sha256.txt

      - name: 🔎 [ELK Stack 설치]
        run: |
          wget -qO - https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor | sudo tee /usr/share/keyrings/elasticsearch.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/elasticsearch.gpg] https://artifacts.elastic.co/packages/7.x/apt stable main" | sudo tee /etc/apt/sources.list.d/elastic-7.x.list
          sudo apt-get update -y
          sudo apt-get install -y elasticsearch logstash kibana
          sudo systemctl enable elasticsearch.service kibana.service logstash.service
          sudo systemctl start elasticsearch.service kibana.service logstash.service
          (elasticsearch --version > elk-data/elasticsearch_version.txt 2>&1 || echo "elasticsearch not found" >> elk-data/elasticsearch_version.txt)
          (kibana --version > elk-data/kibana_version.txt 2>&1 || echo "kibana not found" >> elk-data/kibana_version.txt)
          (logstash --version > elk-data/logstash_version.txt 2>&1 || echo "logstash not found" >> elk-data/logstash_version.txt)
          echo '샘플 ELK 로그' > elk-data/sample-elk-log.txt
          sha256sum elk-data/sample-elk-log.txt > elk-data/sample-elk-log-sha256.txt

      - name: 🐬 [MySQL 설치/초기화/로그 에러 완전 방지 + echo]
        run: |
          set -e

          LOGDIR="elk-data/mysql-log"
          mkdir -p $LOGDIR

          sudo systemctl stop mysql || true
          sudo systemctl stop mariadb || true
          sudo pkill -f mysqld || true

          sudo rm -rf /var/lib/mysql /var/run/mysqld /var/log/mysql /var/log/mysql* /etc/mysql/my.cnf.lock || true
          sudo mkdir -p /var/lib/mysql /var/run/mysqld /var/log/mysql
          sudo chown -R mysql:mysql /var/lib/mysql /var/run/mysqld /var/log/mysql || true

          sudo apt-get update -y
          sudo apt-get install -y mysql-server mysql-client

          if [ -f /etc/mysql/my.cnf ]; then
            cp /etc/mysql/my.cnf $LOGDIR/my.cnf.bak || echo "[WARN] my.cnf 백업 실패" >> $LOGDIR/echo.txt
          fi

          (cat /etc/mysql/my.cnf 2>/dev/null || echo "[WARN] my.cnf 없음") > $LOGDIR/my.cnf
          (sudo grep -ri log /etc/mysql/ 2>/dev/null || true) > $LOGDIR/my-cnf-log-section.txt

          sudo mysqld --initialize-insecure --user=mysql --datadir=/var/lib/mysql || true

          sudo mkdir -p /var/run/mysqld
          sudo chown mysql:mysql /var/run/mysqld
          sudo touch /var/run/mysqld/mysqld.sock
          sudo chown mysql:mysql /var/run/mysqld/mysqld.sock
          sudo chmod 777 /var/run/mysqld
          sudo chmod 666 /var/run/mysqld/mysqld.sock

          (sudo systemctl start mysql 2>&1 | tee $LOGDIR/start_service.log) || (echo "[ERROR] mysql start 실패" >> $LOGDIR/echo.txt && sudo cat /var/log/mysql/error.log >> $LOGDIR/mysql_error.log 2>/dev/null)

          sudo mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpw'; FLUSH PRIVILEGES;" 2>> $LOGDIR/echo.txt || echo "[WARN] root pw 설정 실패(이미 설정됨 등)" >> $LOGDIR/echo.txt

          sudo mysql -u root -prootpw -e "CREATE DATABASE IF NOT EXISTS sample_db; CREATE USER IF NOT EXISTS 'sample_user'@'localhost' IDENTIFIED BY 'samplepass'; GRANT ALL PRIVILEGES ON sample_db.* TO 'sample_user'@'localhost'; FLUSH PRIVILEGES;" 2>> $LOGDIR/echo.txt

          mysql --version > $LOGDIR/version.txt
          sudo systemctl status mysql | tee $LOGDIR/service_status.txt || true
          sudo ls -lh /var/lib/mysql/ > $LOGDIR/mysql_data
