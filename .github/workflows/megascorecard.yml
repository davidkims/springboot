name: 🛡️ MEGA Scorecard + EchoOps + SARIF + Markdown + Upgrade

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '16 11 * * 2'   # 매주 화요일 Scorecard
    - cron: '*/3 * * * *'   # 3분마다 EchoOps
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: ✅ Scorecard + SARIF + Markdown
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🏗️ CLI 설치 및 디렉토리 에코 생성
        run: |
          set -e
          for dir in echo_scorecard echo_monitoring echo_pages echo_upgrade site/scorecard; do
            mkdir -p ".github/${dir}"
            echo "echo '[ECHO] 디렉토리 생성: .github/${dir}'" >> .github/${dir}/create_dirs.sh
          done
          chmod +x .github/**/create_dirs.sh

      - name: 🔍 Scorecard 실행
        uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          results_file_json: results.json

      - name: ☁️ SARIF 업로드 (Code Scanning)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: 🧾 SARIF 및 JSON 파일 아티팩트 저장
        uses: actions/upload-artifact@v4
        with:
          name: Scorecard-Files
          path: |
            results.sarif
            results.json
          retention-days: 7

      - name: 📑 results.json → Markdown 변환 (검증 포함)
        run: |
          set -e
          mkdir -p site/scorecard

          echo "# 🛡️ OSSF Scorecard 결과 요약" > site/scorecard/scorecard-summary.md

          filetype=$(file results.json)
          if ! jq empty results.json > /dev/null 2>&1; then
            echo "::error ::[ERROR] results.json is NOT valid JSON → 현재 타입: $filetype"
            mv results.json results_invalid_$(date +%Y%m%d_%H%M).bak || true
            echo '{}' > results.json
          fi

          if jq -e 'type == "object" and .repo.name and .score and .checks' results.json > /dev/null 2>&1; then
            jq -r '
              "### 프로젝트: \(.repo.name)\n\n" +
              "신뢰도 점수: \(.score) / 10\n\n" +
              "| Check | Pass | Score | Reason |\n|-------|------|--------|--------|\n" +
              (.checks[] |
                "| \(.name) | \(.pass) | \(.score) | \(.reason // "-") |"
              ) | join("\n")
            ' results.json >> site/scorecard/scorecard-summary.md
          else
            echo "_⚠️ results.json 구조가 잘못되어 Markdown 변환 생략됨._" >> site/scorecard/scorecard-summary.md
          fi

          echo "echo '[ECHO] Markdown 변환 완료'" >> .github/echo_pages/json_to_md.sh
          chmod +x .github/echo_pages/json_to_md.sh

  post-analysis:
    name: 🧰 EchoOps + 파일 분석 + Upgrade
    runs-on: ubuntu-latest
    needs: scorecard

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 SARIF/JSON 파일 다운로드
        uses: actions/download-artifact@v4
        with:
          name: Scorecard-Files

      - name: 🗃️ SARIF 복사 + 에코
        run: |
          mkdir -p site/scorecard
          cp results.sarif site/scorecard/scorecard-results.sarif || echo "SARIF 없음"
          echo "echo '[ECHO] SARIF 복사 완료'" >> .github/echo_pages/copy_sarif.sh
          chmod +x .github/echo_pages/copy_sarif.sh

      - name: 📦 대용량 파일 및 전체 디렉토리 용량 분석
        run: |
          mkdir -p .github/echo_monitoring
          du -ah . | sort -hr | head -n 30 > .github/echo_monitoring/top_files.txt || true
          du -sh . > .github/echo_monitoring/total_size.txt || true
          echo "echo '[ECHO] 파일 사이즈 분석 완료'" >> .github/echo_monitoring/analyze_size.sh
          chmod +x .github/echo_monitoring/analyze_size.sh

      - name: ⬆️ 시스템 패키지 업그레이드 및 로깅
        run: |
          sudo apt-get update -y && sudo apt-get upgrade -y
          mkdir -p .github/echo_upgrade
          echo "echo '[UPGRADE] 시스템 패키지 업그레이드 완료'" >> .github/echo_upgrade/upgrade.sh
          dpkg -l > .github/echo_upgrade/upgraded_packages_list.txt
          chmod +x .github/echo_upgrade/upgrade.sh
