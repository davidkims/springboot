name: 🇰🇷 KST 타임존 글로벌 자동 적용 워크플로우

on:
  workflow_dispatch:

env:
  TZ: Asia/Seoul  # 1. 글로벌 환경변수로 모든 스텝에 KST 적용

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # 2. 재사용 액션으로 환경변수 + 시스템 타임존 동시 적용
      - name: 🕒 KST 타임존 환경/시스템 자동 적용
        uses: ./.github/actions/set-kst-timezone

      # 3. 이후 모든 명령이 한국 시간 기준으로 동작
      - name: 🕒 KST 시간 확인
        run: |
          echo "[KST] date: $(date)"
          echo "[KST] UTC date: $(date -u)"
          timedatectl

      - name: 📝 KST 시간 기반 파일 생성
        run: |
          echo "[KST] 파일 생성 예시"
          touch "kst-$(date +'%Y%m%d_%H%M%S').txt"
          ls -l kst-*.txt

      - name: 🗃️ 추가 명령 예시 (파이썬/노드/셸 등)
        run: |
          echo "[KST] 파이썬 datetime"
          python3 -c "from datetime import datetime; print(datetime.now())"
          echo "[KST] Node.js datetime"
          node -e "console.log(new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }))"
