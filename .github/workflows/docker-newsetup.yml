name: 🛡 CodeQL + Scorecard CLI 설치 및 실행 (에러 완전 해결)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  cli-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 에코 디렉토리 및 로그 생성
        run: |
          set -e
          mkdir -p .github/echo_codeql .github/echo_scorecard .github/echo_logs
          echo "#!/bin/bash" > .github/echo_logs/dir_create.sh
          for d in echo_codeql echo_scorecard echo_logs; do
            echo "echo '[ECHO] 디렉토리 생성됨: .github/$d'" >> .github/echo_logs/dir_create.sh
          done
          chmod +x .github/echo_logs/dir_create.sh
          bash .github/echo_logs/dir_create.sh

      - name: 🧪 CodeQL CLI 설치 (정확한 실행파일 경로 설정 포함)
        run: |
          set -e
          CODEQL_VERSION=2.16.2
          curl -sLO https://github.com/github/codeql-cli-binaries/releases/download/v${CODEQL_VERSION}/codeql-linux64.zip
          unzip -q codeql-linux64.zip -d codeql_tmp
          sudo mv codeql_tmp/codeql /opt/codeql
          echo "/opt/codeql/codeql" >> $GITHUB_PATH
          /opt/codeql/codeql/codeql version | tee .github/echo_codeql/codeql_version.txt

      - name: 📊 Scorecard CLI 설치 (정상 링크로 교체)
        run: |
          set -e
          SCORECARD_VERSION=4.10.3
          curl -sL -o scorecard https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION}_linux_amd64
          file scorecard | tee .github/echo_scorecard/scorecard_filetype.txt
          chmod +x scorecard
          sudo mv scorecard /usr/local/bin/scorecard
          scorecard --version | tee .github/echo_scorecard/scorecard_version.txt

      - name: 🧪 CodeQL 분석 실행
        run: |
          set -e
          mkdir -p codeql-db
          /opt/codeql/codeql/codeql database create codeql-db --language=javascript --source-root=. | tee .github/echo_codeql/create_db.log
          /opt/codeql/codeql/codeql database analyze codeql-db github/codeql-javascript-queries --format=sarifv2.1.0 --output=.github/echo_codeql/result-codeql.sarif | tee .github/echo_codeql/analyze.log

      - name: 📊 Scorecard 분석 실행
        run: |
          set -e
          scorecard --repo=https://github.com/${{ github.repository }} --format=json --show-details > .github/echo_scorecard/results.json
          scorecard --repo=https://github.com/${{ github.repository }} --format=sarif --show-details > .github/echo_scorecard/results.sarif

      - name: 📤 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: codeql-scorecard-results
          path: |
            .github/echo_codeql/
            .github/echo_scorecard/
            .github/echo_logs/
