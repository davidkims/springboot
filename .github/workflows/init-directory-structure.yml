name: 📁 Slot Autogen & PR

on:
  schedule:
    - cron: '*/1 * * * *'  # 매 1분마다 실행
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  slot-autogen:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🧮 Detect next slot number
        id: slot
        run: |
          echo "[🔢] Finding next available slot..."
          SLOT_NUM=$(find .github/autogen -maxdepth 1 -type d -name 'slot-*' | sed 's/.*slot-//' | sort -n | tail -n1)
          NEXT_NUM=$(printf "%03d" $((10#$SLOT_NUM + 1)))
          echo "next=slot-$NEXT_NUM" >> $GITHUB_OUTPUT
          echo "[➡️] Next slot will be slot-$NEXT_NUM"

      - name: 📁 Create new slot directory and copy workflows
        run: |
          SLOT=${{ steps.slot.outputs.next }}
          mkdir -p ".github/autogen/$SLOT/workflows"
          cp .github/workflows/*.yml ".github/autogen/$SLOT/workflows/" || echo "[⚠️] No .yml files found"
          echo "[✅] Copied workflows to $SLOT"

      - name: 🛠️ Create .yamllint.yml
        run: |
          echo "[🛠️] Creating relaxed lint config..."
          echo "extends: default" > .yamllint.yml
          echo "rules:" >> .yamllint.yml
          echo "  line-length:" >> .yamllint.yml
          echo "    max: 300" >> .yamllint.yml
          echo "    level: warning" >> .yamllint.yml
          echo "  document-start:" >> .yamllint.yml
          echo "    present: false" >> .yamllint.yml
          echo "  comments:" >> .yamllint.yml
          echo "    require-starting-space: false" >> .yamllint.yml
          echo "  trailing-spaces:" >> .yamllint.yml
          echo "    level: warning" >> .yamllint.yml

      - name: 🔍 Install yamllint
        run: |
          pip install --quiet yamllint

      - name: 🧪 Retryable yamllint (non-blocking)
        continue-on-error: true
        run: |
          SLOT=${{ steps.slot.outputs.next }}
          TARGET=".github/autogen/$SLOT/workflows"
          MAX_RETRIES=5
          COUNT=1
          while [ $COUNT -le $MAX_RETRIES ]; do
            echo "[🔁] Lint Try #$COUNT"
            yamllint -c .yamllint.yml "$TARGET" && break || {
              echo "[❌] Lint failed at try $COUNT"
              sleep 2
              COUNT=$((COUNT + 1))
            }
          done

      - name: 📝 Add metadata files
        run: |
          SLOT=${{ steps.slot.outputs.next }}
          echo "Created at $(date -u)" > ".github/autogen/$SLOT/info.txt"
          echo "# Auto-generated Slot $SLOT" > ".github/autogen/$SLOT/README.md"
          ln -sfn "$SLOT" .github/slot-latest

      - name: 🔀 Create Pull Request safely
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "📁 Add new slot: ${{ steps.slot.outputs.next }}"
          branch: "slot-expand/${{ steps.slot.outputs.next }}"
          title: "📁 Slot Auto Expand: ${{ steps.slot.outputs.next }}"
          body: |
            This PR adds:
            - Slot: `${{ steps.slot.outputs.next }}`
            - All workflows copied from `.github/workflows`
            - Relaxed yamllint config
            - Non-blocking lint validation
          delete-branch: true
