name: 🧠 TradingAgents CI with Safe File Echo, Conda, Directories

on:
  push:
    paths:
      - "**.py"
      - ".github/workflows/tradingagents.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test-tradingagents:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 [1] 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 [2] Miniconda 설치
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: "3.13"
          activate-environment: false

      - name: 🏗️ [3] Conda 환경 및 디렉토리 생성
        shell: bash
        run: |
          echo "============================================"
          echo "[🏗️] 3단계: 환경/디렉토리/파일 생성 시작"
          echo "============================================"

          echo "[📁] 디렉토리 생성 중..."
          mkdir -p logs output site scripts
          touch logs/.keep
          echo "[✅] 디렉토리 생성 완료: logs/, output/, site/, scripts/"

          echo "[🐍] Conda 환경 생성 중..."
          conda create -y -n tradingagents python=3.13
          echo "[✅] Conda 환경 tradingagents 생성 완료"

          echo "[📄] requirements.txt 다운로드 시도..."
          if curl -sSfL -o requirements.txt https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/requirements.txt; then
            echo "[✅] requirements.txt 다운로드 성공"
          else
            echo "[⚠️] 다운로드 실패 - 기본 requirements.txt 생성 중"
            echo "openai" > requirements.txt
            echo "finnhub-python" >> requirements.txt
            echo "langgraph" >> requirements.txt
            echo "[📄] 생성된 requirements.txt 내용:"
            cat requirements.txt
          fi

          echo "[📄] run_tradingagents.py 다운로드 시도..."
          if curl -sSfL -o run_tradingagents.py https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/run_tradingagents.py; then
            echo "[✅] run_tradingagents.py 다운로드 성공"
          else
            echo "[❌] run_tradingagents.py 다운로드 실패 - 테스트 중단"
            exit 1
          fi

      - name: 🔧 [4] 종속성 설치
        shell: bash
        run: |
          echo "============================================"
          echo "[🔧] 4단계: 종속성 설치"
          echo "============================================"
          conda run -n tradingagents pip install --upgrade pip
          conda run -n tradingagents pip install -r requirements.txt
          echo "[✅] 종속성 설치 완료"

      - name: 🔑 [5] API 키 설정
        run: |
          echo "============================================"
          echo "[🔑] 5단계: 환경변수로 API 키 설정"
          echo "============================================"
          echo "FINNHUB_API_KEY=dummy_key" >> $GITHUB_ENV
          echo "OPENAI_API_KEY=dummy_key" >> $GITHUB_ENV
          echo "[✅] API 키 등록 완료"

      - name: ▶️ [6] CLI 도움말 테스트
        run: |
          echo "============================================"
          echo "[▶️] 6단계: CLI 도움말 테스트"
          echo "============================================"
          conda run -n tradingagents python -m cli.main --help || echo "[⚠️] CLI 도움말 실패했지만 무시됨"
          echo "[✅] CLI 도움말 테스트 완료"

      - name: 🧪 [7] TradingAgents 테스트 실행
        run: |
          echo "============================================"
          echo "[🧪] 7단계: run_tradingagents.py 실행"
          echo "============================================"
          echo "[📄] 스크립트 내용 확인:"
          cat run_tradingagents.py

          echo "[🚀] 실행 시작:"
          conda run -n tradingagents python run_tradingagents.py
          echo "[✅] 실행 완료"

      - name: ✅ [8] 최종 완료 메시지
        run: |
          echo "============================================"
          echo "[🎉] 모든 작업이 성공적으로 완료되었습니다!"
          echo "============================================"
