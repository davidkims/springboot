name: Setup Logistics Environment

on:
  workflow_dispatch:

jobs:
  build-environment:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout code
        uses: actions/checkout@v4

      - name: 📂 Create logistics directories
        run: |
          echo "[LOG] Creating /opt/logistics directories"
          sudo mkdir -p /opt/logistics/{mysql,postgresql,oracle,mongodb,airflow,camunda,salesforce_flow,virtual_customer_data,aws,gcp,smtp}
          sudo chmod -R 775 /opt/logistics
          mkdir -p .github/logs

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: ☕ Setup Java 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 🔣 Setup .NET 7
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: 🟢 Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 🌬 Install Apache Airflow and Providers
        run: |
          echo "[LOG] Installing Apache Airflow and Providers"
          python -m pip install --upgrade pip
          pip install apache-airflow==2.6.0 \
            apache-airflow-providers-postgres \
            apache-airflow-providers-docker \
            apache-airflow-providers-amazon \
            apache-airflow-providers-google \
            apache-airflow-providers-smtp \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.6.0/constraints-3.10.txt"
          airflow db init
          echo "[DONE] Airflow and providers initialized" > .github/logs/airflow_setup.log
          sudo mkdir -p /opt/logistics/airflow
          cp -r ~/airflow/* /opt/logistics/airflow/

      - name: 🌬 Configure Airflow Connections
        run: |
          echo "[CONFIG] Setting up Airflow Connections"

          airflow connections delete postgres_default || true
          airflow connections delete docker_default || true
          airflow connections delete aws_default || true
          airflow connections delete google_cloud_default || true
          airflow connections delete smtp_default || true

          airflow connections add postgres_default \
            --conn-uri 'postgresql+psycopg2://postgres:postgres123@localhost:5432/logistics'

          airflow connections add docker_default \
            --conn-type docker \
            --conn-host unix:///var/run/docker.sock

          airflow connections add aws_default \
            --conn-type aws \
            --conn-extra '{"region_name": "us-east-1"}'

          airflow connections add google_cloud_default \
            --conn-type google_cloud_platform \
            --conn-extra '{"extra__google_cloud_platform__project": "demo-project"}'

          airflow connections add smtp_default \
            --conn-type smtp \
            --conn-host smtp.example.com \
            --conn-login airflow \
            --conn-password airflow123 \
            --conn-port 587 \
            --conn-extra '{"tls": true}'

      - name: 🌬 Create Airflow Connection Check DAG
        run: |
          echo "[DAG] Creating connection check DAG"
          mkdir -p ~/airflow/dags
          DAG_PATH=~/airflow/dags/connection_check_dag.py

          echo "from airflow import DAG" | tee $DAG_PATH
          echo "from airflow.operators.bash import BashOperator" | tee -a $DAG_PATH
          echo "from datetime import datetime" | tee -a $DAG_PATH
          echo "" | tee -a $DAG_PATH

          echo "with DAG(" | tee -a $DAG_PATH
          echo "    'connection_check_dag'," | tee -a $DAG_PATH
          echo "    start_date=datetime(2023, 1, 1)," | tee -a $DAG_PATH
          echo "    schedule_interval='@daily'," | tee -a $DAG_PATH
          echo "    catchup=False" | tee -a $DAG_PATH
          echo ") as dag:" | tee -a $DAG_PATH

          echo "    check_postgres = BashOperator(" | tee -a $DAG_PATH
          echo "        task_id='check_postgres'," | tee -a $DAG_PATH
          echo "        bash_command='airflow connections get postgres_default'" | tee -a $DAG_PATH
          echo "    )" | tee -a $DAG_PATH

          echo "    check_docker = BashOperator(" | tee -a $DAG_PATH
          echo "        task_id='check_docker'," | tee -a $DAG_PATH
          echo "        bash_command='airflow connections get docker_default'" | tee -a $DAG_PATH
          echo "    )" | tee -a $DAG_PATH

          echo "    check_aws = BashOperator(" | tee -a $DAG_PATH
          echo "        task_id='check_aws'," | tee -a $DAG_PATH
          echo "        bash_command='airflow connections get aws_default'" | tee -a $DAG_PATH
          echo "    )" | tee -a $DAG_PATH

          echo "    check_gcp = BashOperator(" | tee -a $DAG_PATH
          echo "        task_id='check_gcp'," | tee -a $DAG_PATH
          echo "        bash_command='airflow connections get google_cloud_default'" | tee -a $DAG_PATH
          echo "    )" | tee -a $DAG_PATH

          echo "    check_smtp = BashOperator(" | tee -a $DAG_PATH
          echo "        task_id='check_smtp'," | tee -a $DAG_PATH
          echo "        bash_command='airflow connections get smtp_default'" | tee -a $DAG_PATH
          echo "    )" | tee -a $DAG_PATH

          echo "    [check_postgres, check_docker, check_aws, check_gcp, check_smtp]" | tee -a $DAG_PATH

          echo "[DONE] Connection check DAG created" > .github/logs/airflow_connection_check_dag.log
