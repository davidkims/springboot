name: 📊 FULL ECHO + Monitoring + 외부 springboot 통합 분석

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  full-monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 현재 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 📂 외부 springboot 리포지토리 체크아웃
        uses: actions/checkout@v4
        with:
          repository: davidkims/springboot
          path: external_springboot

      - name: 📁 에코 및 목적별 디렉토리 대량 생성 + 에코 스크립트 생성 및 실행
        run: |
          BASE=".github"
          ECHO_DIRS="echo_logs echo_infra echo_monitoring echo_summary echo_reports echo_metrics echo_system"
          TARGET_DIRS="infra monitoring summary reports metrics system tmp data logs workflows external"

          for d in $ECHO_DIRS; do
            mkdir -p "$BASE/$d"
          done

          mkdir -p "$BASE/echo_infra/logs"
          echo "#!/bin/bash" > "$BASE/echo_infra/logs/create_dirs.sh"

          for d in $TARGET_DIRS; do
            echo "mkdir -p $BASE/$d" >> "$BASE/echo_infra/logs/create_dirs.sh"
            echo "echo '[CREATE] 디렉토리 생성: $BASE/$d'" >> "$BASE/echo_infra/logs/create_dirs.sh"
          done

          echo "mkdir -p external_springboot/monitoring" >> "$BASE/echo_infra/logs/create_dirs.sh"
          echo "echo '[CREATE] 외부 springboot 모니터링 디렉토리 생성 완료'" >> "$BASE/echo_infra/logs/create_dirs.sh"

          chmod +x "$BASE/echo_infra/logs/create_dirs.sh"
          bash "$BASE/echo_infra/logs/create_dirs.sh"

      - name: 📦 .github 디렉토리 파일 크기 분석
        run: |
          mkdir -p .github/echo_monitoring
          du -ah .github | sort -hr | head -n 30 > .github/echo_monitoring/github_file_sizes.txt || true
          du -sh .github > .github/echo_monitoring/github_total_size.txt

      - name: 📦 external_springboot 디렉토리 크기 분석
        run: |
          mkdir -p .github/echo_monitoring
          du -ah external_springboot | sort -hr | head -n 30 > .github/echo_monitoring/springboot_file_sizes.txt || true
          du -sh external_springboot > .github/echo_monitoring/springboot_total_size.txt

      - name: 🧠 시스템 리소스 상태 수집 (CPU/MEM/DISK)
        run: |
          echo "[RESOURCE USAGE]" > .github/echo_monitoring/system_usage.txt
          echo "\n🧠 CPU:" >> .github/echo_monitoring/system_usage.txt
          top -b -n 1 | head -n 5 >> .github/echo_monitoring/system_usage.txt
          echo "\n🧠 Memory:" >> .github/echo_monitoring/system_usage.txt
          free -h >> .github/echo_monitoring/system_usage.txt
          echo "\n🧠 Disk:" >> .github/echo_monitoring/system_usage.txt
          df -h >> .github/echo_monitoring/system_usage.txt

      - name: 📜 요약 summary.txt 생성
        run: |
          mkdir -p .github/echo_summary
          {
            echo "📊 전체 요약 리포트"
            echo "⏰ $(date -u)"
            echo ""
            echo "[.github 전체 크기]"
            cat .github/echo_monitoring/github_total_size.txt
            echo ""
            echo "[external_springboot 전체 크기]"
            cat .github/echo_monitoring/springboot_total_size.txt
            echo ""
            echo "[SYSTEM RESOURCE SNAPSHOT]"
            head -n 10 .github/echo_monitoring/system_usage.txt
          } > .github/echo_summary/summary.txt

      - name: 📤 아티팩트 업로드 (.sh, .txt)
        uses: actions/upload-artifact@v4
        with:
          name: echo-monitoring-artifacts
          path: |
            .github/echo_*/**/*.txt
            .github/echo_*/**/*.sh
          if-no-files-found: warn
          compression-level: 6

      - name: 💬 PR 코멘트 자동 작성
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summaryPath = '.github/echo_summary/summary.txt';
            const summary = fs.readFileSync(summaryPath, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `📊 **FULL 모니터링 및 외부 springboot 분석 요약**\n\n\`\`\`\n${summary}\n\`\`\``
            });
