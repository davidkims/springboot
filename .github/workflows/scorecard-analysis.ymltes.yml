name: 🛡️ OpenSSF Scorecard Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'  # 매일 오전 10시(KST)

permissions:
  contents: read
  security-events: write
  actions: read

env:
  TARGET_REPO: davidkims/springboot
  OUT_DIR: .github/scorecard
  SCORECARD_VERSION: v4.12.0

jobs:
  run-scorecard:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 리포지토리 체크아웃
        uses: actions/checkout@v4

      - name: 📂 디렉토리 생성
        run: |
          echo "[+] 디렉토리 생성: $OUT_DIR/bin"
          mkdir -p $OUT_DIR/bin
          tree .github || true

      - name: 🧰 Scorecard CLI 설치 (환경변수 명시적 처리)
        run: |
          echo "[+] Scorecard CLI 설치 시작"
          
          # 명시적으로 환경변수 재정의 (중요!)
          TARGET_REPO="${{ env.TARGET_REPO }}"
          OUT_DIR="${{ env.OUT_DIR }}"
          SCORECARD_VERSION="${{ env.SCORECARD_VERSION }}"
          DOWNLOAD_URL="https://github.com/ossf/scorecard/releases/download/${SCORECARD_VERSION}/scorecard-linux-amd64"

          echo "[+] 다운로드 URL: $DOWNLOAD_URL"
          curl -s -L -o "$OUT_DIR/bin/scorecard" "$DOWNLOAD_URL"

          echo "[+] 설치 파일 확인 중..."
          file "$OUT_DIR/bin/scorecard"

          if file "$OUT_DIR/bin/scorecard" | grep -q "ELF 64-bit"; then
            echo "[✔] 유효한 Scorecard 바이너리입니다."
          else
            echo "[❌] 잘못된 파일 다운로드됨 (HTML 등)"
            head -n 10 "$OUT_DIR/bin/scorecard"
            exit 1
          fi

          chmod +x "$OUT_DIR/bin/scorecard"
          echo "[✔] 실행 권한 부여 완료"
          "$OUT_DIR/bin/scorecard" --version

      - name: 🧪 Scorecard 실행
        run: |
          ${{ env.OUT_DIR }}/bin/scorecard \
            --repo=https://github.com/${{ env.TARGET_REPO }} \
            --format=json --show-details \
            > ${{ env.OUT_DIR }}/scorecard-report.json

      - name: 📄 요약 저장
        run: |
          jq '[.checks[] | {name, score, reason}]' \
            ${{ env.OUT_DIR }}/scorecard-report.json \
            > ${{ env.OUT_DIR }}/scorecard-summary.json

      - name: 📦 SARIF 생성
        run: |
          ${{ env.OUT_DIR }}/bin/scorecard \
            --repo=https://github.com/${{ env.TARGET_REPO }} \
            --format=sarif > ${{ env.OUT_DIR }}/scorecard-results.sarif

      - name: 📊 SARIF 업로드
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.OUT_DIR }}/scorecard-results.sarif
