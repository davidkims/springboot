name: "CodeQL Advanced + Echo File/Dir Generator"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '19 13 * * 4'
  workflow_dispatch:

jobs:
  codeql-analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Create Echo Directories and Files
        run: |
          echo "echo '[Init] Creating echo-based directories...'"
          for d in .github/echo_codeql/{logs,results,queries,python,rust,actions,db,mysql,postgresql,oracle,mongodb,tibero}; do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo_codeql/init_dirs.sh
            mkdir -p "$d"
          done

          echo "echo '[Init] Creating sample echo scripts and queries...'" | tee -a .github/echo_codeql/init_dirs.sh
          echo "echo 'print(\"Hello from Python\")' > .github/echo_codeql/python/sample.py" | tee -a .github/echo_codeql/python/echo_python.sh
          echo "fn main() { println!(\"Hello from Rust\"); }" > .github/echo_codeql/rust/sample.rs
          echo "name: HelloAction" > .github/echo_codeql/actions/action.yml

          echo "-- Sample SQL for MySQL" > .github/echo_codeql/db/mysql/sample.sql
          echo "-- Sample SQL for PostgreSQL" > .github/echo_codeql/db/postgresql/sample.sql
          echo "-- Sample SQL for Oracle" > .github/echo_codeql/db/oracle/sample.sql
          echo "-- Sample SQL for MongoDB" > .github/echo_codeql/db/mongodb/sample.js
          echo "-- Sample SQL for Tibero" > .github/echo_codeql/db/tibero/sample.sql

          echo "echo '[Info] All echo files created.'" | tee -a .github/echo_codeql/logs/init.log

      - name: 🛠️ Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: ⚙️ Manual Build Placeholder
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo '[Manual Build] Please add custom build logic here.'
          exit 1

      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

      - name: 🧾 Upload Echo Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-codeql-files-${{ matrix.language }}
          path: .github/echo_codeql/
