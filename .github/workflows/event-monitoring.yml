name: 📦 전문가 분산/집계/설치/암호화/리메이크/스냅샷 자동화 (패키지 자동 최신화/확장형)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [workflow_run]
  schedule:
    - cron: '*/5 * * * *'

jobs:
  all-in-one-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 [패키지 자동 최신화/확장] APT/PIP with 외부 입력 지원
        run: |
          set -e
          echo "[APT 최신화] 기존 패키지 upgrade + 신규 install + 동적 리스트 지원"
          sudo apt-get update -y
          sudo apt-get upgrade -y || true

          # (1) APT 패키지 동적 리스트: 파일 우선, 없으면 인라인
          APT_LIST_FILE=".github/pkglist-apt.txt"
          if [ -f "$APT_LIST_FILE" ]; then
            PKGS=$(grep -v '^#' "$APT_LIST_FILE" | tr -s ' ' '\n' | grep -v '^\s*$' | sort -u | tr '\n' ' ')
            echo "[INFO] 외부 파일에서 APT 패키지 목록 로드: $PKGS"
          else
            PKGS="wget gnupg ca-certificates lsb-release openjdk-11-jre apt-transport-https python3 python3-pip curl tree jq"
            echo "[INFO] 기본 인라인 APT 패키지 사용: $PKGS"
          fi

          # (2) apt 패키지별 설치/최신화
          for p in $PKGS; do
            if dpkg -s $p &>/dev/null; then
              echo "[$p] 업그레이드 시도"
              sudo apt-get install --only-upgrade -y $p
            else
              echo "[$p] 신규 설치"
              sudo apt-get install -y $p
            fi
          done

          # (3) PIP 패키지 동적 리스트: 파일 우선, 없으면 인라인
          PIP_LIST_FILE=".github/pkglist-pip.txt"
          if [ -f "$PIP_LIST_FILE" ]; then
            PKGSPY=$(grep -v '^#' "$PIP_LIST_FILE" | tr -s ' ' '\n' | grep -v '^\s*$' | sort -u | tr '\n' ' ')
            echo "[INFO] 외부 파일에서 PIP 패키지 목록 로드: $PKGSPY"
          else
            PKGSPY="requests"
            echo "[INFO] 기본 인라인 PIP 패키지 사용: $PKGSPY"
          fi

          # (4) pip 최신화 및 패키지별 install/upgrade
          sudo python3 -m pip install --upgrade pip
          for p in $PKGSPY; do
            python3 -m pip show $p &>/dev/null && python3 -m pip install --upgrade $p || python3 -m pip install $p
          done

          # 클린업
          rm -rf collector-data elk-data docker-data encrypted-data snapshot
          rm -rf runs-details jobs-details steps-details collector-tmp remake-batch
          rm -f all-runs-*.json
          echo '[초기화 및 패키지 최신화] 완료' > clean.log

      # 이하 단계 동일 (생략 가능, 위의 워크플로 최적화 내용과 100% 호환)
      - name: 📂 [분산 디렉토리 생성] 병렬 처리
        run: |
          dirs="collector-data elk-data docker-data encrypted-data snapshot runs-details jobs-details steps-details collector-tmp remake-batch remake-batch/sample remake-batch/logs"
          echo $dirs | xargs -n 1 -P 8 bash -c 'mkdir -p "$0"; echo "[생성] $0" > "$0/echo_dir.txt"'
          tree -a > snapshot/dirs_tree_init.txt || ls -lR > snapshot/dirs_tree_init.txt

      - name: 🔐 [데이터 생성+암호화] 병렬화
        run: |
          (
            echo '기존 데이터 샘플 1' > collector-data/old-data-1.txt
            echo '기존 데이터 샘플 2' > collector-data/old-data-2.txt
            sha256sum collector-data/old-data-1.txt > collector-data/old-data-1-sha256.txt
            sha256sum collector-data/old-data-2.txt > collector-data/old-data-2-sha256.txt
            cp collector-data/old-data-1.txt encrypted-data/old-data-1.txt
            cp collector-data/old-data-2.txt encrypted-data/old-data-2.txt
            openssl enc -aes-256-cbc -pbkdf2 -salt -in encrypted-data/old-data-1.txt -out encrypted-data/old-data-1.txt.enc -k oldpassword &
            openssl enc -aes-256-cbc -pbkdf2 -salt -in encrypted-data/old-data-2.txt -out encrypted-data/old-data-2.txt.enc -k oldpassword &
            wait
            rm -f encrypted-data/old-data-1.txt encrypted-data/old-data-2.txt
            sha256sum encrypted-data/old-data-1.txt.enc > encrypted-data/old-data-1-sha256.txt
            sha256sum encrypted-data/old-data-2.txt.enc > encrypted-data/old-data-2-sha256.txt
          ) &

          (
            echo '신규 데이터 샘플 1' > collector-data/new-data-1.txt
            echo '신규 데이터 샘플 2' > collector-data/new-data-2.txt
            sha256sum collector-data/new-data-1.txt > collector-data/new-data-1-sha256.txt
            sha256sum collector-data/new-data-2.txt > collector-data/new-data-2-sha256.txt
            cp collector-data/new-data-1.txt encrypted-data/new-data-1.txt
            cp collector-data/new-data-2.txt encrypted-data/new-data-2.txt
            openssl enc -aes-256-cbc -pbkdf2 -salt -in encrypted-data/new-data-1.txt -out encrypted-data/new-data-1.txt.enc -k newpassword &
            openssl enc -aes-256-cbc -pbkdf2 -salt -in encrypted-data/new-data-2.txt -out encrypted-data/new-data-2.txt.enc -k newpassword &
            wait
            rm -f encrypted-data/new-data-1.txt encrypted-data/new-data-2.txt
            sha256sum encrypted-data/new-data-1.txt.enc > encrypted-data/new-data-1-sha256.txt
            sha256sum encrypted-data/new-data-2.txt.enc > encrypted-data/new-data-2-sha256.txt
          ) &
          wait

      - name: 🧹 [리메이크 배치/로그/샘플] xargs로 병렬 생성
        run: |
          seq 1 10 | xargs -I{} -P 5 bash -c 'echo "샘플 데이터 {} - $(date +%Y%m%d%H%M%S)" > remake-batch/sample/sample_data_{}.txt'
          seq 1 5 | xargs -I{} -P 5 bash -c 'echo "로그 기록 {} - $(date +%Y-%m-%dT%H:%M:%S)" > remake-batch/logs/log_{}.log'
          echo "[샘플/로그 데이터 생성 완료]" > remake-batch/batch_done.txt

      - name: 🐘 [TimescaleDB/Postgres 15 설치(GPG 최신화)]
        run: |
          wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor | sudo tee /usr/share/keyrings/postgresql.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-15 postgresql-server-dev-15
          wget --quiet -O - https://packagecloud.io/timescale/timescaledb/gpgkey | gpg --dearmor | sudo tee /usr/share/keyrings/timescale-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/timescale-archive-keyring.gpg] https://packagecloud.io/timescale/timescaledb/ubuntu/ $(lsb_release -c -s) main" | sudo tee /etc/apt/sources.list.d/timescaledb.list
          sudo apt-get update -y
          sudo apt-get install -y timescaledb-2-postgresql-15 timescaledb-2-loader-postgresql-15 timescaledb-tools timescaledb-toolkit-postgresql-15
          echo '샘플 TimescaleDB 데이터' > collector-data/sample-tsdb.txt
          sha256sum collector-data/sample-tsdb.txt > collector-data/sample-tsdb-sha256.txt

      - name: 🔎 [ELK Stack 설치]
        run: |
          wget -qO - https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor | sudo tee /usr/share/keyrings/elasticsearch.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/elasticsearch.gpg] https://artifacts.elastic.co/packages/7.x/apt stable main" | sudo tee /etc/apt/sources.list.d/elastic-7.x.list
          sudo apt-get update -y
          sudo apt-get install -y elasticsearch logstash kibana
          sudo systemctl enable elasticsearch.service kibana.service logstash.service
          sudo systemctl start elasticsearch.service kibana.service logstash.service
          (elasticsearch --version > elk-data/elasticsearch_version.txt 2>&1 || echo "elasticsearch not found" >> elk-data/elasticsearch_version.txt)
          (kibana --version > elk-data/kibana_version.txt 2>&1 || echo "kibana not found" >> elk-data/kibana_version.txt)
          (logstash --version > elk-data/logstash_version.txt 2>&1 || echo "logstash not found" >> elk-data/logstash_version.txt)
          echo '샘플 ELK 로그' > elk-data/sample-elk-log.txt
          sha256sum elk-data/sample-elk-log.txt > elk-data/sample-elk-log-sha256.txt

      - name: 🐳 [Docker 설치/이미지] - 공식 스크립트+최소화
        run: |
          curl -fsSL https://get.docker.com | sh
          sudo docker --version > docker-data/docker_version.txt
          echo -e 'FROM ubuntu:22.04\nRUN apt-get update && apt-get install -y curl' > docker-data/Dockerfile
          sudo docker build -t elk-timescale-test:latest docker-data &
          wait

      - name: 🧹 [메모리 GC/캐시해제+Snapshot]
        run: |
          sync; sudo sysctl -w vm.drop_caches=3
          free -h > snapshot/memory_after_gc.txt

      - name: 📝 [워크플로우 실행 수집] (병렬화/빠른 파싱)
        run: |
          > all-runs-arrays.json
          for page in $(seq 1 10); do
            (
              resp=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100&page=$page")
              msg=$(echo "$resp" | jq -r '.message // empty')
              if [[ "$msg" == *"rate limit"* ]] || [[ "$msg" == *"API rate limit exceeded"* ]]; then
                echo "[]" > all-runs-page-$page.json
                exit
              fi
              echo "$resp" | jq '.workflow_runs // []' > all-runs-page-$page.json
            ) &
          done
          wait
          cat all-runs-page-*.json > all-runs-arrays.json
          cat all-runs-arrays.json | jq -s 'add' > all-runs-flat.json || echo "[]" > all-runs-flat.json
          jq '[.[] | {id, name, display_title, status, conclusion, run_number, html_url, created_at, updated_at, actor: (if .actor then .actor.login else "" end)}]' all-runs-flat.json > all-runs-summary.json || echo "[]" > all-runs-summary.json

      - name: 워크플로우 상세/잡/스텝 데이터 분산 저장 (병렬)
        run: |
          ids=$(cat all-runs-summary.json 2>/dev/null | jq -r '.[].id' | head -50 || true)
          for rid in $ids; do
            (
              run_resp=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$rid")
              echo "$run_resp" > runs-details/run-$rid.json
              jobs_resp=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$rid/jobs")
              echo "$jobs_resp" > jobs-details/jobs-$rid.json
              echo "$jobs_resp" | jq '[.jobs // [] | .[] | {id, name, status, conclusion, started_at, completed_at, steps: [.steps // [] | .[] | {name, status, conclusion}] }]' > steps-details/steps-$rid.json
            ) &
          done
          wait

      - name: 📦 [전체 업로드] 모든 결과/배치/스냅샷/리메이크
        uses: actions/upload-artifact@v4
        with:
          name: all-artifacts-distributed-batch-encrypted-with-echo
          path: |
            collector-data/
            elk-data/
            docker-data/
            encrypted-data/
            snapshot/
            remake-batch/
            runs-details/
            jobs-details/
            steps-details/
            collector-tmp/

      - name: 📊 [요약] 최신 데이터 현황
        run: |
          echo "▶️ [collector-data/*]"; ls -lh collector-data | head -20 || true
          echo "▶️ [encrypted-data]"; ls -lh encrypted-data | grep '\.enc' || echo '[⚠️] 없음'
          echo "▶️ [remake-batch/sample]"; ls -l remake-batch/sample | grep sample_data_ || echo '[⚠️] 없음'
          echo "▶️ [remake-batch/logs]"; ls -l remake-batch/logs | grep log_ || echo '[⚠️] 없음'
          echo "▶️ [all-runs-summary.json]"; head -40 all-runs-summary.json || echo '[⚠️] 없음'
