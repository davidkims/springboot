name: ♾️ Transfer Log Backup - Cron (60건 Infinite)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  transfer_log_backup:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      oracle:
        image: gvenzl/oracle-xe:18-slim
        env:
          ORACLE_PASSWORD: testpass
          ORACLE_ALLOW_REMOTE: "true"
        ports:
          - 1521:1521

    env:
      TRANSFER_LOG_DIR: /opt/logs/transfer
      BACKUP_DIR: /opt/backup/transfer
      PROVENANCE_DIR: provenance
      PROVENANCE_STORE_DIR: provenance/store

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Install Oracle Instant Client
        run: |
          echo "[📥] Installing Oracle client prerequisites..."
          sudo apt-get update
          sudo apt-get install -y libaio1 unzip
          echo "[📁] Creating Instant Client directory..."
          mkdir -p /opt/oracle
          echo "[⬇️] Downloading Oracle Instant Client ZIP..."
          curl -L -o /tmp/instantclient.zip \
            https://download.oracle.com/otn_software/linux/instantclient/217000/instantclient-basic-linux.x64-21.7.0.0.0.zip
          echo "[🗜️] Unzipping Instant Client..."
          unzip /tmp/instantclient.zip -d /opt/oracle
          echo "[🔗] Configuring library path..."
          echo "/opt/oracle/instantclient_21_7" | sudo tee /etc/ld.so.conf.d/oracle-instantclient.conf
          sudo ldconfig
          echo "[✅] Oracle Instant Client installed"

      - name: ⏳ Wait for databases to be ready
        run: |
          echo "[⏳] Waiting for MySQL…"
          until mysqladmin ping -h127.0.0.1 -uroot -ptestpass --silent; do sleep 5; done
          echo "[✅] MySQL is up"

          echo "[⏳] Waiting for PostgreSQL…"
          until pg_isready -h127.0.0.1 -U testuser; do sleep 5; done
          echo "[✅] PostgreSQL is up"

          echo "[⏳] Waiting for Oracle listener on 1521…"
          until bash -c "exec 3<>/dev/tcp/127.0.0.1/1521"; do sleep 5; done
          echo "[✅] Oracle listener is accepting connections"

      - name: 🔧 Configure DB users & permissions
        run: |
          echo "[🔧] Creating MySQL user 'testuser' and granting privileges..."
          mysql -h127.0.0.1 -uroot -ptestpass -e "
            CREATE USER IF NOT EXISTS 'testuser'@'%' IDENTIFIED BY 'testpass';
            GRANT ALL PRIVILEGES ON testdb.* TO 'testuser'@'%';
            FLUSH PRIVILEGES;
          "
          echo "[🔧] Creating Oracle user 'testuser' and granting privileges..."
          cat << 'EOF' > /tmp/init_oracle.sql
          CREATE USER testuser IDENTIFIED BY testpass;
          GRANT CONNECT, RESOURCE TO testuser;
          GRANT UNLIMITED TABLESPACE TO testuser;
          EXIT;
          EOF
          sqlplus -s system/testpass@//127.0.0.1:1521/XE @/tmp/init_oracle.sql

          echo "[📁] Creating JDBC credential directory and files..."
          mkdir -p /opt/jdbc/credentials
          cat << 'EOF' > /opt/jdbc/credentials/.my.cnf
          [client]
          user=testuser
          password=testpass
          host=127.0.0.1
          EOF
          chmod 600 /opt/jdbc/credentials/.my.cnf

          echo "[🔒] Setting permissions on /opt/jdbc and /opt/oracle..."
          chmod -R 755 /opt/jdbc
          chmod -R 755 /opt/oracle

          echo "[✅] DB users, credentials, and permissions configured"

      - name: 🧪 Install Java & JDBC Drivers and Test Connections
        run: |
          echo "[☕] Installing Java JDK..."
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          java -version
          javac -version

          echo "[📁] Creating JDBC directories..."
          mkdir -p /opt/jdbc /opt/jdbc/test

          echo "[⬇️] Downloading MySQL Connector/J..."
          curl -L -o /opt/jdbc/mysql-connector-j.jar \
            https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/8.3.0/mysql-connector-j-8.3.0.jar

          echo "[⬇️] Downloading PostgreSQL JDBC Driver..."
          curl -L -o /opt/jdbc/postgresql-jdbc.jar \
            https://jdbc.postgresql.org/download/postgresql-42.7.3.jar

          echo "[⬇️] Downloading Oracle JDBC (ojdbc8)…"
          curl -L -o /opt/jdbc/ojdbc8.jar \
            https://repo1.maven.org/maven2/com/oracle/database/jdbc/ojdbc8/19.3.0.0/ojdbc8-19.3.0.0.jar

          echo "[📄] Generating JDBCTest.java (with echo)…"
          {
            echo 'import java.sql.Connection;'
            echo 'import java.sql.DriverManager;'
            echo ''
            echo 'public class JDBCTest {'
            echo '    public static void main(String[] args) {'
            echo '        String type = args[0];'
            echo '        String url = "";'
            echo '        String user = "testuser";'
            echo '        String password = "testpass";'
            echo ''
            echo '        switch (type) {'
            echo '            case "mysql":'
            echo '                url = "jdbc:mysql://127.0.0.1:3306/testdb";'
            echo '                break;'
            echo '            case "postgres":'
            echo '                url = "jdbc:postgresql://127.0.0.1:5432/testdb";'
            echo '                break;'
            echo '            case "oracle":'
            echo '                url = "jdbc:oracle:thin:@127.0.0.1:1521:XE";'
            echo '                break;'
            echo '            default:'
            echo '                System.err.println("Unsupported type: " + type);'
            echo '                System.exit(1);'
            echo '        }'
            echo ''
            echo '        try (Connection conn = DriverManager.getConnection(url, user, password)) {'
            echo '            System.out.println("[\u2705] Connected to " + type + " successfully.");'
            echo '        } catch (Exception e) {'
            echo '            System.err.println("[\u274c] Connection to " + type + " failed: " + e.getMessage());'
            echo '        }'
            echo '    }'
            echo '}'
          } | tee /opt/jdbc/test/JDBCTest.java

          echo "[🚰] Compiling JDBC Test Code…"
          javac -cp "/opt/jdbc/*" /opt/jdbc/test/JDBCTest.java

          echo "[🧲] Testing MySQL JDBC connection…"
          java -cp "/opt/jdbc/*:/opt/jdbc/test" JDBCTest mysql || true

          echo "[🧲] Testing PostgreSQL JDBC connection…"
          java -cp "/opt/jdbc/*:/opt/jdbc/test" JDBCTest postgres || true

          echo "[🧲] Testing Oracle JDBC connection…"
          java -cp "/opt/jdbc/*:/opt/jdbc/test" JDBCTest oracle || true

          echo "[📂] Listing JDBC contents:"
          tree /opt/jdbc || ls -lh /opt/jdbc/
