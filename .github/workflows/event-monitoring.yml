name: 📡 Workflow Event Monitoring

on:
  workflow_run:
    types:
      - requested
      - in_progress
      - completed
  workflow_job:
    types:
      - queued
      - in_progress
      - completed

jobs:
  log-workflow-run:
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📝 Echo Workflow Run Details
        run: |
          echo "[📡] Workflow Run Event: ${{ github.event.action }}"
          echo "[📡] Name: ${{ github.event.workflow_run.name }}"
          echo "[📡] ID: ${{ github.event.workflow_run.id }}"
          echo "[📡] Run Number: ${{ github.event.workflow_run.run_number }}"
          echo "[📡] Status: ${{ github.event.workflow_run.status }}"
          echo "[📡] Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "[📡] URL: ${{ github.event.workflow_run.html_url }}"

      - name: 📁 Create event file
        run: |
          cat << 'EOF' > workflow-run-event-${{ github.event.workflow_run.id }}.txt
          Workflow Run Event: ${{ github.event.action }}
          Name: ${{ github.event.workflow_run.name }}
          ID: ${{ github.event.workflow_run.id }}
          Run Number: ${{ github.event.workflow_run.run_number }}
          Status: ${{ github.event.workflow_run.status }}
          Conclusion: ${{ github.event.workflow_run.conclusion }}
          URL: ${{ github.event.workflow_run.html_url }}
          EOF

      - name: 📂 Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: workflow-run-event-${{ github.event.workflow_run.id }}
          path: workflow-run-event-${{ github.event.workflow_run.id }}.txt

  log-workflow-job:
    if: ${{ github.event_name == 'workflow_job' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📝 Echo Workflow Job Details
        run: |
          echo "[📡] Workflow Job Event: ${{ github.event.action }}"
          echo "[📡] Workflow Name: ${{ github.event.workflow_job.run.workflow.name }}"
          echo "[📡] Job ID: ${{ github.event.workflow_job.id }}"
          echo "[📡] Job Name: ${{ github.event.workflow_job.name }}"
          echo "[📡] Status: ${{ github.event.workflow_job.status }}"
          echo "[📡] Conclusion: ${{ github.event.workflow_job.conclusion }}"

      - name: 📁 Create job event file
        run: |
          cat << 'EOF' > workflow-job-event-${{ github.event.workflow_job.id }}.txt
          Workflow Job Event: ${{ github.event.action }}
          Workflow Name: ${{ github.event.workflow_job.run.workflow.name }}
          Job ID: ${{ github.event.workflow_job.id }}
          Job Name: ${{ github.event.workflow_job.name }}
          Status: ${{ github.event.workflow_job.status }}
          Conclusion: ${{ github.event.workflow_job.conclusion }}
          EOF

      - name: 📂 Upload Job Artifact
        uses: actions/upload-artifact@v3
        with:
          name: workflow-job-event-${{ github.event.workflow_job.id }}
          path: workflow-job-event-${{ github.event.workflow_job.id }}.txt
