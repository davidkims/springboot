name: ✨ Slot Workflow with Safe Push and Pull Request

  Automatically rotates slot directories, tags with timestamp,
  archives workflow files, and safely pushes via non-force PR branch.

on:
  schedule:
    - cron: '1 * * * *'  # 매시 1분 실행
  workflow_dispatch:

concurrency:
  group: slot-workflow
  cancel-in-progress: false

env:
  SLOT_PREFIX: "slot-"
  BASE_BRANCH: main

jobs:
  slot-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout
        uses: actions/checkout@v4

      - name: 🌍 Detect latest slot and calculate next
        id: slot
        run: |
          mkdir -p disk
          LATEST=$(find disk/ -maxdepth 1 -type d -name "slot-*" | sort | tail -n1 | sed 's|.*/||')
          COUNT=${LATEST##*-}
          if [[ -z "$COUNT" ]]; then COUNT=1; else COUNT=$((10#$COUNT + 1)); fi
          printf -v NEXT_SLOT "%s%03d" "$SLOT_PREFIX" "$COUNT"
          echo "next=$NEXT_SLOT" >> $GITHUB_OUTPUT

      - name: 📁 Create slot directory
        run: |
          mkdir -p disk/${{ steps.slot.outputs.next }}/logs
          mkdir -p disk/${{ steps.slot.outputs.next }}/.github/workflows
          cp -r .github/workflows/* disk/${{ steps.slot.outputs.next }}/.github/workflows/

      - name: ✨ Generate tag
        id: tag
        run: |
          TAG_NAME="${{ steps.slot.outputs.next }}-$(date -u +'%Y%m%dT%H%MZ')"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: 📊 Symlink slot-latest
        run: |
          rm -f disk/slot-latest
          ln -sfn ${{ steps.slot.outputs.next }} disk/slot-latest

      - name: 🔍 Log slot activity
        run: |
          echo "[$(date -u)] Slot created: ${{ steps.slot.outputs.next }} with tag ${{ steps.tag.outputs.tag }}" >> disk/${{ steps.slot.outputs.next }}/logs/slot.log

      - name: ✂ Create PR branch and commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "bot@example.com"
          BRANCH="auto/${{ steps.slot.outputs.next }}-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add disk/${{ steps.slot.outputs.next }} disk/slot-latest || echo "No changes"
          git commit -m "📁 New slot: ${{ steps.slot.outputs.next }}" || echo "Nothing to commit"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_ENV

      - name: 🔗 Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.branch }}
          base: ${{ env.BASE_BRANCH }}
          title: "🌍 Update workflows in ${{ steps.slot.outputs.next }}"
          body: |
            ### Slot Directory Update
            - Slot: `${{ steps.slot.outputs.next }}`
            - Tag: `${{ steps.tag.outputs.tag }}`
            - Time: `$(date -u +'%Y-%m-%dT%H:%M:%SZ')`

            PR created automatically by GitHub Actions.
          commit-message: "📁 Commit for ${{ steps.slot.outputs.next }}"
          delete-branch: true
