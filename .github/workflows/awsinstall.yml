name: 🟦 AWS CLI Install, Directory, Env Echo, Encrypt, DB Echo & IAM User Create

on:
  workflow_dispatch:

jobs:
  awscli-full-automation:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🗂️ [echo] 주요 디렉토리 추가 생성
        run: |
          for d in \
            .github/echo \
            .github/sql \
            .github/logs \
            .github/aws_out \
            .github/error_logs \
            .github/cli_test \
            .github/cli_test_bak \
            .github/aws_tmp \
            .github/aws_reports \
            .github/s3_backup \
            .github/iam_cache \
            .github/lambda_tmp \
            .github/db_echo; do
            echo "echo 'mkdir -p $d'"
            mkdir -p $d
          done

      - name: 🟦 [echo] 환경/패키지 정보 echo 파일 생성 및 저장
        run: |
          set -e
          echo "echo '[🟦] 환경/패키지 정보 echo 파일 생성...'"
          echo '[🟦] 환경/패키지 정보 echo 파일 생성...'
          {
            echo "echo \"[ENV] OS: $(uname -a)\""
            echo "echo \"[ENV] Shell: \$SHELL\""
            echo "echo \"[ENV] Date: $(date '+%Y-%m-%d %H:%M:%S')\""
            echo "echo \"[ENV] Python: $(python3 --version 2>&1)\""
            echo "echo \"[ENV] Node.js: $(node -v 2>/dev/null || echo N/A)\""
            echo "echo \"[ENV] Docker: $(docker --version 2>/dev/null || echo N/A)\""
            echo "echo \"[ENV] Git: $(git --version 2>&1)\""
            echo "echo \"[ENV] Openssl: $(openssl version 2>&1)\""
            echo "echo \"[ENV] AWS CLI: $(aws --version 2>&1 || echo Not installed)\""
          } > .github/echo/env_info_echo.txt
          echo "cat .github/echo/env_info_echo.txt"
          cat .github/echo/env_info_echo.txt

      - name: 🟦 [echo] 패키지 업그레이드 및 AWS CLI 설치 (최신 v2)
        run: |
          set -e
          echo "echo '[🟦] 패키지 목록 업그레이드 및 AWS CLI 설치/업그레이드...'"
          echo '[🟦] 패키지 목록 업그레이드 및 AWS CLI 설치/업그레이드...'
          sudo apt-get update -y
          sudo apt-get upgrade -y
          sudo apt-get install -y unzip curl openssl tar jq

          sudo rm -rf /usr/local/aws /usr/local/bin/aws || true
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q -o awscliv2.zip
          sudo ./aws/install --update 2>&1 | tee .github/aws_out/awscli_install.log
          aws --version | tee .github/aws_out/awscli_version.log

      - name: 🟨 [echo] AWS CLI DB echo 파일 생성
        run: |
          dt=$(date '+%Y-%m-%d %H:%M:%S')
          {
            echo "echo \"[DB ECHO] AWS CLI 설치 및 백업 내역 기록\""
            echo "echo \"[DB ECHO] 실행 시간: $dt\""
            echo "echo \"[DB ECHO] 저장 디렉토리: .github/aws_out/\""
            echo "echo \"[DB ECHO] 암호화 파일: awscli_all.tar.gz.enc\""
            echo "echo \"[DB ECHO] 인스톨 로그: awscli_install.log\""
            echo "echo \"[DB ECHO] 버전 로그: awscli_version.log\""
          } > .github/db_echo/awscli_db_echo.txt

      - name: 🟧 [echo] AWS credentials 세팅 및 검증
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2
        run: |
          set -e
          echo "echo '[🟧] AWS credentials 세팅/검증...'"
          echo '[🟧] AWS credentials 세팅/검증...'
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "[❌] AWS credentials가 세팅되지 않았습니다. secrets에 AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY를 추가하세요."
            exit 253
          fi
          echo "[OK] AWS credentials 세팅됨"
          # 환경 변수 상태 파일 저장
          {
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
            echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION"
          } > .github/echo/aws_env_check.txt

      - name: 🟨 [echo] AWS IAM 가상계정 및 패스워드 자동 생성
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2
        run: |
          set -e
          echo "echo '[🟨] AWS 가상계정 및 패스워드 자동 생성...'"
          echo '[🟨] AWS 가상계정 및 패스워드 자동 생성...'
          # 1. 랜덤 가상계정 이름/랜덤 패스워드 생성
          IAM_USER="gh-iam-$(date +%Y%m%d%H%M%S)-$RANDOM"
          IAM_PASS="$(openssl rand -base64 18 | tr -d '=+/[:space:]' | cut -c1-16)Aa1!"
          echo "생성할 IAM 사용자: $IAM_USER"
          echo "임시 패스워드: $IAM_PASS"
          # 2. IAM User 생성
          aws iam create-user --user-name "$IAM_USER"
          # 3. 콘솔 로그인 패스워드(임시) 등록
          aws iam create-login-profile --user-name "$IAM_USER" --password "$IAM_PASS" --password-reset-required
          # 4. 액세스 키 발급
          aws iam create-access-key --user-name "$IAM_USER" > .github/aws_out/${IAM_USER}_accesskey.json
          # 5. 로그 파일로 기록
          {
            echo "IAM_USER=$IAM_USER"
            echo "IAM_PASS=$IAM_PASS"
          } > .github/aws_out/${IAM_USER}_created.txt
          echo "cat .github/aws_out/${IAM_USER}_created.txt"
          cat .github/aws_out/${IAM_USER}_created.txt
          echo "cat .github/aws_out/${IAM_USER}_accesskey.json"
          cat .github/aws_out/${IAM_USER}_accesskey.json

      - name: 🟦 [echo] 파일 백업 및 암호화 (AES-256-CBC)
        run: |
          echo "echo '[🟦] 파일 백업/암호화 시작...'"
          echo '[🟦] 파일 백업/암호화 시작...'
          tar -czf awscli_all.tar.gz awscliv2.zip aws .github/aws_out/awscli_install.log .github/aws_out/awscli_version.log
          openssl enc -aes-256-cbc -salt -pbkdf2 -pass pass:"${ENCRYPT_PASS:-AwsCliEncrypt1234}" \
            -in awscli_all.tar.gz -out .github/aws_out/awscli_all.tar.gz.enc
          rm -f awscli_all.tar.gz
          echo "echo '[🟦] 암호화 파일 .github/aws_out/awscli_all.tar.gz.enc 이동 완료'"
          echo '[🟦] 암호화 파일 .github/aws_out/awscli_all.tar.gz.enc 이동 완료'
