name: 🛡️ Scorecard Security Automation + Echo Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 1'

jobs:
  scorecard-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Init Echo Directory Structure
        run: |
          echo "echo '[❄ Init] Echo directory structure'" | tee -a .github/echo/init/init_dirs.sh
          for base in scorecard template placeholder fix cli; do
            for sub in logs scripts test init converted; do
              mkdir -p .github/echo_${base}/${sub}
            done
          done
          echo 'API_KEY=PLACEHOLDER' > .github/echo_template/sample.env
          echo 'TOKEN=PLACEHOLDER' > .github/echo_template/sample.cfg
          echo '{ "secret": "PLACEHOLDER" }' > .github/echo_template/sample.json

      - name: ⚙️ Install gh CLI
        run: |
          sudo apt-get update -y && sudo apt-get install -y gh

      - name: 🛠️ Install Scorecard CLI (Tarball)
        run: |
          VERSION="4.10.3"
          curl -sLO https://github.com/ossf/scorecard/releases/download/v${VERSION}/scorecard_${VERSION}_linux_amd64.tar.gz
          tar -xzf scorecard_${VERSION}_linux_amd64.tar.gz
          BIN=$(find scorecard_${VERSION}_linux_amd64 -type f -name scorecard | head -1 || true)
          if [ -z "$BIN" ]; then
            echo "::error ::[FAIL] scorecard binary not found"; exit 1
          fi
          chmod +x "$BIN"
          sudo mv "$BIN" /usr/local/bin/scorecard
          scorecard --version | tee .github/echo_scorecard/logs/version.txt
          echo "echo 'scorecard CLI 설치 완료'" | tee -a .github/echo_cli/logs/install.log

      - name: 🔍 Run Scorecard and Save JSON
        run: |
          REPO="github.com/${{ github.repository }}"
          scorecard --repo=$REPO --format=json > .github/echo_scorecard/logs/scorecard.json
          cat .github/echo_scorecard/logs/scorecard.json | jq '.' > .github/echo_scorecard/converted/scorecard.pretty.json

      - name: 📂 Replace PLACEHOLDER in Templates
        run: |
          sed 's/PLACEHOLDER/REPLACED_VALUE/g' .github/echo_template/sample.env > .github/echo_placeholder/converted/sample.env
          sed 's/PLACEHOLDER/REPLACED_VALUE/g' .github/echo_template/sample.cfg > .github/echo_placeholder/converted/sample.cfg
          sed 's/PLACEHOLDER/REPLACED_VALUE/g' .github/echo_template/sample.json > .github/echo_placeholder/converted/sample.json

      - name: 🔧 Generate Fix Script from Scorecard
        run: |
          echo "#!/bin/bash" > .github/echo_fix/scripts/apply_fixes.sh
          echo "echo '[🔧 Fix] Applying security fixes based on scorecard.json'" >> .github/echo_fix/scripts/apply_fixes.sh
          chmod +x .github/echo_fix/scripts/apply_fixes.sh
          echo "echo '[SIMULATION] Updating SECURITY.md'" >> .github/echo_fix/scripts/apply_fixes.sh
          echo "echo '[SIMULATION] Enabling branch protection'" >> .github/echo_fix/scripts/apply_fixes.sh
          echo "echo '[SIMULATION] Enabling Dependabot alerts'" >> .github/echo_fix/scripts/apply_fixes.sh
          .github/echo_fix/scripts/apply_fixes.sh

      - name: 🤖 Auto-create PR if Fixes Found
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b scorecard-fix-${{ github.run_id }}
          git add .github/echo_fix/scripts/apply_fixes.sh
          git commit -m "🔧 Apply Scorecard fixes (auto-generated)"
          git push origin scorecard-fix-${{ github.run_id }}
          gh pr create --title "🔧 Security Fixes from Scorecard" --body "This PR contains auto-generated fixes based on Scorecard analysis." || echo "gh pr create failed"

      - name: 📤 Upload Echo Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-scorecard-all
          path: .github/echo_*
