# .github/workflows/event-monitoring.yml
name: 📡 워크플로 이벤트 모니터링 (Dispatch + Schedule 방식)

on:
  # 각 워크플로우에서 repository_dispatch로 보낸 이벤트를 수신
  repository_dispatch:
    types:
      - workflow_run

  # 5분마다 자동 실행하여 최신 실행을 폴링
  schedule:
    - cron: '*/5 * * * *'

  # 수동 실행 지원
  workflow_dispatch: {}

jobs:
  monitor-run:
    runs-on: ubuntu-latest

    steps:
      - name: ▶️ Determine run_id
        id: get_run
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            echo "run_id=${{ github.event.client_payload.run_id }}" >> $GITHUB_OUTPUT
          else
            # 스케줄 실행: 가장 최근 워크플로우 실행 1건 조회
            run_id=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=1 \
              | jq -r '.workflow_runs[0].id')
            echo "run_id=$run_id" >> $GITHUB_OUTPUT
          fi

      - name: 🛠️ Fetch run data
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ steps.get_run.outputs.run_id }} \
            > run-${{ steps.get_run.outputs.run_id }}.json

      - name: 📝 Log workflow run details
        run: |
          NAME=$(jq -r .name run-${{ steps.get_run.outputs.run_id }}.json)
          RN=$(jq -r .run_number run-${{ steps.get_run.outputs.run_id }}.json)
          STATUS=$(jq -r .status run-${{ steps.get_run.outputs.run_id }}.json)
          CONCL=$(jq -r .conclusion run-${{ steps.get_run.outputs.run_id }}.json)
          URL=$(jq -r .html_url run-${{ steps.get_run.outputs.run_id }}.json)
          echo "워크플로: $NAME (#$RN)"
          echo "상태: $STATUS / 결론: $CONCL"
          echo "URL: $URL"

      - name: 📁 Save metadata to file
        run: |
          jq -r '"워크플로: "+.name+" (#"+(.run_number|tostring)+")","상태: "+.status+" / 결론: "+.conclusion,"URL: "+.html_url' \
            run-${{ steps.get_run.outputs.run_id }}.json \
          > run-${{ steps.get_run.outputs.run_id }}.txt

      - name: 📂 Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflow-run-${{ steps.get_run.outputs.run_id }}
          path: run-${{ steps.get_run.outputs.run_id }}.txt

      - name: 🔍 Fetch jobs list
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ steps.get_run.outputs.run_id }}/jobs \
            > jobs-${{ steps.get_run.outputs.run_id }}.json

      - name: 📂 Upload jobs artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflow-jobs-${{ steps.get_run.outputs.run_id }}
          path: jobs-${{ steps.get_run.outputs.run_id }}.json
