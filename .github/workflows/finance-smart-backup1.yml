name: email-servers-mass-setup

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Base domain for virtual accounts"
        required: false
        default: "example.local"
      user_count:
        description: "Number of virtual accounts per service"
        required: false
        default: "50"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: /opt/email
      DOMAIN: ${{ github.event.inputs.domain || 'example.local' }}
      USER_COUNT: ${{ github.event.inputs.user_count || '50' }}
      SERVICES: "postfix exim4 opensmtpd mailhog mailcatcher smtp-sink maildev"

    steps:
      - name: Prepare massive directory tree per service
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo mkdir -p "$BASE"
          sudo chown -R "$USER:$USER" "$BASE"

          # 표준 트리 + 대량 더미 디렉토리(001~100)
          for SVC in $SERVICES; do
            for d in bin config logs pid run spool queue tmp data certs keys users inbox outbox archive scripts env acl docs policies backups reports; do
              mkdir -p "$BASE/$SVC/$d"
            done
            for i in $(seq -w 001 100); do
              mkdir -p "$BASE/$SVC/bulk/dir_$i"
            done
          done
          chmod -R 755 "$BASE"

      - name: Install base prerequisites (no containerd.io)
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates apt-transport-https software-properties-common \
            curl wget git build-essential jq \
            ruby-full libsqlite3-dev \
            apache2-utils openssl
          # Docker는 재설치 대신 업그레이드만 수행 (containerd.io 충돌 회피)
          sudo apt-get install -y --only-upgrade docker.io containerd || true
          docker --version || true
          containerd --version || true
          # 필요시 Docker 기동
          sudo systemctl is-active --quiet docker || sudo systemctl start docker || true

      - name: Global README & security policy via echo/heredoc
        shell: bash
        run: |
          set -Eeuo pipefail
          cat <<'EOF' | tee "$BASE/README.txt" >/dev/null
          This CI workspace provisions email servers for testing.
          MTAs (postfix/exim4/opensmtpd) are installed & configured but NOT started.
          Test servers run on high ports for local integration tests.
          EOF

          cat <<'EOF' | tee "$BASE/policies/SECURITY.md" >/dev/null
          # Security (Test Only)
          - Ephemeral CI environment. Do not store real credentials.
          - Virtual users are randomly generated per run.
          - Outputs: users.csv, users.htpasswd (bcrypt), users.json per service.
          EOF
          chmod 644 "$BASE/README.txt" "$BASE/policies/SECURITY.md"

      # ---------------------- Postfix ----------------------
      - name: Install & configure Postfix (no auto-start) + upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          echo "postfix postfix/main_mailer_type select No configuration" | sudo debconf-set-selections
          sudo apt-get install -y --no-install-recommends postfix
          sudo apt-get install -y --only-upgrade postfix || true

          sudo cp -n /etc/postfix/main.cf /etc/postfix/main.cf.bak || true
          cat <<'EOF' | sudo tee /etc/postfix/main.cf >/dev/null
          # Generated for CI
          myhostname = localhost
          myorigin = localhost
          inet_interfaces = loopback-only
          inet_protocols = all
          mydestination =
          local_transport = error:local delivery disabled
          relayhost =
          smtp_tls_security_level = may
          smtpd_banner = $myhostname ESMTP
          EOF
          sudo service postfix stop || true

          cat <<EOF | tee "$BASE/postfix/env/.env" >/dev/null
          DOMAIN=${DOMAIN}
          USER_COUNT=${USER_COUNT}
          EOF
          chmod 640 "$BASE/postfix/env/.env"

      - name: Postfix mass policy/ACL files (echo) and perms
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq -w 001 020); do
            cat <<EOF | tee "$BASE/postfix/policies/policy_$i.conf" >/dev/null
            # Postfix policy $i
            permit_mynetworks
            reject_unauth_destination
            EOF
            echo "rcpt_access_$i OK" | tee "$BASE/postfix/acl/rcpt_access_$i.list" >/dev/null
          done
          chmod 644 "$BASE/postfix/policies/"*.conf "$BASE/postfix/acl/"*.list

      # ---------------------- Exim4 ----------------------
      - name: Install & configure Exim4 (no auto-start) + upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get install -y --no-install-recommends exim4 exim4-daemon-light
          sudo apt-get install -y --only-upgrade exim4 exim4-daemon-light || true

          sudo cp -n /etc/exim4/update-exim4.conf.conf /etc/exim4/update-exim4.conf.conf.bak || true
          cat <<'EOF' | sudo tee /etc/exim4/update-exim4.conf.conf >/dev/null
          dc_eximconfig_configtype='internet'
          dc_local_interfaces='127.0.0.1.25'
          dc_other_hostnames=''
          dc_minimaldns='false'
          dc_relay_domains=''
          dc_smarthost=''
          CFILEMODE='644'
          dc_use_split_config='true'
          EOF
          sudo update-exim4.conf
          sudo service exim4 stop || true

      - name: Exim4 mass policy/ACL files (echo) and perms
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq -w 001 020); do
            cat <<EOF | tee "$BASE/exim4/policies/acl_$i.conf" >/dev/null
            # Exim4 ACL $i
            accept hosts = :
            deny message = relay not permitted
            EOF
          done
          chmod 644 "$BASE/exim4/policies/"*.conf

      # ---------------------- OpenSMTPD ----------------------
      - name: Install & configure OpenSMTPD (no auto-start) + upgrade (best-effort)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends opensmtpd || true
          sudo apt-get install -y --only-upgrade opensmtpd || true
          # 로컬 전용 리슨 설정(시작은 하지 않음)
          sudo cp -n /etc/smtpd/smtpd.conf /etc/smtpd/smtpd.conf.bak || true
          cat <<'EOF' | sudo tee /etc/smtpd/smtpd.conf >/dev/null
          pki localhost cert "/etc/ssl/certs/ssl-cert-snakeoil.pem"
          pki localhost key  "/etc/ssl/private/ssl-cert-snakeoil.key"
          listen on 127.0.0.1 port 2526
          action "local" mbox
          match from any for domain "localhost" action "local"
          EOF

      - name: OpenSMTPD mass ACL/policy files (echo) and perms
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq -w 001 020); do
            cat <<EOF | tee "$BASE/opensmtpd/policies/rule_$i.conf" >/dev/null
            # OpenSMTPD rule $i
            match from any for domain "${DOMAIN}" action "local"
            EOF
          done
          chmod 644 "$BASE/opensmtpd/policies/"*.conf || true

      # ---------------------- Test servers ----------------------
      - name: MailHog install & run
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$BASE/mailhog/bin"
          wget -q https://github.com/mailhog/MailHog/releases/download/v1.0.1/MailHog_linux_amd64
          chmod +x MailHog_linux_amd64
          sudo ln -sf "$BASE/mailhog/bin/MailHog_linux_amd64" /usr/local/bin/mailhog
          nohup mailhog -smtp-bind-addr 127.0.0.1:1025 -ui-bind-addr 127.0.0.1:8025 \
            > "$BASE/mailhog/logs/mailhog.log" 2>&1 &

      - name: MailCatcher install & run
        shell: bash
        run: |
          set -Eeuo pipefail
          gem install --no-document mailcatcher
          nohup mailcatcher --smtp-ip 127.0.0.1 --smtp-port 1026 \
                            --http-ip 127.0.0.1 --http-port 8026 \
            > "$BASE/mailcatcher/logs/mailcatcher.log" 2>&1 &

      - name: smtp-sink run (Postfix tool)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$BASE/smtp-sink/spool"
          nohup /usr/sbin/smtp-sink -dv -u "$USER" 127.0.0.1:2525 \
                "$BASE/smtp-sink/spool/%Y%m%d%H%M%S.msg" \
            > "$BASE/smtp-sink/logs/smtp-sink.log" 2>&1 &

      - name: MailDev (Docker) pull & run (no containerd.io conflict)
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull maildev/maildev:latest
          # host:1027->container:1025, host:1081->container:1080
          docker rm -f maildev >/dev/null 2>&1 || true
          docker run -d --name maildev -p 127.0.0.1:1027:1025 -p 127.0.0.1:1081:1080 maildev/maildev:latest

      # ---------------------- Virtual users & passwords ----------------------
      - name: Generate virtual users/passwords per service (CSV/HTPASSWD/JSON)
        shell: bash
        run: |
          set -Eeuo pipefail
          gen_users() {
            local svc="$1"
            local dir="$BASE/$svc/users"
            mkdir -p "$dir"
            : > "$dir/users.csv"
            : > "$dir/users.json"
            : > "$dir/users.htpasswd"

            echo "email,password" >> "$dir/users.csv"
            echo "[" >> "$dir/users.json"
            for n in $(seq -w 001 "$USER_COUNT"); do
              user="user${n}"
              email="${user}@${DOMAIN}"
              pass="$(openssl rand -base64 18 | tr -d '\n')"

              # CSV
              echo "${email},${pass}" >> "$dir/users.csv"

              # JSON (append with comma except last)
              if [ "$n" -lt "$USER_COUNT" ]; then
                echo "  {\"email\":\"${email}\",\"password\":\"${pass}\"}," >> "$dir/users.json"
              else
                echo "  {\"email\":\"${email}\",\"password\":\"${pass}\"}" >> "$dir/users.json"
              fi

              # bcrypt htpasswd
              htpasswd -B -C 10 -b "$dir/users.htpasswd" "$email" "$pass" >/dev/null
            done
            echo "]" >> "$dir/users.json"

            # Permissions
            chmod 640 "$dir/users.htpasswd"
            chmod 640 "$dir/users.csv" "$dir/users.json"
          }

          for SVC in $SERVICES; do
            gen_users "$SVC"
          done

      # ---------------------- Massive echo-based files & permissions ----------------------
      - name: Create mass config/policy files per service with permissions
        shell: bash
        run: |
          set -Eeuo pipefail
          for SVC in $SERVICES; do
            # env
            cat <<EOF | tee "$BASE/$SVC/env/.env" >/dev/null
            DOMAIN=${DOMAIN}
            USER_COUNT=${USER_COUNT}
            SERVICE=${SVC}
            EOF

            # scripts
            cat <<'EOF' | tee "$BASE/$SVC/scripts/rotate-logs.sh" >/dev/null
            #!/usr/bin/env bash
            set -Eeuo pipefail
            LOG_DIR="$(dirname "$0")/../logs"
            find "$LOG_DIR" -type f -name "*.log" -size +5M -print -exec gzip {} \;
            EOF

            # policies (50개)
            for i in $(seq -w 001 050); do
              cat <<EOF | tee "$BASE/$SVC/policies/policy_$i.conf" >/dev/null
              # ${SVC} policy $i
              allow_local=true
              allow_domain="${DOMAIN}"
              EOF
            done

            # ACL (50개)
            for i in $(seq -w 001 050); do
              echo "acl_${i}: permit_localhost" | tee "$BASE/$SVC/acl/acl_${i}.list" >/dev/null
            done

            # perms
            chmod 640 "$BASE/$SVC/env/.env"
            chmod 755 "$BASE/$SVC/scripts/rotate-logs.sh"
            chmod 644 "$BASE/$SVC/policies/"*.conf "$BASE/$SVC/acl/"*.list
          done

      # ---------------------- Summary ----------------------
      - name: Summarize ports & locations
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "MailHog    SMTP:127.0.0.1:1025  Web: http://127.0.0.1:8025"
          echo "MailCatcher SMTP:127.0.0.1:1026  Web: http://127.0.0.1:8026"
          echo "smtp-sink  SMTP:127.0.0.1:2525  Spool: $BASE/smtp-sink/spool"
          echo "MailDev    SMTP:127.0.0.1:1027  Web: http://127.0.0.1:1081"
          echo "Users generated per service under: $BASE/<service>/users/{users.csv,users.htpasswd,users.json}"
