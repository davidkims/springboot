name: "🔐 MEGA Secure CI + AutoUP + EchoOps + Pages + Backups + Security (ULTRA)"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/1 * * * *"  # 매 1분

permissions:
  contents: write
  pull-requests: write
  id-token: write
  security-events: write
  pages: write

jobs:
  mega-secure-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DB_USER: root
      DB_PASS: rootpass123
      DB_NAME: sample_db
      SPARK_VERSION: "3.5.1"
      VAULT_VERSION: "1.15.2"

    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 📁 Echo 디렉토리/파일 선생성 (No missing file)
      shell: bash
      run: |
        set -Eeuo pipefail
        mkdir -p .github/echo_logs
        CREATE=.github/echo_logs/create_dirs.sh
        echo '#!/usr/bin/env bash' > "$CREATE"
        for d in \
          .github/{scripts,firewall,downloads} \
          .github/echo_{logs,scorecard,codeql,security,upgrade,autoup,pages,templates,backup,monitoring,services,db,permissions,containers,accounts} \
          site/{scorecard,security,upgrade,pr,backup,html,containers,logs,templates,downloads,db_backup_html,accounts}; do
          mkdir -p "$d"
          echo "echo '[ECHO] 디렉토리 생성: $d'" >> "$CREATE"
        done
        chmod +x "$CREATE" && bash "$CREATE"

        # 공통 에코 템플릿/권한 스크립트 생성
        cat > .github/echo_templates/README.txt <<'TXT'
        [ECHO] 이 디렉토리는 모든 자동 생성 스크립트/샘플 .env/.cfg/.json 템플릿을 보관합니다.
        TXT
        echo "chmod -R 755 .github || true" > .github/permissions/chmod_all.sh
        chmod +x .github/permissions/chmod_all.sh

    - name: 🔐 가상 계정·비밀번호 대량 생성 (에코/파일 출력)
      shell: bash
      run: |
        set -Eeuo pipefail
        # 서비스별 랜덤 비밀번호 생성 (재현 불필요: 매 실행 시 갱신)
        gen() { openssl rand -hex 12; }
        MYSQL_APP_USER="appuser"
        MYSQL_APP_PASS="$(gen)"
        POSTGRES_APP_USER="pguser"
        POSTGRES_APP_PASS="$(gen)"
        REDIS_PASS="$(gen)"
        VAULT_DEV_TOKEN="root-$(gen)"

        # 계정·토큰 목록을 CSV/ENV로 저장(카페·문서 공유용 아님: 데모 테스트 전용)
        {
          echo "service,username,password_or_token"
          echo "mysql,root,${DB_PASS}"
          echo "mysql,${MYSQL_APP_USER},${MYSQL_APP_PASS}"
          echo "postgres,postgres,${DB_PASS}"
          echo "postgres,${POSTGRES_APP_USER},${POSTGRES_APP_PASS}"
          echo "redis,default,${REDIS_PASS}"
          echo "vault,root_token,${VAULT_DEV_TOKEN}"
        } | tee site/accounts/accounts.csv > .github/echo_accounts/accounts.csv

        # 서비스별 .env 템플릿 에코 생성
        cat > site/templates/mysql.env <<EOF
        MYSQL_ROOT_PASSWORD=${DB_PASS}
        MYSQL_DATABASE=${DB_NAME}
        MYSQL_APP_USER=${MYSQL_APP_USER}
        MYSQL_APP_PASS=${MYSQL_APP_PASS}
        EOF

        cat > site/templates/postgres.env <<EOF
        POSTGRES_PASSWORD=${DB_PASS}
        POSTGRES_DB=${DB_NAME}
        POSTGRES_APP_USER=${POSTGRES_APP_USER}
        POSTGRES_APP_PASS=${POSTGRES_APP_PASS}
        EOF

        cat > site/templates/redis.env <<EOF
        REDIS_PASSWORD=${REDIS_PASS}
        EOF

        cat > site/templates/vault.env <<EOF
        VAULT_DEV_ROOT_TOKEN_ID=${VAULT_DEV_TOKEN}
        VAULT_ADDR=http://127.0.0.1:8200
        EOF

        # 가상 이메일 계정(테스트용) CSV — 각 서비스와 매핑
        {
          echo "email,service,username,password"
          echo "app@local.test,mysql,${MYSQL_APP_USER},${MYSQL_APP_PASS}"
          echo "app@local.test,postgres,${POSTGRES_APP_USER},${POSTGRES_APP_PASS}"
          echo "cache@local.test,redis,default,${REDIS_PASS}"
        } | tee site/accounts/virtual_emails.csv

        # 에코 로그
        echo "[ECHO] 계정/비밀번호/토큰 템플릿 생성 완료" | tee -a .github/echo_logs/accounts_init.log

    - name: 🔧 기본 패키지 & Python 보안툴
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update -y
        sudo apt-get install -y jq curl unzip tar git mysql-client postgresql-client default-jdk scala
        python3 -m pip install --upgrade pip
        pip install --no-cache-dir bandit pip-audit

    - name: 🐳 Docker 설치 (containerd 충돌 우회)
      shell: bash
      run: |
        set -Eeuo pipefail
        if ! command -v docker >/dev/null 2>&1; then
          curl -fsSL https://get.docker.com | sh
        fi
        sudo usermod -aG docker "$USER" || true
        docker --version | tee .github/echo_logs/docker_version.txt

    - name: 🛡️ Trivy & Scorecard 설치(안전)
      shell: bash
      run: |
        set -Eeuo pipefail
        # Trivy
        curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b /usr/local/bin
        trivy --version | tee .github/echo_logs/trivy_version.txt

        # Scorecard
        VER="4.10.3"
        curl -sLO "https://github.com/ossf/scorecard/releases/download/v${VER}/scorecard_${VER}_linux_amd64.tar.gz"
        tar -xzf "scorecard_${VER}_linux_amd64.tar.gz"
        BIN="$(find . -type f -name scorecard | head -n1 || true)"
        if [ -z "$BIN" ]; then echo "::error ::Scorecard binary not found"; exit 1; fi
        sudo mv "$BIN" /usr/local/bin/scorecard && chmod +x /usr/local/bin/scorecard
        scorecard --version | tee .github/echo_logs/scorecard_version.txt

    - name: 🧪 Apache Spark 설치 (에코 로그)
      shell: bash
      run: |
        set -Eeuo pipefail
        curl -sSLO "https://downloads.apache.org/spark/spark-${SPARK_VERSION}/spark-${SPARK_VERSION}-bin-hadoop3.tgz"
        tar xzf "spark-${SPARK_VERSION}-bin-hadoop3.tgz"
        sudo mv "spark-${SPARK_VERSION}-bin-hadoop3" /opt/spark
        echo "PATH=/opt/spark/bin:$PATH" >> "$GITHUB_ENV"
        echo "[ECHO] Spark ${SPARK_VERSION} 설치 완료" | tee -a .github/echo_logs/spark_install.log

    - name: 🐳 컨테이너 Pull/Run(버전 고정) + HealthCheck + Auto-Restart + 에코계정 적용
      shell: bash
      run: |
        set -Eeuo pipefail
        source site/templates/mysql.env
        source site/templates/postgres.env
        source site/templates/redis.env
        source site/templates/vault.env

        declare -A IMGS=(
          [mysql]="mysql:8.0.37"
          [postgres]="postgres:16.3"
          [redis]="redis:7.2.5"
          [kafka]="bitnami/kafka:3.7.0"
          [vault]="vault:${VAULT_VERSION}"
          [spark-svc]="bitnami/spark:3.5.1"
          [camunda]="camunda/camunda-bpm-platform:run-7.21.0"
        )
        for n in "${!IMGS[@]}"; do
          img="${IMGS[$n]}"
          docker rm -f "${n}_ci" >/dev/null 2>&1 || true
          docker pull "$img" || true
          echo "[IMAGE] pulled: $img" >> .github/echo_logs/images_pulled.log
        done

        # MySQL
        docker run -d --name mysql_ci \
          -e MYSQL_ROOT_PASSWORD="${MYSQL_ROOT_PASSWORD}" \
          -p 3306:3306 \
          "${IMGS[mysql]}"

        # PostgreSQL
        docker run -d --name postgres_ci \
          -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
          -p 5432:5432 \
          "${IMGS[postgres]}"

        # Redis (비번 적용 위해 전용 커맨드)
        docker run -d --name redis_ci -p 6379:6379 "${IMGS[redis]}" \
          redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"

        # Kafka (기본 실행 — 상세 보안설정은 별도 확장)
        docker run -d --name kafka_ci -p 9092:9092 "${IMGS[kafka]}"

        # Vault (dev 모드, 루트 토큰 고정)
        docker run -d --name vault_ci -p 8200:8200 \
          -e VAULT_DEV_ROOT_TOKEN_ID="${VAULT_DEV_ROOT_TOKEN_ID}" \
          -e VAULT_ADDR="http://0.0.0.0:8200" \
          "${IMGS[vault]}" server -dev -dev-root-token-id="${VAULT_DEV_ROOT_TOKEN_ID}"

        # Spark / Camunda
        docker run -d --name spark_ci -p 7077:7077 "${IMGS[spark-svc]}"
        docker run -d --name camunda_ci -p 8081:8080 "${IMGS[camunda]}"

        # HealthCheck + Restart (에코)
        echo "#!/usr/bin/env bash" > .github/echo_logs/containers_health.sh
        for c in mysql_ci postgres_ci redis_ci kafka_ci vault_ci spark_ci camunda_ci; do
          st="$(docker inspect --format='{{.State.Status}}' "$c" 2>/dev/null || echo unknown)"
          if [ "$st" != "running" ]; then
            echo "[HEALTH] $c: $st → restart" >> .github/echo_logs/containers_health.sh
            docker restart "$c" || true
          else
            echo "[HEALTH] $c: OK" >> .github/echo_logs/containers_health.sh
          fi
        done
        bash .github/echo_logs/containers_health.sh

        # DB init 스크립트(에코 생성 후 실행)
        cat > .github/echo_services/mysql_init.sh <<'SH'
        #!/usr/bin/env bash
        set -Eeuo pipefail
        MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysql -h 127.0.0.1 -P 3306 -uroot <<SQL
        CREATE DATABASE IF NOT EXISTS ${MYSQL_DATABASE};
        CREATE USER IF NOT EXISTS '${MYSQL_APP_USER}'@'%' IDENTIFIED BY '${MYSQL_APP_PASS}';
        GRANT ALL PRIVILEGES ON ${MYSQL_DATABASE}.* TO '${MYSQL_APP_USER}'@'%';
        FLUSH PRIVILEGES;
        SQL
        echo "[ECHO] MySQL DB/USER 초기화 완료"
        SH
        chmod +x .github/echo_services/mysql_init.sh

        cat > .github/echo_services/postgres_init.sh <<'SH'
        #!/usr/bin/env bash
        set -Eeuo pipefail
        export PGPASSWORD="${POSTGRES_PASSWORD}"
        psql -h 127.0.0.1 -p 5432 -U postgres <<SQL
        DO
        $$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_database WHERE datname = '${POSTGRES_DB}') THEN
            PERFORM dblink_exec('dbname='||current_database(), 'CREATE DATABASE ${POSTGRES_DB}');
          END IF;
        END
        $$;
        SQL
        # ROLE/권한
        psql -h 127.0.0.1 -p 5432 -U postgres <<SQL
        DO
        $$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${POSTGRES_APP_USER}') THEN
            CREATE ROLE ${POSTGRES_APP_USER} LOGIN PASSWORD '${POSTGRES_APP_PASS}';
          END IF;
          GRANT ALL PRIVILEGES ON DATABASE ${POSTGRES_DB} TO ${POSTGRES_APP_USER};
        END
        $$;
        SQL
        echo "[ECHO] Postgres DB/USER 초기화 완료"
        SH
        chmod +x .github/echo_services/postgres_init.sh

        # 준비 대기 후 실행
        sleep 12
        source site/templates/mysql.env && bash .github/echo_services/mysql_init.sh || true
        source site/templates/postgres.env && bash .github/echo_services/postgres_init.sh || true

        # Vault에 예시 시크릿 저장(에코)
        {
          echo "curl -s -H \"X-Vault-Token: ${VAULT_DEV_ROOT_TOKEN_ID}\" --request POST \
            --data '{\"data\": {\"db_user\": \"'${MYSQL_APP_USER}'\", \"db_pass\": \"'${MYSQL_APP_PASS}'\"}}' \
            http://127.0.0.1:8200/v1/secret/data/app"
        } > .github/echo_services/vault_seed.sh
        bash -c "$(cat .github/echo_services/vault_seed.sh)" || true
        echo "[ECHO] Vault KV seed 완료" | tee -a .github/echo_logs/vault_seed.log

    - name: 🗄 DB 백업 + HTML 변환 (에코 포함)
      shell: bash
      run: |
        set -Eeuo pipefail
        source site/templates/mysql.env
        source site/templates/postgres.env
        sleep 8
        # 존재 보장용 테이블 하나 생성(양쪽 DB)
        MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysql -h 127.0.0.1 -P 3306 -uroot -e "CREATE TABLE IF NOT EXISTS ${MYSQL_DATABASE}.health(id INT PRIMARY KEY, msg VARCHAR(64)); INSERT IGNORE INTO ${MYSQL_DATABASE}.health VALUES (1,'ok');" || true
        export PGPASSWORD="${POSTGRES_PASSWORD}"
        psql -h 127.0.0.1 -p 5432 -U postgres -d "${POSTGRES_DB}" -c "CREATE TABLE IF NOT EXISTS health(id INT PRIMARY KEY, msg TEXT); INSERT INTO health VALUES (1,'ok') ON CONFLICT (id) DO NOTHING;" || true

        mysqldump -h 127.0.0.1 -P 3306 -uroot -p"${MYSQL_ROOT_PASSWORD}" "${MYSQL_DATABASE}" > site/backup/mysqldump.sql || echo "[WARN] MySQL 백업 실패" | tee -a .github/echo_logs/backup.log
        pg_dump -h 127.0.0.1 -p 5432 -U postgres -d "${POSTGRES_DB}" > site/backup/pgdump.sql || echo "[WARN] PostgreSQL 백업 실패" | tee -a .github/echo_logs/backup.log

        for f in site/backup/*; do
          [ -f "$f" ] || continue
          b="$(basename "$f")"
          { echo "<html><body><h3>$b</h3><pre>"; sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' "$f"; echo "</pre></body></html>"; } > "site/db_backup_html/${b}.html"
        done
        echo "[ECHO] 백업 및 HTML 변환 완료" | tee -a .github/echo_logs/backup.log

    - name: 🔎 보안 스캔 (Scorecard / CodeQL / Bandit / pip-audit / Trivy)
      shell: bash
      run: |
        set -Eeuo pipefail
        scorecard --repo="https://github.com/${{ github.repository }}" --format sarif --no-upload > site/security/scorecard.sarif || true
        scorecard --repo="https://github.com/${{ github.repository }}" --format json  --no-upload > site/security/scorecard.json  || true
        pip-audit -f json -o site/security/pip-audit.json || true
        bandit -r . -f json -o site/security/bandit.json || true
        trivy fs . --format json --output site/security/trivy.json || true

    - name: 🧰 CodeQL Init
      uses: github/codeql-action/init@v3
      with:
        languages: javascript

    - name: 📊 CodeQL Analyze
      uses: github/codeql-action/analyze@v3
      with:
        output: site/security/codeql-results.sarif
        category: codeql-security-scan

    - name: ⬆️ 업그레이드 사전 목록 수집 (에코)
      shell: bash
      run: |
        set -Eeuo pipefail
        mkdir -p site/upgrade .github/echo_upgrade
        apt list --upgradable 2>/dev/null | tee site/upgrade/upgradable.before.txt
        pip list --outdated --format=columns > site/upgrade/pip-upgradable.before.txt || true
        docker images --format '{{.Repository}}:{{.Tag}}' > site/upgrade/docker-images.before.txt || true

    - name: ⬆️ 시스템/파이썬/Docker 풀 업그레이드
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update -y && sudo apt-get upgrade -y && sudo apt-get autoremove -y && sudo apt-get clean
        pip install --upgrade pip
        pip list --outdated --format=freeze | cut -d= -f1 | xargs -n1 -r pip install -U || true
        while read -r img; do [ -n "$img" ] && docker pull "$img" || true; done < site/upgrade/docker-images.before.txt
        echo "[ECHO] 전체 업그레이드 완료" | tee -a .github/echo_upgrade/upgrade.log

    - name: ⬆️ 업그레이드 사후 목록 & HTML 리포트
      shell: bash
      run: |
        set -Eeuo pipefail
        apt list --upgradable 2>/dev/null | tee site/upgrade/upgradable.after.txt
        pip list --outdated --format=columns > site/upgrade/pip-upgradable.after.txt || true
        docker images --format '{{.Repository}}:{{.Tag}}' > site/upgrade/docker-images.after.txt || true
        {
          echo "<html><body><h2>Upgrade Diff</h2><h3>APT</h3><pre>"
          diff -u site/upgrade/upgradable.before.txt site/upgrade/upgradable.after.txt || true
          echo "</pre><h3>PIP</h3><pre>"
          diff -u site/upgrade/pip-upgradable.before.txt site/upgrade/pip-upgradable.after.txt || true
          echo "</pre><h3>Docker Images</h3><pre>"
          diff -u site/upgrade/docker-images.before.txt site/upgrade/docker-images.after.txt || true
          echo "</pre></body></html>"
        } > site/upgrade/report.html

    - name: 🔁 업그레이드 자동 PR (변경 있을 때만)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        set -Eeuo pipefail
        if [ -s site/upgrade/upgradable.after.txt ] || [ -s site/upgrade/pip-upgradable.after.txt ]; then
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git checkout -b "auto/upgrade-$(date -u +%Y%m%d%H%M%S)" || git checkout -b auto/upgrade
          git add site/upgrade/ .github/echo_upgrade/ .github/echo_logs/ site/accounts/ || true
          git commit -m "chore: auto upgrade artifacts (Pages + Echo logs)" || true
          git push -u origin HEAD || true
          gh pr create --title "⬆️ Auto Upgrade" --body "자동 업그레이드 산출물 커밋/페이지 반영" || true
        fi

    - name: 📦 아티팩트 업로드(다운로드 가능)
      uses: actions/upload-artifact@v4
      with:
        name: mega-artifacts
        path: |
          site/**
          .github/echo_logs/**
          .github/echo_upgrade/**
          .github/echo_services/**
          .github/echo_accounts/**
          .github/permissions/**

    - name: 🌐 Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/

    - name: 🚀 Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
