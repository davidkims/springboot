name: 🛡️ CodeQL 다중 언어/빌드/로그/복제/모든 상황 echo 파일 생성 워크플로

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  codeql-multi:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Install CodeQL CLI
        run: |
          echo "echo '[🛠️] Installing CodeQL CLI...'" > .echo.codeql_cli.sh
          echo '[🛠️] Installing CodeQL CLI...'
          wget -qO- https://github.com/github/codeql-cli-binaries/releases/latest/download/codeql-linux64.zip > codeql.zip
          unzip -qo codeql.zip -d $HOME/codeql
          chmod +x $HOME/codeql/codeql/codeql
          echo 'export PATH="$HOME/codeql/codeql:$PATH"' >> $GITHUB_ENV
          $HOME/codeql/codeql/codeql --version

      - name: 🏗️ Install & Log Build Tools
        run: |
          echo "echo '[🏗️] Build tools 설치 및 로그 남기기...'" > .echo.build_tools.sh
          echo '[🏗️] Build tools 설치 및 로그 남기기...'
          sudo mkdir -p .github/codeql-out || true
          sudo chown $USER:$USER .github/codeql-out
          if [ -f pom.xml ]; then
            echo "echo '[🟢] Detected pom.xml, installing Maven...'" >> .echo.build_tools.sh
            echo '[🟢] Detected pom.xml, installing Maven...'
            sudo apt-get update && sudo apt-get install -y maven | tee .github/codeql-out/maven_install.log
          fi
          if [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "echo '[🟢] Detected Gradle build, installing Gradle...'" >> .echo.build_tools.sh
            echo '[🟢] Detected Gradle build, installing Gradle...'
            sudo apt-get update && sudo apt-get install -y gradle | tee .github/codeql-out/gradle_install.log
          fi
          if ls **/*.py 2>/dev/null | grep -q .; then
            echo "echo '[🟢] Detected Python, installing pip...'" >> .echo.build_tools.sh
            echo '[🟢] Detected Python, installing pip...'
            sudo apt-get update && sudo apt-get install -y python3-pip python3-venv | tee .github/codeql-out/python_install.log
          fi
          if [ -f package.json ]; then
            echo "echo '[🟢] Detected package.json, installing Node.js & npm...'" >> .echo.build_tools.sh
            echo '[🟢] Detected package.json, installing Node.js & npm...'
            sudo apt-get update && sudo apt-get install -y nodejs npm | tee .github/codeql-out/nodejs_install.log
          fi
          if [ -f main.go ]; then
            echo "echo '[🟢] Detected main.go, installing Go...'" >> .echo.build_tools.sh
            echo '[🟢] Detected main.go, installing Go...'
            sudo apt-get update && sudo apt-get install -y golang | tee .github/codeql-out/go_install.log
          fi

      - name: 🔨 Manual Build & 로그 저장 (echo 코드+실행 결과)
        run: |
          echo "echo '[🔨] Manual build 시도 및 echo+로그 남기기...'" > .echo.manual_build.sh
          echo '[🔨] Manual build 시도 및 echo+로그 남기기...'
          if [ -f pom.xml ]; then
            echo "echo '[🔨] Running mvn package -DskipTests...'" >> .echo.manual_build.sh
            echo '[🔨] Running mvn package -DskipTests...'
            mvn package -DskipTests > .github/codeql-out/maven_build.log 2>&1 || (echo "echo '[❌] Maven 빌드 실패'" >> .echo.manual_build.sh; echo '[❌] Maven 빌드 실패' > .github/codeql-out/build_failed_maven.txt)
          fi
          if [ -f build.gradle ]; then
            echo "echo '[🔨] Running gradle build...'" >> .echo.manual_build.sh
            echo '[🔨] Running gradle build...'
            gradle build > .github/codeql-out/gradle_build.log 2>&1 || (echo "echo '[❌] Gradle 빌드 실패'" >> .echo.manual_build.sh; echo '[❌] Gradle 빌드 실패' > .github/codeql-out/build_failed_gradle.txt)
          fi
          if [ -f package.json ]; then
            echo "echo '[🔨] Running npm install...'" >> .echo.manual_build.sh
            echo '[🔨] Running npm install...'
            npm install > .github/codeql-out/npm_install.log 2>&1 || (echo "echo '[❌] NPM 빌드 실패'" >> .echo.manual_build.sh; echo '[❌] NPM 빌드 실패' > .github/codeql-out/build_failed_npm.txt)
          fi
          if [ -f requirements.txt ]; then
            echo "echo '[🔨] Running pip install -r requirements.txt...'" >> .echo.manual_build.sh
            echo '[🔨] Running pip install -r requirements.txt...'
            pip3 install -r requirements.txt > .github/codeql-out/pip_install.log 2>&1 || (echo "echo '[❌] Python 빌드 실패'" >> .echo.manual_build.sh; echo '[❌] Python 빌드 실패' > .github/codeql-out/build_failed_python.txt)
          fi
          if [ -f go.mod ]; then
            echo "echo '[🔨] Running go mod download...'" >> .echo.manual_build.sh
            echo '[🔨] Running go mod download...'
            go mod download > .github/codeql-out/go_mod.log 2>&1 || (echo "echo '[❌] Go 빌드 실패'" >> .echo.manual_build.sh; echo '[❌] Go 빌드 실패' > .github/codeql-out/build_failed_go.txt)
          fi

      - name: 🔍 CodeQL DB 생성/분석 및 echo/파일/복제/실패 로깅
        run: |
          echo "echo '[🔍] Detecting supported languages in project...'" > .echo.detect_langs.sh
          echo '[🔍] Detecting supported languages in project...'

          mkdir -p .github/codeql-out
          chmod -R 777 .github/codeql-out

          detect_langs() {
            langs=""
            [ -d src ] && grep -r -q "def " src/ 2>/dev/null && langs="$langs,python"
            [ -d src ] && grep -r -q "class " src/ 2>/dev/null && langs="$langs,java"
            [ -d src ] && grep -r -q "function " src/ 2>/dev/null && langs="$langs,javascript"
            [ -d src ] && grep -r -q "#include" src/ 2>/dev/null && langs="$langs,cpp"
            [ -f setup.py ] && langs="$langs,python"
            [ -f pom.xml ] && langs="$langs,java"
            [ -f package.json ] && langs="$langs,javascript"
            [ -f main.go ] && langs="$langs,go"
            [ -f Cargo.toml ] && langs="$langs,cpp"
            [ -f Gemfile ] && langs="$langs,ruby"
            langs=$(echo $langs | tr ',' '\n' | grep -v '^$' | sort -u | tr '\n' ',' | sed 's/,$//')
            [ -z "$langs" ] && langs="python,java,javascript"
            echo $langs
          }

          langs=$(detect_langs)
          echo "echo '[🔍] Detected languages: $langs'" >> .echo.detect_langs.sh
          echo "[🔍] Detected languages: $langs"

          DB_DIR="db-ql"
          SARIF_FILE="codeql-report.sarif"
          OUT_DIR=".github/codeql-out"
          mkdir -p $OUT_DIR

          if [[ "$langs" == *,* ]]; then
            echo "echo '[⚡] Creating DB for multiple languages ($langs) with --db-cluster ...'" >> .echo.detect_langs.sh
            echo "[⚡] Creating DB for multiple languages ($langs) with --db-cluster ..."
            $HOME/codeql/codeql/codeql database create $DB_DIR --language=$langs --db-cluster --source-root=. > $OUT_DIR/db_create.log 2>&1 \
              || (echo "echo '[❌] CodeQL DB 생성 실패, autobuild_failed 파일 생성'" >> .echo.detect_langs.sh; echo '[❌] CodeQL DB 생성 실패' > $OUT_DIR/autobuild_failed.txt)
          else
            echo "echo '[⚡] Creating DB for $langs...'" >> .echo.detect_langs.sh
            echo "[⚡] Creating DB for $langs..."
            $HOME/codeql/codeql/codeql database create $DB_DIR --language=$langs --source-root=. > $OUT_DIR/db_create.log 2>&1 \
              || (echo "echo '[❌] CodeQL DB 생성 실패, autobuild_failed 파일 생성'" >> .echo.detect_langs.sh; echo '[❌] CodeQL DB 생성 실패' > $OUT_DIR/autobuild_failed.txt)
          fi

          echo "echo '[⚡] CodeQL database created: $DB_DIR'" >> .echo.detect_langs.sh
          echo "[⚡] CodeQL database created: $DB_DIR"

          $HOME/codeql/codeql/codeql database analyze $DB_DIR \
            --format=sarifv2.1.0 \
            --output=$SARIF_FILE \
            --threads=2 --ram=4096 --rerun --trace-process --trace-process-level=3 > $OUT_DIR/analyze.log 2>&1 \
            || (echo "echo '[⚠️] CodeQL analyze failed!'" >> .echo.detect_langs.sh; echo '[⚠️] CodeQL analyze failed!' > $OUT_DIR/analyze_failed.txt)

          # 결과 디렉토리 복제 (분석 결과, DB 등)
          echo "echo '[📂] 복제: 분석 결과 및 데이터 디렉토리 복사 중...'" >> .echo.detect_langs.sh
          echo "[📂] 복제: 분석 결과 및 데이터 디렉토리 복사 중..."
          cp -rf $DB_DIR $OUT_DIR/ || (echo "echo '[⚠️] DB 디렉토리 복사 실패'" >> .echo.detect_langs.sh; echo '[⚠️] DB 디렉토리 복사 실패' > $OUT_DIR/db_copy_failed.txt)
          [ -f $SARIF_FILE ] && cp $SARIF_FILE $OUT_DIR/ || (echo "echo '[⚠️] SARIF 파일 복사 실패'" >> .echo.detect_langs.sh; echo '[⚠️] SARIF 파일 복사 실패' > $OUT_DIR/sarif_copy_failed.txt)
          ls -lh $OUT_DIR || (echo "echo '[⚠️] 결과 디렉토리 확인 실패'" >> .echo.detect_langs.sh; echo '[⚠️] 결과 디렉토리 확인 실패' > $OUT_DIR/list_failed.txt)

          echo "echo '[✅] CodeQL SARIF: $OUT_DIR/$SARIF_FILE'" >> .echo.detect_langs.sh
          echo "[✅] CodeQL SARIF: $OUT_DIR/$SARIF_FILE"

      - name: ⬆️ Upload CodeQL 결과/로그/echo 파일 아티팩트
        uses: actions/upload-artifact@v4
        with:
          name: codeql-full-outdir
          path: |
            .github/codeql-out/
            .echo.*.sh
