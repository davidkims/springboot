name: 🚀 Init Slot Directory with Safe Push, Tags, Logs, PR

on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: slot-dir-init-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  setup-slot:
    runs-on: ubuntu-latest
    outputs:
      slot_name: ${{ steps.save-slot.outputs.slot }}
      tag_name: ${{ steps.save-slot.outputs.tag }}

    steps:
      - name: 📆 Checkout repository
        uses: actions/checkout@v4

      - name: 🔁 Rotate and Generate Unique Slot & Tag
        id: save-slot
        run: |
          mkdir -p disk
          git fetch --tags

          TAG_PREFIX="slot"
          DATE_SUFFIX=$(date -u +"%Y%m%dT%H%M%SZ")
          i=1
          while true; do
            SLOT_BASE="${TAG_PREFIX}-$(printf '%03d' $i)"
            TAG_NAME="${SLOT_BASE}-${DATE_SUFFIX}"
            if [ ! -d "disk/$SLOT_BASE" ] && ! git tag | grep -q "^$TAG_NAME$"; then
              mkdir -p "disk/$SLOT_BASE"
              echo "slot=$SLOT_BASE" >> $GITHUB_OUTPUT
              echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
              break
            fi
            i=$((i+1))
          done

      - name: 🛠️ Generate files and copy to slot
        run: |
          SLOT=${{ steps.save-slot.outputs.slot }}
          mkdir -p .github/{workflows,logs}
          mkdir -p data/transactions
          mkdir -p docker/mysql
          mkdir -p site output

          echo "workflow $(date)" > .github/workflows/example.yml
          echo "log start" > .github/logs/start.log
          echo "id,amount" > data/transactions/record.csv
          echo "db log" > docker/mysql/info.txt
          echo "index" > site/index.html
          echo "output result" > output/result.txt

          mkdir -p disk/$SLOT/{.github,data,docker,output,site,logs,workflows}
          cp -r .github disk/$SLOT/
          cp -r data disk/$SLOT/
          cp -r docker disk/$SLOT/
          cp -r output disk/$SLOT/
          cp -r site disk/$SLOT/
          cp .github/workflows/*.yml disk/$SLOT/workflows/ || true

      - name: 📜 Log execution
        run: |
          SLOT=${{ steps.save-slot.outputs.slot }}
          LOGFILE="disk/$SLOT/logs/slot.log"
          echo "Slot: $SLOT" >> "$LOGFILE"
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$LOGFILE"

      - name: 🌐 Create Git Tag if not exists
        run: |
          TAG=${{ steps.save-slot.outputs.tag }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "bot@example.com"
          git fetch --tags
          if ! git tag | grep -q "^$TAG$"; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: 🔗 Update symlink for slot-latest
        run: |
          SLOT=${{ steps.save-slot.outputs.slot }}
          ln -sfn "$SLOT" disk/slot-latest

      - name: 📂 Commit and safe push to branch
        run: |
          SLOT=${{ steps.save-slot.outputs.slot }}
          BRANCH="slot-update-${SLOT}"
          TMP_DIR="/tmp/slot-backup"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "bot@example.com"
          git fetch origin

          cp -r disk/$SLOT "$TMP_DIR"

          if git ls-remote --heads origin "$BRANCH" | grep "$BRANCH"; then
            echo "[INFO] Branch exists. Cleaning and rebasing..."
            git reset --hard
            git clean -fd
            git checkout "$BRANCH"
            git pull origin "$BRANCH" --rebase
          else
            git checkout -b "$BRANCH"
          fi

          cp -r "$TMP_DIR"/* disk/$SLOT/
          ln -sfn "$SLOT" disk/slot-latest

          git add disk/$SLOT disk/slot-latest
          git commit -m "📆 Add slot: $SLOT" || echo "No changes"
          git push origin "$BRANCH"

  create-pr:
    needs: setup-slot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔄 Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "📆 Slot update: ${{ needs.setup-slot.outputs.slot_name }}"
          title: "📆 Slot update for ${{ needs.setup-slot.outputs.slot_name }}"
          body: |
            This PR includes:
            - Slot: `${{ needs.setup-slot.outputs.slot_name }}`
            - Tag: `${{ needs.setup-slot.outputs.tag_name }}`
            - Auto-generated by GitHub Actions
          branch: slot-update-${{ needs.setup-slot.outputs.slot_name }}
          delete-branch: true
