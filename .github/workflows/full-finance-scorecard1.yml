name: 🚀 Full Finance & Scorecard Setup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # 매 시간마다 실행

permissions:
  contents: write

jobs:
  full-setup:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Docker & CLI 설치
        run: |
          echo "[docker] Docker 설치 중..."
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo systemctl start docker
          docker --version
          echo "[docker] Docker 설치 완료"
          echo "[cli] CLI 도구 설치 중..."
          sudo apt-get update
          sudo apt-get install -y jq curl unzip bc
          echo "[cli] jq, curl, unzip, bc 설치 완료"

      - name: 🗂️ 필수 디렉토리 생성
        run: |
          echo "[mkdir] 디렉토리 생성 중..."
          mkdir -p .github/finance/ledgers
          mkdir -p .github/finance/files
          mkdir -p .github/scorecard/ledgers
          mkdir -p .github/scorecard/files
          echo "[mkdir] 디렉토리 생성 완료"

      - name: 🧾 금융 실거래 원장 대량 생성 (가상 카드번호 포함)
        run: |
          echo "[ledger] 금융 원장 10개 생성 시작..."
          for i in $(seq 1 10); do
            FILE=".github/finance/ledgers/ledger_$i.csv"
            echo "name,date,amount,type,card_number" > $FILE
            for j in $(seq 1 50); do
              NAME="Customer${j}"
              DATE=$(date -d "$j days ago" +%F)
              AMOUNT=$(echo "scale=2; $((RANDOM % 9000 + 1000))" | bc)
              TYPE=$(if [ $((RANDOM % 2)) -eq 0 ]; then echo "신용"; else echo "체크"; fi)
              if [ "$TYPE" = "신용" ]; then
                BIN="4111"
                RANDOM_NUM=$(printf "%012d" $((RANDOM % 1000000000000)))
                CARD_NUMBER="${BIN}${RANDOM_NUM}"
              else
                CARD_NUMBER="-"
              fi
              echo "$NAME,$DATE,$AMOUNT,$TYPE,$CARD_NUMBER" >> $FILE
            done
            echo "[ledger] ledger_$i.csv 생성 완료"
          done
          echo "[ledger] 모든 금융 원장 생성 완료"

      - name: 💳 생성된 거래 원장 기반 거래 실행 시뮬레이션
        run: |
          echo "[simulate] 원장 기반 거래 실행 시작..."
          for file in .github/finance/ledgers/ledger_*.csv; do
            echo "[simulate] 파일 처리 중: $file"
            tail -n +2 "$file" | while IFS=',' read -r name date amount type card_number; do
              echo "🟢 거래 실행 중: 고객=$name | 금액=₩$amount | 카드=$type | 번호=${card_number:0:4}****" 
              if [[ "$type" == "신용" && "$card_number" != "-" ]]; then
                echo "✅ [신용 승인] $name의 ₩$amount 거래 승인 완료"
              else
                echo "✅ [체크 이체] $name의 ₩$amount 이체 완료"
              fi
              sleep 0.1
            done
          done
          echo "[simulate] 모든 거래 실행 완료"

      - name: 📄 금융 보고서 파일 생성
        run: |
          echo "[file] 금융 보고서 파일 생성 시작..."
          for i in $(seq 1 10); do
            echo "이 보고서는 금융 거래 내역 요약본입니다. 파일 번호: $i" > .github/finance/files/report_$i.txt
            echo "[file] report_$i.txt 생성 완료"
          done
          echo "[file] 모든 금융 보고서 생성 완료"

      - name: ✅ OSSF Scorecard CLI 설치
        run: |
          echo "[scorecard] Scorecard CLI 설치 시작..."
          curl -sLO https://github.com/ossf/scorecard/releases/latest/download/scorecard-linux-amd64
          chmod +x scorecard-linux-amd64
          sudo mv scorecard-linux-amd64 /usr/local/bin/scorecard
          echo "[scorecard] 설치 완료"
          scorecard --version || echo "[scorecard] 버전 확인 실패 - 무시"

      - name: 🧾 Scorecard 원장 대량 생성
        run: |
          echo "[scorecard-ledger] Scorecard 원장 10개 생성 시작..."
          for i in $(seq 1 10); do
            FILE=".github/scorecard/ledgers/scorecard_$i.csv"
            echo "item,score,comment" > $FILE
            for j in $(seq 1 20); do
              ITEM="SecurityCheck${j}"
              SCORE=$((RANDOM % 100))
              COMMENT=$(if [ $((RANDOM % 2)) -eq 0 ]; then echo "양호"; else echo "개선필요"; fi)
              echo "$ITEM,$SCORE,$COMMENT" >> $FILE
            done
            echo "[scorecard-ledger] scorecard_$i.csv 생성 완료"
          done
          echo "[scorecard-ledger] 모든 Scorecard 원장 생성 완료"

      - name: 📄 Scorecard 보고서 파일 생성
        run: |
          echo "[scorecard-file] Scorecard 보고서 파일 생성 시작..."
          for i in $(seq 1 10); do
            echo "이 리포트는 오픈소스 보안 점검 결과를 요약한 보고서입니다. 번호: $i" > .github/scorecard/files/oss_report_$i.txt
            echo "[scorecard-file] oss_report_$i.txt 생성 완료"
          done
          echo "[scorecard-file] 모든 Scorecard 보고서 생성 완료"

      - name: 📜 금융 provenance.json 생성
        run: |
          echo "[provenance] 금융 provenance.json 생성 시작..."
          FILE=".github/finance/provenance.json"
          echo "{
            \"type\": \"finance-ledger\",
            \"generated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
            \"workflow\": \"${{ github.workflow }}\",
            \"run_id\": \"${{ github.run_id }}\",
            \"repository\": \"${{ github.repository }}\",
            \"ledgers\": $(ls .github/finance/ledgers | jq -R -s -c 'split("\n")[:-1]'),
            \"reports\": $(ls .github/finance/files | jq -R -s -c 'split("\n")[:-1]')
          }" > "$FILE"
          echo "[provenance] 금융 provenance.json 생성 완료"

      - name: 📜 Scorecard provenance.json 생성
        run: |
          echo "[provenance] Scorecard provenance.json 생성 시작..."
          FILE=".github/scorecard/provenance.json"
          echo "{
            \"type\": \"scorecard-report\",
            \"generated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
            \"workflow\": \"${{ github.workflow }}\",
            \"run_id\": \"${{ github.run_id }}\",
            \"repository\": \"${{ github.repository }}\",
            \"ledgers\": $(ls .github/scorecard/ledgers | jq -R -s -c 'split("\n")[:-1]'),
            \"reports\": $(ls .github/scorecard/files | jq -R -s -c 'split("\n")[:-1]')
          }" > "$FILE"
          echo "[provenance] Scorecard provenance.json 생성 완료"

      - name: 🩺 시스템 헬스체크
        run: |
          echo "[healthcheck] Docker 동작 상태 확인 중..."
          if docker info > /dev/null 2>&1; then
            echo "✅ Docker 정상 동작 중"
          else
            echo "❌ Docker 비정상 상태"
            exit 1
          fi

          echo "[healthcheck] Scorecard CLI 버전 확인 중..."
          if scorecard --version > /dev/null 2>&1; then
            echo "✅ Scorecard CLI 정상 설치됨"
          else
            echo "❌ Scorecard CLI 설치 실패 또는 누락"
            exit 1
          fi

          echo "[healthcheck] 디렉토리 생성 확인 중..."
          if [ -d ".github/finance/ledgers" ] && [ -d ".github/scorecard/files" ]; then
            echo "✅ 디렉토리 정상 생성됨"
          else
            echo "❌ 디렉토리 생성 실패"
            exit 1
          fi

          echo "[healthcheck] 금융 ledger 개수 확인 중..."
          COUNT=$(ls .github/finance/ledgers/*.csv 2>/dev/null | wc -l)
          if [ "$COUNT" -ge 10 ]; then
            echo "✅ 금융 ledger $COUNT개 생성됨"
          else
            echo "❌ 금융 ledger 부족 (현재 $COUNT개)"
            exit 1
          fi

          echo "[healthcheck] Scorecard 보고서 유효성 확인 중..."
          if grep -q "오픈소스 보안 점검" .github/scorecard/files/oss_report_1.txt; then
            echo "✅ Scorecard 보고서 내용 정상"
          else
            echo "❌ Scorecard 보고서 내용 이상"
            exit 1
          fi

          echo "[healthcheck] 모든 헬스체크 통과 완료 ✅"
