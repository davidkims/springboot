name: 🐬 MySQL 8.x Ubuntu 24.04 완전 robust 설치/초기화/비번/echo_log 자동화

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  mysql-robust-auto:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 사전 디렉토리/echo_log 함수 선언
        run: |
          mkdir -p .github/echo .github/logs /tmp/echo
          cat <<'EOF' > ensure_logistics_db.sh
          #!/bin/bash
          for i in 1 2 3; do
            sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld && sudo chmod 770 /var/run/mysqld
            sudo mysql -e "CREATE DATABASE IF NOT EXISTS logistics;" 2>/dev/null && break || sleep 3
          done
          for i in 1 2 3; do
            sudo mysql -D logistics -e "
            CREATE TABLE IF NOT EXISTS echo_log (
              id INT AUTO_INCREMENT PRIMARY KEY,
              step_name VARCHAR(128),
              echo_cmd TEXT,
              executed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              status VARCHAR(32) DEFAULT 'success',
              message TEXT
            ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;" 2>/dev/null && break || sleep 3
          done
          EOF
          chmod +x ensure_logistics_db.sh

      - name: 🧩 MySQL 설치/초기화/소켓/권한/비번 robust
        run: |
          set -e
          export MYSQL_PWD=''
          sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld && sudo chmod 770 /var/run/mysqld
          sudo systemctl stop mysql || true
          sudo pkill -f mysqld || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server

          # 데몬 기동(최대 3회 재시도)
          for i in 1 2 3; do
            sudo systemctl start mysql || true
            sleep 7
            if sudo systemctl status mysql | grep -qi 'active (running)'; then break; fi
            if [ $i -eq 3 ]; then
              sudo journalctl -u mysql | tail -30
              echo "[❌] MySQL 데몬 기동 실패!"; exit 1
            fi
          done

          # Ubuntu 24.04 환경은 sudo mysql 만 허용, root 비번 초기화
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpass123';"
          sudo mysql -e "FLUSH PRIVILEGES;"
          sleep 2

          # root 인증 robust 체크 (최대3회)
          for i in 1 2 3; do
            sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld && sudo chmod 770 /var/run/mysqld
            if mysql -u root -prootpass123 -e 'select version();'; then
              echo "[✔] MySQL root 인증 성공"
              exit 0
            else
              echo "[!] root 인증 실패($i). 3초후 재시도..."; sleep 3
            fi
          done
          echo "[❌] MySQL root 인증 최종 실패!"
          sudo journalctl -u mysql | tail -30
          exit 1

      - name: 🗄️ echo_log robust 생성
        run: |
          set -e
          export MYSQL_PWD=rootpass123
          ./ensure_logistics_db.sh
          mysql -u root -prootpass123 -D logistics -e "INSERT INTO echo_log (step_name, echo_cmd, status, message) VALUES ('echo_log', '테스트', 'success', '테이블 생성/DB접근 OK');"

      - name: 🌀 aiter/aim/airflow robust 설치 및 echo_log 기록
        run: |
          set -e
          export MYSQL_PWD=rootpass123
          sudo apt-get install -y python3-pip python3-venv
          for pkg in aiter aim apache-airflow; do
            ./ensure_logistics_db.sh
            max_try=3; n=1
            while : ; do
              if python3 -m pip install "$pkg" >> .github/echo/step-install-$pkg.txt 2>&1; then
                ./ensure_logistics_db.sh
                mysql -u root -prootpass123 -D logistics -e "INSERT INTO echo_log (step_name, echo_cmd, status, message) VALUES ('${pkg} install', 'pip install $pkg', 'success', '정상수행($n회)');"
                break
              else
                ./ensure_logistics_db.sh
                mysql -u root -prootpass123 -D logistics -e "INSERT INTO echo_log (step_name, echo_cmd, status, message) VALUES ('${pkg} install', 'pip install $pkg', 'failed', '실패($n회)');"
                sleep 3; ((n++)); if [ $n -gt $max_try ]; then exit 1; fi
              fi
            done
            $pkg --version | tee -a .github/echo/step-install-$pkg.txt || true
          done

      - name: 🟩 echo_log 사용 예시 및 종료
        run: |
          set -e
          export MYSQL_PWD=rootpass123
          ./ensure_logistics_db.sh
          mysql -u root -prootpass123 -D logistics -e "INSERT INTO echo_log (step_name, echo_cmd, status, message) VALUES ('END', 'all done', 'success', '최종 성공');"
