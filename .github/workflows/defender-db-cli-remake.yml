name: "📚 DNS Cache Table Docs & Diagram (Echo+Commit)"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      doc_lang:
        description: "문서 언어 (ko|en)"
        required: true
        default: "ko"
      out_dir:
        description: "출력 디렉토리"
        required: true
        default: "docs/dns-cache"
      generate_diagram:
        description: "Mermaid 다이어그램 생성(SVG/PNG)"
        required: true
        default: "true"
      flush_examples:
        description: "OS별 Flush 예시 스크립트 생성"
        required: true
        default: "true"
      commit_branch:
        description: "커밋/푸시 대상 브랜치"
        required: true
        default: "main"
      commit_message:
        description: "커밋 메시지"
        required: true
        default: "docs(dns): generate DNS cache table docs & diagrams"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OUT_DIR: ${{ github.event.inputs.out_dir }}
      LANG_SEL: ${{ github.event.inputs.doc_lang }}
      GEN_DIAG: ${{ github.event.inputs.generate_diagram }}
      GEN_FLUSH: ${{ github.event.inputs.flush_examples }}
      BRANCH: ${{ github.event.inputs.commit_branch }}
      COMMIT_MSG: ${{ github.event.inputs.commit_message }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- PATCHED: Chromium sandbox-free rendering toolchain ----
      - name: Prepare tools (Mermaid CLI, fonts)  # patched
        if: env.GEN_DIAG == 'true'
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libnss3 libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 \
            libxi6 libxtst6 libcups2 libxrandr2 libasound2 libpangocairo-1.0-0 \
            libgtk-3-0 fonts-noto fonts-noto-cjk jq
          corepack enable || true
          npm i -g @mermaid-js/mermaid-cli@10
          mkdir -p "${OUT_DIR}/assets"
          cat > "${OUT_DIR}/assets/puppeteer.config.cjs" <<'CJS'
          module.exports = {
            headless: 'new',
            args: ['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage','--disable-gpu']
          };
          CJS

      - name: Generate structure
        run: |
          set -Eeuo pipefail
          mkdir -p "${OUT_DIR}/assets" "${OUT_DIR}/samples" "${OUT_DIR}/scripts"

      - name: Create Mermaid diagram (.mmd)
        if: env.GEN_DIAG == 'true'
        run: |
          set -Eeuo pipefail
          cat > "${OUT_DIR}/assets/dns_cache_flow.mmd" <<'MMD'
          flowchart LR
              A[Client Request] --> B{Browser Cache}
              B -- hit --> Z[Return IP (cached)]
              B -- miss/expired --> C{OS DNS Cache}
              C -- hit --> Z
              C -- miss/expired --> D{Recursive Resolver Cache}
              D -- hit --> Z
              D -- miss/expired --> E[Authoritative DNS (Root→TLD→Auth)]
              E --> D --> C --> B --> Z
              Z --> F[Connect to Target IP]
              subgraph CacheEntry[Cache Entry Fields]
                N[Name(FQDN)]:::f T[Type]:::f CL[Class=IN]:::f
                R[RDATA]:::f TTL[TTL]:::f CACHED[CachedTime]:::f EXP[ExpireTime]:::f
              end
              classDef f fill:#eefaff,stroke:#48a,stroke-width:1px
              class B,C,D f
          MMD

      # ---- PATCHED: render with --no-sandbox ----
      - name: Render SVG/PNG from Mermaid (no-sandbox)  # patched
        if: env.GEN_DIAG == 'true'
        run: |
          set -Eeuo pipefail
          CFG="${OUT_DIR}/assets/puppeteer.config.cjs"
          IN="${OUT_DIR}/assets/dns_cache_flow.mmd"
          mmdc -p "$CFG" -i "$IN" -o "${OUT_DIR}/assets/dns_cache_flow.svg"
          mmdc -p "$CFG" -i "$IN" -o "${OUT_DIR}/assets/dns_cache_flow.png" -b transparent
          test -s "${OUT_DIR}/assets/dns_cache_flow.svg"
          test -s "${OUT_DIR}/assets/dns_cache_flow.png"

      - name: Create sample cache table (JSON/CSV)
        run: |
          set -Eeuo pipefail
          cat > "${OUT_DIR}/samples/cache_table.json" <<'JSON'
          [
            {"name":"www.example.com.","type":"A","class":"IN","rdata":"93.184.216.34","ttl":3600,"cached_time":"2025-08-23T12:00:00Z","expire_time":"2025-08-23T13:00:00Z"},
            {"name":"api.example.com.","type":"AAAA","class":"IN","rdata":"2606:2800:220:1:248:1893:25c8:1946","ttl":600,"cached_time":"2025-08-23T12:05:00Z","expire_time":"2025-08-23T12:15:00Z"},
            {"name":"no-such.example.com.","type":"A","class":"IN","rdata":"NXDOMAIN","ttl":300,"cached_time":"2025-08-23T12:10:00Z","expire_time":"2025-08-23T12:15:00Z","note":"Negative Caching (RFC 2308)"}
          ]
          JSON
          jq -r '["name","type","class","rdata","ttl","cached_time","expire_time","note"],
                 (.[]|[.name,.type,.class,.rdata,.ttl,.cached_time,.expire_time, (.note//"")])|@csv' \
                 "${OUT_DIR}/samples/cache_table.json" > "${OUT_DIR}/samples/cache_table.csv"

      - name: Create flush examples (Windows/Linux/macOS)
        if: env.GEN_FLUSH == 'true'
        run: |
          set -Eeuo pipefail
          cat > "${OUT_DIR}/scripts/flush_windows.ps1" <<'PS1'
          ipconfig /displaydns
          ipconfig /flushdns
          Write-Host "[OK] Flushed Windows DNS client cache."
          PS1
          cat > "${OUT_DIR}/scripts/flush_linux.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          sudo systemd-resolve --statistics || true
          sudo systemd-resolve --flush-caches
          echo "[OK] Flushed systemd-resolved cache."
          SH
          chmod +x "${OUT_DIR}/scripts/flush_linux.sh"
          cat > "${OUT_DIR}/scripts/flush_macos.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          sudo killall -INFO mDNSResponder || true
          sudo killall -HUP mDNSResponder
          echo "[OK] Flushed macOS mDNSResponder cache."
          SH
          chmod +x "${OUT_DIR}/scripts/flush_macos.sh"

      - name: Create README (ko/en)
        run: |
          set -Eeuo pipefail
          if [ "${LANG_SEL}" = "en" ]; then
            cat > "${OUT_DIR}/README.md" <<'MD'
            # DNS Cache Table (Expert Guide)
            Layers: Browser → OS → Recursive Resolver → Authoritative.
            Fields: Name, Type, Class(IN), RDATA, TTL, CachedTime, ExpireTime.
            Security: DNSSEC, 0x20, periodic flush.
            See `assets/dns_cache_flow.svg` and samples/*.md.
            MD
          else
            cat > "${OUT_DIR}/README.md" <<'MD'
            # DNS 캐시 테이블 (전문가 가이드)
            계층: 브라우저 → OS → 재귀 리졸버 → 권한 서버.
            필드: Name, Type, Class(IN), RDATA, TTL, CachedTime, ExpireTime.
            보안: DNSSEC, 0x20 난수화, 주기적 플러시.
            다이어그램: `assets/dns_cache_flow.svg` 참고.
            MD
          fi

      - name: Summarize outputs (index)
        run: |
          set -Eeuo pipefail
          cat > "${OUT_DIR}/INDEX.md" <<'MD'
          # Index
          - README.md
          - assets/
            - dns_cache_flow.mmd
            - dns_cache_flow.svg
            - dns_cache_flow.png
            - puppeteer.config.cjs
          - samples/
            - cache_table.json
            - cache_table.csv
          - scripts/
            - flush_windows.ps1
            - flush_linux.sh
            - flush_macos.sh
          MD

      - name: Commit & Push
        run: |
          set -Eeuo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "${BRANCH}" ]; then
            git checkout -B "${BRANCH}"
          fi
          git add -A "${OUT_DIR}"
          if git diff --cached --quiet; then
            echo "[ECHO] No changes"
          else
            git commit -m "${COMMIT_MSG}"
            git push origin "${BRANCH}"
          fi

      - name: Upload artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: dns-cache-docs
          path: ${{ env.OUT_DIR }}
