name: 🏦 Generate Customer Data + Provenance + Logs + Backup

on:
  workflow_dispatch:

jobs:
  generate-customer-info:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Install Docker
        run: |
          echo "[+] Installing Docker..."
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo systemctl start docker
          echo "[✔] Docker installed"

      - name: 📦 Start Ubuntu container
        run: |
          echo "[+] Starting Docker container..."
          docker pull ubuntu:latest
          docker run -d --name ubuntu-container ubuntu:latest tail -f /dev/null
          echo "[✔] Container started"

      - name: 🧰 Install Python and Faker
        run: |
          docker exec ubuntu-container bash -c "apt-get update && apt-get install -y python3 python3-pip zip"
          docker exec ubuntu-container bash -c "pip3 install --break-system-packages faker"

      - name: 📝 Create Python script (with echo only)
        run: |
          echo "[+] Python script generation via echo..."
          docker exec ubuntu-container bash -c "mkdir -p /app/site/backups /app/site/logs /app/.github/provenance"

          docker exec ubuntu-container bash -c "echo 'import csv' > /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo 'from faker import Faker' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo 'import datetime' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo 'import json' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo 'import os' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo 'fake = Faker()' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo 'now = datetime.datetime.now().strftime(\"%Y%m%d-%H%M\")' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo 'csv_path = f\"/app/site/backups/customers-{now}.csv\"' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo 'prov_dir = \"/app/.github/provenance\"' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo 'sarif_dir = prov_dir' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo 'log = []' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo 'with open(csv_path, \"w\", newline=\"\") as f:' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '    writer = csv.writer(f)' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '    writer.writerow([\"이름\", \"계좌번호\", \"잔액\"])' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '    for i in range(10):' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '        name = fake.name()' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '        account = fake.bban()' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '        balance = round(fake.pyfloat(left_digits=6, right_digits=2, positive=True), 2)' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '        writer.writerow([name, account, balance])' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '        log.append(f\"Generated: {name}, {account}, {balance}\")' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '        provenance = {' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '            \"type\": \"customer_provenance\",' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '            \"customer\": name,' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '            \"account\": account,' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '            \"balance\": balance,' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '            \"timestamp\": now' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '        }' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '        sarif = {' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '            \"version\": \"2.1.0\",' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '            \"runs\": [{' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '                \"tool\": {\"driver\": {\"name\": \"CustomerGenerator\"}},' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '                \"results\": [{' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '                    \"ruleId\": \"customer-record\",' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '                    \"level\": \"note\",' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '                    \"message\": {\"text\": f\"Customer {name} created.\"}' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '                }]' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '            }]' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '        }' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '        with open(f\"{prov_dir}/customer_{i+1}_{now}.json\", \"w\") as pf:' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '            json.dump(provenance, pf, indent=2)' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '        with open(f\"{sarif_dir}/customer_{i+1}_{now}.sarif\", \"w\") as sf:' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '            json.dump(sarif, sf, indent=2)' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo 'with open(f\"/app/site/logs/log_{now}.txt\", \"w\") as lf:' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '    lf.write(\"\\n\".join(log))' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo 'print(\"[✔] 고객 CSV 및 증명서 생성 완료\")' >> /app/generate_customers.py"

      - name: 🚀 Run Python script
        run: |
          docker exec ubuntu-container python3 /app/generate_customers.py

      - name: 🗜 Compress daily CSVs
        run: |
          docker exec ubuntu-container bash -c "
            cd /app/site/backups &&
            zip -r /app/site/backups/daily_backup_\$(date +%Y%m%d).zip customers-*.csv || true
          "

      - name: 📤 Copy results to host
        run: |
          mkdir -p site/backups site/logs .github/provenance
          docker cp ubuntu-container:/app/site/backups ./site/backups
          docker cp ubuntu-container:/app/site/logs ./site/logs
          docker cp ubuntu-container:/app/.github/provenance ./.github/provenance

      - name: 🧹 Clean up
        run: |
          docker stop ubuntu-container
          docker rm ubuntu-container
