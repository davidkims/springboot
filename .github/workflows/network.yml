name: 🌐 .github 폴더 무조건 업로드 (에코/경로/워크플로우/환경/로그/설정/강제 파일)

on:
  workflow_dispatch:

jobs:
  all-in-one-info:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 .github 내부 실제 경로에 모든 폴더/필수파일 생성 (강제)
        run: |
          export GITHUB_DIR="${GITHUB_WORKSPACE}/.github"
          mkdir -p $GITHUB_DIR
          mkdir -p $GITHUB_DIR/workflows
          mkdir -p $GITHUB_DIR/echo_force
          mkdir -p $GITHUB_DIR/error_logs

          for d in \
            $GITHUB_DIR/echo_system $GITHUB_DIR/echo_network $GITHUB_DIR/echo_dns $GITHUB_DIR/echo_route \
            $GITHUB_DIR/echo_docker $GITHUB_DIR/echo_containers $GITHUB_DIR/echo_volume $GITHUB_DIR/echo_logs \
            $GITHUB_DIR/echo_permission $GITHUB_DIR/echo_user $GITHUB_DIR/echo_key $GITHUB_DIR/echo_fileperm \
            $GITHUB_DIR/echo_pkg $GITHUB_DIR/echo_env $GITHUB_DIR/echo_build $GITHUB_DIR/echo_git \
            $GITHUB_DIR/echo_backup $GITHUB_DIR/echo_monitor $GITHUB_DIR/echo_misc \
            $GITHUB_DIR/scripts $GITHUB_DIR/cli_test $GITHUB_DIR/error_logs $GITHUB_DIR/echo_db $GITHUB_DIR/echo_force; do
            mkdir -p $d
            echo "[dummy]" > $d/dummy.txt
            echo "[keep]" > $d/.keep
            echo "echo '[에코] $d 생성'" > $d/echo_dir.sh
          done

          # 루트에 파일 강제 생성 (업로드 강제 트리거)
          echo "[force-upload]" > $GITHUB_DIR/force_upload.txt
          echo "# Github Meta" > $GITHUB_DIR/README.md

          # 워크플로우 예시
          echo "name: dummy-wf" > $GITHUB_DIR/workflows/dummy.yml

          # 로그/환경/경로 echo
          touch $GITHUB_DIR/error_logs/disabled_workflows.txt
          touch $GITHUB_DIR/error_logs/init_check.log
          touch $GITHUB_DIR/echo_misc/health.txt
          env > $GITHUB_DIR/echo_env/env.txt
          uname -a > $GITHUB_DIR/echo_env/uname.txt

          # 경로 echo
          find $GITHUB_DIR -type d | sort > $GITHUB_DIR/echo_force/dir_list.txt
          find $GITHUB_DIR -type f | sort > $GITHUB_DIR/echo_force/file_list.txt

          # 실제 파일 개수 체크
          filecount=$(find $GITHUB_DIR -type f | wc -l)
          echo "실제 생성된 .github 하위 파일 개수: $filecount"
          if [ "$filecount" -eq 0 ]; then
            echo "::error ::.github에 파일이 하나도 없습니다!"
            exit 1
          fi

      - name: 🔍 업로드 직전 파일 목록 확인
        run: |
          find $GITHUB_WORKSPACE/.github -type f | sort

      - name: 📦 무조건 업로드: .github/** (절대 실패X)
        uses: actions/upload-artifact@v4
        with:
          name: all-github-artifacts
          path: ${{ github.workspace }}/.github/**
          if-no-files-found: error
