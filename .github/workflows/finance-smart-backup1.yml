name: "📊 Full Monitoring Stack — echo-only (stable)"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  setup_monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      MONO: .monitoring
      INF_BUCKET: metrics
      INF_ORG: org
      INF_USER: admin
      INF_PASS: "admin1234!"
      INF_TOKEN: "dev-token-123456"
      VM_DATA: /tmp/victoria

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📁 Create directories
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$MONO"/{influxdb,telegraf,graphite,victoriametrics,otel,statsd,scripts,python}
          echo "[OK] created $MONO subdirs"

      - name: 🐳 Ensure Docker (upgrade-only; avoid containerd.io conflicts)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --only-upgrade docker.io containerd || true
          sudo systemctl is-active --quiet docker || sudo systemctl start docker || true
          docker --version || true
          containerd --version || true
          docker network create monnet >/dev/null 2>&1 || true

      - name: 🛠️ Echo configs (InfluxDB/Telegraf/Graphite/OTEL)
        shell: bash
        run: |
          set -Eeuo pipefail
          # InfluxDB2 config (echo-only)
          cfg="$MONO/influxdb/influxdb.conf"
          : > "$cfg"
          echo 'reporting-disabled = true' >> "$cfg"
          echo 'bolt-path = "/var/lib/influxdb2/influxd.bolt"' >> "$cfg"
          echo 'engine-path = "/var/lib/influxdb2/engine"' >> "$cfg"
          echo 'http-bind-address = ":8086"' >> "$cfg"

          # Telegraf config (echo-only, env expanded at container runtime)
          tcfg="$MONO/telegraf/telegraf.conf"
          : > "$tcfg"
          echo '[agent]' >> "$tcfg"
          echo '  interval = "10s"' >> "$tcfg"
          echo '  round_interval = true' >> "$tcfg"
          echo '' >> "$tcfg"
          echo '[[outputs.influxdb_v2]]' >> "$tcfg"
          echo '  urls = ["http://influxdb:8086"]' >> "$tcfg"
          echo '  token = "${INFLUX_TOKEN}"' >> "$tcfg"
          echo '  organization = "${INFLUX_ORG}"' >> "$tcfg"
          echo '  bucket = "${INFLUX_BUCKET}"' >> "$tcfg"
          echo '' >> "$tcfg"
          echo '[[inputs.cpu]]' >> "$tcfg"
          echo '  percpu = true' >> "$tcfg"
          echo '  totalcpu = true' >> "$tcfg"
          echo '[[inputs.mem]]' >> "$tcfg"
          echo '[[inputs.disk]]' >> "$tcfg"
          echo '  ignore_fs = ["tmpfs","devtmpfs","overlay"]' >> "$tcfg"
          echo '[[inputs.net]]' >> "$tcfg"

          # Graphite storage schema (echo-only)
          gcfg="$MONO/graphite/storage-schemas.conf"
          mkdir -p "$(dirname "$gcfg")"
          : > "$gcfg"
          echo '[default]' >> "$gcfg"
          echo 'pattern = .*' >> "$gcfg"
          echo 'retentions = 60s:30d' >> "$gcfg"

          # OTEL Collector config (echo-only): OTLP -> VictoriaMetrics
          ocfg="$MONO/otel/otel-collector.yaml"
          : > "$ocfg"
          echo 'receivers:' >> "$ocfg"
          echo '  otlp:' >> "$ocfg"
          echo '    protocols:' >> "$ocfg"
          echo '      grpc:' >> "$ocfg"
          echo '      http:' >> "$ocfg"
          echo '' >> "$ocfg"
          echo 'exporters:' >> "$ocfg"
          echo '  otlphttp/victoria:' >> "$ocfg"
          echo '    endpoint: http://victoriametrics:8428' >> "$ocfg"
          echo '    traces_endpoint: http://victoriametrics:8428/opentelemetry/v1/traces' >> "$ocfg"
          echo '    metrics_endpoint: http://victoriametrics:8428/opentelemetry/v1/metrics' >> "$ocfg"
          echo '    logs_endpoint: http://victoriametrics:8428/opentelemetry/v1/logs' >> "$ocfg"
          echo '' >> "$ocfg"
          echo 'processors:' >> "$ocfg"
          echo '  batch:' >> "$ocfg"
          echo '' >> "$ocfg"
          echo 'service:' >> "$ocfg"
          echo '  pipelines:' >> "$ocfg"
          echo '    metrics:' >> "$ocfg"
          echo '      receivers: [otlp]' >> "$ocfg"
          echo '      processors: [batch]' >> "$ocfg"
          echo '      exporters: [otlphttp/victoria]' >> "$ocfg"
          echo '    traces:' >> "$ocfg"
          echo '      receivers: [otlp]' >> "$ocfg"
          echo '      processors: [batch]' >> "$ocfg"
          echo '      exporters: [otlphttp/victoria]' >> "$ocfg"
          echo '    logs:' >> "$ocfg"
          echo '      receivers: [otlp]' >> "$ocfg"
          echo '      processors: [batch]' >> "$ocfg"
          echo '      exporters: [otlphttp/victoria]' >> "$ocfg"

          # VictoriaMetrics data dir
          mkdir -p "$VM_DATA"

      - name: 🚀 Run core containers
        shell: bash
        env:
          INFLUX_BUCKET: ${{ env.INF_BUCKET }}
          INFLUX_ORG: ${{ env.INF_ORG }}
          INFLUX_USER: ${{ env.INF_USER }}
          INFLUX_PASS: ${{ env.INF_PASS }}
          INFLUX_TOKEN: ${{ env.INF_TOKEN }}
        run: |
          set -Eeuo pipefail
          docker rm -f influxdb telegraf graphite-statsd victoriametrics otel >/dev/null 2>&1 || true

          echo "[Start] InfluxDB 2.7"
          docker run -d --name influxdb --network monnet \
            -p 8086:8086 \
            -e INFLUXD_CONFIG_PATH=/etc/influxdb2/config.toml \
            -v "$PWD/$MONO/influxdb/influxdb.conf:/etc/influxdb2/config.toml" \
            influxdb:2.7

          echo "[Wait] InfluxDB API..."
          timeout 90 bash -c 'until docker exec influxdb influx ping >/dev/null 2>&1; do sleep 2; done'

          echo "[Init] InfluxDB setup"
          docker exec influxdb influx setup \
            --username "$INFLUX_USER" \
            --password "$INFLUX_PASS" \
            --org "$INFLUX_ORG" \
            --bucket "$INFLUX_BUCKET" \
            --token "$INFLUX_TOKEN" \
            --force

          echo "[Start] Telegraf"
          docker run -d --name telegraf --network monnet \
            -e INFLUX_TOKEN="$INFLUX_TOKEN" \
            -e INFLUX_ORG="$INFLUX_ORG" \
            -e INFLUX_BUCKET="$INFLUX_BUCKET" \
            -v "$PWD/$MONO/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf" \
            telegraf:1.28

          echo "[Start] Graphite+StatsD"
          docker run -d --name graphite-statsd --network monnet \
            -p 80:80 -p 2003-2004:2003-2004 -p 8125:8125/udp \
            -v "$PWD/$MONO/graphite/storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf" \
            graphiteapp/graphite-statsd

          echo "[Start] VictoriaMetrics"
          docker run -d --name victoriametrics --network monnet \
            -p 8428:8428 \
            -v "$VM_DATA:/victoria-metrics-data" \
            victoriametrics/victoria-metrics:latest

          echo "[Start] OTEL Collector"
          docker run -d --name otel --network monnet \
            -p 4317:4317 -p 4318:4318 \
            -v "$PWD/$MONO/otel/otel-collector.yaml:/etc/otel/config.yaml" \
            otel/opentelemetry-collector-contrib:latest \
            --config /etc/otel/config.yaml

      - name: 🔎 Verify & print logs on failure
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ps]"; docker ps -a || true
          for c in influxdb telegraf graphite-statsd victoriametrics otel; do
            echo "===== logs: $c ====="
            docker logs --tail 200 "$c" || true
          done
