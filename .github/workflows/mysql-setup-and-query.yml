name: 🏆 MySQL+Oracle FullOps Robust Echo Eiffel Tower

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

jobs:
  db-fullops:
    runs-on: ubuntu-latest
    env:
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass123
      MYSQL_DB: sample_db
      MASS_TABLE: 6
      MASS_USER: 8
      MASS_TXN: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass123
          MYSQL_DATABASE: sample_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -prootpass123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🔄 Init Directories and Secure Echo Setup
        run: |
          set -e
          for d in \
            .github/echo \
            .github/echo/mysql \
            .github/echo/mysql/logs \
            .github/echo/mysql/ddl \
            .github/echo/mysql/user \
            .github/echo/mysql/txn \
            .github/echo/mysql/account_info \
            .github/echo/mysql/sock \
            .github/echo/mysql/portcheck \
            .github/echo/mysql/firewall \
            .github/echo/mysql/secure \
            .github/echo/mysql/scripts \
            .github/echo/mysql/permissions \
            .github/echo/oracle \
            .github/echo/oracle/logs
          do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo/mysql/logs/init_dirs.log
            mkdir -p "$d"
          done

      - name: ⚙️ MySQL 포트 및 방화벽 상태 체크 + Echo
        run: |
          echo "MYSQL_USER=$MYSQL_USER" > .github/echo/mysql/account_info/mysql_env.txt
          echo "MYSQL_PASSWORD=$MYSQL_PASSWORD" >> .github/echo/mysql/account_info/mysql_env.txt
          echo "MYSQL_DB=$MYSQL_DB" >> .github/echo/mysql/account_info/mysql_env.txt
          echo "MASS_TABLE=$MASS_TABLE" >> .github/echo/mysql/account_info/mysql_env.txt
          echo "MASS_USER=$MASS_USER" >> .github/echo/mysql/account_info/mysql_env.txt
          echo "MASS_TXN=$MASS_TXN" >> .github/echo/mysql/account_info/mysql_env.txt

          sudo lsof -i :3306 > .github/echo/mysql/portcheck/3306_check.txt || echo "[✅] 포트 사용 안 함"
          sudo iptables -L -n -v --line-numbers > .github/echo/mysql/firewall/iptables_rules.txt || echo "[❌] iptables 명령 실패" | tee -a .github/echo/mysql/firewall/iptables_rules.txt

          uname -a > .github/echo/mysql/scripts/uname_info.txt
          hostnamectl > .github/echo/mysql/scripts/hostnamectl.txt
          df -h > .github/echo/mysql/scripts/disk_usage.txt
          free -m > .github/echo/mysql/scripts/memory_usage.txt
          curl -s ifconfig.me > .github/echo/mysql/scripts/public_ip.txt || echo "IP 실패" > .github/echo/mysql/scripts/public_ip.txt

          if [ ! -d /var/run/mysqld ]; then
            echo '[❗] /var/run/mysqld 없음 → 생성' | tee -a .github/echo/mysql/sock/sock_recovery.txt
            sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld
          fi
          if [ ! -S /var/run/mysqld/mysqld.sock ]; then
            echo '[❗] mysqld.sock 없음 → mysqld_safe 실행' | tee -a .github/echo/mysql/sock/sock_recovery.txt
            sudo mysqld_safe --skip-grant-tables --skip-networking > .github/echo/mysql/sock/mysqld_safe_stdout.log 2>&1 &
            sleep 10
            ps -ef | grep mysqld >> .github/echo/mysql/sock/sock_recovery.txt
          fi

          echo "echo '[mysql_config_editor 설정]'" > .github/echo/mysql/secure/mysql_config_editor.sh
          echo "mysql_config_editor set --login-path=local --host=127.0.0.1 --user=$MYSQL_USER --password <<EOF" >> .github/echo/mysql/secure/mysql_config_editor.sh
          echo "$MYSQL_PASSWORD" >> .github/echo/mysql/secure/mysql_config_editor.sh
          echo "EOF" >> .github/echo/mysql/secure/mysql_config_editor.sh
          bash .github/echo/mysql/secure/mysql_config_editor.sh > .github/echo/mysql/secure/mysql_config_editor.log

          echo '#!/bin/bash' > .github/echo/mysql/permissions/check_permission.sh
          echo 'id' >> .github/echo/mysql/permissions/check_permission.sh
          echo 'groups' >> .github/echo/mysql/permissions/check_permission.sh
          chmod +x .github/echo/mysql/permissions/check_permission.sh
          bash .github/echo/mysql/permissions/check_permission.sh > .github/echo/mysql/permissions/permission_result.txt
