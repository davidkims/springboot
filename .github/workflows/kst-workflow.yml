name: 🇰🇷 KST 타임존 직접 적용 워크플로우

on:
  workflow_dispatch:

env:
  TZ: Asia/Seoul  # [1] 모든 스텝 글로벌 환경변수 적용

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # [2] 타임존 시스템 적용: 반드시 steps의 맨 첫 줄에 추가!
      - name: ⏰ KST 타임존 환경/시스템 직접 적용
        run: |
          echo "[⏰] 환경변수 TZ=Asia/Seoul 추가"
          echo "TZ=Asia/Seoul" >> $GITHUB_ENV
          echo "[⏰] 시스템 타임존을 KST로 변경"
          sudo apt-get update && sudo apt-get install -y tzdata
          sudo ln -sf /usr/share/zoneinfo/Asia/Seoul /etc/localtime
          sudo dpkg-reconfigure -f noninteractive tzdata
          date
          timedatectl

      # 이후부턴 모든 명령이 KST 기준
      - name: 🕒 KST 시간 확인
        run: |
          echo "[KST] date: $(date)"
          echo "[KST] UTC date: $(date -u)"
          timedatectl

      - name: 📝 KST 시간 기반 파일 생성
        run: |
          echo "[KST] 파일 생성 예시"
          touch "kst-$(date +'%Y%m%d_%H%M%S').txt"
          ls -l kst-*.txt
