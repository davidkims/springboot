name: "⚙️ Maven + Spring Boot: Auto-Setup + Install/Upgrade + Echo Perm + Release (Full Echo Suite)"

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: "프로젝트가 위치한 디렉토리 (pom.xml이 존재하는 경로). 모노레포면 서브폴더 지정"
        required: true
        default: "."
      auto_create_project:
        description: "pom.xml이 없을 때 자동으로 Spring Boot 프로젝트 생성 (true/false)"
        required: true
        default: "true"
      project_config:
        description: "프로젝트 설정 (format: groupId:artifactId:packageName 예: com.example:demo-app:com.example.demo)"
        required: false
        default: "com.example:demo-app:com.example.demo"
      spring_boot_version:
        description: "(선택) 적용할 Spring Boot 버전 (예: 3.3.3). 비우면 현재 pom.xml 유지"
        required: false
        default: "3.3.3"
      maven_version:
        description: "(선택) 사용할 Maven 버전 (예: 3.9.9). 비우면 기본 버전"
        required: false
        default: ""
      bump_type:
        description: "릴리즈 시 버전 증가 유형 (patch|minor|major)"
        required: false
        default: "patch"
      run_tests:
        description: "빌드 전에 테스트 실행 (true/false)"
        required: true
        default: "true"
      create_release:
        description: "릴리즈 생성 및 태그/아티팩트 업로드 (true/false)"
        required: true
        default: "true"
      distribute_artifacts:
        description: "빌드 산출물 업로드 (Artifacts) (true/false)"
        required: true
        default: "true"
      workflow_options:
        description: "추가 옵션 (skip_wrapper_gen:false,skip_permissions:false 등)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read
  packages: write

env:
  JAVA_VERSION: "21"
  ECHO_ROOT: .github/echo_java
  OUT_DIR: .github/echo_java/out
  LOG_DIR: .github/echo_java/logs
  PERM_DIR: .github/echo_java/permissions
  ARTIFACT_DIR: .github/echo_java/artifacts
  TOOLS_DIR: .github/echo_java/tools
  SCRIPTS_DIR: .github/echo_java/scripts
  DOC_DIR: .github/echo_java/docs

jobs:
  build_and_release:
    name: "Build & (Optional) Release"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Parse project configuration"
        id: parse_config
        run: |
          set -Eeuo pipefail
          PROJECT_CONFIG="${{ inputs.project_config }}"
          IFS=':' read -r GROUP_ID ARTIFACT_ID PACKAGE_NAME <<< "$PROJECT_CONFIG"
          
          # 기본값 설정
          GROUP_ID="${GROUP_ID:-com.example}"
          ARTIFACT_ID="${ARTIFACT_ID:-demo-app}"
          PACKAGE_NAME="${PACKAGE_NAME:-com.example.demo}"
          
          echo "group_id=$GROUP_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          
          echo "[CONFIG] Group ID: $GROUP_ID"
          echo "[CONFIG] Artifact ID: $ARTIFACT_ID"
          echo "[CONFIG] Package Name: $PACKAGE_NAME"

      - name: "Bootstrap Echo Suite (dirs + tools + docs + scripts)"
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_ROOT" "$OUT_DIR" "$LOG_DIR" "$PERM_DIR" "$ARTIFACT_DIR" "$TOOLS_DIR" "$SCRIPTS_DIR" "$DOC_DIR"
          # echo.sh: 통합 로깅/헬퍼
          cat > "$TOOLS_DIR/echo.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeo pipefail
          _ts(){ date +"%Y-%m-%d %H:%M:%S"; }
          log(){ printf "[ECHO][%s] %s\n" "$1" "$2"; }
          ok(){ log OK "$*"; }
          warn(){ log WARN "$*"; }
          fail(){ log FAIL "$*"; exit 1; }
          section(){ printf "\n=== %s ===\n" "$*"; }
          ensure_dir(){ mkdir -p "$1" && ok "mkdir -p $1"; }
          # maven helpers
          mvn_run(){ mvn -B -U -e "$@"; }
          SH
          chmod +x "$TOOLS_DIR/echo.sh"
          # 권한 적용 스크립트
          cat > "$SCRIPTS_DIR/apply_permissions.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          section "Apply permissions"
          CHMOD_LIST="${PERM_DIR}/chmod.list"
          CHOWN_LIST="${PERM_DIR}/chown.list"
          if [ -f "$CHMOD_LIST" ]; then
            while read -r mode path || [ -n "$mode" ]; do
              [[ -z "${mode:-}" || "${mode:0:1}" = "#" ]] && continue
              for f in $(echo "$path"); do
                if [ -e "$f" ]; then chmod "$mode" "$f" && ok "chmod $mode $f"; else warn "skip $f"; fi
              done
            done < "$CHMOD_LIST"
          fi
          if [ -f "$CHOWN_LIST" ]; then
            while read -r owner path || [ -n "$owner" ]; do
              [[ -z "${owner:-}" || "${owner:0:1}" = "#" ]] && continue
              for f in $(echo "$path"); do
                if [ -e "$f" ]; then sudo chown "$owner" "$f" && ok "chown $owner $f"; else warn "skip $f"; fi
              done
            done < "$CHOWN_LIST"
          fi
          ok "Permissions applied"
          SH
          chmod +x "$SCRIPTS_DIR/apply_permissions.sh"
          # 아티팩트 수집 스크립트
          cat > "$SCRIPTS_DIR/collect_artifacts.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          section "Collect artifacts"
          ensure_dir "$ARTIFACT_DIR"
          SRC_DIR="${1:-target}"
          find "$SRC_DIR" -type f \( -name "*.jar" -o -name "*.war" \) -not -name "original-*.jar" -print -exec cp -v {} "$ARTIFACT_DIR/" \;
          ok "Artifacts collected into $ARTIFACT_DIR"
          SH
          chmod +x "$SCRIPTS_DIR/collect_artifacts.sh"
          # Spring Boot 프로젝트 생성 스크립트
          cat > "$SCRIPTS_DIR/create_spring_boot_project.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          section "Create Spring Boot Project"
          GROUP_ID="${1:-com.example}"
          ARTIFACT_ID="${2:-demo-app}"
          PACKAGE_NAME="${3:-com.example.demo}"
          SPRING_BOOT_VERSION="${4:-3.3.3}"
          TARGET_DIR="${5:-.}"
          
          # pom.xml 생성
          cat > "$TARGET_DIR/pom.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <parent>
                  <groupId>org.springframework.boot</groupId>
                  <artifactId>spring-boot-starter-parent</artifactId>
                  <version>$SPRING_BOOT_VERSION</version>
                  <relativePath/>
              </parent>
              <groupId>$GROUP_ID</groupId>
              <artifactId>$ARTIFACT_ID</artifactId>
              <version>0.1.0-SNAPSHOT</version>
              <name>$ARTIFACT_ID</name>
              <description>Auto-generated Spring Boot project</description>
              <properties>
                  <java.version>21</java.version>
                  <spring-boot.version>$SPRING_BOOT_VERSION</spring-boot.version>
                  <maven.compiler.source>21</maven.compiler.source>
                  <maven.compiler.target>21</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>
              <dependencies>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-web</artifactId>
                  </dependency>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-actuator</artifactId>
                  </dependency>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-data-jpa</artifactId>
                  </dependency>
                  <dependency>
                      <groupId>com.h2database</groupId>
                      <artifactId>h2</artifactId>
                      <scope>runtime</scope>
                  </dependency>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-validation</artifactId>
                  </dependency>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-devtools</artifactId>
                      <scope>runtime</scope>
                      <optional>true</optional>
                  </dependency>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-test</artifactId>
                      <scope>test</scope>
                  </dependency>
                  <dependency>
                      <groupId>org.testcontainers</groupId>
                      <artifactId>junit-jupiter</artifactId>
                      <scope>test</scope>
                  </dependency>
              </dependencies>
              <dependencyManagement>
                  <dependencies>
                      <dependency>
                          <groupId>org.testcontainers</groupId>
                          <artifactId>testcontainers-bom</artifactId>
                          <version>1.19.8</version>
                          <type>pom</type>
                          <scope>import</scope>
                      </dependency>
                  </dependencies>
              </dependencyManagement>
              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.springframework.boot</groupId>
                          <artifactId>spring-boot-maven-plugin</artifactId>
                          <configuration>
                              <excludes>
                                  <exclude>
                                      <groupId>org.springframework.boot</groupId>
                                      <artifactId>spring-boot-devtools</artifactId>
                                  </exclude>
                              </excludes>
                          </configuration>
                      </plugin>
                      <plugin>
                          <groupId>org.codehaus.mojo</groupId>
                          <artifactId>versions-maven-plugin</artifactId>
                          <version>2.16.2</version>
                      </plugin>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.11.0</version>
                          <configuration>
                              <source>21</source>
                              <target>21</target>
                              <encoding>UTF-8</encoding>
                          </configuration>
                      </plugin>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-surefire-plugin</artifactId>
                          <version>3.1.2</version>
                      </plugin>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-failsafe-plugin</artifactId>
                          <version>3.1.2</version>
                      </plugin>
                  </plugins>
              </build>
              <repositories>
                  <repository>
                      <id>central</id>
                      <name>Central Repository</name>
                      <url>https://repo1.maven.org/maven2</url>
                  </repository>
              </repositories>
              <pluginRepositories>
                  <pluginRepository>
                      <id>central</id>
                      <name>Central Repository</name>
                      <url>https://repo1.maven.org/maven2</url>
                  </pluginRepository>
              </pluginRepositories>
          </project>
          EOF
          
          # 디렉토리 구조 생성
          JAVA_DIR="$TARGET_DIR/src/main/java/${PACKAGE_NAME//./\/}"
          TEST_DIR="$TARGET_DIR/src/test/java/${PACKAGE_NAME//./\/}"
          RESOURCES_DIR="$TARGET_DIR/src/main/resources"
          TEST_RESOURCES_DIR="$TARGET_DIR/src/test/resources"
          
          mkdir -p "$JAVA_DIR" "$TEST_DIR" "$RESOURCES_DIR" "$TEST_RESOURCES_DIR"
          mkdir -p "$JAVA_DIR/controller" "$JAVA_DIR/service" "$JAVA_DIR/model" "$JAVA_DIR/repository" "$JAVA_DIR/config"
          
          # Main Application 클래스 생성
          MAIN_CLASS_NAME="$(echo ${ARTIFACT_ID} | sed 's/[^a-zA-Z0-9]//g' | sed 's/^./\U&/')Application"
          cat > "$JAVA_DIR/${MAIN_CLASS_NAME}.java" <<EOF
          package $PACKAGE_NAME;
          
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          import org.springframework.data.jpa.repository.config.EnableJpaAuditing;
          
          @SpringBootApplication
          @EnableJpaAuditing
          public class $MAIN_CLASS_NAME {
              public static void main(String[] args) {
                  SpringApplication.run(${MAIN_CLASS_NAME}.class, args);
              }
          }
          EOF
          
          # REST Controller 생성
          cat > "$JAVA_DIR/controller/HelloController.java" <<EOF
          package $PACKAGE_NAME.controller;
          
          import org.springframework.beans.factory.annotation.Autowired;
          import org.springframework.http.ResponseEntity;
          import org.springframework.web.bind.annotation.*;
          import $PACKAGE_NAME.service.HelloService;
          import $PACKAGE_NAME.model.HelloResponse;
          
          import java.util.Map;
          
          @RestController
          @RequestMapping("/api")
          public class HelloController {
              
              @Autowired
              private HelloService helloService;
          
              @GetMapping("/")
              public ResponseEntity<HelloResponse> hello() {
                  return ResponseEntity.ok(helloService.getHelloMessage());
              }
              
              @GetMapping("/health")
              public ResponseEntity<Map<String, String>> health() {
                  return ResponseEntity.ok(Map.of("status", "UP", "service", "$ARTIFACT_ID"));
              }
              
              @GetMapping("/info")
              public ResponseEntity<Map<String, String>> info() {
                  return ResponseEntity.ok(Map.of(
                      "app", "$ARTIFACT_ID",
                      "version", "1.0.0",
                      "java", System.getProperty("java.version"),
                      "spring-boot", org.springframework.boot.SpringBootVersion.getVersion()
                  ));
              }
          }
          EOF
          
          # Service 클래스 생성
          cat > "$JAVA_DIR/service/HelloService.java" <<EOF
          package $PACKAGE_NAME.service;
          
          import org.springframework.stereotype.Service;
          import $PACKAGE_NAME.model.HelloResponse;
          
          @Service
          public class HelloService {
              
              public HelloResponse getHelloMessage() {
                  return new HelloResponse("Hello from $ARTIFACT_ID!", 
                                         "Spring Boot Application", 
                                         System.currentTimeMillis());
              }
          }
          EOF
          
          # Model 클래스 생성
          cat > "$JAVA_DIR/model/HelloResponse.java" <<EOF
          package $PACKAGE_NAME.model;
          
          import com.fasterxml.jackson.annotation.JsonProperty;
          
          public class HelloResponse {
              
              @JsonProperty("message")
              private String message;
              
              @JsonProperty("description")
              private String description;
              
              @JsonProperty("timestamp")
              private Long timestamp;
              
              public HelloResponse() {}
              
              public HelloResponse(String message, String description, Long timestamp) {
                  this.message = message;
                  this.description = description;
                  this.timestamp = timestamp;
              }
              
              // Getters and Setters
              public String getMessage() { return message; }
              public void setMessage(String message) { this.message = message; }
              
              public String getDescription() { return description; }
              public void setDescription(String description) { this.description = description; }
              
              public Long getTimestamp() { return timestamp; }
              public void setTimestamp(Long timestamp) { this.timestamp = timestamp; }
          }
          EOF
          
          # Configuration 클래스 생성
          cat > "$JAVA_DIR/config/AppConfig.java" <<EOF
          package $PACKAGE_NAME.config;
          
          import org.springframework.context.annotation.Configuration;
          import org.springframework.web.servlet.config.annotation.CorsRegistry;
          import org.springframework.web.servlet.config.annotation.WebMvcConfigurer;
          
          @Configuration
          public class AppConfig implements WebMvcConfigurer {
              
              @Override
              public void addCorsMappings(CorsRegistry registry) {
                  registry.addMapping("/api/**")
                          .allowedOrigins("*")
                          .allowedMethods("GET", "POST", "PUT", "DELETE", "OPTIONS")
                          .allowedHeaders("*");
              }
          }
          EOF
          
          # Test 클래스들 생성
          cat > "$TEST_DIR/${MAIN_CLASS_NAME}Tests.java" <<EOF
          package $PACKAGE_NAME;
          
          import org.junit.jupiter.api.Test;
          import org.springframework.boot.test.context.SpringBootTest;
          import org.springframework.test.context.ActiveProfiles;
          
          @SpringBootTest
          @ActiveProfiles("test")
          class ${MAIN_CLASS_NAME}Tests {
              @Test
              void contextLoads() {
                  // Test passes if application context loads successfully
              }
          }
          EOF
          
          # Controller Test 생성
          cat > "$TEST_DIR/controller/HelloControllerTest.java" <<EOF
          package $PACKAGE_NAME.controller;
          
          import org.junit.jupiter.api.Test;
          import org.springframework.beans.factory.annotation.Autowired;
          import org.springframework.boot.test.autoconfigure.web.servlet.WebMvcTest;
          import org.springframework.boot.test.mock.mockito.MockBean;
          import org.springframework.http.MediaType;
          import org.springframework.test.web.servlet.MockMvc;
          import $PACKAGE_NAME.service.HelloService;
          import $PACKAGE_NAME.model.HelloResponse;
          
          import static org.mockito.Mockito.when;
          import static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.get;
          import static org.springframework.test.web.servlet.result.MockMvcResultMatchers.*;
          
          @WebMvcTest(HelloController.class)
          class HelloControllerTest {
              
              @Autowired
              private MockMvc mockMvc;
              
              @MockBean
              private HelloService helloService;
              
              @Test
              void hello_ShouldReturnHelloResponse() throws Exception {
                  HelloResponse mockResponse = new HelloResponse("Test Message", "Test Description", 12345L);
                  when(helloService.getHelloMessage()).thenReturn(mockResponse);
                  
                  mockMvc.perform(get("/api/"))
                          .andExpect(status().isOk())
                          .andExpect(content().contentType(MediaType.APPLICATION_JSON))
                          .andExpect(jsonPath("\$.message").value("Test Message"));
              }
              
              @Test
              void health_ShouldReturnHealthStatus() throws Exception {
                  mockMvc.perform(get("/api/health"))
                          .andExpect(status().isOk())
                          .andExpect(content().contentType(MediaType.APPLICATION_JSON))
                          .andExpect(jsonPath("\$.status").value("UP"));
              }
          }
          EOF
          
          # Service Test 생성
          cat > "$TEST_DIR/service/HelloServiceTest.java" <<EOF
          package $PACKAGE_NAME.service;
          
          import org.junit.jupiter.api.Test;
          import org.junit.jupiter.api.extension.ExtendWith;
          import org.mockito.InjectMocks;
          import org.mockito.junit.jupiter.MockitoExtension;
          import $PACKAGE_NAME.model.HelloResponse;
          
          import static org.junit.jupiter.api.Assertions.*;
          
          @ExtendWith(MockitoExtension.class)
          class HelloServiceTest {
              
              @InjectMocks
              private HelloService helloService;
              
              @Test
              void getHelloMessage_ShouldReturnValidResponse() {
                  HelloResponse response = helloService.getHelloMessage();
                  
                  assertNotNull(response);
                  assertTrue(response.getMessage().contains("Hello from"));
                  assertNotNull(response.getDescription());
                  assertNotNull(response.getTimestamp());
              }
          }
          EOF
          
          # application.properties 생성
          cat > "$RESOURCES_DIR/application.properties" <<EOF
          # Application Configuration
          spring.application.name=$ARTIFACT_ID
          server.port=8080
          server.servlet.context-path=/
          
          # Database Configuration (H2 in-memory for demo)
          spring.datasource.url=jdbc:h2:mem:testdb
          spring.datasource.driver-class-name=org.h2.Driver
          spring.datasource.username=sa
          spring.datasource.password=password
          
          # JPA Configuration
          spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
          spring.jpa.hibernate.ddl-auto=create-drop
          spring.jpa.show-sql=true
          spring.jpa.properties.hibernate.format_sql=true
          
          # H2 Console (for development)
          spring.h2.console.enabled=true
          spring.h2.console.path=/h2-console
          
          # Actuator Configuration
          management.endpoints.web.exposure.include=health,info,metrics,prometheus
          management.endpoint.health.show-details=when-authorized
          management.endpoint.health.probes.enabled=true
          management.health.livenessstate.enabled=true
          management.health.readinessstate.enabled=true
          
          # Logging Configuration
          logging.level.${PACKAGE_NAME}=INFO
          logging.level.org.springframework.web=DEBUG
          logging.level.org.hibernate.SQL=DEBUG
          logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
          logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
          
          # DevTools
          spring.devtools.restart.enabled=true
          spring.devtools.livereload.enabled=true
          EOF
          
          # application-test.properties for test profile
          cat > "$TEST_RESOURCES_DIR/application-test.properties" <<EOF
          # Test Configuration
          spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          spring.jpa.hibernate.ddl-auto=create-drop
          spring.jpa.show-sql=false
          logging.level.root=WARN
          logging.level.${PACKAGE_NAME}=INFO
          EOF
          
          # .gitignore 생성
          cat > "$TARGET_DIR/.gitignore" <<EOF
          # Compiled class file
          *.class
          
          # Log file
          *.log
          
          # BlueJ files
          *.ctxt
          
          # Mobile Tools for Java (J2ME)
          .mtj.tmp/
          
          # Package Files #
          *.jar
          *.war
          *.nar
          *.ear
          *.zip
          *.tar.gz
          *.rar
          
          # virtual machine crash logs
          hs_err_pid*
          
          # Maven
          target/
          !.mvn/wrapper/maven-wrapper.jar
          !**/src/main/**/target/
          !**/src/test/**/target/
          
          # IntelliJ IDEA
          .idea
          *.iws
          *.iml
          *.ipr
          
          # Eclipse
          .apt_generated
          .classpath
          .factorypath
          .project
          .settings
          .springBeans
          .sts4-cache
          
          # NetBeans
          /nbproject/private/
          /nbbuild/
          /dist/
          /nbdist/
          /.nb-gradle/
          build/
          !**/src/main/**/build/
          !**/src/test/**/build/
          
          # VS Code
          .vscode/
          
          # Mac
          .DS_Store
          
          # Windows
          Thumbs.db
          ehthumbs.db
          Desktop.ini
          
          # Application-specific
          application-local.properties
          /logs/
          
          # H2 Database files
          *.db
          *.trace.db
          *.lock.db
          EOF
          
          # README.md 생성
          cat > "$TARGET_DIR/README.md" <<EOF
          # $ARTIFACT_ID
          
          Auto-generated Spring Boot application with comprehensive setup.
          
          ## Features
          
          - Spring Boot $SPRING_BOOT_VERSION
          - Java 21
          - Spring Web (REST API)
          - Spring Data JPA with H2 Database
          - Spring Boot Actuator (Health checks, metrics)
          - Spring Boot DevTools (Hot reload)
          - Comprehensive test setup with JUnit 5 and Mockito
          - Docker support
          - GitHub Actions CI/CD
          
          ## API Endpoints
          
          - \`GET /api/\` - Hello message
          - \`GET /api/health\` - Application health status
          - \`GET /api/info\` - Application information
          - \`GET /actuator/health\` - Actuator health endpoint
          - \`GET /h2-console\` - H2 Database console (development only)
          
          ## Running the Application
          
          ### Prerequisites
          - Java 21
          - Maven 3.6+
          
          ### Local Development
          \`\`\`bash
          ./mvnw spring-boot:run
          \`\`\`
          
          ### Testing
          \`\`\`bash
          ./mvnw test
          \`\`\`
          
          ### Building
          \`\`\`bash
          ./mvnw clean package
          \`\`\`
          
          ### Docker
          \`\`\`bash
          docker build -t $ARTIFACT_ID .
          docker run -p 8080:8080 $ARTIFACT_ID
          \`\`\`
          
          ## Configuration
          
          Application can be configured via \`application.properties\` or environment variables.
          
          ## Development
          
          The application uses Spring Boot DevTools for hot reloading during development.
          
          ## Production Deployment
          
          The application includes production-ready features:
          - Health checks via Actuator
          - Metrics and monitoring endpoints
          - Structured logging
