name: 🏦 echo 기반 금융 자동화/빌드 통합 (모든 파일 echo로 생성)

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

jobs:
  echo-all-in-one:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 디렉토리 및 로그 echo 생성
        run: |
          for d in \
            .github/ts_bin \
            .github/mvn_install \
            .github/springboot_projects/src/main/java/com/fin/springboot \
            .github/echo_upgrade \
            .github/echo_result \
            .github/echo_compile \
            .github/echo_run \
            .github/ts_projects \
            .github/js_projects \
            .github/java_projects/src/main/java/com/fin/example \
            .github/springboot_logs \
            .github/java_build \
            .github/js_backup \
            .github/ts_backup \
            .github/ts_dist_backup \
            .github/springboot_backup \
            .github/springboot_build \
            .github/springboot_multi/app-api \
            .github/springboot_multi/app-web \
            .github/springboot_multi/app-core \
            ; do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo_upgrade/echo_dir.log
            mkdir -p "$d"
          done

      - name: 🛠️ 언어/빌드툴 설치 및 버전 echo
        run: |
          set -e
          echo "echo 'sudo apt-get update -y'" | tee -a .github/echo_upgrade/echo_pkg.log
          sudo apt-get update -y
          echo "echo 'sudo apt-get install -y curl gnupg2 zip unzip wget'" | tee -a .github/echo_upgrade/echo_pkg.log
          sudo apt-get install -y curl gnupg2 zip unzip wget
          echo "echo 'curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -'" | tee -a .github/echo_upgrade/echo_pkg.log
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          echo "echo 'sudo apt-get install -y nodejs'" | tee -a .github/echo_upgrade/echo_pkg.log
          sudo apt-get install -y nodejs
          echo "echo 'sudo npm install -g npm@latest'" | tee -a .github/echo_upgrade/echo_pkg.log
          sudo npm install -g npm@latest
          echo "echo 'sudo npm install -g typescript@latest'" | tee -a .github/echo_upgrade/echo_pkg.log
          sudo npm install -g typescript@latest
          echo "echo 'sudo apt-get install -y openjdk-17-jdk'" | tee -a .github/echo_upgrade/echo_pkg.log
          sudo apt-get install -y openjdk-17-jdk
          echo "echo 'sudo apt-get install -y maven'" | tee -a .github/echo_upgrade/echo_pkg.log
          sudo apt-get install -y maven
          node -v | tee .github/echo_upgrade/node_version.txt
          npm -v  | tee .github/echo_upgrade/npm_version.txt
          tsc -v | tee .github/echo_upgrade/tsc_upgrade.txt
          java -version 2>&1 | tee .github/echo_upgrade/java_version.txt
          mvn -version | tee .github/echo_upgrade/mvn_version.txt
          for f in node npm tsc java mvn; do
            FPATH="$(which $f)"
            if [ -x "$FPATH" ]; then
              echo "echo 'cp -a $FPATH .github/ts_bin/$(basename $FPATH)'" | tee -a .github/echo_upgrade/echo_cp.log
              cp -a "$FPATH" ".github/ts_bin/$(basename $FPATH)"
              echo "echo 'cp -a $FPATH .github/mvn_install/$(basename $FPATH)'" | tee -a .github/echo_upgrade/echo_cp.log
              cp -a "$FPATH" ".github/mvn_install/$(basename $FPATH)"
              echo "echo 'cp -a $FPATH .github/springboot_projects/$(basename $FPATH)'" | tee -a .github/echo_upgrade/echo_cp.log
              cp -a "$FPATH" ".github/springboot_projects/$(basename $FPATH)"
            fi
          done
          # Spring Boot CLI
          set +e
          SPRINGBOOT_VER=$(curl -s https://api.github.com/repos/spring-projects/spring-boot/releases/latest | grep tag_name | cut -d'"' -f4 | tr -d 'v')
          echo "echo 'wget -q https://repo.spring.io/release/org/springframework/boot/spring-boot-cli/${SPRINGBOOT_VER}/spring-boot-cli-${SPRINGBOOT_VER}-bin.zip'" | tee -a .github/echo_upgrade/echo_pkg.log
          wget -q "https://repo.spring.io/release/org/springframework/boot/spring-boot-cli/${SPRINGBOOT_VER}/spring-boot-cli-${SPRINGBOOT_VER}-bin.zip" -O /tmp/springboot.zip
          if [ -s /tmp/springboot.zip ]; then
            echo "echo 'unzip -o /tmp/springboot.zip -d /tmp/springboot_cli'" | tee -a .github/echo_upgrade/echo_pkg.log
            unzip -o /tmp/springboot.zip -d /tmp/springboot_cli
            echo "echo 'sudo cp -a /tmp/springboot_cli/spring-boot-cli-*/* /usr/local/'" | tee -a .github/echo_upgrade/echo_pkg.log
            sudo cp -a /tmp/springboot_cli/spring-boot-cli-*/* /usr/local/
            ln -sf /usr/local/bin/spring /usr/local/bin/springboot || true
            spring --version | tee .github/echo_upgrade/springboot_cli_version.txt
          else
            echo "[ERROR] Spring Boot CLI 다운로드 실패, gradle 빌드로 fallback" | tee .github/echo_upgrade/springboot_cli_error.txt
          fi
          set -e

      - name: 📄 모든 코드/설정 파일 echo로 생성
        run: |
          # TypeScript 프로젝트
          echo "echo \"console.log('Hello, TypeScript!')\" > .github/ts_projects/hello.ts" | tee -a .github/echo_compile/ts_echo.txt
          echo "console.log('Hello, TypeScript!')" > .github/ts_projects/hello.ts
          echo "echo \"export function greet(name: string) { return 'Hello, ' + name + '!'; }\" > .github/ts_projects/greet.ts" | tee -a .github/echo_compile/ts_echo.txt
          echo "export function greet(name: string) { return 'Hello, ' + name + '!'; }" > .github/ts_projects/greet.ts
          echo "echo \"import { greet } from './greet'; console.log(greet('SpringBoot+MultiModule 자동화!'));\" > .github/ts_projects/main.ts" | tee -a .github/echo_compile/ts_echo.txt
          echo "import { greet } from './greet'; console.log(greet('SpringBoot+MultiModule 자동화!'));" > .github/ts_projects/main.ts

          echo "echo '{' > .github/ts_projects/tsconfig.json" | tee -a .github/echo_compile/ts_echo.txt
          echo '{' > .github/ts_projects/tsconfig.json
          echo "echo '  \"compilerOptions\": {' >> .github/ts_projects/tsconfig.json" | tee -a .github/echo_compile/ts_echo.txt
          echo '  "compilerOptions": {' >> .github/ts_projects/tsconfig.json
          echo "echo '    \"target\": \"es6\",' >> .github/ts_projects/tsconfig.json" | tee -a .github/echo_compile/ts_echo.txt
          echo '    "target": "es6",' >> .github/ts_projects/tsconfig.json
          echo "echo '    \"module\": \"commonjs\",' >> .github/ts_projects/tsconfig.json" | tee -a .github/echo_compile/ts_echo.txt
          echo '    "module": "commonjs",' >> .github/ts_projects/tsconfig.json
          echo "echo '    \"outDir\": \"./dist\",' >> .github/ts_projects/tsconfig.json" | tee -a .github/echo_compile/ts_echo.txt
          echo '    "outDir": "./dist",' >> .github/ts_projects/tsconfig.json
          echo "echo '    \"strict\": true,' >> .github/ts_projects/tsconfig.json" | tee -a .github/echo_compile/ts_echo.txt
          echo '    "strict": true,' >> .github/ts_projects/tsconfig.json
          echo "echo '    \"esModuleInterop\": true' >> .github/ts_projects/tsconfig.json" | tee -a .github/echo_compile/ts_echo.txt
          echo '    "esModuleInterop": true' >> .github/ts_projects/tsconfig.json
          echo "echo '  },' >> .github/ts_projects/tsconfig.json" | tee -a .github/echo_compile/ts_echo.txt
          echo '  },' >> .github/ts_projects/tsconfig.json
          echo "echo '  \"include\": [\"*.ts\"]' >> .github/ts_projects/tsconfig.json" | tee -a .github/echo_compile/ts_echo.txt
          echo '  "include": ["*.ts"]' >> .github/ts_projects/tsconfig.json
          echo "echo '}' >> .github/ts_projects/tsconfig.json" | tee -a .github/echo_compile/ts_echo.txt
          echo '}' >> .github/ts_projects/tsconfig.json

          # JavaScript 프로젝트
          echo "echo \"console.log('Hello, JavaScript! (SpringBoot+MultiModule)');\" > .github/js_projects/hello.js" | tee -a .github/echo_compile/js_echo.txt
          echo "console.log('Hello, JavaScript! (SpringBoot+MultiModule)');" > .github/js_projects/hello.js
          echo "echo \"function sum(a, b) { return a+b; } console.log('Sum:', sum(8,12));\" > .github/js_projects/sum.js" | tee -a .github/echo_compile/js_echo.txt
          echo "function sum(a, b) { return a+b; } console.log('Sum:', sum(8,12));" > .github/js_projects/sum.js

          # Java 최소 POM.xml
          echo "echo '<project xmlns=\"http://maven.apache.org/POM/4.0.0\" ' > .github/java_projects/pom.xml" | tee -a .github/echo_compile/java_echo.txt
          echo '<project xmlns="http://maven.apache.org/POM/4.0.0"' > .github/java_projects/pom.xml
          echo "echo '         xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"' >> .github/java_projects/pom.xml" | tee -a .github/echo_compile/java_echo.txt
          echo '         xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"' >> .github/java_projects/pom.xml
          echo "echo '         xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\">' >> .github/java_projects/pom.xml" | tee -a .github/echo_compile/java_echo.txt
          echo '         xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">' >> .github/java_projects/pom.xml
          echo "echo '  <modelVersion>4.0.0</modelVersion>' >> .github/java_projects/pom.xml" | tee -a .github/echo_compile/java_echo.txt
          echo '  <modelVersion>4.0.0</modelVersion>' >> .github/java_projects/pom.xml
          echo "echo '  <groupId>com.fin</groupId>' >> .github/java_projects/pom.xml" | tee -a .github/echo_compile/java_echo.txt
          echo '  <groupId>com.fin</groupId>' >> .github/java_projects/pom.xml
          echo "echo '  <artifactId>example</artifactId>' >> .github/java_projects/pom.xml" | tee -a .github/echo_compile/java_echo.txt
          echo '  <artifactId>example</artifactId>' >> .github/java_projects/pom.xml
          echo "echo '  <version>1.0-SNAPSHOT</version>' >> .github/java_projects/pom.xml" | tee -a .github/echo_compile/java_echo.txt
          echo '  <version>1.0-SNAPSHOT</version>' >> .github/java_projects/pom.xml
          echo "echo '</project>' >> .github/java_projects/pom.xml" | tee -a .github/echo_compile/java_echo.txt
          echo '</project>' >> .github/java_projects/pom.xml

          # Java 코드
          echo "echo 'package com.fin.example;' > .github/java_projects/src/main/java/com/fin/example/Main.java" | tee -a .github/echo_compile/java_echo.txt
          echo 'package com.fin.example;' > .github/java_projects/src/main/java/com/fin/example/Main.java
          echo "echo 'public class Main {' >> .github/java_projects/src/main/java/com/fin/example/Main.java" | tee -a .github/echo_compile/java_echo.txt
          echo 'public class Main {' >> .github/java_projects/src/main/java/com/fin/example/Main.java
          echo "echo '  public static void main(String[] args) {' >> .github/java_projects/src/main/java/com/fin/example/Main.java" | tee -a .github/echo_compile/java_echo.txt
          echo '  public static void main(String[] args) {' >> .github/java_projects/src/main/java/com/fin/example/Main.java
          echo "echo '    System.out.println(\"금융 Java 빌드(SpringBoot, 멀티모듈)\");' >> .github/java_projects/src/main/java/com/fin/example/Main.java" | tee -a .github/echo_compile/java_echo.txt
          echo '    System.out.println("금융 Java 빌드(SpringBoot, 멀티모듈)");' >> .github/java_projects/src/main/java/com/fin/example/Main.java
          echo "echo '  }' >> .github/java_projects/src/main/java/com/fin/example/Main.java" | tee -a .github/echo_compile/java_echo.txt
          echo '  }' >> .github/java_projects/src/main/java/com/fin/example/Main.java
          echo "echo '}' >> .github/java_projects/src/main/java/com/fin/example/Main.java" | tee -a .github/echo_compile/java_echo.txt
          echo '}' >> .github/java_projects/src/main/java/com/fin/example/Main.java

          # SpringBoot build.gradle (최소/실행가능)
          echo "echo 'plugins {' > .github/springboot_projects/build.gradle" | tee -a .github/echo_compile/spring_echo.txt
          echo "plugins {" > .github/springboot_projects/build.gradle
          echo "  id 'org.springframework.boot' version '3.2.6'" >> .github/springboot_projects/build.gradle
          echo "  id 'java'" >> .github/springboot_projects/build.gradle
          echo "}" >> .github/springboot_projects/build.gradle
          echo "repositories { mavenCentral() }" >> .github/springboot_projects/build.gradle
          echo "dependencies {" >> .github/springboot_projects/build.gradle
          echo "  implementation 'org.springframework.boot:spring-boot-starter'" >> .github/springboot_projects/build.gradle
          echo "  testImplementation 'org.springframework.boot:spring-boot-starter-test'" >> .github/springboot_projects/build.gradle
          echo "}" >> .github/springboot_projects/build.gradle

          # SpringBoot settings.gradle
          echo "echo \"rootProject.name = 'springboot-sample'\" > .github/springboot_projects/settings.gradle" | tee -a .github/echo_compile/spring_echo.txt
          echo "rootProject.name = 'springboot-sample'" > .github/springboot_projects/settings.gradle

          # SpringBoot Application
          echo "echo 'package com.fin.springboot;' > .github/springboot_projects/src/main/java/com/fin/springboot/Application.java" | tee -a .github/echo_compile/spring_echo.txt
          echo 'package com.fin.springboot;' > .github/springboot_projects/src/main/java/com/fin/springboot/Application.java
          echo "echo 'import org.springframework.boot.SpringApplication;' >> .github/springboot_projects/src/main/java/com/fin/springboot/Application.java" | tee -a .github/echo_compile/spring_echo.txt
          echo 'import org.springframework.boot.SpringApplication;' >> .github/springboot_projects/src/main/java/com/fin/springboot/Application.java
          echo "echo 'import org.springframework.boot.autoconfigure.SpringBootApplication;' >> .github/springboot_projects/src/main/java/com/fin/springboot/Application.java" | tee -a .github/echo_compile/spring_echo.txt
          echo 'import org.springframework.boot.autoconfigure.SpringBootApplication;' >> .github/springboot_projects/src/main/java/com/fin/springboot/Application.java
          echo "echo '@SpringBootApplication' >> .github/springboot_projects/src/main/java/com/fin/springboot/Application.java" | tee -a .github/echo_compile/spring_echo.txt
          echo '@SpringBootApplication' >> .github/springboot_projects/src/main/java/com/fin/springboot/Application.java
          echo "echo 'public class Application {' >> .github/springboot_projects/src/main/java/com/fin/springboot/Application.java" | tee -a .github/echo_compile/spring_echo.txt
          echo 'public class Application {' >> .github/springboot_projects/src/main/java/com/fin/springboot/Application.java
          echo "echo '  public static void main(String[] args) {' >> .github/springboot_projects/src/main/java/com/fin/springboot/Application.java" | tee -a .github/echo_compile/spring_echo.txt
          echo '  public static void main(String[] args) {' >> .github/springboot_projects/src/main/java/com/fin/springboot/Application.java
          echo "echo '    SpringApplication.run(Application.class, args);' >> .github/springboot_projects/src/main/java/com/fin/springboot/Application.java" | tee -a .github/echo_compile/spring_echo.txt
          echo '    SpringApplication.run(Application.class, args);' >> .github/springboot_projects/src/main/java/com/fin/springboot/Application.java
          echo "echo '  }' >> .github/springboot_projects/src/main/java/com/fin/springboot/Application.java" | tee -a .github/echo_compile/spring_echo.txt
          echo '  }' >> .github/springboot_projects/src/main/java/com/fin/springboot/Application.java
          echo "echo '}' >> .github/springboot_projects/src/main/java/com/fin/springboot/Application.java" | tee -a .github/echo_compile/spring_echo.txt
          echo '}' >> .github/springboot_projects/src/main/java/com/fin/springboot/Application.java

          # 멀티모듈 샘플 (필요시 확장 가능)
          echo "echo 'plugins { id \"org.springframework.boot\" version \"3.2.6\" }' > .github/springboot_multi/app-api/build.gradle" | tee -a .github/echo_compile/multi_echo.txt
          echo 'plugins { id "org.springframework.boot" version "3.2.6" }' > .github/springboot_multi/app-api/build.gradle
          echo "echo 'plugins { id \"java\" }' > .github/springboot_multi/app-core/build.gradle" | tee -a .github/echo_compile/multi_echo.txt
          echo 'plugins { id "java" }' > .github/springboot_multi/app-core/build.gradle
          echo "echo 'plugins { id \"java\" }' > .github/springboot_multi/app-web/build.gradle" | tee -a .github/echo_compile/multi_echo.txt
          echo 'plugins { id "java" }' > .github/springboot_multi/app-web/build.gradle

          echo "echo 'rootProject.name = \"springboot-multi\"' > .github/springboot_multi/settings.gradle" | tee -a .github/echo_compile/multi_echo.txt
          echo 'rootProject.name = "springboot-multi"' > .github/springboot_multi/settings.gradle
