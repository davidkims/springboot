name: DB CLI & Virtual Account Robust Automation (IBM DB2 Official Client 포함, DB echo 샘플 robust)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  db-cli-virtual-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DBCLI_DIR: .github/dbcli
      OUTPUT_DIR: .github/dbcli/output
      VA_DIR: .github/dbcli/virtual_accounts
      ORDER_DIR: .github/dbcli/orders
      USER_DIR: .github/dbcli/users
      TMP_SAFE_DIR: /tmp/dbcli_safe_tmp
      DB2_CLI_URL: "https://public.dhe.ibm.com/ibmdl/export/pub/software/data/db2/drivers/odbc_cli/linuxx64_odbc_cli.tar.gz"
      DB2_CLI_DIR: /opt/ibm/db2_cli
      MIN_FREE_MB: 500

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 📂 Robust Directory & Sample/User/DB/Echo File Infinite Creation (용량체크)
        run: |
          check_free() {
            DIR="$1"
            MB=$(df -Pm "$DIR" | awk 'NR==2 {print $4}')
            if [ "$MB" -lt "$MIN_FREE_MB" ]; then
              echo "[❗][용량] $DIR 디스크 여유 $MB MB → $MIN_FREE_MB MB 이상 필요, 10초 후 재시도"
              df -h "$DIR"
              sleep 10
              return 1
            else
              echo "[✅][용량] $DIR 여유 $MB MB"
              return 0
            fi
          }
          robust_mkdir() {
            TARGET="$1"
            while true; do
              check_free "$TARGET" || continue
              mkdir -p "$TARGET" && chmod 700 "$TARGET" && echo "[✅][∞] $TARGET 생성 성공" && break
              echo "[⚠️][∞] $TARGET 생성 실패 (재시도)"
              sleep 1
            done
          }
          robust_echo() {
            CONTENT="$1"
            TARGET="$2"
            while true; do
              DIR=$(dirname "$TARGET")
              check_free "$DIR" || continue
              echo "$CONTENT" > "$TARGET" && chmod 600 "$TARGET" && echo "[✅][∞] $TARGET 파일 생성 성공" && break
              echo "[⚠️][∞] $TARGET 파일 생성 실패 (재시도)"
              sleep 1
            done
          }

          # DB/SCRIPT/더미 robust echo/파일 생성
          for DB in mysql mariadb postgresql sqlite redis clickhouse firebird db2; do
            robust_mkdir "$DBCLI_DIR/$DB"
          done
          robust_mkdir "$OUTPUT_DIR"
          robust_mkdir "$VA_DIR"
          robust_mkdir "$TMP_SAFE_DIR"
          robust_mkdir "$ORDER_DIR"
          robust_mkdir "$USER_DIR"

          # 샘플 SQL, dummy DB 파일 robust echo
          robust_echo "SELECT VERSION();"        $DBCLI_DIR/mysql/demo.sql
          robust_echo "SELECT VERSION();"        $DBCLI_DIR/mariadb/demo.sql
          robust_echo "SELECT version();"        $DBCLI_DIR/postgresql/demo.sql
          robust_echo "SELECT sqlite_version();" $DBCLI_DIR/sqlite/demo.sql
          robust_echo "PING"                     $DBCLI_DIR/redis/demo.redis
          echo "INFO" >> $DBCLI_DIR/redis/demo.redis; chmod 600 $DBCLI_DIR/redis/demo.redis
          robust_echo "SELECT version();"        $DBCLI_DIR/clickhouse/demo.sql
          robust_echo "SELECT * FROM RDB$DATABASE;" $DBCLI_DIR/firebird/demo.sql
          robust_echo "SELECT service_level, fixpack_num FROM sysibmadm.env_inst_info;" $DBCLI_DIR/db2/demo.sql

          # robust echo: DB 더미 파일/스크립트도 생성
          for DB in mysql mariadb postgresql sqlite clickhouse firebird db2; do
            robust_echo "-- dummy database for $DB" "$DBCLI_DIR/$DB/dummy_db.sql"
            robust_touch "$DBCLI_DIR/$DB/dummy.db"
          done

          # output 더미 파일 robust echo
          for DB in mysql mariadb postgresql sqlite redis clickhouse firebird db2; do
            robust_echo "[dummy output]" "$OUTPUT_DIR/${DB}_dummy.out"
          done

          robust_echo "user_id,user_name,permission,enabled" "$USER_DIR/users.csv"
          robust_echo "U001,홍길동,ADMIN,1" "$USER_DIR/users.csv"
          robust_echo "U002,김철수,USER,1" "$USER_DIR/users.csv"
          robust_echo "U003,이영희,USER,0" "$USER_DIR/users.csv"

          echo "[🧹][∞] 기존 가상계좌 파일 전체 삭제"
          rm -f $VA_DIR/virtual_accounts_*.txt
          TS=$(date '+%Y%m%d_%H%M%S')
          VA_FILE="$TMP_SAFE_DIR/virtual_accounts_${TS}_$$.txt"
          robust_echo "account_id,account_number,customer_name,bank_code,open_date" "$VA_FILE"
          for i in $(seq 1 10000); do
            ACC_NUM="7000$(printf '%07d' $i)"
            CUST="User$(printf '%05d' $i)"
            BANK="B$(printf '%04d' $((1000 + ($i % 9000))))"
            DATE="$(date '+%Y-%m-%d')"
            echo "VA${i},${ACC_NUM},${CUST},${BANK},${DATE}" >> "$VA_FILE"
          done
          chmod 600 "$VA_FILE"
          mv "$VA_FILE" "$VA_DIR/"
          echo "[✅][∞] $VA_FILE → $VA_DIR 이동 및 권한 최소화"
          ls -lh $VA_DIR/virtual_accounts_*.txt
          rm -rf $TMP_SAFE_DIR

      - name: 🏃 DB CLI Install & Run Infinite Retry (IBM DB2 공식 CLI, Firebird robust)
        run: |
          export PATH="$PATH:$DB2_CLI_DIR/clidriver/bin"
          MIN_FREE_MB=500
          check_free() {
            DIR="$1"
            MB=$(df -Pm "$DIR" | awk 'NR==2 {print $4}')
            if [ "$MB" -lt "$MIN_FREE_MB" ]; then
              echo "[❗][용량] $DIR 디스크 여유 $MB MB → $MIN_FREE_MB MB 이상 필요, 10초 후 재시도"
              df -h "$DIR"
              sleep 10
              return 1
            else
              echo "[✅][용량] $DIR 여유 $MB MB"
              return 0
            fi
          }
          robust_mkdir() {
            TARGET="$1"
            while true; do
              check_free "$TARGET" || continue
              mkdir -p "$TARGET" && chmod 700 "$TARGET" && break
              sleep 1
            done
          }
          robust_touch() {
            FILE="$1"
            DIR=$(dirname "$FILE")
            robust_mkdir "$DIR"
            while true; do
              check_free "$DIR" || continue
              touch "$FILE" && chmod 600 "$FILE" && break
              sleep 1
            done
          }
          is_service_pkg() {
            case "$1" in
              mysql-client|mariadb-client|postgresql-client|redis-tools|clickhouse-client|firebird-utils) return 0 ;;
              *) return 1 ;;
            esac
          }
          retry_install_infinite() {
            PKG="$1"
            CMD="$2"
            DESC="$3"
            while true; do
              check_free "/" || continue
              echo "[🔁][∞] $PKG 설치 시도 (999999999999%)"
              sudo apt-get update -y
              sudo apt-get install -y "$PKG" && command -v "$CMD" && echo "[✅][∞] $PKG ($DESC) 설치 성공"
              if command -v "$CMD" > /dev/null; then
                if is_service_pkg "$PKG"; then
                  echo "[🔄][∞] $PKG 설치 후 systemctl daemon-reload"
                  sudo systemctl daemon-reload && echo "[✅][∞] systemctl daemon-reload 성공" || echo "[❗][∞] systemctl daemon-reload 실패"
                fi
                break
              fi
              echo "[⚠️][∞] $PKG ($DESC) 설치 실패 (재시도)"
              sleep 1
            done
          }

          # IBM DB2 공식 CLI robust 설치
          robust_mkdir "$DB2_CLI_DIR"
          DB2_STATUS=0
          if [ ! -x "$DB2_CLI_DIR/clidriver/bin/db2cli" ]; then
            while true; do
              check_free "$DB2_CLI_DIR" || continue
              echo "[🔽][∞] IBM DB2 ODBC CLI 드라이버 tarball 다운로드"
              curl -LfsS "$DB2_CLI_URL" -o /tmp/db2cli.tar.gz && break || (echo "[⚠️][∞] 다운로드 실패, 재시도" && sleep 5)
            done
            tar -xzf /tmp/db2cli.tar.gz -C "$DB2_CLI_DIR" --strip-components=1 && \
            chmod +x $DB2_CLI_DIR/clidriver/bin/db2cli && echo "[✅][∞] IBM DB2 CLI 드라이버 설치 성공" || DB2_STATUS=1
            export PATH="$PATH:$DB2_CLI_DIR/clidriver/bin"
            rm -f /tmp/db2cli.tar.gz
          fi
          echo "$PATH" | grep "$DB2_CLI_DIR/clidriver/bin" || export PATH="$PATH:$DB2_CLI_DIR/clidriver/bin"
          which db2cli && db2cli validate -version || echo "[info] DB2 CLI 설치 확인불가"

          run_or_generate_and_retry_infinite() {
            PKG="$1"
            CMD="$2"
            DESC="$3"
            FILE="$4"
            GEN="$5"
            OUT="$6"
            robust_mkdir "$(dirname "$OUT")"
            robust_touch "$OUT"
            while [ ! -f "$FILE" ]; do
              DIR=$(dirname "$FILE")
              check_free "$DIR" || continue
              echo "[🔁][∞] $DESC 샘플 파일 없음. 안전 임시파일 생성"
              eval "$GEN > \$FILE" && chmod 600 "$FILE" && echo "[✅][∞] $FILE 생성 성공" && break
              echo "[⚠️][∞] $FILE 생성 실패 (재시도)"
              sleep 1
            done
            if [ "$DESC" = "DB2" ]; then
              if [ -x "$DB2_CLI_DIR/clidriver/bin/db2cli" ]; then
                "$DB2_CLI_DIR/clidriver/bin/db2cli" validate -version > "$OUT" 2>&1
                echo "[info] 실제 DB2 샘플 쿼리 실행은 별도 DB연결 필요, output은 버전 확인 결과만 기록됨." >> "$OUT"
                chmod 600 "$OUT"
              else
                echo "[❌][∞] IBM DB2 CLI 드라이버 설치 실패 또는 미지원 플랫폼" > "$OUT"
                echo "[info] DB2 CLI는 https://www.ibm.com/docs/en/db2/11.5?topic=drivers-db2-odbc-cli-driver 참고" >> "$OUT"
                chmod 600 "$OUT"
              fi
              return
            fi
            if ! command -v "$CMD" > /dev/null; then
              check_free "/" || continue
              echo "[AUTO][∞] $CMD 미설치. 무한 재시도 설치"
              retry_install_infinite "$PKG" "$CMD" "$DESC"
            fi
            if command -v "$CMD" > /dev/null && [ -f "$FILE" ]; then
              if [ "$CMD" = "isql-fb" ]; then
                echo "[⚠️][∞] Firebird isql-fb는 --version 미지원. 직접 DB 연결 없이 테스트 생략. (출력 빈파일 robust 생성)"
                echo "[info] Firebird CLI 샘플은 연결정보 필요. 실행 생략됨." > "$OUT"
                chmod 600 "$OUT"
              else
                $CMD --version || true
                case "$CMD" in
                  mysql|mariadb)
                    sudo $CMD -u root < "$FILE" > "$OUT" 2>&1 || echo "[⚠️][∞] $DESC 실행 실패"
                    ;;
                  psql)
                    sudo -u postgres psql -f "$FILE" > "$OUT" 2>&1 || echo "[⚠️][∞] PostgreSQL 실행 실패"
                    ;;
                  sqlite3)
                    sqlite3 :memory: < "$FILE" > "$OUT" 2>&1 || echo "[⚠️][∞] SQLite 실행 실패"
                    ;;
                  redis-cli)
                    while read line; do redis-cli $line; done < "$FILE" > "$OUT" 2>&1 || echo "[⚠️][∞] Redis 실행 실패"
                    ;;
                  clickhouse-client)
                    clickhouse-client --multiquery < "$FILE" > "$OUT" 2>&1 || echo "[⚠️][∞] ClickHouse 실행 실패"
                    ;;
                esac
                chmod 600 "$OUT"
              fi
            else
              echo "[❌][∞] $DESC 실행불가(설치/샘플파일 모두 없음)"
              echo "[info] 실행불가" > "$OUT"
              chmod 600 "$OUT"
            fi
          }
          run_or_generate_and_retry_infinite "mysql-client" "mysql" "MySQL" "$DBCLI_DIR/mysql/demo.sql" "echo 'SELECT VERSION();'" "$OUTPUT_DIR/mysql_demo.out"
          run_or_generate_and_retry_infinite "mariadb-client" "mariadb" "MariaDB" "$DBCLI_DIR/mariadb/demo.sql" "echo 'SELECT VERSION();'" "$OUTPUT_DIR/mariadb_demo.out"
          run_or_generate_and_retry_infinite "postgresql-client" "psql" "PostgreSQL" "$DBCLI_DIR/postgresql/demo.sql" "echo 'SELECT version();'" "$OUTPUT_DIR/psql_demo.out"
          run_or_generate_and_retry_infinite "sqlite3" "sqlite3" "SQLite" "$DBCLI_DIR/sqlite/demo.sql" "echo 'SELECT sqlite_version();'" "$OUTPUT_DIR/sqlite_demo.out"
          run_or_generate_and_retry_infinite "redis-tools" "redis-cli" "Redis" "$DBCLI_DIR/redis/demo.redis" "echo -e 'PING\nINFO'" "$OUTPUT_DIR/redis_demo.out"
          run_or_generate_and_retry_infinite "clickhouse-client" "clickhouse-client" "ClickHouse" "$DBCLI_DIR/clickhouse/demo.sql" "echo 'SELECT version();'" "$OUTPUT_DIR/clickhouse_demo.out"
          run_or_generate_and_retry_infinite "firebird-utils" "isql-fb" "Firebird" "$DBCLI_DIR/firebird/demo.sql" "echo 'SELECT * FROM RDB\$DATABASE;'" "$OUTPUT_DIR/firebird_demo.out"
          run_or_generate_and_retry_infinite "" "" "DB2" "$DBCLI_DIR/db2/demo.sql" "echo 'SELECT service_level, fixpack_num FROM sysibmadm.env_inst_info;'" "$OUTPUT_DIR/db2_demo.out"

          find /tmp -maxdepth 1 -type d -name "dbcli_safe_tmp*" -exec rm -rf {} +
          find $HOME -type f -name "*.tmp" -delete
          find . -type f -name "*~" -delete
          echo "[✅][∞] 임시파일/디렉토리/백업 삭제, 데이터 누수 방지 완료"
