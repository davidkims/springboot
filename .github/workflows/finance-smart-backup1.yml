name: 🔐 MEGA Secure CI + Full AutoUP + EchoOps + Spark + DB + Pages + Backups

on:
  workflow_dispatch:
  schedule:
    - cron: "*/1 * * * *"

permissions:
  contents: write
  pull-requests: write
  id-token: write
  security-events: write
  pages: write

jobs:
  mega-secure-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DB_USER: root
      DB_PASS: rootpass123
      DB_NAME: sample_db
      SPARK_VERSION: 3.5.1
      VAULT_VERSION: 1.15.2

    steps:
    - name: 📂 Checkout Repository
      uses: actions/checkout@v4

    - name: 📁 Create Echo Directories
      run: |
        set -e
        mkdir -p .github/echo_logs
        for dir in .github/echo_{scorecard,codeql,logs,security,upgrade,autoup,pages,templates,backup,monitoring,spark,downloads} \
                   site/{scorecard,security,upgrade,pr,backup,html,spark_results}; do
          mkdir -p "$dir"
          echo "echo '[ECHO] 디렉토리 생성: $dir'" >> .github/echo_logs/create_dirs.sh
        done
        chmod +x .github/echo_logs/create_dirs.sh
        bash .github/echo_logs/create_dirs.sh

    - name: 🛠 Install Dependencies (Fix containerd conflicts)
      run: |
        set -e
        sudo apt-get update -y
        sudo apt-get install -y --allow-change-held-packages \
          jq curl python3-pip unzip mysql-client postgresql-client default-jdk scala
        pip install bandit pip-audit

    - name: 📦 Install Security Tools
      run: |
        set -e
        curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b /usr/local/bin
        VERSION="4.10.3"
        curl -sLO https://github.com/ossf/scorecard/releases/download/v${VERSION}/scorecard_${VERSION}_linux_amd64.tar.gz
        tar -xzf scorecard_${VERSION}_linux_amd64.tar.gz
        sudo mv scorecard_${VERSION}_linux_amd64*/scorecard /usr/local/bin/scorecard
        scorecard --version

    - name: 🚀 Install Apache Spark
      run: |
        set -e
        curl -O https://downloads.apache.org/spark/spark-${SPARK_VERSION}/spark-${SPARK_VERSION}-bin-hadoop3.tgz
        tar xvf spark-${SPARK_VERSION}-bin-hadoop3.tgz
        sudo mv spark-${SPARK_VERSION}-bin-hadoop3 /opt/spark
        echo "export PATH=/opt/spark/bin:$PATH" >> $GITHUB_ENV
        echo "echo '[ECHO] Apache Spark 설치 완료'" >> .github/echo_logs/spark_install.sh

    - name: 🔐 Run Vault (stable version)
      run: |
        set -e
        docker run -d --name vault_test -p 8200:8200 vault:${VAULT_VERSION} || true
        echo "echo '[ECHO] Vault 컨테이너 실행 완료 (${VAULT_VERSION})'" >> .github/echo_logs/vault_run.sh

    - name: 🧾 Run Scorecard
      run: |
        scorecard --repo=https://github.com/${{ github.repository }} --format sarif --no-upload > results.sarif
        scorecard --repo=https://github.com/${{ github.repository }} --format json --no-upload > results.json
        cp results.sarif site/scorecard/scorecard-results.sarif
        cp results.json site/security/security.json

    - name: 🔎 Run Bandit, pip-audit, Trivy
      run: |
        bandit -r . -f json > site/security/bandit.json || true
        pip-audit -f json -o site/security/pip-audit.json || true
        trivy fs . --format json --output site/security/trivy.json || true

    - name: 🧰 Run CodeQL Security Scan
      uses: github/codeql-action/init@v3
      with:
        languages: javascript

    - name: 📊 Run CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        output: site/security/codeql-results.sarif
        category: codeql-security-scan

    - name: 💾 Run DB Backups
      run: |
        mysqldump -u${DB_USER} -p${DB_PASS} ${DB_NAME} > site/backup/mysqldump.sql || true
        pg_dump -U postgres -d ${DB_NAME} > site/backup/pgdump.sql || true
        echo "exit" | sqlplus -S system/oracle@localhost @backup.sql > site/backup/sqlplus_backup.log || true

    - name: 📝 Generate SQL & Spark Queries
      run: |
        echo "SELECT * FROM test_table;" > query.sql
        echo "spark.read.text('README.md').show()" > query_spark.py

    - name: 📥 Download Spark & SQL Results
      run: |
        echo "id,name\n1,Alice\n2,Bob" > site/spark_results/sample.csv
        echo "echo '[ECHO] Spark & SQL 결과 다운로드 완료'" >> .github/echo_logs/download_results.sh

    - name: 📈 Save Upgrade Info
      run: |
        mkdir -p site/upgrade .github/echo_upgrade
        apt list --upgradable 2>/dev/null | tee site/upgrade/upgradable.txt
        pip list --outdated --format=columns > site/upgrade/pip-upgradable.txt || true
        docker images --format "{{.Repository}}:{{.Tag}}" | while read img; do
          echo "$img" >> site/upgrade/docker-images.txt
        done
        echo "echo '[ECHO] 업그레이드 대상 목록 저장 완료'" >> .github/echo_upgrade/upgrade_log.sh

    - name: 🔄 Run Full Upgrade
      run: |
        sudo apt-get update -y
        sudo apt-get upgrade -y --allow-change-held-packages
        pip install --upgrade pip
        pip list --outdated | cut -d ' ' -f1 | xargs -n1 pip install -U || true
        docker images --format "{{.Repository}}:{{.Tag}}" | while read img; do
          docker pull "$img" || true
        done
        echo "echo '[ECHO] 전체 업그레이드 완료'" >> .github/echo_upgrade/upgrade_log.sh

    - name: 🔁 Create Auto PR for Upgrade
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if grep -q ".*" site/upgrade/upgradable.txt; then
          gh pr create --title "🔄 패키지 업그레이드 PR" \
            --body "자동 생성된 업그레이드 PR입니다."
        fi

    - name: 🌐 Upload GitHub Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/

    - name: 🚀 Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
