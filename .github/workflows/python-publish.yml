name: 🧪 Build & Test Publish & Secure Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  security-events: write
  id-token: write

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 📁 Prepare all directories
        run: |
          echo "[📁] Creating all required directories..."
          mkdir -p build logs dist site .github/test-publish .github/audit
          echo "[✅] Directories ready."

      - name: 📦 Install all Python packages
        run: |
          echo "[📦] Installing all packages..."
          python -m pip install --upgrade pip
          pip install build setuptools wheel twine
          pip install flake8 black isort mypy pylint bandit
          pip install pytest pytest-cov hypothesis
          pip install sphinx myst-parser sphinx-autobuild furo
          pip install pandas numpy matplotlib scipy
          pip install fastapi flask httpx requests uvicorn
          pip install safety pip-audit
          pip install types-requests types-PyYAML types-setuptools
          echo "[✅] All packages installed."

      - name: ⚙️ Generate requirements.txt (if missing)
        run: |
          if [ ! -f requirements.txt ]; then
            echo "pandas" > requirements.txt
            echo "fastapi" >> requirements.txt
            echo "uvicorn" >> requirements.txt
            echo "pytest" >> requirements.txt
            echo "[✅] requirements.txt generated."
          fi

      - name: ⚙️ Generate pyproject.toml/setup.py (if missing)
        run: |
          if [ ! -f pyproject.toml ] && [ ! -f setup.py ]; then
            echo "[build-system]" > pyproject.toml
            echo "requires = [\"setuptools\", \"wheel\"]" >> pyproject.toml
            echo "build-backend = \"setuptools.build_meta\"" >> pyproject.toml
            echo "" >> pyproject.toml
            echo "[project]" >> pyproject.toml
            echo "name = \"demo-package\"" >> pyproject.toml
            echo "version = \"0.0.1\"" >> pyproject.toml
            echo "description = \"Auto-generated project\"" >> pyproject.toml
            echo "authors = [{name = \"GitHub Actions\"}]" >> pyproject.toml
            echo "[tool.setuptools.packages.find]" >> pyproject.toml
            echo "include = [\"finance_app*\"]" >> pyproject.toml
            echo "exclude = [\"tests*\", \"logs*\", \"migrations*\"]" >> pyproject.toml

            echo "from setuptools import setup, find_packages" > setup.py
            echo "setup(name='demo-package', version='0.0.1', packages=find_packages(include=['finance_app*']))" >> setup.py
            echo "[✅] pyproject.toml/setup.py generated."
          fi

      - name: 🔒 Freeze environment to lock file
        run: |
          pip freeze > logs/requirements.lock.txt
          cp logs/requirements.lock.txt .github/requirements.lock.txt
          echo "[✅] pip freeze saved."

      - name: 🔐 pip-audit report
        run: |
          pip-audit -f markdown -o site/pip-audit-report.md || true
          cp site/pip-audit-report.md .github/audit/audit.md
          echo "[✅] pip-audit complete."

      - name: 🧪 Run tests
        run: |
          if [ -d "tests" ]; then
            pytest tests | tee logs/test.log
            cp logs/test.log .github/test-publish/test.log
          else
            echo "[⚠️] No tests found." > logs/test.log
          fi

      - name: 🧹 Run lint/type checks
        run: |
          flake8 . || true
          black . --check || true
          isort . --check-only || true
          mypy . || true
          echo "[✅] Lint complete."

      - name: 🏗️ Build package
        run: |
          python -m build
          echo "[✅] Build complete:"
          ls -lh dist/

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: 🧪 Upload to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: 🌍 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
        continue-on-error: true

  codeql-analysis:
    name: 🛡️ CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛡️ Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: 🛠️ Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
