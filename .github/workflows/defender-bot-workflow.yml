name: "⚔️ Defender Bot EchoOps"

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  echo-ops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Defender Bot workflow
        run: bash scripts/defender_bot_workflow.sh
