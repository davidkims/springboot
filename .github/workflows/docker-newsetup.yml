name: 🏦 전체 금육기\uu0020ALL-IN-ONE + AutoUP + 업그레이드 분석 + SQL Echo 전체 통합

on:
  workflow_dispatch:
  schedule:
    - cron: '*/3 * * * *'

jobs:
  fintech-autoup-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 전체 에코 디렉토리 및 금융기관 구조 생성 (echo 로깅 포함)
        run: |
          set -e
          echo "[ECHO] echo 디렉토리 전체 생성 시작"
          BANKS="국민 우리 신한 하나 농협 기업 수협 씨티 SC제일 케이카카오토스새마을금고 우체국 부산 대구 광주 전북 제주 산림조합 신협 한국씨티 JP모건 BOA HSBC UBS 도이치 한국스탠다드차타드 신용카드 롯데 삼성 현대 비씨 NH채움 하나카드 신한카드 우리카드 국민카드 기업카드 현대증권 미래에셋 NH투자 한국투자 신한투자 KB증권 삼성증권 키움 대신 신영 유진 IBK투자 메리츠 한국예탁결제원 업비트 빗썸 코빗 고팍스 바이낸스 코인원 교보 삼성 한화 동양 현대 농협 메리츠 흥국 MG MG새마을 저축은행 리브핀 페이코 카카오페이 뱅크샐러드 암호화폐토스카카오뱅크타다토스증권웨이브 오픈뱅킹모든은행포함"

          mkdir -p .github/echo/autoup/{log,config,cron,reboot,install,targets,compare} .github/echo/backup/log .github/echo/summary
          echo "echo '[DIR] 기본 디렉토리 생성 완료'" >> .github/echo/summary/echo_init.log

          for B in $BANKS; do
            for d in \
              .github/echo/bank/$B/autoup \
              .github/echo/bank/$B/autoup/log \
              .github/echo/bank/$B/autoup/targets \
              .github/echo/bank/$B/autoup/compare \
              .github/echo/bank/$B/db/sql \
              .github/echo/bank/$B/db/query \
              .github/echo/bank/$B/db/exec \
              .github/echo/bank/$B/db/log; do
              mkdir -p "$d"
              echo "echo '[DIR 생성됨] $d'" >> .github/echo/summary/echo_init.log
            done
          done

      - name: 📦 echo 기반 AutoUP 대상 분석 및 저장
        run: |
          set -e
          echo "echo '[AUTOUP] apt list 분석 시작'" > .github/echo/autoup/log/autoup_analyze.log
          apt list --upgradable 2>/dev/null | tee .github/echo/autoup/install/autoup_targets_all.txt
          echo "echo '[AUTOUP] 분석 완료 및 저장됨'" >> .github/echo/autoup/log/autoup_analyze.log

          BANKS="국민 우리 신한 하나 농협 기업 수협 씨티 SC제일 ..."
          for B in $BANKS; do
            mkdir -p .github/echo/bank/$B/autoup/targets
            mkdir -p .github/echo/bank/$B/autoup/log
            cp .github/echo/autoup/install/autoup_targets_all.txt .github/echo/bank/$B/autoup/targets/autoup_targets.txt
            echo "echo '[AUTOUP] $B 대상 저장 완료'" >> .github/echo/bank/$B/autoup/log/target_copy.log
          done

      - name: 🔁 echo 기반 Cron 및 정책 설정
        run: |
          mkdir -p .github/echo/autoup/config .github/echo/autoup/cron
          echo 'APT::Periodic::Update-Package-Lists "1";' > .github/echo/autoup/config/10periodic
          echo 'APT::Periodic::Unattended-Upgrade "1";' > .github/echo/autoup/config/20auto-upgrades
          echo 'Unattended-Upgrade::Remove-Unused-Dependencies "true";' > .github/echo/autoup/config/30remove-unused
          echo 'Unattended-Upgrade::Automatic-Reboot "true";' > .github/echo/autoup/config/40auto-reboot
          echo 'Unattended-Upgrade::Automatic-Reboot-Time "03:30";' > .github/echo/autoup/config/50auto-reboot-time
          echo 'APT::Periodic::AutocleanInterval "7";' > .github/echo/autoup/config/60autoclean
          echo "echo '[CONFIG] 정책 파일 생성 완료'" > .github/echo/autoup/config/policy_create.log

          echo '0 3 * * * root /sbin/reboot' > .github/echo/autoup/cron/reboot_cron.txt
          echo '0 2 * * * root tar czf /tmp/backup_$(date +%Y%m%d_%H%M).tar.gz /etc /var/lib /home' > .github/echo/autoup/cron/backup_cron.txt
          echo '*/3 * * * * root /usr/bin/unattended-upgrade -d >> /var/log/unattended-upgrades/autoup.log 2>&1' > .github/echo/autoup/cron/autoup_cron.txt
          echo "echo '[CRON] 등록 완료'" >> .github/echo/autoup/cron/cron_create.log

      - name: 📊 echo 기반 패키지 변경 비교 및 추적
        run: |
          dpkg -l | tee .github/echo/autoup/compare/pkg_before.txt
          sudo unattended-upgrade -d | tee .github/echo/autoup/log/unattended_upgrade_run.log
          dpkg -l | tee .github/echo/autoup/compare/pkg_after.txt
          diff .github/echo/autoup/compare/pkg_before.txt .github/echo/autoup/compare/pkg_after.txt > .github/echo/autoup/compare/pkg_diff.txt || true
          awk '/^> /{print $0}' .github/echo/autoup/compare/pkg_diff.txt > .github/echo/autoup/compare/pkg_new_version.txt || true

          BANKS="국민 우리 신한 하나 농협 기업 수협 씨티 SC제일 ..."
          for B in $BANKS; do
            cp .github/echo/autoup/compare/pkg_new_version.txt .github/echo/bank/$B/autoup/compare/pkg_change_summary.txt
            echo "echo '[PKG] 변경 요약 저장 완료: $B'" >> .github/echo/bank/$B/autoup/log/pkg_compare.log
          done

      - name: 📅 SQL 자동 테이블/쿼리/실행 echo 생성
        run: |
          set -e
          echo "echo '[SQL] 자동 테이블/쿼리/실행 시작'" >> .github/echo/summary/sql_init.log
          BANKS="국민 우리 신한 하나 농협 기업 수협 씨티 SC제일 ..."
          for B in $BANKS; do
            mkdir -p .github/echo/bank/$B/db/sql
            mkdir -p .github/echo/bank/$B/db/query
            mkdir -p .github/echo/bank/$B/db/exec
            mkdir -p .github/echo/bank/$B/db/log

            echo "echo '[DIR 생성됨] .github/echo/bank/$B/db'" >> .github/echo/bank/$B/db/log/sql_echo.log

            echo "echo 'CREATE TABLE IF NOT EXISTS ${B}_ledger (id INT AUTO_INCREMENT PRIMARY KEY, account_no VARCHAR(30), amount DECIMAL(15,2), tx_type VARCHAR(10), tx_time TIMESTAMP DEFAULT CURRENT_TIMESTAMP);'" > .github/echo/bank/$B/db/sql/${B}_ledger_table.sql
            echo "echo '[TABLE 생성] ${B}_ledger_table.sql'" >> .github/echo/bank/$B/db/log/sql_echo.log

            echo "echo 'INSERT INTO ${B}_ledger (account_no, amount, tx_type) VALUES (\'ACC123456\', 100000.00, \'DEPOSIT\');'" > .github/echo/bank/$B/db/query/${B}_insert.sql
            echo "echo '[INSERT 생성] ${B}_insert.sql'" >> .github/echo/bank/$B/db/log/sql_echo.log

            echo "echo 'SELECT * FROM ${B}_ledger ORDER BY tx_time DESC LIMIT 10;'" > .github/echo/bank/$B/db/query/${B}_select.sql
            echo "echo '[SELECT 생성] ${B}_select.sql'" >> .github/echo/bank/$B/db/log/sql_echo.log

            echo "#!/bin/bash" > .github/echo/bank/$B/db/exec/${B}_exec_query.sh
            echo "echo '[EXEC] ${B} 테이블 및 쿼리 실행'" >> .github/echo/bank/$B/db/exec/${B}_exec_query.sh
            echo "mysql -uroot -prootpass123 test_db < .github/echo/bank/$B/db/sql/${B}_ledger_table.sql" >> .github/echo/bank/$B/db/exec/${B}_exec_query.sh
            echo "mysql -uroot -prootpass123 test_db < .github/echo/bank/$B/db/query/${B}_insert.sql" >> .github/echo/bank/$B/db/exec/${B}_exec_query.sh
            echo "mysql -uroot -prootpass123 test_db < .github/echo/bank/$B/db/query/${B}_select.sql | tee .github/echo/bank/$B/db/query/${B}_select_result.csv" >> .github/echo/bank/$B/db/exec/${B}_exec_query.sh
            chmod +x .github/echo/bank/$B/db/exec/${B}_exec_query.sh
            echo "echo '[EXEC 생성 완료] ${B}_exec_query.sh'" >> .github/echo/bank/$B/db/log/sql_echo.log
          done
          echo "echo '[SQL 완료] 전체 은행 SQL echo 생성 완료됨'" >> .github/echo/summary/sql_complete.log
          echo "echo '[SQL 완료] 전체 은행 SQL echo 생성 완료됨'" >> .github/echo/summary/echo_complete.log
