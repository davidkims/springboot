name: ✨ Kafka/ELK/Grafana + Teradata BTEQ Echo Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  echo-db-full-init:
    runs-on: ubuntu-latest

    steps:
      - name: 파일 척음
        uses: actions/checkout@v4

      - name: 필요 디렉토리 생성 (echo)
        run: |
          bash .github/echo_db/scripts/full_init_run.sh

      - name: 패키지 업그레이드
        run: |
          sudo apt-get update -y
          sudo apt-get install -y netcat curl docker-compose

      - name: 보안 포트/협조 검사 (nc)
        run: |
          chmod +x .github/echo_db/firewall/check_ports.sh
          bash .github/echo_db/firewall/check_ports.sh

      - name: Kafka/ELK/Grafana 시작
        run: |
          docker-compose -f .github/echo_db/compose/docker-compose.yml up -d

      - name: Teradata BTEQ 견조 시바르 실행
        run: |
          chmod +x .github/echo_db/bteq/run_bteq_simulation.sh
          bash .github/echo_db/bteq/run_bteq_simulation.sh || echo '[WARN] BTEQ 실행 실패'

      - name: BTEQ 결과 ELK에 전송
        run: |
          chmod +x .github/echo_db/elk/send_to_elk.sh
          bash .github/echo_db/elk/send_to_elk.sh || echo '[WARN] ELK 전송 실패'

      - name: Grafana 데시보드 자동 Import
        run: |
          chmod +x .github/echo_db/grafana/import_dashboard.sh
          bash .github/echo_db/grafana/import_dashboard.sh

      - name: GitHub Pages용 결과 보기용 index.html 생성
        run: |
          mkdir -p site/public
          echo "<h1>Dashboard Ready</h1>" > site/public/index.html

      - name: GitHub Pages에 보고서 자동 배포
        uses: peaceiris/actions-gh-pages@v4
        if: success()
        with:
          publish_branch: gh-pages
          publish_dir: site/public
        env:
          PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
