name: "🛡️ Echo 기반 보안 자동화 + Scorecard + 템플릿 + Placeholder"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 2 * * 5'

jobs:
  full-echo-secure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧰 필수 도구 설치 및 업그레이드
        run: |
          sudo apt-get update -y
          sudo apt-get upgrade -y
          sudo apt-get install -y curl jq yq tree unzip sudo lsof ssh python3-pip

          echo "[✔️ Install] GitHub CLI"
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /usr/share/keyrings/githubcli-archive-keyring.gpg >/dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list
          sudo apt-get update && sudo apt-get install gh -y

          echo "[✔️ Install] OSSF Scorecard (tar.gz)"
          SCORECARD_VERSION="4.10.3"
          curl -LO "https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz"
          tar -xzf scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz
          chmod +x scorecard_${SCORECARD_VERSION}_linux_amd64/scorecard
          sudo mv scorecard_${SCORECARD_VERSION}_linux_amd64/scorecard /usr/local/bin/scorecard
          scorecard --version

          echo "[✔️ Install] CodeQL CLI"
          CODEQL_VERSION=2.17.5
          curl -L -o codeql.zip "https://github.com/github/codeql-cli-binaries/releases/download/v${CODEQL_VERSION}/codeql-linux64.zip"
          unzip codeql.zip
          sudo mv codeql/codeql /usr/local/bin/codeql
          codeql version

      - name: 📁 Echo 디렉토리 대량 생성
        run: |
          for d in .github/echo_{template,security,codeql,dependabot,permission,placeholder,scorecard/{init,log,config,policy,result}}; do
            mkdir -p "$d"
          done

          whoami > .github/echo_permission/whoami.txt
          id > .github/echo_permission/id.txt
          cat /etc/passwd > .github/echo_permission/passwd.txt
          sudo cat /etc/sudoers > .github/echo_permission/sudoers.txt
          getent group sudo > .github/echo_permission/sudo_group.txt
          sudo -l > .github/echo_permission/sudo_l.txt

      - name: 📄 Echo Scorecard 관련 파일 대량 생성
        run: |
          echo "echo '[INIT] Scorecard 실행 준비'" > .github/echo_scorecard/init/echo_scorecard_init.sh
          echo "echo '[CONFIG] 설정값 정리'" > .github/echo_scorecard/config/echo_scorecard_config.sh
          echo "echo '[POLICY] 보안 정책 정리'" > .github/echo_scorecard/policy/echo_policy_review.sh
          echo "echo '[RUN] Scorecard 실행'" > .github/echo_scorecard/log/echo_scorecard_exec.sh

          echo "# Placeholder: OSSF Scorecard 정책 요약" > .github/echo_scorecard/policy/policy.md
          echo "KEY=PLACEHOLDER" > .github/echo_scorecard/config/config.cfg
          echo '{ "placeholder": "value" }' > .github/echo_scorecard/config/config.json
          echo "-- Scorecard 실행 결과 기록" > .github/echo_scorecard/result/summary.txt

      - name: 🧾 Placeholder 파일 (.env/.cfg/.sql/.json/.md/.rs/.py/.js)
        run: |
          echo "DB_USER=PLACEHOLDER" > .github/echo_template/sample.env
          echo "echo 'DB_USER=PLACEHOLDER'" > .github/echo_template/echo_env.sh
          echo "-- PLACEHOLDER SQL" > .github/echo_placeholder/sample.sql
          echo "# PLACEHOLDER Doc" > .github/echo_placeholder/sample.md
          echo '{ "key": "PLACEHOLDER" }' > .github/echo_placeholder/sample.json
          echo 'fn main() { println!("PLACEHOLDER"); }' > .github/echo_placeholder/sample.rs
          echo 'print("PLACEHOLDER")' > .github/echo_placeholder/sample.py
          echo 'console.log("PLACEHOLDER")' > .github/echo_placeholder/sample.js

      - name: 🔐 CodeQL + Dependabot + SECURITY 템플릿 생성
        run: |
          echo -e "name: CodeQL\non:\n  push:\n    branches: [\"main\"]\njobs:\n  analyze:\n    runs-on: ubuntu-latest\n    steps:\n    - uses: actions/checkout@v4\n    - uses: github/codeql-action/init@v3\n      with:\n        languages: javascript\n    - uses: github/codeql-action/analyze@v3" > .github/codeql.yml
          echo -e "version: 2\nupdates:\n  - package-ecosystem: \"npm\"\n    directory: \"/\"\n    schedule:\n      interval: \"daily\"" > .github/dependabot.yml
          echo "# Security Policy\nReport to: security@PLACEHOLDER.com" > .github/SECURITY.md

      - name: 🧪 Scorecard 실행 및 echo 기록
        run: |
          echo "echo '[RUN] Scorecard 실행'" > .github/echo_scorecard/log/echo_run.sh
          echo "scorecard --repo=https://github.com/${{ github.repository }} --format=json > .github/echo_scorecard/result/scorecard.json" >> .github/echo_scorecard/log/echo_run.sh
          scorecard --repo=https://github.com/${{ github.repository }} --format=json > .github/echo_scorecard/result/scorecard.json

      - name: 📤 Upload Echo Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-echo-scorecard-artifacts
          path: |
            .github/echo_*
            .github/codeql.yml
            .github/dependabot.yml
            .github/SECURITY.md
