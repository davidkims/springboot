name: 🏢 MEGA DB Echo FullOps + 설치 + Eco + 실행 통합

on:
  workflow_dispatch:
    inputs:
      COUNT:
        description: "테이블/사용자 수 (default: 100)"
        required: false
        default: "100"
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  mega-echo:
    runs-on: ubuntu-latest
    env:
      COUNT: ${{ github.event.inputs.COUNT || '100' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || '' }}

    steps:
      - name: 📂 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 📁 사전 디렉토리 및 에코 파일 생성
        run: |
          for d in preinit echo_mysql permissions firewall echo_dirs logs run_scripts backup sarif stats grants results upgrade elk kafka dwh bteq sqlite postgres; do
            mkdir -p ".github/echo_db/$d"
          done

          echo "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpass123'; FLUSH PRIVILEGES;" > .github/echo_db/preinit/mysql_root_password.sql

      - name: 🧱 MySQL + 시스템 + ELK + Kafka + DWH 설치 및 설정
        run: |
          sudo apt-get update -y && sudo apt-get upgrade -y || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server sqlite3 postgresql-client net-tools ufw default-jdk || true

          # Kafka/Logstash 설치 스크립트 에코만
          echo "[INFO] Kafka 및 ELK 설치는 공식 바이너리 다운로드를 통해 진행 필요 (apt 미지원)" > .github/echo_db/elk/install_notes.txt

          # MySQL 설정
          sudo sed -i 's/^bind-address.*/bind-address = 0.0.0.0/' /etc/mysql/mysql.conf.d/mysqld.cnf || true
          sudo systemctl restart mysql || sudo service mysql restart
          sudo mysql < .github/echo_db/preinit/mysql_root_password.sql

          # my.cnf 에코
          echo '[client]' > .github/echo_db/echo_mysql/my.cnf
          echo 'user=root' >> .github/echo_db/echo_mysql/my.cnf
          echo 'password=rootpass123' >> .github/echo_db/echo_mysql/my.cnf
          echo 'host=127.0.0.1' >> .github/echo_db/echo_mysql/my.cnf
          echo 'protocol=TCP' >> .github/echo_db/echo_mysql/my.cnf

          # 패스워드 및 권한 확인
          echo "echo 'MYSQL PASSWORD: rootpass123'" > .github/echo_db/permissions/mysql_password_echo.sh
          echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf -e \"SHOW GRANTS FOR 'root'@'localhost';\" | tee .github/echo_db/permissions/root_grants.txt" >> .github/echo_db/permissions/mysql_password_echo.sh
          chmod +x .github/echo_db/permissions/mysql_password_echo.sh
          bash .github/echo_db/permissions/mysql_password_echo.sh

          # 방화벽 확인
          echo "ufw status" > .github/echo_db/firewall/firewall_check.sh
          echo "netstat -tuln | grep 3306" >> .github/echo_db/firewall/firewall_check.sh
          chmod +x .github/echo_db/firewall/firewall_check.sh
          bash .github/echo_db/firewall/firewall_check.sh | tee .github/echo_db/firewall/firewall_status.log
          sudo netstat -tuln | tee .github/echo_db/firewall/netstat_output.txt
          sudo ufw status verbose | tee .github/echo_db/firewall/ufw_status_verbose.txt

      - name: 🏗️ 테이블/계정/SQL/쿼리/로그 생성
        run: |
          for i in $(seq 1 $COUNT); do
            T="mega_table_$i"
            U="user_$i"
            PW="pw_$i"
            echo "CREATE TABLE IF NOT EXISTS $T (id INT PRIMARY KEY AUTO_INCREMENT, value VARCHAR(255));" > .github/echo_db/echo_dirs/$T.sql
            echo "INSERT INTO $T (value) VALUES ('sample_data_$i');" > .github/echo_db/logs/insert_$T.sql
            echo "SELECT * FROM $T;" > .github/echo_db/logs/select_$T.sql
            echo "CREATE USER IF NOT EXISTS '$U'@'%' IDENTIFIED BY '$PW';" > .github/echo_db/grants/create_user_$U.sql
            echo "GRANT SELECT, INSERT ON test_db.$T TO '$U'@'%';" > .github/echo_db/grants/grant_$U.sql
          done

      - name: 💾 백업 및 분석
        run: |
          mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf -e "SHOW TABLES IN test_db;" | tee .github/echo_db/stats/show_tables.log || echo '[WARN] 테이블 조회 실패'
          mysqldump --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf test_db > .github/echo_db/backup/mysql_backup.sql || echo '[WARN] 백업 실패'
          echo '{ "version": "2.1.0", "runs": [{ "tool": { "driver": { "name": "mockql" } }, "results": [{ "message": { "text": "SQL 실행 성공" } }] }] }' > .github/echo_db/sarif/mock_result.sarif
          echo "총 테이블 수: $COUNT" > .github/echo_db/stats/table_count.log

      - name: 🚀 GitHub Pages 업로드
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .github/echo_db
          publish_branch: gh-pages

      - name: ☁️ AWS S3 업로드 (옵션)
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'ap-northeast-2'
        run: |
          aws s3 cp --recursive .github/echo_db/backup/ s3://your-bucket-name/echo_db/backup/ || echo '[WARN] S3 업로드 실패'

      - name: 📜 결과 전체 출력
        run: |
          find .github/echo_db -type f | sort | while read f; do
            echo "--- $f"
            cat "$f" || echo "(읽기 실패)"
          done
