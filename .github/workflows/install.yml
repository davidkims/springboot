# 🗂️ MEGA-DB/거래/계좌/이체/유저/시뮬/설치/권한/대량/운영/유틸/Compose-통합

name: 🗂️ MEGA-DB/거래/계좌/이체/유저/시뮬/설치/권한/대량/운영/유틸/Compose-통합

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  db-echo-mega:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 체크아웃
        uses: actions/checkout@v4

      - name: 📁 모든 echo 디렉토리 및 echo_dir_create.sh 자동 생성
        run: |
          set -e
          mkdir -p .github/echo_db
          echo "#!/bin/bash" > .github/echo_db/echo_dir_create.sh
          for d in \
            .github/echo_db/{dirs,files,logs,scripts,services,compose,homebrew,choco,snap,marketplace,backup,init,test,migration,import,export,serverinfo,errorlog,util,mass_db,mass_script,mass_query,ledger,vaccount,transfer,user,sim,teradata,dwh,ddl,output,image,dockerfile,installer,analytics,parallel,summary,workflow,api,sql_exec,echo_log,result,report,history,metrics,accounting,dispatch,task,upgrade,transfer_exec,select,polestar,grafana,kafka,elk,prometheus,firewall,ports,pages,bteq}; do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo_db/echo_dir_create.sh
            mkdir -p "$d"
          done
          chmod +x .github/echo_db/echo_dir_create.sh

      - name: 📄 에코 기반 실행기 및 설치기 생성
        run: |
          echo "#!/bin/bash" > .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/echo_dir_create.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_users.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_accounts.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_ledgers.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_transfers.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_selects.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_dockerfiles.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_polestar.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_kafka_elk_prometheus.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/run_bteq_simulation.sh" >> .github/echo_db/scripts/full_init_run.sh
          chmod +x .github/echo_db/scripts/full_init_run.sh

      - name: 🔁 패키지 업그레이드 자동화
        run: |
          echo "#!/bin/bash" > .github/echo_db/upgrade/package_upgrade.sh
          echo "sudo apt-get update -y" >> .github/echo_db/upgrade/package_upgrade.sh
          echo "sudo apt-get upgrade -y || echo '[WARN] 일부 패키지 업그레이드 실패'" >> .github/echo_db/upgrade/package_upgrade.sh
          chmod +x .github/echo_db/upgrade/package_upgrade.sh
          bash .github/echo_db/upgrade/package_upgrade.sh

      - name: 🚀 Grafana 대시보드 자동 Import 및 GitHub Pages 배포 준비
        run: |
          echo "echo '[GRAFANA] 대시보드 import 자동 생성'" > .github/echo_db/grafana/dashboard_import.sh
          echo "mkdir -p .github/echo_db/grafana/dashboards" >> .github/echo_db/grafana/dashboard_import.sh
          echo "cp .github/echo_db/grafana/default_dashboard.json .github/echo_db/grafana/dashboards/" >> .github/echo_db/grafana/dashboard_import.sh
          echo "echo '[PAGES] 결과 페이지 구성'" > .github/echo_db/pages/setup_pages.sh
          echo "mkdir -p site/public" >> .github/echo_db/pages/setup_pages.sh
          echo "cp .github/echo_db/output/*.csv site/public/ || true" >> .github/echo_db/pages/setup_pages.sh
          chmod +x .github/echo_db/grafana/dashboard_import.sh
          chmod +x .github/echo_db/pages/setup_pages.sh

      - name: ☑️ BTEQ/Teradata 시뮬레이션 자동 실행
        run: |
          echo "#!/bin/bash" > .github/echo_db/bteq/run_bteq_simulation.sh
          echo "bteq < .github/echo_db/teradata/tx_simulation.btq || echo '[WARN] BTEQ 실행 실패'" >> .github/echo_db/bteq/run_bteq_simulation.sh
          chmod +x .github/echo_db/bteq/run_bteq_simulation.sh
          bash .github/echo_db/bteq/run_bteq_simulation.sh

      - name: 📡 방화벽 및 포트 echo 자동 생성
        run: |
          echo "#!/bin/bash" > .github/echo_db/firewall/port_check.sh
          for port in 9092 9200 9090 3000; do
            echo "echo '[PORT] Checking port $port'" >> .github/echo_db/firewall/port_check.sh
            echo "sudo lsof -iTCP:$port || echo '[CLOSED] Port $port'" >> .github/echo_db/firewall/port_check.sh
          done
          chmod +x .github/echo_db/firewall/port_check.sh
          bash .github/echo_db/firewall/port_check.sh

      - name: 🏷️ 모든 에코 출력 표시
        run: |
          echo "[ECHO] 전체 에코 파일 덤프"
          find .github/echo_db -type f | sort | while read f; do
            echo "-----"
            echo "[파일] $f"
            cat "$f"
            echo
          done
