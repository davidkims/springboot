name: 🛠️ Dependabot Recovery & Sanity Check

on:
  workflow_run:
    workflows: ["Auto-Approve & Merge Dependabot PRs"]
    types:
      - completed

jobs:
  fix-dependabot-errors:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: 🧪 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Check for missing Dockerfile, README, etc.
        run: |
          mkdir -p .github/workflows
          [ ! -f Dockerfile ] && echo "# Dummy Dockerfile" > Dockerfile
          [ ! -f README.md ] && echo "# Placeholder README" > README.md
          git config --global user.name github-actions
          git config --global user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "🚑 Auto-fix missing config files" || echo "Nothing to commit"
          git push || echo "Already up to date"

      - name: 🔁 Retry failed workflow (log only)
        run: echo "[INFO] Workflow failed. Human review suggested. Manual rerun if needed."
