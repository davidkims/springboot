name: 📂 MEGA-DB/거래/계정/이체/사용자/시뮬레이션/설치/권한/대량/운영/유틸리티/작성

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  db-echo-mega:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 모든 에코 디렉토리 생성 (Teradata + DWH + Kafka/Prometheus/Grafana 포함)
        run: |
          mkdir -p .github/echo_db
          for d in dirs files install upgrade permission scripts logs services compose homebrew choco snap marketplace backup init test migration import export serverinfo errorlog util mass_db mass_script mass_query ledger vaccount transfer user sim teradata dwh dockerfile installer analytics parallel summary workflow api runtime bin output auth sql_exec echo_log result report history metrics accounting dispatch task bteq elk grafana firewall kafka prometheus alertmanager webhook; do
            echo "echo 'mkdir -p .github/echo_db/$d'" >> .github/echo_db/echo_dir_create.sh
            mkdir -p ".github/echo_db/$d"
          done

      - name: 🖍️ 대량 SQL 및 실행 스크립트 생성 (Ledger/Transfer 포함)
        run: |
          set -e
          SERVICES="mysql postgresql sqlite3"
          MASS_CNT=130000
          TX_TYPES="입금 출금 이체 지불 수수료"
          for svc in $SERVICES; do
            echo "-- $svc에 대한 업그레이드 스크립트" > .github/echo_db/upgrade/${svc}_upgrade.sql
            echo "ALTER SYSTEM SET maintenance_work_mem = '64MB';" >> .github/echo_db/upgrade/${svc}_upgrade.sql
            for i in $(seq 1 $MASS_CNT); do
              account="account_${svc}_$i"
              ledger_tbl="ledger_${svc}_$i"
              transfer_tbl="transfer_${svc}_$i"
              echo "INSERT INTO $ledger_tbl (tx_id, account_no, tx_type, amount, balance, note, ts) VALUES ($i, 'ACC${svc}$(printf %06d $i)', 'TRANSFER', 5000, 95000, 'Transfer Tx $i', CURRENT_TIMESTAMP);" >> .github/echo_db/ledger/${svc}_${ledger_tbl}_insert.sql
              echo "INSERT INTO $transfer_tbl (tx_id, from_acc, to_acc, amount, tx_type, ts) VALUES ($i, 'ACC${svc}$(printf %06d $i)', 'ACC${svc}$(printf %06d $((i+1)))', 5000, 'TRANSFER', CURRENT_TIMESTAMP);" >> .github/echo_db/transfer/${svc}_${transfer_tbl}_insert.sql
            done
            echo "echo '[TRANSFER EXEC] $svc 실행을 전송합니다'" > .github/echo_db/transfer_exec/${svc}_transfer_exec.sh
            echo "for sql in .github/echo_db/transfer/${svc}_*transfer_*.sql; do" >> .github/echo_db/transfer_exec/${svc}_transfer_exec.sh
            if [ "$svc" = "mysql" ]; then
              echo "  mysql -uroot -prootpass123 test_db < \$sql | tee -a .github/echo_db/output/${svc}_transfers.csv" >> .github/echo_db/transfer_exec/${svc}_transfer_exec.sh
            elif [ "$svc" = "postgresql" ]; then
              echo "  psql -U postgres -d test_db -f \$sql | tee -a .github/echo_db/output/${svc}_transfers.csv" >> .github/echo_db/transfer_exec/${svc}_transfer_exec.sh
            elif [ "$svc" = "sqlite3" ]; then
              echo "  sqlite3 test.db < \$sql | tee -a .github/echo_db/output/${svc}_transfers.csv" >> .github/echo_db/transfer_exec/${svc}_transfer_exec.sh
            fi
            echo "done" >> .github/echo_db/transfer_exec/${svc}_transfer_exec.sh
          done

      - name: 🚀 Kafka 토픽 자동 생성 스크립트 생성
        run: |
          echo "#!/bin/bash" > .github/echo_db/kafka/create_topics.sh
          echo "echo '[KAFKA] 토픽 자동 생성 중...'" >> .github/echo_db/kafka/create_topics.sh
          echo "kafka-topics.sh --create --bootstrap-server localhost:9092 --replication-factor 1 --partitions 1 --topic ledger_topic || echo '[WARN] Kafka 토픽 생성 실패'" >> .github/echo_db/kafka/create_topics.sh
          chmod +x .github/echo_db/kafka/create_topics.sh

      - name: ⚡️ Prometheus + AlertManager 설정 에코
        run: |
          echo "global:\n  scrape_interval: 15s" > .github/echo_db/prometheus/prometheus.yml
          echo "scrape_configs:\n  - job_name: 'ledger_service'\n    static_configs:\n      - targets: ['localhost:9100']" >> .github/echo_db/prometheus/prometheus.yml
          echo "route:\n  group_by: ['alertname']\n  receiver: 'default'" > .github/echo_db/alertmanager/alertmanager.yml
          echo "receivers:\n  - name: 'default'\n    email_configs:\n    - to: 'admin@example.com'\n      from: 'alert@example.com'\n      smarthost: 'smtp.example.com:587'" >> .github/echo_db/alertmanager/alertmanager.yml

      - name: 🌐 Grafana Webhook 기반 대시보드 트리거
        run: |
          echo "#!/bin/bash" > .github/echo_db/webhook/grafana_webhook_trigger.sh
          echo "curl -X POST http://localhost:3000/api/alerts/test -H 'Authorization: Bearer $GRAFANA_API_TOKEN' || echo '[WARN] Grafana Webhook 실패'" >> .github/echo_db/webhook/grafana_webhook_trigger.sh
          chmod +x .github/echo_db/webhook/grafana_webhook_trigger.sh

      - name: 🔿️ 전체 에코 출력 요약 표시
        run: |
          echo "[ECHO] 모든 에코 디렉토리/스크립트 출력 요약"
          find .github/echo_db -type f | sort | while read f; do
            echo "-----"
            echo "[📄 파일] $f"
            cat "$f"
            echo
          done
