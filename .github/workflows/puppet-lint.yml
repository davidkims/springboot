name: ♾️ Transfer Log Backup - Cron (60건 Infinite)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  transfer_log_backup:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      oracle:
        image: gvenzl/oracle-xe:18-slim
        env:
          ORACLE_PASSWORD: testpass
          ORACLE_ALLOW_REMOTE: "true"
        ports:
          - 1521:1521
        # letting container handle its own healthcheck

    env:
      TRANSFER_LOG_DIR: /opt/logs/transfer
      BACKUP_DIR: /opt/backup/transfer
      PROVENANCE_DIR: provenance
      PROVENANCE_STORE_DIR: provenance/store

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⏳ Wait for Oracle XE to be ready
        run: |
          echo "[⏳] Waiting for Oracle XE to accept SQL*Plus connections…"
          ORACLE_CID=""
          until ORACLE_CID=$(docker ps --filter ancestor=gvenzl/oracle-xe:18-slim --format '{{.ID}}') && \
                docker exec -i $ORACLE_CID bash -lc "echo SELECT 1 FROM dual | sqlplus -s system/testpass@XE | grep -q 1"; do
            echo "[ℹ️] Oracle still starting…"
            sleep 10
          done
          echo "[✅] Oracle XE is ready"

      - name: 🔧 Initialize Oracle user inside container
        run: |
          echo "[🔧] Creating Oracle user 'testuser'…"
          ORACLE_CID=$(docker ps --filter ancestor=gvenzl/oracle-xe:18-slim --format '{{.ID}}')
          # connect AS SYSDBA to create user and grant tablespace
          docker exec -i $ORACLE_CID bash -lc "\
            echo \"CREATE USER testuser IDENTIFIED BY testpass; \
            GRANT CONNECT, RESOURCE TO testuser; \
            GRANT UNLIMITED TABLESPACE TO testuser; \
            EXIT;\" \
            | sqlplus -s sys/testpass@XE as sysdba" \
            || echo "[⚠️] Oracle user init failed, continuing…"
          echo "[✅] Oracle user 'testuser' initialized"

      - name: 🔧 Configure MySQL user & permissions
        run: |
          echo "[🔧] Creating MySQL user 'testuser' and granting privileges…"
          mysql -h127.0.0.1 -uroot -ptestpass -e "
            CREATE USER IF NOT EXISTS 'testuser'@'%' IDENTIFIED BY 'testpass';
            GRANT ALL PRIVILEGES ON testdb.* TO 'testuser'@'%';
            FLUSH PRIVILEGES;
          "
          echo "[✅] MySQL user configured"

      - name: 🧪 Install Java, pull JDBC drivers & test connections
        run: |
          echo "[☕] Installing Java JDK..."
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          java -version
          javac -version

          echo "[📁] Preparing JDBC directories..."
          mkdir -p /opt/jdbc /opt/jdbc/test

          echo "[⬇️] Downloading MySQL Connector/J..."
          curl -L -o /opt/jdbc/mysql-connector-j.jar \
            https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/8.3.0/mysql-connector-j-8.3.0.jar

          echo "[⬇️] Downloading PostgreSQL JDBC Driver..."
          curl -L -o /opt/jdbc/postgresql-jdbc.jar \
            https://jdbc.postgresql.org/download/postgresql-42.7.3.jar

          echo "[⬇️] Downloading Oracle JDBC (ojdbc8)…"
          curl -L -o /opt/jdbc/ojdbc8.jar \
            https://repo1.maven.org/maven2/com/oracle/database/jdbc/ojdbc8/19.3.0.0/ojdbc8-19.3.0.0.jar

          echo "[📄] Generating JDBCTest.java…"
          {
            echo 'import java.sql.Connection;'
            echo 'import java.sql.DriverManager;'
            echo ''
            echo 'public class JDBCTest {'
            echo '    public static void main(String[] args) {'
            echo '        String type = args[0];'
            echo '        String url = "";'
            echo '        String user = "testuser";'
            echo '        String password = "testpass";'
            echo ''
            echo '        switch (type) {'
            echo '            case "mysql":'
            echo '                url = "jdbc:mysql://127.0.0.1:3306/testdb";'
            echo '                break;'
            echo '            case "postgres":'
            echo '                url = "jdbc:postgresql://127.0.0.1:5432/testdb";'
            echo '                break;'
            echo '            case "oracle":'
            echo '                url = "jdbc:oracle:thin:@127.0.0.1:1521:XE";'
            echo '                break;'
            echo '            default:'
            echo '                System.err.println("Unsupported type: " + type);'
            echo '                System.exit(1);'
            echo '        }'
            echo ''
            echo '        try (Connection conn = DriverManager.getConnection(url, user, password)) {'
            echo '            System.out.println("[\u2705] Connected to " + type + " successfully.");'
            echo '        } catch (Exception e) {'
            echo '            System.err.println("[\u274c] Connection to " + type + " failed: " + e.getMessage());'
            echo '        }'
            echo '    }'
            echo '}'
          } | tee /opt/jdbc/test/JDBCTest.java

          echo "[🚰] Compiling JDBC Test Code…"
          javac -cp "/opt/jdbc/*" /opt/jdbc/test/JDBCTest.java

          echo "[🧲] Testing MySQL JDBC connection…"
          java -cp "/opt/jdbc/*:/opt/jdbc/test" JDBCTest mysql || true

          echo "[🧲] Testing PostgreSQL JDBC connection…"
          java -cp "/opt/jdbc/*:/opt/jdbc/test" JDBCTest postgres || true

          echo "[🧲] Testing Oracle JDBC connection…"
          java -cp "/opt/jdbc/*:/opt/jdbc/test" JDBCTest oracle || true

          echo "[📂] JDBC directory contents:"
          tree /opt/jdbc || ls -lh /opt/jdbc/

      - name: 🔄 Remake BS logic
        run: |
          echo "[🔄] Starting Remake BS logic…"
          mkdir -p $BACKUP_DIR/bs
          echo "{ \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"type\": \"BS\" }" \
            > $BACKUP_DIR/bs/bs-$(date +%s).json
          chmod 644 $BACKUP_DIR/bs/*.json
          echo "[✅] Remake BS logic completed"

      - name: 🔄 Remake MIS logic
        run: |
          echo "[🔄] Starting Remake MIS logic…"
          mkdir -p $BACKUP_DIR/mis
          echo "MIS Report generated at $(date -u +'%Y-%m-%d %H:%M:%SZ')" \
            > $BACKUP_DIR/mis/mis-$(date +%s).txt
          chmod 644 $BACKUP_DIR/mis/*.txt
          echo "[✅] Remake MIS logic completed"
