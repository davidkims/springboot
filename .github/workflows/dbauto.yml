name: 🗂️ All-in-One echo/CLI/DB/복제/이메일 자동화 + 이메일 환경 자동복구

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  workflow-dbify:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 주요 디렉토리/로그/복제 (echo)
        run: |
          for d in .github/sql .github/error_logs .github/cli_test .github/echo_db \
                   .github/cli_test_bak .github/cli_test_bak2 .github/echo_db_bak .github/echo_db_bak2 .github/email_outbox; do
            echo "echo 'mkdir -p $d'"
            mkdir -p $d
          done
          echo "echo 'touch .github/error_logs/disabled_workflows.txt'" ; touch .github/error_logs/disabled_workflows.txt
          echo "echo 'touch .github/error_logs/init_check.log'" ; touch .github/error_logs/init_check.log

      - name: 📄 requirements.txt 생성 (echo)
        run: |
          echo "echo 'pyyaml' > requirements.txt"
          echo 'pyyaml' > requirements.txt

      - name: 📨 Postfix/aliases 등 메일환경 완전 자동 셋업 (echo/존재확인/샘플)
        run: |
          echo "echo '[EMAIL] postfix 및 메일환경 자동 설치/복구'"
          echo '[EMAIL] postfix 및 메일환경 자동 설치/복구'
          echo "echo 'sudo apt-get update -y'" ; sudo apt-get update -y
          echo "echo 'sudo apt-get install -y postfix mailutils'" ; sudo apt-get install -y postfix mailutils

          # /etc/aliases 파일이 없으면 생성, 없으면 root alias 추가
          if [ ! -f /etc/aliases ]; then
            echo "echo '[EMAIL] /etc/aliases 파일이 없어 생성합니다.'"
            echo '[EMAIL] /etc/aliases 파일이 없어 생성합니다.'
            sudo touch /etc/aliases
            sudo chmod 644 /etc/aliases
          fi
          # root alias가 없으면 샘플 추가 (echo)
          if ! grep -q '^root:' /etc/aliases; then
            echo "echo '[EMAIL] /etc/aliases에 root alias가 없어 샘플로 추가합니다.'"
            echo '[EMAIL] /etc/aliases에 root alias가 없어 샘플로 추가합니다.'
            echo 'root:   postmaster' | sudo tee -a /etc/aliases
            sudo newaliases
          else
            echo "echo '[EMAIL] root alias 이미 존재'"
          fi
          # 가상도메인 설정 샘플
          echo "echo '가상 도메인 설정 - /etc/postfix/virtual 생성/추가'"
          echo 'mytest@runner.local   testuser' | sudo tee /etc/postfix/virtual
          sudo postmap /etc/postfix/virtual
          sudo postconf -e "virtual_alias_maps = hash:/etc/postfix/virtual"
          sudo systemctl restart postfix
          echo "echo '[EMAIL] 가상계정 및 postfix 재시작 완료'"

      - name: 📨 가상 메일 발송 스크립트 자동 생성 (echo)
        run: |
          fn=".github/cli_test/send_virtual_mail.sh"
          echo "echo '#!/usr/bin/env bash' > $fn"
          echo '#!/usr/bin/env bash' > $fn
          echo "echo 'set -e' >> $fn"
          echo 'set -e' >> $fn
          echo "echo 'echo [EMAIL] 결과메일 발송' >> $fn"
          echo "echo [EMAIL] 결과메일 발송" >> $fn
          echo "echo 'cat \"\$1\" | mail -s \"[AUTO-REPORT] 워크플로우 결과\" mytest@runner.local' >> $fn"
          echo 'cat "$1" | mail -s "[AUTO-REPORT] 워크플로우 결과" mytest@runner.local' >> $fn
          chmod +x $fn

      - name: 🐳 CLI/DB/echo 대량 생성 및 복제(동적/대량/echo)
        run: |
          CLIS="python3 java node mvn go docker ruby perl php rust swift gradle"
          for cli in $CLIS; do
            fn=".github/cli_test/${cli}_install.sh"
            echo "echo '#!/usr/bin/env bash' > $fn"
            echo '#!/usr/bin/env bash' > $fn
            echo "echo 'set -e' >> $fn"
            echo 'set -e' >> $fn
            echo "echo 'echo [AUTO] $cli 설치 및 버전확인' >> $fn"
            echo "echo [AUTO] $cli 설치 및 버전확인" >> $fn
            echo "echo 'sudo apt-get install -y $cli || true' >> $fn"
            echo "sudo apt-get install -y $cli || true" >> $fn
            echo "echo '$cli --version || true' >> $fn"
            echo "$cli --version || true" >> $fn
            chmod +x $fn
          done
          # echo DB SQL 대량 생성(각 10테이블/100행)
          for dbname in cli echo docker sample logs extra tmp myapp user history; do
            sqlfile=".github/sql/${dbname}_echo_db.sql"
            echo "echo '-- [${dbname}] echo db auto table 대량생성' > $sqlfile"
            echo "-- [${dbname}] echo db auto table 대량생성" > $sqlfile
            for n in $(seq 1 10); do
              tname="${dbname}_logs$n"
              echo "echo 'CREATE TABLE IF NOT EXISTS $tname (id INTEGER PRIMARY KEY AUTOINCREMENT, msg TEXT, idx INT, created_at DATETIME DEFAULT CURRENT_TIMESTAMP);' >> $sqlfile"
              echo "CREATE TABLE IF NOT EXISTS $tname (id INTEGER PRIMARY KEY AUTOINCREMENT, msg TEXT, idx INT, created_at DATETIME DEFAULT CURRENT_TIMESTAMP);" >> $sqlfile
              for k in $(seq 1 100); do
                echo "echo \"INSERT INTO $tname (msg, idx) VALUES ('$dbname $tname - echo row $k', $k);\" >> $sqlfile"
                echo "INSERT INTO $tname (msg, idx) VALUES ('$dbname $tname - echo row $k', $k);" >> $sqlfile
              done
            done
          done

      - name: 🐍 workflow2db.py 자동 echo/복제/DB생성 (대량/이메일결과파일 생성)
        run: |
          echo "import os" > workflow2db.py
          echo "import shutil" >> workflow2db.py
          echo "import sqlite3" >> workflow2db.py
          echo "from datetime import datetime" >> workflow2db.py
          echo "" >> workflow2db.py
          echo "WORKFLOWS_DIR = '.github/workflows'" >> workflow2db.py
          echo "DB_PATH = '.github/workflows.db'" >> workflow2db.py
          echo "ERROR_LOG_DIR = '.github/error_logs'" >> workflow2db.py
          echo "CLI_TEST_DIR = '.github/cli_test'" >> workflow2db.py
          echo "SQL_DIR = '.github/sql'" >> workflow2db.py
          echo "ECHO_DB_DIR = '.github/echo_db'" >> workflow2db.py
          echo "EMAIL_OUTBOX = '.github/email_outbox'" >> workflow2db.py
          echo "BACKUP_DIRS = ['.github/cli_test_bak', '.github/cli_test_bak2', '.github/echo_db_bak', '.github/echo_db_bak2']" >> workflow2db.py
          echo "" >> workflow2db.py
          echo "def init_db():" >> workflow2db.py
          echo "    for d in [ERROR_LOG_DIR, CLI_TEST_DIR, SQL_DIR, ECHO_DB_DIR, EMAIL_OUTBOX]+BACKUP_DIRS:" >> workflow2db.py
          echo "        if not os.path.exists(d): os.makedirs(d, exist_ok=True)" >> workflow2db.py
          echo "    if not os.path.exists(DB_PATH):" >> workflow2db.py
          echo "        conn = sqlite3.connect(DB_PATH)" >> workflow2db.py
          echo "        c = conn.cursor()" >> workflow2db.py
          echo "        c.execute('''CREATE TABLE IF NOT EXISTS workflows (id INTEGER PRIMARY KEY AUTOINCREMENT, filename TEXT, language TEXT, cli_tools TEXT, raw_yaml TEXT)''')" >> workflow2db.py
          echo "        conn.commit()" >> workflow2db.py
          echo "        conn.close()" >> workflow2db.py
          # 자동 복제/백업
          echo "    for fname in os.listdir(CLI_TEST_DIR):" >> workflow2db.py
          echo "        if fname.endswith('_install.sh'):" >> workflow2db.py
          echo "            src = os.path.join(CLI_TEST_DIR, fname)" >> workflow2db.py
          echo "            for bak in BACKUP_DIRS:" >> workflow2db.py
          echo "                shutil.copy2(src, os.path.join(bak, fname))" >> workflow2db.py
          echo "    for fname in os.listdir(SQL_DIR):" >> workflow2db.py
          echo "        if fname.endswith('_echo_db.sql'):" >> workflow2db.py
          echo "            src = os.path.join(SQL_DIR, fname)" >> workflow2db.py
          echo "            shutil.copy2(src, os.path.join(ECHO_DB_DIR, fname))" >> workflow2db.py
          echo "            for bak in BACKUP_DIRS:" >> workflow2db.py
          echo "                shutil.copy2(src, os.path.join(bak, fname))" >> workflow2db.py
          # 대량 결과 파일 요약 생성 (이메일용)
          echo "    summary = []" >> workflow2db.py
          echo "    summary.append('워크플로우 자동화 결과 요약')" >> workflow2db.py
          echo "    summary.append('CLI 설치 스크립트 수: %d' % len([f for f in os.listdir(CLI_TEST_DIR) if f.endswith('_install.sh')]))" >> workflow2db.py
          echo "    summary.append('Echo DB SQL 파일 수: %d' % len([f for f in os.listdir(SQL_DIR) if f.endswith('_echo_db.sql')]))" >> workflow2db.py
          echo "    for sql in os.listdir(SQL_DIR):" >> workflow2db.py
          echo "        if sql.endswith('_echo_db.sql'):" >> workflow2db.py
          echo "            path = os.path.join(SQL_DIR, sql)" >> workflow2db.py
          echo "            with open(path) as f:" >> workflow2db.py
          echo "                lines = f.readlines()" >> workflow2db.py
          echo "            create_cnt = len([l for l in lines if 'CREATE TABLE' in l])" >> workflow2db.py
          echo "            insert_cnt = len([l for l in lines if 'INSERT INTO' in l])" >> workflow2db.py
          echo "            summary.append(f'{sql}: {create_cnt} tables / {insert_cnt} rows')" >> workflow2db.py
          echo "    with open(os.path.join(EMAIL_OUTBOX, 'summary.txt'), 'w', encoding='utf-8') as f:" >> workflow2db.py
          echo "        f.write('\\n'.join(summary))" >> workflow2db.py
          echo "" >> workflow2db.py
          echo "if __name__ == '__main__':" >> workflow2db.py
          echo "    print('[echo] DB/CLI 자동 디렉토리/파일 생성, 대량 복제 및 결과 summary.txt 생성 시작')" >> workflow2db.py
          echo "    init_db()" >> workflow2db.py
          echo "    print('[echo] 완료!')" >> workflow2db.py

      - name: 🧪 pip 설치 및 패키지 설치
        run: |
          echo "echo 'sudo apt-get update -y'" ; sudo apt-get update -y
          echo "echo 'echo python3-pip 설치'" ; echo python3-pip 설치
          echo "echo 'sudo apt-get install -y python3-pip'" ; sudo apt-get install -y python3-pip
          echo "echo 'pip install --upgrade pip'" ; pip install --upgrade pip
          echo "echo 'pip install -r requirements.txt'" ; pip install -r requirements.txt

      - name: 🚀 workflow2db.py 실행 (이메일 결과 summary 생성 포함)
        run: |
          echo "echo '[실행] workflow2db.py (이메일 결과 summary 포함)'"
          echo '[실행] workflow2db.py (이메일 결과 summary 포함)'
          python3 workflow2db.py

      - name: 📨 워크플로우 결과를 가상 메일로 발송 (echo/샘플)
        run: |
          echo "echo '[EMAIL] summary.txt 메일 발송'"
          echo '[EMAIL] summary.txt 메일 발송'
          .github/cli_test/send_virtual_mail.sh .github/email_outbox/summary.txt || true

      - name: 📂 최종 결과 요약
        run: |
          echo '[최종 결과] DB, CLI, echo DB, 대량 테이블/복제, 이메일 결과 확인'
          ls -lh .github/workflows.db
          echo '[로그] .github/error_logs/*, disabled_workflows.txt'
          ls -l .github/error_logs || true
          cat .github/error_logs/disabled_workflows.txt || true
          echo '[이메일 아웃박스]'
          cat .github/email_outbox/summary.txt || true
