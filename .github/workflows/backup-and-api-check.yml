name: 🛡️ CodeQL Ultimate Multi-Language Scan + Build Error Fix & Result Replication

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  codeql-multi:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Install CodeQL CLI
        run: |
          echo "echo '[🛠️] Installing CodeQL CLI...'"
          echo '[🛠️] Installing CodeQL CLI...'
          wget -qO- https://github.com/github/codeql-cli-binaries/releases/latest/download/codeql-linux64.zip > codeql.zip
          unzip -qo codeql.zip -d $HOME/codeql
          chmod +x $HOME/codeql/codeql/codeql
          echo 'export PATH="$HOME/codeql/codeql:$PATH"' >> $GITHUB_ENV
          $HOME/codeql/codeql/codeql --version

      - name: 🏗️ Install Build Tools for CodeQL
        run: |
          echo "echo '[🏗️] Detecting and installing build tools for CodeQL...'"
          echo '[🏗️] Detecting and installing build tools for CodeQL...'
          # Java: Maven/Gradle
          if [ -f pom.xml ]; then
            echo "echo '[🟢] Detected pom.xml, installing Maven...'"
            echo '[🟢] Detected pom.xml, installing Maven...'
            sudo apt-get update && sudo apt-get install -y maven
          fi
          if [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "echo '[🟢] Detected Gradle build, installing Gradle...'"
            echo '[🟢] Detected Gradle build, installing Gradle...'
            sudo apt-get update && sudo apt-get install -y gradle
          fi
          # Python: pip, venv
          if ls **/*.py 2>/dev/null | grep -q .; then
            echo "echo '[🟢] Detected Python, installing pip...'"
            echo '[🟢] Detected Python, installing pip...'
            sudo apt-get update && sudo apt-get install -y python3-pip python3-venv
          fi
          # Node.js: npm, yarn
          if [ -f package.json ]; then
            echo "echo '[🟢] Detected package.json, installing Node.js & npm...'"
            echo '[🟢] Detected package.json, installing Node.js & npm...'
            sudo apt-get update && sudo apt-get install -y nodejs npm
          fi
          # Go: go
          if [ -f main.go ]; then
            echo "echo '[🟢] Detected main.go, installing Go...'"
            echo '[🟢] Detected main.go, installing Go...'
            sudo apt-get update && sudo apt-get install -y golang
          fi

      - name: 🔨 Manual Build (if needed/fallback for CodeQL autobuild)
        run: |
          echo "echo '[🔨] Manual build step for each detected language...'"
          echo '[🔨] Manual build step for each detected language...'
          # Java
          if [ -f pom.xml ]; then
            echo "echo '[🔨] Running mvn package -DskipTests...'"
            echo '[🔨] Running mvn package -DskipTests...'
            mvn package -DskipTests || true
          fi
          if [ -f build.gradle ]; then
            echo "echo '[🔨] Running gradle build...'"
            echo '[🔨] Running gradle build...'
            gradle build || true
          fi
          # Node.js
          if [ -f package.json ]; then
            echo "echo '[🔨] Running npm install...'"
            echo '[🔨] Running npm install...'
            npm install || true
          fi
          # Python
          if [ -f requirements.txt ]; then
            echo "echo '[🔨] Running pip install -r requirements.txt...'"
            echo '[🔨] Running pip install -r requirements.txt...'
            pip3 install -r requirements.txt || true
          fi
          # Go
          if [ -f go.mod ]; then
            echo "echo '[🔨] Running go mod download...'"
            echo '[🔨] Running go mod download...'
            go mod download || true
          fi

      - name: 🔍 CodeQL Multi-Language Scan & Build Error Workaround
        run: |
          echo "echo '[🔍] Detecting supported languages in project...'"
          echo '[🔍] Detecting supported languages in project...'

          detect_langs() {
            langs=""
            [ -d src ] && grep -r -q "def " src/ 2>/dev/null && langs="$langs,python"
            [ -d src ] && grep -r -q "class " src/ 2>/dev/null && langs="$langs,java"
            [ -d src ] && grep -r -q "function " src/ 2>/dev/null && langs="$langs,javascript"
            [ -d src ] && grep -r -q "#include" src/ 2>/dev/null && langs="$langs,cpp"
            [ -f setup.py ] && langs="$langs,python"
            [ -f pom.xml ] && langs="$langs,java"
            [ -f package.json ] && langs="$langs,javascript"
            [ -f main.go ] && langs="$langs,go"
            [ -f Cargo.toml ] && langs="$langs,cpp"
            [ -f Gemfile ] && langs="$langs,ruby"
            langs=$(echo $langs | tr ',' '\n' | grep -v '^$' | sort -u | tr '\n' ',' | sed 's/,$//')
            [ -z "$langs" ] && langs="python,java,javascript"
            echo $langs
          }

          langs=$(detect_langs)
          echo "echo '[🔍] Detected languages: $langs'"
          echo "[🔍] Detected languages: $langs"

          DB_DIR="db-ql"
          SARIF_FILE="codeql-report.sarif"
          OUT_DIR=".github/codeql-out"

          if [[ "$langs" == *,* ]]; then
            echo "echo '[⚡] Creating DB for multiple languages ($langs) with --db-cluster ...'"
            echo "[⚡] Creating DB for multiple languages ($langs) with --db-cluster ..."
            $HOME/codeql/codeql/codeql database create $DB_DIR --language=$langs --db-cluster --source-root=. || touch $OUT_DIR/autobuild_failed
          else
            echo "echo '[⚡] Creating DB for $langs...'"
            echo "[⚡] Creating DB for $langs..."
            $HOME/codeql/codeql/codeql database create $DB_DIR --language=$langs --source-root=. || touch $OUT_DIR/autobuild_failed
          fi

          echo "echo '[⚡] CodeQL database created: $DB_DIR'"
          echo "[⚡] CodeQL database created: $DB_DIR"

          mkdir -p $OUT_DIR

          $HOME/codeql/codeql/codeql database analyze $DB_DIR \
            --format=sarifv2.1.0 \
            --output=$SARIF_FILE \
            --threads=2 --ram=4096 --rerun --trace-process --trace-process-level=3 \
            || echo "echo '[⚠️] CodeQL analyze failed!'"

          # 결과 디렉토리 복제 (분석 결과, DB 등)
          echo "echo '[📂] 복제: 분석 결과 및 데이터 디렉토리 복사 중...'"
          echo "[📂] 복제: 분석 결과 및 데이터 디렉토리 복사 중..."
          cp -rf $DB_DIR $OUT_DIR/ || echo "echo '[⚠️] DB 디렉토리 복사 실패'"
          [ -f $SARIF_FILE ] && cp $SARIF_FILE $OUT_DIR/ || echo "echo '[⚠️] SARIF 파일 복사 실패'"
          ls -lh $OUT_DIR || echo "echo '[⚠️] 결과 디렉토리 확인 실패'"

          echo "echo '[✅] CodeQL SARIF: $OUT_DIR/$SARIF_FILE'"
          echo "[✅] CodeQL SARIF: $OUT_DIR/$SARIF_FILE"

      - name: ⬆️ Upload CodeQL Result Directory (복제본)
        uses: actions/upload-artifact@v4
        with:
          name: codeql-result-outdir
          path: .github/codeql-out/
