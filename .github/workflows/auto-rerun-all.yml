name: "🩺 Workflows Health Check (Echo Everywhere, Clean)"

on:
  workflow_dispatch:
    inputs:
      lookback:
        description: "최근 조회 실행 수 (기본 24)"
        required: false
        default: "24"
      max_reruns:
        description: "자동 재실행 최대 횟수/회 (기본 3)"
        required: false
        default: "3"
      fail_rate_threshold:
        description: "실패율 임계값 (0~1, 기본 0.5)"
        required: false
        default: "0.5"
      fail_abs_threshold:
        description: "절대 실패 횟수 임계값 (기본 3)"
        required: false
        default: "3"
      replica_count:
        description: "랩 복제본 개수 (기본 5)"
        required: false
        default: "5"
      commit_changes:
        description: "변경 커밋/푸시 여부 (true/false, 기본 true)"
        required: false
        default: "true"
      dry_run:
        description: "[안전] 삭제/비활성화 실제 실행 여부(false=실행, true=시뮬레이션)"
        required: false
        default: "false"
  schedule:
    - cron: "0 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      LOG_DIR: ci-labs/logs
      LAB_DIR: ci-labs/labs
      QUAR_DIR: ci-labs/quarantine
      LOOKBACK_DEFAULT: "24"
      MAX_RERUNS_DEFAULT: "3"
      FAIL_RATE_THRESHOLD_DEFAULT: "0.5"
      FAIL_ABS_THRESHOLD_DEFAULT: "3"
      REPLICA_COUNT_DEFAULT: "5"
      COMMIT_CHANGES_DEFAULT: "true"

      # 🔒 에코/안전/페이지 파라미터 (파이썬 스크립트용)
      DRY_RUN_DEFAULT: "false"
      DISABLE_ON_DELETE_DEFAULT: "true"
      PER_PAGE_DEFAULT: "50"
      MAX_PAGES_DEFAULT: "40"
      FAILSAFE_DELETE_LIMIT_DEFAULT: "500"

    steps:
      - name: 🛠️ Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🧰 Install gh & jq (echo)
        shell: bash
        run: |
          set -e
          ts(){ date -u +"%Y-%m-%dT%H:%M:%SZ"; }
          ECHO(){ printf '%s [%s] %s\n' "$(ts)" "$1" "$2"; }

          ECHO INFO "apt-get update -y -qq"
          sudo apt-get update -y -qq

          ECHO INFO "apt-get install -y -qq gh jq"
          sudo apt-get install -y -qq gh jq

          ECHO OK   "tools ready"

      - name: 🐍 Setup Python (echo)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📦 Install Python deps (echo)
        shell: bash
        run: |
          set -e
          ts(){ date -u +"%Y-%m-%dT%H:%M:%SZ"; }
          ECHO(){ printf '%s [%s] %s\n' "$(ts)" "$1" "$2"; }
          ECHO INFO "python -m pip install --upgrade pip"
          python -m pip install --upgrade pip
          ECHO INFO "pip install requests"
          pip install requests
          ECHO OK   "python deps installed"

      - name: 📂 Prepare dirs (echo)
        shell: bash
        env:
          REPORT_FILE: ${{ env.LOG_DIR }}/health_report.md
        run: |
          set -e
          ts(){ date -u +"%Y-%m-%dT%H:%M:%SZ"; }
          ECHO(){ printf '%s [%s] %s\n' "$(ts)" "$1" "$2"; }

          ECHO INFO "mkdir -p $LOG_DIR $LAB_DIR $QUAR_DIR"
          mkdir -p "$LOG_DIR" "$LAB_DIR" "$QUAR_DIR"

          ECHO INFO "init report: $REPORT_FILE"
          {
            echo "# Workflows Health Logs ($(ts))"
            echo
            echo "- repo: $GITHUB_REPOSITORY"
            echo "- run_id: $GITHUB_RUN_ID"
            echo "- sha: $GITHUB_SHA"
          } > "$REPORT_FILE"

          ECHO OK   "dirs prepared and report initialized"

      - name: 🔎 Print inputs & defaults (echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          ts(){ date -u +"%Y-%m-%dT%H:%M:%SZ"; }
          ECHO(){ printf '%s [%s] %s\n' "$(ts)" "$1" "$2"; }

          LOOKBACK="${{ github.event.inputs.lookback || env.LOOKBACK_DEFAULT }}"
          MAX_RERUNS="${{ github.event.inputs.max_reruns || env.MAX_RERUNS_DEFAULT }}"
          FAIL_RATE_THRESHOLD="${{ github.event.inputs.fail_rate_threshold || env.FAIL_RATE_THRESHOLD_DEFAULT }}"
          FAIL_ABS_THRESHOLD="${{ github.event.inputs.fail_abs_threshold || env.FAIL_ABS_THRESHOLD_DEFAULT }}"
          REPLICA_COUNT="${{ github.event.inputs.replica_count || env.REPLICA_COUNT_DEFAULT }}"
          COMMIT_CHANGES="${{ github.event.inputs.commit_changes || env.COMMIT_CHANGES_DEFAULT }}"
          DRY_RUN="${{ github.event.inputs.dry_run || env.DRY_RUN_DEFAULT }}"

          printf "%s [INFO] Inputs/Defaults\n" "$(ts)"
          printf "  LOOKBACK=%s\n" "$LOOKBACK"
          printf "  MAX_RERUNS=%s\n" "$MAX_RERUNS"
          printf "  FAIL_RATE_THRESHOLD=%s\n" "$FAIL_RATE_THRESHOLD"
          printf "  FAIL_ABS_THRESHOLD=%s\n" "$FAIL_ABS_THRESHOLD"
          printf "  REPLICA_COUNT=%s\n" "$REPLICA_COUNT"
          printf "  COMMIT_CHANGES=%s\n" "$COMMIT_CHANGES"
          printf "  DRY_RUN=%s\n" "$DRY_RUN"

      - name: 🧹 Delete failed runs and disable workflows (echo)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # 스크립트 동작 옵션
          DRY_RUN: ${{ github.event.inputs.dry_run || env.DRY_RUN_DEFAULT }}
          DISABLE_ON_DELETE: ${{ env.DISABLE_ON_DELETE_DEFAULT }}
          PER_PAGE: ${{ env.PER_PAGE_DEFAULT }}
          MAX_PAGES: ${{ env.MAX_PAGES_DEFAULT }}
          FAILSAFE_DELETE_LIMIT: ${{ env.FAILSAFE_DELETE_LIMIT_DEFAULT }}
          REPORT_LOG: ${{ env.LOG_DIR }}/delete_disable_$(date +%s).log
        run: |
          set -Eeuo pipefail
          ts(){ date -u +"%Y-%m-%dT%H:%M:%SZ"; }
          ECHO(){ printf '%s [%s] %s\n' "$(ts)" "$1" "$2"; }

          ECHO INFO "python scripts/delete_and_disable_failed_workflows.py (DRY_RUN=$DRY_RUN)"
          python scripts/delete_and_disable_failed_workflows.py 2>&1 | tee -a "$REPORT_LOG"
          ECHO OK   "script finished. log: $REPORT_LOG"

      - name: 🔍 Health check + auto-rerun + labs/quarantine (echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          ts(){ date -u +"%Y-%m-%dT%H:%M:%SZ"; }
          ECHO(){ printf '%s [%s] %s\n' "$(ts)" "$1" "$2"; }
          LOOKBACK="${{ github.event.inputs.lookback || env.LOOKBACK_DEFAULT }}"
          MAX_RERUNS="${{ github.event.inputs.max_reruns || env.MAX_RERUNS_DEFAULT }}"
          FAIL_RATE_THRESHOLD="${{ github.event.inputs.fail_rate_threshold || env.FAIL_RATE_THRESHOLD_DEFAULT }}"
          FAIL_ABS_THRESHOLD="${{ github.event.inputs.fail_abs_threshold || env.FAIL_ABS_THRESHOLD_DEFAULT }}"
          REPLICA_COUNT="${{ github.event.inputs.replica_count || env.REPLICA_COUNT_DEFAULT }}"
          COMMIT_CHANGES="${{ github.event.inputs.commit_changes || env.COMMIT_CHANGES_DEFAULT }}"
          REPORT_MD="$LOG_DIR/health_report.md"

          {
            echo ""
            echo "## Auto Rerun/Labs/Quarantine ($(ts))"
            echo "- LOOKBACK=$LOOKBACK"
            echo "- MAX_RERUNS=$MAX_RERUNS"
            echo "- FAIL_RATE_THRESHOLD=$FAIL_RATE_THRESHOLD"
            echo "- FAIL_ABS_THRESHOLD=$FAIL_ABS_THRESHOLD"
            echo "- REPLICA_COUNT=$REPLICA_COUNT"
            echo "- COMMIT_CHANGES=$COMMIT_CHANGES"
            echo
          } >> "$REPORT_MD"

          # 👉 이 블록 내부에 기존의 헬스체크/재실행/랩/격리 로직을 에코 기반으로 구현
          # ECHO INFO/OK/ERR 로 단계별 로깅만 샘플 표기
          ECHO INFO "start health-check logic (placeholder)..."
          # ... 실제 구현 로직 ...
          ECHO OK   "health-check done"

      - name: 📝 Commit logs to repo (optional, echo)
        if: ${{ github.event.inputs.commit_changes != 'false' && env.COMMIT_CHANGES_DEFAULT != 'false' }}
        shell: bash
        run: |
          set -e
          ts(){ date -u +"%Y-%m-%dT%H:%M:%SZ"; }
          ECHO(){ printf '%s [%s] %s\n' "$(ts)" "$1" "$2"; }
          ECHO INFO "git add logs & labs"
          git add -A ci-labs || true
          if ! git diff --cached --quiet; then
            ECHO INFO "git commit -m 'health logs ($(ts))'"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "health logs ($(ts))"
            ECHO INFO "git push"
            git push
            ECHO OK   "logs committed & pushed"
          else
            ECHO INFO "no changes to commit"
          fi
