name: ✨ MEGA EchoOps + DB/Services/Containers + ELK/Zipkin/Jenkins + Oracle/PostgreSQL Full Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '5,20,35,50 * * * *'

jobs:
  mega-echoops:
    runs-on: ubuntu-latest

    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 📁 Create echo directories
      run: |
        set -e
        for d in packages logs containers install restart upgrade exec compose images services tests db elk grafana zipkin jenkins oracle postgres mongo redis; do
          mkdir -p ".github/echo_${d}"
          echo "echo '[ECHO] Directory created: .github/echo_${d}'" >> .github/echo_dirs/create_dirs.sh
        done
        chmod +x .github/echo_dirs/create_dirs.sh
        .github/echo_dirs/create_dirs.sh

    - name: 🔄 Upgrade & Clean APT
      run: |
        set -e
        sudo apt-get update -y
        sudo apt-get upgrade -y
        sudo apt-get autoremove -y
        sudo apt-get install -f -y
        sudo apt-mark unhold containerd docker.io || true
        sudo apt-get purge -y containerd containerd.io || true

    - name: 💪 Install Essential Packages
      run: |
        set -e
        PACKAGES="curl wget git unzip ufw cron jq htop tree vim build-essential software-properties-common lsb-release gnupg2 ca-certificates apt-transport-https zsh nmap"
        sudo apt-get install -y --no-install-recommends $PACKAGES
        for pkg in $PACKAGES; do
          echo "echo '[PKG] Installed: $pkg'" >> .github/echo_packages/install_$pkg.sh
          echo "dpkg -s $pkg | grep Version" >> .github/echo_packages/install_$pkg.sh
          chmod +x .github/echo_packages/install_$pkg.sh
        done

    - name: 🚀 Install Docker + Docker Compose
      run: |
        curl -fsSL https://get.docker.com -o get-docker.sh && sh get-docker.sh
        sudo usermod -aG docker $USER
        sudo systemctl start docker
        sudo systemctl enable docker
        sudo chmod 666 /var/run/docker.sock
        docker --version | tee .github/echo_tools/docker_version.txt
        docker compose version | tee .github/echo_tools/docker_compose_version.txt

    - name: 🔧 Create docker-compose.yml
      run: |
        cat <<EOF > docker-compose.yml
        version: '3.8'
        services:
          postgres:
            image: postgres
            environment:
              POSTGRES_PASSWORD: pass123
            ports:
              - "5432:5432"
          oracle:
            image: gvenzl/oracle-xe
            environment:
              ORACLE_PASSWORD: pass123
            ports:
              - "1521:1521"
          mongodb:
            image: mongo
            ports:
              - "27017:27017"
          redis:
            image: redis
            ports:
              - "6379:6379"
          elk:
            image: sebp/elk
            ports:
              - "5601:5601"
              - "9200:9200"
              - "5044:5044"
          grafana:
            image: grafana/grafana
            ports:
              - "3000:3000"
          zipkin:
            image: openzipkin/zipkin
            ports:
              - "9411:9411"
          jenkins:
            image: jenkins/jenkins:lts
            ports:
              - "8080:8080"
              - "50000:50000"
        EOF
        cp docker-compose.yml .github/echo_compose/docker-compose.yml

    - name: 🚧 Start docker-compose stack
      run: |
        docker compose up -d
        docker ps -a | tee .github/echo_logs/docker_ps.log

    - name: 🚗 Container Health Check
      run: |
        for svc in postgres oracle mongodb redis elk grafana zipkin jenkins; do
          echo "[CHECK] Service: $svc" | tee -a .github/echo_tests/health_check.log
          docker inspect --format='{{.Name}} => {{.State.Health.Status}}' $svc || echo "$svc has no healthcheck" | tee -a .github/echo_tests/health_check.log
        done

    - name: 📊 Collect Container Logs
      run: |
        for svc in postgres oracle mongodb redis elk grafana zipkin jenkins; do
          docker logs $svc > .github/echo_logs/${svc}_log.txt || true
        done

    - name: 🌐 Summary Echo Output
      run: |
        echo "[SUMMARY] EchoOps complete." | tee .github/echo_logs/final_summary.log
        ls -alR .github/echo_logs >> .github/echo_logs/final_summary.log
        ls -alR .github/echo_tests >> .github/echo_logs/final_summary.log
