name: "🗄️ Hitachi Storage CLI Installer + EchoOps v2.3 (≤10 inputs + mkdir guard)"

on:
  workflow_dispatch:
    inputs:
      accept_eula:
        description: "벤더 EULA/라이선스 동의 (true 여야 진행)"
        required: true
        default: "false"
      product_family:
        description: "제품군 (vsp | vssb | snm2)"
        required: true
        default: "vsp"
      version:
        description: "버전 식별자 (예: 01-82-03-00, 11.0.x)"
        required: false
        default: ""
      target:
        description: "배포/아키텍처 (예: ubuntu:noble@amd64 | ubuntu-jammy-amd64 | rhel-9-x86_64)"
        required: true
        default: "ubuntu:noble@amd64"
      install_dir:
        description: "수동 배포 설치 경로"
        required: true
        default: "/opt/hitachi/cli"
      run_sanity_tests:
        description: "설치 후 raidcom 등 존재 확인"
        required: true
        default: "true"
      make_archives:
        description: "로그/산출물 site/ 커밋 및 아티팩트 업로드"
        required: true
        default: "true"
      manifest_urls:
        description: "(선택) 추가 매니페스트 URL 목록(공백 구분)"
        required: false
        default: ""
      extra_headers:
        description: "(선택) 사설 URL용 HTTP 헤더 (여러 줄 가능: Authorization: Bearer XXX)"
        required: false
        default: ""
      force_filename:
        description: "(선택) 강제 파일명 (예: CCI-01-82-03-Linux-x86_64.deb)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

env:
  ECHO_ROOT: .github/echo_storage
  ECHO_LOG: .github/echo_storage/logs
  ECHO_OUT: .github/echo_storage/out
  SITE_DIR: site/hitachi
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/hitachi/cli/bin

jobs:
  install-hitachi-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prep:mkdir + Echo headers
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "[ECHO] TS=$TS :: Start Hitachi CLI install" | tee -a "$ECHO_LOG/install.log"
          echo "[ECHO] Runner: $(uname -a)" | tee -a "$ECHO_LOG/install.log"

      - name: EULA check
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"
          if [[ "${{ inputs.accept_eula }}" != "true" ]]; then
            echo "[ECHO][FAIL] EULA not accepted. Set accept_eula=true to proceed." | tee -a "$ECHO_LOG/install.log"
            exit 2
          fi
          echo "[ECHO] EULA accepted." | tee -a "$ECHO_LOG/install.log"

      - name: Parse target (distro/release/arch)
        id: target
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"
          t="$TARGET"
          if [[ "$t" =~ ^([^:@-]+):([^@]+)@(.+)$ ]]; then
            distro="${BASH_REMATCH[1]}"; release="${BASH_REMATCH[2]}"; arch="${BASH_REMATCH[3]}"
          else
            IFS='-' read -r distro release arch <<<"$t"
            if [[ -z "$arch" ]]; then
              echo "[ECHO][FAIL] invalid target: $t" | tee -a "$ECHO_LOG/install.log"; exit 10
            fi
          fi
          echo "distro=$distro"   >> $GITHUB_OUTPUT
          echo "release=$release" >> $GITHUB_OUTPUT
          echo "arch=$arch"       >> $GITHUB_OUTPUT
          echo "[ECHO] target => distro=$distro release=$release arch=$arch" | tee -a "$ECHO_LOG/install.log"

      - name: Apt update + deps
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"
          echo "[ECHO] apt update + deps..." | tee -a "$ECHO_LOG/install.log"
          sudo apt-get update -y >>"$ECHO_LOG/apt.log" 2>&1
          sudo apt-get install -y --no-install-recommends curl ca-certificates jq tar xz-utils unzip rpm alien file coreutils gh >>"$ECHO_LOG/apt.log" 2>&1
          echo "[ECHO][OK] deps installed." | tee -a "$ECHO_LOG/install.log"

      - name: Build default manifest (embedded)
        id: manifest_base
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"
          cat > "$ECHO_OUT/manifest.base.json" <<'JSON'
          {
            "schema": "hitachi-cli-manifest/v1",
            "entries": [
              {
                "family": "vsp",
                "cci_version": "01-82-03-00",
                "distro": "ubuntu",
                "release": "noble",
                "arch": "amd64",
                "prefer": ["deb","rpm","tar","zip"],
                "files": {
                  "deb": {
                    "filename": "CCI-01-82-03-00-Ubuntu-24.04-amd64.deb",
                    "sources": [
                      {"type":"gh_release","repo":"${{ github.repository }}","tag":"cci-mirror-01-82-03-00"},
                      {"type":"s3","url":"${S3_CCI_BASE:-}/CCI-01-82-03-00/Ubuntu-24.04/CCI-01-82-03-00-Ubuntu-24.04-amd64.deb"},
                      {"type":"artifactory","url":"${ARTI_CCI_BASE:-}/cci/01-82-03-00/Ubuntu-24.04/CCI-01-82-03-00-Ubuntu-24.04-amd64.deb"}
                    ],
                    "sha256": "REPLACE_WITH_REAL_SHA256"
                  },
                  "rpm": {
                    "filename": "CCI-01-82-03-00-RHEL-9-x86_64.rpm",
                    "sources": [
                      {"type":"s3","url":"${S3_CCI_BASE:-}/CCI-01-82-03-00/RHEL-9/CCI-01-82-03-00-RHEL-9-x86_64.rpm"}
                    ],
                    "sha256": "REPLACE_WITH_REAL_SHA256"
                  },
                  "tar": {
                    "filename": "CCI-01-82-03-00-Linux-x86_64.tar.gz",
                    "sources": [
                      {"type":"s3","url":"${S3_CCI_BASE:-}/CCI-01-82-03-00/generic/CCI-01-82-03-00-Linux-x86_64.tar.gz"}
                    ],
                    "sha256": "REPLACE_WITH_REAL_SHA256"
                  }
                }
              },
              {
                "family": "snm2",
                "cci_version": "MK-97DF8089",
                "distro": "ubuntu",
                "release": "noble",
                "arch": "amd64",
                "prefer": ["zip","tar"],
                "files": {
                  "zip": {
                    "filename": "SNM2-CLI-MK-97DF8089-Linux-x86_64.zip",
                    "sources": [
                      {"type":"s3","url":"${S3_SNM2_BASE:-}/MK-97DF8089/SNM2-CLI-MK-97DF8089-Linux-x86_64.zip"}
                    ],
                    "sha256": "REPLACE_WITH_REAL_SHA256"
                  }
                }
              }
            ]
          }
          JSON
          echo "path=$ECHO_OUT/manifest.base.json" >> $GITHUB_OUTPUT

      - name: Fetch and merge extra manifest(s)
        id: manifest_merge
        shell: bash
        env:
          EXTRA_MANIFESTS: ${{ inputs.manifest_urls }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"
          cp "${{ steps.manifest_base.outputs.path }}" "$ECHO_OUT/manifest.merged.json"
          if [[ -n "${EXTRA_MANIFESTS// }" ]]; then
            echo "$EXTRA_MANIFESTS" | tr ' ' '\n' | while read -r u; do
              [[ -z "$u" ]] && continue
              echo "[ECHO] Fetch manifest: $u" | tee -a "$ECHO_LOG/install.log"
              HFILE="$ECHO_OUT/$(basename "$u" | tr -cd '[:alnum:]._-')"
              if [[ -n "${{ inputs.extra_headers }}" ]]; then
                while IFS= read -r line; do [[ -z "$line" ]] && continue; H+=(-H "$line"); done <<< "${{ inputs.extra_headers }}"
                curl -fsSL "${H[@]}" "$u" -o "$HFILE"
              else
                curl -fsSL "$u" -o "$HFILE"
              fi
              jq -s '.[0] as $a | .[1] as $b | $a + {entries: ($a.entries + ($b.entries // []))}' \
                "$ECHO_OUT/manifest.merged.json" "$HFILE" > "$ECHO_OUT/manifest.tmp.json"
              mv "$ECHO_OUT/manifest.tmp.json" "$ECHO_OUT/manifest.merged.json"
            done
          fi
          echo "path=$ECHO_OUT/manifest.merged.json" >> $GITHUB_OUTPUT

      - name: Resolve asset from manifest
        id: resolve
        shell: bash
        env:
          FAMILY:  ${{ inputs.product_family }}
          CCI_VER: ${{ inputs.version }}
          DISTRO:  ${{ steps.target.outputs.distro }}
          REL:     ${{ steps.target.outputs.release }}
          ARCH:    ${{ steps.target.outputs.arch }}
          FORCE_FILENAME: ${{ inputs.force_filename }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"
          MFILE="${{ steps.manifest_merge.outputs.path }}"
          echo "[ECHO] Resolve asset for family=$FAMILY ver=$CCI_VER ${DISTRO}/${REL} ${ARCH}" | tee -a "$ECHO_LOG/install.log"

          if [[ -n "$FORCE_FILENAME" ]]; then
            echo "filename=$FORCE_FILENAME" >> $GITHUB_OUTPUT
            echo "type=$(echo "$FORCE_FILENAME" | awk -F. '{print $NF}')" >> $GITHUB_OUTPUT
            echo "source=forced" >> $GITHUB_OUTPUT
            exit 0
          fi

          jq -r --arg f "$FAMILY" --arg v "$CCI_VER" --arg d "$DISTRO" --arg r "$REL" --arg a "$ARCH" '
            .entries | map(select(.family==$f and (.cci_version==$v or ($v|length==0)) and .distro==$d and .release==$r and .arch==$a)) | .[0] // empty
          ' "$MFILE" > "$ECHO_OUT/resolve.entry.json"

          if [[ ! -s "$ECHO_OUT/resolve.entry.json" ]]; then
            echo "[ECHO][FAIL] No manifest entry matches. Provide manifest_urls or force_filename." | tee -a "$ECHO_LOG/install.log"
            exit 4
          fi

          PREF=$(jq -r '.prefer[]?' "$ECHO_OUT/resolve.entry.json")
          [[ -z "$PREF" ]] && PREF="deb rpm tar zip"

          : > "$ECHO_OUT/candidates.txt"
          for t in $PREF; do
            jq -e --arg t "$t" '.files[$t]' "$ECHO_OUT/resolve.entry.json" >/dev/null 2>&1 || continue
            FN=$(jq -r --arg t "$t" '.files[$t].filename' "$ECHO_OUT/resolve.entry.json")
            SHA=$(jq -r --arg t "$t" '.files[$t].sha256' "$ECHO_OUT/resolve.entry.json")
            echo "$t|$FN|$SHA" >> "$ECHO_OUT/candidates.txt"
          done

          if [[ ! -s "$ECHO_OUT/candidates.txt" ]]; then
            echo "[ECHO][FAIL] No candidate file types in manifest." | tee -a "$ECHO_LOG/install.log"; exit 5
          fi

          head -n1 "$ECHO_OUT/candidates.txt" | awk -F'|' '{print "type="$1"\nfilename="$2"\nsha256="$3}' >> $GITHUB_OUTPUT

      - name: Try download from sources (GH Release → S3 → Artifactory → HTTP(S))
        id: fetch
        shell: bash
        env:
          TYPE:     ${{ steps.resolve.outputs.type }}
          FILENAME: ${{ steps.resolve.outputs.filename }}
          SHA256:   ${{ steps.resolve.outputs.sha256 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S3_CCI_BASE:   ${{ secrets.S3_CCI_BASE }}
          S3_SNM2_BASE:  ${{ secrets.S3_SNM2_BASE }}
          ARTI_CCI_BASE: ${{ secrets.ARTI_CCI_BASE }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"
          cd "$ECHO_OUT"
          echo "[ECHO] Fetching $FILENAME (type=$TYPE)" | tee -a "$ECHO_LOG/install.log"
          cp "$ECHO_OUT/resolve.entry.json" ./entry.json

          # 1) GitHub Releases
          SRC=$(jq -r '.files[$TYPE].sources[]? | select(.type=="gh_release") | @base64' entry.json | head -n1 || true)
          if [[ -n "$SRC" ]]; then
            REPO=$(echo "$SRC" | base64 -d | jq -r '.repo')
            TAG=$(echo "$SRC"  | base64 -d | jq -r '.tag')
            gh release download "$TAG" --repo "$REPO" --pattern "$FILENAME" --clobber >>"$ECHO_LOG/fetch.log" 2>&1 || true
          fi

          # 2) S3
          if [[ ! -f "$FILENAME" ]]; then
            SRC=$(jq -r '.files[$TYPE].sources[]? | select(.type=="s3") | .url' entry.json | head -n1 || true)
            if [[ -n "$SRC" ]]; then
              if [[ -n "${{ inputs.extra_headers }}" ]]; then
                while IFS= read -r line; do [[ -z "$line" ]] && continue; H+=(-H "$line"); done <<< "${{ inputs.extra_headers }}"
                curl -fsSL "${H[@]}" "$SRC" -o "$FILENAME" >>"$ECHO_LOG/fetch.log" 2>&1 || true
              else
                curl -fsSL "$SRC" -o "$FILENAME" >>"$ECHO_LOG/fetch.log" 2>&1 || true
              fi
            fi
          fi

          # 3) Artifactory
          if [[ ! -f "$FILENAME" ]]; then
            SRC=$(jq -r '.files[$TYPE].sources[]? | select(.type=="artifactory") | .url' entry.json | head -n1 || true)
            if [[ -n "$SRC" ]]; then
              if [[ -n "${{ inputs.extra_headers }}" ]]; then
                while IFS= read -r line; do [[ -z "$line" ]] && continue; H+=(-H "$line"); done <<< "${{ inputs.extra_headers }}"
                curl -fsSL "${H[@]}" "$SRC" -o "$FILENAME" >>"$ECHO_LOG/fetch.log" 2>&1 || true
              else
                curl -fsSL "$SRC" -o "$FILENAME" >>"$ECHO_LOG/fetch.log" 2>&1 || true
              fi
            fi
          fi

          # 4) Generic HTTP(S)
          if [[ ! -f "$FILENAME" ]]; then
            URL=$(jq -r '.files[$TYPE].sources[]? | select(.url!=null) | .url' entry.json | head -n1 || true)
            if [[ -n "$URL" ]]; then
              if [[ -n "${{ inputs.extra_headers }}" ]]; then
                while IFS= read -r line; do [[ -z "$line" ]] && continue; H+=(-H "$line"); done <<< "${{ inputs.extra_headers }}"
                curl -fsSL "${H[@]}" "$URL" -o "$FILENAME" >>"$ECHO_LOG/fetch.log" 2>&1 || true
              else
                curl -fsSL "$URL" -o "$FILENAME" >>"$ECHO_LOG/fetch.log" 2>&1 || true
              fi
            fi
          fi

          if [[ ! -f "$FILENAME" ]]; then
            echo "[ECHO][FAIL] All sources failed: $FILENAME" | tee -a "$ECHO_LOG/install.log"; exit 6
          fi
          echo "[ECHO][OK] Downloaded $FILENAME" | tee -a "$ECHO_LOG/install.log"

          if [[ "$SHA256" != "REPLACE_WITH_REAL_SHA256" && -n "$SHA256" ]]; then
            echo "$SHA256  $FILENAME" > "$FILENAME.sha256"
            sha256sum -c "$FILENAME.sha256" | tee -a "$ECHO_LOG/install.log"
          else
            echo "[ECHO][WARN] No valid sha256 in manifest. Skipping checksum." | tee -a "$ECHO_LOG/install.log"
          fi

      - name: Install (DEB → RPM(alien) → TAR/ZIP)
        id: install
        shell: bash
        env:
          FILENAME: ${{ steps.resolve.outputs.filename }}
          DEST:     ${{ inputs.install_dir }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"
          cd "$ECHO_OUT"
          case "$FILENAME" in
            *.deb)
              echo "[ECHO] dpkg -i $FILENAME" | tee -a "$ECHO_LOG/install.log"
              sudo dpkg -i "$FILENAME" >>"$ECHO_LOG/deb_install.log" 2>&1 || sudo apt-get -f install -y >>"$ECHO_LOG/deb_install.log" 2>&1
              ;;
            *.rpm)
              echo "[ECHO] alien convert & install" | tee -a "$ECHO_LOG/install.log"
              sudo alien -k --scripts "$FILENAME" >>"$ECHO_LOG/rpm_alien.log" 2>&1
              DEB_FILE="$(ls -1 *.deb | head -n1)"
              sudo dpkg -i "$DEB_FILE" >>"$ECHO_LOG/rpm_install.log" 2>&1 || sudo apt-get -f install -y >>"$ECHO_LOG/rpm_install.log" 2>&1
              ;;
            *.tar|*.tar.gz|*.tgz|*.tar.xz|*.zip)
              echo "[ECHO] Archive extract to $DEST" | tee -a "$ECHO_LOG/install.log"
              sudo mkdir -p "$DEST"
              sudo chown -R $USER:$USER "$DEST"
              case "$FILENAME" in
                *.tar.gz|*.tgz) tar -xzf "$FILENAME" -C "$DEST" ;;
                *.tar.xz)       tar -xJf "$FILENAME" -C "$DEST" ;;
                *.tar)          tar -xf  "$FILENAME" -C "$DEST" ;;
                *.zip)          unzip -o "$FILENAME" -d "$DEST" >>"$ECHO_LOG/unzip.log" 2>&1 ;;
              esac
              sudo mkdir -p /opt/hitachi/cli/bin
              for b in raidcom auunitadd; do
                if compgen -G "$DEST/**/$b" > /dev/null; then
                  SRC="$(ls -1 $DEST/**/$b | head -n1)"
                  sudo ln -sf "$SRC" "/opt/hitachi/cli/bin/$b"
                fi
              done
              sudo chmod -R a+rx /opt/hitachi/cli || true
              ;;
            *)
              echo "[ECHO][FAIL] Unsupported file type: $FILENAME" | tee -a "$ECHO_LOG/install.log"; exit 7 ;;
          esac
          echo "status=ok" >> $GITHUB_OUTPUT
          echo "[ECHO][OK] Install step completed." | tee -a "$ECHO_LOG/install.log"

      - name: Sanity tests (optional)
        if: ${{ inputs.run_sanity_tests == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"
          echo "[ECHO] Sanity checks..." | tee -a "$ECHO_LOG/test.log"
          (command -v raidcom && echo "[ECHO][OK] raidcom in PATH: $(command -v raidcom)") | tee -a "$ECHO_LOG/test.log" || echo "[ECHO][WARN] raidcom not found" | tee -a "$ECHO_LOG/test.log"
          (command -v auunitadd && echo "[ECHO][OK] auunitadd in PATH: $(command -v auunitadd)") | tee -a "$ECHO_LOG/test.log" || echo "[ECHO][WARN] auunitadd not found" | tee -a "$ECHO_LOG/test.log"
          if command -v raidcom >/dev/null 2>&1; then
            (raidcom --version || true) >>"$ECHO_LOG/test.log" 2>&1 || true
          fi
          echo "[ECHO][OK] Sanity completed." | tee -a "$ECHO_LOG/test.log"

      - name: Emit manifest + inputs snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"
          jq -n --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg family "${{ inputs.product_family }}" \
                --arg cci_version "${{ inputs.version }}" \
                --arg distro "${{ steps.target.outputs.distro }}" \
                --arg release "${{ steps.target.outputs.release }}" \
                --arg arch "${{ steps.target.outputs.arch }}" \
                --arg install_dir "${{ inputs.install_dir }}" \
                '{ts:$ts,family:$family,cci_version:$cci_version,distro:$distro,release:$release,arch:$arch,install_dir:$install_dir}' \
            | tee "$ECHO_OUT/inputs.json"

      - name: Archive to site/ (optional)
        if: ${{ inputs.make_archives == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$SITE_DIR/logs" "$SITE_DIR/out"
          cp -a "$ECHO_LOG"/*.log "$SITE_DIR/logs/" || true
          cp -a "$ECHO_OUT"/* "$SITE_DIR/out/" || true
          tar -C site -czf "site/hitachi_${TS}.tar.gz" "hitachi"
          echo "[ECHO][OK] Archived to site/hitachi_${TS}.tar.gz" | tee -a "$ECHO_LOG/install.log"

      - name: Upload artifact (logs/out/site)
        if: ${{ inputs.make_archives == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: hitachi-cli-install-${{ github.run_id }}
          path: |
            .github/echo_storage/logs/*
            .github/echo_storage/out/*
            site/**/*

      - name: Commit site/ (optional)
        if: ${{ inputs.make_archives == 'true' && github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"
          if ! git diff --quiet --exit-code -- site/; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site/
            git commit -m "chore(hitachi): archive logs & outputs [${{ github.run_id }}]"
            git push
            echo "[ECHO][OK] site/ committed." | tee -a "$ECHO_LOG/install.log"
          else
            echo "[ECHO] No changes to commit in site/." | tee -a "$ECHO_LOG/install.log"
          fi
