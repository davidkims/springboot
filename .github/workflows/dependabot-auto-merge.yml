name: 🤖 Auto-Approve & Merge Dependabot PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Install GitHub CLI
        run: |
          echo "[🔧] Installing GitHub CLI..."
          sudo apt-get update
          sudo apt-get install -y gh
          echo "[✅] GitHub CLI installed"

      - name: ✅ Auto-approve PR
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔁 Auto-merge PR (squash)
        run: |
          echo "[🔁] Starting auto-merge process..."
          echo "[🔗] Pull Request URL: $PR_URL"
          gh pr merge --auto --squash "$PR_URL"
          echo "[✅] Merge command executed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        continue-on-error: true

      - name: 📄 Save log
        run: |
          echo "[📝] Creating log file..."
          echo "actor: ${{ github.actor }}" > dependabot-merge-log.txt
          echo "url: ${{ github.event.pull_request.html_url }}" >> dependabot-merge-log.txt
          echo "time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> dependabot-merge-log.txt
          cat dependabot-merge-log.txt
