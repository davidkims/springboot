name: "💿 MEGA Finance EchoOps ULTRA (All DB + ISO + Cloud-Init)"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/finance-echo
  IMAGE_TAG: latest
  BACKUP_VOLUME: finance_backup_vol
  BACKUP_DIR: /backup
  KAFKA_LOG: kafka.log
  ECHO_DIR: .github/echo_services
  ISO_DIR: .github/iso
  CLOUDINIT_DIR: .github/cloudinit
  BASH_ENV: ${{ github.workspace }}/.bash_env

jobs:
  mega-finance-echoops:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v5

      - name: 🛠️ echoe 함수 전역 등록
        run: |
          echo 'echoe(){ echo "[ECHO] $@"; }' >> $BASH_ENV
          source $BASH_ENV
          echoe "echoe 함수 등록 완료"

      - name: 📂 Echo 디렉토리 및 파일 생성
        run: |
          source $BASH_ENV
          mkdir -p $ECHO_DIR/{mariadb,oracle,postgres,redis,kafka,mongo,cassandra,clickhouse,accounts,logs,perm}
          for svc in mariadb oracle postgres redis kafka mongo cassandra clickhouse; do
            echo "[ACCOUNT] $svc -> user=finance_${svc}, password=secret_${svc}" > $ECHO_DIR/accounts/$svc.account
            echo "[PERM] $svc -> 권한: ALL PRIVILEGES" > $ECHO_DIR/perm/$svc.perm
            echo "[CONF] $svc 서비스 구성 에코" > $ECHO_DIR/$svc/config.txt
            echo "[LOG] $svc 초기화 로그" > $ECHO_DIR/logs/$svc.log
          done

      # ─────────────── Oracle XE 수정 ───────────────
      - name: 🗄️ Oracle XE 컨테이너 실행 및 계정/테이블 생성 (FIX)
        run: |
          source $BASH_ENV
          echoe "Oracle XE 실행 (계정 생성 FIX)"
          docker run -d --name oracle-echo -e ORACLE_PASSWORD=secret gvenzl/oracle-xe:21-slim
          sleep 50
          echoe "Oracle finance_oracle 유저 생성"
          docker exec oracle-echo bash -c "echo \"CREATE USER finance_oracle IDENTIFIED BY secret_oracle; GRANT CONNECT, DBA TO finance_oracle;\" | sqlplus -s system/secret@//localhost:1521/XEPDB1"
          echoe "Oracle finance.statements 테이블 생성"
          docker exec oracle-echo bash -c "echo \"CREATE TABLE statements (id NUMBER GENERATED BY DEFAULT AS IDENTITY, note VARCHAR2(255), created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP); INSERT INTO statements(note) VALUES ('Oracle Echo Statement');\" | sqlplus -s finance_oracle/secret_oracle@//localhost:1521/XEPDB1"

      # ─────────────── Cloud-Init Seed ISO ───────────────
      - name: 💿 Cloud-Init User-Data ISO 생성
        run: |
          source $BASH_ENV
          echoe "Cloud-Init ISO 생성"
          mkdir -p $CLOUDINIT_DIR
          cat > $CLOUDINIT_DIR/user-data <<'CLOUD'
          #cloud-config
          users:
            - name: financeuser
              groups: sudo
              shell: /bin/bash
              sudo: ['ALL=(ALL) NOPASSWD:ALL']
              passwd: secret123
          runcmd:
            - echo "🚀 Cloud-Init: 금융 서비스 자동 초기화"
            - mkdir -p /opt/finance
            - echo "재무제표 에코" > /opt/finance/init.log
          CLOUD

          cat > $CLOUDINIT_DIR/meta-data <<'META'
          instance-id: finance-echo-001
          local-hostname: finance-echo
          META

          genisoimage -output $ISO_DIR/cloud-init.iso -volid cidata -joliet -rock $CLOUDINIT_DIR
          echoe "Cloud-Init ISO 생성 완료 → $ISO_DIR/cloud-init.iso"

      # ─────────────── Auto Upgrade ───────────────
      - name: 📦 시스템 패키지 업그레이드
        run: |
          source $BASH_ENV
          echoe "시스템 패키지 업그레이드 실행"
          sudo apt-get update
          sudo apt-get -y upgrade
          echoe "업그레이드 완료"

      # ─────────────── DB 쿼리 확인 ───────────────
      - name: 📊 DB 쿼리 확인
        run: |
          source $BASH_ENV
          echoe "MariaDB SELECT"
          docker exec mariadb-echo mysql -uroot -psecret -e "USE finance; SELECT * FROM statements;"
          echoe "Oracle SELECT"
          docker exec oracle-echo bash -c "echo \"SELECT * FROM statements;\" | sqlplus -s finance_oracle/secret_oracle@//localhost:1521/XEPDB1"

      - name: 📄 Kafka-style 로그 출력
        run: |
          source $BASH_ENV
          echo "🪵 Kafka-style 로그 출력:"
          cat $KAFKA_LOG || echo "⚠️ 로그 없음"

      - name: 📦 Echo & ISO 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: finance-echo-artifacts
          path: |
            ${{ env.ECHO_DIR }}
            ${{ env.ISO_DIR }}
            ${{ env.CLOUDINIT_DIR }}
