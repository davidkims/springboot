name: "🛠️ Workflows Mass Upgrade — .github/workflows 일괄 보강(permissions/concurrency/checkout/inputs) + 보고서 + 안전푸시"

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "실제 파일을 덮어쓸까요? true=적용 / false=리포트만"
        default: "true"
        required: true
      backup_dir:
        description: "백업 저장 경로"
        default: ".github/workflows_backup"
        required: true
      add_concurrency:
        description: "concurrency 미존재시 추가 (group=<파일명>, cancel-in-progress=false)"
        default: "true"
        required: true
      force_contents_write:
        description: "permissions.contents=write 강제 보강"
        default: "true"
        required: true
      fix_checkout_fetch_depth:
        description: "actions/checkout@* 에 fetch-depth: 0, persist-credentials: true 주입"
        default: "true"
        required: true
      compress_over_inputs:
        description: "workflow_dispatch inputs가 10개 초과 시 tail을 extra_spec(k=v,comma)으로 압축"
        default: "true"
        required: true
      commit_message:
        description: "커밋 메시지"
        default: "chore: mass-upgrade .github/workflows (perm/concurrency/checkout/inputs) [auto]"
        required: true
  schedule:
    - cron: "*/5 * * * *"  # 5분마다 점검/수정

permissions:
  contents: write

concurrency:
  group: workflows-mass-upgrade
  cancel-in-progress: false

jobs:
  mass-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPORT: .github/workflows_upgrade_report.md
      BACKUP_DIR: ${{ inputs.backup_dir }}
      APPLY: ${{ inputs.apply_changes }}
      ADD_CONC: ${{ inputs.add_concurrency }}
      FORCE_PERM: ${{ inputs.force_contents_write }}
      FIX_CO: ${{ inputs.fix_checkout_fetch_depth }}
      FIX_INPUTS: ${{ inputs.compress_over_inputs }}
      GIT_USER_NAME: gh-actions-bot
      GIT_USER_EMAIL: gh-actions-bot@example.com

    steps:
      - name: 📥 Checkout (full history for safe rebase)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 📦 Install tooling (ruamel.yaml, yamllint)
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install "ruamel.yaml==0.18.6" "yamllint==1.35.1"

      - name: ✍️ Patch script (ruamel.yaml)
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > .github/workflows/_mass_upgrade.py <<'PY'
          import os, glob, shutil
          from ruamel.yaml import YAML
          yaml = YAML()
          yaml.preserve_quotes = True
          yaml.indent(mapping=2, sequence=2, offset=2)

          APPLY        = os.environ.get("APPLY","true").lower()=="true"
          ADD_CONC     = os.environ.get("ADD_CONC","true").lower()=="true"
          FORCE_PERM   = os.environ.get("FORCE_PERM","true").lower()=="true"
          FIX_CO       = os.environ.get("FIX_CO","true").lower()=="true"
          FIX_INPUTS   = os.environ.get("FIX_INPUTS","true").lower()=="true"
          BACKUP_DIR   = os.environ.get("BACKUP_DIR",".github/workflows_backup")
          REPORT       = os.environ.get("REPORT",".github/workflows_upgrade_report.md")

          os.makedirs(BACKUP_DIR, exist_ok=True)
          files = sorted(glob.glob(".github/workflows/*.yml")+glob.glob(".github/workflows/*.yaml"))
          report=[]
          def add(line=""): report.append(line)

          def compress_inputs(inputs: dict):
            keys=list(inputs.keys())
            if len(keys)<=10: return inputs, None
            head=keys[:9]; tail=keys[9:]
            kv=[]
            for k in tail:
              v=inputs[k]
              default=""
              if isinstance(v, dict):
                default = v.get("default") or v.get("Default") or v.get("기본값") or v.get("기본") or ""
              kv.append(f"{k}={default}")
            new_inputs={k:inputs[k] for k in head}
            new_inputs["extra_spec"]={
              "description":"Compressed extra inputs as k=v pairs (comma-separated)",
              "default":",".join(kv),
              "required": False,
            }
            return new_inputs, tail

          changed_any=False
          add("# Workflows Mass Upgrade Report\n")
          for path in files:
            changed=[]
            try:
              with open(path,"r",encoding="utf-8") as f:
                data=yaml.load(f) or {}
            except Exception as e:
              add(f"- ❌ {path}: YAML parse error: {e}")
              continue

            # permissions.contents=write
            if FORCE_PERM:
              perms=data.get("permissions")
              if not isinstance(perms, dict):
                data["permissions"]=perms={}
                changed.append("add permissions:{}")
              if perms.get("contents")!="write":
                perms["contents"]="write"
                changed.append("permissions.contents=write")

            # concurrency
            if ADD_CONC:
              if "concurrency" not in data or not isinstance(data["concurrency"], dict):
                data["concurrency"]={"group":os.path.splitext(os.path.basename(path))[0],"cancel-in-progress":False}
                changed.append("add concurrency{group=fileName,cancel=false}")
              else:
                c=data["concurrency"]
                if "group" not in c:
                  c["group"]=os.path.splitext(os.path.basename(path))[0]
                  changed.append("concurrency.group=fileName")
                if "cancel-in-progress" not in c:
                  c["cancel-in-progress"]=False
                  changed.append("concurrency.cancel-in-progress=false")

            # workflow_dispatch inputs >10 → compress to extra_spec
            if FIX_INPUTS:
              on=data.get("on")
              if isinstance(on, dict) and "workflow_dispatch" in on:
                wd=on["workflow_dispatch"]
                if isinstance(wd, dict) and isinstance(wd.get("inputs"), dict):
                  new_inputs, tail=compress_inputs(wd["inputs"])
                  if tail:
                    wd["inputs"]=new_inputs
                    changed.append(f"compress inputs(>{len(new_inputs)})→extra_spec")

            # checkout hardening
            if FIX_CO:
              jobs=data.get("jobs")
              if isinstance(jobs, dict):
                for jn,job in jobs.items():
                  steps=isinstance(job, dict) and job.get("steps")
                  if not isinstance(steps, list): continue
                  for st in steps:
                    if isinstance(st, dict) and isinstance(st.get("uses"), str) and st["uses"].startswith("actions/checkout@"):
                      wd=st.get("with")
                      if not isinstance(wd, dict): st["with"]=wd={}
                      if wd.get("fetch-depth")!=0:
                        wd["fetch-depth"]=0; changed.append(f"{jn}:checkout.fetch-depth=0")
                      if wd.get("persist-credentials") is not True:
                        wd["persist-credentials"]=True; changed.append(f"{jn}:checkout.persist-credentials=true")

            if changed:
              changed_any=True
              if APPLY:
                bak=os.path.join(BACKUP_DIR, os.path.basename(path)+".orig")
                shutil.copy2(path, bak)
                with open(path,"w",encoding="utf-8") as f: yaml.dump(data, f)
                add(f"- ✅ {path}: "+", ".join(changed))
              else:
                add(f"- 🔎 {path}: (dry-run) "+", ".join(changed))
            else:
              add(f"- ➖ {path}: no changes")

          with open(REPORT,"w",encoding="utf-8") as rf: rf.write("\n".join(report))
          print(f"::notice title=MassUpgrade::Processed {len(files)} workflow(s); changed={changed_any}")
          PY

      - name: 🚀 Run mass upgrade
        run: |
          set -Eeuo pipefail
          python .github/workflows/_mass_upgrade.py
          echo "----- REPORT -----"
          sed -n '1,200p' "$REPORT" || true

      - name: ✅ Lint (actionlint) — advisory
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          level: warning
          fail_on_error: "false"

      - name: ✅ Lint (yamllint) — advisory
        run: |
          set -Eeuo pipefail
          yamllint -f standard -d "{extends: default, rules: {line-length: {max: 160}}}" .github/workflows || true

      - name: 📝 .gitignore update for backups + report
        run: |
          set -Eeuo pipefail
          {
            echo ""
            echo "# mass-upgrade auto-generated"
            echo "${{ inputs.backup_dir }}/"
            echo ".github/workflows/_mass_upgrade.py"
            echo ".github/workflows_upgrade_report.md"
          } >> .gitignore || true

      - name: 🔐 Configure git
        run: |
          set -Eeuo pipefail
          git config user.name "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"
          git config pull.rebase true

      - name: 🧾 Commit & push (rebase fallback + backup branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          git add .github/workflows .github/workflows_upgrade_report.md .gitignore || true
          if git diff --cached --quiet; then
            echo "[ECHO] No changes to commit."
            exit 0
          fi
          git commit -m "${{ inputs.commit_message }}"
          TARGET="${GITHUB_REF_NAME}"
          git fetch origin --prune
          if git push origin "$TARGET"; then
            echo "[ECHO] Pushed to origin/$TARGET"
            exit 0
          fi
          echo "[ECHO] Push rejected — rebase retry"
          git rebase "origin/$TARGET" || { git rebase --abort || true; }
          if git push origin "$TARGET"; then
            echo "[ECHO] Pushed after rebase"
            exit 0
          fi
          BK="actions/mass-upgrade-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "[ECHO] fallback → $BK"
          git checkout -B "$BK"
          git push -u origin "$BK"

      - name: 📦 Upload artifacts (report + backups)
        uses: actions/upload-artifact@v4
        with:
          name: workflows-mass-upgrade
          path: |
            .github/workflows_upgrade_report.md
            ${{ inputs.backup_dir }}/**
          retention-days: 7
