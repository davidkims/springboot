name: 🧩 Backup + API Speed Check with Gitignore Auto-Fix & Retry

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  security-events: write    # required for CodeQL analyze/upload to work

jobs:
  backup-and-api-check:
    runs-on: ubuntu-latest

    services:
      validation-collector:
        image: myorg/validation-collector:latest
        ports:
          - 8080:80

    env:
      MAX_LATENCY_MS: 1000

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Install GitHub CLI (gh)
        run: |
          echo "[🧰] Installing GitHub CLI..."
          sudo apt-get update
          sudo apt-get install -y gh
          which gh && gh --version
          echo "[✅] GitHub CLI installed."

      - name: ⏹️ Cancel long-running 포트폴리오 생성 워크플로우
        run: |
          echo "[⏹️] 이전 포트폴리오 생성 워크플로우 중단 시도..."
          for ID in $(gh run list --workflow="generate_full_readme.yml" \
            --json databaseId,status \
            -q '.[] | select(.status=="in_progress" or .status=="queued") | .databaseId'); do
            echo "[🛑] Cancelling run ID $ID"
            gh run cancel $ID || echo "[⚠️] Cancel failed for $ID"
          done
          echo "[✅] 포트폴리오 생성 워크플로우 중단 완료."

      - name: 📁 Prepare Directories with Permissions
        run: |
          echo "[📁] Creating backup and result directories..."
          mkdir -p .github/backup/workflows site/api_check
          chmod -R 755 .github/backup site/api_check
          echo "[✅] Directories created and permissions set."

      - name: 🧼 Ensure .gitignore Exists with Permissions
        run: |
          echo "[🧼] Ensuring .gitignore exists and includes required exceptions..."
          touch .gitignore && chmod 644 .gitignore
          ensure_gitignore_entry() {
            grep -qxF "$1" .gitignore || echo "$1" >> .gitignore
          }
          ensure_gitignore_entry '!.github/'
          ensure_gitignore_entry '!.github/workflows/'
          ensure_gitignore_entry '!.github/workflows/*.d/'
          ensure_gitignore_entry '!.github/workflows/*.d/**'
          sort .gitignore | uniq > .gitignore.tmp && mv .gitignore.tmp .gitignore
          echo "[✅] Final .gitignore content:"
          cat .gitignore

      - name: 📝 Backup and Create Per-Workflow Directories with .gitkeep
        run: |
          echo "[📝] Backing up workflows and creating per-file directories..."
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            name="${base%.*}"
            backup_dir=".github/workflows/${name}.d"
            echo "[📄] Processing $base → $backup_dir"
            mkdir -p "$backup_dir"
            echo "" > "$backup_dir/.gitkeep"
            chmod 755 "$backup_dir"
            cp "$f" "$backup_dir/$base" && chmod 644 "$backup_dir/$base"
            cp "$f" .github/backup/workflows/ && chmod 644 ".github/backup/workflows/$base"
          done
          echo "[✅] Backup complete with .gitkeep files set."

      - name: 📅 Commit Backups If Changed (Force Add .d/)
        run: |
          echo "[📅] Staging changes..."
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f .github/backup/workflows
          git add -f .github/workflows/*.d/** || echo "[⚠️] .d/ dirs may be ignored"
          git add .gitignore || true
          if git diff --cached --quiet; then
            echo "[ℹ️] No changes to commit."
          else
            git commit -m "📦 Auto-backup of workflows with .gitignore patch and .gitkeep"
            echo "[✅] Commit complete."
          fi

      - name: 🚦 Check Latency of All Extracted URLs
        run: |
          echo "[⚙️] Extracting URLs from workflows and checking latency..."
          for wf in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$wf" ] || continue
            echo "🔎 Checking: $wf"
            FILE_ID=$(basename "$wf" | sed 's/\.[^.]*$//')
            OUTPUT="site/api_check/${FILE_ID}.json"
            echo "[" > "$OUTPUT"
            urls=$(grep -Eo 'https?://[^ )\"]+' "$wf" | sort | uniq)
            index=0
            count=$(echo "$urls" | wc -l)
            for url in $urls; do
              if echo "$url" | grep -qE '\$\{|\$\(|localhost|127\.0\.0\.1|::1'; then
                echo "⏭️ Skipping template or local URL: $url"
                continue
              fi
              echo "🌐 Checking $url..."
              start=$(date +%s%3N)
              status=$(curl -o /dev/null -s -w "%{http_code}" "$url") || status="000"
              end=$(date +%s%3N)
              latency=$((end - start))
              echo "    ↳ Status: $status, Latency: ${latency}ms"
              echo "  {" >> "$OUTPUT"
              echo "    \"url\": \"$url\"," >> "$OUTPUT"
              echo "    \"status\": \"$status\"," >> "$OUTPUT"
              echo "    \"latency_ms\": $latency" >> "$OUTPUT"
              index=$((index+1))
              if [ $index -lt $count ]; then
                echo "  }," >> "$OUTPUT"
              else
                echo "  }" >> "$OUTPUT"
              fi
            done
            echo "]" >> "$OUTPUT"
            echo "✅ Saved to $OUTPUT"
            chmod 644 "$OUTPUT"
          done

      - name: 💾 Upload All API Results
        uses: actions/upload-artifact@v4
        with:
          name: all-api-speed-results
          path: site/api_check/

      - name: 📊 Print Result Preview
        run: |
          echo "[📊] Sample Result Preview:"
          cat site/api_check/*.json | head -n 50 || echo "[ℹ️] No results to show."

      - name: 🧾 Generate .echo.sh for All API Results (with Timestamp)
        run: |
          echo "[🧾] Generating echo.sh from API results..."
          OUT_FILE="site/api_check/echo.sh"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "#!/bin/bash" > "$OUT_FILE"
          echo "# Generated: $TIMESTAMP" >> "$OUT_FILE"
          echo "echo \"[🌐] Replaying API Result Logs with echo...\"" >> "$OUT_FILE"
          for f in site/api_check/*.json; do
            [ -f "$f" ] || continue
            filename=$(basename "$f")
            echo "echo \"[📄] File: $filename\"" >> "$OUT_FILE"
            jq -c '.[]' "$f" | while read -r item; do
              url=$(echo "$item" | jq -r '.url')
              status=$(echo "$item" | jq -r '.status')
              latency=$(echo "$item" | jq -r '.latency_ms')
              echo "echo \"URL: $url | Status: $status | Latency: ${latency}ms\"" >> "$OUT_FILE"
            done
          done
          chmod +x "$OUT_FILE"
          echo "[✅] echo.sh generated at $OUT_FILE"

      # ─────────────────────────────────────────── #
      # CodeQL code-scanning with validation & retry #
      # ─────────────────────────────────────────── #
      - name: 🔍 Initialize CodeQL                     # ← added
        uses: github/codeql-action/init@v2           # ← added

      - name: 🔍 Autobuild                             # ← added
        uses: github/codeql-action/autobuild@v2       # ← added

      - name: 🔍 Perform CodeQL Analysis               # ← added
        id: codeql
        uses: github/codeql-action/analyze@v2         # ← added

      - name: 📤 Upload SARIF to Validation Collector  # ← added
        run: |
          echo "[📤] Uploading SARIF to validation collector..."
          # adjust path if your SARIF lands elsewhere
          SARIF=$(find . -name '*.sarif' | head -n1)
          curl -X POST http://localhost:8080/upload \
            -H "Content-Type: application/sarif+json" \
            --data-binary @"$SARIF" \
            || echo "[⚠️] SARIF upload failed"

      - name: 🔁 Retry Code Scanning on Failure (Max 1)  # ← added
        if: failure() && github.run_attempt == 1
        run: |
          echo "[🔁] Code scanning failed. Retrying workflow…"
          gh workflow run "${{ github.workflow }}" -r "${{ github.ref_name }}"
