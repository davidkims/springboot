name: 📊 Metrics Server Setup & Real-time Data Collection

on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'  # 매분 실행

jobs:
  setup_and_collect:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Generate setup_metrics.sh script
        run: |
          echo "[📝] Generating setup_metrics.sh..."
          cat << 'EOF' > setup_metrics.sh
          #!/usr/bin/env bash
          set -e

          echo "[🛠️] Updating package lists and upgrading all packages..."
          sudo apt-get update
          sudo apt-get upgrade -y
          echo "[✅] System packages upgraded."

          echo "[🛡️] Backing up existing data and config..."
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          for DIR in \
            /opt/prometheus/data \
            /opt/grafana/data \
            /opt/elasticsearch/data \
            /opt/logstash/config \
            /opt/kibana/config \
            /opt/influxdb/data \
            /opt/telegraf/conf; do
            if [ -d "$DIR" ]; then
              BK="${DIR}_backup_$TIMESTAMP"
              sudo mkdir -p "$BK"
              sudo cp -a "$DIR/." "$BK/"
              echo "[✅] Backed up $DIR → $BK"
            else
              echo "[⚪️] $DIR not found, skipping backup"
            fi
          done
          echo "[✅] All backups completed."

          echo "[🛠️] Creating all required directories..."
          mkdir -p /opt/prometheus/data \
                   /opt/grafana/data \
                   /opt/elasticsearch/data \
                   /opt/logstash/config \
                   /opt/kibana/config \
                   /opt/influxdb/data \
                   /opt/telegraf/conf
          echo "[✅] Directories created."

          # Prometheus
          echo "[🛠️] Installing Prometheus..."
          sudo apt-get install -y prometheus
          echo "[✅] Prometheus installed."

          # Grafana
          echo "[🛠️] Installing Grafana..."
          sudo apt-get install -y apt-transport-https software-properties-common wget
          curl -sL https://packages.grafana.com/gpg.key \
            | sudo tee /usr/share/keyrings/grafana-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/grafana-archive-keyring.gpg] https://packages.grafana.com/oss/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/grafana.list
          sudo apt-get update
          sudo apt-get install -y grafana
          echo "[✅] Grafana installed."

          # Elasticsearch
          echo "[🛠️] Installing Elasticsearch..."
          curl -sL https://artifacts.elastic.co/GPG-KEY-elasticsearch \
            | sudo tee /usr/share/keyrings/elasticsearch-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/elasticsearch-archive-keyring.gpg] https://artifacts.elastic.co/packages/7.x/apt stable main" \
            | sudo tee /etc/apt/sources.list.d/elasticsearch.list
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jdk elasticsearch
          echo "[✅] Elasticsearch installed."

          # Logstash
          echo "[🛠️] Installing Logstash..."
          sudo apt-get update
          sudo apt-get install -y logstash
          echo "[✅] Logstash installed."

          # Kibana
          echo "[🛠️] Installing Kibana..."
          sudo apt-get update
          sudo apt-get install -y kibana
          echo "[✅] Kibana installed."

          # InfluxDB & Telegraf
          echo "[🛠️] Installing InfluxDB & Telegraf..."
          # 1) 올바르게 GPG 키를 dearmor 해서 keyring에 추가
          curl -sL https://repos.influxdata.com/influxdb.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/influxdb-archive-keyring.gpg > /dev/null
          # 2) jammy 배포판으로 소스리스트 설정
          echo "deb [signed-by=/usr/share/keyrings/influxdb-archive-keyring.gpg] https://repos.influxdata.com/ubuntu jammy stable" \
            | sudo tee /etc/apt/sources.list.d/influxdb.list
          sudo apt-get update
          sudo apt-get install -y influxdb telegraf
          echo "[✅] InfluxDB & Telegraf installed."
          EOF
          chmod +x setup_metrics.sh
          echo "[✅] setup_metrics.sh 생성 및 실행 권한 부여 완료."

      - name: 🚀 Run setup_metrics.sh
        run: |
          echo "[🚀] Executing setup_metrics.sh..."
          sudo bash setup_metrics.sh

      - name: 📡 Collect real-time workflow metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[📡] Fetching latest 5 workflow runs from GitHub API..."
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=5" \
            > workflow_metrics.json
          echo "[✅] Metrics saved to workflow_metrics.json"
          echo "[📁] Contents preview:"
          head -n 20 workflow_metrics.json || true
