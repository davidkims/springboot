name: 🚀 Full Finance & Scorecard Setup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  full-setup:
    runs-on: ubuntu-latest

    steps:
      - name: 📅 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Docker & CLI 설치
        run: |
          echo "[docker] Docker 설치 중..."
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo systemctl start docker
          docker --version
          echo "[docker] Docker 설치 완료"

          echo "[cli] CLI 도구 설치 중..."
          sudo apt-get update
          sudo apt-get install -y jq curl unzip bc
          echo "[cli] jq, curl, unzip, bc 설치 완료"

      - name: 📂️ 필수 디렉토리 생성
        run: |
          echo "[mkdir] 디렉토리 생성 중..."
          mkdir -p .github/finance/ledgers_credit
          mkdir -p .github/finance/ledgers_check
          mkdir -p .github/finance/files
          mkdir -p .github/scorecard/ledgers
          mkdir -p .github/scorecard/files
          echo "[mkdir] 디렉토리 생성 완료"

      - name: 📓 신용/체카카드 거래 원장 생성 (echo 포함)
        run: |
          echo "[ledger] 신용/체카카드 거래 원장 10개씩 생성 시작..."

          for i in $(seq 1 10); do
            CREDIT_FILE=".github/finance/ledgers_credit/ledger_credit_$i.csv"
            CHECK_FILE=".github/finance/ledgers_check/ledger_check_$i.csv"

            echo "name,date,amount,type,card_number" > $CREDIT_FILE
            echo "name,date,amount,type,card_number" > $CHECK_FILE

            for j in $(seq 1 50); do
              NAME="Customer${j}"
              DATE=$(date -d "$j days ago" +%F)
              AMOUNT=$(echo "scale=2; $((RANDOM % 9000 + 1000))" | bc)

              if [ $((RANDOM % 2)) -eq 0 ]; then
                TYPE="신용"
                BIN="4111"
                RANDOM_NUM=$(printf "%012d" $((RANDOM % 1000000000000)))
                CARD_NUMBER="${BIN}${RANDOM_NUM}"
                echo "$NAME,$DATE,$AMOUNT,$TYPE,$CARD_NUMBER" >> $CREDIT_FILE
              else
                TYPE="체카"
                CARD_NUMBER="CHK$((10000000 + RANDOM % 90000000))"
                echo "$NAME,$DATE,$AMOUNT,$TYPE,$CARD_NUMBER" >> $CHECK_FILE
              fi
            done

            echo "[ledger] ledger_credit_$i.csv / ledger_check_$i.csv 생성 완료"
          done

      - name: 💳 거래 실행 시범리언 (5% 실패 확률 포함)
        run: |
          echo "[simulate] 거래 시뮬코드 시작..."

          for file in .github/finance/ledgers_credit/ledger_credit_*.csv .github/finance/ledgers_check/ledger_check_*.csv; do
            echo "[simulate] 파일 처리 중: $file"
            tail -n +2 "$file" | while IFS=',' read -r name date amount type card_number; do
              echo "🔵 거래: 고객=$name | 금액=₩$amount | 카드=$type | 번호=${card_number:0:4}****" 

              FAIL=$((RANDOM % 100))
              if [[ $FAIL -lt 5 ]]; then
                echo "❌ [거래 실패] $name의 ₩$amount 거래 실패 (network/limit error)"
                continue
              fi

              if [[ "$type" == "신용" ]]; then
                echo "✅ [신용 승인] $name의 ₩$amount 거래 성공"
              else
                echo "✅ [체카 이체] $name의 ₩$amount 거래 성공"
              fi
              sleep 0.1
            done
          done

          echo "[simulate] 모든 거래 완료"

      - name: 📄 금유 보고서 파일 생성
        run: |
          echo "[file] 금유 보고서 파일 생성 시작..."
          for i in $(seq 1 10); do
            echo "이 보고서는 금유 거래 요조입니다. 파일 번호: $i" > .github/finance/files/report_$i.txt
            echo "[file] report_$i.txt 생성 완료"
          done

      - name: ✅ OSSF Scorecard CLI 설치
        run: |
          echo "[scorecard] Scorecard CLI 설치 시작..."
          curl -sLO https://github.com/ossf/scorecard/releases/latest/download/scorecard-linux-amd64
          chmod +x scorecard-linux-amd64
          sudo mv scorecard-linux-amd64 /usr/local/bin/scorecard
          scorecard --version || echo "번서 확인 실패  \uubbf8미"
          echo "[scorecard] 설치 완료"

      - name: 📓 Scorecard 원장 대량 생성
        run: |
          echo "[scorecard-ledger] Scorecard 원장 10개 생성 시작..."
          for i in $(seq 1 10); do
            FILE=".github/scorecard/ledgers/scorecard_$i.csv"
            echo "item,score,comment" > $FILE
            for j in $(seq 1 20); do
              ITEM="SecurityCheck${j}"
              SCORE=$((RANDOM % 100))
              COMMENT=$(if [ $((RANDOM % 2)) -eq 0 ]; then echo "양호"; else echo "개선필요"; fi)
              echo "$ITEM,$SCORE,$COMMENT" >> $FILE
            done
            echo "[scorecard-ledger] scorecard_$i.csv 생성 완료"
          done

      - name: 📊 Scorecard 거래 시뮬코드 (점수 기반)
        run: |
          echo "[simulate-scorecard] 보안 점검 시뮬코드 시작..."

          for file in .github/scorecard/ledgers/scorecard_*.csv; do
            echo "[simulate-scorecard] 파일 처리 중: $file"
            tail -n +2 "$file" | while IFS=',' read -r item score comment; do
              echo "🔍 점검 항목: $item | 점수: $score | 콘메트: $comment"

              if [ "$score" -ge 80 ]; then
                echo "✅ [$item] 포함 검사 결과: 적합"
              else
                echo "⚠️ [$item] 포함 검사 결과: 개선 필요"
              fi

              sleep 0.1
            done
          done

          echo "[simulate-scorecard] 모든 검사 완료"

      - name: 📄 Scorecard 보고서 파일 생성
        run: |
          echo "[scorecard-file] Scorecard 보고서 파일 생성 시작..."
          for i in $(seq 1 10); do
            echo "이 보고서는 오픈소스 보안 점검 결과 요조입니다. 파일: $i" > .github/scorecard/files/oss_report_$i.txt
            echo "[scorecard-file] oss_report_$i.txt 생성 완료"
          done
