name: 🧠 MEGA EMAILOPS + SMTP + MONITORING + VIRUS + FULL ECHO + REAL MTA

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

env:
  BASE: /opt/email
  MONO: /opt/email/.monitoring
  DOMAIN: example.local
  SERVICES: postfix exim4 opensmtpd mailhog maildev mailcatcher smtp4dev
  USER_COUNT: 200
  TEST_COUNT: 5
  INF_BUCKET: metrics
  INF_ORG: org
  INF_USER: admin
  INF_PASS: admin1234!
  INF_TOKEN: dev-token-123456

jobs:
  mega-emailops:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 필수 에코 디렉토리 및 스크립트 생성
        shell: bash
        run: |
          set -Eeuo pipefail
          for d in \
            .github/echo_dirs \
            .github/echo_virus \
            .github/echo_compose \
            .github/echo_scripts \
            .github/echo_logs \
            .github/echo_monitoring \
            .github/echo_pages \
            .github/echo_auth \
            .github/scripts ; do
            mkdir -p "$d"
          done
          mkdir -p "$BASE" "$MONO"

          # init_dirs.sh
          cat <<'EOS' > .github/echo_dirs/init_dirs.sh
          #!/usr/bin/env bash
          set -Eeuo pipefail
          chmod -R 755 "$BASE" "$MONO"
          echo "[ECHO] BASE/Monitoring 디렉토리 권한 설정 완료"
          EOS
          chmod +x .github/echo_dirs/init_dirs.sh

          # emailops_massive_echo.sh
          cat <<'EOS' > .github/scripts/emailops_massive_echo.sh
          #!/usr/bin/env bash
          set -Eeuo pipefail
          mkdir -p "$BASE/services" "$BASE/config" "$BASE/data" "$BASE/logs" \
                   "$MONO/virus" "$MONO/metrics" "$MONO/grafana" "$MONO/influxdb" "$MONO/tmp"
          for s in $SERVICES; do
            mkdir -p "$BASE/services/$s" "$BASE/logs/$s" "$BASE/config/$s"
            echo "[ECHO] 서비스 준비: $s" | tee -a "$BASE/logs/$s/prepare.log"
            printf "user%03d@%s\n" 1 "$DOMAIN" > "$BASE/services/$s/users.txt"
            touch "$BASE/services/$s/mailbox.mbox"
          done
          echo "{}" > "$MONO/metrics/boot.json"
          echo "[ECHO] 서비스별 디렉토리 및 샘플 데이터 생성 완료"
          EOS
          chmod +x .github/scripts/emailops_massive_echo.sh

          # emailops_sendmail.sh
          cat <<'EOS' > .github/scripts/emailops_sendmail.sh
          #!/usr/bin/env bash
          set -Eeuo pipefail
          body_ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "[ECHO] swaks SMTP 테스트 시작"
          swaks --version >/dev/null 2>&1 || { echo "[WARN] swaks 미설치"; exit 0; }
          for port in 25 1025 2525; do
            swaks --to test@local --from ci@local --server 127.0.0.1 --port $port \
                  --data "Subject: SMTP Test on port $port\r\n\r\nBody $body_ts" \
                  || echo "[WARN] SMTP 포트 $port 실패"
          done
          echo "[ECHO] SMTP 테스트 종료"
          EOS
          chmod +x .github/scripts/emailops_sendmail.sh

          # grafana_dashboard_gen.sh
          cat <<'EOS' > .github/scripts/grafana_dashboard_gen.sh
          #!/usr/bin/env bash
          set -Eeuo pipefail
          mkdir -p "$MONO/grafana/provisioning/dashboards"
          cat > "$MONO/grafana/provisioning/dashboards/emailops.json" <<'J'
          {
            "title": "EmailOps Overview",
            "timezone": "browser",
            "schemaVersion": 39,
            "version": 1,
            "panels": [
              { "type": "stat", "title": "Dummy Metric", "id": 1,
                "targets": [], "options": { "reduceOptions": { "values": false } } }
            ]
          }
          J
          echo "[ECHO] Grafana 대시보드 템플릿 생성 완료"
          EOS
          chmod +x .github/scripts/grafana_dashboard_gen.sh

          # docker_compose.sh
          cat <<'EOS' > .github/echo_compose/docker_compose.sh
          #!/usr/bin/env bash
          set -Eeuo pipefail
          cat > .github/echo_compose/docker-compose.yml <<'YML'
          services:
            mailhog:
              image: mailhog/mailhog:latest
              ports: ["1025:1025", "8025:8025"]
              restart: unless-stopped
            smtp4dev:
              image: rnwood/smtp4dev:latest
              ports: ["2525:25", "5000:80"]
              restart: unless-stopped
            influxdb:
              image: influxdb:2
              environment:
                - DOCKER_INFLUXDB_INIT_MODE=setup
                - DOCKER_INFLUXDB_INIT_USERNAME=admin
                - DOCKER_INFLUXDB_INIT_PASSWORD=admin1234!
                - DOCKER_INFLUXDB_INIT_ORG=org
                - DOCKER_INFLUXDB_INIT_BUCKET=metrics
                - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=dev-token-123456
              volumes:
                - /opt/email/.monitoring/influxdb:/var/lib/influxdb2
              ports: ["8086:8086"]
              restart: unless-stopped
            grafana:
              image: grafana/grafana:latest
              volumes:
                - /opt/email/.monitoring/grafana:/var/lib/grafana
                - /opt/email/.monitoring/grafana/provisioning:/etc/grafana/provisioning
              environment:
                - GF_SECURITY_ADMIN_USER=admin
                - GF_SECURITY_ADMIN_PASSWORD=admin1234!
              ports: ["3000:3000"]
              restart: unless-stopped
          YML
          echo "[ECHO] docker-compose.yml 생성 완료"
          docker compose -f .github/echo_compose/docker-compose.yml up -d
          EOS
          chmod +x .github/echo_compose/docker_compose.sh

          # real_mta_install.sh
          cat <<'EOS' > .github/scripts/real_mta_install.sh
          #!/usr/bin/env bash
          set -Eeuo pipefail
          for svc in $SERVICES; do
            case "$svc" in
              postfix)
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postfix
                sudo postconf -e "myhostname = $DOMAIN"
                sudo postconf -e "mydestination = localhost"
                sudo postconf -e "inet_interfaces = all"
                sudo systemctl enable postfix
                sudo systemctl restart postfix
                echo "[ECHO] Postfix 설치 및 설정 완료"
                ;;
              exim4)
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y exim4
                sudo sed -i "s/dc_eximconfig_configtype=.*/dc_eximconfig_configtype='internet'/" /etc/exim4/update-exim4.conf.conf
                sudo update-exim4.conf
                sudo systemctl enable exim4
                sudo systemctl restart exim4
                echo "[ECHO] Exim4 설치 및 설정 완료"
                ;;
              opensmtpd)
                sudo apt-get install -y opensmtpd
                echo "listen on 0.0.0.0" | sudo tee /etc/smtpd.conf
                echo "action \"local_mail\" maildir \"$BASE/maildir\"" | sudo tee -a /etc/smtpd.conf
                echo "match from any for domain \"$DOMAIN\" action \"local_mail\"" | sudo tee -a /etc/smtpd.conf
                sudo systemctl enable opensmtpd
                sudo systemctl restart opensmtpd
                echo "[ECHO] OpenSMTPD 설치 및 설정 완료"
                ;;
            esac
          done
          EOS
          chmod +x .github/scripts/real_mta_install.sh

      - name: 📦 필수 패키지 설치
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y tree swaks jq clamav clamav-daemon yara docker-compose-plugin
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam || true
          sudo systemctl start clamav-daemon || true

      - name: 📁 권한 설정
        shell: bash
        run: bash .github/echo_dirs/init_dirs.sh

      - name: 🛠️ 서비스별 에코 생성
        shell: bash
        run: bash .github/scripts/emailops_massive_echo.sh

      - name: 📨 REAL MTA 설치/설정(Postfix/Exim4/OpenSMTPD)
        shell: bash
        run: bash .github/scripts/real_mta_install.sh

      - name: 📊 Grafana 대시보드 생성
        shell: bash
        run: bash .github/scripts/grafana_dashboard_gen.sh

      - name: 🐳 Docker Compose 서비스 실행
        shell: bash
        run: bash .github/echo_compose/docker_compose.sh

      - name: ✉️ SMTP 테스트
        shell: bash
        run: bash .github/scripts/emailops_sendmail.sh || true

      - name: 🛡️ 바이러스 검사
        shell: bash
        run: |
          clamscan -r --infected "$BASE" "$MONO" | tee .github/echo_logs/clamav_scan.txt

      - name: 🪵 구조 스냅샷 저장
        shell: bash
        run: |
          tree -a "$BASE" > .github/echo_logs/tree_email.txt || true
          tree -a "$MONO" > .github/echo_logs/tree_monitoring.txt || true

      - name: 📤 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: emailops-artifacts
          path: |
            .github/echo_logs/**
            .github/scripts/**
            .github/echo_*/**
          if-no-files-found: warn
