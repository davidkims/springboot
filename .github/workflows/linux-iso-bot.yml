---
name: "🐧 Linux ISO 다운로드 봇"

permissions:
  contents: write

'on':
  workflow_dispatch:
    inputs:
      distro:
        description: "배포판 (ubuntu|debian|rocky|alma|fedora)"
        default: "ubuntu"
        required: true
      release_hint:
        description: "버전 힌트 (비우면 최신)"
        default: ""
        required: false
      arch:
        description: "아키텍처 (amd64|arm64)"
        default: "amd64"
        required: true
  schedule:
    - cron: "*/5 * * * *"

jobs:
  fetch-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ISO image
        env:
          DISTRO: ${{ github.event.inputs.distro || 'ubuntu' }}
          RELEASE_HINT: ${{ github.event.inputs.release_hint }}
          ARCH: ${{ github.event.inputs.arch || 'amd64' }}
        run: |
          set -euo pipefail
          mkdir -p iso-out
          case "$DISTRO" in
            ubuntu)
              REL="${RELEASE_HINT}"
              if [ -z "$REL" ]; then
                REL=$(curl -fsSL https://releases.ubuntu.com/ \
                  | grep -oE 'href="[0-9]{2}\.[0-9]{2}(\.[0-9])?/' \
                  | tr -d 'href="/' \
                  | sort -V | tail -n1)
              fi
              YYMM=$(echo "$REL" | cut -d. -f1-2)
              FILE=""
              for BASE in \
                "https://releases.ubuntu.com/${YYMM}/" \
                "https://cdimage.ubuntu.com/releases/${YYMM}/release/"; do
                if curl -fsI "${BASE}SHA256SUMS" >/dev/null 2>&1; then
                  FILE=$(curl -fsSL "${BASE}SHA256SUMS" | awk "/ubuntu-${REL}.*-live-server-${ARCH}\.iso/{print \$2;exit}" | sed 's/^\*//')
                  [ -n "$FILE" ] && break
                fi
              done
              [ -n "$FILE" ] || { echo "ubuntu ISO not found" >&2; exit 1; }
              curl -fL -o "iso-out/${FILE}" "${BASE}${FILE}"
              SHA_EXPECTED=$(curl -fsSL "${BASE}SHA256SUMS" | awk "/${FILE}/{print \$1;exit}")
              echo "${SHA_EXPECTED}  iso-out/${FILE}" | sha256sum -c -
              ;;
            debian)
              REL="${RELEASE_HINT:-12.5.0}"
              BASE="https://cdimage.debian.org/debian-cd/current/${ARCH}/iso-cd/"
              FILE=$(curl -fsSL "${BASE}SHA256SUMS" | awk '/debian-'${REL}'-'${ARCH}'-netinst.iso/{print $2;exit}' | sed 's/^\*//')
              curl -fL -o "iso-out/${FILE}" "${BASE}${FILE}"
              SHA_EXPECTED=$(curl -fsSL "${BASE}SHA256SUMS" | awk '/debian-'${REL}'-'${ARCH}'-netinst.iso/{print $1;exit}')
              echo "${SHA_EXPECTED}  iso-out/${FILE}" | sha256sum -c -
              ;;
            rocky)
              REL="${RELEASE_HINT:-9.5}"
              ARCH_MAP=$([ "$ARCH" = "arm64" ] && echo "aarch64" || echo "x86_64")
              BASE="https://download.rockylinux.org/pub/rocky/${REL}/isos/${ARCH_MAP}/"
              FILE=$(curl -fsSL "${BASE}CHECKSUM" | awk '/Rocky-'${REL}'.*minimal.*'${ARCH_MAP}'.iso/{print $2;exit}' | sed 's/^\*//')
              SHA_EXPECTED=$(curl -fsSL "${BASE}CHECKSUM" | awk "/${FILE}/{print \$1;exit}")
              curl -fL -o "iso-out/${FILE}" "${BASE}${FILE}"
              echo "${SHA_EXPECTED}  iso-out/${FILE}" | sha256sum -c -
              ;;
            alma)
              REL="${RELEASE_HINT:-9.5}"
              ARCH_MAP=$([ "$ARCH" = "arm64" ] && echo "aarch64" || echo "x86_64")
              BASE="https://repo.almalinux.org/almalinux/${REL}/isos/${ARCH_MAP}/"
              FILE=$(curl -fsSL "${BASE}CHECKSUM" | awk '/AlmaLinux-'${REL}'.*minimal.*'${ARCH_MAP}'.iso/{print $2;exit}' | sed 's/^\*//')
              SHA_EXPECTED=$(curl -fsSL "${BASE}CHECKSUM" | awk "/${FILE}/{print \$1;exit}")
              curl -fL -o "iso-out/${FILE}" "${BASE}${FILE}"
              echo "${SHA_EXPECTED}  iso-out/${FILE}" | sha256sum -c -
              ;;
            fedora)
              REL="${RELEASE_HINT:-40}"
              ARCH_MAP=$([ "$ARCH" = "arm64" ] && echo "aarch64" || echo "x86_64")
              BASE="https://download.fedoraproject.org/pub/fedora/linux/releases/${REL}/Server/${ARCH_MAP}/iso/"
              CHECKSUM_FILE="Fedora-Server-${REL}-${ARCH_MAP}-CHECKSUM"
              FILE=$(curl -fsSL "${BASE}${CHECKSUM_FILE}" | awk '/Fedora-Server-'${REL}'.*dvd.*'${ARCH_MAP}'.iso/{print $2;exit}' | sed 's/^\*//')
              SHA_EXPECTED=$(curl -fsSL "${BASE}${CHECKSUM_FILE}" | awk "/${FILE}/{print \$1;exit}")
              curl -fL -o "iso-out/${FILE}" "${BASE}${FILE}"
              echo "${SHA_EXPECTED}  iso-out/${FILE}" | sha256sum -c -
              ;;
            *)
              echo "unsupported distro: $DISTRO" >&2
              exit 1
              ;;
          esac

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-iso
          path: iso-out/*
          retention-days: 1
