name: 🔐 MEGA Secure CI + AutoUP + EchoOps + GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'  # 10분 간격 실행

permissions:
  contents: read
  pull-requests: write
  id-token: read
  security-events: write
  pages: write

jobs:
  mega-secure-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 Echo 디렉토리 생성
        run: |
          set -e
          echo "#!/bin/bash" > .github/echo_logs/create_dirs.sh
          chmod +x .github/echo_logs/create_dirs.sh
          for dir in \
            .github/echo_scorecard .github/echo_codeql .github/echo_logs \
            .github/echo_security .github/echo_upgrade .github/echo_autoup .github/echo_pages \
            site/scorecard site/security site/upgrade site/pr; do
            mkdir -p "$dir"
            echo "echo '[ECHO] 디렉토리 생성: $dir'" >> .github/echo_logs/create_dirs.sh
          done
          bash .github/echo_logs/create_dirs.sh

      - name: 🛡️ 보안 도구 설치
        run: |
          set -e
          sudo apt-get update -y && sudo apt-get install -y jq curl python3-pip unzip
          pip install bandit pip-audit
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: ✨ Scorecard CLI 설치
        run: |
          set -e
          VERSION="4.10.3"
          curl -sLO https://github.com/ossf/scorecard/releases/download/v${VERSION}/scorecard_${VERSION}_linux_amd64.tar.gz
          tar -xzf scorecard_${VERSION}_linux_amd64.tar.gz
          BIN=$(find scorecard_${VERSION}_linux_amd64* -type f -name scorecard | head -1 || true)
          if [ -z "$BIN" ]; then
            echo "::error ::[ERR] Scorecard binary not found after extract."
            exit 1
          fi
          chmod +x "$BIN"
          sudo mv "$BIN" /usr/local/bin/scorecard
          scorecard --version

      - name: 🔢 Scorecard 실행
        run: |
          set -e
          echo "[ECHO] Scorecard 실행 시작"
          scorecard --repo=https://github.com/${{ github.repository }} --format sarif --no-upload > results.sarif
          scorecard --repo=https://github.com/${{ github.repository }} --format json --no-upload > results.json
          echo "[ECHO] 결과 저장"
          cp results.sarif site/scorecard/scorecard-results.sarif
          cp results.json site/security/security.json

      - name: 💡 Run Bandit, pip-audit, Trivy
        run: |
          set -e
          bandit -r . -f json > site/security/bandit.json || true
          pip-audit -f json -o site/security/pip-audit.json || true
          trivy fs . --format json --output site/security/trivy.json || true
          echo "[ECHO] 보안 분석 결과 저장 완료"

      - name: 📅 업그레이드 가능 항목 확인
        run: |
          set -e
          apt list --upgradable 2>/dev/null | tee site/upgrade/upgradable.txt

      - name: 🔄 업그레이드 PR 생성 (있을 경우)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if grep -q ".*" site/upgrade/upgradable.txt; then
            echo "[ECHO] 업그레이드 PR 생성 시도"
            gh pr create --title "🔄 주간 보안 업그레이드 PR" \
              --body "자동 생성된 업그레이드 PR입니다.\n참조: site/upgrade/upgradable.txt" || true
          fi

      - name: 🌐 GitHub Pages 업로드
        uses: actions/upload-pages-artifact@v2
        with:
          path: site/

      - name: ⚖️ GitHub Pages 배포
        uses: actions/deploy-pages@v2

      - name: 🛠️ 자동 업그레이드 실행
        run: |
          set -e
          cat <<'EOF' > .github/echo_autoup/autoup.sh
          #!/bin/bash
          echo "[AUTOUP] 시스템 패키지 업그레이드 시작"
          sudo apt-get update -y && sudo apt-get upgrade -y
          echo "[AUTOUP] 업그레이드 완료"
          EOF
          chmod +x .github/echo_autoup/autoup.sh
          bash .github/echo_autoup/autoup.sh

      - name: ⏳ 자동 재부팅 예약
        run: |
          echo "[REBOOT] 1분 후 자동 재부팅 예약"
          sudo shutdown -r +1 || true
