name: 🏷️ Label and Comment on PR

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  label-and-comment:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🏷️ Create Label if Missing + Comment
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const issueAuthor = context.payload.sender.login;
            const labelName = 'needs-review';
            const labelColor = '1D76DB';
            const labelDescription = 'Awaiting review by team';

            console.log(`[✍️] PR 작성자: @${issueAuthor}`);

            let labelCreated = false;
            try {
              // 라벨 생성 시도
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName
              });
              console.log(`[✅] '${labelName}' 라벨 이미 존재합니다.`);
            } catch (err) {
              if (err.status === 404) {
                console.log(`[➕] '${labelName}' 라벨이 없어 생성 시도 중...`);
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: labelName,
                    color: labelColor,
                    description: labelDescription
                  });
                  labelCreated = true;
                  console.log(`[✅] '${labelName}' 라벨 생성 완료`);
                } catch (createErr) {
                  console.warn(`⚠️ 라벨 생성 실패: ${createErr.message}`);
                }
              } else {
                throw err;
              }
            }

            // 라벨 부착
            try {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: [labelName]
              });
              console.log(`[🏷️] '${labelName}' 라벨을 PR에 추가 완료`);
            } catch (labelErr) {
              console.warn(`⚠️ PR에 라벨 부착 실패: ${labelErr.message}`);
            }

            // 감사 댓글 작성
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `👋 Thanks for contributing @${issueAuthor}!\n\n✅ Label: \`${labelName}\` 추가됨\n📝 팀에서 곧 리뷰 예정입니다!`
            });

            // echo 파일 저장
            const msg = `label: ${labelName}\ncreated: ${labelCreated}\nby: github-actions[bot]\ntime: ${new Date().toISOString()}\n`;
            fs.writeFileSync('label-log.txt', msg);
            console.log("[📄] label-log.txt 생성 완료");
      
      - name: ⬆️ Upload label-log.txt
        uses: actions/upload-artifact@v4
        with:
          name: label-log
          path: label-log.txt
