name: 🩺 Workflows Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # 매시간 정각(UTC 기준)

jobs:
  health-check:
    name: Health Check All Workflows
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub CLI가 자동으로 사용

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Install GitHub CLI
        run: |
          echo "[🚀] GitHub CLI 설치 중..."
          sudo apt-get update && sudo apt-get install -y gh
          echo "[✅] GitHub CLI 설치 완료"

      - name: 🔍 Health Check All Workflows
        # 실패가 있어도 이 스텝은 항상 0으로 종료하도록 설정
        continue-on-error: true
        run: |
          set +e
          echo "[🔐] GitHub CLI 토큰 자동 사용"
          echo "[🩺] 워크플로우 헬스체크 시작..."

          FAILED=()
          shopt -s nullglob

          for file in .github/workflows/*.{yml,yaml}; do
            WF_FILE=$(basename "$file")
            echo "[🔍] 파일 확인: $WF_FILE"

            STATUS=$(gh run list \
              --workflow "$WF_FILE" \
              --limit 1 \
              --json conclusion \
              --jq '.[0].conclusion' 2>/dev/null)

            if [ -z "$STATUS" ]; then
              echo "[⚠️] '$WF_FILE' 실행 기록 없음, 스킵"
              continue
            fi

            if [ "$STATUS" = "success" ]; then
              echo "[✅] '$WF_FILE' 워크플로우 정상"
            else
              echo "[❌] '$WF_FILE' 마지막 실행 상태: $STATUS"
              FAILED+=("$WF_FILE")
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "[🚨] 헬스체크 실패 워크플로우: ${FAILED[*]}"
          else
            echo "[🎉] 모든 워크플로우 헬스체크 통과"
          fi

          # 항상 0으로 종료해서 에러 처리되지 않도록 함
          exit 0
