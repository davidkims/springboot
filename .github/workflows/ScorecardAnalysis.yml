name: 🛡️ Scorecard Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # 매주 일요일 자정 UTC 실행

permissions:
  contents: read

env:
  SCORECARD_VERSION: "4.10.5"
  GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TARGET_REPO: ${{ github.repository }}
  OUT_DIR: .github/scorecard

jobs:
  run-scorecard:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: 🔧 Install Scorecard CLI
        run: |
          echo "[+] Installing Scorecard CLI version $SCORECARD_VERSION"
          go install github.com/ossf/scorecard/v4@v$SCORECARD_VERSION
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: 📂 Create output directory
        run: mkdir -p $OUT_DIR

      - name: 🧪 Run Scorecard scan
        run: |
          echo "[+] Running Scorecard for repo: $TARGET_REPO"
          scorecard --repo=https://github.com/$TARGET_REPO \
                    --format=json \
                    --show-details > $OUT_DIR/results.json

      - name: 📄 Convert Scorecard JSON to SARIF
        run: |
          echo "[+] Converting to SARIF..."
          scorecard --repo=https://github.com/$TARGET_REPO \
                    --format=sarif > $OUT_DIR/scorecard-results.sarif

      - name: 📤 Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.OUT_DIR }}/scorecard-results.sarif

      - name: 📦 Upload JSON results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-json
          path: ${{ env.OUT_DIR }}/results.json
