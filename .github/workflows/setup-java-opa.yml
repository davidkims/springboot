name: ☕ Java + 🛡️ OPA 설치 및 설정

on:
  workflow_dispatch:

jobs:
  setup-java-opa:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 저장소 체크아웃
        uses: actions/checkout@v4

      - name: ☕ Java 설치 (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 OPA 바이너리 다운로드 및 설치
        run: |
          echo "[+] OPA 최신 버전 다운로드 중..."
          OPA_VERSION="v0.63.0"
          curl -L -o opa https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static

          echo "[+] 실행 권한 부여 및 이동"
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

          echo "[✔] OPA 버전 확인:"
          opa version

      - name: ✅ Java & OPA 정상 설치 확인
        run: |
          echo "[+] Java 확인:"
          java -version
          echo "[+] OPA 확인:"
          opa version
