name: 🗂️ DB/에코/설치/관리/운영/확장/유틸 통합 자동화

on:
  workflow_dispatch:
  schedule:
    - cron: '3,6,9,12,15,18,21,24,27,30,33,36,39,42,45,48,51,54,57 * * * *'

jobs:
  db-echo-all:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 모든 에코/운영/확장/관리/유틸/로그/스크립트 디렉토리 생성 (순차보장)
        run: |
          for d in \
            .github/echo_db/dirs \
            .github/echo_db/files \
            .github/echo_db/installs \
            .github/echo_db/upgrade \
            .github/echo_db/permissions \
            .github/echo_db/scripts \
            .github/echo_db/logs \
            .github/echo_db/services \
            .github/echo_db/compose \
            .github/echo_db/homebrew \
            .github/echo_db/choco \
            .github/echo_db/snap \
            .github/echo_db/cloud \
            .github/echo_db/marketplace \
            .github/echo_db/backup \
            .github/echo_db/init \
            .github/echo_db/test \
            .github/echo_db/migration \
            .github/echo_db/import \
            .github/echo_db/export \
            .github/echo_db/serverinfo \
            .github/echo_db/errorlog \
            .github/echo_db/util; do
            mkdir -p $d
          done

      - name: 📄 전체 에코/운영/관리/유틸/확장 자동 스크립트/파일/로그 생성
        run: |
          set -e

          # 1. echo 디렉토리 생성 명령 저장
          for d in .github/echo_db/*; do
            echo "echo 'mkdir -p $d'" >> .github/echo_db/dirs/mkdir_cmds.sh
          done

          # 2. 모든 DB별 주요 기능/운영/유틸/확장 스크립트/파일 자동화
          DB_LIST="mysql-server mariadb-server postgresql sqlite3 mongodb redis-server"
          for db in $DB_LIST; do
            DB_NAME=${db%%-*}
            # 설치/업그레이드
            echo "echo '[에코] apt install $db'" | tee .github/echo_db/installs/$db-apt-install.sh
            echo "sudo apt-get update -y" >> .github/echo_db/installs/$db-apt-install.sh
            echo "sudo apt-get install -y $db" >> .github/echo_db/installs/$db-apt-install.sh
            echo "echo '[에코] apt upgrade $db'" | tee .github/echo_db/upgrade/$db-apt-upgrade.sh
            echo "sudo apt-get upgrade -y $db" >> .github/echo_db/upgrade/$db-apt-upgrade.sh
            # homebrew/choco/snap
            echo "echo '[에코] brew install $db'" | tee .github/echo_db/homebrew/$db-brew-install.sh
            echo "brew install $db" >> .github/echo_db/homebrew/$db-brew-install.sh
            echo "echo '[에코] choco install $db'" | tee .github/echo_db/choco/$db-choco-install.sh
            echo "choco install $db" >> .github/echo_db/choco/$db-choco-install.sh
            echo "echo '[에코] snap install $db'" | tee .github/echo_db/snap/$db-snap-install.sh
            echo "sudo snap install $db" >> .github/echo_db/snap/$db-snap-install.sh
            # 주요 기능(초기화/백업/테스트/마이그레이션/입출력/서버정보/에러로그/유틸)
            for feat in init backup test migration import export serverinfo errorlog util; do
              F=.github/echo_db/$feat/$db-$feat.sh
              echo "echo '[에코] $db $feat 스크립트'" | tee $F
            done
            # 각 기능별 명령 추가
            if [[ "$db" == "mysql-server" || "$db" == "mariadb-server" ]]; then
              echo "echo 'mysql -uroot -prootpass123 -e \"DROP DATABASE IF EXISTS test_db; CREATE DATABASE test_db;\"'" >> .github/echo_db/init/$db-init.sh
              echo "echo 'mysqldump -uroot -prootpass123 --all-databases > backup.sql'" >> .github/echo_db/backup/$db-backup.sh
              echo "echo 'mysql -uroot -prootpass123 -e \"SHOW DATABASES;\"'" >> .github/echo_db/test/$db-test.sh
              echo "echo 'mysql -uroot -prootpass123 test_db < dump.sql # 마이그레이션'" >> .github/echo_db/migration/$db-migration.sh
              echo "echo 'mysql -uroot -prootpass123 test_db < import.sql # 데이터 import'" >> .github/echo_db/import/$db-import.sh
              echo "echo 'mysqldump -uroot -prootpass123 test_db > export.sql # 데이터 export'" >> .github/echo_db/export/$db-export.sh
              echo "echo 'mysqladmin -uroot -prootpass123 status # 서버 정보'" >> .github/echo_db/serverinfo/$db-serverinfo.sh
              echo "echo 'cat /var/log/mysql/error.log # 에러로그'" >> .github/echo_db/errorlog/$db-errorlog.sh
              echo "echo 'mysql --version # 유틸'" >> .github/echo_db/util/$db-util.sh
            elif [[ "$db" == "postgresql" ]]; then
              echo "echo 'psql -U postgres -c \"DROP DATABASE IF EXISTS test_db; CREATE DATABASE test_db;\"'" >> .github/echo_db/init/$db-init.sh
              echo "echo 'pg_dumpall -U postgres > backup.sql'" >> .github/echo_db/backup/$db-backup.sh
              echo "echo 'psql -U postgres -c \"\\l\"'" >> .github/echo_db/test/$db-test.sh
              echo "echo 'psql -U postgres -d test_db -f dump.sql # 마이그레이션'" >> .github/echo_db/migration/$db-migration.sh
              echo "echo '\\copy table FROM import.csv CSV' # 데이터 import" >> .github/echo_db/import/$db-import.sh
              echo "echo '\\copy table TO export.csv CSV' # 데이터 export" >> .github/echo_db/export/$db-export.sh
              echo "echo 'psql -U postgres -c \"select version();\" # 서버 정보'" >> .github/echo_db/serverinfo/$db-serverinfo.sh
              echo "echo 'cat /var/log/postgresql/postgresql-*.log # 에러로그'" >> .github/echo_db/errorlog/$db-errorlog.sh
              echo "echo 'psql --version # 유틸'" >> .github/echo_db/util/$db-util.sh
            elif [[ "$db" == "sqlite3" ]]; then
              echo "echo 'rm -f test.db && sqlite3 test.db \".databases\"'" >> .github/echo_db/init/$db-init.sh
              echo "echo 'cp test.db backup.db'" >> .github/echo_db/backup/$db-backup.sh
              echo "echo 'sqlite3 test.db \".tables\"'" >> .github/echo_db/test/$db-test.sh
              echo "echo 'sqlite3 test.db < dump.sql # 마이그레이션'" >> .github/echo_db/migration/$db-migration.sh
              echo "echo '.import import.csv table # 데이터 import'" >> .github/echo_db/import/$db-import.sh
              echo "echo '.output export.csv; select * from table; .output stdout # 데이터 export'" >> .github/echo_db/export/$db-export.sh
              echo "echo 'sqlite3 --version # 유틸'" >> .github/echo_db/util/$db-util.sh
            elif [[ "$db" == "mongodb" ]]; then
              echo "echo 'mongo --eval \"db.dropDatabase();\"'" >> .github/echo_db/init/$db-init.sh
              echo "echo 'mongodump --out backup/'" >> .github/echo_db/backup/$db-backup.sh
              echo "echo 'mongo --eval \"show dbs\"'" >> .github/echo_db/test/$db-test.sh
              echo "echo 'mongorestore --db test_db dump/test_db # 마이그레이션'" >> .github/echo_db/migration/$db-migration.sh
              echo "echo 'mongoimport --db test_db --collection c --file import.json'" >> .github/echo_db/import/$db-import.sh
              echo "echo 'mongoexport --db test_db --collection c --out export.json'" >> .github/echo_db/export/$db-export.sh
              echo "echo 'mongo --eval \"db.serverStatus()\" # 서버 정보'" >> .github/echo_db/serverinfo/$db-serverinfo.sh
              echo "echo 'cat /var/log/mongodb/mongod.log # 에러로그'" >> .github/echo_db/errorlog/$db-errorlog.sh
              echo "echo 'mongo --version # 유틸'" >> .github/echo_db/util/$db-util.sh
            elif [[ "$db" == "redis-server" ]]; then
              echo "echo 'redis-cli FLUSHALL'" >> .github/echo_db/init/$db-init.sh
              echo "echo 'cp dump.rdb backup.rdb'" >> .github/echo_db/backup/$db-backup.sh
              echo "echo 'redis-cli INFO'" >> .github/echo_db/test/$db-test.sh
              echo "echo 'cat dump.rdb > /dev/null # 마이그레이션'" >> .github/echo_db/migration/$db-migration.sh
              echo "echo 'redis-cli --rdb import.rdb # 데이터 import'" >> .github/echo_db/import/$db-import.sh
              echo "echo 'cat dump.rdb # 데이터 export'" >> .github/echo_db/export/$db-export.sh
              echo "echo 'redis-cli INFO # 서버 정보'" >> .github/echo_db/serverinfo/$db-serverinfo.sh
              echo "echo 'cat /var/log/redis/redis-server.log # 에러로그'" >> .github/echo_db/errorlog/$db-errorlog.sh
              echo "echo 'redis-server --version # 유틸'" >> .github/echo_db/util/$db-util.sh
            fi
          done

          # 3. 서비스/Compose/Marketplace/권한 echo 자동화
          for db in mysql postgresql mongodb redis; do
            yml=".github/echo_db/services/$db-service.yml"
            echo "echo '[에코] $db 컨테이너 yaml'" | tee $yml
            echo "services:" >> $yml
            echo "  $db:" >> $yml
            echo "    image: $db:latest" >> $yml
            if [ "$db" = "mysql" ]; then
              echo "    env:" >> $yml
              echo "      MYSQL_ROOT_PASSWORD: rootpass123" >> $yml
              echo "    ports: [ '3306:3306' ]" >> $yml
            elif [ "$db" = "postgresql" ]; then
              echo "    env:" >> $yml
              echo "      POSTGRES_PASSWORD: pgpass123" >> $yml
              echo "    ports: [ '5432:5432' ]" >> $yml
            elif [ "$db" = "mongodb" ]; then
              echo "    ports: [ '27017:27017' ]" >> $yml
            elif [ "$db" = "redis" ]; then
              echo "    ports: [ '6379:6379' ]" >> $yml
            fi
            echo "echo '[에코] $db 서비스 컨테이너 yaml 생성 완료'" >> $yml
          done

          composefile=".github/echo_db/compose/all-db-compose.yml"
          echo "echo '[에코] docker-compose all-db'" | tee $composefile
          echo "version: \"3\"" >> $composefile
          echo "services:" >> $composefile
          echo "  mysql:" >> $composefile
          echo "    image: mysql:8.0" >> $composefile
          echo "    environment:" >> $composefile
          echo "      MYSQL_ROOT_PASSWORD: rootpass123" >> $composefile
          echo "    ports: [ \"3306:3306\" ]" >> $composefile
          echo "  postgres:" >> $composefile
          echo "    image: postgres:15" >> $composefile
          echo "    environment:" >> $composefile
          echo "      POSTGRES_PASSWORD: pgpass123" >> $composefile
          echo "    ports: [ \"5432:5432\" ]" >> $composefile
          echo "  mongodb:" >> $composefile
          echo "    image: mongo:latest" >> $composefile
          echo "    ports: [ \"27017:27017\" ]" >> $composefile
          echo "  redis:" >> $composefile
          echo "    image: redis:latest" >> $composefile
          echo "    ports: [ \"6379:6379\" ]" >> $composefile
          echo "echo '[에코] docker-compose 파일 생성 완료'" >> $composefile

          echo "echo '[에코] docker-compose up -d 실행 명령 기록'" | tee .github/echo_db/compose/compose_echo.sh
          echo "docker-compose up -d" >> .github/echo_db/compose/compose_echo.sh

          marketfile=".github/echo_db/marketplace/postgresql-action.yml"
          echo "echo '[에코] PostgreSQL Marketplace Action'" | tee $marketfile
          echo "- uses: harmon758/postgresql-action@v1" >> $marketfile
          echo "  with:" >> $marketfile
          echo "    postgresql version: '13'" >> $marketfile
          echo "    postgresql db: 'test_db'" >> $marketfile
          echo "    postgresql user: 'postgres'" >> $marketfile
          echo "    postgresql password: 'pgpass'" >> $marketfile
          echo "echo '[에코] Marketplace 액션 yaml 생성 완료'" >> $marketfile

          # 권한 echo
          for db in mysql postgresql mongodb redis; do
            perm=".github/echo_db/permissions/$db-permission.sh"
            echo "echo '[에코] $db 권한/유저 설정 시작'" | tee $perm
            if [ "$db" = "mysql" ]; then
              echo "echo \"GRANT ALL PRIVILEGES ON *.* TO 'runner'@'%' IDENTIFIED BY 'pw' WITH GRANT OPTION;\"" >> $perm
              echo "echo \"FLUSH PRIVILEGES;\"" >> $perm
            elif [ "$db" = "postgresql" ]; then
              echo "echo \"CREATE USER runner WITH PASSWORD 'pw';\"" >> $perm
              echo "echo \"GRANT ALL PRIVILEGES ON DATABASE test_db TO runner;\"" >> $perm
            fi
            echo "echo '[에코] 권한 명령 실행 예시]'" >> $perm
            echo "echo 'chown -R runner:runner /var/lib/$db'" >> $perm
            echo "echo 'chmod 700 /var/lib/$db'" >> $perm
            echo "echo '[에코] $db 권한/유저 설정 완료'" >> $perm
          done

          # 로그 echo
          installlog=".github/echo_db/logs/install_done_echo.sh"
          echo "echo '[에코] DB 설치 완료 로그 기록'" | tee $installlog
          echo "date" | tee -a $installlog
          date | tee -a $installlog
          permlog=".github/echo_db/logs/permission_done_echo.sh"
          echo "echo '[에코] DB 권한 완료 로그 기록'" | tee $permlog
          echo "date" | tee -a $permlog
          date | tee -a $permlog

      - name: 🏷️ 실제 설치/업그레이드 실행 (에코 및 실제)
        run: |
          set +e
          for db in mysql-server mariadb-server postgresql sqlite3 mongodb redis-server; do
            echo "[에코] 설치 시도: $db"
            echo "sudo apt-get update -y"
            sudo apt-get update -y
            echo "sudo apt-get install -y $db"
            sudo apt-get install -y $db || echo "[$db] 설치 오류(무시)"
            echo "[에코] 업그레이드 시도: $db"
            echo "sudo apt-get upgrade -y $db"
            sudo apt-get upgrade -y $db || echo "[$db] 업그레이드 오류(무시)"
          done
          echo "[에코] 모든 DB 설치/업그레이드 시도 완료"
          date

      - name: 🏷️ 전체 에코/스크립트/초기화/백업/테스트/권한/마이그레이션/입출력/서버정보/에러로그/유틸/로그 출력
        run: |
          echo "[에코] 에코 전체 파일/스크립트/테스트/초기화/백업/마이그레이션/입출력/유틸/로그 출력 시작"
          find .github/echo_db -type f | sort | while read f; do
            echo "------------------"
            echo "[에코][파일] $f"
            cat $f
            echo
          done
          echo "[에코] 에코 전체 출력 종료"
