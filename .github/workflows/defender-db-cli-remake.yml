name: "⚙️ Maven + Spring Boot: Auto-Setup + Install/Upgrade + Echo Perm + Release (Full Echo Suite)"

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: "프로젝트가 위치한 디렉토리 (pom.xml이 존재하는 경로). 모노레포면 서브폴더 지정"
        required: true
        default: "."
      auto_create_project:
        description: "pom.xml이 없을 때 자동으로 Spring Boot 프로젝트 생성 (true/false)"
        required: true
        default: "true"
      group_id:
        description: "Maven GroupId (자동 생성 시 사용)"
        required: false
        default: "com.example"
      artifact_id:
        description: "Maven ArtifactId (자동 생성 시 사용)"
        required: false
        default: "demo-app"
      package_name:
        description: "Java 패키지명 (자동 생성 시 사용)"
        required: false
        default: "com.example.demo"
      spring_boot_version:
        description: "(선택) 적용할 Spring Boot 버전 (예: 3.3.3). 비우면 현재 pom.xml 유지"
        required: false
        default: "3.3.3"
      maven_version:
        description: "(선택) 사용할 Maven 버전 (예: 3.9.9). 비우면 기본 버전"
        required: false
        default: ""
      bump_type:
        description: "릴리즈 시 버전 증가 유형 (patch|minor|major)"
        required: false
        default: "patch"
      run_tests:
        description: "빌드 전에 테스트 실행 (true/false)"
        required: true
        default: "true"
      create_release:
        description: "릴리즈 생성 및 태그/아티팩트 업로드 (true/false)"
        required: true
        default: "true"
      distribute_artifacts:
        description: "빌드 산출물 업로드 (Artifacts) (true/false)"
        required: true
        default: "true"

permissions:
  contents: write
  actions: read

env:
  JAVA_VERSION: "21"
  ECHO_ROOT: .github/echo_java
  OUT_DIR: .github/echo_java/out
  LOG_DIR: .github/echo_java/logs
  PERM_DIR: .github/echo_java/permissions
  ARTIFACT_DIR: .github/echo_java/artifacts
  TOOLS_DIR: .github/echo_java/tools
  SCRIPTS_DIR: .github/echo_java/scripts
  DOC_DIR: .github/echo_java/docs

jobs:
  build_and_release:
    name: "Build & (Optional) Release"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Bootstrap Echo Suite (dirs + tools + docs + scripts)"
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_ROOT" "$OUT_DIR" "$LOG_DIR" "$PERM_DIR" "$ARTIFACT_DIR" "$TOOLS_DIR" "$SCRIPTS_DIR" "$DOC_DIR"
          # echo.sh: 통합 로깅/헬퍼
          cat > "$TOOLS_DIR/echo.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeo pipefail
          _ts(){ date +"%Y-%m-%d %H:%M:%S"; }
          log(){ printf "[ECHO][%s] %s\n" "$1" "$2"; }
          ok(){ log OK "$*"; }
          warn(){ log WARN "$*"; }
          fail(){ log FAIL "$*"; exit 1; }
          section(){ printf "\n=== %s ===\n" "$*"; }
          ensure_dir(){ mkdir -p "$1" && ok "mkdir -p $1"; }
          # maven helpers
          mvn_run(){ mvn -B -U -e "$@"; }
          SH
          chmod +x "$TOOLS_DIR/echo.sh"
          # 권한 적용 스크립트
          cat > "$SCRIPTS_DIR/apply_permissions.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          section "Apply permissions"
          CHMOD_LIST="${PERM_DIR}/chmod.list"
          CHOWN_LIST="${PERM_DIR}/chown.list"
          if [ -f "$CHMOD_LIST" ]; then
            while read -r mode path || [ -n "$mode" ]; do
              [[ -z "${mode:-}" || "${mode:0:1}" = "#" ]] && continue
              for f in $(echo "$path"); do
                if [ -e "$f" ]; then chmod "$mode" "$f" && ok "chmod $mode $f"; else warn "skip $f"; fi
              done
            done < "$CHMOD_LIST"
          fi
          if [ -f "$CHOWN_LIST" ]; then
            while read -r owner path || [ -n "$owner" ]; do
              [[ -z "${owner:-}" || "${owner:0:1}" = "#" ]] && continue
              for f in $(echo "$path"); do
                if [ -e "$f" ]; then sudo chown "$owner" "$f" && ok "chown $owner $f"; else warn "skip $f"; fi
              done
            done < "$CHOWN_LIST"
          fi
          ok "Permissions applied"
          SH
          chmod +x "$SCRIPTS_DIR/apply_permissions.sh"
          # 아티팩트 수집 스크립트
          cat > "$SCRIPTS_DIR/collect_artifacts.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          section "Collect artifacts"
          ensure_dir "$ARTIFACT_DIR"
          SRC_DIR="${1:-target}"
          find "$SRC_DIR" -type f \( -name "*.jar" -o -name "*.war" \) -not -name "original-*.jar" -print -exec cp -v {} "$ARTIFACT_DIR/" \;
          ok "Artifacts collected into $ARTIFACT_DIR"
          SH
          chmod +x "$SCRIPTS_DIR/collect_artifacts.sh"
          # Spring Boot 프로젝트 생성 스크립트
          cat > "$SCRIPTS_DIR/create_spring_boot_project.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          section "Create Spring Boot Project"
          GROUP_ID="${1:-com.example}"
          ARTIFACT_ID="${2:-demo-app}"
          PACKAGE_NAME="${3:-com.example.demo}"
          SPRING_BOOT_VERSION="${4:-3.3.3}"
          TARGET_DIR="${5:-.}"
          
          # pom.xml 생성
          cat > "$TARGET_DIR/pom.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <parent>
                  <groupId>org.springframework.boot</groupId>
                  <artifactId>spring-boot-starter-parent</artifactId>
                  <version>$SPRING_BOOT_VERSION</version>
                  <relativePath/>
              </parent>
              <groupId>$GROUP_ID</groupId>
              <artifactId>$ARTIFACT_ID</artifactId>
              <version>0.1.0-SNAPSHOT</version>
              <name>$ARTIFACT_ID</name>
              <description>Auto-generated Spring Boot project</description>
              <properties>
                  <java.version>21</java.version>
                  <spring-boot.version>$SPRING_BOOT_VERSION</spring-boot.version>
              </properties>
              <dependencies>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-web</artifactId>
                  </dependency>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-actuator</artifactId>
                  </dependency>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-test</artifactId>
                      <scope>test</scope>
                  </dependency>
              </dependencies>
              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.springframework.boot</groupId>
                          <artifactId>spring-boot-maven-plugin</artifactId>
                      </plugin>
                      <plugin>
                          <groupId>org.codehaus.mojo</groupId>
                          <artifactId>versions-maven-plugin</artifactId>
                          <version>2.16.2</version>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF
          
          # 디렉토리 구조 생성
          JAVA_DIR="$TARGET_DIR/src/main/java/${PACKAGE_NAME//./\/}"
          TEST_DIR="$TARGET_DIR/src/test/java/${PACKAGE_NAME//./\/}"
          RESOURCES_DIR="$TARGET_DIR/src/main/resources"
          
          mkdir -p "$JAVA_DIR" "$TEST_DIR" "$RESOURCES_DIR"
          
          # Main Application 클래스 생성
          MAIN_CLASS_NAME="$(echo ${ARTIFACT_ID} | sed 's/[^a-zA-Z0-9]//g' | sed 's/^./\U&/')Application"
          cat > "$JAVA_DIR/${MAIN_CLASS_NAME}.java" <<EOF
          package $PACKAGE_NAME;
          
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RestController;
          
          @SpringBootApplication
          public class $MAIN_CLASS_NAME {
              public static void main(String[] args) {
                  SpringApplication.run(${MAIN_CLASS_NAME}.class, args);
              }
          }
          
          @RestController
          class HelloController {
              @GetMapping("/")
              public String hello() {
                  return "Hello from $ARTIFACT_ID!";
              }
              
              @GetMapping("/health")
              public String health() {
                  return "OK";
              }
          }
          EOF
          
          # Test 클래스 생성
          cat > "$TEST_DIR/${MAIN_CLASS_NAME}Tests.java" <<EOF
          package $PACKAGE_NAME;
          
          import org.junit.jupiter.api.Test;
          import org.springframework.boot.test.context.SpringBootTest;
          import org.springframework.test.context.junit.jupiter.SpringJUnitConfig;
          
          @SpringBootTest
          @SpringJUnitConfig
          class ${MAIN_CLASS_NAME}Tests {
              @Test
              void contextLoads() {
                  // Test passes if context loads successfully
              }
          }
          EOF
          
          # application.properties 생성
          cat > "$RESOURCES_DIR/application.properties" <<EOF
          # Application Configuration
          server.port=8080
          spring.application.name=$ARTIFACT_ID
          
          # Actuator Configuration
          management.endpoints.web.exposure.include=health,info
          management.endpoint.health.show-details=when-authorized
          
          # Logging Configuration
          logging.level.${PACKAGE_NAME}=INFO
          logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
          EOF
          
          # mvnw wrapper 생성을 위한 임시 명령어 (나중에 Maven에서 생성됨)
          cat > "$TARGET_DIR/.gitignore" <<EOF
          target/
          !.mvn/wrapper/maven-wrapper.jar
          !**/src/main/**/target/
          !**/src/test/**/target/
          
          ### IntelliJ IDEA ###
          .idea
          *.iws
          *.iml
          *.ipr
          
          ### Eclipse ###
          .apt_generated
          .classpath
          .factorypath
          .project
          .settings
          .springBeans
          .sts4-cache
          
          ### VS Code ###
          .vscode/
          
          ### Mac ###
          .DS_Store
          
          ### Logs ###
          *.log
          EOF
          
          ok "Spring Boot project structure created in $TARGET_DIR"
          ok "Main class: $MAIN_CLASS_NAME"
          ok "Package: $PACKAGE_NAME"
          SH
          chmod +x "$SCRIPTS_DIR/create_spring_boot_project.sh"
          # 권한 리스트 템플릿
          cat > "$PERM_DIR/chmod.list" <<'LST'
          # perms target
          0755 scripts/*.sh
          0644 README.md
          0755 mvnw
          0644 src/**/*.java
          0644 src/**/*.properties
          0644 src/**/*.yml
          0644 src/**/*.yaml
          LST
          cat > "$PERM_DIR/chown.list" <<'LST'
          # owner:group target (러너 환경상 root:root 그대로 둘 수 있음)
          root:root .github/echo_java/**/*
          LST
          # 문서/인덱스
          cat > "$DOC_DIR/README.md" <<'MD'
          # Echo Java Suite
          - 통합 로깅(OK/WARN/FAIL)
          - 권한 적용 및 아티팩트 수집 스크립트
          - Spring Boot 프로젝트 자동 생성 기능
          - GitHub Actions 빌드/릴리즈와 연동
          MD
          cat > "$ECHO_ROOT/INDEX.md" <<'MD'
          # Index
          - tools/echo.sh
          - scripts/apply_permissions.sh, scripts/collect_artifacts.sh, scripts/create_spring_boot_project.sh
          - permissions/chmod.list, permissions/chown.list
          - artifacts/, logs/, out/, docs/
          MD
          . "$TOOLS_DIR/echo.sh"; ok "Echo suite bootstrapped"

      - name: "Setup Temurin JDK"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: "(Optional) Setup specific Maven"
        if: ${{ inputs.maven_version != '' }}
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: ${{ inputs.maven_version }}

      - name: "Preflight Check & Auto-Create Project"
        id: preflight
        run: |
          set -Eeuo pipefail
          . "$TOOLS_DIR/echo.sh"
          PROJ_DIR="${{ inputs.project_dir }}"
          section "Preflight: pom.xml check"
          echo "[ECHO] Looking for pom.xml under: $PROJ_DIR"
          
          if [ ! -f "$PROJ_DIR/pom.xml" ]; then
            warn "No pom.xml at $PROJ_DIR"
            if [ "${{ inputs.auto_create_project }}" = "true" ]; then
              section "Auto-create Spring Boot project"
              bash "$SCRIPTS_DIR/create_spring_boot_project.sh" \
                "${{ inputs.group_id }}" \
                "${{ inputs.artifact_id }}" \
                "${{ inputs.package_name }}" \
                "${{ inputs.spring_boot_version }}" \
                "$PROJ_DIR"
              ok "Spring Boot project created at $PROJ_DIR"
            else
              warn "Auto-create disabled, showing available files:"
              { ls -la; echo; find . -maxdepth 2 -type f -name pom.xml | sed 's/^/FOUND: /'; } | tee -a "$GITHUB_STEP_SUMMARY"
              fail "Abort: missing pom.xml and auto-create disabled"
            fi
          else
            ok "Found existing $PROJ_DIR/pom.xml"
          fi
          
          echo "projectDir=$PROJ_DIR" >> "$GITHUB_OUTPUT"
          
          # Maven Wrapper 생성 (없는 경우)
          cd "$PROJ_DIR"
          if [ ! -f "mvnw" ]; then
            section "Generate Maven Wrapper"
            mvn -B wrapper:wrapper -Dmaven=3.9.9
            chmod +x mvnw
            ok "Maven wrapper generated"
          fi

      - name: "Show tool versions"
        run: |
          set -Eeuo pipefail
          . "$TOOLS_DIR/echo.sh"
          section "Tool versions"
          echo "[ECHO] java: $(java -version 2>&1 | head -1)"
          echo "[ECHO] mvn : $(mvn -v | head -1)"
          if [ -f "${{ steps.preflight.outputs.projectDir }}/mvnw" ]; then
            cd "${{ steps.preflight.outputs.projectDir }}"
            echo "[ECHO] mvnw: $(./mvnw -v | head -1)"
          fi
          ok "Tool probe complete"

      - name: "Apply Permission Echo (pre-build)"
        run: |
          set -Eeuo pipefail
          . "$TOOLS_DIR/echo.sh"
          bash "$SCRIPTS_DIR/apply_permissions.sh" | tee "$LOG_DIR/perm-pre.log"

      - name: "(Optional) Upgrade Spring Boot version in pom.xml"
        if: ${{ inputs.spring_boot_version != '' }}
        working-directory: ${{ steps.preflight.outputs.projectDir }}
        run: |
          set -Eeuo pipefail
          . "$GITHUB_WORKSPACE/$TOOLS_DIR/echo.sh"
          section "Upgrade Spring Boot"
          echo "[ECHO] Upgrade Spring Boot to ${{ inputs.spring_boot_version }}"
          mvn_run versions:set-property -Dproperty=spring-boot.version -DnewVersion="${{ inputs.spring_boot_version }}" -DgenerateBackupPoms=false | tee "$GITHUB_WORKSPACE/$LOG_DIR/versions-set-spring-boot.log"
          ok "Spring Boot property updated"

      - name: "(Optional) Run tests"
        if: ${{ inputs.run_tests == 'true' }}
        working-directory: ${{ steps.preflight.outputs.projectDir }}
        run: |
          set -Eeuo pipefail
          . "$GITHUB_WORKSPACE/$TOOLS_DIR/echo.sh"
          section "Run tests"
          mvn_run -DskipTests=false test | tee "$GITHUB_WORKSPACE/$LOG_DIR/mvn-test.log"
          ok "Tests finished"

      - name: "Build (package)"
        working-directory: ${{ steps.preflight.outputs.projectDir }}
        run: |
          set -Eeuo pipefail
          . "$GITHUB_WORKSPACE/$TOOLS_DIR/echo.sh"
          section "Maven package"
          mvn_run -DskipTests=${{ inputs.run_tests != 'true' }} package | tee "$GITHUB_WORKSPACE/$LOG_DIR/mvn-package.log"
          bash "$GITHUB_WORKSPACE/$SCRIPTS_DIR/collect_artifacts.sh" target | tee "$GITHUB_WORKSPACE/$LOG_DIR/artifacts.log"
          ok "Package & collect done"

      - name: "Upload build artifacts"
        if: ${{ inputs.distribute_artifacts == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            ${{ env.ARTIFACT_DIR }}/*
            ${{ env.LOG_DIR }}/*.log

      - name: "(Optional) Bump version, tag & commit"
        if: ${{ inputs.create_release == 'true' }}
        id: bump
        working-directory: ${{ steps.preflight.outputs.projectDir }}
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@github.com
        run: |
          set -Eeuo pipefail
          . "$GITHUB_WORKSPACE/$TOOLS_DIR/echo.sh"
          section "Version bump & tag"
          CURR_VER=$(xmllint --xpath '/*[local-name()="project"]/*[local-name()="version"]/text()' pom.xml 2>/dev/null || echo "0.1.0-SNAPSHOT")
          echo "[ECHO] Current version: $CURR_VER"
          BASE_VER=${CURR_VER%-SNAPSHOT}
          IFS='.' read -r MA MI PA <<<"${BASE_VER:-0.1.0}"
          case "${BUMP_TYPE:-patch}" in
            major) MA=$((MA+1)); MI=0; PA=0;;
            minor) MI=$((MI+1)); PA=0;;
            *)     PA=$((PA+1));;
          esac
          NEXT_VER="$MA.$MI.$PA"
          echo "[ECHO] Next version: $NEXT_VER"
          mvn -B -q versions:set -DnewVersion="$NEXT_VER" -DgenerateBackupPoms=false
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add .
          git commit -m "chore(release): set version $NEXT_VER" || true
          git tag -a "v$NEXT_VER" -m "Release v$NEXT_VER"
          git push origin HEAD:$(git rev-parse --abbrev-ref HEAD) || true
          git push origin "v$NEXT_VER" || true
          echo "next_ver=$NEXT_VER" >> "$GITHUB_OUTPUT"
          ok "Tagged v$NEXT_VER"

      - name: "(Optional) Create GitHub Release"
        if: ${{ inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.next_ver }}
          name: v${{ steps.bump.outputs.next_ver }}
          body: |
            ✅ Automated release
            - Maven: ${{ inputs.maven_version != '' && inputs.maven_version || 'default' }}
            - Spring Boot: ${{ inputs.spring_boot_version != '' && inputs.spring_boot_version || 'pom.xml default' }}
            - Bump: ${{ inputs.bump_type }}
            - Auto-created: ${{ inputs.auto_create_project == 'true' && 'Yes' || 'No' }}
          files: |
            ${{ env.ARTIFACT_DIR }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Apply Permission Echo (post-build)"
        run: |
          set -Eeuo pipefail
          . "$TOOLS_DIR/echo.sh"
          bash "$SCRIPTS_DIR/apply_permissions.sh" | tee "$LOG_DIR/perm-post.log"
          ok "Permission echo complete"

      - name: "Summary"
        run: |
          set -Eeuo pipefail
          . "$TOOLS_DIR/echo.sh"
          section "Summary"
          echo "Build done." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Tool Versions" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java: $(java -version 2>&1 | head -1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Maven: $(mvn -v | head -1)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Project Info" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project Dir: ${{ steps.preflight.outputs.projectDir }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auto-created: ${{ inputs.auto_create_project == 'true' && 'Yes' || 'No' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.auto_create_project }}" = "true" ]; then
            echo "- Group ID: ${{ inputs.group_id }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Artifact ID: ${{ inputs.artifact_id }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${{ steps.bump.outputs.next_ver || '' }}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Release" >> "$GITHUB_STEP_SUMMARY"
            echo "- Created tag v${{ steps.bump.outputs.next_ver }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          ok "Summary generated"
