name: 🗂️ 완전통합 DB/에코/Compose/권한/스크립트/설치/로그 자동화

on:
  workflow_dispatch:
  schedule:
    - cron: '3,6,9,12,15,18,21,24,27,30,33,36,39,42,45,48,51,54,57 * * * *'

permissions:
  contents: read

jobs:
  all-db-echo-total:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DEBIAN_FRONTEND: noninteractive
      MYSQL_ROOT_PASSWORD: rootpass123
      POSTGRES_PASSWORD: pgpass123

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 에코 디렉토리/파일/스크립트/권한 대량 생성 + 에코(안전한 tee)
        shell: bash
        run: |
          set -Eeuo pipefail

          # 0) tee가 쓸 디렉토리/파일을 선행 생성
          mkdir -p .github/echo_db/dirs
          echo '#!/usr/bin/env bash' > .github/echo_db/dirs/mkdir_cmds.sh
          chmod +x .github/echo_db/dirs/mkdir_cmds.sh

          echo "===== [에코] 디렉토리 대량 생성 시작 ====="
          for d in \
            .github/echo_db/dirs \
            .github/echo_db/files \
            .github/echo_db/installs \
            .github/echo_db/upgrade \
            .github/echo_db/permissions \
            .github/echo_db/scripts \
            .github/echo_db/logs \
            .github/echo_db/services \
            .github/echo_db/compose \
            .github/echo_db/homebrew \
            .github/echo_db/choco \
            .github/echo_db/snap \
            .github/echo_db/cloud \
            .github/echo_db/marketplace
          do
            mkdir -p "$d"
            echo "echo 'mkdir -p $d'" | tee -a .github/echo_db/dirs/mkdir_cmds.sh >/dev/null
            echo "echo '[에코] $d 디렉토리 생성 완료'" | tee -a .github/echo_db/dirs/mkdir_cmds.sh >/dev/null
          done
          echo "===== [에코] 디렉토리 대량 생성 완료 ====="

          # 1) 패키지 설치/업그레이드 에코 스크립트 생성
          DB_LIST="mysql-server mariadb-server postgresql sqlite3 mongodb redis-server"
          for db in $DB_LIST; do
            f=".github/echo_db/installs/${db}-apt-install.sh"
            u=".github/echo_db/upgrade/${db}-apt-upgrade.sh"
            b=".github/echo_db/homebrew/${db}-brew-install.sh"
            c=".github/echo_db/choco/${db}-choco-install.sh"
            s=".github/echo_db/snap/${db}-snap-install.sh"

            # install
            {
              echo '#!/usr/bin/env bash'
              echo "set -Eeuo pipefail"
              echo "echo '[에코] apt install $db'"
              echo "sudo apt-get -yq update"
              echo "sudo apt-get -yq install $db"
            } > "$f" && chmod +x "$f"

            # upgrade (정확도 향상: --only-upgrade)
            {
              echo '#!/usr/bin/env bash'
              echo "set -Eeuo pipefail"
              echo "echo '[에코] apt upgrade $db (--only-upgrade)'"
              echo "sudo apt-get -yq update"
              echo "sudo apt-get -yq install --only-upgrade $db || true"
            } > "$u" && chmod +x "$u"

            # brew/choco/snap (참고용)
            { echo '#!/usr/bin/env bash'; echo "echo '[에코] brew install $db'"; echo "brew install $db"; } > "$b" && chmod +x "$b"
            { echo '#!/usr/bin/env bash'; echo "echo '[에코] choco install $db'"; echo "choco install $db"; } > "$c" && chmod +x "$c"
            { echo '#!/usr/bin/env bash'; echo "echo '[에코] snap install $db'"; echo "sudo snap install $db"; } > "$s" && chmod +x "$s"
          done

          # 2) 서비스 컨테이너 예시 YAML (env -> environment, 이미지명/서비스명 정정)
          for db in mysql postgres mongo redis; do
            yml=".github/echo_db/services/${db}-service.yml"
            {
              echo "# [에코] ${db} 컨테이너 예시"
              echo "services:"
              echo "  ${db}:"
              if [ "$db" = "mysql" ]; then
                echo "    image: mysql:8.0"
                echo "    environment:"
                echo "      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}"
                echo "    ports: [ '3306:3306' ]"
              elif [ "$db" = "postgres" ]; then
                echo "    image: postgres:15"
                echo "    environment:"
                echo "      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}"
                echo "    ports: [ '5432:5432' ]"
              elif [ "$db" = "mongo" ]; then
                echo "    image: mongo:7"
                echo "    ports: [ '27017:27017' ]"
              elif [ "$db" = "redis" ]; then
                echo "    image: redis:7"
                echo "    ports: [ '6379:6379' ]"
              fi
              echo "# [에코] ${db} 서비스 컨테이너 yaml 생성 완료"
            } > "$yml"
          done

          # 3) Docker Compose (docker compose 표기)
          composefile=".github/echo_db/compose/all-db-compose.yml"
          {
            echo "# [에코] docker compose all-db"
            echo "version: '3.8'"
            echo "services:"
            echo "  mysql:"
            echo "    image: mysql:8.0"
            echo "    environment:"
            echo "      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}"
            echo "    ports: [ '3306:3306' ]"
            echo "  postgres:"
            echo "    image: postgres:15"
            echo "    environment:"
            echo "      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}"
            echo "    ports: [ '5432:5432' ]"
            echo "  mongo:"
            echo "    image: mongo:7"
            echo "    ports: [ '27017:27017' ]"
            echo "  redis:"
            echo "    image: redis:7"
            echo "    ports: [ '6379:6379' ]"
          } > "$composefile"

          echo '#!/usr/bin/env bash' > .github/echo_db/compose/compose_echo.sh
          echo "echo '[에코] docker compose up -d 실행 명령 기록'" >> .github/echo_db/compose/compose_echo.sh
          echo "docker compose up -d" >> .github/echo_db/compose/compose_echo.sh
          chmod +x .github/echo_db/compose/compose_echo.sh

          # 4) Marketplace 예시(참고 전용)
          marketfile=".github/echo_db/marketplace/postgresql-action.yml"
          {
            echo "# 참고용: Marketplace 액션 사용 예시(실행 아님)"
            echo "- uses: harmon758/postgresql-action@v1"
            echo "  with:"
            echo "    postgresql version: '13'"
            echo "    postgresql db: 'test_db'"
            echo "    postgresql user: 'postgres'"
            echo "    postgresql password: 'pgpass'"
          } > "$marketfile"

          # 5) 권한/유저 설정 에코(예시 커맨드)
          for db in mysql postgres mongo redis; do
            perm=".github/echo_db/permissions/${db}-permission.sh"
            {
              echo '#!/usr/bin/env bash'
              echo "set -Eeuo pipefail"
              echo "echo '[에코] $db 권한/유저 설정 예시 시작'"
              if [ "$db" = "mysql" ]; then
                echo "echo \"GRANT ALL PRIVILEGES ON *.* TO 'runner'@'%' IDENTIFIED BY 'pw' WITH GRANT OPTION;\""
                echo "echo \"FLUSH PRIVILEGES;\""
              elif [ "$db" = "postgres" ]; then
                echo "echo \"CREATE USER runner WITH PASSWORD 'pw';\""
                echo "echo \"GRANT ALL PRIVILEGES ON DATABASE test_db TO runner;\""
              fi
              echo "echo 'chown -R runner:runner /var/lib/${db} || true'"
              echo "echo 'chmod 700 /var/lib/${db} || true'"
              echo "echo '[에코] $db 권한/유저 설정 예시 종료'"
            } > "$perm"
            chmod +x "$perm"
          done

          # 6) 로그 에코 스크립트
          {
            echo '#!/usr/bin/env bash'
            echo "echo '[에코] DB 설치 완료 로그 기록'"
            echo "date"
          } > .github/echo_db/logs/install_done_echo.sh
          chmod +x .github/echo_db/logs/install_done_echo.sh

          {
            echo '#!/usr/bin/env bash'
            echo "echo '[에코] DB 권한 완료 로그 기록'"
            echo "date"
          } > .github/echo_db/logs/permission_done_echo.sh
          chmod +x .github/echo_db/logs/permission_done_echo.sh

      - name: 🛠 실제 설치/업그레이드 실행 (비대화/무중단, 실패 무시)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[에코] apt update 1회 실행"
          sudo apt-get -yq update

          DB_LIST="mysql-server mariadb-server postgresql sqlite3 mongodb redis-server"
          for db in $DB_LIST; do
            echo "[에코] 설치 시도: $db"
            sudo apt-get -yq install "$db" || echo "[$db] 설치 오류(무시)"
            echo "[에코] 업그레이드 시도: $db (--only-upgrade)"
            sudo apt-get -yq install --only-upgrade "$db" || echo "[$db] 업그레이드 오류(무시)"
          done
          echo "[에코] 모든 DB 설치/업그레이드 시도 완료"
          date

      - name: 🔎 에코 산출물 전체 출력(cat)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[에코] 에코 파일/스크립트 전체 출력 시작"
          # 파일명이 공백/특수문자여도 안전하게 출력
          find .github/echo_db -type f -print0 | sort -z | xargs -0 -I{} sh -c 'echo "------------------"; echo "[에코][파일] {}"; cat "{}"; echo'
          echo "[에코] 에코 전체 출력 종료"
