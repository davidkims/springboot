name: 📬 MEGA EmailOps + Echo + Monitoring + Bulk DB

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Base domain for virtual accounts"
        required: false
        default: "example.local"
      user_count:
        description: "Number of virtual users per service"
        required: false
        default: "200"
      bulk_dirs:
        description: "Bulk directories per service (max 20000)"
        required: false
        default: "5000"
  schedule:
    - cron: "*/5 * * * *"

jobs:
  mega-email-echo:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      BASE: /opt/email
      MONO: .monitoring
      SERVICES: postfix exim4 opensmtpd mailhog maildev mailcatcher smtp4dev
      USER_COUNT: ${{ github.event.inputs.user_count || '200' }}
      BULK_DIRS_PER_SERVICE: ${{ github.event.inputs.bulk_dirs || '5000' }}
      PARALLEL_JOBS: 4
      DOMAIN: ${{ github.event.inputs.domain || 'example.local' }}

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 Create base directories + echo logs
        run: |
          set -Eeuo pipefail
          mkdir -p "$BASE" "${MONO}" .github/echo_dirs
          chmod -R 755 "$BASE" "${MONO}"
          echo "echo '[ECHO] Created base directories at $BASE and $MONO'" >> .github/echo_dirs/base_dirs.sh

          mkdir -p "$BASE"/{policies,reports,artifacts,global,tools,tmp}
          mkdir -p "${MONO}"/{influxdb,telegraf,graphite,victoriametrics,otel,statsd,scripts,python}
          echo "echo '[ECHO] Created all base subdirectories'" >> .github/echo_dirs/sub_dirs.sh

          chmod +x .github/echo_dirs/*.sh

      - name: 🔁 Generate echo directories per service
        run: |
          set -Eeuo pipefail
          MAX_BULK=20000
          MAX_USERS=5000
          if [ "$BULK_DIRS_PER_SERVICE" -gt "$MAX_BULK" ]; then BULK_DIRS_PER_SERVICE="$MAX_BULK"; fi
          if [ "$USER_COUNT" -gt "$MAX_USERS" ]; then USER_COUNT="$MAX_USERS"; fi

          mkdir -p .github/echo_services
          for svc in $SERVICES; do
            mkdir -p "$BASE/$svc"
            for d in bin config logs pid run spool queue tmp data certs keys users inbox outbox archive scripts env acl docs policies backups reports firewall permissions artifacts dll db db/migrations; do
              mkdir -p "$BASE/$svc/$d"
              echo "echo '[ECHO] mkdir -p $BASE/$svc/$d'" >> .github/echo_services/echo_dirs_${svc}.sh
            done

            seq -w 0001 "$BULK_DIRS_PER_SERVICE" | xargs -I{} -P "$PARALLEL_JOBS" mkdir -p "$BASE/$svc/bulk/dir_{}"
            echo "echo '[ECHO] bulk dirs created for $svc: $BULK_DIRS_PER_SERVICE'" >> .github/echo_services/echo_bulk_${svc}.sh
          done

          chmod +x .github/echo_services/*.sh

      - name: 📝 Generate absolute path env and echo
        run: |
          set -Eeuo pipefail
          echo "export BASE_ABS=$BASE" > "$GITHUB_WORKSPACE/.env_abs"
          echo "export MONO_ABS=$(pwd)/$MONO" >> "$GITHUB_WORKSPACE/.env_abs"
          echo "echo '[ECHO] Generated .env_abs with BASE_ABS and MONO_ABS'" > .github/echo_dirs/env_abs_echo.sh
          chmod +x .github/echo_dirs/env_abs_echo.sh

      - name: 📦 Setup and run InfluxDB + Telegraf containers
        run: |
          set -Eeuo pipefail
          mkdir -p .github/echo_monitoring
          docker run -d --name influxdb \
            -v "$(pwd)/${MONO}/influxdb:/var/lib/influxdb2" \
            -e DOCKER_INFLUXDB_INIT_MODE=setup \
            -e DOCKER_INFLUXDB_INIT_USERNAME=admin \
            -e DOCKER_INFLUXDB_INIT_PASSWORD=admin1234! \
            -e DOCKER_INFLUXDB_INIT_ORG=org \
            -e DOCKER_INFLUXDB_INIT_BUCKET=metrics \
            -e DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=dev-token-123456 \
            -p 8086:8086 influxdb:2

          echo "echo '[ECHO] InfluxDB container launched'" > .github/echo_monitoring/influxdb_start.sh
          docker run -d --name telegraf \
            -v "$(pwd)/${MONO}/telegraf:/etc/telegraf" \
            --net=host telegraf:1.28

          echo "echo '[ECHO] Telegraf container launched'" > .github/echo_monitoring/telegraf_start.sh
          chmod +x .github/echo_monitoring/*.sh

      - name: 🧪 Tree snapshot + Echo Logging
        run: |
          mkdir -p .github/echo_logs
          tree -a "$BASE" > .github/echo_logs/tree_email.txt
          tree -a "${MONO}" > .github/echo_logs/tree_monitoring.txt
          echo "echo '[ECHO] tree snapshot saved'" >> .github/echo_logs/tree_snapshot.sh
          chmod +x .github/echo_logs/tree_snapshot.sh

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-emailops-logs
          path: |
            .github/echo_*/**/*
            .github/echo_logs/*
            .env_abs
            ${{ env.BASE }}
            ${{ env.MONO }}
