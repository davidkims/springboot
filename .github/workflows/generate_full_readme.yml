name: 🧾 Update README with Portfolio + Workflow Stats + Auto PR

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update_readme:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Install or Update GitHub CLI
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --only-upgrade gh || sudo apt-get install -y gh
          gh --version

      - name: 📊 Collect Workflow Stats
        run: |
          mkdir -p .tmp
          echo "## ⚙️ GitHub Actions 워크플로우 목록 및 통계" > .tmp/workflows.md
          echo "" >> .tmp/workflows.md
          echo "| 워크플로우 이름 | 실행 수 | 성공 수 | 실패 수 | 성공률 |" >> .tmp/workflows.md
          echo "|----------------|--------:|--------:|--------:|--------:|" >> .tmp/workflows.md
          echo "## ✅ 최근 정상 실행된 워크플로우" > .tmp/success_list.md
          echo "" >> .tmp/success_list.md

          for f in .github/workflows/*.yml; do
            NAME=$(grep '^name:' "$f" | head -n1 | cut -d ':' -f2- | xargs)
            FILE=$(basename "$f")
            RUNS=$(gh run list --workflow="$FILE" --limit 20 --json conclusion -q '.[] | .conclusion' || echo "")
            TOTAL=$(echo "$RUNS" | wc -l)
            SUCCESS=$(echo "$RUNS" | grep -c success || true)
            FAILURE=$((TOTAL - SUCCESS))
            RATE=$(awk "BEGIN {printf \"%.1f\", (${SUCCESS:-0}/($TOTAL+0.001))*100}")
            echo "| $NAME | $TOTAL | $SUCCESS | $FAILURE | $RATE% |" >> .tmp/workflows.md
            [ "$SUCCESS" -ge 1 ] && echo "- $NAME (\`$FILE\`)" >> .tmp/success_list.md
          done

      - name: 🏷️ Generate Workflow Badges
        run: |
          mkdir -p .tmp
          REPO="davidkims/springboot"
          echo "## 🏷️ 워크플로우 상태 배지" > .tmp/badges.md
          echo "" >> .tmp/badges.md
          for f in .github/workflows/*.yml; do
            NAME=$(grep '^name:' "$f" | head -n1 | cut -d ':' -f2- | xargs)
            FILE=$(basename "$f")
            echo "[![${NAME}](https://github.com/${REPO}/actions/workflows/${FILE}/badge.svg)](https://github.com/${REPO}/actions/workflows/${FILE})" >> .tmp/badges.md
            echo "" >> .tmp/badges.md
          done

      - name: 🧾 Generate README.md
        run: |
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S KST')
          REPO="davidkims/springboot"
          BRANCH="${{ github.ref_name }}"

          {
            echo "# 👨‍💻 김병권 포트폴리오"
            echo ""
            echo "[![🧾 Update README](https://github.com/${REPO}/actions/workflows/generate_full_readme.yml/badge.svg)](https://github.com/${REPO}/actions/workflows/generate_full_readme.yml)"
            echo ""
            echo "자동으로 관리되는 프로젝트입니다. 매 시간 정각에 업데이트됩니다."
            echo ""
            echo "## 🧑‍💻 개발자 소개"
            echo "- 이름: 김병권"
            echo "- 전문 분야: 백엔드 개발, GitHub Actions 자동화, 보안 자동화, DevOps"
            echo "- 스택: Python, Java, Spring Boot, FastAPI, Docker, PostgreSQL, MySQL"
            echo ""
            echo "## 📅 마지막 업데이트"
            echo "- $TIMESTAMP"
            echo ""
            echo "## ✅ 현재 브랜치"
            echo "- $BRANCH"
            echo ""
            cat .tmp/badges.md
            echo ""
            cat .tmp/success_list.md
            echo ""
            cat .tmp/workflows.md
          } > README.md

      - name: 📤 Create PR if README Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "[⏭️] 변경사항 없음 - PR 생략"
          else
            echo "[✅] 변경사항 감지됨 - PR 생성 중"
            BRANCH=auto/update-readme
            git checkout -b "$BRANCH"
            git add README.md
            git commit -m "📄 Update README.md with stats and badges"
            git push -f origin "$BRANCH"

            gh pr create --title "📄 README 자동 갱신" \
                         --body "워크플로우 통계 및 배지 반영 자동 PR입니다." \
                         --base main \
                         --head "$BRANCH" || echo "[ℹ️] PR 이미 존재"

            gh pr edit "$BRANCH" --add-label "auto-generated" --add-label "documentation" || true
            gh pr review "$BRANCH" --approve || true
            gh pr merge "$BRANCH" --merge --delete-branch || true
            echo "[🚀] PR 승인 + 머지 완료 (또는 생략)"
          fi
