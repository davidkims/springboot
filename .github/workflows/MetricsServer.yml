name: 📊 Metrics Server Setup & Real-time Data Collection

on:
  workflow_dispatch:
  schedule:
    # 매분마다 실행하여 실시간 현황 수집
    - cron: '*/1 * * * *'

jobs:
  setup_and_collect:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Generate setup_metrics.sh script
        run: |
          echo "[📝] Generating setup_metrics.sh..."
          cat << 'EOF' > setup_metrics.sh
echo "[🛠️] Creating all required directories..."
echo "[🛠️] mkdir -p /opt/prometheus/data /opt/grafana/data /opt/elasticsearch/data"
echo "[🛠️] mkdir -p /opt/logstash/config /opt/kibana/config /opt/influxdb/data /opt/telegraf/conf"
mkdir -p /opt/prometheus/data /opt/grafana/data /opt/elasticsearch/data \
         /opt/logstash/config /opt/kibana/config /opt/influxdb/data \
         /opt/telegraf/conf
echo "[✅] Directories created."

echo "[🛠️] Installing Prometheus..."
sudo apt-get update
sudo apt-get install -y prometheus
echo "[✅] Prometheus installed."

echo "[🛠️] Installing Grafana..."
sudo apt-get install -y apt-transport-https software-properties-common wget
wget -q -O - https://packages.grafana.com/gpg.key | sudo apt-key add -
sudo add-apt-repository "deb https://packages.grafana.com/oss/deb stable main"
sudo apt-get update
sudo apt-get install -y grafana
echo "[✅] Grafana installed."

echo "[🛠️] Installing Elasticsearch..."
sudo apt-get install -y openjdk-11-jdk
wget -qO - https://artifacts.elastic.co/GPG-KEY-elasticsearch | sudo apt-key add -
sudo sh -c 'echo "deb https://artifacts.elastic.co/packages/7.x/apt stable main" > /etc/apt/sources.list.d/elastic-7.x.list'
sudo apt-get update
sudo apt-get install -y elasticsearch
echo "[✅] Elasticsearch installed."

echo "[🛠️] Installing Logstash..."
sudo apt-get install -y logstash
echo "[✅] Logstash installed."

echo "[🛠️] Installing Kibana..."
sudo apt-get install -y kibana
echo "[✅] Kibana installed."

echo "[🛠️] Installing InfluxDB..."
wget -qO- https://repos.influxdata.com/influxdb.key | sudo apt-key add -
sudo add-apt-repository "deb https://repos.influxdata.com/ubuntu $(lsb_release -cs) stable"
sudo apt-get update
sudo apt-get install -y influxdb
echo "[✅] InfluxDB installed."

echo "[🛠️] Installing Telegraf..."
sudo apt-get install -y telegraf
echo "[✅] Telegraf installed."
EOF
          chmod +x setup_metrics.sh
          echo "[✅] setup_metrics.sh 생성 및 실행 권한 부여 완료."

      - name: 🚀 Run setup_metrics.sh
        run: |
          echo "[🚀] Executing setup_metrics.sh..."
          sudo bash setup_metrics.sh

      - name: 📡 Collect real-time workflow metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[📡] Fetching latest 5 workflow runs from GitHub API..."
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=5" \
            > workflow_metrics.json
          echo "[✅] Metrics saved to workflow_metrics.json"
          echo "[📁] Contents preview:"
          head -n 20 workflow_metrics.json || true
