name: 🏦 금융 자동화 통합 - 전체 echo/환경/보안/멀티모듈/빌드/스프링부트 최신화 (No Skip, No Blur, +DB echo)

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

jobs:
  finance-ci-allinone:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 대량 echo/로그/백업/옵션/스프링부트 디렉토리 생성 및 echo파일
        run: |
          set -e
          TS=$(date +%Y%m%d_%H%M%S)
          mkdir -p .github/echo_build
          ECHO_LIST=".github/echo_build/echo_dirlist_${TS}.txt"
          echo "[ECHO] 생성예정 디렉토리 목록 @ $TS" | tee $ECHO_LIST
          for d in \
            .github/echo_ts \
            .github/echo_js \
            .github/echo_java \
            .github/echo_upgrade \
            .github/echo_spring \
            .github/echo_env \
            .github/echo_secret \
            .github/echo_buildopt \
            .github/echo_multimodule \
            .github/logs_ts \
            .github/ts_projects \
            .github/ts_bin \
            .github/ts_backup \
            .github/ts_dist_backup \
            .github/js_projects \
            .github/js_backup \
            .github/js_dist_backup \
            .github/java_projects \
            .github/java_build \
            .github/java_multi \
            .github/mvn_install \
            .github/springboot_projects \
            .github/springboot_build \
            .github/springboot_backup \
            .github/springboot_logs \
            .github/springboot_multi \
            .github/build_history \
            .github/build_logs \
            .github/run_logs \
            .github/echo_compile \
            .github/echo_build \
            .github/echo_run \
            .github/echo_result \
            .github/migration \
            .github/extra_data \
            .github/backup_files \
            .github/custom_logs \
            .github/extra_echo \
            .github/extra_multi \
            .github/extra_tmp \
            .github/extra_test; do
            ECHO_FILE=".github/echo_build/echo_mkdir_${TS}_$(basename $d).txt"
            echo "[ECHO][$TS] mkdir -p $d" > $ECHO_FILE
            echo "[ECHO][$TS] mkdir -p $d" >> $ECHO_LIST
            mkdir -p "$d"
            if [ -d "$d" ]; then
              echo "[SUCCESS][$TS] $d 생성됨" >> $ECHO_FILE
            else
              echo "[FAIL][$TS] $d 생성 실패" >> $ECHO_FILE
            fi
          done
          tree .github > .github/echo_build/echo_dirs_tree_${TS}.txt || ls -lR .github > .github/echo_build/echo_dirs_lslr_${TS}.txt
          echo "[ECHO][$TS] 전체 디렉토리 생성 및 에코파일 생성 완료" > .github/echo_build/echo_all_mkdir_result_${TS}.txt

      - name: 🔑 환경변수/보안/옵션/멀티모듈 에코파일 생성
        run: |
          set -e
          TS=$(date +%Y%m%d_%H%M%S)
          echo "SPRING_PROFILES_ACTIVE=prod" > .github/echo_env/spring_profiles.env
          echo "JAVA_TOOL_OPTIONS=-Xms256m -Xmx1024m" >> .github/echo_env/spring_profiles.env
          echo "CI_BUILD_ID=$TS" >> .github/echo_env/spring_profiles.env
          echo "[ECHO] .github/echo_env/spring_profiles.env 생성 완료 ($TS)" > .github/echo_env/echo_spring_profiles_env_${TS}.txt
          echo "SECRET_DB_PW=****" > .github/echo_secret/secret.env
          echo "SPRING_API_KEY=****" >> .github/echo_secret/secret.env
          echo "[ECHO] .github/echo_secret/secret.env 생성 완료 ($TS)" > .github/echo_secret/echo_secret_env_${TS}.txt
          echo "TS_BUILD_OPTS=--strict --target ES2020" > .github/echo_buildopt/ts_buildopt.txt
          echo "JAVA_BUILD_OPTS=-DskipTests=true -Dmaven.test.failure.ignore=true" > .github/echo_buildopt/java_buildopt.txt
          echo "SPRING_BUILD_OPTS=--debug --no-daemon" > .github/echo_buildopt/spring_buildopt.txt
          echo "[ECHO] echo_buildopt 생성 완료 ($TS)" > .github/echo_buildopt/echo_buildopt_${TS}.txt
          mkdir -p .github/springboot_multi/app-api/src/main/java/com/fin/appapi
          mkdir -p .github/springboot_multi/app-core/src/main/java/com/fin/appcore
          mkdir -p .github/springboot_multi/app-web/src/main/java/com/fin/appweb
          echo "rootProject.name = 'finance-multi'" > .github/springboot_multi/settings.gradle
          echo "include 'app-api', 'app-core', 'app-web'" >> .github/springboot_multi/settings.gradle
          echo "[ECHO] .github/springboot_multi/settings.gradle 및 디렉토리 구조 생성 완료 ($TS)" > .github/echo_multimodule/echo_settings_gradle_${TS}.txt

      - name: 🗄️ 환경별 DB echo config/.env/.sql 파일 자동생성
        run: |
          set -e
          TS=$(date +%Y%m%d_%H%M%S)
          echo "// DB CONFIG ECHO" > .github/echo_ts/db_config.ts
          echo "export const DB_CONFIG = { host: 'localhost', user: 'finance', password: 'echo_pw', database: 'financedb', port: 3306 };" >> .github/echo_ts/db_config.ts
          echo -e "DB_HOST=localhost\nDB_USER=finance\nDB_PASS=echo_pw\nDB_NAME=financedb" > .github/echo_ts/.env
          echo "CREATE TABLE IF NOT EXISTS ts_sample (id INT PRIMARY KEY, amount DECIMAL(12,2), memo VARCHAR(100));" > .github/echo_ts/table_info.sql
          echo "[ECHO] TypeScript 환경 DB 파일 생성" > .github/echo_ts/echo_db_config_${TS}.txt
          echo '{ "host": "localhost", "user": "finance", "password": "echo_pw", "database": "financedb", "port": 3306 }' > .github/echo_js/dbinfo.json
          echo -e "DB_HOST=localhost\nDB_USER=finance\nDB_PASS=echo_pw\nDB_NAME=financedb" > .github/echo_js/.env
          echo "CREATE TABLE IF NOT EXISTS js_logs (id INT PRIMARY KEY, msg VARCHAR(255), created_at DATETIME);" > .github/echo_js/table_info.sql
          echo "[ECHO] JS 환경 DB 파일 생성" > .github/echo_js/echo_db_config_${TS}.txt
          echo "spring.datasource.url=jdbc:mysql://localhost:3306/financedb" > .github/echo_java/application.properties
          echo "spring.datasource.username=finance" >> .github/echo_java/application.properties
          echo "spring.datasource.password=echo_pw" >> .github/echo_java/application.properties
          echo "CREATE TABLE IF NOT EXISTS java_audit (id BIGINT AUTO_INCREMENT PRIMARY KEY, event VARCHAR(128), ts TIMESTAMP);" > .github/echo_java/table_info.sql
          echo "[ECHO] Java 환경 DB 파일 생성" > .github/echo_java/echo_db_config_${TS}.txt
          echo -e "spring:\n  datasource:\n    url: jdbc:mysql://localhost:3306/financedb\n    username: finance\n    password: echo_pw\n    driver-class-name: com.mysql.cj.jdbc.Driver" > .github/echo_spring/application.yml
          echo "CREATE TABLE IF NOT EXISTS spring_tasks (task_id INT AUTO_INCREMENT PRIMARY KEY, desc VARCHAR(255), completed BOOLEAN);" > .github/echo_spring/table_info.sql
          echo -e "MYSQL_USER=finance\nMYSQL_PW=echo_pw" > .github/echo_spring/.env
          echo "[ECHO] SpringBoot 환경 DB 파일 생성" > .github/echo_spring/echo_db_config_${TS}.txt
          echo "CREATE TABLE IF NOT EXISTS customers (id INT PRIMARY KEY, name VARCHAR(50), grade CHAR(1), joined DATETIME);" > .github/migration/customer_table.sql
          echo "CREATE TABLE IF NOT EXISTS transactions (id INT PRIMARY KEY, customer_id INT, amount DECIMAL(16,2), date DATETIME);" > .github/migration/transaction_table.sql
          echo "[ECHO] migration SQL 생성" > .github/migration/echo_migration_sql_${TS}.txt

      - name: 📦 Node.js/JS/TS/Java/SpringBoot 설치/업그레이드/echo
        run: |
          set -e
          TS=$(date +%Y%m%d_%H%M%S)
          sudo apt-get update -y | tee .github/echo_upgrade/echo_apt_update_${TS}.txt
          sudo apt-get install -y curl gnupg2 zip unzip wget | tee .github/echo_upgrade/echo_apt_install_base_${TS}.txt
          echo "[ECHO] Node.js 설치 시작 ($TS)" > .github/echo_upgrade/echo_nodejs_begin_${TS}.txt
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - | tee .github/echo_upgrade/echo_nodesource_${TS}.txt
          sudo apt-get install -y nodejs | tee .github/echo_upgrade/echo_nodejs_install_${TS}.txt
          sudo npm install -g npm@latest | tee .github/echo_upgrade/echo_npm_latest_${TS}.txt
          sudo npm install -g typescript@latest | tee .github/echo_upgrade/echo_typescript_latest_${TS}.txt
          node -v | tee .github/echo_upgrade/node_version_${TS}.txt
          npm -v  | tee .github/echo_upgrade/npm_version_${TS}.txt
          tsc -v | tee .github/echo_upgrade/tsc_version_${TS}.txt
          sudo apt-get install -y openjdk-17-jdk | tee .github/echo_upgrade/echo_openjdk_install_${TS}.txt
          java -version 2>&1 | tee .github/echo_upgrade/java_version_${TS}.txt
          sudo apt-get install -y maven | tee .github/echo_upgrade/echo_maven_install_${TS}.txt
          mvn -version | tee .github/echo_upgrade/mvn_version_${TS}.txt
          set +e
          SPRINGBOOT_VER=$(curl -s https://api.github.com/repos/spring-projects/spring-boot/releases/latest | grep tag_name | cut -d'"' -f4 | tr -d 'v')
          echo "SPRINGBOOT_VER=$SPRINGBOOT_VER" | tee .github/echo_upgrade/springboot_version_${TS}.txt
          wget -q "https://repo.spring.io/release/org/springframework/boot/spring-boot-cli/${SPRINGBOOT_VER}/spring-boot-cli-${SPRINGBOOT_VER}-bin.zip" -O /tmp/springboot.zip
          UNZIP_OUT=""
          if [ -s /tmp/springboot.zip ]; then
            UNZIP_OUT=$(unzip -o /tmp/springboot.zip -d /tmp/springboot_cli 2>&1)
            sudo cp -a /tmp/springboot_cli/spring-boot-cli-*/* /usr/local/
            ln -sf /usr/local/bin/spring /usr/local/bin/springboot || true
            spring --version | tee .github/echo_upgrade/springboot_cli_version_${TS}.txt
            echo "[UPGRADE] Spring Boot CLI 정상 설치/업그레이드" | tee .github/echo_upgrade/springboot_cli_success_${TS}.txt
          else
            echo "[ERROR] Spring Boot CLI 다운로드 실패, gradle 빌드로 fallback" | tee .github/echo_upgrade/springboot_cli_error_${TS}.txt
            echo "$UNZIP_OUT" | tee .github/echo_upgrade/springboot_cli_unzip_error_${TS}.txt
          fi
          set -e
          echo "[UPGRADE] 모든 언어/빌드툴/SpringBoot 최신화 완료" | tee .github/echo_upgrade/all_done_${TS}.txt
          for f in node npm tsc java mvn spring; do
            BIN_PATH=$(which $f)
            echo "[ECHO] $f 경로: $BIN_PATH" | tee -a .github/echo_upgrade/executables_${TS}.txt
            cp -a $BIN_PATH .github/ts_bin/ || true
            cp -a $BIN_PATH .github/mvn_install/ || true
            cp -a $BIN_PATH .github/springboot_projects/ || true
            echo "[ECHO] $f 복사 완료" | tee -a .github/echo_upgrade/echo_bin_copy_${f}_${TS}.txt
          done

      - name: 📄 샘플 JS/TS/Java/Spring 파일/설정 echo
        run: |
          set -e
          TS=$(date +%Y%m%d_%H%M%S)
          echo "console.log('Hello, TypeScript!')" > .github/ts_projects/hello.ts
          echo "[ECHO] hello.ts 생성 ($TS)" > .github/echo_ts/echo_hello_ts_${TS}.txt
          echo "export function greet(name: string) { return 'Hello, ' + name + '!'; }" > .github/ts_projects/greet.ts
          echo "[ECHO] greet.ts 생성 ($TS)" > .github/echo_ts/echo_greet_ts_${TS}.txt
          echo "import { greet } from './greet'; console.log(greet('SpringBoot+MultiModule 자동화!'));" > .github/ts_projects/main.ts
          echo "[ECHO] main.ts 생성 ($TS)" > .github/echo_ts/echo_main_ts_${TS}.txt
          echo "{" > .github/ts_projects/tsconfig.json
          echo "  \"compilerOptions\": {" >> .github/ts_projects/tsconfig.json
          echo "    \"target\": \"es6\"," >> .github/ts_projects/tsconfig.json
          echo "    \"module\": \"commonjs\"," >> .github/ts_projects/tsconfig.json
          echo "    \"outDir\": \"./dist\"," >> .github/ts_projects/tsconfig.json
          echo "    \"strict\": true," >> .github/ts_projects/tsconfig.json
          echo "    \"esModuleInterop\": true" >> .github/ts_projects/tsconfig.json
          echo "  }," >> .github/ts_projects/tsconfig.json
          echo "  \"include\": [\"*.ts\"]" >> .github/ts_projects/tsconfig.json
          echo "}" >> .github/ts_projects/tsconfig.json
          echo "[ECHO] tsconfig.json 생성 ($TS)" > .github/echo_ts/echo_tsconfig_json_${TS}.txt
          echo "console.log('Hello, JavaScript! (SpringBoot+MultiModule)');" > .github/js_projects/hello.js
          echo "[ECHO] hello.js 생성 ($TS)" > .github/echo_js/echo_hello_js_${TS}.txt
          echo "function sum(a, b) { return a+b; } console.log('Sum:', sum(8,12));" > .github/js_projects/sum.js
          echo "[ECHO] sum.js 생성 ($TS)" > .github/echo_js/echo_sum_js_${TS}.txt
          mkdir -p .github/java_projects/src/main/java/com/fin/example
          echo "package com.fin.example; public class Main { public static void main(String[] args) { System.out.println(\"금융 Java 빌드(SpringBoot, 멀티모듈)\"); }}" > .github/java_projects/src/main/java/com/fin/example/Main.java
          echo "[ECHO] Main.java 생성 ($TS)" > .github/echo_java/echo_Main_java_${TS}.txt
          echo '<project xmlns="http://maven.apache.org/POM/4.0.0" ... </project>' > .github/java_projects/pom.xml
          echo "[ECHO] pom.xml 생성 ($TS)" > .github/echo_java/echo_pom_xml_${TS}.txt
          mkdir -p .github/springboot_projects/src/main/java/com/fin/springboot
          echo "package com.fin.springboot; import org.springframework.boot.SpringApplication; import org.springframework.boot.autoconfigure.SpringBootApplication; @SpringBootApplication public class Application { public static void main(String[] args) { SpringApplication.run(Application.class, args); }}" > .github/springboot_projects/src/main/java/com/fin/springboot/Application.java
          echo "[ECHO] Application.java 생성 ($TS)" > .github/echo_spring/echo_Application_java_${TS}.txt
          echo 'plugins { id "org.springframework.boot" version "3.2.6" } ...' > .github/springboot_projects/build.gradle
          echo "[ECHO] build.gradle 생성 ($TS)" > .github/echo_spring/echo_build_gradle_${TS}.txt
          echo "plugins { id 'org.springframework.boot' version '3.2.6' }" > .github/springboot_multi/app-api/build.gradle
          echo "[ECHO] app-api build.gradle 생성 ($TS)" > .github/echo_multimodule/echo_appapi_build_gradle_${TS}.txt
          echo "plugins { id 'java' }" > .github/springboot_multi/app-core/build.gradle
          echo "[ECHO] app-core build.gradle 생성 ($TS)" > .github/echo_multimodule/echo_appcore_build_gradle_${TS}.txt
          echo "plugins { id 'java' }" > .github/springboot_multi/app-web/build.gradle
          echo "[ECHO] app-web build.gradle 생성 ($TS)" > .github/echo_multimodule/echo_appweb_build_gradle_${TS}.txt

      - name: 🛠️ TypeScript 빌드/실행/에코/백업
        run: |
          set -e
          TS=$(date +%Y%m%d_%H%M%S)
          cd .github/ts_projects
          echo "[ECHO] TypeScript 컴파일 시작 ($TS)" > ../echo_compile/echo_tsc_compile_begin_${TS}.txt
          tsc -p tsconfig.json | tee ../echo_compile/tsc_compile_${TS}.log
          echo "[ECHO] TypeScript 컴파일 완료 ($TS)" > ../echo_compile/echo_tsc_compile_end_${TS}.txt
          ls -l dist > ../echo_compile/ts_dist_list_${TS}.txt
          echo "[ECHO] TypeScript dist 목록 저장 ($TS)" > ../echo_compile/echo_tsc_dist_list_${TS}.txt
          node dist/main.js | tee ../echo_run/ts_run_${TS}.log
          echo "[ECHO] TypeScript 실행 완료 ($TS)" > ../echo_run/echo_tsc_run_${TS}.txt
          cd ../..
          cp -a .github/ts_projects/dist/. .github/ts_dist_backup/
          echo "[ECHO] ts_dist_backup 복사 완료 ($TS)" > .github/echo_compile/echo_ts_dist_backup_${TS}.txt
          cp -a .github/ts_projects/*.ts .github/ts_projects/tsconfig.json .github/ts_backup/
          echo "[ECHO] ts_backup 복사 완료 ($TS)" > .github/echo_compile/echo_ts_backup_${TS}.txt
          echo "[에코] TypeScript 빌드/실행/백업/업그레이드 완료" >> .github/echo_result/ts_result_${TS}.txt

      - name: 🛠️ JavaScript 실행/에코/백업
        run: |
          set -e
          TS=$(date +%Y%m%d_%H%M%S)
          node .github/js_projects/hello.js | tee .github/echo_run/js_hello_${TS}.log
          echo "[ECHO] hello.js 실행 완료 ($TS)" > .github/echo_run/echo_hello_js_run_${TS}.txt
          node .github/js_projects/sum.js | tee .github/echo_run/js_sum_${TS}.log
          echo "[ECHO] sum.js 실행 완료 ($TS)" > .github/echo_run/echo_sum_js_run_${TS}.txt
          cp -a .github/js_projects/*.js .github/js_backup/
          echo "[ECHO] js_backup 복사 완료 ($TS)" > .github/echo_run/echo_js_backup_${TS}.txt
          echo "[에코] JavaScript 실행/백업/업그레이드 완료" >> .github/echo_result/js_result_${TS}.txt

      - name: 🛠️ Maven(Java) 빌드/실행/에코/백업
        run: |
          set -e
          TS=$(date +%Y%m%d_%H%M%S)
          cd .github/java_projects
          echo "[ECHO] Maven 컴파일 시작 ($TS)" > ../echo_compile/echo_mvn_compile_begin_${TS}.txt
          mvn clean compile | tee ../echo_compile/mvn_compile_${TS}.log
          echo "[ECHO] Maven 컴파일 완료 ($TS)" > ../echo_compile/echo_mvn_compile_end_${TS}.txt
          mkdir -p ../java_build/
          cp -a target ../java_build/ || true
          echo "[ECHO] java_build 복사 완료 ($TS)" > ../echo_compile/echo_java_build_${TS}.txt
          cd ../..
          echo "[에코] Maven(Java) 빌드/백업/업그레이드 완료" >> .github/echo_result/java_result_${TS}.txt

      - name: 🛠️ SpringBoot 빌드/실행/에코/백업
        run: |
          set -e
          TS=$(date +%Y%m%d_%H%M%S)
          cd .github/springboot_projects
          echo "[ECHO] SpringBoot 빌드 시작 ($TS)" > ../springboot_logs/echo_gradle_build_begin_${TS}.txt
          if [ ! -f ./gradlew ]; then
            gradle build | tee ../springboot_logs/gradle_build_${TS}.log || true
          else
            ./gradlew build | tee ../springboot_logs/gradle_build_${TS}.log || true
          fi
          echo "[ECHO] SpringBoot 빌드 완료 ($TS)" > ../springboot_logs/echo_gradle_build_end_${TS}.txt
          cp -a build ../springboot_build/ || true
          echo "[ECHO] springboot_build 복사 완료 ($TS)" > ../springboot_logs/echo_springboot_build_${TS}.txt
          cd ../..
          cp -a .github/springboot_projects/* .github/springboot_backup/
          echo "[ECHO] springboot_backup 복사 완료 ($TS)" > .github/springboot_logs/echo_springboot_backup_${TS}.txt
          echo "[에코] SpringBoot 빌드/백업/업그레이드 완료" >> .github/echo_result/springboot_result_${TS}.txt

      - name: 🗂️ 빌드/실행/로그/백업/이력 통합 echo
        run: |
          set -e
          TS=$(date +%Y%m%d_%H%M%S)
          find .github/ -type f | tee .github/build_logs/files_all_${TS}.log
          echo "[ECHO] files_all 로그 저장 ($TS)" > .github/build_logs/echo_files_all_${TS}.txt
          ls -ld .github/* | tee -a .github/build_logs/perm_owner_${TS}.log
          echo "[ECHO] perm_owner 로그 저장 ($TS)" > .github/build_logs/echo_perm_owner_${TS}.txt
          echo "[에코] 전체 빌드/실행/이력/로그/백업/업그레이드 파일리스트 출력완료" >> .github/echo_result/total_result_${TS}.txt

      - name: 🕓 빌드/업그레이드 이력(날짜별, 커밋별) 기록 echo
        run: |
          set -e
          TS=$(date +%Y%m%d_%H%M%S)
          echo "빌드시간: $(date '+%Y-%m-%d %H:%M:%S')" > .github/build_history/last_build_time.txt
          echo "커밋 SHA: $GITHUB_SHA" > .github/build_history/last_build_commit.txt
          echo "[ECHO] last_build_time.txt, last_build_commit.txt 생성 ($TS)" > .github/build_history/echo_last_build_${TS}.txt
          echo "[에코] 빌드/업그레이드 이력 파일 생성" >> .github/echo_result/total_result_${TS}.txt

      - name: 📦 전체 빌드/실행/로그/이력 artifact 저장 echo
        uses: actions/upload-artifact@v4
        with:
          name: finance-build-all-artifacts
          path: |
            .github/ts_dist_backup/
            .github/ts_backup/
            .github/js_backup/
            .github/java_build/
            .github/springboot_build/
            .github/springboot_backup/
            .github/build_logs/
            .github/build_history/
            .github/echo_compile/
            .github/echo_build/
            .github/echo_run/
            .github/echo_result/
            .github/echo_upgrade/
            .github/echo_spring/
            .github/springboot_logs/
            .github/echo_env/
            .github/echo_secret/
            .github/echo_buildopt/
            .github/echo_multimodule/
            .github/echo_ts/
            .github/echo_js/
            .github/echo_java/
            .github/migration/
            .github/extra_data/
            .github/backup_files/
            .github/custom_logs/
            .github/extra_echo/
            .github/extra_multi/
            .github/extra_tmp/
            .github/extra_test/
