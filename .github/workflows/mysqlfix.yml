name: 🐬 MySQL 8.x 완전 robust 설치/초기화/echo_log/인증/aiter 등 통합

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  mysql-robust-auto:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 사전 디렉토리/echo_log 함수 선언
        run: |
          mkdir -p .github/echo .github/logs /tmp/echo
          cat <<'EOF' > ensure_logistics_db.sh
          #!/bin/bash
          for i in 1 2 3; do
            sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld && sudo chmod 770 /var/run/mysqld
            mysql -u root -e "CREATE DATABASE IF NOT EXISTS logistics;" 2>/dev/null && break || sleep 3
          done
          for i in 1 2 3; do
            mysql -u root -D logistics -e "
            CREATE TABLE IF NOT EXISTS echo_log (
              id INT AUTO_INCREMENT PRIMARY KEY,
              step_name VARCHAR(128),
              echo_cmd TEXT,
              executed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              status VARCHAR(32) DEFAULT 'success',
              message TEXT
            ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;" 2>/dev/null && break || sleep 3
          done
          EOF
          chmod +x ensure_logistics_db.sh

      - name: 🧩 MySQL robust 설치/초기화/소켓/퍼미션/비번 리셋
        run: |
          set -e
          export MYSQL_PWD=''
          sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld && sudo chmod 770 /var/run/mysqld
          sudo systemctl stop mysql || true
          sudo pkill -f mysqld || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server

          # 데몬 기동(최대 3회 재시도)
          for i in 1 2 3; do
            sudo systemctl start mysql || true
            sleep 6
            if sudo systemctl status mysql | grep -qi 'active (running)'; then break; fi
            if [ $i -eq 3 ]; then
              sudo journalctl -u mysql | tail -30
              echo "[❌] MySQL 데몬 기동 실패!"; exit 1
            fi
          done

          # MySQL 기본 root 인증/소켓 robust
          sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld && sudo chmod 770 /var/run/mysqld
          # 플러그인/패스워드 완전 초기화 (skip-grant-tables 이용)
          sudo systemctl stop mysql || true
          sudo pkill -f mysqld_safe || true
          sudo pkill -f mysqld || true
          sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld && sudo chmod 770 /var/run/mysqld

          nohup sudo mysqld_safe --skip-grant-tables --skip-networking > .github/logs/mysql_skipgrant.log 2>&1 &
          sleep 8
          # 플러그인/비밀번호 모두 초기화
          echo "UPDATE mysql.user SET plugin='mysql_native_password', authentication_string='' WHERE User='root' AND Host='localhost';" | sudo mysql
          echo "FLUSH PRIVILEGES;" | sudo mysql

          # skip-grant-tables 모드 종료 및 일반모드 전환
          sudo pkill -f mysqld_safe || true
          sudo pkill -f mysqld || true
          sleep 2
          sudo systemctl start mysql
          sleep 8
          sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld && sudo chmod 770 /var/run/mysqld

          # root 패스워드 강제 재설정(rootpass123)
          echo "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpass123';" | sudo mysql -u root
          echo "FLUSH PRIVILEGES;" | sudo mysql -u root
          sleep 2

          # root 인증 robust 체크 (최대3회)
          export MYSQL_PWD=rootpass123
          for i in 1 2 3; do
            sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld && sudo chmod 770 /var/run/mysqld
            if mysqladmin -u root ping; then
              echo "[✔] MySQL root 인증 성공"
              exit 0
            else
              echo "[!] root 인증 실패($i). 3초후 재시도..."; sleep 3
            fi
          done
          echo "[❌] MySQL root 인증 최종 실패!"
          sudo journalctl -u mysql | tail -30
          exit 1

      - name: 🗄️ echo_log robust 보장
        run: |
          set -e
          export MYSQL_PWD=rootpass123
          ./ensure_logistics_db.sh
          mysql -u root -D logistics -e "INSERT INTO echo_log (step_name, echo_cmd, status, message) VALUES ('echo_log', '테스트', 'success', '테이블 생성/DB접근 OK');"

      - name: 🌀 aiter/aim/airflow robust 설치 및 echo_log 기록
        run: |
          set -e
          export MYSQL_PWD=rootpass123
          sudo apt-get install -y python3-pip python3-venv
          for pkg in aiter aim apache-airflow; do
            ./ensure_logistics_db.sh
            max_try=3; n=1
            while : ; do
              if python3 -m pip install "$pkg" >> .github/echo/step-install-$pkg.txt 2>&1; then
                ./ensure_logistics_db.sh
                mysql -u root -D logistics -e "INSERT INTO echo_log (step_name, echo_cmd, status, message) VALUES ('${pkg} install', 'pip install $pkg', 'success', '정상수행($n회)');"
                break
              else
                ./ensure_logistics_db.sh
                mysql -u root -D logistics -e "INSERT INTO echo_log (step_name, echo_cmd, status, message) VALUES ('${pkg} install', 'pip install $pkg', 'failed', '실패($n회)');"
                sleep 3; ((n++)); if [ $n -gt $max_try ]; then exit 1; fi
              fi
            done
            $pkg --version | tee -a .github/echo/step-install-$pkg.txt || true
          done

      - name: 🟩 echo_log 사용 예시 및 종료
        run: |
          set -e
          export MYSQL_PWD=rootpass123
          ./ensure_logistics_db.sh
          mysql -u root -D logistics -e "INSERT INTO echo_log (step_name, echo_cmd, status, message) VALUES ('END', 'all done', 'success', '최종 성공');"
