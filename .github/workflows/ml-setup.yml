# 예: 워크플로우에서 최신 finance-backup.yml 자동 재생성
name: ♻️ Regenerate Workflow (Echo + Dependabot)

on:
  push:
    paths:
      - .github/workflows/finance-backup.yml
      - .github/dependabot.yml
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: 🔁 Echo and log
        run: |
          echo "[⚙️] finance-backup.yml modified"
          tree .github/
