name: "⚙️ Maven + Spring Boot: Install/Upgrade + Echo Perm + Release"

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: "프로젝트가 위치한 디렉토리 (pom.xml이 존재하는 경로). 모노레포면 서브폴더 지정"
        required: true
        default: "."
      spring_boot_version:
        description: "(선택) 적용할 Spring Boot 버전 (예: 3.3.3). 비우면 현재 pom.xml 유지"
        required: false
        default: ""
      maven_version:
        description: "(선택) 사용할 Maven 버전 (예: 3.9.9). 비우면 기본 버전"
        required: false
        default: ""
      bump_type:
        description: "릴리즈 시 버전 증가 유형 (patch|minor|major)"
        required: false
        default: "patch"
      run_tests:
        description: "빌드 전에 테스트 실행 (true/false)"
        required: true
        default: "true"
      create_release:
        description: "릴리즈 생성 및 태그/아티팩트 업로드 (true/false)"
        required: true
        default: "true"
      distribute_artifacts:
        description: "빌드 산출물 업로드 (Artifacts) (true/false)"
        required: true
        default: "true"

permissions:
  contents: write   # 태그/릴리즈 생성에 필요
  actions: read

env:
  JAVA_VERSION: "21"
  ECHO_ROOT: .github/echo_java
  OUT_DIR: .github/echo_java/out
  LOG_DIR: .github/echo_java/logs
  PERM_DIR: .github/echo_java/permissions
  ARTIFACT_DIR: .github/echo_java/artifacts

jobs:
  build_and_release:
    name: "Build & (Optional) Release"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 태그/릴리즈 푸시에 필요

      - name: "Ensure pom.xml exists"
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          PROJ_DIR="${{ inputs.project_dir }}"
          echo "[ECHO] Looking for pom.xml under: $PROJ_DIR"
          if [ ! -f "$PROJ_DIR/pom.xml" ]; then
            echo "[ECHO][FAIL] No pom.xml at $PROJ_DIR" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "[ECHO] Repository tree:" | tee -a "$GITHUB_STEP_SUMMARY"
            { ls -la; echo; find . -maxdepth 2 -type f -name pom.xml | sed 's/^/FOUND: /'; } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "projectDir=$PROJ_DIR" >> "$GITHUB_OUTPUT"

      - name: "Setup Temurin JDK"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            ${{ steps.preflight.outputs.projectDir }}/pom.xml

      - name: "(Optional) Setup specific Maven"
        if: ${{ inputs.maven_version != '' }}
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: ${{ inputs.maven_version }}

      - name: "Show tool versions"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO] java: $(java -version 2>&1 | head -1)"
          echo "[ECHO] mvn : $(mvn -v | head -1)"

      - name: "Prepare Echo directories"
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_ROOT" "$OUT_DIR" "$LOG_DIR" "$PERM_DIR" "$ARTIFACT_DIR"
          printf "[ECHO][OK] Directories prepared: %s %s %s %s %s
" "$ECHO_ROOT" "$OUT_DIR" "$LOG_DIR" "$PERM_DIR" "$ARTIFACT_DIR"

      - name: "Generate Echo Permission files"
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PERM_DIR/chmod.list" <<'LST'
          # perms target
          0755 scripts/*.sh
          0644 README.md
          0755 mvnw
          LST
          cat > "$PERM_DIR/chown.list" <<'LST'
          # owner:group target (러너 환경상 root:root 그대로 둘 수 있음)
          root:root .github/echo_java/**/*
          LST
          cat > "$PERM_DIR/apply.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          echo "[ECHO] Apply permissions..."
          if [ -f "$(dirname "$0")/chmod.list" ]; then
            while read -r mode path; do
              [[ -z "${mode:-}" || "${mode:0:1}" = "#" ]] && continue
              for f in $(echo "$path"); do
                [ -e "$f" ] && chmod "$mode" "$f" && echo "[OK] chmod $mode $f" || echo "[WARN] skip $f"
              done
            done < "$(dirname "$0")/chmod.list"
          fi
          if [ -f "$(dirname "$0")/chown.list" ]; then
            while read -r owner path; do
              [[ -z "${owner:-}" || "${owner:0:1}" = "#" ]] && continue
              for f in $(echo "$path"); do
                [ -e "$f" ] && sudo chown "$owner" "$f" && echo "[OK] chown $owner $f" || echo "[WARN] skip $f"
              done
            done < "$(dirname "$0")/chown.list"
          fi
          echo "[ECHO][DONE] Permissions applied"
          SH
          chmod +x "$PERM_DIR/apply.sh"

      - name: "(Optional) Upgrade Spring Boot version in pom.xml"
        if: ${{ inputs.spring_boot_version != '' }}
        shell: bash
        working-directory: ${{ steps.preflight.outputs.projectDir }}
        run: |
          set -Eeuo pipefail
          echo "[ECHO] Upgrade Spring Boot to ${{ inputs.spring_boot_version }}"
          mvn -B -e \
            versions:set-property \
            -Dproperty=spring-boot.version \
            -DnewVersion="${{ inputs.spring_boot_version }}" \
            -DgenerateBackupPoms=false | tee "$GITHUB_WORKSPACE/$LOG_DIR/versions-set-spring-boot.log"

      - name: "(Optional) Run tests"
        if: ${{ inputs.run_tests == 'true' }}
        shell: bash
        working-directory: ${{ steps.preflight.outputs.projectDir }}
        run: |
          set -Eeuo pipefail
          mvn -B -U -e -DskipTests=false test | tee "$GITHUB_WORKSPACE/$LOG_DIR/mvn-test.log"

      - name: "Build (package)"
        shell: bash
        working-directory: ${{ steps.preflight.outputs.projectDir }}
        run: |
          set -Eeuo pipefail
          mvn -B -U -e -DskipTests=${{ inputs.run_tests != 'true' }} package | tee "$GITHUB_WORKSPACE/$LOG_DIR/mvn-package.log"
          # Collect artifacts (jar/war)
          mkdir -p "$GITHUB_WORKSPACE/$ARTIFACT_DIR"
          find target -type f \( -name "*.jar" -o -name "*.war" \) -not -name "original-*.jar" -print -exec cp -v {} "$GITHUB_WORKSPACE/$ARTIFACT_DIR/" \;

      - name: "Upload build artifacts"
        if: ${{ inputs.distribute_artifacts == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            ${{ env.ARTIFACT_DIR }}/*
            ${{ env.LOG_DIR }}/*.log

      - name: "(Optional) Bump version, tag & commit"
        if: ${{ inputs.create_release == 'true' }}
        id: bump
        shell: bash
        working-directory: ${{ steps.preflight.outputs.projectDir }}
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@github.com
        run: |
          set -Eeuo pipefail
          # Extract current version from pom.xml
          CURR_VER=$(xmllint --xpath '/*[local-name()="project"]/*[local-name()="version"]/text()' pom.xml 2>/dev/null || echo "0.1.0-SNAPSHOT")
          echo "[ECHO] Current version: $CURR_VER"
          BASE_VER=${CURR_VER%-SNAPSHOT}
          IFS='.' read -r MA MI PA <<<"${BASE_VER:-0.1.0}"
          case "${BUMP_TYPE:-patch}" in
            major) MA=$((MA+1)); MI=0; PA=0;;
            minor) MI=$((MI+1)); PA=0;;
            *)     PA=$((PA+1));; # patch
          esac
          NEXT_VER="$MA.$MI.$PA"
          echo "[ECHO] Next version: $NEXT_VER"
          mvn -B -q versions:set -DnewVersion="$NEXT_VER" -DgenerateBackupPoms=false
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add pom.xml
          git commit -m "chore(release): set version $NEXT_VER"
          git tag -a "v$NEXT_VER" -m "Release v$NEXT_VER"
          git push origin HEAD:$(git rev-parse --abbrev-ref HEAD)
          git push origin "v$NEXT_VER"
          echo "next_ver=$NEXT_VER" >> "$GITHUB_OUTPUT"

      - name: "(Optional) Create GitHub Release"
        if: ${{ inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.next_ver }}
          name: v${{ steps.bump.outputs.next_ver }}
          body: |
            ✅ Automated release
            - Maven: ${{ inputs.maven_version != '' && inputs.maven_version || 'default' }}
            - Spring Boot: ${{ inputs.spring_boot_version != '' && inputs.spring_boot_version || 'pom.xml default' }}
            - Bump: ${{ inputs.bump_type }}
          files: |
            ${{ env.ARTIFACT_DIR }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Apply Permission Echo"
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$PERM_DIR/apply.sh" | tee "$LOG_DIR/perm-apply.log"

      - name: "Summary"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Build done." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "
### Tool Versions" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java: $(java -version 2>&1 | head -1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Maven: $(mvn -v | head -1)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.bump.outputs.next_ver }}" ]; then
            echo "
### Release" >> "$GITHUB_STEP_SUMMARY"
            echo "- Created tag v${{ steps.bump.outputs.next_ver }}" >> "$GITHUB_STEP_SUMMARY"
          fi
