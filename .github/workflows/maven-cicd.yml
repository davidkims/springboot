          from psycopg2.pool import SimpleConnectionPool
          from fastapi import FastAPI, HTTPException, BackgroundTasks
          from fastapi.responses import JSONResponse, Response
          from fastapi.middleware.cors import CORSMiddleware
          from prometheus_client import Counter, Gauge, generate_latest, CONTENT_TYPE_LATEST
          
          DB_HOST = os.getenv("DB_HOST", "td-sim")
          SERVICE = os.getenv("SERVICE_NAME", "scheduler")
          
          app = FastAPI(title="Scheduler Service", version="8.5.0")
          app.add_middleware(CORSMiddleware, allow_origins=["*"], allow_credentials=True, allow_methods=["*"], allow_headers=["*"])
          
          pool = None
          JOB_COUNTER = Counter("scheduler_jobs_total", "Scheduled jobs", ["status"])
          ACTIVE_JOBS = Gauge("scheduler_active_jobs", "Currently active jobs")
          
          # Simple in-memory job store (in production, use Redis/database)
          job_store = {}
          job_id_counter = 1
          
          @app.on_event("startup")
          async def startup():
              global pool
              pool = SimpleConnectionPool(minconn=1, maxconn=3, host=DB_HOST, port=5432, dbname="postgres", user="postgres", password="postgres")
              
              # Create scheduler tables
              conn = pool.getconn()
              cur = conn.cursor()
              cur.execute("""
                  CREATE SCHEMA IF NOT EXISTS scheduler;
                  CREATE TABLE IF NOT EXISTS scheduler.jobs(
                      job_id SERIAL PRIMARY KEY,
                      job_name VARCHAR(100) NOT NULL,
                      job_type VARCHAR(50),
                      schedule_expression VARCHAR(100),
                      next_run TIMESTAMP,
                      last_run TIMESTAMP,
                      status VARCHAR(20) DEFAULT 'active',
                      config JSONB,
                      created_at TIMESTAMP DEFAULT NOW()
                  );
                  CREATE TABLE IF NOT EXISTS scheduler.job_executions(
                      execution_id BIGSERIAL PRIMARY KEY,
                      job_id INT REFERENCES scheduler.jobs(job_id),
                      started_at TIMESTAMP DEFAULT NOW(),
                      completed_at TIMESTAMP,
                      status VARCHAR(20) DEFAULT 'running',
                      result JSONB,
                      error_message TEXT
                  );
              """)
              conn.commit()
              cur.close()
              pool.putconn(conn)
              
              # Start background task scheduler
              asyncio.create_task(job_runner())
          
          async def job_runner():
              while True:
                  try:
                      current_time = datetime.utcnow()
                      conn = pool.getconn()
                      cur = conn.cursor()
                      
                      # Find jobs to run
                      cur.execute("""
                          SELECT job_id, job_name, job_type, config
                          FROM scheduler.jobs 
                          WHERE status = 'active' AND next_run <= %s
                      """, (current_time,))
                      
                      jobs_to_run = cur.fetchall()
                      for job in jobs_to_run:
                          job_id, job_name, job_type, config = job
                          await execute_job(job_id, job_name, job_type, config)
                          
                          # Update next run time (simplified - every 5 minutes)
                          next_run = current_time + timedelta(minutes=5)
                          cur.execute("UPDATE scheduler.jobs SET next_run = %s, last_run = %s WHERE job_id = %s", 
                                    (next_run, current_time, job_id))
                      
                      conn.commit()
                      cur.close()
                      pool.putconn(conn)
                      
                  except Exception as e:
                      print(f"Job runner error: {e}")
                  
                  await asyncio.sleep(30)  # Check every 30 seconds
          
          async def execute_job(job_id: int, job_name: str, job_type: str, config: dict):
              conn = pool.getconn()
              cur = conn.cursor()
              
              # Log job execution start
              cur.execute("""
                  INSERT INTO scheduler.job_executions(job_id, status) 
                  VALUES (%s, 'running') RETURNING execution_id
              """, (job_id,))
              execution_id = cur.fetchone()[0]
              conn.commit()
              
              try:
                  # Execute job based on type
                  result = await run_job_logic(job_type, config)
                  
                  # Log successful completion
                  cur.execute("""
                      UPDATE scheduler.job_executions 
                      SET status = 'completed', completed_at = NOW(), result = %s 
                      WHERE execution_id = %s
                  """, (json.dumps(result), execution_id))
                  
                  JOB_COUNTER.labels(status="completed").inc()
                  
              except Exception as e:
                  # Log error
                  cur.execute("""
                      UPDATE scheduler.job_executions 
                      SET status = 'failed', completed_at = NOW(), error_message = %s 
                      WHERE execution_id = %s
                  """, (str(e), execution_id))
                  
                  JOB_COUNTER.labels(status="failed").inc()
              
              finally:
                  conn.commit()
                  cur.close()
                  pool.putconn(conn)
          
          async def run_job_logic(job_type: str, config: dict):
              # Implement different job types
              if job_type == "data_cleanup":
                  # Clean up old audit records
                  conn = pool.getconn()
                  cur = conn.cursor()
                  cur.execute("DELETE FROM audit.audit_trail WHERE audit_ts < NOW() - INTERVAL '90 days'")
                  deleted_rows = cur.rowcount
                  conn.commit()
                  cur.close()
                  pool.putconn(conn)
                  return {"deleted_audit_records": deleted_rows}
              
              elif job_type == "metrics_aggregation":
                  # Aggregate daily metrics
                  conn = pool.getconn()
                  cur = conn.cursor()
                  cur.execute("""
                      INSERT INTO ledger.fact_txn_day(day, txn_count, total_amount)
                      SELECT DATE(txn_ts), COUNT(*), SUM(amount)
                      FROM td.fact_transaction 
                      WHERE DATE(txn_ts) = CURRENT_DATE - INTERVAL '1 day'
                      GROUP BY DATE(txn_ts)
                      ON CONFLICT (day) DO UPDATE SET 
                          txn_count = EXCLUDED.txn_count,
                          total_amount = EXCLUDED.total_amount
                  """)
                  conn.commit()
                  cur.close()
                  pool.putconn(conn)
                  return {"aggregated_date": (datetime.utcnow() - timedelta(days=1)).date().isoformat()}
              
              else:
                  return {"message": f"Unknown job type: {job_type}"}
          
          @app.get("/health")
          async def health():
              return {"status": "healthy", "service": SERVICE, "timestamp": datetime.utcnow().isoformat()}
          
          @app.post("/scheduler/jobs")
          async def create_job(job_name: str, job_type: str, schedule_expression: str = "0 */5 * * * *"):
              conn = pool.getconn()
              cur = conn.cursor()
              
              next_run = datetime.utcnow() + timedelta(minutes=5)  # Simple scheduling
              cur.execute("""
                  INSERT INTO scheduler.jobs(job_name, job_type, schedule_expression, next_run)
                  VALUES (%s, %s, %s, %s) RETURNING job_id
              """, (job_name, job_type, schedule_expression, next_run))
              
              job_id = cur.fetchone()[0]
              conn.commit()
              cur.close()
              pool.putconn(conn)
              
              return {"job_id": job_id, "job_name": job_name, "next_run": next_run.isoformat()}
          
          @app.get("/scheduler/jobs")
          async def list_jobs():
              conn = pool.getconn()
              cur = conn.cursor()
              cur.execute("SELECT * FROM scheduler.jobs ORDER BY created_at DESC")
              rows = cur.fetchall()
              cols = [desc[0] for desc in cur.description]
              cur.close()
              pool.putconn(conn)
              
              return [{col: (val.isoformat() if isinstance(val, datetime) else val) for col, val in zip(cols, row)} for row in rows]
          
          @app.get("/scheduler/executions")
          async def list_executions(job_id: int = None, limit: int = 50):
              conn = pool.getconn()
              cur = conn.cursor()
              
              if job_id:
                  cur.execute("SELECT * FROM scheduler.job_executions WHERE job_id = %s ORDER BY started_at DESC LIMIT %s", (job_id, limit))
              else:
                  cur.execute("SELECT * FROM scheduler.job_executions ORDER BY started_at DESC LIMIT %s", (limit,))
              
              rows = cur.fetchall()
              cols = [desc[0] for desc in cur.description]
              cur.close()
              pool.putconn(conn)
              
              return [{col: (val.isoformat() if isinstance(val, datetime) else val) for col, val in zip(cols, row)} for row in rows]
          
          @app.get("/metrics")
          async def metrics():
              # Update active jobs gauge
              conn = pool.getconn()
              cur = conn.cursor()
              cur.execute("SELECT COUNT(*) FROM scheduler.jobs WHERE status = 'active'")
              active_count = cur.fetchone()[0]
              ACTIVE_JOBS.set(active_count)
              cur.close()
              pool.putconn(conn)
              
              return Response(content=generate_latest(), media_type=CONTENT_TYPE_LATEST)
