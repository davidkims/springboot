# 🗂️ MEGA-DB/거래/계좌/이체/유저/시뮬/설치/권한/대량/운영/유틸/Compose-통합

name: 🗂️ MEGA-DB/거래/계좌/이체/유저/시뮬/설치/권한/대량/운영/유틸/Compose-통합

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  db-echo-mega:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 체크아웃
        uses: actions/checkout@v4

      - name: 📁 모든 echo 이벤트 및 echo_dir_create.sh 자동 생성
        run: |
          set -e
          mkdir -p .github/echo_db
          echo "#!/bin/bash" > .github/echo_db/echo_dir_create.sh
          for d in \
            .github/echo_db/{dirs,files,logs,scripts,services,compose,homebrew,choco,snap,marketplace,backup,init,test,migration,import,export,serverinfo,errorlog,util,mass_db,mass_script,mass_query,ledger,vaccount,transfer,user,sim,teradata,dwh,ddl,output,image,dockerfile,installer,analytics,parallel,summary,workflow,api,sql_exec,echo_log,result,report,history,metrics,accounting,dispatch,task,upgrade,transfer_exec,select,polestar,kafka,elk,prometheus,grafana,firewall,ports}; do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo_db/echo_dir_create.sh
            mkdir -p "$d"
          done
          chmod +x .github/echo_db/echo_dir_create.sh

      - name: 📄 참확 기반 파일 및 실행기 생성
        run: |
          echo "echo '[ECHO] 사용자 변기 이체 원장 자동생성 시작]'" > .github/echo_db/logs/init_echo.log
          echo "#!/bin/bash" > .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/echo_dir_create.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_users.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_accounts.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_ledgers.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_transfers.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_selects.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_dockerfiles.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_polestar.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_bteq.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_kafka.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_elk.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_prometheus.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_grafana.sh" >> .github/echo_db/scripts/full_init_run.sh
          chmod +x .github/echo_db/scripts/full_init_run.sh

      - name: 🚀 수학 및 실시간 Kafka/시간 거래/ELK/실행 조회 자동설치
        run: |
          echo "echo '[Kafka] 설치/시작'" > .github/echo_db/kafka/setup_kafka.sh
          echo "sudo apt-get install -y default-jdk zookeeperd kafka" >> .github/echo_db/kafka/setup_kafka.sh
          echo "echo '[Kafka] 시작'" >> .github/echo_db/kafka/setup_kafka.sh
          echo "sudo systemctl start kafka || true" >> .github/echo_db/kafka/setup_kafka.sh
          echo "sudo systemctl enable kafka || true" >> .github/echo_db/kafka/setup_kafka.sh
          echo "echo '[ELK] 설치'" > .github/echo_db/elk/setup_elk.sh
          echo "sudo apt-get install -y elasticsearch kibana logstash" >> .github/echo_db/elk/setup_elk.sh
          echo "sudo systemctl start elasticsearch kibana logstash || true" >> .github/echo_db/elk/setup_elk.sh
          echo "echo '[Prometheus] 설치'" > .github/echo_db/prometheus/setup_prometheus.sh
          echo "sudo apt-get install -y prometheus" >> .github/echo_db/prometheus/setup_prometheus.sh
          echo "sudo systemctl start prometheus || true" >> .github/echo_db/prometheus/setup_prometheus.sh
          echo "echo '[Grafana] 설치'" > .github/echo_db/grafana/setup_grafana.sh
          echo "sudo apt-get install -y grafana" >> .github/echo_db/grafana/setup_grafana.sh
          echo "sudo systemctl start grafana-server || true" >> .github/echo_db/grafana/setup_grafana.sh
          chmod +x .github/echo_db/kafka/setup_kafka.sh
          chmod +x .github/echo_db/elk/setup_elk.sh
          chmod +x .github/echo_db/prometheus/setup_prometheus.sh
          chmod +x .github/echo_db/grafana/setup_grafana.sh

      - name: 🏷️ 모든 echo 출력표시
        run: |
          echo "[ECHO] 모든 출력 복사 목록"
          find .github/echo_db -type f | sort | while read f; do
            echo "-----"
            echo "[파일] $f"
            cat "$f"
            echo
          done
