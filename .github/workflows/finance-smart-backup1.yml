name: 📧 MEGA EMAIL CI + EchoOps + Monitoring + DLL + VirusScan

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Base domain for virtual accounts"
        required: false
        default: "example.local"
      user_count:
        description: "Number of virtual accounts per service"
        required: false
        default: "50"
      test_count:
        description: "Number of test emails per server"
        required: false
        default: "3"
      mta_choice:
        description: "apt·install MTA (none|postfix|exim4|opensmtpd)"
        required: false
        default: "none"
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes

jobs:
  provision-email:
    runs-on: ubuntu-latest
    env:
      BASE: /opt/email
      DOMAIN: ${{ github.event.inputs.domain || 'example.local' }}
      USER_COUNT: ${{ github.event.inputs.user_count || 50 }}
      TEST_COUNT: ${{ github.event.inputs.test_count || 3 }}
      SERVICES: postfix exim4 opensmtpd mailhog mailcatcher smtp-sink maildev
      MTA_CHOICE: ${{ github.event.inputs.mta_choice || 'none' }}
      MONO: .monitoring
      INF_BUCKET: metrics
      INF_ORG: org
      INF_USER: admin
      INF_PASS: admin1234!
      INF_TOKEN: dev-token-123456

    steps:
      - name: 📂 Checkout Repo
        uses: actions/checkout@v4

      - name: 📁 Create Echo Directories per Service
        run: |
          set -Eeuo pipefail
          for SVC in $SERVICES; do
            for DIR in etc data logs firewall dll echo tmp backup reports users; do
              path="$BASE/$SVC/$DIR"
              mkdir -p "$path"
              echo "echo '[ECHO] Created: $path'" >> "$BASE/$SVC/echo/create_dirs.sh"
            done
            chmod +x "$BASE/$SVC/echo/create_dirs.sh"
            bash "$BASE/$SVC/echo/create_dirs.sh"
          done

      - name: 📊 Generate Fake .dll Files
        run: |
          for SVC in $SERVICES; do
            dir="$BASE/$SVC/dll"
            for i in $(seq -w 001 100); do
              file="$dir/lib${i}.dll"
              echo "; DLL stub for $SVC [$i]" > "$file"
              echo "EXPORTS\n    Function${i} @${i}" >> "$file"
            done
          done

      - name: 🔒 Create Firewall Policy (Echo)
        run: |
          for SVC in $SERVICES; do
            file="$BASE/$SVC/firewall/policy.conf"
            echo "# Echo-only policy for $SVC" > "$file"
            echo "allow_tcp=1025,1026,1081,8025,8026,9001,9002,9003,2525" >> "$file"
            echo "deny_all_else=true" >> "$file"
            echo "note='CI test only'" >> "$file"
          done

      - name: 🔧 MTA Conditional Install
        if: env.MTA_CHOICE != 'none'
        run: |
          sudo apt-get update
          sudo apt-get install -y "$MTA_CHOICE" || true

      - name: 🚀 Virus Scanner Setup + Scan
        run: |
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam || true
          : > "$BASE/tmp/EICAR.txt"
          echo "X5O!P%@AP[4\\PZX54(P^)7CC)7}\\$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!\$H+H*" > "$BASE/tmp/EICAR.txt"
          clamscan -r "$BASE" | tee "$BASE/reports/clamav_scan.txt" || true

      - name: 📊 Monitoring File Echo Output
        run: |
          mkdir -p "$MONO"
          du -ah "$BASE" | sort -hr | head -n 20 > "$MONO/top_sizes.txt"
          echo "[ECHO] File size monitoring complete"

      - name: 🔢 Save Echo Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-artifacts
          path: |
            ${{ env.BASE }}/*/echo/**
            ${{ env.BASE }}/*/dll/**
            ${{ env.BASE }}/*/firewall/policy.conf
            ${{ env.MONO }}/top_sizes.txt
            ${{ env.BASE }}/reports/clamav_scan.txt
