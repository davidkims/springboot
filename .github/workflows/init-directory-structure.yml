name: 📁 Auto Generate Next Slot & PR (every minute)

on:
  schedule:
    - cron: '*/1 * * * *'  # ⏱ 매 1분마다 실행
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-generate-slot:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Git Config 설정
        run: |
          echo "[🔧] Git 사용자 정보 설정..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 📊 현재 가장 최신 슬롯 번호 추출 및 신규 슬롯 계산
        id: detect
        run: |
          echo "[🔍] 슬롯 디렉토리 검색 중..."
          mkdir -p disk
          EXISTING=$(find disk -maxdepth 1 -type d -name 'slot-*' | sed 's|.*/slot-||' | sort -n)
          echo "$EXISTING" | sed 's/^/[📁] 기존 슬롯: slot-/'

          LAST_SLOT=$(echo "$EXISTING" | sort -n | tail -n 1)
          if [ -z "$LAST_SLOT" ]; then
            NEXT_SLOT=001
          else
            NEXT_SLOT=$(printf "%03d" $((10#$LAST_SLOT + 1)))
          fi
          echo "[➡️] 다음 슬롯 번호: slot-$NEXT_SLOT"

          echo "next_slot=slot-${NEXT_SLOT}" >> $GITHUB_OUTPUT

      - name: 📁 신규 슬롯 디렉토리 및 파일 생성 (echo 기반)
        run: |
          SLOT_NAME=${{ steps.detect.outputs.next_slot }}
          SLOT_DIR="disk/$SLOT_NAME"

          echo "[📁] $SLOT_DIR 생성 중..."
          mkdir -p "$SLOT_DIR"

          echo "# $SLOT_NAME" > "$SLOT_DIR/README.md"
          echo "Slot: $SLOT_NAME" > "$SLOT_DIR/slot-info.txt"
          echo "Created: $(date -u)" >> "$SLOT_DIR/slot-info.txt"

          echo "[✔] $SLOT_DIR/README.md, slot-info.txt 생성 완료"

      - name: 🔗 심볼릭 링크 slot-latest → 새 슬롯
        run: |
          SLOT_NAME=${{ steps.detect.outputs.next_slot }}
          echo "[🔗] 최신 심볼릭 링크 업데이트: slot-latest → $SLOT_NAME"
          rm -rf disk/slot-latest
          ln -s $SLOT_NAME disk/slot-latest
          ls -l disk/

      - name: 🔀 Pull Request 생성
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🔁 Auto create ${{ steps.detect.outputs.next_slot }} & update symlink"
          branch: slot-update-${{ steps.detect.outputs.next_slot }}
          title: "🔁 Create ${{ steps.detect.outputs.next_slot }} & Update slot-latest"
          body: |
            This PR was automatically generated:
            - Created new slot `${{ steps.detect.outputs.next_slot }}`
            - Added `README.md` and `slot-info.txt` using echo
            - Updated `disk/slot-latest` symlink
            - Auto-executed every 1 minute
          delete-branch: true
