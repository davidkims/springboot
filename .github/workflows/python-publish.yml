name: 📦 Build Python Package (With Auto Requirements)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 📁 Create build, log, dist, and site directories
        run: |
          echo "[📁] Creating required directories..."
          mkdir -p build logs dist site
          echo "[✅] Directories created."

      - name: 📦 Install extended Python packages
        run: |
          echo "[📦] Installing extended Python packages..."
          python -m pip install --upgrade pip

          echo "[🔧] Installing build tools..."
          pip install build setuptools wheel twine

          echo "[✅] Installing code quality tools..."
          pip install flake8 black isort mypy pylint bandit

          echo "[🧪] Installing test packages..."
          pip install pytest pytest-cov hypothesis

          echo "[📚] Installing documentation tools..."
          pip install sphinx myst-parser sphinx-autobuild furo

          echo "[📊] Installing analysis tools..."
          pip install pandas numpy matplotlib scipy

          echo "[🌐] Installing web & API tools..."
          pip install fastapi flask httpx requests uvicorn

          echo "[🔐] Installing security tools..."
          pip install safety pip-audit

          echo "[💡] Installing type hint stubs..."
          pip install types-requests types-PyYAML types-setuptools

          echo "[✅] All packages installed."

      - name: ⚙️ Auto-generate requirements.txt if missing
        run: |
          if [ ! -f requirements.txt ]; then
            echo "[⚙️] requirements.txt not found. Generating default..."
            echo "pandas" > requirements.txt
            echo "numpy" >> requirements.txt
            echo "fastapi" >> requirements.txt
            echo "uvicorn" >> requirements.txt
            echo "pytest" >> requirements.txt
            echo "[✅] requirements.txt generated."
          else
            echo "[✅] requirements.txt already exists. Skipping generation."
          fi

      - name: ⚙️ Generate pyproject.toml or setup.py if missing
        run: |
          echo "[🔍] Checking for pyproject.toml or setup.py..."
          if [ ! -f pyproject.toml ] && [ ! -f setup.py ]; then
            echo "[⚠️] Generating fallback pyproject.toml..."
            echo "[build-system]" > pyproject.toml
            echo "requires = [\"setuptools\", \"wheel\"]" >> pyproject.toml
            echo "build-backend = \"setuptools.build_meta\"" >> pyproject.toml
            echo "" >> pyproject.toml
            echo "[project]" >> pyproject.toml
            echo "name = \"demo-package\"" >> pyproject.toml
            echo "version = \"0.0.1\"" >> pyproject.toml
            echo "description = \"Fallback package for GitHub Actions build\"" >> pyproject.toml
            echo "authors = [{name = \"GitHub Actions\"}]" >> pyproject.toml
            echo "" >> pyproject.toml
            echo "[tool.setuptools.packages.find]" >> pyproject.toml
            echo "include = [\"finance_app*\"]" >> pyproject.toml
            echo "exclude = [\"tests*\", \"logs*\", \"migrations*\", \"setup_guides*\", \"workflow_docs*\"]" >> pyproject.toml
            echo "[✅] pyproject.toml generated."

            echo "[⚙️] Generating fallback setup.py..."
            echo "from setuptools import setup, find_packages" > setup.py
            echo "setup(name='demo-package', version='0.0.1', packages=find_packages(include=['finance_app*']))" >> setup.py
            echo "[✅] setup.py generated."
          else
            echo "[✅] pyproject.toml or setup.py already exists."
          fi

      - name: 🧾 Generate PyPI Trusted Publisher Info
        run: |
          echo "[📜] Generating PyPI Trusted Publisher Info..."
          mkdir -p .github site
          FILE=.github/pypi-publisher-info.txt
          echo "🔐 PyPI Trusted Publisher 설정 정보" > $FILE
          echo "" >> $FILE
          echo "📌 Repository Owner: davidkims" >> $FILE
          echo "📌 Repository Name : springboot" >> $FILE
          echo "📌 Workflow File   : .github/workflows/python-publish.yml" >> $FILE
          echo "📌 Environment     : pypi" >> $FILE
          echo "📌 Workflow Ref    : davidkims/springboot/.github/workflows/python-publish.yml@refs/heads/main" >> $FILE
          echo "" >> $FILE
          echo "✅ PyPI > Trusted Publishers 메뉴에서 위 정보를 그대로 입력하세요." >> $FILE
          cp $FILE site/
          echo "[✅] PyPI 등록 정보 저장 완료."

      - name: 🧊 Freeze current environment to lock file
        run: |
          echo "[🔒] Freezing current environment to logs/requirements.lock.txt..."
          pip freeze > logs/requirements.lock.txt
          echo "[✅] Lock file created at logs/requirements.lock.txt"

      - name: 🧪 Run Tests
        run: |
          echo "[🧪] Running tests..."
          if [ -d "tests" ]; then
            pytest tests | tee logs/test.log
            echo "[✅] Tests completed."
          else
            echo "[⚠️] No tests directory found. Skipping tests."
          fi

      - name: 🧹 Run Lint & Type Checks
        run: |
          echo "[🧹] Running lint checks..."
          flake8 . || echo "[⚠️] flake8 issues detected."
          black . --check || echo "[⚠️] black format issues."
          isort . --check-only || echo "[⚠️] isort ordering issues."
          mypy . || echo "[⚠️] mypy type issues."
          echo "[✅] Lint and type checks done."

      - name: 🏗️ Build Distributions
        run: |
          echo "[🏗️] Building package..."
          python -m build
          echo "[✅] Build complete:"
          ls -lh dist/

      - name: ⬆️ Upload Distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
