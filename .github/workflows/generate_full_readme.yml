name: 📓 포트폴리오 + 워크플로 통계로 README & SECURITY 업데이트

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update_docs:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [16, 18, 20]
      max-parallel: 3
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_LATENCY_MS: 1000
      TMP_DIR: .tmp/${{ matrix.os }}-${{ matrix.node-version }}

    steps:
      - name: 🖥️ 환경 정보
        run: |
          echo "[🖥️] 실행 환경 정보 확인"
          echo "OS: ${{ runner.os }}"
          echo "Node.js 버전: ${{ matrix.node-version }}"

      - name: 📅 Checkout Repository
        run: |
          echo "[📅] Checkout Repository 실행"
          echo "uses: actions/checkout@v4"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 📅 Checkout 완료
        run: |
          echo "[📅] 레포지토리 체크아웃 완료"

      - name: 📦 캐시 설정 (pip, Prometheus)
        run: |
          echo "[📦] 캐시 설정 시작"
          echo "uses: actions/cache@v4"
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            /tmp/prometheus-cache
          key: ${{ runner.os }}-cache-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-cache-
      - name: 📦 캐시 설정 완료
        run: |
          echo "[📦] 캐시 설정 완료"

      - name: 📦 Setup Node.js
        run: |
          echo "[📦] Setup Node.js 시작"
          echo "uses: actions/setup-node@v4"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 📦 Node.js 설치 완료
        run: |
          echo "[📦] Node.js ${{ matrix.node-version }} 설치 완료"

      - name: 🔧 패키지 설치 (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "[🔧] Linux 패키지 설치 시작 (apt-get)"
          sudo apt-get update -y
          echo "[🔧] apt 업데이트 완료"
          sudo apt-get install -y gh jq parallel
          echo "[✅] Linux 패키지 설치 완료"

      - name: 🔧 패키지 설치 (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "[🔧] macOS 패키지 설치 시작 (brew)"
          brew update
          echo "[🔧] brew 업데이트 완료"
          brew install gh jq parallel
          echo "[✅] macOS 패키지 설치 완료"

      - name: 🔧 패키지 설치 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "[🔧] Windows 패키지 설치 시작 (Chocolatey)"
          choco install git.install jq -y || Write-Host "[⚠️] git 또는 jq 설치 실패"
          Write-Host "[ℹ️] parallel 패키지 없음: 생략"
          Write-Host "[✅] Windows 패키지 설치 완료"

      - name: 🔍 패키지 버전 확인
        run: |
          echo "[🔍] gh 버전 확인"; gh --version || echo "[ℹ️] gh CLI 미설치"
          echo "[🔍] jq 버전 확인"; jq --version || echo "[ℹ️] jq 미설치"
          echo "[🔍] parallel 버전 확인"; parallel --version || echo "[ℹ️] parallel 미설치"

      - name: 🛡️ Generate SECURITY.md
        run: |
          echo "[🛡️] SECURITY.md 파일 생성 준비"
          echo "# Security Policy" > SECURITY.md
          echo "[🛡️] Security Policy 헤더 추가"
          echo "## Supported Versions" >> SECURITY.md
          echo "[🛡️] Supported Versions 섹션 시작" >> SECURITY.md
          echo "| Version | Supported          |" >> SECURITY.md
          echo "| ------- | ------------------ |" >> SECURITY.md
          echo "| 5.1.x   | :white_check_mark: |" >> SECURITY.md
          echo "| 5.0.x   | :x:                |" >> SECURITY.md
          echo "| 4.0.x   | :white_check_mark: |" >> SECURITY.md
          echo "| < 4.0   | :x:                |" >> SECURITY.md
          echo "[🛡️] Supported Versions 완료" >> SECURITY.md

      - name: 📋 Ensure TMP_DIR
        run: |
          echo "[📋] TMP_DIR 생성 확인: $TMP_DIR"
          mkdir -p "$TMP_DIR"
          echo "[✅] TMP_DIR 생성 완료"

      - name: 📊 병렬 워크플로우 통계 수집
        run: |
          echo "[📊] 워크플로우 통계 파일 생성 준비"
          OUTPUT_FILE="$TMP_DIR/workflows.md"
          echo "# ⚙️ GitHub Actions 워크플로우 목록 및 통계" > "$OUTPUT_FILE"
          echo "[📊] 헤더 작성 완료: 워크플로우 목록 및 통계" >> "$OUTPUT_FILE"
          echo "| 워크플로우 이름 | 실행 수 | 성공 수 | 실패 수 | 성공률 |" >> "$OUTPUT_FILE"
          echo "|----------------|--------:|--------:|--------:|--------:|" >> "$OUTPUT_FILE"
          echo "[📊] 테이블 헤더 추가 완료"   
          parallel_stats() {
            echo "[🔎] 통계 함수 실행 시작"
            f="$1"
            NAME=$(grep '^name:' "$f" | head -n1 | cut -d ':' -f2- | xargs)
            FILENAME=$(basename "$f")
            echo "[🔎] $FILENAME 통계 조회"
            RUNS=$(gh run list --workflow="$FILENAME" --limit 500 --json conclusion -q '.[] | .conclusion')
            TOTAL=$(echo "$RUNS" | wc -l)
            SUCCESS=$(echo "$RUNS" | grep -c success || true)
            FAILURE=$((TOTAL - SUCCESS))
            RATE=$(awk "BEGIN {if (TOTAL>0) printf \"%.1f\", (SUCCESS/TOTAL)*100; else print \"N/A\"}")
            echo "| $NAME | $TOTAL | $SUCCESS | $FAILURE | $RATE% |"
          }
          export -f parallel_stats
          echo "[📊] 병렬 처리 실행 준비"
          CORES=$(nproc || echo 1)
          echo "[📊] 사용 코어 수: $CORES"
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) |
            parallel --no-notice -j $CORES parallel_stats {} >> "$OUTPUT_FILE"
          echo "[📊] 워크플로우 통계 수집 완료"

      - name: 📝 README.md 생성
        run: |
          echo "[📝] README.md 파일 생성 준비"
          cat <<EOF > README.md
