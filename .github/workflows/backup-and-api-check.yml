name: DB CLI Remake & CodeQL Fallback Robust Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  db-cli-remake-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DBCLI_DIR: .github/dbcli
      OUTPUT_DIR: .github/dbcli/output
      VA_DIR: .github/dbcli/virtual_accounts
      ORDER_DIR: .github/dbcli/orders
      USER_DIR: .github/dbcli/users
      TMP_SAFE_DIR: /tmp/dbcli_safe_tmp
      DB2_CLI_URL: "https://public.dhe.ibm.com/ibmdl/export/pub/software/data/db2/drivers/odbc_cli/linuxx64_odbc_cli.tar.gz"
      DB2_CLI_DIR: /opt/ibm/db2_cli
      MIN_FREE_MB: 500
      DBECHO_DAEMON_YML: .github/workflows/DBEchoDaemon.yml

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ robust 기본 디렉토리/파일 생성
        run: |
          set -e
          robust_mkdir() {
            DIR="$1"
            if [ -e "$DIR" ] && [ ! -d "$DIR" ]; then
              rm -f "$DIR"
            fi
            mkdir -p "$DIR"
            chmod 700 "$DIR"
          }
          robust_echo() {
            CONTENT="$1"
            TARGET="$2"
            DIR=$(dirname "$TARGET")
            robust_mkdir "$DIR"
            if [ -e "$TARGET" ]; then
              [ -d "$TARGET" ] && rm -rf "$TARGET" || rm -f "$TARGET"
            fi
            echo "$CONTENT" > "$TARGET"
            chmod 600 "$TARGET"
          }
          for DB in mysql mariadb percona postgresql sqlite redis clickhouse firebird db2; do
            robust_mkdir "$DBCLI_DIR/$DB"
          done
          robust_mkdir "$OUTPUT_DIR"
          robust_mkdir "$VA_DIR"
          robust_mkdir "$ORDER_DIR"
          robust_mkdir "$USER_DIR"

      - name: CodeQL DB Echo robust 복제 및 생성
        run: |
          set -e
          # robust 복제 및 Fallback 로직
          CODEQL_OUT_DIR=".github/codeql-out"
          DBQL_DIR="$CODEQL_OUT_DIR/db-ql-dummy"
          ECHO_FILE="$DBQL_DIR/codeql-db-echo.txt"
          DUMMY_SRC_YML="${DBECHO_DAEMON_YML:-.github/workflows/DBEchoDaemon.yml}"

          mkdir -p "$DBQL_DIR"
          # 복제: DBEchoDaemon.yml에서 echo 파일 내용 추출
          if [ -f "$DUMMY_SRC_YML" ]; then
            # 복제할 파일 내 echo 부분만 실행하여 실제 echo 파일 생성
            grep -Pzo '(?s)echo.*?\.github/codeql-out/db-ql-dummy/codeql-db-echo.txt' "$DUMMY_SRC_YML" \
            | sed -e 's/^ *- run: *|//' | bash || {
              echo "[⚠️] DBEchoDaemon.yml에서 코드 추출 실패, Fallback으로 직접 생성"
              echo "==== CodeQL DB Echo Batch ====" > "$ECHO_FILE"
              echo "timestamp: $(date '+%Y-%m-%d %H:%M:%S')" >> "$ECHO_FILE"
              echo "repository: $GITHUB_REPOSITORY" >> "$ECHO_FILE"
              echo "commit_sha: $GITHUB_SHA" >> "$ECHO_FILE"
              echo "run_id: $GITHUB_RUN_ID" >> "$ECHO_FILE"
              echo "run_number: $GITHUB_RUN_NUMBER" >> "$ECHO_FILE"
              echo "workflow: $GITHUB_WORKFLOW" >> "$ECHO_FILE"
              echo "generated_by: DB CLI Remake Automation" >> "$ECHO_FILE"
              echo "----" >> "$ECHO_FILE"
            }
            chmod 600 "$ECHO_FILE"
          else
            # DBEchoDaemon.yml이 없으면 robust echo fallback
            echo "[❌] DBEchoDaemon.yml 파일 없음. robust fallback으로 생성"
            echo "==== CodeQL DB Echo Batch ====" > "$ECHO_FILE"
            echo "timestamp: $(date '+%Y-%m-%d %H:%M:%S')" >> "$ECHO_FILE"
            echo "repository: $GITHUB_REPOSITORY" >> "$ECHO_FILE"
            echo "commit_sha: $GITHUB_SHA" >> "$ECHO_FILE"
            echo "run_id: $GITHUB_RUN_ID" >> "$ECHO_FILE"
            echo "run_number: $GITHUB_RUN_NUMBER" >> "$ECHO_FILE"
            echo "workflow: $GITHUB_WORKFLOW" >> "$ECHO_FILE"
            echo "generated_by: DB CLI Remake Automation" >> "$ECHO_FILE"
            echo "----" >> "$ECHO_FILE"
            chmod 600 "$ECHO_FILE"
          fi
          echo "[✅] CodeQL DB Echo robust 복제/생성 완료: $ECHO_FILE"

      - name: 최신 DB CLI 추가 설치 (옵션, 에러 무시)
        run: |
          sudo apt-get install -y mysql-client-8.0 mysql-client-core-8.0 mariadb-client-10.6 || true
          sudo apt-get install -y postgresql-client-16 postgresql-client-common || true
          sudo apt-get install -y clickhouse-client || true
          sudo apt-get install -y firebird-utils || true
