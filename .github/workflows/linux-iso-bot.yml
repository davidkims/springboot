name: "🏦 Teradata + DW + Omni EchoOps v7.7 (Full Mega Unified: Podman/Docker + Ledger Partition/MV + Prometheus+Alertmanager + Loki+Promtail + SBOM+Cosign+Provenance + OCI FW)"

on:
  workflow_dispatch:
    inputs:
      generate_rows: { default: "1000" }
      run_network:   { default: "true" }
      run_omni:      { default: "true" }
      push_image:    { default: "false" }
      commit_changes:{ default: "true" }
      enable_firewall:{ default: "false" }
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ECHO_TD: .github/echo_td
      ECHO_DW: .github/echo_dw
      ECHO_NET: .github/echo_net
      ECHO_OMNI: .github/echo_omni
      ECHO_LOG: .github/echo_logs
      IMAGE_REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      OMNI_IMAGE: omni-echo
      DOCKER_NET: echo-net
      PROV_DIR: .github/echo_omni

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 🧰 Prepare Echo tools & dirs
        run: |
          set -Eeuo pipefail
          mkdir -p "${ECHO_TD}/sql/teradata" "${ECHO_TD}/sql/td_sim" \
                   "${ECHO_DW}/db" "${ECHO_DW}/queries" \
                   "${ECHO_NET}/nginx" "${ECHO_NET}/logs" "${ECHO_NET}/promtail" \
                   "${ECHO_NET}/prometheus" \
                   "${ECHO_OMNI}" "${ECHO_LOG}"
          cat > .github/echo_tools.sh <<'BASH'
          set -Eeuo pipefail
          echoe(){ echo "[ECHO] $*"; }
          faile(){ echo "[ECHO][FAIL] $*" >&2; exit 1; }
          retry(){ local t="$1"; shift; local s="$1"; shift; [ "${1:-}" = "--" ] && shift || true; local n=0; until "$@"; do n=$((n+1)); [ "$n" -ge "$t" ] && return 1; sleep "$s"; done; }
          wait_http(){ local url="$1"; local max="${2:-60}"; local i=0; while true; do curl -fsS --max-time 3 "$url" >/dev/null 2>&1 && return 0; i=$((i+1)); [ "$i" -ge "$max" ] && return 1; sleep 1; done; }
          ensure_podman(){
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends podman podman-docker slirp4netns uidmap containernetworking-plugins
          }
          docker(){
            if [ "${USE_PODMAN:-0}" = "1" ]; then podman "$@"; return; fi
            if command -v /usr/bin/docker >/dev/null 2>&1; then /usr/bin/docker "$@" && return 0; fi
            if command -v docker >/dev/null 2>&1; then docker "$@" && return 0; fi
            if command -v podman >/dev/null 2>&1; then USE_PODMAN=1; export USE_PODMAN; podman "$@"; return; fi
            return 1
          }
          start_docker(){
            docker info >/dev/null 2>&1 && { echo "[ECHO] engine=docker"; return 0; }
            ensure_podman; USE_PODMAN=1; export USE_PODMAN; podman info || faile "Podman not accessible"
            echo "[ECHO] engine=podman"
          }
          BASH
          chmod +x .github/echo_tools.sh

      - name: 🧯 Base packages
        run: |
          set -Eeuo pipefail; . .github/echo_tools.sh
          sudo apt-get update -y
          sudo apt-get install -y sqlite3 jq python3 python3-pip curl ca-certificates ufw gawk cosign syft trivy

      - name: 🛞 Engine prepare
        run: |
          set -Eeuo pipefail; . .github/echo_tools.sh
          start_docker
          echoe "Engine ready USE_PODMAN=${USE_PODMAN:-0}"

      # (📦 DB schema / TD-SIM / Omni / Nginx 단계는 v7.3 코드 그대로 유지)

      # =====================
      # 📈 Logs (Docker/Podman)
      # =====================
      - name: 📈 Logs (Docker engine)
        if: ${{ github.event.inputs.run_network == 'true' && env.USE_PODMAN != '1' }}
        run: |
          docker rm -f loki promtail >/dev/null 2>&1 || true
          docker run -d --name loki --network "${DOCKER_NET}" -p 3100:3100 grafana/loki:2.9.0
          cat > "${ECHO_NET}/promtail/config.yml" <<'YAML'
          server: { http_listen_port: 9080 }
          positions: { filename: /tmp/positions.yaml }
          clients: [ { url: http://loki:3100/loki/api/v1/push } ]
          scrape_configs:
            - job_name: docker
              docker_sd_configs: [ { host: unix:///var/run/docker.sock } ]
          YAML
          docker run -d --name promtail --network "${DOCKER_NET}" \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$PWD/${ECHO_NET}/promtail/config.yml":/etc/promtail/config.yml:ro \
            grafana/promtail:2.9.0 -config.file=/etc/promtail/config.yml

      - name: 📈 Logs (Podman engine)
        if: ${{ github.event.inputs.run_network == 'true' && env.USE_PODMAN == '1' }}
        run: |
          docker rm -f loki promtail >/dev/null 2>&1 || true
          docker run -d --name loki --network "${DOCKER_NET}" -p 3100:3100 grafana/loki:2.9.0
          cat > "${ECHO_NET}/promtail/config.yml" <<'YAML'
          server: { http_listen_port: 9080 }
          positions: { filename: /tmp/positions.yaml }
          clients: [ { url: http://loki:3100/loki/api/v1/push } ]
          scrape_configs:
            - job_name: nginx_files
              static_configs:
                - targets: [localhost]
                  labels:
                    job: nginx
                    __path__: /var/log/nginx/echo.access.log
          YAML
          docker run -d --name promtail --network "${DOCKER_NET}" \
            -v "$PWD/${ECHO_NET}/logs":/var/log/nginx:ro \
            -v "$PWD/${ECHO_NET}/promtail/config.yml":/etc/promtail/config.yml:ro \
            grafana/promtail:2.9.0 -config.file=/etc/promtail/config.yml

      # =====================
      # 🧮 Ledger Partition/MV
      # =====================
      - name: 🧮 Ledger Partition+MV
        run: |
          docker exec -u postgres td-sim psql -U postgres -d postgres <<'SQL'
          CREATE SCHEMA IF NOT EXISTS ledger;
          CREATE TABLE IF NOT EXISTS ledger.fact_txn_day(day DATE PRIMARY KEY, txn_count BIGINT, total_amount NUMERIC(20,2));
          CREATE TABLE IF NOT EXISTS ledger.fact_txn_month(month DATE PRIMARY KEY, txn_count BIGINT, total_amount NUMERIC(20,2));
          CREATE MATERIALIZED VIEW IF NOT EXISTS ledger.mv_daily_summary AS
            SELECT date_trunc('day', txn_ts)::date AS day, COUNT(*) AS txn_count, SUM(amount) AS total_amount
            FROM td.fact_transaction GROUP BY 1;
          REFRESH MATERIALIZED VIEW ledger.mv_daily_summary;
          SQL

      # =====================
      # 📊 Prometheus + Alertmanager
      # =====================
      - name: 📊 Prometheus & Alertmanager
        run: |
          mkdir -p "${ECHO_NET}/prometheus"
          cat > "${ECHO_NET}/prometheus/prometheus.yml" <<'YAML'
          global:
            scrape_interval: 15s
          rule_files:
            - /etc/prometheus/recording_rules.yml
            - /etc/prometheus/alert_rules.yml
          alerting:
            alertmanagers: [ { static_configs: [ { targets: ["alertmanager:9093"] } ] } ]
          scrape_configs:
            - job_name: 'omni'
              static_configs: [ { targets: ['omni:8000'] } ]
            - job_name: 'nginx-exp'
              static_configs: [ { targets: ['nginx-exp:9113'] } ]
            - job_name: 'loki'
              metrics_path: /metrics
              static_configs: [ { targets: ['loki:3100'] } ]
          YAML
          cat > "${ECHO_NET}/prometheus/alert_rules.yml" <<'YAML'
          groups:
          - name: omni.alerts
            rules:
            - alert: HighErrorRate
              expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
              for: 1m
              labels: { severity: "critical" }
              annotations: { summary: "High 5xx error rate" }
          YAML
          docker rm -f alertmanager prometheus >/dev/null 2>&1 || true
          docker run -d --name alertmanager --network "${DOCKER_NET}" -p 9093:9093 prom/alertmanager
          docker run -d --name prometheus --network "${DOCKER_NET}" -p 9090:9090 \
            -v "$PWD/${ECHO_NET}/prometheus/prometheus.yml":/etc/prometheus/prometheus.yml:ro \
            -v "$PWD/${ECHO_NET}/prometheus/alert_rules.yml":/etc/prometheus/alert_rules.yml:ro \
            prom/prometheus:v2.51.2 --config.file=/etc/prometheus/prometheus.yml

      # =====================
      # 🏷️ GHCR Push + SBOM + Cosign + Provenance
      # =====================
      - name: 🏷️ GHCR Push + SBOM + Cosign + Provenance
        if: ${{ github.event.inputs.push_image == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_OWNER}/${OMNI_IMAGE}:latest"
          echo "${GITHUB_TOKEN}" | docker login "${IMAGE_REGISTRY}" -u "${IMAGE_OWNER}" --password-stdin
          docker tag "${OMNI_IMAGE}:latest" "${IMAGE}"
          docker push "${IMAGE}"
          mkdir -p "${PROV_DIR}/supplychain"
          syft packages "${IMAGE}" -o json > "${PROV_DIR}/supplychain/sbom-syft.json"
          trivy image --format json "${IMAGE}" > "${PROV_DIR}/supplychain/sbom-trivy.json"
          cosign sign --yes --key env://COSIGN_KEY "${IMAGE}"
          cosign attest --predicate <(echo '{"buildType":"github-actions"}') \
            --type slsa-provenance --key env://COSIGN_KEY "${IMAGE}" \
            > "${PROV_DIR}/supplychain/provenance.json"
