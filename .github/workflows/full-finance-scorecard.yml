name: 🚀 Full Finance & Scorecard Setup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  full-setup:
    runs-on: ubuntu-latest

    steps:
      - name: 📅 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Docker & CLI 설치
        run: |
          echo "[docker] Docker 설치 중..."
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo systemctl start docker
          docker --version
          echo "[docker] Docker 설치 완료"

          echo "[cli] CLI 도구 설치 중..."
          sudo apt-get update
          sudo apt-get install -y jq curl unzip bc
          echo "[cli] jq, curl, unzip, bc 설치 완료"

      - name: 🗂️ 필수 디렉토리 생성
        run: |
          echo "[mkdir] 디렉토리 생성 중..."
          mkdir -p .github/finance/ledgers_credit
          mkdir -p .github/finance/ledgers_check
          mkdir -p .github/finance/files
          mkdir -p .github/scorecard/ledgers
          mkdir -p .github/scorecard/files
          echo "[mkdir] 디렉토리 생성 완료"

      - name: 📄 신용/체크카드 거래 원장 생성
        run: |
          echo "[ledger] 원장 생성 시작..."
          for i in $(seq 1 10); do
            CREDIT_FILE=".github/finance/ledgers_credit/ledger_credit_$i.csv"
            CHECK_FILE=".github/finance/ledgers_check/ledger_check_$i.csv"
            echo "name,date,amount,type,card_number" > $CREDIT_FILE
            echo "name,date,amount,type,card_number" > $CHECK_FILE

            for j in $(seq 1 50); do
              NAME="Customer${j}"
              DATE=$(date -d "$j days ago" +%F)
              AMOUNT=$(echo "scale=2; $((RANDOM % 9000 + 1000))" | bc)
              if [ $((RANDOM % 2)) -eq 0 ]; then
                TYPE="신용"
                CARD_NUMBER="4111$(printf '%012d' $((RANDOM % 1000000000000)))"
                echo "$NAME,$DATE,$AMOUNT,$TYPE,$CARD_NUMBER" >> $CREDIT_FILE
              else
                TYPE="체크"
                CARD_NUMBER="CHK$((10000000 + RANDOM % 90000000))"
                echo "$NAME,$DATE,$AMOUNT,$TYPE,$CARD_NUMBER" >> $CHECK_FILE
              fi
            done
            echo "[ledger] ledger_credit_$i.csv / ledger_check_$i.csv 생성 완료"
          done

      - name: 💳 거래 시뮬레이션 (재시도 포함)
        run: |
          echo "[simulate] 거래 시뮬레이션 시작..."
          for file in .github/finance/ledgers_credit/*.csv .github/finance/ledgers_check/*.csv; do
            echo "[simulate] 파일: $file"
            tail -n +2 "$file" | while IFS=',' read -r name date amount type card_number; do
              attempt=1
              max_attempts=3
              success=false
              while [ $attempt -le $max_attempts ]; do
                echo "🟢 거래 시도 $attempt: 고객=$name | ₩$amount | $type | ${card_number:0:4}****"
                FAIL=$((RANDOM % 100))
                if [[ $FAIL -lt 5 ]]; then
                  echo "❌ 실패 (시도 $attempt)"
                  attempt=$((attempt+1))
                  sleep 0.2
                else
                  echo "✅ 승인 완료 (시도 $attempt)"
                  success=true
                  break
                fi
              done
              if [[ $success == false ]]; then
                echo "💥 최종 실패: $name ₩$amount"
              fi
              sleep 0.1
            done
          done
          echo "[simulate] 모든 거래 완료"

      - name: 📄 금융 보고서 생성
        run: |
          echo "[report] 금융 보고서 생성 시작..."
          for i in $(seq 1 10); do
            echo "거래 요약 리포트 파일 $i" > .github/finance/files/report_$i.txt
            echo "[report] report_$i.txt 생성 완료"
          done

      - name: ✅ Scorecard CLI 설치
        run: |
          echo "[scorecard] CLI 설치 시작..."
          curl -sLO https://github.com/ossf/scorecard/releases/latest/download/scorecard-linux-amd64
          chmod +x scorecard-linux-amd64
          sudo mv scorecard-linux-amd64 /usr/local/bin/scorecard
          scorecard --version || echo "버전 확인 실패 시 무시"
          echo "[scorecard] 설치 완료"

      - name: 📄 Scorecard 원장 생성
        run: |
          echo "[scorecard-ledger] Scorecard 원장 생성 시작..."
          for i in $(seq 1 10); do
            FILE=".github/scorecard/ledgers/scorecard_$i.csv"
            echo "item,score,comment" > $FILE
            for j in $(seq 1 20); do
              ITEM="SecurityCheck${j}"
              SCORE=$((RANDOM % 100))
              COMMENT=$(if [ $((RANDOM % 2)) -eq 0 ]; then echo "양호"; else echo "개선필요"; fi)
              echo "$ITEM,$SCORE,$COMMENT" >> $FILE
            done
            echo "[scorecard-ledger] scorecard_$i.csv 생성 완료"
          done

      - name: 📊 Scorecard 시뮬레이션 (재시도 포함)
        run: |
          echo "[simulate-scorecard] 보안 점검 시뮬레이션 시작..."
          for file in .github/scorecard/ledgers/*.csv; do
            echo "[simulate-scorecard] 파일: $file"
            tail -n +2 "$file" | while IFS=',' read -r item score comment; do
              attempt=1
              max_attempts=3
              success=false
              while [ $attempt -le $max_attempts ]; do
                echo "🔍 시도 $attempt: $item | 점수: $score | $comment"
                FAIL=$((RANDOM % 100))
                if [[ $FAIL -lt 5 ]]; then
                  echo "❌ [$item] 실패 (시도 $attempt)"
                  attempt=$((attempt+1))
                  sleep 0.2
                else
                  if [ "$score" -ge 80 ]; then
                    echo "✅ [$item] 항목 적합 (Score $score)"
                  else
                    echo "⚠️ [$item] 항목 개선 필요 (Score $score)"
                  fi
                  success=true
                  break
                fi
              done
              if [[ $success == false ]]; then
                echo "💥 [$item] 최종 실패"
              fi
              sleep 0.1
            done
          done
          echo "[simulate-scorecard] 모든 보안 점검 완료"

      - name: 📄 Scorecard 리포트 생성
        run: |
          echo "[scorecard-file] 리포트 생성 시작..."
          for i in $(seq 1 10); do
            echo "이 리포트는 Scorecard 보안 결과 요약입니다. 파일 번호: $i" > .github/scorecard/files/oss_report_$i.txt
            echo "[scorecard-file] oss_report_$i.txt 생성 완료"
          done
