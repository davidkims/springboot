name: 🐬 MySQL+Oracle FullOps (동시 설치/관리, 대량 패스워드, 쿼리/권한/복제/echo/아티팩트 All-in-One)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fullops-job:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass123
          MYSQL_DATABASE: sample_db
        ports:
          - 3306:3306

    env:
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass123
      MYSQL_DB: sample_db
      ORACLE_PWD: oraclepwd123
      VIRTUAL_USER_COUNT: 7
      MASS_PW_TABLE_COUNT: 3

    steps:
      # 1. 기본 체크아웃 및 패키지/echo 디렉토리 준비
      - name: 📦 [echo] Checkout Repository
        uses: actions/checkout@v4

      - name: 🔄 [echo] 필수 패키지 업그레이드 및 echo
        run: |
          echo "echo '[🔄] 패키지 업그레이드 및 echo 디렉토리 준비...'"
          mkdir -p .github/logs .github/echo .github/echo/mysql .github/echo/oracle .github/echo/ddl .github/echo/priv .github/echo/query .github/echo/client .github/echo/data .github/echo/artifact
          sudo apt-get update
          sudo apt-get install -y unzip curl tree zip pwgen libaio1 gnupg2 tzdata > .github/logs/pkg_upgrade.log 2>&1

      # 2. Oracle XE Docker 서버 설치 및 sqlplus client 설치 (동시에)
      - name: 🍊 [echo] Oracle XE 서버 Docker 컨테이너 실행 + sqlplus 설치
        run: |
          echo "echo '[🍊] Oracle XE Docker 컨테이너 실행 ...]'"
          docker run -d --name oracle-xe \
            -e ORACLE_PWD=${ORACLE_PWD} \
            -e ORACLE_ALLOW_REMOTE=true \
            -p 1521:1521 \
            gvenzl/oracle-xe:21-slim
          echo "echo '[🍊] Oracle XE 컨테이너 기동 완료]'"

          # sqlplus/InstantClient 설치
          curl -sSL -o instantclient-basiclite.zip https://download.oracle.com/otn_software/linux/instantclient/2113000/instantclient-basiclite-linux.x64-21.13.0.0.0dbru.zip
          curl -sSL -o instantclient-sqlplus.zip https://download.oracle.com/otn_software/linux/instantclient/2113000/instantclient-sqlplus-linux.x64-21.13.0.0.0dbru.zip
          unzip -q instantclient-basiclite.zip -d $HOME
          unzip -q instantclient-sqlplus.zip -d $HOME
          echo "export PATH=$HOME/instantclient_21_13:\$PATH" > .github/echo/client/path_export.sh
          $HOME/instantclient_21_13/sqlplus -v | tee .github/echo/client/sqlplus_version.txt

      # 3. Oracle DB 기동 대기 (최대 120초)
      - name: 🍊 [echo] Oracle DB 기동/헬스 체크 & 로그 echo
        run: |
          echo "echo '[🍊] Oracle XE 컨테이너 health check ...]'"
          for i in {1..60}; do
            if docker exec oracle-xe lsof -i:1521 | grep LISTEN; then
              echo "Oracle listener is up (attempt $i)" | tee .github/echo/oracle/oracle_healthcheck.log
              break
            fi
            sleep 2
          done
          docker logs oracle-xe > .github/echo/oracle/oracle_xe_container.log

      # 4. Oracle DB 계정/권한 에코 SQL 생성 및 실제 실행
      - name: 🍊 [echo] Oracle 계정/권한/DDL/샘플 쿼리 에코/실행
        run: |
          # 환경 변수 및 sqlplus alias
          export PATH=$HOME/instantclient_21_13:$PATH
          ORA_SVC="XEPDB1"
          ORA_HOST="127.0.0.1"
          ORA_PORT="1521"
          SYS_PWD="${ORACLE_PWD}"
          APP_USER="APPUSER1"
          APP_PWD="AppUser#2024!"

          echo "CREATE USER $APP_USER IDENTIFIED BY \"$APP_PWD\";" > .github/echo/oracle/create_user.sql
          echo "GRANT CONNECT, RESOURCE TO $APP_USER;" >> .github/echo/oracle/create_user.sql
          echo "ALTER USER $APP_USER QUOTA UNLIMITED ON USERS;" >> .github/echo/oracle/create_user.sql
          echo "GRANT DBA TO $APP_USER;" >> .github/echo/oracle/create_user.sql
          echo "DROP USER $APP_USER CASCADE;" > .github/echo/oracle/drop_user.sql
          echo "REVOKE DBA FROM $APP_USER;" > .github/echo/oracle/revoke_dba.sql
          echo "ALTER USER $APP_USER ACCOUNT LOCK;" > .github/echo/oracle/lock_user.sql
          echo "ALTER USER $APP_USER ACCOUNT UNLOCK;" > .github/echo/oracle/unlock_user.sql

          # 실제 실행 (계정/권한)
          echo "echo '[🍊] Oracle 계정/권한 SQL 실행 ...'"
          $HOME/instantclient_21_13/sqlplus sys/$SYS_PWD@//$ORA_HOST:$ORA_PORT/$ORA_SVC as sysdba @.github/echo/oracle/create_user.sql > .github/echo/oracle/appuser_create.log

          # DDL/샘플 데이터 쿼리 에코 및 실행
          for i in $(seq 1 2); do
            TBL="USERS_EXAMPLE_$i"
            {
              echo "CREATE TABLE $TBL (ID NUMBER PRIMARY KEY, USERNAME VARCHAR2(30), PASSWORD VARCHAR2(40), CREATED_AT DATE DEFAULT SYSDATE);"
              echo "INSERT INTO $TBL (ID, USERNAME, PASSWORD) VALUES (1, 'oracle_user$i', 'oracle_pw$i');"
              echo "SELECT * FROM $TBL;"
              echo "DROP TABLE $TBL;"
            } > .github/echo/oracle/ddl_$TBL.sql
            # 계정으로 쿼리 실행
            echo "echo '[🍊] DDL/INSERT/SELECT/DROP SQL 실행 ($TBL)'"
            $HOME/instantclient_21_13/sqlplus $APP_USER/$APP_PWD@//$ORA_HOST:$ORA_PORT/$ORA_SVC @.github/echo/oracle/ddl_$TBL.sql > .github/echo/oracle/ddl_exec_$TBL.log
          done

      # 5. MySQL 대량 패스워드/쿼리/DDL echo 및 실행 (간략)
      - name: 🐬 [echo] MySQL 대량 패스워드 Table/쿼리 echo/실행
        run: |
          echo "echo '[🐬] MySQL 대량 Table/쿼리/DDL echo 자동생성 및 실행...'"
          N=${MASS_PW_TABLE_COUNT:-3}
          USERS=(alice bob charlie dave erin frank grace heidi ivan judy)
          for i in $(seq 1 $N); do
            TBL="user_passwords_$i"
            DDL="CREATE TABLE IF NOT EXISTS $TBL (user_id INT PRIMARY KEY AUTO_INCREMENT, username VARCHAR(30), password VARCHAR(40), reg_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"
            echo "$DDL" > .github/echo/mysql/ddl_${TBL}.sql
            echo "USE $MYSQL_DB;" > .github/echo/mysql/ins_${TBL}.sql
            for j in $(seq 1 20); do
              U="${USERS[$(( (i+j-1) % ${#USERS[@]} ))]}"
              PW1=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9!@#$%^&*_=+' | head -c16)
              echo "INSERT INTO $TBL (username, password) VALUES ('$U', '$PW1');" >> .github/echo/mysql/ins_${TBL}.sql
            done
            MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER $MYSQL_DB < .github/echo/mysql/ddl_${TBL}.sql
            MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER $MYSQL_DB < .github/echo/mysql/ins_${TBL}.sql
          done

      # 6. 전체 구조 echo, 로그, 아티팩트 업로드
      - name: 🗂️ [echo] Show All Structure (tree/ls)
        run: |
          echo "echo '[🗂️] 전체 디렉토리 tree/ls ...'"
          tree .github/echo || true
          ls -lhR .github/echo/

      - name: 🚀 [echo] Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fullops-artifacts-${{ github.run_id }}
          path: |
            .github/logs/*
            .github/echo/**/*
