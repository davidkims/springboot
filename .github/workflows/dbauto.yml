name: 🗂️ 모든 Workflow YAML → DB/CLI/docker 충돌방지 + echo 자동확장

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  workflow-dbify:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 디렉토리 및 로그파일 생성 (에코)
        run: |
          echo "echo 'mkdir -p .github/sql'" ; mkdir -p .github/sql
          echo "echo 'mkdir -p .github/error_logs'" ; mkdir -p .github/error_logs
          echo "echo 'mkdir -p .github/cli_test'" ; mkdir -p .github/cli_test
          echo "echo 'touch .github/error_logs/disabled_workflows.txt'" ; touch .github/error_logs/disabled_workflows.txt
          echo "echo 'touch .github/error_logs/init_check.log'" ; touch .github/error_logs/init_check.log

      - name: 📄 requirements.txt 생성(에코)
        run: |
          echo "echo 'pyyaml' > requirements.txt"
          echo 'pyyaml' > requirements.txt

      - name: 🐍 workflow2db.py 전체 echo 생성 (init_db 포함, docker/DB/CLI 자동확장)
        run: |
          echo "import os" > workflow2db.py
          echo "import sys" >> workflow2db.py
          echo "import sqlite3" >> workflow2db.py
          echo "import yaml" >> workflow2db.py
          echo "import zlib" >> workflow2db.py
          echo "from datetime import datetime" >> workflow2db.py
          echo "import binascii" >> workflow2db.py
          echo "" >> workflow2db.py
          echo "WORKFLOWS_DIR = '.github/workflows'" >> workflow2db.py
          echo "DB_PATH = '.github/workflows.db'" >> workflow2db.py
          echo "ERROR_LOG_DIR = '.github/error_logs'" >> workflow2db.py
          echo "DISABLED_FILE = os.path.join(ERROR_LOG_DIR, 'disabled_workflows.txt')" >> workflow2db.py
          echo "CLI_TEST_DIR = '.github/cli_test'" >> workflow2db.py
          echo "" >> workflow2db.py

          # echo로 init_db 함수 생성
          echo "def init_db():" >> workflow2db.py
          echo "    if not os.path.exists(ERROR_LOG_DIR):" >> workflow2db.py
          echo "        print('[init_db] mkdir -p ' + ERROR_LOG_DIR)" >> workflow2db.py
          echo "        os.makedirs(ERROR_LOG_DIR, exist_ok=True)" >> workflow2db.py
          echo "    if not os.path.exists(CLI_TEST_DIR):" >> workflow2db.py
          echo "        print('[init_db] mkdir -p ' + CLI_TEST_DIR)" >> workflow2db.py
          echo "        os.makedirs(CLI_TEST_DIR, exist_ok=True)" >> workflow2db.py
          echo "    if not os.path.exists(DB_PATH):" >> workflow2db.py
          echo "        print('[init_db] 최초 DB 생성: ' + DB_PATH)" >> workflow2db.py
          echo "        conn = sqlite3.connect(DB_PATH)" >> workflow2db.py
          echo "        c = conn.cursor()" >> workflow2db.py
          echo "        c.execute('''CREATE TABLE IF NOT EXISTS workflows (id INTEGER PRIMARY KEY AUTOINCREMENT, filename TEXT, language TEXT, python_version TEXT, java_version TEXT, maven_version TEXT, cli_tools TEXT, raw_yaml TEXT)''')" >> workflow2db.py
          echo "        conn.commit()" >> workflow2db.py
          echo "        conn.close()" >> workflow2db.py
          echo "    if not os.path.exists(DISABLED_FILE):" >> workflow2db.py
          echo "        print('[init_db] touch ' + DISABLED_FILE)" >> workflow2db.py
          echo "        with open(DISABLED_FILE, 'w', encoding='utf-8') as f: f.write('')" >> workflow2db.py
          echo "" >> workflow2db.py

          echo "def log_error(workflow_name, message):" >> workflow2db.py
          echo "    if not os.path.exists(ERROR_LOG_DIR): os.makedirs(ERROR_LOG_DIR, exist_ok=True)" >> workflow2db.py
          echo "    err_file = os.path.join(ERROR_LOG_DIR, workflow_name+'.log')" >> workflow2db.py
          echo "    with open(err_file, 'a', encoding='utf-8') as ef: ef.write('[{}] {}\\n'.format(datetime.now().isoformat(), message))" >> workflow2db.py
          echo "" >> workflow2db.py
          echo "def log_disable(workflow_name, reason):" >> workflow2db.py
          echo "    with open(DISABLED_FILE, 'a', encoding='utf-8') as f: f.write('{}\\t{}\\t{}\\n'.format(workflow_name, reason, datetime.now().isoformat()))" >> workflow2db.py
          echo "" >> workflow2db.py
          echo "def detect_tools_and_echo_install(workflows):" >> workflow2db.py
          echo "    cli_set = set()" >> workflow2db.py
          echo "    db_set = set()" >> workflow2db.py
          echo "    db_keywords = {'sqlite': 'sqlite3', 'mysql': 'mysql', 'postgres': 'psql', 'mssql': 'sqlcmd'}" >> workflow2db.py
          echo "    cli_keywords = {'python': 'python3', 'java': 'java', 'maven': 'mvn', 'node': 'node', 'go': 'go', 'docker': 'docker'}" >> workflow2db.py
          echo "    for wf in workflows:" >> workflow2db.py
          echo "        text = (wf.get('raw_yaml','') or '') + str(wf.get('jobs',''))" >> workflow2db.py
          echo "        for k, cli in cli_keywords.items():" >> workflow2db.py
          echo "            if k in text.lower():" >> workflow2db.py
          echo "                cli_set.add(cli)" >> workflow2db.py
          echo "        for k, cli in db_keywords.items():" >> workflow2db.py
          echo "            if k in text.lower():" >> workflow2db.py
          echo "                db_set.add(cli)" >> workflow2db.py
          echo "    with open(os.path.join(CLI_TEST_DIR, 'auto_install_cli.sh'),'w') as f:" >> workflow2db.py
          echo "        f.write('#!/usr/bin/env bash\\nset -e\\n')" >> workflow2db.py
          echo "        for cli in sorted(cli_set):" >> workflow2db.py
          echo "            f.write(\"echo '[AUTO] \" + cli + \" 설치 및 버전확인'\\n\")" >> workflow2db.py
          echo "            if cli=='python3': f.write('sudo apt-get install -y python3 python3-pip\\npython3 --version\\npip3 --version\\n')" >> workflow2db.py
          echo "            elif cli=='java': f.write('sudo apt-get install -y openjdk-17-jdk openjdk-11-jdk\\njava -version\\njavac -version\\n')" >> workflow2db.py
          echo "            elif cli=='mvn': f.write('sudo apt-get install -y maven\\nmvn -version\\n')" >> workflow2db.py
          echo "            elif cli=='node': f.write('sudo apt-get install -y nodejs npm\\nnode --version\\nnpm --version\\n')" >> workflow2db.py
          echo "            elif cli=='go': f.write('sudo apt-get install -y golang-go\\ngo version\\n')" >> workflow2db.py
          echo "            elif cli=='docker':" >> workflow2db.py
          echo "                f.write('sudo apt-get remove -y docker docker-engine docker.io containerd runc || true\\n')" >> workflow2db.py
          echo "                f.write('sudo apt-get update -y\\n')" >> workflow2db.py
          echo "                f.write('sudo apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release\\n')" >> workflow2db.py
          echo "                f.write('curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg\\n')" >> workflow2db.py
          echo "                f.write('echo \"deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu \$(lsb_release -cs) stable\" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null\\n')" >> workflow2db.py
          echo "                f.write('sudo apt-get update -y\\n')" >> workflow2db.py
          echo "                f.write('sudo apt-get install -y docker-ce docker-ce-cli containerd.io\\n')" >> workflow2db.py
          echo "                f.write('docker --version || echo \"[ERROR] docker 설치 실패 (skip)\"\\n')" >> workflow2db.py
          echo "        for cli in sorted(db_set):" >> workflow2db.py
          echo "            f.write(\"echo '[AUTO] \" + cli + \" DB 클라이언트 설치/테스트'\\n\")" >> workflow2db.py
          echo "            if cli=='sqlite3': f.write('sudo apt-get install -y sqlite3\\nsqlite3 --version\\n')" >> workflow2db.py
          echo "            elif cli=='mysql': f.write('sudo apt-get install -y mysql-client\\nmysql --version\\n')" >> workflow2db.py
          echo "            elif cli=='psql': f.write('sudo apt-get install -y postgresql-client\\npsql --version\\n')" >> workflow2db.py
          echo "            elif cli=='sqlcmd': f.write('sudo apt-get install -y mssql-tools\\nsqlcmd -?\\n')" >> workflow2db.py
          echo "    os.chmod(os.path.join(CLI_TEST_DIR, 'auto_install_cli.sh'), 0o755)" >> workflow2db.py
          echo "    return cli_set, db_set" >> workflow2db.py
          echo "" >> workflow2db.py
          echo "if __name__ == \"__main__\":" >> workflow2db.py
          echo "    init_db()" >> workflow2db.py
          echo "    # ... 이하 기존 ..." >> workflow2db.py
          echo "    # workflows, disabled = parse_workflows_with_retry(max_retry=1)" >> workflow2db.py
          echo "    # save_to_db(workflows)" >> workflow2db.py
          echo "    # cli_set, db_set = detect_tools_and_echo_install(workflows)" >> workflow2db.py
          echo "    # print(\"[OK] {}개 워크플로우 DB+CLI+DB정보 저장 완료!\".format(len(workflows)))" >> workflow2db.py
          echo "    # print(\"[OK] 자동 설치 대상 CLI:\", cli_set, \"/ DB:\", db_set)" >> workflow2db.py
          echo "    # print(\"[OK] .github/cli_test/auto_install_cli.sh 자동생성\")" >> workflow2db.py

      - name: 🧪 pip 설치 및 패키지 설치
        run: |
          echo "echo 'sudo apt-get update -y'" ; sudo apt-get update -y
          echo "echo 'sudo apt-get install -y python3-pip'" ; sudo apt-get install -y python3-pip
          echo "echo 'pip install --upgrade pip'" ; pip install --upgrade pip
          echo "echo 'pip install -r requirements.txt'" ; pip install -r requirements.txt

      - name: 🚀 workflow2db.py 실행(DB/CLI 감지/확장)
        run: |
          echo "echo '[실행] workflow2db.py (DB/CLI 자동 확장 포함)'"
          echo '[실행] workflow2db.py (DB/CLI 자동 확장 포함)'
          python3 workflow2db.py

      - name: 🛠️ 감지된 DB/CLI 자동 설치/테스트 실행 (auto_install_cli.sh)
        run: |
          echo "echo '[실행] .github/cli_test/auto_install_cli.sh (감지된 DB/CLI 환경별 echo 자동 설치/확장)'"
          echo '[실행] .github/cli_test/auto_install_cli.sh (감지된 DB/CLI 환경별 echo 자동 설치/확장)'
          chmod +x .github/cli_test/auto_install_cli.sh
          .github/cli_test/auto_install_cli.sh

      - name: 📂 결과 확인 (.github/workflows.db, error_logs, auto_install_cli.sh)
        run: |
          echo "echo '[결과] .github/workflows.db, error_logs, auto_install_cli.sh'"
          echo '[결과] .github/workflows.db, error_logs, auto_install_cli.sh'
          ls -lh .github/workflows.db
          echo '.tables' | sqlite3 .github/workflows.db
          echo 'PRAGMA table_info(workflows);' | sqlite3 .github/workflows.db
          echo 'SELECT filename, language, python_version, java_version, maven_version, cli_tools FROM workflows;' | sqlite3 .github/workflows.db
          echo '[로그] .github/error_logs/*, disabled_workflows.txt'
          [ -d .github/error_logs ] || mkdir -p .github/error_logs
          [ -f .github/error_logs/disabled_workflows.txt ] || touch .github/error_logs/disabled_workflows.txt
          ls -l .github/error_logs || true
          head -20 .github/error_logs/* || true
          cat .github/error_logs/disabled_workflows.txt || true
          echo '[CLI/DB 자동 설치 결과]'
          cat .github/cli_test/auto_install_cli.sh || true
