name: 🚦 API Speed Check

on:
  schedule:
    - cron: '*/5 * * * *'  # 매 5분마다 실행
  workflow_dispatch:

jobs:
  check-api-speed:
    runs-on: ubuntu-latest

    env:
      API_LIST: |
        https://api.github.com
        https://jsonplaceholder.typicode.com/posts
        https://httpbin.org/get
      MAX_LATENCY_MS: 1000  # 최대 허용 응답 시간 (ms)

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 📂 Create output directory
        run: |
          mkdir -p api_check site/api_check

      - name: 🧪 Run API latency checks
        run: |
          echo "[⚙️] Checking API latency..."
          echo "[" > site/api_check/results.json

          index=0
          for url in $API_LIST; do
            start=$(date +%s%3N)
            status=$(curl -o /dev/null -s -w "%{http_code}" "$url")
            end=$(date +%s%3N)
            latency=$((end - start))

            echo "[🔎] $url"
            echo "    ↳ Status: $status, Latency: ${latency}ms"

            if [ "$latency" -gt "$MAX_LATENCY_MS" ]; then
              echo "⚠️ $url 응답 지연: ${latency}ms > ${MAX_LATENCY_MS}ms"
            fi

            echo "  {" >> site/api_check/results.json
            echo "    \"url\": \"$url\"," >> site/api_check/results.json
            echo "    \"status\": \"$status\"," >> site/api_check/results.json
            echo "    \"latency_ms\": $latency" >> site/api_check/results.json

            index=$((index+1))
            if [ $index -lt $(echo "$API_LIST" | wc -l) ]; then
              echo "  }," >> site/api_check/results.json
            else
              echo "  }" >> site/api_check/results.json
            fi
          done

          echo "]" >> site/api_check/results.json

      - name: 💾 Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-speed-result
          path: site/api_check/results.json

      - name: 🔍 Display result summary
        run: |
          echo "[📊] API 응답 속도 측정 완료. 결과:"
          cat site/api_check/results.json
