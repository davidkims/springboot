name: 🟦 AWS CLI Install & Upgrade

on:
  workflow_dispatch:

jobs:
  awscli-install-upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟦 [echo] AWS CLI 설치 및 업그레이드 (최신 v2, 공식)
        run: |
          echo "echo '[🟦] AWS CLI 설치 및 업그레이드 시작...'"
          echo '[🟦] AWS CLI 설치 및 업그레이드 시작...'

          echo "echo '[🟦] 필요 패키지 설치...'"
          echo '[🟦] 필요 패키지 설치...'
          sudo apt-get update -y
          sudo apt-get install -y unzip curl

          echo "echo '[🟦] 기존 AWS CLI 제거 (존재할 경우)...'"
          echo '[🟦] 기존 AWS CLI 제거 (존재할 경우)...'
          sudo rm -rf /usr/local/aws /usr/local/bin/aws || true

          echo "echo '[🟦] AWS CLI v2 다운로드...'"
          echo '[🟦] AWS CLI v2 다운로드...'
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"

          echo "echo '[🟦] 압축 해제...'"
          echo '[🟦] 압축 해제...'
          unzip -q -o awscliv2.zip

          echo "echo '[🟦] AWS CLI 설치/업그레이드...'"
          echo '[🟦] AWS CLI 설치/업그레이드...'
          sudo ./aws/install --update

          echo "echo '[🟦] aws --version 결과:'"
          echo '[🟦] aws --version 결과:'
          aws --version

          echo "echo '[🟦] 설치된 경로 및 심볼릭 링크 확인...'"
          echo '[🟦] 설치된 경로 및 심볼릭 링크 확인...'
          which aws || echo 'aws 명령어가 등록되지 않았습니다.'
          ls -l /usr/local/bin/aws || true

          echo "echo '[🟦] AWS CLI 업그레이드/설치 완료.'"
          echo '[🟦] AWS CLI 업그레이드/설치 완료.'
