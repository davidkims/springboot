name: "🛡️ Full Echo & Scorecard Auto Installer"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: '11 5 * * 5'

jobs:
  secure-auto:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Install CLI Tools (gh, jq, yq, Scorecard, CodeQL)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl unzip jq yq gh tree

          # 🟢 Scorecard 정확한 경로 설정
          export SC_VERSION="4.10.3"
          curl -sLO "https://github.com/ossf/scorecard/releases/download/v${SC_VERSION}/scorecard_${SC_VERSION}_linux_amd64.tar.gz"
          tar -xzf "scorecard_${SC_VERSION}_linux_amd64.tar.gz"

          # 자동 디렉토리 탐지 및 이동
          SC_DIR=$(tar -tf "scorecard_${SC_VERSION}_linux_amd64.tar.gz" | head -1 | cut -d/ -f1)
          chmod +x "$SC_DIR/scorecard"
          sudo mv "$SC_DIR/scorecard" /usr/local/bin/scorecard

          # 🟢 CodeQL 설치
          CODEQL_VERSION="2.17.5"
          curl -L -o codeql.zip "https://github.com/github/codeql-cli-binaries/releases/download/v${CODEQL_VERSION}/codeql-linux64.zip"
          unzip codeql.zip
          sudo mv codeql/codeql /usr/local/bin/codeql

      - name: 📁 Create Echo Directories
        run: |
          for prefix in codeql security scorecard dependabot template placeholder permission; do
            for sub in init log result config policy converted fix custom test scripts output env; do
              mkdir -p .github/echo_${prefix}/${sub}
            done
          done

      - name: 📄 Generate Echo Files (10+ types)
        run: |
          for ext in env cfg json sql md sh py js rs txt; do
            for i in $(seq 1 10); do
              echo "echo '[${ext^^}] Echo Sample $i'" > .github/echo_template/sample_$i.$ext
              for prefix in codeql scorecard dependabot placeholder; do
                echo "echo '[${prefix^^}] Script $i for $ext'" > .github/echo_${prefix}/scripts/echo_${prefix}_${ext}_$i.sh
              done
            done
          done

      - name: 🔐 Run OSSF Scorecard & Extract Risks
        run: |
          mkdir -p .github/echo_scorecard/result
          scorecard --repo=https://github.com/${{ github.repository }} --format=json > .github/echo_scorecard/result/scorecard.json
          jq '.checks[] | select(.score < 5)' .github/echo_scorecard/result/scorecard.json > .github/echo_scorecard/result/scorecard_low.json

      - name: 📄 SECURITY_FIX.md 생성
        run: |
          echo "# 🔐 Scorecard 위험 항목 (자동 생성)" > SECURITY_FIX.md
          jq -r '. | "- **\(.name)**: \(.reason) (_score: \(.score))"' .github/echo_scorecard/result/scorecard_low.json >> SECURITY_FIX.md

      - name: 🔁 PLACEHOLDER 자동 치환 (.env/.cfg/.json)
        run: |
          echo "API_KEY=PLACEHOLDER" > .github/echo_template/sample.env
          echo "TOKEN=PLACEHOLDER" > .github/echo_template/sample.cfg
          echo '{ "secret": "PLACEHOLDER" }' > .github/echo_template/sample.json

          sed 's/PLACEHOLDER/auto_user_env/g' .github/echo_template/sample.env > .github/echo_placeholder/converted/sample.env
          sed 's/PLACEHOLDER/secure_token/g' .github/echo_template/sample.cfg > .github/echo_placeholder/converted/sample.cfg
          jq 'walk(if type == "string" and test("PLACEHOLDER") then sub("PLACEHOLDER"; "actual_secret") else . end)' .github/echo_template/sample.json > .github/echo_placeholder/converted/sample.json

      - name: 🔀 자동 커밋 및 PR
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          BRANCH="auto/scorecard-echo-$(date +%s)"
          git checkout -b $BRANCH

          git add .github/echo_* SECURITY_FIX.md
          git commit -m "🔧 Echo, Scorecard 위험항목, Placeholder 치환 자동화"
          git push origin $BRANCH

          gh pr create --title "🔒 Echo + Scorecard + PLACEHOLDER Auto PR" \
            --body "자동으로 생성된 echo 파일, 보안 취약점 개선, placeholder 값 치환 내용이 포함됩니다." \
            --base main --head $BRANCH
