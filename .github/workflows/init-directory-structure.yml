name: 📃 Backup GitHub Workflows with Echo and Commit

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  backup-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Prepare backup directory
        run: |
          echo "[+] Creating .github/backup/workflows directory..."
          mkdir -p .github/backup/workflows

      - name: 📝 Copy workflow files to backup dir
        run: |
          echo "[+] Copying workflow files..."
          cp .github/workflows/*.yml .github/backup/workflows/ 2>/dev/null || true
          cp .github/workflows/*.yaml .github/backup/workflows/ 2>/dev/null || true

      - name: 🔍 Echo contents of each backed up workflow
        run: |
          echo "[+] Listing and echoing backup files..."
          for f in .github/backup/workflows/*.yml .github/backup/workflows/*.yaml; do
            [ -f "$f" ] || continue
            echo "\n[📄] File: $f"
            echo "[🔍] Showing first 10 lines:"
            head -n 10 "$f"
          done

      - name: 📅 Commit backup files (if inside Git repo)
        run: |
          if [ -d .git ]; then
            echo "[+] Git detected. Committing changes."
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add .github/backup/workflows
            git commit -m "📃 Backup workflow files with echo outputs" || echo "[!] No changes to commit"
          else
            echo "[!] Not a git repo. Skipping commit."
          fi
