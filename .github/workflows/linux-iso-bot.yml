name: "🧰 SAP Logon Enterprise Deploy (Echo+Fix v2)"

on:
  workflow_dispatch:
    inputs:
      sap_gui_installer_url:
        description: "SAP GUI 설치파일 URL (선택)"
        required: false
        default: ""
      sap_gui_sha256:
        description: "설치파일 SHA256(선택)"
        required: false
        default: ""
      landscape_name:
        description: "Landscape 표시명"
        required: false
        default: "Company Landscape"
      deploy_scope:
        description: "배포 범위 (PerMachine|PerUser)"
        required: false
        default: "PerMachine"
      create_shortcuts:
        description: "바탕화면/시작메뉴 바로가기 생성 (true/false)"
        required: false
        default: "true"
      dry_run:
        description: "드라이런 (true/false)"
        required: false
        default: "false"
      create_release:
        description: "GitHub Release 생성 (true/false)"
        required: false
        default: "false"
      commit_branch:
        description: "생성물 커밋 브랜치"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  sap-logon-deploy:
    runs-on: windows-latest
    env:
      ECHO_ROOT: .github/echo_sap
      OUT_DIR: .github/echo_sap/out
      SCRIPTS_DIR: .github/echo_sap/scripts
      TPL_DIR: .github/echo_sap/templates
      DOC_DIR: .github/echo_sap/docs
      LOG_DIR: .github/echo_sap/logs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare echo folders (robust)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          trap { Write-Error "[FATAL] $($_.Exception.Message)"; exit 1 }

          $paths = @(
            $env:ECHO_ROOT,
            $env:OUT_DIR,
            $env:SCRIPTS_DIR,
            $env:TPL_DIR,
            $env:DOC_DIR,
            $env:LOG_DIR
          ) | Where-Object { $_ -and $_.Trim() -ne "" }

          foreach ($p in $paths) {
            if (-not (Test-Path -LiteralPath $p)) {
              New-Item -ItemType Directory -Force -Path $p | Out-Null
            }
          }
          Write-Host "[ECHO][OK] Directories prepared: $($paths -join ', ')"

      - name: Generate deploy script (echo)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $content = @'
          [CmdletBinding()]
          param(
            [string]$InstallerPath = "",
            [string]$LandscapeXml = "",
            [string]$SapLogonIni = "",
            [ValidateSet("PerMachine","PerUser")]
            [string]$Scope = "PerMachine",
            [switch]$CreateShortcuts,
            [switch]$DryRun
          )

          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $LogDir = Join-Path $PSScriptRoot "..\logs"
          if (!(Test-Path $LogDir)) { New-Item -ItemType Directory -Force -Path $LogDir | Out-Null }
          $LogFile = Join-Path $LogDir ("deploy-" + (Get-Date -Format "yyyyMMdd-HHmmss") + ".log")

          function Write-Log {
            param([string]$Message,[ValidateSet("INFO","WARN","ERROR")] [string]$Level="INFO")
            $ts = (Get-Date).ToString("u")
            $line = "[{0}][{1}] {2}" -f $ts,$Level,$Message
            Write-Host $line
            Add-Content -LiteralPath $LogFile -Value $line
          }

          function Ensure-Dir { param([string]$Path) if(!(Test-Path $Path)){ New-Item -ItemType Directory -Force -Path $Path | Out-Null } }

          function Install-SapGui {
            param([string]$Path)
            if([string]::IsNullOrWhiteSpace($Path) -or !(Test-Path $Path)){
              Write-Log "Installer not provided or not found. Skip install." "WARN"; return
            }
            if($DryRun){ Write-Log "DryRun: would install $Path"; return }

            $ext = [IO.Path]::GetExtension($Path).ToLowerInvariant()
            if($ext -eq ".msi"){
              Write-Log "Installing MSI: $Path"
              $p = Start-Process msiexec.exe -ArgumentList "/i `"$Path`" /qn /norestart" -Wait -PassThru
              if($p.ExitCode -ne 0){ throw "MSI install failed (rc=$($p.ExitCode))" }
              Write-Log "MSI install OK"
              return
            }

            if($ext -eq ".exe"){
              Write-Log "Installing EXE (try silent flags): $Path"
              $candidates = @("/silent","/verysilent","/s","/qn","/quiet","/passive /norestart")
              foreach($arg in $candidates){
                Write-Log "Try args: $arg"
                try{
                  $p = Start-Process -FilePath $Path -ArgumentList $arg -Wait -PassThru
                  if($p.ExitCode -eq 0){ Write-Log "EXE install OK with args: $arg"; return }
                  else { Write-Log "ExitCode=$($p.ExitCode) with args: $arg" "WARN" }
                } catch { Write-Log "Install attempt failed: $($_.Exception.Message)" "WARN" }
              }
              Write-Log "EXE silent install not succeeded; trying SAP*Setup discovery" "WARN"
            }

            $dir = (Get-Item $Path).Directory.FullName
            $setup = Get-ChildItem -Path $dir -Recurse -Include *SAP*Setup*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if($setup){
              Write-Log "Found SAP setup candidate: $($setup.FullName)"
              if($DryRun){ Write-Log "DryRun: would run $($setup.FullName) /Silent"; return }
              $p = Start-Process -FilePath $setup.FullName -ArgumentList "/Silent" -Wait -PassThru
              if($p.ExitCode -ne 0){ throw "SAP setup failed (rc=$($p.ExitCode))" }
              Write-Log "SAP setup OK"
            } else {
              Write-Log "No SAP*Setup*.exe found; installation skipped" "WARN"
            }
          }

          function Deploy-Landscape {
            param([string]$Xml,[string]$Ini,[string]$Scope)
            $ProgramDataSAP = Join-Path $env:ProgramData "SAP"
            $AppDataSAP = Join-Path $env:AppData "SAP"

            if($Scope -eq "PerMachine"){
              Ensure-Dir $ProgramDataSAP
              if($Xml -and (Test-Path $Xml)){
                Copy-Item -Force -LiteralPath $Xml -Destination (Join-Path $ProgramDataSAP "SAPUILandscape.xml")
                Write-Log "SAPUILandscape.xml -> $ProgramDataSAP"
              } else { Write-Log "Landscape XML not provided; skipped" "WARN" }

              if($Ini -and (Test-Path $Ini)){
                Ensure-Dir $AppDataSAP
                Copy-Item -Force -LiteralPath $Ini -Destination (Join-Path $AppDataSAP "saplogon.ini")
                Write-Log "saplogon.ini -> $AppDataSAP (legacy clients)"
              }
            } else {
              Ensure-Dir $AppDataSAP
              if($Xml -and (Test-Path $Xml)){
                Copy-Item -Force -LiteralPath $Xml -Destination (Join-Path $AppDataSAP "SAPUILandscape.xml")
                Write-Log "SAPUILandscape.xml -> $AppDataSAP"
              }
              if($Ini -and (Test-Path $Ini)){
                Copy-Item -Force -LiteralPath $Ini -Destination (Join-Path $AppDataSAP "saplogon.ini")
                Write-Log "saplogon.ini -> $AppDataSAP (legacy clients)"
              }
            }
          }

          function Create-Shortcuts {
            $candidates = @(
              "C:\Program Files (x86)\SAP\FrontEnd\SAPgui\saplogon.exe",
              "C:\Program Files\SAP\FrontEnd\SAPgui\saplogon.exe"
            )
            $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $exe){ Write-Log "saplogon.exe not found; skip shortcuts" "WARN"; return }

            $w = New-Object -ComObject WScript.Shell
            $publicDesktop = "$env:Public\Desktop"
            $startMenu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs"
            Ensure-Dir $publicDesktop; Ensure-Dir $startMenu

            $lnk1 = Join-Path $publicDesktop "SAP Logon.lnk"
            $s1 = $w.CreateShortcut($lnk1); $s1.TargetPath = $exe; $s1.WorkingDirectory = (Split-Path $exe); $s1.Description = "SAP Logon"; $s1.Save()
            Write-Log "Shortcut created: $lnk1"

            $lnk2 = Join-Path $startMenu "SAP Logon.lnk"
            $s2 = $w.CreateShortcut($lnk2); $s2.TargetPath = $exe; $s2.WorkingDirectory = (Split-Path $exe); $s2.Description = "SAP Logon"; $s2.Save()
            Write-Log "Shortcut created: $lnk2"
          }

          Write-Log "==== SAP Logon Deploy start ===="
          Write-Log ("Scope="+$Scope+", DryRun="+$DryRun+", CreateShortcuts="+$CreateShortcuts)

          Install-SapGui -Path $InstallerPath
          Deploy-Landscape -Xml $LandscapeXml -Ini $SapLogonIni -Scope $Scope
          if($CreateShortcuts){ Create-Shortcuts }

          Write-Log "==== Done ===="
          Write-Host ("[ECHO][LOG] " + $LogFile)
          '@

          $scriptPath = Join-Path $env:SCRIPTS_DIR "deploy_sap_logon.ps1"
          $content | Set-Content -Encoding UTF8 -LiteralPath $scriptPath
          Write-Host "[ECHO][OK] Generated: $scriptPath"

      - name: Generate templates & docs (echo)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          @"
          # SAP Logon Deploy Scaffold (v2)

          - scripts/deploy_sap_logon.ps1 : 무인 설치 + Landscape 배포 + 바로가기
          - templates/SAPUILandscape.xml : 샘플 골격
          - templates/saplogon.ini       : 레거시 호환 샘플
          - logs/                        : 실행 로그
          - out/                         : 산출물
          "@ | Set-Content -Encoding UTF8 $env:DOC_DIR\README_DEPLOY.md

          @"
          <!-- TEMPLATE ONLY — 실제 운영 파일 사용 권장 -->
          <?xml version="1.0" encoding="UTF-8"?>
          <Landscape note="${{ github.event.inputs.landscape_name }}">
            <Services>
            </Services>
          </Landscape>
          "@ | Set-Content -Encoding UTF8 $env:TPL_DIR\SAPUILandscape.xml

          @";
          ; TEMPLATE ONLY — 구형/레거시 클라이언트용
          [Description]
          ENTRIES=0
          "@ | Set-Content -Encoding UTF8 $env:TPL_DIR\saplogon.ini

          Write-Host "[ECHO][OK] Templates/docs generated"

      - name: (Optional) Download installer & verify
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $url = "${{ github.event.inputs.sap_gui_installer_url }}"
          if([string]::IsNullOrWhiteSpace($url)){
            Write-Host "[ECHO][SKIP] No installer URL provided"
            exit 0
          }
          $dl = Join-Path $env:OUT_DIR "SAP_GUI_Setup.exe"
          Write-Host "[ECHO][GET] $url -> $dl"
          Invoke-WebRequest -Uri $url -OutFile $dl -UseBasicParsing -TimeoutSec 900
          if(!(Test-Path $dl)){ throw "Installer not downloaded." }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $dl).Hash.ToLower()
          $exp = "${{ github.event.inputs.sap_gui_sha256 }}".ToLower()
          if($exp){
            if($sha -ne $exp){ throw "SHA256 mismatch. got=$sha expected=$exp" }
            Write-Host "[ECHO][OK] SHA256 verified"
          } else {
            Write-Host "[ECHO][WARN] SHA256 not provided. got=$sha"
          }
          "SAP_GUI_INSTALLER=$dl" | Out-File -FilePath $env:OUT_DIR\env.properties -Encoding ascii

      - name: Run deploy script
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $installer = ""
          $envFile = "$env:OUT_DIR\env.properties"
          if(Test-Path $envFile){
            $m = Get-Content $envFile | Where-Object { $_ -match "=" } | ForEach-Object {
              $kv = $_.Split("=",2); [PSCustomObject]@{ K=$kv[0]; V=$kv[1] }
            }
            $installer = ($m | Where-Object { $_.K -eq "SAP_GUI_INSTALLER" } | Select-Object -First 1).V
          }

          $script = Join-Path $env:SCRIPTS_DIR "deploy_sap_logon.ps1"
          $xml = Join-Path $env:TPL_DIR "SAPUILandscape.xml"
          $ini = Join-Path $env:TPL_DIR "saplogon.ini"

          $scope = "${{ github.event.inputs.deploy_scope }}"
          $mkShort = [bool]::Parse("${{ github.event.inputs.create_shortcuts }}")
          $dry = [bool]::Parse("${{ github.event.inputs.dry_run }}")

          Write-Host "[ECHO][RUN] $script"
          & $script `
            -InstallerPath $installer `
            -LandscapeXml $xml `
            -SapLogonIni $ini `
            -Scope $scope `
            -CreateShortcuts:($mkShort) `
            -DryRun:($dry)

      - name: Zip artifact
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $zip = "$env:OUT_DIR\sap-logon-deploy.zip"
          if(Test-Path $zip){ Remove-Item -Force $zip }
          Compress-Archive -Path "$env:ECHO_ROOT\*" -DestinationPath $zip
          Write-Host "[ECHO][OK] Packed -> $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sap-logon-deploy
          path: .github/echo_sap/out/sap-logon-deploy.zip
          if-no-files-found: error
          retention-days: 30

      - name: Commit scaffold
        if: ${{ github.event.inputs.commit_branch != '' }}
        shell: pwsh
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git checkout "${{ github.event.inputs.commit_branch }}"
          git add $env:ECHO_ROOT
          $status = git status --porcelain
          if($status){
            git commit -m "chore(sap): echo scaffold + deploy script [auto]"
            git push
            Write-Host "[ECHO][OK] committed/pushed"
          } else {
            Write-Host "[ECHO][SKIP] nothing to commit"
          }

      - name: Create Release (optional)
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "sap-deploy-${{ github.run_number }}"
          name: "SAP Logon Deploy Scaffold #${{ github.run_number }}"
          body: "Auto-generated SAP Logon deployment scaffold and package."
          files: |
            .github/echo_sap/out/sap-logon-deploy.zip
