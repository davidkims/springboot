name: 🟢 FullOps Echo/Install/Diagnose/CI (Apt Held/Broken/Snap Fallback All-in-One)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2,8,14,20 * * *'

jobs:
  ops-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7

      - name: 🏗️ echo/설치/진단/충돌/held 자동 복구 (전체 생략 없이)
        run: |
          BASE=".github/workflows"
          for d in $BASE/echo_{java,python,go,node,typescript,ruby,php,swift,rust,dotnet,perl,scala, \
            docker,compose,k8s,nginx,apache,tomcat,redis,mongo,postgres,mysql,oracle,sqlite,elasticsearch,kafka,hadoop,spark,airflow,jenkins,github,actions,ci,cd,build,deploy, \
            pkg,env,secret,token,ssl,ssh,firewall,network,network_setup,route,dns,proxy,vpn, \
            aws,gcp,azure,cloud_run,lambda,ec2,rds,s3,iam, \
            ai,llm,openai,claude,vertexai,bedrock,chatgpt,vision, \
            monitor,metrics,alert,fail,stats,backup,restore,rsync,ftp,s3backup,azureblob,gcs,log, \
            test,report,benchmark,security,scan,policy,guard,auth,audit,trace,debug,path,meta,init,misc, \
            git,actions,ci,report,fail,stats,health,backup,restore,actions,fail,stats,health,actions,report}; do
            mkdir -p "$d"
            echo "[dummy]" > $d/dummy.txt
            echo "[keep]"  > $d/.keep
            echo "echo '[에코] $d 디렉토리 생성'" > $d/echo_dir.sh
            echo "export PATH=\$PATH:/usr/local/bin" > $d/echo_env.sh
            echo "echo '권한 진단:';id;groups;whoami" > $d/echo_perm.sh
          done

          # [1] 패키지 lock, held, broken 진단 및 복구
          sudo apt-get update -y
          dpkg --audit || true
          sudo apt-get -f install -y || true
          sudo apt-mark showhold | tee $BASE/echo_pkg/held.txt
          for pkg in $(sudo apt-mark showhold); do sudo apt-mark unhold $pkg; done
          sudo dpkg --configure -a || true
          sudo apt-get autoremove -y || true

          # [2] 주요 패키지 일괄 설치(apt 충돌 시 개별 echo 및 무시)
          PKGLIST="software-properties-common apt-transport-https curl gnupg2 lsb-release ca-certificates jq zip unzip rsync git wget net-tools lsof iproute2 ufw
            openjdk-17-jdk python3 python3-pip golang nodejs npm ruby-full php php-cli php-mysql php-pgsql rustc cargo perl scala
            docker.io docker-compose kubectl nginx apache2 redis-server postgresql-client postgresql mysql-client mysql-server sqlite3"
          for p in $PKGLIST; do
            echo ">> 설치 시도: $p" | tee -a $BASE/echo_pkg/apt_install.log
            sudo apt-get install -y $p 2>&1 | tee -a $BASE/echo_pkg/apt_install.log || echo "[ERROR] $p 설치 실패" | tee -a $BASE/echo_pkg/apt_install_err.log
          done
          sudo apt-get -f install -y || true

          # [3] Snap 및 기타 공식 인스톨러 fallback
          sudo snap install --classic dotnet-sdk || true
          sudo snap install --classic go || true
          sudo snap install --classic kubectl || true
          sudo snap install --classic aws-cli || true

          # Swift 설치 (공식 다운로드)
          if ! command -v swiftc >/dev/null; then
            SW_VER=5.9.2; curl -LO https://download.swift.org/swift-$SW_VER-release/ubuntu$(lsb_release -rs)/swift-$SW_VER-RELEASE/swift-$SW_VER-RELEASE-ubuntu$(lsb_release -rs).tar.gz || true
            tar xzf swift-*-ubuntu*.tar.gz -C /opt && sudo ln -s /opt/swift-*/usr/bin/swift* /usr/local/bin/ || true
          fi

          # Minikube 공식 설치
          if ! command -v minikube >/dev/null; then
            curl -Lo minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64 && chmod +x minikube && sudo mv minikube /usr/local/bin/ || true
          fi

          # MongoDB 설치 (공식 GPG/Repo)
          if ! command -v mongod >/dev/null; then
            wget -qO - https://www.mongodb.org/static/pgp/server-6.0.asc | sudo apt-key add - && \
            echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu $(lsb_release -cs)/mongodb-org/6.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-6.0.list && \
            sudo apt-get update && sudo apt-get install -y mongodb-org || true
          fi

          # Elasticsearch 설치 (공식 GPG/Repo)
          if ! command -v elasticsearch >/dev/null; then
            wget -qO - https://artifacts.elastic.co/GPG-KEY-elasticsearch | sudo apt-key add - && \
            sudo apt-get install -y apt-transport-https && \
            echo "deb https://artifacts.elastic.co/packages/8.x/apt stable main" | sudo tee /etc/apt/sources.list.d/elastic-8.x.list && \
            sudo apt-get update && sudo apt-get install -y elasticsearch || true
          fi

          # AWS CLI pip fallback
          if ! command -v aws >/dev/null; then
            pip3 install --upgrade awscli || sudo snap install --classic aws-cli || true
          fi

          # Google Cloud SDK 설치 (공식 apt repo)
          if ! command -v gcloud >/dev/null; then
            echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] http://packages.cloud.google.com/apt cloud-sdk main" | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list && \
            curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key add - && \
            sudo apt-get update && sudo apt-get install -y google-cloud-sdk || true
          fi

          # Azure CLI 설치 (공식)
          if ! command -v az >/dev/null; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash || true
          fi

          # AI/LLM 라이브러리
          pip3 install --upgrade openai anthropic google-cloud-aiplatform transformers > $BASE/echo_ai/pip_ai.log 2>&1 || true

          # [4] CI/CD/배포/빌드/트래킹/환경/권한/진단 echo 예시
          mkdir -p $BASE/echo_ci $BASE/echo_git $BASE/echo_report $BASE/echo_fail $BASE/echo_stats $BASE/echo_health $BASE/echo_actions
          echo "$GITHUB_WORKFLOW" > $BASE/echo_ci/workflow.txt
          echo "$GITHUB_RUN_ID" > $BASE/echo_ci/runid.txt
          echo "$GITHUB_JOB" > $BASE/echo_ci/job.txt
          echo "$GITHUB_SHA" > $BASE/echo_ci/sha.txt
          echo "$GITHUB_REF" > $BASE/echo_ci/ref.txt
          echo "$GITHUB_REPOSITORY" > $BASE/echo_ci/repo.txt
          echo "$GITHUB_ACTOR" > $BASE/echo_ci/actor.txt
          git log -5 > $BASE/echo_git/log.txt 2>&1 || true
          git status > $BASE/echo_git/status.txt 2>&1 || true
          git branch -a > $BASE/echo_git/branch.txt 2>&1 || true
          java -version > $BASE/echo_java/version.txt 2>&1 || true
          python3 --version > $BASE/echo_python/version.txt 2>&1 || true
          go version > $BASE/echo_go/version.txt 2>&1 || true
          swift --version > $BASE/echo_swift/version.txt 2>&1 || true
          dotnet --info > $BASE/echo_dotnet/version.txt 2>&1 || true
          node --version > $BASE/echo_node/version.txt 2>&1 || true
          kubectl version --client > $BASE/echo_k8s/version.txt 2>&1 || true
          minikube version > $BASE/echo_k8s/minikube.txt 2>&1 || true
          mongod --version > $BASE/echo_mongo/version.txt 2>&1 || true
          elasticsearch --version > $BASE/echo_elasticsearch/version.txt 2>&1 || true
          aws --version > $BASE/echo_aws/version.txt 2>&1 || true
          gcloud --version > $BASE/echo_gcp/version.txt 2>&1 || true
          az version > $BASE/echo_azure/version.txt 2>&1 || true

          ip a > $BASE/echo_network/ip_a.txt
          ip r > $BASE/echo_network/ip_r.txt
          ss -ntlp > $BASE/echo_network/ss.txt 2>&1 || true
          netstat -ntlp > $BASE/echo_network/netstat.txt 2>&1 || true
          traceroute 8.8.8.8 > $BASE/echo_network/traceroute.txt 2>&1 || true
          dig google.com > $BASE/echo_dns/dig.txt 2>&1 || true
          cat /etc/resolv.conf > $BASE/echo_dns/resolv.txt || true
          sudo iptables -L -n -v > $BASE/echo_firewall/iptables.txt 2>&1 || true
          sudo ufw status verbose > $BASE/echo_firewall/ufw.txt 2>&1 || true
          env > $BASE/echo_env/env.txt
          printenv | sort > $BASE/echo_env/env_sorted.txt
          uname -a > $BASE/echo_env/uname.txt
          cat /etc/os-release > $BASE/echo_env/release.txt
          id > $BASE/echo_permission/id.txt
          groups > $BASE/echo_permission/groups.txt
          sudo -l > $BASE/echo_permission/sudo_l.txt 2>&1 || true
          whoami > $BASE/echo_permission/whoami.txt

          tar czf $BASE/backup_$(date +%F).tar.gz .github || true
          docker save $(docker images -q|head -n1) -o $BASE/docker_image_backup.tar || true
          rsync -av .github $BASE/echo_backup/rsync 2>&1 || true
          cp -a .github/*.yml $BASE/echo_actions/ 2>/dev/null || true

          echo "실행시각: $(date)" > $BASE/echo_stats/time.txt
          echo "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" > $BASE/echo_stats/run_attempt.txt
          echo "GITHUB_STATUS=$GITHUB_STATUS" > $BASE/echo_stats/status.txt
          echo "실패알림: $GITHUB_RUN_ATTEMPT" > $BASE/echo_fail/alert.txt
          echo "health: ok" > $BASE/echo_health/health.txt

          ls -lhR $BASE > $BASE/echo_report/ls.txt
          du -sh $BASE > $BASE/echo_report/size.txt
          find $BASE -type f | sort > $BASE/echo_path/all_files.txt
          find $BASE -type d | sort > $BASE/echo_path/all_dirs.txt
          FILECOUNT=$(find $BASE -type f | wc -l); echo "Total files: $FILECOUNT"; [ "$FILECOUNT" -gt 0 ] || exit 1

      - name: 📄 업로드 전 전체 파일 목록
        run: find .github/workflows -type f

      - uses: actions/upload-artifact@v4.3.3
        with:
          name: fullops-artifacts
          path: .github/workflows/**
          if-no-files-found: error
