name: 🌐 All-in-One .github echo/경로/설정/워크플로우/환경/권한/필수파일 자동생성

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  all-in-one-info:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 .github 디렉토리/필수 파일/경로/환경 설정 에코 생성 (오류 방지)
        run: |
          # 1. .github/echo_path를 가장 먼저 생성!
          mkdir -p .github/echo_path

          # 2. 주요 디렉토리 및 echo/dummy/.keep/echo_dir.sh 파일 생성
          for d in \
            .github/echo_system .github/echo_network .github/echo_dns .github/echo_route \
            .github/echo_docker .github/echo_containers .github/echo_volume .github/echo_logs \
            .github/echo_permission .github/echo_user .github/echo_key .github/echo_fileperm \
            .github/echo_pkg .github/echo_env .github/echo_build .github/echo_git \
            .github/echo_backup .github/echo_monitor .github/echo_misc \
            .github/workflows .github/scripts .github/cli_test .github/error_logs .github/echo_db ; do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo_path/echo_dir_create_path.txt
            mkdir -p $d
            echo "[dummy]" > $d/dummy.txt
            echo "[keep]"  > $d/.keep
            echo "echo '[에코] $d 생성'" > $d/echo_dir.sh
            echo "$d" >> .github/echo_path/dir_path_list.txt
          done

          # 3. .github 루트에도 필수 파일 생성
          echo "# Github Meta" > .github/README.md
          echo "[meta]" > .github/.keep
          echo "[dummy]" > .github/dummy.txt
          echo ".github" >> .github/echo_path/dir_path_list.txt

          # 4. 워크플로우 예시 파일
          echo "name: dummy-wf" > .github/workflows/dummy.yml
          echo "# dummy workflow" > .github/workflows/dummy.md

          # 5. 권한/로그/상태 필수 echo/dummy 파일
          echo "echo 'touch .github/error_logs/disabled_workflows.txt'" | tee .github/error_logs/echo_disabled_workflows.sh
          touch .github/error_logs/disabled_workflows.txt
          echo "echo 'touch .github/error_logs/init_check.log'" | tee .github/error_logs/echo_init_check.sh
          touch .github/error_logs/init_check.log
          echo "echo 'touch .github/echo_misc/health.txt'" | tee .github/echo_misc/echo_health.sh
          touch .github/echo_misc/health.txt

          # 6. 환경설정/환경 변수/시스템 정보 echo 파일
          printenv | sort > .github/echo_env/env_all.txt
          env > .github/echo_env/env.txt
          echo $SHELL > .github/echo_env/shell.txt
          echo $USER > .github/echo_env/user.txt
          uname -a > .github/echo_env/uname.txt
          cat /etc/os-release > .github/echo_env/os-release.txt
          date > .github/echo_env/date.txt
          locale > .github/echo_env/locale.txt

          # 7. .github/echo_path 디렉토리 내 전체 경로 및 파일리스트 갱신
          find .github -type d | sort > .github/echo_path/all_dir_list.txt
          find .github -type f | sort > .github/echo_path/all_file_list.txt

          # 8. echo로 생성된 폴더/파일 path 출력 (워크플로우 log 확인용)
          echo "[폴더 전체 목록]"
          cat .github/echo_path/all_dir_list.txt
          echo "[파일 전체 목록]"
          cat .github/echo_path/all_file_list.txt

      - name: 🔍 [진단] .github 하위 실제 파일 목록 확인
        run: |
          echo "[업로드 대상 .github 폴더/파일 실제 리스트]"
          find .github -type f | sort

      - name: 📦 [최종] .github 전체 폴더/파일/워크플로우/에코/경로/설정/로그 업로드 (생략 없음)
        uses: actions/upload-artifact@v4
        with:
          name: all-github-artifacts
          path: .github/**
          if-no-files-found: error
