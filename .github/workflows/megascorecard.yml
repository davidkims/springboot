name: 🛡️ MEGA Scorecard + EchoOps + SARIF + Markdown + Pages 확장판

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '16 11 * * 2'  # 매주 화요일 Scorecard 실행
    - cron: '*/3 * * * *'  # 3분마다 EchoOps 실행
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard-analysis:
    name: ✅ Scorecard 분석 및 업로드
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: 📂 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🔍 Scorecard 분석 실행
        uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          results_file_json: results.json  # ✅ JSON 결과 포함

      - name: ☁️ GitHub Code Scanning 업로드
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: 📄 결과 아티팩트 저장
        uses: actions/upload-artifact@v4
        with:
          name: Scorecard-Results
          path: |
            results.sarif
            results.json

  post-analysis-echo:
    name: 🔧 EchoOps + Markdown 변환 + SARIF 분석 + Pages 배포
    runs-on: ubuntu-latest
    needs: scorecard-analysis
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'

    steps:
      - name: 📂 코드 체크아웃
        uses: actions/checkout@v4

      - name: 📥 Scorecard 결과 다운로드
        uses: actions/download-artifact@v4
        with:
          name: Scorecard-Results

      - name: 📁 echo 디렉토리 자동 생성
        run: |
          for d in echo_dirs echo_scorecard echo_monitoring echo_pages; do
            mkdir -p ".github/${d}"
            echo "echo '[ECHO] 디렉토리 생성: .github/${d}'" >> .github/${d}/create_dirs.sh
          done

      - name: 🔍 JSON 유효성 검사
        run: |
          if ! jq empty results.json; then
            echo "::error ::results.json이 유효한 JSON이 아닙니다. Markdown 변환 중단."
            cat results.json || true
            exit 1
          fi

      - name: 📝 Scorecard JSON → Markdown 요약 변환 (안정화 버전)
        run: |
          set -e
          mkdir -p site/scorecard
          echo "# 🛡️ OSSF Scorecard 결과 요약" > site/scorecard/scorecard-summary.md
          echo "" >> site/scorecard/scorecard-summary.md

          if jq -e '.repo.name and .score and .checks' results.json > /dev/null; then
            jq -r '
              "### 프로젝트: \(.repo.name)\n\n" +
              "신뢰도 점수: \(.score) / 10\n\n" +
              "| Check | Pass | Score | Reason |\n|-------|------|--------|--------|\n" +
              (.checks[] | 
                "| \(.name) | \(.pass) | \(.score) | \(.reason // "-") |"
              ) | join("\n")
            ' results.json >> site/scorecard/scorecard-summary.md
          else
            echo "_⚠️ results.json 구조가 맞지 않아 Markdown 변환 불가._" >> site/scorecard/scorecard-summary.md
          fi

      - name: 📄 SARIF → Markdown 이슈 요약
        run: |
          echo "# 🚨 SARIF 보안 이슈 요약" > site/scorecard/sarif-summary.md
          jq -r '.runs[].results[] | 
            "- **[\(.level)]**: \(.message.text)\n  위치: \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine // "-")"
          ' results.sarif >> site/scorecard/sarif-summary.md

      - name: 📊 SARIF 평가 요약 (에코 로그 저장)
        run: |
          mkdir -p .github/echo_scorecard
          TOTAL=$(jq '.runs[].results | length' results.sarif)
          SEVERITIES=$(jq -r '.runs[].results[].level' results.sarif | sort | uniq -c)
          echo "[SARIF] 총 이슈 수: $TOTAL" | tee .github/echo_scorecard/sarif_summary.txt
          echo "[SARIF] 심각도 분포:" | tee -a .github/echo_scorecard/sarif_summary.txt
          echo "$SEVERITIES" | tee -a .github/echo_scorecard/sarif_summary.txt

      - name: 📦 대용량 파일 및 디렉토리 용량 분석
        run: |
          mkdir -p .github/echo_monitoring
          (du -ah . | sort -hr | head -n 30) > .github/echo_monitoring/top_file_sizes.txt || true
          du -sh . > .github/echo_monitoring/total_size.txt || true
          echo "echo '[ECHO] 파일 용량 분석 완료'" >> .github/echo_monitoring/file_size_check.sh

      - name: 🌐 Pages용 디렉토리 구성
        run: |
          mkdir -p site/scorecard
          cp results.sarif site/scorecard/scorecard-results.sarif
          cp results.json site/scorecard/results.json
          echo "echo '[ECHO] SARIF + JSON 복사 완료 → site/scorecard'" >> .github/echo_pages/copy_scorecard_sarif.sh

      - name: 🚀 GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
