name: 🚀 Full Finance & Scorecard Setup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # 매주 일요일 00:00 UTC에 실행 (KST 기준 일요일 오전 9시)

jobs:
  full-setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📆 Set Date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: 🐳 CLI Tools 설치
        run: |
          echo "Installing necessary CLI tools..."
          sudo apt-get update
          sudo apt-get install -y jq curl unzip bc file

      - name: 🗂️ 디렉토리 준비
        run: |
          echo "Preparing directories..."
          mkdir -p .github/finance/ledgers \
                   .github/finance/files \
                   .github/scorecard/ledgers \
                   .github/scorecard/files \
                   .github/scorecard/sarif

      - name: 🧾 금융 원장 생성
        run: |
          F=".github/finance/ledgers/ledger_${{steps.date.outputs.date}}.csv"
          echo "name,date,amount,type,card_number" > "$F"
          for i in {1..50}; do
            TXN=$(date -d "$i days ago" +%F)
            TYPE=$( ((i%2)) && echo 신용 || echo 체크 )
            CARD="-"
            [[ "$TYPE" = "신용" ]] && CARD="4111$(printf "%012d" $RANDOM)"
            echo "Customer$i,$TXN,$((RANDOM%9000+1000)).00,$TYPE,$CARD" >> "$F"
          done
          echo "Finance ledger created at: $F"

      - name: 📄 보고서 생성 (Finance)
        run: |
          REPORT_FILE=".github/finance/files/report_${{steps.date.outputs.date}}.txt"
          echo "금융 거래 요약 리포트 - ${{steps.date.outputs.date}}" > "$REPORT_FILE"
          echo "Finance report created at: $REPORT_FILE"

      - name: 🧪 Run OpenSSF Scorecard and Generate SARIF
        # Removed JSON specific output parameters to ensure SARIF is the primary output for results_file
        uses: ossf/scorecard-action@v2.4.2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          results_file: .github/scorecard/sarif/scorecard_${{steps.date.outputs.date}}.sarif # This should be the SARIF output

      # --- START: Add a separate step if you still need the raw JSON output ---
      # This step requires the 'scorecard' binary to be in the PATH.
      # The ossf/scorecard-action typically cleans up the binary after its run.
      # If you need raw JSON, you might need to re-install it here OR
      # reconsider if the JSON is strictly necessary for your pipeline.
      # For now, let's assume the SARIF is the primary output.
      # If you absolutely need the JSON, you might have to run Scorecard CLI manually
      # in a separate step again, but only for JSON output, similar to your original attempt
      # but without the SARIF error.
      # For example:
      # - name: 🧪 Run Scorecard JSON Scan (Optional, if SARIF is not enough)
      #   run: |
      #     # This assumes Scorecard CLI is in PATH, which it won't be after ossf/scorecard-action
      #     # So, this part would be complex to re-add without re-downloading Scorecard CLI.
      #     # Consider if the SARIF is sufficient or if the JSON can be extracted from SARIF later.
      #     # Alternatively, the ossf/scorecard-action might have a way to generate both correctly.
      #     # Given the SARIF validation error, let's prioritize getting SARIF working.
      #     echo "Skipping direct JSON generation to prioritize SARIF fix."
      # --- END: Add a separate step ---

      - name: 🧾 Scorecard 원장 생성
        run: |
          G=".github/scorecard/ledgers/scorecard_${{steps.date.outputs.date}}.csv"
          echo "item,score,comment" > "$G"
          for i in {1..20}; do
            C=$(( RANDOM % 2 ))
            COMMENT=$([ "$C" -eq 0 ] && echo "양호" || echo "개선필요")
            echo "SecurityCheck$i,$((RANDOM%101)),$COMMENT" >> "$G"
          done
          echo "Scorecard ledger created at: $G"

      - name: 📄 보고서 생성 (Scorecard)
        run: |
          OSS_REPORT_FILE=".github/scorecard/files/oss_report_${{steps.date.outputs.date}}.txt"
          echo "오픈소스 보안 점검 리포트 - ${{steps.date.outputs.date}}" > "$OSS_REPORT_FILE"
          echo "Open-source security report created at: $OSS_REPORT_FILE"

      - name: 📜 Provenance 생성
        run: |
          FINANCE_PROVENANCE_FILE=".github/finance/provenance_${{steps.date.outputs.date}}.json"
          echo "{\"type\":\"finance-ledger\",\"date\":\"${{steps.date.outputs.date}}\",\"ledger\":\"ledger_${{steps.date.outputs.date}}.csv\",\"report\":\"report_${{steps.date.outputs.date}}.txt\"}" > "$FINANCE_PROVENANCE_FILE"
          echo "Finance provenance created at: $FINANCE_PROVENANCE_FILE"

          SCORECARD_PROVENANCE_FILE=".github/scorecard/provenance_${{steps.date.outputs.date}}.json"
          echo "{\"type\":\"scorecard-report\",\"date\":\"${{steps.date.outputs.date}}\",\"ledger\":\"scorecard_${{steps.date.outputs.date}}.csv\",\"report\":\"oss_report_${{steps.date.outputs.date}}.txt\"}" > "$SCORECARD_PROVENANCE_FILE"
          echo "Scorecard provenance created at: $SCORECARD_PROVENANCE_FILE"

      - name: 🚀 SARIF 업로드
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .github/scorecard/sarif/scorecard_${{steps.date.outputs.date}}.sarif
          category: "OpenSSF Scorecard"

      - name: 📦 Upload JSON report as artifact (if generated)
        # This step will only upload if results.json was successfully created by Scorecard Action.
        # Given the previous SARIF error, we need to ensure this is handled carefully.
        # If the Scorecard Action's SARIF generation works after this change,
        # we can re-evaluate how to get the JSON output from the action.
        # For now, it will look for .github/scorecard/files/results_DATE.json
        # which might not be there if the action didn't produce it after our config change.
        if: success() || failure() # Always run to check for file existence
        run: |
          JSON_FILE=".github/scorecard/files/results_${{steps.date.outputs.date}}.json"
          if [ -f "$JSON_FILE" ]; then
            echo "Uploading JSON report $JSON_FILE"
            # Use upload-artifact directly here for the specific JSON file
            # as the prior step within ossf/scorecard-action is removed.
            # However, upload-artifact is an action, not a shell command.
            # This requires a separate upload-artifact step.
            # I will mark this for re-evaluation.
            echo "JSON report path: $JSON_FILE"
            # This 'run' block is for shell commands. The upload-artifact
            # needs to be a separate 'uses' step.
          else
            echo "JSON report not found at $JSON_FILE, skipping upload as artifact."
          fi
      
      # Re-adding the dedicated upload-artifact for JSON if it's still needed
      - name: 📦 Re-upload JSON report as artifact (Dedicated Step)
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-json-report-${{steps.date.outputs.date}}
          path: .github/scorecard/files/results_${{steps.date.outputs.date}}.json
        if: always() && fileExists('.github/scorecard/files/results_${{steps.date.outputs.date}}.json') # Only run if file exists

      - name: 🩺 헬스체크
        run: |
          echo "Performing health checks..."
          docker info > /dev/null && echo "✅ Docker OK" || (echo "❌ Docker check failed"; exit 1)
          
          test -f ".github/scorecard/sarif/scorecard_${{steps.date.outputs.date}}.sarif" && echo "✅ Scorecard SARIF OK" || (echo "❌ Scorecard SARIF file not found"; exit 1)
          
          test -f ".github/finance/ledgers/ledger_${{steps.date.outputs.date}}.csv" && echo "✅ Finance Ledger OK" || (echo "❌ Finance Ledger file not found"; exit 1)
          
          grep -q "오픈소스 보안 점검" ".github/scorecard/files/oss_report_${{steps.date.outputs.date}}.txt" && echo "✅ Scorecard Report OK" || (echo "❌ Scorecard Report content check failed"; exit 1)
          
          echo "All health checks passed successfully!"
