name: "🛡️ AutorunGuard (PowerShell) — build • test • artifact"

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "실행 모드: test(Once만) | install(설치 시뮬레이션+Once)"
        required: true
        default: "test"
        type: choice
        options: ["test", "install"]
  # 필요 시 주기 실행(Windows 러너 필요) — 주석 해제
  # schedule:
  #   - cron: "0 0 * * 1"  # 매주 월요일 00:00 UTC

permissions:
  contents: read

concurrency:
  group: autorunguard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🧩 Generate AutorunGuard.ps1 (EchoOps)
        shell: pwsh
        run: |
          $dstRepo = Join-Path $PWD 'scripts\AutorunGuard.ps1'
          $dstTools = 'C:\Tools\AutorunGuard.ps1'
          New-Item -Force -ItemType Directory -Path (Split-Path $dstRepo) | Out-Null
          New-Item -Force -ItemType Directory -Path (Split-Path $dstTools) | Out-Null

          @'
          <# 
          .SYNOPSIS
            USB/CD autorun.inf 악성 실행 차단/격리 + 재생성 방지(폴더락) + 정책 비활성화.
          #>

          [CmdletBinding()]
          param(
            [switch]$Install,
            [switch]$Uninstall,
            [switch]$Once
          )

          $ErrorActionPreference = 'Stop'
          $LogDir  = Join-Path $env:ProgramData 'AutorunGuard'
          $LogFile = Join-Path $LogDir 'guard.log'
          $TaskName = 'AutorunGuard'
          $SelfPath = $MyInvocation.MyCommand.Path

          function Write-Log {
            param([string]$Msg)
            New-Item -ItemType Directory -Path $LogDir -Force | Out-Null
            $stamp = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
            $line = "[${stamp}] $Msg"
            $line | Tee-Object -FilePath $LogFile -Append
          }

          function Disable-AutorunPolicy {
            Write-Log "Applying OS policy to disable AutoRun/AutoPlay"
            $paths = @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer',
              'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
            )
            foreach ($p in $paths) {
              New-Item -Path $p -Force | Out-Null
              New-ItemProperty -Path $p -Name 'NoDriveTypeAutoRun' -Value 255 -PropertyType DWord -Force | Out-Null
              New-ItemProperty -Path $p -Name 'NoAutorun'           -Value 1   -PropertyType DWord -Force | Out-Null
              New-ItemProperty -Path $p -Name 'HonorAutorunSetting' -Value 1   -PropertyType DWord -Force | Out-Null
            }
            Write-Log "Policy applied"
          }

          function Enable-AutorunPolicyDefault {
            Write-Log "Restoring AutoRun policy to Windows defaults (partial)"
            $paths = @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer',
              'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
            )
            foreach ($p in $paths) {
              if (Test-Path $p) {
                Remove-ItemProperty -Path $p -Name 'NoAutorun' -ErrorAction SilentlyContinue
                Remove-ItemProperty -Path $p -Name 'HonorAutorunSetting' -ErrorAction SilentlyContinue
                # Remove-ItemProperty -Path $p -Name 'NoDriveTypeAutoRun' -ErrorAction SilentlyContinue
              }
            }
            Write-Log "Policy restored"
          }

          function Get-RemovableVolumes {
            Get-Volume | Where-Object { $_.DriveLetter -and ($_.DriveType -in 'Removable','CD-ROM') }
          }

          function Parse-AutorunTargets {
            param([string]$AutorunPath)
            $targets = @()
            if (-not (Test-Path $AutorunPath)) { return $targets }
            $text = Get-Content -LiteralPath $AutorunPath -Raw -ErrorAction SilentlyContinue
            if (-not $text) { return $targets }
            $regexes = @(
              '^\s*open\s*=\s*(.+)$',
              '^\s*shellexecute\s*=\s*(.+)$',
              '^\s*shell\\open\\command\s*=\s*(.+)$'
            )
            foreach ($rx in $regexes) {
              [regex]::Matches($text, $rx, 'IgnoreCase, Multiline') | ForEach-Object {
                $cmd = ($_.Groups[1].Value).Trim('"'' ').Split()[0]
                if ($cmd) { $targets += $cmd }
              }
            }
            $targets | Select-Object -Unique
          }

          function Quarantine-Item {
            param([string]$PathToQuarantine, [string]$Root)
            try {
              if (-not (Test-Path $PathToQuarantine)) { return }
              $qdir = Join-Path $LogDir "quarantine\$((Get-Date).ToString('yyyyMMdd_HHmmss'))"
              New-Item -ItemType Directory -Path $qdir -Force | Out-Null
              $dest = Join-Path $qdir ((Resolve-Path $PathToQuarantine).ProviderPath -replace "[:\\\/]", '_')
              Move-Item -LiteralPath $PathToQuarantine -Destination $dest -Force
              Write-Log "Quarantined: $PathToQuarantine -> $dest"
            } catch {
              Write-Log "Quarantine failed: $PathToQuarantine ($($_.Exception.Message))"
            }
          }

          function Protect-Drive {
            param([string]$DriveRoot)
            $root = $DriveRoot
            if (-not (Test-Path $root)) { return }

            $autorunPath = Join-Path $root 'autorun.inf'
            if (Test-Path $autorunPath -PathType Leaf) {
              Write-Log "Found autorun.inf (file) on $root"
              $targets = Parse-AutorunTargets -AutorunPath $autorunPath
              if ($targets.Count -gt 0) {
                foreach ($t in $targets) {
                  $candidate = if ([System.IO.Path]::IsPathRooted($t)) { $t } else { Join-Path $root $t }
                  if (Test-Path $candidate) { Quarantine-Item -PathToQuarantine $candidate -Root $root }
                }
              }
              Quarantine-Item -PathToQuarantine $autorunPath -Root $root
            }

            try {
              $testFile = Join-Path $root ".writetest_$([Guid]::NewGuid().ToString('N')).tmp"
              New-Item -Path $testFile -ItemType File -Force -ErrorAction Stop | Out-Null
              Remove-Item -LiteralPath $testFile -Force -ErrorAction SilentlyContinue

              if (-not (Test-Path $autorunPath)) {
                New-Item -ItemType Directory -Path $autorunPath -Force | Out-Null
                attrib +h +s $autorunPath 2>$null
                Write-Log "Created lock directory: $autorunPath"
              } elseif ((Get-Item $autorunPath).PSIsContainer -eq $true) {
                attrib +h +s $autorunPath 2>$null
                Write-Log "Lock directory already in place: $autorunPath"
              }
            } catch {
              Write-Log "Drive seems read-only or not writable: $root"
            }
          }

          function Initial-Sweep {
            $vols = Get-RemovableVolumes
            if (-not $vols) { Write-Log "No removable/CD volumes detected."; return }
            foreach ($v in $vols) {
              $root = "$($v.DriveLetter):\"
              Write-Log "Scanning: $root"
              Protect-Drive -DriveRoot $root
            }
          }

          function Install-Task {
            Write-Log "Registering scheduled task: AutorunGuard"
            $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument "-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File `"$SelfPath`""
            $trigger = New-ScheduledTaskTrigger -AtLogOn
            Register-ScheduledTask -TaskName 'AutorunGuard' -Action $action -Trigger $trigger -RunLevel Highest -Force | Out-Null
            Write-Log "Scheduled task installed."
          }

          function Uninstall-Task {
            if (Get-ScheduledTask -TaskName 'AutorunGuard' -ErrorAction SilentlyContinue) {
              Unregister-ScheduledTask -TaskName 'AutorunGuard' -Confirm:$false
              Write-Log "Scheduled task removed: AutorunGuard"
            }
          }

          function Start-EventLoop {
            $query = "SELECT * FROM Win32_VolumeChangeEvent WHERE EventType = 2"
            Register-WmiEvent -Query $query -SourceIdentifier 'AutorunGuard' | Out-Null
            Write-Log "Event watcher started (device arrival)."
            while ($true) {
              $e = Wait-Event -SourceIdentifier 'AutorunGuard'
              try {
                $drive = $e.SourceEventArgs.NewEvent.DriveName
                if ($drive -and (Test-Path $drive)) {
                  Write-Log "Volume arrival: $drive"
                  Protect-Drive -DriveRoot $drive
                } else {
                  Initial-Sweep
                }
              } catch {
                Write-Log "Event handling error: $($_.Exception.Message)"
              } finally {
                Remove-Event -EventIdentifier $e.EventIdentifier -ErrorAction SilentlyContinue
              }
            }
          }

          try {
            # 엔트리 포인트
            if ($Install) {
              Disable-AutorunPolicy
              Install-Task
              Initial-Sweep
              Write-Log "Install completed."
              exit 0
            }
            if ($Uninstall) {
              Uninstall-Task
              Enable-AutorunPolicyDefault
              Write-Log "Uninstall completed."
              exit 0
            }
            if ($Once) {
              Initial-Sweep
              exit 0
            }
            Initial-Sweep
            Start-EventLoop
          }
          catch {
            Write-Log "Fatal error: $($_.Exception.Message)"
            throw
          }
          '@ | Set-Content -Encoding UTF8 -Path $dstRepo

          Copy-Item -Force $dstRepo $dstTools
          Write-Host "[ECHO] Script generated at:"
          Write-Host " - Repo:  $dstRepo"
          Write-Host " - Tools: $dstTools"

      - name: 🧪 Syntax check (PowerShell)
        shell: pwsh
        run: |
          $script = Join-Path $PWD 'scripts\AutorunGuard.ps1'
          pwsh -NoProfile -Command "Get-Command -Name $script | Out-Null; Write-Host '[OK] parsed'"

      - name: ▶️ Test run (-Once)
        shell: pwsh
        run: |
          $script = Join-Path $PWD 'scripts\AutorunGuard.ps1'
          if ("${{ github.event.inputs.run_mode }}" -eq "install") {
            # 호스트 러너는 일회성 VM이라 스케줄 등록만 시도 후 즉시 Once
            powershell -NoProfile -ExecutionPolicy Bypass -File $script -Install
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File $script -Once
          Get-Content "C:\ProgramData\AutorunGuard\guard.log" -ErrorAction SilentlyContinue | Select-Object -Last 200

      - name: 📦 Package & upload artifact (zip)
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'autorunguard-package'
          New-Item -Force -ItemType Directory -Path $out | Out-Null
          Copy-Item -Force "scripts\AutorunGuard.ps1" $out
          Set-Content -Encoding UTF8 -Path (Join-Path $out 'README.txt') -Value @"
          AutorunGuard 배포 패키지

          설치(관리자 PowerShell):
            Set-ExecutionPolicy Bypass -Scope Process -Force
            .\AutorunGuard.ps1 -Install

          1회 점검:
            .\AutorunGuard.ps1 -Once

          제거:
            .\AutorunGuard.ps1 -Uninstall
          "@
          Compress-Archive -Path "$out\*" -DestinationPath "$PWD\autorunguard.zip" -Force
        # v4 업로드 사용 (v3 deprecated)
      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autorunguard
          path: |
            autorunguard.zip
            scripts/AutorunGuard.ps1
            C:/ProgramData/AutorunGuard/guard.log
          if-no-files-found: warn
