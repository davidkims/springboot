name: 🐬 Full MySQL Workflow with Retry, Healthcheck, Export

on:
  workflow_dispatch:

jobs:
  mysql-job:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass123
          MYSQL_DATABASE: sample_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🕒 Wait for MySQL Healthcheck & Retry
        run: |
          echo "[🕒] Waiting for MySQL to accept connections..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -prootpass123 --silent; then
              echo "[✔] MySQL is ready!"
              exit 0
            fi
            echo "[..] MySQL not ready (attempt $i), retrying..."
            sleep 2
          done
          echo "[❌] MySQL failed to start within 60 seconds"
          docker logs $(docker ps -q --filter "ancestor=mysql:8.0")
          exit 1

      - name: 📄 Generate init.sql (echo 방식)
        run: |
          mkdir -p sql
          echo "[📄] Creating init.sql..."

          echo "USE sample_db;" > sql/init.sql

          echo "CREATE TABLE IF NOT EXISTS users (" >> sql/init.sql
          echo "  id INT AUTO_INCREMENT PRIMARY KEY," >> sql/init.sql
          echo "  name VARCHAR(100) NOT NULL" >> sql/init.sql
          echo ");" >> sql/init.sql
          echo "INSERT INTO users (name) VALUES ('Alice'), ('Bob'), ('Charlie');" >> sql/init.sql
          echo "" >> sql/init.sql

          echo "CREATE TABLE IF NOT EXISTS customers (" >> sql/init.sql
          echo "  customer_id INT AUTO_INCREMENT PRIMARY KEY," >> sql/init.sql
          echo "  customer_name VARCHAR(100) NOT NULL," >> sql/init.sql
          echo "  registered_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP" >> sql/init.sql
          echo ");" >> sql/init.sql
          echo "INSERT INTO customers (customer_name) VALUES ('Alice'), ('Bob'), ('David');" >> sql/init.sql

          echo "[✔] init.sql created:"
          cat sql/init.sql

      - name: ⚙️ Run Migration with Logging
        run: |
          echo "[⚙️] Installing MySQL client"
          sudo apt-get update && sudo apt-get install -y mysql-client

          echo "[⚙️] Applying migration script..."
          if ! mysql -h 127.0.0.1 -P 3306 -u root -prootpass123 < sql/init.sql; then
            echo "[❌] Migration failed. Dumping logs:"
            docker logs $(docker ps -q --filter "ancestor=mysql:8.0")
            exit 1
          fi
          echo "[✔] Migration completed"

      - name: 🔍 Run Queries (COUNT, GROUP BY, JOIN)
        run: |
          echo "[🔍] SELECT COUNT FROM users"
          mysql -h 127.0.0.1 -u root -prootpass123 -D sample_db -e "SELECT COUNT(*) AS user_count FROM users;"

          echo "[🔍] SELECT COUNT FROM customers"
          mysql -h 127.0.0.1 -u root -prootpass123 -D sample_db -e "SELECT COUNT(*) AS customer_count FROM customers;"

          echo "[🔍] GROUP BY customer_name"
          mysql -h 127.0.0.1 -u root -prootpass123 -D sample_db -e "SELECT customer_name, COUNT(*) AS count FROM customers GROUP BY customer_name;"

          echo "[🔍] INNER JOIN users ↔ customers"
          mysql -h 127.0.0.1 -u root -prootpass123 -D sample_db -e \
            "SELECT u.name AS user_name, c.customer_name FROM users u INNER JOIN customers c ON u.name = c.customer_name;"

      - name: 📤 Export customers to CSV
        run: |
          mkdir -p export
          echo "[📤] Exporting customers to CSV..."
          echo "customer_id,customer_name,registered_at" > export/customers.csv
          mysql -h 127.0.0.1 -u root -prootpass123 -D sample_db -B -e \
            "SELECT customer_id, customer_name, registered_at FROM customers;" \
            | tail -n +2 >> export/customers.csv
          echo "[✔] CSV Export Done"
          cat export/customers.csv

      - name: 📁 Upload CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: customers-csv
          path: export/customers.csv
