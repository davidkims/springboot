name: ♾️ Transfer Log Backup - Cron (60건 Infinite)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  transfer_log_backup:
    runs-on: ubuntu-latest

    env:
      TRANSFER_LOG_DIR: /opt/logs/transfer
      BACKUP_DIR: /opt/backup/transfer

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 📁 Prepare directories
        run: |
          echo "[📁] Creating directories: $TRANSFER_LOG_DIR and $BACKUP_DIR"
          sudo mkdir -p "$TRANSFER_LOG_DIR"
          sudo mkdir -p "$BACKUP_DIR"
          echo "[🔐] Setting permissions to 777"
          sudo chmod -R 777 "$TRANSFER_LOG_DIR" "$BACKUP_DIR"
          echo "[✔️] Directories ready."

      - name: 💾 Generate 60 corporate transfer logs
        run: |
          echo "[🕒] Generating 60 corporate transfer logs..."
          echo "[🧹] Cleaning up existing logs in $TRANSFER_LOG_DIR"
          sudo rm -f "$TRANSFER_LOG_DIR"/*.txt || echo "[ℹ️] No existing logs to clean."

          for i in $(seq 1 60); do
            TS_HUMAN=$(date +'%Y-%m-%d %H:%M:%S')
            AMOUNT=$((RANDOM % 900000 + 100000))
            LOG="[TRANSFER] $TS_HUMAN | 기업거래ID:$i | 송금금액:₩${AMOUNT} 완료 | 계좌:110-123-4567$(printf '%02d' $i)"
            if ! echo "$LOG" | sudo tee "$TRANSFER_LOG_DIR/transfer-log-$i.txt" >/dev/null; then
              echo "[❌] Failed to write transfer-log-$i.txt"
            fi
          done
          echo "[✔️] All transfer logs generated."

      - name: 📦 Backup logs into timestamped folder
        id: backup
        run: |
          TS_FOLDER=$(date +'%Y%m%d_%H%M%S')
          echo "ts_folder=$TS_FOLDER" >> $GITHUB_OUTPUT
          DEST="${{ env.BACKUP_DIR }}/$TS_FOLDER"
          echo "[📦] Creating backup folder: $DEST"
          sudo mkdir -p "$DEST"
          echo "[📄] Copying logs to backup..."
          sudo cp "${{ env.TRANSFER_LOG_DIR }}"/*.txt "$DEST/" || echo "[⚠️] No logs to copy."
          echo "[✅] Backup complete at: $DEST"

      - name: 📤 Upload generated logs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: transfer-logs-${{ steps.backup.outputs.ts_folder }}
          path: ${{ env.TRANSFER_LOG_DIR }}/*.txt

      - name: 📤 Upload backup folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: transfer-backup-${{ steps.backup.outputs.ts_folder }}
          path: ${{ env.BACKUP_DIR }}/${{ steps.backup.outputs.ts_folder }}

      - name: 📂 Show recent backup state
        run: |
          echo "[🧾] Showing backup directory structure..."
          sudo apt-get update && sudo apt-get install -y tree
          tree ${{ env.BACKUP_DIR }} -L 2 || echo "[⚠️] tree command failed"
