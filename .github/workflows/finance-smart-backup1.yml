name: 🧠 MEGA EMAILOPS + SMTP + MONITORING + VIRUS + FULL ECHO

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

env:
  BASE: /opt/email
  MONO: /opt/email/.monitoring
  DOMAIN: example.local
  SERVICES: postfix exim4 opensmtpd mailhog maildev mailcatcher smtp4dev
  USER_COUNT: 200
  TEST_COUNT: 5
  INF_BUCKET: metrics
  INF_ORG: org
  INF_USER: admin
  INF_PASS: admin1234!
  INF_TOKEN: dev-token-123456

jobs:
  mega-emailops:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 📁 전체 디렉토리 및 권한 설정
      run: |
        set -Eeuo pipefail
        mkdir -p "$BASE" "$MONO"
        chmod -R 755 "$BASE" "$MONO"
        echo "echo '[ECHO] BASE 디렉토리 및 권한 생성 완료'" >> .github/echo_dirs/init_dirs.sh
        bash .github/echo_dirs/init_dirs.sh || true

    - name: 🐧 바이러스 프로그램 설치 (ClamAV + YARA)
      run: |
        sudo apt-get update || true
        sudo apt-get install -y clamav clamav-daemon yara || true
        sudo systemctl stop clamav-freshclam || true
        sudo freshclam || true
        sudo systemctl start clamav-daemon || true
        echo "echo '[ECHO] 바이러스 검사 도구 설치 완료'" >> .github/echo_virus/install_virus.sh
        bash .github/echo_virus/install_virus.sh || true

    - name: 🛠️ 초대량 서비스별 디렉토리/DLL/유저/마이그레이션/로그 수집/바이러스 검사 에코 생성
      run: |
        bash .github/scripts/emailops_massive_echo.sh || true

    - name: ✉️ SMTP 테스트 이메일 전송
      run: |
        bash .github/scripts/emailops_sendmail.sh || true

    - name: 📊 Grafana 대시보드 생성
      run: |
        bash .github/scripts/grafana_dashboard_gen.sh || true

    - name: 🐳 docker-compose 설정 및 실행
      run: |
        sudo apt-get install -y docker-compose || true
        bash .github/echo_compose/docker_compose.sh || true

    - name: 🪵 구조 스냅샷 로그 저장
      run: |
        mkdir -p .github/echo_logs
        tree -a "$BASE" > .github/echo_logs/tree_email.txt || true
        tree -a "$MONO" > .github/echo_logs/tree_monitoring.txt || true
        echo "echo '[ECHO] 트리 구조 저장 완료'" >> .github/echo_logs/tree_snapshot.sh
        bash .github/echo_logs/tree_snapshot.sh || true
