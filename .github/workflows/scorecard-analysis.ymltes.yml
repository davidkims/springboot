name: 🛡️ OpenSSF Scorecard Analysis (Docker Only)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read
  security-events: write
  actions: read

env:
  TARGET_REPO: davidkims/springboot
  OUT_DIR: .github/scorecard

jobs:
  run-scorecard:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout repository
        uses: actions/checkout@v4

      - name: 📂 Prepare output directory
        run: |
          echo "[+] Creating directory: $OUT_DIR"
          mkdir -p $OUT_DIR

      - name: 🧪 Run Scorecard (Docker)
        run: |
          echo "[+] Running Scorecard (Docker)"
          docker run --rm \
            -v "$(pwd)":/repo \
            gcr.io/openssf/scorecard:stable \
            --repo=https://github.com/${TARGET_REPO} \
            --format=json --show-details > $OUT_DIR/scorecard-report.json
          echo "[✔] JSON report created"

      - name: 📄 Extract summary (scorecard-summary.json)
        run: |
          jq '[.checks[] | {name, score, reason}]' $OUT_DIR/scorecard-report.json > $OUT_DIR/scorecard-summary.json
          echo "[✔] Summary created"

      - name: 📦 Generate SARIF
        run: |
          docker run --rm \
            -v "$(pwd)":/repo \
            gcr.io/openssf/scorecard:stable \
            --repo=https://github.com/${TARGET_REPO} \
            --format=sarif > $OUT_DIR/scorecard-results.sarif
          echo "[✔] SARIF file created"

      - name: 📊 Upload SARIF (Code Scanning)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.OUT_DIR }}/scorecard-results.sarif
