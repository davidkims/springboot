name: "🏢 Spring Boot + Maven MegaOps (DB + Middleware + Echo FullOps)"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 C/C Pack 및 보안 산출물 생성

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [h2, mysql, mariadb, postgres, oracle, mssql, cassandra, redis, mongodb, kafka]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: demo
          MYSQL_USER: demo
          MYSQL_PASSWORD: demopass
        ports: ["3306:3306"]

      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: demo
          MARIADB_USER: demo
          MARIADB_PASSWORD: demopass
        ports: ["3307:3306"]

      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demopass
          POSTGRES_DB: demo
        ports: ["5432:5432"]

      oracle:
        image: gvenzl/oracle-xe:21-slim
        env:
          ORACLE_PASSWORD: demopass
          APP_USER: demo
          APP_USER_PASSWORD: demopass
        ports: ["1521:1521"]

      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "Strong!Passw0rd"
        ports: ["1433:1433"]

      cassandra:
        image: cassandra:4.1
        ports: ["9042:9042"]

      redis:
        image: redis:7
        ports: ["6379:6379"]

      mongodb:
        image: mongo:6
        ports: ["27017:27017"]

      kafka:
        image: bitnami/kafka:3.7.0
        env:
          KAFKA_CFG_ZOOKEEPER_CONNECT: localhost:2181
          ALLOW_PLAINTEXT_LISTENER: "yes"
        ports: ["9092:9092"]

    steps:
      - uses: actions/checkout@v4

      - name: Ensure Echo Directories
        run: |
          set -Eeuo pipefail
          mkdir -p .github/echo/logs .github/echo/out site/echo
          echo "[ECHO] Directories ready: logs/out/site"

      - name: Scaffold Spring Boot project if missing
        run: |
          set -Eeuo pipefail
          if [ ! -f pom.xml ]; then
            echo "[ECHO][WARN] pom.xml missing → scaffolding Spring Boot project"
            curl -fsSL "https://start.spring.io/starter.zip?type=maven-project&language=java&groupId=com.example&artifactId=demo&name=demo&packageName=com.example.demo&javaVersion=21&dependencies=web,data-jpa,security,actuator,lombok" \
              -o starter.zip
            unzip -q starter.zip -d scaffold
            cp -r scaffold/* .
            echo "[ECHO][OK] Spring Boot scaffold generated"
          fi

      - name: Scaffold application.yml per service
        run: |
          set -Eeuo pipefail
          mkdir -p src/main/resources
          case "${{ matrix.service }}" in
            mysql)
              cat > src/main/resources/application.yml <<'YML'
              spring.datasource.url=jdbc:mysql://localhost:3306/demo
              spring.datasource.username=demo
              spring.datasource.password=demopass
              spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
              spring.jpa.hibernate.ddl-auto=update
              YML
              ;;
            mariadb)
              cat > src/main/resources/application.yml <<'YML'
              spring.datasource.url=jdbc:mariadb://localhost:3307/demo
              spring.datasource.username=demo
              spring.datasource.password=demopass
              spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
              spring.jpa.hibernate.ddl-auto=update
              YML
              ;;
            postgres)
              cat > src/main/resources/application.yml <<'YML'
              spring.datasource.url=jdbc:postgresql://localhost:5432/demo
              spring.datasource.username=demo
              spring.datasource.password=demopass
              spring.datasource.driver-class-name=org.postgresql.Driver
              spring.jpa.hibernate.ddl-auto=update
              YML
              ;;
            oracle)
              cat > src/main/resources/application.yml <<'YML'
              spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
              spring.datasource.username=demo
              spring.datasource.password=demopass
              spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
              spring.jpa.hibernate.ddl-auto=update
              YML
              ;;
            mssql)
              cat > src/main/resources/application.yml <<'YML'
              spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=master
              spring.datasource.username=SA
              spring.datasource.password=Strong!Passw0rd
              spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
              spring.jpa.hibernate.ddl-auto=update
              YML
              ;;
            cassandra)
              cat > src/main/resources/application.yml <<'YML'
              spring.data.cassandra.contact-points=localhost
              spring.data.cassandra.port=9042
              spring.data.cassandra.keyspace-name=demo
              spring.data.cassandra.local-datacenter=datacenter1
              YML
              ;;
            redis)
              cat > src/main/resources/application.yml <<'YML'
              spring.data.redis.host=localhost
              spring.data.redis.port=6379
              YML
              ;;
            mongodb)
              cat > src/main/resources/application.yml <<'YML'
              spring.data.mongodb.uri=mongodb://localhost:27017/demo
              YML
              ;;
            kafka)
              cat > src/main/resources/application.yml <<'YML'
              spring.kafka.bootstrap-servers=localhost:9092
              spring.kafka.consumer.group-id=demo-group
              spring.kafka.consumer.auto-offset-reset=earliest
              YML
              ;;
            *)
              cat > src/main/resources/application.yml <<'YML'
              spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
              spring.datasource.driver-class-name=org.h2.Driver
              spring.datasource.username=sa
              spring.jpa.hibernate.ddl-auto=update
              YML
              ;;
          esac
          echo "[ECHO] application.yml scaffolded for ${{ matrix.service }}"

      - name: Build + Test
        run: |
          set -Eeuo pipefail
          mvn -B clean verify -Dspring.profiles.active=${{ matrix.service }} | tee .github/echo/logs/build_${{ matrix.service }}.log

      - name: Generate SBOM + Security Files
        if: ${{ matrix.service == 'mysql' }}
        run: |
          set -Eeuo pipefail
          mkdir -p .github/echo/out
          mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
          sha256sum target/*.jar > .github/echo/out/checksums.txt
          echo "[ECHO] SBOM + checksums created"

      - name: Generate Echo C/C Pack
        if: ${{ matrix.service == 'mysql' }}
        run: |
          set -Eeuo pipefail
          mkdir -p .github/echo/cc_pack
          TS=$(date +%Y%m%d%H%M%S)
          echo "/* Enterprise C compliance file */" > .github/echo/cc_pack/cc_${TS}.c
          echo "// Enterprise H compliance file" > .github/echo/cc_pack/cc_${TS}.h
          tar -C .github/echo/cc_pack -czf .github/echo/cc_pack/cc-pack_${TS}.tar.gz .
          echo "[ECHO] Echo C/C Pack generated and archived"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.service }}-${{ github.run_id }}
          path: |
            target/*.jar
            .github/echo/**
