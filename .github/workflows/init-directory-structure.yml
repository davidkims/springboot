name: 📁 Auto Update Slot Directory & PR

on:
  workflow_dispatch:
  push:
    paths:
      - 'disk/slot-001/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-slot-directory:
    runs-on: ubuntu-latest

    steps:
      - name: 📅 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 📂 Ensure slot-latest symbolic link
        run: |
          echo "[+] Updating symlink slot-latest -> slot-001"
          rm -rf disk/slot-latest
          ln -s slot-001 disk/slot-latest
          ls -l disk/

      - name: 🔢 Create Pull Request for Slot Update
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "📆 Auto update: slot-001 and symbolic link"
          branch: slot-update-slot-001
          title: "📆 Update: disk/slot-001 and symbolic link"
          body: |
            This PR contains:
            - Updates to `disk/slot-001` directory
            - Updated `disk/slot-latest` symlink
            - Auto-generated by GitHub Actions
          delete-branch: true
