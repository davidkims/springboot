name: "🔐 MEGA Secure CI + AutoUP + EchoOps + Pages + Backups + Security (ULTRA)"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/1 * * * *"  # 매 1분

permissions:
  contents: write
  pull-requests: write
  id-token: write
  security-events: write
  pages: write

jobs:
  mega-secure-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DB_USER: root
      DB_PASS: rootpass123
      DB_NAME: sample_db
      SPARK_VERSION: "3.5.1"
      VAULT_VERSION: "1.15.2"

    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    # 0) 전역 에코 디렉토리/파일/템플릿/권한/로그 구조 선생성 (누락 방지)
    - name: 📁 Echo 디렉토리/파일 선생성 (No missing file)
      shell: bash
      run: |
        set -Eeuo pipefail
        exec > >(tee .github/echo_logs/00_create_dirs.log) 2>&1

        # 대량 디렉토리
        mapfile -t DIRS <<'LIST'
        .github/scripts
        .github/firewall
        .github/downloads
        .github/permissions
        .github/services/mysql
        .github/services/postgres
        .github/services/redis
        .github/echo_logs
        .github/echo_accounts
        .github/echo_services
        .github/echo_containers
        .github/echo_templates
        .github/echo_scorecard
        .github/echo_codeql
        .github/echo_security
        .github/echo_upgrade
        .github/echo_autoup
        .github/echo_pages
        .github/echo_backup
        .github/echo_monitoring
        .github/echo_db
        site/scorecard
        site/security
        site/upgrade
        site/pr
        site/backup
        site/html
        site/containers
        site/logs
        site/templates
        site/downloads
        site/db_backup_html
        site/accounts
        LIST

        for d in "${DIRS[@]}"; do
          mkdir -p "$d"
          echo "[ECHO] 디렉토리 생성: $d"
        done

        # 공통 권한 스크립트
        cat > .github/permissions/chmod_all.sh <<'SH'
        #!/usr/bin/env bash
        set -Eeuo pipefail
        chmod -R 755 .github || true
        SH
        chmod +x .github/permissions/chmod_all.sh

        # 템플릿 README
        cat > .github/echo_templates/README.txt <<'TXT'
        [ECHO] 이 디렉토리는 모든 자동 생성 스크립트/샘플 .env/.cfg/.json 템플릿을 보관합니다.
        TXT

        echo "[ECHO] 기본 구조 생성 완료"

    # 1) 가상 계정/비밀번호, 서비스별 ENV/CSV 에코 생성
    - name: 🔐 가상 계정·비밀번호 대량 생성 (에코/파일 출력)
      shell: bash
      run: |
        set -Eeuo pipefail
        exec > >(tee .github/echo_logs/01_accounts.log) 2>&1
        gen() { openssl rand -hex 12; }
        MYSQL_APP_USER="appuser";    MYSQL_APP_PASS="$(gen)"
        POSTGRES_APP_USER="pguser";  POSTGRES_APP_PASS="$(gen)"
        REDIS_PASS="$(gen)"
        VAULT_DEV_TOKEN="root-$(gen)"

        {
          echo "service,username,password_or_token"
          echo "mysql,root,${DB_PASS}"
          echo "mysql,${MYSQL_APP_USER},${MYSQL_APP_PASS}"
          echo "postgres,postgres,${DB_PASS}"
          echo "postgres,${POSTGRES_APP_USER},${POSTGRES_APP_PASS}"
          echo "redis,default,${REDIS_PASS}"
          echo "vault,root_token,${VAULT_DEV_TOKEN}"
        } | tee site/accounts/accounts.csv > .github/echo_accounts/accounts.csv

        cat > site/templates/mysql.env <<EOF
        MYSQL_ROOT_PASSWORD=${DB_PASS}
        MYSQL_DATABASE=${DB_NAME}
        MYSQL_APP_USER=${MYSQL_APP_USER}
        MYSQL_APP_PASS=${MYSQL_APP_PASS}
        EOF

        cat > site/templates/postgres.env <<EOF
        POSTGRES_PASSWORD=${DB_PASS}
        POSTGRES_DB=${DB_NAME}
        POSTGRES_APP_USER=${POSTGRES_APP_USER}
        POSTGRES_APP_PASS=${POSTGRES_APP_PASS}
        EOF

        cat > site/templates/redis.env <<EOF
        REDIS_PASSWORD=${REDIS_PASS}
        EOF

        cat > site/templates/vault.env <<EOF
        VAULT_DEV_ROOT_TOKEN_ID=${VAULT_DEV_TOKEN}
        VAULT_ADDR=http://127.0.0.1:8200
        EOF

        {
          echo "email,service,username,password"
          echo "app@local.test,mysql,${MYSQL_APP_USER},${MYSQL_APP_PASS}"
          echo "app@local.test,postgres,${POSTGRES_APP_USER},${POSTGRES_APP_PASS}"
          echo "cache@local.test,redis,default,${REDIS_PASS}"
        } | tee site/accounts/virtual_emails.csv

        echo "[ECHO] 계정/비밀번호/토큰 템플릿 생성 완료"

    # 2) 서비스 초기화 파일 (heredoc, 따옴표 안전) 생성
    - name: 🧩 서비스 파일 생성 (MySQL/PG/Redis) - heredoc 안전
      shell: bash
      run: |
        set -Eeuo pipefail
        exec > >(tee .github/echo_logs/02_service_files.log) 2>&1

        # MySQL init.sql (idempotent)
        cat > .github/echo_services/mysql_init.sh <<'SH'
        #!/usr/bin/env bash
        set -Eeuo pipefail
        cat > .github/services/mysql/init.sql <<'SQL'
        CREATE DATABASE IF NOT EXISTS sample_db;
        CREATE TABLE IF NOT EXISTS sample_db.test (id INT PRIMARY KEY, val VARCHAR(64));
        INSERT INTO sample_db.test VALUES (1,"hello"),(2,"world")
          ON DUPLICATE KEY UPDATE val=VALUES(val);
        SQL
        echo "[ECHO] MySQL init.sql 생성 완료: .github/services/mysql/init.sql"
        SH
        chmod +x .github/echo_services/mysql_init.sh
        bash .github/echo_services/mysql_init.sh

        # Postgres: DB 생성은 실행 단계에서 조건부 처리 → 파일은 스키마/데이터만
        cat > .github/echo_services/pg_init.sh <<'SH'
        #!/usr/bin/env bash
        set -Eeuo pipefail
        cat > .github/services/postgres/init.sql <<'SQL'
        CREATE TABLE IF NOT EXISTS test (id INT PRIMARY KEY, val VARCHAR(64));
        INSERT INTO test (id,val) VALUES (1,'hello'),(2,'world')
          ON CONFLICT (id) DO UPDATE SET val=EXCLUDED.val;
        SQL
        echo "[ECHO] Postgres init.sql 생성 완료: .github/services/postgres/init.sql"
        SH
        chmod +x .github/echo_services/pg_init.sh
        bash .github/echo_services/pg_init.sh

        # Redis redis.conf
        cat > .github/echo_services/redis_conf.sh <<'SH'
        #!/usr/bin/env bash
        set -Eeuo pipefail
        cat > .github/services/redis/redis.conf <<'CONF'
        protected-mode no
        port 6379
        tcp-keepalive 300
        save 300 10
        appendonly yes
        CONF
        echo "[ECHO] Redis redis.conf 생성 완료: .github/services/redis/redis.conf"
        SH
        chmod +x .github/echo_services/redis_conf.sh
        bash .github/echo_services/redis_conf.sh

        echo "[ECHO] 서비스 파일 생성 완료"

    # 3) 도구/보안툴 설치
    - name: 🔧 기본 패키지 & Python 보안툴
      shell: bash
      run: |
        set -Eeuo pipefail
        exec > >(tee .github/echo_logs/03_pkgs.log) 2>&1
        sudo apt-get update -y
        sudo apt-get install -y jq curl unzip tar git mysql-client postgresql-client default-jdk scala
        python3 -m pip install --upgrade pip
        pip install --no-cache-dir bandit pip-audit

    - name: 🐳 Docker 설치 (containerd 충돌 우회)
      shell: bash
      run: |
        set -Eeuo pipefail
        exec > >(tee .github/echo_logs/04_docker_install.log) 2>&1
        if ! command -v docker >/dev/null 2>&1; then
          curl -fsSL https://get.docker.com | sh
        fi
        sudo usermod -aG docker "$USER" || true
        docker --version | tee .github/echo_logs/docker_version.txt

    - name: 🛡️ Trivy & Scorecard 설치(안전)
      shell: bash
      run: |
        set -Eeuo pipefail
        exec > >(tee .github/echo_logs/05_security_tools.log) 2>&1
        curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b /usr/local/bin
        trivy --version | tee .github/echo_logs/trivy_version.txt

        VER="4.10.3"
        curl -sLO "https://github.com/ossf/scorecard/releases/download/v${VER}/scorecard_${VER}_linux_amd64.tar.gz"
        tar -xzf "scorecard_${VER}_linux_amd64.tar.gz"
        BIN="$(find . -type f -name scorecard | head -n1 || true)"
        if [ -z "$BIN" ]; then echo "::error ::Scorecard binary not found"; exit 1; fi
        sudo mv "$BIN" /usr/local/bin/scorecard && chmod +x /usr/local/bin/scorecard
        scorecard --version | tee .github/echo_logs/scorecard_version.txt

    - name: 🧪 Apache Spark 설치 (에코 로그)
      shell: bash
      run: |
        set -Eeuo pipefail
        exec > >(tee .github/echo_logs/06_spark_install.log) 2>&1
        curl -sSLO "https://downloads.apache.org/spark/spark-${SPARK_VERSION}/spark-${SPARK_VERSION}-bin-hadoop3.tgz"
        tar xzf "spark-${SPARK_VERSION}-bin-hadoop3.tgz"
        sudo mv "spark-${SPARK_VERSION}-bin-hadoop3" /opt/spark
        echo "PATH=/opt/spark/bin:$PATH" >> "$GITHUB_ENV"
        echo "[ECHO] Spark ${SPARK_VERSION} 설치 완료"

    # 4) 컨테이너 이미지 pull/실행 스크립트를 '에코로 생성' 후 실행
    - name: 🐳 컨테이너 Pull/Run 스크립트 에코 생성 + 실행
      shell: bash
      run: |
        set -Eeuo pipefail
        exec > >(tee .github/echo_logs/07_containers.log) 2>&1
        source site/templates/mysql.env
        source site/templates/postgres.env
        source site/templates/redis.env
        source site/templates/vault.env

        # pull.sh
        cat > .github/echo_containers/pull.sh <<'SH'
        #!/usr/bin/env bash
        set -Eeuo pipefail
        declare -A IMGS=(
          [mysql]="mysql:8.0.37"
          [postgres]="postgres:16.3"
          [redis]="redis:7.2.5"
          [kafka]="bitnami/kafka:3.7.0"
          [vault]="vault:__VAULT_VERSION__"
          [spark-svc]="bitnami/spark:3.5.1"
          [camunda]="camunda/camunda-bpm-platform:run-7.21.0"
        )
        for n in "${!IMGS[@]}"; do
          img="${IMGS[$n]}"
          echo "[IMAGE] pull $img"
          docker pull "$img" || true
        done
        SH
        sed -i "s#__VAULT_VERSION__#${VAULT_VERSION}#g" .github/echo_containers/pull.sh
        chmod +x .github/echo_containers/pull.sh
        .github/echo_containers/pull.sh

        # run.sh
        cat > .github/echo_containers/run.sh <<'SH'
        #!/usr/bin/env bash
        set -Eeuo pipefail
        docker rm -f mysql_ci postgres_ci redis_ci kafka_ci vault_ci spark_ci camunda_ci >/dev/null 2>&1 || true

        docker run -d --name mysql_ci \
          -e MYSQL_ROOT_PASSWORD="${MYSQL_ROOT_PASSWORD}" \
          -p 3306:3306 mysql:8.0.37

        docker run -d --name postgres_ci \
          -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
          -p 5432:5432 postgres:16.3

        docker run -d --name redis_ci -p 6379:6379 redis:7.2.5 \
          redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"

        docker run -d --name kafka_ci -p 9092:9092 bitnami/kafka:3.7.0

        docker run -d --name vault_ci -p 8200:8200 \
          -e VAULT_DEV_ROOT_TOKEN_ID="${VAULT_DEV_ROOT_TOKEN_ID}" \
          -e VAULT_ADDR="http://0.0.0.0:8200" \
          vault:__VAULT_VERSION__ server -dev -dev-root-token-id="${VAULT_DEV_ROOT_TOKEN_ID}"

        docker run -d --name spark_ci -p 7077:7077 bitnami/spark:3.5.1
        docker run -d --name camunda_ci -p 8081:8080 camunda/camunda-bpm-platform:run-7.21.0
        SH
        sed -i "s#__VAULT_VERSION__#${VAULT_VERSION}#g" .github/echo_containers/run.sh
        chmod +x .github/echo_containers/run.sh
        .github/echo_containers/run.sh

        # health.sh
        cat > .github/echo_containers/health.sh <<'SH'
        #!/usr/bin/env bash
        set -Eeuo pipefail
        for c in mysql_ci postgres_ci redis_ci kafka_ci vault_ci spark_ci camunda_ci; do
          st="$(docker inspect --format='{{.State.Status}}' "$c" 2>/dev/null || echo unknown)"
          if [ "$st" != "running" ]; then
            echo "[HEALTH] $c: $st → restart"
            docker restart "$c" || true
          else
            echo "[HEALTH] $c: OK"
          fi
        done
        SH
        chmod +x .github/echo_containers/health.sh
        .github/echo_containers/health.sh

    # 5) init 적용 + 시드 + 백업 + HTML 변환 (모두 에코/재시도)
    - name: 🚀 Apply service init + seed + backup (echo, retry)
      shell: bash
      env:
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        POSTGRES_HOST: 127.0.0.1
        POSTGRES_PORT: 5432
        REDIS_PORT: 6379
      run: |
        set -Eeuo pipefail
        exec > >(tee .github/echo_logs/08_apply_and_backup.log) 2>&1

        echo "[ECHO] 준비: 경로/파일 확인"
        mkdir -p site/db_backup_html
        ls -al .github/services || true

        # Redis conf 적용(파일 기반) + requirepass 보강
        source site/templates/redis.env || true
        if ! grep -q '^requirepass ' .github/services/redis/redis.conf 2>/dev/null && [ -n "${REDIS_PASSWORD:-}" ]; then
          echo "requirepass ${REDIS_PASSWORD}" >> .github/services/redis/redis.conf
          echo "[ECHO] redis.conf에 requirepass 추가"
        fi
        docker rm -f redis_ci >/dev/null 2>&1 || true
        REDIS_CONF_PATH="${GITHUB_WORKSPACE}/.github/services/redis/redis.conf"
        docker run -d --name redis_ci -p ${REDIS_PORT}:6379 \
          -v "${REDIS_CONF_PATH}:/usr/local/etc/redis/redis.conf" \
          redis:7.2.5 redis-server /usr/local/etc/redis/redis.conf

        # MySQL 준비 대기 + init.sql 적용
        echo "[ECHO] MySQL 준비 대기"
        for i in {1..30}; do
          if MYSQL_PWD="${DB_PASS}" mysqladmin ping -h "${MYSQL_HOST}" -P "${MYSQL_PORT}" -u"${DB_USER}" --silent; then
            echo "[ECHO] MySQL alive"; break; fi
          sleep 2; [ "$i" -eq 30 ] && echo "::error ::MySQL 대기 시간 초과"
        done
        if [ -f .github/services/mysql/init.sql ]; then
          echo "[ECHO] MySQL init.sql 적용"
          MYSQL_PWD="${DB_PASS}" mysql -h "${MYSQL_HOST}" -P "${MYSQL_PORT}" -u"${DB_USER}" < .github/services/mysql/init.sql
        fi

        # Postgres 준비 대기 + DB 조건부 생성 + init.sql 적용
        echo "[ECHO] Postgres 준비 대기"
        for i in {1..30}; do
          if pg_isready -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" >/dev/null 2>&1; then
            echo "[ECHO] Postgres alive"; break; fi
          sleep 2; [ "$i" -eq 30 ] && echo "::error ::Postgres 대기 시간 초과"
        done
        export PGPASSWORD="${DB_PASS}"
        # DB 없으면 생성
        if ! psql -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${DB_NAME}'" | grep -q 1; then
          psql -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U postgres -c "CREATE DATABASE ${DB_NAME};"
        fi
        # 스키마/데이터 적용
        if [ -f .github/services/postgres/init.sql ]; then
          echo "[ECHO] Postgres init.sql 적용"
          psql -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U postgres -d "${DB_NAME}" -f .github/services/postgres/init.sql
        fi

        # 보너스: health 데이터 보장
        MYSQL_PWD="${DB_PASS}" mysql -h "${MYSQL_HOST}" -P "${MYSQL_PORT}" -u"${DB_USER}" -e "CREATE TABLE IF NOT EXISTS ${DB_NAME}.health (id INT PRIMARY KEY, msg VARCHAR(64)); INSERT IGNORE INTO ${DB_NAME}.health VALUES (1,'ok');" || true
        psql -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U postgres -d "${DB_NAME}" -c "CREATE TABLE IF NOT EXISTS health (id INT PRIMARY KEY, msg TEXT); INSERT INTO health VALUES (1,'ok') ON CONFLICT (id) DO NOTHING;" || true

        # 백업 + HTML 변환
        echo "[ECHO] 백업 시작"
        MYSQL_PWD="${DB_PASS}" mysqldump -h "${MYSQL_HOST}" -P "${MYSQL_PORT}" -u"${DB_USER}" "${DB_NAME}" > site/backup/mysqldump.sql || echo "[WARN] MySQL 백업 실패"
        pg_dump -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U postgres -d "${DB_NAME}" > site/backup/pgdump.sql || echo "[WARN] PostgreSQL 백업 실패"

        for f in site/backup/*; do
          [ -f "$f" ] || continue
          b="$(basename "$f")"
          {
            echo "<html><body><h3>$b</h3><pre>"
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' "$f"
            echo "</pre></body></html>"
          } > "site/db_backup_html/${b}.html"
        done
        echo "[ECHO] 초기화/시드/백업 전체 완료"

    # 6) 보안 스캔 / CodeQL / 업그레이드 / PR / Pages
    - name: 🔎 보안 스캔 (Scorecard / CodeQL / Bandit / pip-audit / Trivy)
      shell: bash
      run: |
        set -Eeuo pipefail
        exec > >(tee .github/echo_logs/09_security_scan.log) 2>&1
        scorecard --repo="https://github.com/${{ github.repository }}" --format sarif --no-upload > site/security/scorecard.sarif || true
        scorecard --repo="https://github.com/${{ github.repository }}" --format json  --no-upload > site/security/scorecard.json  || true
        pip-audit -f json -o site/security/pip-audit.json || true
        bandit -r . -f json -o site/security/bandit.json || true
        trivy fs . --format json --output site/security/trivy.json || true

    - name: 🧰 CodeQL Init
      uses: github/codeql-action/init@v3
      with:
        languages: javascript

    - name: 📊 CodeQL Analyze
      uses: github/codeql-action/analyze@v3
      with:
        output: site/security/codeql-results.sarif
        category: codeql-security-scan

    - name: ⬆️ 업그레이드 사전 목록 수집 (에코)
      shell: bash
      run: |
        set -Eeuo pipefail
        exec > >(tee .github/echo_logs/10_upgrade_before.log) 2>&1
        mkdir -p site/upgrade .github/echo_upgrade
        apt list --upgradable 2>/dev/null | tee site/upgrade/upgradable.before.txt
        pip list --outdated --format=columns > site/upgrade/pip-upgradable.before.txt || true
        docker images --format '{{.Repository}}:{{.Tag}}' > site/upgrade/docker-images.before.txt || true

    - name: ⬆️ 시스템/파이썬/Docker 풀 업그레이드
      shell: bash
      run: |
        set -Eeuo pipefail
        exec > >(tee .github/echo_logs/11_upgrade_apply.log) 2>&1
        sudo apt-get update -y && sudo apt-get upgrade -y && sudo apt-get autoremove -y && sudo apt-get clean
        pip install --upgrade pip
        pip list --outdated --format=freeze | cut -d= -f1 | xargs -n1 -r pip install -U || true
        while read -r img; do [ -n "$img" ] && docker pull "$img" || true; done < site/upgrade/docker-images.before.txt
        echo "[ECHO] 전체 업그레이드 완료" | tee -a .github/echo_upgrade/upgrade.log

    - name: ⬆️ 업그레이드 사후 목록 & HTML 리포트
      shell: bash
      run: |
        set -Eeuo pipefail
        exec > >(tee .github/echo_logs/12_upgrade_after.log) 2>&1
        apt list --upgradable 2>/dev/null | tee site/upgrade/upgradable.after.txt
        pip list --outdated --format=columns > site/upgrade/pip-upgradable.after.txt || true
        docker images --format '{{.Repository}}:{{.Tag}}' > site/upgrade/docker-images.after.txt || true
        {
          echo "<html><body><h2>Upgrade Diff</h2><h3>APT</h3><pre>"
          diff -u site/upgrade/upgradable.before.txt site/upgrade/upgradable.after.txt || true
          echo "</pre><h3>PIP</h3><pre>"
          diff -u site/upgrade/pip-upgradable.before.txt site/upgrade/pip-upgradable.after.txt || true
          echo "</pre><h3>Docker Images</h3><pre>"
          diff -u site/upgrade/docker-images.before.txt site/upgrade/docker-images.after.txt || true
          echo "</pre></body></html>"
        } > site/upgrade/report.html

    - name: 🔁 업그레이드 자동 PR (변경 있을 때만)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        set -Eeuo pipefail
        exec > >(tee .github/echo_logs/13_upgrade_pr.log) 2>&1
        if [ -s site/upgrade/upgradable.after.txt ] || [ -s site/upgrade/pip-upgradable.after.txt ]; then
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git checkout -b "auto/upgrade-$(date -u +%Y%m%d%H%M%S)" || git checkout -B auto/upgrade
          git add site/upgrade/ .github/echo_upgrade/ .github/echo_logs/ site/accounts/ || true
          git commit -m "chore: auto upgrade artifacts (Pages + Echo logs)" || true
          git push -u origin HEAD || true
          gh pr create --title "⬆️ Auto Upgrade" --body "자동 업그레이드 산출물 커밋/페이지 반영" || true
        fi

    - name: 📦 아티팩트 업로드(다운로드 가능)
      uses: actions/upload-artifact@v4
      with:
        name: mega-artifacts
        path: |
          site/**
          .github/echo_logs/**
