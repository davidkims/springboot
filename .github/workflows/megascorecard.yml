name: "💽 Disk Image + Directory Creator (Echo Ready)"

on:
  workflow_dispatch:
    inputs:
      disk_size_mb:
        description: "Disk image size (MB)"
        default: "1024"
        required: true
      mount_point:
        description: "Mount point on runner"
        default: "/mnt/gh-disk"
        required: true
      dir_list:
        description: "Comma-separated directories to create (created both on mount and in repo)"
        default: "data,logs,tmp,backup"
        required: true

permissions:
  contents: read

jobs:
  make-disk-and-dirs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DISK_IMG: disk.img
      LOG_DIR: .github/echo_logs
      ECHO_DIR: .github/echo_scripts

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Prepare echo log & script folders
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$ECHO_DIR"
          echo "[ECHO] Init echo/log directories: $LOG_DIR, $ECHO_DIR" | tee -a "$LOG_DIR/00_init.log"

      - name: 🧱 Create EXT4 disk image (sparse)
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG_DIR/10_disk_create.log") 2>&1

          SIZE_MB="${{ inputs.disk_size_mb }}"
          echo "[ECHO] Creating sparse disk image: ${DISK_IMG} (${SIZE_MB} MB)"
          # Sparse file: uses seek to avoid writing zeros
          dd if=/dev/zero of="${DISK_IMG}" bs=1M count=0 seek="${SIZE_MB}"
          
          echo "[ECHO] Formatting as EXT4"
          sudo mkfs.ext4 -F "${DISK_IMG}"

          echo "[ECHO] Disk image ready: $(ls -lh ${DISK_IMG})"

      - name: 🔗 Attach loop device & mount
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG_DIR/20_mount.log") 2>&1

          MNT="${{ inputs.mount_point }}"
          echo "[ECHO] Setting up loop device for ${DISK_IMG}"
          sudo losetup -fP "${DISK_IMG}"
          LOOP_DEV="$(sudo losetup -j "${DISK_IMG}" | awk -F: '{print $1}')"
          if [[ -z "${LOOP_DEV}" ]]; then
            echo "[ERROR] Failed to get loop device for ${DISK_IMG}"
            exit 1
          fi
          echo "[ECHO] LOOP_DEV=${LOOP_DEV}"

          echo "[ECHO] Creating mount point: ${MNT}"
          sudo mkdir -p "${MNT}"

          echo "[ECHO] Mounting ${LOOP_DEV} -> ${MNT}"
          sudo mount "${LOOP_DEV}" "${MNT}"

          echo "[ECHO] Verifying mount"
          mount | grep "${MNT}" || (echo "[ERROR] Mount verification failed" && exit 1)

          echo "[ECHO] Permissions (owner runner) on mount root"
          sudo chown -R $USER:$USER "${MNT}"
          ls -al "${MNT}"

          echo "[ECHO] Disk usage after mount"
          df -h "${MNT}"

          # Save helper for cleanup
          cat > "${ECHO_DIR}/umount_and_detach.sh" <<'EOS'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          MNT="${1:-/mnt/gh-disk}"
          echo "[ECHO] Unmounting ${MNT} (if mounted)"
          if mount | grep -q " on ${MNT} "; then
            sudo umount "${MNT}"
          else
            echo "[WARN] ${MNT} not mounted"
          fi
          LOOP_DEV="$(sudo losetup -j disk.img | awk -F: '{print $1}')"
          if [[ -n "${LOOP_DEV}" ]]; then
            echo "[ECHO] Detaching loop device ${LOOP_DEV}"
            sudo losetup -d "${LOOP_DEV}" || true
          else
            echo "[WARN] No loop device for disk.img"
          fi
          EOS
          chmod +x "${ECHO_DIR}/umount_and_detach.sh"

      - name: 📁 Create directories (mounted disk + repo)
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG_DIR/30_dirs.log") 2>&1

          MNT="${{ inputs.mount_point }}"
          IFS=',' read -ra DIRS <<< "${{ inputs.dir_list }}"

          echo "[ECHO] Target mount: ${MNT}"
          echo "[ECHO] Directories to create: ${DIRS[*]}"

          for d in "${DIRS[@]}"; do
            CLEAN="$(echo "$d" | xargs)"  # trim
            [[ -z "$CLEAN" ]] && continue

            # On mounted disk
            echo "[ECHO] mkdir -p ${MNT}/${CLEAN}"
            mkdir -p "${MNT}/${CLEAN}"

            # Also in repository workspace
            echo "[ECHO] mkdir -p ./${CLEAN}"
            mkdir -p "./${CLEAN}"

            # Write an echo script per directory for reproducibility
            echo "#!/usr/bin/env bash" > "${ECHO_DIR}/mkdir_${CLEAN//\//_}.sh"
            echo "set -Eeuo pipefail" >> "${ECHO_DIR}/mkdir_${CLEAN//\//_}.sh"
            echo "mkdir -p \"${MNT}/${CLEAN}\" \"./${CLEAN}\"" >> "${ECHO_DIR}/mkdir_${CLEAN//\//_}.sh"
            chmod +x "${ECHO_DIR}/mkdir_${CLEAN//\//_}.sh"
          done

          echo "[ECHO] Result in mount:"
          find "${MNT}" -maxdepth 2 -type d -print | sort

          echo "[ECHO] Result in repo:"
          find . -maxdepth 2 -type d -name "${DIRS[0]}" -o -name "${DIRS[1]}" -o -name "${DIRS[2]}" -o -name "${DIRS[3]}" 2>/dev/null | sort || true

      - name: 📦 Archive logs & echo scripts
        uses: actions/upload-artifact@v4
        with:
          name: disk-and-dirs-logs
          path: |
            .github/echo_logs/**
            .github/echo_scripts/**
            disk.img

      - name: 🧹 Cleanup (umount + detach)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG_DIR/99_cleanup.log") 2>&1
          bash "${ECHO_DIR}/umount_and_detach.sh" "${{ inputs.mount_point }}"
          echo "[ECHO] Cleanup done"
