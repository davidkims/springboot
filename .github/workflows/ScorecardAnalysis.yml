name: Scorecard CLI Download and Run

on: [push, pull_request]

jobs:
  scorecard_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Scorecard CLI
        id: setup_scorecard
        env:
          SCORECARD_VERSION: 5.2.1 # Changed to a valid, recent version
          INSTALL_DIR: /opt/scorecard
        run: |
          echo "[📦] Downloading Scorecard CLI v${SCORECARD_VERSION}..."
          BINARY="scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz" # Added .tar.gz
          URL="https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/${BINARY}"
          echo "[🌐] Download URL: $URL"
          
          curl -fsSL -o "${BINARY}" "$URL"
          
          echo "[🧪] File type check:"
          file "${BINARY}" || (echo "[❌] Download failed or invalid file"; exit 1)
          
          echo "[📦] Extracting Scorecard CLI..."
          tar -xzf "${BINARY}" # Extract the tar.gz archive
          
          # The extracted binary might be named 'scorecard' directly or inside a folder
          # We'll assume it's directly named 'scorecard' after extraction for simplicity.
          # If it's inside a folder, you'll need to adjust the mv command.
          
          echo "[🔐] Making binary executable..."
          chmod +x scorecard
          
          echo "[📁] Moving to $INSTALL_DIR..."
          sudo mkdir -p $INSTALL_DIR
          sudo mv scorecard $INSTALL_DIR/
          echo "$INSTALL_DIR" >> $GITHUB_PATH
          
          echo "[✅] Version Check:"
          $INSTALL_DIR/scorecard --version

      - name: Run Scorecard
        env:
          OUT_DIR: .github/scorecard
          TARGET_REPO: davidkims/springboot # Make sure this matches your repo
        run: |
          mkdir -p "${OUT_DIR}"
          /opt/scorecard/scorecard --repo "github.com/${TARGET_REPO}" --format sarif --output "${OUT_DIR}/results.sarif"
          echo "Scorecard scan completed. Results saved to ${OUT_DIR}/results.sarif"

      - name: Upload Scorecard results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .github/scorecard/results.sarif
