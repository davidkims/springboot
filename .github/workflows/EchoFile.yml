name: ✨ OSSF Scorecard + Echo 통합 자동화 워크플로우

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 6'  # 매주 토요일 새벽

jobs:
  scorecard-security-job:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: ✨ Init Echo 디렉토리 및 템플릿 생성
        run: |
          mkdir -p .github/echo/init
          echo "echo '[❄ Init] Echo directory structure'" | tee -a .github/echo/init/init_dirs.sh
          for base in scorecard template placeholder fix cli; do
            for sub in logs scripts test init converted; do
              mkdir -p .github/echo_${base}/${sub}
            done
          done
          echo 'API_KEY=PLACEHOLDER' > .github/echo_template/sample.env
          echo 'TOKEN=PLACEHOLDER' > .github/echo_template/sample.cfg
          echo '{ "secret": "PLACEHOLDER" }' > .github/echo_template/sample.json

      - name: ✨ OSSF Scorecard 설치 (tar.gz, 정확한 경로)
        run: |
          set -e
          VERSION="4.10.3"
          curl -sLO https://github.com/ossf/scorecard/releases/download/v${VERSION}/scorecard_${VERSION}_linux_amd64.tar.gz
          tar -xzf scorecard_${VERSION}_linux_amd64.tar.gz
          BIN=$(find scorecard_${VERSION}_linux_amd64* -type f -name scorecard | head -1 || true)
          if [ -z "$BIN" ]; then
            echo "::error ::[ERR] Scorecard binary not found after extract."
            exit 1
          fi
          chmod +x "$BIN"
          sudo mv "$BIN" /usr/local/bin/scorecard
          scorecard --version | tee .github/echo_scorecard/logs/version.txt
          echo "echo 'scorecard CLI 설치 완료'" | tee -a .github/echo_cli/logs/install.log

      - name: ⚡️ Scorecard 실행 및 결과 저장
        run: |
          scorecard --repo=. --format=json --show-details > scorecard.json
          cp scorecard.json .github/echo_scorecard/test/scorecard.json

      - name: 🌟 PLACEHOLDER 자동 치환
        run: |
          for f in .github/echo_template/*; do
            fname=$(basename "$f")
            sed 's/PLACEHOLDER/REDACTED/g' "$f" > ".github/echo_placeholder/converted/$fname"
          done

      - name: ✏️ 위험 항목 기반 자동 PR용 스크립트 생성
        run: |
          echo "#!/bin/bash" > .github/echo_fix/scripts/apply_fixes.sh
          echo "echo '[✨ Fix] 분석된 scorecard.json 기반 자동 수정 실행'" >> .github/echo_fix/scripts/apply_fixes.sh
          echo "# TODO: 자동 수정 로직 작성" >> .github/echo_fix/scripts/apply_fixes.sh
          chmod +x .github/echo_fix/scripts/apply_fixes.sh
          bash .github/echo_fix/scripts/apply_fixes.sh

      - name: 🚀 gh pr create (자동 PR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "github-actions"
          git checkout -b security/scorecard-autofix || true
          git add .
          git commit -m "✨ scorecard 위험 항목 자동 수정 및 에코 템플릿 적용" || true
          git push --set-upstream origin security/scorecard-autofix || true
          gh pr create --fill --base main --title "✨ scorecard 자동 보안 개선" || true

      - name: 📄 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-security-all
          path: |
            .github/echo_*
