name: 🧩 Gitignore Auto-Fix & Retry with Backup + API Speed Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  security-events: write

jobs:
  backup-and-api-check:
    runs-on: ubuntu-latest
    env:
      MAX_LATENCY_MS: 1000
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📦 Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 🔄 Unshallow repository if needed
        run: |
          echo "echo '[🔄] Checking if repo is shallow...'"
          echo '[🔄] Checking if repo is shallow...'
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "echo '[✅] Repository converted to full clone'"
            git fetch --prune --unshallow
            echo '[✅] Repository converted to full clone'
          else
            echo "echo '[ℹ️] Repository already full clone'"
            echo '[ℹ️] Repository already full clone'
          fi

      - name: 🧹 Clean previous CodeQL DB
        run: |
          echo "echo '[🧹] Removing old CodeQL databases...'"
          echo '[🧹] Removing old CodeQL databases...'
          rm -rf "${HOME}/codeql_databases" || true
          echo "echo '[✅] Old CodeQL DB removed'"
          echo '[✅] Old CodeQL DB removed'

      - name: 🧰 Install GitHub CLI (gh)
        run: |
          echo "echo '[🧰] Installing GitHub CLI...'"
          echo '[🧰] Installing GitHub CLI...'
          sudo apt-get update
          sudo apt-get install -y gh
          echo "echo '[✅] gh version: $(gh --version | head -n1)'"
          echo "[✅] gh version: $(gh --version | head -n1)"

      - name: ⏹️ Cancel long-running portfolio workflow
        run: |
          echo "echo '[⏹️] Cancelling in-progress portfolio runs...'"
          echo '[⏹️] Cancelling in-progress portfolio runs...'
          for id in $(gh run list --workflow="generate_full_readme.yml" --json databaseId,status -q '.[] | select(.status=="in_progress" or .status=="queued") | .databaseId'); do
            echo "echo '[🛑] Cancelling run $id'"
            echo "[🛑] Cancelling run $id"
            gh run cancel "$id" || echo "echo '[⚠️] Failed to cancel $id'"
          done
          echo "echo '[✅] Done cancelling'"
          echo '[✅] Done cancelling'

      - name: 📁 Prepare backup & results directories
        run: |
          echo "echo '[📁] Creating directories...'"
          echo '[📁] Creating directories...'
          mkdir -p .github/backup/workflows site/api_check
          chmod -R 755 .github/backup site/api_check
          echo "echo '[✅] Directories ready'"
          echo '[✅] Directories ready'

      - name: 🧼 Ensure .gitignore entries
        run: |
          echo "echo '[🧼] Patching .gitignore...'"
          echo '[🧼] Patching .gitignore...'
          touch .gitignore && chmod 644 .gitignore
          add_if_missing() {
            grep -qxF "$1" .gitignore || echo "$1" >> .gitignore
          }
          add_if_missing '!.github/'
          add_if_missing '!.github/workflows/'
          add_if_missing '!.github/workflows/*.d/'
          add_if_missing '!.github/workflows/*.d/**'
          sort .gitignore | uniq > .gitignore.tmp && mv .gitignore.tmp .gitignore
          echo "echo '[✅] .gitignore patched:'"
          echo '[✅] .gitignore patched:'
          echo "cat .gitignore"
          cat .gitignore

      - name: 📝 Backup workflows with .gitkeep
        run: |
          echo "echo '[📝] Backing up each workflow...'"
          echo '[📝] Backing up each workflow...'
          for f in .github/workflows/*.{yml,yaml}; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            name="${base%.*}"
            dir=".github/workflows/${name}.d"
            echo "echo '[📄] $base → $dir'"
            echo "[📄] $base → $dir"
            mkdir -p "$dir"
            echo "" > "$dir/.gitkeep"
            chmod 755 "$dir"
            cp "$f" "$dir/$base" && chmod 644 "$dir/$base"
            cp "$f" .github/backup/workflows/ && chmod 644 ".github/backup/workflows/$base"
          done
          echo "echo '[✅] Backup complete'"
          echo '[✅] Backup complete'

      - name: 📅 Commit & push backups if changed
        run: |
          echo "echo '[📅] Staging backup changes...'"
          echo '[📅] Staging backup changes...'
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f .github/backup/workflows
          git add -f .github/workflows/*.d/** || echo "echo '[⚠️] Some .d/ dirs were ignored'"
          git add .gitignore
          if git diff --cached --quiet; then
            echo "echo '[ℹ️] No changes to commit'"
            echo '[ℹ️] No changes to commit'
          else
            git commit -m "📦 Auto-backup workflows"
            echo "echo '[✅] Commit done'"
            echo '[✅] Commit done'
            git push || echo "echo '[⚠️] git push failed, check for permission issues!'"
          fi

      - name: 🚦 Check latency for extracted URLs
        run: |
          echo "echo '[🚦] Checking URL latencies...'"
          echo '[🚦] Checking URL latencies...'
          for wf in .github/workflows/*.{yml,yaml}; do
            [ -f "$wf" ] || continue
            id=$(basename "$wf" | sed 's/\.[^.]*$//')
            out="site/api_check/${id}.json"
            echo "[" > "$out"
            urls=$(grep -Eo 'https?://[^ )"]+' "$wf" | sort -u)
            count=$(echo "$urls" | wc -l)
            i=0
            for url in $urls; do
              if echo "$url" | grep -qE '\$\{|\$\(|localhost|127\.0\.0\.1'; then
                echo "echo '⏭️ Skipping $url'"
                echo "⏭️ Skipping $url"
                continue
              fi
              echo "echo '🌐 Checking $url...'"
              echo "🌐 Checking $url..."
              start=$(date +%s%3N)
              status=$(curl -o /dev/null -s -w "%{http_code}" "$url" || echo "000")
              latency=$(( $(date +%s%3N) - start ))
              echo "  {" >> "$out"
              echo "    \"url\": \"$url\"," >> "$out"
              echo "    \"status\": \"$status\"," >> "$out"
              echo "    \"latency_ms\": $latency" >> "$out"
              i=$((i+1))
              if [ $i -lt $count ]; then echo "  }," >> "$out"; else echo "  }" >> "$out"; fi
            done
            echo "]" >> "$out"
            echo "echo '[✅] Saved $out'"
            echo "[✅] Saved $out"
          done

      - name: 💾 Upload API results artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-api-speed-results
          path: site/api_check/

      - name: 📊 Print sample results
        run: |
          echo "echo '[📊] Sample API results:'"
          echo '[📊] Sample API results:'
          head -n50 site/api_check/*.json || echo "echo '[ℹ️] No results found'"

      - name: 🧾 Generate echo.sh from API results
        run: |
          echo "echo '[🧾] Generating echo.sh script...'"
          echo '[🧾] Generating echo.sh script...'
          out="site/api_check/echo.sh"
          ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "#!/bin/bash" > "$out"
          echo "# Generated: $ts" >> "$out"
          echo "echo \"[🌐] Replaying API logs...\"" >> "$out"
          for f in site/api_check/*.json; do
            [ -f "$f" ] || continue
            echo "echo \"[📄] $(basename "$f")\"" >> "$out"
            jq -c '.[]' "$f" | while read -r item; do
              url=$(echo "$item" | jq -r '.url')
              st=$(echo "$item" | jq -r '.status')
              lt=$(echo "$item" | jq -r '.latency_ms')
              echo "echo \"URL: $url | Status: $st | Latency: ${lt}ms\"" >> "$out"
            done
          done
          chmod +x "$out"
          echo "echo '[✅] echo.sh generated at $out'"
          echo '[✅] echo.sh generated at site/api_check/echo.sh'

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@v3

      - name: 🔍 Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 🔍 Analyze and upload CodeQL results
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

      - name: 🔁 Retry on failure (max 1)
        if: failure() && github.run_attempt == 1
        run: |
          echo "echo '[🔁] Workflow failed; retrying...'"
          echo '[🔁] Workflow failed; retrying...'
          gh workflow run "${{ github.workflow }}" -r "${{ github.ref_name }}"
