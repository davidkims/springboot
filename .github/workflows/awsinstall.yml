name: 🟦 AWS CLI Install, Directory, Encrypt & Copy

on:
  workflow_dispatch:

jobs:
  awscli-install-upgrade-encrypt:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🗂️ [echo] 주요 디렉토리 추가 생성
        run: |
          for d in \
            .github/echo \
            .github/sql \
            .github/logs \
            .github/aws_out \
            .github/error_logs \
            .github/cli_test \
            .github/cli_test_bak \
            .github/aws_tmp \
            .github/aws_reports \
            .github/s3_backup \
            .github/iam_cache \
            .github/lambda_tmp; do
            echo "echo 'mkdir -p $d'"
            mkdir -p $d
          done

      - name: 🟦 [echo] AWS CLI 설치 및 업그레이드 (최신 v2, 공식, 파일복사 포함)
        run: |
          echo "echo '[🟦] AWS CLI 설치 및 업그레이드 시작...'"
          echo '[🟦] AWS CLI 설치 및 업그레이드 시작...'

          echo "echo '[🟦] 필요 패키지 설치...'"
          echo '[🟦] 필요 패키지 설치...'
          sudo apt-get update -y
          sudo apt-get install -y unzip curl openssl tar

          echo "echo '[🟦] 기존 AWS CLI 제거 (존재할 경우)...'"
          echo '[🟦] 기존 AWS CLI 제거 (존재할 경우)...'
          sudo rm -rf /usr/local/aws /usr/local/bin/aws || true

          echo "echo '[🟦] AWS CLI v2 다운로드...'"
          echo '[🟦] AWS CLI v2 다운로드...'
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"

          echo "echo '[🟦] 압축 해제...'"
          echo '[🟦] 압축 해제...'
          unzip -q -o awscliv2.zip

          echo "echo '[🟦] AWS CLI 설치/업그레이드... (로그 기록)'"
          echo '[🟦] AWS CLI 설치/업그레이드... (로그 기록)'
          sudo ./aws/install --update 2>&1 | tee .github/aws_out/awscli_install.log

          echo "echo '[🟦] awscliv2.zip, 압축폴더, 로그 파일을 .github/aws_out/로 복사'"
          echo '[🟦] awscliv2.zip, 압축폴더, 로그 파일을 .github/aws_out/로 복사'
          cp awscliv2.zip .github/aws_out/ || true
          cp -r aws .github/aws_out/ || true

          echo "echo '[🟦] aws --version 결과:'"
          echo '[🟦] aws --version 결과:'
          aws --version | tee .github/aws_out/awscli_version.log

          echo "echo '[🟦] 파일 암호화(압축+AES256) 시작...'"
          echo '[🟦] 파일 암호화(압축+AES256) 시작...'
          tar -czf awscli_all.tar.gz awscliv2.zip aws .github/aws_out/awscli_install.log .github/aws_out/awscli_version.log
          openssl enc -aes-256-cbc -salt -pbkdf2 -pass pass:"${ENCRYPT_PASS:-AwsCliEncrypt1234}" -in awscli_all.tar.gz -out .github/aws_out/awscli_all.tar.gz.enc

          echo "echo '[🟦] 암호화 파일 .github/aws_out/awscli_all.tar.gz.enc 이동 완료'"
          echo '[🟦] 암호화 파일 .github/aws_out/awscli_all.tar.gz.enc 이동 완료'

          echo "echo '[🟦] 정리 (원본 임시 파일 삭제)...'"
          echo '[🟦] 정리 (원본 임시 파일 삭제)...'
          rm -f awscli_all.tar.gz

          echo "echo '[🟦] AWS CLI 설치, 백업, 암호화, 이동, 정리 완료.'"
          echo '[🟦] AWS CLI 설치, 백업, 암호화, 이동, 정리 완료.'
