name: 🧩 Backup + API Speed Check for All Workflows

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  backup-and-api-check:
    runs-on: ubuntu-latest

    env:
      MAX_LATENCY_MS: 1000

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 📁 Prepare Directories
        run: |
          echo "[📁] Creating backup and result directories..."
          mkdir -p .github/backup/workflows
          mkdir -p site/api_check

      - name: 📝 Backup All Workflow Files
        run: |
          echo "[📝] Backing up workflow files..."
          cp .github/workflows/*.yml .github/backup/workflows/ 2>/dev/null || echo "[ℹ️] No .yml files found."
          cp .github/workflows/*.yaml .github/backup/workflows/ 2>/dev/null || echo "[ℹ️] No .yaml files found."
          echo "[✅] Backup complete."

      - name: 🔍 Preview Each Workflow (First 10 Lines)
        run: |
          echo "[🔍] Previewing backed-up workflows..."
          for f in .github/backup/workflows/*.yml .github/backup/workflows/*.yaml; do
            [ -f "$f" ] || continue
            echo "🗂️ $f"
            head -n 10 "$f"
            echo "-----------------------------"
          done

      - name: 📅 Commit Backups If Changed
        run: |
          if [ -d .git ]; then
            echo "[📅] Committing backup files..."
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add .github/backup/workflows
            git diff --cached --quiet && echo "[ℹ️] No changes to commit." || (
              git commit -m "📦 Auto-backup of workflow files with echo output"
              echo "[✅] Commit complete."
            )
          else
            echo "[❌] Not a Git repository. Skipping commit."
          fi

      - name: 🚦 Check Latency of All Extracted URLs
        run: |
          echo "[⚙️] Extracting URLs from workflows and checking latency..."
          for wf in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$wf" ] || continue
            echo "🔎 Checking: $wf"
            FILE_ID=$(basename "$wf" | sed 's/\.[^.]*$//')
            OUTPUT="site/api_check/${FILE_ID}.json"
            echo "[" > "$OUTPUT"

            urls=$(grep -Eo 'https?://[^ )\"]+' "$wf" | sort | uniq)
            index=0
            count=$(echo "$urls" | wc -l)

            for url in $urls; do
              # Skip templated URLs like ${{ github.repository }}
              if echo "$url" | grep -qE '\$\{|\$\('; then
                echo "⏭️ Skipping template URL: $url"
                continue
              fi

              echo "🌐 Checking $url..."
              start=$(date +%s%3N)
              status=$(curl -o /dev/null -s -w "%{http_code}" "$url")
              end=$(date +%s%3N)
              latency=$((end - start))

              echo "    ↳ Status: $status, Latency: ${latency}ms"
              if [ "$latency" -gt "$MAX_LATENCY_MS" ]; then
                echo "⚠️ $url is slow: ${latency}ms > ${MAX_LATENCY_MS}ms"
              fi

              echo "  {" >> "$OUTPUT"
              echo "    \"url\": \"$url\"," >> "$OUTPUT"
              echo "    \"status\": \"$status\"," >> "$OUTPUT"
              echo "    \"latency_ms\": $latency" >> "$OUTPUT"
              index=$((index+1))
              if [ $index -lt $count ]; then
                echo "  }," >> "$OUTPUT"
              else
                echo "  }" >> "$OUTPUT"
              fi
            done
            echo "]" >> "$OUTPUT"
            echo "✅ Saved to $OUTPUT"
          done

      - name: 💾 Upload All API Results
        uses: actions/upload-artifact@v4
        with:
          name: all-api-speed-results
          path: site/api_check/

      - name: 📊 Print Result Summary
        run: |
          echo "[📊] Sample Result Preview (up to 50 lines):"
          cat site/api_check/*.json | head -n 50 || echo "[ℹ️] No results to show."
