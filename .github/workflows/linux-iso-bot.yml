name: "🐧 Linux ISO 다운로드 봇"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      distro:
        description: "배포판 (ubuntu|debian|rocky|alma|fedora)"
        default: "ubuntu"
        required: true
      release_hint:
        description: "버전 힌트 (비우면 최신)"
        default: ""
        required: false
      arch:
        description: "아키텍처 (amd64|arm64)"
        default: "amd64"
        required: true
  schedule:
    - cron: "*/5 * * * *"

jobs:
  fetch-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ISO image (auto-detect + verify)
        env:
          DISTRO: ${{ github.event.inputs.distro || 'ubuntu' }}
          RELEASE_HINT: ${{ github.event.inputs.release_hint }}
          ARCH: ${{ github.event.inputs.arch || 'amd64' }}
        run: |
          set -euo pipefail

          ua="GitHubActions/ISO-Fetcher (+https://github.com/actions) curl/7.x"
          retry_flags="--retry 5 --retry-delay 2 --retry-connrefused --fail -L --connect-timeout 15 --max-time 600 -A \"$ua\""

          # util: safe curl that prints helpful errors
          curl_s() { 
            # usage: curl_s URL [extra curl args...]
            local url="$1"; shift || true
            echo "[curl] GET $url" 1>&2
            # shellcheck disable=SC2086
            curl ${retry_flags} "$@" "$url"
          }

          mkdir -p iso-out tmp

          echo "::group::Detect & Download"
          case "$DISTRO" in
            ubuntu)
              # RELEASE_HINT 예: 24.04, 24.04.1 등 (비우면 최신)
              # releases.ubuntu.com/<YY.MM>/SHA256SUMS 에서 live-server ISO를 찾음
              # 최신 탐색: 루트 인덱스에서 YY.MM 디렉터리 후보를 모아 sort -V 로 최신 선택
              ARCH_MAP="$ARCH" # amd64|arm64 그대로 사용
              if [ -n "${RELEASE_HINT:-}" ]; then
                YYMM="$(echo "$RELEASE_HINT" | cut -d. -f1-2)"
                candidates="$YYMM"
              else
                # 전체 인덱스에서 X.YY 형태 디렉터리 추출 (24.04, 24.04.1 등은 하위 SHA256SUMS로 확인)
                index_html="$(curl_s https://releases.ubuntu.com/)"
                # 링크들 중 2자리.2자리 버전 패턴만 뽑기
                candidates="$(printf '%s\n' "$index_html" \
                  | grep -Eo '>2[0-9]\.[0-9]{2}(/|")' \
                  | sed -E 's/[>"]|\/$//g' \
                  | sort -V | uniq)"
              fi

              found=""
              for yymm in $candidates; do
                base="https://releases.ubuntu.com/${yymm}/"
                echo "[ubuntu] probing $base" 1>&2
                # SHA256SUMS 가져와 live-server-ARCH.iso 라인을 찾는다
                if sha_txt="$(curl_s "${base}SHA256SUMS" 2>/dev/null)"; then
                  # 우분투 SHA 파일은 두 포맷이 혼재할 수 있으므로 모두 대응
                  # 1) <hash>  <filename>
                  # 2) SHA256 (<filename>) = <hash>
                  # live-server ISO 우선, 없으면 desktop도 fallback
                  fname="$(printf '%s\n' "$sha_txt" \
                    | awk -v a="$ARCH_MAP" -v r="$RELEASE_HINT" '
                      # 포맷1
                      $0 ~ /ubuntu-.*live-server-.*\.iso/ && $0 ~ a {
                        if (r == "" || $0 ~ r) { print $2; exit }
                      }
                      # 포맷2
                      $0 ~ /SHA256 \(ubuntu-.*live-server-.*\.iso\) =/ && $0 ~ a {
                        if (r == "" || $0 ~ r) {
                          match($0, /\((.*\.iso)\)/, m);
                          if (m[1] != "") { print m[1]; exit }
                        }
                      }
                    ' )"
                  if [ -z "${fname:-}" ]; then
                    # fallback: desktop ISO
                    fname="$(printf '%s\n' "$sha_txt" \
                      | awk -v a="$ARCH_MAP" -v r="$RELEASE_HINT" '
                        $0 ~ /ubuntu-.*desktop-.*\.iso/ && $0 ~ a {
                          if (r == "" || $0 ~ r) { print $2; exit }
                        }
                        $0 ~ /SHA256 \(ubuntu-.*desktop-.*\.iso\) =/ && $0 ~ a {
                          if (r == "" || $0 ~ r) {
                            match($0, /\((.*\.iso)\)/, m);
                            if (m[1] != "") { print m[1]; exit }
                          }
                        }
                      ' )"
                  fi
                  if [ -n "${fname:-}" ]; then
                    # 해시 추출
                    hash="$(printf '%s\n' "$sha_txt" | awk -v f="$fname" '
                      # 포맷1
                      $2 == f { print $1; exit }
                      # 포맷2
                      {
                        # SHA256 (filename) = hash
                        match($0, /SHA256 \(([^)]+)\) = ([[:xdigit:]]{64})/, m);
                        if (m[1] == f) { print m[2]; exit }
                      }
                    ')"
                    url="${base}${fname}"
                    echo "[ubuntu] Selected: $url" 1>&2
                    curl_s "$url" -o "iso-out/${fname}"
                    if [ -n "${hash:-}" ]; then
                      echo "${hash}  iso-out/${fname}" | sha256sum -c -
                    else
                      echo "[warn] SHA256 hash not found in SHA256SUMS; skipping verify" 1>&2
                    fi
                    found="yes"
                    break
                  fi
                fi
              done
              if [ -z "$found" ]; then
                echo "::error::Ubuntu ISO를 찾지 못했습니다. release_hint를 구체화해보세요. (예: 24.04.1)" ; exit 1
              fi
              ;;

            debian)
              # Debian: current 디렉터리의 SHA256SUMS에서 netinst ISO 선택
              ARCH_MAP="$ARCH" # amd64|arm64
              base="https://cdimage.debian.org/debian-cd/current/${ARCH_MAP}/iso-cd/"
              sha_txt="$(curl_s "${base}SHA256SUMS")"
              # release_hint가 있으면 해당 버전 우선, 없으면 최신 한 개 선택
              fname="$(printf '%s\n' "$sha_txt" \
                | awk -v a="$ARCH_MAP" -v r="${RELEASE_HINT:-}" '
                  /debian-[0-9]+\.[0-9]+(\.[0-9]+)?-.*-netinst\.iso/ && $0 ~ a {
                    if (r == "" || $0 ~ r) { print $2; exit }
                  }
                ')"
              if [ -z "${fname:-}" ]; then
                # fallback: 첫 번째 netinst
                fname="$(printf '%s\n' "$sha_txt" \
                  | awk '/debian-[0-9]+\.[0-9]+(\.[0-9]+)?-.*-netinst\.iso/{print $2;exit}')"
              fi
              test -n "${fname:-}" || { echo "::error::Debian netinst ISO를 찾지 못했습니다."; exit 1; }
              hash="$(printf '%s\n' "$sha_txt" | awk -v f="$fname" '$2==f{print $1;exit}')"
              curl_s "${base}${fname}" -o "iso-out/${fname}"
              if [ -n "${hash:-}" ]; then
                echo "${hash}  iso-out/${fname}" | sha256sum -c -
              fi
              ;;

            rocky)
              # Rocky: CHECKSUM 파일에 "SHA256 (Rocky-9.5-x86_64-minimal.iso) = <hash>" 형태
              ARCH_MAP=$([ "$ARCH" = "arm64" ] && echo "aarch64" || echo "x86_64")
              REL="${RELEASE_HINT:-9}"  # 힌트가 비어있으면 메이저 최신 라인 스캔
              # isos/<arch>/ 디렉터리 목록을 읽어 최신 마이너를 추정
              base_root="https://download.rockylinux.org/pub/rocky/"
              arch_dir="isos/${ARCH_MAP}/"
              idx="$(curl_s "${base_root}")"
              rel=$(printf '%s\n' "$idx" \
                    | grep -Eo '>[0-9]+(\.[0-9]+)?/' | tr -d '>/ ' \
                    | ( [ -n "$REL" ] && grep -E "^${REL}(\.|/|$)" || cat ) \
                    | sort -V | tail -n1 )
              test -n "${rel:-}" || { echo "::error::Rocky 릴리스를 찾지 못했습니다."; exit 1; }
              base="${base_root}${rel}/${arch_dir}"
              ck="$(curl_s "${base}CHECKSUM")"
              # minimal ISO 우선, 없으면 dvd ISO
              fname="$(printf '%s\n' "$ck" \
                | awk -v a="$ARCH_MAP" -v r="${rel}" '
                  /Rocky-.*-minimal.*\.iso/ && $0 ~ a { 
                    match($0, /\(([^)]+)\)/, m); if (m[1]!=""){print m[1]; exit}
                  }')"
              if [ -z "${fname:-}" ]; then
                fname="$(printf '%s\n' "$ck" \
                  | awk -v a="$ARCH_MAP" '
                    /Rocky-.*\.iso/ && $0 ~ a {
                      match($0, /\(([^)]+)\)/, m); if (m[1]!=""){print m[1]; exit}
                  }')"
              fi
              test -n "${fname:-}" || { echo "::error::Rocky ISO 파일명을 찾지 못했습니다."; exit 1; }
              hash="$(printf '%s\n' "$ck" | awk -v f="$fname" '
                match($0, /SHA256 \(([^)]+)\) = ([[:xdigit:]]{64})/, m){ if(m[1]==f){print m[2]; exit}}
              ')"
              curl_s "${base}${fname}" -o "iso-out/${fname}"
              if [ -n "${hash:-}" ]; then
                echo "${hash}  iso-out/${fname}" | sha256sum -c -
              fi
              ;;

            alma)
              # Alma: repo.almalinux.org/almalinux/<rel>/isos/<arch>/CHECKSUM
              ARCH_MAP=$([ "$ARCH" = "arm64" ] && echo "aarch64" || echo "x86_64")
              # 릴리스 자동탐색
              root="https://repo.almalinux.org/almalinux/"
              idx="$(curl_s "$root")"
              rel="$(printf '%s\n' "$idx" | grep -Eo '>[0-9]+\.[0-9]+/' | tr -d '>/ ' \
                    | ( [ -n "${RELEASE_HINT:-}" ] && grep -E "^${RELEASE_HINT}(\.|/|$)" || cat ) \
                    | sort -V | tail -n1)"
              test -n "${rel:-}" || { echo "::error::Alma 릴리스를 찾지 못했습니다."; exit 1; }
              base="${root}${rel}/isos/${ARCH_MAP}/"
              ck="$(curl_s "${base}CHECKSUM")"
              fname="$(printf '%s\n' "$ck" \
                | awk -v a="$ARCH_MAP" '
                    /AlmaLinux-.*-minimal.*\.iso/ && $0 ~ a {
                      match($0, /\(([^)]+)\)/, m); if (m[1]!=""){print m[1]; exit}
                  }')"
              if [ -z "${fname:-}" ]; then
                fname="$(printf '%s\n' "$ck" \
                  | awk -v a="$ARCH_MAP" '
                    /AlmaLinux-.*\.iso/ && $0 ~ a {
                      match($0, /\(([^)]+)\)/, m); if (m[1]!=""){print m[1]; exit}
                  }')"
              fi
              test -n "${fname:-}" || { echo "::error::Alma ISO 파일명을 찾지 못했습니다."; exit 1; }
              hash="$(printf '%s\n' "$ck" | awk -v f="$fname" '
                match($0, /SHA256 \(([^)]+)\) = ([[:xdigit:]]{64})/, m){ if(m[1]==f){print m[2]; exit}}
              ')"
              curl_s "${base}${fname}" -o "iso-out/${fname}"
              if [ -n "${hash:-}" ]; then
                echo "${hash}  iso-out/${fname}" | sha256sum -c -
              fi
              ;;

            fedora)
              # Fedora Server: /releases/<REL>/Server/<arch>/iso/ + Fedora-Server-<REL>-<arch>-CHECKSUM
              ARCH_MAP=$([ "$ARCH" = "arm64" ] && echo "aarch64" || echo "x86_64")
              # release_hint 없으면 최신 릴리스 확인
              root="https://download.fedoraproject.org/pub/fedora/linux/releases/"
              if [ -n "${RELEASE_HINT:-}" ]; then
                rel="$RELEASE_HINT"
              else
                idx="$(curl_s "$root")"
                rel="$(printf '%s\n' "$idx" | grep -Eo '>[0-9]{2}/' | tr -d '>/ ' | sort -V | tail -n1)"
              fi
              base="${root}${rel}/Server/${ARCH_MAP}/iso/"
              ckn="Fedora-Server-${rel}-${ARCH_MAP}-CHECKSUM"
              ck="$(curl_s "${base}${ckn}")"
              # DVD ISO 우선 선택
              fname="$(printf '%s\n' "$ck" | awk -v a="$ARCH_MAP" '
                /Fedora-Server-.*-dvd-.*\.iso/ && $0 ~ a {print $2; exit}
                { if (match($0, /\(([^)]+dvd[^)]+\.iso)\)\s*=\s*([[:xdigit:]]{64})/, m)) { print m[1]; exit } }
              ')"
              if [ -z "${fname:-}" ]; then
                # 어떤 경우엔 netinst만 있을 수 있음
                fname="$(printf '%s\n' "$ck" | awk -v a="$ARCH_MAP" '
                  /Fedora-Server-.*-netinst-.*\.iso/ && $0 ~ a {print $2; exit}
                  { if (match($0, /\(([^)]+netinst[^)]+\.iso)\)\s*=\s*([[:xdigit:]]{64})/, m)) { print m[1]; exit } }
                ')"
              fi
              test -n "${fname:-}" || { echo "::error::Fedora ISO 파일명을 찾지 못했습니다."; exit 1; }
              hash="$(printf '%s\n' "$ck" | awk -v f="$fname" '
                $2==f { print $1; exit }
                { if (match($0, /\(([^)]+)\)\s*=\s*([[:xdigit:]]{64})/, m)) { if (m[1]==f){ print m[2]; exit } } }
              ')"
              curl_s "${base}${fname}" -o "iso-out/${fname}"
              if [ -n "${hash:-}" ]; then
                echo "${hash}  iso-out/${fname}" | sha256sum -c -
              fi
              ;;

            *)
              echo "::error::unsupported distro: $DISTRO"
              exit 1
              ;;
          esac
          echo "::endgroup::"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-iso
          path: iso-out/*
          retention-days: 1
