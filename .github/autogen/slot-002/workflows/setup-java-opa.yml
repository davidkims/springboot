name: 🛡️ OPA 정책 자동화 및 Spring 연동

on:
  push:
    paths:
      - 'opa_policies/**'
      - '.github/workflows/opa-policy-setup.yml'
  workflow_dispatch:

jobs:
  opa-policy-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🛠️ OPA 설치 및 버전 출력
        run: |
          echo "[🛠️] OPA 설치 시작"
          OPA_VERSION="v0.63.0"
          curl -sSL -o opa https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          echo "[✅] OPA 설치 완료"
          opa version

      - name: 📄 정책 및 테스트 파일 확인
        run: |
          echo "[📄] opa_policies 디렉토리 내용 확인"
          ls -R opa_policies
          echo "[📜] allow.rego 내용 출력"
          cat opa_policies/allow.rego || echo "[⚠️] allow.rego 없음"
          echo "[📜] allow_test.rego 내용 출력"
          cat opa_policies/allow_test.rego || echo "[⚠️] allow_test.rego 없음"

      - name: ✅ 유닛 테스트 실행 (opa test)
        run: |
          echo "[🧪] opa test 실행 중..."
          opa test opa_policies/

      - name: 📂 정책 파일 복사 및 구조화
        run: |
          echo "[📁] 사용자 및 역할별 정책 디렉토리 생성"
          mkdir -p site/policies/user/admin
          mkdir -p site/policies/role/manager
          cp opa_policies/allow.rego site/policies/user/admin/ || true
          cp opa_policies/role.rego site/policies/role/manager/ || true

      - name: 📦 GitHub Pages 또는 아티팩트 업로드 (옵션)
        run: |
          echo "[📤] 정책 zip 생성"
          zip -r site/policies.zip site/policies/
          echo "[✔] 정책 zip 압축 완료"

      # 선택 사항: GitHub Pages 배포 또는 upload-artifact 수행 가능
