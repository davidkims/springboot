name: ✦ MEGA-DB FullOps: Tx → Kafka → Ledger → Grafana Alert

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  mega-db-fullops:
    runs-on: ubuntu-latest

    steps:
      - name: 파편 검색 및 체크아웃
        uses: actions/checkout@v4

      - name: ✔️ 에코 디렉토리 전체 구조 생성
        run: |
          mkdir -p .github/echo_db
          for d in dirs files logs scripts services compose kafka prometheus grafana alert webhook output ledger transfer_exec tx_monitor; do
            echo "echo 'mkdir -p .github/echo_db/$d'" | tee -a .github/echo_db/echo_dir_create.sh
            mkdir -p ".github/echo_db/$d"
          done

      - name: 🔊 실시간 Tx/이체 SQL 및 실행 스크립트 자동 생성
        run: |
          MASS=100
          for i in $(seq 1 $MASS); do
            echo "INSERT INTO ledger (tx_id, account_no, tx_type, amount, ts) VALUES ($i, 'ACC$(printf %05d $i)', 'TRANSFER', 1000, CURRENT_TIMESTAMP);" >> .github/echo_db/ledger/mysql_ledger_insert.sql
            echo "INSERT INTO transfer (tx_id, from_acc, to_acc, amount, ts) VALUES ($i, 'ACC$(printf %05d $i)', 'ACC$(printf %05d $((i+1)))', 1000, CURRENT_TIMESTAMP);" >> .github/echo_db/transfer/mysql_transfer_insert.sql
          done
          echo "#!/bin/bash" > .github/echo_db/transfer_exec/mysql_transfer_exec.sh
          echo "echo '[TRANSFER_EXEC] MySQL 실행'" >> .github/echo_db/transfer_exec/mysql_transfer_exec.sh
          echo "mysql -uroot -prootpass123 test_db < .github/echo_db/transfer/mysql_transfer_insert.sql | tee .github/echo_db/output/mysql_transfer_result.csv" >> .github/echo_db/transfer_exec/mysql_transfer_exec.sh
          chmod +x .github/echo_db/transfer_exec/mysql_transfer_exec.sh

      - name: 🚀 Kafka 토픽 자동 생성 (에코)
        run: |
          echo "#!/bin/bash" > .github/echo_db/kafka/create_topics.sh
          echo "echo '[Kafka] 토픽 생성 시작'" >> .github/echo_db/kafka/create_topics.sh
          echo "/opt/kafka/bin/kafka-topics.sh --create --topic tx-events --bootstrap-server localhost:9092 --replication-factor 1 --partitions 1 || echo '[WARN] Kafka 토픽 생성 실패'" >> .github/echo_db/kafka/create_topics.sh
          chmod +x .github/echo_db/kafka/create_topics.sh

      - name: 🎉 Prometheus + AlertManager 설정 에코
        run: |
          echo 'groups:' > .github/echo_db/prometheus/alert_rules.yml
          echo '- name: tx-alerts' >> .github/echo_db/prometheus/alert_rules.yml
          echo '  rules:' >> .github/echo_db/prometheus/alert_rules.yml
          echo '  - alert: HighTxRate' >> .github/echo_db/prometheus/alert_rules.yml
          echo '    expr: rate(tx_total[1m]) > 10' >> .github/echo_db/prometheus/alert_rules.yml
          echo '    for: 1m' >> .github/echo_db/prometheus/alert_rules.yml
          echo '    labels:' >> .github/echo_db/prometheus/alert_rules.yml
          echo '      severity: critical' >> .github/echo_db/prometheus/alert_rules.yml
          echo '    annotations:' >> .github/echo_db/prometheus/alert_rules.yml
          echo '      summary: "High Tx rate detected"' >> .github/echo_db/prometheus/alert_rules.yml

      - name: 🔹 Grafana Webhook 트리거 설정 파일 생성
        run: |
          echo '{"dashboard": {"title": "Tx Monitor Dashboard", "panels": []}, "overwrite": true}' > .github/echo_db/grafana/sample_dashboard.json
          echo "#!/bin/bash" > .github/echo_db/grafana/import_dashboard.sh
          echo "curl -X POST http://localhost:3000/api/dashboards/db -H 'Authorization: Bearer ${GRAFANA_API_KEY}' -H 'Content-Type: application/json' -d @.github/echo_db/grafana/sample_dashboard.json || echo '[WARN] Grafana 대시보드 업로드 실패'" >> .github/echo_db/grafana/import_dashboard.sh
          chmod +x .github/echo_db/grafana/import_dashboard.sh

      - name: ✨ 전체 통합 실행 스크립트 full_init_run.sh 생성
        run: |
          echo "#!/bin/bash" > .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/echo_dir_create.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/kafka/create_topics.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/transfer_exec/mysql_transfer_exec.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/grafana/import_dashboard.sh" >> .github/echo_db/scripts/full_init_run.sh
          chmod +x .github/echo_db/scripts/full_init_run.sh

      - name: ⚡️ 전체 스크립트 실행
        run: bash .github/echo_db/scripts/full_init_run.sh

      - name: 🔍 에코 파일 전체 출력
        run: |
          echo "[ECHO] 전체 생성 파일"
          find .github/echo_db -type f | sort | while read f; do
            echo "\n[FILE] $f"
            cat "$f"
          done
