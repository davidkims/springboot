name: "💾 Real-time Disk Boost (Ubuntu runners)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disk-boost:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 🔎 Before — disk snapshot
        shell: bash
        run: |
          set -e
          mkdir -p .github/echo_logs
          {
            echo "[BEFORE] df -h"
            df -h
            echo
            echo "[BEFORE] lsblk"
            lsblk
            echo
            echo "[BEFORE] /mnt usage"
            sudo du -sh /mnt || true
          } | tee .github/echo_logs/disk_before.log

      # 1) 루트/도구/스왑/도커이미지 등 대용량 정리 (약 20~30GB 확보)
      #   ※ 필요시 옵션을 false로 바꿔 보존할 수 있음
      - name: 🧹 Free up preinstalled stuff (safe cleanup)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      # 위 액션은 우분투 러너에서 약 30GB까지 확보 보고 사례가 있습니다. :contentReference[oaicite:1]{index=1}

      # 2) / 와 /mnt 여유공간을 LVM으로 결합해 작업공간($GITHUB_WORKSPACE)을 크게 마운트
      #   * 체크아웃 이전에 실행해야 함 (README 권장)
      - name: 💽 Maximize build space (LVM mount over workspace)
        uses: easimon/maximize-build-space@v10
        with:
          # 루트와 /mnt에 남겨둘 최소 여유(MB) — apt, docker 등을 위해 약간 남겨둡니다
          root-reserve-mb: 1536
          temp-reserve-mb: 512
          # 스왑을 1GB만 재구성(필요 없으면 0)
          swap-size-mb: 1024
          # 덩치 큰 사전 설치물 제거(위 단계와 중복되지만 문제 없음, 필요시 false)
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
      # 이 액션은 /mnt 임시디스크를 활용해 작업공간을 크게 만들고,
      # 필요시 불필요 소프트웨어 제거/스왑 조정까지 지원합니다. :contentReference[oaicite:2]{index=2}

      - name: 📥 Checkout (after disk boost)
        uses: actions/checkout@v4

      - name: 🔁 After — disk snapshot
        shell: bash
        run: |
          set -e
          {
            echo "[AFTER] df -h"
            df -h
            echo
            echo "[AFTER] mount points (dev only)"
            mount | grep -E '^/dev' || true
            echo
            echo "[NOTE] Workspace:"
            echo "$GITHUB_WORKSPACE"
            du -sh "$GITHUB_WORKSPACE" || true
          } | tee .github/echo_logs/disk_after.log
