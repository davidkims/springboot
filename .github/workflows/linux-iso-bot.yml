name: "🏦 MEGA Echo FullOps vFinal (DB+미들웨어+CloudInit+Daemon)"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  fullops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Environment
        run: |
          set -euo pipefail
          echo "ECHO_ROOT=.github/echo" >> $GITHUB_ENV
          echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          echo "IMAGE_NAME=ghcr.io/${{ github.repository }}/fin-echo" >> $GITHUB_ENV
          echo "BACKUP_DIR=${{ github.workspace }}/backup" >> $GITHUB_ENV
          sudo apt-get update -y
          sudo apt-get install -y genisoimage cloud-utils qemu-system-x86

      - name: Prepare echo utils
        run: |
          mkdir -p ${ECHO_ROOT}/bin ${ECHO_ROOT}/db/sql
          cat > ${ECHO_ROOT}/bin/echoe <<'SH'
          #!/usr/bin/env bash
          echo "[ECHO] $@"
          "$@"
          SH
          chmod +x ${ECHO_ROOT}/bin/echoe
          echo "${ECHO_ROOT}/bin" >> $GITHUB_PATH

      # 🐳 공통 Docker init
      - name: Docker Init
        run: |
          echoe docker version
          echoe docker info

      # 🗄️ MySQL
      - name: MySQL Container
        run: |
          echoe docker run -d --restart=always --name mysql-echo \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=fin -p 3306:3306 mysql:8
          for i in {1..20}; do
            sleep 5
            if docker exec mysql-echo mysql -uroot -proot -e "SELECT 1;" fin; then
              echo "[OK] MySQL ready"
              break
            fi
          done
          docker exec -i mysql-echo mysql -uroot -proot fin \
            -e "CREATE TABLE IF NOT EXISTS customers(id INT AUTO_INCREMENT PRIMARY KEY, name VARCHAR(64));"

      # 🗄️ PostgreSQL
      - name: PostgreSQL Container
        run: |
          echoe docker run -d --restart=always --name pg-echo \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=fin -p 5432:5432 postgres:15
          for i in {1..20}; do
            sleep 5
            if docker exec pg-echo psql -U postgres -d fin -c "SELECT 1;" >/dev/null 2>&1; then
              echo "[OK] Postgres ready"
              break
            fi
          done
          docker exec -i pg-echo psql -U postgres -d fin \
            -c "CREATE TABLE IF NOT EXISTS customers(id SERIAL PRIMARY KEY, name TEXT);"

      # 🗄️ Oracle XE
      - name: Oracle XE Container
        run: |
          echoe docker run -d --restart=always --name oracle-echo \
            -e ORACLE_PASSWORD=oracle -p 1521:1521 gvenzl/oracle-xe:21-full
          for i in {1..30}; do
            sleep 10
            if docker logs oracle-echo 2>&1 | grep -q "DATABASE IS READY"; then
              echo "[OK] Oracle ready"
              break
            fi
          done
          docker exec -i oracle-echo bash -c "echo \"CREATE USER finance IDENTIFIED BY finance; GRANT CONNECT, RESOURCE TO finance;\" | sqlplus -s system/oracle@//localhost:1521/XEPDB1"

      # 🗄️ Redis
      - name: Redis
        run: |
          echoe docker run -d --restart=always --name redis-echo -p 6379:6379 redis:7
          sleep 5
          docker exec redis-echo redis-cli SET init:echo "hello-redis"

      # 📡 Kafka
      - name: Kafka
        run: |
          echoe docker run -d --restart=always --name kafka-echo -p 9092:9092 bitnami/kafka:latest
          for i in {1..20}; do
            sleep 5
            if docker exec kafka-echo kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "[OK] Kafka ready"
              break
            fi
          done
          docker exec kafka-echo kafka-topics.sh --create --topic echo-topic --bootstrap-server localhost:9092 || true

      # 📦 MinIO
      - name: MinIO
        run: |
          echoe docker run -d --restart=always --name minio-echo \
            -e MINIO_ACCESS_KEY=minio -e MINIO_SECRET_KEY=minio123 \
            -p 9000:9000 minio/minio server /data
          sleep 15
          echo "[OK] MinIO launched"

      # 🛫 Airflow
      - name: Airflow
        run: |
          echoe docker run -d --restart=always --name airflow-echo -p 8081:8080 apache/airflow:2.9.0 standalone
          sleep 20
          echo "[OK] Airflow launched"

      # ⚡ Spark
      - name: Spark
        run: |
          echoe docker run -d --restart=always --name spark-echo -p 7077:7077 -p 8082:8080 bitnami/spark:latest
          sleep 15
          echo "[OK] Spark launched"

      # 🔐 Vault
      - name: Vault
        run: |
          echoe docker run -d --restart=always --name vault-echo -p 8200:8200 vault:1.15 server -dev
          sleep 10
          docker exec vault-echo vault status

      # 💾 Backup
      - name: Backups
        run: |
          mkdir -p ${BACKUP_DIR}
          docker exec mysql-echo mysqldump -uroot -proot fin > ${BACKUP_DIR}/mysql_fin.sql
          docker exec pg-echo pg_dump -U postgres fin > ${BACKUP_DIR}/pg_fin.sql
          echo "[ECHO] Oracle export skipped (demo license)"

      # 📀 Cloud-Init ISO + VM Boot Test
      - name: Cloud-Init ISO & VM Test
        run: |
          mkdir -p ${ECHO_ROOT}/iso_src
          cat > ${ECHO_ROOT}/iso_src/user-data <<'CLOUD'
          #cloud-config
          users:
            - name: echo
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              ssh-authorized-keys:
                - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQDemoKey
          packages:
            - mysql-client
            - postgresql-client
            - redis-tools
          runcmd:
            - echo "Cloud-Init Seed Applied"
          CLOUD

          genisoimage -output ${ECHO_ROOT}/seed.iso -volid cidata -joliet -rock ${ECHO_ROOT}/iso_src
          echo "[ECHO] ISO ready, boot test via QEMU..."
          qemu-system-x86_64 -m 1024 -cdrom ${ECHO_ROOT}/seed.iso -boot d -nographic -no-reboot -snapshot -net nic -net user &
          sleep 15
          pkill qemu-system-x86_64 || true

      # 📦 아티팩트 업로드
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-artifacts
          path: |
            ${{ env.BACKUP_DIR }}
            ${ECHO_ROOT}/seed.iso
