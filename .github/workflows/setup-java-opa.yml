name: ☕ Java + 🛡️ OPA 정책 자동화 전체 테스트 (cp 기능 포함)

on:
  workflow_dispatch:

jobs:
  opa-policy-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 저장소 체크아웃
        uses: actions/checkout@v4

      - name: ☕ Java 설치 (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 OPA 설치 (업그레이드 지원 포함)
        env:
          OPA_VERSION: "v0.63.0"
        run: |
          echo "[🛠️] OPA 설치 시작 - 버전: $OPA_VERSION"
          curl -sSL -o opa https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          echo "[✅] OPA 설치 완료"
          echo "[🔍] OPA 버전:"
          opa version

      - name: 📁 정책 및 테스트 파일 생성 (allow, deny, role, test)
        run: |
          echo "[📁] opa_policies 디렉토리 생성"
          mkdir -p opa_policies

          echo "[📄] allow.rego 생성"
          echo 'package example' | tee opa_policies/allow.rego
          echo '' | tee -a opa_policies/allow.rego
          echo 'default allow = false' | tee -a opa_policies/allow.rego
          echo '' | tee -a opa_policies/allow.rego
          echo 'allow {' | tee -a opa_policies/allow.rego
          echo '  input.user == "admin"' | tee -a opa_policies/allow.rego
          echo '}' | tee -a opa_policies/allow.rego

          echo "[📄] deny.rego 생성"
          echo 'package example' | tee opa_policies/deny.rego
          echo '' | tee -a opa_policies/deny.rego
          echo 'default deny = true' | tee -a opa_policies/deny.rego
          echo '' | tee -a opa_policies/deny.rego
          echo 'deny {' | tee -a opa_policies/deny.rego
          echo '  input.user == "admin"' | tee -a opa_policies/deny.rego
          echo '}' | tee -a opa_policies/deny.rego

          echo "[📄] role.rego 생성"
          echo 'package example' | tee opa_policies/role.rego
          echo '' | tee -a opa_policies/role.rego
          echo 'role = input.role' | tee -a opa_policies/role.rego

          echo "[🧪] allow_test.rego 생성"
          echo 'package example' | tee opa_policies/allow_test.rego
          echo '' | tee -a opa_policies/allow_test.rego
          echo 'test_allow_admin {' | tee -a opa_policies/allow_test.rego
          echo '  allow with input as {"user": "admin"}' | tee -a opa_policies/allow_test.rego
          echo '}' | tee -a opa_policies/allow_test.rego
          echo '' | tee -a opa_policies/allow_test.rego
          echo 'test_disallow_guest {' | tee -a opa_policies/allow_test.rego
          echo '  not allow with input as {"user": "guest"}' | tee -a opa_policies/allow_test.rego
          echo '}' | tee -a opa_policies/allow_test.rego

      - name: 📂 정책 파일 백업 디렉토리 생성 및 복사
        run: |
          echo "[📂] site/policies 디렉토리 생성"
          mkdir -p site/policies

          echo "[📥] 정책 파일 복사 시작"
          cp opa_policies/*.rego site/policies/
          echo "[✅] 정책 및 테스트 파일 site/policies/ 에 복사 완료"

          echo "[📂] 복사된 파일 목록:"
          ls -al site/policies/

      - name: ✅ OPA 유닛 테스트 실행
        run: |
          echo "[🚀] opa test 실행 시작..."
          opa test opa_policies/
          echo "[✅] opa test 완료"

      - name: ℹ️ Java & OPA 버전 확인
        run: |
          echo "[ℹ️] Java 버전:"
          java -version
          echo "[ℹ️] OPA 버전:"
          opa version
