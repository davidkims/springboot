name: 🏢 MEGA DB EchoOps + All-in-One 설치/에코/권한/콘테이너/복원/보안/미들웨어/금융/대량 SQL 통합

on:
  workflow_dispatch:
  schedule:
    - cron: '5,20,35,50 * * * *'

jobs:
  mega-echo:
    runs-on: ubuntu-latest
    steps:

    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 📁 필수 디렉토리 및 echo 생성
      run: |
        set -e
        for d in echo_{dirs,permissions,users,firewall,sql,img,containers,tools,logs,download,backup,security,services,data,dump,query,tmp,var,finance,ledger,transaction,account,customer,exec,restart}; do
          mkdir -p ".github/${d}"
          echo "echo '[ECHO] 디렉토리 생성: .github/${d}'" >> .github/echo_dirs/create_dirs.sh
        done
        chmod +x .github/echo_dirs/create_dirs.sh
        .github/echo_dirs/create_dirs.sh

    - name: 🔐 사용자/비밀번호 에코 생성
      run: |
        set -e
        for i in $(seq 1 50); do
          echo "CREATE USER 'user_$i'@'%' IDENTIFIED BY 'pw_$i';" >> .github/echo_users/mysql_user.sql
          echo "echo '[ECHO] user_$i 생성'" >> .github/echo_users/user_echo.sh
        done
        chmod +x .github/echo_users/user_echo.sh

    - name: 🔓 권한 및 방화벽 설정
      run: |
        echo "GRANT ALL PRIVILEGES ON *.* TO 'user_%'@'%' WITH GRANT OPTION;" > .github/echo_permissions/mysql_grant.sql
        echo "sudo ufw allow 3306/tcp" > .github/echo_firewall/mysql_firewall.sh
        chmod +x .github/echo_firewall/mysql_firewall.sh

    - name: 🏛️ 100개 SQL 테이블 및 쿼리 에코 생성
      run: |
        for i in $(seq 1 100); do
          echo "CREATE TABLE IF NOT EXISTS auto_table_$i (id SERIAL PRIMARY KEY, value TEXT, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);" > .github/echo_sql/auto_table_$i.sql
          echo "SELECT * FROM auto_table_$i WHERE value IS NOT NULL;" > .github/echo_query/query_$i.sql
        done

    - name: 🏦 금융 테이블 및 원장/계좌/고객 에코 생성
      run: |
        echo "CREATE TABLE IF NOT EXISTS customer (id SERIAL PRIMARY KEY, name VARCHAR(100), phone VARCHAR(20));" > .github/echo_finance/customer.sql
        echo "CREATE TABLE IF NOT EXISTS account (account_no VARCHAR(20) PRIMARY KEY, customer_id INT, balance DECIMAL(15,2));" > .github/echo_finance/account.sql
        echo "CREATE TABLE IF NOT EXISTS transaction (tx_id SERIAL PRIMARY KEY, account_no VARCHAR(20), type VARCHAR(10), amount DECIMAL(15,2), timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP);" > .github/echo_finance/transaction.sql
        echo "CREATE TABLE IF NOT EXISTS ledger (entry_id SERIAL PRIMARY KEY, tx_id INT, note TEXT, timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP);" > .github/echo_finance/ledger.sql
        cat .github/echo_finance/*.sql > .github/echo_sql/finance_all.sql

    - name: 💳 고객/계좌/거래/원장 대량 데이터 에코 생성
      run: |
        for i in $(seq 1 100); do
          echo "INSERT INTO customer (name, phone) VALUES ('Customer_$i', '010-0000-$(printf %04d $i)');" >> .github/echo_customer/customer_data.sql
          echo "INSERT INTO account (account_no, customer_id, balance) VALUES ('ACC$(printf %05d $i)', $i, 1000000.00);" >> .github/echo_account/account_data.sql
          echo "INSERT INTO transaction (account_no, type, amount) VALUES ('ACC$(printf %05d $i)', 'DEPOSIT', 50000.00);" >> .github/echo_transaction/transaction_data.sql
          echo "INSERT INTO ledger (tx_id, note) VALUES ($i, 'Ledger entry for ACC$(printf %05d $i)');" >> .github/echo_ledger/ledger_data.sql
        done
        cat .github/echo_*/*_data.sql > .github/echo_sql/finance_bulk_data.sql

    - name: ⚙️ SQL 실행 / 백업 / 보안 스크립트
      run: |
        echo "mysql -uroot -proot -e 'SOURCE .github/echo_sql/finance_all.sql;'" > .github/echo_exec/mysql_exec_finance.sh
        echo "pg_dumpall -U postgres > .github/dump/pg_backup.sql" > .github/echo_backup/pg_backup.sh
        echo "mongodump --out /data/backup" > .github/echo_backup/mongo_backup.sh
        echo "tar -czf .github/dump/sql_all.tgz .github/echo_sql/" > .github/echo_backup/compress_sql.sh
        echo "echo '[SECURITY] 보안 감사 로그 기록'" > .github/echo_security/security_log.sh
        chmod +x .github/echo_exec/*.sh .github/echo_backup/*.sh .github/echo_security/*.sh

    - name: 🖼️ 이미지 생성 에코
      run: |
        for i in $(seq 1 5); do
          echo "convert -size 200x100 xc:white -gravity center -pointsize 20 -draw \"text 0,0 'Image $i'\" .github/echo_img/img_$i.png" >> .github/echo_img/gen_imgs.sh
        done
        chmod +x .github/echo_img/gen_imgs.sh

    - name: 📅 컨테이너 에코 생성 (DB)
      run: |
        echo "docker run -d --name mysql_test -e MYSQL_ROOT_PASSWORD=root -p 3306:3306 mysql:8.0" > .github/echo_containers/mysql.sh
        echo "docker run -d --name pg_test -e POSTGRES_PASSWORD=root -p 5432:5432 postgres:15" > .github/echo_containers/postgres.sh
        echo "docker run -d --name mongo_test -p 27017:27017 mongo" > .github/echo_containers/mongo.sh
        echo "docker run -d --name redis_test -p 6379:6379 redis" > .github/echo_containers/redis.sh
        echo "docker run -d --name oracle_xe -e ORACLE_PASSWORD=oracle -p 1521:1521 gvenzl/oracle-xe" > .github/echo_containers/oracle.sh
        echo "docker run -d --name mssql_test -e 'ACCEPT_EULA=Y' -e 'SA_PASSWORD=Password123!' -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest" > .github/echo_containers/mssql.sh
        echo "docker run -d --name sqlite_test nouchka/sqlite3" > .github/echo_containers/sqlite.sh
        echo "docker run -d --name cassandra_test -p 9042:9042 cassandra" > .github/echo_containers/cassandra.sh
        echo "docker run -d --name clickhouse_test -p 8123:8123 clickhouse/clickhouse-server" > .github/echo_containers/clickhouse.sh
        chmod +x .github/echo_containers/*.sh

    - name: 🧠 미들웨어 컨테이너 실행 (Kafka 등)
      run: |
        echo "docker run -d --name kafka_test -p 9092:9092 bitnami/kafka:latest" > .github/echo_services/kafka.sh
        echo "docker run -d --name rabbitmq_test -p 5672:5672 -p 15672:15672 rabbitmq:3-management" > .github/echo_services/rabbitmq.sh
        echo "docker run -d --name minio_test -p 9000:9000 -p 9001:9001 -e MINIO_ROOT_USER=admin -e MINIO_ROOT_PASSWORD=password minio/minio server /data" > .github/echo_services/minio.sh
        echo "docker run -d --name prometheus_test -p 9090:9090 prom/prometheus" > .github/echo_services/prometheus.sh
        echo "docker run -d --name vault_test -p 8200:8200 -e VAULT_DEV_ROOT_TOKEN_ID=root -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 vault" > .github/echo_services/vault.sh
        chmod +x .github/echo_services/*.sh

    - name: 📂 서버 설치 및 다운로드 스크립트
      run: |
        echo "sudo apt-get update" > .github/echo_tools/init_apt_update.sh
        echo "sudo apt-get install -y htop net-tools curl wget unzip" > .github/echo_tools/init_packages.sh
        echo "wget https://dev.mysql.com/get/mysql-apt-config_0.8.24-1_all.deb -P .github/download" > .github/echo_tools/mysql_deb_download.sh
        chmod +x .github/echo_tools/*.sh

    - name: 🔁 모든 패키지 및 컨테이너 재기동 스크립트 에코
      run: |
        mkdir -p .github/echo_restart
        CONTAINERS=("mysql_test" "pg_test" "mongo_test" "redis_test" "oracle_xe" "mssql_test" "sqlite_test" "cassandra_test" "clickhouse_test" "kafka_test" "rabbitmq_test" "minio_test" "prometheus_test" "vault_test")
        for c in "${CONTAINERS[@]}"; do
          echo "echo '[RESTART] $c 컨테이너 재기동'" >> .github/echo_restart/restart_all.sh
          echo "docker restart $c || echo '[WARN] $c 재기동 실패 또는 실행 중 아님'" >> .github/echo_restart/restart_all.sh
        done
        chmod +x .github/echo_restart/restart_all.sh

    - name: 🔄 패키지 컨테이너 재기동 실행
      run: |
        .github/echo_restart/restart_all.sh | tee .github/echo_logs/restart_output.log

    - name: 📜 최종 요약 로그 출력
      run: |
        echo "echo '[LOG] 전체 시스템, 에코, 미들웨어, SQL, 금융, 백업, 보안, 실행, 재기동 99999999999999999999999% 완료됨 ✅]'" > .github/echo_logs/full_summary.sh
        chmod +x .github/echo_logs/full_summary.sh
        .github/echo_logs/full_summary.sh
