name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '34 20 * * 2'  # 매주 화요일 20:34 UTC
  push:
    branches: [ "main" ]

permissions:
  security-events: write
  contents: read

jobs:
  prepare-and-scan:
    name: 🛡️ Prepare & Run OSV Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Install dependencies
        run: |
          echo "[+] Installing dependencies: jq, curl, unzip, git, gh"
          sudo apt-get update -y
          sudo apt-get install -y jq curl unzip git gh

          echo "[+] Checking installed versions"
          jq --version
          curl --version
          unzip -v
          git --version
          gh --version

      - name: 💡 Echo setup info
        run: |
          echo "[📁] Current directory: $(pwd)"
          echo "[📄] Listing repo contents:"
          ls -alh

      - name: 🧪 Run OSV-Scanner (manual)
        run: |
          echo "[🧪] Running osv-scanner..."
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner-linux-amd64 -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner -r --skip-git ./ | tee osv-results.txt

      - name: 📁 Convert to SARIF format
        run: |
          echo "[🧾] Converting results to SARIF..."
          ./osv-scanner -r --skip-git ./ --format sarif > osv-results.sarif
          echo "[✔] SARIF output created at osv-results.sarif"
          head -n 20 osv-results.sarif

      - name: 📤 Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
