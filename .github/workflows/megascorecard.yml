name: "💽 SpringBoot Disk+Dirs — 1min Cron + Multi-Partition + Live .github + Bulk Gen/Upgrade (no unmount)"

on:
  workflow_dispatch:
    inputs:
      disk_size_mb:
        description: "Initial disk image size (MB)"
        default: "2048"
        required: true
      resize_to_mb:
        description: "Grow whole image to this size (MB). Leave blank to keep current"
        default: ""
        required: false
      fs_type:
        description: "Filesystem for partitions: ext4 | xfs | btrfs"
        default: "ext4"
        required: true
      mount_point:
        description: "Mount point for partition #1 (partition #2 mounts at <mount_point>/part2)"
        default: "/mnt/gh-disk"
        required: true
      dir_list:
        description: "Extra dirs (comma-separated) to create on repo + both mounts"
        default: "logs,tmp,backup,data,site,.github/echo_logs,.github/echo_scripts"
        required: true
      owner_group:
        description: "Owner and group in user:group format"
        default: "runner:runner"
        required: true
      dir_mode:
        description: "Directory permission (octal)"
        default: "0755"
        required: true
      bulk_spec:
        description: "Bulk generator spec: dirs=<N>,files=<M>,size_kb=<K>,prefix=<name>"
        default: "dirs=100,files=10,size_kb=4,prefix=gen"
        required: true
      commit_and_push:
        description: "Commit & push generated files? true|false"
        default: "true"
        required: true
      commit_message:
        description: "Commit message"
        default: "chore: disk+dirs + multi-partition + live .github + bulk gen/upgrade (auto)"
        required: true

  schedule:
    - cron: "*/1 * * * *"

permissions:
  contents: write

concurrency:
  group: springboot-disk-dirs
  cancel-in-progress: false

jobs:
  springboot-disk-dirs:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DISK_IMG: disk.img
      LOG_DIR: .github/echo_logs
      ECHO_DIR: .github/echo_scripts
      MOUNT_P1_NAME: p1
      MOUNT_P2_NAME: p2
      GIT_USER_NAME: gh-actions-bot
      GIT_USER_EMAIL: gh-actions-bot@example.com

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: 🧰 Init — FULL ECHO bootstrap (+helpers, heredoc safe)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$ECHO_DIR"
          export PS4='+ [$(date "+%F %T")] ${BASH_SOURCE##*/}:${LINENO}:${FUNCNAME[0]:-main} ▶ '
          exec > >(tee -a "$LOG_DIR/00_full.log") 2>&1
          set -x
          set +H   # disable history expansion
          run_cmd() { echo "[CMD] $*"; eval "$@"; }
          cat > "$ECHO_DIR/_helpers.sh" <<'BASH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          export PS4='+ [$(date "+%F %T")] ${BASH_SOURCE##*/}:${LINENO}:${FUNCNAME[0]:-main} ▶ '
          set -x
          run_cmd() { echo "[CMD] $*"; eval "$@"; }
          # Idempotent loop device fetch/attach
          get_loop() {
            local dev
            dev="$(sudo losetup -j "$DISK_IMG" | awk -F: '{print $1}')" || dev=""
            if [[ -z "${dev}" ]]; then
              sudo losetup -fP "$DISK_IMG"
              dev="$(sudo losetup -j "$DISK_IMG" | awk -F: '{print $1}')" || dev=""
            fi
            [[ -z "${dev}" ]] && { echo "[ERROR] loop device not found for $DISK_IMG" >&2; return 1; }
            printf "%s" "$dev"
          }
          parse_owner_group() {
            local og="${1:-runner:runner}"
            local u="${og%%:*}"
            local g="${og#*:}"
            [[ -z "$u" ]] && u="runner"
            [[ -z "$g" ]] && g="runner"
            echo "$u" "$g"
          }
          # Safe defaults when workflow_dispatch inputs are empty (e.g. on schedule)
          default_mount()      { echo "${INPUT_MOUNT_POINT:-/mnt/gh-disk}"; }
          default_fs()         { echo "${INPUT_FS_TYPE:-ext4}"; }
          default_dir_mode()   { echo "${INPUT_DIR_MODE:-0755}"; }
          default_dir_list()   { echo "${INPUT_DIR_LIST:-logs,tmp,backup,data,site,.github/echo_logs,.github/echo_scripts}"; }
          default_bulk_spec()  { echo "${INPUT_BULK_SPEC:-dirs=100,files=10,size_kb=4,prefix=gen}"; }
          BASH
          chmod +x "$ECHO_DIR/_helpers.sh"

      - name: 📦 Ensure FS tools (xfsprogs, btrfs-progs, parted)
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/05_fs_tools.log") 2>&1
          set -x
          FST_RAW="${{ inputs.fs_type }}"
          FST="$(INPUT_FS_TYPE="$FST_RAW" default_fs)"
          run_cmd "sudo apt-get update -y"
          run_cmd "sudo apt-get install -y parted"
          if [[ "$FST" == "xfs" ]]; then
            run_cmd "sudo apt-get install -y xfsprogs"
          elif [[ "$FST" == "btrfs" ]]; then
            run_cmd "sudo apt-get install -y btrfs-progs"
          else
            echo "[ECHO] ext4 selected — e2fsprogs present"
          fi

      - name: 🧱 Create disk image (sparse) + attach loop
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/10_image_loop.log") 2>&1
          set -x
          RAW_SIZE_MB="${{ inputs.disk_size_mb }}"
          if [[ -z "${RAW_SIZE_MB:-}" || ! "${RAW_SIZE_MB}" =~ ^[0-9]+$ ]]; then
            RAW_SIZE_MB="2048"
            echo "[ECHO] inputs.disk_size_mb empty/invalid → default 2048MB"
          fi
          CUR_BYTES="$(stat -c%s "$DISK_IMG" 2>/dev/null || echo 0)"
          if (( CUR_BYTES == 0 )); then
            run_cmd "truncate -s ${RAW_SIZE_MB}M \"$DISK_IMG\""
            echo "[ECHO] Created sparse image: ${RAW_SIZE_MB}MB"
          else
            echo "[ECHO] Existing image: ${CUR_BYTES} bytes → keep"
          fi
          LOOP_DEV="$(get_loop)"; echo "[ECHO] LOOP_DEV=$LOOP_DEV"
          run_cmd "ls -lh \"$DISK_IMG\""

      - name: 🧭 Partition GPT (p1=60%, p2=rest) — idempotent
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/12_parted.log") 2>&1
          set -x
          LOOP_DEV="$(get_loop)"; echo "[ECHO] LOOP_DEV=$LOOP_DEV"
          run_cmd "sudo parted -s \"$LOOP_DEV\" print || true"
          run_cmd "sudo parted -s \"$LOOP_DEV\" mklabel gpt || true"
          run_cmd "sudo parted -s \"$LOOP_DEV\" mkpart ${MOUNT_P1_NAME} 1MiB 60% || true"
          run_cmd "sudo parted -s \"$LOOP_DEV\" mkpart ${MOUNT_P2_NAME} 60% 100% || true"
          run_cmd "sudo partprobe \"$LOOP_DEV\" || true"
          run_cmd "ls -l ${LOOP_DEV}* || true"

      - name: 🧪 Make filesystems on p1/p2
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/14_mkfs.log") 2>&1
          set -x
          FST_RAW="${{ inputs.fs_type }}"
          FST="$(INPUT_FS_TYPE="$FST_RAW" default_fs)"
          LOOP_DEV="$(get_loop)"
          P1="${LOOP_DEV}p1"; P2="${LOOP_DEV}p2"
          case "$FST" in
            ext4)  run_cmd "sudo mkfs.ext4 -F \"$P1\""; run_cmd "sudo mkfs.ext4 -F \"$P2\"" ;;
            xfs)   run_cmd "sudo mkfs.xfs -f \"$P1\"";  run_cmd "sudo mkfs.xfs -f \"$P2\"" ;;
            btrfs) run_cmd "sudo mkfs.btrfs -f \"$P1\"";run_cmd "sudo mkfs.btrfs -f \"$P2\"" ;;
          esac

      - name: 🔗 Mount p1 & p2 (create part2 AFTER p1 mount)
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/16_mount.log") 2>&1
          set -x
          MNT_RAW="${{ inputs.mount_point }}"
          MNT="$(INPUT_MOUNT_POINT="$MNT_RAW" default_mount)"
          OG_RAW="${{ inputs.owner_group }}"
          read OWNER GROUP < <(parse_owner_group "${OG_RAW:-runner:runner}")
          LOOP_DEV="$(get_loop)"
          P1="${LOOP_DEV}p1"; P2="${LOOP_DEV}p2"
          run_cmd "sudo mkdir -p \"${MNT}\""
          if mount | grep -q " on ${MNT} "; then
            echo "[ECHO] ${MNT} already mounted"
          else
            run_cmd "sudo mount \"$P1\" \"${MNT}\""
          fi
          run_cmd "sudo mkdir -p \"${MNT}/part2\""
          if mount | grep -q " on ${MNT}/part2 "; then
            echo "[ECHO] ${MNT}/part2 already mounted"
          else
            run_cmd "sudo mount \"$P2\" \"${MNT}/part2\""
          fi
          run_cmd "sudo chown -R \"${OWNER}:${GROUP}\" \"${MNT}\""
          run_cmd "mount | grep -E \" on ${MNT} | on ${MNT}/part2 \" || true"
          run_cmd "df -h | grep -E \"loop|Filesystem\" || true"

      - name: 📁 Create Spring Boot + extra dirs (repo + both mounts)
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/20_dirs.log") 2>&1
          set -x
          MNT_RAW="${{ inputs.mount_point }}"
          MNT="$(INPUT_MOUNT_POINT="$MNT_RAW" default_mount)"
          OG_RAW="${{ inputs.owner_group }}"
          MODE_RAW="${{ inputs.dir_mode }}"
          MODE="$(INPUT_DIR_MODE="$MODE_RAW" default_dir_mode)"
          read OWNER GROUP < <(parse_owner_group "${OG_RAW:-runner:runner}")
          SB_DIRS=( "src/main/java" "src/main/resources" "src/test/java" "src/test/resources" "logs" "tmp" "backup" "data" "site" ".github/echo_logs" ".github/echo_scripts" )
          DL_RAW="${{ inputs.dir_list }}"
          IFS=',' read -ra EXTRA <<< "$(INPUT_DIR_LIST="$DL_RAW" default_dir_list)"
          for x in "${EXTRA[@]}"; do SB_DIRS+=("$(echo "$x" | xargs)"); done
          printf '%s\n' "${SB_DIRS[@]}" | sed '/^$/d' | sort -u > "$ECHO_DIR/.all_dirs.txt"
          while IFS= read -r d; do
            run_cmd "mkdir -p \"${d}\" \"${MNT}/${d}\" \"${MNT}/part2/${d}\""
            run_cmd "sudo chown -R \"${OWNER}:${GROUP}\" \"${d}\" \"${MNT}/${d}\" \"${MNT}/part2/${d}\""
            run_cmd "sudo chmod \"${MODE}\" \"${d}\" \"${MNT}/${d}\" \"${MNT}/part2/${d}\""
            [ -e "${d}/.gitkeep" ] || : > "${d}/.gitkeep"
            echo -e "#!/usr/bin/env bash\nset -Eeuo pipefail\nset -x\nmkdir -p \"${d}\" \"${MNT}/${d}\" \"${MNT}/part2/${d}\"\nsudo chown -R \"${OWNER}:${GROUP}\" \"${d}\" \"${MNT}/${d}\" \"${MNT}/part2/${d}\"\nsudo chmod \"${MODE}\" \"${d}\" \"${MNT}/${d}\" \"${MNT}/part2/${d}\"\n[ -e \"${d}/.gitkeep\" ] || : > \"${d}/.gitkeep\"" > "$ECHO_DIR/mkdir_$(echo "$d" | tr '/' '_' ).sh"
            chmod +x "$ECHO_DIR/mkdir_$(echo "$d" | tr '/' '_' ).sh"
          done < "$ECHO_DIR/.all_dirs.txt"

      - name: 📏 Online resize — ALWAYS (grow image → refresh loop → resizepart 2 → grow FS)
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/30_resize.log") 2>&1
          set -x
          MNT_RAW="${{ inputs.mount_point }}"
          MNT="$(INPUT_MOUNT_POINT="$MNT_RAW" default_mount)"
          FST_RAW="${{ inputs.fs_type }}"
          FST="$(INPUT_FS_TYPE="$FST_RAW" default_fs)"
          CUR_BYTES="$(stat -c%s "$DISK_IMG")"
          CUR_MB=$(( (CUR_BYTES + 1048575) / 1048576 ))
          REQ_MB_RAW="${{ inputs.resize_to_mb }}"
          if [[ -n "${REQ_MB_RAW:-}" && "${REQ_MB_RAW}" =~ ^[0-9]+$ ]]; then
            NEW_MB="$REQ_MB_RAW"
          else
            NEW_MB="$CUR_MB"
          fi
          echo "[ECHO] Current=${CUR_MB}MB, Requested=${NEW_MB}MB"
          if (( NEW_MB > CUR_MB )); then
            run_cmd "truncate -s ${NEW_MB}M \"$DISK_IMG\""
          else
            echo "[ECHO] No file growth needed"
          fi
          LOOP_DEV="$(get_loop)"
          run_cmd "sudo losetup -c \"$LOOP_DEV\""
          run_cmd "sudo parted -s \"$LOOP_DEV\" resizepart 2 100% || true"
          run_cmd "sudo partprobe \"$LOOP_DEV\" || true"
          case "$FST" in
            ext4)  run_cmd "sudo resize2fs \"${LOOP_DEV}p2\"" ;;
            xfs)   run_cmd "sudo xfs_growfs \"${MNT}/part2\"" ;;
            btrfs) run_cmd "sudo btrfs filesystem resize max \"${MNT}/part2\"" ;;
          esac
          run_cmd "df -h | grep -E \"${MNT}(/part2)?\" || true"

      - name: 🧨 Bulk generator/upgrade — repo + both mounts (idempotent)
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/35_bulkgen.log") 2>&1
          set -x
          SPEC_RAW="${{ inputs.bulk_spec }}"
          SPEC="$(INPUT_BULK_SPEC="$SPEC_RAW" default_bulk_spec)"
          getv(){
            local key="${1-}"
            [ -z "$key" ] && return 0
            echo "$SPEC" | tr ',' '\n' | awk -F= -v k="$key" '$1==k{print $2}'
          }
          NUM_DIRS="$(getv dirs)"; NUM_FILES="$(getv files)"; SIZE_KB="$(getv size_kb)"; PREFIX="$(getv prefix)"
          : "${NUM_DIRS:=100}" ; : "${NUM_FILES:=10}" ; : "${SIZE_KB:=4}" ; : "${PREFIX:=gen}"
          echo "[ECHO] bulk_spec → dirs=$NUM_DIRS files=$NUM_FILES size_kb=$SIZE_KB prefix=$PREFIX"
          MNT_RAW="${{ inputs.mount_point }}"
          MNT="$(INPUT_MOUNT_POINT="$MNT_RAW" default_mount)"
          OG_RAW="${{ inputs.owner_group }}"
          MODE_RAW="${{ inputs.dir_mode }}"
          MODE="$(INPUT_DIR_MODE="$MODE_RAW" default_dir_mode)"
          read OWNER GROUP < <(parse_owner_group "${OG_RAW:-runner:runner}")
          ROOT_REPO="bulk/${PREFIX}"
          ROOT_P1="${MNT}/bulk/${PREFIX}"
          ROOT_P2="${MNT}/part2/bulk/${PREFIX}"
          run_cmd "mkdir -p \"$ROOT_REPO\" \"$ROOT_P1\" \"$ROOT_P2\""
          run_cmd "sudo chown -R \"${OWNER}:${GROUP}\" \"$ROOT_REPO\" \"$ROOT_P1\" \"$ROOT_P2\""
          run_cmd "sudo chmod -R \"${MODE}\" \"$ROOT_REPO\" \"$ROOT_P1\" \"$ROOT_P2\""

          create_or_upgrade_dir() {
            local base="${1-}"
            local i="${2-}"
            [[ -z "$base" || -z "$i" ]] && { echo "[ECHO] create_or_upgrade_dir(): missing args" >&2; return 1; }
            local d="${base}/$(printf '%s-%06d' "$PREFIX" "$i")"
            mkdir -p "$d"
            for n in $(seq 1 "$NUM_FILES"); do
              local f="${d}/file-$(printf '%04d' "$n").bin"
              if [ -f "$f" ]; then
                local cur; cur="$(stat -c%s "$f" || echo 0)"
                local need=$(( SIZE_KB * 1024 ))
                (( cur < need )) && truncate -s "${need}" "$f" || true
              else
                truncate -s "$(( SIZE_KB * 1024 ))" "$f"
              fi
            done
          }
          export -f create_or_upgrade_dir

          for i in $(seq 1 "$NUM_DIRS"); do
            create_or_upgrade_dir "$ROOT_REPO" "$i"
            create_or_upgrade_dir "$ROOT_P1"   "$i"
            create_or_upgrade_dir "$ROOT_P2"   "$i"
          done
          run_cmd "sudo chown -R \"${OWNER}:${GROUP}\" \"bulk\" \"$MNT/bulk\" \"$MNT/part2/bulk\""
          run_cmd "sudo chmod -R \"${MODE}\" \"bulk\" \"$MNT/bulk\" \"$MNT/part2/bulk\""

          cat > "$ECHO_DIR/bulk_gen_upgrade.sh" <<'BASH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          set -x
          SPEC='__SPEC__PLACEHOLDER__'
          getv(){
            local key="${1-}"
            [ -z "$key" ] && return 0
            echo "$SPEC" | tr "," "\n" | awk -F= -v k="$key" '$1==k{print $2}'
          }
          NUM_DIRS="$(getv dirs)"; NUM_FILES="$(getv files)"; SIZE_KB="$(getv size_kb)"; PREFIX="$(getv prefix)"
          : "${NUM_DIRS:=100}"; : "${NUM_FILES:=10}"; : "${SIZE_KB:=4}"; : "${PREFIX:=gen}"
          MNT="__MNT__"; OWNER="__OWNER__"; GROUP="__GROUP__"; MODE="__MODE__"
          ROOT_REPO="bulk/${PREFIX}"; ROOT_P1="${MNT}/bulk/${PREFIX}"; ROOT_P2="${MNT}/part2/bulk/${PREFIX}"

          create_or_upgrade_dir() {
            local base="${1-}"
            local i="${2-}"
            [[ -z "$base" || -z "$i" ]] && { echo "[ECHO] create_or_upgrade_dir(): missing args" >&2; return 1; }
            local d="${base}/$(printf '%s-%06d' "$PREFIX" "$i")"
            mkdir -p "$d"
            for n in $(seq 1 "$NUM_FILES"); do
              local f="${d}/file-$(printf '%04d' "$n").bin"
              if [ -f "$f" ]; then
                local cur; cur="$(stat -c%s "$f" || echo 0)"
                local need=$(( SIZE_KB * 1024 ))
                (( cur < need )) && truncate -s "${need}" "$f" || true
              else
                truncate -s "$(( SIZE_KB * 1024 ))" "$f"
              fi
            done
          }

          for i in $(seq 1 "$NUM_DIRS"); do
            create_or_upgrade_dir "$ROOT_REPO" "$i"
            create_or_upgrade_dir "$ROOT_P1" "$i"
            create_or_upgrade_dir "$ROOT_P2" "$i"
          done
          sudo chown -R "$OWNER:$GROUP" "bulk" "$MNT/bulk" "$MNT/part2/bulk"
          sudo chmod -R "$MODE" "bulk" "$MNT/bulk" "$MNT/part2/bulk"
          BASH
          # 값 치환
          sed -i "s|__SPEC__PLACEHOLDER__|${SPEC//|/\\|}|g" "$ECHO_DIR/bulk_gen_upgrade.sh"
          sed -i "s|__MNT__|$MNT|g; s|__OWNER__|$OWNER|g; s|__GROUP__|$GROUP|g; s|__MODE__|$MODE|g" "$ECHO_DIR/bulk_gen_upgrade.sh"
          chmod +x "$ECHO_DIR/bulk_gen_upgrade.sh"

      - name: 👀 Live .github watcher — mirror new dirs to both mounts (5 min)
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/40_live_github_watch.log") 2>&1
          set -x
          MNT_RAW="${{ inputs.mount_point }}"
          MNT="$(INPUT_MOUNT_POINT="$MNT_RAW" default_mount)"
          OG_RAW="${{ inputs.owner_group }}"
          MODE_RAW="${{ inputs.dir_mode }}"
          MODE="$(INPUT_DIR_MODE="$MODE_RAW" default_dir_mode)"
          read OWNER GROUP < <(parse_owner_group "${OG_RAW:-runner:runner}")
          SNAP="$ECHO_DIR/.github_dirs.snap"
          find .github -type d -printf "%P\n" | sed '/^$/d' | sort -u > "$SNAP" || true
          for i in $(seq 1 60); do
            sleep 5
            NEW_SNAP="$ECHO_DIR/.github_dirs.new"
            find .github -type d -printf "%P\n" | sed '/^$/d' | sort -u > "$NEW_SNAP" || true
            DIFF="$ECHO_DIR/.github_dirs.diff"
            comm -13 "$SNAP" "$NEW_SNAP" > "$DIFF" || true
            if [ -s "$DIFF" ]; then
              echo "[ECHO] Detected new .github directories:"; cat "$DIFF"
              while IFS= read -r rel; do
                [[ -z "$rel" ]] && continue
                run_cmd "mkdir -p \"${MNT}/.github/${rel}\" \"${MNT}/part2/.github/${rel}\""
                run_cmd "sudo chown -R \"${OWNER}:${GROUP}\" \"${MNT}/.github/${rel}\" \"${MNT}/part2/.github/${rel}\""
                run_cmd "sudo chmod \"${MODE}\" \"${MNT}/.github/${rel}\" \"${MNT}/part2/.github/${rel}\""
                echo -e "#!/usr/bin/env bash\nset -Eeuo pipefail\nset -x\nmkdir -p \"${MNT}/.github/${rel}\" \"${MNT}/part2/.github/${rel}\"\nsudo chown -R \"${OWNER}:${GROUP}\" \"${MNT}/.github/${rel}\" \"${MNT}/part2/.github/${rel}\"\nsudo chmod \"${MODE}\" \"${MNT}/.github/${rel}\" \"${MNT}/part2/.github/${rel}\"" > "$ECHO_DIR/mirror_github_$(echo "$rel" | tr '/' '_' ).sh"
                chmod +x "$ECHO_DIR/mirror_github_$(echo "$rel" | tr '/' '_' ).sh"
              done < "$DIFF"
              mv "$NEW_SNAP" "$SNAP"
            else
              echo "[ECHO] No new .github directories (iteration $i)"
            fi
          done

      - name: 🧾 Generate EXTRA workflows/configs (.github/workflows + configs) — bulk, idempotent
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ".github/echo_logs/42_generate_workflows.log") 2>&1
          set -x
          mkdir -p .github/workflows .github
          gen() {
            local path="${1-}"
            shift || true
            local content="${*:-}"
            if [[ -z "$path" ]]; then
              echo "[ECHO] gen(): missing path" >&2
              return 1
            fi
            if [ ! -f "$path" ]; then
              printf "%s\n" "$content" > "$path"
              echo "[ECHO] created: $path"
            else
              echo "[ECHO] exists (skip): $path"
            fi
          }

          # --- 기본 5종 ---
          gen ".github/workflows/diskdirs-resize-only.yml" "$(cat <<'YAML'
          name: "🧩 DiskDirs — Resize Only (manual)"
          on: { workflow_dispatch: {} }
          jobs:
            resize:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Echo Resize Hint
                  run: echo "[ECHO] Use main workflow inputs.resize_to_mb to grow disk.img"
          YAML
          )"
          gen ".github/workflows/pages-size-report.yml" "$(cat <<'YAML'
          name: "📊 Repo Size Report (manual)"
          on: { workflow_dispatch: {} }
          permissions: { contents: read }
          jobs:
            report:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Size Snapshot
                  run: |
                    set -Eeuo pipefail
                    mkdir -p .github/echo_monitoring
                    du -ah . 2>/dev/null | sort -hr 2>/dev/null | head -n 50 > .github/echo_monitoring/top_file_sizes.txt || true
                    du -sh . > .github/echo_monitoring/total_size.txt || true
                - uses: actions/upload-artifact@v4
                  with:
                    name: repo-size-report
                    path: .github/echo_monitoring/**
          YAML
          )"
          gen ".github/workflows/echo-bulkgen-manual.yml" "$(cat <<'YAML'
          name: "🧨 Echo BulkGen (manual)"
          on: { workflow_dispatch: {} }
          jobs:
            bulk:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Bulk Create (echo only)
                  run: |
                    set -Eeuo pipefail
                    mkdir -p .github/echo_scripts
                    echo '#!/usr/bin/env bash' > .github/echo_scripts/sample_bulk.sh
                    echo 'echo "[ECHO] bulk generator placeholder (use main workflow for real gen)"' >> .github/echo_scripts/sample_bulk.sh
                    chmod +x .github/echo_scripts/sample_bulk.sh
          YAML
          )"
          gen ".github/workflows/dummy-keepalive-1min.yml" "$(cat <<'YAML'
          name: "⏱️ 1min Keepalive — Echo"
          on:
            schedule:
              - cron: "*/1 * * * *"
          jobs:
            ping:
              runs-on: ubuntu-latest
              steps:
                - run: echo "[ECHO] keepalive tick $(date -u +%FT%TZ)"
          YAML
          )"
          gen ".github/workflows/echo-verify-yaml.yml" "$(cat <<'YAML'
          name: "✅ Echo Verify — YAML Syntax"
          on: { workflow_dispatch: {} }
          jobs:
            lint:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Check workflow files exist
                  run: |
                    set -Eeuo pipefail
                    test -d .github/workflows
                    ls -la .github/workflows
          YAML
          )"

          # --- 추가 CI/보안 6종 (Push Protection 회피: 토큰 라인 없이 생성) ---
          gen ".github/workflows/java-maven-ci.yml" "$(cat <<'YAML'
          name: "☕ Java CI (Maven)"
          on: { push: { branches: ["**"] }, pull_request: {} }
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: "17"
                    cache: maven
                - name: Build & Test
                  run: mvn -B -ntp -DskipTests=false verify
          YAML
          )"
          gen ".github/workflows/java-gradle-ci.yml" "$(cat <<'YAML'
          name: "☕ Java CI (Gradle)"
          on:
            push: { branches: ["**"] }
            pull_request: {}
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: "17"
                    cache: gradle
                - name: Build & Test
                  run: |
                    if [ -f gradlew ]; then chmod +x gradlew; ./gradlew build --no-daemon;
                    else echo "[ECHO] gradlew not found — skipping"; fi
          YAML
          )"
          gen ".github/workflows/codeql.yml" "$(cat <<'YAML'
          name: "🔍 CodeQL (Java)"
          permissions:
            contents: read
            security-events: write
            actions: read
          on:
            push: { branches: ["main"] }
            pull_request: { branches: ["main"] }
            schedule: [{ cron: "0 2 * * 1" }]
          jobs:
            analyze:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: github/codeql-action/init@v3
                  with: { languages: "java" }
                - uses: github/codeql-action/autobuild@v3
                - uses: github/codeql-action/analyze@v3
          YAML
          )"
          gen ".github/workflows/shellcheck.yml" "$(cat <<'YAML'
          name: "🧪 ShellCheck"
          on: { push: { paths: ["**/*.sh","**/*.bash"] }, pull_request: { paths: ["**/*.sh","**/*.bash"] } }
          jobs:
            shellcheck:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: ludeeus/action-shellcheck@v2
          YAML
          )"
          gen ".github/workflows/markdown-lint.yml" "$(cat <<'YAML'
          name: "📝 Markdown Lint"
          on: { push: { paths: ["**/*.md"] }, pull_request: { paths: ["**/*.md"] } }
          jobs:
            mdl:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: DavidAnson/markdownlint-cli2-action@v16
                  with:
                    globs: "**/*.md"
          YAML
          )"
          gen ".github/workflows/yamllint.yml" "$(cat <<'YAML'
          name: "📐 YAML Lint"
          on: { push: { paths: ["**/*.yml","**/*.yaml"] }, pull_request: { paths: ["**/*.yml","**/*.yaml"] } }
          jobs:
            lint:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: ibiqlik/action-yamllint@v3
                  with:
                    format: colored
          YAML
          )"
          # (참고) PR 타이틀 린트 / Release Drafter는 토큰 라인 없이 생성
          gen ".github/workflows/pr-title-lint.yml" "$(cat <<'YAML'
          name: "🏷️ PR Title Lint (Conventional Commits)"
          on: [pull_request_target]
          permissions:
            pull-requests: read
          jobs:
            lint:
              runs-on: ubuntu-latest
              steps:
                - uses: amannn/action-semantic-pull-request@v5
                #  NOTE: 필요 시 아래 주석 해제 후 비밀 토큰 연결
                #  env:
                #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YAML
          )"
          gen ".github/workflows/release-drafter.yml" "$(cat <<'YAML'
          name: "📦 Release Drafter"
          on:
            push: { branches: ["main"] }
            pull_request:
              types: [opened, reopened, synchronize, labeled, unlabeled]
          permissions:
            contents: write
            pull-requests: read
          jobs:
            update_release_draft:
              runs-on: ubuntu-latest
              steps:
                - uses: release-drafter/release-drafter@v6
                #  NOTE: 필요 시 아래 주석 해제 후 비밀 토큰 연결
                #  env:
                #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YAML
          )"
          # ---- 추가 설정 파일들 (.github/*) ----
          gen ".github/labeler.yml" "$(cat <<'YAML'
          area/backend:
            - 'src/**'
          area/workflow:
            - '.github/workflows/**'
          area/docs:
            - '**/*.md'
          YAML
          )"
          gen ".github/dependabot.yml" "$(cat <<'YAML'
          version: 2
          updates:
            - package-ecosystem: "maven"
              directory: "/"
              schedule: { interval: "weekly" }
            - package-ecosystem: "github-actions"
              directory: "/"
              schedule: { interval: "weekly" }
          YAML
          )"
          gen ".github/release-drafter.yml" "$(cat <<'YAML'
          name-template: 'v$NEXT_PATCH_VERSION'
          tag-template: 'v$NEXT_PATCH_VERSION'
          categories:
            - title: '🚀 Features'
              labels: ['feature', 'enhancement']
            - title: '🐛 Fixes'
              labels: ['bug', 'fix']
            - title: '🧰 Maintenance'
              labels: ['chore', 'deps']
          change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
          template: |
            ## What’s Changed
            $CHANGES
          YAML
          )"

      - name: 📊 Size reports (safe)
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/45_sizes.log") 2>&1
          set -x
          mkdir -p .github/echo_monitoring
          run_cmd "du -ah . 2>/dev/null | sort -hr 2>/dev/null | head -n 50 > .github/echo_monitoring/top_file_sizes.txt || true"
          run_cmd "du -sh . > .github/echo_monitoring/total_size.txt || true"
          run_cmd "df -h > .github/echo_monitoring/df_all.txt || true"

      - name: 📝 .gitignore (avoid committing disk.img, logs)
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/50_gitignore.log") 2>&1
          set -x
          echo -e "\n# auto-generated\n${DISK_IMG}\n*.img\n.github/echo_logs/*.log\n" >> .gitignore
          run_cmd "tail -n 20 .gitignore || true"
          printf '#!/usr/bin/env bash\nset -Eeuo pipefail\nset -x\necho -e "\\n# auto-generated\\n%s\\n*.img\\n.github/echo_logs/*.log\\n" >> .gitignore\n' "${DISK_IMG}" > "$ECHO_DIR/add_gitignore.sh"
          chmod +x "$ECHO_DIR/add_gitignore.sh"

      - name: ✅ Commit & push (rebase; PAT fallback; GH013 sanitize; workflows-perm fallback; backup branch)
        if: ${{ inputs.commit_and_push == 'true' || github.event_name == 'schedule' }}
        shell: bash
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}  # (선택) Fine-grained PAT: repo/workflows RW
          GH_ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}
          COMMIT_MSG_IN: ${{ inputs.commit_message }}
        run: |
          set -Eeuo pipefail
          source "$ECHO_DIR/_helpers.sh"
          exec > >(tee -a "$LOG_DIR/60_commit_push.log") 2>&1
          set -x
          git config user.name "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"
          git config pull.rebase true

          TARGET_BR="${GITHUB_REF_NAME}"
          CURRENT="$(git rev-parse --abbrev-ref HEAD)"
          git fetch origin --prune
          if [[ "$CURRENT" != "$TARGET_BR" ]]; then
            git checkout -B "$TARGET_BR" "origin/$TARGET_BR" 2>/dev/null || git checkout -B "$TARGET_BR"
          fi

          mapfile -t DIRS < "$ECHO_DIR/.all_dirs.txt" || true
          git add \
            .gitignore \
            .github/workflows \
            .github/echo_scripts \
            .github/echo_logs \
            .github/echo_monitoring \
            .github/*.yml \
            bulk \
            "${DIRS[@]/#/.\/}" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "[ECHO] No changes to commit."
            exit 0
          fi

          COMMIT_MSG="${COMMIT_MSG_IN:-chore: disk+dirs auto (cron)}"
          git commit -m "$COMMIT_MSG"

          PUSH_LOG="$ECHO_DIR/.push_err.txt"

          # 안전한 remote 설정 (로그 마스킹)
          set +x
          if [[ -n "${WORKFLOW_PAT:-}" ]]; then
            echo "[ECHO] Using WORKFLOW_PAT (workflow files allowed)"
            git remote set-url origin "https://${GH_ACTOR}:${WORKFLOW_PAT}@github.com/${GH_REPO}.git"
          else
            echo "[ECHO] WORKFLOW_PAT not set → fallback GITHUB_TOKEN"
            git remote set-url origin "https://${GH_ACTOR}:${GITHUB_TOKEN}@github.com/${GH_REPO}.git"
          fi
          set -x

          if git push origin "$TARGET_BR" 2> "$PUSH_LOG"; then
            echo "[ECHO] Pushed to origin/$TARGET_BR (fast-forward)"
            exit 0
          fi

          echo "[ECHO] Push rejected — trying rebase on origin/$TARGET_BR"
          git fetch origin --prune
          git rebase "origin/$TARGET_BR" || { git rebase --abort || true; echo "[ECHO] rebase failed, will fallback"; }
          if git push origin "$TARGET_BR" 2> "$PUSH_LOG"; then
            echo "[ECHO] Pushed to origin/$TARGET_BR after rebase"
            exit 0
          fi

          # GH013: Repository rule violations → 경로 정규화 후 민감 라인 제거
          if grep -q 'Repository rule violations' "$PUSH_LOG"; then
            echo "[ECHO] GH013 detected → sanitizing flagged files and retrying"
            # path: some/file.yml:12 → real path만 추출
            grep -o 'path: .*' "$PUSH_LOG" | sed 's/^path: //' | while read -r p; do
              p_clean="${p%%:*}"
              echo "[ECHO] Sanitizing $p_clean"
              if [[ -f "$p_clean" ]]; then
                sed -i '/GITHUB_TOKEN:/d' "$p_clean" || true
              fi
            done
            git add -A
            git commit -m "$COMMIT_MSG (sanitized for push-protection)" || true
            if git push origin "$TARGET_BR" 2> "$PUSH_LOG"; then
              echo "[ECHO] Pushed sanitized commit"
              exit 0
            fi
          fi

          # 워크플로우 파일 권한 부족 → workflows 디렉토리 제외
          if grep -qi 'without `workflows` permission' "$PUSH_LOG"; then
            echo "[ECHO] Missing workflows permission → re-commit without .github/workflows"
            git reset --soft HEAD~1 || true
            git restore --staged .
            git add \
              .gitignore \
              .github/echo_scripts \
              .github/echo_logs \
              .github/echo_monitoring \
              .github/*.yml \
              bulk \
              "${DIRS[@]/#/.\/}" 2>/dev/null || true
            git commit -m "$COMMIT_MSG (no workflows)"
            if git push origin "$TARGET_BR" 2> "$PUSH_LOG"; then
              echo "[ECHO] Pushed without .github/workflows"
              exit 0
            fi
          fi

          # 백업 브랜치
          BK="actions/autocommit-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "[ECHO] Pushing to backup branch: $BK"
          git checkout -B "$BK"
          if git push -u origin "$BK" 2> "$PUSH_LOG"; then
            echo "[ECHO] Backup branch pushed: origin/$BK"
            exit 0
          fi

          # 백업도 GH013이면, 플래그 파일 제거 후 재시도
          if grep -q 'Repository rule violations' "$PUSH_LOG"; then
            echo "[ECHO] GH013 on backup branch → removing flagged files and retrying"
            grep -o 'path: .*' "$PUSH_LOG" | sed 's/^path: //' | while read -r p; do
              p_clean="${p%%:*}"
              echo "[ECHO] Removing flagged path: $p_clean"
              git rm -f --cached "$p_clean" || true
              rm -f "$p_clean" || true
            done
            git commit -m "$COMMIT_MSG (removed GH013-flagged files)" || true
            git push -u origin "$BK" && exit 0
          fi

          echo "[ECHO] Final push failed:"; cat "$PUSH_LOG"; exit 1

      - name: 📦 Upload artifacts (logs + echo scripts)
        uses: actions/upload-artifact@v4
        with:
          name: springboot-disk-dirs-echo
          path: |
            .github/echo_logs/**
            .github/echo_scripts/**
            .github/echo_monitoring/**
          retention-days: 7

      # Per request: NO unmount/losetup detach step
