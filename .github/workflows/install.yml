name: 📂 MEGA DB/Tx/DWH/Teradata/BTEQ/ELK/Firewall/CSV/SARIF/에코옵스

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  mega-db-echo:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 체크아웃
        uses: actions/checkout@v4

      - name: 📁 에코 디렉토리 구조 생성 (전체)
        run: |
          for d in dwh teradata bteq elk firewall mysqldump csv_export sarif logs output run_scripts samples echo_sql echo_table echo_grant; do
            echo "echo 'mkdir -p .github/echo_db/$d'" >> .github/echo_db/echo_dir_create.sh
            mkdir -p ".github/echo_db/$d"
          done

      - name: 🧾 DWH/Teradata/BTEQ 실행파일 + 샘플 제작
        run: |
          echo "#!/bin/bash" > .github/echo_db/dwh/run_dwh.sh
          echo "echo '[DWH] 데이터웨어하우스 실행 중'" >> .github/echo_db/dwh/run_dwh.sh
          echo "echo 'DWH 작업완료' > .github/echo_db/dwh/dwh_output.log" >> .github/echo_db/dwh/run_dwh.sh
          chmod +x .github/echo_db/dwh/run_dwh.sh

          echo "#!/bin/bash" > .github/echo_db/teradata/run_teradata.sh
          echo "echo '[Teradata] 테라데이터 분석 실행 중'" >> .github/echo_db/teradata/run_teradata.sh
          echo "echo 'Teradata 분석 완료' > .github/echo_db/teradata/teradata_output.log" >> .github/echo_db/teradata/run_teradata.sh
          chmod +x .github/echo_db/teradata/run_teradata.sh

          echo "#!/bin/bash" > .github/echo_db/bteq/run_bteq.sh
          echo "echo '[BTEQ] BTEQ 분석 실행'" >> .github/echo_db/bteq/run_bteq.sh
          echo "echo 'BTEQ 실행 완료' > .github/echo_db/bteq/bteq_output.log" >> .github/echo_db/bteq/run_bteq.sh
          chmod +x .github/echo_db/bteq/run_bteq.sh

      - name: 🔐 방화벽/ELK 상태 확인
        run: |
          echo "#!/bin/bash" > .github/echo_db/elk/run_elk.sh
          echo "echo '[ELK] 구성 상태 확인'" >> .github/echo_db/elk/run_elk.sh
          echo "echo 'ELK 구성 정상 작동' > .github/echo_db/elk/elk_status.log" >> .github/echo_db/elk/run_elk.sh
          chmod +x .github/echo_db/elk/run_elk.sh

          echo "#!/bin/bash" > .github/echo_db/firewall/firewall_check.sh
          echo "echo '[Firewall] 방화벽 설정 상태'" >> .github/echo_db/firewall/firewall_check.sh
          echo "sudo ufw status > .github/echo_db/firewall/firewall_status.log || echo 'ufw 사용 불가'" >> .github/echo_db/firewall/firewall_check.sh
          chmod +x .github/echo_db/firewall/firewall_check.sh

      - name: 🗄️ MySQL 덤프 + CSV 내보내기
        run: |
          echo "#!/bin/bash" > .github/echo_db/mysqldump/dump_mysql.sh
          echo "echo '[MySQLDump] 백업 시작'" >> .github/echo_db/mysqldump/dump_mysql.sh
          echo "mysqldump -uroot -prootpass123 test_db > .github/echo_db/mysqldump/backup.sql || echo 'mysqldump 실패'" >> .github/echo_db/mysqldump/dump_mysql.sh
          chmod +x .github/echo_db/mysqldump/dump_mysql.sh

          echo "#!/bin/bash" > .github/echo_db/csv_export/export_csv.sh
          echo "echo '[CSV Export] ledger 테이블 내보내기'" >> .github/echo_db/csv_export/export_csv.sh
          echo "mysql -uroot -prootpass123 -e 'SELECT * FROM ledger' test_db > .github/echo_db/csv_export/ledger.csv" >> .github/echo_db/csv_export/export_csv.sh
          chmod +x .github/echo_db/csv_export/export_csv.sh

      - name: 🧪 SARIF 보안 샘플 생성
        run: |
          echo "#!/bin/bash" > .github/echo_db/sarif/gen_sarif.sh
          echo "echo '[SARIF] 모의 보안 분석 리포트'" >> .github/echo_db/sarif/gen_sarif.sh
          echo "echo '{ \"version\": \"2.1.0\", \"runs\": [{ \"tool\": { \"driver\": { \"name\": \"MockTool\" } } }] }' > .github/echo_db/sarif/sample.sarif" >> .github/echo_db/sarif/gen_sarif.sh
          chmod +x .github/echo_db/sarif/gen_sarif.sh

      - name: 🧱 대량 에코 DB 테이블 및 SQL 생성 (100개)
        run: |
          COUNT=100
          for i in $(seq 1 $COUNT); do
            TBL="mega_table_$i"
            echo "CREATE TABLE IF NOT EXISTS $TBL (id INT PRIMARY KEY AUTO_INCREMENT, data VARCHAR(255));" > .github/echo_db/echo_table/$TBL.sql
            echo "INSERT INTO $TBL (data) VALUES ('샘플데이터_$i');" > .github/echo_db/echo_sql/insert_$TBL.sql
            echo "SELECT * FROM $TBL;" > .github/echo_db/echo_sql/select_$TBL.sql
            echo "echo 'mysql -uroot -prootpass123 -Dtest_db < .github/echo_db/echo_table/$TBL.sql'" >> .github/echo_db/run_scripts/init_tables.sh
            echo "echo 'mysql -uroot -prootpass123 -Dtest_db < .github/echo_db/echo_sql/insert_$TBL.sql'" >> .github/echo_db/run_scripts/init_insert.sh
            echo "echo 'mysql -uroot -prootpass123 -Dtest_db < .github/echo_db/echo_sql/select_$TBL.sql'" >> .github/echo_db/run_scripts/init_select.sh
          done
          chmod +x .github/echo_db/run_scripts/*.sh

      - name: 🧾 대량 권한 부여 SQL 생성
        run: |
          for i in $(seq 1 100); do
            echo "GRANT SELECT, INSERT ON test_db.mega_table_$i TO 'user_$i'@'%';" > .github/echo_db/echo_grant/grant_user_$i.sql
          done
          echo "echo '[권한 부여 SQL 100개 생성 완료]'" > .github/echo_db/echo_grant/grant_log.txt

      - name: 📃 전체 에코 파일 출력 및 확인
        run: |
          echo "[ECHO] 전체 생성 파일 출력"
          find .github/echo_db -type f | sort | while read f; do
            echo "--- [파일] $f"
            cat "$f" || echo "(읽기 실패)"
            echo
          done
