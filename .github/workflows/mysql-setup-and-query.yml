name: 🧩 MySQL+Oracle+CrossDB+Security+Pages 대통합 FullOps 워크플로우 (Echo Full Extended)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

jobs:
  fullops-unified:
    runs-on: ubuntu-latest
    env:
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass123
      MYSQL_DB: sample_db
      MASS_TABLE: 6
      MASS_USER: 8
      MASS_TXN: 20
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 📁 Echo 디렉토리 및 환경 준비 (전체 범위)
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y unzip curl tree zip gnupg2 default-jdk net-tools lsof mysql-server iptables mysql-client wget netcat || true
          for base in logs ddl user txn network firewall sock mysqld sqlcl secure portcheck permissions scripts monitor backup artifact readonly sysdba job pipe bulk policy crossdb ora2my my2ora scheduler etl client priv data query; do
            mkdir -p ".github/echo/mysql/$base"
            mkdir -p ".github/echo/oracle/$base"
            mkdir -p ".github/echo/$base"
          done
          mkdir -p .github/echo/pages .github/echo/sec .github/logs .github/error_logs

      - name: 🔍 포트, 소켓, 네트워크, 권한 echo 전수 조사
        run: |
          echo "echo 'sudo lsof -i :3306'" > .github/echo/mysql/portcheck/3306_check.sh
          sudo lsof -i :3306 > .github/echo/mysql/portcheck/3306_check.txt || echo "[✅] 포트 사용 안 함"
          nc -zv 127.0.0.1 3306 || echo "[✅] netcat 3306 연결 실패 (사용 가능 상태)" >> .github/echo/mysql/portcheck/3306_check.txt

          echo "echo 'sudo iptables -L -n -v'" > .github/echo/mysql/firewall/iptables_rules.sh
          sudo iptables -L -n -v --line-numbers > .github/echo/mysql/firewall/iptables_rules.txt || true

          echo "echo '[mysql_config_editor] 비밀번호 저장'" > .github/echo/mysql/secure/mysql_config_editor.sh
          echo "mysql_config_editor set --login-path=local --host=127.0.0.1 --user=${MYSQL_USER} --password <<EOF" >> .github/echo/mysql/secure/mysql_config_editor.sh
          echo "\$MYSQL_PASSWORD" >> .github/echo/mysql/secure/mysql_config_editor.sh
          echo "EOF" >> .github/echo/mysql/secure/mysql_config_editor.sh
          bash .github/echo/mysql/secure/mysql_config_editor.sh > .github/echo/mysql/secure/mysql_config_editor.log
          mysql_config_editor print --all >> .github/echo/mysql/secure/mysql_config_editor.log

          echo '#!/bin/bash' > .github/echo/mysql/permissions/check_permission.sh
          echo 'echo "id"' >> .github/echo/mysql/permissions/check_permission.sh
          echo 'id' >> .github/echo/mysql/permissions/check_permission.sh
          echo 'echo "groups"' >> .github/echo/mysql/permissions/check_permission.sh
          echo 'groups' >> .github/echo/mysql/permissions/check_permission.sh
          chmod +x .github/echo/mysql/permissions/check_permission.sh
          bash .github/echo/mysql/permissions/check_permission.sh > .github/echo/mysql/permissions/permission_result.txt

          uname -a > .github/echo/scripts/uname_info.txt
          hostnamectl > .github/echo/scripts/hostnamectl.txt
          df -h > .github/echo/scripts/disk_usage.txt
          free -m > .github/echo/scripts/memory_usage.txt
          curl -s ifconfig.me > .github/echo/scripts/public_ip.txt || echo "IP 실패" > .github/echo/scripts/public_ip.txt
