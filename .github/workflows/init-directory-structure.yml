name: 🚀 Init Full Directory Structure with Slot Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'  # 매 1분마다 실행

permissions:
  contents: write

concurrency:
  group: init-directory-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  setup-directories:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧱 Create Base Directory Structure
        run: |
          echo "[+] Creating required directories..."

          # 기본 디렉토리 생성
          mkdir -p .github/{workflows,scripts,logs,global,provenance,artifacts}
          mkdir -p data/{transactions,provenance}
          mkdir -p docker/{mysql,postgres,logs}
          mkdir -p site output

          # 디스크 슬롯 구조 생성
          mkdir -p disk/slot-001/{.github,data,docker,output,site,logs,workflows}

          echo "[✔] Directory structure created"

      - name: 📝 Generate Dummy Files
        run: |
          echo "Test log file" > .github/logs/test.log
          echo "Sample data" > data/transactions/test.csv
          echo "Sample docker info" > docker/mysql/info.txt
          echo "Exported output" > output/result.txt
          echo "Site index" > site/index.html
          echo "workflow example" > .github/workflows/example.yml

      - name: 📁 Copy All Project Files to disk/slot-001
        run: |
          echo "[+] Copying directories to slot..."

          cp -r .github disk/slot-001/
          cp -r data disk/slot-001/
          cp -r docker disk/slot-001/
          cp -r output disk/slot-001/
          cp -r site disk/slot-001/

          echo "[+] Copying individual workflows to slot/workflows"
          mkdir -p disk/slot-001/workflows
          cp .github/workflows/*.yml disk/slot-001/workflows/ 2>/dev/null || echo "No workflow files found."

          echo "[✔] All files copied to slot-001"

      - name: 📂 Verify disk/slot-001 Structure
        run: |
          echo "[+] Final directory tree:"
          tree disk/slot-001 || ls -R disk/slot-001
