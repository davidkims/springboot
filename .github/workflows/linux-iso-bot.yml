name: "🐧 Linux ISO 다운로드 봇"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      distro:
        description: "배포판 (ubuntu|debian|rocky|alma|fedora)"
        default: "ubuntu"
        required: true
      release_hint:
        description: "버전 힌트 (비우면 최신)"
        default: ""
        required: false
      arch:
        description: "아키텍처 (amd64|arm64)"
        default: "amd64"
        required: true
  schedule:
    - cron: "*/5 * * * *"

jobs:
  fetch-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ISO image (hardened)
        env:
          DISTRO: ${{ github.event.inputs.distro || 'ubuntu' }}
          RELEASE_HINT: ${{ github.event.inputs.release_hint }}
          ARCH: ${{ github.event.inputs.arch || 'amd64' }}
        run: |
          set -euo pipefail

          ua="GitHubActions-ISO-Fetcher (+https://github.com/actions)"
          echo "::group::Detect & Download"

          # ---------- helpers ----------
          curl_s() {
            # usage: curl_s URL [extra curl args]
            local url="$1"; shift || true
            echo "[curl] GET $url" 1>&2
            curl --fail -L --show-error \
                 --connect-timeout 20 --max-time 600 \
                 --retry 5 --retry-delay 2 --retry-all-errors \
                 -A "$ua" "$@" "$url"
          }

          sanitize_filename() {
            # stdin에서 라인을 받아 .iso로 끝나는 파일명만 깔끔히 추출
            awk '
              {
                # 패턴1: "<sha>  *filename.iso"
                # 패턴2: "SHA256 (filename.iso) = <sha>"
                # 패턴3: "<sha>  ./path/filename.iso"
                if (match($0, /\(([^)]+\.iso)\)/, m)) {
                  f=m[1];
                } else if (match($0, /[[:space:]\*]+([[:graph:]]+\.iso)/, m)) {
                  f=m[1];
                }
                gsub(/^\.\/+/, "", f);  # ./ 제거
                if (f ~ /\.iso$/) { print f; exit }
              }
            '
          }

          extract_sha256() {
            # stdin에서 64-hex 해시 추출
            awk 'match($0, /\b[0-9a-fA-F]{64}\b/, m){ print m[0]; exit }'
          }

          arch_map_deb_rpm() {
            case "$1" in amd64|arm64) echo "$1";; *) echo "amd64";; esac
          }
          arch_map_rhel() {
            case "$1" in amd64) echo "x86_64";; arm64) echo "aarch64";; *) echo "x86_64";; esac
          }

          mkdir -p iso-out tmp

          case "$DISTRO" in
            ubuntu)
              # release_hint 비면 releases.ubuntu.com 인덱스에서 최신 YY.MM 추출
              if [ -n "${RELEASE_HINT:-}" ]; then
                YYMM="$(echo "$RELEASE_HINT" | cut -d. -f1-2)"
                candidates="$YYMM"
              else
                index_html="$(curl_s https://releases.ubuntu.com/)"
                candidates="$(printf '%s\n' "$index_html" \
                  | grep -Eo '>[0-9]{2}\.[0-9]{2}/' | tr -d '>/ ' \
                  | sort -V | uniq)"
              fi

              ARCHD="$(arch_map_deb_rpm "$ARCH")"
              found=""
              for yymm in $candidates; do
                base="https://releases.ubuntu.com/${yymm}/"
                echo "[ubuntu] probing $base" 1>&2
                if sha_txt="$(curl_s "${base}SHA256SUMS" 2>/dev/null)"; then
                  # live-server 우선, 없으면 desktop 폴백
                  line="$(printf '%s\n' "$sha_txt" \
                    | grep -E "ubuntu-.*-(live-server|desktop)-${ARCHD}\.iso" \
                    | { [ -n "${RELEASE_HINT:-}" ] && grep -F "ubuntu-${RELEASE_HINT}" || cat; } \
                    | head -n1 || true)"
                  if [ -z "${line:-}" ]; then
                    # release_hint로 못 찾으면 해당 YYMM의 첫 ISO 라인 사용
                    line="$(printf '%s\n' "$sha_txt" \
                      | grep -E "ubuntu-[0-9]{2}\.[0-9]{2}(\.[0-9]+)?-(live-server|desktop)-${ARCHD}\.iso" \
                      | sort -Vr | head -n1 || true)"
                  fi
                  test -n "${line:-}" || continue

                  fname="$(printf '%s\n' "$line" | sanitize_filename)"
                  test -n "${fname:-}" || continue
                  hash="$(printf '%s\n' "$line" | extract_sha256 || true)"

                  echo "[ubuntu] Selected: ${base}${fname}" 1>&2
                  curl_s "${base}${fname}" -o "iso-out/${fname}"
                  if [ -n "${hash:-}" ]; then
                    echo "${hash}  iso-out/${fname}" | sha256sum -c -
                  fi
                  found="yes"; break
                fi
              done
              test -n "$found" || { echo "::error::Ubuntu ISO를 찾지 못했습니다. release_hint를 구체화해 보세요 (예: 24.04.1)."; exit 1; }
              ;;

            debian)
              ARCHD="$(arch_map_deb_rpm "$ARCH")"
              base="https://cdimage.debian.org/debian-cd/current/${ARCHD}/iso-cd/"
              sha_txt="$(curl_s "${base}SHA256SUMS")"
              line="$(printf '%s\n' "$sha_txt" \
                | grep -E "debian-[0-9]+\.[0-9]+(\.[0-9]+)?-${ARCHD}-netinst\.iso" \
                | { [ -n "${RELEASE_HINT:-}" ] && grep -F "debian-${RELEASE_HINT}-${ARCHD}-netinst.iso" || cat; } \
                | head -n1 || true)"
              if [ -z "${line:-}" ]; then
                line="$(printf '%s\n' "$sha_txt" \
                  | grep -E "debian-[0-9]+\.[0-9]+(\.[0-9]+)?-${ARCHD}-netinst\.iso" \
                  | sort -Vr | head -n1 || true)"
              fi
              test -n "${line:-}" || { echo "::error::Debian netinst ISO를 찾지 못했습니다."; exit 1; }

              fname="$(printf '%s\n' "$line" | sanitize_filename)"
              hash="$(printf '%s\n' "$line" | extract_sha256 || true)"
              curl_s "${base}${fname}" -o "iso-out/${fname}"
              [ -n "${hash:-}" ] && echo "${hash}  iso-out/${fname}" | sha256sum -c -
              ;;

            rocky)
              ARCHR="$(arch_map_rhel "$ARCH")"
              root="https://download.rockylinux.org/pub/rocky/"
              idx="$(curl_s "$root")"
              # release_hint가 비어있으면 최신 메이저/마이너 선택
              rel="$(printf '%s\n' "$idx" | grep -Eo '>[0-9]+(\.[0-9]+)?/' | tr -d '>/ ' \
                    | { [ -n "${RELEASE_HINT:-}" ] && grep -E "^${RELEASE_HINT}(\.|/|$)" || cat; } \
                    | sort -V | tail -n1)"
              test -n "${rel:-}" || { echo "::error::Rocky 릴리스를 찾지 못했습니다."; exit 1; }
              base="${root}${rel}/isos/${ARCHR}/"
              ck="$(curl_s "${base}CHECKSUM")"
              line="$(printf '%s\n' "$ck" \
                | grep -Ei "Rocky-.*(minimal|dvd).*${ARCHR}.*\.iso" | head -n1 || true)"
              test -n "${line:-}" || { echo "::error::Rocky ISO 라인을 찾지 못했습니다."; exit 1; }
              fname="$(printf '%s\n' "$line" | sanitize_filename)"
              hash="$(printf '%s\n' "$line" | extract_sha256 || true)"
              curl_s "${base}${fname}" -o "iso-out/${fname}"
              [ -n "${hash:-}" ] && echo "${hash}  iso-out/${fname}" | sha256sum -c -
              ;;

            alma)
              ARCHR="$(arch_map_rhel "$ARCH")"
              root="https://repo.almalinux.org/almalinux/"
              idx="$(curl_s "$root")"
              rel="$(printf '%s\n' "$idx" | grep -Eo '>[0-9]+\.[0-9]+/' | tr -d '>/ ' \
                    | { [ -n "${RELEASE_HINT:-}" ] && grep -E "^${RELEASE_HINT}(\.|/|$)" || cat; } \
                    | sort -V | tail -n1)"
              test -n "${rel:-}" || { echo "::error::Alma 릴리스를 찾지 못했습니다."; exit 1; }
              base="${root}${rel}/isos/${ARCHR}/"
              ck="$(curl_s "${base}CHECKSUM")"
              line="$(printf '%s\n' "$ck" \
                | grep -Ei "AlmaLinux-.*(minimal|dvd).*${ARCHR}.*\.iso" | head -n1 || true)"
              test -n "${line:-}" || { echo "::error::Alma ISO 라인을 찾지 못했습니다."; exit 1; }
              fname="$(printf '%s\n' "$line" | sanitize_filename)"
              hash="$(printf '%s\n' "$line" | extract_sha256 || true)"
              curl_s "${base}${fname}" -o "iso-out/${fname}"
              [ -n "${hash:-}" ] && echo "${hash}  iso-out/${fname}" | sha256sum -c -
              ;;

            fedora)
              ARCHR="$(arch_map_rhel "$ARCH")"
              root="https://download.fedoraproject.org/pub/fedora/linux/releases/"
              if [ -n "${RELEASE_HINT:-}" ]; then
                rel="$RELEASE_HINT"
              else
                idx="$(curl_s "$root")"
                rel="$(printf '%s\n' "$idx" | grep -Eo '>[0-9]{2}/' | tr -d '>/ ' | sort -V | tail -n1)"
              fi
              base="${root}${rel}/Server/${ARCHR}/iso/"
              ckn="Fedora-Server-${rel}-${ARCHR}-CHECKSUM"
              ck="$(curl_s "${base}${ckn}")"
              line="$(printf '%s\n' "$ck" \
                | grep -Ei "Fedora-Server-${rel}.*(dvd|netinst).*${ARCHR}.*\.iso" | head -n1 || true)"
              test -n "${line:-}" || { echo "::error::Fedora ISO 라인을 찾지 못했습니다."; exit 1; }
              fname="$(printf '%s\n' "$line" | sanitize_filename)"
              hash="$(printf '%s\n' "$line" | extract_sha256 || true)"
              curl_s "${base}${fname}" -o "iso-out/${fname}"
              [ -n "${hash:-}" ] && echo "${hash}  iso-out/${fname}" | sha256sum -c -
              ;;

            *)
              echo "::error::unsupported distro: $DISTRO"; exit 1;;
          esac

          echo "::endgroup::"
          echo "[OK] Download complete:"
          ls -lh iso-out

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-iso
          path: iso-out/*
          retention-days: 1
