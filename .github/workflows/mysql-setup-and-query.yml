name: 🏆 MySQL+Oracle FullOps Robust Echo EiffelTower

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

jobs:
  db-fullops:
    runs-on: ubuntu-latest
    env:
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass123
      MYSQL_DB: sample_db
      MASS_TABLE: 6
      MASS_USER: 8
      MASS_TXN: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass123
          MYSQL_DATABASE: sample_db
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -prootpass123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🔄 Update & Install Essential Packages
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get upgrade -y || echo '[⚠️] Upgrade failed'
          sudo apt-get install -y unzip curl tree zip gnupg2 tzdata netcat-openbsd iputils-ping lsof || echo '[❌] Package install failed'

          for d in \
            .github/echo/mysql \
            .github/echo/mysql/logs \
            .github/echo/mysql/firewall \
            .github/echo/mysql/portcheck \
            .github/echo/mysql/sock \
            .github/echo/mysql/scripts \
            .github/echo/mysql/secure \
            .github/echo/mysql/account_info \
            .github/echo/mysql/permissions; do
              echo "mkdir -p $d" | tee -a .github/echo/mysql/logs/init_dirs.log
              mkdir -p "$d"
          done

      - name: 🪰 Check and Recover mysqld.sock
        run: |
          if [ ! -d /var/run/mysqld ]; then
            echo '[❗] /var/run/mysqld missing, creating...' | tee -a .github/echo/mysql/sock/sock_recovery.txt
            sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld
          fi
          if [ ! -S /var/run/mysqld/mysqld.sock ]; then
            echo '[❗] mysqld.sock missing, attempting mysqld_safe...' | tee -a .github/echo/mysql/sock/sock_recovery.txt
            sudo mysqld_safe --skip-grant-tables --skip-networking > .github/echo/mysql/sock/mysqld_safe_stdout.log 2>&1 &
            sleep 10
            ps -ef | grep mysqld | tee -a .github/echo/mysql/sock/sock_recovery.txt
            zip -r .github/echo/mysql/sock/sock_backup_$(date +%Y%m%d).zip /var/run/mysqld || echo '[❌] mysqld.sock backup failed'
          fi

      - name: 🔐 Setup mysql_config_editor Securely
        run: |
          echo "echo '[mysql_config_editor set]'" > .github/echo/mysql/secure/mysql_config_editor.sh
          echo "mysql_config_editor set --login-path=local --host=127.0.0.1 --user=$MYSQL_USER --password <<EOF" >> .github/echo/mysql/secure/mysql_config_editor.sh
          echo "$MYSQL_PASSWORD" >> .github/echo/mysql/secure/mysql_config_editor.sh
          echo "EOF" >> .github/echo/mysql/secure/mysql_config_editor.sh
          bash .github/echo/mysql/secure/mysql_config_editor.sh > .github/echo/mysql/secure/mysql_config_editor.log

      - name: 📢 Port & Firewall Info
        run: |
          echo "MYSQL_USER=$MYSQL_USER" > .github/echo/mysql/account_info/mysql_env.txt
          echo "MYSQL_PASSWORD=$MYSQL_PASSWORD" >> .github/echo/mysql/account_info/mysql_env.txt
          echo "MYSQL_DB=$MYSQL_DB" >> .github/echo/mysql/account_info/mysql_env.txt
          echo "MASS_TABLE=$MASS_TABLE" >> .github/echo/mysql/account_info/mysql_env.txt
          echo "MASS_USER=$MASS_USER" >> .github/echo/mysql/account_info/mysql_env.txt
          echo "MASS_TXN=$MASS_TXN" >> .github/echo/mysql/account_info/mysql_env.txt

          sudo lsof -i :3307 > .github/echo/mysql/portcheck/3307_check.txt || echo '[✅] Port unused' >> .github/echo/mysql/portcheck/3307_check.txt
          nc -zv 127.0.0.1 3307 || echo '[✅] netcat 3307 connection failed (OK)' >> .github/echo/mysql/portcheck/3307_check.txt
          sudo iptables -L -n -v --line-numbers > .github/echo/mysql/firewall/iptables_rules.txt || echo '[❌] iptables failed' | tee -a .github/echo/mysql/firewall/iptables_rules.txt

      - name: 🛠️ Sync my.cnf Config (Optional Echo)
        run: |
          echo '[my.cnf auto sync placeholder]' > .github/echo/mysql/scripts/mycnf_sync.txt

      - name: 📁 Upload Echo Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fullops-echo-artifacts
          path: .github/echo
