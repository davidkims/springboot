name: 📦 Upload Python Package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 📦 Install development packages
        run: |
          echo "[📦] Installing Python build & dev tools..."
          python -m pip install --upgrade pip
          pip install build setuptools wheel twine pytest flake8 black isort mypy types-PyYAML
          echo "[✅] Packages installed."

      - name: 📁 Create build, log and dist directories
        run: |
          echo "[📁] Creating build directories..."
          mkdir -p build logs dist
          echo "[✅] Directories created."

      - name: ⚙️ Generate pyproject.toml or setup.py if missing
        run: |
          echo "[🔍] Checking for pyproject.toml or setup.py..."
          if [ ! -f pyproject.toml ] && [ ! -f setup.py ]; then
            echo "[⚠️] No pyproject.toml/setup.py found. Generating fallback pyproject.toml..."
            echo "[build-system]" > pyproject.toml
            echo "requires = [\"setuptools\", \"wheel\"]" >> pyproject.toml
            echo "build-backend = \"setuptools.build_meta\"" >> pyproject.toml
            echo "" >> pyproject.toml
            echo "[project]" >> pyproject.toml
            echo "name = \"demo-package\"" >> pyproject.toml
            echo "version = \"0.0.1\"" >> pyproject.toml
            echo "description = \"Fallback package for GitHub Actions build\"" >> pyproject.toml
            echo "authors = [{name = \"GitHub Actions\"}]" >> pyproject.toml
            echo "" >> pyproject.toml
            echo "[tool.setuptools.packages.find]" >> pyproject.toml
            echo "include = [\"finance_app*\"]" >> pyproject.toml
            echo "exclude = [\"tests*\", \"logs*\", \"migrations*\", \"setup_guides*\", \"workflow_docs*\"]" >> pyproject.toml
            echo "[✅] Fallback pyproject.toml generated."
            echo "[⚙️] Also generating fallback setup.py..."
            echo "from setuptools import setup, find_packages" > setup.py
            echo "setup(name='demo-package', version='0.0.1', packages=find_packages(include=['finance_app*']))" >> setup.py
            echo "[✅] Fallback setup.py generated."
          else
            echo "[✅] pyproject.toml or setup.py already exists."
          fi

      - name: 🧪 Run Tests
        run: |
          echo "[🧪] Running tests..."
          if [ -d "tests" ]; then
            pytest tests | tee logs/test.log
            echo "[✅] Tests completed."
          else
            echo "[⚠️] No tests directory found. Skipping tests."
          fi

      - name: 🧹 Run Lint & Format Checks
        run: |
          echo "[🧹] Running lint checks..."
          flake8 . || echo "[⚠️] flake8 found issues."
          black . --check || echo "[⚠️] black format issues."
          isort . --check-only || echo "[⚠️] isort ordering issues."
          mypy . || echo "[⚠️] mypy type issues."
          echo "[✅] Lint checks complete."

      - name: 🏗️ Build release distributions
        run: |
          echo "[🏗️] Building package..."
          python -m build
          echo "[✅] Build complete. Contents of dist/:"
          ls -lh dist/

      - name: ⬆️ Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    environment:
      name: pypi

    steps:
      - name: 📥 Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
