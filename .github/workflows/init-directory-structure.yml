name: 📁 Auto Generate Slots & Update Symlink

on:
  workflow_dispatch:
  push:
    paths:
      - 'disk/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-slots-and-pr:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Git Config
        run: |
          echo "[🔧] Configuring git identity..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 📂 Create disk/slot-001 ~ slot-005 with echo content
        run: |
          echo "[📁] Ensuring disk directory..."
          mkdir -p disk

          for i in $(seq -w 1 5); do
            SLOT_DIR="disk/slot-${i}"
            echo "[🧩] Creating $SLOT_DIR..."
            mkdir -p "$SLOT_DIR"
            echo "# Slot $i" > "$SLOT_DIR/README.md"
            echo "Slot Number: $i" > "$SLOT_DIR/slot-info.txt"
            echo "Created: $(date -u)" >> "$SLOT_DIR/slot-info.txt"
            echo "[✔] Created: $SLOT_DIR with README.md and slot-info.txt"
          done

      - name: 🔗 Update symlink to latest slot (slot-005)
        run: |
          echo "[🔗] Updating slot-latest -> slot-005"
          rm -rf disk/slot-latest
          ln -s slot-005 disk/slot-latest
          echo "[📂] Final disk layout:"
          ls -l disk/

      - name: 🔀 Create Pull Request for Slot Updates
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "📦 Auto create slot-001 to slot-005 and updated symlink"
          branch: slot-update-all
          title: "📦 Auto generate slots and update symlink"
          body: |
            This PR was auto-generated and includes:
            - Creation of `slot-001` to `slot-005` under `disk/`
            - Echo-based `README.md` and `slot-info.txt` inside each
            - Updated symlink `slot-latest -> slot-005`
            - Created by GitHub Actions automation
          delete-branch: true
