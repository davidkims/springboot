name: "⚙️ Maven + Spring Boot: Auto-Setup + Install/Upgrade + Echo Perm + Release (Full Echo Suite)"

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: "프로젝트가 위치한 디렉토리 (pom.xml이 존재하는 경로). 모노레포면 서브폴더 지정"
        required: true
        default: "."
      auto_create_project:
        description: "pom.xml이 없을 때 자동으로 Spring Boot 프로젝트 생성 (true/false)"
        required: true
        default: "true"
      project_config:
        description: "groupId:artifactId:packageName"
        required: false
        default: "com.example:demo-app:com.example.demo"
      spring_boot_version:
        description: "Spring Boot 버전 (예: 3.3.3). 비우면 유지"
        required: false
        default: "3.3.3"
      maven_version:
        description: "Maven 버전 (예: 3.9.9). 비우면 기본"
        required: false
        default: ""
      bump_type:
        description: "버전 증가 유형 (patch|minor|major)"
        required: false
        default: "patch"
      run_tests:
        description: "빌드 전 테스트 실행 (true/false)"
        required: true
        default: "true"
      create_release:
        description: "릴리스/태그/아티팩트 업로드 (true/false)"
        required: true
        default: "true"
      distribute_artifacts:
        description: "Artifacts 업로드 (true/false)"
        required: true
        default: "true"
      build_docker:
        description: "Docker 이미지 빌드/푸시 (true/false)"
        required: true
        default: "false"
      image_name:
        description: "Docker 이미지 이름 (예: ghcr.io/OWNER/NAME) — 비우면 자동 계산"
        required: false
        default: ""
      workflow_options:
        description: "추가 옵션 (skip_wrapper_gen:true,skip_permissions:true 등)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read
  packages: write

env:
  JAVA_VERSION: "21"
  ECHO_ROOT: .github/echo_java
  OUT_DIR: .github/echo_java/out
  LOG_DIR: .github/echo_java/logs
  PERM_DIR: .github/echo_java/permissions
  ARTIFACT_DIR: .github/echo_java/artifacts
  TOOLS_DIR: .github/echo_java/tools
  SCRIPTS_DIR: .github/echo_java/scripts
  DOC_DIR: .github/echo_java/docs

jobs:
  build_and_release:
    name: "Build & (Optional) Release"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # (1) config 파싱 + echo 스택 부트스트랩 + pom 자동생성
      - name: "Parse project configuration"
        id: parse_config
        run: |
          set -Eeuo pipefail
          IFS=':' read -r GROUP_ID ARTIFACT_ID PACKAGE_NAME <<< "${{ inputs.project_config }}"
          echo "group_id=${GROUP_ID:-com.example}"       >> "$GITHUB_OUTPUT"
          echo "artifact_id=${ARTIFACT_ID:-demo-app}"     >> "$GITHUB_OUTPUT"
          echo "package_name=${PACKAGE_NAME:-com.example.demo}" >> "$GITHUB_OUTPUT"

      - name: "Bootstrap Echo Suite (dirs + tools + scripts)"
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_ROOT" "$OUT_DIR" "$LOG_DIR" "$PERM_DIR" "$ARTIFACT_DIR" "$TOOLS_DIR" "$SCRIPTS_DIR" "$DOC_DIR"
          cat > "$TOOLS_DIR/echo.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeo pipefail
          log(){ printf "[ECHO][%s] %s\n" "$1" "$2"; }
          ok(){ log OK "$*"; } warn(){ log WARN "$*"; } fail(){ log FAIL "$*"; exit 1; }
          section(){ printf "\n=== %s ===\n" "$*"; }
          is_true(){ [[ "${1,,}" == "true" ]]; }
          SH
          chmod +x "$TOOLS_DIR/echo.sh"
          cat > "$SCRIPTS_DIR/apply_permissions.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          section "Apply permissions"
          find . -name "*.sh" -path "./.github/echo_java/*" -exec chmod 755 {} \; && ok "chmod +x done"
          SH
          chmod +x "$SCRIPTS_DIR/apply_permissions.sh"
          cat > "$SCRIPTS_DIR/collect_artifacts.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          section "Collect artifacts"
          mkdir -p "$ARTIFACT_DIR"
          find "${1:-target}" -type f \( -name "*.jar" -o -name "*.war" \) -not -name "original-*.jar" -print -exec cp -v {} "$ARTIFACT_DIR/" \;
          ok "Collected -> $ARTIFACT_DIR"
          SH
          chmod +x "$SCRIPTS_DIR/collect_artifacts.sh"
          cat > "$SCRIPTS_DIR/create_spring_boot_project.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          GROUP_ID="$1"; ARTIFACT_ID="$2"; PACKAGE_NAME="$3"; SBV="$4"; TARGET="${5:-.}"
          section "Create Spring Boot Project ($GROUP_ID:$ARTIFACT_ID)"
          mkdir -p "$TARGET/src/main/java" "$TARGET/src/test/java" "$TARGET/src/main/resources" "$TARGET/src/test/resources"
          cat > "$TARGET/pom.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?><project xmlns="http://maven.apache.org/POM/4.0.0"
           xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
           xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <parent><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-parent</artifactId><version>${SBV:-3.3.3}</version></parent>
            <groupId>${GROUP_ID}</groupId><artifactId>${ARTIFACT_ID}</artifactId><version>0.1.0-SNAPSHOT</version>
            <properties><java.version>21</java.version></properties>
            <dependencies>
              <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId></dependency>
              <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-actuator</artifactId></dependency>
              <dependency><groupId>com.h2database</groupId><artifactId>h2</artifactId><scope>runtime</scope></dependency>
              <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-test</artifactId><scope>test</scope></dependency>
            </dependencies>
            <build><plugins><plugin><groupId>org.springframework.boot</groupId><artifactId>spring-boot-maven-plugin</artifactId></plugin></plugins></build>
          </project>
          EOF
          ok "pom.xml created at $TARGET/pom.xml"
          SH
          chmod +x "$SCRIPTS_DIR/create_spring_boot_project.sh"

      - name: "Auto-create project if missing"
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          cd "${{ inputs.project_dir }}"
          if [ ! -f "pom.xml" ]; then
            is_true "${{ inputs.auto_create_project }}" || fail "pom.xml 없음 & auto_create_project=false"
            "${GITHUB_WORKSPACE}/${SCRIPTS_DIR}/create_spring_boot_project.sh" \
              "${{ steps.parse_config.outputs.group_id }}" \
              "${{ steps.parse_config.outputs.artifact_id }}" \
              "${{ steps.parse_config.outputs.package_name }}" \
              "${{ inputs.spring_boot_version }}" "."
            ok "Auto project created"
          else
            ok "pom.xml exists"
          fi

      # (2) 이제 pom.xml 확보 -> setup-java + cache
      - name: "Set up Java (with Maven cache)"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            ${{ inputs.project_dir }}/pom.xml
            ${{ inputs.project_dir }}/**/pom.xml
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          overwrite-settings: true

      - name: "Install requested Maven (optional)"
        id: setup_maven
        run: |
          set -Eeuo pipefail
          MAV_VER="${{ inputs.maven_version }}"
          if [ -n "$MAV_VER" ]; then
            echo "[ECHO][INFO] Installing Maven $MAV_VER ..."
            BASE="$HOME/.local/apache-maven-$MAV_VER"
            if [ ! -d "$BASE" ]; then
              curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAV_VER}/binaries/apache-maven-${MAV_VER}-bin.tar.gz" -o /tmp/mvn.tgz
              mkdir -p "$HOME/.local"
              tar -xzf /tmp/mvn.tgz -C "$HOME/.local"
            fi
            echo "$HOME/.local/apache-maven-${MAV_VER}/bin" >> "$GITHUB_PATH"
            mvn -v
          else
            echo "[ECHO][INFO] Using default Maven"
            mvn -v
          fi

      - name: "Generate Maven Wrapper (if missing)"
        run: |
          set -Eeuo pipefail
          cd "${{ inputs.project_dir }}"
          if [[ ! "$(echo "${{ inputs.workflow_options }}" | tr '[:upper:]' '[:lower:]')" =~ "skip_wrapper_gen:true" ]]; then
            [ -f mvnw ] || mvn -N -q wrapper:wrapper
            chmod +x mvnw || true
          fi

      - name: "Apply Echo permissions (optional)"
        run: |
          set -Eeuo pipefail
          if [[ ! "$(echo "${{ inputs.workflow_options }}" | tr '[:upper:]' '[:lower:]')" =~ "skip_permissions:true" ]]; then
            "${GITHUB_WORKSPACE}/${SCRIPTS_DIR}/apply_permissions.sh"
          fi

      - name: "Pin / Upgrade Spring Boot version (if provided)"
        run: |
          set -Eeuo pipefail
          cd "${{ inputs.project_dir }}"
          SBV="${{ inputs.spring_boot_version }}"
          if [ -n "$SBV" ]; then
            if grep -q "<spring-boot.version>" pom.xml; then
              ./mvnw -q -DgenerateBackupPoms=false versions:set-property -Dproperty=spring-boot.version -DnewVersion="${SBV}"
            else
              sed -i "0,/<parent>/ s|<version>.*</version>|<version>${SBV}</version>|" pom.xml
            fi
            echo "[ECHO][OK] Spring Boot -> $SBV"
          else
            echo "[ECHO][OK] Keep current Spring Boot version"
          fi

      - name: "Resolve & Build (tests optional)"
        id: build
        run: |
          set -Eeuo pipefail
          cd "${{ inputs.project_dir }}"
          if [[ "${{ inputs.run_tests }}" == "true" ]]; then
            ./mvnw -q -e -B clean verify
          else
            ./mvnw -q -e -B -DskipTests clean package
          fi
          "${GITHUB_WORKSPACE}/${SCRIPTS_DIR}/collect_artifacts.sh" "target"

      - name: "Upload artifacts (if enabled)"
        if: ${{ inputs.distribute_artifacts == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: ${{ env.ARTIFACT_DIR }}/*

      - name: "Compute next version & tag (if release)"
        if: ${{ inputs.create_release == 'true' }}
        id: rel
        run: |
          set -Eeuo pipefail
          cd "${{ inputs.project_dir }}"
          CURR="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          BASE="${CURR%-SNAPSHOT}"
          IFS='.' read -r MA MI PA <<< "${BASE:-0.1.0}"
          case "${{ inputs.bump_type }}" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            *)     PA=$((PA+1)) ;;
          esac
          NEXT="${MA}.${MI}.${PA}"
          ./mvnw -q -DgenerateBackupPoms=false versions:set -DnewVersion="${NEXT}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${NEXT} [skip ci]"
          fi
          git tag "v${NEXT}" || true
          git push --follow-tags
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: "Create GitHub Release"
        if: ${{ inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.next }}
          name: v${{ steps.rel.outputs.next }}
          files: ${{ env.ARTIFACT_DIR }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # (3) Docker 이미지 이름을 런타임에 안전 계산
      - name: "Resolve image name"
        id: img
        run: |
          set -Eeuo pipefail
          if [ -n "${{ inputs.image_name }}" ]; then
            IMG="${{ inputs.image_name }}"
          else
            # inputs 기본값이 비면: ghcr.io/<owner>/<repo-name-또는-springboot-app>
            OWNER="${{ github.repository_owner }}"
            IMG="ghcr.io/${OWNER}/springboot-app"
          fi
          echo "value=${IMG}" >> "$GITHUB_OUTPUT"
          echo "[ECHO][OK] Image = ${IMG}"

      - name: "Login to GHCR"
        if: ${{ inputs.build_docker == 'true' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: "Build & Push Docker"
        if: ${{ inputs.build_docker == 'true' }}
        run: |
          set -Eeuo pipefail
          cd "${{ inputs.project_dir }}"
          IMG="${{ steps.img.outputs.value }}"
          TAG="${{ inputs.create_release == 'true' && steps.rel.outputs.next || 'dev' }}"
          docker build -t "${IMG}:${TAG}" .
          docker push "${IMG}:${TAG}"

      - name: "Commit Echo outputs (if changed)"
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[ECHO] Update Echo Suite & project artifacts"
            git push
            echo "[ECHO][OK] Changes committed"
          else
            echo "[ECHO][OK] No changes to commit"
          fi
