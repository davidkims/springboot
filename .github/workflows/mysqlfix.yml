name: 🐬 MySQL 8.x + robust echo/권한/가상 메일 자동화

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  mysql-robust:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Echo/logs/dir robust 생성 및 보안
        run: |
          set -e
          for d in .github/echo .github/logs .github/mysql_bak .github/error_logs; do
            echo "echo 'mkdir -p $d'" ; mkdir -p $d
            echo "echo 'chmod 700 $d'" ; chmod 700 $d
          done

      - name: 📦 시스템업데이트 & MySQL/Postfix/mailutils robust 설치
        run: |
          set -e
          echo "echo 'sudo apt-get update -y'" ; sudo apt-get update -y | tee .github/echo/step-01-apt-update.txt
          echo "echo 'sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y'" ; sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y | tee .github/echo/step-02-apt-upgrade.txt
          echo "echo 'sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server postfix mailutils libsasl2-modules'" ; sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server postfix mailutils libsasl2-modules | tee .github/echo/step-03-apt-install.txt

      - name: 🧩 MySQL robust daemon/socket/perm
        run: |
          set -e
          echo "echo 'sudo systemctl stop mysql || true'" ; sudo systemctl stop mysql || true
          echo "echo 'sudo pkill -f mysqld || true'" ; sudo pkill -f mysqld || true
          echo "echo 'sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld && sudo chmod 770 /var/run/mysqld'" ; sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld && sudo chmod 770 /var/run/mysqld
          echo "echo 'sudo systemctl start mysql'" ; sudo systemctl start mysql || true
          sleep 4

      - name: 🚨 MySQL 8.x robust root/admin 권한+비번+echo/보안 자동화
        run: |
          set -e
          # 1. skip-grant-tables 모드 진입 (echo)
          echo "echo '[MySQL] skip-grant-tables entry'" | tee -a .github/echo/step-root-reset.txt
          sudo systemctl stop mysql || true
          sudo pkill -f mysqld || true
          sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld
          nohup sudo mysqld_safe --skip-grant-tables --skip-networking > .github/logs/mysql_skipgrant.log 2>&1 &
          sleep 10

          # 2. root 패스워드 null(비번 없음), plugin 변경, host=localhost/%, 권한부여 (echo/SQL 분리)
          cat <<EOSQL > .github/echo/root-reset.sql
          UPDATE mysql.user SET plugin='mysql_native_password', authentication_string='' WHERE User='root';
          UPDATE mysql.user SET host='%', plugin='mysql_native_password', authentication_string='' WHERE User='root';
          FLUSH PRIVILEGES;
          EOSQL

          echo "echo 'sudo mysql < .github/echo/root-reset.sql (skip-grant-tables)'" | tee -a .github/echo/step-root-reset.txt
          sudo mysql < .github/echo/root-reset.sql || (cat .github/logs/mysql_skipgrant.log || true)

          sleep 2
          sudo pkill -f mysqld || true
          sleep 2

          # 3. 정상모드로 재기동 (echo)
          echo "echo 'sudo systemctl start mysql'" | tee -a .github/echo/step-root-reset.txt
          sudo systemctl start mysql
          sleep 8

          # 4. root 패스워드/host/권한 robust (ALTER USER 공식 사용, echo/SQL 분리)
          cat <<EOSQL > .github/echo/root-alter.sql
          ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpass123';
          ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'rootpass123';
          GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON *.* TO 'root'@'localhost' WITH GRANT OPTION;
          FLUSH PRIVILEGES;
          EOSQL

          echo "echo 'sudo mysql -u root < .github/echo/root-alter.sql (normal mode)'" | tee -a .github/echo/step-root-reset.txt

          for i in {1..8}; do
            if sudo mysql -u root < .github/echo/root-alter.sql; then
              echo "[✔] root alter+권한 성공!" | tee -a .github/echo/step-root-reset.txt
              break
            else
              echo "[!] root alter 재시도 ($i/8)..." | tee -a .github/echo/step-root-reset.txt
              sleep 2
            fi
          done

          # 5. robust_admin 계정 robust 생성/권한 (echo/SQL 분리, host=%/localhost, 권한구분)
          cat <<EOSQL > .github/echo/admin-reset.sql
          CREATE USER IF NOT EXISTS 'robust_admin'@'%' IDENTIFIED WITH mysql_native_password BY 'robustpass123';
          CREATE USER IF NOT EXISTS 'robust_admin'@'localhost' IDENTIFIED WITH mysql_native_password BY 'robustpass123';
          GRANT ALL PRIVILEGES ON *.* TO 'robust_admin'@'%' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON *.* TO 'robust_admin'@'localhost' WITH GRANT OPTION;
          FLUSH PRIVILEGES;
          EOSQL

          echo "echo 'sudo mysql -u root -prootpass123 < .github/echo/admin-reset.sql (normal mode)'" | tee -a .github/echo/step-root-reset.txt
          sudo mysql -u root -prootpass123 < .github/echo/admin-reset.sql

          sleep 2

          # 6. 모든 echo/SQL/비밀번호 파일 chmod 600 (보안강화)
          echo "echo 'chmod 600 .github/echo/*.sql .github/echo/*.txt'" ; chmod 600 .github/echo/*.sql .github/echo/*.txt

          # 7. 루트 권한·DB 계정·비번 설정 결과 확인
          echo "echo 'mysql -uroot -prootpass123 -e \"SELECT user,host,plugin,authentication_string FROM mysql.user\"'" | tee -a .github/echo/step-root-reset.txt
          mysql -uroot -prootpass123 -e "SELECT user,host,plugin,authentication_string FROM mysql.user" | tee .github/echo/step-root-userlist.txt

          echo "echo '모든 단계 완료! (root/admin 권한, 인증, host/비번 robust 보장)'" | tee -a .github/echo/step-root-reset.txt

      - name: ✅ MySQL root robust 인증 체크 (재시도 포함)
        run: |
          set -e
          echo "[+] MySQL root robust password test..." | tee .github/echo/step-root-login.txt
          export MYSQL_PWD=rootpass123
          for i in 1 2 3 4 5; do
            echo "mysqladmin -u root ping" | tee -a .github/echo/step-root-login.txt
            if mysqladmin -u root ping; then
              echo "[✔] MySQL root robust 인증 성공!" | tee -a .github/echo/step-root-login.txt
              exit 0
            else
              echo "[!] root 인증 실패($i). 4초후 재시도..." | tee -a .github/echo/step-root-login.txt
              sleep 4
            fi
          done
          echo "[❌] MySQL root robust 인증 실패! 전체 중단." | tee -a .github/echo/step-root-login.txt
          exit 1

      - name: 📨 MySQL 가상메일 테이블/샘플계정 자동 생성 (echo)
        run: |
          set -e
          cat <<'EOSQL' > .github/echo/virtual_mail_schema.sql
          CREATE DATABASE IF NOT EXISTS mailserver CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          USE mailserver;
          CREATE TABLE IF NOT EXISTS virtual_domains (
            id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
            name VARCHAR(50) NOT NULL UNIQUE
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          CREATE TABLE IF NOT EXISTS virtual_users (
            id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
            domain_id INT NOT NULL,
            password VARCHAR(106) NOT NULL,
            email VARCHAR(100) NOT NULL UNIQUE,
            FOREIGN KEY (domain_id) REFERENCES virtual_domains(id) ON DELETE CASCADE
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          CREATE TABLE IF NOT EXISTS virtual_aliases (
            id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
            domain_id INT NOT NULL,
            source VARCHAR(100) NOT NULL,
            destination VARCHAR(100) NOT NULL,
            FOREIGN KEY (domain_id) REFERENCES virtual_domains(id) ON DELETE CASCADE
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          INSERT IGNORE INTO virtual_domains (name) VALUES ('example.com');
          INSERT IGNORE INTO virtual_users (domain_id, password, email)
            VALUES (
              1,
              '$6$rounds=656000$robustsalt$MJ04ZsU2eWkgR2Q4CjV7GAw74pD6B0WFFR8hyljVEc0ENJPkjQw/YyzJJ0bUowG9/56u6dyKToKPtbnPhsoEx1', -- 'mailpass123'
              'test@example.com'
            );
          INSERT IGNORE INTO virtual_aliases (domain_id, source, destination)
            VALUES (1, 'alias@example.com', 'test@example.com');
          EOSQL

          echo "echo 'sudo mysql -u root -prootpass123 < .github/echo/virtual_mail_schema.sql'" | tee .github/echo/step-mail-schema.txt
          sudo mysql -u root -prootpass123 < .github/echo/virtual_mail_schema.sql

      - name: 📮 Postfix 가상메일 연동 config/echo/테스트메일
        run: |
          set -e
          VMAIL_CONF=".github/echo/postfix-mysql-virtual.cf"
          cat <<'EOF' > $VMAIL_CONF
          user = robust_admin
          password = robustpass123
          hosts = 127.0.0.1
          dbname = mailserver
          query = SELECT email FROM virtual_users WHERE email='%s'
          EOF

          echo "echo 'sudo postconf -e \"virtual_mailbox_domains=mysql:/etc/postfix/mysql-virtual-domains.cf\"'" | tee .github/echo/step-postfix-echo.txt
          echo "echo 'sudo postconf -e \"virtual_mailbox_maps=mysql:/etc/postfix/mysql-virtual-mailbox.cf\"'" | tee -a .github/echo/step-postfix-echo.txt
          echo "echo 'sudo postconf -e \"virtual_alias_maps=mysql:/etc/postfix/mysql-virtual-alias.cf\"'" | tee -a .github/echo/step-postfix-echo.txt

          sudo cp .github/echo/postfix-mysql-virtual.cf /etc/postfix/mysql-virtual-mailbox.cf
          sudo cp .github/echo/postfix-mysql-virtual.cf /etc/postfix/mysql-virtual-alias.cf
          sudo cp .github/echo/postfix-mysql-virtual.cf /etc/postfix/mysql-virtual-domains.cf

          sudo postconf -e "virtual_mailbox_domains=mysql:/etc/postfix/mysql-virtual-domains.cf"
          sudo postconf -e "virtual_mailbox_maps=mysql:/etc/postfix/mysql-virtual-mailbox.cf"
          sudo postconf -e "virtual_alias_maps=mysql:/etc/postfix/mysql-virtual-alias.cf"

          sudo systemctl restart postfix

          echo "echo 'echo \"테스트메일\" | mail -s \"[Test] Virtual Mail\" test@example.com'" | tee .github/echo/step-mail-test.txt
          echo "테스트메일" | mail -s "[Test] Virtual Mail" test@example.com || true
