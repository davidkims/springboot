name: 📦 .github 전체 ZIP 백업/에코 자동화

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'  # 매일 04:00 백업

jobs:
  zip-backup:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 📁 백업 및 에코 디렉토리 생성
        run: |
          for d in .github/echo_zip .github/zip_backup .github/echo_logs; do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo_zip/echo_dirs.sh
            mkdir -p $d
          done

      - name: 🗂️ .github 전체 ZIP 백업 및 에코파일 생성
        run: |
          TS=$(date +%Y%m%d_%H%M%S)
          ZIP_FILE=".github/zip_backup/github_backup_$TS.zip"
          ECHO_SH=".github/echo_zip/zip_backup_$TS.sh"
          LOG_FILE=".github/echo_logs/zip_backup_$TS.log"

          # 1. 에코용 압축 명령어 기록
          echo "echo 'zip -r $ZIP_FILE .github'" | tee -a "$ECHO_SH"
          echo "zip -r $ZIP_FILE .github" >> "$ECHO_SH"

          # 2. 에코 커맨드 로그 기록
          echo "[INFO] $(date '+%F %T') zip -r $ZIP_FILE .github" | tee -a "$LOG_FILE"

          # 3. 실제 압축 수행
          zip -r "$ZIP_FILE" .github | tee -a "$LOG_FILE"

          # 4. 백업 결과 에코파일/로그에 기록
          echo "echo '[OK] .github 전체 백업 → $ZIP_FILE'" | tee -a "$ECHO_SH"
          echo "[OK] $(date '+%F %T') 백업 완료: $ZIP_FILE" | tee -a "$LOG_FILE"

          # 5. 에코 실행권한 부여
          chmod +x "$ECHO_SH"
          
      - name: 📋 백업 완료 결과 확인 (에코)
        run: |
          echo "echo 'ls -l .github/zip_backup'" | tee -a .github/echo_zip/ls_zip_backup.sh
          ls -l .github/zip_backup | tee -a .github/echo_logs/ls_zip_backup.log
          echo "echo 'ls -l .github/echo_zip'" | tee -a .github/echo_zip/ls_echo_zip.sh
          ls -l .github/echo_zip | tee -a .github/echo_logs/ls_echo_zip.log
