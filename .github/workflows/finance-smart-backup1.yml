name: 📧 MEGA EmailOps + 패키지업데이트 + 방화벽 + ClamAV + 에코 확장형

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Base domain for virtual accounts"
        required: false
        default: "example.local"
      user_count:
        description: "Number of virtual accounts per service"
        required: false
        default: "50"
      test_count:
        description: "Number of test emails per server"
        required: false
        default: "3"
  schedule:
    - cron: "*/5 * * * *"

jobs:
  emailops:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: /opt/email
      MONO: /opt/email/.monitoring
      DOMAIN: ${{ github.event.inputs.domain || 'example.local' }}
      USER_COUNT: ${{ github.event.inputs.user_count || '50' }}
      TEST_COUNT: ${{ github.event.inputs.test_count || '3' }}
      SERVICES: postfix exim4 opensmtpd mailhog maildev mailcatcher smtp4dev
      INF_BUCKET: metrics
      INF_ORG: org
      INF_USER: admin
      INF_PASS: admin1234!
      INF_TOKEN: dev-token-123456

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📦 패키지 업데이트 + 필수 설치
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get upgrade -y
          sudo apt-get install -y tree swaks jq clamav clamav-daemon yara ufw
          echo "[ECHO] 패키지 업데이트 및 설치 완료"

      - name: 📁 에코 디렉토리 대량 생성
        run: |
          set -e
          for d in echo_dirs echo_logs echo_firewall echo_scripts echo_services; do
            mkdir -p ".github/$d"
            echo "echo '[ECHO] 디렉토리 생성: .github/$d'" >> .github/echo_dirs/create_dirs.sh
          done
          chmod +x .github/echo_dirs/create_dirs.sh
          bash .github/echo_dirs/create_dirs.sh

      - name: 🔐 방화벽 설정 + 에코 파일 생성
        run: |
          sudo ufw allow 25/tcp
          sudo ufw allow 1025/tcp
          sudo ufw allow 2525/tcp
          sudo ufw allow 80/tcp
          sudo ufw allow 443/tcp
          echo "#!/bin/bash" > .github/echo_firewall/setup_firewall.sh
          echo "echo '[ECHO] 방화벽 포트 25,1025,2525,80,443 허용 완료'" >> .github/echo_firewall/setup_firewall.sh
          chmod +x .github/echo_firewall/setup_firewall.sh
          bash .github/echo_firewall/setup_firewall.sh

      - name: 📬 SMTP 서버 및 Mailhog 설치
        run: |
          docker run -d --name mailhog -p 1025:1025 -p 8025:8025 mailhog/mailhog
          echo "echo '[ECHO] Mailhog 설치 및 실행 완료'" >> .github/echo_services/install_mailhog.sh
          chmod +x .github/echo_services/install_mailhog.sh
          bash .github/echo_services/install_mailhog.sh

      - name: 📤 SMTP 테스트 메일 발송
        run: |
          echo "#!/bin/bash" > .github/scripts/emailops_sendmail.sh
          echo "swaks --server 127.0.0.1:1025 --from ci@local --to test@local --header \"Subject: test \$(date)\" --body \"This is a test mailing\"" >> .github/scripts/emailops_sendmail.sh
          chmod +x .github/scripts/emailops_sendmail.sh
          bash .github/scripts/emailops_sendmail.sh
          echo "echo '[ECHO] 테스트 메일 발송 완료'" >> .github/echo_logs/sendmail.log

      - name: 🦠 ClamAV 전체 스캔 (exit code 2 허용)
        run: |
          mkdir -p .github/echo_logs
          clamscan -r --infected "$BASE" "$MONO" | tee .github/echo_logs/clamav_scan.txt || true
          echo "echo '[ECHO] ClamAV 스캔 완료 (오류 무시)'" >> .github/echo_logs/clamav_scan.sh
          chmod +x .github/echo_logs/clamav_scan.sh
          bash .github/echo_logs/clamav_scan.sh || true

      - name: 📤 로그 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: emailops-logs
          path: .github/echo_logs
