name: "🛡️ AutorunGuard • Build · Dual-Sign · Diff Notes · Release · Pages (i18n)"

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Mode: test(Once) | install(Policy+Schedule+Once)"
        required: true
        default: "test"
        type: choice
        options: ["test", "install"]
      version:
        description: "Release version (empty -> vYYYYMMDD.HHmm UTC)"
        required: false
      make_release:
        description: "Create GitHub Release?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      publish_pages:
        description: "Publish GitHub Pages (i18n/theme)?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: autorunguard-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-2025:
    name: "Build · Dual-Sign · Test (Windows 2025)"
    # windows-2025 이미지가 없으면 'windows-latest'로 변경하세요.
    runs-on: windows-2025
    timeout-minutes: 30

    outputs:
      computed_version: ${{ steps.meta.outputs.version }}

    # ✅ secrets → env 로 매핑 (if 조건은 env.*로 판정)
    env:
      AZURE_CLIENT_ID:        ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID:        ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID:  ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_KEYVAULT_NAME:    ${{ secrets.AZURE_KEYVAULT_NAME }}
      AZURE_CERT_NAME:        ${{ secrets.AZURE_CERT_NAME }}
      AZURE_CERT_PASSWORD:    ${{ secrets.AZURE_CERT_PASSWORD }}

      AWS_REGION:             ${{ secrets.AWS_REGION }}
      AWS_ROLE_TO_ASSUME:     ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_PFX_SECRET_ID:      ${{ secrets.AWS_PFX_SECRET_ID }}
      AWS_PFX_PASSWORD:       ${{ secrets.AWS_PFX_PASSWORD }}

      BASE64_PFX:             ${{ secrets.BASE64_PFX }}
      PFX_PASSWORD:           ${{ secrets.PFX_PASSWORD }}

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🧮 Compute version
        id: meta
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "v{0:yyyyMMdd.HHmm}" -f (Get-Date).ToUniversalTime() }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "[META] VERSION = $v"

      - name: 🧩 Generate AutorunGuard.ps1
        shell: pwsh
        run: |
          $dstRepo = Join-Path $PWD 'scripts\AutorunGuard.ps1'
          $dstTools = 'C:\Tools\AutorunGuard.ps1'
          New-Item -Force -ItemType Directory -Path (Split-Path $dstRepo) | Out-Null
          New-Item -Force -ItemType Directory -Path (Split-Path $dstTools) | Out-Null
          @'
          <# (여기에 이전에 드린 AutorunGuard.ps1 본문 그대로 넣으세요) #>
          '@ | Set-Content -Encoding UTF8 -Path $dstRepo
          Copy-Item -Force $dstRepo $dstTools

      - name: 🧪 Syntax check (PowerShell)
        shell: pwsh
        run: |
          Get-Command -Name (Join-Path $PWD 'scripts\AutorunGuard.ps1') | Out-Null
          Write-Host "[OK] PowerShell parsed"

      # ---------- CERT SELECTION (Azure KV → AWS SM → GitHub Secrets → Self-signed) ----------

      - name: 🔑 Azure login (OIDC)
        if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_KEYVAULT_NAME != '' && env.AZURE_CERT_NAME != '' }}
        uses: azure/login@v2
        with:
          client-id:     ${{ env.AZURE_CLIENT_ID }}
          tenant-id:     ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: ⬇️ Fetch cert from Azure Key Vault
        if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_KEYVAULT_NAME != '' && env.AZURE_CERT_NAME != '' }}
        shell: pwsh
        run: |
          $kv = "${{ env.AZURE_KEYVAULT_NAME }}"
          $certName = "${{ env.AZURE_CERT_NAME }}"
          $outPfx = Join-Path $PWD 'signing\org_signing.pfx'
          New-Item -ItemType Directory -Path (Split-Path $outPfx) -Force | Out-Null
          $json = az keyvault secret show --vault-name $kv --name $certName | ConvertFrom-Json
          [IO.File]::WriteAllBytes($outPfx, [Convert]::FromBase64String($json.value))
          if ("${{ env.AZURE_CERT_PASSWORD }}") {
            Set-Content -Path (Join-Path $PWD 'signing\pfx.pass') -Value '${{ env.AZURE_CERT_PASSWORD }}'
          }

      - name: 🔐 AWS configure (OIDC)
        if: ${{ !(env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_KEYVAULT_NAME != '' && env.AZURE_CERT_NAME != '') && env.AWS_REGION != '' && env.AWS_ROLE_TO_ASSUME != '' && env.AWS_PFX_SECRET_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region:        ${{ env.AWS_REGION }}
          role-to-assume:    ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: autorunguard-ci

      - name: ⬇️ Fetch cert from AWS Secrets Manager
        if: ${{ !(env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_KEYVAULT_NAME != '' && env.AZURE_CERT_NAME != '') && env.AWS_REGION != '' && env.AWS_ROLE_TO_ASSUME != '' && env.AWS_PFX_SECRET_ID != '' }}
        shell: pwsh
        run: |
          $outPfx = Join-Path $PWD 'signing\org_signing.pfx'
          New-Item -ItemType Directory -Path (Split-Path $outPfx) -Force | Out-Null
          $val = aws secretsmanager get-secret-value --secret-id "${{ env.AWS_PFX_SECRET_ID }}" | ConvertFrom-Json
          $b64 = if ($val.SecretBinary) { $val.SecretBinary } else { ($val.SecretString | ConvertFrom-Json).pfx }
          [IO.File]::WriteAllBytes($outPfx, [Convert]::FromBase64String($b64))
          if ("${{ env.AWS_PFX_PASSWORD }}") {
            Set-Content -Path (Join-Path $PWD 'signing\pfx.pass') -Value '${{ env.AWS_PFX_PASSWORD }}'
          }

      - name: ⬇️ Load cert from GitHub Secrets
        if: ${{ !( (env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_KEYVAULT_NAME != '' && env.AZURE_CERT_NAME != '') || (env.AWS_REGION != '' && env.AWS_ROLE_TO_ASSUME != '' && env.AWS_PFX_SECRET_ID != '') ) && env.BASE64_PFX != '' }}
        shell: pwsh
        run: |
          $outPfx = Join-Path $PWD 'signing\org_signing.pfx'
          New-Item -ItemType Directory -Path (Split-Path $outPfx) -Force | Out-Null
          [IO.File]::WriteAllBytes($outPfx, [Convert]::FromBase64String("${{ env.BASE64_PFX }}"))
          if ("${{ env.PFX_PASSWORD }}") {
            Set-Content -Path (Join-Path $PWD 'signing\pfx.pass') -Value '${{ env.PFX_PASSWORD }}'
          }

      - name: 🧾 Create self-signed CodeSigning cert (fallback)
        if: ${{ !( (env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_KEYVAULT_NAME != '' && env.AZURE_CERT_NAME != '') || (env.AWS_REGION != '' && env.AWS_ROLE_TO_ASSUME != '' && env.AWS_PFX_SECRET_ID != '') || env.BASE64_PFX != '' ) }}
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=AutorunGuard CI (SelfSigned)" -KeyExportPolicy Exportable -KeyLength 3072 -HashAlgorithm SHA256 -CertStoreLocation "Cert:\CurrentUser\My"
          $outPfx = Join-Path $PWD 'signing\org_signing.pfx'
          New-Item -ItemType Directory -Path (Split-Path $outPfx) -Force | Out-Null
          $pass = "changeit-123!"
          Set-Content -Path (Join-Path $PWD 'signing\pfx.pass') -Value $pass
          Export-PfxCertificate -Cert $cert -FilePath $outPfx -Password (ConvertTo-SecureString $pass -AsPlainText -Force) | Out-Null

      # ---------- Dual signing ----------
      - name: 🔏 Authenticode sign (PowerShell)
        shell: pwsh
        run: |
          $script = Join-Path $PWD 'scripts\AutorunGuard.ps1'
          $pfx = Join-Path $PWD 'signing\org_signing.pfx'
          $pass = (Test-Path (Join-Path $PWD 'signing\pfx.pass')) ? (Get-Content (Join-Path $PWD 'signing\pfx.pass')) : ""
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $cert.Import($pfx, $pass, 'Exportable,PersistKeySet,MachineKeySet')
          Set-AuthenticodeSignature -FilePath $script -Certificate $cert -TimestampServer "http://timestamp.digicert.com" | Out-Null
          Get-AuthenticodeSignature $script | Format-List -Property Status,StatusMessage

      - name: 🔐 Locate signtool.exe
        id: signtool
        shell: pwsh
        run: |
          $candidates = @(
            "$Env:ProgramFiles (x86)\Windows Kits\10\bin\x64\signtool.exe",
            "$Env:ProgramFiles (x86)\Windows Kits\10\bin\10.0.*\x64\signtool.exe",
            "$Env:ProgramFiles (x86)\Microsoft SDKs\ClickOnce\SignTool\signtool.exe"
          )
          $found = $null
          foreach ($p in $candidates) {
            $hit = Get-ChildItem $p -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { $found = $hit.FullName; break }
          }
          if (-not $found) { $found = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source }
          if ($found) { "path=$found" >> $env:GITHUB_OUTPUT; Write-Host "[FOUND] $found" } else { Write-Host "[WARN] signtool not found" }

      - name: 🔏 Signtool sign (2nd signature attempt)
        if: ${{ steps.signtool.outputs.path }}
        shell: pwsh
        continue-on-error: true
        run: |
          $signtool = "${{ steps.signtool.outputs.path }}"
          $pfx = Join-Path $PWD 'signing\org_signing.pfx'
          $pass = (Test-Path (Join-Path $PWD 'signing\pfx.pass')) ? (Get-Content (Join-Path $PWD 'signing\pfx.pass')) : ""
          & $signtool sign /f "$pfx" /p "$pass" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "scripts\AutorunGuard.ps1"
          Write-Host "[SIGNSUMMARY] ExitCode=$LASTEXITCODE"

      # ---------- Test & logs ----------
      - name: ▶️ Test run (-Once / optional -Install)
        shell: pwsh
        run: |
          $script = Join-Path $PWD 'scripts\AutorunGuard.ps1'
          if ("${{ github.event.inputs.run_mode }}" -eq "install") {
            powershell -NoProfile -ExecutionPolicy Bypass -File $script -Install
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File $script -Once
          Get-Content "C:\ProgramData\AutorunGuard\guard.log" -ErrorAction SilentlyContinue | Select-Object -Last 200

      - name: 📄 Collect logs to workspace
        shell: pwsh
        run: |
          $src = 'C:\ProgramData\AutorunGuard\guard.log'
          $dst = Join-Path $PWD 'logs\guard.log'
          New-Item -ItemType Directory -Path (Split-Path $dst) -Force | Out-Null
          if (Test-Path $src) { Copy-Item $src $dst -Force } else { 'No removable/CD volumes detected or log not created.' | Set-Content -Encoding UTF8 $dst }

      # ---------- Release notes (diff) ----------
      - name: 🔎 Compute diff since previous tag
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.meta.outputs.version }}"
          git fetch --tags --quiet
          prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            base="$(git rev-list --max-parents=0 HEAD)"
            prev="(first commit)"
          else
            base="$prev"
          fi
          {
            echo "## AutorunGuard $ver"
            echo
            echo "### Changes since $prev"
            echo
            git log --oneline --decorate "$base"..HEAD || true
            echo
            echo "### Files changed"
            echo
            git diff --name-status "$base"..HEAD || true
            echo
            echo "### Conventional summary"
            echo
            git log "$base"..HEAD --pretty=format:'- %s' | sed -E 's/^-/  -/g' || true
            echo
            echo "### Potential BREAKING CHANGES"
            echo
            git log "$base"..HEAD --pretty=format:'%B' | grep -E 'BREAKING CHANGE|feat\!|fix\!' || echo "(none)"
          } > RELEASE_NOTES.md
          sed -n '1,200p' RELEASE_NOTES.md

      # ---------- Package ----------
      - name: 📦 Package (zip)
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $out = Join-Path $PWD "autorunguard-$ver"
          New-Item -Force -ItemType Directory -Path $out | Out-Null
          Copy-Item -Force "scripts\AutorunGuard.ps1" $out
          Copy-Item -Force "logs\guard.log" $out
          Compress-Archive -Path "$out\*" -DestinationPath "$PWD\autorunguard-$ver.zip" -Force

      - name: ⬆️ Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autorunguard-${{ steps.meta.outputs.version }}
          path: |
            autorunguard-${{ steps.meta.outputs.version }}.zip
            RELEASE_NOTES.md
            logs/guard.log
            scripts/AutorunGuard.ps1

  release:
    name: "Create GitHub Release"
    if: ${{ needs.build-2025.outputs.computed_version != '' && github.event.inputs.make_release == 'true' }}
    runs-on: ubuntu-latest
    needs: [build-2025]
    steps:
      - uses: actions/checkout@v5
      - name: ⬇️ Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: autorunguard-${{ needs.build-2025.outputs.computed_version }}
          path: dist
      - name: 🚀 Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-2025.outputs.computed_version }}
          name: "AutorunGuard ${{ needs.build-2025.outputs.computed_version }}"
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/autorunguard-*.zip
            dist/AutorunGuard.ps1
            dist/guard.log

  pages:
    name: "Deploy Pages (i18n + theme)"
    if: ${{ needs.build-2025.outputs.computed_version != '' && github.event.inputs.publish_pages == 'true' }}
    runs-on: ubuntu-latest
    needs: [build-2025]
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: ⬇️ Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: autorunguard-${{ needs.build-2025.outputs.computed_version }}
          path: site/assets
      - name: 🏗️ Build multilingual site (KR/EN + theme)
        run: |
          ver="${{ needs.build-2025.outputs.computed_version }}"
          mkdir -p site/ko site/en site/assets
          cat > site/style.css <<'CSS'
          :root{--fg:#0b1220;--bg:#fff;--muted:#5c6b8a;--card:#f7f8fb;--link:#0b5fff}
          @media (prefers-color-scheme: dark){
            :root{--fg:#e7ecf7;--bg:#0b1220;--muted:#8ea0c4;--card:#111827;--link:#7bb1ff}
          }
          *{box-sizing:border-box} body{font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);margin:0}
          .wrap{max-width:980px;margin:auto;padding:24px}
          header{display:flex;gap:12px;align-items:center;justify-content:space-between}
          nav a{margin-right:12px;color:var(--link);text-decoration:none}
          pre{background:var(--card);padding:12px;border-radius:10px;overflow:auto}
          .card{background:var(--card);padding:16px;border-radius:14px;margin:16px 0}
          footer{color:var(--muted);margin:48px 0 12px}
          CSS
          header_ko='<header><h1>AutorunGuard — 배포 이력</h1><nav><a href="../en/">English</a><a href="../ko/">한국어</a></nav></header>'
          header_en='<header><h1>AutorunGuard — Release History</h1><nav><a href="../en/">English</a><a href="../ko/">한국어</a></nav></header>'
          footer='<footer>Built from '${GITHUB_REPOSITORY}' • Run #'${GITHUB_RUN_NUMBER}'</footer>'
          tail -n 200 site/assets/guard.log > site/assets/guard.tail 2>/dev/null || true
          cat > site/ko/index.html <<HTML
          <!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="../style.css"><title>AutorunGuard 릴리스</title><body><div class="wrap">
          ${header_ko}
          <div class="card"><b>현재 버전</b>: ${ver}<br>빌드 OS: Windows Server 2025</div>
          <h2>릴리스 노트</h2><pre>$(sed -n '1,400p' site/assets/RELEASE_NOTES.md)</pre>
          <h2>최근 로그 (일부)</h2><pre>$(sed -n '1,200p' site/assets/guard.tail)</pre>
          <h2>다운로드</h2>
          <ul>
            <li><a href="../assets/autorunguard-${ver}.zip">autorunguard-${ver}.zip</a></li>
            <li><a href="../assets/AutorunGuard.ps1">AutorunGuard.ps1</a></li>
            <li><a href="../assets/guard.log">guard.log</a></li>
          </ul>
          ${footer}
          </div></body></html>
          HTML
          cat > site/en/index.html <<HTML
          <!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="../style.css"><title>AutorunGuard Releases</title><body><div class="wrap">
          ${header_en}
          <div class="card"><b>Current Version</b>: ${ver}<br>Build OS: Windows Server 2025</div>
          <h2>Release Notes</h2><pre>$(sed -n '1,400p' site/assets/RELEASE_NOTES.md)</pre>
          <h2>Recent Logs (partial)</h2><pre>$(sed -n '1,200p' site/assets/guard.tail)</pre>
          <h2>Downloads</h2>
          <ul>
            <li><a href="../assets/autorunguard-${ver}.zip">autorunguard-${ver}.zip</a></li>
            <li><a href="../assets/AutorunGuard.ps1">AutorunGuard.ps1</a></li>
            <li><a href="../assets/guard.log">guard.log</a></li>
          </ul>
          ${footer}
          </div></body></html>
          HTML
          cat > site/index.html <<HTML
          <!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="./style.css"><title>AutorunGuard</title><body><div class="wrap">
          <header><h1>AutorunGuard</h1><nav><a href="./en/">English</a><a href="./ko/">한국어</a></nav></header>
          <div class="card">Choose your language.</div>
          ${footer}
          </div></body></html>
          HTML

      - name: 📦 Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: 🌐 Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
