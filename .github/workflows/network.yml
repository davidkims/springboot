name: 📦 .github/workflows 전체 yml/echo/환경/권한/경로/디버그 자동 업로드

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  upload-workflow-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🏗️ .github/workflows 에코/환경/권한/디버그/강제파일 생성 (없을때 대비)
        run: |
          set -e
          WF_DIR=".github/workflows"
          mkdir -p $WF_DIR/echo_env $WF_DIR/echo_permission $WF_DIR/echo_debug $WF_DIR/echo_path $WF_DIR/echo_misc

          # [1] 환경/시스템 정보
          env > $WF_DIR/echo_env/env.txt
          printenv | sort > $WF_DIR/echo_env/env_all.txt
          uname -a > $WF_DIR/echo_env/uname.txt
          cat /etc/os-release > $WF_DIR/echo_env/os-release.txt
          echo $USER > $WF_DIR/echo_env/user.txt
          echo $SHELL > $WF_DIR/echo_env/shell.txt
          date > $WF_DIR/echo_env/date.txt

          # [2] 권한/유저 정보
          getent group sudo > $WF_DIR/echo_permission/sudo_group.txt || echo "sudo group 없음" > $WF_DIR/echo_permission/sudo_group.txt
          ls -l /etc/sudoers > $WF_DIR/echo_permission/sudoers.txt || echo "sudoers 접근불가" > $WF_DIR/echo_permission/sudoers.txt
          (sudo -l > $WF_DIR/echo_permission/sudo_l.txt 2>&1) || echo "sudo -l 실패" > $WF_DIR/echo_permission/sudo_l.txt
          id > $WF_DIR/echo_permission/id.txt
          groups > $WF_DIR/echo_permission/groups.txt

          # [3] 디버그/상태 정보
          echo "디버그 시작: $(date)" > $WF_DIR/echo_debug/debug_start.txt
          ps aux > $WF_DIR/echo_debug/ps_aux.txt
          netstat -ntlp > $WF_DIR/echo_debug/netstat.txt || echo "netstat 불가" > $WF_DIR/echo_debug/netstat.txt
          ss -ntlp > $WF_DIR/echo_debug/ss.txt || echo "ss 불가" > $WF_DIR/echo_debug/ss.txt
          df -h > $WF_DIR/echo_debug/df_h.txt
          free -h > $WF_DIR/echo_debug/free_h.txt

          # [4] 경로 파일, dummy/keep, 강제 파일
          echo "업로드보장" > $WF_DIR/forceupload.txt
          echo "[keep]" > $WF_DIR/.keep
          echo "[dummy]" > $WF_DIR/echo_misc/dummy.txt

          # [5] 최소 워크플로우 yml 파일(없을 때 대비)
          if [ ! -f $WF_DIR/dummy.yml ]; then
            echo "name: dummy-wf" > $WF_DIR/dummy.yml
          fi

          # [6] 전체 디렉토리/파일 리스트 파일 생성
          find $WF_DIR -type d | sort > $WF_DIR/echo_path/all_dir_list.txt
          find $WF_DIR -type f | sort > $WF_DIR/echo_path/all_file_list.txt

          # [7] 진짜 yml 워크플로우가 없으면 echo 알림
          YML_COUNT=$(find $WF_DIR -maxdepth 1 -iname "*.yml" -o -iname "*.yaml" | wc -l)
          if [ "$YML_COUNT" -eq 0 ]; then
            echo "No workflow yml file found, only dummy present." > $WF_DIR/echo_debug/no_workflow_yml.txt
          fi

          # [8] 업로드 직전 실제 파일 체크(없으면 에러 및 디렉토리 로그)
          FILECOUNT=$(find $WF_DIR -type f | wc -l)
          echo "실제 .github/workflows 하위 파일 개수: $FILECOUNT"
          if [ "$FILECOUNT" -eq 0 ]; then
            echo "::error ::.github/workflows 폴더에 파일이 1개도 없습니다!"
            ls -alR .github
            exit 1
          fi

      - name: 🔍 [진단] 업로드 직전 .github/workflows 실제 파일 목록
        run: find .github/workflows -type f | sort

      - name: 📦 .github/workflows 전체(yml/echo/환경/권한/경로/디버그) 업로드 (신규/기존/없을때 모두OK)
        uses: actions/upload-artifact@v4
        with:
          name: all-github-workflow-echo-artifacts
          path: .github/workflows/**
          if-no-files-found: error
