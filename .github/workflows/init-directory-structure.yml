permissions:
  contents: write

jobs:
  setup-directories:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧱 Create Directories (.github + others)
        run: |
          mkdir -p .github/{workflows,scripts,logs,global,provenance,artifacts}
          mkdir -p disk/{slot-001,slot-002,slot-logs,artifacts,ledger,backup}
          mkdir -p data/{transactions,provenance}
          mkdir -p docker/{mysql,postgres,logs}
          mkdir -p site output
          echo "[✔] 디렉토리 전체 생성 완료"
