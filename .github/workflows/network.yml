name: 🌐 All-in-One 시스템/네트워크/도커/보안/설치/빌드 자동화 (에코+진단)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  all-in-one-info:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      # 0. 모든 에코/로그/백업/빌드/서버 관련 디렉토리 대량 생성
      - name: 📁 주요 디렉토리 일괄 생성 (에코)
        run: |
          for d in \
            .github/echo_system .github/echo_network .github/echo_dns .github/echo_route \
            .github/echo_docker .github/echo_containers .github/echo_volume .github/echo_logs \
            .github/echo_permission .github/echo_user .github/echo_key .github/echo_fileperm \
            .github/echo_pkg .github/echo_env .github/echo_build .github/echo_git \
            .github/echo_backup .github/echo_monitor .github/echo_misc ; do
            echo "echo 'mkdir -p $d'" ; mkdir -p $d
          done

      # 1. 시스템/네트워크 상태/진단 에코
      - name: 🖥️ 시스템/네트워크 정보 에코 파일 생성
        run: |
          # 시스템 상태
          echo "ifconfig > .github/echo_system/ifconfig.txt" | tee .github/echo_system/ifconfig.sh
          ifconfig > .github/echo_system/ifconfig.txt || ip a > .github/echo_system/ifconfig.txt
          echo "hostname > .github/echo_system/hostname.txt" | tee .github/echo_system/hostname.sh
          hostname > .github/echo_system/hostname.txt
          echo "uname -a > .github/echo_system/uname.txt" | tee .github/echo_system/uname.sh
          uname -a > .github/echo_system/uname.txt
          echo "df -h > .github/echo_system/diskfree.txt" | tee .github/echo_system/diskfree.sh
          df -h > .github/echo_system/diskfree.txt
          echo "free -m > .github/echo_system/freemem.txt" | tee .github/echo_system/freemem.sh
          free -m > .github/echo_system/freemem.txt

          # 네트워크 포트
          echo "netstat -tuln > .github/echo_network/netstat.txt" | tee .github/echo_network/netstat.sh
          netstat -tuln > .github/echo_network/netstat.txt || ss -tnlp > .github/echo_network/netstat.txt
          echo "ss -tnlp > .github/echo_network/ss.txt" | tee .github/echo_network/ss.sh
          ss -tnlp > .github/echo_network/ss.txt

          # DNS 정보
          echo "nslookup github.com > .github/echo_dns/nslookup.txt" | tee .github/echo_dns/nslookup.sh
          nslookup github.com > .github/echo_dns/nslookup.txt || true
          echo "dig github.com > .github/echo_dns/dig.txt" | tee .github/echo_dns/dig.sh
          dig github.com > .github/echo_dns/dig.txt || true
          echo "cat /etc/resolv.conf > .github/echo_dns/resolvconf.txt" | tee .github/echo_dns/resolvconf.sh
          cat /etc/resolv.conf > .github/echo_dns/resolvconf.txt

          # 외부 연결 진단
          echo "traceroute 8.8.8.8 > .github/echo_route/traceroute.txt" | tee .github/echo_route/traceroute.sh
          traceroute 8.8.8.8 > .github/echo_route/traceroute.txt || true
          echo "ping -c 4 8.8.8.8 > .github/echo_route/ping.txt" | tee .github/echo_route/ping.sh
          ping -c 4 8.8.8.8 > .github/echo_route/ping.txt || true

          # 주요 네트워크 파일
          echo "cat /etc/hosts > .github/echo_network/hosts.txt" | tee .github/echo_network/hosts.sh
          cat /etc/hosts > .github/echo_network/hosts.txt
          echo "cat /etc/hostname > .github/echo_network/hostname.txt" | tee .github/echo_network/hostnamefile.sh
          cat /etc/hostname > .github/echo_network/hostname.txt
          echo "cat /etc/network/interfaces > .github/echo_network/interfaces.txt" | tee .github/echo_network/interfaces.sh
          cat /etc/network/interfaces > .github/echo_network/interfaces.txt || true

      # 2. 도커/컨테이너 정보 에코
      - name: 🐳 도커/컨테이너 정보 에코 파일 생성
        run: |
          # 도커/컨테이너 정보
          echo "docker images > .github/echo_docker/docker_images.txt" | tee .github/echo_docker/images.sh
          docker images > .github/echo_docker/docker_images.txt || true
          echo "docker ps -a > .github/echo_containers/docker_containers.txt" | tee .github/echo_containers/ps.sh
          docker ps -a > .github/echo_containers/docker_containers.txt || true
          echo "docker volume ls > .github/echo_volume/docker_volumes.txt" | tee .github/echo_volume/volume.sh
          docker volume ls > .github/echo_volume/docker_volumes.txt || true
          echo "docker info > .github/echo_docker/docker_info.txt" | tee .github/echo_docker/info.sh
          docker info > .github/echo_docker/docker_info.txt || true
          echo "docker-compose --version > .github/echo_docker/docker_compose_version.txt" | tee .github/echo_docker/compose.sh
          docker-compose --version > .github/echo_docker/docker_compose_version.txt || true

          # 도커 컨테이너/로그/inspect(샘플, 1개 컨테이너만)
          CID=$(docker ps -q | head -n1)
          if [ -n "$CID" ]; then
            echo "docker logs $CID > .github/echo_logs/docker_logs.txt" | tee .github/echo_logs/docker_logs.sh
            docker logs $CID > .github/echo_logs/docker_logs.txt || true
            echo "docker inspect $CID > .github/echo_logs/inspect.json" | tee .github/echo_logs/inspect.sh
            docker inspect $CID > .github/echo_logs/inspect.json || true
          fi

      # 3. 권한/보안/유저 정보 에코
      - name: 🔐 권한/보안/유저 정보 에코 파일 생성
        run: |
          echo "who > .github/echo_user/who.txt" | tee .github/echo_user/who.sh
          who > .github/echo_user/who.txt || true
          echo "w > .github/echo_user/w.txt" | tee .github/echo_user/w.sh
          w > .github/echo_user/w.txt || true
          echo "cat /etc/passwd > .github/echo_user/passwd.txt" | tee .github/echo_user/passwd.sh
          cat /etc/passwd > .github/echo_user/passwd.txt

          # shadow (마스킹)
          echo "sudo cat /etc/shadow | grep runner > .github/echo_user/shadow_runner.txt" | tee .github/echo_user/shadow.sh
          sudo cat /etc/shadow | grep runner > .github/echo_user/shadow_runner.txt || true
          echo "getent group sudo > .github/echo_permission/sudo_group.txt" | tee .github/echo_permission/sudo_group.sh
          getent group sudo > .github/echo_permission/sudo_group.txt || true
          echo "ls -l /etc/sudoers > .github/echo_permission/sudoers.txt" | tee .github/echo_permission/sudoers.sh
          ls -l /etc/sudoers > .github/echo_permission/sudoers.txt || true
          echo "ls -l /etc/ssh/sshd_config > .github/echo_permission/sshd_config.txt" | tee .github/echo_permission/sshd.sh
          ls -l /etc/ssh/sshd_config > .github/echo_permission/sshd_config.txt || true
          echo "sudo -l > .github/echo_permission/sudo_l.txt" | tee .github/echo_permission/sudo_l.sh
          sudo -l > .github/echo_permission/sudo_l.txt || true
          echo "cat ~/.ssh/authorized_keys > .github/echo_key/authorized_keys.txt" | tee .github/echo_key/authorized_keys.sh
          cat ~/.ssh/authorized_keys > .github/echo_key/authorized_keys.txt || true
          echo "ls -alR /etc > .github/echo_fileperm/etc_perm.txt" | tee .github/echo_fileperm/etc_perm.sh
          ls -alR /etc > .github/echo_fileperm/etc_perm.txt || true

      # 4. 패키지/설치 정보 에코 및 샘플 설치 (에코 + 진단 + 자동복구)
      - name: 📦 패키지/설치 정보 및 서버 설치 (에코+진단)
        run: |
          echo "dpkg -l > .github/echo_pkg/dpkg_list.txt" | tee .github/echo_pkg/dpkg_list.sh
          dpkg -l > .github/echo_pkg/dpkg_list.txt || true
          echo "pip freeze > .github/echo_pkg/requirements.txt" | tee .github/echo_pkg/pip.sh
          pip freeze > .github/echo_pkg/requirements.txt || true
          echo "env > .github/echo_env/env.txt" | tee .github/echo_env/env.sh
          env > .github/echo_env/env.txt

          # [설치 전] held/broken 패키지 진단
          echo "dpkg --get-selections | grep hold > .github/echo_pkg/held_packages.txt" | tee .github/echo_pkg/held_pkg.sh
          dpkg --get-selections | grep hold > .github/echo_pkg/held_packages.txt || true
          echo "apt-mark showhold > .github/echo_pkg/apt_mark_showhold.txt" | tee .github/echo_pkg/apt_mark_showhold.sh
          apt-mark showhold > .github/echo_pkg/apt_mark_showhold.txt || true
          echo "apt-get check > .github/echo_pkg/apt_check.txt 2>&1" | tee .github/echo_pkg/apt_check.sh
          apt-get check > .github/echo_pkg/apt_check.txt 2>&1 || true

          # [설치 전] sources.list, 상태 echo
          echo "cat /etc/apt/sources.list > .github/echo_pkg/apt_sources.txt" | tee .github/echo_pkg/sources.sh
          cat /etc/apt/sources.list > .github/echo_pkg/apt_sources.txt || true

          # [설치 명령 에코/실행/로그 기록]
          echo "sudo apt-get update" | tee .github/echo_pkg/apt_update.sh
          sudo apt-get update | tee .github/echo_pkg/apt_update.log || true

          echo "sudo apt-get install -y nginx mysql-server docker.io" | tee .github/echo_pkg/apt_install.sh
          sudo apt-get install -y nginx mysql-server docker.io | tee .github/echo_pkg/apt_install.log || true

          # [설치 에러 진단 추가]
          echo "cat /var/log/apt/term.log > .github/echo_pkg/apt_term_log.txt" | tee .github/echo_pkg/apt_term_log.sh
          cat /var/log/apt/term.log > .github/echo_pkg/apt_term_log.txt || true

          echo "cat /var/log/apt/history.log > .github/echo_pkg/apt_history_log.txt" | tee .github/echo_pkg/apt_history_log.sh
          cat /var/log/apt/history.log > .github/echo_pkg/apt_history_log.txt || true

          # [의존성 충돌/hold 문제시 해결 팁 에코]
          echo "sudo apt-get -f install" | tee .github/echo_pkg/apt_fix.sh
          sudo apt-get -f install | tee .github/echo_pkg/apt_fix.log || true
          echo "sudo dpkg --configure -a" | tee .github/echo_pkg/dpkg_conf.sh
          sudo dpkg --configure -a | tee .github/echo_pkg/dpkg_conf.log || true

          # 주요 런타임 버전
          echo "python3 --version > .github/echo_pkg/python.txt" | tee .github/echo_pkg/python.sh
          python3 --version > .github/echo_pkg/python.txt
          echo "java -version > .github/echo_pkg/java.txt 2>&1" | tee .github/echo_pkg/java.sh
          java -version > .github/echo_pkg/java.txt 2>&1 || true
          echo "node --version > .github/echo_pkg/node.txt" | tee .github/echo_pkg/node.sh
          node --version > .github/echo_pkg/node.txt || true
          echo "npm --version > .github/echo_pkg/npm.txt" | tee .github/echo_pkg/npm.sh
          npm --version > .github/echo_pkg/npm.txt || true
          echo "gradle --version > .github/echo_pkg/gradle.txt" | tee .github/echo_pkg/gradle.sh
          gradle --version > .github/echo_pkg/gradle.txt || true
          echo "mvn -v > .github/echo_pkg/maven.txt" | tee .github/echo_pkg/maven.sh
          mvn -v > .github/echo_pkg/maven.txt || true

      # 5. 빌드/배포 자동화 에코
      - name: 🚀 빌드/테스트/배포 에코 파일 생성
        run: |
          echo "echo 'echo Build Start' > .github/echo_build/build.sh && echo 'echo Done' >> .github/echo_build/build.sh" | tee .github/echo_build/build_echo.sh
          echo "echo 'echo Test Start' > .github/echo_build/test.sh && echo 'echo Test Done' >> .github/echo_build/test.sh" | tee .github/echo_build/test_echo.sh
          echo "echo 'echo Deploy Start' > .github/echo_build/deploy.sh && echo 'echo Deploy Done' >> .github/echo_build/deploy.sh" | tee .github/echo_build/deploy_echo.sh
          chmod +x .github/echo_build/*.sh

          # git 커밋/릴리즈
          echo "git log --oneline > .github/echo_git/git_log.txt" | tee .github/echo_git/log.sh
          git log --oneline > .github/echo_git/git_log.txt || true
          echo "git describe --tags > .github/echo_git/git_release.txt" | tee .github/echo_git/release.sh
          git describe --tags > .github/echo_git/git_release.txt || true

          # 산출물 압축
          echo "tar czf .github/echo_build/result.tar.gz .github/echo_system .github/echo_network" | tee .github/echo_build/tar.sh
          tar czf .github/echo_build/result.tar.gz .github/echo_system .github/echo_network

      # 6. 모니터링/로그/백업 에코
      - name: 📈 시스템/애플리케이션 로그/백업 에코 파일 생성
        run: |
          echo "cat /var/log/syslog > .github/echo_monitor/syslog.txt" | tee .github/echo_monitor/syslog.sh
          cat /var/log/syslog > .github/echo_monitor/syslog.txt || true
          echo "cat /var/log/messages > .github/echo_monitor/messages.txt" | tee .github/echo_monitor/messages.sh
          cat /var/log/messages > .github/echo_monitor/messages.txt || true
          echo "tail -n 100 /var/log/syslog > .github/echo_monitor/tail_syslog.txt" | tee .github/echo_monitor/tail_syslog.sh
          tail -n 100 /var/log/syslog > .github/echo_monitor/tail_syslog.txt || true

          # 주기적 백업 스크립트, DB 덤프 샘플
          echo "echo 'mysqldump -u root -p ...' > .github/echo_backup/db_backup.sh" | tee .github/echo_backup/backup_echo.sh
          echo "mysqldump -u root -p'yourpassword' --all-databases > .github/echo_backup/all_db.sql" | tee .github/echo_backup/dbdump.sh
          chmod +x .github/echo_backup/*.sh

      # 7. 기타 자동화/디버깅 에코 파일 생성
      - name: 🛠️ 기타 자동화/디버깅 에코 파일 생성
        run: |
          echo "tree -a -L 3 > .github/echo_misc/tree.txt" | tee .github/echo_misc/tree.sh
          tree -a -L 3 > .github/echo_misc/tree.txt || true
          echo "du -sh * > .github/echo_misc/disk_usage.txt" | tee .github/echo_misc/disk_usage.sh
          du -sh * > .github/echo_misc/disk_usage.txt || true
          echo "ps aux > .github/echo_misc/ps.txt" | tee .github/echo_misc/ps.sh
          ps aux > .github/echo_misc/ps.txt || true

      # 8. 생성된 모든 파일 아티팩트 업로드
      - name: 📦 모든 정보/에코 파일 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: all-echo-artifacts
          path: .github/echo_*/**
