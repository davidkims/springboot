name: 🛡️ OpenSSF Scorecard Analysis (Docker with Auth, no SARIF)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # 매일 오전 10시(KST)

permissions:
  contents: read
  security-events: write
  actions: read

env:
  TARGET_REPO: davidkims/springboot
  OUT_DIR: .github/scorecard

jobs:
  run-scorecard:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout repository
        uses: actions/checkout@v4

      - name: 📂 Prepare output directory
        run: |
          echo "[+] Creating directory: $OUT_DIR"
          mkdir -p $OUT_DIR
          tree .github || true

      - name: 🧪 Run Scorecard (Docker with GitHub token)
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[+] Running Scorecard (JSON only)"
          docker run --rm \
            -v "$(pwd)":/repo \
            -e GITHUB_AUTH_TOKEN=$GITHUB_AUTH_TOKEN \
            gcr.io/openssf/scorecard:stable \
            --repo=https://github.com/${TARGET_REPO} \
            --format=json --show-details > $OUT_DIR/scorecard-report.json
          echo "[✔] JSON report created at $OUT_DIR/scorecard-report.json"

      - name: 📄 Extract summary (scorecard-summary.json)
        run: |
          jq '[.checks[] | {name, score, reason}]' $OUT_DIR/scorecard-report.json > $OUT_DIR/scorecard-summary.json
          echo "[✔] Summary created at $OUT_DIR/scorecard-summary.json"
