name: S3 백업 업로드 (AWS 자격증명 자동 발급+echo)

on:
  workflow_dispatch:

jobs:
  upload_backup:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-2
      S3_BUCKET_NAME: your-s3-backup-bucket

    steps:
      - name: 🛠️ AWS CLI 설치 (echo)
        run: |
          echo "echo '[0] AWS CLI 설치...'"
          echo '[0] AWS CLI 설치...'
          sudo apt-get update
          sudo apt-get install -y awscli jq

      - name: 📂 /tmp/echo_aws 디렉토리 생성 (echo)
        run: |
          echo "echo '[1] /tmp/echo_aws 디렉토리 생성...'"
          echo '[1] /tmp/echo_aws 디렉토리 생성...'
          mkdir -p /tmp/echo_aws

      - name: 🔑 (테스트용) AWS 자격증명 자동 발급 및 echo 저장
        id: gencreds
        env:
          # 반드시 먼저 Root/IAM 계정에서 GitHub Secrets로 AWS_ADMIN_ACCESS_KEY/AWS_ADMIN_SECRET_KEY 입력 필요
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ADMIN_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ADMIN_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          echo "echo '[2] AWS 자격증명 자동 발급...'"
          echo '[2] AWS 자격증명 자동 발급...'
          USER_NAME="github-actions-backup"
          echo "echo \"aws iam create-access-key --user-name $USER_NAME > /tmp/echo_aws/aws_creds.json\""
          aws iam create-access-key --user-name $USER_NAME > /tmp/echo_aws/aws_creds.json

          ACCESS_KEY=$(jq -r .AccessKey.AccessKeyId /tmp/echo_aws/aws_creds.json)
          SECRET_KEY=$(jq -r .AccessKey.SecretAccessKey /tmp/echo_aws/aws_creds.json)
          echo "echo \"AccessKey: $ACCESS_KEY\""
          echo "AccessKey: $ACCESS_KEY"
          echo "echo \"SecretKey: $SECRET_KEY\""
          echo "SecretKey: $SECRET_KEY"

          echo "$ACCESS_KEY" > /tmp/echo_aws/access_key.txt
          echo "$SECRET_KEY" > /tmp/echo_aws/secret_key.txt

          echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY" >> $GITHUB_OUTPUT
          echo "AWS_SECRET_ACCESS_KEY=$SECRET_KEY" >> $GITHUB_OUTPUT

      - name: ☁️ AWS 자격증명 구성 (자동 발급값 활용, echo)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ steps.gencreds.outputs.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ steps.gencreds.outputs.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🌐 DB 백업파일 다운로드 (실제 파일, echo)
        id: download
        run: |
          echo "echo '[3] 백업 파일 다운로드...'"
          echo '[3] 백업 파일 다운로드...'
          BACKUP_FILE_URL="https://raw.githubusercontent.com/lerocha/chinook-database/master/ChinookDatabase/DataSources/Chinook_PostgreSql.sql"
          BACKUP_FILE_NAME=$(basename "$BACKUP_FILE_URL")
          BACKUP_FILE_PATH="/tmp/echo_aws/${BACKUP_FILE_NAME}"
          echo "echo \"wget -O \\\"$BACKUP_FILE_PATH\\\" \\\"$BACKUP_FILE_URL\\\"\""
          wget -O "$BACKUP_FILE_PATH" "$BACKUP_FILE_URL"
          echo "echo \"다운로드 파일 경로: $BACKUP_FILE_PATH\""
          echo "다운로드 파일 경로: $BACKUP_FILE_PATH"
          echo "BACKUP_FILE_PATH=$BACKUP_FILE_PATH" >> $GITHUB_OUTPUT
          echo "BACKUP_FILE_NAME=$BACKUP_FILE_NAME" >> $GITHUB_OUTPUT

      - name: ⬆️ S3에 백업 업로드 (echo)
        run: |
          BACKUP_FILE_PATH="${{ steps.download.outputs.BACKUP_FILE_PATH }}"
          BACKUP_FILE_NAME="${{ steps.download.outputs.BACKUP_FILE_NAME }}"
          echo "echo '[4] aws s3 cp 명령 실행...'"
          echo '[4] aws s3 cp 명령 실행...'
          echo "aws s3 cp \"$BACKUP_FILE_PATH\" \"s3://${{ env.S3_BUCKET_NAME }}/backups/$BACKUP_FILE_NAME\""
          aws s3 cp "$BACKUP_FILE_PATH" "s3://${{ env.S3_BUCKET_NAME }}/backups/$BACKUP_FILE_NAME"
          echo "echo '✅ S3 업로드 완료: s3://${{ env.S3_BUCKET_NAME }}/backups/$BACKUP_FILE_NAME'"
          echo "✅ S3 업로드 완료: s3://${{ env.S3_BUCKET_NAME }}/backups/$BACKUP_FILE_NAME"

      - name: 🧹 로컬 및 echo 파일 정리 (echo)
        if: always()
        run: |
          echo "echo '[5] 로컬/임시/echo 파일 삭제...'"
          echo '[5] 로컬/임시/echo 파일 삭제...'
          rm -rf /tmp/echo_aws
          echo "echo '✅ 로컬/echo 파일 정리 완료'"
          echo "✅ 로컬/echo 파일 정리 완료"
