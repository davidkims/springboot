name: 📄 문서 자동화 (README.md 자동 생성/수정)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  auto-doc:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🕒 Python으로 README.md 자동 생성/수정
        run: |
          echo "import datetime" > gen_doc.py
          echo "now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')" >> gen_doc.py
          echo "with open('README.md', 'a', encoding='utf-8') as f:" >> gen_doc.py
          echo "    f.write(f'\\n## 워크플로우 자동 실행 로그\\n- 실행시각: {now}\\n')" >> gen_doc.py
          python3 gen_doc.py

      - name: 🔄 변경 파일 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: README.md 자동 업데이트 [skip ci]" || echo "No changes"
          git push || echo "Push skipped"
