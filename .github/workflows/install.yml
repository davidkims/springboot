name: 🗂️ MEGA-DB/Transaction/Account/Transfer/User/Sim/Install/Permission/Mass/Operate/Util/Compose

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  db-echo-mega:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 Create all echo folders (Full Coverage + Teradata + DWH + Containers)
        run: |
          mkdir -p .github/echo_db
          for d in dirs files installs upgrade permissions scripts logs services compose homebrew choco snap marketplace backup init test migration import export serverinfo errorlog util mass_db mass_script mass_query ddl ledger vaccount transfer user sim teradata dwh containers cli api runtime bin output verify auth sql db select exec; do
            echo "echo 'mkdir -p .github/echo_db/$d'" >> .github/echo_db/echo_dir_create.sh
            mkdir -p ".github/echo_db/$d"
          done

      - name: 📝 Generate all SQL/scripts for DB, Teradata, DWH, echo, containers, runtime, selects
        run: |
          set -e
          SERVICES="mysql postgresql sqlite3"
          MASS_CNT=1000
          TX_TYPES="DEPOSIT WITHDRAWAL TRANSFER PAYMENT FEE"

          for svc in $SERVICES; do
            for i in $(seq 1 $MASS_CNT); do
              echo "CREATE TABLE IF NOT EXISTS user_${svc}_$i (user_id VARCHAR(50) PRIMARY KEY, name VARCHAR(50), email VARCHAR(100), reg_ts DATETIME);" > .github/echo_db/user/${svc}_user_${i}_create.sql
              echo "INSERT INTO user_${svc}_$i (user_id, name, email, reg_ts) VALUES ('user_${svc}_$i', 'User $i', 'user${i}@${svc}.com', CURRENT_TIMESTAMP);" >> .github/echo_db/user/${svc}_user_${i}_insert.sql

              acct="account_${svc}_$i"
              echo "CREATE TABLE IF NOT EXISTS $acct (account_no VARCHAR(50) PRIMARY KEY, user_id VARCHAR(50), type VARCHAR(10), balance INT, open_dt DATETIME);" > .github/echo_db/vaccount/${svc}_${acct}_create.sql
              echo "INSERT INTO $acct (account_no, user_id, type, balance, open_dt) VALUES ('ACC${svc}$(printf %05d $i)', 'user_${svc}_$i', 'CHECKING', 100000, CURRENT_TIMESTAMP);" >> .github/echo_db/vaccount/${svc}_${acct}_insert.sql

              ledger_tbl="ledger_${svc}_$i"
              echo "CREATE TABLE IF NOT EXISTS $ledger_tbl (tx_id INT PRIMARY KEY, account_no VARCHAR(50), tx_type VARCHAR(20), amount INT, balance INT, note VARCHAR(100), ts DATETIME);" > .github/echo_db/ledger/${svc}_${ledger_tbl}_create.sql
              for tt in $TX_TYPES; do
                echo "INSERT INTO $ledger_tbl (tx_id, account_no, tx_type, amount, balance, note, ts) VALUES ($i, 'ACC${svc}$(printf %05d $i)', '$tt', $((10000+$i)), $((100000+$i)), '$tt Tx $i', CURRENT_TIMESTAMP);" >> .github/echo_db/ledger/${svc}_${ledger_tbl}_insert.sql
              done

              transfer_tbl="transfer_${svc}_$i"
              echo "CREATE TABLE IF NOT EXISTS $transfer_tbl (tx_id INT PRIMARY KEY, from_acc VARCHAR(50), to_acc VARCHAR(50), amount INT, tx_type VARCHAR(20), ts DATETIME);" > .github/echo_db/transfer/${svc}_${transfer_tbl}_create.sql
              echo "INSERT INTO $transfer_tbl (tx_id, from_acc, to_acc, amount, tx_type, ts) VALUES ($i, 'ACC${svc}$(printf %05d $i)', 'ACC${svc}$(printf %05d $((i+1)))', 5000, 'TRANSFER', CURRENT_TIMESTAMP);" >> .github/echo_db/transfer/${svc}_${transfer_tbl}_insert.sql

              echo "SELECT user_id, SUM(balance) as total_balance FROM $acct GROUP BY user_id;" > .github/echo_db/select/${svc}_${acct}_balance_sum.sql
              echo "SELECT account_no, SUM(amount) as total_tx FROM $ledger_tbl GROUP BY account_no;" > .github/echo_db/select/${svc}_${ledger_tbl}_tx_sum.sql
            done

            echo "echo '[EXEC] $svc all balance sum'" > .github/echo_db/exec/${svc}_exec_balance.sh
            echo "for sql in .github/echo_db/select/${svc}_*_balance_sum.sql; do" >> .github/echo_db/exec/${svc}_exec_balance.sh
            if [ "$svc" = "mysql" ]; then
              echo "  mysql -uroot -prootpass123 test_db < \$sql | tee -a .github/echo_db/output/${svc}_balance_sum.csv" >> .github/echo_db/exec/${svc}_exec_balance.sh
            elif [ "$svc" = "postgresql" ]; then
              echo "  psql -U postgres -d test_db -f \$sql | tee -a .github/echo_db/output/${svc}_balance_sum.csv" >> .github/echo_db/exec/${svc}_exec_balance.sh
            elif [ "$svc" = "sqlite3" ]; then
              echo "  sqlite3 test.db < \$sql | tee -a .github/echo_db/output/${svc}_balance_sum.csv" >> .github/echo_db/exec/${svc}_exec_balance.sh
            fi
            echo "done" >> .github/echo_db/exec/${svc}_exec_balance.sh
          done

      - name: 🏷️ Show all echo outputs
        run: |
          echo "[ECHO] Dumping all echo outputs"
          find .github/echo_db -type f | sort | while read f; do
            echo "-----"
            echo "[FILE] $f"
            cat "$f"
            echo
          done
