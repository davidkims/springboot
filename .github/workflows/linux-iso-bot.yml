name: "🏦 MEGA Finance EchoOps (MariaDB + Oracle + PostgreSQL + Redis + Kafka)"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/finance-echo
  IMAGE_TAG: latest
  BACKUP_VOLUME: finance_backup_vol
  BACKUP_DIR: /backup
  KAFKA_LOG: kafka.log

jobs:
  mega-finance-echoops:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v5

      - name: 🛠️ Dockerfile (에코 이미지 생성:재무제표 파일 포함)
        run: |
          echoe(){ echo "[ECHO] $@"; }
          echoe "Dockerfile 생성"
          cat > Dockerfile <<'DOCKER'
          FROM alpine:3.18
          RUN apk add --no-cache bash mariadb-client postgresql-client redis
          RUN mkdir -p /app /data
          RUN echo "# 재무 거래 로그 (에코)" > /app/transactions.log
          RUN echo "$(date) 거래유형: 계좌이체, 금액: 100000KRW, 상태: 완료" >> /app/transactions.log
          RUN echo "$(date) 거래유형: 신용카드, 금액: 250000KRW, 상태: 완료" >> /app/transactions.log
          RUN echo "$(date) 거래유형: 비트코인, 금액: 0.03BTC, 상태: 완료" >> /app/transactions.log
          CMD ["bash","-c","cp /app/transactions.log /data/statement-$(date +%Y%m%d%H%M%S).txt && sleep 30"]
          DOCKER

      - name: 🔐 Docker 로그인 (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Docker 이미지 빌드 및 푸시
        run: |
          echoe "이미지 빌드 & 푸시"
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker push $IMAGE_NAME:$IMAGE_TAG

      - name: 📦 백업 볼륨 생성
        run: docker volume create $BACKUP_VOLUME

      # ──────── MariaDB ────────
      - name: 🗄️ MariaDB 컨테이너 실행 및 테이블 생성
        run: |
          echoe "MariaDB 실행"
          docker run -d --name mariadb-echo -e MYSQL_ROOT_PASSWORD=secret -v $BACKUP_VOLUME:$BACKUP_DIR mariadb:10.11
          sleep 25
          docker exec mariadb-echo mysql -uroot -psecret <<'SQL'
          CREATE DATABASE IF NOT EXISTS finance;
          USE finance;
          CREATE TABLE IF NOT EXISTS statements (id INT AUTO_INCREMENT PRIMARY KEY, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, note VARCHAR(255));
          INSERT INTO statements(note) VALUES ('MariaDB Echo Statement');
          SQL

      # ──────── Oracle XE ────────
      - name: 🗄️ Oracle XE 컨테이너 실행 및 테이블 생성
        run: |
          echoe "Oracle XE 실행"
          docker run -d --name oracle-echo -e ORACLE_PASSWORD=secret gvenzl/oracle-xe:21-slim
          sleep 40
          echoe "Oracle finance schema 생성"
          docker exec oracle-echo bash -c "echo \"CREATE USER finance IDENTIFIED BY finance; GRANT CONNECT, RESOURCE TO finance;\" | sqlplus -s system/secret@localhost:1521/XEPDB1"
          docker exec oracle-echo bash -c "echo \"CREATE TABLE statements (id NUMBER GENERATED BY DEFAULT AS IDENTITY, note VARCHAR2(255), created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP); INSERT INTO statements(note) VALUES ('Oracle Echo Statement');\" | sqlplus -s finance/finance@localhost:1521/XEPDB1"

      # ──────── PostgreSQL ────────
      - name: 🗄️ PostgreSQL 컨테이너 실행 및 테이블 생성
        run: |
          echoe "PostgreSQL 실행"
          docker run -d --name postgres-echo -e POSTGRES_PASSWORD=secret postgres:15
          sleep 20
          docker exec postgres-echo psql -U postgres -c "CREATE DATABASE finance;"
          docker exec postgres-echo psql -U postgres -d finance -c "CREATE TABLE IF NOT EXISTS statements (id SERIAL PRIMARY KEY, note TEXT, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"
          docker exec postgres-echo psql -U postgres -d finance -c "INSERT INTO statements(note) VALUES ('PostgreSQL Echo Statement');"

      # ──────── Redis ────────
      - name: 🗄️ Redis 컨테이너 실행 및 키 저장
        run: |
          echoe "Redis 실행"
          docker run -d --name redis-echo redis:7
          sleep 10
          echoe "Redis 재무제표 키 저장"
          docker exec redis-echo redis-cli SET finance:statement "Redis Echo Statement"

      # ──────── Kafka ────────
      - name: 🗄️ Kafka 컨테이너 실행 및 토픽 생성
        run: |
          echoe "Kafka 실행"
          docker network create kafka-net || true
          docker run -d --name zookeeper --network kafka-net -e ZOOKEEPER_CLIENT_PORT=2181 wurstmeister/zookeeper
          docker run -d --name kafka --network kafka-net -e KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181 -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT wurstmeister/kafka
          sleep 25
          echoe "Kafka 토픽 생성"
          docker exec kafka kafka-topics.sh --create --topic finance-statements --bootstrap-server localhost:9092 || true
          echoe "Kafka 메시지 전송"
          echo "Kafka Echo Statement" | docker exec -i kafka kafka-console-producer.sh --topic finance-statements --bootstrap-server localhost:9092

      - name: 🚀 Finance 컨테이너 실행 (에코 + 백업)
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          docker run --rm -v $BACKUP_VOLUME:$BACKUP_DIR $IMAGE_NAME:$IMAGE_TAG \
            bash -c "
              echo '📊 재무제표 백업 [$TIMESTAMP]' > $BACKUP_DIR/backup-$TIMESTAMP.txt;
              cat /app/transactions.log >> $BACKUP_DIR/backup-$TIMESTAMP.txt;
              echo '✅ 백업 완료' >> $BACKUP_DIR/backup-$TIMESTAMP.txt;
              echo '$TIMESTAMP [backup] 거래 로그 백업 완료' >> /app/kafka.log;
            "
          echo "$TIMESTAMP [backup] 완료" >> $KAFKA_LOG

      - name: 📊 DB 쿼리 확인
        run: |
          echoe "MariaDB SELECT"
          docker exec mariadb-echo mysql -uroot -psecret -e "USE finance; SELECT * FROM statements;"
          echoe "Oracle SELECT"
          docker exec oracle-echo bash -c "echo \"SELECT * FROM statements;\" | sqlplus -s finance/finance@localhost:1521/XEPDB1"
          echoe "PostgreSQL SELECT"
          docker exec postgres-echo psql -U postgres -d finance -c "SELECT * FROM statements;"
          echoe "Redis GET"
          docker exec redis-echo redis-cli GET finance:statement

      - name: 📄 Kafka-style 로그 출력
        run: |
          echo "🪵 Kafka-style 로그 출력:"
          cat $KAFKA_LOG || echo "⚠️ 로그 없음"
