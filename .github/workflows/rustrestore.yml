name: "🦀 Rust CI — no-skip + self-heal + stable cache"

on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }
  schedule:
    - cron: "0 3 * * 1"  # 주 1회 보안 점검

permissions:
  contents: read

concurrency:
  group: rustci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"

jobs:
  rust-ci:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🧰 System deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cmake clang llvm curl git ca-certificates

      - name: 🦀 Install Rust (stable + clippy/rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
          components: clippy,rustfmt

      # ──────────────────────────────────────────────────────────────────────
      # 1) 전수 스캔 + Cargo.toml 없으면 샘플 크레이트 자동 생성(자가복구)
      #    → 어떤 경우에도 이후 단계가 "0s"로 스킵되지 않도록 보장
      # ──────────────────────────────────────────────────────────────────────
      - name: 🔎 Detect crates (and self-heal if none)
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s globstar

          echo "[ECHO] Cargo.toml 전수 스캔 시작"
          mapfile -t FOUND < <(find . -type f -name Cargo.toml \
            -not -path "*/target/*" -not -path "*/node_modules/*" | sort || true)

          if (( ${#FOUND[@]} == 0 )); then
            echo "[WARN] 리포 내 Cargo.toml 미발견 → rust-example 크레이트 자동 생성"
            rm -rf rust-example || true
            cargo new --bin rust-example
            # 샘플 코드(원하면 커스터마이즈 가능)
            cat > rust-example/src/main.rs <<'RS'
            fn main() {
                println!("hello from rust-example");
            }
            RS
            FOUND=( "./rust-example/Cargo.toml" )
          fi

          # 디렉터리 목록 생성
          printf '%s\n' "${FOUND[@]}" | xargs -I{} dirname "{}" | sort -u > .wslist.txt

          echo "count=$(wc -l < .wslist.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "list<<__WS__" >> "$GITHUB_OUTPUT"
          cat .wslist.txt >> "$GITHUB_OUTPUT"
          echo "__WS__" >> "$GITHUB_OUTPUT"

          echo "[ECHO] 검출된 크레이트 디렉터리:"
          nl -ba .wslist.txt

      # ──────────────────────────────────────────────────────────────────────
      # 2) lockfile 강제 생성(캐시키 안정화), cargo metadata 사전 성공 보장
      # ──────────────────────────────────────────────────────────────────────
      - name: 🔐 Ensure lockfiles & metadata (per crate)
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r dir; do
            echo "[ECHO] >> lockfile/metadata 보장: $dir"
            cd "$dir"
            # lockfile 생성(없으면 생성, 있으면 최신화)
            cargo generate-lockfile || true
            # metadata 사전 로드(캐시 액션에서 실패하는 것 방지)
            cargo metadata --format-version 1 --no-deps >/dev/null
            cd - >/dev/null
          done < .wslist.txt

      # ──────────────────────────────────────────────────────────────────────
      # 3) rust-cache: 반드시 유효한 경로 목록을 넘김 → 101 에러 차단
      #    (요청하신 옵션들 반영)
      # ──────────────────────────────────────────────────────────────────────
      - name: ♻️ Cache (rust-cache, stable)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ steps.detect.outputs.list }}
          cache-on-failure: true
          prefix-key: v0-rust
          cache-targets: true
          cache-all-crates: false
          cache-workspace-crates: false
          save-if: true
          cache-provider: github
          cache-bin: true
          lookup-only: false

      - name: 🔎 Show tool versions
        run: |
          rustc -Vv
          cargo -V
          echo "Crate count: ${{ steps.detect.outputs.count }}"

      # ──────────────────────────────────────────────────────────────────────
      # 4) 모든 단계 no-skip 수행: fmt → clippy → test → build → doc → audit
      #    중간 실패 발생해도 다음 크레이트 계속 진행. 마지막에 총괄 실패 처리.
      #    각 단계 로그를 아티팩트로 보관.
      # ──────────────────────────────────────────────────────────────────────
      - name: 🚀 Run full pipeline (no-skip for all crates)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .github/rust_logs
          FAIL=0

          run_step () {
            local dir="$1"; shift
            local name="$1"; shift
            echo "[RUN] $name @ $dir"
            if (cd "$dir" && "$@"); then
              echo "[OK]  $name @ $dir"
            else
              echo "[ERR] $name @ $dir" >&2
              FAIL=1
            fi
          }

          while IFS= read -r dir; do
            echo "==================== CRATE: $dir ====================" | tee -a .github/rust_logs/summary.log

            run_step "$dir" "fmt"    bash -lc "cargo fmt --all --check"            |& tee ".github/rust_logs/$(echo "$dir" | tr '/.' '_')_fmt.log"
            run_step "$dir" "clippy" bash -lc "cargo clippy --all-targets --all-features -- -D warnings" \
                                       |& tee ".github/rust_logs/$(echo "$dir" | tr '/.' '_')_clippy.log"
            run_step "$dir" "test"   bash -lc "cargo test --all-features --verbose" \
                                       |& tee ".github/rust_logs/$(echo "$dir" | tr '/.' '_')_test.log"
            run_step "$dir" "build"  bash -lc "cargo build --release --verbose"    |& tee ".github/rust_logs/$(echo "$dir" | tr '/.' '_')_build.log"
            run_step "$dir" "doc"    bash -lc "cargo doc --no-deps"                |& tee ".github/rust_logs/$(echo "$dir" | tr '/.' '_')_doc.log"

            # 보안 점검: cargo-audit (설치는 최초 1회)
            if ! command -v cargo-audit >/dev/null 2>&1; then
              cargo install cargo-audit --locked |& tee -a .github/rust_logs/audit_install.log || true
            fi
            run_step "$dir" "audit"  bash -lc "cargo audit --json || cargo audit"  |& tee ".github/rust_logs/$(echo "$dir" | tr '/.' '_')_audit.log"

          done < .wslist.txt

          echo "==== SUMMARY (0=success,1=failed) ====" | tee -a .github/rust_logs/summary.log
          echo "FAIL=$FAIL" | tee -a .github/rust_logs/summary.log
          exit $FAIL

      - name: 📦 Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-logs-${{ github.run_id }}
          path: .github/rust_logs/
          if-no-files-found: warn
