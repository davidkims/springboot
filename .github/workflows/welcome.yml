name: Welcome to the Microsoft Generative AI

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  assess-pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Print Environment Info
        run: |
          echo "[🧠] Pull Request opened by: ${{ github.actor }}"
          echo "[📁] Repository: ${{ github.repository }}"
          echo "[🌿] Branch: ${{ github.head_ref || github.ref_name }}"
          echo "[⏱️] Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
        continue-on-error: true

      - name: 📢 Confirm Node.js Installed
        run: echo "[✅] Node.js 설치 완료"

      - name: 📄 Check PR Title Format
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "[🔍] PR 제목: $TITLE"
          if [[ "$TITLE" != feat:* && "$TITLE" != fix:* && "$TITLE" != chore:* ]]; then
            echo "[❌] 제목이 규칙에 맞지 않습니다 (예: feat:, fix:)"
            exit 1
          else
            echo "[✅] 제목 규칙 통과"
          fi

      - name: 🏷️ Add Label and Comment
        uses: actions/github-script@v6
        with:
          script: |
            const issueAuthor = context.payload.sender.login;
            console.log(`[✍️] PR 작성자: @${issueAuthor}`);
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['needs-review']
            });
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `👋 Thanks for contributing @${issueAuthor}!\n\n✅ Label: \`needs-review\` 추가됨\n📝 팀에서 곧 리뷰 예정입니다!`
            });

      - name: 👥 Auto-assign Reviewer
        uses: pozil/auto-assign-issue@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: koreyspace

      - name: 📝 List Changed Files
        uses: tj-actions/changed-files@v44
        id: changed-files
      - run: |
          echo "[🧾] 변경된 파일 목록:"
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "  - $file"
          done

      - name: 🏁 Finish
        run: echo "[🎉] 워크플로우 완료"
