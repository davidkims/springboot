name: "🏦 Teradata + DW + Omni EchoOps v8.1 (Slots+NIC+Kernel+Storage Robust+Device+LogsFix+GHCR)"

on:
  workflow_dispatch:
    inputs:
      slots_omni:
        description: "Omni 서버 슬롯 수(1~50)"
        required: true
        default: "1"
      run_network:
        description: "Nginx 리버스프록시 실행 (true/false)"
        required: true
        default: "true"
      run_omni:
        description: "Omni API 실행 (true/false)"
        required: true
        default: "true"
      push_image:
        description: "GHCR 푸시/서명/스캔 (true/false)"
        required: true
        default: "false"
      commit_changes:
        description: "에코 산출물 커밋/푸시 (true/false)"
        required: true
        default: "true"
      install_nic_tools:
        description: "NIC 툴/드라이버 설치 (true/false)"
        required: true
        default: "true"
      upgrade_kernel:
        description: "커널 설치/업그레이드 (true/false)"
        required: true
        default: "false"

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ECHO_TD: .github/echo_td
      ECHO_DW: .github/echo_dw
      ECHO_NET: .github/echo_net
      ECHO_OMNI: .github/echo_omni
      ECHO_LOG: .github/echo_logs
      IMAGE_REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      OMNI_IMAGE: omni-echo
      DOCKER_NET: echo-net
      PROV_DIR: .github/echo_omni
      SLOTS_OMNI: ${{ github.event.inputs.slots_omni }}

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 🧰 Base utils & dirs (+helpers)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${ECHO_TD}/sql/td_sim" "${ECHO_DW}/db" "${ECHO_DW}/queries" \
                   "${ECHO_NET}/nginx" "${ECHO_NET}/logs" "${ECHO_NET}/promtail" "${ECHO_NET}/prometheus" \
                   "${ECHO_OMNI}" "${ECHO_LOG}"
          cat > .github/echo_tools.sh <<'BASH'
          set -Eeuo pipefail
          echoe(){ echo "[ECHO] $*"; }
          warn(){ echo "[ECHO][WARN] $*" >&2; }
          faile(){ echo "[ECHO][FAIL] $*" >&2; exit 1; }
          have(){ command -v "$1" >/dev/null 2>&1; }
          retry(){ local t="$1"; shift; local s="$1"; shift; [ "${1:-}" = "--" ] && shift || true; local n=0; until "$@"; do n=$((n+1)); [ "$n" -ge "$t" ] && return 1; sleep "$s"; done; }
          # Robust storage installers
          install_awscli(){
            if have aws; then echo "[STORAGE] awscli already present: $(aws --version 2>&1)"; return 0; fi
            # Try pip first
            if have python3; then
              python3 -m pip --version >/dev/null 2>&1 || sudo apt-get install -y python3-pip || true
              python3 -m pip install --upgrade --user awscli >/dev/null 2>&1 || true
              if have aws; then echo "[STORAGE] awscli installed via pip(user)"; return 0; fi
            fi
            # Fallback to AWS CLI v2 official installer
            tmpdir="$(mktemp -d)"
            if curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "${tmpdir}/awscliv2.zip"; then
              sudo apt-get install -y unzip >/dev/null 2>&1 || true
              unzip -q "${tmpdir}/awscliv2.zip" -d "${tmpdir}" || true
              sudo "${tmpdir}/aws/install" || true
            fi
            if have aws; then echo "[STORAGE] awscli v2 installed"; else warn "awscli install failed (non-fatal)"; fi
          }
          install_gcsfuse(){
            if have gcsfuse; then echo "[STORAGE] gcsfuse present"; return 0; fi
            . /etc/os-release
            CODENAME="${UBUNTU_CODENAME:-noble}"
            sudo mkdir -p /usr/share/keyrings
            curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo tee /usr/share/keyrings/cloud.google.gpg >/dev/null
            echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] http://packages.cloud.google.com/apt gcsfuse-${CODENAME} main" | sudo tee /etc/apt/sources.list.d/gcsfuse.list
            sudo apt-get update -y || true
            sudo apt-get install -y gcsfuse || warn "gcsfuse install failed (non-fatal)"
          }
          install_blobfuse2(){
            if have blobfuse2; then echo "[STORAGE] blobfuse2 present"; return 0; fi
            # Try apt first (if available)
            sudo apt-get install -y blobfuse2 >/dev/null 2>&1 || true
            if have blobfuse2; then return 0; fi
            # Fallback to static binary from GitHub release (latest tag URL may change; best-effort)
            tmpdir="$(mktemp -d)"
            url="https://github.com/Azure/azure-storage-fuse/releases/latest/download/blobfuse2-linux-amd64"
            if curl -fsSL "$url" -o "${tmpdir}/blobfuse2"; then
              sudo install -m 0755 "${tmpdir}/blobfuse2" /usr/local/bin/blobfuse2 || true
            fi
            have blobfuse2 || warn "blobfuse2 install failed (non-fatal)"
          }
          BASH
          chmod +x .github/echo_tools.sh

      - name: 📦 Storage clients (robust installers)
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          sudo apt-get update -y
          # Local FS / LVM
          sudo apt-get install -y lvm2 xfsprogs btrfs-progs || true
          # NFS / CIFS
          sudo apt-get install -y nfs-common cifs-utils || true
          # S3FS
          sudo apt-get install -y s3fs || sudo apt-get install -y s3fs-fuse || true
          # Cloud clients
          install_awscli
          install_gcsfuse
          install_blobfuse2
          echo "[STORAGE] note: GitHub 호스티드 러너는 ephemeral VM입니다. 영구보관은 Artifacts/Cache/원격(S3 등)을 사용하세요."

      - name: 🔧 NIC 설치 + 커널 업그레이드(옵션)
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ github.event.inputs.install_nic_tools }}" = "true" ]; then
            sudo apt-get install -y ethtool net-tools iproute2 pciutils usbutils lshw bridge-utils vlan ifenslave iperf3 linux-firmware "linux-modules-extra-$(uname -r)" || true
            sudo modprobe 8021q || true
            sudo modprobe bonding || true
          fi
          if [ "${{ github.event.inputs.upgrade_kernel }}" = "true" ]; then
            if apt-cache policy linux-generic-hwe-24.04 | grep -q Candidate; then sudo apt-get install -y linux-generic-hwe-24.04
            elif apt-cache policy linux-generic-hwe-22.04 | grep -q Candidate; then sudo apt-get install -y linux-generic-hwe-22.04
            else sudo apt-get install -y linux-image-generic linux-headers-generic; fi
            uname -a | tee -a "${ECHO_LOG}/kernel_upgrade.log"
            echo "[KERNEL] kernel packages installed (reboot required)" | tee -a "${ECHO_LOG}/kernel_upgrade.log"
          fi

      - name: 🧾 장치 인벤토리(JSON) 생성
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${ECHO_NET}"
          NIC_JSON="$(ip -j link show 2>/dev/null || echo '[]')"
          OS_NAME="$(. /etc/os-release; echo "${NAME} ${VERSION_ID}")"
          # SLOTS_OMNI 비어있을 경우 1로 폴백
          SLOTS="${SLOTS_OMNI:-1}"
          jq -n \
            --arg kernel "$(uname -r)" \
            --arg uname "$(uname -a)" \
            --arg os "$OS_NAME" \
            --argjson nic "$NIC_JSON" \
            --argjson slots "$(jq -n --argjson omni ${SLOTS} '{omni:$omni}')" \
            '{ts: now|todate, kernel:$kernel, uname:$uname, os:$os, nic:$nic, slots:$slots}' > "${ECHO_NET}/device_info.json"

      - name: 🕸️ 컨테이너 네트워크 (Podman 기본)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y podman slirp4netns uidmap containernetworking-plugins || true
          podman network create "${DOCKER_NET}" >/dev/null 2>&1 || true

      - name: 🧱 TD-SIM(Postgres) 기동 + 스키마/시드
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "${ECHO_TD}/sql/td_sim/001_schema.sql" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS td;
          CREATE TABLE IF NOT EXISTS td.dim_customer( customer_id BIGSERIAL PRIMARY KEY, name VARCHAR(100) NOT NULL, email VARCHAR(200), created_ts TIMESTAMP DEFAULT NOW() );
          CREATE TABLE IF NOT EXISTS td.dim_account( account_id BIGSERIAL PRIMARY KEY, customer_id BIGINT NOT NULL REFERENCES td.dim_customer(customer_id), bank_code VARCHAR(10), currency CHAR(3) DEFAULT 'KRW', opened_ts TIMESTAMP DEFAULT NOW() );
          CREATE TABLE IF NOT EXISTS td.fact_transaction( txn_id BIGSERIAL PRIMARY KEY, account_id BIGINT NOT NULL REFERENCES td.dim_account(account_id), amount NUMERIC(18,2) NOT NULL, txn_type VARCHAR(16) CHECK (txn_type IN ('DEBIT','CREDIT')), txn_ts TIMESTAMP DEFAULT NOW() );
          CREATE TABLE IF NOT EXISTS td.echo_install_log( installed_at TIMESTAMP DEFAULT NOW(), component TEXT, detail TEXT );
          SQL
          echo "SELECT date_trunc('day', txn_ts) AS day, COUNT(*) AS txn_count, SUM(amount) AS total_amount FROM td.fact_transaction GROUP BY 1 ORDER BY 1 DESC;" > "${ECHO_DW}/queries/01_daily_volume.sql"
          cat > "${ECHO_DW}/queries/02_top_customers.sql" <<'SQL'
          SELECT c.customer_id, c.name, SUM(CASE WHEN f.txn_type='CREDIT' THEN f.amount ELSE -f.amount END) AS net_flow
          FROM td.fact_transaction f JOIN td.dim_account a ON a.account_id=f.account_id JOIN td.dim_customer c ON c.customer_id=a.customer_id
          GROUP BY 1,2 ORDER BY net_flow DESC LIMIT 20;
          SQL

          podman pull postgres:16
          podman rm -f td-sim >/dev/null 2>&1 || true
          podman run -d --name td-sim --network "${DOCKER_NET}" --replace \
            -e POSTGRES_PASSWORD=postgres -p 5432:5432 \
            -v "$PWD/${ECHO_TD}/sql/td_sim":/td:ro \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            postgres:16
          # readiness
          for i in $(seq 1 60); do podman exec td-sim pg_isready -U postgres >/dev/null 2>&1 && break; sleep 2; done
          podman exec -u postgres td-sim psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /td/001_schema.sql
          # seed
          COUNT=1000
          podman exec -u postgres td-sim bash -lc "psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO td.dim_customer(name,email) SELECT '고객'||i, 'user'||i||'@bank.local' FROM generate_series(1,10) AS s(i);
          INSERT INTO td.dim_account(customer_id, bank_code, currency)
          SELECT customer_id, CASE WHEN customer_id%5=0 THEN 'NH' WHEN customer_id%4=0 THEN 'KB' WHEN customer_id%3=0 THEN 'WR' WHEN customer_id%2=0 THEN 'HN' ELSE 'SH' END, 'KRW'
          FROM td.dim_customer;
          INSERT INTO td.fact_transaction(account_id, amount, txn_type, txn_ts)
          SELECT (SELECT account_id FROM td.dim_account ORDER BY random() LIMIT 1),
                 (random()*100000)::numeric(18,2),
                 CASE WHEN random() > 0.5 THEN 'CREDIT' ELSE 'DEBIT' END,
                 NOW() - (random()*interval '10 days')
          FROM generate_series(1, ${COUNT});
          SQL"

      - name: 🧩 Omni(FastAPI) 빌드 + 슬롯 수만큼 기동
        if: ${{ github.event.inputs.run_omni == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "${ECHO_OMNI}/app.py" <<'PY'
          import os
          from datetime import datetime
          from typing import List, Dict, Any
          import psycopg2
          from psycopg2.pool import SimpleConnectionPool
          from fastapi import FastAPI, HTTPException, Query
          from fastapi.responses import JSONResponse, Response
          from prometheus_client import Counter, generate_latest, CONTENT_TYPE_LATEST
          DB_HOST=os.getenv("DB_HOST","td-sim"); DB_PORT=int(os.getenv("DB_PORT","5432"))
          DB_NAME=os.getenv("DB_NAME","postgres"); DB_USER=os.getenv("DB_USER","postgres"); DB_PASS=os.getenv("DB_PASS","postgres")
          QUERIES_DIR=os.getenv("QUERIES_DIR","/queries"); SERVICE=os.getenv("SERVICE_NAME","omni")
          app=FastAPI(title="Omni Echo API (DW+Metrics+Slots)")
          pool=None
          REQ_COUNTER=Counter("omni_requests_total","HTTP requests",["path"])
          @app.on_event("startup")
          def _startup():
            global pool
            pool=SimpleConnectionPool(minconn=1,maxconn=8, host=DB_HOST,port=DB_PORT,dbname=DB_NAME,user=DB_USER,password=DB_PASS)
            with pool.getconn() as c:
              with c.cursor() as cur:
                cur.execute("""CREATE SCHEMA IF NOT EXISTS ledger;
                               CREATE TABLE IF NOT EXISTS ledger.service_event(
                                 id BIGSERIAL PRIMARY KEY, at TIMESTAMP DEFAULT NOW(),
                                 service TEXT, event TEXT, detail TEXT);
                               CREATE TABLE IF NOT EXISTS ledger.service_slot(
                                 service TEXT, slot_id INT, state TEXT DEFAULT 'ready',
                                 created_at TIMESTAMP DEFAULT NOW(),
                                 PRIMARY KEY(service,slot_id));
                            """)
                cur.execute("INSERT INTO ledger.service_event(service,event,detail) VALUES (%s,%s,%s)", (SERVICE,"startup","uvicorn up"))
                c.commit()
          @app.on_event("shutdown")
          def _shutdown():
            global pool
            if pool: pool.closeall()
          def run_sql_file(path:str)->List[Dict[str,Any]]:
            import os
            sql_path=os.path.join(QUERIES_DIR,path)
            if not os.path.isfile(sql_path): raise HTTPException(status_code=404, detail=f"SQL not found: {path}")
            with open(sql_path,"r",encoding="utf-8") as f: sql=f.read()
            try:
              conn=pool.getconn(); cur=conn.cursor(); cur.execute(sql)
              cols=[c[0] for c in cur.description]; rows=cur.fetchall()
              cur.close(); pool.putconn(conn)
              out=[]
              from decimal import Decimal
              for r in rows:
                item={}
                for k,v in zip(cols,r):
                  if isinstance(v, datetime): item[k]=v.isoformat()
                  elif isinstance(v, Decimal): item[k]=float(v)
                  else: item[k]=v
                out.append(item)
              return out
            except Exception as e:
              raise HTTPException(status_code=500, detail=str(e))
          @app.get("/health")
          def health(): REQ_COUNTER.labels("/health").inc(); return {"status":"ok","ts":datetime.utcnow().isoformat(),"svc":SERVICE}
          @app.get("/dw/daily-volume")
          def dw_daily_volume(): REQ_COUNTER.labels("/dw/daily-volume").inc(); return JSONResponse(run_sql_file("01_daily_volume.sql"), headers={"Cache-Control":"public, max-age=60"})
          @app.get("/dw/top-customers")
          def dw_top_customers(): REQ_COUNTER.labels("/dw/top-customers").inc(); return JSONResponse(run_sql_file("02_top_customers.sql"), headers={"Cache-Control":"public, max-age=60"})
          @app.get("/metrics")
          def metrics(): return Response(content=generate_latest(), media_type=CONTENT_TYPE_LATEST)
          @app.get("/slots")
          def list_slots():
            conn=pool.getconn(); cur=conn.cursor()
            cur.execute("SELECT service, slot_id, state, created_at FROM ledger.service_slot ORDER BY service, slot_id")
            rows=cur.fetchall(); cur.close(); pool.putconn(conn)
            return [{"service":r[0], "slot_id":r[1], "state":r[2], "created_at":r[3].isoformat()} for r in rows]
          @app.get("/slots/{service}/create")
          def create_slots(service:str, count:int=Query(1, ge=1, le=100)):
            conn=pool.getconn(); cur=conn.cursor()
            cur.execute("SELECT COALESCE(MAX(slot_id),0) FROM ledger.service_slot WHERE service=%s",(service,))
            base=cur.fetchone()[0]
            for i in range(1, count+1):
              cur.execute("INSERT INTO ledger.service_slot(service,slot_id,state) VALUES (%s,%s,%s) ON CONFLICT DO NOTHING",(service, base+i, "ready"))
            conn.commit(); cur.close(); pool.putconn(conn)
            return {"created":count, "service":service}
          PY
          cat > "${ECHO_OMNI}/Dockerfile" <<'DOCKER'
          FROM python:3.11-slim
          RUN apt-get update && apt-get install -y --no-install-recommends curl && rm -rf /var/lib/apt/lists/*
          RUN pip install --no-cache-dir fastapi uvicorn psycopg2-binary prometheus-client
          WORKDIR /app
          COPY app.py /app/app.py
          EXPOSE 8000
          ENV QUERIES_DIR=/queries DB_HOST=td-sim DB_PORT=5432 DB_NAME=postgres DB_USER=postgres DB_PASS=postgres
          HEALTHCHECK --interval=10s --timeout=3s --retries=5 CMD curl -fsS http://localhost:8000/health || exit 1
          CMD ["uvicorn","app:app","--host","0.0.0.0","--port","8000"]
          DOCKER

          podman pull python:3.11-slim
          podman build -t "${OMNI_IMAGE}:latest" "${ECHO_OMNI}"

          # 슬롯 기동
          SLOTS="${SLOTS_OMNI:-1}"
          for i in $(seq 1 "${SLOTS}"); do
            name="omni-$i"; podman rm -f "$name" >/dev/null 2>&1 || true
            if [ "$i" -eq 1 ]; then
              podman run -d --name "$name" --network "${DOCKER_NET}" --replace \
                -p 8090:8000 \
                -v "$PWD/${ECHO_DW}/queries":/queries:ro \
                -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
                -e SERVICE_NAME="$name" -e DB_HOST=td-sim -e DB_PORT=5432 -e DB_NAME=postgres -e DB_USER=postgres -e DB_PASS=postgres \
                "${OMNI_IMAGE}:latest"
            else
              podman run -d --name "$name" --network "${DOCKER_NET}" --replace \
                -v "$PWD/${ECHO_DW}/queries":/queries:ro \
                -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
                -e SERVICE_NAME="$name" -e DB_HOST=td-sim -e DB_PORT=5432 -e DB_NAME=postgres -e DB_USER=postgres -e DB_PASS=postgres \
                "${OMNI_IMAGE}:latest"
            fi
          done
          for i in $(seq 1 60); do curl -fsS http://localhost:8090/health >/dev/null 2>&1 && break; sleep 2; done
          echo "[OMNI] up (slots=${SLOTS})"

      - name: 🌐 Nginx RP(슬롯 라우팅) + Exporter
        if: ${{ github.event.inputs.run_network == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          podman pull nginx:alpine
          podman pull nginx/nginx-prometheus-exporter:0.11.0
          SLOTS="${SLOTS_OMNI:-1}"
          UPS=""; for i in $(seq 1 "${SLOTS}"); do UPS="${UPS}    server omni-${i}:8000;\n"; done
          cat > "${ECHO_NET}/nginx/nginx.conf" <<CONF
          user nginx; worker_processes auto;
          error_log /var/log/nginx/error.log warn; pid /var/run/nginx.pid;
          events { worker_connections 1024; }
          http {
            log_format echo '\$remote_addr - \$remote_user [\$time_local] "\$request" \$status \$body_bytes_sent "\$http_referer" "\$http_user_agent" rt=\$request_time';
            access_log /var/log/nginx/echo.access.log echo;
            limit_req_zone \$binary_remote_addr zone=req_zone:10m rate=5r/s;
            limit_conn_zone \$binary_remote_addr zone=conn_zone:10m;
            map \$request_method \$is_options { default 0; OPTIONS 1; }
            upstream omni_upstream { least_conn;
          ${UPS} }
            server {
              listen 80;
              location = /health { return 200 "OK"; add_header Content-Type text/plain; }
              location = /nginx_status { stub_status; allow all; }
              location ~* \.(env|git|ht) { deny all; }
              set \$CORS "*";
              location /api/ {
                limit_req zone=req_zone burst=20 nodelay; limit_conn conn_zone 100;
                if (\$is_options) { add_header Access-Control-Allow-Origin \$CORS always; add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always; add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always; add_header Access-Control-Max-Age 86400 always; return 204; }
                add_header Access-Control-Allow-Origin \$CORS always; add_header Access-Control-Allow-Credentials "true" always;
                proxy_pass http://omni_upstream/; proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr; proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto \$scheme;
              }
              location /dw/ {
                limit_req zone=req_zone burst=20 nodelay;
                if (\$is_options) { add_header Access-Control-Allow-Origin \$CORS always; add_header Access-Control-Allow-Methods "GET,POST,OPTIONS" always; add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always; add_header Access-Control-Max-Age 86400 always; return 204; }
                add_header Access-Control-Allow-Origin \$CORS always; add_header Access-Control-Allow-Credentials "true" always; add_header Cache-Control "public, max-age=60";
                proxy_pass http://omni_upstream/dw/; proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr; proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto \$scheme;
              }
              location = / { add_header Content-Type text/plain; return 200 "OmniChannel Gateway (slots=${SLOTS})"; }
            }
          }
          CONF
          podman rm -f echo-nginx >/dev/null 2>&1 || true
          podman run -d --name echo-nginx --network "${DOCKER_NET}" --replace \
            -p 8088:80 \
            -v "$PWD/${ECHO_NET}/nginx/nginx.conf":/etc/nginx/nginx.conf:ro \
            -v "$PWD/${ECHO_NET}/logs":/var/log/nginx \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            nginx:alpine
          podman rm -f nginx-exp >/dev/null 2>&1 || true
          podman run -d --name nginx-exp --network "${DOCKER_NET}" --replace \
            -p 9113:9113 \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            nginx/nginx-prometheus-exporter:0.11.0 -nginx.scrape-uri=http://echo-nginx/nginx_status

      - name: 📈 Logs (Loki/Promtail via journald) — heredoc fix
        shell: bash
        run: |
          set -Eeuo pipefail
          podman pull grafana/loki:2.9.0
          podman pull grafana/promtail:2.9.0
          podman rm -f loki >/dev/null 2>&1 || true
          podman run -d --name loki --network "${DOCKER_NET}" --replace \
            -p 3100:3100 \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            grafana/loki:2.9.0 -config.file=/etc/loki/local-config.yaml

          cat > "${ECHO_NET}/promtail/config.yml" <<'YAML'
          server:
            http_listen_port: 9080
            grpc_listen_port: 0
          positions:
            filename: /tmp/positions.yaml
          clients:
            - url: http://loki:3100/loki/api/v1/push
          scrape_configs:
            - job_name: journal
              journal:
                json: true
                path: /var/log/journal
                max_age: 12h
              relabel_configs:
                - source_labels: ['__journal__SYSTEMD_UNIT']
                  target_label: systemd_unit
          YAML

          podman rm -f promtail >/dev/null 2>&1 || true
          podman run -d --name promtail --network "${DOCKER_NET}" --replace \
            -v /var/log/journal:/var/log/journal:ro \
            -v /run/log/journal:/run/log/journal:ro \
            -v "$PWD/${ECHO_NET}/promtail/config.yml":/etc/promtail/config.yml:ro \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            grafana/promtail:2.9.0 -config.file=/etc/promtail/config.yml

      - name: 📊 Prometheus & Alertmanager
        shell: bash
        run: |
          set -Eeuo pipefail
          SLOTS="${SLOTS_OMNI:-1}"
          OMNI_TARGETS=""
          for i in $(seq 1 "${SLOTS}"); do [ -n "$OMNI_TARGETS" ] && OMNI_TARGETS="${OMNI_TARGETS}, "; OMNI_TARGETS="${OMNI_TARGETS}'omni-${i}:8000'"; done
          cat > "${ECHO_NET}/prometheus/recording_rules.yml" <<'YAML'
          groups:
            - name: omni.rules
              interval: 30s
              rules:
                - record: omni_requests_rate_5m
                  expr: rate(omni_requests_total[5m])
          YAML
          cat > "${ECHO_NET}/prometheus/alert_rules.yml" <<'YAML'
          groups:
            - name: omni.alerts
              rules:
                - alert: OmniDown
                  expr: up{job="omni"} == 0
                  for: 1m
                  labels: { severity: critical }
                  annotations: { summary: "Omni target is down" }
                - alert: NginxExporterDown
                  expr: up{job="nginx-exp"} == 0
                  for: 2m
                  labels: { severity: warning }
                  annotations: { summary: "Nginx exporter is down" }
          YAML
          cat > "${ECHO_NET}/prometheus/prometheus.yml" <<YAML
          global: { scrape_interval: 15s, evaluation_interval: 30s }
          rule_files: [ /etc/prometheus/recording_rules.yml, /etc/prometheus/alert_rules.yml ]
          alerting: { alertmanagers: [ { static_configs: [ { targets: ["alertmanager:9093"] } ] } ] }
          scrape_configs:
            - job_name: omni
              metrics_path: /metrics
              static_configs: [ { targets: [ ${OMNI_TARGETS} ] } ]
            - job_name: nginx-exp
              metrics_path: /metrics
              static_configs: [ { targets: ['nginx-exp:9113'] } ]
            - job_name: loki
              metrics_path: /metrics
              static_configs: [ { targets: ['loki:3100'] } ]
          YAML

          podman pull prom/alertmanager
          podman pull prom/prometheus:v2.51.2
          podman rm -f alertmanager prometheus >/dev/null 2>&1 || true
          podman run -d --name alertmanager --network "${DOCKER_NET}" --replace -p 9093:9093 prom/alertmanager
          podman run -d --name prometheus --network "${DOCKER_NET}" --replace -p 9090:9090 \
            -v "$PWD/${ECHO_NET}/prometheus/prometheus.yml":/etc/prometheus/prometheus.yml:ro \
            -v "$PWD/${ECHO_NET}/prometheus/recording_rules.yml":/etc/prometheus/recording_rules.yml:ro \
            -v "$PWD/${ECHO_NET}/prometheus/alert_rules.yml":/etc/prometheus/alert_rules.yml:ro \
            prom/prometheus:v2.51.2 --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=1d --web.enable-lifecycle

      - name: 🔐 (옵션) Cosign 설치
        if: ${{ github.event.inputs.push_image == 'true' }}
        uses: sigstore/cosign-installer@v3

      - name: 🏷️ (옵션) GHCR Push + Digest Sign/Attest (robust)
        if: ${{ github.event.inputs.push_image == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"
          COSIGN_YES: "true"
        run: |
          set -Eeuo pipefail
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_OWNER}/${OMNI_IMAGE}:latest"
          echo "${GITHUB_TOKEN}" | podman login "${IMAGE_REGISTRY}" -u "${{ github.actor }}" --password-stdin
          podman tag "${OMNI_IMAGE}:latest" "${IMAGE}"
          podman push "${IMAGE}"
          sudo apt-get install -y skopeo || true
          DIGEST=""
          for i in $(seq 1 12); do
            set +e
            DIGEST="$(skopeo inspect --creds "${{ github.actor }}:${GITHUB_TOKEN}" docker://${IMAGE} --format '{{.Digest}}' 2>/dev/null)"
            RC=$?; set -e
            [ $RC -eq 0 ] && [ -n "$DIGEST" ] && break
            echo "[INFO] waiting GHCR indexing... ($i)"; sleep 5
          done
          [ -n "$DIGEST" ] || { echo "[FAIL] cannot resolve digest for ${IMAGE}"; exit 1; }
          SIGN_TARGET="${IMAGE_REGISTRY}/${IMAGE_OWNER}/${OMNI_IMAGE}@${DIGEST}"
          echo "[INFO] SIGN_TARGET=${SIGN_TARGET}"
          mkdir -p "${PROV_DIR}/supplychain"
          echo '{"buildType":"github-actions","builder":"echo-ops"}' > "${PROV_DIR}/supplychain/provenance.json"
          ok=0
          for i in 1 2 3; do
            if cosign sign "${SIGN_TARGET}" && cosign attest --predicate "${PROV_DIR}/supplychain/provenance.json" --type slsaprovenance "${SIGN_TARGET}"; then ok=1; break; fi
            echo "[WARN] cosign attempt #$i failed; retrying..."; sleep 5
          done
          [ "$ok" = "1" ] || { echo "[FAIL] cosign sign/attest failed"; exit 1; }
          {
            echo "IMAGE=${IMAGE}"
            echo "SIGN_TARGET=${SIGN_TARGET}"
            echo "PUSHED_AT=$(date -Iseconds)"
          } | tee "${PROV_DIR}/PROVENANCE.txt" "${ECHO_LOG}/provenance.log"

      - name: 🗃️ Snapshot(SQLite) + 권한 정리
        shell: bash
        run: |
          set -Eeuo pipefail
          DB="${ECHO_DW}/db/echo_install.db"
          sudo apt-get install -y sqlite3 || true
          sqlite3 "${DB}" <<SQL
          CREATE TABLE IF NOT EXISTS echo_install_log(
            id INTEGER PRIMARY KEY AUTOINCREMENT, installed_at TEXT DEFAULT (datetime('now')), component TEXT, detail TEXT
          );
          INSERT INTO echo_install_log(component,detail) VALUES
            ('engine','podman+net=${DOCKER_NET}'),
            ('td-sim','postgres:16 schema+seed'),
            ('omni','slots=${SLOTS_OMNI}'),
            ('nginx','rp+cors+ratelimit+waf+exporter'),
            ('logs','loki+promtail(journald)'),
            ('prom','prometheus+alertmanager'),
            ('storage','awscli/gcsfuse/blobfuse2+s3fs robust installers'),
            ('nic','install=${{ github.event.inputs.install_nic_tools }}'),
            ('kernel','upgrade=${{ github.event.inputs.upgrade_kernel }}');
          SQL
          sudo chown -R "$USER":"$USER" .github/echo_* || true
          chmod -R a+rX .github/echo_* || true

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-bundle
          path: |
            .github/echo_td
            .github/echo_dw
            .github/echo_net
            .github/echo_omni
            .github/echo_logs

      - name: 🧾 Commit & push (옵션)
        if: ${{ github.event.inputs.commit_changes == 'true' }}
        shell: bash
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config user.name "echo-bot"
          git config user.email "echo-bot@users.noreply.github.com"
          git add .github/echo_td .github/echo_dw .github/echo_net .github/echo_omni .github/echo_logs || true
          if git diff --cached --quiet; then echo "[GIT] no changes"; exit 0; fi
          git commit -m "EchoOps v8.1: Storage robust installers + journald logs + slots=${SLOTS_OMNI}"
          if [ -n "${GH_ADMIN_TOKEN:-}" ]; then
            git push "https://${GH_ADMIN_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
          else
            echo "[WARN] GH_ADMIN_TOKEN missing; skip push"
          fi
