name: 🛡️ Echo 기반 보안 자동화 + Scorecard 통합

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '23 2 * * 0'
  workflow_dispatch:

jobs:
  echo-security:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Echo 디렉토리/파일/템플릿 초기화
        run: |
          mkdir -p .github/echo/init
          echo "echo '[❄ Init] Echo directory structure'" | tee -a .github/echo/init/init_dirs.sh

          for base in scorecard template placeholder fix cli; do
            for sub in logs scripts test init converted; do
              echo "echo 'mkdir -p .github/echo_${base}/${sub}'" | tee -a .github/echo/init/init_dirs.sh
              mkdir -p ".github/echo_${base}/${sub}"
            done
            echo "echo '[INFO] Initialized .github/echo_${base}/'" | tee -a .github/echo/init/init_dirs.sh
            touch ".github/echo_${base}/init/created.flag"
          done

          echo "API_KEY=PLACEHOLDER" > .github/echo_template/sample.env
          echo "TOKEN=PLACEHOLDER" > .github/echo_template/sample.cfg
          echo '{ "secret": "PLACEHOLDER" }' > .github/echo_template/sample.json

      - name: 🛠️ OSSF Scorecard CLI 설치 (tar.gz)
        run: |
          VERSION="4.10.3"
          curl -sLO https://github.com/ossf/scorecard/releases/download/v${VERSION}/scorecard_${VERSION}_linux_amd64.tar.gz
          tar -xzf scorecard_${VERSION}_linux_amd64.tar.gz
          BIN=$(find . -type f -name scorecard | head -1)
          chmod +x "$BIN"
          sudo mv "$BIN" /usr/local/bin/scorecard
          scorecard --version | tee .github/echo_scorecard/logs/version.txt
          echo "echo 'scorecard CLI 설치 완료'" | tee -a .github/echo_cli/logs/install.log

      - name: 🔍 OSSF Scorecard 분석 실행
        run: |
          scorecard --repo=https://github.com/${{ github.repository }} --format=json --show-details > scorecard.json
          mkdir -p .github/echo_scorecard/results
          cp scorecard.json .github/echo_scorecard/results/

      - name: 🧼 PLACEHOLDER 자동 치환 (.env/.cfg/.json)
        run: |
          mkdir -p .github/echo_placeholder/converted
          for f in .github/echo_template/*; do
            fname=$(basename "$f")
            sed 's/PLACEHOLDER/REPLACED_VALUE/g' "$f" > ".github/echo_placeholder/converted/$fname"
            echo "echo '[REPLACED] $fname'" | tee -a ".github/echo_placeholder/logs/replace.log"
          done

      - name: 📦 Upload Echo 결과 아티팩트
        uses: actions/upload-artifact@v4
        with:
          name: echo-artifacts
          path: |
            .github/echo_*/**/*
            scorecard.json
