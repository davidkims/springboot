name: 🧩 Backup + API Speed Check with Gitignore Auto-Fix & Retry

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  security-events: write

jobs:
  backup-and-api-check:
    runs-on: ubuntu-latest
    env:
      MAX_LATENCY_MS: 1000
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔒 Docker Login (for private registry)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io                    # or your private registry host
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Start validation-collector container
        run: |
          echo "[🚀] Pulling validation-collector image..."
          docker pull myorg/validation-collector:latest \
            || echo "[⚠️] Could not pull validation-collector; skipping startup."
          if docker images | grep -q 'myorg/validation-collector'; then
            docker run -d --label c06bda -p 8080:80 myorg/validation-collector:latest
            echo "[✅] validation-collector running on http://localhost:8080"
          else
            echo "[⚠️] validation-collector not available; SARIF upload will be skipped."
          fi

      - name: 🧰 Install GitHub CLI (gh)
        run: |
          echo "[🧰] Installing GitHub CLI..."
          sudo apt-get update && sudo apt-get install -y gh
          gh --version
          echo "[✅] GitHub CLI installed."

      - name: ⏹️ Cancel long-running 포트폴리오 생성 워크플로우
        run: |
          echo "[⏹️] 이전 포트폴리오 생성 워크플로우 중단 시도..."
          for ID in $(gh run list --workflow="generate_full_readme.yml" --json databaseId,status \
            -q '.[] | select(.status=="in_progress" or .status=="queued") | .databaseId'); do
            echo "[🛑] Cancelling run ID $ID"
            gh run cancel $ID || echo "[⚠️] Cancel failed for $ID"
          done
          echo "[✅] 포트폴리오 생성 워크플로우 중단 완료."

      - name: 📁 Prepare Directories with Permissions
        run: |
          echo "[📁] Creating backup and result directories..."
          mkdir -p .github/backup/workflows site/api_check
          chmod -R 755 .github/backup site/api_check
          echo "[✅] Directories created and permissions set."

      - name: 🧼 Ensure .gitignore Exists with Permissions
        run: |
          echo "[🧼] Ensuring .gitignore exists and includes required exceptions..."
          touch .gitignore && chmod 644 .gitignore
          ensure_entry(){ grep -qxF "$1" .gitignore || echo "$1" >> .gitignore; }
          ensure_entry '!.github/'
          ensure_entry '!.github/workflows/'
          ensure_entry '!.github/workflows/*.d/'
          ensure_entry '!.github/workflows/*.d/**'
          sort .gitignore | uniq > .gitignore.tmp && mv .gitignore.tmp .gitignore
          echo "[✅] Final .gitignore:"
          cat .gitignore

      - name: 📝 Backup and Create Per-Workflow Directories
        run: |
          echo "[📝] Backing up workflows..."
          for f in .github/workflows/*.{yml,yaml}; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            name="${base%.*}"
            dir=".github/workflows/${name}.d"
            echo "[📄] $base → $dir"
            mkdir -p "$dir"
            echo "" > "$dir/.gitkeep"
            chmod 755 "$dir"
            cp "$f" "$dir/$base"
            chmod 644 "$dir/$base"
            cp "$f" .github/backup/workflows/
            chmod 644 .github/backup/workflows/"$base"
          done
          echo "[✅] Backup complete."

      - name: 📅 Commit Backups If Changed
        run: |
          echo "[📅] Staging changes..."
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f .github/backup/workflows
          git add -f .github/workflows/*.d/** || echo "[⚠️] .d/ dirs may be ignored"
          git add .gitignore
          if git diff --cached --quiet; then
            echo "[ℹ️] No changes to commit."
          else
            git commit -m "📦 Auto-backup of workflows"
            echo "[✅] Commit done."
          fi

      - name: 🚦 Check Latency of All Extracted URLs
        run: |
          echo "[⚙️] Extracting URLs..."
          for wf in .github/workflows/*.{yml,yaml}; do
            [ -f "$wf" ] || continue
            id=$(basename "$wf" | sed 's/\.[^.]*$//')
            out="site/api_check/${id}.json"
            echo "[" > "$out"
            urls=$(grep -Eo 'https?://[^ )"]+' "$wf" | sort -u)
            i=0; total=$(echo "$urls" | wc -l)
            for url in $urls; do
              if echo "$url" | grep -qE '\$\{|\$\(|localhost|127\.0\.0\.1'; then
                echo "⏭️ Skipping $url"
                continue
              fi
              echo "🌐 Checking $url..."
              start=$(date +%s%3N)
              status=$(curl -o /dev/null -s -w "%{http_code}" "$url" || echo "000")
              latency=$(( $(date +%s%3N) - start ))
              echo "  {" >> "$out"
              echo "    \"url\": \"$url\"," >> "$out"
              echo "    \"status\": \"$status\"," >> "$out"
              echo "    \"latency_ms\": $latency" >> "$out"
              if [ $((++i)) -lt $total ]; then echo "  }," >> "$out"; else echo "  }" >> "$out"; fi
            done
            echo "]" >> "$out"
            echo "✅ Saved $out"
          done

      - name: 💾 Upload All API Results
        uses: actions/upload-artifact@v4
        with:
          name: all-api-speed-results
          path: site/api_check/

      - name: 📊 Print Result Preview
        run: |
          echo "[📊] Sample:"
          head -n50 site/api_check/*.json || echo "[ℹ️] No results."

      - name: 🧾 Generate .echo.sh for All API Results
        run: |
          echo "[🧾] Generating echo.sh..."
          out="site/api_check/echo.sh"
          ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "#!/bin/bash" > "$out"
          echo "# Generated: $ts" >> "$out"
          echo "echo \"[🌐] Replaying logs...\"" >> "$out"
          for f in site/api_check/*.json; do
            [ -f "$f" ] || continue
            echo "echo \"[📄] $(basename "$f")\"" >> "$out"
            jq -c '.[]' "$f" | while read -r item; do
              url=$(echo "$item" | jq -r '.url')
              st=$(echo "$item" | jq -r '.status')
              lt=$(echo "$item" | jq -r '.latency_ms')
              echo "echo \"URL: $url | Status: $st | Latency: ${lt}ms\"" >> "$out"
            done
          done
          chmod +x "$out"
          echo "[✅] echo.sh at $out"

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@v2

      - name: 🔍 Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: 🔍 CodeQL Analyze
        id: codeql
        uses: github/codeql-action/analyze@v2

      - name: 📤 Upload SARIF to Collector
        run: |
          echo "[📤] Uploading SARIF..."
          sarif=$(find . -name '*.sarif' | head -n1)
          curl -X POST http://localhost:8080/upload \
            -H "Content-Type: application/sarif+json" \
            --data-binary @"$sarif" \
            || echo "[⚠️] SARIF upload failed"

      - name: 🔁 Retry on Failure (Max 1)
        if: failure() && github.run_attempt == 1
        run: |
          echo "[🔁] Workflow failed. Retrying…"
          gh workflow run "${{ github.workflow }}" -r "${{ github.ref_name }}"
