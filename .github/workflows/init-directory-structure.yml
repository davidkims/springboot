name: 🚀 Init Directory Structure

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/init-directory-structure.yml"

permissions:
  contents: write

jobs:
  setup-directories:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧱 Create Required Directory Structure
        run: |
          echo "[+] Creating .github directories"
          mkdir -p .github/workflows
          mkdir -p .github/scripts
          mkdir -p .github/logs
          mkdir -p .github/global
          mkdir -p .github/provenance
          mkdir -p .github/artifacts

          echo "[+] Creating disk structure"
          mkdir -p disk/slot-001
          mkdir -p disk/slot-002
          mkdir -p disk/slot-logs
          mkdir -p disk/artifacts
          mkdir -p disk/ledger
          mkdir -p disk/backup

          echo "[+] Creating data directories"
          mkdir -p data
          mkdir -p data/transactions
          mkdir -p data/provenance

          echo "[+] Creating site and output directories"
          mkdir -p site
          mkdir -p output

          echo "[+] Creating Docker-specific directories"
          mkdir -p docker/mysql
          mkdir -p docker/postgres
          mkdir -p docker/logs

          echo "[✔] All required directories have been created"

      - name: 📂 Show Created Directories
        run: |
          echo "[+] Listing created top-level directories"
          ls -R .github
          ls -R disk
          ls -R data
          ls -R docker
          ls -R site
