name: 📁 Auto Create Slot & .github Expansion

on:
  schedule:
    - cron: '*/1 * * * *'  # 매 1분마다 실행
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-generate-slot:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Git 설정
        run: |
          echo "[🔧] Git 설정 중..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 🧮 슬롯 번호 자동 계산
        id: detect
        run: |
          echo "[🧮] 기존 슬롯 확인 중..."
          mkdir -p disk
          EXISTING=$(find disk -maxdepth 1 -type d -name 'slot-*' | sed 's|.*/slot-||' | sort -n)
          echo "$EXISTING" | sed 's/^/[📁] 기존 슬롯: slot-/'

          LAST_SLOT=$(echo "$EXISTING" | sort -n | tail -n 1)
          if [ -z "$LAST_SLOT" ]; then
            NEXT_SLOT=001
          else
            NEXT_SLOT=$(printf "%03d" $((10#$LAST_SLOT + 1)))
          fi
          echo "[➡️] 다음 슬롯: slot-$NEXT_SLOT"
          echo "next_slot=slot-${NEXT_SLOT}" >> $GITHUB_OUTPUT

      - name: 🕓 브랜치 이름 생성 (타임스탬프)
        id: timestamp
        run: |
          BRANCH_NAME="slot-update-$(date +'%Y%m%d-%H%M%S')"
          echo "[🌿] 브랜치 이름: $BRANCH_NAME"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: 📁 슬롯 디렉토리 및 echo 파일 생성
        run: |
          SLOT_NAME=${{ steps.detect.outputs.next_slot }}
          SLOT_DIR="disk/$SLOT_NAME"

          echo "[📁] 디렉토리 생성: $SLOT_DIR"
          mkdir -p "$SLOT_DIR"

          echo "# $SLOT_NAME" > "$SLOT_DIR/README.md"
          echo "Slot: $SLOT_NAME" > "$SLOT_DIR/slot-info.txt"
          echo "Created: $(date -u)" >> "$SLOT_DIR/slot-info.txt"
          echo "[✔] 슬롯 생성 완료"

      - name: 🔗 심볼릭 링크 최신화
        run: |
          SLOT_NAME=${{ steps.detect.outputs.next_slot }}
          echo "[🔗] slot-latest → $SLOT_NAME 설정"
          rm -rf disk/slot-latest
          ln -s $SLOT_NAME disk/slot-latest
          ls -l disk/

      - name: 🗂 .github 디렉토리 자동 생성 및 echo 파일 추가
        run: |
          echo "[🗂] .github 디렉토리 자동 생성 중..."
          mkdir -p .github/slots
          echo "Last created slot: ${{ steps.detect.outputs.next_slot }}" > .github/slots/last_slot.txt
          echo "Generated at: $(date -u)" >> .github/slots/last_slot.txt
          echo "[✔] .github/slots/last_slot.txt 생성 완료"
          cat .github/slots/last_slot.txt

      - name: 🔀 Pull Request 생성 (Token 없이)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🔁 Add ${{ steps.detect.outputs.next_slot }} + .github update"
          branch: ${{ steps.timestamp.outputs.branch }}
          title: "🔁 Auto create ${{ steps.detect.outputs.next_slot }} and update .github"
          body: |
            This PR includes:
            - Auto-created `${{ steps.detect.outputs.next_slot }}`
            - Symbolic link `disk/slot-latest` updated
            - `.github/slots/last_slot.txt` generated with timestamp
          delete-branch: true
