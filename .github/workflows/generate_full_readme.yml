name: 🧾 Update README with Portfolio and Workflows

on:
  schedule:
    - cron: '0 * * * *' # 매 시간 정각 (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_readme:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📁 Read Workflow Files
        id: workflows
        run: |
          echo "[📄] 워크플로우 파일 목록 수집 중..."
          mkdir -p .tmp
          WORKFLOW_LIST=".tmp/workflows.md"
          echo "## ⚙️ GitHub Actions 워크플로우 목록" > $WORKFLOW_LIST
          echo "" >> $WORKFLOW_LIST

          for file in .github/workflows/*.yml; do
            echo "[🔍] 처리 중: $file"
            NAME=$(grep '^name:' "$file" | head -n1 | cut -d ':' -f2- | xargs)
            DESC=$(grep '# ' "$file" | head -n1 | sed 's/# //')
            echo "- **${NAME}**: ${DESC}" >> $WORKFLOW_LIST
          done

          cat $WORKFLOW_LIST

      - name: 🧾 Generate README.md
        run: |
          echo "[🛠️] README.md 생성 중..."

          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S KST')
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"

          {
            echo "# 👨‍💻 김병권 포트폴리오"
            echo ""
            echo "이 리포지토리는 GitHub Actions를 사용하여 자동으로 관리되는 프로젝트입니다."
            echo "매 시간마다 이 README는 자동으로 갱신되며 최신 정보를 반영합니다."
            echo ""
            echo "## 🧑‍💻 개발자 소개"
            echo "- 이름: 김병권"
            echo "- 전문 분야: 백엔드 개발, GitHub Actions 자동화, 보안 자동화, DevOps"
            echo "- 기술 스택: Python, Java, Spring Boot, FastAPI, Docker, GitHub Actions, PostgreSQL, MySQL"
            echo "- 이메일: your-email@example.com"
            echo ""
            echo "## 🛠️ 주요 개발 스킬"
            echo "- CI/CD 자동화 (GitHub Actions)"
            echo "- 백엔드 REST API 설계 및 배포"
            echo "- 보안 점검 자동화 (CodeQL, Scorecard, Bandit, pip-audit 등)"
            echo "- 로그/백업 자동화 및 스케줄링"
            echo "- 데이터베이스 마이그레이션 및 백업 관리"
            echo ""
            echo "## 📅 마지막 업데이트"
            echo "- ${TIMESTAMP}"
            echo ""
            echo "## ✅ 현재 브랜치"
            echo "- ${BRANCH}"
            echo ""
            echo "## 🔧 빌드 상태 배지"
            echo "![Build Status](https://github.com/${REPO}/actions/workflows/update-readme.yml/badge.svg)"
            echo ""
            cat .tmp/workflows.md
          } > README.md

          echo "[✅] README.md 생성 완료"

      - name: 📤 Commit & Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --exit-code --quiet README.md; then
            echo "[⏭️] 변경사항 없음 - 커밋 건너뜀"
          else
            echo "[✅] 변경사항 있음 - 커밋 & 푸시"
            git add README.md
            git commit -m "Docs: Auto-update README with portfolio and workflows [skip ci]"
            git push
          fi
