name: Oracle Finance Setup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # 매시간 정각(UTC)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v5

      - name: 🚀 Start Oracle XE container
        shell: bash
        run: |
          set -euo pipefail
          echo "[🚀] Starting Oracle XE container"
          # 컨테이너가 이미 있다면 정리
          docker rm -f oracle-xe >/dev/null 2>&1 || true
          docker run -d --name oracle-xe -p 1521:1521 \
            -e ORACLE_PASSWORD=oracle \
            gvenzl/oracle-xe:21-full

          echo "[⏳] Waiting for database to be ready..."
          # 최대 10분(120 * 5초) 대기
          for i in $(seq 1 120); do
            sleep 5
            if docker logs oracle-xe 2>&1 | grep -Eq "DATABASE IS READY|DATABASE IS READY TO USE"; then
              echo "[✅] Oracle is ready"
              break
            fi
            if (( i % 12 == 0 )); then
              echo "[…] still waiting ($((i*5))s)"
            fi
            if (( i == 120 )); then
              echo "[❌] Timeout waiting for Oracle to be ready" >&2
              docker logs oracle-xe | tail -n 200 || true
              exit 1
            fi
          done

      - name: 🧱 Create finance schema & transactions table
        shell: bash
        run: |
          set -euo pipefail
          echo "[📦] Preparing SQL inside container"

          # 컨테이너 내부에 SQL 파일 생성 후 실행 (heredoc 안전 적용)
          docker exec oracle-xe bash -lc 'cat > /tmp/setup_finance.sql <<SQL
          WHENEVER SQLERROR EXIT SQL.SQLCODE
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 VERIFY OFF ECHO ON

          -- finance 유저가 없으면 생성
          DECLARE
            n NUMBER := 0;
          BEGIN
            SELECT COUNT(*) INTO n FROM dba_users WHERE username = '\''FINANCE'\'';
            IF n = 0 THEN
              EXECUTE IMMEDIATE '\''CREATE USER finance IDENTIFIED BY finance'\'';
              EXECUTE IMMEDIATE '\''GRANT CONNECT, RESOURCE TO finance'\'';
              EXECUTE IMMEDIATE '\''ALTER USER finance QUOTA UNLIMITED ON USERS'\'';
            END IF;
          END;
          /
          -- transactions 테이블 생성 (존재 시 ORA-00955 무시)
          BEGIN
            EXECUTE IMMEDIATE q'[
              CREATE TABLE finance.transactions (
                id        NUMBER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                amount    NUMBER(15,2) NOT NULL,
                currency  VARCHAR2(3)  NOT NULL,
                status    VARCHAR2(20) NOT NULL,
                created_at TIMESTAMP DEFAULT SYSTIMESTAMP
              )
            ]';
          EXCEPTION
            WHEN OTHERS THEN
              IF SQLCODE != -955 THEN -- name is already used by an existing object
                RAISE;
              END IF;
          END;
          /
          -- 인덱스 예시 (이미 있으면 무시)
          BEGIN
            EXECUTE IMMEDIATE '\''CREATE INDEX finance.idx_transactions_status ON finance.transactions(status)'\''; 
          EXCEPTION WHEN OTHERS THEN IF SQLCODE != -955 THEN RAISE; END IF; END;
          /
          -- 샘플 데이터 (비어있을 때만)
          DECLARE
            n NUMBER := 0;
          BEGIN
            SELECT COUNT(*) INTO n FROM finance.transactions;
            IF n = 0 THEN
              INSERT INTO finance.transactions(amount, currency, status) VALUES(1000.00, '\''USD'\'', '\''PENDING'\'');
              INSERT INTO finance.transactions(amount, currency, status) VALUES(250.50,  '\''EUR'\'', '\''COMPLETED'\'');
              COMMIT;
            END IF;
          END;
          /
          EXIT;
          SQL
          sqlplus -s system/oracle@XEPDB1 @/tmp/setup_finance.sql'

          echo "[✅] Schema/table ensured"

      - name: 🔎 Smoke test (query count)
        shell: bash
        run: |
          set -euo pipefail
          echo "[🔎] Counting rows in finance.transactions"
          docker exec oracle-xe bash -lc 'cat > /tmp/smoke.sql <<SQL
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 VERIFY OFF ECHO OFF
          SELECT '\''rows='\'' || COUNT(*) FROM finance.transactions;
          EXIT;
          SQL
          sqlplus -s system/oracle@XEPDB1 @/tmp/smoke.sql' | sed 's/^/[DB]/'

      - name: 🧹 Clean up
        if: always()
        shell: bash
        run: |
          echo "[🧹] Cleaning up container"
          docker rm -f oracle-xe >/dev/null 2>&1 || true
          echo "[✅] Done"
