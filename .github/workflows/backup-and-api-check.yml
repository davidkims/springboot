name: "CodeQL CLI Auto Setup + 분석 Safe Workflow"

on:
  workflow_dispatch:

jobs:
  codeql-custom:
    runs-on: ubuntu-latest
    steps:
      - name: "[0] 필수 유틸리티 설치 (coreutils 등)"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y coreutils findutils grep sed gawk tree bash dash util-linux curl tar

      - name: "[1] Checkout"
        uses: actions/checkout@v4

      - name: "[2] CodeQL CLI 최신버전 다운로드 및 설치"
        id: setup_codeql
        run: |
          set -e
          # 최신 릴리즈 버전 확인 및 다운로드
          CODEQL_VERSION=$(curl -s https://api.github.com/repos/github/codeql-cli-binaries/releases/latest | grep tag_name | cut -d '"' -f4)
          CODEQL_URL="https://github.com/github/codeql-cli-binaries/releases/download/$CODEQL_VERSION/codeql-linux64.zip"
          echo "[🛠️] CodeQL CLI 다운로드: $CODEQL_URL"
          mkdir -p $HOME/codeql
          cd $HOME/codeql
          curl -LO $CODEQL_URL
          unzip -o codeql-linux64.zip
          echo "$HOME/codeql/codeql" >> $GITHUB_PATH
          export PATH="$HOME/codeql/codeql:$PATH"
          cd -
        shell: bash

      - name: "[3] Build Tool 및 빌드 환경 준비"
        run: |
          set +e
          export PATH="$HOME/codeql/codeql:/usr/bin:/bin:/usr/local/bin:$PATH"
          echo '[📂] 디렉토리 생성: .github/codeql-out, .github/log, .echo.*.sh ...'
          mkdir -p .github/codeql-out .github/log
          touch .github/codeql-out/.keep .github/log/.keep .echo.00_dir.sh
          sudo apt-get update -y || true
          sudo apt-get upgrade -y || true
          sudo apt-get dist-upgrade -y || true
          sudo apt-get autoremove -y || true
          PKGS=""
          [ -f pom.xml ] && PKGS="$PKGS maven"
          ([ -f build.gradle ] || [ -f build.gradle.kts ]) && PKGS="$PKGS gradle"
          ls **/*.py 2>/dev/null | grep -q . && PKGS="$PKGS python3-pip python3-venv"
          [ -f package.json ] && PKGS="$PKGS nodejs npm"
          [ -f main.go ] && PKGS="$PKGS golang"
          [ -f Gemfile ] && PKGS="$PKGS ruby-full"
          [ -f Cargo.toml ] && PKGS="$PKGS cargo"
          [ -n "$PKGS" ] && (echo "[🛠️] build tool 설치/업그레이드: $PKGS"; sudo apt-get install --only-upgrade -y $PKGS || true; sudo apt-get install -y $PKGS || true)
          NOT_UPGRADED=$(apt list --upgradable 2>/dev/null | grep -v "Listing..." | wc -l)
          if [ "$NOT_UPGRADED" -gt 0 ]; then
            echo "[⚠️] 아직 $NOT_UPGRADED 개 패키지 업그레이드 안됨!"
            apt list --upgradable 2>/dev/null
          else
            echo "[✅] 모든 패키지 최신!"
          fi
          cp .echo.*.sh .github/codeql-out/ 2>/dev/null || true
        shell: bash

      - name: "[4] CodeQL Detect & Analyze & 복제"
        run: |
          set +e
          export PATH="$HOME/codeql/codeql:/usr/bin:/bin:/usr/local/bin:$PATH"
          mkdir -p .github/codeql-out
          [ -f .github/codeql-out/.keep ] || touch .github/codeql-out/.keep

          echo '[🔍] Detecting supported languages in project...'
          detect_langs() {
            langs=""
            [ -d src ] && grep -r -q "def " src/ 2>/dev/null && langs="$langs,python"
            [ -d src ] && grep -r -q "class " src/ 2>/dev/null && langs="$langs,java"
            [ -d src ] && grep -r -q "function " src/ 2>/dev/null && langs="$langs,javascript"
            [ -d src ] && grep -r -q "#include" src/ 2>/dev/null && langs="$langs,cpp"
            [ -f setup.py ] && langs="$langs,python"
            [ -f pom.xml ] && langs="$langs,java"
            [ -f package.json ] && langs="$langs,javascript"
            [ -f main.go ] && langs="$langs,go"
            [ -f Cargo.toml ] && langs="$langs,cpp"
            [ -f Gemfile ] && langs="$langs,ruby"
            langs=$(echo $langs | tr ',' '\n' | grep -v '^$' | sort -u | tr '\n' ',' | sed 's/,$//')
            [ -z "$langs" ] && langs="python,java,javascript"
            echo $langs
          }

          langs=$(detect_langs)
          echo "[🔍] Detected languages: $langs"

          DB_DIR="db-ql"
          SARIF_FILE="codeql-report.sarif"
          OUT_DIR=".github/codeql-out"
          CODEQL_BIN=""
          if [ -x "$HOME/codeql/codeql/codeql" ]; then
            CODEQL_BIN="$HOME/codeql/codeql/codeql"
          elif command -v codeql >/dev/null 2>&1; then
            CODEQL_BIN=$(command -v codeql)
          fi
          if [ -z "$CODEQL_BIN" ]; then
            echo "[❌] CodeQL 바이너리 없음! Dummy 결과만 생성"
            echo '{}' > $SARIF_FILE
            mkdir -p $OUT_DIR/$DB_DIR
            cp $SARIF_FILE $OUT_DIR/
            touch $OUT_DIR/.keep
            exit 0
          fi

          if [[ "$langs" == *,* ]]; then
            echo "[⚡] Creating DB for multiple languages ($langs) with --db-cluster ..."
            $CODEQL_BIN database create $DB_DIR --language=$langs --db-cluster --source-root=. || (echo '[❌] DB 생성 실패, 더미 DB 디렉토리 생성'; mkdir -p $DB_DIR/java $DB_DIR/python $DB_DIR/javascript)
          else
            echo "[⚡] Creating DB for $langs..."
            $CODEQL_BIN database create $DB_DIR --language=$langs --source-root=. || (echo '[❌] DB 생성 실패, 더미 DB 디렉토리 생성'; mkdir -p $DB_DIR/$langs)
          fi

          echo "[⚡] CodeQL database created: $DB_DIR"
          mkdir -p $OUT_DIR

          $CODEQL_BIN database analyze $DB_DIR \
            --format=sarifv2.1.0 \
            --output=$SARIF_FILE \
            --threads=2 --ram=4096 --rerun --trace-process --trace-process-level=3 \
            || (echo '[⚠️] CodeQL analyze failed! 더미 sarif 생성'; echo '{}' > $SARIF_FILE)

          echo "[📂] 복제: 분석 결과 및 데이터 디렉토리 복사 중..."
          cp -rf $DB_DIR $OUT_DIR/ 2>/dev/null || echo '[⚠️] DB 디렉토리 복사 실패'
          [ -f $SARIF_FILE ] && cp $SARIF_FILE $OUT_DIR/ || (echo '[⚠️] SARIF 파일 복사 실패, 더미 생성'; echo '{}' > $OUT_DIR/$SARIF_FILE)
          ls -lh $OUT_DIR || echo '[⚠️] 결과 디렉토리 확인 실패'
          cp .echo.*.sh $OUT_DIR/ 2>/dev/null || true
          echo "[✅] CodeQL SARIF: $OUT_DIR/$SARIF_FILE"
          [ -f $OUT_DIR/$SARIF_FILE ] || echo '{}' > $OUT_DIR/$SARIF_FILE
          [ -d $OUT_DIR/$DB_DIR ] || mkdir -p $OUT_DIR/$DB_DIR
          touch $OUT_DIR/.keep
        shell: bash
        env:
          PATH: $HOME/codeql/codeql:/usr/bin:/bin:/usr/local/bin:$PATH
