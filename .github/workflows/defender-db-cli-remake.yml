name: "🛰️ NET Echo Pre-Docker (Echo Everywhere)"

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: "수집 결과를 저장소에 커밋/푸시 (true/false)"
        required: false
        default: "false"
      echo_root:
        description: "에코 루트 디렉터리"
        required: false
        default: ".github/echo_net"
      include_linux:
        description: "Linux 수집 실행 (true/false)"
        required: false
        default: "true"
      include_windows:
        description: "Windows 수집 실행 (true/false)"
        required: false
        default: "true"

jobs:
  net-echo:
    name: "NET Echo :: ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            enabled: ${{ github.event.inputs.include_linux == 'true' || github.event.inputs.include_linux == null }}
          - os: windows-latest
            enabled: ${{ github.event.inputs.include_windows == 'true' || github.event.inputs.include_windows == null }}
    if: ${{ matrix.enabled }}
    env:
      ECHO_ROOT: ${{ github.event.inputs.echo_root || '.github/echo_net' }}
      OUT_DIR: ${{ github.event.inputs.echo_root || '.github/echo_net' }}/out/${{ runner.os }}
      LOG_DIR: ${{ github.event.inputs.echo_root || '.github/echo_net' }}/logs
    steps:
      - name: "[ECHO] Checkout"
        uses: actions/checkout@v4

      - name: "[ECHO] Show runner & inputs"
        run: |
          echo "[ECHO] Runner: $RUNNER_OS"
          echo "[ECHO] echo_root=${{ env.ECHO_ROOT }}"
          echo "[ECHO] out_dir=${{ env.OUT_DIR }}"
          echo "[ECHO] commit_changes=${{ github.event.inputs.commit_changes || 'false' }}"
        shell: bash

      - name: "[ECHO] Prepare dirs"
        run: |
          echo "[ECHO] mkdir -p '${ECHO_ROOT}' '${OUT_DIR}' '${LOG_DIR}'"
          mkdir -p "${ECHO_ROOT}" "${OUT_DIR}" "${LOG_DIR}"
        shell: bash

      # ---------- Linux ----------
      - name: "[ECHO][Linux] Build echo script"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO] Generate Bash gather script -> ${ECHO_ROOT}/scripts/gather_net_echo.sh"
          mkdir -p "${ECHO_ROOT}/scripts"
          cat > "${ECHO_ROOT}/scripts/gather_net_echo.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ECHO_ROOT="${ECHO_ROOT:-.github/echo_net}"
          OUT_DIR="${OUT_DIR:-${ECHO_ROOT}/out/${RUNNER_OS:-Linux}}"
          BIN_DIR="${BIN_DIR:-${ECHO_ROOT}/bin}"
          LOG_DIR="${LOG_DIR:-${ECHO_ROOT}/logs}"
          mkdir -p "$OUT_DIR" "$BIN_DIR" "$LOG_DIR"

          echoe(){ echo "[ECHO][$(date +%H:%M:%S)] $*"; }
          trap 'rc=$?; echoe "FAILED at: ${BASH_COMMAND} (rc=${rc})"; exit $rc' ERR

          check_cmd(){ c="$1"; if command -v "$c" &>/dev/null; then "$c" --version 2>/dev/null | head -n1 | sed "1s/^/$c : /"; else echo "$c : MISSING"; fi; }

          { echo "DATE: $(date -Is)"; echo "UNAME: $(uname -a)"; echo; echo "[/etc/os-release]"; (cat /etc/os-release 2>/dev/null || true); } > "${OUT_DIR}/00_system_overview.txt"
          for c in ip ss netstat route ifconfig arp iptables ip6tables nft ufw resolvectl systemd-resolve nmcli ethtool lspci lshw iw iwconfig iwlist dig host nslookup; do
            check_cmd "$c"
          done | tee "${BIN_DIR}/commands-${RUNNER_OS:-Linux}.txt"

          dump(){ t="$1"; shift; echoe "RUN $* -> ${OUT_DIR}/${t}.txt"; ( "$@" > "${OUT_DIR}/${t}.txt" 2>&1 ) || echoe "WARN $t failed"; }

          # Core
          command -v ip >/dev/null && { dump ip_addr  ip addr; dump ip_link ip -d link; dump ip_route ip route show table all; dump ip_rule ip rule show; dump ip_neigh ip neigh; } || true
          command -v ss >/dev/null && { dump ss_tcp ss -tlnp; dump ss_udp ss -ulnp; dump ss_sum ss -s; } || command -v netstat >/dev/null && { dump netstat_listen netstat -tulpn; dump netstat_routes netstat -rn; }
          command -v arp >/dev/null && dump arp arp -an || true

          # DNS / files
          for f in /etc/resolv.conf /etc/hosts /etc/nsswitch.conf; do [ -f "$f" ] && cp -a "$f" "${OUT_DIR}/$(basename "$f")"; done
          command -v resolvectl      >/dev/null && dump resolvectl resolvectl status || true
          command -v systemd-resolve >/dev/null && dump systemd_resolve systemd-resolve --status || true

          # Firewall
          command -v ufw       >/dev/null && dump ufw ufw status verbose || true
          command -v iptables  >/dev/null && dump iptables sh -c 'iptables -S; iptables -L -v -n' || true
          command -v ip6tables >/dev/null && dump ip6tables sh -c 'ip6tables -S; ip6tables -L -v -n' || true
          command -v nft       >/dev/null && dump nft nft list ruleset || true

          # Kernel net params
          dump sysctl_net sh -c 'sysctl -a 2>/dev/null | grep -E "^(net\.|fs\.ipv4|fs\.ipv6)" || true'

          # NIC/driver
          command -v ethtool >/dev/null && for n in $(ls /sys/class/net 2>/dev/null | grep -v lo || true); do dump "ethtool_${n}" ethtool "$n"; done
          command -v lspci   >/dev/null && dump lspci_net sh -c 'lspci -nn | grep -i -E "net|ether|wireless|wifi"'
          command -v lshw    >/dev/null && dump lshw_net  sh -c 'lshw -class network -sanitize'

          # Wi-Fi
          command -v iw       >/dev/null && dump iw_dev iw dev || true
          command -v iwconfig >/dev/null && dump iwconfig iwconfig || true
          command -v iwlist   >/dev/null && dump iw_scan sh -c 'iwlist scan 2>/dev/null || true'

          # Netplan / legacy
          [ -d /etc/netplan ] && { dump netplan sh -c 'ls -al /etc/netplan; echo; (cat /etc/netplan/*.yaml 2>/dev/null || true)'; }
          [ -f /etc/network/interfaces ] && cp -a /etc/network/interfaces "${OUT_DIR}/interfaces.legacy"

          # Connectivity / DNS tests (best-effort)
          dump ping_gw sh -c 'gw=$(ip route | awk "/default/ {print \$3; exit}"); [ -n "$gw" ] && (ping -c 2 -W 1 "$gw" || true) || echo "No default gw"'
          command -v nslookup >/dev/null && dump nslookup_1_1_1_1 sh -c 'nslookup 1.1.1.1 || true'
          command -v dig      >/dev/null && dump dig_example sh -c 'dig +short example.com; dig +short @1.1.1.1 example.com' || true
          command -v host     >/dev/null && dump host_example host example.com || true

          # Index
          { echo "# NET ECHO INDEX ($(date -Is))"; echo; find "${OUT_DIR}" -type f -printf " - %p\n" 2>/dev/null || true; } > "${ECHO_ROOT}/INDEX-${RUNNER_OS:-Linux}.md"
          # Archive
          tar -czf "${ECHO_ROOT}/net_echo_${RUNNER_OS:-Linux}_$(date +%Y%m%d_%H%M%S).tar.gz" -C "${ECHO_ROOT}/out" "${RUNNER_OS:-Linux}" || true
          echoe "DONE out=${OUT_DIR}"
          SH
          chmod +x "${ECHO_ROOT}/scripts/gather_net_echo.sh"
          echo "[ECHO] Script created."
      
      - name: "[ECHO][Linux] Run gather"
        if: runner.os == 'Linux'
        run: |
          set -Eeuo pipefail
          echo "[ECHO] Run ${ECHO_ROOT}/scripts/gather_net_echo.sh"
          ECHO_ROOT="${ECHO_ROOT}" OUT_DIR="${OUT_DIR}" LOG_DIR="${LOG_DIR}" "${ECHO_ROOT}/scripts/gather_net_echo.sh"
        shell: bash

      # ---------- Windows ----------
      - name: "[ECHO][Windows] Build echo script"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "[ECHO] Generate PowerShell gather script -> $env:ECHO_ROOT\scripts\Gather-NetEcho.ps1"
          New-Item -ItemType Directory -Force -Path "$env:ECHO_ROOT\scripts","$env:OUT_DIR","$env:LOG_DIR" | Out-Null
          @'
          Param()
          $ErrorActionPreference = "Stop"
          if(-not $env:ECHO_ROOT){ $env:ECHO_ROOT = ".github\echo_net" }
          if(-not $env:OUT_DIR){   $env:OUT_DIR   = "$($env:ECHO_ROOT)\out\Windows" }
          if(-not $env:LOG_DIR){   $env:LOG_DIR   = "$($env:ECHO_ROOT)\logs" }
          New-Item -ItemType Directory -Force -Path $env:OUT_DIR,$env:LOG_DIR | Out-Null
          function Echoe([string]$m){ Write-Host "[ECHO][$((Get-Date).ToString('HH:mm:ss'))] $m" }
          function Dump($n, $b){ $o = Join-Path $env:OUT_DIR ($n + ".txt"); Echoe "RUN $n -> $o"; try { & $b | Out-File -FilePath $o -Encoding UTF8 -Width 300 } catch { Echoe "WARN $n failed: $($_.Exception.Message)" } }
          "# NET ECHO ($(Get-Date -Format s))" | Out-File (Join-Path $env:OUT_DIR "00_header.txt")
          Dump "systeminfo" { systeminfo }
          Dump "ipconfig_all" { ipconfig /all }
          Dump "route_print" { route print }
          Dump "arp_a" { arp -a }
          Dump "netstat_anb" { netstat -anb }
          Dump "dns_cache" { ipconfig /displaydns }
          Dump "Get-NetIPConfiguration" { Get-NetIPConfiguration | Format-List * }
          Dump "Get-NetAdapter" { Get-NetAdapter | Format-List * }
          Dump "Get-NetRoute" { Get-NetRoute | Sort-Object -Property DestinationPrefix | Format-Table -AutoSize }
          Dump "Get-DnsClientServerAddress" { Get-DnsClientServerAddress | Format-List * }
          Dump "Get-NetFirewallProfile" { Get-NetFirewallProfile | Format-List * }
          Dump "Get-NetFirewallRule(Top200)" { Get-NetFirewallRule | Select-Object -First 200 | Format-List * }
          "# INDEX" | Out-File (Join-Path $env:ECHO_ROOT "INDEX-Windows.md")
          Get-ChildItem -Recurse -File $env:OUT_DIR | ForEach-Object { " - " + $_.FullName } | Out-File -Append (Join-Path $env:ECHO_ROOT "INDEX-Windows.md")
          $archive = Join-Path $env:ECHO_ROOT ("net_echo_Windows_" + (Get-Date -Format "yyyyMMdd_HHmmss") + ".zip")
          Compress-Archive -Path $env:OUT_DIR -DestinationPath $archive -Force
          Echoe ("DONE out=" + $env:OUT_DIR + " zip=" + $archive)
          '@ | Set-Content -Encoding UTF8 "$env:ECHO_ROOT\scripts\Gather-NetEcho.ps1"
          Write-Host "[ECHO] Script created."

      - name: "[ECHO][Windows] Run gather"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "[ECHO] Run $env:ECHO_ROOT\scripts\Gather-NetEcho.ps1"
          & "$env:ECHO_ROOT\scripts\Gather-NetEcho.ps1"

      # ---------- 공통: 아티팩트 업로드 ----------
      - name: "[ECHO] Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: net-echo-${{ runner.os }}
          path: |
            ${{ env.ECHO_ROOT }}/out/${{ runner.os }}/
            ${{ env.ECHO_ROOT }}/INDEX-*.md
            ${{ env.ECHO_ROOT }}/net_echo_*.*

      # ---------- (옵션) 결과 커밋 ----------
      - name: "[ECHO] Commit & push results"
        if: ${{ github.event.inputs.commit_changes == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO] Commit collected files under ${ECHO_ROOT}"
          git config user.name  "net-echo-bot"
          git config user.email "net-echo-bot@users.noreply.github.com"
          git add "${ECHO_ROOT}"
          if git diff --cached --quiet; then
            echo "[ECHO] No changes to commit."
          else
            git commit -m "chore(net-echo): add $RUNNER_OS capture ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
            echo "[ECHO] Pushed."
          fi
