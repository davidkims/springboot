name: "🔐 Token & PAT Helper (Echo + Download + Encryption)"

on:
  workflow_dispatch:
    inputs:
      repo_full_name:
        description: "대상 저장소 (예: owner/repo) — 생략 시 현재 리포"
        required: false
        default: ""
      app_id:
        description: "GitHub App ID (설치 토큰 자동발급용)"
        required: false
        default: ""
      app_private_key_b64:
        description: "GitHub App PRIVATE KEY (BASE64) — PEM을 base64 인코딩해서 입력"
        required: false
        default: ""
      app_installation_id:
        description: "GitHub App Installation ID (선택; 비우면 자동 탐색)"
        required: false
        default: ""
      pat_candidate:
        description: "검증할 PAT(옵션) — 발급은 불가, 유효성만 검사"
        required: false
        default: ""
      add_deploy_key:
        description: "SSH Deploy Key 자동 생성/등록 여부 (true/false)"
        required: true
        default: "true"
      deploy_key_title:
        description: "Deploy Key 제목"
        required: false
        default: "auto-deploy-key"
      encrypt_passphrase:
        description: "아티팩트 암호화용 패스프레이즈 (권장)"
        required: false
        default: ""
      hard_fail_on_validation:
        description: "토큰 검증 실패 시 워크플로우 실패처리 (true/false)"
        required: false
        default: "true"

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  token-factory:
    runs-on: ubuntu-latest
    env:
      ECHO_ROOT: .github/echo
      OUT_DIR: .github/echo/out
      SITE_DIR: site
      GH_API: https://api.github.com
      OWNER_REPO: ${{ github.event.inputs.repo_full_name }}
      HARD_FAIL: ${{ github.event.inputs.hard_fail_on_validation }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init echo dirs
        shell: bash
        run: |
          set -Eeuo pipefail
          E="${ECHO_ROOT}"
          echo "[ECHO][INIT] create dirs: ${E}, ${OUT_DIR}, ${SITE_DIR}"
          mkdir -p "${E}"/tools "${OUT_DIR}" "${SITE_DIR}"

          # 공용 echo 함수
          cat > "${E}/tools/echo.sh" <<'BASH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ts(){ date -u +"%Y-%m-%dT%H:%M:%SZ"; }
          echoe(){ printf "[ECHO][%s] %s\n" "$(ts)" "$*"; }
          faile(){ echoe "[FAIL] $*"; exit 1; }
          mask(){ local v="$1"; [ -z "${v}" ] && echo "(empty)" || echo "${v:0:4}****${v: -4}"; }
          BASH
          chmod +x "${E}/tools/echo.sh"

      - name: Resolve repo (owner/repo)
        id: repo
        shell: bash
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          if [ -z "${OWNER_REPO}" ]; then
            OWNER_REPO="${GITHUB_REPOSITORY}"
          fi
          echoe "Target repo = ${OWNER_REPO}"
          echo "repo=${OWNER_REPO}" >> "$GITHUB_OUTPUT"

      - name: Write helper:GitHub App → Installation Token
        shell: bash
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          cat > "${ECHO_ROOT}/tools/app_token.sh" <<'BASH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          APP_ID="${1:-}"
          APP_KEY_B64="${2:-}"
          INSTALL_ID_IN="${3:-}"
          OWNER_REPO="${4:-}"
          GH_API="https://api.github.com"

          ts(){ date -u +"%Y-%m-%dT%H:%M:%SZ"; }
          echoe(){ printf "[ECHO][%s] %s\n" "$(ts)" "$*"; }
          faile(){ echoe "[FAIL] $*"; exit 1; }

          [ -n "${APP_ID}" ] || faile "APP_ID required"
          [ -n "${APP_KEY_B64}" ] || faile "APP PRIVATE KEY (b64) required"

          TMP_DIR="$(mktemp -d)"
          KEY_PEM="${TMP_DIR}/app.pem"
          echo "${APP_KEY_B64}" | base64 -d > "${KEY_PEM}"

          IAT=$(date +%s)
          EXP=$((IAT+540)) # 9분 유효 (GitHub 권장: 최대 10분)
          HDR='{"alg":"RS256","typ":"JWT"}'
          PAY=$(jq -cn --arg i "${APP_ID}" --arg iat "${IAT}" --arg exp "${EXP}" '{iat: ($iat|tonumber), exp: ($exp|tonumber), iss: ($i|tonumber)}')

          b64url(){ openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          H64=$(printf '%s' "${HDR}" | b64url)
          P64=$(printf '%s' "${PAY}" | b64url)
          SIG=$(printf '%s.%s' "${H64}" "${P64}" | openssl dgst -sha256 -sign "${KEY_PEM}" -binary | b64url)
          JWT="${H64}.${P64}.${SIG}"
          echoe "App JWT 만들어짐 (마스킹): ${JWT:0:10}****"

          if [ -z "${INSTALL_ID_IN}" ]; then
            echoe "Installation ID 자동 탐색"
            INST_JSON=$(curl -fsSL -H "Authorization: Bearer ${JWT}" -H "Accept: application/vnd.github+json" "${GH_API}/app/installations")
            INSTALL_ID=$(echo "${INST_JSON}" | jq -r '.[0].id // empty')
            [ -n "${INSTALL_ID}" ] || faile "No installation found. 앱을 리포나 조직에 설치하세요."
          else
            INSTALL_ID="${INSTALL_ID_IN}"
          fi
          echoe "Installation ID = ${INSTALL_ID}"

          TOKEN_JSON=$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${JWT}" \
            -H "Accept: application/vnd.github+json" \
            "${GH_API}/app/installations/${INSTALL_ID}/access_tokens" \
            -d "$(jq -cn --arg repo "${OWNER_REPO}" '{repositories: [$repo]}')")
          TOKEN=$(echo "${TOKEN_JSON}" | jq -r '.token // empty')
          [ -n "${TOKEN}" ] || faile "토큰 발급 실패: $(echo "${TOKEN_JSON}" | jq -r '.')"

          echoe "발급된 Installation Token(마스킹): ${TOKEN:0:4}****${TOKEN: -4}"
          # 출력
          printf '%s' "${TOKEN}"
          BASH
          chmod +x "${ECHO_ROOT}/tools/app_token.sh"
          echo "[ECHO] helper ready"

      - name: Generate GitHub App installation token (optional)
        id: app_token
        shell: bash
        env:
          IN_APP_ID: ${{ inputs.app_id }}
          IN_APP_KEY_B64: ${{ inputs.app_private_key_b64 }}
          IN_INSTALL_ID: ${{ inputs.app_installation_id }}
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          if [ -n "${IN_APP_ID}" ] && [ -n "${IN_APP_KEY_B64}" ]; then
            echoe "GitHub App 토큰 발급 시도"
            TOK="$("${ECHO_ROOT}/tools/app_token.sh" "${IN_APP_ID}" "${IN_APP_KEY_B64}" "${IN_INSTALL_ID}" "${{ steps.repo.outputs.repo }}")"
            echo "token=${TOK}" >> "$GITHUB_OUTPUT"
            echoe "토큰 길이: ${#TOK} (마스킹 출력: $(mask "${TOK}"))"
            # 보관: 파일 저장(민감정보, 권한 제한)
            echo -n "${TOK}" > "${OUT_DIR}/app_installation_token.txt"
            chmod 600 "${OUT_DIR}/app_installation_token.txt"
          else
            echoe "App ID 또는 Private Key 미입력 — 건너뜀"
          fi

      - name: Validate provided PAT (optional)
        id: pat
        shell: bash
        env:
          PAT: ${{ inputs.pat_candidate }}
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          if [ -n "${PAT}" ]; then
            echoe "입력된 PAT 검증 중 (마스킹: $(mask "${PAT}"))"
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${PAT}" -H "Accept: application/vnd.github+json" "${GH_API}/user")
            echoe "검증 HTTP ${code}"
            if [ "${code}" = "200" ]; then
              echo "valid=true" >> "$GITHUB_OUTPUT"
              echoe "PAT 유효 ✅"
              echo -n "${PAT}" > "${OUT_DIR}/validated_pat.txt"
              chmod 600 "${OUT_DIR}/validated_pat.txt"
            else
              echo "valid=false" >> "$GITHUB_OUTPUT"
              echoe "PAT 무효 또는 권한 부족 ❌"
              if [ "${HARD_FAIL}" = "true" ]; then
                faile "PAT 검증 실패 — hard fail 설정"
              fi
            fi
          else
            echoe "PAT 미입력 — 건너뜀"
          fi

      - name: Create & register SSH Deploy Key (optional)
        if: ${{ inputs.add_deploy_key == 'true' }}
        id: dkey
        shell: bash
        env:
          REPO: ${{ steps.repo.outputs.repo }}
          TITLE: ${{ inputs.deploy_key_title }}
          ENC_PASSPHRASE: ${{ inputs.encrypt_passphrase }}
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"

          # 1) 키 생성
          echoe "ed25519 SSH 키 생성"
          mkdir -p "${OUT_DIR}/ssh"
          ssh-keygen -t ed25519 -C "${TITLE}" -N "" -f "${OUT_DIR}/ssh/id_ed25519" >/dev/null
          PUB=$(cat "${OUT_DIR}/ssh/id_ed25519.pub")

          # 2) API 토큰 선택: App 설치 토큰 > GITHUB_TOKEN
          API_TOKEN="${{ steps.app_token.outputs.token }}"
          if [ -z "${API_TOKEN}" ]; then
            echoe "App 설치 토큰 없음 → GITHUB_TOKEN 사용"
            API_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          else
            echoe "App 설치 토큰 사용"
          fi

          # 3) Deploy Key 등록
          echoe "Deploy Key 등록 to ${REPO}"
          body=$(jq -cn --arg t "${TITLE}" --arg k "${PUB}" '{title:$t, key:$k, read_only:true}')
          resp=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GH_API}/repos/${REPO}/keys" \
            -d "${body}")
          http_code=$(tail -n1 <<< "${resp}")
          json=$(sed '$ d' <<< "${resp}")
          echoe "등록 응답: ${http_code}"
          if [ "${http_code}" != "201" ]; then
            echoe "응답 본문: ${json}"
            if [ "${HARD_FAIL}" = "true" ]; then
              faile "Deploy Key 등록 실패"
            fi
          fi

          # 4) 개인키 암호화(선택)
          if [ -n "${ENC_PASSPHRASE}" ]; then
            echoe "개인키 AES-256 암호화"
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -in "${OUT_DIR}/ssh/id_ed25519" \
              -out "${OUT_DIR}/ssh/id_ed25519.enc" \
              -pass pass:"${ENC_PASSPHRASE}"
            shred -u "${OUT_DIR}/ssh/id_ed25519"
            echoe "원본 개인키 보안 삭제 완료 (shred)"
          fi

          # 5) 안내 파일
          cat > "${SITE_DIR}/deploy_key_README.md" <<MD
          # SSH Deploy Key 사용법
          - 공개키는 리포에 read-only로 등록되었습니다.
          - **개인키는 암호화 파일(.enc)만 제공**됩니다. 패스프레이즈로 복호화하세요:
            \`\`\`bash
            openssl enc -d -aes-256-cbc -pbkdf2 -in id_ed25519.enc -out id_ed25519 -pass pass:"<your-passphrase>"
            chmod 600 id_ed25519
            GIT_SSH_COMMAND='ssh -i ./id_ed25519 -o StrictHostKeyChecking=no' git clone git@github.com:${REPO}.git
            \`\`\`
          MD

      - name: Summaries & safe exports
        shell: bash
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          {
            echo "## Token & Key Summary (secrets masked)"
            if [ -f "${OUT_DIR}/app_installation_token.txt" ]; then
              TOK=$(cat "${OUT_DIR}/app_installation_token.txt")
              echo "- App Installation Token: $(mask "${TOK}")"
            else
              echo "- App Installation Token: (none)"
            fi
            if [ -f "${OUT_DIR}/validated_pat.txt" ]; then
              PAT=$(cat "${OUT_DIR}/validated_pat.txt")
              echo "- Provided PAT (validated): $(mask "${PAT}")"
            else
              echo "- Provided PAT: (none)"
            fi
            if [ -f "${OUT_DIR}/ssh/id_ed25519.enc" ]; then
              echo "- SSH Private Key: id_ed25519.enc (encrypted)"
            elif [ -f "${OUT_DIR}/ssh/id_ed25519" ]; then
              echo "- SSH Private Key: id_ed25519 (UNENCRYPTED) — 보안상 권장하지 않음"
            else
              echo "- SSH Private Key: (none)"
            fi
          } | tee "${SITE_DIR}/SUMMARY.md"

      - name: Package download bundle (ZIP)
        shell: bash
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          B="${OUT_DIR}/bundle"
          mkdir -p "${B}"
          cp -a "${SITE_DIR}/." "${B}/"
          [ -d "${OUT_DIR}/ssh" ] && cp -a "${OUT_DIR}/ssh" "${B}/" || true
          [ -f "${OUT_DIR}/app_installation_token.txt" ] && \
            cp "${OUT_DIR}/app_installation_token.txt" "${B}/app_installation_token.txt.SECURE_DO_NOT_SHARE" || true
          [ -f "${OUT_DIR}/validated_pat.txt" ] && \
            cp "${OUT_DIR}/validated_pat.txt" "${B}/validated_pat.txt.SECURE_DO_NOT_SHARE" || true

          ( cd "${OUT_DIR}" && zip -r token_download_bundle.zip bundle >/dev/null )
          echoe "ZIP 생성: ${OUT_DIR}/token_download_bundle.zip"

      - name: Upload artifact (download bundle)
        uses: actions/upload-artifact@v4
        with:
          name: token-download-bundle
          path: |
            .github/echo/out/token_download_bundle.zip
            site/
          if-no-files-found: warn
          retention-days: 7

      - name: Final notes (security)
        shell: bash
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          cat <<'TXT'
          [SECURITY NOTES]
          - PAT은 API로 자동 "발급"할 수 없습니다. 본 워크플로우는 PAT 유효성 검사만 수행합니다.
          - 가능하면 GitHub App 설치 토큰 또는 GITHUB_TOKEN을 사용하세요.
          - 모든 민감 파일은 아티팩트로 제공되며, 필요 시 encrypt_passphrase로 암호화됩니다.
          - 업로드된 아티팩트는 보안상 단기간 보관을 권장합니다.
          TXT
