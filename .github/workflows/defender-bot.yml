name: "🔐 Account Rotation + SecSuite + Anomaly/FDS (5min · Multi-Arch · Echo · Pages · SBOM · Trivy · Scorecard · CodeQL · Bot)"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: account-rotation
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  security-events: write

defaults:
  run:
    shell: bash

env:
  LOG: .github/echo_logs/account-rotation.log
  PAGES_DIR: .github/pages
  REPORT_DIR: .github/security_reports
  SBOM_DIR: .github/sbom
  CACHE_VERSION: v1
  CODEQL_LANGUAGES: python
  GIT_USER_NAME: repo-bot
  GIT_USER_EMAIL: repo-bot@example.local
  BASH_ENV: .github/echo/bootstrap.sh
  # ---- TERM/dialog 문제 방지 (전역) ----
  TERM: xterm-256color
  DEBIAN_FRONTEND: noninteractive
  UCF_FORCE_CONFNEW: "1"
  APT_LISTCHANGES_FRONTEND: none
  # (옵션) git 네트워크 탄력성
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"

jobs:
  build-test-sec:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🔊 Bootstrap Echo (BASH_ENV)
        run: |
          set -Eeuo pipefail
          mkdir -p .github/echo .github/echo_logs .github/security_reports .github/pages .github/sbom .github/artifacts workflow
          # 더미 소스/도커파일 자동 생성(없을 때만)
          [ -f workflow/rotate_accounts.py ] || cat > workflow/rotate_accounts.py <<'PY'
          print("rotate_accounts: noop demo")
          PY
          [ -f workflow/bootstrap.sh ] || cat > workflow/bootstrap.sh <<'SH'
          #!/usr/bin/env bash
          echo "[bootstrap] noop"
          SH
          [ -f workflow/automation.sh ] || cat > workflow/automation.sh <<'SH'
          #!/usr/bin/env bash
          echo "[automation] noop"
          SH
          [ -f workflow/Dockerfile ] || cat > workflow/Dockerfile <<'DOCKERFILE'
          FROM python:3.11-slim
          WORKDIR /app
          COPY rotate_accounts.py /app/rotate_accounts.py
          CMD ["python","/app/rotate_accounts.py"]
          DOCKERFILE
          chmod +x workflow/*.sh || true

          # BASH_ENV: 모든 스텝 자동 소싱 + apt 비대화/TERM 안전가드
          cat > "$BASH_ENV" <<'EOSH'
          # --- BASH_ENV (auto-sourced per bash step) ---
          export TERM="${TERM:-dumb}"
          export DEBIAN_FRONTEND="${DEBIAN_FRONTEND:-noninteractive}"
          export UCF_FORCE_CONFNEW="${UCF_FORCE_CONFNEW:-1}"
          export APT_LISTCHANGES_FRONTEND="${APT_LISTCHANGES_FRONTEND:-none}"
          # tzdata 대화창 방지
          sudo ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime 2>/dev/null || true
          sudo dpkg-reconfigure -f noninteractive tzdata 2>/dev/null || true

          # 안전 apt 래퍼
          apti() {
            sudo -E apt-get update -y -o Dpkg::Use-Pty=0 || true
            sudo -E apt-get install -y -q \
              -o Dpkg::Options::=--force-confnew \
              -o Dpkg::Options::=--force-confdef \
              -o Dpkg::Use-Pty=0 "$@" || true
            sudo -E apt-get clean || true
          }

          export LOG="${LOG:-.github/echo_logs/account-rotation.log}"
          mkdir -p "$(dirname "$LOG")" 2>/dev/null || true
          ECHO() { printf '[ECHO][%s] %s\n' "${STEP_NAME:-step}" "$*"; }
          init_echo() {
            STEP_NAME="$1"; export STEP_NAME
            trap 'rc=$?; ECHO "FAIL line ${BASH_LINENO[0]} (cmd: ${BASH_COMMAND}) -> ${rc}"; exit ${rc}' ERR
            mkdir -p "$(dirname "$LOG")" "${REPORT_DIR:-.github/security_reports}" "${PAGES_DIR:-.github/pages}" "${SBOM_DIR:-.github/sbom}" || true
            ECHO "start $(date -u +'%F %T %Z')"
          }
          EOSH
          echo "[ECHO][bootstrap] BASH_ENV ready: $BASH_ENV"

      - name: ♻️ Free disk (optional)
        run: |
          set -Eeuo pipefail; init_echo "free-disk"
          docker system prune -af || true
          sudo rm -rf /opt/hostedtoolcache || true
          ECHO "disk freed" | tee -a "$LOG" || true

      - name: 🧱 Env & tree (echo)
        run: |
          set -Eeuo pipefail; init_echo "env-tree"
          {
            ECHO "date=$(date -u +'%F %T %Z')"
            ECHO "pwd=$(pwd)"
            ECHO "ls -al:"; ls -al
            ECHO "workflow tree:"; (command -v tree >/dev/null 2>&1 && tree -a workflow || find workflow -maxdepth 2 -print)
          } | tee -a "$LOG" || true

      - name: 🧰 QEMU for multi-arch
        uses: docker/setup-qemu-action@v3

      - name: 🧰 Setup Buildx (with cache)
        uses: docker/setup-buildx-action@v3

      - name: 💾 Restore Buildx cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ env.CACHE_VERSION }}-${{ github.ref_name }}
          restore-keys: buildx-${{ env.CACHE_VERSION }}-

      - name: 🐍 Python syntax check (echo)
        run: |
          set -Eeuo pipefail; init_echo "py-syntax"
          python3 -m py_compile workflow/rotate_accounts.py
          ECHO "py_compile OK" | tee -a "$LOG" || true

      - name: 🐚 Bash syntax + ShellCheck (echo)
        run: |
          set -Eeuo pipefail; init_echo "bash-syntax"
          bash -n workflow/bootstrap.sh || true
          bash -n workflow/automation.sh || true
          apti shellcheck
          (shellcheck -f tty workflow/bootstrap.sh || true) | sed 's/^/[SHELLCHECK] /' | tee -a "$LOG" || true
          (shellcheck -f tty workflow/automation.sh || true) | sed 's/^/[SHELLCHECK] /' | tee -a "$LOG" || true
          ECHO "bash -n & shellcheck OK (best-effort)" | tee -a "$LOG" || true

      - name: 🐳 Build Docker (amd64, load + cache) (echo)
        run: |
          set -Eeuo pipefail; init_echo "docker-build-amd64"
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to   type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t workflow-image:ci \
            -f workflow/Dockerfile \
            --load workflow
          rm -rf /tmp/.buildx-cache && mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          ECHO "build (amd64) OK" | tee -a "$LOG" || true

      - name: ▶️ Smoke test (echo)
        run: |
          set -Eeuo pipefail; init_echo "smoke-test"
          docker rm -f workflow-container-test >/dev/null 2>&1 || true
          docker run -d --name workflow-container-test --cpus="1.0" --memory="768m" workflow-image:ci
          sleep 8
          docker ps --filter "name=workflow-container-test" --format '{{.Names}} {{.Status}}' | sed 's/^/[DOCKER] /' | tee -a "$LOG" || true
          docker logs --tail 120 workflow-container-test | sed 's/^/[LOGS] /' | tee -a "$LOG" || true
          docker rm -f workflow-container-test || true
          ECHO "smoke OK" | tee -a "$LOG" || true

      - name: 🐳 Build Docker (arm64, oci tar + cache) (echo)
        run: |
          set -Eeuo pipefail; init_echo "docker-build-arm64"
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to   type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t workflow-image:arm64 \
            -f workflow/Dockerfile \
            --output type=oci,dest=.github/artifacts/workflow-image-arm64.tar \
            workflow
          rm -rf /tmp/.buildx-cache && mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          ECHO "build (arm64) tar exported" | tee -a "$LOG" || true

      # ---------- Filesystem I/O ----------
      - name: 📁 I/O seeds (echo)
        env:
          IO_DIR: .github/io
        run: |
          set -Eeuo pipefail; init_echo "io-seed"
          mkdir -p "$IO_DIR"/{system,disk,container,image}/logs "$IO_DIR"/{bundle,reports}
          for d in system disk container image; do echo "$d $(date -u)" > "$IO_DIR/$d/$d.meta"; done
          for i in $(seq 1 10); do
            echo "system $i $(date -u)" > "$IO_DIR/system/config$i.conf"
            echo "disk   $i $(date -u)" > "$IO_DIR/disk/disk$i.info"
            echo "ctr    $i $(date -u)" > "$IO_DIR/container/ctr$i.cfg"
            echo "image  $i $(date -u)" > "$IO_DIR/image/img$i.meta"
          done
          ECHO "seeds ready" | tee -a "$LOG" || true

      - name: ✍️ I/O write/append/perm (echo)
        env:
          IO_DIR: .github/io
        run: |
          set -Eeuo pipefail; init_echo "io-write"
          echo "$(date -u) write test"  > "$IO_DIR/system/logs/write.log"
          echo "$(date -u) append"     >> "$IO_DIR/system/logs/write.log"
          chmod -R 755 "$IO_DIR" || true
          head -n 2 "$IO_DIR/system/logs/write.log" | sed 's/^/[IO] /' | tee -a "$LOG" || true

      - name: ⚙️ I/O throughput (dd) (echo)
        env:
          IO_DIR: .github/io
        run: |
          set -Eeuo pipefail; init_echo "io-dd"
          dd if=/dev/zero of="$IO_DIR/disk/dd_test.bin" bs=1M count=8 status=none
          sync
          md5sum "$IO_DIR/disk/dd_test.bin" | sed 's/^/[MD5] /' | tee "$IO_DIR/reports/dd_test.md5" | tee -a "$LOG" || true

      - name: 📊 I/O reports (echo)
        env:
          IO_DIR: .github/io
        run: |
          set -Eeuo pipefail; init_echo "io-reports"
          du -ah "$IO_DIR" | sort -hr | head -n 50 > "$IO_DIR/reports/top_files.txt" || true
          du -sh "$IO_DIR" > "$IO_DIR/reports/total_size.txt" || true
          { echo "# uname"; uname -a; echo "# df -h"; df -h; echo "# mount (head)"; mount | head -n 50; } > "$IO_DIR/reports/system_snapshot.txt"
          ECHO "reports ready" | tee -a "$LOG" || true

      - name: 📦 I/O bundle (echo)
        env:
          IO_DIR: .github/io
        run: |
          set -Eeuo pipefail; init_echo "io-bundle"
          TS="$(date -u +%Y%m%d%H%M%S)"
          BUNDLE="$IO_DIR/bundle/io-$TS.tar.gz"
          tar -czf "$BUNDLE" -C "$IO_DIR" system disk container image reports
          sha256sum "$BUNDLE" > "$BUNDLE".sha256
          ECHO "bundle=$BUNDLE" | tee -a "$LOG" || true

      - name: 🌐 I/O pages (echo)
        env:
          IO_DIR: .github/io
        run: |
          set -Eeuo pipefail; init_echo "io-pages"
          mkdir -p "$PAGES_DIR/io"
          cp -r "$IO_DIR/reports" "$PAGES_DIR/io/" 2>/dev/null || true
          cat > "$PAGES_DIR/io/index.html" <<'HTML'
          <!DOCTYPE html><meta charset="utf-8">
          <title>Filesystem I/O Reports</title>
          <h1>Filesystem I/O Reports</h1>
          <ul>
            <li><a href="reports/top_files.txt">Top Files</a></li>
            <li><a href="reports/total_size.txt">Total Size</a></li>
            <li><a href="reports/system_snapshot.txt">System Snapshot</a></li>
            <li><a href="../security_reports/">Security Reports</a></li>
          </ul>
          HTML
          ECHO "io pages ready" | tee -a "$LOG" || true

      # ---------- Service Resource Files ----------
      - name: 🧩 Generate service resources (echo)
        env:
          RES_DIR: .github/resources
        run: |
          set -Eeuo pipefail; init_echo "resources-gen"
          mkdir -p "$RES_DIR"/{env,app,docker,k8s,systemd,cron,docs}
          cat > "$RES_DIR/env/.env.example" <<'ENV'
          APP_ENV=production
          APP_PORT=8080
          LOG_LEVEL=INFO
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=appdb
          DB_USER=appuser
          DB_PASS=change_me
          JWT_SECRET=replace_with_strong_secret
          ENV
          cat > "$RES_DIR/app/application.yaml" <<'YAML'
          server:
            port: ${APP_PORT:8080}
          logging:
            level:
              root: ${LOG_LEVEL:INFO}
          spring:
            application:
              name: springboot-service
            datasource:
              url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appdb}
              username: ${DB_USER:appuser}
              password: ${DB_PASS:change_me}
          management:
            endpoints:
              web:
                exposure:
                  include: health,info,metrics,loggers,threaddump,heapdump
          YAML
          cat > "$RES_DIR/docker/docker-compose.override.yml" <<'YML'
          services:
            app:
              image: workflow-image:ci
              env_file: [ ../env/.env.example ]
              ports: [ "${APP_PORT:-8080}:8080" ]
              depends_on: [ db ]
            db:
              image: postgres:16-alpine
              environment:
                POSTGRES_DB: ${DB_NAME:-appdb}
                POSTGRES_USER: ${DB_USER:-appuser}
                POSTGRES_PASSWORD: ${DB_PASS:-change_me}
              volumes: [ db_data:/var/lib/postgresql/data ]
          volumes: { db_data: {} }
          YML
          cat > "$RES_DIR/k8s/deployment.yaml" <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata: { name: springboot-deploy, labels: { app: springboot-service } }
          spec:
            replicas: 2
            selector: { matchLabels: { app: springboot-service } }
            template:
              metadata: { labels: { app: springboot-service } }
              spec:
                containers:
                  - name: app
                    image: ghcr.io/OWNER/REPO/workflow-image:latest
                    ports: [ { containerPort: 8080 } ]
                    envFrom: [ { configMapRef: { name: springboot-config } } ]
                    readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
                    livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: 8080 }, initialDelaySeconds: 20, periodSeconds: 20 }
          YAML
          cat > "$RES_DIR/k8s/service.yaml" <<'YAML'
          apiVersion: v1
          kind: Service
          metadata: { name: springboot-svc }
          spec:
            type: ClusterIP
            selector: { app: springboot-service }
            ports: [ { name: http, port: 80, targetPort: 8080 } ]
          YAML
          cat > "$RES_DIR/k8s/configmap.yaml" <<'YAML'
          apiVersion: v1
          kind: ConfigMap
          metadata: { name: springboot-config }
          data:
            APP_PORT: "8080"
            LOG_LEVEL: "INFO"
          YAML
          cat > "$RES_DIR/systemd/springboot.service" <<'UNIT'
          [Unit]
          Description=Spring Boot Service
          After=network.target
          [Service]
          EnvironmentFile=/etc/springboot/.env
          ExecStart=/usr/bin/java -jar /opt/springboot/app.jar --spring.config.location=/etc/springboot/application.yaml
          User=spring
          Restart=always
          RestartSec=5s
          LimitNOFILE=65536
          [Install]
          WantedBy=multi-user.target
          UNIT
          cat > "$RES_DIR/cron/rotate-logs.cron" <<'CRON'
          10 0 * * * /usr/sbin/logrotate -f /etc/logrotate.d/springboot
          CRON
          cat > "$RES_DIR/docs/README_RESOURCES.md" <<'MD'
          Auto-generated service resources (env/app/docker/k8s/systemd/cron). Do NOT commit secrets.
          MD
          (cd "$RES_DIR" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RES_DIR/RESOURCES.SHA256"
          ECHO "resources generated" | tee -a "$LOG" || true

      - name: 🧪 Validate resources (echo)
        env:
          RES_DIR: .github/resources
        run: |
          set -Eeuo pipefail; init_echo "resources-validate"
          python3 -m pip install --user pyyaml >/dev/null 2>&1 || true
          python3 - <<'PY' || true
          import os, sys
          try:
              import yaml
          except Exception:
              sys.exit(0)
          base = ".github/resources"; ok=True
          for root,_,files in os.walk(base):
              for f in files:
                  if f.endswith(('.yml','.yaml')):
                      p=os.path.join(root,f)
                      try: yaml.safe_load(open(p,'r',encoding='utf-8').read())
                      except Exception as e: ok=False; print("[YAML ERROR]",p,e)
          sys.exit(0 if ok else 1)
          PY
          for f in env/.env.example app/application.yaml docker/docker-compose.override.yml k8s/deployment.yaml k8s/service.yaml systemd/springboot.service cron/rotate-logs.cron RESOURCES.SHA256; do
            test -f "$RES_DIR/$f" || { echo "[ERR] missing $f"; exit 1; }
          done
          ECHO "resources validated" | tee -a "$LOG" || true

      # ---------- Trivy ----------
      - name: 💾 Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ env.CACHE_VERSION }}
          restore-keys: trivy-db-

      - name: 📥 Install Trivy (echo)
        continue-on-error: true
        run: |
          set -Eeuo pipefail; init_echo "trivy-install"
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin || exit 0
          trivy --version | tee -a "$LOG" || true

      - name: 🔎 Trivy → SARIF (echo)
        continue-on-error: true
        run: |
          set -Eeuo pipefail; init_echo "trivy-sarif"
          if command -v trivy >/dev/null 2>&1; then
            trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --format sarif --output "$REPORT_DIR/trivy-image.sarif" workflow-image:ci
          else
            echo '{"runs":[]}' > "$REPORT_DIR/trivy-image.sarif"
          fi
          ECHO "sarif ready" | tee -a "$LOG" || true

      - name: ⏫ Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .github/security_reports/trivy-image.sarif
        continue-on-error: true

      - name: 🧾 Trivy → JSON/TXT + Pages (echo)
        continue-on-error: true
        run: |
          set -Eeuo pipefail; init_echo "trivy-pages"
          if command -v trivy >/dev/null 2>&1; then
            trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --format json --output "$REPORT_DIR/trivy-image.json" workflow-image:ci || echo '{}' > "$REPORT_DIR/trivy-image.json"
            trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --format table workflow-image:ci | tee "$REPORT_DIR/trivy-image.txt" | tee -a "$LOG" || true
          else
            echo '{}' > "$REPORT_DIR/trivy-image.json"
            echo 'Trivy not installed' > "$REPORT_DIR/trivy-image.txt"
          fi
          cat > "$PAGES_DIR/trivy.html" <<'HTML'
          <!DOCTYPE html><meta charset="utf-8">
          <title>Trivy Report</title>
          <h1>Trivy Report (HIGH/CRITICAL)</h1>
          <h2>Table</h2><pre id="tbl"></pre>
          <h2>JSON (raw)</h2><pre id="json"></pre>
          <script>
          fetch('../security_reports/trivy-image.txt').then(r=>r.text()).then(t=>document.getElementById('tbl').textContent=t);
          fetch('../security_reports/trivy-image.json').then(r=>r.text()).then(t=>document.getElementById('json').textContent=t);
          </script>
          HTML
          ECHO "trivy pages ready" | tee -a "$LOG" || true

      # ---------- SBOM ----------
      - name: 📥 Install Syft (SBOM) (echo)
        continue-on-error: true
        run: |
          set -Eeuo pipefail; init_echo "syft-install"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin || exit 0
          syft version | tee -a "$LOG" || true

      - name: 🧾 Generate SBOM (SPDX) (echo)
        continue-on-error: true
        run: |
          set -Eeuo pipefail; init_echo "syft-sbom"
          if command -v syft >/dev/null 2>&1; then
            syft packages workflow-image:ci -o spdx-json > "$SBOM_DIR/sbom.spdx.json"
          else
            echo '{"spdxVersion":"SPDX-2.3","packages":[]}' > "$SBOM_DIR/sbom.spdx.json"
          fi
          cp "$SBOM_DIR/sbom.spdx.json" "$PAGES_DIR/sbom.spdx.json" || true
          ECHO "sbom ready" | tee -a "$LOG" || true

      # ---------- Scorecard (Install + JSON Page) ----------
      - name: 📥 Install Scorecard (echo)
        run: |
          set -Eeuo pipefail; init_echo "scorecard-install"
          VER="4.13.3"; INSTALL="/usr/local/bin"; TMP="$(mktemp -d)"; cd "$TMP"
          BASE="https://github.com/ossf/scorecard/releases/download/v${VER}"
          ECHO "download ${BASE}"
          curl -sSfL --retry 5 --retry-delay 2 -o scorecard.tgz "${BASE}/scorecard_${VER}_linux_amd64.tar.gz" || true
          curl -sSfL --retry 5 --retry-delay 2 -o checksums.txt "${BASE}/scorecard_${VER}_checksums.txt" || true
          if [ -s scorecard.tgz ] && [ -s checksums.txt ]; then
            SUM_LINE="$(grep 'scorecard_'"${VER}"'_linux_amd64.tar.gz' checksums.txt || true)"
            if [ -n "$SUM_LINE" ]; then
              EXPECTED="$(echo "$SUM_LINE" | awk '{print $1}')"; ACTUAL="$(sha256sum scorecard.tgz | awk '{print $1}')"
              if [ "$EXPECTED" = "$ACTUAL" ]; then
                tar -xzf scorecard.tgz || true
                if [ -x "scorecard_${VER}_linux_amd64/scorecard" ]; then sudo mv "scorecard_${VER}_linux_amd64/scorecard" "$INSTALL/scorecard"; fi
              else ECHO "checksum mismatch -> skip native" | tee -a "$LOG" || true; fi
            fi
          fi
          if ! command -v scorecard >/dev/null 2>&1; then
            ECHO "using docker fallback (GHCR)" | tee -a "$LOG" || true
            sudo bash -c 'cat > /usr/local/bin/scorecard <<EOF
            #!/usr/bin/env bash
            exec docker run --rm -e GITHUB_AUTH_TOKEN="${GITHUB_TOKEN}" ghcr.io/ossf/scorecard:stable "$@"
            EOF'
            sudo chmod +x /usr/local/bin/scorecard
            docker pull ghcr.io/ossf/scorecard:stable || true
          fi
          command -v scorecard && scorecard version | sed 's/^/[SCORECARD] /' | tee -a "$LOG" || true

      - name: 🧪 Scorecard JSON + Pages (echo)
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail; init_echo "scorecard-pages"
          if command -v scorecard >/dev/null 2>&1; then
            scorecard --repo "github.com/${GH_REPO}" --format=json > "$REPORT_DIR/scorecard.json" || echo '{}' > "$REPORT_DIR/scorecard.json"
          else
            echo '{}' > "$REPORT_DIR/scorecard.json"
          fi
          cat > "$PAGES_DIR/scorecard.html" <<'HTML'
          <!DOCTYPE html><meta charset="utf-8">
          <title>OSSF Scorecard Summary</title>
          <h1>OSSF Scorecard Summary</h1>
          <div id="summary">Loading...</div>
          <script>
          fetch('../security_reports/scorecard.json').then(r=>r.json()).then(j=>{
            function row(n,v){return `<tr><td><b>${n}</b></td><td>${v??''}</td></tr>`}
            let out = '<table border="1" cellpadding="6" cellspacing="0">';
            const checks = (j.checks||[]).reduce((acc,c)=>{acc[c.name]=c;return acc;}, {});
            const key = n => checks[n]?.score;
            out += row('Maintained', key('Maintained'));
            out += row('Binary-Artifacts', key('Binary-Artifacts'));
            out += row('Branch-Protection', key('Branch-Protection'));
            out += row('Code-Review', key('Code-Review'));
            out += row('Dangerous-Workflow', key('Dangerous-Workflow'));
            out += row('Dependency-Update-Tool', key('Dependency-Update-Tool'));
            out += row('Pinned-Dependencies', key('Pinned-Dependencies'));
            out += row('Security-Policy', key('Security-Policy'));
            out += row('Signed-Releases', key('Signed-Releases'));
            out += row('Token-Permissions', key('Token-Permissions'));
            out += '</table>';
            document.getElementById('summary').innerHTML = out;
          }).catch(()=>{document.getElementById('summary').textContent='No data';});
          </script>
          HTML
          ECHO "scorecard pages ready" | tee -a "$LOG" || true

      # ---------- Scorecard SARIF (GCR 비의존) ----------
      - name: 🧰 Scorecard SARIF via CLI (no GCR) (echo)
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set -Eeuo pipefail; init_echo "scorecard-sarif-cli"
          mkdir -p "$REPORT_DIR"
          try_scorecard() {
            local attempt="$1"
            ECHO "scorecard attempt ${attempt}"
            if command -v scorecard >/dev/null 2>&1; then
              scorecard --repo "github.com/${GH_REPO}" \
                        --format sarif \
                        --show-details \
                        --policy github \
                        --enable-scorecard-endpoints \
                        --commit-depth 0 \
                        > "$REPORT_DIR/scorecard.sarif"
            else
              docker run --rm \
                -e GITHUB_AUTH_TOKEN="${GITHUB_TOKEN}" \
                ghcr.io/ossf/scorecard:stable \
                --repo "github.com/${GH_REPO}" \
                --format sarif \
                --show-details \
                --policy github \
                --enable-scorecard-endpoints \
                --commit-depth 0 \
                > "$REPORT_DIR/scorecard.sarif"
            fi
          }
          n=0; rc=1
          until [ $n -ge 3 ]; do
            if try_scorecard "$((n+1))"; then rc=0; break; fi
            n=$((n+1))
            sleep $(( 5 * n ))
          done
          if [ $rc -ne 0 ]; then
            ECHO "scorecard sarif generation failed, writing empty SARIF"
            echo '{"runs":[]}' > "$REPORT_DIR/scorecard.sarif"
          fi
          ECHO "scorecard sarif ready -> $REPORT_DIR/scorecard.sarif"

      - name: ⏫ Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .github/security_reports/scorecard.sarif
        continue-on-error: true

      # ---------- Dependabot Alerts Snapshot ----------
      - name: 🛡️ Dependabot Alerts → JSON/CSV/HTML (echo)
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail; init_echo "dependabot-alerts"
          mkdir -p "$REPORT_DIR" "$PAGES_DIR"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GH_REPO}/dependabot/alerts?per_page=100&state=open" \
            > "$REPORT_DIR/dependabot-alerts.json" || echo '[]' > "$REPORT_DIR/dependabot-alerts.json"

          python3 - <<'PY'
          import json, csv, os
          rpt=os.environ.get("REPORT_DIR",".github/security_reports")
          pages=os.environ.get("PAGES_DIR",".github/pages")
          data=json.load(open(os.path.join(rpt,"dependabot-alerts.json"),"r",encoding="utf-8"))
          with open(os.path.join(rpt,"dependabot-alerts.csv"),"w",newline="",encoding="utf-8") as f:
              w=csv.writer(f)
              w.writerow(["number","state","dependency","manifest","ecosystem","severity","cve_ids","ghsa_id","fixed_in","created_at","updated_at","url"])
              for a in data:
                  dep=a.get("dependency",{}) or {}
                  sec=a.get("security_advisory",{}) or {}
                  sev=(sec.get("severity") or a.get("severity") or "").upper()
                  cves=";".join([id.get("value","") for id in (sec.get("identifiers") or []) if id.get("type")=="CVE"])
                  fixed=";".join(a.get("fixed_in",[]) or [])
                  w.writerow([a.get("number"), a.get("state"),
                    dep.get("package",{}).get("name",""), dep.get("manifest_path",""),
                    dep.get("package",{}).get("ecosystem",""),
                    sev, cves, sec.get("ghsa_id",""), fixed,
                    a.get("created_at",""), a.get("updated_at",""),
                    a.get("html_url","")])
          PY

          cat > "$PAGES_DIR/dependabot.html" <<'HTML'
          <!DOCTYPE html><meta charset="utf-8">
          <title>Dependabot Alerts</title>
          <h1>Dependabot Alerts (Open)</h1>
          <table border="1" cellpadding="6" cellspacing="0" id="tbl"></table>
          <script>
          fetch('security_reports/dependabot-alerts.json').then(r=>r.json()).then(js=>{
            const head=['#','State','Dependency','Manifest','Ecosystem','Severity','CVE','GHSA','Fixed In','Created','Updated','URL'];
            const rows=(js||[]).map(a=>{
              const dep=a.dependency||{}, pkg=(dep.package||{}).name||'';
              const eco=(dep.package||{}).ecosystem||'';
              const sec=a.security_advisory||{};
              const cves=(sec.identifiers||[]).filter(i=>i.type==='CVE').map(i=>i.value).join(';');
              const fixed=(a.fixed_in||[]).join(';');
              const sev=(sec.severity || a.severity || '').toUpperCase();
              return [a.number, a.state, pkg, dep.manifest_path||'', eco, sev, cves, sec.ghsa_id||'', fixed, a.created_at||'', a.updated_at||'', a.html_url||''];
            });
            const html=['<thead><tr>'+head.map(h=>`<th>${h}</th>`).join('')+'</tr></thead>',
                        '<tbody>'+rows.map(r=>'<tr>'+r.map((x,i)=>{
                          if(i===11 && x) return `<td><a href="${x}" target="_blank">link</a></td>`;
                          return `<td>${(x??'').toString().replace(/</g,'&lt;')}</td>`;
                        }).join('')+'</tr>').join('')+'</tbody>'].join('');
            document.getElementById('tbl').innerHTML=html;
          }).catch(()=>{document.getElementById('tbl').innerHTML='<tbody><tr><td>No data</td></tr></tbody>'});
          </script>
          HTML
          ECHO "dependabot alerts snapshot ready" | tee -a "$LOG" || true

      # ---------- Anomaly & FDS (Aggressive Columns + CSV/HTML/Score) ----------
      - name: 🧠 Anomaly/FDS + Aggressive Columns (CSV/HTML/Score) (echo)
        run: |
          set -Eeuo pipefail; init_echo "anomaly-fds-aggressive"
          mkdir -p "$REPORT_DIR" "$PAGES_DIR"
          python3 - <<'PY'
          import os, re, json, csv, math, time
          rpt   = os.environ.get("REPORT_DIR",".github/security_reports")
          pages = os.environ.get("PAGES_DIR",".github/pages")
          os.makedirs(rpt, exist_ok=True); os.makedirs(pages, exist_ok=True)
          def read_json(p, default):
              try:
                  with open(p,"r",encoding="utf-8") as f: return json.load(f)
              except Exception: return default
          def shannon_entropy(s):
              if not s or len(s) < 20: return 0.0
              from collections import Counter
              c = Counter(s); n = len(s)
              return -sum((cnt/n)*math.log2(cnt/n) for cnt in c.values() if cnt>0)

          trivy_json  = read_json(os.path.join(rpt,"trivy-image.json"), {})
          score_json  = read_json(os.path.join(rpt,"scorecard.json"), {})
          sbom_spdx   = read_json(os.path.join(rpt,"sbom.spdx.json"), {"packages":[]})

          # TRIVY CSV
          with open(os.path.join(rpt,"trivy-image.csv"),"w",newline="",encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["Target","Type","PkgName","InstalledVersion","FixedVersion","Severity","VulnerabilityID","Title","PrimaryURL","PublishedDate","LastModifiedDate"])
              for res in trivy_json.get("Results",[]) or []:
                  target, typ = res.get("Target",""), res.get("Type","")
                  for v in res.get("Vulnerabilities",[]) or []:
                      w.writerow([target,typ,v.get("PkgName",""),v.get("InstalledVersion",""),v.get("FixedVersion",""),
                                  v.get("Severity",""),v.get("VulnerabilityID",""),v.get("Title",""),v.get("PrimaryURL",""),
                                  v.get("PublishedDate",""),v.get("LastModifiedDate","")])

          # SCORECARD CSV
          with open(os.path.join(rpt,"scorecard.csv"),"w",newline="",encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["CheckName","Score","Reason","DocumentationURL","DetailsCount"])
              for c in score_json.get("checks",[]) or []:
                  w.writerow([c.get("name",""),c.get("score",""),c.get("reason",""),
                              (c.get("documentation",{}) or {}).get("url",""),len(c.get("details",[]) or [])])

          # SBOM CSV
          with open(os.path.join(rpt,"sbom-packages.csv"),"w",newline="",encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["Name","Version","Supplier","DownloadLocation","LicenseConcluded","LicenseDeclared","Originator","ExternalRefs"])
              for p in sbom_spdx.get("packages",[]) or []:
                  ex = ";".join(["{}:{}:{}".format(x.get("referenceCategory",""),x.get("referenceType",""),x.get("referenceLocator","")) for x in p.get("externalRefs",[]) or []])
                  w.writerow([p.get("name",""),p.get("versionInfo",""),p.get("supplier",""),p.get("downloadLocation",""),
                              p.get("licenseConcluded",""),p.get("licenseDeclared",""),p.get("originator",""),ex])

          # FDS(패턴+엔트로피)
          secret_patterns = [
              r'(?i)api[_-]?key\s*[:=]\s*[\'"]?([A-Za-z0-9_\-]{16,})',
              r'(?i)secret[_-]?key\s*[:=]\s*[\'"]?([A-Za-z0-9_\-]{16,})',
              r'(?i)aws[_-]?access[_-]?key[_-]?id\s*[:=]\s*[\'"]?([A-Z0-9]{16,})',
              r'(?i)aws[_-]?secret[_-]?access[_-]?key\s*[:=]\s*[\'"]?([A-Za-z0-9/+=]{32,})',
              r'(?i)ghp_[A-Za-z0-9]{20,}',
              r'(?i)glpat-[A-Za-z0-9\-]{20,}',
              r'(?i)BEGIN RSA PRIVATE KEY',
              r'(?i)BEGIN OPENSSH PRIVATE KEY',
              r'(?i)xox[baprs]-[A-Za-z0-9-]{20,}',
          ]
          secret_re = re.compile("|".join(secret_patterns))
          fds_findings = []
          for root,_,files in os.walk(".", topdown=True):
              if root.startswith("./.git") or root.startswith("./.github/pages") or "/node_modules" in root: continue
              for fn in files:
                  p = os.path.join(root,fn)
                  try:
                      if os.path.getsize(p) > 1024*1024: continue
                      with open(p,"r",errors="ignore") as fh: txt = fh.read()
                      items = []
                      for m in secret_re.finditer(txt):
                          s = m.group(0); ent = shannon_entropy(s)
                          items.append({"indicator":"pattern","snippet":s[:80],"entropy":round(ent,2)})
                      for m in re.finditer(r'[A-Za-z0-9/+_=.-]{24,}', txt):
                          s = m.group(0); ent = shannon_entropy(s)
                          if ent >= 4.0:
                              items.append({"indicator":"entropy>=4.0","snippet":s[:80],"entropy":round(ent,2)})
                      if items: fds_findings.append({"file":p, "hits":items[:10]})
                  except Exception:
                      pass

          with open(os.path.join(rpt,"fds_report.json"),"w",encoding="utf-8") as f:
              json.dump({"generated_at": int(time.time()), "findings": fds_findings[:100]}, f, indent=2)

          # ANOMALY + RISK
          high_crit = 0
          for res in trivy_json.get("Results",[]) or []:
              for v in res.get("Vulnerabilities",[]) or []:
                  if v.get("Severity") in ("HIGH","CRITICAL"): high_crit += 1
          checks = { c.get("name"): c.get("score") for c in (score_json.get("checks",[]) or []) }
          anomalies = []
          if high_crit >= 10: anomalies.append({"type":"vuln_highcrit_10p","level":"warning","value":high_crit})
          if high_crit >= 50: anomalies.append({"type":"vuln_highcrit_50p","level":"critical","value":high_crit})
          if checks.get("Token-Permissions") is not None and checks["Token-Permissions"] < 5:
              anomalies.append({"type":"token_perms_low","level":"warning","value":checks["Token-Permissions"]})
          if checks.get("Branch-Protection") is not None and checks["Branch-Protection"] < 5:
              anomalies.append({"type":"branch_protection_low","level":"warning","value":checks["Branch-Protection"]})
          if fds_findings:
              anomalies.append({"type":"fds_hits","level":"warning","value":len(fds_findings)})

          risk = 0
          risk += min(high_crit, 200) * 0.5
          if checks.get("Token-Permissions") is not None: risk += (10 - checks["Token-Permissions"]) * 3
          if checks.get("Branch-Protection") is not None: risk += (10 - checks["Branch-Protection"]) * 4
          risk += min(len(fds_findings), 200) * 1.5
          risk_level = "low"
          if risk >= 50: risk_level = "medium"
          if risk >= 120: risk_level = "high"
          if risk >= 200: risk_level = "critical"
          with open(os.path.join(rpt,"anomaly_report.json"),"w",encoding="utf-8") as f:
              json.dump({"generated_at": int(time.time()),"vuln_high_critical": high_crit,
                         "score_checks": checks,"risk_score": round(risk,2),
                         "risk_level": risk_level,"anomalies": anomalies}, f, indent=2)

          # ADVANCED HTMLs (간단 버전)
          open(os.path.join(pages,"anomaly-adv.html"),"w",encoding="utf-8").write("""<!DOCTYPE html><meta charset="utf-8">
          <title>Anomaly — Advanced</title><h1>Anomaly — Advanced</h1><div id="info"></div>
          <table border="1" cellpadding="6" cellspacing="0" id="an"></table>
          <script>
          fetch('security_reports/anomaly_report.json').then(r=>r.json()).then(j=>{
            document.getElementById('info').innerHTML=`<p><b>Risk Score:</b> ${j.risk_score||0} &nbsp; <b>Level:</b> ${j.risk_level||'low'} &nbsp; <b>Vuln(H/C):</b> ${j.vuln_high_critical||0}</p>`;
            const a=j.anomalies||[]; const head=['Type','Level','Value','Threshold'];
            const rows=a.map(x=>[x.type||'', x.level||'', (x.value??''), (x.threshold??'')]);
            const html=['<thead><tr>'+head.map(h=>`<th>${h}</th>`).join('')+'</tr></thead>','<tbody>'+rows.map(r=>'<tr>'+r.map(x=>`<td>${x??''}</td>`).join('')+'</tr>').join('')+'</tbody>'].join('');
            document.getElementById('an').innerHTML=html;
          }).catch(()=>{document.getElementById('an').innerHTML='<tbody><tr><td>No data</td></tr></tbody>'});
          </script>""")
          PY
          ECHO "aggressive CSV/HTML dashboards ready" | tee -a "$LOG" || true

      - name: 📦 Assemble Pages bundle (echo)
        run: |
          set -Eeuo pipefail; init_echo "pages-assemble"
          mkdir -p "$PAGES_DIR/security_reports" "$PAGES_DIR/resources" "$PAGES_DIR/io"
          cp -r .github/security_reports/* "$PAGES_DIR/security_reports/" 2>/dev/null || true
          cp -r .github/resources/*        "$PAGES_DIR/resources/"        2>/dev/null || true
          cp -r .github/io/reports         "$PAGES_DIR/io/"               2>/dev/null || true
          cat > "$PAGES_DIR/index.html" <<'HTML'
          <!DOCTYPE html><meta charset="utf-8">
          <title>Reports Portal</title>
          <h1>Reports Portal</h1>
          <ul>
            <li><a href="trivy.html">Trivy Report (HIGH/CRITICAL)</a></li>
            <li><a href="scorecard.html">OSSF Scorecard Summary</a></li>
            <li><a href="anomaly.html">Anomaly Report</a></li>
            <li><a href="fds.html">FDS Report</a></li>
            <li><a href="security_reports/">Raw Security Files (JSON/TXT/SARIF/CSV)</a></li>
            <li><a href="io/">Filesystem I/O Reports</a></li>
            <li><a href="resources/">Service Resources</a></li>
            <li><a href="sbom.spdx.json">SBOM (SPDX)</a></li>
            <li><a href="anomaly-adv.html">Anomaly — Advanced</a></li>
            <li><a href="dependabot.html">Dependabot Alerts</a></li>
            <li><a href="last_run.txt">Last Run Timestamp</a></li>
          </ul>
          HTML
          echo "$(date -u +'%F %T %Z')" > "$PAGES_DIR/last_run.txt"
          cat > "$PAGES_DIR/404.html" <<'HTML'
          <!DOCTYPE html><meta charset="utf-8">
          <title>404 Not Found</title>
          <h1>Not Found</h1><p>이 페이지는 존재하지 않습니다. 홈으로 이동하세요.</p>
          <a href="./index.html">Home</a>
          HTML
          printf "User-agent: *\nAllow: /\n" > "$PAGES_DIR/robots.txt"
          cat > "$PAGES_DIR/sitemap.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>/index.html</loc></url>
            <url><loc>/trivy.html</loc></url>
            <url><loc>/scorecard.html</loc></url>
            <url><loc>/anomaly.html</loc></url>
            <url><loc>/fds.html</loc></url>
            <url><loc>/dependabot.html</loc></url>
            <url><loc>/anomaly-adv.html</loc></url>
          </urlset>
          XML
          echo "ok" > "$PAGES_DIR/healthcheck.txt"
          for f in index.html scorecard.html trivy.html anomaly.html fds.html dependabot.html anomaly-adv.html last_run.txt; do
            test -e "$PAGES_DIR/$f" || { ECHO "[ERR] missing $f"; exit 1; }
          done
          ECHO "pages bundle ready" | tee -a "$LOG" || true
          (cd "$PAGES_DIR" && find . -maxdepth 2 -print) | sed 's/^/[PAGES] /' | tee -a "$LOG" || true

      - name: ⬆️ Upload Pages Artifact (authoritative)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages

      - name: 📦 Upload artifacts (echo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-logs-and-reports
          path: |
            .github/echo_logs/account-rotation.log
            .github/artifacts/workflow-image-arm64.tar
            .github/security_reports/*
            .github/pages/sbom.spdx.json
          retention-days: 14

      - name: 🧾 Job summary (echo)
        if: always()
        run: |
          set -Eeuo pipefail; init_echo "summary"
          {
            echo "## ✅ SecSuite Run Summary"
            echo "- Home: index.html (Pages artifact)"
            echo "- Trivy: trivy-image.json → trivy.html"
            echo "- Scorecard(JSON): scorecard.json → scorecard.html"
            echo "- Scorecard(SARIF): scorecard.sarif (uploaded)"
            echo "- Dependabot: dependabot-alerts.json/csv → dependabot.html"
            echo "- Anomaly/FDS: anomaly_report.json / fds_report.json → anomaly-adv.html"
            echo "- SBOM (SPDX): sbom.spdx.json"
            echo "- IO Reports: io/"
            echo "- Resources: resources/"
          } >> "$GITHUB_STEP_SUMMARY"
          ECHO "summary written" | tee -a "$LOG" || true

      - name: 🤖 Bot heartbeat commit (+ PR, skip-ci) (echo)
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail; init_echo "bot-heartbeat"
          GH_TOKEN="${WORKFLOW_PAT:-${GITHUB_TOKEN:-}}"
          export GH_TOKEN GITHUB_TOKEN
          DEFAULT_BRANCH="$(git remote show origin 2>/dev/null | sed -n 's/^\s*HEAD branch: //p')"
          [ -n "$DEFAULT_BRANCH" ] || DEFAULT_BRANCH="main"
          mkdir -p .github/bot .github/pages
          TS="$(date -u +'%F %T %Z')"
          echo "$TS" > .github/bot/heartbeat.txt
          echo "$TS" > .github/pages/last_run.txt
          BR="bot/heartbeat-$(date -u +%Y%m%d%H%M)"
          git config user.name  "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"
          git fetch origin "$DEFAULT_BRANCH" --depth=1 || true
          git checkout -B "$BR" "origin/$DEFAULT_BRANCH" 2>/dev/null || git checkout -B "$BR" "$DEFAULT_BRANCH"
          git add .github/bot/heartbeat.txt .github/pages/last_run.txt || true
          git commit -m "🤖 bot: heartbeat $TS [skip ci]" || exit 0
          git push -u origin "$BR" || exit 0
          if command -v gh >/dev/null 2>&1 && [ -n "${GH_TOKEN:-}" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$BR" \
              --title "🤖 bot: heartbeat $TS" \
              --body "자동 하트비트 갱신 및 Pages 타임스탬프 업데이트 ($TS)." || true
          fi

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4
      - name: 🛠 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ env.CODEQL_LANGUAGES }}
          queries: +security-and-quality
      - name: 🔧 Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: 🔎 Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ env.CODEQL_LANGUAGES }}"

  deploy-pages:
    needs: [build-test-sec]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages (from artifact)
        id: deployment
        uses: actions/deploy-pages@v4
