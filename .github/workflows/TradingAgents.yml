name: 🧠 TradingAgents Full Setup & Test

on:
  workflow_dispatch:

jobs:
  setup-and-test:
    runs-on: ubuntu-latest

    env:
      CONDA_PKGS_DIR: /home/runner/conda_pkgs_dir
      FINNHUB_API_KEY: dummy_key
      OPENAI_API_KEY: dummy_key

    steps:
      - name: 📦 Checkout source
        uses: actions/checkout@v4

      - name: 🐍 Install Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Mambaforge
          python-version: 3.10
          environment-name: tradingagents
          activate-environment: tradingagents
          auto-update-conda: true
          auto-activate-base: false

      - name: 🏗️ Step 1:Create directories
        shell: bash
        run: |
          echo "[📁] Creating directories..."
          mkdir -p logs output site scripts/tradingagents/graph scripts/tests
          touch logs/.keep
          echo "[✅] Directories created"

      - name: 📄 Step 2:Generate fallback requirements.txt
        shell: bash
        run: |
          echo "[📄] Checking for requirements.txt..."
          if curl -sSfL -o requirements.txt https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/requirements.txt; then
            echo "[✅] Downloaded requirements.txt"
          else
            echo "[⚠️] Download failed - generating fallback requirements.txt"
            echo 'openai' > requirements.txt
            echo 'finnhub-python' >> requirements.txt
            echo 'langgraph' >> requirements.txt
            echo "[📄] Final content:"
            cat requirements.txt
          fi

      - name: 📄 Step 3:Generate fallback Python file
        shell: bash
        run: |
          echo "[📄] Checking for run_tradingagents.py..."
          if curl -sSfL -o run_tradingagents.py https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/run_tradingagents.py; then
            echo "[✅] Downloaded run_tradingagents.py"
          else
            echo "[⚠️] Download failed - creating fallback run_tradingagents.py"
            echo 'print("[🧠] STEP 1: Importing modules...")' > run_tradingagents.py
            echo 'try:' >> run_tradingagents.py
            echo '    from tradingagents.graph.trading_graph import TradingAgentsGraph' >> run_tradingagents.py
            echo '    from tradingagents.default_config import DEFAULT_CONFIG' >> run_tradingagents.py
            echo 'except ImportError as e:' >> run_tradingagents.py
            echo '    print("[❌] Import failed:", e)' >> run_tradingagents.py
            echo '    exit(1)' >> run_tradingagents.py
            echo 'print("[⚙️] STEP 2: Initializing graph...")' >> run_tradingagents.py
            echo 'ta = TradingAgentsGraph(debug=True, config=DEFAULT_CONFIG.copy())' >> run_tradingagents.py
            echo 'print("[📈] STEP 3: Calling propagate()...")' >> run_tradingagents.py
            echo '_, decision = ta.propagate("NVDA", "2024-05-10")' >> run_tradingagents.py
            echo 'print("[💡] STEP 4: Decision result:")' >> run_tradingagents.py
            echo 'print(decision)' >> run_tradingagents.py
            echo "[✅] Fallback script created"
          fi

          echo "[📁] Copying script to tests directory..."
          cp run_tradingagents.py scripts/tests/

      - name: 💾 Step 4:Install pip modules
        shell: bash
        run: |
          echo "============================================"
          echo "[📦] Installing pip modules in Conda env"
          echo "============================================"
          conda run -n tradingagents pip install --upgrade pip
          conda run -n tradingagents pip install -r requirements.txt || echo "[⚠️] pip install failed"

      - name: 📂 Step 5:Install local module (if applicable)
        shell: bash
        run: |
          echo "============================================"
          echo "[📂] Step 5: Local editable install"
          echo "============================================"
          if [ -f setup.py ] || [ -f pyproject.toml ]; then
            conda run -n tradingagents pip install -e . || echo "[⚠️] Local install failed"
          else
            echo "[ℹ️] No setup.py or pyproject.toml - skipping local install"
          fi

      - name: ▶️ Step 6:CLI Help
        shell: bash
        run: |
          echo "============================================"
          echo "[▶️] Step 6: CLI Help"
          echo "============================================"
          conda run -n tradingagents python -m cli.main --help || echo "[⚠️] CLI not found"

      - name: 🧪 Step 7:Run test script
        shell: bash
        run: |
          echo "============================================"
          echo "[🧪] Step 7: Running run_tradingagents.py"
          echo "============================================"
          conda run -n tradingagents python run_tradingagents.py || echo "[❌] Test script failed"
          echo "============================================"
