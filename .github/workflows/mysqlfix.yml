name: 🐬 MySQL 8.x root 복구 + robust_admin + echo/권한 + 가상메일/Postfix (auth_socket 제거, 최신)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  mysql-robust:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Echo/logs/dir robust 생성 및 보안
        run: |
          set -e
          for d in .github/echo .github/logs .github/mysql_bak .github/error_logs; do
            echo "echo 'mkdir -p $d'" ; mkdir -p $d
            echo "echo 'chmod 700 $d'" ; chmod 700 $d
          done

      - name: 🔄 계속 업그레이드 & MySQL/Postfix/mailutils robust 설치
        run: |
          set -e
          echo "echo 'sudo apt-get update -y'" ; sudo apt-get update -y | tee .github/echo/step-01-apt-update.txt
          echo "echo 'sudo apt-get upgrade -y'" ; sudo apt-get upgrade -y | tee .github/echo/step-02-apt-upgrade.txt
          echo "echo 'sudo apt-get dist-upgrade -y'" ; sudo apt-get dist-upgrade -y | tee .github/echo/step-02b-dist-upgrade.txt
          echo "echo 'sudo apt-get install -y --only-upgrade mysql-server postfix mailutils libsasl2-modules'" ; sudo apt-get install -y --only-upgrade mysql-server postfix mailutils libsasl2-modules | tee .github/echo/step-03-apt-upgrade-install.txt
          echo "echo 'sudo apt-get autoremove -y'" ; sudo apt-get autoremove -y | tee .github/echo/step-04-autoremove.txt
          echo "echo 'sudo systemctl daemon-reload'" ; sudo systemctl daemon-reload
          echo "echo 'sudo systemctl restart mysql'" ; sudo systemctl restart mysql || true
          echo "echo 'sudo systemctl restart postfix'" ; sudo systemctl restart postfix || true

      - name: 🚨 root/robust_admin 복구 + 계정/권한 echo 테이블/파일 (auth_socket X, 모두 mysql_native_password)
        run: |
          set -e

          # 0. 디렉토리/소유권 복구
          sudo mkdir -p /var/lib/mysql /var/run/mysqld /var/log/mysql
          sudo chown -R mysql:mysql /var/lib/mysql /var/run/mysqld /var/log/mysql
          sudo chmod 750 /var/lib/mysql
          sudo chmod 770 /var/run/mysqld
          sudo chmod 755 /var/log/mysql

          # 1. 모든 프로세스/소켓/로그 완전 정리
          sudo systemctl stop mysql || true
          sudo pkill -f mysqld || true
          sudo rm -f /var/lib/mysql/*.err /var/lib/mysql/*.pid /var/lib/mysql/*.sock /var/lib/mysql/*.lock /tmp/mysql.sock* /var/run/mysqld/mysqld.sock*
          sudo rm -rf /var/run/mysqld/*

          sudo mkdir -p /var/run/mysqld
          sudo chown mysql:mysql /var/run/mysqld

          # 2. skip-grant-tables 기동 시도(실패시 에러로그 즉시 출력, 재시도)
          for k in 1 2 3; do
            nohup sudo mysqld_safe --skip-grant-tables --skip-networking > .github/logs/mysql_skipgrant.log 2>&1 &
            sleep 8
            if sudo lsof -iTCP:3306 -sTCP:LISTEN || sudo lsof | grep mysqld; then
              break
            fi
            if [ $k -eq 3 ]; then
              cat .github/logs/mysql_skipgrant.log || true
              sudo cat /var/log/mysql/error.log || true
              exit 1
            fi
            sudo pkill -f mysqld || true
            sleep 3
          done
          sleep 3

          # 3. root 권한 복구 SQL 및 echo (auth_socket 대신 mysql_native_password)
          cat <<EOSQL > .github/echo/root-repair.sql
          FLUSH PRIVILEGES;
          CREATE USER IF NOT EXISTS 'root'@'localhost' IDENTIFIED BY 'rootpass123';
          GRANT ALL PRIVILEGES ON *.* TO 'root'@'localhost' WITH GRANT OPTION;
          ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpass123';
          FLUSH PRIVILEGES;
          EOSQL
          echo "sudo mysql --user=root < .github/echo/root-repair.sql" > .github/echo/root-repair.cmd
          sudo mysql --user=root < .github/echo/root-repair.sql || (cat .github/logs/mysql_skipgrant.log || true)

          sudo pkill -f mysqld || true
          sleep 5

          # 4. 런타임 디렉토리/소유권 복구 후 서비스 정상기동(재시도)
          sudo mkdir -p /var/run/mysqld
          sudo chown mysql:mysql /var/run/mysqld
          for i in {1..5}; do
            sudo systemctl start mysql
            sleep 5
            if [ -S /var/run/mysqld/mysqld.sock ]; then
              break
            fi
            if [ $i -eq 5 ]; then
              sudo journalctl -u mysql | tail -30 || true
              sudo cat /var/log/mysql/error.log || true
              exit 1
            fi
          done

          # 5. robust_admin 계정 생성/권한 부여 + echo
          cat <<EOSQL > .github/echo/robust_admin-create.sql
          DROP USER IF EXISTS 'robust_admin'@'localhost';
          DROP USER IF EXISTS 'robust_admin'@'%';
          CREATE USER 'robust_admin'@'localhost' IDENTIFIED BY 'robustpass123';
          CREATE USER 'robust_admin'@'%' IDENTIFIED BY 'robustpass123';
          GRANT ALL PRIVILEGES ON *.* TO 'robust_admin'@'%' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON *.* TO 'robust_admin'@'localhost' WITH GRANT OPTION;
          FLUSH PRIVILEGES;
          EOSQL
          echo "sudo mysql < .github/echo/robust_admin-create.sql" > .github/echo/robust_admin-create.cmd
          sudo mysql < .github/echo/robust_admin-create.sql

          # 6. 계정 목록/권한/이력 echo 테이블/파일 생성
          echo "SHOW GRANTS FOR 'robust_admin'@'%';" > .github/echo/show-grants-robust_admin.sql
          echo "SHOW GRANTS FOR 'robust_admin'@'localhost';" >> .github/echo/show-grants-robust_admin.sql
          echo "SELECT user,host,plugin,account_locked FROM mysql.user;" > .github/echo/show-users.sql
          mysql -u robust_admin -probstpass123 -e "SELECT user,host,plugin,account_locked FROM mysql.user;" > .github/echo/user_list.txt
          mysql -u robust_admin -probstpass123 < .github/echo/show-grants-robust_admin.sql > .github/echo/grants_robust_admin.txt

          # 권한/계정 echo 테이블
          mysql -u robust_admin -probstpass123 -e "
            CREATE DATABASE IF NOT EXISTS echo_info;
            CREATE TABLE IF NOT EXISTS echo_info.account_audit (
              id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
              ts TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              user VARCHAR(64), host VARCHAR(64), plugin VARCHAR(64), grants TEXT
            );
            INSERT INTO echo_info.account_audit (user,host,plugin,grants)
              SELECT user,host,plugin,
                CONCAT_WS('|', (SELECT GROUP_CONCAT(grantor, ':', privilege_type) FROM information_schema.user_privileges WHERE grantee=CONCAT('''', user, '''@''', host, '''')))
              FROM mysql.user;
          " > .github/echo/echo_table_create_and_insert.txt

          # robust_admin 인증 체크(반복)
          for i in 1 2 3 4 5; do
            if mysql -u robust_admin -probstpass123 -e "SELECT 1"; then
              echo "[✔] robust_admin 인증 성공!" | tee -a .github/echo/robust_admin-auth.txt
              break
            else
              echo "[!] robust_admin 인증 실패($i), 4초후 재시도..." | tee -a .github/echo/robust_admin-auth.txt
              sleep 4
            fi
          done

      - name: 📨 MySQL 가상메일 테이블/샘플계정 자동 생성 (robust_admin 계정, echo)
        run: |
          set -e
          cat <<'EOSQL' > .github/echo/virtual_mail_schema.sql
          CREATE DATABASE IF NOT EXISTS mailserver CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          USE mailserver;
          CREATE TABLE IF NOT EXISTS virtual_domains (
            id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
            name VARCHAR(50) NOT NULL UNIQUE
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          CREATE TABLE IF NOT EXISTS virtual_users (
            id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
            domain_id INT NOT NULL,
            password VARCHAR(106) NOT NULL,
            email VARCHAR(100) NOT NULL UNIQUE,
            FOREIGN KEY (domain_id) REFERENCES virtual_domains(id) ON DELETE CASCADE
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          CREATE TABLE IF NOT EXISTS virtual_aliases (
            id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
            domain_id INT NOT NULL,
            source VARCHAR(100) NOT NULL,
            destination VARCHAR(100) NOT NULL,
            FOREIGN KEY (domain_id) REFERENCES virtual_domains(id) ON DELETE CASCADE
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          INSERT IGNORE INTO virtual_domains (name) VALUES ('example.com');
          INSERT IGNORE INTO virtual_users (domain_id, password, email)
            VALUES (
              1,
              '$6$rounds=656000$robustsalt$MJ04ZsU2eWkgR2Q4CjV7GAw74pD6B0WFFR8hyljVEc0ENJPkjQw/YyzJJ0bUowG9/56u6dyKToKPtbnPhsoEx1', -- 'mailpass123'
              'test@example.com'
            );
          INSERT IGNORE INTO virtual_aliases (domain_id, source, destination)
            VALUES (1, 'alias@example.com', 'test@example.com');
          EOSQL

          echo "mysql -u robust_admin -probstpass123 < .github/echo/virtual_mail_schema.sql" > .github/echo/virtual_mail_schema.cmd
          mysql -u robust_admin -probstpass123 < .github/echo/virtual_mail_schema.sql

      - name: 📮 Postfix 가상메일 연동 config/echo/테스트메일 (robust_admin 계정)
        run: |
          set -e
          VMAIL_CONF=".github/echo/postfix-mysql-virtual.cf"
          cat <<'EOF' > $VMAIL_CONF
          user = robust_admin
          password = robustpass123
          hosts = 127.0.0.1
          dbname = mailserver
          query = SELECT email FROM virtual_users WHERE email='%s'
          EOF

          echo "sudo cp .github/echo/postfix-mysql-virtual.cf /etc/postfix/mysql-virtual-mailbox.cf" > .github/echo/postfix-cp-mailbox.cmd
          echo "sudo cp .github/echo/postfix-mysql-virtual.cf /etc/postfix/mysql-virtual-alias.cf" > .github/echo/postfix-cp-alias.cmd
          echo "sudo cp .github/echo/postfix-mysql-virtual.cf /etc/postfix/mysql-virtual-domains.cf" > .github/echo/postfix-cp-domains.cmd

          sudo cp .github/echo/postfix-mysql-virtual.cf /etc/postfix/mysql-virtual-mailbox.cf
          sudo cp .github/echo/postfix-mysql-virtual.cf /etc/postfix/mysql-virtual-alias.cf
          sudo cp .github/echo/postfix-mysql-virtual.cf /etc/postfix/mysql-virtual-domains.cf

          echo "sudo postconf -e \"virtual_mailbox_domains=mysql:/etc/postfix/mysql-virtual-domains.cf\"" > .github/echo/postfixconf-mailbox_domains.cmd
          echo "sudo postconf -e \"virtual_mailbox_maps=mysql:/etc/postfix/mysql-virtual-mailbox.cf\"" > .github/echo/postfixconf-mailbox_maps.cmd
          echo "sudo postconf -e \"virtual_alias_maps=mysql:/etc/postfix/mysql-virtual-alias.cf\"" > .github/echo/postfixconf-alias_maps.cmd

          sudo postconf -e "virtual_mailbox_domains=mysql:/etc/postfix/mysql-virtual-domains.cf"
          sudo postconf -e "virtual_mailbox_maps=mysql:/etc/postfix/mysql-virtual-mailbox.cf"
          sudo postconf -e "virtual_alias_maps=mysql:/etc/postfix/mysql-virtual-alias.cf"

          sudo systemctl restart postfix

          echo "echo \"테스트메일\" | mail -s \"[Test] Virtual Mail\" test@example.com" > .github/echo/step-mail-test.cmd
          echo "테스트메일" | mail -s "[Test] Virtual Mail" test@example.com || true
