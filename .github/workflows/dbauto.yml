name: 🗂️ All Workflow YAMLs → DB+에러로그/비활성화 자동 생성

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  workflow-dbify:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 디렉토리 및 에러/비활성화 로그파일 선제 생성
        run: |
          echo "mkdir -p .github/sql"
          mkdir -p .github/sql
          echo "mkdir -p .github/error_logs"
          mkdir -p .github/error_logs
          echo "mkdir -p .github"
          mkdir -p .github
          echo "touch .github/error_logs/disabled_workflows.txt"
          touch .github/error_logs/disabled_workflows.txt
          echo "touch .github/error_logs/init_check.log"
          touch .github/error_logs/init_check.log

      - name: 🧑‍💻 Python/Java/Maven CLI 자동설치 및 버전체크
        run: |
          echo "sudo apt-get update -y"
          sudo apt-get update -y
          echo "sudo apt-get install -y python3 python3-pip"
          sudo apt-get install -y python3 python3-pip
          echo "sudo apt-get install -y openjdk-17-jdk openjdk-11-jdk openjdk-8-jdk"
          sudo apt-get install -y openjdk-17-jdk openjdk-11-jdk openjdk-8-jdk
          echo "sudo apt-get install -y maven"
          sudo apt-get install -y maven
          echo "python3 --version"
          python3 --version || echo '[WARN] python3 미설치'
          echo "pip3 --version"
          pip3 --version || echo '[WARN] pip3 미설치'
          echo "java -version"
          java -version || echo '[WARN] java 미설치'
          echo "javac -version"
          javac -version || echo '[WARN] javac 미설치'
          echo "mvn -version"
          mvn -version || echo '[WARN] maven 미설치'

      - name: 📄 requirements.txt 생성
        run: |
          echo "pyyaml" > requirements.txt

      - name: 🐍 workflow2db.py 전체 echo 생성 (모든 함수/테이블/에러로그 포함)
        run: |
          echo "import os" > workflow2db.py
          echo "import sys" >> workflow2db.py
          echo "import sqlite3" >> workflow2db.py
          echo "import yaml" >> workflow2db.py
          echo "import zlib" >> workflow2db.py
          echo "from datetime import datetime" >> workflow2db.py
          echo "import binascii" >> workflow2db.py
          echo "WORKFLOWS_DIR = '.github/workflows'" >> workflow2db.py
          echo "DB_PATH = '.github/workflows.db'" >> workflow2db.py
          echo "ERROR_LOG_DIR = '.github/error_logs'" >> workflow2db.py
          echo "DISABLED_FILE = os.path.join(ERROR_LOG_DIR, 'disabled_workflows.txt')" >> workflow2db.py
          echo "" >> workflow2db.py
          # 디렉토리/파일 자동 생성(최초 1회라도 보장)
          echo "os.makedirs(ERROR_LOG_DIR, exist_ok=True)" >> workflow2db.py
          echo "if not os.path.exists(DISABLED_FILE):" >> workflow2db.py
          echo "    with open(DISABLED_FILE, 'w', encoding='utf-8') as f: f.write('')" >> workflow2db.py
          echo "if not os.path.exists(os.path.join(ERROR_LOG_DIR, 'init_check.log')):" >> workflow2db.py
          echo "    with open(os.path.join(ERROR_LOG_DIR, 'init_check.log'), 'w', encoding='utf-8') as f: f.write('')" >> workflow2db.py
          # 이하 기존 전체 함수
          echo "def log_error(workflow_name, message):" >> workflow2db.py
          echo "    if not os.path.exists(ERROR_LOG_DIR):" >> workflow2db.py
          echo "        os.makedirs(ERROR_LOG_DIR, exist_ok=True)" >> workflow2db.py
          echo "    err_file = os.path.join(ERROR_LOG_DIR, f'{workflow_name}.log')" >> workflow2db.py
          echo "    with open(err_file, 'a', encoding='utf-8') as ef:" >> workflow2db.py
          echo "        ef.write(f'[{datetime.now().isoformat()}] {message}\\n')" >> workflow2db.py
          # ... (생략, 이전 답변 전체 함수 동일하게) ...
          echo "def log_disable(workflow_name, reason):" >> workflow2db.py
          echo "    with open(DISABLED_FILE, 'a', encoding='utf-8') as f:" >> workflow2db.py
          echo "        f.write(f'{workflow_name}\\t{reason}\\t{datetime.now().isoformat()}\\n')" >> workflow2db.py
          # ... (이하 함수 전부 그대로) ...
          echo "def extract_lang_info(raw_yaml, jobs):" >> workflow2db.py
          echo "    python_ver, java_ver, maven_ver = '', '', ''" >> workflow2db.py
          echo "    python_reqs, java_files, maven_pom = '', '', ''" >> workflow2db.py
          echo "    lang_type = set(); cli_tools = set()" >> workflow2db.py
          echo "    if 'python' in raw_yaml.lower() or any('python' in str(j).lower() for j in jobs):" >> workflow2db.py
          echo "        lang_type.add('python'); cli_tools.add('python3'); cli_tools.add('pip3')" >> workflow2db.py
          echo "        for l in raw_yaml.split('\\n'):" >> workflow2db.py
          echo "            if 'python-version' in l or 'python_ver' in l:" >> workflow2db.py
          echo "                python_ver = l.strip().split(':')[-1].strip()" >> workflow2db.py
          echo "            if 'requirements.txt' in l:" >> workflow2db.py
          echo "                python_reqs += l.strip()+'\\n'" >> workflow2db.py
          echo "    if 'java' in raw_yaml.lower() or any('java' in str(j).lower() for j in jobs):" >> workflow2db.py
          echo "        lang_type.add('java'); cli_tools.add('java'); cli_tools.add('javac')" >> workflow2db.py
          echo "        for l in raw_yaml.split('\\n'):" >> workflow2db.py
          echo "            if 'java-version' in l or 'jdk' in l:" >> workflow2db.py
          echo "                java_ver = l.strip().split(':')[-1].strip()" >> workflow2db.py
          echo "            if l.strip().endswith('.java'):" >> workflow2db.py
          echo "                java_files += l.strip()+'\\n'" >> workflow2db.py
          echo "    if 'maven' in raw_yaml.lower() or any('maven' in str(j).lower() for j in jobs):" >> workflow2db.py
          echo "        lang_type.add('maven'); cli_tools.add('mvn')" >> workflow2db.py
          echo "        for l in raw_yaml.split('\\n'):" >> workflow2db.py
          echo "            if 'maven' in l and ('version' in l or 'setup' in l):" >> workflow2db.py
          echo "                maven_ver = l.strip().split(':')[-1].strip()" >> workflow2db.py
          echo "            if 'pom.xml' in l:" >> workflow2db.py
          echo "                maven_pom += l.strip()+'\\n'" >> workflow2db.py
          echo "    return ','.join(sorted(lang_type)), python_ver, java_ver, maven_ver, python_reqs, java_files, maven_pom, ','.join(sorted(cli_tools))" >> workflow2db.py
          # ... 이하 함수 동일 ...
          echo "def parse_one_workflow(filename):" >> workflow2db.py
          echo "    path = os.path.join(WORKFLOWS_DIR, filename)" >> workflow2db.py
          echo "    try:" >> workflow2db.py
          echo "        with open(path, 'rb') as frb:" >> workflow2db.py
          echo "            raw_bytes = frb.read()" >> workflow2db.py
          echo "        with open(path, 'r', encoding='utf-8') as f:" >> workflow2db.py
          echo "            y = yaml.safe_load(f)" >> workflow2db.py
          echo "        if not y: return None" >> workflow2db.py
          echo "        name = y.get('name', '')" >> workflow2db.py
          echo "        triggers = list(y.get('on', {}).keys()) if isinstance(y.get('on'), dict) else y.get('on')" >> workflow2db.py
          echo "        jobs = y.get('jobs', {})" >> workflow2db.py
          echo "        with open(path, 'r', encoding='utf-8') as fr:" >> workflow2db.py
          echo "            raw_yaml = fr.read()" >> workflow2db.py
          echo "        yaml_crc = binascii.crc32(raw_bytes)" >> workflow2db.py
          echo "        yaml_size = len(raw_bytes)" >> workflow2db.py
          echo "        comp_blob = zlib.compress(raw_bytes)" >> workflow2db.py
          echo "        comp_size = len(comp_blob)" >> workflow2db.py
          echo "        lang_type, python_ver, java_ver, maven_ver, python_reqs, java_files, maven_pom, cli_tools = extract_lang_info(raw_yaml, jobs)" >> workflow2db.py
          echo "        return {" >> workflow2db.py
          echo "            'filename': filename," >> workflow2db.py
          echo "            'name': name," >> workflow2db.py
          echo "            'triggers': triggers," >> workflow2db.py
          echo "            'jobs': jobs," >> workflow2db.py
          echo "            'raw_yaml': raw_yaml," >> workflow2db.py
          echo "            'raw_yaml_blob': raw_bytes," >> workflow2db.py
          echo "            'yaml_crc': yaml_crc," >> workflow2db.py
          echo "            'yaml_size': yaml_size," >> workflow2db.py
          echo "            'comp_blob': comp_blob," >> workflow2db.py
          echo "            'comp_size': comp_size," >> workflow2db.py
          echo "            'lang_type': lang_type," >> workflow2db.py
          echo "            'python_ver': python_ver," >> workflow2db.py
          echo "            'java_ver': java_ver," >> workflow2db.py
          echo "            'maven_ver': maven_ver," >> workflow2db.py
          echo "            'python_reqs': python_reqs," >> workflow2db.py
          echo "            'java_files': java_files," >> workflow2db.py
          echo "            'maven_pom': maven_pom," >> workflow2db.py
          echo "            'cli_tools': cli_tools" >> workflow2db.py
          echo "        }" >> workflow2db.py
          echo "    except Exception as e:" >> workflow2db.py
          echo "        log_error(filename, f'워크플로우 파싱실패: {e}')" >> workflow2db.py
          echo "        return None" >> workflow2db.py
          # ... 이하 동일 ...
          echo "def parse_workflows_with_retry(max_retry=1):" >> workflow2db.py
          echo "    files = [f for f in os.listdir(WORKFLOWS_DIR) if f.endswith('.yml') or f.endswith('.yaml')]" >> workflow2db.py
          echo "    disabled = set()" >> workflow2db.py
          echo "    workflows = []" >> workflow2db.py
          echo "    for filename in files:" >> workflow2db.py
          echo "        result = None" >> workflow2db.py
          echo "        for attempt in range(max_retry+1):" >> workflow2db.py
          echo "            result = parse_one_workflow(filename)" >> workflow2db.py
          echo "            if result: break" >> workflow2db.py
          echo "        if result:" >> workflow2db.py
          echo "            workflows.append(result)" >> workflow2db.py
          echo "        else:" >> workflow2db.py
          echo "            log_disable(filename, '워크플로우 2회 연속 실패 → 비활성화')" >> workflow2db.py
          echo "            disabled.add(filename)" >> workflow2db.py
          echo "    return workflows, disabled" >> workflow2db.py
          # ... 이하 DB 함수 동일 ...
          echo "def init_db():" >> workflow2db.py
          echo "    conn = sqlite3.connect(DB_PATH)" >> workflow2db.py
          echo "    c = conn.cursor()" >> workflow2db.py
          echo "    c.execute(\"CREATE TABLE IF NOT EXISTS workflow (id INTEGER PRIMARY KEY AUTOINCREMENT, filename TEXT, name TEXT, triggers TEXT, created_at TEXT, updated_at TEXT, raw_yaml TEXT, raw_yaml_blob BLOB, yaml_crc INTEGER, yaml_size INTEGER, lang_type TEXT, python_ver TEXT, java_ver TEXT, maven_ver TEXT, python_reqs TEXT, java_files TEXT, maven_pom TEXT, cli_tools TEXT);\")" >> workflow2db.py
          echo "    conn.commit()" >> workflow2db.py
          echo "    conn.close()" >> workflow2db.py
          echo "def save_to_db(workflows):" >> workflow2db.py
          echo "    conn = sqlite3.connect(DB_PATH)" >> workflow2db.py
          echo "    c = conn.cursor()" >> workflow2db.py
          echo "    now = datetime.now().isoformat()" >> workflow2db.py
          echo "    c.execute(\"BEGIN TRANSACTION;\")" >> workflow2db.py
          echo "    for wf in workflows:" >> workflow2db.py
          echo "        c.execute(\"INSERT INTO workflow (filename, name, triggers, created_at, updated_at, raw_yaml, raw_yaml_blob, yaml_crc, yaml_size, lang_type, python_ver, java_ver, maven_ver, python_reqs, java_files, maven_pom, cli_tools) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\", (wf['filename'], wf['name'], str(wf['triggers']), now, now, wf['raw_yaml'], wf['raw_yaml_blob'], wf['yaml_crc'], wf['yaml_size'], str(wf['lang_type']), wf['python_ver'], wf['java_ver'], wf['maven_ver'], wf['python_reqs'], wf['java_files'], wf['maven_pom'], wf['cli_tools']))" >> workflow2db.py
          echo "    c.execute(\"COMMIT;\")" >> workflow2db.py
          echo "    conn.commit()" >> workflow2db.py
          echo "    conn.close()" >> workflow2db.py
          echo "if __name__ == '__main__':" >> workflow2db.py
          echo "    init_db()" >> workflow2db.py
          echo "    workflows, disabled = parse_workflows_with_retry(max_retry=1)" >> workflow2db.py
          echo "    save_to_db(workflows)" >> workflow2db.py

      - name: 🧪 파이썬 및 패키지 설치 (pip)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 workflow2db.py 실행
        run: |
          echo '[실행] workflow2db.py (에러로그/비활성화 자동 생성 포함)'
          python3 workflow2db.py

      - name: 📂 결과 확인 (.github/workflows.db, error_logs, 비활성화)
        run: |
          echo '[결과] .github/workflows.db, error_logs, 비활성화 목록'
          ls -lh .github/workflows.db
          echo '.tables' | sqlite3 .github/workflows.db
          echo 'PRAGMA table_info(workflow);' | sqlite3 .github/workflows.db
          echo 'SELECT filename, lang_type, python_ver, java_ver, maven_ver, cli_tools FROM workflow;' | sqlite3 .github/workflows.db
          echo '[LOGS] .github/error_logs/*, disabled_workflows.txt 미존재시 자동 touch'
          [ -d .github/error_logs ] || mkdir -p .github/error_logs
          [ -f .github/error_logs/disabled_workflows.txt ] || touch .github/error_logs/disabled_workflows.txt
          ls -l .github/error_logs || true
          head -20 .github/error_logs/* || true
          cat .github/error_logs/disabled_workflows.txt || true
