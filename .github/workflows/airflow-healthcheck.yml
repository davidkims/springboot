name: 🗕️ Airflow Healthcheck DAG 설정 및 테스트

on:
  workflow_dispatch:

jobs:
  setup-airflow:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 필수 디렉토리 생성
        run: |
          echo "[DIR] /opt/logistics/airflow/dags 생성"
          sudo mkdir -p /opt/logistics/airflow/dags
          echo "[DIR] /opt/logistics/airflow/test_logs 생성"
          sudo mkdir -p /opt/logistics/airflow/test_logs
          echo "[DIR] /opt/logistics/scorecard 생성"
          sudo mkdir -p /opt/logistics/scorecard
          echo "[DIR] /opt/logistics 권한 설정"
          sudo chmod -R 777 /opt/logistics

      - name: 🔄 Python 3.10 (deadsnakes PPA) 설치
        run: |
          echo "[PYTHON] deadsnakes PPA 추가"
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          echo "[PYTHON] python3.10, venv, dev headers 설치"
          sudo apt-get install -y python3.10 python3.10-venv python3.10-dev
          echo "[PYTHON] /usr/bin/python3 링크 설정"
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
          echo "[PYTHON] 버전 확인:"
          python3 --version

      - name: 🌀 Airflow 및 의존성 설치
        run: |
          echo "[AIRFLOW] command-not-found hook 비활성화"
          sudo rm -f /usr/lib/cnf-update-db

          echo "[AIRFLOW] 시스템 빌드 의존성 설치"
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libxml2-dev libxslt1-dev zlib1g-dev \
            libffi-dev libssl-dev rustc cargo

          echo "[AIRFLOW] pip, setuptools, wheel 업그레이드"
          python3 -m pip install --upgrade pip setuptools wheel

          echo "[AIRFLOW] CFFI 설치 (_cffi_backend 해결)"
          python3 -m pip install cffi

          echo "[AIRFLOW] cryptography 설치"
          python3 -m pip install cryptography

          echo "[AIRFLOW] Flask-Session 설치 (flask_session.sessions 해결)"
          python3 -m pip install Flask-Session

          echo "[AIRFLOW] Apache Airflow 및 providers 설치"
          python3 -m pip install apache-airflow==2.8.1 \
            apache-airflow-providers-docker \
            apache-airflow-providers-postgres \
            apache-airflow-providers-smtp

          echo "[AIRFLOW] 메타데이터 DB 초기화"
          airflow db init

      - name: 🌬️ Airflow Healthcheck DAG 생성
        run: |
          DAG_FILE=/opt/logistics/airflow/dags/airflow_healthcheck_dag.py
          echo "[DAG] $DAG_FILE 생성 시작"
          echo "from airflow import DAG"                          >  $DAG_FILE
          echo "from airflow.operators.bash import BashOperator" >> $DAG_FILE
          echo "from datetime import datetime"                  >> $DAG_FILE
          echo ""                                              >> $DAG_FILE
          echo "with DAG("                                     >> $DAG_FILE
          echo "    'airflow_healthcheck_dag',"                >> $DAG_FILE
          echo "    start_date=datetime(2023, 1, 1),"           >> $DAG_FILE
          echo "    schedule_interval='@daily',"               >> $DAG_FILE
          echo "    catchup=False"                             >> $DAG_FILE
          echo ") as dag:"                                     >> $DAG_FILE
          echo "    health_check = BashOperator("               >> $DAG_FILE
          echo "        task_id='check_airflow_webserver',"    >> $DAG_FILE
          echo "        bash_command='curl -sf http://localhost:8080/health || exit 1'" >> $DAG_FILE
          echo "    )"                                         >> $DAG_FILE
          echo "[DAG] DAG 파일 생성 완료"

          echo "[DAG] DAG 내용 로깅"
          cat $DAG_FILE > /opt/logistics/airflow/test_logs/airflow_healthcheck_dag_create.log

      - name: ▶️ Airflow DAG 실행 테스트
        run: |
          echo "[TEST] DAG 목록 출력"
          airflow dags list > /opt/logistics/airflow/test_logs/airflow_dags_list.log \
            || echo "[❌] DAG 목록 실패"
          echo "[TEST] DAG 테스트: airflow_healthcheck_dag @ 2025-01-01"
          airflow dags test airflow_healthcheck_dag 2025-01-01 \
            > /opt/logistics/airflow/test_logs/airflow_healthcheck_dag_test.log \
            || echo "[❌] DAG 테스트 실패"
          echo "[TEST] DAG 테스트 완료"

      - name: 🔐 Scorecard 설치 및 보안 점검
        run: |
          echo "[SECURITY] 스코어카드 디렉토리 확인"
          sudo mkdir -p /opt/logistics/scorecard
          echo "[SECURITY] 스코어카드 다운로드"
          SCORECARD_VERSION="v4.10.3"
          wget https://github.com/ossf/scorecard/releases/download/$SCORECARD_VERSION/scorecard-linux-amd64 \
            -O scorecard \
            || echo "[❌] 다운로드 실패"
          echo "[SECURITY] 실행 권한 부여"
          chmod +x scorecard
          echo "[SECURITY] 바이너리 이동"
          mv scorecard /opt/logistics/scorecard/
          echo "[SECURITY] 점검 실행"
          /opt/logistics/scorecard/scorecard \
            --repo=. --local --checks Vulnerabilities --format=json --show-details \
            > /opt/logistics/scorecard/scorecard.result.json \
            || echo "[❌] 점검 실패"

      - name: 📨 로그 업로드 준비
        run: |
          echo "[UPLOAD] 로그 업로드 준비"

      - name: 📦 아티팩트로 로그 업로드
        uses: actions/upload-artifact@v4
        with:
          name: airflow-healthcheck-logs
          path: /opt/logistics/airflow/test_logs/
