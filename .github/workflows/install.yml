# .github/workflows/check-size.yml
name: "Directory Size Summary"
on:
  push:
  pull_request:

jobs:
  dir-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List directory sizes
        id: sizes
        run: |
          echo "## 📦 Directory Size Summary" > size_report.md
          # 현재 루트의 모든 디렉토리/파일 크기 계산
          du -sh * 2>/dev/null | sort -hr >> size_report.md
          cat size_report.md
        shell: bash

      - name: Upload size report as artifact
        uses: actions/upload-artifact@v3
        with:
          name: dir-size-report
          path: size_report.md

      - name: Comment report on PR
        if: github.event_name == 'pull_request'
        uses: repo-sync/pull-request-comment@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            🔍 자동 사이즈 리포트:
            ```
            ${{ steps.sizes.outputs.size_report }}
            ```
