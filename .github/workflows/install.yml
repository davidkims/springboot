name: 📂 MEGA DB Echo 대통합 워크플로우

on:
  workflow_dispatch:
    inputs:
      COUNT:
        description: "생성할 테이블/사용자 수"
        required: false
        default: "100"
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  echo-fullops:
    runs-on: ubuntu-latest
    env:
      COUNT: ${{ inputs.COUNT || 100 }}

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 에코 디렉토리 및 .my.cnf 생성 (경고 제거, 소켓 오류 제거)
        run: |
          set -e
          mkdir -p .github/echo_db/echo_mysql .github/echo_db/echo_dirs
          
          # 1. .my.cnf 에코 생성
          echo "echo '[client]' > .github/echo_db/echo_mysql/my.cnf" > .github/echo_db/echo_mysql/mycnf_create.sh
          echo "echo 'user=root' >> .github/echo_db/echo_mysql/my.cnf" >> .github/echo_db/echo_mysql/mycnf_create.sh
          echo "echo 'password=rootpass123' >> .github/echo_db/echo_mysql/my.cnf" >> .github/echo_db/echo_mysql/mycnf_create.sh
          echo "echo 'host=127.0.0.1' >> .github/echo_db/echo_mysql/my.cnf" >> .github/echo_db/echo_mysql/mycnf_create.sh
          echo "echo 'protocol=TCP' >> .github/echo_db/echo_mysql/my.cnf" >> .github/echo_db/echo_mysql/mycnf_create.sh
          bash .github/echo_db/echo_mysql/mycnf_create.sh

          # 2. 디렉토리 생성 에코
          for d in echo_table echo_sql echo_user echo_grant echo_drop echo_alter echo_truncate echo_analyze run_scripts backup logs; do
            echo "echo 'mkdir -p .github/echo_db/$d'" >> .github/echo_db/echo_dirs/echo_dirs_create.sh
            mkdir -p ".github/echo_db/$d"
          done
          bash .github/echo_db/echo_dirs/echo_dirs_create.sh

      - name: 🧾 에코 SQL + 사용자 + 권한 + 실행 스크립트 생성
        run: |
          COUNT=${COUNT:-100}
          for i in $(seq 1 $COUNT); do
            T="mega_table_$i"

            echo "echo 'CREATE TABLE IF NOT EXISTS $T (id INT PRIMARY KEY AUTO_INCREMENT, data VARCHAR(255));'" > .github/echo_db/echo_table/$T.sql
            echo "echo 'INSERT INTO $T (data) VALUES (\"샘플데이터_$i\");'" > .github/echo_db/echo_sql/insert_$T.sql
            echo "echo 'SELECT * FROM $T;'" > .github/echo_db/echo_sql/select_$T.sql
            echo "echo 'CREATE USER \"user_$i\"@\"%\" IDENTIFIED BY \"pw_$i\";'" > .github/echo_db/echo_user/create_user_$i.sql
            echo "echo 'GRANT SELECT, INSERT ON test_db.$T TO \"user_$i\"@\"%\";'" >> .github/echo_db/echo_user/create_user_$i.sql
            echo "echo 'REVOKE ALL ON $T FROM \"user_$i\"@\"%\";'" > .github/echo_db/echo_grant/revoke_user_$i.sql
            echo "echo 'DROP TABLE IF EXISTS $T;'" > .github/echo_db/echo_drop/drop_$T.sql
            echo "echo 'ALTER TABLE $T ADD COLUMN created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP;'" > .github/echo_db/echo_alter/alter_$T.sql
            echo "echo 'TRUNCATE TABLE $T;'" > .github/echo_db/echo_truncate/truncate_$T.sql
            echo "echo 'ANALYZE TABLE $T;'" > .github/echo_db/echo_analyze/analyze_$T.sql
          done

          for kind in table insert select user grant drop alter truncate analyze; do
            echo "#!/bin/bash" > .github/echo_db/run_scripts/init_${kind}.sh
            for i in $(seq 1 $COUNT); do
              T="mega_table_$i"
              F=".github/echo_db/echo_${kind}/"
              FILE="${F}${kind}_${T}.sql"
              [ "$kind" = "table" ] && FILE=".github/echo_db/echo_table/$T.sql"
              [ "$kind" = "insert" ] && FILE=".github/echo_db/echo_sql/insert_$T.sql"
              [ "$kind" = "select" ] && FILE=".github/echo_db/echo_sql/select_$T.sql"
              [ "$kind" = "user" ] && FILE=".github/echo_db/echo_user/create_user_$i.sql"
              [ "$kind" = "grant" ] && FILE=".github/echo_db/echo_grant/revoke_user_$i.sql"
              [ "$kind" = "drop" ] && FILE=".github/echo_db/echo_drop/drop_$T.sql"
              [ "$kind" = "alter" ] && FILE=".github/echo_db/echo_alter/alter_$T.sql"
              [ "$kind" = "truncate" ] && FILE=".github/echo_db/echo_truncate/truncate_$T.sql"
              [ "$kind" = "analyze" ] && FILE=".github/echo_db/echo_analyze/analyze_$T.sql"
              echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf test_db < $FILE" >> .github/echo_db/run_scripts/init_${kind}.sh
            done
            chmod +x .github/echo_db/run_scripts/init_${kind}.sh
          done

      - name: 🗄️ mysqldump + psql 백업 에코 스크립트
        run: |
          echo "#!/bin/bash" > .github/echo_db/backup/mysqldump_backup.sh
          echo "mysqldump --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf test_db > .github/echo_db/backup/mysql_backup.sql || echo '[ERROR] mysqldump 실패'" >> .github/echo_db/backup/mysqldump_backup.sh
          chmod +x .github/echo_db/backup/mysqldump_backup.sh

          echo "#!/bin/bash" > .github/echo_db/backup/psql_backup.sh
          echo "echo '-- 모의 PSQL 백업 실행 --' > .github/echo_db/backup/psql_backup.sql" >> .github/echo_db/backup/psql_backup.sh
          chmod +x .github/echo_db/backup/psql_backup.sh

      - name: 🔄 모든 init/backup 자동 실행
        run: |
          for script in table insert select user grant drop alter truncate analyze; do
            echo "[RUN] init_${script}.sh 실행"
            bash .github/echo_db/run_scripts/init_${script}.sh || echo "[WARN] 실패: $script"
          done
          bash .github/echo_db/backup/mysqldump_backup.sh
          bash .github/echo_db/backup/psql_backup.sh

      - name: 📃 전체 에코 파일 출력
        run: |
          find .github/echo_db -type f | sort | while read f; do
            echo "--- $f"
            cat "$f" || echo "(읽기 실패)"
          done
