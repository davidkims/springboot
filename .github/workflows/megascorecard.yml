name: 🛡️ MEGA Scorecard + EchoOps + Security + Pages + SizeCheck

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '16 11 * * 2'  # 화요일마다 Scorecard
    - cron: '*/3 * * * *'  # 3분마다 전체 작업
  workflow_dispatch:
  branch_protection_rule:

permissions: read-all

jobs:
  mega-security-analysis:
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'
    permissions:
      security-events: write
      id-token: write

    env:
      SARIF_FILE: results.sarif
      ECHO_DIR: .github/echo_monitoring

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🏗️ Create echo directories
        run: |
          set -e
          for d in echo_dirs echo_security echo_scorecard echo_pages echo_monitoring; do
            mkdir -p ".github/${d}"
            echo "echo '[ECHO] Created directory: .github/${d}'" >> .github/${d}/create_dirs.sh
          done

      - name: 🔍 Run Scorecard Analysis
        uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: ${{ env.SARIF_FILE }}
          results_format: sarif
          publish_results: true

      - name: 📄 Upload SARIF as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scorecard-SARIF
          path: ${{ env.SARIF_FILE }}
          retention-days: 5

      - name: ☁️ Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.SARIF_FILE }}

      - name: 🌐 Copy SARIF to Pages directory
        run: |
          mkdir -p site/scorecard
          cp ${{ env.SARIF_FILE }} site/scorecard/scorecard-results.sarif
          echo "echo '[ECHO] Copied SARIF to site/scorecard'" >> .github/echo_pages/copy_scorecard_sarif.sh

      - name: 📦 Check Largest Files and Total Size
        run: |
          mkdir -p ${{ env.ECHO_DIR }}
          du -ah . | sort -hr | head -n 30 > ${{ env.ECHO_DIR }}/top_file_sizes.txt || true
          du -sh . > ${{ env.ECHO_DIR }}/total_size.txt || true
          echo "echo '[ECHO] File size check complete'" >> ${{ env.ECHO_DIR }}/file_size_check.sh

      - name: 🧪 Print SARIF preview
        run: |
          echo "echo '[ECHO] Printing SARIF preview...'" >> .github/echo_scorecard/sarif_preview.sh
          head -n 50 ${{ env.SARIF_FILE }} || echo "SARIF file not found"
