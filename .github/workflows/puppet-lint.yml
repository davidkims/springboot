name: ♾️ Transfer Log Backup - Cron (60건 Infinite)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  transfer_log_backup:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      oracle:
        image: gvenzl/oracle-xe:18-slim
        env:
          ORACLE_PASSWORD: testpass
          ORACLE_ALLOW_REMOTE: "true"
        ports:
          - 1521:1521
        # This image has its own built-in HEALTHCHECK.

    env:
      TRANSFER_LOG_DIR: /opt/logs/transfer
      BACKUP_DIR: /opt/backup/transfer
      PROVENANCE_DIR: provenance
      PROVENANCE_STORE_DIR: provenance/store

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⏳ Wait for databases to be ready
        run: |
          echo "[⏳] Waiting for MySQL…"
          until mysqladmin ping -h127.0.0.1 -uroot -ptestpass --silent; do
            sleep 5
          done
          echo "[✅] MySQL is up"

          echo "[⏳] Waiting for PostgreSQL…"
          until pg_isready -h127.0.0.1 -U testuser; do
            sleep 5
          done
          echo "[✅] PostgreSQL is up"

          echo "[⏳] Waiting for Oracle XE… (may take ~60s)"
          n=0
          until echo "SELECT 1 FROM dual;" | sqlplus -s system/testpass@//127.0.0.1:1521/XE | grep -q "1"; do
            n=$((n+1))
            if [ $n -gt 12 ]; then
              echo "[⚠️] Oracle still not ready after $((n*5))s, proceeding anyway"
              break
            fi
            sleep 5
          done
          echo "[✅] Oracle check done (or timed out)"

      - name: 🧪 Install Java & JDBC Drivers and Test Connections
        run: |
          echo "[☕] Installing Java JDK..."
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          java -version
          javac -version

          echo "[📁] Creating JDBC directories..."
          mkdir -p /opt/jdbc /opt/jdbc/test

          echo "[⬇️] Downloading MySQL Connector/J..."
          curl -L -o /opt/jdbc/mysql-connector-j.jar \
            https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/8.3.0/mysql-connector-j-8.3.0.jar

          echo "[⬇️] Downloading PostgreSQL JDBC Driver..."
          curl -L -o /opt/jdbc/postgresql-jdbc.jar \
            https://jdbc.postgresql.org/download/postgresql-42.7.3.jar

          echo "[⬇️] Downloading Oracle JDBC (ojdbc8)…"
          curl -L -o /opt/jdbc/ojdbc8.jar \
            https://repo1.maven.org/maven2/com/oracle/database/jdbc/ojdbc8/19.3.0.0/ojdbc8-19.3.0.0.jar

          echo "[📄] Generating JDBCTest.java (with echo)…"
          {
            echo 'import java.sql.Connection;'
            echo 'import java.sql.DriverManager;'
            echo ''
            echo 'public class JDBCTest {'
            echo '    public static void main(String[] args) {'
            echo '        String type = args[0];'
            echo '        String url = "";'
            echo '        String user = "testuser";'
            echo '        String password = "testpass";'
            echo ''
            echo '        switch (type) {'
            echo '            case "mysql":'
            echo '                url = "jdbc:mysql://127.0.0.1:3306/testdb";'
            echo '                break;'
            echo '            case "postgres":'
            echo '                url = "jdbc:postgresql://127.0.0.1:5432/testdb";'
            echo '                break;'
            echo '            case "oracle":'
            echo '                url = "jdbc:oracle:thin:@127.0.0.1:1521:XE";'
            echo '                break;'
            echo '            default:'
            echo '                System.err.println("Unsupported type: " + type);'
            echo '                System.exit(1);'
            echo '        }'
            echo ''
            echo '        try (Connection conn = DriverManager.getConnection(url, user, password)) {'
            echo '            System.out.println("[\u2705] Connected to " + type + " successfully.");'
            echo '        } catch (Exception e) {'
            echo '            System.err.println("[\u274c] Connection to " + type + " failed: " + e.getMessage());'
            echo '        }'
            echo '    }'
            echo '}'
          } | tee /opt/jdbc/test/JDBCTest.java

          echo "[🚰] Compiling JDBC Test Code…"
          javac -cp "/opt/jdbc/*" /opt/jdbc/test/JDBCTest.java

          echo "[🧲] Testing MySQL JDBC connection…"
          java -cp "/opt/jdbc/*:/opt/jdbc/test" JDBCTest mysql || true

          echo "[🧲] Testing PostgreSQL JDBC connection…"
          java -cp "/opt/jdbc/*:/opt/jdbc/test" JDBCTest postgres || true

          echo "[🧲] Testing Oracle JDBC connection…"
          java -cp "/opt/jdbc/*:/opt/jdbc/test" JDBCTest oracle || true

          echo "[📂] Listing JDBC contents:"
          tree /opt/jdbc || ls -lh /opt/jdbc/
