name: DB CLI Install & Virtual Account Bulk Echo Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'   # 매 5분마다 실행

jobs:
  db-cli-virtual-accounts:
    runs-on: ubuntu-latest

    env:
      DBCLI_DIR: .github/dbcli
      OUTPUT_DIR: .github/dbcli/output
      VA_DIR: .github/dbcli/virtual_accounts

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🚀 90000% System & Package Upgrade
        run: |
          echo "[🚀] 90000% 업그레이드: apt update & apt upgrade 시작!"
          sudo apt-get update -y
          sudo apt-get -y upgrade
          echo "[✅] 모든 시스템 및 패키지 업그레이드 완료 (90000%)"

      - name: 📂 Ensure Sample SQL/Command Files Exist
        run: |
          mkdir -p $DBCLI_DIR/mysql $DBCLI_DIR/postgresql $DBCLI_DIR/sqlite $DBCLI_DIR/redis $DBCLI_DIR/clickhouse
          [ -f $DBCLI_DIR/mysql/demo.sql ]       || echo "SELECT VERSION();"                  > $DBCLI_DIR/mysql/demo.sql
          [ -f $DBCLI_DIR/postgresql/demo.sql ]  || echo "SELECT version();"                  > $DBCLI_DIR/postgresql/demo.sql
          [ -f $DBCLI_DIR/sqlite/demo.sql ]      || echo "SELECT sqlite_version();"           > $DBCLI_DIR/sqlite/demo.sql
          [ -f $DBCLI_DIR/redis/demo.redis ]     || { echo "PING"; echo "INFO"; }             > $DBCLI_DIR/redis/demo.redis
          [ -f $DBCLI_DIR/clickhouse/demo.sql ]  || echo "SELECT version();"                  > $DBCLI_DIR/clickhouse/demo.sql
          mkdir -p $OUTPUT_DIR

      - name: 🏦 Generate Virtual Account Bulk Echo File (Delete Old, Make New)
        run: |
          mkdir -p $VA_DIR
          # Delete all old files
          echo "[🧹] 기존 가상계좌 파일 전체 삭제"
          rm -f $VA_DIR/virtual_accounts_*.txt

          # Create new file with timestamp
          TS=$(date '+%Y%m%d_%H%M%S')
          VA_FILE="$VA_DIR/virtual_accounts_${TS}.txt"
          echo "[💳] ${TS} 기준 가상계좌 10000건 echo 파일 생성: $VA_FILE"
          # 헤더
          echo "account_id,account_number,customer_name,bank_code,open_date" > "$VA_FILE"
          # 1만건 예시 데이터 생성 (가상)
          for i in $(seq 1 10000); do
            ACC_NUM="7000$(printf '%07d' $i)"
            CUST="User$(printf '%05d' $i)"
            BANK="B$(printf '%04d' $((1000 + ($i % 9000))))"
            DATE="$(date '+%Y-%m-%d')"
            echo "VA${i},${ACC_NUM},${CUST},${BANK},${DATE}" >> "$VA_FILE"
          done

          echo "[✅] $VA_FILE 생성 완료"
          ls -lh $VA_FILE

      - name: 🏃 Install & Run DB CLI Samples (버전 fallback 지원)
        run: |
          install_with_fallback() {
            PKG="$1"
            CMD="$2"
            DESC="$3"
            echo "[⚡] $PKG 최신 설치 시도"
            sudo apt-get update -y && sudo apt-get install -y "$PKG" && return 0
            echo "[❗] $PKG 최신 설치 실패! 설치 가능한 버전 목록:"
            apt-cache madison "$PKG" || apt-cache policy "$PKG"
            VERSIONS=$(apt-cache madison "$PKG" | awk '{print $3}' | head -n 2)
            for VER in $VERSIONS; do
              echo "[🔄] $PKG 버전 $VER로 설치 재시도"
              sudo apt-get install -y "$PKG=$VER" && return 0
            done
            echo "[❌] $PKG ($DESC) 모든 버전 설치 실패! 스킵"
            return 1
          }

          # MySQL
          echo "[🏃] Run MySQL sample"
          if ! command -v mysql > /dev/null; then
            install_with_fallback mysql-client mysql "MySQL CLI"
          fi
          if command -v mysql > /dev/null && [ -f $DBCLI_DIR/mysql/demo.sql ]; then
            mysql --version
            sudo mysql -u root < $DBCLI_DIR/mysql/demo.sql > $OUTPUT_DIR/mysql_demo.out 2>&1 || echo "[⚠️] MySQL 실행 실패"
          else
            echo "[❌] mysql CLI 또는 샘플 SQL 미존재 - 실행 스킵"
          fi

          # PostgreSQL
          echo "[🏃] Run PostgreSQL sample"
          if ! command -v psql > /dev/null; then
            install_with_fallback postgresql-client psql "PostgreSQL CLI"
          fi
          if command -v psql > /dev/null && [ -f $DBCLI_DIR/postgresql/demo.sql ]; then
            psql --version
            sudo -u postgres psql -f $DBCLI_DIR/postgresql/demo.sql > $OUTPUT_DIR/psql_demo.out 2>&1 || echo "[⚠️] PostgreSQL 실행 실패"
          else
            echo "[❌] psql CLI 또는 샘플 SQL 미존재 - 실행 스킵"
          fi

          # SQLite
          echo "[🏃] Run SQLite sample"
          if ! command -v sqlite3 > /dev/null; then
            install_with_fallback sqlite3 sqlite3 "SQLite CLI"
          fi
          if command -v sqlite3 > /dev/null && [ -f $DBCLI_DIR/sqlite/demo.sql ]; then
            sqlite3 --version
            sqlite3 :memory: < $DBCLI_DIR/sqlite/demo.sql > $OUTPUT_DIR/sqlite_demo.out 2>&1 || echo "[⚠️] SQLite 실행 실패"
          else
            echo "[❌] sqlite3 CLI 또는 샘플 SQL 미존재 - 실행 스킵"
          fi

          # Redis
          echo "[🏃] Run Redis sample"
          if ! command -v redis-cli > /dev/null; then
            install_with_fallback redis-tools redis-cli "Redis CLI"
          fi
          if command -v redis-cli > /dev/null && [ -f $DBCLI_DIR/redis/demo.redis ]; then
            redis-cli --version
            while read line; do redis-cli $line; done < $DBCLI_DIR/redis/demo.redis > $OUTPUT_DIR/redis_demo.out 2>&1 || echo "[⚠️] Redis 실행 실패"
          else
            echo "[❌] redis-cli 또는 샘플 파일 미존재 - 실행 스킵"
          fi

          # ClickHouse
          echo "[🏃] Run ClickHouse sample"
          if ! command -v clickhouse-client > /dev/null; then
            install_with_fallback clickhouse-client clickhouse-client "ClickHouse CLI"
          fi
          if command -v clickhouse-client > /dev/null && [ -f $DBCLI_DIR/clickhouse/demo.sql ]; then
            clickhouse-client --version
            clickhouse-client --multiquery < $DBCLI_DIR/clickhouse/demo.sql > $OUTPUT_DIR/clickhouse_demo.out 2>&1 || echo "[⚠️] ClickHouse 실행 실패"
          else
            echo "[❌] clickhouse-client 또는 샘플 SQL 미존재 - 실행 스킵"
          fi

      - name: 📝 Show Output Directory Structure & Virtual Account File
        run: |
          echo "[📝] $OUTPUT_DIR 디렉토리와 파일 리스트"
          tree $OUTPUT_DIR || ls -R $OUTPUT_DIR
          echo "[📝] 가상계좌 생성 결과:"
          ls -lh $VA_DIR || true
          head -5 $VA_DIR/virtual_accounts_*.txt || true
