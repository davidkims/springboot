name: 📊 Metrics Server Setup & Real-time Data Collection

on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'  # 매분 실행

jobs:
  setup_and_collect:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Generate setup_metrics.sh script
        run: |
          echo "[📝] Generating setup_metrics.sh..."
          cat << 'EOF' > setup_metrics.sh
# Logs each step for visibility

echo "[🛠️] Updating package lists..."
sudo apt-get update

echo "[🛠️] Upgrading all packages..."
sudo apt-get upgrade -y

echo "[🛡️] Backing up existing data and config..."
TIMESTAMP=$(date +%Y%m%d%H%M%S)
for DIR in /opt/prometheus/data /opt/grafana/data /opt/elasticsearch/data \
           /opt/logstash/config /opt/kibana/config /opt/influxdb/data /opt/telegraf/conf; do
  echo "[🛡️] Processing $DIR"
  if [ -d "$DIR" ]; then
    BK="${DIR}_backup_$TIMESTAMP"
    echo "[🛡️] Creating backup dir: $BK"
    sudo mkdir -p "$BK"
    echo "[🛡️] Copying data from $DIR to $BK"
    sudo cp -a "$DIR/." "$BK/"
    echo "[✅] Backed up $DIR → $BK"
  else
    echo "[⚪️] $DIR not found, skipping backup"
  fi
done

echo "[🛠️] Creating required directories..."
sudo mkdir -p /opt/prometheus/data /opt/grafana/data /opt/elasticsearch/data \
                 /opt/logstash/config /opt/kibana/config /opt/influxdb/data \
                 /opt/telegraf/conf
echo "[✅] Directories created."

echo "[🛠️] Installing Prometheus..."
sudo apt-get install -y prometheus
echo "[✅] Prometheus installed."

echo "[🛠️] Installing Grafana prerequisites..."
sudo apt-get install -y apt-transport-https software-properties-common wget gnupg
echo "[🛠️] Adding Grafana key..."
sudo mkdir -p /etc/apt/keyrings
curl -sL https://apt.grafana.com/gpg.key \
  | gpg --dearmor \
  | sudo tee /etc/apt/keyrings/grafana.gpg > /dev/null
echo "[🛠️] Adding Grafana repo..."
echo "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main" \
  | sudo tee /etc/apt/sources.list.d/grafana.list
sudo apt-get update
sudo apt-get install -y grafana
echo "[✅] Grafana installed."

echo "[🛠️] Installing Elasticsearch..."
curl -sL https://artifacts.elastic.co/GPG-KEY-elasticsearch \
  | gpg --dearmor \
  | sudo tee /usr/share/keyrings/elasticsearch-archive-keyring.gpg > /dev/null
echo "[🛠️] Adding Elasticsearch repo..."
echo "deb [signed-by=/usr/share/keyrings/elasticsearch-archive-keyring.gpg] https://artifacts.elastic.co/packages/7.x/apt stable main" \
  | sudo tee /etc/apt/sources.list.d/elasticsearch.list
sudo apt-get update
sudo apt-get install -y openjdk-11-jdk elasticsearch
echo "[✅] Elasticsearch installed."

echo "[🛠️] Installing Logstash..."
sudo apt-get update
sudo apt-get install -y logstash
echo "[✅] Logstash installed."

echo "[🛠️] Installing Kibana..."
sudo apt-get update
sudo apt-get install -y kibana
echo "[✅] Kibana installed."

echo "[🛠️] Installing InfluxDB & Telegraf..."
curl -sL https://repos.influxdata.com/influxdata-archive_compat.key \
  | gpg --dearmor \
  | sudo tee /etc/apt/trusted.gpg.d/influxdata-archive_compat.gpg > /dev/null
echo "[🛠️] Adding InfluxDB repo..."
echo "deb [signed-by=/etc/apt/trusted.gpg.d/influxdata-archive_compat.gpg] https://repos.influxdata.com/ubuntu jammy stable" \
  | sudo tee /etc/apt/sources.list.d/influxdb.list
sudo apt-get update
sudo apt-get install -y influxdb telegraf
echo "[✅] InfluxDB & Telegraf installed."
EOF
          chmod +x setup_metrics.sh
          echo "[✅] setup_metrics.sh 생성 및 실행 권한 부여 완료."

      - name: 🚀 Run setup_metrics.sh with strict mode
        run: |
          echo "[🚀] Executing setup_metrics.sh with -e..."
          sudo bash -e setup_metrics.sh

      - name: 📡 Collect real-time workflow metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[📡] Fetching latest 5 workflow runs from GitHub API..."
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=5" \
            > workflow_metrics.json
          echo "[✅] Metrics saved to workflow_metrics.json"
          head -n 20 workflow_metrics.json || true
