name: ☕ Java + 🛡️ OPA 다중 정책 생성 및 echo 평가 로깅

on:
  workflow_dispatch:

jobs:
  setup-java-opa-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 저장소 체크아웃
        uses: actions/checkout@v4

      - name: ☕ Java 설치 (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 OPA 설치 (Open Policy Agent)
        run: |
          echo "[🛠️] OPA 설치 시작"
          OPA_VERSION="v0.63.0"
          echo "[📥] OPA 다운로드 중..."
          curl -sSL -o opa https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          echo "[✅] OPA 설치 완료"

      - name: 📁 다중 정책 파일 생성 (allow, deny, role)
        run: |
          echo "[📁] opa_policies 디렉토리 생성"
          mkdir -p opa_policies

          echo "[📄] allow.rego 생성"
          echo 'package example' | tee opa_policies/allow.rego
          echo '' | tee -a opa_policies/allow.rego
          echo 'default allow = false' | tee -a opa_policies/allow.rego
          echo '' | tee -a opa_policies/allow.rego
          echo 'allow {' | tee -a opa_policies/allow.rego
          echo '  input.user == "admin"' | tee -a opa_policies/allow.rego
          echo '}' | tee -a opa_policies/allow.rego

          echo "[📄] deny.rego 생성"
          echo 'package example' | tee opa_policies/deny.rego
          echo '' | tee -a opa_policies/deny.rego
          echo 'default deny = true' | tee -a opa_policies/deny.rego
          echo '' | tee -a opa_policies/deny.rego
          echo 'deny {' | tee -a opa_policies/deny.rego
          echo '  input.user == "admin"' | tee -a opa_policies/deny.rego
          echo '}' | tee -a opa_policies/deny.rego

          echo "[📄] role.rego 생성"
          echo 'package example' | tee opa_policies/role.rego
          echo '' | tee -a opa_policies/role.rego
          echo 'role = input.role' | tee -a opa_policies/role.rego

          echo "[📂] opa_policies 디렉토리 확인:"
          ls -al opa_policies

          echo "[🧾] 파일 존재 확인:"
          test -f opa_policies/allow.rego && echo "[✔] allow.rego 존재 확인됨" || echo "[❌] allow.rego 없음"
          test -f opa_policies/deny.rego && echo "[✔] deny.rego 존재 확인됨" || echo "[❌] deny.rego 없음"
          test -f opa_policies/role.rego && echo "[✔] role.rego 존재 확인됨" || echo "[❌] role.rego 없음"

      - name: 🧪 OPA 정책 평가 (allow.rego)
        run: |
          echo "[🚀] OPA 정책 평가 시작 - admin 사용자"
          echo '[INPUT] {"user": "admin"}'
          test -f opa_policies/allow.rego && \
          echo '{"user": "admin"}' | opa eval --stdin-input --data opa_policies 'data.example.allow' || \
          echo "[❌] opa_policies/allow.rego 파일 없음"

          echo "[🚀] OPA 정책 평가 시작 - guest 사용자"
          echo '[INPUT] {"user": "guest"}'
          test -f opa_policies/allow.rego && \
          echo '{"user": "guest"}' | opa eval --stdin-input --data opa_policies 'data.example.allow' || \
          echo "[❌] opa_policies/allow.rego 파일 없음"

      - name: ✅ Java & OPA 버전 확인
        run: |
          echo "[ℹ️] Java 버전 확인:"
          java -version

          echo "[ℹ️] OPA 버전 확인:"
          opa version

          echo "[✅] Java 및 OPA 정상 확인 완료"
