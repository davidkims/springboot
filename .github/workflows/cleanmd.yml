name: 🧹 Clean .md로 시작하는 파일

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🗑️ .md로 시작하는 파일 전체 삭제 (.github/workflows 포함)
        run: |
          echo "echo '[🗑️] .md로 시작하는 파일 전체 삭제 시작...'"
          echo '[🗑️] .md로 시작하는 파일 전체 삭제 시작...'
          find . -type f -name '.md*' -print -exec echo "rm {}" \; -exec rm {} \;
          echo "echo '[🗑️] 삭제 완료!'"
          echo '[🗑️] 삭제 완료!'
