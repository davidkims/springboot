name: 🏦 전체 금융기관 ALL-IN-ONE + AutoUP

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  fintech-allbanks-fullops:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 전체 에코/DB/원장/거래/로그/테스트/도커/autoup 디렉토리·에코 대량 생성
        run: |
          set -e
          BANKS="국민 우리 신한 하나 농협 기업 수협 씨티 SC제일 케이카카오토스새마을금고 우체국 부산 대구 광주 전북 제주 산림조합 신협 한국씨티 JP모건 BOA HSBC UBS 도이치 한국스탠다드차타드 신용카드 롯데 삼성 현대 비씨 NH채움 하나카드 신한카드 우리카드 국민카드 기업카드 현대증권 미래에셋 NH투자 한국투자 신한투자 KB증권 삼성증권 키움 대신 신영 유진 IBK투자 메리츠 한국예탁결제원 업비트 빗썸 코빗 고팍스 바이낸스 코인원 교보 삼성 한화 동양 현대 농협 메리츠 흥국 MG MG새마을 저축은행 리브핀 페이코 카카오페이 뱅크샐러드 알파벳 암호화폐토스카카오뱅크타다토스증권웨이브 오픈뱅킹모든은행포함"
          # autoup 디렉토리/에코파일 대량 생성
          mkdir -p .github/echo/autoup .github/echo/autoup/log .github/echo/autoup/config .github/echo/autoup/test
          echo "echo 'mkdir -p .github/echo/autoup'" | tee .github/echo/autoup/dir_create.log
          echo "echo 'mkdir -p .github/echo/autoup/log'" | tee -a .github/echo/autoup/dir_create.log
          echo "echo 'mkdir -p .github/echo/autoup/config'" | tee -a .github/echo/autoup/dir_create.log
          echo "echo 'mkdir -p .github/echo/autoup/test'" | tee -a .github/echo/autoup/dir_create.log
          touch .github/echo/autoup/init.log
          echo "echo 'touch .github/echo/autoup/init.log'" | tee -a .github/echo/autoup/dir_create.log
          echo "echo '[autoup 디렉토리 및 기본 에코 생성 완료]'" | tee -a .github/echo/autoup/dir_create.log
          # 은행사별 기존 echo 생성도 반복(생략)
          for B in $BANKS; do
            for d in \
              .github/echo/bank/$B \
              .github/echo/bank/$B/ledger \
              .github/echo/bank/$B/txn \
              .github/echo/bank/$B/db \
              .github/echo/bank/$B/db/sql \
              .github/echo/bank/$B/db/query \
              .github/echo/bank/$B/test \
              .github/echo/bank/$B/log \
              .github/echo/bank/$B/report \
              .github/echo/bank/$B/docker \
              .github/echo/bank/$B/docker/env \
              .github/echo/bank/$B/docker/compose \
              .github/echo/bank/$B/dockerfile \
              .github/echo/bank/$B/autoup \
              .github/echo/bank/$B/autoup/log; do
                mkdir -p "$d" 2>/dev/null || true
                echo "echo 'mkdir -p $d'" | tee -a .github/echo/autoup/dir_create.log || true
            done
            # autoup 에코 파일
            echo "echo '[${B} autoup 자동화 스크립트]'" | tee .github/echo/bank/$B/autoup/autoup_script.sh
            echo "[${B} autoup 자동화 스크립트]" > .github/echo/bank/$B/autoup/autoup_script.sh
            chmod +x .github/echo/bank/$B/autoup/autoup_script.sh || true
            echo "echo '[${B} autoup 자동화 로그]'" | tee .github/echo/bank/$B/autoup/log/autoup.log
            echo "[${B} autoup 자동화 로그]" > .github/echo/bank/$B/autoup/log/autoup.log
          done

      - name: 🛠️ autoup 패키지/서비스 자동 설치 (에코 + 실제)
        run: |
          set -e
          mkdir -p .github/echo/autoup/install
          {
            echo "echo '[autoup 패키지/서비스 자동 설치 시작]'"
            echo "echo 'sudo apt-get update -y'"
            echo "sudo apt-get update -y"
            echo "echo 'sudo apt-get install -y unattended-upgrades'"
            echo "sudo apt-get install -y unattended-upgrades"
            echo "echo 'sudo systemctl enable unattended-upgrades'"
            echo "sudo systemctl enable unattended-upgrades"
            echo "echo 'sudo systemctl start unattended-upgrades'"
            echo "sudo systemctl start unattended-upgrades"
            echo "echo '[autoup 설정/테스트/로그]'"
            echo "sudo unattended-upgrade --dry-run"
          } > .github/echo/autoup/install/autoup_install.sh
          chmod +x .github/echo/autoup/install/autoup_install.sh
          echo '[autoup 패키지/서비스 자동 설치 시작]' | tee -a .github/echo/autoup/install/autoup_install.log || true
          echo 'sudo apt-get update -y' | tee -a .github/echo/autoup/install/autoup_install.log || true
          sudo apt-get update -y | tee -a .github/echo/autoup/install/autoup_install.log || true
          echo 'sudo apt-get install -y unattended-upgrades' | tee -a .github/echo/autoup/install/autoup_install.log || true
          sudo apt-get install -y unattended-upgrades | tee -a .github/echo/autoup/install/autoup_install.log || true
          echo 'sudo systemctl enable unattended-upgrades' | tee -a .github/echo/autoup/install/autoup_install.log || true
          sudo systemctl enable unattended-upgrades | tee -a .github/echo/autoup/install/autoup_install.log || true
          echo 'sudo systemctl start unattended-upgrades' | tee -a .github/echo/autoup/install/autoup_install.log || true
          sudo systemctl start unattended-upgrades | tee -a .github/echo/autoup/install/autoup_install.log || true
          echo '[autoup 설정/테스트/로그]' | tee -a .github/echo/autoup/install/autoup_install.log || true
          sudo unattended-upgrade --dry-run | tee -a .github/echo/autoup/install/autoup_install.log || true

      - name: 📄 autoup 주요 설정 에코파일 자동화
        run: |
          set -e
          mkdir -p .github/echo/autoup/config
          # 자동화 config 에코 생성
          echo "echo 'APT::Periodic::Update-Package-Lists \"1\";'" | tee .github/echo/autoup/config/10periodic
          echo 'APT::Periodic::Update-Package-Lists "1";' > .github/echo/autoup/config/10periodic
          echo "echo 'APT::Periodic::Unattended-Upgrade \"1\";'" | tee .github/echo/autoup/config/20auto-upgrades
          echo 'APT::Periodic::Unattended-Upgrade "1";' > .github/echo/autoup/config/20auto-upgrades
          echo "echo '[autoup 주요 설정 에코 생성 완료]'" | tee .github/echo/autoup/config/dir_create.log
