name: 🧩 Backup + API Speed Check for All Workflows

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  backup-and-api-check:
    runs-on: ubuntu-latest

    env:
      MAX_LATENCY_MS: 1000

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🧱 Prepare directories
        run: |
          echo "[📁] Creating directories..."
          mkdir -p .github/backup/workflows
          mkdir -p site/api_check

      - name: 📝 Backup all workflow files
        run: |
          echo "[📝] Copying .yml and .yaml files..."
          cp .github/workflows/*.yml .github/backup/workflows/ 2>/dev/null || echo "[ℹ️] No .yml files found"
          cp .github/workflows/*.yaml .github/backup/workflows/ 2>/dev/null || echo "[ℹ️] No .yaml files found"
          echo "[✅] Workflow backup completed."

      - name: 🔍 Echo each backed up workflow (preview)
        run: |
          echo "[🔍] Previewing workflow files..."
          for f in .github/backup/workflows/*.yml .github/backup/workflows/*.yaml; do
            [ -f "$f" ] || continue
            echo "🗂️ File: $f"
            head -n 10 "$f"
            echo "------------------------------"
          done

      - name: 📅 Commit backup (if changes exist)
        run: |
          if [ -d .git ]; then
            echo "[📅] Git repository detected. Preparing commit..."
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add .github/backup/workflows
            git diff --cached --quiet && echo "[ℹ️] No changes to commit." || (
              git commit -m "📦 Auto-backup of workflow files"
              echo "[✅] Commit done."
            )
          else
            echo "[❌] Not a git repo. Skipping commit."
          fi

      - name: 🚦 Auto-extract and check API speed from all workflows
        run: |
          echo "[⚙️] Extracting URLs from workflows and checking latency..."
          for wf in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$wf" ] || continue
            echo "🔎 Checking: $wf"
            FILE_ID=$(basename "$wf" | sed 's/\.[^.]*$//')
            OUTPUT="site/api_check/${FILE_ID}.json"
            echo "[" > "$OUTPUT"

            # Extract unique URLs from workflow
            urls=$(grep -Eo 'https?://[^ )\"]+' "$wf" | sort | uniq)
            index=0
            count=$(echo "$urls" | wc -l)
            for url in $urls; do
              echo "🌐 Checking $url..."
              start=$(date +%s%3N)
              status=$(curl -o /dev/null -s -w "%{http_code}" "$url")
              end=$(date +%s%3N)
              latency=$((end - start))

              echo "  {" >> "$OUTPUT"
              echo "    \"url\": \"$url\"," >> "$OUTPUT"
              echo "    \"status\": \"$status\"," >> "$OUTPUT"
              echo "    \"latency_ms\": $latency" >> "$OUTPUT"
              index=$((index+1))
              if [ $index -lt $count ]; then
                echo "  }," >> "$OUTPUT"
              else
                echo "  }" >> "$OUTPUT"
              fi
            done
            echo "]" >> "$OUTPUT"
            echo "✅ Saved to $OUTPUT"
          done

      - name: 💾 Upload all API check results
        uses: actions/upload-artifact@v4
        with:
          name: all-api-speed-results
          path: site/api_check/

      - name: 📊 Print summary of one result file
        run: |
          echo "[📊] Showing one result file:"
          cat site/api_check/*.json | head -n 50 || echo "[ℹ️] No results found."
