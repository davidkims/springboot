name: "🛡️ IDS Misuse-Detection Suite — ULTRA ALL-IN (Suricata PPA + Snort3 Docker + Huge Rules + ECHO Pack + Pages + Release)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-ultra"
  cancel-in-progress: false

jobs:
  ids-ultra:
    runs-on: ubuntu-latest
    env:
      PYTHONWARNINGS: "ignore::SyntaxWarning"
      ECHO_ROOT: .github/echo_ids
      OUT_DIR: .github/echo_ids/out
      RULE_DIR: .github/echo_ids/rules
      PCAP_DIR: .github/echo_ids/pcap
      LOG_DIR: .github/echo_ids/logs
      SITE_DIR: .github/echo_ids/out/site
      PACK_DIR: .github/echo_ids/echo-pack
      SNORT3_IMG: "ciscotalos/snort3:latest"

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📁 Prepare dirs & ECHO helpers"
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_ROOT" "$OUT_DIR" "$RULE_DIR" "$PCAP_DIR" "$LOG_DIR" "$OUT_DIR/conf" "$SITE_DIR" "$ECHO_ROOT/tools" "$PACK_DIR"
          cat > "$ECHO_ROOT/tools/echo.sh" <<'EOSH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          step(){ echo -e "\n[STEP] $*"; }
          ok(){ echo "[OK] $*"; }
          warn(){ echo "[WARN] $*" >&2; }
          fail(){ echo "[FAIL] $*" >&2; exit 1; }
          setup_trap(){ trap 'rc=$?; echo "[TRAP] Failed at: ${BASH_COMMAND} (rc=$rc)" >&2' ERR; }
          EOSH
          chmod +x "$ECHO_ROOT/tools/echo.sh"
          echo "[OK] ECHO helpers ready"

      - name: "🧩 Install Suricata (PPA 7/8.x) & base tools"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          step "APT update + base packages"
          sudo apt-get update -y
          sudo apt-get install -y software-properties-common curl jq ca-certificates gnupg lsb-release python3 python3-pip wireshark-common zip
          step "Add OISF Suricata PPA"
          sudo add-apt-repository -y ppa:oisf/suricata-stable
          sudo apt-get update -y
          step "Install Suricata"
          sudo apt-get install -y suricata
          ok "Suricata installed"
          step "Install Python deps"
          python3 -m pip install --upgrade pip
          python3 -m pip install scapy
          ok "Scapy installed"

      - name: "🐳 Pull Snort3 Docker image"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          docker --version || fail "Docker not available on runner"
          step "Pull Snort3 image"
          docker pull "$SNORT3_IMG"
          ok "Snort3 image ready"

      - name: "🔎 Versions (Suricata / Snort3)"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          step "Suricata version/build-info"
          suricata -V || true
          suricata --build-info || true
          step "Snort3 version/DAQ (Docker)"
          docker run --rm "$SNORT3_IMG" snort -V || true
          docker run --rm "$SNORT3_IMG" snort --daq-list || true

      - name: "📝 Generate HUGE ruleset (single-line rules, sticky buffers fixed)"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          step "Write category rules (SINGLE-LINE)"

          # WEB
          cat > "$RULE_DIR/web.rules" <<'R1'
          alert tcp $EXTERNAL_NET any -> $HOME_NET $HTTP_PORTS (msg:"WEB SQLi simple"; flow:to_server,established; content:"' OR 1=1 --"; nocase; http_uri; classtype:web-application-attack; sid:1000001; rev:3;)
          alert tcp $EXTERNAL_NET any -> $HOME_NET $HTTP_PORTS (msg:"WEB SQLi regex"; flow:to_server,established; pcre:"/(\bUNION\b|\bSELECT\b|\bUPDATE\b|\bINSERT\b).+(\bFROM\b|\bSET\b)/Ui"; http_uri; classtype:web-application-attack; sid:1000002; rev:3;)
          alert tcp $EXTERNAL_NET any -> $HOME_NET $HTTP_PORTS (msg:"WEB XSS body"; flow:to_server,established; content:"<script"; nocase; within:20; http_client_body; classtype:web-application-attack; sid:1000003; rev:3;)
          alert tcp $EXTERNAL_NET any -> $HOME_NET $HTTP_PORTS (msg:"WEB DirTraversal"; flow:to_server,established; content:"../"; nocase; http_uri; classtype:web-application-attack; sid:1000004; rev:3;)
          alert tcp $EXTERNAL_NET any -> $HOME_NET $HTTP_PORTS (msg:"WEB Suspicious UA sqlmap"; flow:to_server,established; content:"User-Agent|3a 20|sqlmap"; nocase; http_header; classtype:bad-unknown; sid:1000005; rev:3;)
          alert tcp $EXTERNAL_NET any -> $HOME_NET $HTTP_PORTS (msg:"WEB Possible PHP webshell upload"; flow:to_server,established; content:"<?php"; nocase; http_client_body; classtype:web-application-attack; sid:1000006; rev:3;)
          R1

          # RECON/SCAN
          cat > "$RULE_DIR/recon.rules" <<'R2'
          alert tcp $EXTERNAL_NET any -> $HOME_NET 1:65535 (msg:"RECON TCP SYN scan"; flags:S; flow:stateless; detection_filter:track by_src, count 20, seconds 5; classtype:attempted-recon; sid:1001001; rev:2;)
          alert icmp $EXTERNAL_NET any -> $HOME_NET any (msg:"RECON ICMP sweep"; itype:8; detection_filter:track by_src, count 10, seconds 5; classtype:attempted-recon; sid:1001002; rev:2;)
          R2

          # AUTH/SSH
          cat > "$RULE_DIR/auth.rules" <<'R3'
          alert tcp $EXTERNAL_NET any -> $HOME_NET 22 (msg:"AUTH SSH brute force"; flags:S; flow:to_server,stateless; detection_filter:track by_src, count 10, seconds 60; classtype:attempted-admin; sid:1002001; rev:2;)
          R3

          # DNS/EXFIL
          cat > "$RULE_DIR/dns.rules" <<'R4'
          alert udp $HOME_NET any -> $EXTERNAL_NET 53 (msg:"DNS exfil large query"; dns_query; dsize:>80; classtype:bad-unknown; sid:1003001; rev:2;)
          R4

          # TLS
          cat > "$RULE_DIR/tls.rules" <<'R6'
          alert tls $EXTERNAL_NET any -> $HOME_NET any (msg:"TLS SNI suspicious (.onion)"; content:".onion"; nocase; tls.sni; classtype:policy-violation; sid:1005001; rev:2;)
          R6

          # FTP/SMTP/SMB (light indicators)
          cat > "$RULE_DIR/misc.rules" <<'R7'
          alert tcp any any -> $HOME_NET 21 (msg:"FTP control usage"; flow:to_server,established; content:"220 "; depth:4; sid:1006001; rev:2;)
          alert tcp any any -> $HOME_NET 25 (msg:"SMTP HELO/MAIL"; flow:to_server,established; content:"HELO "; sid:1006002; rev:2;)
          alert tcp any any -> $HOME_NET 445 (msg:"SMB attempt"; flags:S; flow:stateless; sid:1006003; rev:2;)
          R7

          step "Combine rules → combined.local.rules"
          cat "$RULE_DIR/"*.rules > "$RULE_DIR/combined.local.rules"

          step "Normalize line endings (safety)"
          sed -i 's/\r$//' "$RULE_DIR/"*.rules "$RULE_DIR/combined.local.rules"

          wc -l "$RULE_DIR/"*.rules "$RULE_DIR/combined.local.rules" || true
          ok "combined.local.rules ready (single-line)"

      - name: "⬇️ Fetch ET Open & merge (always attempt, safe boundary)"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          step "Install suricata-update (if possible)"
          if ! dpkg -s suricata-update >/dev/null 2>&1; then
            # Suricata 8 패키지에 포함된 /usr/bin/suricata-update와 충돌할 수 있음 → 실패해도 경고 후 진행
            sudo apt-get install -y suricata-update || warn "suricata-update not available; continue"
          fi

          step "Fetch ET Open rules"
          mkdir -p "$OUT_DIR/et"
          if command -v suricata-update >/dev/null 2>&1; then
            suricata-update -o "$OUT_DIR/et" || warn "suricata-update failed; using local only"
          else
            warn "suricata-update unavailable; using local only"
          fi

          step "Build combined.rules (ET → LOCAL) with explicit boundary"
          {
            if [ -f "$OUT_DIR/et/suricata.rules" ]; then
              sed 's/\r$//' "$OUT_DIR/et/suricata.rules"
            fi
            echo ""
            echo "# ===== BEGIN LOCAL RULES ====="
            sed 's/\r$//' "$RULE_DIR/combined.local.rules"
            echo "# ===== END LOCAL RULES ====="
          } > "$RULE_DIR/combined.rules"

          # 최종 안전 정규화
          sed -i 's/\r$//' "$RULE_DIR/combined.rules"

          # 빠른 건전성 점검: 여는 괄호만 있고 옵션 없는 라인 탐지
          if grep -nE '^\s*alert [^(]*\($' "$RULE_DIR/combined.rules"; then
            warn "Suspicious lines detected (opened '(' without options)."
          fi

          wc -l "$RULE_DIR/combined.rules" || true
          ok "combined.rules ready (ET + LOCAL)"

      - name: "📝 Snort3 container snort.lua (uses combined.rules)"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          cat > "$OUT_DIR/conf/snort.lua" <<'LUA'
          ips = default_ips
          ips.rules = [[ include /work/rules/combined.rules ]]
          alert_fast = { file = true }
          LUA
          ok "snort.lua ready"

      - name: "🧪 Build PCAP suite (SQLi/XSS/DNS + RECON + SSH BF)"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          step "Create Scapy PCAP builder"
          cat > "$PCAP_DIR/build_pcap.py" <<'PY'
          import logging, sys, random
          logging.getLogger("scapy.runtime").setLevel(logging.ERROR)
          from scapy.all import Ether, IP, TCP, UDP, ICMP, Raw, wrpcap, conf
          conf.verb = 0
          out_path = sys.argv[1] if len(sys.argv) > 1 else "suite.pcap"
          pkts=[]
          # SQLi GET
          pkts.append(Ether()/IP(src="192.0.2.10",dst="192.0.2.20")/TCP(sport=12345,dport=80,flags="S",seq=1)/Raw(load=b"GET /search?q=' OR 1=1 -- HTTP/1.1\r\nHost: x\r\n\r\n"))
          # XSS POST
          body=b"<script>alert(1)</script>"
          post=(b"POST /comment HTTP/1.1\r\nHost: x\r\nContent-Length: "+str(len(body)).encode()+b"\r\n\r\n")+body
          pkts.append(Ether()/IP(src="192.0.2.11",dst="192.0.2.20")/TCP(sport=23456,dport=80,flags="S",seq=1)/Raw(load=post))
          # DNS exfil (long query)
          q=b"\x12\x34\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00"+(b"a"*90)+b"\x00\x00\x01\x00\x01"
          pkts.append(Ether()/IP(src="198.51.100.10",dst="198.51.100.53")/UDP(sport=53000,dport=53)/Raw(load=q))
          # RECON SYN scan (25 ports)
          for dport in list(range(10000,10025)):
              pkts.append(Ether()/IP(src="203.0.113.50",dst="192.0.2.20")/TCP(sport=40000,dport=dport,flags="S",seq=random.randint(1,1<<32)))
          # SSH brute force (12 SYNs)
          for i in range(12):
              pkts.append(Ether()/IP(src="203.0.113.60",dst="192.0.2.20")/TCP(sport=41000+i,dport=22,flags="S",seq=random.randint(1,1<<32)))
          wrpcap(out_path, pkts)
          print(f"[OK] wrote {out_path} ({len(pkts)} packets)")
          PY
          step "Build PCAP to fixed path"
          python3 "$PCAP_DIR/build_pcap.py" "$PCAP_DIR/suite.pcap"
          step "List PCAP dir"
          ls -l "$PCAP_DIR"
          ok "PCAP ready at $PCAP_DIR/suite.pcap"

      - name: "🧷 Optional stage: default-rule-path copy"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          SYS_YAML="/etc/suricata/suricata.yaml"
          DEFAULT_RULE_PATH=$(sudo awk -F': *' '/^[[:space:]]*default-rule-path:/ {gsub(/"/,"",$2);print $2;exit}' "$SYS_YAML" || true)
          [ -z "$DEFAULT_RULE_PATH" ] && DEFAULT_RULE_PATH="/etc/suricata/rules"
          sudo mkdir -p "$DEFAULT_RULE_PATH"
          sudo cp "$RULE_DIR/combined.rules" "$DEFAULT_RULE_PATH/combined.rules" || true
          sudo cp "$SYS_YAML" "$OUT_DIR/conf/suricata.yaml" || true
          ok "Suricata defaults staged (optional)"

      - name: "✅ Config tests (Suricata -T with -S / Snort3 dry parse)"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          step "Suricata -T (-S combined.rules)"
          sudo suricata -T -c /etc/suricata/suricata.yaml -S "$RULE_DIR/combined.rules" -v
          ok "Suricata config OK"
          step "Snort3 dry parse (Docker)"
          docker run --rm -v "$PWD/.github/echo_ids:/work" -w /work "$SNORT3_IMG" \
            snort -c /work/out/conf/snort.lua -S /work/rules/combined.rules -q -l /work/out/snort3 -k none -A alert_fast -r /work/pcap/suite.pcap || true
          ok "Snort3 dry parse OK"

      - name: "▶️ Offline detect run (PCAP)"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          step "Suricata offline run"
          mkdir -p "$OUT_DIR/suricata"
          sudo suricata -r "$PCAP_DIR/suite.pcap" -S "$RULE_DIR/combined.rules" -l "$OUT_DIR/suricata" -k none
          echo "[SURICATA] fast.log ↓"; test -f "$OUT_DIR/suricata/fast.log" && tail -n +1 "$OUT_DIR/suricata/fast.log" || warn "No fast.log"
          step "Snort3 offline run (Docker)"
          mkdir -p "$OUT_DIR/snort3"
          docker run --rm -v "$PWD/.github/echo_ids:/work" -w /work "$SNORT3_IMG" \
            snort -c /work/out/conf/snort.lua -S /work/rules/combined.rules -A alert_fast -q -l /work/out/snort3 -r /work/pcap/suite.pcap -k none
          echo "[SNORT3] alert_fast.log ↓"; test -f "$OUT_DIR/snort3/alert_fast.log" && tail -n +1 "$OUT_DIR/snort3/alert_fast.log" || warn "No alert_fast.log"
          ok "Offline runs done"

      - name: "🔎 Assertions (WEB/DNS/RECON/SSH on both engines)"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          PASS=1
          # Suricata assertions
          for pat in "WEB SQLi simple" "WEB XSS body" "DNS exfil large query" "RECON TCP SYN scan" "AUTH SSH brute force"; do
            if ! grep -q "$pat" "$OUT_DIR/suricata/fast.log"; then
              warn "[ASSERT][SURICATA] Missing: $pat"; PASS=0
            else
              ok "[ASSERT][SURICATA] Fired: $pat"
            fi
          done
          # Snort3 assertions
          for pat in "WEB SQLi simple" "WEB XSS body" "DNS exfil large query" "RECON TCP SYN scan" "AUTH SSH brute force"; do
            if ! grep -q "$pat" "$OUT_DIR/snort3/alert_fast.log"; then
              warn "[ASSERT][SNORT3] Missing: $pat"; PASS=0
            else
              ok "[ASSERT][SNORT3] Fired: $pat"
            fi
          done
          [ "$PASS" -eq 1 ] || fail "One or more detections did not trigger on both engines"
          ok "All assertions passed"

      - name: "📊 Build Pages report (static HTML)"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          step "Generate JSON summary + HTML"
          python3 - <<'PY'
          import json, os, re, datetime
          base = ".github/echo_ids/out"
          paths = {"suricata": os.path.join(base, "suricata", "fast.log"),
                   "snort3":   os.path.join(base, "snort3", "alert_fast.log")}
          events=[]
          for engine, p in paths.items():
            if not os.path.isfile(p): continue
            with open(p, "r", errors="ignore") as f:
              for line in f:
                if line.strip(): events.append({"engine": engine, "line": line.strip()})
          def key(line):
            m = re.search(r'\[\*\*\]\s*(.*?)\s*\[\*\*\]', line)  # snort-style
            return m.group(1) if m else "event"
          counts={}
          for e in events:
            counts[key(e["line"])] = counts.get(key(e["line"]), 0)+1
          summary={"generated": datetime.datetime.utcnow().isoformat()+"Z","total":len(events),"by_message":counts}
          os.makedirs(os.path.join(base,"site"), exist_ok=True)
          with open(os.path.join(base,"site","summary.json"),"w") as w: json.dump(summary,w,indent=2,ensure_ascii=False)
          html=f"""<!doctype html><html><head><meta charset="utf-8">
          <title>IDS Suite Report</title>
          <style>body{{font-family:sans-serif;max-width:900px;margin:40px auto;padding:0 16px}}
          h1{{margin:0 0 8px}}.card{{padding:16px;border:1px solid #ddd;border-radius:12px;margin:12px 0}}
          table{{border-collapse:collapse;width:100%}}td,th{{border:1px solid #eee;padding:8px;text-align:left}}
          code{{background:#f6f7f8;padding:2px 4px;border-radius:6px}}</style></head><body>
          <h1>IDS Misuse-Detection Suite — Report</h1>
          <p><b>Generated (UTC):</b> {summary['generated']}</p>
          <div class="card"><h2>Summary</h2>
          <p><b>Total alerts:</b> {summary['total']}</p>
          <table><thead><tr><th>Message</th><th>Count</th></tr></thead><tbody>
          {''.join(f'<tr><td>{k}</td><td>{v}</td></tr>' for k,v in sorted(summary['by_message'].items(), key=lambda x:-x[1]))}
          </tbody></table></div>
          <div class="card"><h2>Raw logs</h2>
          <p>Suricata: <code>out/suricata/fast.log</code><br>Snort3: <code>out/snort3/alert_fast.log</code></p>
          </div></body></html>"""
          with open(os.path.join(base,"site","index.html"),"w") as w: w.write(html)
          PY
          ok "Pages site generated"

      - name: "📦 Build ECHO PACK (dirs/files + installers + manifest)"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          step "Create ECHO PACK tree"
          mkdir -p "$PACK_DIR"/{rules,pcap,logs,conf,site,tools}
          cp -a "$RULE_DIR/combined.rules" "$PACK_DIR/rules/"
          cp -a "$RULE_DIR/"*.rules "$PACK_DIR/rules/" || true
          cp -a "$PCAP_DIR/suite.pcap" "$PACK_DIR/pcap/" || true
          cp -a "$OUT_DIR/suricata/fast.log" "$PACK_DIR/logs/" || true
          cp -a "$OUT_DIR/snort3/alert_fast.log" "$PACK_DIR/logs/" || true
          cp -a "$OUT_DIR/conf/"* "$PACK_DIR/conf/" || true
          cp -a "$SITE_DIR/"* "$PACK_DIR/site/" || true
          cp -a "$ECHO_ROOT/tools/echo.sh" "$PACK_DIR/tools/" || true

          step "Write install scripts (Suricata system, Snort3 docker)"
          cat > "$PACK_DIR/tools/install_suricata.sh" <<'BASH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          echo "[ECHO] Installing combined.rules into Suricata default-rule-path..."
          SYS_YAML="/etc/suricata/suricata.yaml"
          [ -f "$SYS_YAML" ] || { echo "[FAIL] suricata.yaml not found"; exit 1; }
          DEFAULT_RULE_PATH=$(awk -F': *' '/^[[:space:]]*default-rule-path:/ {gsub(/"/,"",$2);print $2;exit}' "$SYS_YAML" || true)
          [ -z "$DEFAULT_RULE_PATH" ] && DEFAULT_RULE_PATH="/etc/suricata/rules"
          sudo mkdir -p "$DEFAULT_RULE_PATH"
          sudo cp "$(dirname "$0")/../rules/combined.rules" "$DEFAULT_RULE_PATH/combined.rules"
          echo "[OK] Copied to $DEFAULT_RULE_PATH/combined.rules"
          echo "[ECHO] Test: sudo suricata -T -c $SYS_YAML -S $DEFAULT_RULE_PATH/combined.rules -v"
          BASH
          chmod +x "$PACK_DIR/tools/install_suricata.sh"

          cat > "$PACK_DIR/tools/run_snort3_docker.sh" <<'BASH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          here="$(cd "$(dirname "$0")"/.. && pwd)"
          docker run --rm -v "$here":/work -w /work ciscotalos/snort3:latest \
            snort -c /work/conf/snort.lua -S /work/rules/combined.rules -A alert_fast -q -l /work/logs -r /work/pcap/suite.pcap -k none
          echo "[OK] Snort3 finished. See logs/alert_fast.log"
          BASH
          chmod +x "$PACK_DIR/tools/run_snort3_docker.sh"

          step "Write ECHO README"
          cat > "$PACK_DIR/README_ECHO.md" <<'MD'
          # ECHO PACK
          - `rules/combined.rules` : 로컬+ET 병합 룰
          - `pcap/suite.pcap` : SQLi/XSS/DNS/RECON/SSH 샘플
          - `tools/install_suricata.sh` : Suricata 시스템 적용
          - `tools/run_snort3_docker.sh` : Snort3 Docker 구동
          - `conf/` : snort.lua 등 구성 샘플
          - `logs/` : 실행 로그 샘플
          - `site/` : 정적 리포트
          MD

          step "Write manifest + checksums"
          cat > "$PACK_DIR/manifest.json" <<JSON
          {
            "name": "ids-echo-pack",
            "version": "${GITHUB_RUN_NUMBER}",
            "generated_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "contents": ["rules","pcap","logs","conf","site","tools"]
          }
          JSON
          (cd "$PACK_DIR" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          ok "ECHO PACK ready"

      - name: "📦 Bundle artifacts (tar.gz & zip)"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          step "Create bundles"
          TAR_BUNDLE="ids-ultra-bundle-${GITHUB_RUN_NUMBER}.tar.gz"
          PACK_TAR="ids-echo-pack-${GITHUB_RUN_NUMBER}.tar.gz"
          PACK_ZIP="ids-echo-pack-${GITHUB_RUN_NUMBER}.zip"
          tar -czf "$TAR_BUNDLE" -C .github/echo_ids rules pcap out
          tar -czf "$PACK_TAR" -C .github/echo_ids echo-pack
          (cd .github/echo_ids && zip -qr "../../$PACK_ZIP" echo-pack)
          mv "$TAR_BUNDLE" "$OUT_DIR/$TAR_BUNDLE"
          mv "$PACK_TAR" "$OUT_DIR/$PACK_TAR"
          mv "$PACK_ZIP" "$OUT_DIR/$PACK_ZIP"
          ls -l "$OUT_DIR/" | sed -n '1,200p'
          ok "Bundles created"

      - name: "⬆️ Upload run artifacts (incl. ECHO PACK)"
        uses: actions/upload-artifact@v4
        with:
          name: ids-ultra-artifacts
          path: |
            .github/echo_ids/out/**
            .github/echo_ids/rules/**
            .github/echo_ids/pcap/**
            .github/echo_ids/echo-pack/**
          if-no-files-found: warn

      - name: "📤 Upload Pages artifact"
        uses: actions/upload-pages-artifact@v4
        with:
          path: .github/echo_ids/out/site

      - name: "🏷️ Create Release (attach bundles)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ids-ultra-${{ github.run_number }}
          name: IDS ULTRA ${{ github.run_number }}
          body: |
            ULTRA run ${{ github.run_number }} — includes combined.rules (ET+LOCAL), multi-PCAPs, logs, static report, and full ECHO PACK with installers.
          files: |
            .github/echo_ids/out/ids-ultra-bundle-${{ github.run_number }}.tar.gz
            .github/echo_ids/out/ids-echo-pack-${{ github.run_number }}.tar.gz
            .github/echo_ids/out/ids-echo-pack-${{ github.run_number }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    needs: ids-ultra
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "🚀 Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
