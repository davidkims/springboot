name: 🧪 TradingAgents Setup & Test

on:
  workflow_dispatch:

jobs:
  tradingagents-setup:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: tradingagents
          python-version: 3.11
          auto-update-conda: true
          auto-activate-base: false

      - name: 📁 Step 1:Create directories
        shell: bash
        run: |
          echo "============================================"
          echo "[📁] Step 1: Creating directories"
          echo "============================================"
          mkdir -p logs output site scripts configs
          touch logs/.keep
          echo "[✅] Directories created: logs/, output/, site/, scripts/, configs/"

      - name: 📄 Step 2:Create requirements.txt if not exists
        shell: bash
        run: |
          echo "============================================"
          echo "[📄] Step 2: Create requirements.txt"
          echo "============================================"
          if [ ! -f requirements.txt ]; then
            echo "openai" > requirements.txt
            echo "finnhub-python" >> requirements.txt
            echo "langgraph" >> requirements.txt
            echo "tradingagents" >> requirements.txt
            echo "[⚠️] requirements.txt not found - created with default content"
          else
            echo "[✅] requirements.txt already exists"
          fi
          echo "[📄] Current contents of requirements.txt:"
          cat requirements.txt

      - name: 📦 Step 3:Install pip modules
        shell: bash
        run: |
          echo "============================================"
          echo "[📦] Step 3: Installing pip modules"
          echo "============================================"
          pip install --upgrade pip
          pip install -r requirements.txt
          echo "[✅] Pip modules installed"

      - name: 📄 Step 4:Create run_tradingagents.py
        shell: bash
        run: |
          echo "============================================"
          echo "[📄] Step 4: Create run_tradingagents.py"
          echo "============================================"
          echo 'print("[🧠] STEP 1: Importing modules...")' > run_tradingagents.py
          echo 'try:' >> run_tradingagents.py
          echo '    from tradingagents.graph.trading_graph import TradingAgentsGraph' >> run_tradingagents.py
          echo '    from tradingagents.default_config import DEFAULT_CONFIG' >> run_tradingagents.py
          echo 'except ImportError as e:' >> run_tradingagents.py
          echo '    print("[❌] Import failed:", e)' >> run_tradingagents.py
          echo '    exit(1)' >> run_tradingagents.py
          echo 'print("[⚙️] STEP 2: Initializing graph...")' >> run_tradingagents.py
          echo 'ta = TradingAgentsGraph(debug=True, config=DEFAULT_CONFIG.copy())' >> run_tradingagents.py
          echo 'print("[📈] STEP 3: Calling propagate()...")' >> run_tradingagents.py
          echo '_, decision = ta.propagate("NVDA", "2024-05-10")' >> run_tradingagents.py
          echo 'print("[💡] STEP 4: Decision result:")' >> run_tradingagents.py
          echo 'print(decision)' >> run_tradingagents.py
          echo "[✅] run_tradingagents.py created"

      - name: 📂 Step 5:Copy script to scripts/tests
        shell: bash
        run: |
          echo "[📂] Step 5: Copying script to scripts/tests"
          mkdir -p scripts/tests
          cp run_tradingagents.py scripts/tests/
          echo "[✅] run_tradingagents.py copied to scripts/tests/"

      - name: 🧪 Step 6:Run test script
        shell: bash
        run: |
          echo "============================================"
          echo "[🧪] Step 6: Run test script"
          echo "============================================"
          python run_tradingagents.py || echo "[❌] Test script failed"
          echo "[✅] Test script execution complete"
          echo "============================================"
        env:
          FINNHUB_API_KEY: dummy_key
          OPENAI_API_KEY: dummy_key
