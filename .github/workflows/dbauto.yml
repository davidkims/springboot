name: 🗂️ All Workflow YAML → DB/CLI/echo DB/다중복제 + echo 자동확장

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  workflow-dbify:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 주요 디렉토리/로그/백업/다중복제 생성 (echo)
        run: |
          # 주요 작업/로그/DB/백업 디렉토리
          for d in .github/sql .github/error_logs .github/cli_test .github/cli_test_bak .github/cli_test_bak2 .github/echo_db .github/echo_db_bak
          do
            echo "echo 'mkdir -p $d'"
            mkdir -p $d
          done
          echo "echo 'touch .github/error_logs/disabled_workflows.txt'" ; touch .github/error_logs/disabled_workflows.txt
          echo "echo 'touch .github/error_logs/init_check.log'" ; touch .github/error_logs/init_check.log

      - name: 📄 requirements.txt 생성 (echo)
        run: |
          echo "echo 'pyyaml' > requirements.txt"
          echo 'pyyaml' > requirements.txt

      - name: 🐳 여러 CLI 설치 스크립트/echo DB SQL 자동생성 (echo)
        run: |
          # 지원 CLI 목록
          CLIS="python3 java node mvn go docker"
          for cli in $CLIS; do
            fn=".github/cli_test/${cli}_install.sh"
            echo "echo '#!/usr/bin/env bash' > $fn"
            echo '#!/usr/bin/env bash' > $fn
            echo "echo 'set -e' >> $fn"
            echo 'set -e' >> $fn
            echo "echo 'echo [AUTO] $cli 설치 및 버전확인' >> $fn"
            echo "echo [AUTO] $cli 설치 및 버전확인" >> $fn

            if [ "$cli" = "python3" ]; then
              echo "echo 'sudo apt-get install -y python3 python3-pip' >> $fn"
              echo 'sudo apt-get install -y python3 python3-pip' >> $fn
              echo "echo 'python3 --version' >> $fn"
              echo 'python3 --version' >> $fn
              echo "echo 'pip3 --version' >> $fn"
              echo 'pip3 --version' >> $fn
            elif [ "$cli" = "java" ]; then
              echo "echo 'sudo apt-get install -y openjdk-17-jdk openjdk-11-jdk' >> $fn"
              echo 'sudo apt-get install -y openjdk-17-jdk openjdk-11-jdk' >> $fn
              echo "echo 'java -version' >> $fn"
              echo 'java -version' >> $fn
              echo "echo 'javac -version' >> $fn"
              echo 'javac -version' >> $fn
            elif [ "$cli" = "node" ]; then
              echo "echo 'sudo apt-get install -y nodejs npm' >> $fn"
              echo 'sudo apt-get install -y nodejs npm' >> $fn
              echo "echo 'node --version' >> $fn"
              echo 'node --version' >> $fn
              echo "echo 'npm --version' >> $fn"
              echo 'npm --version' >> $fn
            elif [ "$cli" = "mvn" ]; then
              echo "echo 'sudo apt-get install -y maven' >> $fn"
              echo 'sudo apt-get install -y maven' >> $fn
              echo "echo 'mvn -version' >> $fn"
              echo 'mvn -version' >> $fn
            elif [ "$cli" = "go" ]; then
              echo "echo 'sudo apt-get install -y golang-go' >> $fn"
              echo 'sudo apt-get install -y golang-go' >> $fn
              echo "echo 'go version' >> $fn"
              echo 'go version' >> $fn
            elif [ "$cli" = "docker" ]; then
              echo "echo 'sudo apt-get remove -y docker docker-engine docker.io containerd runc || true' >> $fn"
              echo 'sudo apt-get remove -y docker docker-engine docker.io containerd runc || true' >> $fn
              echo "echo 'sudo apt-get update -y' >> $fn"
              echo 'sudo apt-get update -y' >> $fn
              echo "echo 'sudo apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release' >> $fn"
              echo 'sudo apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release' >> $fn
              echo "echo 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg' >> $fn"
              echo 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg' >> $fn
              echo "echo 'echo \"deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu \$(lsb_release -cs) stable\" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null' >> $fn"
              echo 'echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null' >> $fn
              echo "echo 'sudo apt-get update -y' >> $fn"
              echo 'sudo apt-get update -y' >> $fn
              echo "echo 'sudo apt-get install -y docker-ce docker-ce-cli containerd.io' >> $fn"
              echo 'sudo apt-get install -y docker-ce docker-ce-cli containerd.io' >> $fn
              echo "echo '(docker --version || { echo \"[ERROR] docker 설치 실패 (skip)\"; true; })' >> $fn"
              echo '(docker --version || { echo "[ERROR] docker 설치 실패 (skip)"; true; })' >> $fn
            fi
            chmod +x $fn
          done

          # echo DB SQL들
          for dbname in cli echo docker sample; do
            sqlfile=".github/sql/${dbname}_echo_db.sql"
            echo "echo '-- [${dbname}] echo db demo' > $sqlfile"
            echo "-- [${dbname}] echo db demo" > $sqlfile
            echo "echo 'CREATE TABLE IF NOT EXISTS ${dbname}_logs (id INTEGER PRIMARY KEY AUTOINCREMENT, msg TEXT, created_at DATETIME DEFAULT CURRENT_TIMESTAMP);' >> $sqlfile"
            echo "CREATE TABLE IF NOT EXISTS ${dbname}_logs (id INTEGER PRIMARY KEY AUTOINCREMENT, msg TEXT, created_at DATETIME DEFAULT CURRENT_TIMESTAMP);" >> $sqlfile
            echo "echo \"INSERT INTO ${dbname}_logs (msg) VALUES ('${dbname} echo db 생성됨!');\" >> $sqlfile"
            echo "INSERT INTO ${dbname}_logs (msg) VALUES ('${dbname} echo db 생성됨!');" >> $sqlfile
          done

      - name: 🐍 workflow2db.py 자동 echo/복제/DB생성 전체 구현 (동적 자동화 포함)
        run: |
          echo "import os" > workflow2db.py
          echo "import shutil" >> workflow2db.py
          echo "import sqlite3" >> workflow2db.py
          echo "from datetime import datetime" >> workflow2db.py
          echo "" >> workflow2db.py
          echo "WORKFLOWS_DIR = '.github/workflows'" >> workflow2db.py
          echo "DB_PATH = '.github/workflows.db'" >> workflow2db.py
          echo "ERROR_LOG_DIR = '.github/error_logs'" >> workflow2db.py
          echo "CLI_TEST_DIR = '.github/cli_test'" >> workflow2db.py
          echo "SQL_DIR = '.github/sql'" >> workflow2db.py
          echo "BACKUP_DIRS = ['.github/cli_test_bak', '.github/cli_test_bak2', '.github/echo_db_bak']" >> workflow2db.py
          echo "" >> workflow2db.py
          echo "def init_db():" >> workflow2db.py
          echo "    for d in [ERROR_LOG_DIR, CLI_TEST_DIR, SQL_DIR]+BACKUP_DIRS:" >> workflow2db.py
          echo "        if not os.path.exists(d): os.makedirs(d, exist_ok=True)" >> workflow2db.py
          echo "    if not os.path.exists(DB_PATH):" >> workflow2db.py
          echo "        conn = sqlite3.connect(DB_PATH)" >> workflow2db.py
          echo "        c = conn.cursor()" >> workflow2db.py
          echo "        c.execute('''CREATE TABLE IF NOT EXISTS workflows (id INTEGER PRIMARY KEY AUTOINCREMENT, filename TEXT, language TEXT, cli_tools TEXT, raw_yaml TEXT)''')" >> workflow2db.py
          echo "        conn.commit()" >> workflow2db.py
          echo "        conn.close()" >> workflow2db.py
          # 자동 복제/백업
          echo "    for fname in os.listdir(CLI_TEST_DIR):" >> workflow2db.py
          echo "        if fname.endswith('_install.sh'):" >> workflow2db.py
          echo "            src = os.path.join(CLI_TEST_DIR, fname)" >> workflow2db.py
          echo "            for bak in BACKUP_DIRS:" >> workflow2db.py
          echo "                shutil.copy2(src, os.path.join(bak, fname))" >> workflow2db.py
          echo "    for fname in os.listdir(SQL_DIR):" >> workflow2db.py
          echo "        if fname.endswith('_echo_db.sql'):" >> workflow2db.py
          echo "            src = os.path.join(SQL_DIR, fname)" >> workflow2db.py
          echo "            for bak in BACKUP_DIRS:" >> workflow2db.py
          echo "                shutil.copy2(src, os.path.join(bak, fname))" >> workflow2db.py
          echo "" >> workflow2db.py
          echo "if __name__ == '__main__':" >> workflow2db.py
          echo "    print('[echo] DB/CLI 자동 디렉토리/파일 생성 및 다중 복제 시작')" >> workflow2db.py
          echo "    init_db()" >> workflow2db.py
          echo "    print('[echo] 완료!')" >> workflow2db.py

      - name: 🧪 pip 설치 및 패키지 설치
        run: |
          echo "echo 'sudo apt-get update -y'" ; sudo apt-get update -y
          echo "echo 'sudo apt-get install -y python3-pip'" ; sudo apt-get install -y python3-pip
          echo "echo 'pip install --upgrade pip'" ; pip install --upgrade pip
          echo "echo 'pip install -r requirements.txt'" ; pip install -r requirements.txt

      - name: 🚀 workflow2db.py 실행 (동적 자동화, echo, 다중 복제/검증 포함)
        run: |
          echo "echo '[실행] workflow2db.py (동적 자동화+다중 복제 포함)'"
          echo '[실행] workflow2db.py (동적 자동화+다중 복제 포함)'
          python3 workflow2db.py

      - name: 🛠️ 생성된 모든 CLI 설치/echo DB/복제본 echo 검증
        run: |
          echo '[검증] CLI 설치 스크립트 목록'
          ls -l .github/cli_test/*_install.sh
          echo '[검증] SQL echo DB 파일 목록'
          ls -l .github/sql/*_echo_db.sql
          echo '[검증] 복제본 디렉토리'
          for d in .github/cli_test_bak .github/cli_test_bak2 .github/echo_db_bak; do
            echo "[복제본] $d"
            ls -l $d || true
          done

      - name: 📂 최종 결과 요약
        run: |
          echo '[최종 결과] DB, CLI, echo DB, 다중 복제 확인'
          ls -lh .github/workflows.db
          echo '[로그] .github/error_logs/*, disabled_workflows.txt'
          ls -l .github/error_logs || true
          cat .github/error_logs/disabled_workflows.txt || true
