name: 🧾 NTUSER.DAT Backup & Tools Setup

on:
  workflow_dispatch:

jobs:
  ntuser-dat-backup:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: 📁 사용자 경로 및 변수 정의
        run: |
          $UserName = $env:USERNAME
          $UserDir = "C:\Users\$UserName"
          $NTUserFile = "$UserDir\NTUSER.DAT"
          $BackupDir = "$UserDir\ProfileBackups"
          $Now = Get-Date -Format "yyyyMMddHHmm"
          $BackupFile = "$BackupDir\NTUSER.DAT.$Now.bak"
          $GitRepo = "https://raw.githubusercontent.com/davidkims/ntuser-tools/main"

          if (-Not (Test-Path $NTUserFile)) {
              Write-Host "[ERROR] NTUSER.DAT 파일을 찾을 수 없습니다: $NTUserFile"
              exit 1
          }

          if (-Not (Test-Path $BackupDir)) {
              New-Item -ItemType Directory -Path $BackupDir -Force | Out-Null
          }

          Copy-Item $NTUserFile $BackupFile -Force
          Write-Host "[INFO] 백업 저장됨: $BackupFile"

      - name: ☁ GitHub에서 복구 스크립트 다운로드
        run: |
          $ScriptList = @("ntuser_restore.ps1", "ntuser_zip.ps1", "install_7zip.ps1")
          $BackupDir = "C:\Users\$env:USERNAME\ProfileBackups"
          $GitRepo = "https://raw.githubusercontent.com/davidkims/ntuser-tools/main"

          foreach ($script in $ScriptList) {
              $url = "$GitRepo/$script"
              $dest = "$BackupDir\$script"
              Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
              Write-Host "[INFO] 다운로드 완료: $script"
          }

      - name: 📦 7-Zip 설치 확인 및 자동 설치
        run: |
          $sevenZipPath = "${env:ProgramFiles}\7-Zip\7z.exe"
          if (-Not (Test-Path $sevenZipPath)) {
              Write-Host "[INFO] 7-Zip 미설치 상태. 설치 진행 중..."
              $installer = "$env:TEMP\7z.exe"
              Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z2301-x64.exe" -OutFile $installer
              Start-Process $installer -ArgumentList "/S" -Wait
              Write-Host "[INFO] 7-Zip 설치 완료"
          } else {
              Write-Host "[INFO] 7-Zip 이미 설치됨"
          }

      - name: ✅ 완료 안내
        run: |
          $BackupDir = "C:\Users\$env:USERNAME\ProfileBackups"
          Write-Host "✔ 복원: $BackupDir\ntuser_restore.ps1"
          Write-Host "✔ 압축: $BackupDir\ntuser_zip.ps1"
          Write-Host "✔ 복원 대상 지정: NTUSER.DAT.RESTORE 파일 준비 필요"
