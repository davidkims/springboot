name: 📤 Upload MySQL Manual with Script Generation

on:
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 📝 Generate download_manual.sh Script
        shell: bash
        run: |
          echo "[📝] .github/download_manual.sh 생성 시작"
          mkdir -p .github
          echo '#!/bin/bash' > .github/download_manual.sh
          echo '' >> .github/download_manual.sh
          echo 'echo "[📥] MySQL 명령어 매뉴얼 다운로드 시작"' >> .github/download_manual.sh
          echo '' >> .github/download_manual.sh
          echo '# 다운로드 디렉토리 생성' >> .github/download_manual.sh
          echo 'mkdir -p .github/manuals' >> .github/download_manual.sh
          echo '' >> .github/download_manual.sh
          echo '# 실제 매뉴얼 또는 예제 SQL 덤프 다운로드 (원하는 링크로 교체 가능)' >> .github/download_manual.sh
          echo 'curl -L -o .github/manuals/mysql_commands_manual.txt https://raw.githubusercontent.com/datacharmer/test_db/master/load_employees.dump' >> .github/download_manual.sh
          echo '' >> .github/download_manual.sh
          echo 'echo "[✔] 다운로드 완료: .github/manuals/mysql_commands_manual.txt"' >> .github/download_manual.sh

          chmod +x .github/download_manual.sh
          echo "[✔] 스크립트 생성 완료: .github/download_manual.sh"

      - name: 📥 Run Download Script
        run: |
          echo "[📥] 다운로드 스크립트 실행"
          bash .github/download_manual.sh

      - name: 📦 Copy Manual to docs/
        run: |
          echo "[📦] docs 디렉토리 생성 및 파일 복사"
          mkdir -p docs
          cp .github/manuals/mysql_commands_manual.txt docs/

      - name: 📝 Commit and Push Manual
        run: |
          echo "[📝] Git 설정 및 파일 푸시"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/mysql_commands_manual.txt .github/download_manual.sh
          git commit -m "📘 Add MySQL command manual and download script" || echo "✅ No changes to commit"
          git push || echo "✅ Push skipped (possibly no changes or fork PR context)"
