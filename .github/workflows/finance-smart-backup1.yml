name: S3 백업 업로드 (awscli 설치 오류 완벽 대응, echo 포함)

on:
  workflow_dispatch:

jobs:
  upload_backup:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-2
      S3_BUCKET_NAME: your-s3-backup-bucket

    steps:
      - name: 🛠️ AWS CLI(v2) 공식 인스톨러 설치 (echo)
        run: |
          echo "echo '[0] AWS CLI 공식 인스톨러 설치...'"
          echo '[0] AWS CLI 공식 인스톨러 설치...'
          # Remove awscli if installed (clean)
          sudo rm -rf /usr/local/aws-cli /usr/local/bin/aws || true
          echo "echo 'curl -sSLO https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip'"
          curl -sSLO "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
          echo "echo 'unzip -q awscli-exe-linux-x86_64.zip'"
          unzip -q awscli-exe-linux-x86_64.zip
          echo "echo 'sudo ./aws/install --update'"
          sudo ./aws/install --update
          echo "echo 'aws --version'"
          aws --version

      - name: 📁 /tmp/db_backups 디렉토리 생성 (echo)
        run: |
          echo "echo '[1] /tmp/db_backups 디렉토리 생성...'"
          echo '[1] /tmp/db_backups 디렉토리 생성...'
          mkdir -p /tmp/db_backups

      - name: 🌐 DB 백업파일 다운로드 (echo, 최신 URL)
        id: download
        run: |
          echo "echo '[2] 백업 파일 다운로드...'"
          echo '[2] 백업 파일 다운로드...'
          BACKUP_FILE_URL="https://raw.githubusercontent.com/lerocha/chinook-database/master/ChinookDatabase/DataSources/Chinook_PostgreSql.sql"
          BACKUP_FILE_NAME=$(basename "$BACKUP_FILE_URL")
          BACKUP_FILE_PATH="/tmp/db_backups/${BACKUP_FILE_NAME}"
          echo "echo \"wget -O \\\"$BACKUP_FILE_PATH\\\" \\\"$BACKUP_FILE_URL\\\"\""
          wget -O "$BACKUP_FILE_PATH" "$BACKUP_FILE_URL"
          echo "echo \"다운로드 파일 경로: $BACKUP_FILE_PATH\""
          echo "다운로드 파일 경로: $BACKUP_FILE_PATH"
          echo "BACKUP_FILE_PATH=$BACKUP_FILE_PATH" >> $GITHUB_OUTPUT
          echo "BACKUP_FILE_NAME=$BACKUP_FILE_NAME" >> $GITHUB_OUTPUT

      - name: ☁️ AWS 자격 증명 구성 (echo)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ⬆️ S3에 백업 업로드 (echo)
        run: |
          BACKUP_FILE_PATH="${{ steps.download.outputs.BACKUP_FILE_PATH }}"
          BACKUP_FILE_NAME="${{ steps.download.outputs.BACKUP_FILE_NAME }}"
          echo "echo '[3] aws s3 cp 명령 실행...'"
          echo '[3] aws s3 cp 명령 실행...'
          echo "aws s3 cp \"$BACKUP_FILE_PATH\" \"s3://${{ env.S3_BUCKET_NAME }}/backups/$BACKUP_FILE_NAME\""
          aws s3 cp "$BACKUP_FILE_PATH" "s3://${{ env.S3_BUCKET_NAME }}/backups/$BACKUP_FILE_NAME"
          echo "echo '✅ S3 업로드 완료: s3://${{ env.S3_BUCKET_NAME }}/backups/$BACKUP_FILE_NAME'"
          echo "✅ S3 업로드 완료: s3://${{ env.S3_BUCKET_NAME }}/backups/$BACKUP_FILE_NAME"

      - name: 🧹 로컬 백업 파일 정리 (echo)
        if: always()
        run: |
          echo "echo '[4] 로컬 임시 백업 파일/폴더 삭제...'"
          echo '[4] 로컬 임시 백업 파일/폴더 삭제...'
          rm -rf /tmp/db_backups awscli-exe-linux-x86_64.zip aws
          echo "echo '✅ 로컬 백업 파일 정리 완료'"
          echo "✅ 로컬 백업 파일 정리 완료"
