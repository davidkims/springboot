name: 🧾 Multi-Transaction Backup (Per-Type Containers)

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  finance:
    runs-on: ubuntu-latest

    env:
      ROOT_PASS: rootpass123
      GIT_EMAIL: github-actions@users.noreply.github.com
      GIT_NAME: github-actions
      SQL_DIR: /opt/finance/sql
      BACKUP_DIR: /opt/finance/backups
      PROVENANCE_DIR: /opt/finance/provenance
      TYPES: |
        bank_transfer
        check_card
        credit_card
        bitcoin
        stock
        futures

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📁 Prepare Directories & init.sql
        run: |
          echo "[📁] Setting up directories..."
          sudo mkdir -p $SQL_DIR $BACKUP_DIR $PROVENANCE_DIR
          sudo chmod -R 777 /opt/finance

          echo "[📝] Creating init.sql..."
          echo "CREATE TABLE IF NOT EXISTS transfers (
            id INT AUTO_INCREMENT PRIMARY KEY,
            type VARCHAR(30),
            amount DECIMAL(15,2),
            currency VARCHAR(5),
            status VARCHAR(20)
          );" > $SQL_DIR/init.sql

          for TYPE in $TYPES; do
            echo "-- Inserts for $TYPE" >> $SQL_DIR/init.sql
            for i in $(seq 1 100); do
              AMOUNT=$(( (RANDOM % 1000000) + 1000 ))
              STATUS=$([ $((RANDOM % 2)) -eq 0 ] && echo "completed" || echo "pending")
              echo "INSERT INTO transfers(type, amount, currency, status) VALUES('$TYPE', $AMOUNT, 'KRW', '$STATUS');" >> $SQL_DIR/init.sql
            done
          done
          echo "[✔] init.sql ready"

      - name: 🔁 Loop over types
        run: |
          for TYPE in $TYPES; do
            DB_NAME="db_${TYPE}"
            DB_USER="user_${TYPE}"
            DB_PASS="pass_${TYPE}"
            CONTAINER="mysql_${TYPE}"
            PORT=$((3307 + RANDOM % 1000))

            echo "🚀 Starting $CONTAINER..."
            docker run -d \
              --name $CONTAINER \
              -e MYSQL_ROOT_PASSWORD=$ROOT_PASS \
              -e MYSQL_DATABASE=$DB_NAME \
              -e MYSQL_USER=$DB_USER \
              -e MYSQL_PASSWORD=$DB_PASS \
              -v $SQL_DIR:/docker-entrypoint-initdb.d \
              -p $PORT:3306 \
              --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$ROOT_PASS --silent" \
              --health-interval=5s \
              --health-timeout=3s \
              --health-retries=10 \
              mysql:8.0

            echo "⏳ Waiting for $CONTAINER to be healthy..."
            for i in {1..10}; do
              if ! docker ps -a --format '{{.Names}}' | grep -q "^$CONTAINER$"; then
                echo "[❌] $CONTAINER crashed"
                exit 1
              fi
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' $CONTAINER || echo "notfound")
              echo "  - Health $i: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "[✔] Healthy"
                break
              fi
              sleep 6
              if [ $i -eq 10 ]; then
                docker logs $CONTAINER
                docker stop $CONTAINER
                exit 1
              fi
            done

            echo "🔍 Checking completed rows for $TYPE..."
            COUNT=$(mysql -h 127.0.0.1 -P $PORT -u$DB_USER -p$DB_PASS -N -e "USE $DB_NAME; SELECT COUNT(*) FROM transfers WHERE type='$TYPE' AND status='completed';")
            echo "✅ Found $COUNT completed"

            if [ "$COUNT" != "0" ]; then
              FILE="$BACKUP_DIR/${TYPE}_backup.sql"
              echo "💾 Backing up to $FILE"
              mysqldump --no-tablespaces -h 127.0.0.1 -P $PORT -u$DB_USER -p$DB_PASS $DB_NAME > $FILE

              PROV_FILE="$PROVENANCE_DIR/.provenance_${TYPE}.json"
              echo "[📜] Creating provenance via echo to $PROV_FILE"
              {
                echo '{'
                echo "  \"type\": \"$TYPE\","
                echo "  \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
                echo "  \"status\": \"completed\","
                echo "  \"backup_file\": \"$FILE\","
                echo "  \"workflow\": \"${{ github.workflow }}\","
                echo "  \"repository\": \"${{ github.repository }}\","
                echo "  \"run_id\": \"${{ github.run_id }}\","
                echo "  \"run_number\": \"${{ github.run_number }}\""
                echo '}'
              } > "$PROV_FILE"
              echo "[✔] Provenance file created: $PROV_FILE"
            else
              echo "⏭️ No data for $TYPE"
            fi

            docker stop $CONTAINER
          done

      - name: 🗜️ Compress Backups
        run: |
          echo "[🗜️] Compressing..."
          cd $BACKUP_DIR
          ARCHIVE="finance-backups-$(date +%Y%m%d%H%M%S).tar.gz"
          tar -czf $ARCHIVE *.sql
          echo "[✔] Archive: $ARCHIVE"

      - name: 🏷️ Git Tag Push
        run: |
          TAG="v$(date +%Y%m%d-%H%M%S)"
          echo "[🏷️] Tagging: $TAG"
          git config --global user.email "${{ env.GIT_EMAIL }}"
          git config --global user.name "${{ env.GIT_NAME }}"
          git fetch origin
          git tag "$TAG"
          git push origin "$TAG"
