name: "💾 MEGA Disk Boost + EchoOps + Service AutoUpgrade + 24x7 Watchdog (forced upgrades)"

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "빠른 시작 프리셋(safe|aggressive)"
        required: false
        default: "safe"
      disk:
        description: "디스크: root=1536,temp=512,swap=1024,rm_dotnet=1,rm_android=1,rm_haskell=1,rm_codeql=1,rm_docker=1"
        required: false
        default: "root=1536,temp=512,swap=1024,rm_dotnet=1,rm_android=1,rm_haskell=1,rm_codeql=1,rm_docker=1"
      upgrade:
        description: "업그레이드(무시됨; 항상 실행): os=true,docker=true"
        required: false
        default: "os=true,docker=true"
      services:
        description: "업그레이드 대상(쉼표): mysql,postgres,redis,mongo,kafka,rabbitmq,vault,minio,airflow,spark,camunda"
        required: false
        default: "mysql,postgres,redis,mongo,kafka,rabbitmq,vault,minio,airflow,spark,camunda"
      watchdog:
        description: "워치독: minutes=300,interval=60,ws=20480,root=8192,auto=1"
        required: false
        default: "minutes=300,interval=60,ws=20480,root=8192,auto=1"

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: disk-boost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  disk-boost:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: ♻️ Init env & LOG_DIR
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "LOG_DIR=$RUNNER_TEMP/disklogs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/disklogs" .github/echo_logs

      - name: 🔧 Parse compact inputs → $GITHUB_ENV
        shell: bash
        env:
          PRESET:   ${{ github.event.inputs.preset }}
          DISK:     ${{ github.event.inputs.disk }}
          UPGRADE:  ${{ github.event.inputs.upgrade }}
          SERVICES: ${{ github.event.inputs.services }}
          WATCHDOG: ${{ github.event.inputs.watchdog }}
        run: |
          set -Eeuo pipefail
          kv() { local s="$1" k="$2" def="$3" v; v="$(printf '%s\n' "$s" | tr ', ' '\n\n' | awk -F= -v k="$2" '$1==k{print $2}' | tail -n1)"; [ -n "$v" ] && printf '%s\n' "$v" || printf '%s\n' "$def"; }
          bnorm(){ case "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" in 1|true|yes|on) echo true;; *) echo false;; esac; }

          case "$PRESET" in
            aggressive)
              DISK="${DISK:-root=1024,temp=256,swap=512,rm_dotnet=1,rm_android=1,rm_haskell=1,rm_codeql=1,rm_docker=1}"
              WATCHDOG="${WATCHDOG:-minutes=330,interval=30,ws=25600,root=10240,auto=1}"
            ;;
          esac

          ROOT_MB="$(kv "${DISK}" root 1536)"
          TEMP_MB="$(kv "${DISK}" temp 512)"
          SWAP_MB="$(kv "${DISK}" swap 1024)"
          RM_DOTNET="$(bnorm "$(kv "${DISK}" rm_dotnet 1)")"
          RM_ANDROID="$(bnorm "$(kv "${DISK}" rm_android 1)")"
          RM_HASKELL="$(bnorm "$(kv "${DISK}" rm_haskell 1)")"
          RM_CODEQL="$(bnorm "$(kv "${DISK}" rm_codeql 1)")"
          RM_DOCKER="$(bnorm "$(kv "${DISK}" rm_docker 1)")"

          # 항상 실행(입력값 무시)
          UPG_OS=true
          UPG_DKR=true

          WD_MIN="$(kv "${WATCHDOG}" minutes 300)"
          WD_INT="$(kv "${WATCHDOG}" interval 60)"
          WD_WS_MB="$(kv "${WATCHDOG}" ws 20480)"
          WD_RT_MB="$(kv "${WATCHDOG}" root 8192)"
          WD_AUTO="$(bnorm "$(kv "${WATCHDOG}" auto 1)")"

          {
            echo "ROOT_RESERVE_MB=${ROOT_MB}"
            echo "TEMP_RESERVE_MB=${TEMP_MB}"
            echo "SWAP_SIZE_MB=${SWAP_MB}"
            echo "REMOVE_DOTNET=${RM_DOTNET}"
            echo "REMOVE_ANDROID=${RM_ANDROID}"
            echo "REMOVE_HASKELL=${RM_HASKELL}"
            echo "REMOVE_CODEQL=${RM_CODEQL}"
            echo "REMOVE_DOCKER_IMAGES=${RM_DOCKER}"

            echo "UPGRADE_OS=${UPG_OS}"
            echo "UPGRADE_DOCKER=${UPG_DKR}"
            echo "UPGRADE_SERVICES=${SERVICES}"

            echo "WATCH_MIN=${WD_MIN}"
            echo "WATCH_INT=${WD_INT}"
            echo "WATCH_WS_MB=${WD_WS_MB}"
            echo "WATCH_RT_MB=${WD_RT_MB}"
            echo "WATCH_AUTO=${WD_AUTO}"
          } >> "$GITHUB_ENV"

      - name: 🔎 BEFORE snapshot (pre-checkout)
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "[TIME] $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "[BEFORE] df -h"; df -h
            echo; echo "[BEFORE] lsblk"; lsblk
            echo; echo "[BEFORE] mount(dev)"; mount | grep -E '^/dev' || true
          } | tee "$LOG_DIR/before.log"

      - name: 🧹 Free up preinstalled stuff (safe cleanup)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 💽 Maximize build space (LVM over workspace)
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: ${{ env.ROOT_RESERVE_MB }}
          temp-reserve-mb: ${{ env.TEMP_RESERVE_MB }}
          swap-size-mb: ${{ env.SWAP_SIZE_MB }}
          remove-dotnet: ${{ env.REMOVE_DOTNET }}
          remove-android: ${{ env.REMOVE_ANDROID }}
          remove-haskell: ${{ env.REMOVE_HASKELL }}
          remove-codeql: ${{ env.REMOVE_CODEQL }}
          remove-docker-images: ${{ env.REMOVE_DOCKER_IMAGES }}

      - name: 📥 Checkout (after disk boost)
        uses: actions/checkout@v4

      - name: 📁 Generate scripts (.github/echo_*)
        shell: bash
        env:
          DOCKER_IMAGE_MYSQL: mysql:8
          DOCKER_IMAGE_POSTGRES: postgres:16
          DOCKER_IMAGE_REDIS: redis:7
          DOCKER_IMAGE_MONGO: mongo:7
          DOCKER_IMAGE_KAFKA: bitnami/kafka:latest
          DOCKER_IMAGE_RABBITMQ: rabbitmq:3-management
          DOCKER_IMAGE_VAULT: hashicorp/vault:latest
          DOCKER_IMAGE_MINIO: minio/minio:latest
          DOCKER_IMAGE_AIRFLOW: apache/airflow:latest
          DOCKER_IMAGE_SPARK: bitnami/spark:latest
          DOCKER_IMAGE_CAMUNDA: camunda/camunda-bpm-platform:latest
        run: |
          set -Eeuo pipefail
          mkdir -p .github/echo_disk .github/echo_logs .github/echo_monitoring .github/echo_upgrade

          cat > .github/echo_disk/boost_now.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          echo "[BOOST_NOW] start: $(date -u '+%F %T UTC')"
          echo "[INFO] Pre df -h"; df -h || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          rm -rf ~/.cache/pip ~/.npm ~/.cache/yarn ~/.cache/pipenv || true
          if command -v docker >/dev/null 2>&1; then
            docker system prune -af || true
            docker builder prune -af || true
          fi
          echo "[INFO] Post df -h"; df -h || true
          echo "[BOOST_NOW] done"
          SH
          chmod +x .github/echo_disk/boost_now.sh

          cat > .github/echo_disk/df_snapshot.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ts="$(date -u '+%Y%m%dT%H%M%SZ')"; out=".github/echo_logs/df_${ts}.log"
          { echo "[TIME] $(date -u '+%F %T UTC')"; echo "[DF]"; df -h; echo; echo "[LSBLK]"; lsblk; echo; echo "[MOUNT(dev)]"; mount | grep -E '^/dev' || true; } | tee "$out"
          echo "[SNAPSHOT] saved $out"
          SH
          chmod +x .github/echo_disk/df_snapshot.sh

          cat > .github/echo_monitoring/top_sizes.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          mkdir -p .github/echo_monitoring
          set +o pipefail
          du -ah . | sort -hr | head -n 50 > .github/echo_monitoring/top_file_sizes.txt || true
          du -sh . > .github/echo_monitoring/total_size.txt || true
          set -o pipefail
          echo "[MONITOR] top sizes written"
          SH
          chmod +x .github/echo_monitoring/top_sizes.sh

          cat > .github/echo_upgrade/os_autoup.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          echo "[OS-UP] start: $(date -u '+%F %T UTC')"
          sudo apt-get update -y
          mkdir -p .github/echo_upgrade
          (apt list --upgradable 2>/dev/null | tail -n +2 || true) > .github/echo_upgrade/autoup_targets.txt || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::="--force-confnew" dist-upgrade
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          echo "[OS-UP] done"
          SH
          chmod +x .github/echo_upgrade/os_autoup.sh

          cat > .github/echo_upgrade/docker_upgrade.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          SERVICES_CSV="${1:-mysql,postgres,redis,mongo,kafka,rabbitmq,vault,minio,airflow,spark,camunda}"
          IFS=',' read -r -a SRVS <<< "$SERVICES_CSV"
          echo "[DKR-UP] services: ${SRVS[*]}"
          image_for() {
            svc="$1"; key="DOCKER_IMAGE_${svc^^}"; eval "img=\${$key:-}"
            if [ -n "$img" ]; then echo "$img"; return 0; fi
            case "$svc" in
              mysql) echo "mysql:8" ;;
              postgres) echo "postgres:16" ;;
              redis) echo "redis:7" ;;
              mongo) echo "mongo:7" ;;
              kafka) echo "bitnami/kafka:latest" ;;
              rabbitmq) echo "rabbitmq:3-management" ;;
              vault) echo "hashicorp/vault:latest" ;;
              minio) echo "minio/minio:latest" ;;
              airflow) echo "apache/airflow:latest" ;;
              spark) echo "bitnami/spark:latest" ;;
              camunda) echo "camunda/camunda-bpm-platform:latest" ;;
              *) echo ""; return 1 ;;
            esac
          }
          has_compose() { command -v docker >/dev/null 2>&1 || return 1; command -v docker compose >/dev/null 2>&1 || command -v docker-compose >/dev/null 2>&1; }
          for svc in "${SRVS[@]}"; do
            svc_trim="$(echo "$svc" | xargs)"; [ -z "$svc_trim" ] && continue
            img="$(image_for "$svc_trim" || true)"
            echo "[DKR-UP] >>> $svc_trim (image=$img)"
            if command -v docker >/dev/null 2>&1; then
              [ -n "$img" ] && docker pull "$img" || true
              if has_compose && { [ -f docker-compose.yml ] || [ -f compose.yml ]; }; then
                if docker compose version >/dev/null 2>&1; then
                  docker compose pull "$svc_trim" || true
                  docker compose up -d "$svc_trim" || true
                else
                  docker-compose pull "$svc_trim" || true
                  docker-compose up -d "$svc_trim" || true
                fi
              else
                found="$(docker ps -a --format '{{.Names}}' | grep -iE "\\b$svc_trim\\b" || true)"
                [ -n "$found" ] && echo "[DKR-UP] container(s) exist: $found (image refreshed; re-create not attempted)"
              fi
            else
              echo "[DKR-UP] docker not available — skipped"
            fi
          done
          echo "[DKR-UP] done"
          SH
          chmod +x .github/echo_upgrade/docker_upgrade.sh

          for s in mysql postgres redis mongo kafka rabbitmq vault minio airflow spark camunda; do
            cat > ".github/echo_upgrade/upgrade_${s}.sh" <<SH
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ./.github/echo_upgrade/docker_upgrade.sh "$s"
          SH
            chmod +x ".github/echo_upgrade/upgrade_${s}.sh"
          done

          cat > .github/echo_disk/watchdog.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          DURATION_MIN="${1:-300}"
          INTERVAL_SEC="${2:-60}"
          THRESH_WS_MB="${3:-20480}"
          THRESH_ROOT_MB="${4:-8192}"
          AUTO_BOOST="${5:-true}"
          SRVS="${6:-mysql,postgres,redis,mongo,kafka,rabbitmq,vault,minio,airflow,spark,camunda}"
          RUN_OS_UP=true
          RUN_DKR_UP=true
          end_ts=$(( $(date +%s) + DURATION_MIN*60 ))
          log=".github/echo_logs/watchdog_$(date -u '+%Y%m%dT%H%M%SZ').log"
          echo "[WATCHDOG] start $(date -u '+%F %T UTC')" | tee -a "$log"
          echo "[WATCHDOG] interval=${INTERVAL_SEC}s ws=${THRESH_WS_MB}MB root=${THRESH_ROOT_MB}MB auto=${AUTO_BOOST}" | tee -a "$log"
          while [ "$(date +%s)" -lt "$end_ts" ]; do
            ws="${GITHUB_WORKSPACE:-.}"
            avail_ws=$(df -Pm "$ws"  | awk 'NR==2{print $4+0}')
            avail_rt=$(df -Pm /      | awk 'NR==2{print $4+0}')
            echo "[WD] $(date -u '+%H:%M:%S') avail_ws=${avail_ws}MB avail_root=${avail_rt}MB" | tee -a "$log"
            need_boost=false
            [ "$avail_ws" -lt "$THRESH_WS_MB" ]  && need_boost=true
            [ "$avail_rt" -lt "$THRESH_ROOT_MB" ] && need_boost=true
            if $need_boost && [ "$AUTO_BOOST" = "true" ]; then
              echo "[WD] threshold crossed → boost_now.sh" | tee -a "$log"
              bash .github/echo_disk/boost_now.sh | tee -a "$log" || true
              bash .github/echo_disk/df_snapshot.sh || true
              bash .github/echo_upgrade/os_autoup.sh | tee -a "$log" || true
              bash .github/echo_upgrade/docker_upgrade.sh "$SRVS" | tee -a "$log" || true
            fi
            sleep "$INTERVAL_SEC"
          done
          echo "[WATCHDOG] end $(date -u '+%F %T UTC')" | tee -a "$log"
          SH
          chmod +x .github/echo_disk/watchdog.sh

      # 🔵 여기부터 "필수 실행"
      - name: 🔄 OS 패키지 자동 업그레이드 실행(필수)
        shell: bash
        run: bash .github/echo_upgrade/os_autoup.sh

      - name: 🐳 Docker/Compose 업그레이드 실행(필수)
        shell: bash
        run: bash .github/echo_upgrade/docker_upgrade.sh "${{ env.UPGRADE_SERVICES }}"

      - name: 🕒 Start 24x7 watchdog loop (bounded)
        shell: bash
        run: |
          set -Eeuo pipefail
          bash .github/echo_disk/watchdog.sh "${WATCH_MIN}" "${WATCH_INT}" "${WATCH_WS_MB}" "${WATCH_RT_MB}" "${WATCH_AUTO}" "${UPGRADE_SERVICES}"

      - name: 🔁 AFTER snapshot + summary
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "[TIME] $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "[AFTER] df -h"; df -h
          } | tee "$LOG_DIR/after.log"
          total=$(df -h | awk '$6=="/"{print $2}')
          avail=$(df -h | awk '$6=="/"{print $4}')
          ws_total=$(df -h | awk -v ws="$GITHUB_WORKSPACE" '$6==ws{print $2}')
          ws_avail=$(df -h | awk -v ws="$GITHUB_WORKSPACE" '$6==ws{print $4}')
          {
            echo "## 💾 Disk Boost + 강제 Service Upgrade + 24x7 Watchdog 결과"
            echo "- 루트: **$total** (가용 **$avail**)"
            echo "- 작업공간: **${ws_total:-N/A}** (가용 **${ws_avail:-N/A}**)"
            echo ""
            echo "### 대상 서비스"
            echo "- ${UPGRADE_SERVICES}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📦 Upload logs artifact
        uses: actions/upload-artifact@v4
        with:
          name: disk-24x7-logs
          path: |
            ${{ env.LOG_DIR }}/before.log
            ${{ env.LOG_DIR }}/after.log
            .github/echo_logs/**
            .github/echo_monitoring/**
            .github/echo_upgrade/**
          if-no-files-found: warn
