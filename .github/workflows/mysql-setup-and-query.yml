name: 🐬 MySQL Workflow (경고 자동 감지/조치, Full Echo)

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  mysql-job:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass123
          MYSQL_DATABASE: sample_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass123
      MYSQL_DB: sample_db

    steps:
      - name: 📦 [echo] Checkout Repository
        uses: actions/checkout@v4

      - name: 🔄 [echo] System Full Package Upgrade (+zoneinfo, tzdata, pwgen)
        run: |
          echo "echo '[🔄] 패키지 업그레이드 ...'"
          mkdir -p .github/logs
          {
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get -y upgrade
            sudo DEBIAN_FRONTEND=noninteractive apt-get -y dist-upgrade
            sudo apt-get -y autoremove
            sudo apt-get install -y tree zip gnupg grep tzdata pwgen
            sudo apt-get install -y --reinstall tzdata
          } > .github/logs/sys_upgrade.log 2>&1
          echo "echo '[🔄] 패키지 업그레이드 및 유틸 설치 완료'"

      - name: 📁 [echo] Prepare Directories (All Log/Echo)
        run: |
          echo "echo '[📁] mkdir -p sql export backup .github/queries .github/echo .github/logs .github/mysql_logs .github/mysql_logs/warnings'"
          mkdir -p sql export backup .github/queries .github/echo .github/logs .github/mysql_logs .github/mysql_logs/warnings
          for f in .github/logs/mysql_workflow.log .github/mysql_logs/mysql_echo.txt .github/mysql_logs/warnings/mysql_warnings.txt .github/mysql_logs/warnings/mysql_warnings_only.txt; do
            echo "echo '[📁] touch $f'"
            touch $f
          done

      - name: 🩺 [echo] Wait for MySQL Health & Save Logs & Detect Warnings
        run: |
          echo "echo '[🩺] MySQL Health Check + 경고 감지/echo ...'"
          CID=$(docker ps -q --filter "ancestor=mysql:8.0")
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $CID)
            echo "Health status: $STATUS (attempt $i)"
            if [[ "$STATUS" == "healthy" ]]; then
              echo "[✔] MySQL is healthy"
              break
            fi
            sleep 2
          done

          # 전체 로그 저장
          docker logs $CID > .github/mysql_logs/container.log 2>&1
          echo "echo '[🩺] MySQL container logs 저장: .github/mysql_logs/container.log'"

          # 경고 메시지 전체 분리 추출
          grep -i "warning" .github/mysql_logs/container.log > .github/mysql_logs/warnings/mysql_warnings.txt || true
          grep -i "^Warning:" .github/mysql_logs/container.log > .github/mysql_logs/warnings/mysql_warnings_only.txt || true

          # 주요 경고(빈 패스워드, --skip-host-cache) 감지 시 echo
          # 1. 빈 패스워드 경고
          if grep -q "root@localhost is created with an empty password" .github/mysql_logs/warnings/mysql_warnings_only.txt; then
            echo "echo '[⚠️] 빈 루트 패스워드 경고 감지! --initialize-insecure로 생성됨.'"
            echo "[⚠️] 빈 루트 패스워드 경고 감지 (무시해도 됨, 이미 rootpass123으로 초기화됨)" >> .github/mysql_logs/mysql_echo.txt
          fi
          # 2. --skip-host-cache 경고
          if grep -q "The syntax '--skip-host-cache' is deprecated" .github/mysql_logs/warnings/mysql_warnings_only.txt; then
            echo "echo '[⚠️] --skip-host-cache 비추천 경고 감지! 즉시 완화 SQL 실행'"
            echo "[⚠️] --skip-host-cache 비추천 경고 감지 (SET GLOBAL host_cache_size=0 자동 실행)" >> .github/mysql_logs/mysql_echo.txt
            MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER -e "SET GLOBAL host_cache_size=0;" || true
          fi

          echo "echo '[🩺] 경고 체크/로깅/자동조치 완료'"

      # --- 이하 기존 단계(계정, 패스워드, VPN, 방화벽 등) 그대로 추가 사용 ---
      # ... (가상계정 생성, 패스워드, VPN, 방화벽 echo 등)

      - name: 🚀 [echo] Upload Artifacts (log, warnings, echo)
        uses: actions/upload-artifact@v4
        with:
          name: mysql-full-backup-${{ github.run_id }}
          path: |
            .github/logs/*.log
            .github/mysql_logs/*
            .github/mysql_logs/warnings/mysql_warnings.txt
            .github/mysql_logs/warnings/mysql_warnings_only.txt

      - name: 🗂️ [echo] Show log/warnings/echo structure
        run: |
          echo "echo '[🗂️] tree 디렉토리 구조 ...'"
          tree .github/mysql_logs || true
          tree .github/logs || true
          ls -lh .github/mysql_logs/ .github/logs/
