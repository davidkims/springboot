name: 🛡️ OpenSSF Scorecard Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # 매일 오전 10시(KST 기준)

permissions:
  contents: read
  security-events: write
  actions: read

env:
  TARGET_REPO: davidkims/springboot
  OUT_DIR: .github/scorecard
  SCORECARD_VERSION: v4.13.0

jobs:
  run-scorecard:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 리포지토리 체크아웃
        uses: actions/checkout@v4

      - name: 📂 디렉토리 생성 및 echo 출력
        run: |
          echo "[+] 디렉토리 생성 중: $OUT_DIR"
          mkdir -p $OUT_DIR/bin
          echo "[✔] 디렉토리 생성 완료"
          tree .github || true

      - name: 🧰 Scorecard CLI 설치 및 유효성 검사
        run: |
          echo "[+] Scorecard CLI 설치 시작"
          DOWNLOAD_URL="https://github.com/ossf/scorecard/releases/download/${SCORECARD_VERSION}/scorecard-linux-amd64"
          curl -s -L -o $OUT_DIR/bin/scorecard "$DOWNLOAD_URL"

          echo "[+] 설치 파일 확인 중..."
          file $OUT_DIR/bin/scorecard
          if file $OUT_DIR/bin/scorecard | grep -q "ELF 64-bit"; then
            echo "[✔] 유효한 Scorecard 바이너리입니다."
          else
            echo "[❌] 잘못된 파일 다운로드됨 (HTML 등)"
            head -n 10 $OUT_DIR/bin/scorecard
            exit 1
          fi

          chmod +x $OUT_DIR/bin/scorecard
          echo "[✔] 실행 권한 부여 완료"
          $OUT_DIR/bin/scorecard --version

      - name: 🧪 Scorecard 실행 및 JSON 저장
        run: |
          echo "[+] Scorecard 보안 점수 평가 시작"
          $OUT_DIR/bin/scorecard --repo=https://github.com/$TARGET_REPO --format=json --show-details > $OUT_DIR/scorecard-report.json
          echo "[✔] scorecard-report.json 생성 완료"

      - name: 📄 요약 정보 추출 (summary.json)
        run: |
          echo "[+] 요약 정보 생성 시작"
          jq '[.checks[] | {name, score, reason}]' $OUT_DIR/scorecard-report.json > $OUT_DIR/scorecard-summary.json
          echo "[✔] summary.json 생성 완료"

      - name: 📦 SARIF 파일 생성
        run: |
          echo "[+] SARIF 파일 생성 중..."
          $OUT_DIR/bin/scorecard --repo=https://github.com/$TARGET_REPO --format=sarif > $OUT_DIR/scorecard-results.sarif
          echo "[✔] SARIF 파일 저장 완료"

      - name: 📊 SARIF 업로드 (Code Scanning)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.OUT_DIR }}/scorecard-results.sarif
