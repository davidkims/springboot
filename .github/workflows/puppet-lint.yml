name: ♾️ Transfer Log Backup - Cron (60건 Infinite)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  transfer_log_backup:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      oracle:
        image: gvenzl/oracle-xe:21-faststart
        env:
          ORACLE_PASSWORD: testpass
          ORACLE_ALLOW_REMOTE: "true"
        ports:
          - 1521:1521

    env:
      BACKUP_DIR: /opt/backup/transfer
      INIT_SCRIPTS_DIR: /opt/db/init
      DB_CONFIG_DIR: /opt/db/config
      POOLING_CONFIG: /opt/db/config/pooling.properties
      SSL_CERT_DIR: /opt/db/ssl
      MONITORING_DIR: /opt/monitor
      K8S_DIR: /opt/k8s
      HELM_CHART_DIR: /opt/helm/backup-chart

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 📁 Prepare directories and permissions
        run: |
          echo "[📁] Creating required directories with sudo..."
          for dir in \
            $INIT_SCRIPTS_DIR/mysql \
            $INIT_SCRIPTS_DIR/postgres \
            $INIT_SCRIPTS_DIR/oracle \
            $DB_CONFIG_DIR \
            $SSL_CERT_DIR \
            $BACKUP_DIR/incremental \
            $MONITORING_DIR/metrics \
            $MONITORING_DIR/logs \
            $K8S_DIR/docker-compose \
            $K8S_DIR/manifests \
            $HELM_CHART_DIR; do
            sudo mkdir -p "$dir"
            sudo chmod 750 "$dir"
          done
          echo "[🔒] Ensuring overall directory permissions..."
          sudo find /opt/db /opt/backup /opt/monitor /opt/k8s /opt/helm -type d -exec chmod 750 {} +

      - name: 📝 Generate DB init scripts
        run: |
          echo "[📝] Writing MySQL init script..."
          cat << 'EOF' | sudo tee "$INIT_SCRIPTS_DIR/mysql/init.sql"
          ALTER USER 'root'@'%' IDENTIFIED BY 'testpass' PASSWORD EXPIRE INTERVAL 90 DAY;
          CREATE USER 'app'@'%' IDENTIFIED BY 'testpass';
          GRANT SELECT, INSERT, UPDATE ON testdb.* TO 'app'@'%';
          SOURCE /opt/db/init/mysql/schema.sql;
          EOF

          echo "[📝] Writing PostgreSQL init script..."
          cat << 'EOF' | sudo tee "$INIT_SCRIPTS_DIR/postgres/init.sql"
          ALTER ROLE postgres PASSWORD 'postgres';
          CREATE ROLE app LOGIN PASSWORD 'postgres' NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT;
          GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA public TO app;
          EOF

          echo "[📝] Writing Oracle init script..."
          cat << 'EOF' | sudo tee "$INIT_SCRIPTS_DIR/oracle/init.sql"
          CREATE USER app IDENTIFIED BY "testpass";
          GRANT CONNECT TO app;
          GRANT CREATE SESSION TO app;
          EXIT;
          EOF

      - name: ⚙️ Generate pooling config
        run: |
          echo "[⚙️] Writing JDBC connection pooling properties..."
          sudo mkdir -p "$(dirname $POOLING_CONFIG)"
          cat << 'EOF' | sudo tee "$POOLING_CONFIG"
          dataSourceClassName=com.mysql.cj.jdbc.MysqlDataSource
          dataSource.user=app
          dataSource.password=testpass
          dataSource.databaseName=testdb
          maximumPoolSize=20
          minimumIdle=5
          connectionTimeout=30000
          idleTimeout=600000
          EOF

      - name: 🔐 Generate self-signed SSL certificates
        run: |
          echo "[🔐] Generating SSL/TLS certificates..."
          sudo mkdir -p "$SSL_CERT_DIR"
          openssl req -newkey rsa:2048 -nodes -keyout "$SSL_CERT_DIR/db.key" \
            -x509 -days 365 -out "$SSL_CERT_DIR/db.crt" \
            -subj "/CN=database.local"
          sudo chmod 600 "$SSL_CERT_DIR/db.key" "$SSL_CERT_DIR/db.crt"

      - name: 🐳 Generate Docker Compose
        run: |
          echo "[🐳] Writing docker-compose.yml..."
          sudo mkdir -p "$K8S_DIR/docker-compose"
          cat << 'EOF' | sudo tee "$K8S_DIR/docker-compose/docker-compose.yml"
          version: '3.8'
          services:
            backup:
              image: backup-service:latest
              volumes:
                - $BACKUP_DIR:/data
                - $SSL_CERT_DIR:/certs
              environment:
                - POOLING_CONFIG=/opt/db/config/pooling.properties
                - SSL_CERT=/certs/db.crt
                - SSL_KEY=/certs/db.key
              restart: on-failure
          EOF

      - name: ☸️ Generate Kubernetes manifests
        run: |
          echo "[☸️] Writing backup job manifest..."
          sudo mkdir -p "$K8S_DIR/manifests"
          cat << 'EOF' | sudo tee "$K8S_DIR/manifests/backup-job.yaml"
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: backup-job
          spec:
            template:
              spec:
                containers:
                - name: backup
                  image: backup-service:latest
                  args: ["--config=/opt/db/config/pooling.properties"]
                  envFrom:
                  - secretRef:
                      name: db-secrets
                restartPolicy: OnFailure
          EOF

      - name: 🎯 Generate Helm chart scaffold
        run: |
          echo "[🎯] Writing Helm Chart and values..."
          sudo mkdir -p "$HELM_CHART_DIR"
          cat << 'EOF' | sudo tee "$HELM_CHART_DIR/Chart.yaml"
          apiVersion: v2
          name: backup-system
          version: 0.1.0
          description: Backup & restore system
          EOF
          cat << 'EOF' | sudo tee "$HELM_CHART_DIR/values.yaml"
          image:
            repository: backup-service
            tag: latest
          backup:
            target:
              - s3://my-bucket/backups
              - gs://my-bucket/backups
            encryptionKey: {{ .Values.encryptionKey }}
          EOF

      - name: 📊 Generate monitoring config
        run: |
          echo "[📊] Writing Prometheus scrape config..."
          sudo mkdir -p "$MONITORING_DIR/metrics"
          cat << 'EOF' | sudo tee "$MONITORING_DIR/metrics/prometheus.yml"
          scrape_configs:
            - job_name: 'backup'
              metrics_path: /metrics
              static_configs:
                - targets: ['localhost:9090']
          EOF

      - name: 🛑 Generate logging config
        run: |
          echo "[🛑] Writing logback.xml for structured JSON logs..."
          sudo mkdir -p "$MONITORING_DIR/logs"
          cat << 'EOF' | sudo tee "$MONITORING_DIR/logs/logback.xml"
          <configuration>
            <appender name="FILE" class="ch.qos.logback.core.FileAppender">
              <file>/opt/logs/app.log</file>
              <encoder class="net.logstash.logback.encoder.LogstashEncoder"/>
            </appender>
            <root level="INFO">
              <appender-ref ref="FILE"/>
            </root>
          </configuration>
          EOF

      - name: 🔧 Install backup tools (AWS CLI & gsutil)
        run: |
          echo "[🔧] Installing AWS CLI & Google Cloud SDK..."
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install --user awscli google-cloud-storage

      - name: 🔄 Generate backup policy
        run: |
          echo "[🔄] Writing backup policy script..."
          sudo mkdir -p "$BACKUP_DIR/incremental"
          cat << 'EOF' | sudo tee "$BACKUP_DIR/backup-run.sh"
          #!/bin/bash
          set -euo pipefail
          tar czf $BACKUP_DIR/incremental/backup-$(date +%F-%T).tgz /opt/data
          aws s3 cp $BACKUP_DIR/incremental/*.tgz s3://my-bucket/backups/ \
            --storage-class STANDARD_IA --encrypt
          gsutil cp $BACKUP_DIR/incremental/*.tgz gs://my-bucket/backups/
          echo "{\"status\":\"success\",\"time\":\"$(date -u +%FT%TZ)\"}" \
            >> $MONITORING_DIR/logs/backup.json
          EOF
          sudo chmod +x "$BACKUP_DIR/backup-run.sh"

      - name: 🛠️ Generate restore-test script
        run: |
          echo "[🛠️] Writing restore test script..."
          cat << 'EOF' | sudo tee "$BACKUP_DIR/restore-test.sh"
          #!/bin/bash
          LATEST=$(ls -1t $BACKUP_DIR/incremental/*.tgz | head -n1)
          tar xzf $LATEST -C /tmp/restore
          echo "restored" > /tmp/restore/ok.txt
          EOF
          sudo chmod +x "$BACKUP_DIR/restore-test.sh"

      - name: ▶️ Run backup
        run: |
          echo "[▶️] Running backup script..."
          sudo "$BACKUP_DIR/backup-run.sh"

      - name: ▶️ Run restore test
        run: |
          echo "[▶️] Running restore-test script..."
          sudo "$BACKUP_DIR/restore-test.sh"

      - name: 📊 Upload metrics & logs
        run: |
          echo "[📊] Collecting and displaying backup metrics..."
          cat "$MONITORING_DIR/logs/backup.json"

      - name: 🔄 Remake BS logic
        run: |
          echo "[🔄] Starting Remake BS logic..."
          sudo mkdir -p "$BACKUP_DIR/bs"
          echo "{ \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"type\": \"BS\" }" \
            | sudo tee "$BACKUP_DIR/bs/bs-$(date +%s).json"
          sudo chmod 644 "$BACKUP_DIR/bs/"*.json
          echo "[✅] Remake BS logic completed"

      - name: 🔄 Remake MIS logic
        run: |
          echo "[🔄] Starting Remake MIS logic..."
          sudo mkdir -p "$BACKUP_DIR/mis"
          echo "MIS Report generated at $(date -u +'%Y-%m-%d %H:%M:%SZ')" \
            | sudo tee "$BACKUP_DIR/mis/mis-$(date +%s).txt"
          sudo chmod 644 "$BACKUP_DIR/mis/"*.txt
          echo "[✅] Remake MIS logic completed"
