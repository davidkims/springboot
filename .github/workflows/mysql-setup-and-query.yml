name: 🌐 MEGA EchoOps + Infinite Containers/Images + AI/Finance + ELK/DAG + Vault

on:
  workflow_dispatch:
  schedule:
    - cron: '5,20,35,50 * * * *'

jobs:
  mega-echoops:
    runs-on: ubuntu-latest
    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 📁 Create echo directories
      run: |
        set -e
        mkdir -p .github/echo_dirs
        for d in tools packages logs containers images install restart upgrade exec compose services templates tests db elk grafana zipkin jenkins oracle postgres mongo redis kafka rabbitmq vault minio airflow spark camunda security codeql scorecard trivy ai finance dag; do
          mkdir -p ".github/echo_${d}"
          echo "echo '[ECHO] Directory created: .github/echo_${d}'" >> .github/echo_dirs/create_dirs.sh
        done
        chmod +x .github/echo_dirs/create_dirs.sh
        bash .github/echo_dirs/create_dirs.sh

    - name: 🐳 Pull & Run Core Containers
      run: |
        CONTAINERS="kafka rabbitmq vault minio airflow spark camunda"
        for svc in $CONTAINERS; do
          echo "echo '[IMAGE] Pull: $svc'" >> .github/echo_images/pull_${svc}.sh
          echo "docker pull $svc" >> .github/echo_images/pull_${svc}.sh
          chmod +x .github/echo_images/pull_${svc}.sh
          bash .github/echo_images/pull_${svc}.sh

          echo "echo '[CONTAINER] Run: $svc'" >> .github/echo_containers/run_${svc}.sh
          echo "docker run -d --name $svc $svc" >> .github/echo_containers/run_${svc}.sh
          chmod +x .github/echo_containers/run_${svc}.sh
          bash .github/echo_containers/run_${svc}.sh
        done

    - name: 🔍 Health Check for All Echo Containers
      run: |
        for svc in kafka rabbitmq vault minio airflow spark camunda; do
          echo "[CHECK] $svc 상태 확인 중..." | tee -a .github/echo_tests/${svc}_health.log
          docker inspect --format='{{.Name}} => {{.State.Status}}' $svc 2>> .github/echo_tests/${svc}_health.log || echo "⚠️ $svc 상태 불명" >> .github/echo_tests/${svc}_health.log
        done

    - name: 💾 Docker Image & Container Echo Summary
      run: |
        docker images | tee .github/echo_logs/docker_images_summary.txt
        docker ps -a | tee .github/echo_logs/docker_containers_summary.txt

    - name: 📊 Final EchoOps Summary
      run: |
        echo "[SUMMARY] Infinite EchoOps Execution Complete" | tee .github/echo_logs/final_summary.log
        find .github/echo_* -type f >> .github/echo_logs/final_summary.log
