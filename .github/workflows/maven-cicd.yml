              install_s3fs
              # Add S3 monitoring tools
              python3 -m pip install boto3 s3fs --user >/dev/null 2>&1 || true
              ;;
            gcs) 
              install_gcsfuse
              # Add GCS monitoring tools  
              python3 -m pip install google-cloud-storage --user >/dev/null 2>&1 || true
              ;;
            azure) 
              install_blobfuse2
              # Add Azure monitoring tools
              python3 -m pip install azure-storage-blob --user >/dev/null 2>&1 || true
              ;;
            *) 
              warn "unknown STORAGE_PROFILE='${STORAGE_PROFILE}', skip"
              ;;
          esac
          
          # Create storage health check script
          cat > "${ECHO_LOG}/storage_health_check.sh" <<'BASH'
          #!/bin/bash
          check_s3() {
            aws s3 ls >/dev/null 2>&1 && echo "S3: OK" || echo "S3: FAIL"
          }
          check_gcs() {
            gcsfuse --version >/dev/null 2>&1 && echo "GCS: OK" || echo "GCS: FAIL"  
          }
          check_azure() {
            blobfuse2 --version >/dev/null 2>&1 && echo "Azure: OK" || echo "Azure: FAIL"
          }
          case "$1" in
            s3) check_s3 ;;
            gcs) check_gcs ;;
            azure) check_azure ;;
            *) echo "Usage: $0 {s3|gcs|azure}" ;;
          esac
          BASH
