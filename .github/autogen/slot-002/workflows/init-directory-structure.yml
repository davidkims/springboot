name: 📁 Auto Expand Slot & Validate YAML

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  expand-slot:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Detect next slot number
        id: detect
        run: |
          echo "[🔢] Detecting next slot number..."
          PREFIX=".github/autogen/slot-"
          EXISTING=$(find .github/autogen -maxdepth 1 -type d -name "slot-*" | wc -l)
          NEXT=$(printf "slot-%03d" $((EXISTING + 1)))
          echo "next_slot=$NEXT" >> $GITHUB_OUTPUT
          echo "[➡️] Next slot: $NEXT"

      - name: 🏗️ Create next slot directory and copy workflows
        run: |
          SLOT=${{ steps.detect.outputs.next_slot }}
          SLOT_DIR=".github/autogen/$SLOT"
          echo "[📁] Creating directory: $SLOT_DIR/workflows"
          mkdir -p "$SLOT_DIR/workflows"

          echo "[📋] Copying .github/workflows/* -> $SLOT_DIR/workflows"
          cp -r .github/workflows/* "$SLOT_DIR/workflows/"

          echo "[📄] Writing info.txt and README.md"
          echo "Slot generated: $SLOT at $(date -u)" > "$SLOT_DIR/info.txt"
          echo "# Auto Slot: $SLOT" > "$SLOT_DIR/README.md"

          echo "[🔗] Updating symlink to latest slot"
          ln -sfn "$SLOT" .github/slot-latest

      - name: 🛠️ Create relaxed yamllint config
        run: |
          echo "[🛠️] Creating .yamllint.yml..."
          echo "extends: default" > .yamllint.yml
          echo "" >> .yamllint.yml
          echo "rules:" >> .yamllint.yml

          echo "  line-length:" >> .yamllint.yml
          echo "    max: 200" >> .yamllint.yml
          echo "    level: warning" >> .yamllint.yml
          echo "[✅] line-length rule added"

          echo "  document-start:" >> .yamllint.yml
          echo "    present: false" >> .yamllint.yml
          echo "[✅] document-start rule added"

          echo "  truthy:" >> .yamllint.yml
          echo "    allowed-values: ['true', 'false', 'on', 'off', 'yes', 'no']" >> .yamllint.yml
          echo "[✅] truthy rule added"

          echo "  comments:" >> .yamllint.yml
          echo "    require-starting-space: false" >> .yamllint.yml
          echo "[✅] comments rule added"

          echo "  trailing-spaces:" >> .yamllint.yml
          echo "    level: warning" >> .yamllint.yml

          echo "  brackets:" >> .yamllint.yml
          echo "    max-spaces-inside: 1" >> .yamllint.yml
          echo "    level: warning" >> .yamllint.yml

          echo "[✔] .yamllint.yml created with all relaxed rules"

      - name: 🧪 Run yamllint (non-blocking)
        continue-on-error: true
        run: |
          echo "[🔍] Installing yamllint..."
          pip install --quiet yamllint

          SLOT=${{ steps.detect.outputs.next_slot }}
          TARGET=".github/autogen/$SLOT/workflows"
          echo "[🧪] Linting copied files in $TARGET ..."
          yamllint -c .yamllint.yml "$TARGET"

          echo "[ℹ️] Lint completed — errors will NOT stop this workflow."

      - name: 🔀 Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "📁 Add ${{ steps.detect.outputs.next_slot }} + copied workflows"
          branch: "slot-expand/${{ steps.detect.outputs.next_slot }}"
          title: "📁 Auto Expand: ${{ steps.detect.outputs.next_slot }}"
          body: |
            This PR includes:
            - New directory `.github/autogen/${{ steps.detect.outputs.next_slot }}`
            - All `.yaml` workflow files copied
            - README.md + info.txt generated
            - `.yamllint.yml` added (relaxed rules)
          delete-branch: true
