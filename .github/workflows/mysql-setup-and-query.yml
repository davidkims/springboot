name: 🏦 MEGA DB EchoOps + Container + Upgrade + Bank AutoOps 통합

on:
  workflow_dispatch:
  schedule:
    - cron: '5,20,35,50 * * * *'

jobs:
  mega-fullops:
    runs-on: ubuntu-latest

    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 📁 에코 디렉토리 대량 생성
      run: |
        set -e
        for d in echo_{dirs,logs,containers/install,restart,upgrade,banks}; do
          mkdir -p ".github/${d}"
          echo "echo '[DIR] 생성됨: .github/${d}'" >> .github/echo_dirs/create_dirs.sh
        done
        chmod +x .github/echo_dirs/create_dirs.sh
        .github/echo_dirs/create_dirs.sh

    - name: ⬆️ APT 업그레이드 및 필수 설치
      run: |
        set -e
        echo "[UPGRADE] APT 업그레이드 시작" | tee .github/echo_upgrade/upgrade.log
        sudo apt-get update -y && sudo apt-get upgrade -y | tee -a .github/echo_upgrade/upgrade.log
        sudo apt-get install -y docker.io curl net-tools ufw cron unattended-upgrades
        echo "[UPGRADE] 완료 ✅" | tee -a .github/echo_upgrade/upgrade.log

    - name: 🚀 컨테이너 생성 및 설치 에코 생성
      run: |
        set -e
        declare -a CONTAINERS=(mysql:8.0 postgres:15 mongo redis gvenzl/oracle-xe mcr.microsoft.com/mssql/server:2022-latest apache/nifi bitnami/kafka bitnami/zookeeper bitnami/prometheus bitnami/grafana minio/minio hashicorp/vault camunda/camunda-bpm-platform bitnami/spark)
        declare -a NAMES=(mysql_test pg_test mongo_test redis_test oracle_xe mssql_test nifi_test kafka_test zk_test prometheus_test grafana_test minio_test vault_test camunda_test spark_test)

        echo "#!/bin/bash" > .github/echo_containers/create_all.sh
        for i in "${!CONTAINERS[@]}"; do
          name="${NAMES[$i]}"
          image="${CONTAINERS[$i]}"
          echo "echo '[CREATE] $name ($image)'" >> .github/echo_containers/create_all.sh
          case "$name" in
            oracle_xe)
              echo "docker run -d --name $name -e ORACLE_PASSWORD=oracle $image" >> .github/echo_containers/create_all.sh ;;
            mssql_test)
              echo "docker run -e 'ACCEPT_EULA=Y' -e 'SA_PASSWORD=Strong!Passw0rd' -p 1433:1433 -d --name $name $image" >> .github/echo_containers/create_all.sh ;;
            minio_test)
              echo "docker run -d -p 9000:9000 -p 9001:9001 --name $name -e MINIO_ROOT_USER=admin -e MINIO_ROOT_PASSWORD=password $image server /data --console-address ':9001'" >> .github/echo_containers/create_all.sh ;;
            vault_test)
              echo "docker run -d --name $name -e VAULT_DEV_ROOT_TOKEN_ID=myroot -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 -p 8200:8200 $image" >> .github/echo_containers/create_all.sh ;;
            *)
              echo "docker run -d --name $name $image" >> .github/echo_containers/create_all.sh ;;
          esac

          echo "#!/bin/bash" > .github/echo_containers/install/install_${name}.sh
          echo "docker exec $name echo '[OK] $name 설치 테스트'" >> .github/echo_containers/install/install_${name}.sh
          chmod +x .github/echo_containers/install/install_${name}.sh
        done
        chmod +x .github/echo_containers/create_all.sh

    - name: ⚙️ 컨테이너 전체 실행
      run: |
        bash .github/echo_containers/create_all.sh | tee .github/echo_logs/container_create.log
        docker ps -a | tee .github/echo_logs/container_status.log

    - name: 🧪 설치 스크립트 실행
      run: |
        for f in .github/echo_containers/install/*.sh; do
          bash "$f" | tee -a .github/echo_logs/install_results.log
        done

    - name: 🔁 컨테이너 재시작 스크립트 생성 및 실행
      run: |
        echo "#!/bin/bash" > .github/echo_restart/restart_all.sh
        for name in $(docker ps -a --format '{{.Names}}'); do
          echo "docker restart $name || echo '[WARN] $name 재시작 실패'" >> .github/echo_restart/restart_all.sh
        done
        chmod +x .github/echo_restart/restart_all.sh
        bash .github/echo_restart/restart_all.sh | tee .github/echo_logs/restart.log

    - name: 🏦 전체 금융기관 디렉토리/에코/autoup/backup 생성
      run: |
        set -e
        BANKS="국민 우리 신한 하나 농협 카카오뱅크 토스 삼성 현대 NH 씨티 SC제일 JP모건 뱅크샐러드 KDB 산은 새마을 저축은행 수협 우체국"
        for B in $BANKS; do
          for d in ledger txn db sql logs docker autoup autoup/log backup backup/log; do
            mkdir -p ".github/echo/banks/$B/$d"
            echo "echo 'mkdir -p .github/echo/banks/$B/$d'" >> .github/echo_dirs/bank_dirs.sh
          done

          echo "#!/bin/bash" > .github/echo/banks/$B/autoup/autoup.sh
          echo "echo '[AUTOUP] $B 자동 업데이트 실행'" >> .github/echo/banks/$B/autoup/autoup.sh
          echo "sudo apt-get update && sudo apt-get upgrade -y" >> .github/echo/banks/$B/autoup/autoup.sh
          chmod +x .github/echo/banks/$B/autoup/autoup.sh

          echo "#!/bin/bash" > .github/echo/banks/$B/backup/backup.sh
          echo "echo '[BACKUP] $B 백업 실행'" >> .github/echo/banks/$B/backup/backup.sh
          echo "tar czf /tmp/${B}_backup_\$(date +%Y%m%d_%H%M).tar.gz /etc /var/lib /home" >> .github/echo/banks/$B/backup/backup.sh
          chmod +x .github/echo/banks/$B/backup/backup.sh
        done
        chmod +x .github/echo_dirs/bank_dirs.sh
        .github/echo_dirs/bank_dirs.sh

    - name: ⚙️ 오토업데이트/오토리부트/백업 설정 (cron + unattended-upgrades)
      run: |
        set -e
        sudo systemctl enable unattended-upgrades && sudo systemctl start unattended-upgrades
        sudo systemctl enable cron && sudo systemctl start cron

        echo 'APT::Periodic::Update-Package-Lists "1";' | sudo tee /etc/apt/apt.conf.d/10periodic
        echo 'APT::Periodic::Unattended-Upgrade "1";' | sudo tee /etc/apt/apt.conf.d/20auto-upgrades
        echo 'Unattended-Upgrade::Remove-Unused-Dependencies "true";' | sudo tee /etc/apt/apt.conf.d/30remove-unused
        echo 'Unattended-Upgrade::Automatic-Reboot "true";' | sudo tee /etc/apt/apt.conf.d/40auto-reboot
        echo 'Unattended-Upgrade::Automatic-Reboot-Time "03:30";' | sudo tee /etc/apt/apt.conf.d/50auto-reboot-time
        echo 'APT::Periodic::AutocleanInterval "7";' | sudo tee /etc/apt/apt.conf.d/60autoclean

        echo '0 3 * * * root /sbin/reboot' | sudo tee /etc/cron.d/reboot
        echo '0 2 * * * root tar czf /tmp/system_backup_$(date +\%Y\%m\%d).tar.gz /etc /var/lib /home' | sudo tee /etc/cron.d/backup
        echo '*/3 * * * * root /usr/bin/unattended-upgrade -d >> /var/log/unattended-upgrades/autoup.log 2>&1' | sudo tee /etc/cron.d/autoup

    - name: 📜 최종 요약 및 로그 출력
      run: |
        echo "[✅ SUMMARY] 전체 작업 완료: 컨테이너 설치, 은행 자동화, 업그레이드, 리부트 스케줄링" | tee .github/echo_logs/final_summary.log
        ls -alR .github/echo | tee -a .github/echo_logs/final_summary.log
