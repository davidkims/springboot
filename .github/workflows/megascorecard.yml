name: 🛡️ MEGA Scorecard FULLOPS + SARIF + Markdown + Pages + Upgrade

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '16 11 * * 2'
    - cron: '*/3 * * * *'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard-analysis:
    name: ✅ Scorecard 분석 및 SARIF 업로드
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: 📂 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🧪 Scorecard 실행 (SARIF + JSON 생성)
        uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          results_file_json: results.json

      - name: ☁️ GitHub Code Scanning 업로드
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: 📦 결과 저장
        uses: actions/upload-artifact@v4
        with:
          name: Scorecard-Results
          path: |
            results.sarif
            results.json

  post-analysis-fullops:
    name: 🔧 EchoOps + Markdown 변환 + SARIF 평가 + Pages 배포 + Upgrade
    runs-on: ubuntu-latest
    needs: scorecard-analysis
    if: always()

    steps:
      - name: 📂 코드 체크아웃
        uses: actions/checkout@v4

      - name: 📥 결과 다운로드
        uses: actions/download-artifact@v4
        with:
          name: Scorecard-Results

      - name: 📁 에코 디렉토리 생성
        run: |
          for d in echo_scorecard echo_monitoring echo_pages echo_upgrade echo_dirs; do
            mkdir -p .github/$d
            echo "echo '[ECHO] 생성: .github/$d'" >> .github/$d/create_dirs.sh
          done

      - name: 🧪 results.json 검사 및 백업
        run: |
          set -e
          echo "[CHECK] 파일 타입:" $(file results.json)
          cat results.json | head -n 10 || true
          cp results.json .github/echo_scorecard/results_raw_$(date +%Y%m%d_%H%M).json || true

          # JSON 유효성 검사
          if ! jq type results.json > /dev/null 2>&1; then
            echo "::error ::results.json이 유효한 JSON이 아닙니다."
            mv results.json results.bak.markdown
            touch results.json
            echo '{}' > results.json  # 빈 JSON으로 대체
          fi

      - name: 🧼 SARIF 경로 정제 (경고 방지용)
        run: |
          jq '
            .runs[].results[].locations[].physicalLocation.artifactLocation.uri |=
            if . == "no file associated with this alert" or (. | test("^\\.?github/")) then
              "file://unknown"
            else . end
          ' results.sarif > results.cleaned.sarif
          mv results.cleaned.sarif results.sarif

      - name: 📝 Markdown 변환 (JSON → MD 요약)
        run: |
          mkdir -p site/scorecard
          echo "# 🛡️ Scorecard 결과 요약" > site/scorecard/scorecard-summary.md

          if jq -e '.repo.name and .score and .checks' results.json > /dev/null 2>&1; then
            jq -r '
              "### 프로젝트: \(.repo.name)\n\n" +
              "신뢰도 점수: \(.score) / 10\n\n" +
              "| Check | Pass | Score | Reason |\n|-------|------|--------|--------|\n" +
              (.checks[] | 
                "| \(.name) | \(.pass) | \(.score) | \(.reason // "-") |"
              ) | join("\n")
            ' results.json >> site/scorecard/scorecard-summary.md
          else
            echo "_⚠️ results.json 구조 이상으로 Markdown 변환 불가_" >> site/scorecard/scorecard-summary.md
          fi

      - name: 📄 SARIF → Markdown 변환
        run: |
          echo "# 🚨 SARIF 보안 이슈 요약" > site/scorecard/sarif-summary.md
          jq -r '
            .runs[].results[] |
            "- [\(.level)] \(.message.text)\n  파일: \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine // "-")"
          ' results.sarif >> site/scorecard/sarif-summary.md

      - name: 📊 SARIF 통계 평가
        run: |
          mkdir -p .github/echo_scorecard
          echo "[INFO] SARIF 통계 요약:" > .github/echo_scorecard/sarif_summary.txt
          echo "- 총 이슈 수:" $(jq '.runs[].results | length' results.sarif) >> .github/echo_scorecard/sarif_summary.txt
          jq -r '.runs[].results[].level' results.sarif | sort | uniq -c >> .github/echo_scorecard/sarif_summary.txt

      - name: 📦 파일 용량 분석
        run: |
          mkdir -p .github/echo_monitoring
          du -ah . | sort -hr | head -n 30 > .github/echo_monitoring/top_file_sizes.txt || true
          du -sh . > .github/echo_monitoring/total_size.txt || true

      - name: 🌐 Pages 업로드 디렉토리 구성
        run: |
          mkdir -p site/scorecard
          cp results.sarif site/scorecard/scorecard-results.sarif
          cp results.json site/scorecard/results.json
          echo "echo '[ECHO] SARIF/JSON 복사 완료'" >> .github/echo_pages/copy.sh

      - name: 🚀 GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site

      - name: ⬆️ 시스템 업그레이드 (apt + pip + npm)
        run: |
          mkdir -p .github/echo_upgrade
          echo "[UPGRADE] apt-get upgrade 시작" | tee .github/echo_upgrade/apt.log
          sudo apt-get update && sudo apt-get upgrade -y >> .github/echo_upgrade/apt.log 2>&1
          echo "[UPGRADE] pip upgrade 시작" | tee .github/echo_upgrade/pip.log
          pip list --outdated >> .github/echo_upgrade/pip.log || true
          echo "[UPGRADE] npm upgrade 시작" | tee .github/echo_upgrade/npm.log
          npm update >> .github/echo_upgrade/npm.log || true
