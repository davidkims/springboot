name: 📡 워크플로 전체 상황 모니터링 (900건 이상)

on:
  repository_dispatch:
    types: [workflow_run]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  monitor-all-runs:
    runs-on: ubuntu-latest

    steps:
      - name: ▶️ 최신 900건 워크플로우 실행 목록 수집 (페이지네이션)
        run: |
          echo "echo '[🔍] 최신 900건 워크플로우 실행 목록 수집...'"
          echo '[🔍] 최신 900건 워크플로우 실행 목록 수집...'
          > all-runs.json
          # 1~10페이지 반복 (per_page=100 × 10 = 1000건)
          for page in $(seq 1 10); do
            echo "echo '[🔎] 페이지: $page'"
            echo "[🔎] 페이지: $page"
            curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100&page=$page" \
              | jq '.workflow_runs' >> all-runs.json
          done
          # 여러 배열 합치기(단일 배열로)
          cat all-runs.json | jq -s 'flatten' > all-runs-flat.json
          jq '[.[] | {id, name, display_title, status, conclusion, run_number, html_url, created_at, updated_at, actor: .actor.login}]' all-runs-flat.json > all-runs-summary.json

      - name: 📝 최신 워크플로우 20건 요약 로그
        run: |
          echo "echo '[📝] 최신 워크플로우 20건 요약...'"
          echo '[📝] 최신 워크플로우 20건 요약...'
          cat all-runs-summary.json | jq -r '.[:20][] | "[\(.id)] \(.display_title // .name) #\(.run_number) | 상태: \(.status)/\(.conclusion) | 실행: \(.actor) | URL: \(.html_url)"'

      - name: 📂 전체 워크플로우 실행 요약 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: all-workflow-runs-summary
          path: all-runs-summary.json

      - name: 🔄 각 워크플로우 실행 상세 감지 및 저장 (최대 900건)
        run: |
          echo "echo '[🔄] 각 워크플로우 실행 상세 감지 및 저장(최대 900건)...'"
          echo '[🔄] 각 워크플로우 실행 상세 감지 및 저장(최대 900건)...'
          mkdir -p runs-details jobs-details steps-details
          # 최대 900건만(실제 1000까지도 가능)
          ids=$(cat all-runs-summary.json | jq -r '.[].id' | head -900)
          i=0
          for rid in $ids; do
            echo "echo '[🟢] 워크플로우 실행 상세정보: $rid'"
            echo "[🟢] 워크플로우 실행 상세정보: $rid"
            curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$rid" > runs-details/run-$rid.json

            echo "echo '[🔹] jobs 목록: $rid'"
            echo "[🔹] jobs 목록: $rid"
            curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$rid/jobs" > jobs-details/jobs-$rid.json

            # 모든 job별 step 상태 추출
            cat jobs-details/jobs-$rid.json | jq '[.jobs[] | {id, name, status, conclusion, started_at, completed_at, steps: [.steps[] | {name, status, conclusion}] }]' > steps-details/steps-$rid.json

            i=$((i+1))
            if [ $i -ge 900 ]; then break; fi
          done

      - name: 📦 모든 워크플로우 실행/잡/스텝 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: all-workflow-details
          path: |
            runs-details/
            jobs-details/
            steps-details/

      - name: 📋 모든 워크플로우 최신 상태 집계
        run: |
          echo "echo '[📋] 최신 40건 워크플로우 상태 집계...'"
          echo '[📋] 최신 40건 워크플로우 상태 집계...'
          jq -r '.[] | "워크플로: \(.display_title // .name) (#\(.run_number))\n상태: \(.status)/\(.conclusion)\nURL: \(.html_url)\n-----"' all-runs-summary.json | head -40
