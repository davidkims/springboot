name: 📂 MEGA DB/Tx/Account/Transfer/User/Sim/Infra/Echo Ops

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  db-echo-mega:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 Create All Echo Directories (Teradata + DWH + Kafka + Grafana + Prometheus)
        run: |
          mkdir -p .github/echo_db
          for d in dirs files logs scripts services compose upgrade homebrew choco snap marketplace backup init test migration import export serverinfo errorlog util mass_db mass_script mass_query ledger vaccount transfer user sim teradata dwh dockerfile installer analytics parallel summary workflow api sql_exec echo_log result report history metrics accounting dispatch task bteq elk grafana firewall prometheus kafka alertmanager output transfer_exec; do
            echo "echo 'mkdir -p .github/echo_db/$d'" >> .github/echo_db/echo_dir_create.sh
            mkdir -p ".github/echo_db/$d"
          done

      - name: 🖊️ Generate SQL Inserts and MySQL Transfer Exec Script
        run: |
          set -e
          MASS=100
          mkdir -p .github/echo_db/ledger .github/echo_db/transfer .github/echo_db/output .github/echo_db/transfer_exec
          touch .github/echo_db/ledger/mysql_ledger_insert.sql
          touch .github/echo_db/transfer/mysql_transfer_insert.sql

          for i in $(seq 1 $MASS); do
            echo "INSERT INTO ledger (tx_id, account_no, tx_type, amount, ts) VALUES ($i, 'ACC$(printf %05d $i)', 'TRANSFER', 1000, CURRENT_TIMESTAMP);" >> .github/echo_db/ledger/mysql_ledger_insert.sql
            echo "INSERT INTO transfer (tx_id, from_acc, to_acc, amount, ts) VALUES ($i, 'ACC$(printf %05d $i)', 'ACC$(printf %05d $((i+1)))', 1000, CURRENT_TIMESTAMP);" >> .github/echo_db/transfer/mysql_transfer_insert.sql
          done

          echo "#!/bin/bash" > .github/echo_db/transfer_exec/mysql_transfer_exec.sh
          echo "echo '[TRANSFER_EXEC] MySQL 실행'" >> .github/echo_db/transfer_exec/mysql_transfer_exec.sh
          echo "mysql -uroot -prootpass123 test_db < .github/echo_db/transfer/mysql_transfer_insert.sql | tee .github/echo_db/output/mysql_transfer_result.csv" >> .github/echo_db/transfer_exec/mysql_transfer_exec.sh
          chmod +x .github/echo_db/transfer_exec/mysql_transfer_exec.sh

      - name: 🚀 Kafka Topic Init (tx-events)
        run: |
          mkdir -p .github/echo_db/kafka
          echo "#!/bin/bash" > .github/echo_db/kafka/create_topics.sh
          echo "docker exec kafka kafka-topics.sh --create --topic tx-events --bootstrap-server localhost:9092 --replication-factor 1 --partitions 1 || echo '[WARN] Kafka Topic 생성 실패'" >> .github/echo_db/kafka/create_topics.sh
          chmod +x .github/echo_db/kafka/create_topics.sh

      - name: 📊 Prometheus & AlertManager Rule
        run: |
          mkdir -p .github/echo_db/prometheus .github/echo_db/alertmanager
          echo "groups:\n  - name: TxAlerts\n    rules:\n      - alert: HighTransactionRate\n        expr: rate(tx_events_total[1m]) > 100\n        for: 30s\n        labels:\n          severity: warning\n        annotations:\n          summary: 'High Tx Rate detected'" > .github/echo_db/prometheus/tx_rules.yml
          echo "route:\n  receiver: 'slack-alert'\nreceivers:\n  - name: 'slack-alert'\n    slack_configs:\n      - channel: '#alerts'\n        send_resolved: true\n        text: '{{ .CommonAnnotations.summary }}'" > .github/echo_db/alertmanager/config.yml

      - name: 📈 Grafana Webhook Dashboard Import
        run: |
          mkdir -p .github/echo_db/grafana
          echo "#!/bin/bash" > .github/echo_db/grafana/import_webhook.sh
          echo "curl -X POST http://localhost:3000/api/dashboards/db -H 'Authorization: Bearer ${GRAFANA_API_KEY}' -H 'Content-Type: application/json' -d @.github/echo_db/grafana/sample_dashboard.json || echo '[WARN] Grafana import 실패'" >> .github/echo_db/grafana/import_webhook.sh
          echo '{ "dashboard": { "title": "Ledger Monitor", "panels": [] }, "overwrite": true }' > .github/echo_db/grafana/sample_dashboard.json
          chmod +x .github/echo_db/grafana/import_webhook.sh

      - name: 📃 Dump All Echo Outputs
        run: |
          echo "[ECHO] 전체 생성된 파일 출력 확인"
          find .github/echo_db -type f | sort | while read f; do
            echo "---"
            echo "[FILE] $f"
            cat "$f"
            echo
          done
