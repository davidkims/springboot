name: 🗕️ Airflow Healthcheck DAG Setup & Test

on:
  workflow_dispatch:

jobs:
  setup-airflow:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Create required directories
        run: |
          echo "[DIR] Creating directory /opt/logistics/airflow/dags"
          sudo mkdir -p /opt/logistics/airflow/dags
          echo "[DIR] Creating directory /opt/logistics/airflow/test_logs"
          sudo mkdir -p /opt/logistics/airflow/test_logs
          echo "[DIR] Creating directory /opt/logistics/scorecard"
          sudo mkdir -p /opt/logistics/scorecard
          echo "[DIR] Setting permissions on /opt/logistics"
          sudo chmod -R 777 /opt/logistics

      - name: 🔄 Install Python 3.10 via deadsnakes PPA
        run: |
          echo "[PYTHON] Adding deadsnakes PPA for Python 3.10"
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          echo "[PYTHON] Installing python3.10, venv, dev headers"
          sudo apt-get install -y python3.10 python3.10-venv python3.10-dev
          echo "[PYTHON] Configuring python3 alternative"
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
          echo "[PYTHON] Python version check:"
          python3 --version

      - name: 🌀 Install Apache Airflow and Providers
        run: |
          echo "[AIRFLOW] Installing system build dependencies"
          sudo apt-get update
          sudo apt-get install -y build-essential libxml2-dev libxslt1-dev zlib1g-dev

          echo "[AIRFLOW] Upgrading pip, setuptools, wheel"
          python3 -m pip install --upgrade pip setuptools wheel

          echo "[AIRFLOW] Installing Apache Airflow and providers"
          pip install apache-airflow==2.8.1 \
                      apache-airflow-providers-docker \
                      apache-airflow-providers-postgres \
                      apache-airflow-providers-smtp

          echo "[AIRFLOW] Initializing metadata database"
          airflow db init

      - name: 🌬️ Add Airflow Healthcheck DAG
        run: |
          echo "[DAG] Starting DAG creation step"
          echo "[DAG] Writing DAG file to /opt/logistics/airflow/dags/airflow_healthcheck_dag.py"
          cat << 'EOF' > /opt/logistics/airflow/dags/airflow_healthcheck_dag.py
          from airflow import DAG
          from airflow.operators.bash import BashOperator
          from datetime import datetime

          with DAG(
              'airflow_healthcheck_dag',
              start_date=datetime(2023, 1, 1),
              schedule_interval='@daily',
              catchup=False
          ) as dag:
              health_check = BashOperator(
                  task_id='check_airflow_webserver',
                  bash_command='curl -sf http://localhost:8080/health || exit 1'
              )
          EOF
          echo "[DAG] DAG file created"
          echo "[DAG] Logging DAG file content"
          cat /opt/logistics/airflow/dags/airflow_healthcheck_dag.py \
            > /opt/logistics/airflow/test_logs/airflow_healthcheck_dag_create.log
          echo "[DAG] DAG creation and logging complete"

      - name: ▶️ Test Airflow DAG execution
        run: |
          echo "[TEST] Listing all DAGs"
          airflow dags list > /opt/logistics/airflow/test_logs/airflow_dags_list.log \
            || echo "[❌] DAG list failed"
          echo "[TEST] Running DAG test for airflow_healthcheck_dag on 2025-01-01"
          airflow dags test airflow_healthcheck_dag 2025-01-01 \
            > /opt/logistics/airflow/test_logs/airflow_healthcheck_dag_test.log \
            || echo "[❌] DAG test failed"
          echo "[TEST] DAG test complete"

      - name: 🔐 Install Scorecard and Run Security Check
        run: |
          echo "[SECURITY] Ensuring scorecard directory exists"
          sudo mkdir -p /opt/logistics/scorecard
          echo "[SECURITY] Downloading Scorecard"
          SCORECARD_VERSION="v4.10.3"
          wget https://github.com/ossf/scorecard/releases/download/$SCORECARD_VERSION/scorecard-linux-amd64 \
            -O scorecard || echo "[❌] Scorecard download failed"
          echo "[SECURITY] Setting executable bit"
          chmod +x scorecard
          echo "[SECURITY] Moving Scorecard binary"
          mv scorecard /opt/logistics/scorecard/
          echo "[SECURITY] Running Scorecard checks"
          /opt/logistics/scorecard/scorecard --repo=. --local --checks Vulnerabilities \
            --format=json --show-details > /opt/logistics/scorecard/scorecard.result.json \
            || echo "[❌] Scorecard run failed"

      - name: 📨 Prepare to upload logs
        run: |
          echo "[UPLOAD] Preparing to upload airflow-healthcheck logs"

      - name: 📦 Upload Logs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airflow-healthcheck-logs
          path: /opt/logistics/airflow/test_logs/
