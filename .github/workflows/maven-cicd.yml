          EXPOSE 8004
          HEALTHCHECK --interval=30s --timeout=10s --retries=3 CMD curl -f http://localhost:8004/health || exit 1
          CMD ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8004"]
          DOCKER
          
            ctr build -t "${SCHEDULER_IMAGE}:latest" "${ECHO_SCHEDULER}"
            echoe "Built Scheduler service image"
          fi
          
          # Deploy services with slot management
          echoe "Deploying services with configured slots..."
          
          # Deploy Omni service slots
          if [ "${RUN_OMNI}" = "true" ]; then
            for i in $(seq 1 ${SLOTS_OMNI}); do
              name="omni-$i"
              ctr rm -f "$name" >/dev/null 2>&1 || true
              
              if [ "$i" -eq 1 ]; then
                port_mapping="-p 8090:8000"
              else
                port_mapping=""
              fi
              
              ctr run -d --name "$name" --network "${DOCKER_NET}" --restart unless-stopped \
                $port_mapping \
                -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
                -e SERVICE_NAME="$name" -e DB_HOST=td-sim \
                "${ANALYTICS_IMAGE}:latest"
            done
          fi
          
          # Deploy Notification service slots
          if [ "${RUN_NOTIFICATION}" = "true" ]; then
            for i in $(seq 1 ${SLOTS_NOTIFICATION}); do
              name="notification-$i"
              ctr rm -f "$name" >/dev/null 2>&1 || true
              
              if [ "$i" -eq 1 ]; then
                port_mapping="-p 8092:8002"
              else
                port_mapping=""
              fi
              
              ctr run -d --name "$name" --network "${DOCKER_NET}" --restart unless-stopped \
                $port_mapping \
                -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
                -e SERVICE_NAME="$name" -e DB_HOST=td-sim \
                "${NOTIFICATION_IMAGE}:latest"
            done
          fi
          
          # Deploy Audit service slots
          if [ "${RUN_AUDIT}" = "true" ]; then
            for i in $(seq 1 ${SLOTS_AUDIT}); do
              name="audit-$i"
              ctr rm -f "$name" >/dev/null 2>&1 || true
              
              if [ "$i" -eq 1 ]; then
                port_mapping="-p 8093:8003"
              else
                port_mapping=""
              fi
              
              ctr run -d --name "$name" --network "${DOCKER_NET}" --restart unless-stopped \
                $port_mapping \
                -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
                -e SERVICE_NAME="$name" -e DB_HOST=td-sim \
                "${AUDIT_IMAGE}:latest"
            done
          fi
          
          # Deploy Scheduler service (single instance)
          if [ "${RUN_SCHEDULER}" = "true" ]; then
            ctr rm -f "scheduler-1" >/dev/null 2>&1 || true
            ctr run -d --name "scheduler-1" --network "${DOCKER_NET}" --restart unless-stopped \
              -p 8094:8004 \
              -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
              -e SERVICE_NAME="scheduler-1" -e DB_HOST=td-sim \
              "${SCHEDULER_IMAGE}:latest"
          fi
          
          # Health check all services
          sleep 10
          services_to_check=()
          [ "${RUN_OMNI}" = "true" ] && services_to_check+=("http://localhost:8090/health")
          [ "${RUN_ANALYTICS}" = "true" ] && services_to_check+=("http://localhost:8091/health")
          [ "${RUN_NOTIFICATION}" = "true" ] && services_to_check+=("http://localhost:8092/health")
          [ "${RUN_AUDIT}" = "true" ] && services_to_check+=("http://localhost:8093/health")
          [ "${RUN_SCHEDULER}" = "true" ] && services_to_check+=("http://localhost:8094/health")
          
          for url in "${services_to_check[@]}"; do
            for i in $(seq 1 30); do
              if curl -fsS --max-time 3 "$url" >/dev/null 2>&1; then
                echoe "Service at $url is healthy"
                break
              fi
              [ "$i" -eq 30 ] && warn "Service at $url failed health check"
              sleep 2
            done
          done
          
          echoe "All services deployed and health checked"
          make_archive "09_multi_service_deployment" \
            "${ECHO_OMNI}" "${ECHO_ANALYTICS}" "${ECHO_NOTIFICATION}" "${ECHO_AUDIT}" "${ECHO_SCHEDULER}"

      - name: 🌐 Enhanced Nginx Gateway with multi-service routing
        if: ${{ env.RUN_NETWORK == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          
          retry 3 3 -- ctr pull nginx:alpine
          retry 3 3 -- ctr pull nginx/nginx-prometheus-exporter:latest
          
          # Calculate upstream servers for all services
          OMNI_UPSTREAMS=""
          ANALYTICS_UPSTREAMS=""
          NOTIFICATION_UPSTREAMS=""
          AUDIT_UPSTREAMS=""
          
          if [ "${RUN_OMNI}" = "true" ]; then
            for i in $(seq 1 ${SLOTS_OMNI}); do
              OMNI_UPSTREAMS="${OMNI_UPSTREAMS}        server omni-${i}:8000;\n"
            done
          fi
          
          if [ "${RUN_ANALYTICS}" = "true" ]; then
            for i in $(seq 1 ${SLOTS_ANALYTICS}); do
              ANALYTICS_UPSTREAMS="${ANALYTICS_UPSTREAMS}        server analytics-${i}:8001;\n"
            done
          fi
          
          if [ "${RUN_NOTIFICATION}" = "true" ]; then
            for i in $(seq 1 ${SLOTS_NOTIFICATION}); do
              NOTIFICATION_UPSTREAMS="${NOTIFICATION_UPSTREAMS}        server notification-${i}:8002;\n"
            done
          fi
          
          if [ "${RUN_AUDIT}" = "true" ]; then
            for i in $(seq 1 ${SLOTS_AUDIT}); do
              AUDIT_UPSTREAMS="${AUDIT_UPSTREAMS}        server audit-${i}:8003;\n"
            done
          fi
          
          # Create comprehensive nginx configuration
          cat > "${ECHO_NET}/nginx/nginx.conf" <<CONF
          user nginx;
          worker_processes auto;
          error_log /var/log/nginx/error.log warn;
          pid /var/run/nginx.pid;
          
          events {
              worker_connections 2048;
              use epoll;
              multi_accept on;
          }
          
          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              
              # Enhanced logging format
              log_format enhanced '\$remote_addr - \$remote_user [\$time_local] '
                                 '"\$request" \$status \$body_bytes_sent '
                                 '"\$http_referer" "\$http_user_agent" '
                                 'rt=\$request_time uct=\$upstream_connect_time '
                                 'uht=\$upstream_header_time urt=\$upstream_response_time '
                                 'service=\$upstream_addr';
              
              access_log /var/log/nginx/access.log enhanced;
              
              # Performance optimizations
              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65;
              types_hash_max_size 2048;
              
              # Security headers
              add_header X-Frame-Options DENY always;
              add_header X-Content-Type-Options nosniff always;
              add_header X-XSS-Protection "1; mode=block" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
              
              # Rate limiting zones
              limit_req_zone \$binary_remote_addr zone=api_limit:10m rate=10r/s;
              limit_req_zone \$binary_remote_addr zone=dw_limit:10m rate=5r/s;
              limit_conn_zone \$binary_remote_addr zone=conn_limit:10m;
              
              # CORS settings
              map \$request_method \$is_options {
                  default 0;
                  OPTIONS 1;
              }
              
              set \$cors_origin "*";
              set \$cors_methods "GET, POST, PUT, DELETE, OPTIONS";
              set \$cors_headers "Content-Type, Authorization, X-Requested-With, X-Service-Version";
              
              # Service upstreams with health checks
              upstream omni_backend {
                  least_conn;
                  keepalive 32;
          ${OMNI_UPSTREAMS}
              }
              
              upstream analytics_backend {
                  least_conn;
                  keepalive 16;
          ${ANALYTICS_UPSTREAMS}
              }
              
              upstream notification_backend {
                  least_conn;
                  keepalive 8;
          ${NOTIFICATION_UPSTREAMS}
              }
              
              upstream audit_backend {
                  least_conn;
                  keepalive 8;
          ${AUDIT_UPSTREAMS}
              }
              
              # Main server block
              server {
                  listen 80;
                  server_name _;
                  
                  # Security limits
                  client_max_body_size 10M;
                  limit_conn conn_limit 100;
                  
                  # Health check endpoint
                  location = /health {
                      access_log off;
                      return 200 "Gateway OK";
                      add_header Content-Type text/plain;
                  }
                  
                  # Nginx status for monitoring
                  location = /nginx_status {
                      stub_status;
                      allow all;
                      access_log off;
                  }
                  
                  # Security - deny access to sensitive files
                  location ~* \.(env|git|ht|conf|sql)$ {
                      deny all;
                  }
                  
                  # CORS preflight handler
                  location @cors_preflight {
                      add_header Access-Control-Allow-Origin \$cors_origin always;
                      add_header Access-Control-Allow-Methods \$cors_methods always;
                      add_header Access-Control-Allow-Headers \$cors_headers always;
                      add_header Access-Control-Max-Age 86400 always;
                      add_header Content-Length 0;
                      add_header Content-Type text/plain;
                      return 204;
                  }
                  
                  # Handle OPTIONS requests
                  if (\$is_options) {
                      return 204;
                  }
                  
                  # Omni service routes
                  location /api/omni/ {
                      limit_req zone=api_limit burst=20 nodelay;
                      
                      # CORS headers
                      add_header Access-Control-Allow-Origin \$cors_origin always;
                      add_header Access-Control-Allow-Credentials "true" always;
                      
                      # Proxy settings
                      proxy_pass http://omni_backend/;
                      proxy_http_version 1.1;
                      proxy_set_header Connection "";
                      proxy_set_header Host \$host;
                      proxy_set_header X-Real-IP \$remote_addr;
                      proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto \$scheme;
                      proxy_set_header X-Service-Route "omni";
                      
                      # Timeout settings
                      proxy_connect_timeout 5s;
                      proxy_send_timeout 30s;
                      proxy_read_timeout 30s;
                  }
                  
                  # Data warehouse routes (cached)
                  location /dw/ {
                      limit_req zone=dw_limit burst=10 nodelay;
                      
                      # CORS headers
                      add_header Access-Control-Allow-Origin \$cors_origin always;
                      add_header Cache-Control "public, max-age=300, s-maxage=600";
                      
                      proxy_pass http://omni_backend/dw/;
                      proxy_http_version 1.1;
                      proxy_set_header Connection "";
                      proxy_set_header Host \$host;
                      proxy_set_header X-Real-IP \$remote_addr;
                      proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                      proxy_set_header X-Service-Route "dw";
                      
                      # Enable caching
                      proxy_cache_valid 200 5m;
                      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
                  }
                  
                  # Analytics service routes
                  location /api/analytics/ {
                      limit_req zone=api_limit burst=15 nodelay;
                      
                      add_header Access-Control-Allow-Origin \$cors_origin always;
                      
                      proxy_pass http://analytics_backend/;
                      proxy_http_version 1.1;
                      proxy_set_header Connection "";
                      proxy_set_header Host \$host;
                      proxy_set_header X-Real-IP \$remote_addr;
                      proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                      proxy_set_header X-Service-Route "analytics";
                  }
                  
                  # Notification service routes  
                  location /api/notifications/ {
                      limit_req zone=api_limit burst=10 nodelay;
                      
                      add_header Access-Control-Allow-Origin \$cors_origin always;
                      
                      proxy_pass http://notification_backend/;
                      proxy_http_version 1.1;
                      proxy_set_header Connection "";
                      proxy_set_header Host \$host;
                      proxy_set_header X-Real-IP \$remote_addr;
                      proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                      proxy_set_header X-Service-Route "notifications";
                  }
                  
                  # Audit service routes
                  location /api/audit/ {
                      limit_req zone=api_limit burst=5 nodelay;
                      
                      add_header Access-Control-Allow-Origin \$cors_origin always;
                      
                      proxy_pass http://audit_backend/;
                      proxy_http_version 1.1;
                      proxy_set_header Connection "";
                      proxy_set_header Host \$host;
                      proxy_set_header X-Real-IP \$remote_addr;
                      proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                      proxy_set_header X-Service-Route "audit";
                  }
                  
                  # Scheduler service routes (admin only)
                  location /api/scheduler/ {
                      limit_req zone=api_limit burst=3 nodelay;
                      
                      add_header Access-Control-Allow-Origin \$cors_origin always;
                      
                      proxy_pass http://scheduler-1:8004/;
                      proxy_http_version 1.1;
                      proxy_set_header Host \$host;
                      proxy_set_header X-Real-IP \$remote_addr;
                      proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                      proxy_set_header X-Service-Route "scheduler";
                  }
                  
                  # Service discovery endpoint
                  location = /services {
                      add_header Content-Type application/json;
                      return 200 '{
                          "services": {
                              "omni": {"slots": ${SLOTS_OMNI}, "path": "/api/omni/"},
                              "analytics": {"slots": ${SLOTS_ANALYTICS}, "path": "/api/analytics/"},
                              "notification": {"slots": ${SLOTS_NOTIFICATION}, "path": "/api/notifications/"},
                              "audit": {"slots": ${SLOTS_AUDIT}, "path": "/api/audit/"},
                              "scheduler": {"slots": 1, "path": "/api/scheduler/"},
                              "dw": {"path": "/dw/"}
                          },
                          "gateway": {
                              "version": "8.5.0",
                              "timestamp": "'$(date -Iseconds)'"
                          }
                      }';
                  }
                  
                  # Root endpoint
                  location = / {
                      add_header Content-Type text/plain;
                      return 200 "Enhanced OmniChannel Gateway v8.5.0 
          Services: Omni(${SLOTS_OMNI}), Analytics(${SLOTS_ANALYTICS}), Notifications(${SLOTS_NOTIFICATION}), Audit(${SLOTS_AUDIT}), Scheduler(1)
          Endpoints: /services, /health, /api/*, /dw/*";
                  }
                  
                  # Default 404 for undefined routes
                  location / {
                      return 404 "Endpoint not found. Visit /services for available routes.";
                  }
              }
          }
          CONF
          
          # Deploy enhanced nginx gateway
          ctr rm -f echo-nginx >/dev/null 2>&1 || true
          ctr run -d --name echo-nginx --network "${DOCKER_NET}" --restart unless-stopped \
            -p 8088:80 \
            -v "$PWD/${ECHO_NET}/nginx/nginx.conf":/etc/nginx/nginx.conf:ro \
            -v "$PWD/${ECHO_NET}/logs":/var/log/nginx \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            nginx:alpine
          
          # Deploy nginx exporter
          ctr rm -f nginx-exporter >/dev/null 2>&1 || true
          ctr run -d --name nginx-exporter --network "${DOCKER_NET}" --restart unless-stopped \
            -p 9113:9113 \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            nginx/nginx-prometheus-exporter:latest -nginx.scrape-uri=http://echo-nginx/nginx_status
          
          # Test gateway endpoints
          sleep 5
          for endpoint in "/health" "/services" "/nginx_status"; do
            if curl -fsS "http://localhost:8088${endpoint}" >/dev/null 2>&1; then
              echoe "Gateway endpoint ${endpoint} is accessible"
            else
              warn "Gateway endpoint ${endpoint} is not accessible"
            fi
          done
          
          make_archive "10_enhanced_nginx_gateway" "${ECHO_NET}/nginx" "${ECHO_NET}/logs"

      - name: 📈 Enhanced monitoring stack (Loki, Promtail, Prometheus, Grafana)
        if: ${{ env.ENABLE_MONITORING == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          
          # Pull monitoring images
          retry 3 3 -- ctr pull grafana/loki:latest
          retry 3 3 -- ctr pull grafana/promtail:latest
          retry 3 3 -- ctr pull prom/prometheus:latest
          retry 3 3 -- ctr pull grafana/grafana:latest
          retry 3 3 -- ctr pull prom/alertmanager:latest
          
          # Deploy Loki for log aggregation
          ctr rm -f loki >/dev/null 2>&1 || true
          ctr run -d --name loki --network "${DOCKER_NET}" --restart unless-stopped \
            -p 3100:3100 \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            grafana/loki:latest -config.file=/etc/loki/local-config.yaml
          
          # Create enhanced Promtail configuration
          mkdir -p "${ECHO_NET}/promtail"
          if [ "${USE_PODMAN:-0}" = "1" ]; then
            # Podman configuration (file-based)
            cat > "${ECHO_NET}/promtail/config.yml" <<'YAML'
          server:
            http_listen_port: 9080
            grpc_listen_port: 0
          
          positions:
            filename: /tmp/positions.yaml
          
          clients:
            - url: http://loki:3100/loki/api/v1/push
          
          scrape_configs:
            - job_name: nginx
              static_configs:
                - targets:
                    - localhost
                  labels:
                    job: nginx
                    service: gateway
                    __path__: /var/log/nginx/access.log
            
            - job_name: nginx_errors  
              static_configs:
                - targets:
                    - localhost
                  labels:
                    job: nginx_errors
                    service: gateway
                    __path__: /var/log/nginx/error.log
          YAML
          else
            # Docker configuration (container logs)
            cat > "${ECHO_NET}/promtail/config.yml" <<'YAML'
          server:
            http_listen_port: 9080
            grpc_listen_port: 0
          
          positions:
            filename: /tmp/positions.yaml
          
          clients:
            - url: http://loki:3100/loki/api/v1/push
          
          scrape_configs:
            - job_name: containers
              docker_sd_configs:
                - host: unix:///var/run/docker.sock
                  refresh_interval: 5s
              
              relabel_configs:
                - source_labels: ['__meta_docker_container_name']
                  regex: '/(echo-nginx|nginx-exporter|omni.*|analytics.*|notification.*|audit.*|scheduler.*|td-sim|loki|prometheus).*'
                  action: keep
                
                - source_labels: ['__meta_docker_container_name']
                  target_label: container
                  regex: '/(.*)'
                  replacement: '$1'
                
                - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
                  target_label: service
                
                - source_labels: ['container']
                  target_label: service_type
                  regex: '(omni|analytics|notification|audit|scheduler).*'
                  replacement: '$1'
              
              pipeline_stages:
                - docker: {}
                - match:
                    selector: '{service_type="omni"}'
                    stages:
                      - json:
                          expressions:
                            level: level
                            timestamp: timestamp
                            message: message
                - match:
                    selector: '{container="echo-nginx"}'
                    stages:
                      - regex:
                          expression: '^(?P<remote_addr>[\d\.]+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+) (?P<protocol>\S+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<referer>[^"]*)" "(?P<user_agent>[^"]*)" rt=(?P<request_time>[\d\.]+)'
                      - labels:
                          method:
                          status:
                          path:
          YAML
          fi
          
          # Deploy Promtail
          ctr rm -f promtail >/dev/null 2>&1 || true
          if [ "${USE_PODMAN:-0}" = "1" ]; then
            ctr run -d --name promtail --network "${DOCKER_NET}" --restart unless-stopped \
              -v "$PWD/${ECHO_NET}/logs":/var/log/nginx:ro \
              -v "$PWD/${ECHO_NET}/promtail/config.yml":/etc/promtail/config.yml:ro \
              -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
              grafana/promtail:latest -config.file=/etc/promtail/config.yml
          else
            ctr run -d --name promtail --network "${DOCKER_NET}" --restart unless-stopped \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v /var/lib/docker/containers:/var/lib/docker/containers:ro \
              -v "$PWD/${ECHO_NET}/promtail/config.yml":/etc/promtail/config.yml:ro \
              -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
              grafana/promtail:latest -config.file=/etc/promtail/config.yml
          fi
          
          # Create comprehensive Prometheus configuration
          mkdir -p "${ECHO_NET}/prometheus"
          
          # Generate targets for all service slots
          OMNI_TARGETS=""
          ANALYTICS_TARGETS=""
          NOTIFICATION_TARGETS=""
          AUDIT_TARGETS=""
          
          for i in $(seq 1 ${SLOTS_OMNI}); do
            [ -n "$OMNI_TARGETS" ] && OMNI_TARGETS="${OMNI_TARGETS}, "
            OMNI_TARGETS="${OMNI_TARGETS}'omni-${i}:8000'"
          done
          
          for i in $(seq 1 ${SLOTS_ANALYTICS}); do
            [ -n "$ANALYTICS_TARGETS" ] && ANALYTICS_TARGETS="${ANALYTICS_TARGETS}, "
            ANALYTICS_TARGETS="${ANALYTICS_TARGETS}'analytics-${i}:8001'"
          done
          
          for i in $(seq 1 ${SLOTS_NOTIFICATION}); do
            [ -n "$NOTIFICATION_TARGETS" ] && NOTIFICATION_TARGETS="${NOTIFICATION_TARGETS}, "
            NOTIFICATION_TARGETS="${NOTIFICATION_TARGETS}'notification-${i}:8002'"
          done
          
          for i in $(seq 1 ${SLOTS_AUDIT}); do
            [ -n "$AUDIT_TARGETS" ] && AUDIT_TARGETS="${AUDIT_TARGETS}, "
            AUDIT_TARGETS="${AUDIT_TARGETS}'audit-${i}:8003'"
          done
          
          cat > "${ECHO_NET}/prometheus/prometheus.yml" <<YAML
          global:
            scrape_interval: 15s
            evaluation_interval: 15s
            external_labels:
              cluster: 'echo-ops'
              environment: 'dev'
          
          rule_files:
            - /etc/prometheus/recording_rules.yml
            - /etc/prometheus/alert_rules.yml
          
          alerting:
            alertmanagers:
              - static_configs:
                  - targets: ['alertmanager:9093']
          
          scrape_configs:
            # Gateway and infrastructure
            - job_name: 'nginx-gateway'
              metrics_path: /metrics  
              static_configs:
                - targets: ['nginx-exporter:9113']
              scrape_interval: 10s
          
            - job_name: 'loki'
              static_configs:
                - targets: ['loki:3100']
              scrape_interval: 30s
          
            # Application services
            - job_name: 'omni-services'
              metrics_path: /metrics
              static_configs:
                - targets: [ ${OMNI_TARGETS} ]
              scrape_interval: 10s
              scrape_timeout: 5s
          
            - job_name: 'analytics-services'
              metrics_path: /metrics
              static_configs:
                - targets: [ ${ANALYTICS_TARGETS} ]
              scrape_interval: 15s
          
            - job_name: 'notification-services' 
              metrics_path: /metrics
              static_configs:
                - targets: [ ${NOTIFICATION_TARGETS} ]
              scrape_interval: 20s
          
            - job_name: 'audit-services'
              metrics_path: /metrics
              static_configs:
                - targets: [ ${AUDIT_TARGETS} ]
              scrape_interval: 30s
          
            - job_name: 'scheduler-service'
              metrics_path: /metrics
              static_configs:
                - targets: ['scheduler-1:8004']
              scrape_interval: 30s
          
            # Database monitoring (if postgres_exporter available)
            - job_name: 'postgres'
              static_configs:
                - targets: ['td-sim:5432']
              scrape_interval: 30s
              metrics_path: /metrics
              # This would require postgres_exporter sidecar
          YAML
          
          # Create recording rules for performance optimization
          cat > "${ECHO_NET}/prometheus/recording_rules.yml" <<'YAML'
          groups:
            - name: service_performance
              interval: 30s
              rules:
                - record: echo:request_rate_5m
                  expr: rate(omni_requests_total[5m])
                
                - record: echo:request_latency_p95_5m
                  expr: histogram_quantile(0.95, rate(omni_request_duration_seconds_bucket[5m]))
                
                - record: echo:error_rate_5m
                  expr: rate(omni_requests_total{status=~"5.."}[5m])
          
            - name: system_health
              interval: 60s
              rules:
                - record: echo:service_up
                  expr: up{job=~".*-services"}
                
                - record: echo:nginx_requests_rate
                  expr: rate(nginx_http_requests_total[5m])
          YAML
          
          # Create comprehensive alerting rules
          cat > "${ECHO_NET}/prometheus/alert_rules.yml" <<'YAML'
          groups:
            - name: service_availability
              rules:
                - alert: ServiceDown
                  expr: up{job=~".*-services"} == 0
                  for: 1m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Service {{ $labels.job }} is down"
                    description: "Service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 1 minute."
          
                - alert: NginxDown
                  expr: up{job="nginx-gateway"} == 0
                  for: 30s
                  labels:
                    severity: critical
                  annotations:
                    summary: "Nginx gateway is down"
          
            - name: performance_alerts
              rules:
                - alert: HighRequestLatency
                  expr: echo:request_latency_p95_5m > 0.5
                  for: 2m
                  labels:
                    severity: warning
                  annotations:
                    summary: "High request latency detected"
                    description: "95th percentile latency is {{ $value }}s"
          
                - alert: HighErrorRate
                  expr: echo:error_rate_5m > 0.1
                  for: 5m
                  labels:
                    severity: critical
                  annotations:
                    summary: "High error rate detected"
                    description: "Error rate is {{ $value }} requests/second"
          
            - name: resource_alerts
              rules:
                - alert: DatabaseConnectionsHigh
                  expr: omni_db_connections_active > 8
                  for: 2m
                  labels:
                    severity: warning
                  annotations:
                    summary: "High database connection usage"
          YAML
          
          # Deploy Prometheus
          }" --restart unless-stopped \
                $port_mapping \
                -v "$PWD/${ECHO_DW}/queries":/queries:ro \
                -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
                -e SERVICE_NAME="$name" -e DB_HOST=td-sim \
                "${OMNI_IMAGE}:latest"
            done
          fi
          
          # Deploy Analytics service slots
          if [ "${RUN_ANALYTICS}" = "true" ]; then
            for i in $(seq 1 ${SLOTS_ANALYTICS}); do
              name="analytics-$i"
              ctr rm -f "$name" >/dev/null 2>&1 || true
              
              if [ "$i" -eq 1 ]; then
                port_mapping="-p 8091:8001"
              else
                port_mapping=""
              fi
              
              ctr run -d --name "$name" --network "${DOCKER_NET
