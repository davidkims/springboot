name: 🐬 MySQL Full Setup, Migration & Auto Backup

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  mysql_full_pipeline:
    runs-on: ubuntu-latest

    env:
      MYSQL_IMAGE: mysql:8.0
      DB_NAME: example_db
      DB_USER: root
      DB_PASS: rootpass123
      ROOT_PASS: rootpass123
      MIGRATION_DIR: /opt/mysql/migrations
      BACKUP_DIR: /opt/backup/sql
      LEDGER_DIR: /opt/backup/ledgers
      SITE_DIR: site

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Prepare Directories
        run: |
          echo "[+] Creating directories..."
          sudo mkdir -p "$MIGRATION_DIR" "$BACKUP_DIR" "$LEDGER_DIR" "$SITE_DIR"
          sudo chmod -R 777 /opt/mysql /opt/backup "$SITE_DIR"

      - name: 🧾 Generate SQL Migration File
        run: |
          echo "[+] Creating SQL migration file..."
          echo "
          CREATE TABLE IF NOT EXISTS accounts (
              id INT AUTO_INCREMENT PRIMARY KEY,
              name VARCHAR(50),
              balance DECIMAL(12,2)
          );
          CREATE TABLE IF NOT EXISTS corporate_transactions (
              transaction_id INT AUTO_INCREMENT PRIMARY KEY,
              corporate_name VARCHAR(100) NOT NULL,
              transaction_type VARCHAR(50) NOT NULL,
              amount DECIMAL(12,2) NOT NULL,
              transaction_date DATETIME DEFAULT CURRENT_TIMESTAMP
          );
          INSERT INTO accounts(name, balance) VALUES ('홍길동', 1000000);
          INSERT INTO corporate_transactions(corporate_name, transaction_type, amount) VALUES ('ABC Corporation', 'Purchase', 500000);
          INSERT INTO corporate_transactions(corporate_name, transaction_type, amount) VALUES ('XYZ Inc.', 'Sale', 250000);
          " | sudo tee "$MIGRATION_DIR/migrate.sql"

      - name: 🧪 Install MySQL Server
        run: |
          echo "[+] Installing MySQL server..."
          sudo apt-get update && sudo apt-get upgrade -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server || { echo "❌ MySQL installation failed"; exit 1; }

      - name: 🔐 Reset Root Password in Safe Mode
        run: |
          echo "[+] Resetting root password in safe mode..."
          sudo systemctl stop mysql
          sudo mkdir -p /var/run/mysqld
          sudo chown mysql:mysql /var/run/mysqld
          sudo mysqld_safe --skip-networking --skip-grant-tables &
          sleep 10
          echo "FLUSH PRIVILEGES; ALTER USER 'root'@'localhost' IDENTIFIED BY '$ROOT_PASS'; FLUSH PRIVILEGES;" | sudo mysql -u root
          sudo killall mysqld
          sleep 5
          sudo systemctl start mysql || { echo "❌ MySQL failed to start"; exit 1; }

      - name: 🛠️ Create Database and User
        run: |
          echo "[+] Creating database and user..."
          mysql -u root -p"$ROOT_PASS" -e "CREATE DATABASE IF NOT EXISTS $DB_NAME;"
          mysql -u root -p"$ROOT_PASS" -e "CREATE USER IF NOT EXISTS '$DB_USER'@'localhost' IDENTIFIED BY '$DB_PASS';"
          mysql -u root -p"$ROOT_PASS" -e "GRANT ALL PRIVILEGES ON $DB_NAME.* TO '$DB_USER'@'localhost';"
          mysql -u root -p"$ROOT_PASS" -e "FLUSH PRIVILEGES;"

      - name: 📥 Execute Migration
        run: |
          echo "[+] Running migration..."
          mysql -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" < "$MIGRATION_DIR/migrate.sql" || { echo "❌ Migration failed"; exit 1; }

      - name: 🔁 Simulate Transactions
        run: |
          echo "[+] Simulating transactions..."
          echo "USE $DB_NAME;" > simulate_transactions.sql
          for i in $(seq 1 60); do
            company="SimCorp_$i"
            type=$( [ $((i % 2)) -eq 0 ] && echo "Purchase" || echo "Sale" )
            amount=$(( RANDOM % 100000 + 10000 ))
            echo "INSERT INTO corporate_transactions(corporate_name, transaction_type, amount) VALUES ('$company', '$type', $amount);" >> simulate_transactions.sql
          done
          mysql -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" < simulate_transactions.sql

      - name: ✅ Verify Data
        run: |
          echo "[+] Verifying data..."
          mysql -u "$DB_USER" -p"$DB_PASS" -e "USE $DB_NAME; SHOW TABLES; SELECT * FROM accounts; SELECT * FROM corporate_transactions;"

      - name: 💾 Backup Database
        run: |
          echo "[+] Backing up MySQL DB..."
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BACKUP_FILE="$BACKUP_DIR/backup-$TIMESTAMP.sql"
          mysqldump -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" > "$BACKUP_FILE"
          gzip -f "$BACKUP_FILE"
          echo "[✔] Backup created: $BACKUP_FILE.gz"

      - name: 📄 Generate Ledger CSV
        run: |
          echo "[+] Generating ledger CSV..."
          sudo mkdir -p "$LEDGER_DIR"
          mysql -u "$DB_USER" -p"$DB_PASS" -e "SELECT * FROM $DB_NAME.corporate_transactions \
            INTO OUTFILE '/var/lib/mysql-files/ledger.csv' \
            FIELDS TERMINATED BY ',' ENCLOSED BY '"' \
            LINES TERMINATED BY '\n';"
          sudo mv /var/lib/mysql-files/ledger.csv "$LEDGER_DIR/ledger.csv"
          gzip -f "$LEDGER_DIR/ledger.csv"
          echo "[✔] Ledger file created: $LEDGER_DIR/ledger.csv.gz"

      - name: 🚀 Deploy to GitHub Pages
        run: |
          echo "[+] Preparing GitHub Pages content..."
          cp "$LEDGER_DIR/ledger.csv.gz" "$SITE_DIR/ledger.csv.gz"
          cd "$SITE_DIR"
          git init
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Deploy ledger to GitHub Pages"
          git branch -M gh-pages
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git push -f origin gh-pages
          echo "[✔] GitHub Pages deployed."
