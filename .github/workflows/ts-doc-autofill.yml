name: 🏁 All-in-One Upload/Download/Homepage/Echo/Banner/Server Cluster Update Automation

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  allinone:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Massive Dir/Echo/Backup/Recovery/Home/Upload/Download/Server/Log Generation
        run: |
          set -e
          # 1st PASS: All Directories (no fail)
          DIRS=(
            ".github/ts_doc_autofill"
            ".github/ts_doc_autofill/logs"
            ".github/ts_doc_autofill/echo"
            ".github/ts_doc_autofill/sample_docs"
            ".github/echo_permission"
            ".github/echo_network"
            ".github/echo_upload"
            ".github/echo_download"
            ".github/echo_upgrade"
            ".github/echo_homepage"
            ".github/echo_banner"
            ".github/echo_security"
            ".github/echo_recovery"
            ".github/echo_backup"
            ".github/echo_tmp"
            ".github/echo_server"
            "site/uploads"
            "site/downloads"
            "site/public"
            "site/tmp"
            "site/logs"
            "site/email"
          )
          for d in "${DIRS[@]}"; do mkdir -p "$d"; done

          # 2nd PASS: Create echo files for all dirs (guaranteed echo dir exists)
          ECHODIR=".github/ts_doc_autofill/echo"
          mkdir -p "$ECHODIR"
          for d in "${DIRS[@]}"; do
            bname=$(basename "$d")
            ef="$ECHODIR/mkdir_${bname}.txt"
            echo "echo 'mkdir -p $d'" > "$ef"
          done

          # Massive echo for homepage/banner/nav/buttons
          mkdir -p site/public .github/echo_banner .github/echo_homepage
          cat <<EOF > site/public/index.html
          <html>
          <head><title>All-in-One Portal</title></head>
          <body>
          <div id='header'>
            <h1>All-in-One Automation Portal</h1>
            <nav>
              <a href='/public/index.html' id='home_link'>Home</a> |
              <a href='/uploads' id='upload_link'>Upload</a> |
              <a href='/downloads' id='download_link'>Download</a>
            </nav>
          </div>
          <div id='banner'><h2>🚀 Banner: Automation & Security & Recovery</h2></div>
          <div id='main'>
            <form action='/upload' method='post' enctype='multipart/form-data'>
              <label for='file'>File Upload:</label>
              <input type='file' name='file' id='file'>
              <button type='submit' id='upload_btn'>Upload</button>
            </form>
            <a href='/downloads' id='go_downloads'>File List / Download</a>
          </div>
          <div id='footer'><small>Powered by Actions All-in-One</small></div>
          </body></html>
          EOF

          # Banner/menu/button/link echo
          echo "echo 'Home banner shown'" > .github/echo_banner/home_banner.sh
          echo "echo 'Upload button click'" > .github/echo_banner/upload_btn.sh
          echo "echo 'Download button click'" > .github/echo_banner/download_btn.sh
          echo "echo 'Homepage nav click'" > .github/echo_banner/nav_click.sh

          # Homepage URL echo
          echo "https://github.com/${{ github.repository }}/tree/gh-pages/public/index.html" > .github/echo_homepage/homepage_url.txt

      - name: 🟢 Server Cluster-wide apt update/upgrade (prod/test/local)
        run: |
          set -e
          SERVERS=("prod" "test" "local")
          for S in "${SERVERS[@]}"; do
            E=".github/echo_server"
            echo "echo '[$S] sudo apt-get update -y && sudo apt-get upgrade -y'" > $E/${S}_apt_upgrade.sh
            sudo apt-get update -y | tee $E/${S}_apt_update.log
            sudo apt-get upgrade -y | tee $E/${S}_apt_upgrade.log
          done

      - name: ⚙️ tsconfig.json auto-gen/backup
        run: |
          cat <<EOF | tee tsconfig.json
          {
            "compilerOptions": {
              "target": "ES6",
              "module": "commonjs",
              "outDir": "dist",
              "esModuleInterop": true
            }
          }
          EOF
          echo "echo 'tsconfig.json created'" > .github/ts_doc_autofill/echo/tsconfig.txt
          cp tsconfig.json .github/echo_backup/backup_tsconfig_$(date +%Y%m%d_%H%M%S).json

      - name: 📝 Upload/Download/Home/AutoComplete Server code autogen/backup
        run: |
          cat <<'EOF' | tee .github/ts_doc_autofill/autofill-server.ts
          import express from 'express';
          import fs from 'fs';
          import path from 'path';
          import bodyParser from 'body-parser';
          import multer from 'multer';

          const app = express();
          const PORT = process.env.PORT || 3070;
          const upload = multer({ dest: 'site/uploads/' });

          app.use(bodyParser.json({ limit: '5mb' }));
          app.use('/public', express.static('site/public'));
          app.use('/uploads', express.static('site/uploads'));
          app.use('/downloads', express.static('site/downloads'));

          // Autocomplete API
          app.post('/autofill', (req, res) => {
            const { docContent } = req.body;
            if (typeof docContent !== 'string') return res.status(400).json({ error: 'docContent required' });
            let result = docContent;
            if (docContent.length < 20) result += "\n\n[Autocomplete Example] Please enter more content.";
            else result += "\n\n[AI Autocomplete]: The content is now richer. Thank you.";
            fs.writeFileSync('.github/ts_doc_autofill/logs/last_autofill.txt', `Input: ${docContent}\n\nOutput: ${result}\n`);
            return res.json({ autofilled: result });
          });

          // File upload
          app.post('/upload', upload.single('file'), (req, res) => {
            if (!req.file) return res.status(400).send('No file uploaded.');
            fs.appendFileSync('.github/echo_upload/upload.log', `[${new Date().toISOString()}] Uploaded: ${req.file.originalname} => ${req.file.path}\n`);
            fs.copyFileSync(req.file.path, path.join('site/downloads', req.file.originalname));
            return res.send('Upload complete! <a href="/public/index.html">Back to home</a>');
          });

          // Download (list)
          app.get('/downloads', (req, res) => {
            const files = fs.readdirSync('site/downloads').map(fn => `<li><a href="/downloads/${fn}">${fn}</a></li>`).join('');
            res.send(`<h1>Download List</h1><ul>${files}</ul><a href="/public/index.html">Back to home</a>`);
          });

          app.listen(PORT, () => {
            fs.appendFileSync('.github/ts_doc_autofill/logs/server.log', `[${new Date().toISOString()}] Server started\n`);
            console.log(`🚀 All-in-One Server: http://localhost:${PORT}/public/index.html`);
          });
          EOF
          echo "echo 'autofill-server.ts created'" > .github/ts_doc_autofill/echo/autofill-server.txt
          cp .github/ts_doc_autofill/autofill-server.ts .github/echo_backup/backup_autofill-server_$(date +%Y%m%d_%H%M%S).ts

      - name: ⚡ npm project & package install (express/multer/body-parser)
        run: |
          if [ ! -f package.json ]; then
            echo "echo 'npm init -y'" > .github/ts_doc_autofill/echo/npm_init.txt
            npm init -y
          else
            echo "[info] package.json already exists" > .github/ts_doc_autofill/echo/npm_init_info.txt
          fi
          echo "echo 'npm install express multer body-parser @types/express @types/node ts-node typescript --save'" > .github/ts_doc_autofill/echo/npm_install.txt
          npm install express multer body-parser @types/express @types/node ts-node typescript --save \
            2>&1 | tee .github/ts_doc_autofill/echo/npm_install.log || \
            { echo "[WARN] npm install failed → --force retry" | tee -a .github/ts_doc_autofill/echo/npm_install.log; npm install --force; }
          cp package.json .github/echo_backup/backup_package_$(date +%Y%m%d_%H%M%S).json

      - name: 🟢 Server run/test curl/echo/log
        run: |
          echo "echo 'npx ts-node .github/ts_doc_autofill/autofill-server.ts'" > .github/ts_doc_autofill/echo/run_server.txt
          echo "echo 'curl -X POST http://localhost:3070/autofill -H \"Content-Type: application/json\" -d \"{\\\"docContent\\\":\\\"Example Input\\\"}\"'" > .github/ts_doc_autofill/echo/curl_test.txt

      - name: 🧪 Upload/Download/Home/Autocomplete Server background run
        run: |
          nohup npx ts-node .github/ts_doc_autofill/autofill-server.ts > .github/ts_doc_autofill/logs/server_run.log 2>&1 &
          sleep 6

      - name: 🛠️ API/Upload/Download Test (curl)
        run: |
          curl -X POST http://localhost:3070/autofill -H "Content-Type: application/json" -d '{"docContent":"Resume intro"}' | tee .github/ts_doc_autofill/logs/curl_autofill.log
          echo "Test upload file" > site/tmp/testfile.txt
          curl -F "file=@site/tmp/testfile.txt" http://localhost:3070/upload | tee .github/echo_upload/upload_test_result.txt
          curl http://localhost:3070/downloads | tee .github/echo_download/downloads_test_result.html

      - name: 🚀 GitHub Pages homepage upload/deploy (public/index.html etc)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/public
          publish_branch: gh-pages

      - name: 🕵️‍♂️ Final check (echo/backup/download/upload/home)
        run: |
          echo "[CHECK] .github/ts_doc_autofill"
          tree .github/ts_doc_autofill || ls -lR .github/ts_doc_autofill
          echo "[CHECK] site/public"
          ls -l site/public || true
          echo "[CHECK] site/uploads"
          ls -l site/uploads || true
          echo "[CHECK] site/downloads"
          ls -l site/downloads || true
          echo "[CHECK] .github/echo_backup"
          ls -l .github/echo_backup || true
          echo "[CHECK] .github/echo_banner"
          ls -l .github/echo_banner || true
          echo "[CHECK] .github/echo_upload"
          ls -l .github/echo_upload || true
