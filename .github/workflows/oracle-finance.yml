name: "🛡️ IDS Misuse-Detection Suite (Suricata 7/8 PPA + Snort3 via Docker + ECHO, FIXED Suricata -T)"

on:
  workflow_dispatch:
    inputs:
      run_suricata:
        description: "Suricata 테스트 실행 (true/false)"
        required: false
        default: "true"
      run_snort3:
        description: "Snort3 테스트 실행 (true/false)"
        required: false
        default: "true"
      verbose:
        description: "자세한 로그 출력 (true/false)"
        required: false
        default: "true"

jobs:
  ids-misuse-suite:
    runs-on: ubuntu-latest
    env:
      PYTHONWARNINGS: "ignore::SyntaxWarning"
      ECHO_ROOT: .github/echo_ids
      OUT_DIR: .github/echo_ids/out
      RULE_DIR: .github/echo_ids/rules
      PCAP_DIR: .github/echo_ids/pcap
      LOG_DIR: .github/echo_ids/logs
      RUN_SURICATA: ${{ github.event.inputs.run_suricata || 'true' }}
      RUN_SNORT3: ${{ github.event.inputs.run_snort3 || 'true' }}
      VERBOSE: ${{ github.event.inputs.verbose || 'true' }}
      SNORT3_IMG: "ciscotalos/snort3:latest"

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📁 Prepare dirs & write ECHO helpers"
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_ROOT" "$OUT_DIR" "$RULE_DIR" "$PCAP_DIR" "$LOG_DIR" "$OUT_DIR/conf" "$ECHO_ROOT/tools"
          cat > "$ECHO_ROOT/tools/echo.sh" <<'EOSH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          step(){ echo -e "\n[STEP] $*"; }
          ok(){ echo "[OK] $*"; }
          warn(){ echo "[WARN] $*" >&2; }
          fail(){ echo "[FAIL] $*" >&2; exit 1; }
          setup_trap(){ trap 'rc=$?; echo "[TRAP] Failed at: ${BASH_COMMAND} (rc=$rc)" >&2' ERR; }
          EOSH
          chmod +x "$ECHO_ROOT/tools/echo.sh"
          echo "[OK] ECHO helpers ready"

      - name: "🧩 Install Suricata (7/8.x PPA) & base tools"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          step "APT base update"
          sudo apt-get update -y
          step "Install base packages"
          sudo apt-get install -y software-properties-common curl jq ca-certificates gnupg lsb-release python3 python3-pip wireshark-common
          step "Add OISF Suricata PPA"
          sudo add-apt-repository -y ppa:oisf/suricata-stable
          sudo apt-get update -y
          step "Install Suricata"
          sudo apt-get install -y suricata
          ok "Suricata installed"
          step "Python pip/scapy"
          python3 -m pip install --upgrade pip
          python3 -m pip install scapy
          ok "Scapy installed"

      - name: "🐳 Prepare Snort3 Docker image"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          step "Pull Snort3 Docker image"
          docker pull "$SNORT3_IMG"
          ok "Snort3 image ready"

      - name: "🔎 Version & Capabilities (Suricata / Snort3)"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          step "Suricata version/build-info"
          suricata -V || true
          suricata --build-info || true
          step "Snort3 version (Docker)"
          docker run --rm "$SNORT3_IMG" snort -V || true
          step "Snort3 DAQ list"
          docker run --rm "$SNORT3_IMG" snort --daq-list || true

      - name: "📝 Write Misuse Rules & Snort3 config"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          step "Write local.rules"
          cat > "$RULE_DIR/local.rules" <<'RULES'
          # Signature examples
          alert tcp $EXTERNAL_NET any -> $HOME_NET $HTTP_PORTS (msg:"SQLi"; flow:to_server,established; http_uri; content:"' OR 1=1 --"; nocase; sid:1000001; rev:1;)
          alert tcp $EXTERNAL_NET any -> $HOME_NET $HTTP_PORTS (msg:"XSS"; flow:to_server,established; http_client_body; content:"<script"; nocase; sid:1000002; rev:1;)
          RULES
          ok "Rules ready"
          step "Write snort.lua for container"
          cat > "$OUT_DIR/conf/snort.lua" <<'LUA'
          ips = default_ips
          ips.rules = [[ include /work/rules/local.rules ]]
          alert_fast = { file = true }
          LUA
          ok "snort.lua ready"

      - name: "🧪 Build test PCAP"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          cat > "$PCAP_DIR/build_pcap.py" <<'PY'
          from scapy.all import Ether, IP, TCP, wrpcap, Raw
          pkts=[]
          req=b"GET /search?q=' OR 1=1 -- HTTP/1.1\r\nHost: x\r\n\r\n"
          pkts.append(Ether()/IP(src="1.1.1.1",dst="2.2.2.2")/TCP(dport=80)/Raw(load=req))
          wrpcap("sample_ids.pcap", pkts)
          PY
          python3 "$PCAP_DIR/build_pcap.py"
          mv sample_ids.pcap "$PCAP_DIR/sample_ids.pcap"
          ok "PCAP ready"

      - name: "🧷 Configure Suricata (rule path staging)"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          SYS_YAML="/etc/suricata/suricata.yaml"
          DEFAULT_RULE_PATH=$(sudo awk -F': *' '/^[[:space:]]*default-rule-path:/ {gsub(/"/,"",$2);print $2;exit}' "$SYS_YAML" || true)
          [ -z "$DEFAULT_RULE_PATH" ] && DEFAULT_RULE_PATH="/etc/suricata/rules"
          sudo mkdir -p "$DEFAULT_RULE_PATH"
          sudo cp "$RULE_DIR/local.rules" "$DEFAULT_RULE_PATH/local.rules"
          sudo cp "$SYS_YAML" "$OUT_DIR/conf/suricata.yaml"
          ok "Suricata config staged"

      - name: "✅ Config tests (Suricata / Snort3)"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          if [ "${RUN_SURICATA}" = "true" ]; then
            step "Suricata -T with our rules"
            sudo suricata -T -c /etc/suricata/suricata.yaml -S "$RULE_DIR/local.rules" -v
            ok "Suricata config OK"
          fi
          if [ "${RUN_SNORT3}" = "true" ]; then
            step "Snort3 parse (Docker)"
            docker run --rm -v "$PWD/.github/echo_ids:/work" -w /work "$SNORT3_IMG" \
              snort -c /work/out/conf/snort.lua -S /work/rules/local.rules -q -l /work/out/snort3 -k none -A alert_fast -r /work/pcap/sample_ids.pcap || true
            ok "Snort3 config parse OK"
          fi

      - name: "▶️ Offline detect run (PCAP)"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          if [ "${RUN_SURICATA}" = "true" ]; then
            step "Suricata offline"
            mkdir -p "$OUT_DIR/suricata"
            sudo suricata -r "$PCAP_DIR/sample_ids.pcap" -S "$RULE_DIR/local.rules" -l "$OUT_DIR/suricata"
            cat "$OUT_DIR/suricata/fast.log" || true
          fi
          if [ "${RUN_SNORT3}" = "true" ]; then
            step "Snort3 offline (Docker)"
            mkdir -p "$OUT_DIR/snort3"
            docker run --rm -v "$PWD/.github/echo_ids:/work" -w /work "$SNORT3_IMG" \
              snort -c /work/out/conf/snort.lua -S /work/rules/local.rules -A alert_fast -q -l /work/out/snort3 -r /work/pcap/sample_ids.pcap
            cat "$OUT_DIR/snort3/alert_fast.log" || true
          fi
          ok "Offline runs done"

      - name: "🔎 Assertions (rules firing)"
        shell: bash
        run: |
          . "$ECHO_ROOT/tools/echo.sh"; setup_trap
          PASS=1
          grep -q "SQLi" "$OUT_DIR/suricata/fast.log" || PASS=0
          grep -q "SQLi" "$OUT_DIR/snort3/alert_fast.log" || PASS=0
          [ $PASS -eq 1 ] || fail "Rule not fired"
          ok "Assertions passed"

      - name: "📦 Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: ids-misuse-artifacts
          path: |
            .github/echo_ids/out/**
            .github/echo_ids/rules/local.rules
            .github/echo_ids/pcap/sample_ids.pcap
          if-no-files-found: warn
