name: "🛰 Net Echo (Pre-Docker) — Bash/PowerShell + Echo Everywhere"

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: "수집 결과를 레포에 커밋/푸시 (GH_ADMIN_TOKEN 필요)"
        required: false
        default: "false"
      out_dir:
        description: "출력 루트 경로"
        required: false
        default: ".github/echo_net"
      archive_name:
        description: "결과 압축 파일명(확장자 포함, 비우면 자동)"
        required: false
        default: ""
      pages_deploy:
        description: "site/net-echo/ 로 결과 복사 (Pages 설정 시)"
        required: false
        default: "false"

permissions:
  contents: write

env:
  ECHO_ROOT: ${{ github.event.inputs.out_dir || '.github/echo_net' }}
  GH_OWNER: ${{ github.repository_owner }}
  GH_REPO: ${{ github.event.repository.name }}
  # 선택: 레포 커밋용 PAT/토큰을 Secrets에 넣으세요 (예: GH_ADMIN_TOKEN)
  GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}

jobs:
  net-echo-unix:
    name: "Unix (ubuntu, macOS) — Echo"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: "[ECHO] Checkout"
        uses: actions/checkout@v4

      - name: "[ECHO] Print inputs"
        run: |
          set -Eeuo pipefail
          echo "[ECHO] ECHO_ROOT=${ECHO_ROOT}"
          echo "[ECHO] commit_changes=${{ github.event.inputs.commit_changes || 'false' }}"
          echo "[ECHO] archive_name=${{ github.event.inputs.archive_name || '' }}"
          echo "[ECHO] pages_deploy=${{ github.event.inputs.pages_deploy || 'false' }}"
          echo "[ECHO] matrix.os=${{ matrix.os }}"

      - name: "[ECHO] Prepare dirs"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO] mkdir -p ${ECHO_ROOT}/{out,bin,logs}"
          mkdir -p "${ECHO_ROOT}/out" "${ECHO_ROOT}/bin" "${ECHO_ROOT}/logs"

      - name: "[ECHO] Install helper tools (optional)"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO] Update apt (no-fail)"
          sudo apt-get -y update || true
          echo "[ECHO] Install net-tools, dnsutils, iproute2 (no-fail)"
          sudo apt-get -y install net-tools dnsutils iproute2 iptables nftables ethtool lshw || true

      - name: "[ECHO] Write Bash collector"
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "${ECHO_ROOT}/gather_net_echo.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ECHO_ROOT="${ECHO_ROOT:-./net_echo}"
          OUT_DIR="${OUT_DIR:-${ECHO_ROOT}/out}"
          BIN_DIR="${BIN_DIR:-${ECHO_ROOT}/bin}"
          LOG_DIR="${LOG_DIR:-${ECHO_ROOT}/logs}"
          ARCHIVE="${ARCHIVE:-${ECHO_ROOT}/net_echo_$(date +%Y%m%d_%H%M%S).tar.gz}"
          mkdir -p "$OUT_DIR" "$BIN_DIR" "$LOG_DIR"
          echoe(){ echo "[ECHO][$(date +%H:%M:%S)] $*"; }
          fail(){ echoe "FAIL: $*"; exit 1; }
          trap 'rc=$?; echoe "FAILED at: ${BASH_COMMAND} (rc=${rc})"; exit $rc' ERR
          check_cmd(){
            local c="$1"
            if command -v "$c" >/dev/null 2>&1; then
              local v; v="$("$c" --version 2>/dev/null | head -n1 || true)"
              printf "%-18s : %s\n" "$c" "${v:-(no version line)}" | tee -a "${BIN_DIR}/commands.txt"
            else
              printf "%-18s : MISSING\n" "$c" | tee -a "${BIN_DIR}/commands.txt"
            fi
          }
          dump(){
            local title="$1"; shift
            local outfile="${OUT_DIR}/${title}.txt"
            echoe "[RUN] $*  -> ${outfile}"
            if "$@" >"${outfile}" 2>&1; then
              echoe "[OK] ${title}"
            else
              echoe "[WARN] ${title} (stderr captured)"
            fi
          }
          copy_file(){
            local path="$1"; local name="${2:-$(basename "$path")}"
            if [ -f "$path" ]; then
              echoe "[COPY] ${path} -> ${OUT_DIR}/${name}"
              cp -a "$path" "${OUT_DIR}/${name}"
            else
              echoe "[MISS] ${path}"
            fi
          }
          {
            echo "DATE: $(date -Is)"
            echo "HOSTNAMECTL:"
            (command -v hostnamectl >/dev/null && hostnamectl || uname -a) 2>&1
            echo; echo "OS RELEASE:"; (cat /etc/os-release 2>/dev/null || sw_vers 2>/dev/null || true)
          } | tee "${OUT_DIR}/00_system_overview.txt"

          for c in ip ifconfig route ss netstat arp iptables ip6tables nft ufw \
                   resolvectl systemd-resolve nmcli networksetup scutil \
                   ethtool lshw lspci iw iwconfig iwlist nslookup dig host curl wget \
                   netplan sysctl; do check_cmd "$c" || true; done

          if command -v ip >/dev/null; then
            dump "ip_addr"           ip addr
            dump "ip_link"           ip -d link
            dump "ip_neigh"          ip neigh
            dump "ip_route"          ip route show table all
            dump "ip_rule"           ip rule show
          else
            command -v ifconfig >/dev/null && dump "ifconfig" ifconfig || true
            command -v route    >/dev/null && dump "route"    route -n || true
          fi
          if command -v ss >/dev/null; then
            dump "ss_tcp_listen"   ss -tlnp
            dump "ss_udp_listen"   ss -ulnp
            dump "ss_summary"      ss -s
          elif command -v netstat >/dev/null; then
            dump "netstat_listen"  netstat -tulpn
            dump "netstat_routes"  netstat -rn
          fi
          command -v arp >/dev/null && dump "arp" arp -an || true
          copy_file "/etc/resolv.conf" "resolv.conf"
          copy_file "/etc/hosts"       "hosts"
          copy_file "/etc/nsswitch.conf" "nsswitch.conf"
          command -v resolvectl >/dev/null      && dump "resolvectl_status" resolvectl status || true
          command -v systemd-resolve >/dev/null && dump "systemd_resolve_status" systemd-resolve --status || true
          command -v ufw       >/dev/null && dump "ufw_status"       ufw status verbose || true
          command -v iptables  >/dev/null && dump "iptables_save"    sh -c 'iptables -S; iptables -L -v -n' || true
          command -v ip6tables >/dev/null && dump "ip6tables_save"   sh -c 'ip6tables -S; ip6tables -L -v -n' || true
          command -v nft       >/dev/null && dump "nft_ruleset"      nft list ruleset || true
          command -v firewall-cmd >/dev/null && dump "firewalld"     firewall-cmd --list-all || true
          dump "sysctl_net" sh -c 'sysctl -a 2>/dev/null | grep -E "^(net\.|fs\.ipv4|fs\.ipv6)" || true'
          command -v ethtool >/dev/null && { for nic in $(ls /sys/class/net 2>/dev/null | grep -v lo || true); do dump "ethtool_${nic}" ethtool "$nic"; done; }
          command -v lspci >/dev/null  && dump "lspci_net"  sh -c 'lspci -nn | grep -i -E "net|ether|wireless|wifi"'
          command -v lshw  >/dev/null  && dump "lshw_net"   sh -c 'lshw -class network -sanitize'
          command -v iw    >/dev/null  && dump "iw_link"    iw dev || true
          command -v iwconfig >/dev/null && dump "iwconfig" iwconfig || true
          command -v iwlist   >/dev/null && dump "iwlist_scan" sh -c 'iwlist scan 2>/dev/null || true'
          command -v nmcli >/dev/null && {
            dump "nmcli_general" nmcli general status
            dump "nmcli_dev"     nmcli device status
            dump "nmcli_conn"    nmcli -f NAME,UUID,TYPE,DEVICE connection show
            dump "nmcli_dns"     nmcli dev show
          }
          if [[ "$(uname -s)" == "Darwin" ]]; then
            command -v networksetup >/dev/null && dump "networksetup_all" sh -c 'networksetup -listallnetworkservices; for s in $(networksetup -listallnetworkservices | tail -n +2); do echo "=== $s ==="; networksetup -getinfo "$s"; done'
            command -v scutil        >/dev/null && dump "scutil_dns" scutil --dns
          fi
          [ -d /etc/netplan ] && { dump "netplan_render" sh -c 'ls -al /etc/netplan; echo; (cat /etc/netplan/*.yaml 2>/dev/null || true)'; }
          [ -f /etc/network/interfaces ] && cp -a /etc/network/interfaces "${OUT_DIR}/interfaces.legacy" || true
          dump "ping_default_gw" sh -c 'gw=$(ip route | awk "/default/ {print \$3; exit}"); [ -n "$gw" ] && (ping -c 2 -W 1 "$gw" || true) || echo "No default gateway"'
          for H in 1.1.1.1 8.8.8.8 google.com cloudflare-dns.com; do
            dump "nslookup_${H//./_}" sh -c "command -v nslookup >/dev/null && nslookup $H || echo nslookup-missing"
          done
          command -v dig  >/dev/null && dump "dig_resolver_test" sh -c 'dig +short @1.1.1.1 example.com; dig +short example.com' || true
          command -v host >/dev/null && dump "host_example" host example.com || true
          {
            echo "# NET ECHO INDEX ($(date -Is))"
            echo; echo "## Directories"
            printf "%s\n" "$ECHO_ROOT" "$OUT_DIR" "$BIN_DIR" "$LOG_DIR"
            echo; echo "## Files"
            find "$OUT_DIR" -type f | sed -e "s|^| - |"
          } > "${ECHO_ROOT}/INDEX.md"
          echoe "[ARCHIVE] build"
          tar -czf "${ARCHIVE}" -C "${ECHO_ROOT}" "out" 2>/dev/null || true
          echoe "[DONE] OUT=${OUT_DIR} ARCHIVE=${ARCHIVE}"
          SH
          chmod +x "${ECHO_ROOT}/gather_net_echo.sh"

      - name: "[ECHO] Run Bash collector"
        shell: bash
        env:
          OUT_DIR: ${{ env.ECHO_ROOT }}/out
          BIN_DIR: ${{ env.ECHO_ROOT }}/bin
          LOG_DIR: ${{ env.ECHO_ROOT }}/logs
          ARCHIVE: ${{ env.ECHO_ROOT }}/${{ github.event.inputs.archive_name || '' }}
        run: |
          set -Eeuo pipefail
          echo "[ECHO] Execute collector"
          if [ -n "${ARCHIVE}" ]; then
            echo "[ECHO] ARCHIVE preset = ${ARCHIVE}"
          else
            export ARCHIVE="${ECHO_ROOT}/net_echo_$(date +%Y%m%d_%H%M%S).tar.gz"
            echo "[ECHO] ARCHIVE auto = ${ARCHIVE}"
          fi
          "${ECHO_ROOT}/gather_net_echo.sh"
          echo "[ECHO] Done; list files"
          find "${ECHO_ROOT}" -maxdepth 2 -type f -printf "%p\n" 2>/dev/null || find "${ECHO_ROOT}" -maxdepth 2 -type f

      - name: "[ECHO] Upload artifact (Unix)"
        uses: actions/upload-artifact@v4
        with:
          name: net-echo-${{ matrix.os }}
          path: |
            ${{ env.ECHO_ROOT }}/out/**
            ${{ env.ECHO_ROOT }}/*.tar.gz
            ${{ env.ECHO_ROOT }}/INDEX.md
          if-no-files-found: warn
          retention-days: 14

      - name: "[ECHO] Optional commit to repo"
        if: ${{ (github.event.inputs.commit_changes == 'true') && env.GH_ADMIN_TOKEN != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO] Commit into repo under site/net-echo/${{ matrix.os }}/"
          DEST="site/net-echo/${{ matrix.os }}"
          mkdir -p "$DEST"
          cp -a "${ECHO_ROOT}/out" "$DEST/out"
          cp -a "${ECHO_ROOT}/INDEX.md" "$DEST/INDEX.md"
          cp -a "${ECHO_ROOT}"/*.tar.gz "$DEST/" 2>/dev/null || true
          git config user.name "net-echo-bot"
          git config user.email "net-echo@users.noreply.github.com"
          git add "$DEST"
          git commit -m "[net-echo] ${{ matrix.os }} snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ) [echo]" || { echo "[ECHO] Nothing to commit"; exit 0; }
          git -c http.extraheader="AUTHORIZATION: bearer $GH_ADMIN_TOKEN" push origin "${GITHUB_REF_NAME:-main}" || git push

      - name: "[ECHO] Optional copy to Pages worktree"
        if: ${{ github.event.inputs.pages_deploy == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO] Copy to site/net-echo/${{ matrix.os }}/ (for Pages publishing by your existing workflow)"
          DEST="site/net-echo/${{ matrix.os }}"
          mkdir -p "$DEST"
          cp -a "${ECHO_ROOT}/out" "$DEST/out"
          cp -a "${ECHO_ROOT}/INDEX.md" "$DEST/INDEX.md"
          cp -a "${ECHO_ROOT}"/*.tar.gz "$DEST/" 2>/dev/null || true
          ls -al "$DEST" || true

  net-echo-windows:
    name: "Windows — Echo"
    runs-on: windows-latest
    steps:
      - name: "[ECHO] Checkout"
        uses: actions/checkout@v4

      - name: "[ECHO] Prepare dirs"
        shell: pwsh
        run: |
          $env:ECHO_ROOT = "${{ env.ECHO_ROOT }}"
          New-Item -ItemType Directory -Force -Path "$env:ECHO_ROOT\out","$env:ECHO_ROOT\logs" | Out-Null
          Write-Host "[ECHO] ECHO_ROOT=$env:ECHO_ROOT"

      - name: "[ECHO] Write PowerShell collector"
        shell: pwsh
        run: |
          $path = "${{ env.ECHO_ROOT }}\Gather-NetEcho.ps1"
          @'
          $ErrorActionPreference = "Stop"
          $ECHO_ROOT = ${env:ECHO_ROOT}; if (-not $ECHO_ROOT) { $ECHO_ROOT = ".\net_echo" }
          $OUT_DIR   = Join-Path $ECHO_ROOT "out"
          $LOG_DIR   = Join-Path $ECHO_ROOT "logs"
          New-Item -ItemType Directory -Force -Path $OUT_DIR,$LOG_DIR | Out-Null
          function Echoe([string]$msg){ Write-Host ("[ECHO][" + (Get-Date).ToString("HH:mm:ss") + "] " + $msg) }
          function Dump($name, $script){
            $out = Join-Path $OUT_DIR ($name + ".txt")
            Echoe "[RUN] $name -> $out"
            try { & $script | Out-File -FilePath $out -Encoding UTF8 -Width 300 }
            catch { Echoe "[WARN] $name failed: $($_.Exception.Message)" }
          }
          Dump "systeminfo"   { systeminfo }
          Dump "ipconfig_all" { ipconfig /all }
          Dump "route_print"  { route print }
          Dump "arp_a"        { arp -a }
          Dump "netstat_anb"  { netstat -anb }
          Dump "dns_cache"    { ipconfig /displaydns }
          Dump "Get-NetIPConfiguration" { Get-NetIPConfiguration | Format-List * }
          Dump "Get-NetAdapter"         { Get-NetAdapter | Format-List * }
          Dump "Get-NetRoute"           { Get-NetRoute | Sort-Object -Property DestinationPrefix | Format-Table -AutoSize }
          Dump "Get-DnsClientServerAddress" { Get-DnsClientServerAddress | Format-List * }
          Dump "Get-NetFirewallProfile" { Get-NetFirewallProfile | Format-List * }
          Dump "Get-NetFirewallRule"    { Get-NetFirewallRule | Select-Object -First 200 | Format-List * }
          "# NET ECHO INDEX " + (Get-Date).ToString("s") | Out-File (Join-Path $ECHO_ROOT "INDEX.txt")
          Get-ChildItem -Recurse -File $OUT_DIR | ForEach-Object { " - " + $_.FullName } | Out-File -Append (Join-Path $ECHO_ROOT "INDEX.txt")
          $archive = Join-Path $ECHO_ROOT ("net_echo_" + (Get-Date -Format "yyyyMMdd_HHmmss") + ".zip")
          Compress-Archive -Path $OUT_DIR -DestinationPath $archive -Force
          Echoe "[DONE] Out=$OUT_DIR  Archive=$archive"
          '@ | Out-File -FilePath $path -Encoding UTF8
          Write-Host "[ECHO] Wrote $path"

      - name: "[ECHO] Run PowerShell collector"
        shell: pwsh
        run: |
          & "${{ env.ECHO_ROOT }}\Gather-NetEcho.ps1"

      - name: "[ECHO] Upload artifact (Windows)"
        uses: actions/upload-artifact@v4
        with:
          name: net-echo-windows
          path: |
            ${{ env.ECHO_ROOT }}\out\**
            ${{ env.ECHO_ROOT }}\INDEX.txt
            ${{ env.ECHO_ROOT }}\*.zip
          if-no-files-found: warn
          retention-days: 14

      - name: "[ECHO] Optional commit to repo"
        if: ${{ (github.event.inputs.commit_changes == 'true') && env.GH_ADMIN_TOKEN != '' }}
        shell: pwsh
        run: |
          $dest = "site/net-echo/windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force "${{ env.ECHO_ROOT }}\out" "$dest\out"
          Copy-Item -Recurse -Force "${{ env.ECHO_ROOT }}\INDEX.txt" "$dest\INDEX.txt"
          Get-ChildItem "${{ env.ECHO_ROOT }}\*.zip" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName "$dest\" }
          git config user.name "net-echo-bot"
          git config user.email "net-echo@users.noreply.github.com"
          git add $dest
          git commit -m "[net-echo] windows snapshot: $(Get-Date -Format s) [echo]" 2>$null
          git -c "http.extraheader=AUTHORIZATION: bearer $env:GH_ADMIN_TOKEN" push origin "${env:GITHUB_REF_NAME}"
