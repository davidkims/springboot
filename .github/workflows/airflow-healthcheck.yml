# .github/workflows/airflow-healthcheck.yml

name: 📅 Airflow Healthcheck DAG Setup & Test

on:
  workflow_dispatch:

jobs:
  setup-airflow:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Create required directories
        run: |
          sudo mkdir -p /opt/logistics/airflow/dags
          sudo mkdir -p /opt/logistics/airflow/test_logs
          sudo chmod -R 777 /opt/logistics

      - name: 🌀 Install Apache Airflow and Providers
        run: |
          pip install apache-airflow==2.8.1 apache-airflow-providers-docker apache-airflow-providers-postgres apache-airflow-providers-smtp
          airflow db init

      - name: 🌬️ Add Airflow Healthcheck DAG
        run: |
          echo "[DAG] Creating airflow_healthcheck_dag.py via echo"
          mkdir -p /opt/logistics/airflow/dags
          DAG_PATH="/opt/logistics/airflow/dags/airflow_healthcheck_dag.py"
          echo "from airflow import DAG" > $DAG_PATH
          echo "from airflow.operators.bash import BashOperator" >> $DAG_PATH
          echo "from datetime import datetime" >> $DAG_PATH
          echo "" >> $DAG_PATH
          echo "default_args = {" >> $DAG_PATH
          echo "    'start_date': datetime(2025, 1, 1)" >> $DAG_PATH
          echo "}" >> $DAG_PATH
          echo "" >> $DAG_PATH
          echo "with DAG(" >> $DAG_PATH
          echo "    'airflow_healthcheck_dag'," >> $DAG_PATH
          echo "    default_args=default_args," >> $DAG_PATH
          echo "    schedule_interval='@daily'," >> $DAG_PATH
          echo "    catchup=False" >> $DAG_PATH
          echo ") as dag:" >> $DAG_PATH
          echo "    health_check = BashOperator(" >> $DAG_PATH
          echo "        task_id='check_airflow_webserver'," >> $DAG_PATH
          echo "        bash_command='curl -sf http://localhost:8080/health || exit 1'" >> $DAG_PATH
          echo "    )" >> $DAG_PATH
          echo "[✔] airflow_healthcheck_dag.py created successfully"
          echo "DAG created at: $(date)" > /opt/logistics/airflow/test_logs/airflow_healthcheck_dag_create.log
          cat $DAG_PATH >> /opt/logistics/airflow/test_logs/airflow_healthcheck_dag_create.log

      - name: ▶️ Test Airflow DAG execution
        run: |
          echo "[TEST] Testing Airflow DAG airflow_healthcheck_dag"
          airflow dags list > /opt/logistics/airflow/test_logs/airflow_dags_list.log || echo "[❌] DAG list failed"
          airflow dags test airflow_healthcheck_dag 2025-01-01 > /opt/logistics/airflow/test_logs/airflow_healthcheck_dag_test.log || echo "[❌] DAG test failed"

      - name: 🔐 Install Scorecard and Run Security Check
        run: |
          echo "[SECURITY] Installing Scorecard"
          SCORECARD_VERSION="v4.10.3"
          wget https://github.com/ossf/scorecard/releases/download/$SCORECARD_VERSION/scorecard-linux-amd64 -O scorecard
          chmod +x scorecard
          mkdir -p /opt/logistics/scorecard
          mv scorecard /opt/logistics/scorecard/
          echo "[SECURITY] Running Scorecard on DAGs"
          /opt/logistics/scorecard/scorecard --repo=. --local --checks Vulnerabilities --format=json --show-details > /opt/logistics/scorecard/scorecard.result.json

      - name: 📦 Upload Logs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airflow-healthcheck-logs
          path: /opt/logistics/airflow/test_logs/
