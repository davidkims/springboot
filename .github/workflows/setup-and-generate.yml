name: 🏗️ Setup & Generate Stress Ledger with Full Features

on:
  workflow_dispatch:

jobs:
  setup-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Create .github directory structure
        run: |
          echo "[+] Creating required directories..."
          mkdir -p .github/db .github/scripts backup

      - name: 📜 Generate init_stress_loans.sql
        run: |
          echo "[+] Generating init_stress_loans.sql..."
          echo "CREATE TABLE IF NOT EXISTS stress_loans (" > .github/db/init_stress_loans.sql
          echo "  loan_id SERIAL PRIMARY KEY," >> .github/db/init_stress_loans.sql
          echo "  customer_name VARCHAR(100)," >> .github/db/init_stress_loans.sql
          echo "  loan_amount DECIMAL(10,2)," >> .github/db/init_stress_loans.sql
          echo "  loan_date DATE DEFAULT CURRENT_DATE" >> .github/db/init_stress_loans.sql
          echo ");" >> .github/db/init_stress_loans.sql
          cat .github/db/init_stress_loans.sql

      - name: 🐘 Install PostgreSQL CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: 🧪 Install Scorecard CLI
        run: |
          curl -sLO https://github.com/ossf/scorecard/releases/latest/download/scorecard-linux-amd64
          chmod +x scorecard-linux-amd64
          sudo mv scorecard-linux-amd64 /usr/local/bin/scorecard
          scorecard --version || echo "Scorecard CLI installed"

      - name: 🐳 Install Docker
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo systemctl start docker
          docker --version

      - name: 🐘 Start PostgreSQL container
        run: |
          docker rm -f stress-pg || true
          docker run -d \
            --name stress-pg \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres123 \
            -e POSTGRES_DB=stressdb \
            -p 5432:5432 \
            postgres:14
          sleep 10

      - name: 🐍 Create requirements.txt & install Python packages
        run: |
          echo "faker" > requirements.txt
          pip install -r requirements.txt

      - name: 🐍 Generate stress_ledger_generator.py
        run: |
          echo "import csv, random" > .github/scripts/stress_ledger_generator.py
          echo "from faker import Faker" >> .github/scripts/stress_ledger_generator.py
          echo "fake = Faker()" >> .github/scripts/stress_ledger_generator.py
          echo "output_file = \".github/db/stress_loans.csv\"" >> .github/scripts/stress_ledger_generator.py
          echo "with open(output_file, 'w', newline='') as f:" >> .github/scripts/stress_ledger_generator.py
          echo "    writer = csv.writer(f)" >> .github/scripts/stress_ledger_generator.py
          echo "    writer.writerow([\"customer_name\", \"loan_amount\", \"loan_date\"])" >> .github/scripts/stress_ledger_generator.py
          echo "    for _ in range(10000):" >> .github/scripts/stress_ledger_generator.py
          echo "        writer.writerow([" >> .github/scripts/stress_ledger_generator.py
          echo "            fake.name()," >> .github/scripts/stress_ledger_generator.py
          echo "            round(random.uniform(1000.0, 50000.0), 2)," >> .github/scripts/stress_ledger_generator.py
          echo "            fake.date_between(start_date='-2y', end_date='today')" >> .github/scripts/stress_ledger_generator.py
          echo "        ])" >> .github/scripts/stress_ledger_generator.py

      - name: 🧪 Run ledger generator
        run: |
          python3 .github/scripts/stress_ledger_generator.py
          head -n 5 .github/db/stress_loans.csv

      - name: 🗃️ Load CSV into PostgreSQL
        run: |
          docker cp .github/db/init_stress_loans.sql stress-pg:/init.sql
          docker exec -u postgres stress-pg psql -d stressdb -f /init.sql
          docker cp .github/db/stress_loans.csv stress-pg:/stress_loans.csv
          docker exec -u postgres stress-pg psql -d stressdb -c "\COPY stress_loans(customer_name, loan_amount, loan_date) FROM '/stress_loans.csv' DELIMITER ',' CSV HEADER;"

      - name: 🔄 Simulate additional loan rows
        run: |
          docker exec -u postgres stress-pg psql -d stressdb -c "
            INSERT INTO stress_loans (customer_name, loan_amount, loan_date)
            SELECT 
              'SimUser_' || g,
              ROUND(CAST(random() * 100000 + 1000 AS numeric), 2),
              CURRENT_DATE
            FROM generate_series(1, 1000) g;"

      - name: 💳 Create and populate transactions table
        run: |
          echo "CREATE TABLE IF NOT EXISTS transactions (" > transactions.sql
          echo "  transaction_id SERIAL PRIMARY KEY," >> transactions.sql
          echo "  loan_id INTEGER REFERENCES stress_loans(loan_id)," >> transactions.sql
          echo "  transaction_amount DECIMAL(10,2)," >> transactions.sql
          echo "  transaction_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP" >> transactions.sql
          echo ");" >> transactions.sql
          docker cp transactions.sql stress-pg:/transactions.sql
          docker exec -u postgres stress-pg psql -d stressdb -f /transactions.sql
          docker exec -u postgres stress-pg psql -d stressdb -c "
            INSERT INTO transactions (loan_id, transaction_amount)
            SELECT loan_id,
                   ROUND((loan_amount * (random() * 0.5 + 0.1))::numeric, 2)
            FROM stress_loans, generate_series(1, 2)
            WHERE loan_id % 5 = generate_series;"

      - name: 📈 Show loan summary
        run: |
          echo "SELECT" > query.sql
          echo "  COUNT(*) AS total_loans," >> query.sql
          echo "  ROUND(SUM(loan_amount), 2) AS total_amount" >> query.sql
          echo "FROM stress_loans;" >> query.sql
          docker cp query.sql stress-pg:/query.sql
          docker exec -u postgres stress-pg psql -d stressdb -f /query.sql

      - name: 💾 Backup PostgreSQL DB with pg_dump
        run: |
          docker exec -u postgres stress-pg pg_dump stressdb > backup/stress_backup.sql
          echo "[✔] Backup stored in backup/stress_backup.sql"
          head -n 10 backup/stress_backup.sql
