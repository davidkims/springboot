name: Multi-Server Netstat Reporter (Final Version)

on:
  schedule:
    - cron: '0 0 * * *' # 매일 UTC 00:00 (KST 09:00) 실행
  workflow_dispatch:

jobs:
  check_and_report_netstat:
    runs-on: ubuntu-latest
    
    # 환경 변수 설정
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          # 1. SSH 키가 PEM 형식이 아닐 경우를 대비해 임시 파일을 만들고 키를 저장
          echo "${{ env.SSH_PRIVATE_KEY }}" | tr -d '\r' > ssh_key.pem
          
          # 2. 키 파일의 권한 설정
          chmod 600 ssh_key.pem

          # 3. 키가 유효한지 확인하고 PEM 형식으로 변환 (필요 시)
          # 이 단계는 appleboy/ssh-action의 요구사항을 충족시키기 위함
          # 대부분의 경우 SSH_PRIVATE_KEY는 PEM 형식이어야 함
          ssh-keygen -y -f ssh_key.pem > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "SSH key is not in PEM format. Attempting conversion..."
            # OpenSSH 키 형식을 PEM으로 변환 (ssh-keygen -p -f <key_file> -m pem)
            # 이 기능은 일부 환경에서만 작동하며, GitHub Actions 환경에서는 복잡할 수 있음.
            # 가장 확실한 방법은 Secrets에 등록할 때부터 PEM 형식으로 올리는 것.
            # 이 예시는 단순화된 로직입니다.
          else
            echo "SSH key is in PEM format."
          fi

      - name: Connect to server and run netstat
        id: netstat_data_step
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            echo "# 서버 네트워크 상태 보고서"
            echo ""
            echo "## $(hostname) 서버"
            echo ""
            echo "### 1. LISTEN 상태 포트"
            echo "```bash"
            netstat -lntp
            echo "```"
            echo ""
            echo "### 2. TCP 연결 상태별 통계"
            echo "```bash"
            netstat -ant | awk '{print $6}' | sort | uniq -c | sort -nr
            echo "```"
            echo ""
            echo "### 3. 주요 포트 점검 (80, 443)"
            echo "---"
            
            PORT_TO_CHECK="80 443"
            for PORT in $PORT_TO_CHECK; do
              if netstat -lnt | grep -q ":$PORT\s*LISTEN"; then
                echo "✅ Port $PORT is listening."
              else
                echo "❌ Port $PORT is NOT listening."
              fi
            done
            
            echo ""
            echo "---"
            echo "점검 시간: $(date '+%Y-%m-%d %H:%M:%S')"
      
      - name: Create GitHub Issue report
        if: always() # SSH 연결 실패 시에도 이슈 생성 (에러 보고)
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: 'Netstat Report - Server Status (${{ github.ref_name }})'
          content: ${{ steps.netstat_data_step.outputs.stdout }}
          token: ${{ secrets.GITHUB_TOKEN }}
          assignees: your-github-username
