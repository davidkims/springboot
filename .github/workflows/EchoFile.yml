name: "CodeQL Advanced + Echo + Service Setup + Permission Snapshot"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '19 13 * * 4'
  workflow_dispatch:

jobs:
  codeql-analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧰 Install System Services & CLI Tools
        run: |
          echo "echo '[Install] 필수 패키지 설치'" | tee -a /tmp/echo_codeql_install.log
          sudo apt-get update -y
          sudo apt-get install -y git curl jq tree build-essential python3-pip lsof sudo ssh

          echo "echo '[Install] Rust 설치'" | tee -a /tmp/echo_codeql_install.log
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: 📁 Create Echo Directories, Permission Snapshots, and Files
        run: |
          # 에코 디렉토리 생성
          for d in .github/echo_codeql/{init,logs,results,queries,python,rust,actions,db/{mysql,postgresql,oracle,mongodb,tibero},permission}; do
            mkdir -p "$d"
          done
          touch .github/echo_codeql/init/init_dirs.sh
          touch .github/echo_codeql/logs/init.log

          # 권한 스냅샷 저장
          echo "echo '[Permission] Snapshot'" | tee -a .github/echo_codeql/init/init_dirs.sh
          cat /etc/passwd > .github/echo_codeql/permission/passwd.txt
          sudo cat /etc/sudoers > .github/echo_codeql/permission/sudoers.txt
          sudo ls -l /etc/ssh/sshd_config > .github/echo_codeql/permission/sshd_config.txt
          getent group sudo > .github/echo_codeql/permission/sudo_group.txt
          sudo -l > .github/echo_codeql/permission/sudo_l.txt

          # 샘플 echo 파일 생성
          echo "print('Hello from Python')" > .github/echo_codeql/python/sample.py
          echo "echo 'print(\"Hello from Python\")'" > .github/echo_codeql/python/echo_python.sh

          echo 'fn main() { println!("Hello from Rust"); }' > .github/echo_codeql/rust/sample.rs
          echo "echo 'fn main() { println!(\"Hello from Rust\"); }'" > .github/echo_codeql/rust/echo_rust.sh

          echo 'name: HelloAction' > .github/echo_codeql/actions/action.yml
          echo "echo 'name: HelloAction'" > .github/echo_codeql/actions/echo_action.sh

          echo "-- Sample SQL for MySQL" > .github/echo_codeql/db/mysql/sample.sql
          echo "echo '-- Sample SQL for MySQL'" > .github/echo_codeql/db/mysql/echo_mysql.sh

          echo "-- Sample SQL for PostgreSQL" > .github/echo_codeql/db/postgresql/sample.sql
          echo "echo '-- Sample SQL for PostgreSQL'" > .github/echo_codeql/db/postgresql/echo_postgresql.sh

          echo "-- Sample SQL for Oracle" > .github/echo_codeql/db/oracle/sample.sql
          echo "echo '-- Sample SQL for Oracle'" > .github/echo_codeql/db/oracle/echo_oracle.sh

          echo "-- Sample SQL for MongoDB" > .github/echo_codeql/db/mongodb/sample.js
          echo "echo '-- Sample SQL for MongoDB'" > .github/echo_codeql/db/mongodb/echo_mongodb.sh

          echo "-- Sample SQL for Tibero" > .github/echo_codeql/db/tibero/sample.sql
          echo "echo '-- Sample SQL for Tibero'" > .github/echo_codeql/db/tibero/echo_tibero.sh

          echo "echo '[✅ SUCCESS] All echo, SQL, permission files created.'" | tee -a .github/echo_codeql/logs/init.log

      - name: 🛠️ Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: ⚙️ Manual Build Placeholder
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo '[Manual Build] Please add custom build logic here.'
          exit 1

      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

      - name: 📤 Upload Echo Directories and Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-codeql-full-${{ matrix.language }}
          path: .github/echo_codeql/
