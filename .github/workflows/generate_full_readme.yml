name: 📓 포트폴리오 + 워크플로 통계로 README & SECURITY 업데이트

on:
  push:
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '*/5 * * * *'  # 5분마다 실행
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update_docs:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_LATENCY_MS: 1000

    steps:
      - name: Cache apt packages
        uses: actions/cache@v3
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-packages

      - name: Cache Prometheus binary
        uses: actions/cache@v3
        with:
          path: prometheus-2.53.5.linux-amd64.tar.gz
          key: prometheus-v2.53.5

      - name: 📅 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Install System Packages & Tools
        run: |
          echo "[🔧] apt-get update 중..."
          sudo apt-get update -y
          echo "[🔧] apt-get dist-upgrade 중..."
          sudo apt-get dist-upgrade -y
          echo "[🔧] gh, jq, parallel 설치 중..."
          sudo apt-get install -y gh jq parallel
          echo "[🔧] parallel만 업그레이드 중..."
          sudo apt-get install --only-upgrade -y parallel
          echo "[🔧] gh 버전 확인 중..."
          gh --version
          echo "[🔧] jq 버전 확인 중..."
          jq --version
          echo "[🔧] parallel 버전 확인 중..."
          parallel --version

      - name: Docker Pull Prometheus
        run: |
          echo "[🚀] Docker에서 Prometheus v2.53.5 이미지 pull 중..."
          docker pull prom/prometheus:v2.53.5
          echo "[✅] Prometheus Docker 이미지 준비 완료"
          echo "[📂] prometheus_data 디렉토리 생성 중..."
          mkdir -p prometheus_data
          echo "[✅] prometheus_data 디렉토리 생성 완료"

      - name: Ensure .tmp Directory
        run: |
          echo "[📁] .tmp 디렉토리 생성 확인"
          mkdir -p .tmp

      - name: 📈 REST 기반 워크플로우 통계 수집
        run: |
          echo "[📈] repo workflows 목록 REST 호출 중..."
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          # workflows 목록 가져오기
          gh api repos/${OWNER}/${REPO}/actions/workflows --jq '.workflows[] | "\(.id)||\(.name)"' > .tmp/workflow_list.txt

          # 결과 헤더
          {
            echo "## ⚙️ GitHub Actions 워크플로우 목록 및 통계"
            echo ""
            echo "| 워크플로우 이름 | 실행 수 | 성공 수 | 실패 수 | 성공률 |"
            echo "|----------------|--------:|--------:|--------:|--------:|"
          } > .tmp/workflows.md.body

          # 각 workflow 통계 계산
          while IFS="||" read -r ID NAME; do
            echo "[📈] '$NAME' 워크플로우 runs 조회 중..."
            RUNS_JSON=$(gh api repos/${OWNER}/${REPO}/actions/workflows/${ID}/runs?per_page=30)
            TOTAL=$(echo "${RUNS_JSON}" | jq '.workflow_runs | length')
            SUCCESS=$(echo "${RUNS_JSON}" | jq '[.workflow_runs[] | select(.conclusion=="success")] | length')
            FAILURE=$((TOTAL - SUCCESS))
            if [ "$TOTAL" -gt 0 ]; then
              RATE=$(awk "BEGIN {printf \"%.1f\", (${SUCCESS}/${TOTAL})*100}")
            else
              RATE="N/A"
            fi
            echo "| ${NAME} | ${TOTAL} | ${SUCCESS} | ${FAILURE} | ${RATE}% |"
          done >> .tmp/workflows.md.body

          # 완성본 이동
          mv .tmp/workflows.md.body .tmp/workflows.md
          echo "[✅] .tmp/workflows.md 생성 완료"
          cat .tmp/workflows.md

      - name: Copy statistics to prometheus_data
        run: |
          echo "[📂] .tmp/workflows.md를 prometheus_data/로 복사 중..."
          cp .tmp/workflows.md prometheus_data/workflows.md
          echo "[✅] prometheus_data에 통계 저장 완료"

      - name: 📦 Upload Prometheus metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-metrics-data
          path: prometheus_data/

      - name: 📄 Generate README.md
        run: |
          echo "[📄] README.md 생성 시작"
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S KST')
          echo "[⏰] 타임스탬프: $TIMESTAMP"
          echo "[🔗] Repository: ${{ github.repository }}"
          echo "[🌿] Branch: ${{ github.ref_name }}"
          {
            echo "# 👨‍💻 김병권 포토포리오"
            echo ""
            for f in .github/workflows/*.yml; do
              BADGE_NAME=$(basename "$f")
              echo "[![${BADGE_NAME}](https://github.com/${{ github.repository }}/actions/workflows/${BADGE_NAME}/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/${BADGE_NAME})"
            done
            echo ""
            echo "자동으로 관리되는 프로젝트입니다. 매 5분마다 업데이트됩니다."
            echo ""
            echo "## 🤖 디바이저 소개"
            echo "- 이름: 김병권"
            echo "- 이메일1: byungkwonkim95@gmail.com"
            echo "- 이메일2: kwonny1302@gmail.com"
            echo "- 전문 범위: 백업, GitHub Actions 자동화, DevOps"
            echo "- 스택: Python, Java, Spring Boot, Docker, PostgreSQL, MySQL"
            echo "- 자기개발 메시지: https://www.youtube.com/watch?v=G8lvQRALa6s"
            echo ""
            echo "## 📅 마지막 업데이트"
            echo "- $TIMESTAMP"
            echo ""
            echo "## ✅ 현재 브랜치"
            echo "- ${{ github.ref_name }}"
            echo ""
            echo "## 🔧 빌드 방식 배지"
            echo "![Build](https://github.com/${{ github.repository }}/actions/workflows/generate_full_readme.yml/badge.svg)"
            echo ""
            cat .tmp/workflows.md
          } > README.md
          echo "[✅] README.md 생성 완료"

      - name: 🛡️ Generate SECURITY.md
        run: |
          echo "[🛡️] SECURITY.md 생성 시작"
          echo "[🔧] 기본 헤더 작성" > SECURITY.md
          echo "[🔧] Supported Versions 표 작성" >> SECURITY.md
          echo "| Version | Supported          |" >> SECURITY.md
          echo "| ------- | ------------------ |" >> SECURITY.md
          echo "| 5.1.x   | :white_check_mark: |" >> SECURITY.md
          echo "| 5.0.x   | :x:                |" >> SECURITY.md
          echo "| 4.0.x   | :white_check_mark: |" >> SECURITY.md
          echo "| < 4.0   | :x:                |" >> SECURITY.md
          echo "" >> SECURITY.md
          echo "[🔧] Reporting a Vulnerability 섹션 추가" >> SECURITY.md
          echo "## Reporting a Vulnerability" >> SECURITY.md
          echo "Use this section to tell people how to report a vulnerability." >> SECURITY.md
          echo "Tell them where to go, how often they can expect updates, and what to expect if it’s accepted or declined." >> SECURITY.md
          echo "" >> SECURITY.md
          echo "[🔧] Workflow Validation Checklist 추가" >> SECURITY.md
          echo "## Workflow Validation Checklist" >> SECURITY.md
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            base=$(basename "$f")
            echo "[🗒️] Adding checks for $base"
            echo "- [ ] $base: YAML syntax validation"         >> SECURITY.md
            echo "- [ ] $base: Permissions review"             >> SECURITY.md
            echo "- [ ] $base: Secret detection scan"           >> SECURITY.md
            echo "- [ ] $base: Dependency scanning enabled"     >> SECURITY.md
            echo "- [ ] $base: Container scanning enabled"      >> SECURITY.md
          done
          echo "[✅] SECURITY.md 업데이트 완료"

      - name: 🔁 Commit / Push or PR
        run: |
          echo "[🔁] 변경사항 확인 및 Git 설정"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "[🔍] README.md 및 SECURITY.md diff 확인"
          if git diff --exit-code --quiet README.md SECURITY.md; then
            echo "[⏭️] 변경사항 없음"
            exit 0
          fi
          echo "[✅] 변경사항 감지됨"
          echo "[📦] Stash 및 Pull 준비"
          git stash --include-untracked
          git pull --rebase origin main || echo "[⚠️] rebase 실패"
          git stash pop || echo "[⚠️] stash pop 실패"
          echo "[📝] 파일 추가 및 커밋"
          git add README.md SECURITY.md
          git commit -m "문서: README & SECURITY 업데이트 [skip ci]"
          echo "[🚀] Push 또는 PR 생성"
          if git push origin HEAD:main; then
            echo "[🚀] 정상 Push 완료"
          else
            echo "[⚠️] 직접 Push 권한 없음 — PR 생성 시도"
            BRANCH="update-docs-$(date +%s)"
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
            gh pr create \
              --title "문서: README & SECURITY 업데이트" \
              --body "자동 생성된 PR입니다." \
              --base main \
              --label documentation,auto-generated \
              || echo "[⚠️] 라벨 생성 실패"
            echo "[📦] PR 생성 완료"
          fi
