name: 🧹 최대 용량 항목 무한 삭제 (보호 디렉토리 제외)

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  delete-largest:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 echo_logs 디렉토리 생성
        run: |
          mkdir -p .github/echo_logs
          echo "[INIT] .github/echo_logs 디렉토리 생성 완료"

      - name: 📦 가장 큰 항목 탐색 (보호 항목 제외)
        id: largest
        run: |
          echo "[INFO] 디렉토리 용량 상위:"
          du -ah . 2>/dev/null | sort -hr | head -n 20 | tee .github/echo_logs/largest_list.txt

          # 보호 대상 제외
          LARGEST=$(du -ah . 2>/dev/null | sort -hr | awk '!($2 ~ /^\.($|\/|git|github|\/README\.md|\/echo_logs)/)' | head -n 1 | cut -f2-)

          if [ -z "$LARGEST" ]; then
            echo "::error ::[ERROR] 삭제할 유효한 대상이 없습니다."
            exit 1
          fi

          echo "[SELECTED] 삭제 대상: $LARGEST"
          echo "largest=$LARGEST" >> $GITHUB_OUTPUT

      - name: 🔁 삭제 반복 시도 (최대 50회)
        run: |
          set -e
          TARGET="${{ steps.largest.outputs.largest }}"
          COUNT=0
          MAX_TRIES=50

          echo "[START] 삭제 대상: $TARGET"

          while [ -e "$TARGET" ]; do
            echo "[TRY #$COUNT] $TARGET 삭제 시도"
            rm -rf "$TARGET" || echo "[WARN] 삭제 실패: $TARGET"
            sleep 2

            if [ -e "$TARGET" ]; then
              echo "[STILL EXISTS] $TARGET 아직 존재함. 재시도."
            else
              echo "[SUCCESS] $TARGET 삭제 완료 ✅"
              break
            fi

            COUNT=$((COUNT+1))
            if [ $COUNT -ge $MAX_TRIES ]; then
              echo "::error ::[FAIL] 삭제 50회 초과: $TARGET 삭제 실패"
              exit 1
            fi
          done

      - name: 📜 삭제 요약 리포트 저장
        run: |
          echo "🧹 삭제된 항목: ${{ steps.largest.outputs.largest }}" > .github/echo_logs/deleted_report.txt
          ls -lh . >> .github/echo_logs/deleted_report.txt
          cat .github/echo_logs/deleted_report.txt

      - name: 📤 삭제 리포트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: deleted-largest-report
          path: .github/echo_logs/deleted_report.txt

      - name: 💬 PR 코멘트 자동 생성
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('.github/echo_logs/deleted_report.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🧹 가장 큰 항목 삭제 완료:\n\n\`\`\`\n${report}\n\`\`\``
            });
