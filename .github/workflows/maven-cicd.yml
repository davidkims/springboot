name: "⚙️ Spring Boot + Maven FullOps (DB + Echo + SBOM + Release + C/C Pack)"

on:
  schedule:
    - cron: "*/5 * * * *" # 5분마다 실행 (C/C Pack 생성 포함)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: demo
          MYSQL_USER: demo
          MYSQL_PASSWORD: demopass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK + Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scaffold application.yml (MySQL for local/production)
        run: |
          set -Eeuo pipefail
          mkdir -p src/main/resources
          if [ ! -f "src/main/resources/application.yml" ]; then
            cat > src/main/resources/application.yml <<'YML'
            spring:
              datasource:
                url: jdbc:mysql://localhost:3306/demo
                username: demo
                password: demopass
                driver-class-name: com.mysql.cj.jdbc.Driver
              jpa:
                hibernate:
                  ddl-auto: update
                show-sql: true
            YML
            echo "[ECHO] application.yml created with MySQL config."
          fi

      - name: Scaffold application-test.yml (H2 fallback for CI)
        run: |
          set -Eeuo pipefail
          mkdir -p src/test/resources
          cat > src/test/resources/application-test.yml <<'YML'
          spring:
            datasource:
              url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
              driver-class-name: org.h2.Driver
              username: sa
              password:
            jpa:
              hibernate:
                ddl-auto: update
              database-platform: org.hibernate.dialect.H2Dialect
          YML
          echo "[ECHO] application-test.yml created with H2 (CI fallback)."

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Run Unit Tests (H2 profile)
        run: mvn test -Dspring.profiles.active=test

      - name: Run Integration Tests (MySQL profile)
        run: |
          echo "[ECHO] Running integration tests with MySQL service..."
          mvn verify -Dspring.profiles.active=default

      - name: Generate SBOM + License + Hash + Signature
        run: |
          set -Eeuo pipefail
          mkdir -p .github/echo_storage/out
          echo "[ECHO] Generating CycloneDX SBOM..."
          mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
          sha256sum target/*.jar > .github/echo_storage/out/checksums.txt
          gpg --batch --yes --armor --detach-sign target/*.jar || echo "[ECHO][WARN] GPG not configured"
          echo "[ECHO] SBOM + License + Hash + Signature created."

      - name: Generate Enterprise C/C Pack (5min cycle)
        run: |
          set -Eeuo pipefail
          mkdir -p .github/echo_storage/cc_pack
          timestamp=$(date +%Y%m%d%H%M%S)
          echo "[ECHO] Generating C/C Pack for enterprise compliance..."
          echo "C/C ENTERPRISE FILE - $timestamp" > .github/echo_storage/cc_pack/cc_${timestamp}.c
          echo "C/C ENTERPRISE HEADER - $timestamp" > .github/echo_storage/cc_pack/cc_${timestamp}.h
          echo "[ECHO] C/C Pack generated at .github/echo_storage/cc_pack/"

      - name: Release Artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/*.jar
            .github/echo_storage/out/*
            .github/echo_storage/cc_pack/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
