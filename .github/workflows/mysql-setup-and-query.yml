name: 🐬 MySQL Workflow (Echo, 경고 자동 로깅, --skip-host-cache 완화, zoneinfo 패키지 추가)

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  mysql-job:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass123
          MYSQL_DATABASE: sample_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass123
      MYSQL_DB: sample_db

    steps:
      - name: 📦 [echo] Checkout Repository
        uses: actions/checkout@v4

      - name: 🔄 [echo] System Full Package Upgrade (+ zoneinfo, tzdata)
        run: |
          echo "echo '[🔄] 패키지 업그레이드 및 zoneinfo/tzdata 설치 ...'"
          mkdir -p .github/logs
          {
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get -y upgrade
            sudo DEBIAN_FRONTEND=noninteractive apt-get -y dist-upgrade
            sudo apt-get -y autoremove
            sudo apt-get install -y tree zip gnupg grep tzdata
            sudo apt-get install -y --reinstall tzdata
            # zoneinfo가 없을 경우를 대비해 패키지 설치 (실패해도 무관)
          } > .github/logs/sys_upgrade.log 2>&1
          echo "echo '[🔄] 패키지 업그레이드 및 필수 유틸/zoneinfo/tzdata 설치 완료'"

      - name: 📁 [echo] Prepare Directories (All Log/Echo)
        run: |
          echo "echo '[📁] mkdir -p sql export backup .github/queries .github/echo .github/logs .github/mysql_logs .github/mysql_logs/warnings'"
          mkdir -p sql export backup .github/queries .github/echo .github/logs .github/mysql_logs .github/mysql_logs/warnings
          for f in .github/logs/mysql_workflow.log .github/mysql_logs/mysql_echo.txt .github/mysql_logs/warnings/mysql_warnings.txt .github/mysql_logs/warnings/mysql_warnings_only.txt; do
            echo "echo '[📁] touch $f'"
            touch $f
          done

      - name: 🩺 [echo] Wait for MySQL Health, Save Container Logs, Warn on Fatal
        run: |
          echo "echo '[🩺] MySQL Health Check + 경고 로깅 ...'"
          CID=$(docker ps -q --filter "ancestor=mysql:8.0")
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $CID)
            echo "Health status: $STATUS (attempt $i)"
            if [[ "$STATUS" == "healthy" ]]; then
              echo "[✔] MySQL is healthy"
              break
            fi
            sleep 2
          done
          # 전체 로그 저장
          docker logs $CID > .github/mysql_logs/container.log 2>&1
          echo "echo '[🩺] MySQL container logs 저장: .github/mysql_logs/container.log'"
          # 경고(Warning)만 분리 추출
          grep -i "warning" .github/mysql_logs/container.log > .github/mysql_logs/warnings/mysql_warnings.txt || true
          grep -i "^Warning:" .github/mysql_logs/container.log > .github/mysql_logs/warnings/mysql_warnings_only.txt || true
          # 특수 경고 감지시 echo 및 워크플로우 실패(예: skip-host-cache, zoneinfo, empty password 등)
          FAIL=0
          for ERR in "--skip-host-cache" "empty password" "zoneinfo" "CA certificate ca.pem is self signed" "Insecure configuration for --pid-file"; do
            if grep -qi "$ERR" .github/mysql_logs/warnings/mysql_warnings_only.txt; then
              echo "echo '[❌ 경고 감지: $ERR]'"
              echo "[❌ FATAL WARNING DETECTED: $ERR]" >> .github/mysql_logs/mysql_echo.txt
              # 여기서 exit 99로 워크플로우 중단하거나, echo만 남기고 계속 진행도 가능
              # FAIL=1
            fi
          done
          # if [ $FAIL -eq 1 ]; then echo "[FAIL] 치명적 경고 감지로 워크플로우 중단" && exit 99; fi
          echo "echo '[🩺] 경고 체크/로그 완료'"

      # [옵션] skip-host-cache 경고 완화용 SQL 명령 자동 실행(루트로)
      - name: ⚙️ [echo] MySQL 권장 옵션 적용 (--skip-host-cache 대응)
        run: |
          echo "echo '[⚙️] SET GLOBAL host_cache_size=0 ... (skip-host-cache 경고 완화)'"
          MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER -e "SET GLOBAL host_cache_size=0;" || true

      # 이하 단계 동일 (테이블/트랜잭션/backup/export/zip/gpg 등 등)

      - name: 🚀 [echo] Upload Artifacts (CSV, GPG, ZIP, log, warnings)
        uses: actions/upload-artifact@v4
        with:
          name: mysql-full-backup-${{ github.run_id }}
          path: |
            export/customers*.csv
            export/credit_card_transactions*.csv
            sql/*.gpg
            sql/*.sql
            backup/*.zip
            backup/*.sql
            .github/logs/*.log
            .github/mysql_logs/*
            .github/mysql_logs/warnings/mysql_warnings.txt
            .github/mysql_logs/warnings/mysql_warnings_only.txt

      - name: 🗂️ [echo] Show backup/SQL/export/log structure
        run: |
          echo "echo '[🗂️] tree 디렉토리 구조 ...'"
          tree sql || true
          tree export || true
          tree backup || true
          tree .github/mysql_logs || true
          ls -lh sql/ export/ backup/ .github/mysql_logs/
