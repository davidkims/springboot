name: 🇰🇷 KST 타임존 적용 워크플로우

on:
  workflow_dispatch:

jobs:
  kst-timezone-demo:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul  # 모든 스텝에 적용

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🕒 기본 시간(UTC) 확인
        run: |
          echo "[UTC] 현재 시간: $(date -u)"
          echo "[KST] (TZ 변수 사용 전) 현재 시간: $(date)"

      - name: 🕒 TZ 환경변수로 한국 시간 적용 (모든 스텝)
        run: |
          echo "[KST] (TZ=Asia/Seoul) 현재 시간: $(date)"
          echo "TZ=Asia/Seoul date: $(TZ=Asia/Seoul date)"

      - name: 🕒 시스템 타임존을 Asia/Seoul로 강제 변경 (ubuntu만)
        run: |
          echo "[⚙️] 타임존 패키지 설치 및 KST로 변경"
          sudo apt-get update && sudo apt-get install -y tzdata
          sudo ln -sf /usr/share/zoneinfo/Asia/Seoul /etc/localtime
          sudo dpkg-reconfigure -f noninteractive tzdata
          date
          timedatectl

      - name: 🕒 한국 시간으로 로그 남기기
        run: |
          echo "[KST] 최종 시간: $(date)"

      - name: 📝 한국시간 기반 파일 생성
        run: |
          echo "[KST] 파일 생성 예시"
          touch "log-$(date +'%Y%m%d_%H%M%S').txt"
          ls -l log-*.txt
