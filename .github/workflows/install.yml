name: ♻️ _provenance 파일 무한 삭제 자동화

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  delete-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 삭제 타겟 확인
        run: |
          echo "[TARGET] 삭제 대상 파일: _provenance"
          if [ -e "_provenance" ]; then
            echo "[FOUND] _provenance 존재함. 삭제 준비 중..."
          else
            echo "[NOT FOUND] _provenance 없음. 작업 종료."
            exit 0
          fi

      - name: 🔁 _provenance 무한 삭제 반복
        run: |
          set -e
          TARGET="_provenance"
          COUNT=0
          MAX_TRIES=50

          echo "[START] 무한 삭제 시도 시작"

          while [ -e "$TARGET" ]; do
            echo "[TRY #$COUNT] $TARGET 삭제 시도"
            rm -rf "$TARGET" || echo "[WARN] 삭제 실패: $TARGET"
            sleep 2

            if [ -e "$TARGET" ]; then
              echo "[STILL EXISTS] $TARGET 아직 존재함. 재시도."
            else
              echo "[SUCCESS] $TARGET 삭제 성공"
              break
            fi

            COUNT=$((COUNT+1))

            if [ $COUNT -ge $MAX_TRIES ]; then
              echo "[ERROR] 최대 삭제 시도 $MAX_TRIES회 초과. 실패 처리."
              exit 1
            fi
          done

      - name: ✅ 삭제 결과 요약 리포트
        run: |
          echo "🧹 삭제된 파일: _provenance" > delete_result.txt
          ls -lh . >> delete_result.txt
          cat delete_result.txt

      - name: 📤 삭제 리포트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: provenance-delete-report
          path: delete_result.txt

      - name: 💬 PR 코멘트 자동 작성
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🧹 \`_provenance\` 파일 삭제 완료 ✅`
            });
