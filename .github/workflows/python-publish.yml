name: 📦 Upload Python Package to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for trusted publishing to PyPI

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 📦 Install development packages
        run: |
          echo "[📦] Installing development tools..."
          python -m pip install --upgrade pip
          pip install build setuptools wheel twine pytest flake8 black isort mypy
          echo "[✅] Development packages installed."

      - name: 📁 Create directories for build and logs
        run: |
          echo "[📁] Creating build, log, and dist directories..."
          mkdir -p build logs dist
          echo "[✅] Directories created."

      - name: 🧪 Run Tests (Optional)
        run: |
          echo "[🧪] Running tests..."
          if [ -d "tests" ]; then
            pytest tests | tee logs/test.log
          else
            echo "[⚠️] No tests directory found. Skipping."
          fi

      - name: 🏗️ Build release distributions
        run: |
          echo "[🏗️] Building package..."
          python -m build
          echo "[✅] Build complete. Contents of dist/:"
          ls -lh dist/

      - name: ⬆️ Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    environment:
      name: pypi

    steps:
      - name: 📥 Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
