name: 🏆 MySQL+Oracle FullOps Robust Echo Eiffel Tower

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

jobs:
  fullops:
    runs-on: ubuntu-latest
    env:
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass123
      MYSQL_DB: sample_db
      MASS_TABLE: 6
      MASS_USER: 8
      MASS_TXN: 20

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🔄 Init Directories & Echo Logs
        run: |
          set -e
          for d in \
            .github/echo \
            .github/echo/mysql/logs \
            .github/echo/mysql/ddl \
            .github/echo/mysql/user \
            .github/echo/mysql/txn \
            .github/echo/mysql/account_info \
            .github/echo/mysql/sock \
            .github/echo/mysql/portcheck \
            .github/echo/mysql/firewall \
            .github/echo/mysql/secure \
            .github/echo/mysql/scripts \
            .github/echo/mysql/permissions \
            .github/echo/oracle/logs \
            .github/echo/oracle/ddl \
            .github/echo/oracle/txn \
            .github/echo/oracle/user \
            .github/echo/oracle/client \
            .github/echo/oracle/sock \
            .github/echo/oracle/secure \
            .github/echo/oracle/scripts \
            .github/echo/oracle/permissions \
            .github/echo/policy \
            .github/echo/scenario \
            .github/echo/backup \
            .github/echo/monitor \
            .github/echo/reboot \
            .github/echo/netcat \
            .github/echo/firewall_reset \
            .github/echo/mycnf \
            .github/echo/zip \
            .github/echo/scorecard
          do
            mkdir -p "$d"
            echo "echo 'mkdir -p $d'" | tee -a .github/echo/init_dirs_all.log
          done

      - name: ⚡ Install Tools & Scorecard
        run: |
          sudo apt-get update -y && sudo apt-get install -y curl unzip zip gnupg2 net-tools netcat iptables || true
          VERSION="4.10.3"
          curl -sLO https://github.com/ossf/scorecard/releases/download/v${VERSION}/scorecard_${VERSION}_linux_amd64.tar.gz
          tar -xzf scorecard_${VERSION}_linux_amd64.tar.gz
          chmod +x scorecard && sudo mv scorecard /usr/local/bin/
          scorecard --version | tee .github/echo/scorecard/version.txt

      - name: 📃 Run Scorecard
        run: |
          scorecard --repo=https://github.com/${{ github.repository }} --format=json > .github/echo/scorecard/scorecard.json
          cp .github/echo/scorecard/scorecard.json .github/echo/scorecard/scorecard.sarif || true
          echo "{
            \"_type\": \"provenance\",
            \"tool\": \"ossf/scorecard\",
            \"version\": \"${VERSION}\",
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }" > .github/echo/scorecard/.provenance.json

      - name: 📄 Upload Artifacts to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ secrets.GH_PAT != '' }}
        with:
          personal_token: ${{ secrets.GH_PAT }}
          publish_branch: gh-pages
          publish_dir: .github/echo
          commit_message: "📡 Auto-publish FullOps Echo Logs"

      - name: ✅ Final Echo Summary
        run: |
          echo "echo '[FullOps 워크플로우 완료]'" | tee -a .github/echo/final.txt
