name: DB CLI Tools Install & File/Directory Automation (No mongosh, result to .github/)

on:
  workflow_dispatch:

jobs:
  db-cli-tools:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐧 Update apt & Install DB CLI Tools (공식 리포)
        run: |
          echo "[🐧] apt-get update"
          sudo apt-get update

          echo "[🐬] Install MySQL/MariaDB CLI"
          sudo apt-get install -y mysql-client

          echo "[🐘] Install PostgreSQL CLI"
          sudo apt-get install -y postgresql-client

          echo "[📁] Install SQLite3 CLI"
          sudo apt-get install -y sqlite3

          echo "[🔥] Install Firebird CLI"
          sudo apt-get install -y firebird-utils

          echo "[🧊] Install Redis CLI"
          sudo apt-get install -y redis-tools

          echo "[📦] Install ClickHouse Client (예시)"
          sudo apt-get install -y clickhouse-client

          echo "[🟦] Try to install MSSQL CLI (sqlcmd) via apt (may fail if repo not added)"
          sudo apt-get install -y mssql-tools || echo "[⚠️] MSSQL sqlcmd 설치 실패: Microsoft 공식 repo 필요"

          echo "[🌱] Try to install Cassandra cqlsh (pip)"
          pip install --user cqlsh || echo "[⚠️] Cassandra cqlsh pip 설치 실패 시 DataStax 문서 참고"

          echo "[🍊] Oracle SQL*Plus 및 DB2 CLI는 공식 클라이언트 패키지 직접 설치 필요 (별도 안내)"

      - name: 📂 Create Directories for Each DB CLI
        run: |
          echo "[📂] Create directories for DB CLIs"
          mkdir -p dbcli/mysql
          mkdir -p dbcli/postgresql
          mkdir -p dbcli/sqlite
          mkdir -p dbcli/firebird
          mkdir -p dbcli/redis
          mkdir -p dbcli/clickhouse
          mkdir -p dbcli/mssql
          mkdir -p dbcli/cassandra
          mkdir -p dbcli/oracle
          mkdir -p dbcli/db2

      - name: 📄 Create Example SQL/Config File Using echo
        run: |
          echo "[📄] Create sample MySQL SQL file"
          echo "SELECT version();" > dbcli/mysql/version.sql
          echo "[📄] Create sample PostgreSQL SQL file"
          echo "SELECT version();" > dbcli/postgresql/version.sql
          echo "[📄] Create sample SQLite SQL file"
          echo "SELECT sqlite_version();" > dbcli/sqlite/version.sql
          echo "[📄] Create sample Redis command file"
          echo "INFO" > dbcli/redis/info.redis
          echo "[📄] Create sample Firebird SQL file"
          echo "SELECT rdb$get_context('SYSTEM', 'ENGINE_VERSION') FROM rdb$database;" > dbcli/firebird/version.sql
          echo "[📄] Create sample ClickHouse SQL file"
          echo "SELECT version();" > dbcli/clickhouse/version.sql
          echo "[📄] Create sample MSSQL SQL file"
          echo "SELECT @@VERSION;" > dbcli/mssql/version.sql
          echo "[📄] Create sample Cassandra CQL file"
          echo "SELECT release_version FROM system.local;" > dbcli/cassandra/version.cql
          echo "[📄] Create Oracle SQL*Plus sample file"
          echo "SELECT * FROM v\$version;" > dbcli/oracle/version.sql
          echo "[📄] Create DB2 SQL file"
          echo "SELECT service_level, fixpack_num FROM sysibmadm.env_inst_info;" > dbcli/db2/version.sql

      - name: 📋 Copy Example SQL Files to Backup Directory
        run: |
          echo "[📋] Create backup directory"
          mkdir -p dbcli/backup

          echo "[📋] Copy MySQL SQL file to backup"
          cp dbcli/mysql/version.sql dbcli/backup/mysql_version.sql

          echo "[📋] Copy PostgreSQL SQL file to backup"
          cp dbcli/postgresql/version.sql dbcli/backup/postgresql_version.sql

          echo "[📋] Copy SQLite SQL file to backup"
          cp dbcli/sqlite/version.sql dbcli/backup/sqlite_version.sql

          echo "[📋] Copy Redis command file to backup"
          cp dbcli/redis/info.redis dbcli/backup/redis_info.redis

          echo "[📋] Copy Firebird SQL file to backup"
          cp dbcli/firebird/version.sql dbcli/backup/firebird_version.sql

          echo "[📋] Copy ClickHouse SQL file to backup"
          cp dbcli/clickhouse/version.sql dbcli/backup/clickhouse_version.sql

          echo "[📋] Copy MSSQL SQL file to backup"
          cp dbcli/mssql/version.sql dbcli/backup/mssql_version.sql

          echo "[📋] Copy Cassandra CQL file to backup"
          cp dbcli/cassandra/version.cql dbcli/backup/cassandra_version.cql

          echo "[📋] Copy Oracle SQL file to backup"
          cp dbcli/oracle/version.sql dbcli/backup/oracle_version.sql

          echo "[📋] Copy DB2 SQL file to backup"
          cp dbcli/db2/version.sql dbcli/backup/db2_version.sql

      - name: 📨 Copy All Results to .github Directory
        run: |
          echo "[📨] Copy dbcli directory to .github/"
          mkdir -p .github
          cp -r dbcli .github/
          echo "[📨] Done: dbcli results are now in .github/dbcli/"

      - name: 📝 Show .github/dbcli Directory Structure and Files
        run: |
          echo "[📝] Directory and file structure under .github/dbcli:"
          tree .github/dbcli || ls -R .github/dbcli
