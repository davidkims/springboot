name: "🐬 MySQL 8.x root 복구 + robust_admin + echo/권한 + 가상메일/Postfix (auth_socket 제거, 최신)"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: mysql-robust
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mysql-robust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ROOT_PASS: rootpass123
      ROBUST_USER: robust_admin
      ROBUST_PASS: robustpass123
      MAIL_DOMAIN: example.com
      TEST_EMAIL: test@example.com

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔒 Mask secrets in logs
        run: |
          echo "::add-mask::${ROOT_PASS}"
          echo "::add-mask::${ROBUST_PASS}"

      - name: 📂 Echo/logs/dir robust 생성 및 보안
        run: |
          set -Eeuo pipefail
          for d in .github/echo .github/logs .github/mysql_bak .github/error_logs; do
            echo "echo 'mkdir -p $d'"; mkdir -p "$d"
            echo "echo 'chmod 700 $d'"; chmod 700 "$d"
          done

      - name: 🔄 시스템 업데이트 & 필수 패키지 설치(누락 포함)
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y | tee .github/echo/01-apt-update.txt
          sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y | tee .github/echo/02-apt-upgrade.txt
          # 'install' 로 누락 패키지까지 확실히 설치
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mysql-server mysql-client postfix postfix-mysql mailutils lsof | tee .github/echo/03-apt-install.txt
          sudo apt-get autoremove -y | tee .github/echo/04-apt-autoremove.txt
          sudo systemctl daemon-reload

      - name: 🧹 MySQL 런타임 디렉토리/권한/잔재 정리
        run: |
          set -Eeuo pipefail
          sudo systemctl stop mysql || true
          sudo pkill -f mysqld || true
          sudo mkdir -p /var/lib/mysql /var/run/mysqld /var/log/mysql
          sudo chown -R mysql:mysql /var/lib/mysql /var/run/mysqld /var/log/mysql
          sudo chmod 750 /var/lib/mysql
          sudo chmod 770 /var/run/mysqld
          sudo chmod 755 /var/log/mysql
          sudo rm -f /var/lib/mysql/*.err /var/lib/mysql/*.pid /var/lib/mysql/*.sock /var/lib/mysql/*.lock \
                     /tmp/mysql.sock* /var/run/mysqld/mysqld.sock* || true
          sudo rm -rf /var/run/mysqld/*
          sudo mkdir -p /var/run/mysqld
          sudo chown mysql:mysql /var/run/mysqld

      - name: 🚨 skip-grant-tables 기동 → root 권한 복구 (전용 소켓 사용)
        run: |
          set -Eeuo pipefail
          REC_SOCKET=/tmp/mysql-recover.sock
          nohup sudo mysqld --skip-grant-tables --skip-networking --socket="$REC_SOCKET" > .github/logs/mysql_skipgrant.log 2>&1 &
          # 전용 소켓 생성 대기(최대 30초)
          for i in $(seq 1 30); do
            [ -S "$REC_SOCKET" ] && break
            sleep 1
          done
          if [ ! -S "$REC_SOCKET" ]; then
            echo "[ERR] mysqld(skip-grant) 기동 실패"; cat .github/logs/mysql_skipgrant.log || true
            sudo cat /var/log/mysql/error.log || true
            exit 1
          fi

          # root 복구 스크립트 (auth_socket -> mysql_native_password)
          cat > .github/echo/root-repair.sql <<'EOSQL'
          FLUSH PRIVILEGES;
          CREATE USER IF NOT EXISTS 'root'@'localhost' IDENTIFIED BY 'ROOT_PLACEHOLDER';
          GRANT ALL PRIVILEGES ON *.* TO 'root'@'localhost' WITH GRANT OPTION;
          ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'ROOT_PLACEHOLDER';
          FLUSH PRIVILEGES;
          EOSQL
          sed -i "s/ROOT_PLACEHOLDER/${ROOT_PASS//\//\\/}/g" .github/echo/root-repair.sql

          # 전용 소켓으로 접속하여 권한 복구
          sudo mysql --socket="$REC_SOCKET" < .github/echo/root-repair.sql \
            || (cat .github/logs/mysql_skipgrant.log || true; exit 1)

          # 임시 인스턴스 종료 후 정식 서비스 기동
          sudo pkill -f mysqld || true
          sleep 3
          sudo systemctl start mysql
          # 소켓 확인
          for i in $(seq 1 20); do
            [ -S /var/run/mysqld/mysqld.sock ] && break
            sleep 1
          done
          if [ ! -S /var/run/mysqld/mysqld.sock ]; then
            echo "[ERR] mysql 서비스 기동 실패"
            sudo journalctl -u mysql | tail -200 || true
            sudo cat /var/log/mysql/error.log || true
            exit 1
          fi

      - name: 👑 robust_admin 생성/권한 + 사용자/권한 에코
        run: |
          set -Eeuo pipefail
          cat > .github/echo/robust_admin.sql <<'EOSQL'
          DROP USER IF EXISTS 'ROBUST_USER'@'localhost';
          DROP USER IF EXISTS 'ROBUST_USER'@'%';
          CREATE USER 'ROBUST_USER'@'localhost' IDENTIFIED BY 'ROBUST_PASS';
          CREATE USER 'ROBUST_USER'@'%' IDENTIFIED BY 'ROBUST_PASS';
          GRANT ALL PRIVILEGES ON *.* TO 'ROBUST_USER'@'localhost' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON *.* TO 'ROBUST_USER'@'%' WITH GRANT OPTION;
          FLUSH PRIVILEGES;
          EOSQL
          sed -i "s/ROBUST_USER/${ROBUST_USER}/g" .github/echo/robust_admin.sql
          sed -i "s/ROBUST_PASS/${ROBUST_PASS//\//\\/}/g" .github/echo/robust_admin.sql

          mysql -u root -p"${ROOT_PASS}" < .github/echo/robust_admin.sql

          echo "SHOW GRANTS FOR '${ROBUST_USER}'@'%';" > .github/echo/show-grants.sql
          echo "SHOW GRANTS FOR '${ROBUST_USER}'@'localhost';" >> .github/echo/show-grants.sql
          echo "SELECT user,host,plugin,account_locked FROM mysql.user;" > .github/echo/show-users.sql

          # 접속/조회(비번 오타 수정: -pROBUST → -p${ROBUST_PASS})
          mysql -u "${ROBUST_USER}" -p"${ROBUST_PASS}" -e "SELECT user,host,plugin,account_locked FROM mysql.user;" \
            > .github/echo/user_list.txt
          mysql -u "${ROBUST_USER}" -p"${ROBUST_PASS}" < .github/echo/show-grants.sql \
            > .github/echo/grants_${ROBUST_USER}.txt

          # 간단한 감사 테이블
          mysql -u "${ROBUST_USER}" -p"${ROBUST_PASS}" -e "
            CREATE DATABASE IF NOT EXISTS echo_info;
            CREATE TABLE IF NOT EXISTS echo_info.account_audit (
              id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
              ts TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              user VARCHAR(64), host VARCHAR(64), plugin VARCHAR(64)
            );
            INSERT INTO echo_info.account_audit (user,host,plugin)
              SELECT user,host,plugin FROM mysql.user;
          " > .github/echo/echo_table_create_and_insert.txt

          # 인증 재시도 루프
          for i in 1 2 3 4 5; do
            if mysql -u "${ROBUST_USER}" -p"${ROBUST_PASS}" -e "SELECT 1" >/dev/null 2>&1; then
              echo "[✔] ${ROBUST_USER} 인증 성공!" | tee -a .github/echo/${ROBUST_USER}-auth.txt
              break
            else
              echo "[!] ${ROBUST_USER} 인증 실패($i), 4초 후 재시도..." | tee -a .github/echo/${ROBUST_USER}-auth.txt
              sleep 4
            fi
          done

      - name: 📨 가상메일 스키마 생성 및 샘플 계정
        run: |
          set -Eeuo pipefail
          cat > .github/echo/virtual_mail_schema.sql <<'EOSQL'
          CREATE DATABASE IF NOT EXISTS mailserver CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          USE mailserver;
          CREATE TABLE IF NOT EXISTS virtual_domains (
            id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
            name VARCHAR(50) NOT NULL UNIQUE
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          CREATE TABLE IF NOT EXISTS virtual_users (
            id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
            domain_id INT NOT NULL,
            password VARCHAR(106) NOT NULL,
            email VARCHAR(100) NOT NULL UNIQUE,
            FOREIGN KEY (domain_id) REFERENCES virtual_domains(id) ON DELETE CASCADE
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          CREATE TABLE IF NOT EXISTS virtual_aliases (
            id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
            domain_id INT NOT NULL,
            source VARCHAR(100) NOT NULL,
            destination VARCHAR(100) NOT NULL,
            FOREIGN KEY (domain_id) REFERENCES virtual_domains(id) ON DELETE CASCADE
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          INSERT IGNORE INTO virtual_domains (name) VALUES ('MAIL_DOMAIN_PLACEHOLDER');
          INSERT IGNORE INTO virtual_users (domain_id, password, email)
          VALUES (
            1,
            '$6$rounds=656000$robustsalt$MJ04ZsU2eWkgR2Q4CjV7GAw74pD6B0WFFR8hyljVEc0ENJPkjQw/YyzJJ0bUowG9/56u6dyKToKPtbnPhsoEx1', -- 'mailpass123'
            'TEST_EMAIL_PLACEHOLDER'
          );
          INSERT IGNORE INTO virtual_aliases (domain_id, source, destination)
          VALUES (1, 'alias@MAIL_DOMAIN_PLACEHOLDER', 'TEST_EMAIL_PLACEHOLDER');
          EOSQL
          sed -i "s/MAIL_DOMAIN_PLACEHOLDER/${MAIL_DOMAIN}/g" .github/echo/virtual_mail_schema.sql
          sed -i "s/TEST_EMAIL_PLACEHOLDER/${TEST_EMAIL}/g" .github/echo/virtual_mail_schema.sql

          mysql -u "${ROBUST_USER}" -p"${ROBUST_PASS}" < .github/echo/virtual_mail_schema.sql

      - name: 📮 Postfix ↔ MySQL 연동(맵 3종) + postconf 적용 + 테스트 발송
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          # 1) domains
          cat > .github/echo/postfix-mysql-virtual-domains.cf <<'EOF'
          user = ROBUST_USER_PLACEHOLDER
          password = ROBUST_PASS_PLACEHOLDER
          hosts = 127.0.0.1
          dbname = mailserver
          query = SELECT name FROM virtual_domains WHERE name='%s'
          EOF
          # 2) mailbox (존재 유무)
          cat > .github/echo/postfix-mysql-virtual-mailbox.cf <<'EOF'
          user = ROBUST_USER_PLACEHOLDER
          password = ROBUST_PASS_PLACEHOLDER
          hosts = 127.0.0.1
          dbname = mailserver
          query = SELECT 1 FROM virtual_users WHERE email='%s'
          EOF
          # 3) alias (전달 대상)
          cat > .github/echo/postfix-mysql-virtual-alias.cf <<'EOF'
          user = ROBUST_USER_PLACEHOLDER
          password = ROBUST_PASS_PLACEHOLDER
          hosts = 127.0.0.1
          dbname = mailserver
          query = SELECT destination FROM virtual_aliases WHERE source='%s'
          EOF

          for f in postfix-mysql-virtual-domains.cf postfix-mysql-virtual-mailbox.cf postfix-mysql-virtual-alias.cf; do
            sed -i "s/ROBUST_USER_PLACEHOLDER/${ROBUST_USER}/g" ".github/echo/$f"
            sed -i "s/ROBUST_PASS_PLACEHOLDER/${ROBUST_PASS//\//\\/}/g" ".github/echo/$f"
          done

          sudo cp .github/echo/postfix-mysql-virtual-*.cf /etc/postfix/

          sudo postconf -e "virtual_mailbox_domains=mysql:/etc/postfix/postfix-mysql-virtual-domains.cf"
          sudo postconf -e "virtual_mailbox_maps=mysql:/etc/postfix/postfix-mysql-virtual-mailbox.cf"
          sudo postconf -e "virtual_alias_maps=mysql:/etc/postfix/postfix-mysql-virtual-alias.cf"

          sudo systemctl restart postfix || true

          echo "테스트메일" | mail -s "[Test] Virtual Mail" "${TEST_EMAIL}" || true

      - name: 📦 로그/에코 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-robust-logs
          path: |
            .github/echo/**
            .github/logs/**
            .github/error_logs/**
          retention-days: 7
