name: ✨ OSSF Scorecard + Echo Template + PR Auto-Fix

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 3 * * 5'  # 매주 금요일 03:00
  workflow_dispatch:

jobs:
  ossf-security-full:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      security-events: write
      actions: read
      packages: read

    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Init Echo Directories & Templates
        run: |
          echo "echo '[❄ Init] Echo directory structure'" | tee -a /tmp/echo_init.log

          mkdir -p .github/echo/init
          mkdir -p .github/echo_template
          mkdir -p .github/echo_placeholder
          mkdir -p .github/echo_fix/scripts

          for base in scorecard template placeholder fix cli; do
            for sub in logs scripts test init converted; do
              mkdir -p ".github/echo_${base}/${sub}"
            done
          done

          echo "echo '[❄ Init] Echo directory structure'" | tee .github/echo/init/init_dirs.sh

          echo 'API_KEY=PLACEHOLDER' > .github/echo_template/sample.env
          echo 'TOKEN=PLACEHOLDER' > .github/echo_template/sample.cfg
          echo '{ "secret": "PLACEHOLDER" }' > .github/echo_template/sample.json

      - name: ✨ Install OSSF Scorecard CLI (Correct Path)
        run: |
          VERSION="4.10.3"
          curl -sLO https://github.com/ossf/scorecard/releases/download/v${VERSION}/scorecard_${VERSION}_linux_amd64.tar.gz
          tar -xzf scorecard_${VERSION}_linux_amd64.tar.gz
          BIN=$(find . -type f -name scorecard | head -1)
          chmod +x "$BIN"
          sudo mv "$BIN" /usr/local/bin/scorecard
          scorecard --version | tee .github/echo_scorecard/logs/version.txt
          echo "echo 'scorecard CLI 설치 완료'" | tee -a .github/echo_cli/logs/install.log

      - name: 🔍 Run OSSF Scorecard
        run: |
          scorecard --repo=. --format=json --show-details > scorecard.json
          mv scorecard.json .github/echo_scorecard/logs/scorecard.json

      - name: ✏️ Generate Fix Script Based on PLACEHOLDER
        run: |
          echo '#!/bin/bash' > .github/echo_fix/scripts/apply_fixes.sh
          echo "echo '[🔧 FIX] Replacing PLACEHOLDER values in templates'" >> .github/echo_fix/scripts/apply_fixes.sh

          for f in .github/echo_template/*.{env,cfg,json}; do
            sed 's/PLACEHOLDER/REPLACED_VALUE/g' "$f" > ".github/echo_placeholder/$(basename $f)"
            echo "echo '[🚀] Applied fix to $(basename $f)'" >> .github/echo_fix/scripts/apply_fixes.sh
          done

          chmod +x .github/echo_fix/scripts/apply_fixes.sh
          .github/echo_fix/scripts/apply_fixes.sh

      - name: 🔧 Analyze scorecard.json and create PR if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HIGH_RISK=$(jq '.checks[] | select(.score < 5) | .name' .github/echo_scorecard/logs/scorecard.json | wc -l)
          if [ "$HIGH_RISK" -gt 0 ]; then
            git config --global user.email "action@github.com"
            git config --global user.name "GitHub Action"
            git checkout -b security-auto-fix
            git add .github/echo_placeholder/*.env .github/echo_placeholder/*.cfg .github/echo_placeholder/*.json
            git commit -m "🚀 Auto-fix: Replace PLACEHOLDER in templates (via Scorecard risk check)"
            git push origin security-auto-fix
            gh pr create --title "🔧 Security Auto-Fix: PLACEHOLDER replacement" --body "Automatically generated PR to apply template fixes based on Scorecard risks." || true
          else
            echo "[SAFE] No high-risk items found in scorecard.json."
          fi

      - name: 📄 Upload Echo Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-artifacts
          path: .github/echo_*/**
