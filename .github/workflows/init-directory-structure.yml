name: 🗂️ Auto Expand .github + Copy & Lint Workflows

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  expand-github-dir:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 🧮 Detect next slot number
        id: detect
        run: |
          mkdir -p .github/autogen
          EXISTING=$(find .github/autogen -maxdepth 1 -type d -name 'slot-*' | sed 's|.*/slot-||' | sort -n)
          LAST_SLOT=$(echo "$EXISTING" | tail -n 1)
          if [ -z "$LAST_SLOT" ]; then
            NEXT_SLOT=001
          else
            NEXT_SLOT=$(printf "%03d" $((10#$LAST_SLOT + 1)))
          fi
          echo "next_slot=slot-$NEXT_SLOT" >> $GITHUB_OUTPUT
          echo "[➡️] Next slot: slot-$NEXT_SLOT"

      - name: ⏱️ Generate timestamp
        id: time
        run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: 📁 Create slot directory and echo files
        run: |
          SLOT_NAME=${{ steps.detect.outputs.next_slot }}
          DIR=".github/autogen/$SLOT_NAME"
          mkdir -p "$DIR"
          echo "# $SLOT_NAME" > "$DIR/README.md"
          echo "Slot: $SLOT_NAME" > "$DIR/info.txt"
          echo "Generated: $(date -u)" >> "$DIR/info.txt"

      - name: 📋 Copy all .github/workflows YAMLs to slot
        run: |
          SLOT_NAME=${{ steps.detect.outputs.next_slot }}
          DEST=".github/autogen/$SLOT_NAME/workflows"
          mkdir -p "$DEST"
          find .github/workflows -maxdepth 1 -type f \( -name '*.yaml' -o -name '*.yml' \) -exec cp {} "$DEST/" \;
          echo "[✔] Files copied to: $DEST"
          ls -l "$DEST"

      - name: 🧪 Lint copied YAML files with yamllint
        run: |
          echo "[🔍] Installing yamllint..."
          pip install --quiet yamllint

          SLOT_NAME=${{ steps.detect.outputs.next_slot }}
          TARGET_DIR=".github/autogen/$SLOT_NAME/workflows"

          echo "[🧪] Running yamllint on: $TARGET_DIR"
          yamllint "$TARGET_DIR" || {
            echo "[❌] YAML Lint failed"
            exit 1
          }

      - name: 🔗 Update symlink to latest slot
        run: |
          SLOT_NAME=${{ steps.detect.outputs.next_slot }}
          rm -rf .github/slot-latest
          ln -s "autogen/$SLOT_NAME" .github/slot-latest
          ls -l .github/

      - name: 🔀 Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🗂️ Add ${{ steps.detect.outputs.next_slot }} + copied workflows + lint checked"
          branch: autogen-${{ steps.detect.outputs.next_slot }}-${{ steps.time.outputs.timestamp }}
          title: "🗂️ Create ${{ steps.detect.outputs.next_slot }} & Lint Workflows"
          body: |
            This PR includes:
            - Created `.github/autogen/${{ steps.detect.outputs.next_slot }}`
            - Copied `.github/workflows/*.y[a]ml` files into `workflows/`
            - Lint checked using `yamllint`
            - Updated `.github/slot-latest` symlink
          delete-branch: true
