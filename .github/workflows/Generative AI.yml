      - name: Upload artifacts (public + logs)
        uses: actions/upload-artifact@v4
        with:
          name: generative-ai-catalog-${{ github.run_id }}
          path: |
            ${{ env.PUBLIC_DIR }}/
            ${{ env.LOG_DIR }}/
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Echo deployed url
        shell: bash
        run: |
          ts(){ date '+%F %T.%3N'; }
          echo "[ECHO][$(ts)] DEPLOYED URL: ${{ steps.deployment.outputs.page_url }}"
