name: "🦀 Rust CI (auto-detect Cargo.toml/workspace)"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: rustci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable + clippy/rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          profile: minimal

      - name: Auto-detect Cargo manifests (workspace or crates)
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO] 탐색 시작: 리포지토리 내 Cargo.toml 검색"
          # 루트 Cargo.toml?
          if [[ -f Cargo.toml ]]; then
            echo "[ECHO] 루트에 Cargo.toml 발견"
            if grep -q "^\[workspace\]" Cargo.toml; then
              echo "mode=workspace" >> "$GITHUB_OUTPUT"
              echo "root=."           >> "$GITHUB_OUTPUT"
              echo "[ECHO] 워크스페이스 모드"
              exit 0
            else
              echo "mode=single"      >> "$GITHUB_OUTPUT"
              echo "manifest=./Cargo.toml" >> "$GITHUB_OUTPUT"
              echo "[ECHO] 단일 크레이트 모드"
              exit 0
            fi
          fi

          # 루트가 아니라면 전체에서 찾되 target/node_modules 제외
          mapfile -t found < <(find . -type f -name Cargo.toml \
            -not -path "*/target/*" -not -path "*/node_modules/*" \
            | sort)

          if (( ${#found[@]} == 0 )); then
            echo "::error ::No Cargo.toml found anywhere in the repo."
            echo "[HINT] 실제 위치를 알려주세요. 예) backend/, crates/api/, rust/ 등"
            exit 1
          fi

          # 워크스페이스 루트 후보(파일 내용에 [workspace]) 우선
          ws_candidates=()
          for f in "${found[@]}"; do
            if grep -q "^\[workspace\]" "$f"; then
              ws_candidates+=("$f")
            fi
          done

          if (( ${#ws_candidates[@]} > 0 )); then
            # 가장 상위 경로(짧은 깊이)를 워크스페이스 루트로 선택
            ws_root="$(dirname "$(printf '%s\n' "${ws_candidates[@]}" | awk -F/ '{print NF "\t"$0}' | sort -n | cut -f2- | head -n1)")"
            echo "mode=workspace" >> "$GITHUB_OUTPUT"
            echo "root=${ws_root}" >> "$GITHUB_OUTPUT"
            echo "[ECHO] 워크스페이스 루트: ${ws_root}"
            exit 0
          fi

          # 워크스페이스가 아니면 모든 크레이트를 순회 실행
          echo "mode=multi" >> "$GITHUB_OUTPUT"
          # 각 Cargo.toml의 디렉터리 경로를 줄바꿈으로 연결
          printf '%s\n' "${found[@]}" | xargs -I{} dirname "{}" | sort -u > crates.txt
          echo "crates<<__CRATES__" >> "$GITHUB_OUTPUT"
          cat crates.txt             >> "$GITHUB_OUTPUT"
          echo "__CRATES__"          >> "$GITHUB_OUTPUT"
          echo "[ECHO] 다중 크레이트(${#found[@]}개) 모드"

      - name: Cache (targets)
        uses: Swatinem/rust-cache@v2
        with:
          # 워크스페이스면 루트, 아니면 전체 리포 (자동 분할 캐시)
          workspaces: |
            ${{ steps.detect.outputs.root || '.' }}

      - name: Show rust versions
        shell: bash
        run: |
          rustc -Vv
          cargo -V

      - name: Format (rustfmt)
        if: ${{ steps.detect.outputs.mode == 'workspace' }}
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.root }}"
          cargo fmt --all --check

      - name: Lint (clippy) — workspace
        if: ${{ steps.detect.outputs.mode == 'workspace' }}
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.root }}"
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Test — workspace
        if: ${{ steps.detect.outputs.mode == 'workspace' }}
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.root }}"
          cargo test --all-features --verbose

      - name: Build — workspace
        if: ${{ steps.detect.outputs.mode == 'workspace' }}
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.root }}"
          cargo build --release --verbose

      - name: Single crate (fmt+clippy+test+build)
        if: ${{ steps.detect.outputs.mode == 'single' }}
        shell: bash
        run: |
          manifest="${{ steps.detect.outputs.manifest }}"
          dir="$(dirname "$manifest")"
          cd "$dir"
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features --verbose
          cargo build --release --verbose

      - name: Multi-crate loop (fmt+clippy+test+build per crate)
        if: ${{ steps.detect.outputs.mode == 'multi' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r dir; do
            echo "[ECHO] >>> crate: $dir"
            cd "$dir"
            cargo fmt --all --check
            cargo clippy --all-targets --all-features -- -D warnings
            cargo test --all-features --verbose
            cargo build --release --verbose
            cd - >/dev/null
          done < crates.txt
