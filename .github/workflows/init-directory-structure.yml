name: 📁 Auto Update Slot Directory & PR

on:
  workflow_dispatch:
  push:
    paths:
      - 'disk/slot-001/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-slot-directory:
    runs-on: ubuntu-latest

    steps:
      - name: 📅 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Git Config
        run: |
          echo "[🔧] Configuring Git identity for commit..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 📂 Ensure slot directory and update symlink
        run: |
          echo "[📁] Ensuring disk directory exists..."
          mkdir -p disk
          
          echo "[📁] Checking if slot-001 exists..."
          if [ ! -d "disk/slot-001" ]; then
            echo "[⚠] disk/slot-001 does not exist. Aborting."
            exit 1
          fi

          echo "[🔗] Updating symlink: disk/slot-latest -> disk/slot-001"
          rm -rf disk/slot-latest
          ln -s slot-001 disk/slot-latest
          
          echo "[📂] Listing contents of disk/:"
          ls -l disk/

      - name: 🔢 Create Pull Request for Slot Update
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "📆 Auto update: slot-001 and symbolic link"
          branch: slot-update-slot-001
          title: "📆 Update: disk/slot-001 and symbolic link"
          body: |
            This PR contains:
            - Updates to `disk/slot-001` directory
            - Updated `disk/slot-latest` symlink
            - Auto-generated by GitHub Actions
          delete-branch: true
