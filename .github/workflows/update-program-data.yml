---
name: Update Program Data

'on':
  workflow_dispatch:
    inputs:
      program:
        description: "업데이트할 프로그램 이름 (all 입력 시 전체)"
        required: false
        default: "all"
  schedule:
    - cron: '0 0 * * 0'  # 매주 일요일 00:00 UTC

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: "📂 Checkout repository"
        uses: actions/checkout@v4
      - name: "🔄 Update package list"
        run: sudo apt-get update
      - name: "📁 Create logs directory"
        run: mkdir -p .github/logs
      - name: "🔑 Make script executable"
        run: chmod +x workflow/update_all_data.sh
      - name: "🚀 Refresh data for programs"
        env:
          PROGRAM: ${{ github.event.inputs.program }}
        run: |
          set -euo pipefail
          LOG=".github/logs/update_$(date +%F).log"
          bash workflow/update_all_data.sh "$PROGRAM" | tee "$LOG"
