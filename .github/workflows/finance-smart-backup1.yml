name: 🔒 Integrated Blacklist Generator (Every 1 min · Mandatory DC · Fail-safe · Echo · Mass Dirs · No setup-* actions)

on:
  schedule:
    - cron: "*/1 * * * *"   # 1분마다 (GitHub이 지연/스킵할 수 있음)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: blacklist-integrated
  cancel-in-progress: true

env:
  # 루트/결과 디렉터리
  BLACKLIST_DIR: .github/blacklist
  REPORT_DIR: .github/blacklist/report
  EXPORT_DIR: .github/blacklist/export
  SNAPSHOT_DIR: .github/blacklist/snapshots
  ARCHIVE_DIR: .github/blacklist/archive
  LATEST_DIR: .github/blacklist/latest
  # 서브(대량 생성 대상)
  NET_DIR: .github/blacklist/networks
  PKG_DIR: .github/blacklist/packages
  CODE_DIR: .github/blacklist/code
  SUMMARY_DIR: .github/blacklist/summary

  # 공개 피드만 사용
  ENABLE_SPAMHAUS: "true"
  ENABLE_EMERGING_THREATS: "true"

  # 로컬/무료 도구
  ENABLE_PY_AUDIT: "auto"
  ENABLE_NPM_AUDIT: "auto"
  ENABLE_SEMGREP: "true"

  # OWASP Dependency-Check (필수 실행)
  DC_VERSION: "9.2.0"
  DC_HOME: /opt/dependency-check
  DC_DATA: /opt/dependency-check/data

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🧭 Echo start & env
        run: |
          echo "[ECHO] ▶ 통합 블랙리스트 워크플로우 시작"
          echo "[ECHO] 브랜치: $(git rev-parse --abbrev-ref HEAD)"
          echo "[ECHO] 커밋: $(git rev-parse --short HEAD)"
          echo "RUN_DATE_UTC=$(date -u +%Y%m%dT%H%M%SZ)" >> $GITHUB_ENV
          echo "LOGFILE=.github/blacklist/logs/run_$(date -u +%Y%m%dT%H%M%SZ).log" >> $GITHUB_ENV
          echo "[ECHO] 실행 시각(UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: 📁 Create mass directories
        run: |
          set -e
          mkdir -p \
            "$BLACKLIST_DIR"/{raw,dist,logs} \
            "$REPORT_DIR" \
            "$EXPORT_DIR"/{json,txt,csv,html} \
            "$SNAPSHOT_DIR" "$ARCHIVE_DIR" "$LATEST_DIR" \
            "$NET_DIR"/{spamhaus,et,all} \
            "$PKG_DIR"/{python,npm,dc} \
            "$CODE_DIR"/semgrep \
            "$SUMMARY_DIR"
          SNAP_DIR="$SNAPSHOT_DIR/$RUN_DATE_UTC"
          mkdir -p "$SNAP_DIR"/{networks,packages,code,summary,logs}
          echo "SNAP_DIR=$SNAP_DIR" >> $GITHUB_ENV
          echo "[ECHO] 디렉터리 생성 완료 (스냅샷: $SNAP_DIR)" | tee -a "$LOGFILE"

      - name: 🗂️ Bootstrap placeholder files via echo
        run: |
          set -e
          echo "# Blacklist Outputs" > "$BLACKLIST_DIR/README.md"
          echo "{ \"generated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"version\": 1 }" > "$BLACKLIST_DIR/manifest.json"
          for d in "$BLACKLIST_DIR" "$REPORT_DIR" "$EXPORT_DIR" "$SNAPSHOT_DIR" "$ARCHIVE_DIR" "$LATEST_DIR" \
                   "$NET_DIR/spamhaus" "$NET_DIR/et" "$NET_DIR/all" \
                   "$PKG_DIR/python" "$PKG_DIR/npm" "$PKG_DIR/dc" \
                   "$CODE_DIR/semgrep" "$SUMMARY_DIR" \
                   "$SNAP_DIR" "$SNAP_DIR/networks" "$SNAP_DIR/packages" "$SNAP_DIR/code" "$SNAP_DIR/summary" "$SNAP_DIR/logs"; do
            touch "$d/.gitkeep"
          done
          echo "[ECHO] 플레이스홀더/매니페스트 생성" | tee -a "$LOGFILE"

      - name: 🧰 Ensure base toolchain (APT) & Python tooling
        run: |
          set -e
          echo "[ECHO] APT 패키지 업데이트 및 필수 도구 설치" | tee -a "$LOGFILE"
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates unzip jq git python3 python3-pip python3-venv nodejs npm
          python3 -m pip install --upgrade pip
          pip3 install -U pip-audit safety semgrep
          npm i -g npm@latest || true
          echo "[ECHO] 도구 설치 완료 (pip-audit, safety, semgrep, jq, unzip, npm)" | tee -a "$LOGFILE"

      - name: 🗄 Create IDC(DC_HOME/DC_DATA) directories (mandatory)
        run: |
          set -e
          echo "[ECHO] IDC(데이터센터) 디렉터리 선생성" | tee -a "$LOGFILE"
          sudo mkdir -p "${DC_HOME}" "${DC_DATA}"
          sudo chmod -R 755 "${DC_HOME}" "${DC_DATA}"
          ls -ld "${DC_HOME}" "${DC_DATA}" | tee -a "$LOGFILE"

      - name: ♻️ Cache OWASP DC Data (NVD DB)
        id: cache-dc
        uses: actions/cache@v4
        with:
          path: ${{ env.DC_DATA }}
          key: dc-data-${{ env.DC_VERSION }}-${{ runner.os }}
          restore-keys: |
            dc-data-${{ env.DC_VERSION }}-${{ runner.os }}

      - name: 🛠 Install OWASP Dependency-Check CLI (robust)
        run: |
          set -e
          echo "[ECHO] DC 설치 시작 v${DC_VERSION}" | tee -a "$LOGFILE"
          sudo rm -rf "${DC_HOME}"
          url="https://github.com/jeremylong/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip"
          # 다운로드 3회 재시도
          for i in 0 1 2 3; do
            [ $i -gt 0 ] && { echo "[WARN] DC ZIP 재시도 $i회" | tee -a "$LOGFILE"; sleep $((i*2)); }
            curl -fsSL -o dc.zip "$url" && break || true
          done
          sudo mkdir -p "${DC_HOME}" "${DC_DATA}"
          if unzip -q dc.zip -d /opt; then
            # 동적 폴더명 탐색
            CANDIDATE="$(find /opt -maxdepth 1 -type d -name 'dependency-check*' | sort | head -n1 || true)"
            echo "[ECHO] DC 후보 폴더: ${CANDIDATE:-<none>}" | tee -a "$LOGFILE"
            if [ -n "$CANDIDATE" ] && [ -d "$CANDIDATE" ]; then
              sudo rm -rf "${DC_HOME}"
              sudo mv -f "$CANDIDATE" "${DC_HOME}"
              if [ -f "${DC_HOME}/bin/dependency-check.sh" ]; then
                sudo chmod +x "${DC_HOME}/bin/dependency-check.sh"
                echo "DC_READY=true" >> $GITHUB_ENV
                echo "[ECHO] DC 설치 성공 (HOME=${DC_HOME})" | tee -a "$LOGFILE"
              else
                echo "DC_READY=false" >> $GITHUB_ENV
                echo "[WARN] dependency-check.sh 미존재 → 자리표시자 모드" | tee -a "$LOGFILE"
              fi
            else
              echo "DC_READY=false" >> $GITHUB_ENV
              echo "[WARN] DC 설치 폴더 탐색 실패 → 자리표시자 모드" | tee -a "$LOGFILE"
            fi
          else
            echo "DC_READY=false" >> $GITHUB_ENV
            echo "[WARN] DC ZIP 해제 실패 → 자리표시자 모드" | tee -a "$LOGFILE"
          fi
          rm -f dc.zip

      # ─────────────── 공개 블랙리스트 수집 ───────────────
      - name: 🌐 Spamhaus 수집 (fail-safe)
        if: env.ENABLE_SPAMHAUS == 'true'
        run: |
          set -e
          echo "[ECHO] Spamhaus 수집 시작" | tee -a "$LOGFILE"
          mkdir -p "$NET_DIR/spamhaus" "$NET_DIR/all"
          # DROP/EDROP
          curl -fsSL https://www.spamhaus.org/drop/drop.txt  | grep -v '^;' > "$BLACKLIST_DIR/raw/spamhaus_drop.txt"  || echo -n > "$BLACKLIST_DIR/raw/spamhaus_drop.txt"
          curl -fsSL https://www.spamhaus.org/drop/edrop.txt | grep -v '^;' > "$BLACKLIST_DIR/raw/spamhaus_edrop.txt" || echo -n > "$BLACKLIST_DIR/raw/spamhaus_edrop.txt"
          cat "$BLACKLIST_DIR/raw/"spamhaus_*.txt | sort -u > "$NET_DIR/all/ip_blacklist_spamhaus.txt" || echo -n > "$NET_DIR/all/ip_blacklist_spamhaus.txt"
          wc -l "$NET_DIR/all/ip_blacklist_spamhaus.txt" | awk '{print "[ECHO] Spamhaus IP:", $1}'
          echo "[ECHO] Spamhaus 수집 종료" | tee -a "$LOGFILE"

      - name: 🌐 Emerging Threats 수집 (fail-safe)
        if: env.ENABLE_EMERGING_THREATS == 'true'
        run: |
          set -e
          echo "[ECHO] Emerging Threats 수집 시작" | tee -a "$LOGFILE"
          mkdir -p "$NET_DIR/et" "$NET_DIR/all"
          curl -fsSL https://rules.emergingthreats.net/blockrules/compromised-ips.txt \
            | grep -E '^[0-9]+\.[0-9]+' > "$BLACKLIST_DIR/raw/et_compromised_ips.txt" || echo -n > "$BLACKLIST_DIR/raw/et_compromised_ips.txt"
          sort -u "$BLACKLIST_DIR/raw/et_compromised_ips.txt" > "$NET_DIR/all/ip_blacklist_et.txt" || echo -n > "$NET_DIR/all/ip_blacklist_et.txt"
          wc -l "$NET_DIR/all/ip_blacklist_et.txt" | awk '{print "[ECHO] ET IP:", $1}'
          echo "[ECHO] Emerging Threats 수집 종료" | tee -a "$LOGFILE"

      # ─────────────── 패키지/코드 검사 ───────────────
      - name: 🐍 pip-audit (auto)
        run: |
          set -e
          echo "[ECHO] pip-audit 사전 점검"
          if ls requirements*.txt pyproject.toml Pipfile.lock poetry.lock 2>/dev/null | grep -q .; then
            echo "[ECHO] pip-audit 실행"
            (pip-audit -f json || true) > "$PKG_DIR/python/pip_audit.json" || echo "{}" > "$PKG_DIR/python/pip_audit.json"
          else
            echo "[ECHO] Python 종속성 파일이 없어 pip-audit 건너뜀"
            echo "{}" > "$PKG_DIR/python/pip_audit.json"
          fi

      - name: 🐍 safety (JSON, 안전 옵션)
        run: |
          set -e
          echo "[ECHO] safety 실행"
          # --full-report와 -o/--json은 상호배타 → JSON만 고정
          (safety check --json || true) > "$PKG_DIR/python/safety.json" || echo "[]" > "$PKG_DIR/python/safety.json"
          [ -s "$PKG_DIR/python/safety.json" ] || echo "[]" > "$PKG_DIR/python/safety.json"
          echo "[ECHO] safety 결과 파일 보장" | tee -a "$LOGFILE"

      - name: 📦 npm audit (auto)
        run: |
          set -e
          echo "[ECHO] npm audit 사전 점검"
          if ls package-lock.json yarn.lock pnpm-lock.yaml 2>/dev/null | grep -q .; then
            echo "[ECHO] npm audit 실행"
            (npm audit --json || true) > "$PKG_DIR/npm/npm_audit.json" || echo "{}" > "$PKG_DIR/npm/npm_audit.json"
            command -v jq >/dev/null 2>&1 && jq '.metadata.vulnerabilities // {}' "$PKG_DIR/npm/npm_audit.json" 2>/dev/null || true
          else
            echo "[ECHO] JS 락파일이 없어 npm audit 건너뜀"
            echo "{}" > "$PKG_DIR/npm/npm_audit.json"
          fi

      - name: 🔍 Semgrep (로컬 전용, 결과 보장)
        if: env.ENABLE_SEMGREP == 'true'
        run: |
          set -e
          echo "[ECHO] Semgrep 실행 (p/ci, 로컬 전용)"
          (semgrep ci --config p/ci --json --sarif --no-git-ignore --error || true) \
            1> "$CODE_DIR/semgrep/semgrep.json" \
            2> "$CODE_DIR/semgrep/semgrep.log"
          [ -s "$CODE_DIR/semgrep/semgrep.json" ] || echo '{"results":[]}' > "$CODE_DIR/semgrep/semgrep.json"
          echo "[ECHO] Semgrep 결과 생성" | tee -a "$LOGFILE"

      # ─────────────── DC 실행 ───────────────
      - name: 🔎 DC 실행 (JSON+HTML, 다중 --format, fail-safe, echo/복사 보장)
        run: |
          set -e
          echo "[ECHO] DC 실행 단계 시작" | tee -a "$LOGFILE"
          mkdir -p "$PKG_DIR/dc" "$EXPORT_DIR/json" "$EXPORT_DIR/html"
          if [ "${DC_READY:-false}" != "true" ]; then
            echo "[WARN] DC_READY=false → 실행 생략, 자리표시자 유지" | tee -a "$LOGFILE"
          else
            if ! "${DC_HOME}/bin/dependency-check.sh" \
                  --project "BlacklistScan" \
                  --scan . \
                  --format JSON \
                  --format HTML \
                  --out "$PKG_DIR/dc" \
                  --data "$DC_DATA" \
                  --failOnCVSS 0 ; then
              echo "[WARN] DC 실행 경고/오류 발생(계속 진행)" | tee -a "$LOGFILE"
            fi
            [ -f "$PKG_DIR/dc/dependency-check-report.json" ] && mv -f "$PKG_DIR/dc/dependency-check-report.json" "$PKG_DIR/dc/dc_report.json"
            [ -f "$PKG_DIR/dc/dependency-check-report.html" ] && mv -f "$PKG_DIR/dc/dependency-check-report.html" "$PKG_DIR/dc/dc_report.html"
          fi
          [ -f "$PKG_DIR/dc/dc_report.json" ] || echo "{}" > "$PKG_DIR/dc/dc_report.json"
          [ -f "$PKG_DIR/dc/dc_report.html" ] || echo "<html><body>no report</body></html>" > "$PKG_DIR/dc/dc_report.html"
          cp -f "$PKG_DIR/dc/dc_report.json" "$EXPORT_DIR/json/dc_report.json" || true
          cp -f "$PKG_DIR/dc/dc_report.html" "$EXPORT_DIR/html/dc_report.html" || true
          echo "[ECHO] DC 실행/표준화/복사 완료" | tee -a "$LOGFILE"

      # ─────────────── 산출물 복제/스냅샷/최신 ───────────────
      - name: 📦 Export & Snapshot copy (cp 보장)
        run: |
          set -e
          echo "[ECHO] 산출물 복제 시작" | tee -a "$LOGFILE"
          # Export 채우기
          cp -f "$NET_DIR/all/ip_blacklist_spamhaus.txt" "$EXPORT_DIR/txt/ip_blacklist_spamhaus.txt" 2>/dev/null || echo -n > "$EXPORT_DIR/txt/ip_blacklist_spamhaus.txt"
          cp -f "$NET_DIR/all/ip_blacklist_et.txt"       "$EXPORT_DIR/txt/ip_blacklist_et.txt" 2>/dev/null || echo -n > "$EXPORT_DIR/txt/ip_blacklist_et.txt"
          cp -f "$PKG_DIR/python/pip_audit.json"         "$EXPORT_DIR/json/pip_audit.json" || echo "{}" > "$EXPORT_DIR/json/pip_audit.json"
          cp -f "$PKG_DIR/python/safety.json"            "$EXPORT_DIR/json/safety.json" || echo "[]" > "$EXPORT_DIR/json/safety.json"
          cp -f "$PKG_DIR/npm/npm_audit.json"            "$EXPORT_DIR/json/npm_audit.json" || echo "{}" > "$EXPORT_DIR/json/npm_audit.json"
          cp -f "$CODE_DIR/semgrep/semgrep.json"         "$EXPORT_DIR/json/semgrep.json" || echo '{"results":[]}' > "$EXPORT_DIR/json/semgrep.json"

          # Snapshot 디렉터리로 복제
          rsync -a --delete "$EXPORT_DIR"/ "$SNAP_DIR/export/" 2>/dev/null || mkdir -p "$SNAP_DIR/export"
          rsync -a --delete "$NET_DIR"/    "$SNAP_DIR/networks/" 2>/dev/null || mkdir -p "$SNAP_DIR/networks"
          rsync -a --delete "$PKG_DIR"/    "$SNAP_DIR/packages/" 2>/dev/null || mkdir -p "$SNAP_DIR/packages"
          rsync -a --delete "$CODE_DIR"/   "$SNAP_DIR/code/" 2>/dev/null || mkdir -p "$SNAP_DIR/code"
          echo "[ECHO] 산출물 복제 완료" | tee -a "$LOGFILE"

      - name: 🧾 요약 파일 생성 (jq 사용 · 안전한 JSON/MD · echo 보장)
        run: |
          set -euo pipefail
          shopt -s nullglob

          echo "[ECHO] 요약 파일 생성 시작" | tee -a "$LOGFILE"

          SUMMARY_JSON="$SUMMARY_DIR/summary_${RUN_DATE_UTC}.json"
          SUMMARY_MD="$SUMMARY_DIR/summary_${RUN_DATE_UTC}.md"

          SPAM_FILE="$NET_DIR/all/ip_blacklist_spamhaus.txt"
          ET_FILE="$NET_DIR/all/ip_blacklist_et.txt"

          if [ -f "$SPAM_FILE" ]; then SPAM_CT="$(wc -l < "$SPAM_FILE" | tr -d '[:space:]')"; else SPAM_CT="0"; fi
          if [ -f "$ET_FILE" ]; then ET_CT="$(wc -l < "$ET_FILE" | tr -d '[:space:]')"; else ET_CT="0"; fi

          jq -n --arg run "$RUN_DATE_UTC" \
                --argjson spam "${SPAM_CT:-0}" \
                --argjson et "${ET_CT:-0}" \
                '{ run_at_utc: $run, spamhaus_count: $spam, et_count: $et, files: {} }' > "$SUMMARY_JSON"

          mapfile -t FILES < <(find "$EXPORT_DIR" -type f -print 2>/dev/null; [ -f "$PKG_DIR/dc/dc_report.html" ] && echo "$PKG_DIR/dc/dc_report.html" || true)

          for f in "${FILES[@]}"; do
            rel="${f#./}"
            sz="$(wc -c < "$f" | tr -d '[:space:]' || echo 0)"
            tmp="${SUMMARY_JSON}.tmp"
            jq --arg k "$rel" --argjson v "${sz:-0}" '.files[$k] = $v' "$SUMMARY_JSON" > "$tmp" && mv "$tmp" "$SUMMARY_JSON"
          done

          {
            echo "# Blacklist Summary (${RUN_DATE_UTC})"
            echo
            echo "- Spamhaus: ${SPAM_CT} IPs"
            echo "- EmergingThreats: ${ET_CT} IPs"
            echo
            echo "## Files (bytes)"
            for f in "${FILES[@]}"; do
              rel="${f#./}"
              sz="$(wc -c < "$f" | tr -d '[:space:]' || echo 0)"
              echo "- ${rel}: ${sz}"
            done
          } > "$SUMMARY_MD"

          [ -s "$SUMMARY_JSON" ] || echo '{"run_at_utc":"'${RUN_DATE_UTC}'","spamhaus_count":0,"et_count":0,"files":{}}' > "$SUMMARY_JSON"
          [ -s "$SUMMARY_MD" ] || { echo "# Blacklist Summary (${RUN_DATE_UTC})"; echo; echo "- Spamhaus: 0 IPs"; echo "- EmergingThreats: 0 IPs"; } > "$SUMMARY_MD"

          echo "[ECHO] 요약 파일 생성 완료 → $SUMMARY_JSON, $SUMMARY_MD" | tee -a "$LOGFILE"

      - name: 🏷 최신(LATEST) 갱신
        run: |
          set -e
          echo "[ECHO] LATEST 디렉터리 갱신" | tee -a "$LOGFILE"
          rsync -a --delete "$EXPORT_DIR"/ "$LATEST_DIR/export/" 2>/dev/null || mkdir -p "$LATEST_DIR/export"
          rsync -a --delete "$NET_DIR"/    "$LATEST_DIR/networks/" 2>/dev/null || mkdir -p "$LATEST_DIR/networks"
          rsync -a --delete "$PKG_DIR"/    "$LATEST_DIR/packages/" 2>/dev/null || mkdir -p "$LATEST_DIR/packages"
          rsync -a --delete "$CODE_DIR"/   "$LATEST_DIR/code/" 2>/dev/null || mkdir -p "$LATEST_DIR/code"
          echo "# Latest Index ($(date -u +%F\ %TZ))" > "$LATEST_DIR/index.md"
          echo "[ECHO] 최신 갱신 완료" | tee -a "$LOGFILE"

      - name: 🧪 변경사항 검사 및 자동 커밋/푸시
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@users.noreply.github.com
        run: |
          set -e
          echo "[ECHO] 변경사항 검사 시작" | tee -a "$LOGFILE"
          git add -A
          if ! git diff --cached --quiet; then
            echo "[ECHO] 변경사항 감지 → 커밋/푸시" | tee -a "$LOGFILE"
            git commit -m "chore(blacklist): auto update at ${RUN_DATE_UTC}"
            git push || { echo "[WARN] git push 실패(권한/브랜치 보호?) — 무시"; true; }
          else
            echo "[ECHO] 변경사항 없음" | tee -a "$LOGFILE"
          fi

      - name: ✅ 완료 로그
        run: |
          echo "[ECHO] ===== 결과 요약(콘솔) ====="
          for f in "$EXPORT_DIR"/**/* "$PKG_DIR/dc/dc_report.html" 2>/dev/null; do
            [ -f "$f" ] || continue
            sz=$(wc -c < "$f" 2>/dev/null || echo 0)
            echo "[ECHO] 파일: $(echo "$f" | sed 's#^./##'), 크기(bytes): ${sz}"
          done
          echo "[ECHO] ==========================="
