name: 🏢 MEGA DB Echo FullOps + 설치 + Eco + 실행 통합

on:
  workflow_dispatch:
    inputs:
      COUNT:
        description: "테이블/사용자 수 (default: 100)"
        required: false
        default: "100"
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  mega-echo:
    runs-on: ubuntu-latest
    env:
      COUNT: ${{ github.event.inputs.COUNT || '100' }}

    steps:
      - name: 파일 참조
        uses: actions/checkout@v4

      - name: 개발 가상 개정 + 설치 및 시스템 업그레이드
        run: |
          sudo apt-get update -y && sudo apt-get upgrade -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server sqlite3 postgresql-client net-tools ufw curl unzip default-jdk
          sudo apt-get install -y gnupg2 openjdk-11-jdk lsof jq || true
          
          sudo sed -i 's/^bind-address.*/bind-address = 0.0.0.0/' /etc/mysql/mysql.conf.d/mysqld.cnf || true
          sudo systemctl restart mysql || sudo service mysql restart

          # Echo directories
          mkdir -p .github/echo_db/{preinit,echo_mysql,permissions,firewall,logs,run_scripts,backup,sarif,stats,grants,results,upgrade,
                                  elk,kafka,dwh,bteq,sqlite,postgres,accounts,passwords,install_notes,
                                  echo_table,echo_sql,echo_user,echo_grant,echo_drop,echo_alter,echo_truncate,echo_analyze,verify,
                                  minio,nifi,spark,camunda,vault,logstash,install_logs}

          echo "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpass123'; FLUSH PRIVILEGES;" > .github/echo_db/preinit/mysql_root_password.sql

          sudo mysql < .github/echo_db/preinit/mysql_root_password.sql

          echo '[client]' > .github/echo_db/echo_mysql/my.cnf
          echo 'user=root' >> .github/echo_db/echo_mysql/my.cnf
          echo 'password=rootpass123' >> .github/echo_db/echo_mysql/my.cnf
          echo 'host=127.0.0.1' >> .github/echo_db/echo_mysql/my.cnf
          echo 'protocol=TCP' >> .github/echo_db/echo_mysql/my.cnf

          echo "echo 'MYSQL PASSWORD: rootpass123'" > .github/echo_db/permissions/mysql_password_echo.sh
          echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf -e \"SHOW GRANTS FOR 'root'@'localhost';\" | tee .github/echo_db/permissions/root_grants.txt" >> .github/echo_db/permissions/mysql_password_echo.sh
          chmod +x .github/echo_db/permissions/mysql_password_echo.sh
          bash .github/echo_db/permissions/mysql_password_echo.sh

          echo "ufw status" > .github/echo_db/firewall/firewall_check.sh
          echo "netstat -tuln | grep 3306" >> .github/echo_db/firewall/firewall_check.sh
          chmod +x .github/echo_db/firewall/firewall_check.sh
          bash .github/echo_db/firewall/firewall_check.sh | tee .github/echo_db/firewall/firewall_status.log

          sudo netstat -tuln | tee .github/echo_db/firewall/netstat_output.txt
          sudo ufw status verbose | tee .github/echo_db/firewall/ufw_status_verbose.txt

          echo "[OK] MySQL root 권한 바이더 구성, 패스워드 확인, 방화범 보조 echo 완료"

      - name: 테이블/계정/사용자 자동 생성 + 확인 시스템
        run: |
          for d in echo_table echo_sql echo_user echo_grant echo_drop echo_alter echo_truncate echo_analyze echo_run_scripts echo_accounts echo_passwords verify; do
            mkdir -p ".github/echo_db/$d"
          done

          for i in $(seq 1 $COUNT); do
            T="mega_table_$i"
            U="user_$i"
            PW="pw_$i"
            echo "CREATE TABLE IF NOT EXISTS $T (id INT PRIMARY KEY AUTO_INCREMENT, value VARCHAR(255));" > .github/echo_db/echo_table/$T.sql
            echo "INSERT INTO $T(value) VALUES('sample_data_$i');" > .github/echo_db/echo_sql/insert_$T.sql
            echo "SELECT * FROM $T;" > .github/echo_db/echo_sql/select_$T.sql
            echo "CREATE USER IF NOT EXISTS '$U'@'%' IDENTIFIED BY '$PW';" > .github/echo_db/echo_user/$U.sql
            echo "GRANT SELECT, INSERT ON $T TO '$U'@'%';" > .github/echo_db/echo_grant/grant_$U.sql
            echo "SHOW GRANTS FOR '$U'@'%';" > .github/echo_db/grants/grants_$U.sql
            echo "DROP TABLE IF EXISTS $T;" > .github/echo_db/echo_drop/drop_$T.sql
            echo "ALTER TABLE $T ADD COLUMN created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP;" > .github/echo_db/echo_alter/alter_$T.sql
            echo "TRUNCATE TABLE $T;" > .github/echo_db/echo_truncate/trunc_$T.sql
            echo "ANALYZE TABLE $T;" > .github/echo_db/echo_analyze/analyze_$T.sql

            echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf -e \"$(cat .github/echo_db/echo_user/$U.sql)\" || echo '[WARN] Create user failed'" >> .github/echo_db/run_scripts/init_user.sh
            echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf -e \"$(cat .github/echo_db/echo_grant/grant_$U.sql)\" || echo '[WARN] Grant failed'" >> .github/echo_db/run_scripts/init_grant.sh
            echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf -e \"SELECT user FROM mysql.user WHERE user='$U';\" | tee .github/echo_db/verify/verify_user_$U.txt" >> .github/echo_db/run_scripts/init_verify.sh
          done
          chmod +x .github/echo_db/run_scripts/*.sh

      - name: 필수 보조 - MinIO, Spark, NiFi, Camunda, Vault, Logstash
        run: |
          echo "도구 설치 로그 저장 중..." > .github/echo_db/install_logs/init.log
          echo "curl -O https://dl.min.io/server/minio/release/linux-amd64/minio" >> .github/echo_db/install_logs/init.log
          echo "curl -O https://downloads.apache.org/nifi/latest/nifi-1.24.0-bin.zip" >> .github/echo_db/install_logs/init.log
          echo "curl -O https://downloads.apache.org/spark/spark-3.5.0/spark-3.5.0-bin-hadoop3.tgz" >> .github/echo_db/install_logs/init.log
          echo "curl -O https://downloads.camunda.cloud/release/camunda-bpm/tomcat/camunda-bpm-tomcat-7.20.0.zip" >> .github/echo_db/install_logs/init.log
          echo "curl -O https://releases.hashicorp.com/vault/1.13.3/vault_1.13.3_linux_amd64.zip" >> .github/echo_db/install_logs/init.log
          echo "apt-get install -y logstash || echo 'logstash install failed'" >> .github/echo_db/install_logs/init.log

      - name: 결과 목록 보건
        run: |
          find .github/echo_db -type f | sort | while read f; do
            echo "--- $f"
            cat "$f" || echo "(읽기 실패)"
          done
