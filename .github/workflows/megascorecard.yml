name: 🛡️ MEGA Scorecard + EchoOps + SARIF + Monitoring

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '16 11 * * 2'  # 매주 화요일 Scorecard 실행
    - cron: '*/3 * * * *'  # 3분마다 EchoOps 실행
  workflow_dispatch:
  branch_protection_rule:

permissions: read-all

jobs:
  scorecard-analysis:
    name: ✅ Scorecard 분석 및 업로드
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: 📂 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🔍 Scorecard 분석 실행
        uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: ☁️ GitHub Code Scanning 업로드
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: 📄 SARIF 파일 아티팩트로 저장
        uses: actions/upload-artifact@v4
        with:
          name: Scorecard-SARIF
          path: results.sarif
          retention-days: 5

  post-analysis-echo:
    name: 🔧 EchoOps + SARIF 복사 + 파일 용량 분석
    runs-on: ubuntu-latest
    needs: scorecard-analysis
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'

    steps:
      - name: 📂 코드 체크아웃
        uses: actions/checkout@v4

      - name: 📥 이전 Scorecard SARIF 다운로드
        uses: actions/download-artifact@v4
        with:
          name: Scorecard-SARIF

      - name: 📁 echo 디렉토리 자동 생성
        run: |
          for d in echo_dirs echo_scorecard echo_monitoring echo_pages; do
            mkdir -p ".github/${d}"
            echo "echo '[ECHO] 디렉토리 생성: .github/${d}'" >> .github/${d}/create_dirs.sh
          done

      - name: 🌐 SARIF → GitHub Pages 준비 디렉토리 복사
        run: |
          mkdir -p site/scorecard
          cp results.sarif site/scorecard/scorecard-results.sarif
          echo "echo '[ECHO] SARIF 복사 완료 → site/scorecard'" >> .github/echo_pages/copy_scorecard_sarif.sh

      - name: 📦 대용량 파일 및 총 디렉토리 용량 분석
        run: |
          mkdir -p .github/echo_monitoring
          (du -ah . | sort -hr | head -n 30) > .github/echo_monitoring/top_file_sizes.txt || true
          du -sh . > .github/echo_monitoring/total_size.txt || true
          echo "echo '[ECHO] 파일 용량 분석 완료'" >> .github/echo_monitoring/file_size_check.sh

      - name: 🧪 SARIF 프리뷰 (선택 로그)
        run: |
          echo "SARIF 파일 상위 50줄 출력:"
          head -n 50 results.sarif || echo "SARIF 파일 없음"
