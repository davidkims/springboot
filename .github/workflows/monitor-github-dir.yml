name: 📊 .github 실시간 모니터링

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *' # 매 10분마다 실행 (원하면 수정 가능)

permissions:
  contents: read
  pull-requests: write

jobs:
  monitor-github-dir:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 📁 Create echo_logs/monitoring directory
        run: |
          mkdir -p .github/echo_logs/monitoring

      - name: 📦 .github 폴더 크기, 개별 파일 크기 측정
        run: |
          echo "[FILE SIZE] .github 내 파일 크기 목록" > .github/echo_logs/monitoring/github_file_sizes.txt
          du -ah .github | sort -hr | tee -a .github/echo_logs/monitoring/github_file_sizes.txt
          
          echo "[TOTAL SIZE] .github 전체 용량" > .github/echo_logs/monitoring/github_total_size.txt
          du -sh .github | tee -a .github/echo_logs/monitoring/github_total_size.txt

      - name: 🧠 CPU 및 메모리 사용량 측정
        run: |
          echo "[RESOURCE USAGE] 현재 시스템 자원 상태" > .github/echo_logs/monitoring/system_usage.txt
          echo "🧠 CPU 상태:" >> .github/echo_logs/monitoring/system_usage.txt
          top -b -n 1 | head -n 5 >> .github/echo_logs/monitoring/system_usage.txt
          echo "\n🧠 Memory 상태:" >> .github/echo_logs/monitoring/system_usage.txt
          free -h >> .github/echo_logs/monitoring/system_usage.txt
          echo "\n🧠 Disk 상태:" >> .github/echo_logs/monitoring/system_usage.txt
          df -h >> .github/echo_logs/monitoring/system_usage.txt
          cat .github/echo_logs/monitoring/system_usage.txt

      - name: 📤 Upload monitoring logs
        uses: actions/upload-artifact@v4
        with:
          name: github-monitoring-report
          path: |
            .github/echo_logs/monitoring/github_file_sizes.txt
            .github/echo_logs/monitoring/github_total_size.txt
            .github/echo_logs/monitoring/system_usage.txt

      - name: 💬 PR 코멘트 자동 작성 (선택 사항)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const files = [
              '.github/echo_logs/monitoring/github_file_sizes.txt',
              '.github/echo_logs/monitoring/github_total_size.txt',
              '.github/echo_logs/monitoring/system_usage.txt'
            ];
            let report = '';
            for (const file of files) {
              report += `📄 ${file}\n\`\`\`\n${fs.readFileSync(file, 'utf8')}\n\`\`\`\n`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `📊 .github 디렉토리 실시간 모니터링 결과:\n\n${report}`
            });
