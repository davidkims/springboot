version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/" # 루트 디렉토리에 있는 Docker 이미지 참조
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"

  - package-ecosystem: "github-actions"
    directory: "/" # 워크플로우 루트
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
