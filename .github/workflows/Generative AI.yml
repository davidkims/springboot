# .github/workflows/generative-ai.yml
name: "🧭 Generative AI Catalog + EchoOps + Pages (Full Echo)"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_ID: ${{ github.run_id }}
      LOG_DIR: .github/echo_logs
      PUBLIC_DIR: public
      DATA_SUBDIR: data
      DOCS_SUBDIR: docs

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Configure Pages
        uses: actions/configure-pages@v5

      - name: 🗂 Init dirs & logging
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$PUBLIC_DIR/$DATA_SUBDIR" "$PUBLIC_DIR/$DOCS_SUBDIR"
          exec > >(tee -a "$LOG_DIR/build.log") 2>&1
          echo "[ECHO] STEP START: Init dirs"
          echo "[ECHO] DIR READY: $LOG_DIR"
          echo "[ECHO] DIR READY: $PUBLIC_DIR/$DATA_SUBDIR"
          echo "[ECHO] DIR READY: $PUBLIC_DIR/$DOCS_SUBDIR"

      - name: 📝 Generate Markdown
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO] STEP START: Generate Markdown" | tee -a "$LOG_DIR/build.log"
          cat > "$PUBLIC_DIR/$DOCS_SUBDIR/README_GENAI.md" <<'MD'
# 생성형 AI 종류 총정리 (Echo-Generated)

| 구분 | 기술 방식 | 대표 모델 / 서비스 | 주요 활용 분야 |
|------|-----------|--------------------|----------------|
| 텍스트 생성형 AI | LLM (Transformer) | GPT-3/4/5, Claude, Gemini, LLaMA, Mistral | 대화형 챗봇, 문서 작성, 요약, 번역, 코드 생성 |
| 이미지 생성형 AI | Diffusion / GAN | DALL·E, Stable Diffusion, Midjourney, Adobe Firefly, StyleGAN | 일러스트, 광고 이미지, 콘셉트 아트, 합성 |
| 음악·오디오 생성형 AI | WaveNet/Neural Vocoder/Diffusion | Suno, AIVA, Soundraw, OpenAI TTS, Azure TTS, So-VITS-SVC, RVC | 작곡, TTS, 보이스 체인지, 효과음 |
| 영상·애니메이션 생성형 AI | Diffusion + Video Transformer | Runway Gen-2, Pika, Synthesia, HeyGen | 광고·티저, 애니, 유튜브 콘텐츠 |
| 3D·모델 생성형 AI | NeRF/Point/Mesh | Point-E, Shap-E, Luma AI, Meshy | 게임·메타버스 오브젝트, 3D 디자인 |
| 멀티모달 생성형 AI | Multimodal Transformer | GPT-4o, Gemini Advanced, Claude 3.5 Sonnet(Vision), Kosmos-2 | 텍스트·이미지·음성 통합, 시각 분석 |
| 데이터·코드 생성형 AI | Code LLM/AutoML | GitHub Copilot, Tabnine, Replit Ghostwriter, Amazon CodeWhisperer | 코드·SQL 생성, 리팩터링, 분석 |

> 본 파일은 GitHub Actions EchoOps로 자동 생성되었습니다.
MD
          echo "[ECHO] FILE CREATED: $PUBLIC_DIR/$DOCS_SUBDIR/README_GENAI.md" | tee -a "$LOG_DIR/build.log"

      - name: 📊 Generate JSON
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO] STEP START: Generate JSON" | tee -a "$LOG_DIR/build.log"
          cat > "$PUBLIC_DIR/$DATA_SUBDIR/generative_ai_catalog.json" <<JSON
{
  "generated_at": "$RUN_ID",
  "categories": [
    { "name": "Text", "tech": ["LLM","Transformer"], "models": ["GPT-3/4/5","Claude","Gemini","LLaMA","Mistral"], "use_cases": ["chatbot","writing","summary","translation","code"] },
    { "name": "Image", "tech": ["Diffusion","GAN"], "models": ["DALL·E","Stable Diffusion","Midjourney","Adobe Firefly","StyleGAN"], "use_cases": ["illustration","ad","concept art","compositing"] },
    { "name": "Audio/Music", "tech": ["WaveNet","Neural Vocoder","Diffusion"], "models": ["Suno","AIVA","Soundraw","OpenAI TTS","Azure TTS","So-VITS-SVC","RVC"], "use_cases": ["music","tts","voice conversion","sfx"] },
    { "name": "Video", "tech": ["Diffusion","Video Transformer"], "models": ["Runway Gen-2","Pika","Synthesia","HeyGen"], "use_cases": ["ads","animation","youtube"] },
    { "name": "3D", "tech": ["NeRF","Point","Mesh"], "models": ["Point-E","Shap-E","Luma AI","Meshy"], "use_cases": ["game assets","metaverse","product design"] },
    { "name": "Multimodal", "tech": ["Multimodal Transformer"], "models": ["GPT-4o","Gemini Advanced","Claude 3.5 Sonnet (Vision)","Kosmos-2"], "use_cases": ["text-image-audio integration","vision qa"] },
    { "name": "Data/Code", "tech": ["Code LLM","AutoML"], "models": ["GitHub Copilot","Tabnine","Replit Ghostwriter","Amazon CodeWhisperer"], "use_cases": ["code gen","bug fix","sql","analysis"] }
  ]
}
JSON
          echo "[ECHO] FILE CREATED: $PUBLIC_DIR/$DATA_SUBDIR/generative_ai_catalog.json" | tee -a "$LOG_DIR/build.log"

      - name: 📑 Generate CSV
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO] STEP START: Generate CSV" | tee -a "$LOG_DIR/build.log"
          cat > "$PUBLIC_DIR/$DATA_SUBDIR/generative_ai_catalog.csv" <<'CSV'
category,tech,models,use_cases
Text,"LLM|Transformer","GPT-3/4/5|Claude|Gemini|LLaMA|Mistral","chatbot|writing|summary|translation|code"
Image,"Diffusion|GAN","DALL·E|Stable Diffusion|Midjourney|Adobe Firefly|StyleGAN","illustration|ad|concept art|compositing"
Audio/Music,"WaveNet|Neural Vocoder|Diffusion","Suno|AIVA|Soundraw|OpenAI TTS|Azure TTS|So-VITS-SVC|RVC","music|tts|voice conversion|sfx"
Video,"Diffusion|Video Transformer","Runway Gen-2|Pika|Synthesia|HeyGen","ads|animation|youtube"
3D,"NeRF|Point|Mesh","Point-E|Shap-E|Luma AI|Meshy","game assets|metaverse|product design"
Multimodal,"Multimodal Transformer","GPT-4o|Gemini Advanced|Claude 3.5 Sonnet (Vision)|Kosmos-2","text-image-audio integration|vision qa"
Data/Code,"Code LLM|AutoML","GitHub Copilot|Tabnine|Replit Ghostwriter|Amazon CodeWhisperer","code gen|bug fix|sql|analysis"
CSV
          echo "[ECHO] FILE CREATED: $PUBLIC_DIR/$DATA_SUBDIR/generative_ai_catalog.csv" | tee -a "$LOG_DIR/build.log"

      - name: 🌐 Generate HTML page
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO] STEP START: Generate HTML" | tee -a "$LOG_DIR/build.log"
          cat > "$PUBLIC_DIR/index.html" <<'HTML'
<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generative AI Catalog (EchoOps)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ddd; padding: 8px; }
  th { background: #f5f5f5; }
</style>
<h1>생성형 AI 카탈로그</h1>
<p>이 페이지는 GitHub Actions EchoOps로 자동 생성·배포됩니다.</p>
<div id="table">Loading…</div>
<script>
(async function () {
  const res = await fetch('./data/generative_ai_catalog.json');
  const js = await res.json();
  const rows = js.categories.map(c => `<tr>
    <td>${c.name}</td>
    <td>${(c.tech||[]).join(', ')}</td>
    <td>${(c.models||[]).join(', ')}</td>
    <td>${(c.use_cases||[]).join(', ')}</td>
  </tr>`).join('');
  document.getElementById('table').innerHTML =
    `<table><thead><tr><th>구분</th><th>기술 방식</th><th>대표 모델</th><th>활용 분야</th></tr></thead><tbody>${rows}</tbody></table>`;
})();
</script>
</html>
HTML
          echo "[ECHO] FILE CREATED: $PUBLIC_DIR/index.html" | tee -a "$LOG_DIR/build.log"

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generative-ai-catalog-${{ github.run_id }}
          path: |
            ${{ env.PUBLIC_DIR }}/
            ${{ env.LOG_DIR }}/
          retention-days: 7

      - name: 🌍 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
