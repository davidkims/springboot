name: "🛡️ Scorecard 기반 보안 자동화 + Placeholder 치환 + 자동 PR"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 3 * * 5'

jobs:
  security-check-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Install Scorecard, CodeQL, gh, jq, yq (with upgrade)
        run: |
          sudo apt-get update -y && sudo apt-get upgrade -y
          sudo apt-get install -y curl unzip jq yq gh tree

          echo "[✔️ Install] OSSF Scorecard (정확한 디렉토리 경로)"
          SCORECARD_VERSION="4.10.3"
          curl -LO "https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz"
          tar -xzf "scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz"
          chmod +x "linux_amd64/scorecard"
          sudo mv "linux_amd64/scorecard" /usr/local/bin/scorecard
          scorecard --version

          echo "[✔️ Install] CodeQL CLI"
          CODEQL_VERSION=2.17.5
          curl -L -o codeql.zip "https://github.com/github/codeql-cli-binaries/releases/download/v${CODEQL_VERSION}/codeql-linux64.zip"
          unzip codeql.zip
          sudo mv codeql/codeql /usr/local/bin/codeql
          codeql version

      - name: 📁 Echo 디렉토리 생성
        run: |
          for d in .github/echo_{scorecard/{init,log,result,fix},template,placeholder,permission}; do
            mkdir -p "$d"
          done

      - name: 📊 Run Scorecard and extract low-score items
        run: |
          scorecard --repo=https://github.com/${{ github.repository }} --format=json > .github/echo_scorecard/result/scorecard.json
          jq '.checks[] | select(.score < 5)' .github/echo_scorecard/result/scorecard.json > .github/echo_scorecard/result/scorecard_low.json

      - name: 🧾 Generate SECURITY_FIX.md
        run: |
          echo "# 🔐 Security Improvements (auto-generated)" > SECURITY_FIX.md
          echo "" >> SECURITY_FIX.md
          jq -r '. | "- **\(.name)**: \(.reason) (_score: \(.score))"' .github/echo_scorecard/result/scorecard_low.json >> SECURITY_FIX.md

      - name: 🔁 Replace PLACEHOLDERs in .env/.cfg/.json
        run: |
          echo "DB_USER=PLACEHOLDER" > .github/echo_template/sample.env
          echo "SCORECARD_KEY=PLACEHOLDER" > .github/echo_template/sample.cfg
          echo '{ "key": "PLACEHOLDER" }' > .github/echo_template/sample.json

          mkdir -p .github/echo_placeholder/converted
          sed 's/PLACEHOLDER/admin_user/g' .github/echo_template/sample.env > .github/echo_placeholder/converted/sample.env
          sed 's/PLACEHOLDER/secure_key_123/g' .github/echo_template/sample.cfg > .github/echo_placeholder/converted/sample.cfg
          jq 'walk(if type == "string" and test("PLACEHOLDER") then sub("PLACEHOLDER"; "actual_value") else . end)' .github/echo_template/sample.json > .github/echo_placeholder/converted/sample.json

      - name: 🔀 Commit & PR 생성 (자동)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          BRANCH="security/auto-fix-$(date +%Y%m%d%H%M%S)"
          git checkout -b $BRANCH

          git add SECURITY_FIX.md .github/echo_placeholder/converted/
          git commit -m "🔧 Auto-fix: Scorecard security + placeholder replacement"
          git push origin $BRANCH

          gh pr create --title "🔒 Auto Security Fix & Placeholder PR" \
            --body "This PR was automatically generated from Scorecard results and placeholder replacement." \
            --base main --head $BRANCH
