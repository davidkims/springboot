name: 📡 Workflow Event Monitoring

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Build"
      - "Test"
      - "Deploy"
    types: ["requested", "in_progress", "completed"]

jobs:
  monitor-run:
    runs-on: ubuntu-latest
    steps:
      - name: 📝 Log Workflow Run Details
        run: |
          echo "Event: ${{ github.event.action }}"
          echo "Workflow: ${{ github.event.workflow_run.name }} (#${{ github.event.workflow_run.run_number }})"
          echo "Status: ${{ github.event.workflow_run.status }} / Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "URL: ${{ github.event.workflow_run.html_url }}"

      - name: 📁 Save Run Metadata
        run: |
          printf "Event: %s\nWorkflow: %s #%s\nStatus: %s\nConclusion: %s\nURL: %s\n" \
            "${{ github.event.action }}" \
            "${{ github.event.workflow_run.name }}" \
            "${{ github.event.workflow_run.run_number }}" \
            "${{ github.event.workflow_run.status }}" \
            "${{ github.event.workflow_run.conclusion }}" \
            "${{ github.event.workflow_run.html_url }}" \
          > run-${{ github.event.workflow_run.id }}.txt

      - name: 📂 Upload Run Artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflow-run-${{ github.event.workflow_run.id }}
          path: run-${{ github.event.workflow_run.id }}.txt

      - name: 🔍 List Jobs via API
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs \
            > jobs-${{ github.event.workflow_run.id }}.json

      - name: 📂 Upload Jobs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflow-jobs-${{ github.event.workflow_run.id }}
          path: jobs-${{ github.event.workflow_run.id }}.json
