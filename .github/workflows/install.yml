name: 🏢 MEGA DB EchoOps + 모든 기존 + 업그레이드 통합

on:
  workflow_dispatch:
  schedule:
    - cron: '5,20,35,50 * * * *'

jobs:
  mega-echo:
    runs-on: ubuntu-latest

    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 📁 필수 디렉토리 및 echo 생성
      run: |
        set -e
        for d in echo_{dirs,logs,containers/install,restart}; do
          mkdir -p ".github/${d}"
          echo "echo '[ECHO] 생성된 디렉토리: .github/${d}'" >> .github/echo_dirs/create_dirs.sh
        done
        chmod +x .github/echo_dirs/create_dirs.sh
        .github/echo_dirs/create_dirs.sh

    - name: ⬆️ 모든 패키지 업그레이드
      run: |
        set -e
        echo "echo '[UPGRADE] apt 패키지 업그레이드 시작'" | tee .github/echo_logs/upgrade.log
        sudo apt-get update -y && sudo apt-get upgrade -y | tee -a .github/echo_logs/upgrade.log
        echo "echo '[UPGRADE] 업그레이드 완료 ✅'" >> .github/echo_logs/upgrade.log

    - name: 🚀 컨테이너 생성 및 설치 echo 스크립트 생성
      run: |
        set -e
        declare -a CONTAINERS=(
          "mysql:8.0" "postgres:15" "mongo" "redis" "gvenzl/oracle-xe"
          "mcr.microsoft.com/mssql/server:2022-latest" "nouchka/sqlite3" "cassandra"
          "clickhouse/clickhouse-server" "bitnami/kafka:latest" "rabbitmq:3-management"
          "minio/minio" "prom/prometheus" "vault"
          "camunda/camunda-bpm-platform" "bitnami/spark" "apache/nifi"
          "logstash" "apache/beam_python3.10_sdk" "elasticsearch:7.17.0"
          "bitnami/zookeeper" "grafana/grafana" "apache/airflow" "apache/hive"
          "apache/druid" "trinodb/trino" "apache/superset" "redash/redash"
        )
        declare -a NAMES=(
          "mysql_test" "pg_test" "mongo_test" "redis_test" "oracle_xe"
          "mssql_test" "sqlite_test" "cassandra_test" "clickhouse_test" "kafka_test"
          "rabbitmq_test" "minio_test" "prometheus_test" "vault_test"
          "camunda_test" "spark_test" "nifi_test" "logstash_test" "beam_test" "elastic_test"
          "zookeeper_test" "grafana_test" "airflow_test" "hive_test"
          "druid_test" "trino_test" "superset_test" "redash_test"
        )
        echo "#!/bin/bash" > .github/echo_containers/create_all.sh
        for i in "${!CONTAINERS[@]}"; do
          name="${NAMES[$i]}"
          image="${CONTAINERS[$i]}"
          echo "echo '[CREATE] $name ($image) 생성 중...'" >> .github/echo_containers/create_all.sh
          if [[ "$name" == "oracle_xe" ]]; then
            echo "docker run -d --name $name -e ORACLE_PASSWORD=oracle $image" >> .github/echo_containers/create_all.sh
          elif [[ "$name" == "mssql_test" ]]; then
            echo "docker run -e 'ACCEPT_EULA=Y' -e 'SA_PASSWORD=Strong!Passw0rd' -p 1433:1433 -d --name $name $image" >> .github/echo_containers/create_all.sh
          elif [[ "$name" == "vault_test" ]]; then
            echo "docker run -d --name $name -p 8200:8200 $image server -dev" >> .github/echo_containers/create_all.sh
          elif [[ "$name" == "minio_test" ]]; then
            echo "docker run -d --name $name -p 9000:9000 -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio123 $image server /data" >> .github/echo_containers/create_all.sh
          elif [[ "$name" == "pg_test" ]]; then
            echo "docker run -d --name $name -e POSTGRES_PASSWORD=postgres $image" >> .github/echo_containers/create_all.sh
          elif [[ "$name" == "mysql_test" ]]; then
            echo "docker run -d --name $name -e MYSQL_ROOT_PASSWORD=rootpass123 $image" >> .github/echo_containers/create_all.sh
          else
            echo "docker run -d --name $name $image" >> .github/echo_containers/create_all.sh
          fi
          echo "#!/bin/bash" > .github/echo_containers/install/install_${name}.sh
          echo "echo '[INSTALL] $name 설치 중...'" >> .github/echo_containers/install/install_${name}.sh
          echo "docker exec $name echo '[OK] 내부 명령 실행 (샘플)'" >> .github/echo_containers/install/install_${name}.sh
          echo "if [ \$? -ne 0 ]; then echo '[ERR] $name 컨테이너 명령 실패'; fi" >> .github/echo_containers/install/install_${name}.sh
          chmod +x .github/echo_containers/install/install_${name}.sh
        done
        chmod +x .github/echo_containers/create_all.sh

    - name: ⚙️ 컨테이너 전체 실행
      run: |
        bash .github/echo_containers/create_all.sh | tee .github/echo_logs/container_create.log
        docker ps -a | tee .github/echo_logs/container_ps.log

    - name: ⚙️ 설치 스크립트 실행
      run: |
        for f in .github/echo_containers/install/*.sh; do
          echo "[RUNNING] $f"
          bash "$f" | tee -a .github/echo_logs/install_outputs.log
        done

    - name: 🔁 전체 컨테이너 재시작
      run: |
        echo "#!/bin/bash" > .github/echo_restart/restart_all.sh
        for name in $(docker ps -a --format '{{.Names}}'); do
          echo "echo '[RESTART] $name 컨테이너 재시작'" >> .github/echo_restart/restart_all.sh
          echo "docker restart $name || echo '[WARN] $name 재시작 실패 또는 없음'" >> .github/echo_restart/restart_all.sh
        done
        chmod +x .github/echo_restart/restart_all.sh
        bash .github/echo_restart/restart_all.sh | tee .github/echo_logs/restart_output.log

    - name: 🔎 실행 결과 검증
      run: |
        echo "[CHECK] docker ps 상태 확인" > .github/echo_logs/final_check.log
        docker ps | tee -a .github/echo_logs/final_check.log
        echo "[DONE] 전체 컨테이너 상태 확인 ✅" >> .github/echo_logs/final_check.log

    - name: 📜 로그 요약
      run: |
        echo "echo '[LOG] 전체 작업 완료: 컨테이너 생성 + 설치 + 재기동 + 업그레이드 ✅]'" > .github/echo_logs/final_summary.sh
        chmod +x .github/echo_logs/final_summary.sh
        .github/echo_logs/final_summary.sh
