# 🗂️ MEGA-DB/거래/계좌/이체/유저/시뮬/설치/권한/대량/운영/유틸/Compose-통합

name: 🗂️ MEGA-DB/거래/계좌/이체/유저/시뮬/설치/권한/대량/운영/유틸/Compose-통합

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  db-echo-mega:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 체크아웃
        uses: actions/checkout@v4

      - name: 📁 모든 echo 디렉토리 및 echo_dir_create.sh 자동 생성
        run: |
          set -e
          mkdir -p .github/echo_db
          echo "#!/bin/bash" > .github/echo_db/echo_dir_create.sh
          for d in \
            .github/echo_db/{dirs,files,logs,scripts,services,compose,homebrew,choco,snap,marketplace,backup,init,test,migration,import,export,serverinfo,errorlog,util,mass_db,mass_script,mass_query,ledger,vaccount,transfer,user,sim,teradata,dwh,ddl,output,image,dockerfile,installer,analytics,parallel,summary,workflow,api,sql_exec,echo_log,result,report,history,metrics,accounting,dispatch,task,upgrade,transfer_exec,select,polestar,firewall,ports,elk,kafka,prometheus}; do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo_db/echo_dir_create.sh
            mkdir -p "$d"
          done
          chmod +x .github/echo_db/echo_dir_create.sh

      - name: 📄 에코 기반 샘플 파일 및 실행기 생성
        run: |
          echo "echo '[에코] 유저 계좌 이체 원장 자동생성 시작'" > .github/echo_db/logs/init_echo.log
          echo "#!/bin/bash" > .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/echo_dir_create.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_users.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_accounts.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_ledgers.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_transfers.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_selects.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_dockerfiles.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_polestar.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_teradata_bteq.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_monitoring_stack.sh" >> .github/echo_db/scripts/full_init_run.sh
          chmod +x .github/echo_db/scripts/full_init_run.sh

      - name: 🚀 BTEQ + Teradata 시뮬레이션 연동
        run: |
          echo "#!/bin/bash" > .github/echo_db/scripts/setup_teradata_bteq.sh
          echo "echo '[Teradata] BTEQ 설치 및 테스트 연동'" >> .github/echo_db/scripts/setup_teradata_bteq.sh
          echo "sudo apt-get install -y bteq || echo '[WARN] BTEQ 설치 실패 (의존성 필요)'" >> .github/echo_db/scripts/setup_teradata_bteq.sh
          echo "echo '.LOGON dbc/user,password;' > .github/echo_db/teradata/sample_query.bteq" >> .github/echo_db/scripts/setup_teradata_bteq.sh
          echo "echo 'SELECT CURRENT_DATE;' >> .github/echo_db/teradata/sample_query.bteq" >> .github/echo_db/scripts/setup_teradata_bteq.sh
          echo "echo '.LOGOFF;' >> .github/echo_db/teradata/sample_query.bteq" >> .github/echo_db/scripts/setup_teradata_bteq.sh
          echo "bteq < .github/echo_db/teradata/sample_query.bteq | tee .github/echo_db/output/teradata_output.txt || true" >> .github/echo_db/scripts/setup_teradata_bteq.sh
          chmod +x .github/echo_db/scripts/setup_teradata_bteq.sh

      - name: 📡 Kafka / ELK / Prometheus 연동 + 에코 설정
        run: |
          echo "#!/bin/bash" > .github/echo_db/scripts/setup_monitoring_stack.sh
          echo "echo '[Monitoring] Kafka/ELK/Prometheus 연동 시작'" >> .github/echo_db/scripts/setup_monitoring_stack.sh
          echo "sudo apt-get install -y kafka prometheus elasticsearch || echo '[WARN] 일부 패키지 설치 실패 (미러 점검 필요)'" >> .github/echo_db/scripts/setup_monitoring_stack.sh
          echo "echo '9200: Elasticsearch' > .github/echo_db/ports/elk_ports.txt" >> .github/echo_db/scripts/setup_monitoring_stack.sh
          echo "echo '9092: Kafka Broker' >> .github/echo_db/ports/kafka_ports.txt" >> .github/echo_db/scripts/setup_monitoring_stack.sh
          echo "echo '9090: Prometheus Server' >> .github/echo_db/ports/prometheus_ports.txt" >> .github/echo_db/scripts/setup_monitoring_stack.sh
          echo "echo 'Allow 9200, 9092, 9090 from 127.0.0.1/32' > .github/echo_db/firewall/allowed_ports.txt" >> .github/echo_db/scripts/setup_monitoring_stack.sh
          echo "echo 'sudo ufw allow 9200/tcp' >> .github/echo_db/scripts/setup_monitoring_stack.sh" >> .github/echo_db/scripts/setup_monitoring_stack.sh
          echo "echo 'sudo ufw allow 9092/tcp' >> .github/echo_db/scripts/setup_monitoring_stack.sh" >> .github/echo_db/scripts/setup_monitoring_stack.sh
          echo "echo 'sudo ufw allow 9090/tcp' >> .github/echo_db/scripts/setup_monitoring_stack.sh" >> .github/echo_db/scripts/setup_monitoring_stack.sh
          chmod +x .github/echo_db/scripts/setup_monitoring_stack.sh
          bash .github/echo_db/scripts/setup_monitoring_stack.sh

      - name: 🏷️ 모든 에코 출력 표시
        run: |
          echo "[ECHO] 모든 에코 출력을 덤프합니다"
          find .github/echo_db -type f | sort | while read f; do
            echo "-----"
            echo "[파일] $f"
            cat "$f"
            echo
          done
