name: 📦 전체 경로 ZIP 백업/에코 자동화 (.github + 프로젝트 전체 + 커스텀 폴더/파일)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'  # 매일 04:00 자동 실행

jobs:
  full-zip-backup:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 📁 에코/백업/로그/에코파일 대량 생성 (최상위 우선 생성)
        run: |
          # 에코 디렉토리 우선 생성
          echo "echo 'mkdir -p .github/echo_zip'" | tee .github/echo_dirs_init.sh
          mkdir -p .github/echo_zip

          # 대량 디렉토리 및 에코파일 생성
          DIRS=".github/echo_zip .github/zip_backup .github/echo_logs .github/echo_zip/extra1 .github/echo_zip/extra2 .github/echo_logs/archive"
          for d in $DIRS; do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo_zip/echo_dirs.sh
            mkdir -p "$d"
          done
          ECHO_FILES=".github/echo_zip/echo_dirs.sh .github/echo_zip/ls_echo_zip.sh .github/echo_zip/zip_backup_template.sh .github/echo_zip/echo_init.sh"
          for f in $ECHO_FILES; do
            echo "echo '에코 파일 생성: $f'" | tee -a .github/echo_zip/echo_files_created.log
            touch "$f"
          done

      - name: 🗂️ [1] .github 전체 ZIP 백업/에코/로그
        run: |
          TS=$(date +%Y%m%d_%H%M%S)
          ZIP_FILE=".github/zip_backup/github_only_$TS.zip"
          ECHO_SH=".github/echo_zip/zip_github_only_$TS.sh"
          LOG_FILE=".github/echo_logs/zip_github_only_$TS.log"

          echo "echo 'zip -r $ZIP_FILE .github'" | tee -a "$ECHO_SH"
          echo "zip -r $ZIP_FILE .github" >> "$ECHO_SH"

          echo "[INFO] $(date '+%F %T') zip -r $ZIP_FILE .github" | tee -a "$LOG_FILE"
          zip -r "$ZIP_FILE" .github | tee -a "$LOG_FILE"

          echo "echo '[OK] .github 전체 백업 → $ZIP_FILE'" | tee -a "$ECHO_SH"
          echo "[OK] $(date '+%F %T') 백업 완료: $ZIP_FILE" | tee -a "$LOG_FILE"
          chmod +x "$ECHO_SH"

      - name: 🗂️ [2] 저장소 루트 전체(모든 폴더/파일) ZIP 백업/에코/로그
        run: |
          TS=$(date +%Y%m%d_%H%M%S)
          ZIP_FILE=".github/zip_backup/repo_root_full_$TS.zip"
          ECHO_SH=".github/echo_zip/zip_repo_root_full_$TS.sh"
          LOG_FILE=".github/echo_logs/zip_repo_root_full_$TS.log"

          # .git, .github/zip_backup 등 백업에서 제외하려면 --exclude='경로' 추가 가능
          echo "echo 'zip -r $ZIP_FILE .'" | tee -a "$ECHO_SH"
          echo "zip -r $ZIP_FILE ." >> "$ECHO_SH"

          echo "[INFO] $(date '+%F %T') zip -r $ZIP_FILE ." | tee -a "$LOG_FILE"
          zip -r "$ZIP_FILE" . | tee -a "$LOG_FILE"

          echo "echo '[OK] 저장소 루트 전체 백업 → $ZIP_FILE'" | tee -a "$ECHO_SH"
          echo "[OK] $(date '+%F %T') 루트 전체 백업 완료: $ZIP_FILE" | tee -a "$LOG_FILE"
          chmod +x "$ECHO_SH"

      - name: 🗂️ [3] 주요 폴더 개별 ZIP 백업 (src, config 등)
        run: |
          TS=$(date +%Y%m%d_%H%M%S)
          for dir in src config app scripts docs; do
            if [ -d "$dir" ]; then
              ZIP_FILE=".github/zip_backup/${dir}_$TS.zip"
              ECHO_SH=".github/echo_zip/zip_${dir}_$TS.sh"
              LOG_FILE=".github/echo_logs/zip_${dir}_$TS.log"

              echo "echo 'zip -r $ZIP_FILE $dir'" | tee -a "$ECHO_SH"
              echo "zip -r $ZIP_FILE $dir" >> "$ECHO_SH"
              echo "[INFO] $(date '+%F %T') zip -r $ZIP_FILE $dir" | tee -a "$LOG_FILE"
              zip -r "$ZIP_FILE" "$dir" | tee -a "$LOG_FILE"
              echo "echo '[OK] $dir 폴더 백업 → $ZIP_FILE'" | tee -a "$ECHO_SH"
              echo "[OK] $(date '+%F %T') $dir 폴더 백업 완료: $ZIP_FILE" | tee -a "$LOG_FILE"
              chmod +x "$ECHO_SH"
            fi
          done

      - name: 📋 전체 백업 결과/에코 파일/로그 확인 (에코)
        run: |
          echo "echo 'ls -al .github/zip_backup'" | tee -a .github/echo_zip/ls_zip_backup.sh
          ls -al .github/zip_backup | tee -a .github/echo_logs/ls_zip_backup.log

          echo "echo 'ls -al .github/echo_zip'" | tee -a .github/echo_zip/ls_echo_zip.sh
          ls -al .github/echo_zip | tee -a .github/echo_logs/ls_echo_zip.log

          echo "echo 'ls -al .github/echo_logs'" | tee -a .github/echo_zip/ls_echo_logs.sh
          ls -al .github/echo_logs | tee -a .github/echo_logs/ls_echo_logs.log

          echo "echo 'cat .github/echo_zip/echo_dirs.sh'" | tee -a .github/echo_zip/ls_echo_zip.sh
          cat .github/echo_zip/echo_dirs.sh | tee -a .github/echo_logs/ls_echo_zip.log
