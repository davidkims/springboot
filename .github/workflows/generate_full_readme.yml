name: 🧾 Update README with Portfolio + Workflow Stats

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_readme:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub CLI 인증용 (자동 설정됨)

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Install GitHub CLI
        run: |
          echo "[🔧] GitHub CLI 설치 중..."
          sudo apt-get update
          sudo apt-get install -y gh
          echo "[✅] 설치 완료"

      - name: 📊 Collect Workflow Stats
        run: |
          echo "[📊] 워크플로우 통계 수집 중..."
          mkdir -p .tmp
          OUTPUT_FILE=".tmp/workflows.md"
          echo "## ⚙️ GitHub Actions 워크플로우 목록 및 통계" > "$OUTPUT_FILE"
          echo "" >> "$OUTPUT_FILE"
          echo "| 워크플로우 이름 | 실행 수 | 성공 수 | 실패 수 | 성공률 |" >> "$OUTPUT_FILE"
          echo "|----------------|--------:|--------:|--------:|--------:|" >> "$OUTPUT_FILE"

          for f in .github/workflows/*.yml; do
            NAME=$(grep '^name:' "$f" | head -n1 | cut -d ':' -f2- | xargs)
            FILENAME=$(basename "$f")
            echo "[🔍] 처리 중: $NAME ($FILENAME)"

            RUNS=$(gh run list --workflow="$FILENAME" --limit 100 --json conclusion -q '.[] | .conclusion' || echo "")
            TOTAL=$(echo "$RUNS" | wc -l)
            SUCCESS=$(echo "$RUNS" | grep -c "success" || true)
            FAILURE=$(($TOTAL - $SUCCESS))
            if [ "$TOTAL" -gt 0 ]; then
              RATE=$(awk "BEGIN {printf \"%.1f\", ($SUCCESS/$TOTAL)*100}")
            else
              RATE="N/A"
            fi

            echo "| $NAME | $TOTAL | $SUCCESS | $FAILURE | $RATE% |" >> "$OUTPUT_FILE"
          done

          cat "$OUTPUT_FILE"

      - name: 🧾 Generate README.md
        run: |
          echo "[📄] README.md 생성 중..."
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S KST')
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"

          {
            echo "# 👨‍💻 김병권 포트폴리오"
            echo ""
            echo "자동으로 관리되는 프로젝트입니다. 매 시간 정각에 업데이트됩니다."
            echo ""
            echo "## 🧑‍💻 개발자 소개"
            echo "- 이름: 김병권"
            echo "- 스택: Python, Java, FastAPI, Spring Boot, GitHub Actions 등"
            echo ""
            echo "## 📅 마지막 업데이트"
            echo "- $TIMESTAMP"
            echo ""
            echo "## ✅ 현재 브랜치"
            echo "- $BRANCH"
            echo ""
            echo "## 🔧 빌드 상태 배지"
            echo "![Build](https://github.com/${REPO}/actions/workflows/update-readme.yml/badge.svg)"
            echo ""
            cat .tmp/workflows.md
          } > README.md

      - name: 📤 Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --exit-code --quiet README.md; then
            echo "[⏭️] 변경사항 없음"
          else
            echo "[✅] 변경사항 감지됨 - 푸시 중"
            git add README.md
            git commit -m "Docs: Update README with workflow stats [skip ci]"
            git push
          fi
