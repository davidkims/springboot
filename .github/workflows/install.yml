# 🗂️ MEGA-DB/거래/계좌/이체/유저/시뮬/설치/권한/대량/운영/유틸/Compose-통합

name: 🗂️ MEGA-DB/거래/계좌/이체/유저/시뮬/설치/권한/대량/운영/유틸/Compose-통합

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  db-echo-mega:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 체크아웃
        uses: actions/checkout@v4

      - name: 📁 모든 echo 이벤트 및 echo_dir_create.sh 자동 생성
        run: |
          set -e
          mkdir -p .github/echo_db
          echo "#!/bin/bash" > .github/echo_db/echo_dir_create.sh
          for d in \
            .github/echo_db/{dirs,files,logs,scripts,services,compose,homebrew,choco,snap,marketplace,backup,init,test,migration,import,export,serverinfo,errorlog,util,mass_db,mass_script,mass_query,ledger,vaccount,transfer,user,sim,teradata,dwh,ddl,output,image,dockerfile,installer,analytics,parallel,summary,workflow,api,sql_exec,echo_log,result,report,history,metrics,accounting,dispatch,task,upgrade,transfer_exec,select,polestar,kafka,elk,prometheus,grafana,ports,firewall}; do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo_db/echo_dir_create.sh
            mkdir -p "$d"
          done
          chmod +x .github/echo_db/echo_dir_create.sh

      - name: 📄 친환경 기반 파일 및 실행기 생성
        run: |
          echo "echo '[에코] 사용자 당연한 이체 원장 자동생성 시작'" > .github/echo_db/logs/init_echo.log
          echo "#!/bin/bash" > .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/echo_dir_create.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_users.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_accounts.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_ledgers.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_transfers.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_selects.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_dockerfiles.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_polestar.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_kafka.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_elk.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_prometheus.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_grafana.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_compose.sh" >> .github/echo_db/scripts/full_init_run.sh
          chmod +x .github/echo_db/scripts/full_init_run.sh

      - name: 🧱 Docker Compose + Kafka/ELK/Grafana 설정
        run: |
          echo "version: '3.8'" > .github/echo_db/compose/full_stack.yml
          echo "services:" >> .github/echo_db/compose/full_stack.yml
          echo "  kafka:" >> .github/echo_db/compose/full_stack.yml
          echo "    image: bitnami/kafka:latest" >> .github/echo_db/compose/full_stack.yml
          echo "    ports: [\"9092:9092\"]" >> .github/echo_db/compose/full_stack.yml
          echo "  elasticsearch:" >> .github/echo_db/compose/full_stack.yml
          echo "    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.1" >> .github/echo_db/compose/full_stack.yml
          echo "    environment: [\"discovery.type=single-node\"]" >> .github/echo_db/compose/full_stack.yml
          echo "    ports: [\"9200:9200\"]" >> .github/echo_db/compose/full_stack.yml
          echo "  prometheus:" >> .github/echo_db/compose/full_stack.yml
          echo "    image: prom/prometheus" >> .github/echo_db/compose/full_stack.yml
          echo "    ports: [\"9090:9090\"]" >> .github/echo_db/compose/full_stack.yml
          echo "  grafana:" >> .github/echo_db/compose/full_stack.yml
          echo "    image: grafana/grafana" >> .github/echo_db/compose/full_stack.yml
          echo "    ports: [\"3000:3000\"]" >> .github/echo_db/compose/full_stack.yml

      - name: 🧾 실시간 Kafka 거래 Producer/Consumer 스크립트 생성
        run: |
          echo "#!/bin/bash" > .github/echo_db/kafka/producer.sh
          echo "while true; do echo '{\"tx\":\"transfer\", \"amount\":5000}' | kafka-console-producer.sh --broker-list localhost:9092 --topic transactions; sleep 1; done" >> .github/echo_db/kafka/producer.sh
          chmod +x .github/echo_db/kafka/producer.sh
          echo "#!/bin/bash" > .github/echo_db/kafka/consumer.sh
          echo "kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic transactions --from-beginning" >> .github/echo_db/kafka/consumer.sh
          chmod +x .github/echo_db/kafka/consumer.sh

      - name: 📊 Grafana 대시보드 JSON 자동 생성
        run: |
          echo '{ "dashboard": { "title": "Transaction Dashboard", "panels": [] } }' > .github/echo_db/grafana/dashboard.json

      - name: 🔐 방화벽 및 포트 상태 에코 생성
        run: |
          echo "sudo ufw allow 9092" > .github/echo_db/firewall/kafka_port.sh
          echo "sudo ufw allow 9200" > .github/echo_db/firewall/elk_port.sh
          echo "sudo ufw allow 9090" > .github/echo_db/firewall/prometheus_port.sh
          echo "sudo ufw allow 3000" > .github/echo_db/firewall/grafana_port.sh
          chmod +x .github/echo_db/firewall/*.sh

      - name: 🏷️ 모든 에코 출력표시
        run: |
          echo "[ECHO] 모든 친환경 출력을 버리세요"
          find .github/echo_db -type f | sort | while read f; do
            echo "-----"
            echo "[파일] $f"
            cat "$f"
            echo
          done
