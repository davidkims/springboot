name: Welcome to the Microsoft Generative AI

on:
  pull_request_target:
    types: [opened]

  schedule:
    - cron: '0 * * * *'  # 매시간 정각 실행

  workflow_dispatch:     # 수동 실행 버튼 지원

permissions:
  contents: read
  pull-requests: write

jobs:
  assess-pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Print Environment Info
        run: |
          echo "[🧠] Triggered by: ${{ github.event_name }}"
          echo "[📁] Repository: ${{ github.repository }}"
          echo "[🌿] Branch: ${{ github.ref }}"
          echo "[⏱️] UTC Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
        continue-on-error: true

      - name: 📢 Node.js 설치 확인
        run: echo "[✅] Node.js 설치 완료"

      # ✅ PR 이벤트일 때만 실행
      - name: 🏷️ Add Label and Comment (only for PR trigger)
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const issueAuthor = context.payload.sender.login;
            console.log(`[✍️] PR 작성자: @${issueAuthor}`);
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['needs-review']
            });
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `👋 Thanks for contributing @${issueAuthor}!\n\n✅ Label: \`needs-review\` 추가됨\n📝 팀에서 곧 리뷰 예정입니다!`
            })

      - name: 💤 Skip Add Label (Not PR)
        if: github.event_name != 'pull_request_target'
        run: echo "[⏩] PR 이벤트가 아니므로 'Add Label and Comment' 단계는 생략되었습니다."

      # ✅ PR 이벤트일 때만 실행
      - name: 👥 Auto-assign Reviewer (only for PR trigger)
        if: github.event_name == 'pull_request_target'
        uses: pozil/auto-assign-issue@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: koreyspace

      - name: 💤 Skip Auto-assign Reviewer (Not PR)
        if: github.event_name != 'pull_request_target'
        run: echo "[⏩] PR 이벤트가 아니므로 'Auto-assign Reviewer' 단계는 생략되었습니다."

      - name: 🏁 Echo Done
        run: echo "[🎉] 워크플로우 완료"
