name: 🐍 Secure Python Package Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout source
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Install build & audit tools
        run: |
          echo "[⚙️] Installing build, lint, and security tools..."
          python -m pip install --upgrade pip
          pip install build flake8 black isort mypy pip-audit bandit safety pip-check

      - name: 🧱 Generate pyproject.toml if missing
        run: |
          echo "[🔧] Checking for pyproject.toml..."
          if [ ! -f pyproject.toml ]; then
            echo "[⚠️] pyproject.toml not found. Creating default..."
            echo "[build-system]" > pyproject.toml
            echo "requires = [\"setuptools\", \"wheel\"]" >> pyproject.toml
            echo "build-backend = \"setuptools.build_meta\"" >> pyproject.toml
            echo "[✅] pyproject.toml created."
          else
            echo "[ℹ️] pyproject.toml already exists."
          fi

      - name: 🛠️ Build package
        run: |
          echo "[🏗️] Building package..."
          mkdir -p dist site .github/audit
          python -m build
          echo "[✅] Build complete. Contents of dist/:"
          ls -lh dist/

      - name: 🧪 Run Lint and Type Checks
        run: |
          echo "[🧪] Running lint/type checks..."
          flake8 . || echo "[⚠️] flake8 issues found."
          black . --check || echo "[⚠️] black formatting issues."
          isort . --check-only || echo "[⚠️] isort import ordering issues."
          mypy . || echo "[⚠️] mypy type issues."
          echo "[✅] Lint/type checks complete."

      - name: 🔐 Run pip-audit and save report
        run: |
          echo "[🔐] Running pip-audit..."
          mkdir -p site .github/audit

          if ! pip-audit -f markdown -o site/pip-audit-report.md; then
            echo "[⚠️] pip-audit failed or vulnerabilities found."
          fi

          if [ ! -s site/pip-audit-report.md ]; then
            echo "[ℹ️] No vulnerabilities. Creating empty pip-audit report..."
            echo "# pip-audit report" > site/pip-audit-report.md
            echo "" >> site/pip-audit-report.md
            echo "> ✅ No known vulnerabilities found." >> site/pip-audit-report.md
          fi

          cp site/pip-audit-report.md .github/audit/pip-audit-report.md
          echo "[✅] pip-audit report saved."

      - name: 🛡️ Run Bandit and save report
        run: |
          echo "[🛡️] Running Bandit..."
          mkdir -p site .github/audit
          if ! bandit -r . -f markdown -o site/bandit-report.md; then
            echo "[⚠️] Bandit scan encountered issues."
          fi

          if [ ! -s site/bandit-report.md ]; then
            echo "[ℹ️] No Bandit issues. Creating default report..."
            echo "# Bandit Report" > site/bandit-report.md
            echo "" >> site/bandit-report.md
            echo "> ✅ No issues found by Bandit." >> site/bandit-report.md
          fi

          cp site/bandit-report.md .github/audit/bandit-report.md
          echo "[✅] Bandit report saved."

      - name: 🛡️ Run Safety and save report
        run: |
          echo "[🛡️] Running Safety..."
          mkdir -p site .github/audit
          if ! safety check --full-report > site/safety-report.md; then
            echo "[⚠️] Safety reported issues or failed."
          fi

          if [ ! -s site/safety-report.md ]; then
            echo "[ℹ️] No known vulnerabilities in Safety. Creating empty report..."
            echo "# Safety Report" > site/safety-report.md
            echo "" >> site/safety-report.md
            echo "> ✅ No known vulnerabilities." >> site/safety-report.md
          fi

          cp site/safety-report.md .github/audit/safety-report.md
          echo "[✅] Safety report saved."

      - name: 🛡️ Run pip-check and save report
        run: |
          echo "[🛡️] Running pip-check..."
          mkdir -p site .github/audit

          if ! pip-check > site/pip-check-report.md 2>&1; then
            echo "[⚠️] pip-check reported issues or failed."
          fi

          if [ ! -s site/pip-check-report.md ]; then
            echo "[ℹ️] pip-check passed. Creating empty report..."
            echo "# pip-check Report" > site/pip-check-report.md
            echo "" >> site/pip-check-report.md
            echo "> ✅ All installed packages are valid." >> site/pip-check-report.md
          fi

          cp site/pip-check-report.md .github/audit/pip-check-report.md
          echo "[✅] pip-check report saved."

      - name: 📦 Upload dist/ as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: 📄 Upload audit reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: .github/audit/

      - name: 🌍 Deploy site/ to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
