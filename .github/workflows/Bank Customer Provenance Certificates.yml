name: 🏦 Bank Customer Provenance Certificates + Deploy

on:
  schedule:
    # 매일 자정(UTC)에 실행되도록 스케줄 설정 (필요에 따라 조정 가능)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 허용

permissions:
  contents: write    # 파일 생성 및 커밋 권한
  id-token: write    # OIDC 토큰 발급 권한 (Provenance 서명에 필요)
  attestations: write # Provenance 증명서 생성 및 저장 권한
  pages: write       # GitHub Pages 배포 권한

env:
  OUT_DIR: customer-provenance # 생성될 증명서 파일들이 저장될 디렉토리

jobs:
  generate-customer-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        run: echo "[STEP] 리포지토리 체크아웃 완료"

      - name: 📂 Create Output Directory
        run: |
          echo "[STEP] 출력 디렉토리 생성 시작: $OUT_DIR"
          mkdir -p $OUT_DIR
          echo "[✔] 출력 디렉토리 생성 완료: $OUT_DIR"

      - name: 🧾 Generate Bank Customer Provenance Certificates
        run: |
          echo "[STEP] 은행 고객 증명서 JSON 생성 시작"
          # 실제 시나리오에서는 DB나 API에서 고객 데이터를 불러와 처리할 수 있습니다.
          # 여기서는 예시를 위해 5개의 가상 고객 데이터를 생성합니다.
          for i in $(seq -w 1 5); do
            echo "[INFO] customer_data_${i}.json 생성 중..."
            CUSTOMER_ID="BANK-CUST-${i}"
            CUSTOMER_NAME="Bank Customer ${i}"
            TRANSACTION_ID="TRX-${RANDOM}${i}000" # 고유한 거래 ID 생성
            AMOUNT=$((10000 + $i * 5000))       # 다양한 금액 생성
            CURRENCY="KRW"
            DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            echo "[DEBUG] 고객 ID: ${CUSTOMER_ID}"
            echo "[DEBUG] 이름: ${CUSTOMER_NAME}"
            echo "[DEBUG] 거래 ID: ${TRANSACTION_ID}"
            echo "[DEBUG] 금액: ${AMOUNT} ${CURRENCY}"
            echo "[DEBUG] 날짜: ${DATE}"
            echo "[INFO] JSON 내용 작성 시작..."

            # JSON 파일 생성 (여기서 JSON 구조 및 필드는 은행/금융권 Provenance 요구사항에 따라 확장 가능)
            cat > $OUT_DIR/customer_data_${i}.json <<EOF
{
  "provenance_type": "bank_customer_transaction",
  "customer_info": {
    "customer_id": "${CUSTOMER_ID}",
    "customer_name": "${CUSTOMER_NAME}"
  },
  "transaction_details": {
    "transaction_id": "${TRANSACTION_ID}",
    "amount": ${AMOUNT},
    "currency": "${CURRENCY}",
    "transaction_date": "${DATE}",
    "transaction_type": "deposit"
  },
  "metadata": {
    "generated_by": "GitHub Actions Workflow",
    "workflow_run_id": "${GITHUB_RUN_ID}",
    "workflow_run_number": "${GITHUB_RUN_NUMBER}",
    "repository": "${GITHUB_REPOSITORY}",
    "commit_sha": "${GITHUB_SHA}",
    "generation_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
  }
}
EOF
            echo "[INFO] JSON 파일 작성 완료."
            echo "[✔] 생성 완료: $OUT_DIR/customer_data_${i}.json"
          done
          echo "[✔] 전체 은행 고객 증명서 JSON 파일 생성 완료"

      - name: 📦 Archive Provenance Data for Pages
        run: |
          echo "[STEP] GitHub Pages 배포를 위한 데이터 아카이브 시작"
          mkdir -p site/customer-provenance
          echo "[INFO] 생성된 JSON 파일들을 site/customer-provenance로 복사 중..."
          cp $OUT_DIR/*.json site/customer-provenance/
          echo "[INFO] site/index.html 파일 생성 중..."
          # 선택적으로 Provenance 데이터에 대한 간단한 인덱스 파일 생성
          echo "<h1>Bank Customer Provenance Certificates</h1>" > site/index.html
          echo "<ul>" >> site/index.html
          for f in $OUT_DIR/*.json; do
            filename=$(basename "$f")
            echo "<li><a href=\"customer-provenance/$filename\">$filename</a></li>" >> site/index.html
          done
          echo "</ul>" >> site/index.html
          echo "[✔] GitHub Pages 배포 준비 완료"

      - name: 📤 Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site # 'site' 디렉토리의 모든 내용을 GitHub Pages 아티팩트로 업로드
        run: echo "[✔] GitHub Pages 아티팩트 업로드 완료"

  deploy-pages:
    needs: generate-customer-provenance # 이전 작업이 성공적으로 완료된 후 실행
    runs-on: ubuntu-latest
    environment:
      name: github-pages # GitHub Pages 환경 지정
      url: ${{ steps.deployment.outputs.page_url }} # 배포된 페이지 URL

    permissions:
      pages: write     # GitHub Pages 배포 권한
      id-token: write  # OIDC 토큰 발급 권한

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        run: echo "[✔] GitHub Pages에 성공적으로 배포 완료"
