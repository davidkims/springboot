name: "🦀 Rust CI — no-skip + echo logs + self-heal + artifacts"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rustci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"

jobs:
  rust-ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]  # ✅ 마이그레이션 경고 제거
        toolchain: [stable]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 Prepare echo log dirs (always exist)
        shell: bash
        run: |
          set -Eeuo pipefail
          for d in .github/rust_logs .github/security_logs artifacts; do
            echo "[ECHO] mkdir -p $d" ; mkdir -p "$d"
            echo "[ECHO] chmod 755 $d"; chmod 755 "$d" || true
          done
          echo "[ECHO] seed log" | tee .github/rust_logs/seed.log
          # ✅ artifacts 경고 방지용 placeholder
          echo "placeholder" > artifacts/.keep

      - name: 🧰 System deps (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO] apt-get update/install"
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cmake clang llvm curl git ca-certificates

      - name: 🦀 Install Rust (${{ matrix.toolchain }}, +clippy/rustfmt)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy,rustfmt   # ✅ profile 입력 사용 안 함

      # ─────────────────────────────────────────────────────────
      # Detect Cargo.toml / 없으면 샘플 crate 자동 생성(자가복구)
      # ─────────────────────────────────────────────────────────
      - name: 🔎 Detect crates (self-heal if none)
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO] Cargo.toml 전수 스캔 시작" | tee -a .github/rust_logs/summary_detect.log

          # globstar 불필요. find만 사용 (macOS bash 3.x 호환)
          mapfile -t FOUND < <(find . -type f -name Cargo.toml \
            -not -path "*/target/*" -not -path "*/node_modules/*" | sort || true)

          if (( ${#FOUND[@]} == 0 )); then
            echo "[WARN] Cargo.toml 미발견 → rust-example 크레이트 자동 생성" | tee -a .github/rust_logs/summary_detect.log
            rm -rf rust-example || true
            cargo new --bin rust-example
            mkdir -p rust-example/src
            printf 'fn main() {\n    println!("hello from rust-example");\n}\n' > rust-example/src/main.rs
            FOUND=( "./rust-example/Cargo.toml" )
          fi

          printf '%s\n' "${FOUND[@]}" | xargs -I{} dirname "{}" | sort -u > .wslist.txt

          echo "count=$(wc -l < .wslist.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          {
            echo 'list<<__WS__'
            cat .wslist.txt
            echo '__WS__'
          } >> "$GITHUB_OUTPUT"

          echo "[ECHO] 검출된 크레이트 디렉터리:" | tee -a .github/rust_logs/summary_detect.log
          nl -ba .wslist.txt | tee -a .github/rust_logs/summary_detect.log

      - name: 🔐 Ensure lockfiles & metadata (per crate)
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r dir; do
            echo "[ECHO] lockfile/metadata: $dir" | tee -a .github/rust_logs/summary_detect.log
            cd "$dir"
            cargo generate-lockfile || true
            cargo metadata --format-version 1 --no-deps >/dev/null
            cd - >/dev/null
          done < .wslist.txt

      - name: ♻️ Cache (rust-cache, stable)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ steps.detect.outputs.list }}
          cache-on-failure: true
          prefix-key: v0-rust-rust-ci
          cache-targets: true
          cache-all-crates: false
          cache-workspace-crates: false
          save-if: true
          cache-provider: github
          cache-bin: true
          lookup-only: false

      - name: 🔎 Show tool versions
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc -Vv   | tee -a .github/rust_logs/versions.log
          cargo -V    | tee -a .github/rust_logs/versions.log
          echo "OS=${{ matrix.os }}, toolchain=${{ matrix.toolchain }}" | tee -a .github/rust_logs/versions.log

      # ─────────────────────────────────────────────────────────
      # no-skip 전체 파이프라인: fmt → clippy → test → build → doc
      # ─────────────────────────────────────────────────────────
      - name: 🚀 Full pipeline (fmt, clippy, test, build, doc) for all crates
        shell: bash
        run: |
          set -Eeuo pipefail
          FAIL=0
          run_step () {
            local dir="$1"; shift
            local name="$1"; shift
            echo "[RUN] $name @ $dir"
            if (cd "$dir" && "$@"); then
              echo "[OK]  $name @ $dir"
            else
              echo "[ERR] $name @ $dir" >&2
              FAIL=1
            fi
          }

          while IFS= read -r dir; do
            safe="$(echo "$dir" | tr '/.' '_')"
            echo "==================== CRATE: $dir ====================" \
              | tee -a ".github/rust_logs/summary_${{ matrix.os }}_${{ matrix.toolchain }}.log"

            run_step "$dir" "fmt"    bash -lc "cargo fmt --all --check" \
              |& tee ".github/rust_logs/${safe}_${{ matrix.os }}_${{ matrix.toolchain }}_fmt.log"

            run_step "$dir" "clippy" bash -lc "cargo clippy --all-targets --all-features -- -D warnings" \
              |& tee ".github/rust_logs/${safe}_${{ matrix.os }}_${{ matrix.toolchain }}_clippy.log"

            run_step "$dir" "test"   bash -lc "cargo test --all-features --verbose" \
              |& tee ".github/rust_logs/${safe}_${{ matrix.os }}_${{ matrix.toolchain }}_test.log"

            run_step "$dir" "build"  bash -lc "cargo build --release --verbose" \
              |& tee ".github/rust_logs/${safe}_${{ matrix.os }}_${{ matrix.toolchain }}_build.log"

            run_step "$dir" "doc"    bash -lc "cargo doc --no-deps" \
              |& tee ".github/rust_logs/${safe}_${{ matrix.os }}_${{ matrix.toolchain }}_doc.log"

            # ---- 바이너리/아티팩트 수집 (OS별 안전 처리) ----
            if [ -d "$dir/target/release" ]; then
              echo "[ECHO] collect artifacts from $dir/target/release" \
                | tee -a ".github/rust_logs/summary_${{ matrix.os }}_${{ matrix.toolchain }}.log"

              case "${{ matrix.os }}" in
                ubuntu-latest|macos-14)
                  # 실행 가능 파일만 복사
                  while IFS= read -r f; do
                    if [ -f "$f" ] && [ -x "$f" ]; then
                      cp "$f" "artifacts/$(basename "$f")_${{ matrix.os }}_${{ matrix.toolchain }}" || true
                    fi
                  done < <(find "$dir/target/release" -maxdepth 1 -type f 2>/dev/null)
                  ;;
                windows-2022)
                  # .exe만 복사
                  while IFS= read -r f; do
                    cp "$f" "artifacts/$(basename "$f")_${{ matrix.os }}_${{ matrix.toolchain }}" || true
                  done < <(find "$dir/target/release" -maxdepth 1 -type f -name '*.exe' 2>/dev/null)
                  ;;
              esac

              # 어떤 파일도 못 찾았으면 release 디렉터리를 zip으로
              if ! ls artifacts | grep -q "${{ matrix.os }}_${{ matrix.toolchain }}"; then
                zipname="artifacts/$(echo "$safe" | sed 's/^_//')_${{ matrix.os }}_${{ matrix.toolchain }}_release.zip"
                (cd "$dir/target/release" && zip -qr "../../$zipname" .) || true
              fi
            fi
          done < .wslist.txt

          echo "FAIL=$FAIL" | tee -a ".github/rust_logs/summary_${{ matrix.os }}_${{ matrix.toolchain }}.log"
          exit $FAIL

      - name: 📦 Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ matrix.toolchain }}-${{ github.run_id }}
          path: .github/rust_logs/
          if-no-files-found: warn

      - name: 📦 Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.toolchain }}-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn
