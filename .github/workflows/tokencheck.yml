name: CI with OpenAI API Usage Logging via Echo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        run: |
          echo "echo '[📥] Checkout repository...'"
          echo '[📥] Checkout repository...'
          git config --global advice.detachedHead false
          git fetch --all
          git checkout $GITHUB_SHA

      - name: 🔐 Ensure OPENAI_API_KEY Existence
        id: check_key
        run: |
          echo "echo '[🔐] Checking OPENAI_API_KEY existence...'"
          echo '[🔐] Checking OPENAI_API_KEY existence...'
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "echo '[⚠️] OPENAI_API_KEY is not set! Skipping workflow.'"
            echo '[⚠️] OPENAI_API_KEY is not set! Skipping workflow.'
            echo "key_present=0" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "echo '[✅] OPENAI_API_KEY is present.'"
            echo '[✅] OPENAI_API_KEY is present.'
            echo "key_present=1" >> $GITHUB_OUTPUT
          fi

      - name: 🐍 Set up Python
        if: steps.check_key.outputs.key_present == '1'
        run: |
          echo "echo '[🐍] Setting up Python...'"
          echo '[🐍] Setting up Python...'
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          python3 --version
          pip3 --version

      - name: 📦 Install OpenAI SDK
        if: steps.check_key.outputs.key_present == '1'
        run: |
          echo "echo '[📦] Installing openai Python SDK...'"
          echo '[📦] Installing openai Python SDK...'
          pip3 install 'openai>=1.0.0'

      - name: 📝 Write openai_usage.py (with echo)
        if: steps.check_key.outputs.key_present == '1'
        run: |
          echo "echo '[📝] Creating scripts/openai_usage.py...'"
          echo '[📝] Creating scripts/openai_usage.py...'
          mkdir -p scripts

          echo "import os"                                         > scripts/openai_usage.py
          echo "from openai import OpenAI"                        >> scripts/openai_usage.py
          echo ""                                                >> scripts/openai_usage.py
          echo "client = OpenAI(api_key=os.environ.get('OPENAI_API_KEY'))" >> scripts/openai_usage.py
          echo ""                                                >> scripts/openai_usage.py
          echo "try:"                                            >> scripts/openai_usage.py
          echo "    response = client.chat.completions.create("  >> scripts/openai_usage.py
          echo "        model='gpt-3.5-turbo',"                  >> scripts/openai_usage.py
          echo "        messages=["                              >> scripts/openai_usage.py
          echo "            {'role': 'system', 'content': 'You are a helpful assistant.'}," >> scripts/openai_usage.py
          echo "            {'role': 'user', 'content': 'Explain the concept of continuous integration.'}" >> scripts/openai_usage.py
          echo "        ]"                                       >> scripts/openai_usage.py
          echo "    )"                                           >> scripts/openai_usage.py
          echo ""                                                >> scripts/openai_usage.py
          echo "    usage = response.usage if hasattr(response, 'usage') else {}" >> scripts/openai_usage.py
          echo "    input_tokens = usage.get('prompt_tokens', 0)"   >> scripts/openai_usage.py
          echo "    output_tokens = usage.get('completion_tokens', 0)" >> scripts/openai_usage.py
          echo "    total_tokens = usage.get('total_tokens', 0)"    >> scripts/openai_usage.py
          echo ""                                                >> scripts/openai_usage.py
          echo "    cost = (input_tokens / 1000) * 0.0005 + (output_tokens / 1000) * 0.0015" >> scripts/openai_usage.py
          echo ""                                                >> scripts/openai_usage.py
          echo "    print(f'::notice title=OpenAI API Usage::Input Tokens: {input_tokens}')" >> scripts/openai_usage.py
          echo "    print(f'::notice title=OpenAI API Usage::Output Tokens: {output_tokens}')" >> scripts/openai_usage.py
          echo "    print(f'::notice title=OpenAI API Usage::Total Tokens: {total_tokens}')" >> scripts/openai_usage.py
          echo "    print(f'::notice title=Estimated Cost::$ {cost:.6f} USD')" >> scripts/openai_usage.py
          echo ""                                                >> scripts/openai_usage.py
          echo "except Exception as e:"                          >> scripts/openai_usage.py
          echo "    print(f'::error::Error calling OpenAI API: {e}')" >> scripts/openai_usage.py

      - name: ▶️ Run openai_usage.py
        if: steps.check_key.outputs.key_present == '1'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "echo '[▶️] Running openai_usage.py...'"
          echo '[▶️] Running openai_usage.py...'
          python3 scripts/openai_usage.py

      - name: ✅ Final Log
        if: steps.check_key.outputs.key_present == '1'
        run: |
          echo "echo '[✅] OpenAI API 사용량 로그 출력 완료. Actions 로그에서 확인하세요.'"
          echo '[✅] OpenAI API 사용량 로그 출력 완료. Actions 로그에서 확인하세요.'
