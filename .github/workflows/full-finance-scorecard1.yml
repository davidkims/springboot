name: 🚀 Full Finance & Scorecard Setup (with Accumulation & Archiving)

on:
  workflow_dispatch: # Allows manual triggering from the GitHub UI
  schedule:
    - cron: '0 0 * * 0' # 매주 일요일 00:00 UTC에 실행 (KST 기준 일요일 오전 9시)

jobs:
  full-setup:
    name: Full Setup and Scorecard Scan
    runs-on: ubuntu-latest # 최신 Ubuntu 환경 사용
    permissions:
      contents: read         # 리포지토리 코드 읽기 권한 (체크아웃 및 스코어카드 액션용)
      security-events: write # SARIF 결과를 GitHub 보안 탭에 업로드하기 위한 권한

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4 # 현재 리포지토리 코드 체크아웃

      - name: 📆 Set Date & Timestamp
        id: date
        run: |
          echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT" # YYYY-MM-DD 형식
          echo "timestamp=$(date +%Y-%m-%d_%H%M%S)" >> "$GITHUB_OUTPUT" # YYYY-MM-DD_HHMMSS 형식 (고유한 아카이브 폴더명용)

      - name: 🐳 CLI Tools 설치
        run: |
          echo "Installing necessary CLI tools..."
          sudo apt-get update
          sudo apt-get install -y jq curl unzip bc file

      - name: 🗂️ 디렉토리 준비 및 아카이브 폴더 생성
        # 필요한 모든 디렉토리들을 미리 생성하고, 이 워크플로우 실행의 아카이브 폴더를 생성합니다.
        run: |
          echo "Preparing directories..."
          mkdir -p .github/finance/ledgers \
                   .github/finance/files \
                   .github/scorecard/ledgers \
                   .github/scorecard/files \
                   .github/scorecard/sarif \
                   run_archives/${{steps.date.outputs.timestamp}} # 이 실행을 위한 고유한 아카이브 폴더

      - name: 🧾 금융 원장 생성 및 누적
        run: |
          DAILY_LEDGER_FILE=".github/finance/ledgers/ledger_${{steps.date.outputs.date}}.csv"
          CUMULATIVE_LEDGER_FILE=".github/finance/cumulative_finance_ledger.csv"
          
          echo "name,date,amount,type,card_number" > "$DAILY_LEDGER_FILE"
          for i in {1..50}; do
            TXN=$(date -d "$i days ago" +%F)
            TYPE=$( ((i%2)) && echo 신용 || echo 체크 )
            CARD="-"
            [[ "$TYPE" = "신용" ]] && CARD="4111$(printf "%012d" $RANDOM)"
            echo "Customer$i,$TXN,$((RANDOM%9000+1000)).00,$TYPE,$CARD" >> "$DAILY_LEDGER_FILE"
          done
          echo "Finance daily ledger created at: $DAILY_LEDGER_FILE"
          
          # 누적 원장 처리: 파일이 없으면 헤더 추가, 있으면 데이터만 추가
          if [ ! -f "$CUMULATIVE_LEDGER_FILE" ]; then
            echo "name,date,amount,type,card_number" > "$CUMULATIVE_LEDGER_FILE"
            echo "Cumulative finance ledger created with header."
          fi
          # 일별 원장의 헤더를 제외한 데이터만 누적 원장에 추가
          tail -n +2 "$DAILY_LEDGER_FILE" >> "$CUMULATIVE_LEDGER_FILE"
          echo "Daily finance ledger data appended to cumulative ledger: $CUMULATIVE_LEDGER_FILE"

          # 현재 금융 원장 파일들을 실행 아카이브 폴더에 복사
          cp "$DAILY_LEDGER_FILE" "run_archives/${{steps.date.outputs.timestamp}}/"
          cp "$CUMULATIVE_LEDGER_FILE" "run_archives/${{steps.date.outputs.timestamp}}/"
          echo "Finance ledgers copied to run archive."

      - name: 📄 보고서 생성 (Finance)
        run: |
          REPORT_FILE=".github/finance/files/report_${{steps.date.outputs.date}}.txt"
          echo "금융 거래 요약 리포트 - ${{steps.date.outputs.date}}" > "$REPORT_FILE"
          echo "Finance report created at: $REPORT_FILE"
          
          # 생성된 보고서 파일을 실행 아카이브 폴더에 복사
          cp "$REPORT_FILE" "run_archives/${{steps.date.outputs.timestamp}}/"
          echo "Finance report copied to run archive."

      - name: 🧪 Run OpenSSF Scorecard and Generate Reports
        # OpenSSF Scorecard 공식 GitHub Action을 사용하여 보안 점검을 수행합니다.
        # SARIF와 JSON 형식을 모두 생성하도록 설정합니다.
        uses: ossf/scorecard-action@v2.4.2 # 현재 가장 안정적인 v2.x.y 버전 사용
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          
          results_file: .github/scorecard/sarif/scorecard_${{steps.date.outputs.date}}.sarif # SARIF 출력 경로
          
          results_format: json # JSON 형식 출력 활성화
          output_file: .github/scorecard/files/results_${{steps.date.outputs.date}}.json # JSON 출력 경로

          # publish_results: true를 설정하면 Action이 직접 GitHub Code Scanning에 게시할 수 있습니다.
          # 여기서는 명시적인 'upload-sarif' step을 사용하기 위해 주석 처리합니다.
          # publish_results: true

      - name: 🧾 Scorecard 원장 생성 및 누적
        run: |
          DAILY_LEDGER_FILE=".github/scorecard/ledgers/scorecard_${{steps.date.outputs.date}}.csv"
          CUMULATIVE_LEDGER_FILE=".github/scorecard/cumulative_scorecard_ledger.csv"

          echo "item,score,comment" > "$DAILY_LEDGER_FILE"
          for i in {1..20}; do
            C=$(( RANDOM % 2 ))
            COMMENT=$([ "$C" -eq 0 ] && echo "양호" || echo "개선필요")
            echo "SecurityCheck$i,$((RANDOM%101)),$COMMENT" >> "$DAILY_LEDGER_FILE"
          done
          echo "Scorecard daily ledger created at: $DAILY_LEDGER_FILE"
          
          # 누적 원장 처리
          if [ ! -f "$CUMULATIVE_LEDGER_FILE" ]; then
            echo "item,score,comment" > "$CUMULATIVE_LEDGER_FILE"
            echo "Cumulative scorecard ledger created with header."
          fi
          tail -n +2 "$DAILY_LEDGER_FILE" >> "$CUMULATIVE_LEDGER_FILE"
          echo "Daily scorecard ledger data appended to cumulative ledger: $CUMULATIVE_LEDGER_FILE"

          # 현재 Scorecard 원장 파일들을 실행 아카이브 폴더에 복사
          cp "$DAILY_LEDGER_FILE" "run_archives/${{steps.date.outputs.timestamp}}/"
          cp "$CUMULATIVE_LEDGER_FILE" "run_archives/${{steps.date.outputs.timestamp}}/"
          echo "Scorecard ledgers copied to run archive."

      - name: 📄 보고서 생성 (Scorecard)
        run: |
          OSS_REPORT_FILE=".github/scorecard/files/oss_report_${{steps.date.outputs.date}}.txt"
          echo "오픈소스 보안 점검 리포트 - ${{steps.date.outputs.date}}" > "$OSS_REPORT_FILE"
          echo "Open-source security report created at: $OSS_REPORT_FILE"

          # 생성된 보고서 파일을 실행 아카이브 폴더에 복사
          cp "$OSS_REPORT_FILE" "run_archives/${{steps.date.outputs.timestamp}}/"
          echo "Scorecard report copied to run archive."

      - name: 📜 Provenance 생성 및 복사
        run: |
          FINANCE_PROVENANCE_FILE=".github/finance/provenance_${{steps.date.outputs.date}}.json"
          echo "{\"type\":\"finance-ledger\",\"date\":\"${{steps.date.outputs.date}}\",\"ledger\":\"ledger_${{steps.date.outputs.date}}.csv\",\"report\":\"report_${{steps.date.outputs.date}}.txt\"}" > "$FINANCE_PROVENANCE_FILE"
          echo "Finance provenance created at: $FINANCE_PROVENANCE_FILE"

          SCORECARD_PROVENANCE_FILE=".github/scorecard/provenance_${{steps.date.outputs.date}}.json"
          echo "{\"type\":\"scorecard-report\",\"date\":\"${{steps.date.outputs.date}}\",\"ledger\":\"scorecard_${{steps.date.outputs.date}}.csv\",\"report\":\"oss_report_${{steps.date.outputs.date}}.txt\"}" > "$SCORECARD_PROVENANCE_FILE"
          echo "Scorecard provenance created at: $SCORECARD_PROVENANCE_FILE"

          # 생성된 provenance 파일들을 실행 아카이브 폴더에 복사
          cp "$FINANCE_PROVENANCE_FILE" "run_archives/${{steps.date.outputs.timestamp}}/"
          cp "$SCORECARD_PROVENANCE_FILE" "run_archives/${{steps.date.outputs.timestamp}}/"
          echo "Provenance files copied to run archive."

      - name: 🚀 Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .github/scorecard/sarif/scorecard_${{steps.date.outputs.date}}.sarif
          category: "OpenSSF Scorecard"

      - name: 📦 Upload JSON report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-json-report-${{steps.date.outputs.date}}
          path: .github/scorecard/files/results_${{steps.date.outputs.date}}.json
          # retention-days: 7

      - name: ⬆️ Upload Cumulative Ledgers as Artifacts
        # 누적 원장 파일들을 아티팩트로 업로드합니다.
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-ledgers-${{steps.date.outputs.date}}
          path: |
            .github/finance/cumulative_finance_ledger.csv
            .github/scorecard/cumulative_scorecard_ledger.csv
          # retention-days: 7

      - name: ⬆️ Upload Full Run Archive as Artifact
        # 이 워크플로우 실행에서 생성된 모든 파일들이 포함된 'run_archives' 폴더 전체를 아티팩트로 업로드합니다.
        uses: actions/upload-artifact@v4
        with:
          name: full-run-archive-${{steps.date.outputs.timestamp}}
          path: run_archives/${{steps.date.outputs.timestamp}}/
          # retention-days: 7

      - name: 🩺 헬스체크
        run: |
          echo "Performing health checks..."
          
          docker info > /dev/null && echo "✅ Docker OK" || (echo "❌ Docker check failed"; exit 1)
          
          # SARIF 및 JSON 파일이 생성되었는지 확인
          test -f ".github/scorecard/sarif/scorecard_${{steps.date.outputs.date}}.sarif" && echo "✅ Scorecard SARIF OK" || (echo "❌ Scorecard SARIF file not found"; exit 1)
          test -f ".github/scorecard/files/results_${{steps.date.outputs.date}}.json" && echo "✅ Scorecard JSON OK" || (echo "❌ Scorecard JSON file not found"; exit 1)
          
          # 일별 금융 및 Scorecard 원장 확인
          test -f ".github/finance/ledgers/ledger_${{steps.date.outputs.date}}.csv" && echo "✅ Finance Daily Ledger OK" || (echo "❌ Finance Daily Ledger file not found"; exit 1)
          test -f ".github/scorecard/ledgers/scorecard_${{steps.date.outputs.date}}.csv" && echo "✅ Scorecard Daily Ledger OK" || (echo "❌ Scorecard Daily Ledger file not found"; exit 1)

          # 누적 원장 파일 확인
          test -f ".github/finance/cumulative_finance_ledger.csv" && echo "✅ Finance Cumulative Ledger OK" || (echo "❌ Finance Cumulative Ledger file not found"; exit 1)
          test -f ".github/scorecard/cumulative_scorecard_ledger.csv" && echo "✅ Scorecard Cumulative Ledger OK" || (echo "❌ Scorecard Cumulative Ledger file not found"; exit 1)

          # 보고서 파일 내용 확인
          grep -q "오픈소스 보안 점검" ".github/scorecard/files/oss_report_${{steps.date.outputs.date}}.txt" && echo "✅ Scorecard Report Content OK" || (echo "❌ Scorecard Report content check failed"; exit 1)
          
          # 실행 아카이브 폴더 및 내부 파일 확인 (최소 하나 이상)
          RUN_ARCHIVE_PATH="run_archives/${{steps.date.outputs.timestamp}}"
          test -d "$RUN_ARCHIVE_PATH" && ls "$RUN_ARCHIVE_PATH" | grep -q . && echo "✅ Run Archive Directory OK" || (echo "❌ Run Archive Directory check failed or empty"; exit 1)

          echo "All health checks passed successfully!"
