name: OpenSSF Scorecard Scan with Custom Directory Copy

on:
  push:
    branches:
      - main  # Adjust to your default branch name (e.g., master, develop)
  pull_request:
    branches:
      - main  # Adjust to your default branch name (e.g., master, develop)
  schedule:
    - cron: '30 1 * * 0' # Runs every Sunday at 01:30 UTC

jobs:
  scorecard:
    name: Run OpenSSF Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read         # Required for checkout and Scorecard action to read repo
      security-events: write # Required for uploading SARIF results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Essential to have your code in the runner

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.2 # Using the specific stable version
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          results_file: scorecard-results.sarif # This is where the SARIF output will be saved initially

      - name: Create Custom Output Directory and Copy Files
        run: |
          # Define the target directory name
          CUSTOM_DIR="scan_outputs"
          
          echo "[📁] Creating custom directory: ${CUSTOM_DIR}..."
          mkdir -p "${CUSTOM_DIR}" # -p creates parent directories if they don't exist
          
          echo "[📄] Copying scorecard-results.sarif to ${CUSTOM_DIR}/..."
          # Check if the SARIF file exists before copying
          if [ -f "scorecard-results.sarif" ]; then
            cp scorecard-results.sarif "${CUSTOM_DIR}/"
            echo "scorecard-results.sarif copied successfully."
          else
            echo "Warning: scorecard-results.sarif not found, skipping copy."
          fi
          
          echo "[📄] Copying a hypothetical README.md to ${CUSTOM_DIR}/..."
          # Example: Copy another file from your repo. Adjust 'README.md' to your actual file.
          # You can add more 'cp' commands here for other files/folders.
          if [ -f "README.md" ]; then # Check if README.md exists in the repo root
            cp README.md "${CUSTOM_DIR}/"
            echo "README.md copied successfully."
          else
            echo "Note: README.md not found in repository root, skipping copy."
          fi
          
          echo "[✅] Files copied to ${CUSTOM_DIR}/. Listing contents:"
          ls -l "${CUSTOM_DIR}" # List contents of the new directory for verification

      - name: Upload Scorecard results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          # The SARIF file is still expected at its original location by this action
          # unless you moved it and updated this path. In this setup, we copy it,
          # but the original still exists for the upload-sarif action.
          # If you intend to delete the original, you'd change this path to "${CUSTOM_DIR}/scorecard-results.sarif"
          sarif_file: scorecard-results.sarif
          category: "OpenSSF Scorecard"

      # Optional: Upload the entire custom directory as an artifact
      - name: Upload Custom Output Directory as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-scan-artifacts
          path: scan_outputs/
          # retention-days: 7 # Optional: How long to keep the artifact (default is 90 days)
