name: "🛡️ EchoSec: White-Hat Security Scan (Unified)"

on:
  workflow_dispatch:
    inputs:
      legal_ack:
        description: "권한 확인: 본인 소유/관리 시스템에 한해 점검합니다. 활성화하려면 정확히 'I OWN THIS' 입력"
        required: true
        default: "NO"
      target_url:
        description: "(선택) ZAP 웹 취약점 기본 점검 대상 URL (https:// 포함)"
        required: false
        default: ""
      nmap_targets:
        description: "(선택) Nmap 대상 호스트/IP (공백으로 다수 가능)"
        required: false
        default: ""
      enable_nmap:
        description: "(선택) Nmap 안전 스캔 실행 여부 (true/false)"
        required: true
        default: "false"
      docker_image:
        description: "(선택) 컨테이너 이미지 취약점 스캔 대상 (예: ghcr.io/owner/app:tag)"
        required: false
        default: ""
      trivy_severity:
        description: "Trivy 보고 심각도 필터 (예: CRITICAL,HIGH)"
        required: true
        default: "CRITICAL,HIGH"
      semgrep_config:
        description: "Semgrep 규칙 세트 (기본: p/ci)"
        required: true
        default: "p/ci"
      zap_max_time:
        description: "ZAP Baseline 최대 실행(초)"
        required: true
        default: "600"
      repo_path:
        description: "스캔할 코드 루트 경로(모노레포면 서브폴더)"
        required: true
        default: "."

permissions:
  contents: read
  actions: read
  id-token: none

env:
  ECHO_DIR: .github/echo_sec
  ECHO_LOG: .github/echo_sec/logs
  ECHO_OUT: .github/echo_sec/out
  ECHO_TMP: .github/echo_sec/tmp

concurrency:
  group: echoosec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: "🧩 Guard: 합법성 확인 & 디렉토리 준비"
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.legal.outputs.allowed }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "폴더 준비"
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_DIR"/{logs,out,tmp,tools}
          echo "[ECHO][OK] 디렉토리 준비 완료 -> $ECHO_DIR"

      - id: legal
        name: "법적 동의(legal_ack) 검사"
        shell: bash
        run: |
          allowed="false"
          if [[ "${{ inputs.legal_ack }}" == "I OWN THIS" ]]; then allowed="true"; fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "[ECHO] legal_ack='${{ inputs.legal_ack }}' -> allowed=$allowed" | tee -a "$ECHO_LOG/guard.txt"

      - name: "요약"
        run: |
          {
            echo "### EchoSec Guard"
            echo "- legal_ack: \`${{ inputs.legal_ack }}\`"
            echo "- allowed (ZAP/Nmap 활성화): \`${{ steps.legal.outputs.allowed }}\`"
            echo "- target_url: \`${{ inputs.target_url || 'N/A' }}\`"
            echo "- nmap_targets: \`${{ inputs.nmap_targets || 'N/A' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  sast_and_secrets:
    name: "🔍 SAST/Secrets/Deps (Semgrep + Gitleaks + Trivy FS)"
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "환경 패키지 설치"
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq python3 python3-pip

      - name: "Gitleaks(비밀키) - Docker"
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          cd "${{ inputs.repo_path }}"
          docker run --rm -v "$PWD:/repo" gitleaks/gitleaks:latest detect \
            -s /repo -r /repo/../$ECHO_OUT/gitleaks.sarif -f sarif --no-git || true
          echo "[ECHO][OK] gitleaks 완료 -> $ECHO_OUT/gitleaks.sarif"

      - name: "Semgrep(SAST) - Docker"
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          cd "${{ inputs.repo_path }}"
          docker run --rm -v "$PWD:/src" returntocorp/semgrep:latest \
            semgrep --config "${{ inputs.semgrep_config }}" --json \
            --error --timeout 240 \
            > ../$ECHO_OUT/semgrep.json || true
          echo "[ECHO][OK] semgrep 완료 -> $ECHO_OUT/semgrep.json"

      - name: "Trivy Filesystem(종속성/바이너리) - Docker"
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          cd "${{ inputs.repo_path }}"
          docker run --rm -v "$PWD:/fs" aquasec/trivy:latest fs /fs \
            --severity "${{ inputs.trivy_severity }}" \
            --scanners vuln,secret,misconfig,license \
            --timeout 5m \
            --format sarif --output ../$ECHO_OUT/trivy-fs.sarif || true
          echo "[ECHO][OK] trivy fs 완료 -> $ECHO_OUT/trivy-fs.sarif"

      - name: "아티팩트 업로드 (SAST/Secrets/Deps)"
        uses: actions/upload-artifact@v4
        with:
          name: echoosec-sast-secrets-deps
          path: |
            .github/echo_sec/out/gitleaks.sarif
            .github/echo_sec/out/semgrep.json
            .github/echo_sec/out/trivy-fs.sarif
          if-no-files-found: warn
          retention-days: 7

  container_scan:
    name: "🐳 Trivy Image (옵션)"
    needs: guard
    if: ${{ inputs.docker_image != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Trivy Image - Docker"
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_OUT"
          docker pull "${{ inputs.docker_image }}" || true
          docker run --rm aquasec/trivy:latest image "${{ inputs.docker_image }}" \
            --severity "${{ inputs.trivy_severity }}" \
            --timeout 5m \
            --format sarif --output "$ECHO_OUT/trivy-image.sarif" || true
          echo "[ECHO][OK] trivy image 완료 -> $ECHO_OUT/trivy-image.sarif"
      - uses: actions/upload-artifact@v4
        with:
          name: echoosec-image
          path: .github/echo_sec/out/trivy-image.sarif
          if-no-files-found: warn
          retention-days: 7

  web_scan_zap:
    name: "🌐 ZAP Baseline (옵션)"
    needs: guard
    if: ${{ needs.guard.outputs.allowed == 'true' && inputs.target_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "ZAP Baseline - Docker"
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_OUT"
          docker run --rm -u root owasp/zap2docker-stable zap-baseline.py \
            -t "${{ inputs.target_url }}" \
            -m ${{ inputs.zap_max_time }} \
            -r report.html -x report.xml || true
          # 수집물 저장
          cid=$(docker create owasp/zap2docker-stable)
          docker cp "$cid:/zap/report.html" "$ECHO_OUT/zap-report.html" || true
          docker cp "$cid:/zap/report.xml"  "$ECHO_OUT/zap-report.xml"  || true
          docker rm "$cid" >/dev/null || true
          echo "[ECHO][OK] ZAP 보고서 -> $ECHO_OUT/zap-report.[html|xml]"

      - uses: actions/upload-artifact@v4
        with:
          name: echoosec-zap
          path: |
            .github/echo_sec/out/zap-report.html
            .github/echo_sec/out/zap-report.xml
          if-no-files-found: warn
          retention-days: 7

  http_header_audit:
    name: "🧪 HTTP 보안헤더 점검(샘플 프로그램)"
    needs: guard
    if: ${{ needs.guard.outputs.allowed == 'true' && inputs.target_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "샘플 코드 생성: headers_audit.py"
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_DIR/tools" "$ECHO_OUT"
          cat <<'PY' > "$ECHO_DIR/tools/headers_audit.py"
          import sys, json, requests
          from urllib.parse import urlparse

          TARGET = sys.argv[1]
          MUST = [
              "strict-transport-security",
              "content-security-policy",
              "x-frame-options",
              "x-content-type-options",
              "referrer-policy",
              "permissions-policy",
          ]
          res = requests.get(TARGET, timeout=20, allow_redirects=True)
          headers = {k.lower(): v for k, v in res.headers.items()}
          report = {"target": TARGET, "status": res.status_code, "missing": [], "present": {}}
          for h in MUST:
              if h in headers:
                  report["present"][h] = headers[h]
              else:
                  report["missing"].append(h)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
          echo "[ECHO][OK] headers_audit.py 생성"

      - name: "실행 & 보고서 저장"
        run: |
          python3 -m pip install --upgrade pip requests >/dev/null
          python3 "$ECHO_DIR/tools/headers_audit.py" "${{ inputs.target_url }}" \
            | tee "$ECHO_OUT/http-headers.json"
          echo "[ECHO][OK] HTTP 헤더 점검 완료 -> $ECHO_OUT/http-headers.json"

      - uses: actions/upload-artifact@v4
        with:
          name: echoosec-http-headers
          path: .github/echo_sec/out/http-headers.json
          if-no-files-found: warn
          retention-days: 7

  nmap_safe:
    name: "📡 Nmap 안전 스캔(옵션)"
    needs: guard
    if: ${{ needs.guard.outputs.allowed == 'true' && inputs.enable_nmap == 'true' && inputs.nmap_targets != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Nmap 설치"
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y nmap

      - name: "Nmap 안전 옵션 실행"
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_OUT"
          # 안전 범주: 서비스 버전 식별, 상위 200포트, 보수적 타이밍
          nmap -sV -T3 --top-ports 200 -oN "$ECHO_OUT/nmap.txt" -oX "$ECHO_OUT/nmap.xml" \
            ${{ inputs.nmap_targets }} || true
          echo "[ECHO][OK] nmap 결과 -> $ECHO_OUT/nmap.[txt|xml]"

      - uses: actions/upload-artifact@v4
        with:
          name: echoosec-nmap
          path: |
            .github/echo_sec/out/nmap.txt
            .github/echo_sec/out/nmap.xml
          if-no-files-found: warn
          retention-days: 7

  summarize:
    name: "📑 요약"
    needs: [guard, sast_and_secrets, container_scan, web_scan_zap, http_header_audit, nmap_safe]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "결과 요약(SUMMARY)"
        run: |
          {
            echo "## EchoSec 실행 요약"
            echo "- legal_ack(외부스캔 허용): \`${{ needs.guard.outputs.allowed }}\`"
            echo "- 산출물 경로: \`$ECHO_DIR/out\` (아티팩트 첨부)"
            echo ""
            echo "| 카테고리 | 파일 |"
            echo "|---|---|"
            echo "| Secrets | gitleaks.sarif |"
            echo "| SAST | semgrep.json |"
            echo "| Deps/FS | trivy-fs.sarif |"
            echo "| Container(Optional) | trivy-image.sarif |"
            echo "| Web(Optional) | zap-report.html / zap-report.xml |"
            echo "| HTTP Headers(Optional) | http-headers.json |"
            echo "| Nmap(Optional) | nmap.txt / nmap.xml |"
          } >> "$GITHUB_STEP_SUMMARY"
