name: 🛡️ CodeQL Ultimate Multi-Language Scan (Auto-Detect & Upgrade)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  codeql-multi:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Install CodeQL CLI
        run: |
          echo "echo '[🛠️] Installing CodeQL CLI...'"
          echo '[🛠️] Installing CodeQL CLI...'
          wget -qO- https://github.com/github/codeql-cli-binaries/releases/latest/download/codeql-linux64.zip > codeql.zip
          unzip -qo codeql.zip -d $HOME/codeql
          chmod +x $HOME/codeql/codeql/codeql
          echo 'export PATH="$HOME/codeql/codeql:$PATH"' >> $GITHUB_ENV
          $HOME/codeql/codeql/codeql --version

      - name: 🔍 CodeQL Ultimate Multi-Language Scan
        run: |
          echo "echo '[🔍] Detecting supported languages in project...'"
          echo '[🔍] Detecting supported languages in project...'

          detect_langs() {
            langs=""
            [ -d src ] && grep -r -q "def " src/ 2>/dev/null && langs="$langs,python"
            [ -d src ] && grep -r -q "class " src/ 2>/dev/null && langs="$langs,java"
            [ -d src ] && grep -r -q "function " src/ 2>/dev/null && langs="$langs,javascript"
            [ -d src ] && grep -r -q "#include" src/ 2>/dev/null && langs="$langs,cpp"
            [ -f setup.py ] && langs="$langs,python"
            [ -f pom.xml ] && langs="$langs,java"
            [ -f package.json ] && langs="$langs,javascript"
            [ -f main.go ] && langs="$langs,go"
            [ -f Cargo.toml ] && langs="$langs,cpp"
            [ -f Gemfile ] && langs="$langs,ruby"
            langs=$(echo $langs | tr ',' '\n' | grep -v '^$' | sort -u | tr '\n' ',' | sed 's/,$//')
            [ -z "$langs" ] && langs="python,java,javascript"
            echo $langs
          }

          langs=$(detect_langs)
          echo "echo '[🔍] Detected languages: $langs'"
          echo "[🔍] Detected languages: $langs"

          if [[ "$langs" == *,* ]]; then
            echo "echo '[⚡] Creating DB for multiple languages ($langs) with --db-cluster ...'"
            echo "[⚡] Creating DB for multiple languages ($langs) with --db-cluster ..."
            $HOME/codeql/codeql/codeql database create db-ql --language=$langs --db-cluster --source-root=.
          else
            echo "echo '[⚡] Creating DB for $langs...'"
            echo "[⚡] Creating DB for $langs..."
            $HOME/codeql/codeql/codeql database create db-ql --language=$langs --source-root=.
          fi

          echo "echo '[⚡] CodeQL database created: db-ql'"
          echo '[⚡] CodeQL database created: db-ql'

          $HOME/codeql/codeql/codeql database analyze db-ql \
            --format=sarifv2.1.0 \
            --output=codeql-report.sarif \
            --threads=2 --ram=4096 --rerun --trace-process --trace-process-level=3 \
            || echo "echo '[⚠️] CodeQL analyze failed!'"

          echo "echo '[✅] CodeQL SARIF: codeql-report.sarif'"
          echo '[✅] CodeQL SARIF: codeql-report.sarif'
          ls -lh codeql-report.sarif || echo "echo '[⚠️] SARIF file not found'"

      - name: ⬆️ Upload CodeQL SARIF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-report-sarif
          path: codeql-report.sarif
