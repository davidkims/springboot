      - name: 📚 Ledger 스키마 + 슬롯 레코드 + 장치정보 기록
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          export SLOTS_OMNI="${SLOTS_OMNI:-1}"; [[ "${SLOTS_OMNI}" =~ ^[0-9]+$ ]] || export SLOTS_OMNI=1
          ctr exec -u postgres td-sim bash -lc "psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS ledger;
          CREATE TABLE IF NOT EXISTS ledger.service_event(id BIGSERIAL PRIMARY KEY, at TIMESTAMP DEFAULT NOW(), service TEXT, event TEXT, detail TEXT);
          CREATE TABLE IF NOT EXISTS ledger.dw_daily_volume(day DATE PRIMARY KEY, txn_count BIGINT, total_amount NUMERIC(20,2));
          CREATE TABLE IF NOT EXISTS ledger.nginx_access(raw_time TEXT, ip TEXT, method TEXT, path TEXT, status INT, bytes BIGINT, req_time DOUBLE PRECISION, referer TEXT, ua TEXT);
          CREATE TABLE IF NOT EXISTS ledger.service_slot(service TEXT, slot_id INT, state TEXT DEFAULT 'ready', created_at TIMESTAMP DEFAULT NOW(), PRIMARY KEY(service,slot_id));
          CREATE TABLE IF NOT EXISTS ledger.device_info(id BIGSERIAL PRIMARY KEY, ts TIMESTAMP DEFAULT NOW(), hostname TEXT, kernel TEXT, slots JSONB, nic JSONB);
          SQL"
          ctr exec -u postgres td-sim psql -U postgres -d postgres -c "WITH s AS (SELECT generate_series(1, ${SLOTS_OMNI}) AS i) INSERT INTO ledger.service_slot(service,slot_id) SELECT 'omni', i FROM s ON CONFLICT DO NOTHING"
          KERNEL="$(uname -r)"; HOST="$(hostname)"
          SLOTS_JSON="$(jq -c '.slots' < "${ECHO_NET}/device_info.json")"
          NIC_JSON="$(jq -c '.nic'   < "${ECHO_NET}/device_info.json")"
          ctr exec -u postgres td-sim psql -U postgres -d postgres -c "INSERT INTO ledger.device_info(hostname,kernel,slots,nic) VALUES ('${HOST}','${KERNEL}','${SLOTS_JSON}'::jsonb,'${NIC_JSON}'::jsonb)"
          make_archive "13_ledger_seed" "${ECHO_NET}/device_info.json"

      - name: 🧾 Nginx 로그 → CSV → Postgres 적재
        if: ${{ env.RUN_NETWORK == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          LOG="${ECHO_NET}/logs/echo.access.log"; CSV="${ECHO_NET}/logs/echo.access.csv"
          if [ ! -s "$LOG" ]; then echo "[LEDGER] no nginx log"; touch "$CSV"; make_archive "14_nginx_csv_empty" "$CSV"; exit 0; fi
          gawk '{ ip=$1; match($0, /\[([^\]]+)\]/, m); raw_time=m[1]; match($0, /"([^"]+)"/, r); req=r[1]; split(req, a, " "); method=a[1]; path=a[2]; match($0, /"[^"]+"\s+([0-9]{3})\s+([0-9]+)/, s); status=s[1]; bytes=s[2]; match($0, /"[^"]+"\s+[0-9]{3}\s+[0-9]+\s+"([^"]*)"\s+"([^"]*)"/, h); referer=h[1]; ua=h[2]; match($0, /rt=([0-9.]+)/, t); rt=t[1]; gsub(/,/," ",referer); gsub(/,/," ",ua); gsub(/,/," ",path); print raw_time "," ip "," method "," path "," status "," bytes "," rt "," referer "," ua }' "$LOG" > "$CSV"
          ctr exec td-sim bash -lc 'mkdir -p /tmp/ingest && chmod 1777 /tmp/ingest'
          ctr cp "$CSV" td-sim:/tmp/ingest/echo.access.csv
          ctr exec -u postgres td-sim psql -U postgres -d postgres -c "\copy ledger.nginx_access(raw_time,ip,method,path,status,bytes,req_time,referer,ua) FROM '/tmp/ingest/echo.access.csv' WITH (FORMAT CSV)"
          make_archive "14_nginx_csv_loaded" "$CSV"

      - name: 🧮 Ledger Partition + MV Snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          ctr exec -u postgres td-sim psql -U postgres -d postgres <<'SQL'
          CREATE SCHEMA IF NOT EXISTS ledger;
          CREATE TABLE IF NOT EXISTS ledger.fact_txn_day(day DATE PRIMARY KEY, txn_count BIGINT, total_amount NUMERIC(20,2));
          CREATE TABLE IF NOT EXISTS ledger.fact_txn_month(month DATE PRIMARY KEY, txn_count BIGINT, total_amount NUMERIC(20,2));
          CREATE MATERIALIZED VIEW IF NOT EXISTS ledger.mv_daily_summary AS
            SELECT date_trunc('day', txn_ts)::date AS day, COUNT(*) AS txn_count, SUM(amount) AS total_amount
            FROM td.fact_transaction GROUP BY 1;
          REFRESH MATERIALIZED VIEW ledger.mv_daily_summary;
          INSERT INTO ledger.fact_txn_month(month, txn_count, total_amount)
          SELECT date_trunc('month', day)::date, SUM(txn_count), SUM(total_amount) FROM ledger.mv_daily_summary GROUP BY 1
          ON CONFLICT (month) DO UPDATE SET txn_count=EXCLUDED.txn_count, total_amount=EXCLUDED.total_amount;
          INSERT INTO ledger.fact_txn_day(day, txn_count, total_amount)
          SELECT day, txn_count, total_amount FROM ledger.mv_daily_summary
          ON CONFLICT (day) DO UPDATE SET txn_count=EXCLUDED.txn_count, total_amount=EXCLUDED.total_amount;
          SQL
          make_archive "15_ledger_mv" "/var/lib/docker" || true

      - name: 📊 Prometheus & Alertmanager (slot-aware)
        if: ${{ env.RUN_NETWORK == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${ECHO_NET}/prometheus"
          export SLOTS_OMNI="${SLOTS_OMNI:-1}"; [[ "${SLOTS_OMNI}" =~ ^[0-9]+$ ]] || export SLOTS_OMNI=1
          OMNI_TARGETS=""; for i in $(seq 1 ${SLOTS_OMNI}); do [ -n "$OMNI_TARGETS" ] && OMNI_TARGETS="${OMNI_TARGETS}, "; OMNI_TARGETS="${OMNI_TARGETS}'omni-${i}:8000'"; done
          cat > "${ECHO_NET}/prometheus/recording_rules.yml" <<'REC_RULES'
          groups:
            - name: omni.rules
              interval: 30s
              rules:
                - record: omni_requests_rate_5m
                  expr: rate(omni_requests_total[5m])
          REC_RULES
          cat > "${ECHO_NET}/prometheus/alert_rules.yml" <<'ALERT_RULES'
          groups:
            - name: omni.alerts
              rules:
                - alert: OmniDown
                  expr: up{job="omni"} == 0
                  for: 1m
                  labels: { severity: critical }
                  annotations: { summary: "Omni target is down" }
                - alert: NginxExporterDown
                  expr: up{job="nginx-exp"} == 0
                  for: 2m
                  labels: { severity: warning }
                  annotations: { summary: "Nginx exporter is down" }
          ALERT_RULES
          cat > "${ECHO_NET}/prometheus/prometheus.yml" <<PROM_CFG
          global:
            scrape_interval: 15s
            evaluation_interval: 30s
          rule_files:
            - /etc/prometheus/recording_rules.yml
            - /etc/prometheus/alert_rules.yml
          alerting:
            alertmanagers:
              - static_configs:
                  - targets: ["alertmanager:9093"]
          scrape_configs:
            - job_name: 'omni'
              metrics_path: /metrics
              static_configs:
                - targets: [ ${OMNI_TARGETS} ]
            - job_name: 'nginx-exp'
              metrics_path: /metrics
              static_configs:
                - targets: ['nginx-exp:9113']
            - job_name: 'loki'
              metrics_path: /metrics
              static_configs:
                - targets: ['loki:3100']
          PROM_CFG
          . .github/echo_tools.sh
          retry 3 3 -- ctr pull prom/alertmanager
          retry 3 3 -- ctr pull prom/prometheus:v2.51.2
          ctr rm -f alertmanager prometheus >/dev/null 2>&1 || true
          ctr run -d --name alertmanager --network "${DOCKER_NET}" --restart unless-stopped -p 9093:9093 \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            prom/alertmanager
          ctr run -d --name prometheus --network "${DOCKER_NET}" --restart unless-stopped -p 9090:9090 \
            -v "$PWD/${ECHO_NET}/prometheus/prometheus.yml":/etc/prometheus/prometheus.yml:ro \
            -v "$PWD/${ECHO_NET}/prometheus/recording_rules.yml":/etc/prometheus/recording_rules.yml:ro \
            -v "$PWD/${ECHO_NET}/prometheus/alert_rules.yml":/etc/prometheus/alert_rules.yml:ro \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            prom/prometheus:v2.51.2 --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=1d --web.enable-lifecycle
          make_archive "16_prom_stack" "${ECHO_NET}/prometheus"

      - name: 🔐 Install cosign (keyless)
        if: ${{ env.PUSH_IMAGES == 'true' }}
        uses: sigstore/cosign-installer@v3

      - name: 🔑 GHCR login (actor)
        if: ${{ env.PUSH_IMAGES == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          echo "${GITHUB_TOKEN}" | ctr login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 🏷️ Push images → cosign sign (+Archive)
        if: ${{ env.PUSH_IMAGES == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"
          COSIGN_YES: "true"
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          mkdir -p "${ECHO_RELEASE}"
          for IMG in "${OMNI_IMAGE}" "${ANALYTICS_IMAGE}" "${NOTIFICATION_IMAGE}" "${AUDIT_IMAGE}" "${SCHEDULER_IMAGE}"; do
            IMAGE="${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMG}:latest"
            ctr tag "${IMG}:latest" "${IMAGE}"
            ctr push "${IMAGE}"
            DIGEST="$(skopeo inspect --creds "${{ github.actor }}:${GITHUB_TOKEN}" docker://${IMAGE} --format '{{.Digest}}')"
            cosign sign "${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMG}@${DIGEST}"
            echo "${IMG}@${DIGEST}" >> "${ECHO_RELEASE}/PUSHED_IMAGES.txt"
          done
          echo "PUSHED_AT=$(date -Iseconds)" >> "${ECHO_RELEASE}/PUSHED_IMAGES.txt"
          make_archive "17_pushed_images" "${ECHO_RELEASE}"

      - name: 📦 Create GitHub Release
        if: ${{ env.CREATE_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: echoops-${{ github.run_number }}
          name: EchoOps Multi-Service Release ${{ github.run_number }}
          draft: false
          prerelease: false

      - name: 🗃️ Snapshot(SQLite) + 권한 정리 (+Archive)
        shell: bash
        run: |
          set -Eeuo pipefail
          DB="${ECHO_DW}/db/echo_install.db"
          sqlite3 "${DB}" <<SQL
          CREATE TABLE IF NOT EXISTS echo_install_log(
            id INTEGER PRIMARY KEY AUTOINCREMENT, 
            installed_at TEXT DEFAULT (datetime('now')), 
            component TEXT, 
            detail TEXT
          );
          INSERT INTO echo_install_log(component,detail) VALUES
            ('엔진','docker/podman 자동'),
            ('td-sim','postgres:16 스키마+시드+생성'),
            ('nginx','rp+cors+ratelimit+waf+exporter'),
            ('옴니','dw+메트릭스+풀+헬스+슬롯=${SLOTS_OMNI}'),
            ('logs','loki+promtail'),
            ('prom','prometheus+alertmanager'),
            ('nic','install='||'${INSTALL_NIC}'),
            ('커널','업그레이드='||'${UPGRADE_KERNEL}'),
            ('저장소','프로필='||'${STORAGE_PROFILE}');
          SQL
          sudo chown -R "$USER":"$USER" .github/echo_* || true
          chmod -R a+rX .github/echo_* || true
          . .github/echo_tools.sh
          make_archive "18_sqlite_snapshot" "${ECHO_DW}/db"

      - name: 📤 아티팩트 업로드 (에코 번들 + 아카이브)
        uses: actions/upload-artifact@v4
        with:
          name: 에코-번들
          path: |
            .github/echo_td
            .github/echo_dw
            .github/echo_net
            .github/echo_omni
            .github/echo_logs
            .github/echo_archives

      - name: 🧾 커밋 및 푸시(최선을 다함)
        if: ${{ env.COMMIT_CHANGES == 'true' }}
        shell: bash
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config user.name "echo-bot"
          git config user.email "echo-bot@users.noreply.github.com"
          git add .github/echo_td .github/echo_dw .github/echo_net .github/echo_omni .github/echo_analytics .github/echo_notification .github/echo_audit .github/echo_scheduler .github/echo_logs .github/echo_archives .github/echo_releases || true
          if git diff --cached --quiet; then echo "[GIT] no changes"; exit 0; fi
          git commit -m "EchoOps v8.0.2: 다중 서비스 DB+이미지+릴리스 ($(date -Iseconds))"
          if [ -n "${GH_ADMIN_TOKEN:-}" ]; then
            git push "https://${GH_ADMIN_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
          else
            echo "[WARN] GH_ADMIN_TOKEN이 없습니다. 푸시를 건너뜁니다."
          fi
