name: Scorecard CLI Download and Run

on: [push, pull_request]

jobs:
  scorecard_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required for uploading SARIF results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Scorecard CLI
        id: setup_scorecard
        env:
          SCORECARD_VERSION: 5.2.1 # Recommended to use a recent, stable version like 5.2.1
          INSTALL_DIR: /opt/scorecard
        run: |
          echo "[📦] Downloading Scorecard CLI v${SCORECARD_VERSION}..."
          
          # Construct the binary filename, including .tar.gz
          BINARY="scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz" 
          URL="https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/${BINARY}"
          echo "[🌐] Download URL: $URL"
          
          # Download the tar.gz archive
          curl -fsSL -o "${BINARY}" "$URL"
          
          echo "[🧪] File type check:"
          file "${BINARY}" || (echo "[❌] Download failed or invalid file"; exit 1)
          
          echo "[📦] Extracting Scorecard CLI..."
          # Extract the contents of the tar.gz file
          tar -xzf "${BINARY}" 
          
          # The extracted binary is typically named 'scorecard'
          echo "[🔐] Making binary executable..."
          chmod +x scorecard
          
          echo "[📁] Moving to $INSTALL_DIR..."
          # Create the installation directory with sudo
          sudo mkdir -p $INSTALL_DIR
          # Move the executable into the installation directory with sudo
          sudo mv scorecard $INSTALL_DIR/
          
          # Add the installation directory to GITHUB_PATH so Scorecard can be found
          echo "$INSTALL_DIR" >> $GITHUB_PATH
          
          echo "[✅] Version Check:"
          # CORRECTED: Use 'version' subcommand instead of '--version' flag
          $INSTALL_DIR/scorecard version 

      - name: Run Scorecard
        env:
          OUT_DIR: .github/scorecard # Directory for output files
          TARGET_REPO: ${{ github.repository }} # Automatically uses your current repo
        run: |
          echo "Running Scorecard scan on ${TARGET_REPO}..."
          mkdir -p "${OUT_DIR}" # Create the output directory if it doesn't exist
          
          # Execute Scorecard, outputting to SARIF format
          /opt/scorecard/scorecard --repo "github.com/${TARGET_REPO}" --format sarif --output "${OUT_DIR}/results.sarif"
          echo "Scorecard scan completed. Results saved to ${OUT_DIR}/results.sarif"

      - name: Upload Scorecard results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .github/scorecard/results.sarif
