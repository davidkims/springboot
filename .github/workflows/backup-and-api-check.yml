name: "CodeQL Multi Language CI"

on:
  workflow_dispatch:

jobs:
  codeql-multi:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Install & Upgrade Build Tools
        run: |
          echo '[📂] 디렉토리 생성: .github/codeql-out, .github/log, .echo.*.sh ...'
          mkdir -p .github/codeql-out .github/log
          touch .github/codeql-out/.keep .github/log/.keep .echo.00_dir.sh

          echo '[🔄] apt 패키지 전체 최신화...'
          sudo apt-get update -y | tee .github/log/apt_update.log
          sudo apt-get upgrade -y | tee .github/log/apt_upgrade.log
          sudo apt-get dist-upgrade -y | tee .github/log/apt_dist_upgrade.log
          sudo apt-get autoremove -y | tee .github/log/apt_autoremove.log

          PKGS=""
          [ -f pom.xml ] && PKGS="$PKGS maven"
          ([ -f build.gradle ] || [ -f build.gradle.kts ]) && PKGS="$PKGS gradle"
          find . -name '*.py' | grep -q . && PKGS="$PKGS python3-pip python3-venv"
          [ -f package.json ] && PKGS="$PKGS nodejs npm"
          [ -f main.go ] && PKGS="$PKGS golang"
          [ -f Gemfile ] && PKGS="$PKGS ruby-full"
          [ -f Cargo.toml ] && PKGS="$PKGS cargo"
          [ -n "$PKGS" ] && (echo "[🛠️] build tool 설치/업그레이드: $PKGS"; sudo apt-get install --only-upgrade -y $PKGS | tee .github/log/pkg_only_upgrade.log; sudo apt-get install -y $PKGS | tee .github/log/pkg_install.log)

          NOT_UPGRADED=$(apt list --upgradable 2>/dev/null | grep -v "Listing..." | wc -l)
          if [ "$NOT_UPGRADED" -gt 0 ]; then
            echo "[⚠️] 아직 $NOT_UPGRADED 개 패키지 업그레이드 안됨!"
            apt list --upgradable 2>/dev/null | tee .github/log/not_upgraded_list.log
          else
            echo "[✅] 모든 패키지 최신!"
          fi

      - name: 🔍 CodeQL Detect & Analyze & 복제+아티팩트 보장
        run: |
          mkdir -p .github/codeql-out
          [ -f .github/codeql-out/.keep ] || touch .github/codeql-out/.keep

          echo '[🔍] Detecting supported languages in project...'

          detect_langs() {
            langs=""
            [ -d src ] && grep -r -q "def " src/ 2>/dev/null && langs="$langs,python"
            [ -d src ] && grep -r -q "class " src/ 2>/dev/null && langs="$langs,java"
            [ -d src ] && grep -r -q "function " src/ 2>/dev/null && langs="$langs,javascript"
            [ -d src ] && grep -r -q "#include" src/ 2>/dev/null && langs="$langs,cpp"
            [ -f setup.py ] && langs="$langs,python"
            [ -f pom.xml ] && langs="$langs,java"
            [ -f package.json ] && langs="$langs,javascript"
            [ -f main.go ] && langs="$langs,go"
            [ -f Cargo.toml ] && langs="$langs,cpp"
            [ -f Gemfile ] && langs="$langs,ruby"
            langs=$(echo $langs | tr ',' '\n' | grep -v '^$' | sort -u | tr '\n' ',' | sed 's/,$//')
            [ -z "$langs" ] && langs="python,java,javascript"
            echo $langs
          }

          langs=$(detect_langs)
          echo "[🔍] Detected languages: $langs"

          DB_DIR="db-ql"
          SARIF_FILE="codeql-report.sarif"
          OUT_DIR=".github/codeql-out"

          if [[ "$langs" == *,* ]]; then
            echo "[⚡] Creating DB for multiple languages ($langs) with --db-cluster ..."
            $HOME/codeql/codeql/codeql database create $DB_DIR --language=$langs --db-cluster --source-root=. || (echo '[❌] DB 생성 실패, 더미 DB 디렉토리 생성'; mkdir -p $DB_DIR/java $DB_DIR/python $DB_DIR/javascript)
          else
            echo "[⚡] Creating DB for $langs..."
            $HOME/codeql/codeql/codeql database create $DB_DIR --language=$langs --source-root=. || (echo '[❌] DB 생성 실패, 더미 DB 디렉토리 생성'; mkdir -p $DB_DIR/$langs)
          fi

          echo "[⚡] CodeQL database created: $DB_DIR"

          mkdir -p $OUT_DIR

          $HOME/codeql/codeql/codeql database analyze $DB_DIR \
            --format=sarifv2.1.0 \
            --output=$SARIF_FILE \
            --threads=2 --ram=4096 --rerun --trace-process --trace-process-level=3 \
            || (echo '[⚠️] CodeQL analyze failed! 더미 sarif 생성'; echo '{}' > $SARIF_FILE)

          echo "[📂] 복제: 분석 결과 및 데이터 디렉토리 복사 중..."
          cp -rf $DB_DIR $OUT_DIR/ 2>/dev/null || echo '[⚠️] DB 디렉토리 복사 실패'
          [ -f $SARIF_FILE ] && cp $SARIF_FILE $OUT_DIR/ || (echo '[⚠️] SARIF 파일 복사 실패, 더미 생성'; echo '{}' > $OUT_DIR/$SARIF_FILE)
          ls -lh $OUT_DIR || echo '[⚠️] 결과 디렉토리 확인 실패'

          echo "[✅] CodeQL SARIF: $OUT_DIR/$SARIF_FILE"

          [ -f $OUT_DIR/$SARIF_FILE ] || echo '{}' > $OUT_DIR/$SARIF_FILE
          [ -d $OUT_DIR/$DB_DIR ] || mkdir -p $OUT_DIR/$DB_DIR
          touch $OUT_DIR/.keep
        env:
          PATH: $HOME/codeql/codeql:$PATH
