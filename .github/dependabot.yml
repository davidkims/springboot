version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "21:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    groups:
      actions-all:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/workflow"
    schedule:
      interval: "daily"
      time: "21:10"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    groups:
      docker-all:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "21:20"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    insecure-external-code-execution: deny
    groups:
      pip-all:
        patterns: ["*"]

