name: 🐬 MySQL + Healthcheck + Auto-Restart Workflow

on:
  workflow_dispatch:

jobs:
  mysql-job:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass123
          MYSQL_DATABASE: sample_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🩺 Function:Wait for MySQL Healthcheck
        id: wait
        run: |
          echo "[🩺] Checking MySQL health..."
          CID=$(docker ps -q --filter "ancestor=mysql:8.0")
          for i in {1..30}; do
            if docker inspect --format='{{.State.Health.Status}}' $CID | grep -q "healthy"; then
              echo "[✔] MySQL container is healthy"
              exit 0
            fi
            echo "[..] Waiting for MySQL container health (attempt $i)..."
            sleep 2
          done

          echo "[❌] Healthcheck failed. Restarting container..."
          docker logs $CID
          docker restart $CID
          sleep 10
          if docker inspect --format='{{.State.Health.Status}}' $CID | grep -q "healthy"; then
            echo "[✔] MySQL healthy after restart"
          else
            echo "[❌] Restarted container still unhealthy."
            exit 1
          fi

      - name: 📄 Generate init.sql via echo
        run: |
          mkdir -p sql
          echo "USE sample_db;" > sql/init.sql

          echo "CREATE TABLE IF NOT EXISTS users (" >> sql/init.sql
          echo "  id INT AUTO_INCREMENT PRIMARY KEY," >> sql/init.sql
          echo "  name VARCHAR(100) NOT NULL" >> sql/init.sql
          echo ");" >> sql/init.sql
          echo "INSERT INTO users (name) VALUES ('Alice'), ('Bob'), ('Charlie');" >> sql/init.sql
          echo "" >> sql/init.sql

          echo "CREATE TABLE IF NOT EXISTS customers (" >> sql/init.sql
          echo "  customer_id INT AUTO_INCREMENT PRIMARY KEY," >> sql/init.sql
          echo "  customer_name VARCHAR(100) NOT NULL," >> sql/init.sql
          echo "  registered_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP" >> sql/init.sql
          echo ");" >> sql/init.sql
          echo "INSERT INTO customers (customer_name) VALUES ('Alice'), ('Bob'), ('David');" >> sql/init.sql

          echo "[✔] init.sql generated"
          cat sql/init.sql

      - name: ⚙️ Run Migration with Retry & Healthcheck
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client

          CID=$(docker ps -q --filter "ancestor=mysql:8.0")
          echo "[⚙️] Running migration..."
          if ! mysql -h 127.0.0.1 -u root -prootpass123 < sql/init.sql; then
            echo "[❌] Migration failed. Attempting restart..."
            docker logs $CID
            docker restart $CID
            sleep 10
            mysql -h 127.0.0.1 -u root -prootpass123 < sql/init.sql || {
              echo "[❌] Migration failed again after restart"
              exit 1
            }
          fi
          echo "[✔] Migration applied"

      - name: 🔍 Run SELECT & JOIN Queries with Healthcheck
        run: |
          CID=$(docker ps -q --filter "ancestor=mysql:8.0")
          if ! docker inspect --format='{{.State.Health.Status}}' $CID | grep -q "healthy"; then
            echo "[⚠️] Container unhealthy. Restarting before queries..."
            docker restart $CID
            sleep 10
          fi

          echo "[🔍] SELECT users count"
          mysql -h 127.0.0.1 -u root -prootpass123 -D sample_db -e "SELECT COUNT(*) FROM users;"

          echo "[🔍] SELECT customers count"
          mysql -h 127.0.0.1 -u root -prootpass123 -D sample_db -e "SELECT COUNT(*) FROM customers;"

          echo "[🔍] GROUP BY customers"
          mysql -h 127.0.0.1 -u root -prootpass123 -D sample_db -e "SELECT customer_name, COUNT(*) FROM customers GROUP BY customer_name;"

          echo "[🔍] JOIN users/customers"
          mysql -h 127.0.0.1 -u root -prootpass123 -D sample_db -e \
            "SELECT u.name AS user_name, c.customer_name FROM users u INNER JOIN customers c ON u.name = c.customer_name;"

      - name: 📤 Export customers.csv with Healthcheck
        run: |
          CID=$(docker ps -q --filter "ancestor=mysql:8.0")
          docker inspect --format='{{.State.Health.Status}}' $CID

          mkdir -p export
          echo "customer_id,customer_name,registered_at" > export/customers.csv
          mysql -h 127.0.0.1 -u root -prootpass123 -D sample_db -B -e \
            "SELECT customer_id, customer_name, registered_at FROM customers;" \
            | tail -n +2 >> export/customers.csv

          echo "[✔] CSV generated:"
          cat export/customers.csv

      - name: 📁 Upload customers.csv
        uses: actions/upload-artifact@v4
        with:
          name: customers-csv
          path: export/customers.csv
