name: "email-servers-mass-setup-and-monitoring-echo-v3"

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Base domain for virtual accounts"
        required: false
        default: "example.local"
      user_count:
        description: "Number of virtual accounts per service"
        required: false
        default: "50"
      test_count:
        description: "Number of test emails per server"
        required: false
        default: "3"
      mta_choice:
        description: "apt로 설치할 단일 MTA 선택 (none|postfix|exim4|opensmtpd)"
        required: false
        default: "none"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE: /opt/email
      DOMAIN: ${{ github.event.inputs.domain || 'example.local' }}
      USER_COUNT: ${{ github.event.inputs.user_count || '50' }}
      TEST_COUNT: ${{ github.event.inputs.test_count || '3' }}
      SERVICES: "postfix exim4 opensmtpd mailhog mailcatcher smtp-sink maildev"
      MTA_CHOICE: ${{ github.event.inputs.mta_choice || 'none' }}

      # Monitoring
      MONO: .monitoring
      INF_BUCKET: metrics
      INF_ORG: org
      INF_USER: admin
      INF_PASS: "admin1234!"
      INF_TOKEN: "dev-token-123456"

    steps:
      - name: 🧰 Prepare directory tree (per service + bulk)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo mkdir -p "$BASE"; sudo chown -R "$USER:$USER" "$BASE"
          mkdir -p "$BASE"/{policies,reports,artifacts,global,tools}
          for SVC in $SERVICES; do
            for d in bin config logs pid run spool queue tmp data certs keys users inbox outbox archive scripts env acl docs policies backups reports firewall permissions artifacts; do
              mkdir -p "$BASE/$SVC/$d"
            done
            for i in $(seq -w 001 200); do
              mkdir -p "$BASE/$SVC/bulk/dir_$i"
            done
          done
          chmod -R 755 "$BASE"

      - name: 📦 Base packages (no MTA conflicts; Docker upgrade-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates apt-transport-https software-properties-common \
            curl wget git build-essential jq \
            ruby-full libsqlite3-dev \
            apache2-utils openssl swaks \
            nginx clamav clamav-daemon
          # Docker: upgrade only to avoid containerd.io conflict
          sudo apt-get install -y --only-upgrade docker.io containerd || true
          sudo systemctl is-active --quiet docker || sudo systemctl start docker || true
          sudo systemctl enable --now nginx || true
          docker --version || true
          containerd --version || true
          docker network create emailnet >/dev/null 2>&1 || true

      - name: 🧯 Install single MTA (avoid mail-transport-agent conflicts)
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$MTA_CHOICE" in
            postfix)
              sudo apt-get install -y postfix bsd-mailx
              ;;
            exim4)
              sudo apt-get install -y exim4 exim4-daemon-light
              ;;
            opensmtpd)
              sudo apt-get install -y opensmtpd
              ;;
            none|"")
              echo "[INFO] Skipping apt MTA install to avoid conflicts."
              ;;
            *)
              echo "[WARN] Unknown MTA_CHOICE=$MTA_CHOICE; skipping."
              ;;
          esac
          # 설치하더라도 자동 기동 금지(테스트 서버와 포트 충돌 방지)
          sudo systemctl stop postfix 2>/dev/null || true
          sudo systemctl stop exim4 2>/dev/null || true
          sudo systemctl stop opensmtpd 2>/dev/null || true
          sudo systemctl disable postfix exim4 opensmtpd 2>/dev/null || true

      - name: 📄 Global README & policies (echo-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$BASE/policies"
          : > "$BASE/README.txt"
          {
            echo "CI workspace for email servers (echo-only config)."
            echo "Only one apt MTA can be installed at a time (mail-transport-agent conflict)."
            echo "SMTP test servers run as containers on high ports."
            echo "Monitoring via InfluxDB2 + Telegraf."
          } >> "$BASE/README.txt"
          : > "$BASE/policies/SECURITY.md"
          {
            echo "# Security (Test Only)"
            echo "- Do not use real credentials."
            echo "- Virtual users are generated per run."
            echo "- Outputs: users.csv, users.htpasswd(bcrypt), users.json."
          } >> "$BASE/policies/SECURITY.md"
          chmod 644 "$BASE/README.txt" "$BASE/policies/SECURITY.md"

      - name: 🔐 Echo firewall & permission templates (echo-only, not enforced)
        shell: bash
        run: |
          set -Eeuo pipefail
          for SVC in $SERVICES; do
            dir="$BASE/$SVC"; mkdir -p "$dir/firewall" "$dir/permissions"
            f="$dir/firewall/policy.conf"; : > "$f"
            {
              echo "# Echo-only firewall policy for $SVC (template)"
              echo "allow_tcp=1025,1026,1027,1081,8025,8026,9001,9002,9003,2525"
              echo "deny_all_else=true"
              echo 'note="CI test environment; not enforced"'
            } >> "$f"
            p="$dir/permissions/default.acl"; : > "$p"
            {
              echo "owner=$USER"
              echo "dir_mode=755"
              echo "file_mode=640"
            } >> "$p"
            chmod 640 "$f" "$p"
          done

      - name: 👥 Virtual users (CSV/JSON/htpasswd; echo-only with bcrypt)
        shell: bash
        run: |
          set -Eeuo pipefail
          for SVC in $SERVICES; do
            udir="$BASE/$SVC/users"; mkdir -p "$udir"
            : > "$udir/users.csv"; echo "email,password,service" >> "$udir/users.csv"
            : > "$udir/users.json"; echo "[" >> "$udir/users.json"
            : > "$udir/users.htpasswd"
            for i in $(seq 1 "$USER_COUNT"); do
              user="user${i}"
              pass="$(openssl rand -base64 18 | tr -d '\n=/' | cut -c1-12)"
              email="${user}@${DOMAIN}"
              echo "${email},${pass},${SVC}" >> "$udir/users.csv"
              if [ "$i" -gt 1 ]; then echo "," >> "$udir/users.json"; fi
              echo "  {\"email\":\"${email}\",\"password\":\"${pass}\",\"service\":\"${SVC}\"}" >> "$udir/users.json"
              htpasswd -Bbn "$email" "$pass" >> "$udir/users.htpasswd"
            done
            echo "]" >> "$udir/users.json"
            chmod 640 "$udir/users."*
          done

      - name: 🧪 Start SMTP test servers (containers)
        shell: bash
        run: |
          set -Eeuo pipefail
          docker rm -f mailhog mailcatcher maildev smtp-sink >/dev/null 2>&1 || true

          # MailHog (web:8025, smtp:1025)
          docker run -d --name mailhog --network emailnet \
            -p 1025:1025 -p 8025:8025 mailhog/mailhog

          # MailCatcher (web:8026, smtp:1026)
          docker run -d --name mailcatcher --network emailnet \
            -p 1026:1025 -p 8026:1080 dockage/mailcatcher

          # MailDev (web:1081, smtp:1027)
          docker run -d --name maildev --network emailnet \
            -p 1027:1025 -p 1081:1080 maildev/maildev

          # smtp-sink (listen:2525)
          docker run -d --name smtp-sink --network emailnet -p 2525:2525 \
            byrnedo/alpine-curl sh -c "apk add --no-cache busybox-extras && nc -l -p 2525 -k -v"

      - name: 📈 Monitoring:InfluxDB2 + Telegraf (echo-only configs)
        shell: bash
        env:
          INFLUX_BUCKET: ${{ env.INF_BUCKET }}
          INFLUX_ORG: ${{ env.INF_ORG }}
          INFLUX_USER: ${{ env.INF_USER }}
          INFLUX_PASS: ${{ env.INF_PASS }}
          INFLUX_TOKEN: ${{ env.INF_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$MONO/influxdb" "$MONO/telegraf"

          # InfluxDB config (echo-only)
          cfg="$MONO/influxdb/influxdb.conf"; : > "$cfg"
          echo 'reporting-disabled = true' >> "$cfg"
          echo 'bolt-path = "/var/lib/influxdb2/influxd.bolt"' >> "$cfg"
          echo 'engine-path = "/var/lib/influxdb2/engine"' >> "$cfg"
          echo 'http-bind-address = ":8086"' >> "$cfg"

          # Telegraf config (env expansion at runtime)
          tcfg="$MONO/telegraf/telegraf.conf"; : > "$tcfg"
          echo '[agent]' >> "$tcfg"
          echo '  interval = "10s"' >> "$tcfg"
          echo '  round_interval = true' >> "$tcfg"
          echo '' >> "$tcfg"
          echo '[[outputs.influxdb_v2]]' >> "$tcfg"
          echo '  urls = ["http://influxdb:8086"]' >> "$tcfg"
          echo '  token = "${INFLUX_TOKEN}"' >> "$tcfg"
          echo '  organization = "${INFLUX_ORG}"' >> "$tcfg"
          echo '  bucket = "${INFLUX_BUCKET}"' >> "$tcfg"
          echo '' >> "$tcfg"
          echo '[[inputs.cpu]]' >> "$tcfg"
          echo '  percpu = true' >> "$tcfg"
          echo '  totalcpu = true' >> "$tcfg"
          echo '[[inputs.mem]]' >> "$tcfg"
          echo '[[inputs.disk]]' >> "$tcfg"
          echo '  ignore_fs = ["tmpfs","devtmpfs","overlay"]' >> "$tcfg"
          echo '[[inputs.net]]' >> "$tcfg"

          # Launch InfluxDB
          docker rm -f influxdb telegraf >/dev/null 2>&1 || true
          docker run -d --name influxdb --network emailnet \
            -p 8086:8086 \
            -e INFLUXD_CONFIG_PATH=/etc/influxdb2/config.toml \
            -v "$MONO/influxdb/influxdb.conf:/etc/influxdb2/config.toml" \
            influxdb:2.7

          echo "[wait] InfluxDB..."
          timeout 120 bash -c 'until docker exec influxdb influx ping >/dev/null 2>&1; do sleep 2; done'

          # Non-interactive setup
          docker exec influxdb influx setup --skip-verify --force \
            --bucket "$INFLUX_BUCKET" \
            --org "$INFLUX_ORG" \
            --username "$INFLUX_USER" \
            --password "$INFLUX_PASS" \
            --token "$INFLUX_TOKEN" >/dev/null

          # Launch Telegraf (pass env for token/org/bucket)
          docker run -d --name telegraf --network emailnet \
            -e INFLUX_TOKEN="$INFLUX_TOKEN" \
            -e INFLUX_ORG="$INFLUX_ORG" \
            -e INFLUX_BUCKET="$INFLUX_BUCKET" \
            -v "$MONO/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf" \
            telegraf:1.30

      - name: 🧹 ClamAV freshclam (echo-only config) & quick scan
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo systemctl stop clamav-freshclam || true
          : | sudo tee /etc/clamav/freshclam.conf >/dev/null
          echo 'DatabaseMirror db.local.clamav.net' | sudo tee -a /etc/clamav/freshclam.conf >/dev/null
          echo 'DatabaseMirror database.clamav.net' | sudo tee -a /etc/clamav/freshclam.conf >/dev/null
          echo 'MaxAttempts 3' | sudo tee -a /etc/clamav/freshclam.conf >/dev/null
          sudo freshclam || true
          mkdir -p "$BASE/reports"
          sudo clamscan -r /usr --max-filesize=50M --max-scansize=200M --infected --log="$BASE/reports/clamscan.log" || true

      - name: ✉️ Send tests via swaks (mailhog/mailcatcher/maildev/smtp-sink)
        shell: bash
        run: |
          set -Eeuo pipefail
          from="tester@${DOMAIN}"
          for N in $(seq 1 "$TEST_COUNT"); do
            swaks --server 127.0.0.1 --port 1025 --from "$from" --to "mh${N}@${DOMAIN}" --data "Test to MailHog #$N" || true
            swaks --server 127.0.0.1 --port 1026 --from "$from" --to "mc${N}@${DOMAIN}" --data "Test to MailCatcher #$N" || true
            swaks --server 127.0.0.1 --port 1027 --from "$from" --to "md${N}@${DOMAIN}" --data "Test to MailDev #$N" || true
            swaks --server 127.0.0.1 --port 2525 --from "$from" --to "sink${N}@${DOMAIN}" --data "Test to smtp-sink #$N" || true
          done

      - name: 📦 Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: email-echo-v3-artifacts
          path: |
            /opt/email/**/*
            .monitoring/**/*
