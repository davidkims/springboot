name: 🗂️ MEGA-DB/거래/계좌/이체/유저/시뮬/설치/권한/대량/운영/유틸/Compose-통합

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  db-echo-mega:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 모든 echo 디렉토리 (Full Coverage + TD + DWH 포함)
        run: |
          for d in \
            .github/echo_db/{dirs,files,installs,upgrade,permissions,scripts,logs,services,compose,homebrew,choco,snap,marketplace,backup,init,test,migration,import,export,serverinfo,errorlog,util,mass_db,mass_script,mass_query,ledger,vaccount,transfer,user,sim,teradata,dwh}; do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo_db/echo_dir_create.sh
            mkdir -p $d
          done

      - name: 📝 대량 거래/계좌/이체/시뮬/쿼리/TD/DWH 자동 에코 생성
        run: |
          set -e
          SERVICES="mysql postgresql sqlite3"
          MASS_CNT=10
          TX_TYPES="DEPOSIT WITHDRAWAL TRANSFER PAYMENT FEE"

          for svc in $SERVICES; do
            for i in $(seq 1 $MASS_CNT); do
              echo "CREATE TABLE IF NOT EXISTS user_${svc} (user_id VARCHAR(50) PRIMARY KEY, name VARCHAR(50), email VARCHAR(100), reg_ts DATETIME);" > .github/echo_db/user/${svc}_user_create.sql
              echo "INSERT INTO user_${svc} (user_id, name, email, reg_ts) VALUES ('user_${svc}_$i', 'User $i', 'user${i}@${svc}.com', CURRENT_TIMESTAMP);" >> .github/echo_db/user/${svc}_user_insert.sql

              acct="account_${svc}_$i"
              echo "CREATE TABLE IF NOT EXISTS $acct (account_no VARCHAR(50) PRIMARY KEY, user_id VARCHAR(50), type VARCHAR(10), balance INT, open_dt DATETIME);" > .github/echo_db/vaccount/${svc}_${acct}_create.sql
              echo "INSERT INTO $acct (account_no, user_id, type, balance, open_dt) VALUES ('ACC${svc}$(printf %04d $i)', 'user_${svc}_$i', 'CHECKING', 100000, CURRENT_TIMESTAMP);" >> .github/echo_db/vaccount/${svc}_${acct}_insert.sql

              ledger_tbl="ledger_${svc}_$i"
              echo "CREATE TABLE IF NOT EXISTS $ledger_tbl (tx_id INT PRIMARY KEY, account_no VARCHAR(50), tx_type VARCHAR(20), amount INT, balance INT, note VARCHAR(100), ts DATETIME);" > .github/echo_db/ledger/${svc}_${ledger_tbl}_create.sql
              for tt in $TX_TYPES; do
                echo "INSERT INTO $ledger_tbl (tx_id, account_no, tx_type, amount, balance, note, ts) VALUES ($i, 'ACC${svc}$(printf %04d $i)', '$tt', $((10000+$i)), $((100000+$i)), '$tt Tx $i', CURRENT_TIMESTAMP);" >> .github/echo_db/ledger/${svc}_${ledger_tbl}_insert.sql
              done

              transfer_tbl="transfer_${svc}_$i"
              echo "CREATE TABLE IF NOT EXISTS $transfer_tbl (tx_id INT PRIMARY KEY, from_acc VARCHAR(50), to_acc VARCHAR(50), amount INT, tx_type VARCHAR(20), ts DATETIME);" > .github/echo_db/transfer/${svc}_${transfer_tbl}_create.sql
              echo "INSERT INTO $transfer_tbl (tx_id, from_acc, to_acc, amount, tx_type, ts) VALUES ($i, 'ACC${svc}$(printf %04d $i)', 'ACC${svc}$(printf %04d $((i+1)))', 5000, 'TRANSFER', CURRENT_TIMESTAMP);" >> .github/echo_db/transfer/${svc}_${transfer_tbl}_insert.sql
            done

            for cat in user vaccount ledger transfer; do
              F=".github/echo_db/sim/${svc}_${cat}_sim_run.sh"
              echo "echo '[에코][시뮬] $svc $cat 실행'" > $F
              echo "for sql in .github/echo_db/$cat/${svc}_*.sql; do" >> $F
              if [ "$svc" = "mysql" ]; then
                echo "  echo \"[실행] mysql -uroot -prootpass123 test_db < \$sql\"" >> $F
              elif [ "$svc" = "postgresql" ]; then
                echo "  echo \"[실행] psql -U postgres -d test_db -f \$sql\"" >> $F
              elif [ "$svc" = "sqlite3" ]; then
                echo "  echo \"[실행] sqlite3 test.db < \$sql\"" >> $F
              fi
              echo "done" >> $F
            done
          done

          for i in $(seq 1 $MASS_CNT); do
            db="sampledb_$i"
            echo "CREATE DATABASE IF NOT EXISTS $db;" > .github/echo_db/mass_db/${db}_create.sql
            echo "DROP DATABASE IF EXISTS $db;" > .github/echo_db/mass_db/${db}_drop.sql
            user="user_$i"
            pw="pw_$i"
            echo "CREATE USER '$user'@'%' IDENTIFIED BY '$pw';" > .github/echo_db/mass_db/${user}_create.sql
            echo "GRANT ALL ON *.* TO '$user'@'%';" >> .github/echo_db/mass_db/${user}_create.sql
            tbl="table_$i"
            echo "CREATE TABLE $tbl (id INT PRIMARY KEY, value VARCHAR(100));" > .github/echo_db/mass_query/${tbl}_create.sql
            echo "INSERT INTO $tbl (id, value) VALUES ($i, 'Value_$i');" > .github/echo_db/mass_query/${tbl}_insert.sql
            echo "SELECT * FROM $tbl;" > .github/echo_db/mass_query/${tbl}_select.sql
            for j in $(seq 1 5); do
              echo "INSERT INTO $tbl (id, value) VALUES ($j, 'V${i}_$j');" >> .github/echo_db/mass_query/${tbl}_bulk_insert.sql
            done
          done

          for db in mysql-server mariadb-server postgresql sqlite3 mongodb redis-server; do
            echo "sudo apt-get update -y" > .github/echo_db/installs/$db-apt-install.sh
            echo "sudo apt-get install -y $db" >> .github/echo_db/installs/$db-apt-install.sh
            echo "sudo apt-get upgrade -y $db" > .github/echo_db/upgrade/$db-apt-upgrade.sh
            echo "brew install $db" > .github/echo_db/homebrew/$db-brew-install.sh
            echo "choco install $db" > .github/echo_db/choco/$db-choco-install.sh
            echo "sudo snap install $db" > .github/echo_db/snap/$db-snap-install.sh
            for feat in init backup test migration import export serverinfo errorlog util; do
              echo "echo '[에코] $db $feat'" > .github/echo_db/$feat/$db-$feat.sh
            done
          done

          for db in mysql postgresql mongodb redis; do
            yml=".github/echo_db/services/$db-service.yml"
            echo "services:" > $yml
            echo "  $db:" >> $yml
            echo "    image: $db:latest" >> $yml
            if [ "$db" = "mysql" ]; then
              echo "    environment:\n      MYSQL_ROOT_PASSWORD: rootpass123" >> $yml
              echo "    ports: ['3306:3306']" >> $yml
            elif [ "$db" = "postgresql" ]; then
              echo "    environment:\n      POSTGRES_PASSWORD: pgpass123" >> $yml
              echo "    ports: ['5432:5432']" >> $yml
            elif [ "$db" = "mongodb" ]; then
              echo "    ports: ['27017:27017']" >> $yml
            elif [ "$db" = "redis" ]; then
              echo "    ports: ['6379:6379']" >> $yml
            fi
          done

          echo "version: '3'\nservices:" > .github/echo_db/compose/all-db-compose.yml
          echo "  mysql:\n    image: mysql:8.0\n    environment:\n      MYSQL_ROOT_PASSWORD: rootpass123\n    ports: [ '3306:3306' ]" >> .github/echo_db/compose/all-db-compose.yml
          echo "  postgres:\n    image: postgres:15\n    environment:\n      POSTGRES_PASSWORD: pgpass123\n    ports: [ '5432:5432' ]" >> .github/echo_db/compose/all-db-compose.yml
          echo "  mongodb:\n    image: mongo:latest\n    ports: [ '27017:27017' ]" >> .github/echo_db/compose/all-db-compose.yml
          echo "  redis:\n    image: redis:latest\n    ports: [ '6379:6379' ]" >> .github/echo_db/compose/all-db-compose.yml
          echo "docker-compose up -d" > .github/echo_db/compose/compose_echo.sh

          echo "- uses: harmon758/postgresql-action@v1\n  with:\n    postgresql version: '13'\n    postgresql db: 'test_db'\n    postgresql user: 'postgres'\n    postgresql password: 'pgpass'" > .github/echo_db/marketplace/postgresql-action.yml

          for db in mysql postgresql mongodb redis; do
            echo "GRANT ALL PRIVILEGES ON *.* TO 'runner'@'%' IDENTIFIED BY 'pw' WITH GRANT OPTION;" > .github/echo_db/permissions/${db}-permission.sh
            echo "FLUSH PRIVILEGES;" >> .github/echo_db/permissions/${db}-permission.sh
            echo "chown -R runner:runner /var/lib/$db" >> .github/echo_db/permissions/${db}-permission.sh
            echo "chmod 700 /var/lib/$db" >> .github/echo_db/permissions/${db}-permission.sh
          done

          for i in $(seq 1 $MASS_CNT); do
            echo "echo '[에코][TD] 테이블 생성: td_table_$i'" > .github/echo_db/teradata/td_table_${i}_create.sql
            echo "CREATE SET TABLE td_table_$i (id INT, name VARCHAR(100), created_ts TIMESTAMP(0));" >> .github/echo_db/teradata/td_table_${i}_create.sql
            echo "INSERT INTO td_table_$i (id, name, created_ts) VALUES ($i, 'User_$i', CURRENT_TIMESTAMP);" >> .github/echo_db/teradata/td_table_${i}_insert.sql
            echo "CREATE USER td_user_$i FROM DBC AS PERM=2000000 PASSWORD='pw_$i';" > .github/echo_db/teradata/td_user_${i}_create.sql

            echo "CREATE TABLE dim_customer_$i (cust_id INT, name VARCHAR(100), region VARCHAR(50));" > .github/echo_db/dwh/dim_customer_${i}.sql
            echo "CREATE TABLE fact_sales_$i (sale_id INT, cust_id INT, amount DECIMAL(10,2), sale_dt DATE);" > .github/echo_db/dwh/fact_sales_${i}.sql
            echo "CREATE VIEW dm_region_sales_$i AS SELECT region, SUM(amount) AS total FROM fact_sales_$i JOIN dim_customer_$i USING(cust_id) GROUP BY region;" > .github/echo_db/dwh/dm_region_sales_${i}.sql
          done

          for cat in teradata dwh; do
            echo "echo '[에코][시뮬] $cat 시뮬레이션 실행'" > .github/echo_db/sim/${cat}_sim_run.sh
            echo "for sql in .github/echo_db/$cat/*.sql; do" >> .github/echo_db/sim/${cat}_sim_run.sh
            echo "  echo \"[실행] SQL: \$sql (연동 필요)\"" >> .github/echo_db/sim/${cat}_sim_run.sh
            echo "done" >> .github/echo_db/sim/${cat}_sim_run.sh
          done

      - name: 🛠 DB 설치/업그레이드 실제 수행 (echo 포함)
        run: |
          for db in mysql-server mariadb-server postgresql sqlite3 mongodb redis-server; do
            echo "[에코] 설치: $db"
            sudo apt-get update -y
            sudo apt-get install -y $db || echo "[ERROR] $db 설치 실패"
            sudo apt-get upgrade -y $db || echo "[ERROR] $db 업그레이드 실패"
          done

      - name: 📤 전체 echo 출력 확인
        run: |
          echo "[에코] 전체 echo 출력 시작"
          find .github/echo_db -type f | sort | while read f; do
            echo "[파일] $f"
            cat "$f"
            echo
          done
