name: ♾️ Transfer Log Backup - Cron (60건 Infinite)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  transfer_log_backup:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      oracle:
        image: gvenzl/oracle-xe:21-faststart
        env:
          ORACLE_PASSWORD: testpass
          ORACLE_ALLOW_REMOTE: "true"
        ports:
          - 1521:1521

    env:
      BACKUP_DIR: /opt/backup/transfer
      INIT_SCRIPTS_DIR: /opt/db/init
      DB_CONFIG_DIR: /opt/db/config
      POOLING_CONFIG: /opt/db/config/pooling.properties
      SSL_CERT_DIR: /opt/db/ssl
      MONITORING_DIR: /opt/monitor
      K8S_DIR: /opt/k8s
      HELM_CHART_DIR: /opt/helm/backup-chart

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 📁 Prepare directories and permissions
        run: |
          echo "[📁] Creating required directories and setting ownership to runner..."
          for dir in \
            $INIT_SCRIPTS_DIR/mysql \
            $INIT_SCRIPTS_DIR/postgres \
            $INIT_SCRIPTS_DIR/oracle \
            $DB_CONFIG_DIR \
            $SSL_CERT_DIR \
            $BACKUP_DIR/incremental \
            $MONITORING_DIR/metrics \
            $MONITORING_DIR/logs \
            $K8S_DIR/docker-compose \
            $K8S_DIR/manifests \
            $HELM_CHART_DIR; do
            sudo mkdir -p "$dir"
            sudo chmod 750 "$dir"
          done
          echo "[🔒] Chowning all /opt subdirs to runner..."
          sudo chown -R "$(whoami):$(whoami)" /opt/db /opt/backup /opt/monitor /opt/k8s /opt/helm

      - name: 🔐 Generate self-signed SSL certificates
        run: |
          echo "[🔐] Generating SSL/TLS certificates..."
          mkdir -p "$SSL_CERT_DIR"
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$SSL_CERT_DIR/db.key" \
            -x509 -days 365 \
            -out "$SSL_CERT_DIR/db.crt" \
            -subj "/CN=database.local"
          chmod 600 "$SSL_CERT_DIR/db.key" "$SSL_CERT_DIR/db.crt"

      # ... the rest of your steps remain unchanged ...
