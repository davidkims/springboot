name: 🐬 MySQL+Oracle FullOps Echo Workflow (100% Auto, Echo, Secure, Pages, Scorecard)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  fullops:
    runs-on: ubuntu-latest

    env:
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass123
      MYSQL_DB: sample_db
      MASS_TABLE: 6
      MASS_USER: 8
      MASS_TXN: 20

    steps:
      - name: 📁 Checkout
        uses: actions/checkout@v4

      - name: 📁 Echo 디렉토리 전체 생성 (에러 방지 순서 보장)
        run: |
          mkdir -p .github/echo
          echo "[INIT] mkdir -p .github/echo" > .github/echo/init_dirs_all.log

          for d in \
            .github/echo/mysql \
            .github/echo/mysql/logs \
            .github/echo/mysql/ddl \
            .github/echo/mysql/user \
            .github/echo/mysql/txn \
            .github/echo/mysql/account_info \
            .github/echo/mysql/sock \
            .github/echo/mysql/portcheck \
            .github/echo/mysql/firewall \
            .github/echo/mysql/secure \
            .github/echo/mysql/scripts \
            .github/echo/mysql/permissions \
            .github/echo/oracle \
            .github/echo/oracle/logs \
            .github/echo/oracle/ddl \
            .github/echo/oracle/txn \
            .github/echo/oracle/user \
            .github/echo/oracle/client \
            .github/echo/oracle/sock \
            .github/echo/oracle/secure \
            .github/echo/oracle/scripts \
            .github/echo/oracle/permissions \
            .github/echo/policy \
            .github/echo/scenario \
            .github/echo/backup \
            .github/echo/monitor \
            .github/echo/reboot \
            .github/echo/netcat \
            .github/echo/firewall_reset \
            .github/echo/mycnf \
            .github/echo/zip
          do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo/init_dirs_all.log
            mkdir -p "$d"
          done

      - name: 🔄 DDL/USER/INSERT 자동 대량 실행 (MySQL)
        run: |
          for i in $(seq 1 $MASS_TABLE); do
            echo "CREATE TABLE IF NOT EXISTS demo_table_$i (id INT PRIMARY KEY AUTO_INCREMENT, value VARCHAR(100));" > .github/echo/mysql/ddl/demo_table_$i.sql
            mysql -uroot -p$MYSQL_PASSWORD $MYSQL_DB < .github/echo/mysql/ddl/demo_table_$i.sql
          done

          for i in $(seq 1 $MASS_USER); do
            echo "CREATE USER IF NOT EXISTS 'user_$i'@'%' IDENTIFIED BY 'pw_$i'; GRANT ALL ON $MYSQL_DB.* TO 'user_$i'@'%';" > .github/echo/mysql/user/user_$i.sql
            mysql -uroot -p$MYSQL_PASSWORD < .github/echo/mysql/user/user_$i.sql
          done

          > .github/echo/mysql/txn/txn_batch.sql
          for i in $(seq 1 $MASS_TXN); do
            echo "INSERT INTO demo_table_$((i % $MASS_TABLE + 1)) (value) VALUES ('val_$i');" >> .github/echo/mysql/txn/txn_batch.sql
          done
          mysql -uroot -p$MYSQL_PASSWORD $MYSQL_DB < .github/echo/mysql/txn/txn_batch.sql

      - name: 🔗 Oracle SQL 실행 via sqlplus (에코 포함)
        run: |
          echo "CREATE TABLE oracle_table (id NUMBER PRIMARY KEY, val VARCHAR2(100));" > .github/echo/oracle/ddl/create_table.sql
          echo "INSERT INTO oracle_table VALUES (1, 'OracleTest');" > .github/echo/oracle/txn/insert.sql
          echo "SELECT * FROM oracle_table;" > .github/echo/oracle/scripts/select.sql

          echo "sqlplus 실행은 실제 Oracle 인스턴스와 연결 필요" > .github/echo/oracle/client/sqlplus_dummy.txt

      - name: 💾 mysqldump + zip + GitHub Pages 업로드
        run: |
          mkdir -p site/db_backup
          mysqldump -u$MYSQL_USER -p$MYSQL_PASSWORD $MYSQL_DB > site/db_backup/dump.sql
          zip -j site/db_backup/dump.zip site/db_backup/dump.sql

      - name: 📑 .provenance.json/.sarif 생성
        run: |
          echo '{"provenance": "MySQL Oracle FullOps", "timestamp": "'$(date)'"}' > site/db_backup/provenance.json
          echo '{"runs": [{"tool": {"driver": {"name": "EchoAnalyzer"}}}]}' > site/db_backup/result.sarif

      - name: 🔐 Scorecard/CodeQL 스캔 + 결과 echo 자동 PR
        uses: ossf/scorecard-action@v2
        with:
          results_file: site/db_backup/scorecard.json

      - name: 🚀 GitHub Pages 배포 (peaceiris)
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: site/db_backup
          publish_branch: gh-pages
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
