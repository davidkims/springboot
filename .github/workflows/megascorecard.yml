name: 🛡️ MEGA Scorecard + EchoOps (Split Validated)

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '16 11 * * 2'
    - cron: '*/3 * * * *'
  workflow_dispatch:
  branch_protection_rule:

permissions: read-all

jobs:
  scorecard-analysis:
    name: ✅ Validated Scorecard Upload
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Run Scorecard analysis (validated)
        uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: ☁️ Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  post-analysis-echo:
    name: 🔧 EchoOps, File Size, Artifact
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 📁 Create echo directories
        run: |
          for d in echo_dirs echo_scorecard echo_monitoring echo_pages; do
            mkdir -p ".github/${d}"
            echo "echo '[ECHO] Created directory: .github/${d}'" >> .github/${d}/create_dirs.sh
          done

      - name: 🌐 Copy SARIF to Pages directory
        run: |
          mkdir -p site/scorecard
          cp results.sarif site/scorecard/scorecard-results.sarif
          echo "echo '[ECHO] Copied SARIF to site/scorecard'" >> .github/echo_pages/copy_scorecard_sarif.sh

      - name: 📦 Check Largest Files and Total Size
        run: |
          mkdir -p .github/echo_monitoring
          du -ah . | sort -hr | head -n 30 > .github/echo_monitoring/top_file_sizes.txt || true
          du -sh . > .github/echo_monitoring/total_size.txt || true
          echo "echo '[ECHO] File size check complete'" >> .github/echo_monitoring/file_size_check.sh

      - name: 📄 Upload SARIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scorecard-SARIF
          path: results.sarif
          retention-days: 5
