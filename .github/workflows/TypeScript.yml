name: 🟦 TypeScript 설치/에코/디렉토리/권한 자동화

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  typescript-setup:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 주요 디렉토리/에코/로그 생성 (echo)
        run: |
          set -e
          # 에코 및 로그 디렉토리 생성
          for d in .github/echo_ts .github/logs_ts .github/ts_projects .github/ts_bin; do
            echo "echo 'mkdir -p $d'"
            mkdir -p "$d"
          done
          # 권한 설정 (chmod, chown 등)
          echo "echo 'chmod 755 .github/echo_ts .github/logs_ts .github/ts_projects .github/ts_bin'"
          chmod 755 .github/echo_ts .github/logs_ts .github/ts_projects .github/ts_bin

      - name: 📄 echo용 TypeScript 샘플 파일 생성
        run: |
          set -e
          # 샘플 TypeScript 코드 파일 에코 생성
          echo "echo \"console.log('Hello, TypeScript!')\" > .github/ts_projects/hello.ts"
          echo "console.log('Hello, TypeScript!')" > .github/ts_projects/hello.ts
          echo "echo '에코: .github/ts_projects/hello.ts 생성됨'" | tee -a .github/echo_ts/echo_file.log

      - name: 📦 Node.js 및 TypeScript 설치 (에코)
        run: |
          set -e
          echo "echo '[Node.js 설치 및 npm 최신화]'"
          echo '[Node.js 설치 및 npm 최신화]'
          echo "echo 'sudo apt-get update -y && sudo apt-get install -y nodejs npm'"
          sudo apt-get update -y
          sudo apt-get install -y nodejs npm

          echo "echo '[npm, npx 버전 확인]'"
          echo '[npm, npx 버전 확인]'
          npm -v
          npx -v

          echo "echo '[TypeScript 전역 설치]'"
          echo '[TypeScript 전역 설치]'
          npm install -g typescript

          echo "echo '[tsc 버전 확인 및 경로 확인]'"
          echo '[tsc 버전 확인 및 경로 확인]'
          tsc -v
          which tsc

          echo "echo '[tsc 심볼릭 링크 .github/ts_bin 에 복사]'"
          ln -sf $(which tsc) .github/ts_bin/tsc

      - name: 🛠️ TypeScript 컴파일 테스트 및 권한 확인 (에코)
        run: |
          set -e
          echo "echo '[hello.ts → hello.js 컴파일]'"
          tsc .github/ts_projects/hello.ts --outDir .github/ts_projects/

          echo "echo '[컴파일 결과 파일 권한 확인 및 755 설정]'"
          chmod 755 .github/ts_projects/hello.js

          echo "echo '[node 실행 테스트]'"
          node .github/ts_projects/hello.js | tee .github/logs_ts/hello_run.log

          echo "echo '[실행 로그 및 권한 확인]'"
          ls -l .github/ts_projects/ | tee .github/logs_ts/ls.log

      - name: 🗂️ 결과 파일/권한 에코 출력
        run: |
          set -e
          echo "echo '[에코/로그/TS 프로젝트 디렉토리 파일 리스트]'"
          echo '[에코/로그/TS 프로젝트 디렉토리 파일 리스트]'
          find .github/ -type f | tee .github/logs_ts/files_list.log

          echo "echo '[권한 및 오너 정보 확인]'"
          ls -ld .github/echo_ts .github/logs_ts .github/ts_projects .github/ts_bin | tee -a .github/logs_ts/perm_owner.log
