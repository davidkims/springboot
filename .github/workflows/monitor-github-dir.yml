name: 🧠 .github 실시간 모니터링 + 집계서버 설치 + PR 코멘트

on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'  # 매 1분마다 실행

permissions:
  contents: read
  pull-requests: write

jobs:
  monitor-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 📁 Create echo directories
        run: |
          for d in echo_logs echo_logs/monitoring echo_logs/infra echo_logs/commands echo_logs/summary; do
            mkdir -p ".github/$d"
            echo "echo '[CREATE] 디렉토리 생성: .github/$d'" >> .github/echo_logs/infra/create_dirs.sh
          done
          chmod +x .github/echo_logs/infra/create_dirs.sh
          bash .github/echo_logs/infra/create_dirs.sh

      - name: 🏗️ 집계서버 설치 시뮬레이션 (에코 기반)
        run: |
          echo "#!/bin/bash" > .github/echo_logs/infra/install_server.sh
          echo "echo '[INSTALL] 집계 서버 설치 중...'" >> .github/echo_logs/infra/install_server.sh
          echo "sudo apt-get update && sudo apt-get install -y htop net-tools nginx" >> .github/echo_logs/infra/install_server.sh
          echo "echo '[INSTALL] 완료: nginx, htop, net-tools'" >> .github/echo_logs/infra/install_server.sh
          chmod +x .github/echo_logs/infra/install_server.sh
          bash .github/echo_logs/infra/install_server.sh | tee .github/echo_logs/infra/install_output.log

      - name: 📦 .github 디렉토리 용량 분석
        run: |
          echo "[FILE SIZE] .github 내부 파일 크기 목록" > .github/echo_logs/monitoring/github_file_sizes.txt
          du -ah .github | sort -hr | tee -a .github/echo_logs/monitoring/github_file_sizes.txt
          
          echo "[TOTAL SIZE] .github 전체 용량" > .github/echo_logs/monitoring/github_total_size.txt
          du -sh .github | tee -a .github/echo_logs/monitoring/github_total_size.txt

      - name: 🧠 CPU, MEM, DISK 리소스 분석
        run: |
          echo "[RESOURCE USAGE] 시스템 리소스 정보" > .github/echo_logs/monitoring/system_usage.txt
          echo "\n🧠 CPU:" >> .github/echo_logs/monitoring/system_usage.txt
          top -b -n 1 | head -n 5 >> .github/echo_logs/monitoring/system_usage.txt
          echo "\n🧠 Memory:" >> .github/echo_logs/monitoring/system_usage.txt
          free -h >> .github/echo_logs/monitoring/system_usage.txt
          echo "\n🧠 Disk:" >> .github/echo_logs/monitoring/system_usage.txt
          df -h >> .github/echo_logs/monitoring/system_usage.txt
          cat .github/echo_logs/monitoring/system_usage.txt

      - name: 📊 요약 정리 파일 생성
        run: |
          echo "📦 요약 보고서 (.github 디렉토리 모니터링)" > .github/echo_logs/summary/summary.txt
          echo "⏰ Timestamp: $(date -u)" >> .github/echo_logs/summary/summary.txt
          echo "\n[크기 요약]" >> .github/echo_logs/summary/summary.txt
          cat .github/echo_logs/monitoring/github_total_size.txt >> .github/echo_logs/summary/summary.txt
          echo "\n[시스템 상태]" >> .github/echo_logs/summary/summary.txt
          head -n 15 .github/echo_logs/monitoring/system_usage.txt >> .github/echo_logs/summary/summary.txt
          cat .github/echo_logs/summary/summary.txt

      - name: 📤 Upload all monitoring artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-full-report
          path: |
            .github/echo_logs/monitoring/github_file_sizes.txt
            .github/echo_logs/monitoring/github_total_size.txt
            .github/echo_logs/monitoring/system_usage.txt
            .github/echo_logs/infra/install_output.log
            .github/echo_logs/summary/summary.txt

      - name: 💬 PR 코멘트 자동 작성
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const file = '.github/echo_logs/summary/summary.txt';
            const body = fs.readFileSync(file, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `📊 **.github 디렉토리 모니터링 결과**\n\n\`\`\`\n${body}\n\`\`\``
            });
