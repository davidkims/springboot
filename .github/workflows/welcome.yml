name: Welcome to the Microsoft Generative AI

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  assess-pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Print Environment Info
        run: |
          echo "[🧠] Pull Request opened by: ${{ github.actor }}"
          echo "[📁] Repo: ${{ github.repository }}"
          echo "[⚙️] Branch: ${{ github.head_ref || github.ref_name }}"
          echo "[⏱️] Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: 🛠️ Setup Node (for GitHub Actions)
        uses: actions/setup-node@v4
        with:
          node-version: 20
        continue-on-error: true
      - run: |
          echo "[✅] Node.js 설치 완료"

      - name: 🏷️ Add 'needs-review' Label and Thanks Comment
        uses: actions/github-script@v6
        with:
          script: |
            const issueAuthor = context.payload.sender.login
            console.log("[✍️] Adding 'needs-review' label and comment for PR from @" + issueAuthor)

            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['needs-review']
            })

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `👋 Thanks for contributing @${issueAuthor}! We will review the pull request and get back to you soon.`
            })

      - name: 👥 Auto-assign reviewer (e.g. koreyspace)
        uses: pozil/auto-assign-issue@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: koreyspace
      - run: echo "[✅] PR 자동 할당 완료: koreyspace"
