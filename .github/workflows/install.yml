name: 🧹 용량 최대 항목 무한 삭제 자동화

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup-largest:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 가장 큰 파일/폴더 탐지
        id: largest
        run: |
          echo "[INFO] 디렉토리/파일 사이즈 목록:"
          du -ah . | sort -hr | head -n 20 | tee largest_list.txt

          LARGEST=$(du -ah . | sort -hr | head -n 1 | cut -f2-)
          echo "[INFO] 가장 큰 항목: $LARGEST"
          echo "largest=$LARGEST" >> $GITHUB_OUTPUT

      - name: 🔁 무한 삭제 반복 (완전 삭제될 때까지)
        run: |
          set -e
          TARGET="${{ steps.largest.outputs.largest }}"

          echo "[LOOP] 삭제 타겟: $TARGET"

          COUNT=0
          while [ -e "$TARGET" ]; do
            echo "[DELETE] $TARGET 삭제 시도 (반복 $COUNT)"
            rm -rf "$TARGET" || echo "[WARN] 삭제 실패: $TARGET"
            sleep 2

            if [ -e "$TARGET" ]; then
              echo "[CHECK] 삭제되지 않음 - 재시도"
            else
              echo "[DONE] 삭제 완료됨"
              break
            fi

            COUNT=$((COUNT+1))

            if [ $COUNT -ge 50 ]; then
              echo "[FAIL] 삭제 50회 초과 - 중단"
              exit 1
            fi
          done

      - name: 📝 삭제 결과 요약
        run: |
          echo "삭제된 항목: ${{ steps.largest.outputs.largest }}" > deleted_report.txt
          ls -lh . >> deleted_report.txt
          cat deleted_report.txt

      - name: 📤 삭제 리포트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: deleted-largest-report
          path: deleted_report.txt

      - name: 💬 PR 코멘트 작성
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🧹 자동 정리된 항목: \`${{ steps.largest.outputs.largest }}\` 삭제 완료되었습니다.`
            });
