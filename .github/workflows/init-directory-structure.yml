name: 📁 Auto Expand Slot & Validate YAML

on:
  schedule:
    - cron: '*/1 * * * *'  # 매 1분마다 실행
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  expand-slot:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Detect next slot number
        id: detect
        run: |
          echo "[🔢] Detecting next slot number..."
          PREFIX=".github/autogen/slot-"
          EXISTING=$(find .github/autogen -maxdepth 1 -type d -name "slot-*" | wc -l)
          NEXT=$(printf "slot-%03d" $((EXISTING + 1)))
          echo "next_slot=$NEXT" >> $GITHUB_OUTPUT
          echo "[➡️] Next slot: $NEXT"

      - name: 🏗️ Create next slot directory and workflows
        run: |
          SLOT=${{ steps.detect.outputs.next_slot }}
          SLOT_DIR=".github/autogen/$SLOT"
          echo "[📁] Creating $SLOT_DIR/workflows..."
          mkdir -p "$SLOT_DIR/workflows"

          echo "[📋] Copying workflows from .github/workflows/ to $SLOT_DIR/workflows..."
          cp -r .github/workflows/* "$SLOT_DIR/workflows/"

          echo "[📄] Generating info.txt and README.md..."
          echo "Slot generated: $SLOT at $(date -u)" > "$SLOT_DIR/info.txt"
          echo "# Auto Slot: $SLOT" > "$SLOT_DIR/README.md"

          echo "[🔗] Updating symlink: .github/slot-latest -> $SLOT"
          ln -sfn "$SLOT" .github/slot-latest

      - name: 🛠️ Create relaxed yamllint config
        run: |
          echo "[🛠️] Starting creation of .yamllint.yml..."
          echo "[📄] Writing config to .yamllint.yml"

          echo "extends: default" > .yamllint.yml
          echo "" >> .yamllint.yml
          echo "rules:" >> .yamllint.yml

          echo "  line-length:" >> .yamllint.yml
          echo "    max: 200" >> .yamllint.yml
          echo "    level: warning" >> .yamllint.yml
          echo "[✅] Rule added: line-length → max 200, level warning"

          echo "" >> .yamllint.yml
          echo "  document-start:" >> .yamllint.yml
          echo "    present: false" >> .yamllint.yml
          echo "[✅] Rule added: document-start → present false"

          echo "" >> .yamllint.yml
          echo "  truthy:" >> .yamllint.yml
          echo "    allowed-values: ['true', 'false', 'on', 'off', 'yes', 'no']" >> .yamllint.yml
          echo "[✅] Rule added: truthy → allowed values true/false/on/off/yes/no"

          echo "" >> .yamllint.yml
          echo "  comments:" >> .yamllint.yml
          echo "    require-starting-space: false" >> .yamllint.yml
          echo "[✅] Rule added: comments → no space required before comment"

          echo "" >> .yamllint.yml
          echo "  trailing-spaces:" >> .yamllint.yml
          echo "    level: warning" >> .yamllint.yml
          echo "[✅] Rule added: trailing-spaces → warning"

          echo "[✔] .yamllint.yml successfully created with all relaxed rules."

      - name: 🧪 Lint copied YAML files with yamllint
        run: |
          echo "[🔍] Installing yamllint..."
          pip install --quiet yamllint

          SLOT_NAME=${{ steps.detect.outputs.next_slot }}
          TARGET_DIR=".github/autogen/$SLOT_NAME/workflows"

          echo "[🧪] Running yamllint using .yamllint.yml..."
          yamllint -c .yamllint.yml "$TARGET_DIR" || {
            echo "[❌] YAML Lint failed"
            exit 1
          }

      - name: 🔀 Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "📁 Add ${{ steps.detect.outputs.next_slot }} + copied workflows"
          branch: "slot-expand/${{ steps.detect.outputs.next_slot }}"
          title: "📁 Auto Expand: ${{ steps.detect.outputs.next_slot }}"
          body: |
            This PR includes:
            - New directory `.github/autogen/${{ steps.detect.outputs.next_slot }}`
            - All `.yaml` workflow files copied
            - README.md + info.txt generated
            - `.yamllint.yml` with relaxed rules added
          delete-branch: true
