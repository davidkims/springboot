# .github/workflows/check-size.yml
name: "Directory Size Summary"
on:
  push:
  pull_request:

permissions:
  pull-requests: write

jobs:
  dir-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate directory sizes
        id: sizes
        run: |
          echo "## 📊 Directory Size Summary" > size_report.md
          du -sh * 2>/dev/null | sort -hr | head -n 20 >> size_report.md
          echo "::set-output name=report::$(cat size_report.md)"

      - name: Upload size report artifact
        uses: actions/upload-artifact@v4
        with:
          name: dir-size-report
          path: size_report.md
          if-no-files-found: error

      - name: Comment report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = `${{ steps.sizes.outputs.report }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🔍 디렉토리 용량 리포트\n\n${report}`
            });
