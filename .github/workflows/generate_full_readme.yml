name: 📓 포트폴리오 + 워크플로 통계로 README & SECURITY 업데이트

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update_docs:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [16, 18, 20]
      max-parallel: 1
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_LATENCY_MS: 1000

    steps:
      - name: 📅 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📅 Checkout 완료
        run: echo "[📅] 레포지토리 체크아웃 완료"

      - name: 📦 캐시 설정 (pip, Prometheus)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            /tmp/prometheus-cache
          key: ${{ runner.os }}-cache-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-cache-
      - name: 📦 캐시 설정 완료
        run: echo "[📦] 캐시 설정 완료"

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: 📦 Node.js 설치 완료
        run: echo "[📦] Node.js ${{ matrix.node-version }} 설치 완료"

      - name: 🔧 패키지 설치 (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "[🔧] Linux: apt-get로 시스템 패키지 설치 중..."
          sudo apt-get update -y
          echo "[🔧] apt 업데이트 완료"
          sudo apt-get install -y gh jq parallel
          echo "[✅] Linux 패키지 설치 완료"

      - name: 🔧 패키지 설치 (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "[🔧] macOS: brew로 시스템 패키지 설치 중..."
          brew update
          echo "[🔧] brew 업데이트 완료"
          brew install gh jq parallel
          echo "[✅] macOS 패키지 설치 완료"

      - name: 🔧 패키지 설치 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "[🔧] Windows: choco로 시스템 패키지 설치 중..."
          choco install git.install jq -y
          choco install parallel -y
          Write-Host "[✅] Windows 패키지 설치 완료"

      - name: 🔍 패키지 버전 확인
        run: |
          echo "[🔍] gh 버전:" && gh --version  || echo "[ℹ️] gh CLI not available"
          echo "[🔍] jq 버전:" && jq --version  || echo "[ℹ️] jq not available"
          echo "[🔍] parallel 버전:" && parallel --version || echo "[ℹ️] parallel not available"

      - name: 🔄 Prometheus 설치 (Linux, 재시도 3회)
        if: runner.os == 'Linux'
        run: |
          echo "[🔄] Prometheus 다운로드 및 설치 (재시도 로직)"
          for i in {1..3}; do
            echo "[🔄] 시도 $i/3"
            if wget --timeout=30 https://github.com/prometheus/prometheus/releases/download/v2.53.5/prometheus-2.53.5.linux-amd64.tar.gz -O prometheus.tar.gz; then
              echo "[✅] Prometheus 패키지 다운로드 성공"
              break
            fi
            echo "[⚠️] 다운로드 실패, 재시도 중..."
            sleep 5
          done
          echo "[📂] 압축 해제 중..."
          tar xzf prometheus.tar.gz
          echo "[📂] /opt/prometheus 디렉토리 생성 중..."
          sudo mkdir -p /opt/prometheus
          sudo mv prometheus-2.53.5.linux-amd64 /opt/prometheus
          echo "[✅] Prometheus 설치 완료"

      - name: 📂 Prometheus 데이터 디렉토리 생성 (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "[📂] Prometheus 데이터 디렉토리 생성 중..."
          sudo useradd --no-create-home --shell /bin/false prometheus || true
          sudo mkdir -p /opt/prometheus/data
          sudo chown -R prometheus:prometheus /opt/prometheus/data
          echo "[✅] Prometheus 데이터 디렉토리 생성 완료"

      - name: 🛡️ Generate SECURITY.md
        run: |
          echo "[🛡️] SECURITY.md 생성 및 검증 체크리스트 작성 중..."
          echo "# Security Policy" > SECURITY.md
          echo "## Supported Versions" >> SECURITY.md
          echo "| Version | Supported          |" >> SECURITY.md
          echo "| ------- | ------------------ |" >> SECURITY.md
          echo "| 5.1.x   | :white_check_mark: |" >> SECURITY.md
          echo "| 5.0.x   | :x:                |" >> SECURITY.md
          echo "| 4.0.x   | :white_check_mark: |" >> SECURITY.md
          echo "| < 4.0   | :x:                |" >> SECURITY.md
          echo "" >> SECURITY.md
          echo "## Reporting a Vulnerability" >> SECURITY.md
          echo "Use this section to tell people how to report vulnerabilities." >> SECURITY.md
          echo "" >> SECURITY.md
          echo "## Workflow Validation Checklist" >> SECURITY.md
          for f in .github/workflows/*.{yml,yaml}; do
            base=$(basename "$f")
            echo "[🗒️] Adding checks for $base"
            echo "- [ ] $base: YAML syntax validation"         >> SECURITY.md
            echo "- [ ] $base: Permissions review"             >> SECURITY.md
            echo "- [ ] $base: Secret detection scan"           >> SECURITY.md
            echo "- [ ] $base: Dependency scanning enabled"     >> SECURITY.md
            echo "- [ ] $base: Container scanning enabled"      >> SECURITY.md
          done
          echo "[✅] SECURITY.md 업데이트 완료"

      - name: 📋 Ensure .tmp Directory
        run: |
          echo "[📋] .tmp 디렉토리 생성 확인"
          mkdir -p .tmp
          echo "[✅] .tmp 디렉토리 준비 완료"

      - name: 📊 병렬 워크플로우 통계 수집
        run: |
          echo "[📊] 워크플로우 통계 수집 중..."
          OUTPUT_FILE=".tmp/workflows.md"
          echo "## ⚙️ GitHub Actions 워크플로우 목록 및 통계" > "$OUTPUT_FILE"
          echo "" >> "$OUTPUT_FILE"
          echo "| 워크플로우 이름 | 실행 수 | 성공 수 | 실패 수 | 성공률 |" >> "$OUTPUT_FILE"
          echo "|----------------|--------:|--------:|--------:|--------:|" >> "$OUTPUT_FILE"

          parallel_stats() {
            f="$1"
            NAME=$(grep '^name:' "$f" | head -n1 | cut -d ':' -f2- | xargs)
            FILENAME=$(basename "$f")
            echo "[🔎] $FILENAME 통계 조회 중..."
            RUNS=$(gh run list --workflow="$FILENAME" --limit 100 --json conclusion -q '.[] | .conclusion')
            TOTAL=$(echo "$RUNS" | wc -l)
            SUCCESS=$(echo "$RUNS" | grep -c success || true)
            FAILURE=$((TOTAL - SUCCESS))
            if [ "$TOTAL" -gt 0 ]; then
              RATE=$(awk "BEGIN {printf \"%.1f\", ($SUCCESS/$TOTAL)*100}")
            else
              RATE="N/A"
            fi
            echo "| $NAME | $TOTAL | $SUCCESS | $FAILURE | $RATE% |"
          }

          export -f parallel_stats
          if command -v parallel >/dev/null; then
            echo "[⚡] GNU Parallel 사용 (병렬 제한 1)"
            find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) \
              | parallel -j 1 parallel_stats {} >> "$OUTPUT_FILE"
          else
            echo "[ℹ️] parallel 미설치, 직렬 처리"
            for f in .github/workflows/*.{yml,yaml}; do
              parallel_stats "$f" >> "$OUTPUT_FILE"
            done
          fi

          cat "$OUTPUT_FILE"
          echo "[✅] 워크플로우 통계 수집 완료"

      - name: 📂 Prometheus 데이터 디렉토리에 통계 저장
        if: runner.os == 'Linux'
        run: |
          echo "[📂] 통계 파일 복사 중..."
          sudo cp .tmp/workflows.md /opt/prometheus/data/workflows.md
          mkdir -p prometheus_data
          cp .tmp/workflows.md prometheus_data/workflows.md
          echo "[✅] Prometheus 메트릭 데이터 보관 완료"

      - name: 📦 Upload Prometheus metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-metrics-data
          path: |
            prometheus_data/
            /opt/prometheus/data/workflows.md
      - name: 📦 아티팩트 업로드 완료
        run: echo "[📦] Prometheus 메트릭 아티팩트 업로드 완료"

      - name: 🔍 보안 취약점 스캔
        uses: github/super-linter@v5
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_YAML: true
          VALIDATE_DOCKERFILE: true
      - name: 🔍 Super-Linter 완료
        run: echo "[🔍] Super-Linter 실행 완료"

      - name: 🛠️ Determine previous commit SHA
        id: prev
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "[🛠️] 이전 커밋 SHA 계산 중..."
          echo "prev_sha=$(git rev-parse HEAD~1)" >> $GITHUB_OUTPUT
          echo "[✅] 이전 커밋 SHA 계산 완료: ${{ steps.prev.outputs.prev_sha }}"

      - name: 🔐 시크릿 스캔
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ steps.prev.outputs.prev_sha }}
          head: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ 동적 배지 생성
        run: |
          echo "[🏷️] 동적 배지 생성 중..."
          curl -X POST "https://img.shields.io/badge/build-passing-brightgreen"
          echo "[✅] 동적 배지 생성 완료"

      - name: 🏷️ 자동 태그 생성
        run: |
          echo "[🏷️] 자동 릴리즈 태그 생성 중..."
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            TAG="v$(date +%Y.%m.%d.%H%M)"
            git tag "$TAG"
            git push origin "$TAG"
            echo "[✅] 태그 $TAG 생성 및 푸시 완료"
          else
            echo "[ℹ️] main 브랜치가 아니므로 태그 생성 스킵"
          fi

      - name: 🧹 임시 파일 정리 (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          echo "[🧹] 임시 파일 정리 중..."
          rm -rf .tmp/ || echo "[ℹ️] .tmp 없음"
          rm -f prometheus-*.tar.gz || echo "[ℹ️] 프로메테우스 패키지 없음"
          echo "[✅] 임시 파일 정리 완료"

      - name: 🧹 임시 파일 정리 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "[🧹] Windows 임시 파일 정리 중..."
          Remove-Item -Recurse -Force .tmp\ -ErrorAction SilentlyContinue
          Remove-Item -Force prometheus-*.tar.gz -ErrorAction SilentlyContinue
          Write-Host "[✅] Windows 임시 파일 정리 완료"

      - name: 🔁 Commit / Push or PR
        run: |
          echo "[🔁] 변경사항 확인 및 Git 설정"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --exit-code --quiet README.md SECURITY.md .tmp; then
            echo "[⏭️] 변경사항 없음"
            exit 0
          fi
          echo "[✅] 변경사항 감지됨"
          git stash --include-untracked
          git pull --rebase origin main || echo "[⚠️] rebase 실패"
          git stash pop || echo "[⚠️] stash pop 실패"
          git add README.md SECURITY.md .tmp
          git commit -m "문서: README & SECURITY 업데이트 [skip ci]"
          if git push origin HEAD:main; then
            echo "[🚀] 정상 Push 완료"
          else
            echo "[⚠️] PR 생성 모드로 전환"
            BRANCH="update-docs-$(date +%s)"
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
            gh pr create \
              --title "문서: README & SECURITY 업데이트" \
              --body "자동 생성된 PR입니다." \
              --base main \
              --label documentation,auto-generated \
              || echo "[⚠️] PR 생성 실패"
            echo "[📦] PR 생성 완료"
          fi
