name: "⚙️ Maven + Spring Boot: Auto-Setup + Install/Upgrade + Echo Perm + Release (Full Echo Suite)"

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: "프로젝트가 위치한 디렉토리 (pom.xml이 존재하는 경로). 모노레포면 서브폴더 지정"
        required: true
        default: "."
      auto_create_project:
        description: "pom.xml이 없을 때 자동으로 Spring Boot 프로젝트 생성 (true/false)"
        required: true
        default: "true"
      project_config:
        description: "프로젝트 설정 (format: groupId:artifactId:packageName 예: com.example:demo-app:com.example.demo)"
        required: false
        default: "com.example:demo-app:com.example.demo"
      spring_boot_version:
        description: "(선택) 적용할 Spring Boot 버전 (예: 3.3.3). 비우면 현재 pom.xml 유지"
        required: false
        default: "3.3.3"
      maven_version:
        description: "(선택) 사용할 Maven 버전 (예: 3.9.9). 비우면 기본 버전"
        required: false
        default: ""
      bump_type:
        description: "릴리즈 시 버전 증가 유형 (patch|minor|major)"
        required: false
        default: "patch"
      run_tests:
        description: "빌드 전에 테스트 실행 (true/false)"
        required: true
        default: "true"
      create_release:
        description: "릴리즈 생성 및 태그/아티팩트 업로드 (true/false)"
        required: true
        default: "true"
      distribute_artifacts:
        description: "빌드 산출물 업로드 (Artifacts) (true/false)"
        required: true
        default: "true"
      workflow_options:
        description: "추가 옵션 (예: skip_wrapper_gen:true,skip_permissions:true)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read
  packages: write

env:
  JAVA_VERSION: "21"
  ECHO_ROOT: .github/echo_java
  OUT_DIR: .github/echo_java/out
  LOG_DIR: .github/echo_java/logs
  PERM_DIR: .github/echo_java/permissions
  ARTIFACT_DIR: .github/echo_java/artifacts
  TOOLS_DIR: .github/echo_java/tools
  SCRIPTS_DIR: .github/echo_java/scripts
  DOC_DIR: .github/echo_java/docs

jobs:
  build_and_release:
    name: "Build & (Optional) Release"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Java ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: "Parse project configuration"
        id: parse_config
        run: |
          set -Eeuo pipefail
          PROJECT_CONFIG="${{ inputs.project_config }}"
          IFS=':' read -r GROUP_ID ARTIFACT_ID PACKAGE_NAME <<< "$PROJECT_CONFIG"
          GROUP_ID="${GROUP_ID:-com.example}"
          ARTIFACT_ID="${ARTIFACT_ID:-demo-app}"
          PACKAGE_NAME="${PACKAGE_NAME:-com.example.demo}"
          echo "group_id=$GROUP_ID"     >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "[CONFIG] Group ID: $GROUP_ID"
          echo "[CONFIG] Artifact ID: $ARTIFACT_ID"
          echo "[CONFIG] Package Name: $PACKAGE_NAME"

      - name: "Bootstrap Echo Suite (dirs + tools + docs + scripts)"
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_ROOT" "$OUT_DIR" "$LOG_DIR" "$PERM_DIR" "$ARTIFACT_DIR" "$TOOLS_DIR" "$SCRIPTS_DIR" "$DOC_DIR"
          # echo.sh
          cat > "$TOOLS_DIR/echo.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeo pipefail
          _ts(){ date +"%Y-%m-%d %H:%M:%S"; }
          log(){ printf "[ECHO][%s] %s\n" "$1" "$2"; }
          ok(){ log OK "$*"; }
          warn(){ log WARN "$*"; }
          fail(){ log FAIL "$*"; exit 1; }
          section(){ printf "\n=== %s ===\n" "$*"; }
          ensure_dir(){ mkdir -p "$1" && ok "mkdir -p $1"; }
          is_true(){ [[ "${1,,}" == "true" ]]; }
          mvn_run(){ mvn -B -U "$@"; }
          SH
          chmod +x "$TOOLS_DIR/echo.sh"

          # permissions seed
          cat > "$PERM_DIR/chmod.list" <<'L'
          #mode path(glob ok)
          755 .mvn/wrapper/maven-wrapper.jar
          755 mvnw
          755 gradlew
          755 $ECHO_ROOT/scripts/*.sh
          L
          cat > "$PERM_DIR/chown.list" <<'L'
          #owner path
          #runner:runner $ECHO_ROOT
          L

          # apply_permissions.sh
          cat > "$SCRIPTS_DIR/apply_permissions.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          section "Apply permissions"
          CHMOD_LIST="${PERM_DIR}/chmod.list"
          CHOWN_LIST="${PERM_DIR}/chown.list"
          if [ -f "$CHMOD_LIST" ]; then
            while read -r mode path || [ -n "${mode:-}" ]; do
              [[ -z "${mode:-}" || "${mode:0:1}" = "#" ]] && continue
              for f in $(echo "$path"); do
                if compgen -G "$f" > /dev/null; then
                  for t in $f; do chmod "$mode" "$t" && ok "chmod $mode $t"; done
                else
                  warn "skip (not found) $f"
                fi
              done
            done < "$CHMOD_LIST"
          fi
          if [ -f "$CHOWN_LIST" ]; then
            while read -r owner path || [ -n "${owner:-}" ]; do
              [[ -z "${owner:-}" || "${owner:0:1}" = "#" ]] && continue
              for f in $(echo "$path"); do
                if compgen -G "$f" > /dev/null; then
                  for t in $f; do sudo chown "$owner" "$t" && ok "chown $owner $t"; done
                else
                  warn "skip (not found) $f"
                fi
              done
            done < "$CHOWN_LIST"
          fi
          ok "Permissions applied"
          SH
          chmod +x "$SCRIPTS_DIR/apply_permissions.sh"

          # collect_artifacts.sh
          cat > "$SCRIPTS_DIR/collect_artifacts.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          section "Collect artifacts"
          ensure_dir "$ARTIFACT_DIR"
          SRC_DIR="${1:-target}"
          find "$SRC_DIR" -type f \( -name "*.jar" -o -name "*.war" \) -not -name "original-*.jar" -print -exec cp -v {} "$ARTIFACT_DIR/" \;
          ok "Artifacts collected into $ARTIFACT_DIR"
          SH
          chmod +x "$SCRIPTS_DIR/collect_artifacts.sh"

          # create_spring_boot_project.sh
          cat > "$SCRIPTS_DIR/create_spring_boot_project.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          section "Create Spring Boot Project"
          GROUP_ID="${1:-com.example}"
          ARTIFACT_ID="${2:-demo-app}"
          PACKAGE_NAME="${3:-com.example.demo}"
          SPRING_BOOT_VERSION="${4:-3.3.3}"
          TARGET_DIR="${5:-.}"

          # pom.xml
          cat > "$TARGET_DIR/pom.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <parent>
              <groupId>org.springframework.boot</groupId>
              <artifactId>spring-boot-starter-parent</artifactId>
              <version>$SPRING_BOOT_VERSION</version>
              <relativePath/>
            </parent>
            <groupId>$GROUP_ID</groupId>
            <artifactId>$ARTIFACT_ID</artifactId>
            <version>0.1.0-SNAPSHOT</version>
            <name>$ARTIFACT_ID</name>
            <description>Auto-generated Spring Boot project</description>
            <properties>
              <java.version>21</java.version>
              <spring-boot.version>$SPRING_BOOT_VERSION</spring-boot.version>
              <maven.compiler.source>21</maven.compiler.source>
              <maven.compiler.target>21</maven.compiler.target>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <dependencies>
              <dependency>
                <groupId>org.springframework.boot</groupId>
                <artifactId>spring-boot-starter-web</artifactId>
              </dependency>
              <dependency>
                <groupId>org.springframework.boot</groupId>
                <artifactId>spring-boot-starter-actuator</artifactId>
              </dependency>
              <dependency>
                <groupId>org.springframework.boot</groupId>
                <artifactId>spring-boot-starter-data-jpa</artifactId>
              </dependency>
              <dependency>
                <groupId>com.h2database</groupId>
                <artifactId>h2</artifactId>
                <scope>runtime</scope>
              </dependency>
              <dependency>
                <groupId>org.springframework.boot</groupId>
                <artifactId>spring-boot-starter-validation</artifactId>
              </dependency>
              <dependency>
                <groupId>org.springframework.boot</groupId>
                <artifactId>spring-boot-starter-test</artifactId>
                <scope>test</scope>
              </dependency>
              <dependency>
                <groupId>org.testcontainers</groupId>
                <artifactId>junit-jupiter</artifactId>
                <scope>test</scope>
              </dependency>
            </dependencies>
            <dependencyManagement>
              <dependencies>
                <dependency>
                  <groupId>org.testcontainers</groupId>
                  <artifactId>testcontainers-bom</artifactId>
                  <version>1.19.8</version>
                  <type>pom</type>
                  <scope>import</scope>
                </dependency>
              </dependencies>
            </dependencyManagement>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.springframework.boot</groupId>
                  <artifactId>spring-boot-maven-plugin</artifactId>
                  <configuration>
                    <excludes>
                      <exclude>
                        <groupId>org.springframework.boot</groupId>
                        <artifactId>spring-boot-devtools</artifactId>
                      </exclude>
                    </excludes>
                  </configuration>
                </plugin>
                <plugin>
                  <groupId>org.codehaus.mojo</groupId>
                  <artifactId>versions-maven-plugin</artifactId>
                  <version>2.16.2</version>
                </plugin>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.11.0</version>
                  <configuration>
                    <source>21</source>
                    <target>21</target>
                    <encoding>UTF-8</encoding>
                  </configuration>
                </plugin>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-surefire-plugin</artifactId>
                  <version>3.1.2</version>
                </plugin>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-failsafe-plugin</artifactId>
                  <version>3.1.2</version>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

          JAVA_DIR="$TARGET_DIR/src/main/java/${PACKAGE_NAME//./\/}"
          TEST_DIR="$TARGET_DIR/src/test/java/${PACKAGE_NAME//./\/}"
          RES_DIR="$TARGET_DIR/src/main/resources"
          TRES_DIR="$TARGET_DIR/src/test/resources"
          mkdir -p "$JAVA_DIR" "$TEST_DIR" "$RES_DIR" "$TRES_DIR" \
                   "$JAVA_DIR/controller" "$JAVA_DIR/service" "$JAVA_DIR/model" "$JAVA_DIR/config"

          MAIN_CLASS_NAME="$(echo ${ARTIFACT_ID} | sed 's/[^a-zA-Z0-9]//g' | sed 's/^./\U&/')Application"
          cat > "$JAVA_DIR/${MAIN_CLASS_NAME}.java" <<EOF
          package $PACKAGE_NAME;
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          import org.springframework.data.jpa.repository.config.EnableJpaAuditing;
          @SpringBootApplication
          @EnableJpaAuditing
          public class $MAIN_CLASS_NAME {
            public static void main(String[] args) {
              SpringApplication.run(${MAIN_CLASS_NAME}.class, args);
            }
          }
          EOF

          cat > "$JAVA_DIR/controller/HelloController.java" <<EOF
          package $PACKAGE_NAME.controller;
          import org.springframework.beans.factory.annotation.Autowired;
          import org.springframework.http.ResponseEntity;
          import org.springframework.web.bind.annotation.*;
          import $PACKAGE_NAME.service.HelloService;
          import $PACKAGE_NAME.model.HelloResponse;
          import java.util.Map;
          @RestController
          @RequestMapping("/api")
          public class HelloController {
            @Autowired private HelloService helloService;
            @GetMapping("/") public ResponseEntity<HelloResponse> hello() { return ResponseEntity.ok(helloService.getHelloMessage()); }
            @GetMapping("/health") public ResponseEntity<Map<String,String>> health() { return ResponseEntity.ok(Map.of("status","UP","service","$ARTIFACT_ID")); }
            @GetMapping("/info") public ResponseEntity<Map<String,String>> info() { return ResponseEntity.ok(Map.of(
                "app","$ARTIFACT_ID","version","1.0.0","java",System.getProperty("java.version"),
                "spring-boot",org.springframework.boot.SpringBootVersion.getVersion())); }
          }
          EOF

          cat > "$JAVA_DIR/service/HelloService.java" <<EOF
          package $PACKAGE_NAME.service;
          import org.springframework.stereotype.Service;
          import $PACKAGE_NAME.model.HelloResponse;
          @Service
          public class HelloService {
            public HelloResponse getHelloMessage() {
              return new HelloResponse("Hello from $ARTIFACT_ID!","Spring Boot Application",System.currentTimeMillis());
            }
          }
          EOF

          cat > "$JAVA_DIR/model/HelloResponse.java" <<EOF
          package $PACKAGE_NAME.model;
          import com.fasterxml.jackson.annotation.JsonProperty;
          public class HelloResponse {
            @JsonProperty("message") private String message;
            @JsonProperty("description") private String description;
            @JsonProperty("timestamp") private Long timestamp;
            public HelloResponse() {}
            public HelloResponse(String m,String d,Long t){this.message=m;this.description=d;this.timestamp=t;}
            public String getMessage(){return message;} public void setMessage(String v){this.message=v;}
            public String getDescription(){return description;} public void setDescription(String v){this.description=v;}
            public Long getTimestamp(){return timestamp;} public void setTimestamp(Long v){this.timestamp=v;}
          }
          EOF

          cat > "$JAVA_DIR/config/AppConfig.java" <<EOF
          package $PACKAGE_NAME.config;
          import org.springframework.context.annotation.Configuration;
          import org.springframework.web.servlet.config.annotation.CorsRegistry;
          import org.springframework.web.servlet.config.annotation.WebMvcConfigurer;
          @Configuration
          public class AppConfig implements WebMvcConfigurer {
            @Override public void addCorsMappings(CorsRegistry registry){
              registry.addMapping("/api/**").allowedOrigins("*").allowedMethods("GET","POST","PUT","DELETE","OPTIONS").allowedHeaders("*");
            }
          }
          EOF

          cat > "$TEST_DIR/${MAIN_CLASS_NAME}Tests.java" <<'EOF'
          package PACKAGE_NAME_REPLACE;
          import org.junit.jupiter.api.Test;
          import org.springframework.boot.test.context.SpringBootTest;
          import org.springframework.test.context.ActiveProfiles;
          @SpringBootTest
          @ActiveProfiles("test")
          class MAIN_CLASS_NAME_REPLACETests {
            @Test void contextLoads() {}
          }
          EOF
          sed -i "s|PACKAGE_NAME_REPLACE|$PACKAGE_NAME|g" "$TEST_DIR/${MAIN_CLASS_NAME}Tests.java"
          sed -i "s|MAIN_CLASS_NAME_REPLACE|$MAIN_CLASS_NAME|g" "$TEST_DIR/${MAIN_CLASS_NAME}Tests.java"

          cat > "$TEST_DIR/controller/HelloControllerTest.java" <<'EOF'
          package PACKAGE_NAME_REPLACE.controller;
          import org.junit.jupiter.api.Test;
          import org.springframework.beans.factory.annotation.Autowired;
          import org.springframework.boot.test.autoconfigure.web.servlet.WebMvcTest;
          import org.springframework.boot.test.mock.mockito.MockBean;
          import org.springframework.http.MediaType;
          import org.springframework.test.web.servlet.MockMvc;
          import PACKAGE_NAME_REPLACE.service.HelloService;
          import PACKAGE_NAME_REPLACE.model.HelloResponse;
          import static org.mockito.Mockito.when;
          import static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.get;
          import static org.springframework.test.web.servlet.result.MockMvcResultMatchers.*;
          @WebMvcTest(HelloController.class)
          class HelloControllerTest {
            @Autowired private MockMvc mockMvc;
            @MockBean private HelloService helloService;
            @Test void hello_ShouldReturnHelloResponse() throws Exception {
              HelloResponse mockRes = new HelloResponse("Test Message","Test Description",12345L);
              when(helloService.getHelloMessage()).thenReturn(mockRes);
              mockMvc.perform(get("/api/"))
                .andExpect(status().isOk())
                .andExpect(content().contentType(MediaType.APPLICATION_JSON))
                .andExpect(jsonPath("$.message").value("Test Message"));
            }
            @Test void health_ShouldReturnHealthStatus() throws Exception {
              mockMvc.perform(get("/api/health"))
                .andExpect(status().isOk())
                .andExpect(content().contentType(MediaType.APPLICATION_JSON))
                .andExpect(jsonPath("$.status").value("UP"));
            }
          }
          EOF
          sed -i "s|PACKAGE_NAME_REPLACE|$PACKAGE_NAME|g" "$TEST_DIR/controller/HelloControllerTest.java"

          cat > "$RES_DIR/application.properties" <<EOF
          spring.application.name=$ARTIFACT_ID
          server.port=8080
          spring.datasource.url=jdbc:h2:mem:testdb
          spring.datasource.driver-class-name=org.h2.Driver
          spring.datasource.username=sa
          spring.datasource.password=password
          spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
          spring.jpa.hibernate.ddl-auto=create-drop
          spring.jpa.show-sql=true
          management.endpoints.web.exposure.include=health,info,metrics,prometheus
          management.endpoint.health.probes.enabled=true
          logging.level.$PACKAGE_NAME=INFO
          EOF

          cat > "$TRES_DIR/application-test.properties" <<EOF
          spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          spring.jpa.hibernate.ddl-auto=create-drop
          spring.jpa.show-sql=false
          logging.level.root=WARN
          logging.level.$PACKAGE_NAME=INFO
          EOF

          cat > "$TARGET_DIR/.gitignore" <<'EOF'
          target/
          .idea
          .vscode/
          *.log
          *.iml
          .DS_Store
          application-local.properties
          /logs/
          EOF

          cat > "$TARGET_DIR/Dockerfile" <<'EOF'
          FROM eclipse-temurin:21-jdk-alpine AS builder
          WORKDIR /app
          COPY mvnw .
          COPY .mvn .mvn
          COPY pom.xml .
          RUN chmod +x mvnw && ./mvnw -q -DskipTests dependency:resolve
          COPY src src
          RUN ./mvnw -q -DskipTests clean package
          FROM eclipse-temurin:21-jre-alpine
          RUN addgroup -g 1000 app && adduser -u 1000 -G app -s /bin/sh -D app
          WORKDIR /app
          USER app
          COPY --from=builder --chown=app:app /app/target/*.jar app.jar
          EXPOSE 8080
          HEALTHCHECK --interval=30s --timeout=3s --start-period=10s --retries=3 \
            CMD wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1
          ENTRYPOINT ["java","-XX:MaxRAMPercentage=75.0","-jar","app.jar"]
          EOF

          cat > "$TARGET_DIR/docker-compose.yml" <<'EOF'
          version: "3.8"
          services:
            app:
              build: .
              ports:
                - "8080:8080"
              environment:
                - JAVA_TOOL_OPTIONS=
              healthcheck:
                test: ["CMD", "wget","--no-verbose","--tries=1","--spider","http://localhost:8080/actuator/health"]
                interval: 30s
                timeout: 5s
                retries: 5
          EOF

          ok "Project skeleton created"
          SH
          chmod +x "$SCRIPTS_DIR/create_spring_boot_project.sh"

      - name: "Install requested Maven (optional)"
        id: setup_maven
        run: |
          set -Eeuo pipefail
          MAV_VER="${{ inputs.maven_version }}"
          if [ -n "$MAV_VER" ]; then
            echo "[ECHO][INFO] Installing Maven $MAV_VER ..."
            BASE="$HOME/.local/apache-maven-$MAV_VER"
            if [ ! -d "$BASE" ]; then
              curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAV_VER}/binaries/apache-maven-${MAV_VER}-bin.tar.gz" -o /tmp/mvn.tgz
              mkdir -p "$HOME/.local"
              tar -xzf /tmp/mvn.tgz -C "$HOME/.local"
            fi
            echo "$HOME/.local/apache-maven-${MAV_VER}/bin" >> "$GITHUB_PATH"
            mvn -v
            echo "maven_path=$HOME/.local/apache-maven-${MAV_VER}/bin/mvn" >> "$GITHUB_OUTPUT"
          else
            echo "[ECHO][INFO] Using default Maven"
            mvn -v
            echo "maven_path=$(command -v mvn)" >> "$GITHUB_OUTPUT"
          fi

      - name: "Auto-create project if missing"
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          cd "${{ inputs.project_dir }}"
          if [ ! -f "pom.xml" ]; then
            is_true "${{ inputs.auto_create_project }}" || fail "pom.xml 없음 & auto_create_project=false"
            "${GITHUB_WORKSPACE}/${SCRIPTS_DIR}/create_spring_boot_project.sh" \
              "${{ steps.parse_config.outputs.group_id }}" \
              "${{ steps.parse_config.outputs.artifact_id }}" \
              "${{ steps.parse_config.outputs.package_name }}" \
              "${{ inputs.spring_boot_version }}" \
              "."
            ok "Auto project created"
          else
            ok "pom.xml exists"
          fi

      - name: "Generate Maven Wrapper (if missing)"
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          cd "${{ inputs.project_dir }}"
          SKIP="$(echo "${{ inputs.workflow_options }}" | tr '[:upper:]' '[:lower:]' | grep -o 'skip_wrapper_gen:true' || true)"
          if [ -n "$SKIP" ]; then
            warn "skip_wrapper_gen=true -> skipping wrapper generation"
          else
            if [ ! -f "./mvnw" ]; then
              ok "Generating Maven Wrapper"
              mvn -N -q wrapper:wrapper || fail "wrapper generation failed"
            else
              ok "mvnw already present"
            fi
          fi
          chmod +x mvnw || true

      - name: "Apply Echo permissions (optional)"
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          SKIP="$(echo "${{ inputs.workflow_options }}" | tr '[:upper:]' '[:lower:]' | grep -o 'skip_permissions:true' || true)"
          if [ -n "$SKIP" ]; then
            warn "skip_permissions=true -> skipping permission apply"
          else
            "${GITHUB_WORKSPACE}/${SCRIPTS_DIR}/apply_permissions.sh"
          fi

      - name: "Pin / Upgrade Spring Boot version (if provided)"
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          cd "${{ inputs.project_dir }}"
          SBV="${{ inputs.spring_boot_version }}"
          if [ -n "$SBV" ]; then
            section "Upgrade Spring Boot to $SBV"
            # 우선 property가 있으면 set-property, 없으면 parent version 치환
            if grep -q "<spring-boot.version>" pom.xml; then
              ./mvnw -q -DgenerateBackupPoms=false versions:set-property -Dproperty=spring-boot.version -DnewVersion="${SBV}" && ok "spring-boot.version -> ${SBV}"
            else
              # parent version replace
              sed -i "0,/<parent>/ s|<version>.*</version>|<version>${SBV}</version>|" pom.xml
              ok "parent <version> updated to ${SBV}"
            fi
          else
            ok "No Spring Boot version override requested"
          fi

      - name: "Resolve & Build (tests optional)"
        id: build
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          cd "${{ inputs.project_dir }}"
          if [[ "${{ inputs.run_tests }}" == "true" ]]; then
            section "mvnw - tests ON"
            ./mvnw -q -e -B clean verify
          else
            section "mvnw - tests OFF"
            ./mvnw -q -e -B -DskipTests clean package
          fi
          "${GITHUB_WORKSPACE}/${SCRIPTS_DIR}/collect_artifacts.sh" "target"
          ok "Build done"

      - name: "Upload artifacts (if enabled)"
        if: ${{ inputs.distribute_artifacts == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: ${{ env.ARTIFACT_DIR }}/*

      - name: "Bump & Tag & Create Release (if enabled)"
        if: ${{ inputs.create_release == 'true' }}
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          cd "${{ inputs.project_dir }}"
          section "Compute next version"
          CURR_VER="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "[ECHO][INFO] current version: $CURR_VER"
          # strip -SNAPSHOT
          BASE_VER="${CURR_VER%-SNAPSHOT}"
          IFS='.' read -r MA MI PA <<< "${BASE_VER:-0.1.0}"
          case "${BUMP_TYPE:-patch}" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch|*) PA=$((PA+1)) ;;
          esac
          NEXT_VER="${MA}.${MI}.${PA}"
          echo "[ECHO][INFO] next version: $NEXT_VER"
          ./mvnw -q -DgenerateBackupPoms=false versions:set -DnewVersion="${NEXT_VER}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${NEXT_VER} [skip ci]"
            git tag "v${NEXT_VER}"
            git push --follow-tags
          else
            warn "No changes to commit for version bump"
          fi

          # attach artifacts to release with gh CLI if available; fallback to action below
          if command -v gh >/dev/null 2>&1; then
            gh release create "v${NEXT_VER}" $GITHUB_WORKSPACE/${ARTIFACT_DIR}/* -t "v${NEXT_VER}" -n "Automated release"
          fi

      - name: "Create GitHub Release (fallback if gh not used)"
        if: ${{ inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outcome && '' }}
          files: ${{ env.ARTIFACT_DIR }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Commit Echo outputs (always if changed)"
        run: |
          set -Eeuo pipefail
          . "${ECHO_ROOT}/tools/echo.sh"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[ECHO] Update Echo Suite & project artifacts"
            git push
            ok "Changes committed"
          else
            ok "No changes to commit"
          fi
