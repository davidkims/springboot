name: ✨ Scorecard Secure Workflow FullOps

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '33 3 * * 5'

jobs:
  secure-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
      pull-requests: write

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Init Echo Directories/Templates
        run: |
          mkdir -p .github/echo/init
          echo "echo '[❄ Init] Echo directory structure'" | tee .github/echo/init/init_dirs.sh

          for base in scorecard template placeholder fix cli; do
            for sub in logs scripts test init converted; do
              mkdir -p ".github/echo_${base}/${sub}"
            done
          done

          echo 'API_KEY=PLACEHOLDER' > .github/echo_template/sample.env
          echo 'TOKEN=PLACEHOLDER' > .github/echo_template/sample.cfg
          echo '{ "secret": "PLACEHOLDER" }' > .github/echo_template/sample.json

      - name: 🚀 Install Scorecard CLI (Safe & Reliable)
        run: |
          set -e
          VERSION="4.10.3"
          curl -sLO https://github.com/ossf/scorecard/releases/download/v${VERSION}/scorecard_${VERSION}_linux_amd64.tar.gz
          mkdir -p /tmp/scorecard_extracted
          tar -xzf scorecard_${VERSION}_linux_amd64.tar.gz -C /tmp/scorecard_extracted
          BIN=$(find /tmp/scorecard_extracted -type f -name scorecard | head -1 || true)

          if [ -z "$BIN" ]; then
            echo "::error ::[ERR] Scorecard binary not found after extract."
            exit 1
          fi

          chmod +x "$BIN"
          sudo mv "$BIN" /usr/local/bin/scorecard

          mkdir -p .github/echo_scorecard/logs .github/echo_cli/logs
          scorecard --version | tee .github/echo_scorecard/logs/version.txt
          echo "echo 'scorecard CLI 설치 완료'" | tee -a .github/echo_cli/logs/install.log

      - name: 📊 Run OSSF Scorecard Analysis
        run: |
          mkdir -p .github/scorecard
          scorecard --repo=. --format=json --show-details > .github/scorecard/scorecard.json

      - name: ✨ Replace PLACEHOLDER in Templates
        run: |
          mkdir -p .github/echo_placeholder/converted
          for file in .github/echo_template/*; do
            fname=$(basename "$file")
            sed 's/PLACEHOLDER/REPLACED_VALUE/g' "$file" > ".github/echo_placeholder/converted/$fname"
          done

      - name: 📌 Generate Fix Script and PR
        run: |
          mkdir -p .github/echo_fix/scripts
          echo "echo '[🔧 Apply placeholder fixes]'" > .github/echo_fix/scripts/apply_fixes.sh
          echo "cp -r .github/echo_placeholder/converted/* ." >> .github/echo_fix/scripts/apply_fixes.sh
          chmod +x .github/echo_fix/scripts/apply_fixes.sh
          bash .github/echo_fix/scripts/apply_fixes.sh

          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git checkout -b scorecard-placeholder-fix || true
          git add .
          git commit -m "🔧 Fix: Replaced PLACEHOLDER with secure values" || true
          git push --set-upstream origin scorecard-placeholder-fix || true
          gh pr create --title "🚀 Secure Fix: PLACEHOLDER replaced" --body "Automated PR replacing placeholders from templates." || true

      - name: 📄 Upload Echo Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-all-files
          path: .github/echo_*
