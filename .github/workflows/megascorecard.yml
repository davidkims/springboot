name: "💽 MEGA Disk+Dir+p2Resize+압축2종+병렬업로드+병렬다운로드+Provenance+EchoLogs"

on:
  workflow_dispatch:
    inputs:
      disk_size_mb:
        description: "Initial disk image size (MB)"
        default: "2048"
        required: true
      resize_to_mb:
        description: "Resize image to this size (MB, optional)"
        default: ""
        required: false
      fs_type:
        description: "Filesystem: ext4|xfs|btrfs"
        default: "ext4"
        required: true
      mount_point:
        description: "Base mount point"
        default: "/mnt/gh-disk"
        required: true
  schedule:
    - cron: "*/1 * * * *"

jobs:
  mega-disk-backup:
    runs-on: ubuntu-latest
    env:
      DISK_IMG: disk.img
      ECHO_DIR: .github/echo_scripts
      LOG_DIR: .github/echo_logs
      TRANSFER_LOG_DIR: /opt/logs/transfer
      BACKUP_DIR: /opt/backup/transfer
      PROVENANCE_DIR: provenance
      PROVENANCE_STORE_DIR: provenance/store
      UPLOAD_URLS: "https://server1.example.com/upload https://server2.example.com/upload https://server3.example.com/upload https://server4.example.com/upload https://server5.example.com/upload https://server6.example.com/upload https://server7.example.com/upload https://server8.example.com/upload https://server9.example.com/upload https://server10.example.com/upload"
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📦 필수 패키지 설치
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y pigz zstd curl parted xfsprogs btrfs-progs sysstat
          mkdir -p "$LOG_DIR"
          echo "[ECHO] pigz/zstd/sysstat 설치 완료" | tee -a "$LOG_DIR/install.log"

      - name: 📁 필수 디렉토리 및 placeholder 파일 생성
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_DIR" "$LOG_DIR" "$TRANSFER_LOG_DIR" "$BACKUP_DIR" "$PROVENANCE_DIR" "$PROVENANCE_STORE_DIR"
          PROV_FILE="$PROVENANCE_DIR/.provenance_transfer_${{ github.run_id }}.json"
          echo '{"status":"init"}' > "$PROV_FILE"
          echo "[ECHO] 디렉토리 및 provenance placeholder 생성 완료" | tee -a "$LOG_DIR/init.log"

      - name: 🗂 전송로그 1만 개 생성
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 10000); do
            echo "Log entry $i - $(date +%s)" > "$TRANSFER_LOG_DIR/log_$i.txt"
          done
          echo "[ECHO] 전송로그 10,000개 생성 완료" | tee -a "$LOG_DIR/transfer_gen.log"

      - name: 📏 p2 증설 및 마운트
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG_DIR/resize.log") 2>&1
          MNT="${{ inputs.mount_point }}"
          FST="${{ inputs.fs_type }}"
          REQ="${{ inputs.resize_to_mb }}"
          DEF_MB="${{ inputs.disk_size_mb }}"

          [[ -f "$DISK_IMG" ]] || truncate -s ${DEF_MB}M "$DISK_IMG"
          LOOP_DEV=$(sudo losetup -f --show "$DISK_IMG")
          sudo partprobe "$LOOP_DEV" || true

          if ! sudo parted -s "$LOOP_DEV" print | grep -q p2; then
            sudo parted -s "$LOOP_DEV" mklabel gpt
            sudo parted -s "$LOOP_DEV" mkpart primary 1MiB 60%
            sudo parted -s "$LOOP_DEV" mkpart primary 60% 100%
          fi
          P1="${LOOP_DEV}p1"; P2="${LOOP_DEV}p2"

          format_if_needed() {
            local dev=$1; local type=$2
            blkid "$dev" >/dev/null 2>&1 || case "$type" in
              ext4) sudo mkfs.ext4 -F "$dev" ;;
              xfs) sudo mkfs.xfs -f "$dev" ;;
              btrfs) sudo mkfs.btrfs -f "$dev" ;;
            esac
          }
          format_if_needed "$P1" "$FST"
          format_if_needed "$P2" "$FST"

          [[ -n "$REQ" && "$REQ" =~ ^[0-9]+$ ]] && {
            CUR_MB=$(( $(stat -c%s "$DISK_IMG") / 1048576 ))
            (( REQ > CUR_MB )) && truncate -s ${REQ}M "$DISK_IMG"
          }

          sudo parted -s "$LOOP_DEV" resizepart 2 100%
          sudo partprobe "$LOOP_DEV"

          sudo mkdir -p "$MNT" "$MNT/part2"
          sudo mount "$P1" "$MNT" || true
          sudo mount "$P2" "$MNT/part2" || true

          case "$FST" in
            ext4)  sudo resize2fs "$P2" ;;
            xfs)   sudo xfs_growfs "$MNT/part2" ;;
            btrfs) sudo btrfs filesystem resize max "$MNT/part2" ;;
          esac

          df -h | grep -E "${MNT}(/part2)?"
          echo "[ECHO] p2 증설 완료" | tee -a "$LOG_DIR/resize.log"

      - name: 📊 디스크 I/O 모니터링 시작
        run: |
          set -Eeuo pipefail
          iostat -xm 2 5 > "$LOG_DIR/iostat_before.log" &
          echo $! > "$LOG_DIR/iostat_pid.txt"
          echo "[ECHO] I/O 모니터링 시작" | tee -a "$LOG_DIR/iostat.log"

      - name: 📦 이중 압축 (pigz + zstd 비교)
        run: |
          set -Eeuo pipefail
          TS=$(date +%Y%m%d_%H%M%S)
          PIGZ_FILE="$BACKUP_DIR/transfer_$TS.tar.gz"
          ZSTD_FILE="$BACKUP_DIR/transfer_$TS.tar.zst"
          tar -I "pigz -p $(nproc)" -cf "$PIGZ_FILE" -C "$TRANSFER_LOG_DIR" .
          tar --use-compress-program="zstd -T0 -19" -cf "$ZSTD_FILE" -C "$TRANSFER_LOG_DIR" .

          SIZE_PIGZ=$(stat -c%s "$PIGZ_FILE")
          SIZE_ZSTD=$(stat -c%s "$ZSTD_FILE")

          if (( SIZE_ZSTD < SIZE_PIGZ )); then
            FINAL_FILE="$ZSTD_FILE"
            COMP_TYPE="zstd"
          else
            FINAL_FILE="$PIGZ_FILE"
            COMP_TYPE="pigz"
          fi

          SHA256=$(sha256sum "$FINAL_FILE" | awk '{print $1}')
          echo "{\"status\":\"ready\",\"compression\":\"$COMP_TYPE\",\"sha256\":\"$SHA256\",\"size_bytes\":$(stat -c%s "$FINAL_FILE")}" \
            > "$PROVENANCE_DIR/.provenance_transfer_${{ github.run_id }}.json"

          echo "[ECHO] 압축 완료: $FINAL_FILE (선택된 형식: $COMP_TYPE)" | tee -a "$LOG_DIR/compression.log"

      - name: 🌐 병렬 업로드 (10개 서버)
        run: |
          set -Eeuo pipefail
          START=$(date +%s)
          for url in $UPLOAD_URLS; do
            {
              for i in {1..3}; do
                curl -T "$FINAL_FILE" "$url" && break || sleep 5
              done
              echo "[ECHO] 업로드 완료: $url" | tee -a "$LOG_DIR/curl_upload.log"
            } &
          done
          wait
          END=$(date +%s)
          echo "[ECHO] 업로드 소요: $((END-START))초" | tee -a "$LOG_DIR/curl_upload.log"

      - name: 🌐 병렬 다운로드 및 복원
        run: |
          set -Eeuo pipefail
          mkdir -p "$BACKUP_DIR/restored"
          for url in $UPLOAD_URLS; do
            {
              curl -o "$BACKUP_DIR/restored/$(basename $FINAL_FILE)" "$url" || true
            } &
          done
          wait
          echo "[ECHO] 병렬 다운로드 완료" | tee -a "$LOG_DIR/curl_download.log"

      - name: 📤 GitHub Artifact 업로드
        uses: actions/upload-artifact@v4
        with:
          name: provenance-transfer-${{ github.run_id }}
          path: provenance/.provenance_transfer_${{ github.run_id }}.json
          if-no-files-found: error
