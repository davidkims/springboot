name: 🛡 CodeQL + Scorecard CLI 설치 및 에코 자동화

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # 매일 03:00 실행

jobs:
  codeql-scorecard-echo:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 에코 디렉토리 대량 생성
        run: |
          set -e
          for d in echo_codeql echo_scorecard echo_cli echo_logs; do
            mkdir -p .github/$d
            echo "echo '[ECHO] 디렉토리 생성됨: .github/$d'" >> .github/echo_logs/dir_create.log
          done

      - name: 🧪 CodeQL CLI 설치 및 에코 스크립트 생성
        run: |
          set -e
          echo "#!/bin/bash" > .github/echo_codeql/install_codeql.sh
          echo "echo '[INSTALL] CodeQL CLI 설치 시작'" >> .github/echo_codeql/install_codeql.sh
          echo "VERSION=2.16.2" >> .github/echo_codeql/install_codeql.sh
          echo "curl -sLO https://github.com/github/codeql-cli-binaries/releases/download/v\$VERSION/codeql-linux64.zip" >> .github/echo_codeql/install_codeql.sh
          echo "unzip -q codeql-linux64.zip -d codeql && sudo mv codeql/codeql /usr/local/bin/" >> .github/echo_codeql/install_codeql.sh
          echo "codeql version | tee .github/echo_codeql/codeql_version.txt" >> .github/echo_codeql/install_codeql.sh
          chmod +x .github/echo_codeql/install_codeql.sh
          bash .github/echo_codeql/install_codeql.sh

      - name: 📊 Scorecard CLI 설치 및 에코 스크립트 생성
        run: |
          set -e
          echo "#!/bin/bash" > .github/echo_scorecard/install_scorecard.sh
          echo "echo '[INSTALL] Scorecard CLI 설치 시작'" >> .github/echo_scorecard/install_scorecard.sh
          echo "VERSION=4.10.3" >> .github/echo_scorecard/install_scorecard.sh
          echo "curl -sLO https://github.com/ossf/scorecard/releases/download/v\$VERSION/scorecard_\$VERSION\_linux_amd64.tar.gz" >> .github/echo_scorecard/install_scorecard.sh
          echo "tar -xzf scorecard_\$VERSION\_linux_amd64.tar.gz" >> .github/echo_scorecard/install_scorecard.sh
          echo "BIN=\$(find scorecard_\$VERSION\_linux_amd64* -type f -name scorecard | head -1)" >> .github/echo_scorecard/install_scorecard.sh
          echo "chmod +x \$BIN && sudo mv \$BIN /usr/local/bin/scorecard" >> .github/echo_scorecard/install_scorecard.sh
          echo "scorecard --version | tee .github/echo_scorecard/scorecard_version.txt" >> .github/echo_scorecard/install_scorecard.sh
          chmod +x .github/echo_scorecard/install_scorecard.sh
          bash .github/echo_scorecard/install_scorecard.sh

      - name: 🧪 CodeQL 분석 실행 및 로그
        run: |
          set -e
          echo "#!/bin/bash" > .github/echo_codeql/run_codeql.sh
          echo "echo '[RUN] CodeQL DB 생성 및 분석'" >> .github/echo_codeql/run_codeql.sh
          echo "mkdir -p codeql-db" >> .github/echo_codeql/run_codeql.sh
          echo "codeql database create codeql-db --language=java --source-root=. | tee .github/echo_codeql/create_db.log" >> .github/echo_codeql/run_codeql.sh
          echo "codeql database analyze codeql-db github/codeql-java-queries --format=sarifv2.1.0 --output=result-codeql.sarif | tee .github/echo_codeql/analyze.log" >> .github/echo_codeql/run_codeql.sh
          chmod +x .github/echo_codeql/run_codeql.sh
          bash .github/echo_codeql/run_codeql.sh

      - name: 📊 Scorecard 분석 실행 및 로그
        run: |
          set -e
          echo "#!/bin/bash" > .github/echo_scorecard/run_scorecard.sh
          echo "echo '[RUN] Scorecard 실행'" >> .github/echo_scorecard/run_scorecard.sh
          echo "scorecard --repo=https://github.com/${{ github.repository }} --format=json --show-details > .github/echo_scorecard/results.json" >> .github/echo_scorecard/run_scorecard.sh
          echo "scorecard --repo=https://github.com/${{ github.repository }} --format=sarif --show-details > .github/echo_scorecard/results.sarif" >> .github/echo_scorecard/run_scorecard.sh
          chmod +x .github/echo_scorecard/run_scorecard.sh
          bash .github/echo_scorecard/run_scorecard.sh

      - name: 📤 결과 업로드 (선택)
        uses: actions/upload-artifact@v4
        with:
          name: codeql-scorecard-results
          path: |
            .github/echo_codeql/
            .github/echo_scorecard/
