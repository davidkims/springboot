name: "📦 Transfer Log Backup + Disk IO + Auto Upgrade (FULL-OPS EXTENDED)"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  full-transfer-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TRANSFER_LOG_DIR: /opt/logs/transfer
      BACKUP_DIR: /opt/backup/transfer
      PROVENANCE_DIR: provenance
      PROVENANCE_STORE_DIR: provenance/store
      CURL_SOURCE_URLS: "https://example.com/provenance/latest.json https://mirror.example.com/provenance/latest.json"
      PKG_LIST: "sysstat curl wget coreutils pv tar"

    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 📁 필수 디렉토리 생성 및 권한 부여
      run: |
        set -Eeuo pipefail
        echo "[ECHO] 필수 디렉토리 생성"
        sudo mkdir -p "$TRANSFER_LOG_DIR" "$BACKUP_DIR" "$PROVENANCE_DIR" "$PROVENANCE_STORE_DIR"
        sudo chmod -R 777 "$TRANSFER_LOG_DIR" "$BACKUP_DIR" "$PROVENANCE_DIR" "$PROVENANCE_STORE_DIR"
        ls -ld "$TRANSFER_LOG_DIR" "$BACKUP_DIR" "$PROVENANCE_DIR" "$PROVENANCE_STORE_DIR"

    - name: 🔄 패키지 설치 및 업그레이드
      run: |
        set -Eeuo pipefail
        echo "[ECHO] 패키지 설치 및 업그레이드"
        sudo apt-get update -y
        sudo apt-get install -y $PKG_LIST
        sudo apt-get upgrade -y

    - name: 📝 전송 로그 다중 경로 다운로드 또는 생성
      run: |
        set -Eeuo pipefail
        FILE_NAME=".provenance_transfer_$(date +%Y%m%d_%H%M%S).json"
        FILE_PATH="$PROVENANCE_DIR/$FILE_NAME"
        echo "[ECHO] 전송 로그 다운로드 시도: $FILE_PATH"

        SUCCESS=false
        for URL in $CURL_SOURCE_URLS; do
          echo "[ECHO] 시도: $URL"
          if curl -fsSL --retry 3 "$URL" -o "$FILE_PATH"; then
            echo "[ECHO] 다운로드 성공: $URL"
            SUCCESS=true
            break
          else
            echo "[WARN] 다운로드 실패: $URL"
          fi
        done

        if [ "$SUCCESS" = false ]; then
          echo "[ECHO] 모든 다운로드 실패 → 로컬 더미 로그 생성"
          echo "{\"status\":\"generated\",\"timestamp\":\"$(date)\"}" > "$FILE_PATH"
        fi

        ls -lh "$FILE_PATH"

    - name: 📊 디스크 I/O 상태 기록
      run: |
        set -Eeuo pipefail
        LOG_FILE="$TRANSFER_LOG_DIR/disk_io_$(date +%Y%m%d_%H%M%S).log"
        echo "[ECHO] 디스크 I/O 상태 수집: $LOG_FILE"
        iostat -x 1 3 | tee "$LOG_FILE" || echo "[WARN] iostat 실행 실패"
        df -h | tee -a "$LOG_FILE"
        lsblk | tee -a "$LOG_FILE"

    - name: 💾 대량 데이터 생성 (I/O 테스트)
      run: |
        set -Eeuo pipefail
        echo "[ECHO] 대량 파일 생성 시작 (/tmp/io_test)"
        mkdir -p /tmp/io_test
        for i in $(seq 1 5); do
          dd if=/dev/zero | pv -s 100M > /tmp/io_test/testfile_$i bs=10M count=10
        done
        ls -lh /tmp/io_test

    - name: 📦 로그 및 데이터 압축
      run: |
        set -Eeuo pipefail
        DATE_DIR=$(date +%Y%m%d)
        DEST_DIR="$BACKUP_DIR/$DATE_DIR"
        mkdir -p "$DEST_DIR"
        echo "[ECHO] 백업 데이터 디렉토리: $DEST_DIR"

        tar -czf "$DEST_DIR/transfer_logs_$DATE_DIR.tar.gz" -C "$TRANSFER_LOG_DIR" . || true
        tar -czf "$DEST_DIR/provenance_logs_$DATE_DIR.tar.gz" -C "$PROVENANCE_DIR" . || true

        echo "[ECHO] 압축 완료"
        ls -lh "$DEST_DIR"

    - name: 🧹 오래된 백업 정리 (최근 7일 유지)
      run: |
        set -Eeuo pipefail
        echo "[ECHO] 오래된 백업 삭제"
        find "$BACKUP_DIR" -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} \;
        echo "[ECHO] 현재 보관 중인 백업:"
        ls -1 "$BACKUP_DIR"

    - name: 📤 전송 로그 및 디스크 I/O 로그 아티팩트 업로드
      uses: actions/upload-artifact@v4
      with:
        name: "transfer-backup-logs"
        path: |
          ${{ env.BACKUP_DIR }}
        if-no-files-found: warn
        compression-level: 6
