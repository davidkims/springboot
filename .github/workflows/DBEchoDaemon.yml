name: ♾️ CodeQL DB Echo Daemon

on:
  schedule:
    - cron: '*/5 * * * *'  # 5분마다 실행
  workflow_dispatch:

jobs:
  codeql-db-echo:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout (필수)
        uses: actions/checkout@v4

      - name: 📁 [echo] 디렉토리 생성
        run: |
          echo "echo '[📁] .github/codeql-out/db-ql-dummy 디렉토리 생성...'"
          echo '[📁] .github/codeql-out/db-ql-dummy 디렉토리 생성...'
          mkdir -p .github/codeql-out/db-ql-dummy
          chmod 700 .github/codeql-out/db-ql-dummy

      - name: 📝 [echo] codeql-db-echo.txt 파일 생성
        run: |
          echo "echo '[📝] codeql-db-echo.txt 파일 생성...'"
          echo '[📝] codeql-db-echo.txt 파일 생성...'
          ECHO_FILE=".github/codeql-out/db-ql-dummy/codeql-db-echo.txt"
          echo "echo '==== CodeQL DB Echo Batch ===='" > .github/codeql-out/db-ql-dummy/echo.sh
          echo "==== CodeQL DB Echo Batch ====" > "$ECHO_FILE"
          echo "timestamp: $(date '+%Y-%m-%d %H:%M:%S')" | tee -a "$ECHO_FILE"
          echo "repository: $GITHUB_REPOSITORY" | tee -a "$ECHO_FILE"
          echo "commit_sha: $GITHUB_SHA" | tee -a "$ECHO_FILE"
          echo "run_id: $GITHUB_RUN_ID" | tee -a "$ECHO_FILE"
          echo "run_number: $GITHUB_RUN_NUMBER" | tee -a "$ECHO_FILE"
          echo "workflow: $GITHUB_WORKFLOW" | tee -a "$ECHO_FILE"
          echo "generated_by: codeql-db-echo-daemon" | tee -a "$ECHO_FILE"
          echo "----" | tee -a "$ECHO_FILE"
          chmod 600 "$ECHO_FILE"

      - name: 📋 [echo] 복제(미러) 디렉토리로 복사
        run: |
          echo "echo '[📋] .github/codeql-out/db-ql-dummy → db-ql-mirror 복사...'"
          echo '[📋] .github/codeql-out/db-ql-dummy → db-ql-mirror 복사...'
          mkdir -p .github/codeql-out/db-ql-mirror
          cp -a .github/codeql-out/db-ql-dummy/. .github/codeql-out/db-ql-mirror/
          chmod -R 700 .github/codeql-out/db-ql-mirror

      - name: 🛑 [echo] 더미 README.txt (오류시 전용)
        if: failure()
        run: |
          echo "echo '[❌] 실패: 더미 README.txt 생성...'"
          echo '[❌] 실패: 더미 README.txt 생성...'
          DBQL_DIR=".github/codeql-out/db-ql-dummy"
          mkdir -p "$DBQL_DIR"
          touch "$DBQL_DIR/README.txt"
          echo "This is a dummy DB directory for CodeQL fallback." > "$DBQL_DIR/README.txt"
          chmod 600 "$DBQL_DIR/README.txt"

      - name: 📂 [echo] 최종 파일 목록 확인
        run: |
          echo "echo '[📂] 최종 파일 목록 확인...'"
          echo '[📂] 최종 파일 목록 확인...'
          ls -lR .github/codeql-out/
