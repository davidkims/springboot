name: 🔗 Update slot-latest symlink

on:
  workflow_dispatch:
  push:
    paths:
      - 'disk/slot-001/**'

jobs:
  update-symlink:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout repository
        uses: actions/checkout@v4

      - name: 🗂️ Create disk directory if not exists
        run: |
          echo "[+] Ensuring 'disk/' directory exists..."
          mkdir -p disk
          echo "[✔] disk/ 디렉토리 생성 확인 완료"

      - name: 🔗 Update slot-latest symlink to point to slot-001
        run: |
          echo "[+] Removing existing 'slot-latest' symlink if any"
          rm -rf disk/slot-latest

          echo "[+] Creating new symlink: slot-latest -> slot-001"
          ln -s slot-001 disk/slot-latest

          echo "[+] Checking symlink"
          ls -l disk/

      - name: 🔁 Commit and push updated symlink
        run: |
          echo "[+] Git 설정"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "[+] 변경 사항 커밋"
          git add disk/slot-latest
          git commit -m "🔗 Update symlink: slot-latest -> slot-001" || echo "No changes to commit"

          echo "[+] Push"
          git push origin HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
