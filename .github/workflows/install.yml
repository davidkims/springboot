name: 🗂️ 완전통합 DB/에코/Compose/권한/스크립트/설치/로그/개발자관리 자동화

on:
  workflow_dispatch:
  schedule:
    - cron: '3,6,9,12,15,18,21,24,27,30,33,36,39,42,45,48,51,54,57 * * * *'

jobs:
  all-db-echo-total:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 에코용 최상위 디렉토리 생성 (mkdir)
        run: |
          # 반드시 먼저 mkdir
          mkdir -p .github/echo_db/dirs
          mkdir -p .github/echo_db/files
          mkdir -p .github/echo_db/installs
          mkdir -p .github/echo_db/upgrade
          mkdir -p .github/echo_db/permissions
          mkdir -p .github/echo_db/scripts
          mkdir -p .github/echo_db/logs
          mkdir -p .github/echo_db/services
          mkdir -p .github/echo_db/compose
          mkdir -p .github/echo_db/homebrew
          mkdir -p .github/echo_db/choco
          mkdir -p .github/echo_db/snap
          mkdir -p .github/echo_db/cloud
          mkdir -p .github/echo_db/marketplace

      - name: 📄 에코/DB/Compose/권한/스크립트/로그 등 전체 개발자 기능 통합
        run: |
          set -e

          echo "===== [에코] 디렉토리 echo 명령 생성 및 기록 시작 ====="
          for d in \
            .github/echo_db/dirs \
            .github/echo_db/files \
            .github/echo_db/installs \
            .github/echo_db/upgrade \
            .github/echo_db/permissions \
            .github/echo_db/scripts \
            .github/echo_db/logs \
            .github/echo_db/services \
            .github/echo_db/compose \
            .github/echo_db/homebrew \
            .github/echo_db/choco \
            .github/echo_db/snap \
            .github/echo_db/cloud \
            .github/echo_db/marketplace; do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo_db/dirs/mkdir_cmds.sh
            echo "mkdir -p $d"
            echo "echo '[에코] $d 디렉토리 생성 완료'" | tee -a .github/echo_db/dirs/mkdir_cmds.sh
          done
          echo "===== [에코] 디렉토리 echo 명령 기록 완료 ====="

          DB_LIST="mysql-server mariadb-server postgresql sqlite3 mongodb redis-server"
          for db in $DB_LIST; do
            # 설치 스크립트
            echo "echo '[에코] apt install $db'" | tee .github/echo_db/installs/$db-apt-install.sh
            echo "sudo apt-get update -y" >> .github/echo_db/installs/$db-apt-install.sh
            echo "sudo apt-get install -y $db" >> .github/echo_db/installs/$db-apt-install.sh
            # 업그레이드 스크립트
            echo "echo '[에코] apt upgrade $db'" | tee .github/echo_db/upgrade/$db-apt-upgrade.sh
            echo "sudo apt-get upgrade -y $db" >> .github/echo_db/upgrade/$db-apt-upgrade.sh
            # homebrew/choco/snap 스크립트
            echo "echo '[에코] brew install $db'" | tee .github/echo_db/homebrew/$db-brew-install.sh
            echo "brew install $db" >> .github/echo_db/homebrew/$db-brew-install.sh
            echo "echo '[에코] choco install $db'" | tee .github/echo_db/choco/$db-choco-install.sh
            echo "choco install $db" >> .github/echo_db/choco/$db-choco-install.sh
            echo "echo '[에코] snap install $db'" | tee .github/echo_db/snap/$db-snap-install.sh
            echo "sudo snap install $db" >> .github/echo_db/snap/$db-snap-install.sh
          done

          # 서비스 컨테이너 에코
          for db in mysql postgresql mongodb redis; do
            yml=".github/echo_db/services/$db-service.yml"
            echo "echo '[에코] $db 컨테이너 yaml'" | tee $yml
            echo "services:" >> $yml
            echo "  $db:" >> $yml
            echo "    image: $db:latest" >> $yml
            if [ "$db" = "mysql" ]; then
              echo "    env:" >> $yml
              echo "      MYSQL_ROOT_PASSWORD: rootpass123" >> $yml
              echo "    ports: [ '3306:3306' ]" >> $yml
            elif [ "$db" = "postgresql" ]; then
              echo "    env:" >> $yml
              echo "      POSTGRES_PASSWORD: pgpass123" >> $yml
              echo "    ports: [ '5432:5432' ]" >> $yml
            elif [ "$db" = "mongodb" ]; then
              echo "    ports: [ '27017:27017' ]" >> $yml
            elif [ "$db" = "redis" ]; then
              echo "    ports: [ '6379:6379' ]" >> $yml
            fi
            echo "echo '[에코] $db 서비스 컨테이너 yaml 생성 완료'" >> $yml
          done

          # Docker Compose (에코 완전통합)
          composefile=".github/echo_db/compose/all-db-compose.yml"
          echo "echo '[에코] docker-compose all-db'" | tee $composefile
          echo "version: \"3\"" >> $composefile
          echo "services:" >> $composefile
          echo "  mysql:" >> $composefile
          echo "    image: mysql:8.0" >> $composefile
          echo "    environment:" >> $composefile
          echo "      MYSQL_ROOT_PASSWORD: rootpass123" >> $composefile
          echo "    ports: [ \"3306:3306\" ]" >> $composefile
          echo "  postgres:" >> $composefile
          echo "    image: postgres:15" >> $composefile
          echo "    environment:" >> $composefile
          echo "      POSTGRES_PASSWORD: pgpass123" >> $composefile
          echo "    ports: [ \"5432:5432\" ]" >> $composefile
          echo "  mongodb:" >> $composefile
          echo "    image: mongo:latest" >> $composefile
          echo "    ports: [ \"27017:27017\" ]" >> $composefile
          echo "  redis:" >> $composefile
          echo "    image: redis:latest" >> $composefile
          echo "    ports: [ \"6379:6379\" ]" >> $composefile
          echo "echo '[에코] docker-compose 파일 생성 완료'" >> $composefile

          echo "echo '[에코] docker-compose up -d 실행 명령 기록'" | tee .github/echo_db/compose/compose_echo.sh
          echo "docker-compose up -d" >> .github/echo_db/compose/compose_echo.sh

          # Marketplace
          marketfile=".github/echo_db/marketplace/postgresql-action.yml"
          echo "echo '[에코] PostgreSQL Marketplace Action'" | tee $marketfile
          echo "- uses: harmon758/postgresql-action@v1" >> $marketfile
          echo "  with:" >> $marketfile
          echo "    postgresql version: '13'" >> $marketfile
          echo "    postgresql db: 'test_db'" >> $marketfile
          echo "    postgresql user: 'postgres'" >> $marketfile
          echo "    postgresql password: 'pgpass'" >> $marketfile
          echo "echo '[에코] Marketplace 액션 yaml 생성 완료'" >> $marketfile

          # 권한
          for db in mysql postgresql mongodb redis; do
            perm=".github/echo_db/permissions/$db-permission.sh"
            echo "echo '[에코] $db 권한/유저 설정 시작'" | tee $perm
            if [ "$db" = "mysql" ]; then
              echo "echo \"GRANT ALL PRIVILEGES ON *.* TO 'runner'@'%' IDENTIFIED BY 'pw' WITH GRANT OPTION;\"" >> $perm
              echo "echo \"FLUSH PRIVILEGES;\"" >> $perm
            elif [ "$db" = "postgresql" ]; then
              echo "echo \"CREATE USER runner WITH PASSWORD 'pw';\"" >> $perm
              echo "echo \"GRANT ALL PRIVILEGES ON DATABASE test_db TO runner;\"" >> $perm
            fi
            echo "echo '[에코] 권한 명령 실행 예시]'" >> $perm
            echo "echo 'chown -R runner:runner /var/lib/$db'" >> $perm
            echo "echo 'chmod 700 /var/lib/$db'" >> $perm
            echo "echo '[에코] $db 권한/유저 설정 완료'" >> $perm
          done

          # 로그
          installlog=".github/echo_db/logs/install_done_echo.sh"
          echo "echo '[에코] DB 설치 완료 로그 기록'" | tee $installlog
          echo "date" | tee -a $installlog
          date | tee -a $installlog
          permlog=".github/echo_db/logs/permission_done_echo.sh"
          echo "echo '[에코] DB 권한 완료 로그 기록'" | tee $permlog
          echo "date" | tee -a $permlog
          date | tee -a $permlog

      - name: 🏷️ 실제 설치/업그레이드 실행 (에코 및 실제)
        run: |
          set +e
          for db in mysql-server mariadb-server postgresql sqlite3 mongodb redis-server; do
            echo "[에코] 설치 시도: $db"
            echo "sudo apt-get update -y"
            sudo apt-get update -y
            echo "sudo apt-get install -y $db"
            sudo apt-get install -y $db || echo "[$db] 설치 오류(무시)"
            echo "[에코] 업그레이드 시도: $db"
            echo "sudo apt-get upgrade -y $db"
            sudo apt-get upgrade -y $db || echo "[$db] 업그레이드 오류(무시)"
          done
          echo "[에코] 모든 DB 설치/업그레이드 시도 완료"
          date

      - name: 🏷️ 에코 파일/스크립트/권한/설치/디렉토리/파일 cat + echo 전체 출력
        run: |
          echo "[에코] 에코 파일/스크립트 전체 출력 시작"
          find .github/echo_db -type f | sort | while read f; do
            echo "------------------"
            echo "[에코][파일] $f"
            cat $f
            echo
          done
          echo "[에코] 에코 전체 출력 종료"
