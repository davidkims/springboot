name: 🛡️ MEGA Scorecard FULL WORKFLOW

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '16 11 * * 2'   # 매주 화요일 Scorecard 분석
    - cron: '*/3 * * * *'   # 3분마다 EchoOps
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard-analysis:
    name: ✅ Scorecard 분석 및 SARIF 업로드
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: 📂 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🧪 Scorecard 실행 (SARIF + JSON 생성)
        uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          results_file_json: results.json

      - name: ☁️ GitHub Code Scanning 업로드
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: 📦 결과 저장
        uses: actions/upload-artifact@v4
        with:
          name: Scorecard-Results
          path: |
            results.sarif
            results.json

  post-analysis-fullops:
    name: 🔧 EchoOps + Markdown 변환 + SARIF 평가 + 업그레이드 + Pages 배포
    runs-on: ubuntu-latest
    needs: scorecard-analysis
    if: always()

    steps:
      - name: 📂 코드 체크아웃
        uses: actions/checkout@v4

      - name: 📥 결과 다운로드
        uses: actions/download-artifact@v4
        with:
          name: Scorecard-Results

      - name: 📁 에코 디렉토리 생성
        run: |
          for d in echo_scorecard echo_monitoring echo_pages echo_upgrade echo_dirs; do
            mkdir -p .github/$d
            echo "echo '[ECHO] 생성: .github/$d'" >> .github/$d/create_dirs.sh
          done

      - name: 🧪 results.json 검사 및 백업
        run: |
          mkdir -p .github/echo_scorecard
          echo "[INFO] 파일 타입:" $(file results.json) | tee .github/echo_scorecard/filetype.txt
          head -n 10 results.json > .github/echo_scorecard/results_head.txt || true
          cp results.json .github/echo_scorecard/results_raw_$(date +%Y%m%d_%H%M).json || true

          if ! jq empty results.json > /dev/null 2>&1; then
            echo "::error ::results.json is NOT valid JSON. 백업 후 대체"
            mv results.json .github/echo_scorecard/results_invalid_$(date +%Y%m%d_%H%M).bak || true
            echo '{}' > results.json
          fi

      - name: 🧼 SARIF 경고 제거 (artifactLocation.uri 정제)
        run: |
          jq '
            .runs[].results[].locations[].physicalLocation.artifactLocation.uri |=
            if . == "no file associated with this alert" or (. | test("^\\.?github/")) then
              "file://unknown"
            else . end
          ' results.sarif > results.cleaned.sarif
          mv results.cleaned.sarif results.sarif

      - name: 📝 Scorecard JSON → Markdown 변환
        run: |
          mkdir -p site/scorecard
          echo "# 🛡️ OSSF Scorecard 결과 요약" > site/scorecard/scorecard-summary.md
          if jq -e '.repo.name and .score and .checks' results.json > /dev/null 2>&1; then
            jq -r '
              "### 프로젝트: \(.repo.name)\n\n" +
              "신뢰도 점수: \(.score) / 10\n\n" +
              "| Check | Pass | Score | Reason |\n|-------|------|--------|--------|\n" +
              (.checks[] |
                "| \(.name) | \(.pass) | \(.score) | \(.reason // "-") |"
              ) | join("\n")
            ' results.json >> site/scorecard/scorecard-summary.md
          else
            echo "_⚠️ results.json 구조가 잘못되어 Markdown 변환 생략됨._" >> site/scorecard/scorecard-summary.md
          fi

      - name: 📄 SARIF → Markdown 이슈 요약
        run: |
          echo "# 🚨 SARIF 보안 이슈 요약" > site/scorecard/sarif-summary.md
          jq -r '
            .runs[].results[] |
            "- [\(.level)] \(.message.text)\n  위치: \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine // "-")"
          ' results.sarif >> site/scorecard/sarif-summary.md

      - name: 📊 SARIF 통계 요약 저장
        run: |
          mkdir -p .github/echo_scorecard
          TOTAL=$(jq '.runs[].results | length' results.sarif)
          SEVERITY=$(jq -r '.runs[].results[].level' results.sarif | sort | uniq -c)
          echo "[SARIF] 총 이슈 수: $TOTAL" > .github/echo_scorecard/sarif_summary.txt
          echo "$SEVERITY" >> .github/echo_scorecard/sarif_summary.txt

      - name: 📦 대용량 파일 및 디렉토리 분석
        run: |
          mkdir -p .github/echo_monitoring
          du -ah . | sort -hr | head -n 30 > .github/echo_monitoring/top_file_sizes.txt || true
          du -sh . > .github/echo_monitoring/total_size.txt || true

      - name: 🌐 Pages 업로드 파일 정리
        run: |
          mkdir -p site/scorecard
          cp results.sarif site/scorecard/scorecard-results.sarif
          cp results.json site/scorecard/results.json
          echo "echo '[ECHO] Pages용 결과 파일 복사 완료'" >> .github/echo_pages/copy_results.sh

      - name: 🚀 GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site

      - name: ⬆️ 시스템 업그레이드 로그 저장
        run: |
          mkdir -p .github/echo_upgrade
          echo "[UPGRADE] apt upgrade" | tee .github/echo_upgrade/apt.log
          sudo apt-get update && sudo apt-get upgrade -y >> .github/echo_upgrade/apt.log 2>&1
          echo "[UPGRADE] pip list --outdated" | tee .github/echo_upgrade/pip.log
          pip list --outdated >> .github/echo_upgrade/pip.log || true
          echo "[UPGRADE] npm update" | tee .github/echo_upgrade/npm.log
          npm update >> .github/echo_upgrade/npm.log || true
