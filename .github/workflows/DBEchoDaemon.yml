name: 🛡️ CodeQL Full Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  codeql-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # 공통 복제 블록 삽입 (이 위치가 안전)
      - name: 📦 [echo] CodeQL DB Echo 파일 복제 (필수)
        run: |
          echo "echo '[📦] CodeQL DB Echo 파일/디렉토리 복제 시작...'"
          echo '[📦] CodeQL DB Echo 파일/디렉토리 복제 시작...'
          if [ -f .github/codeql-out/db-ql-dummy/codeql-db-echo.txt ]; then
            echo "echo '[✅] codeql-db-echo.txt → ./ 복사...'"
            echo '[✅] codeql-db-echo.txt → ./ 복사...'
            cp .github/codeql-out/db-ql-dummy/codeql-db-echo.txt .
          fi
          if [ -d .github/codeql-out/db-ql-dummy ]; then
            echo "echo '[✅] db-ql-dummy 디렉토리 → ./db-ql 복사...'"
            echo '[✅] db-ql-dummy 디렉토리 → ./db-ql 복사...'
            rm -rf ./db-ql || true
            cp -a .github/codeql-out/db-ql-dummy ./db-ql
          fi

      - name: 🏗️ Setup Java (예시)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗️ Setup Python (예시)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⬇️ Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java, python

      - name: 🔨 Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 🔎 Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java,/language:python"

      - name: 📂 [echo] 최종 파일 목록
        run: |
          echo "echo '[📂] 최종 파일 목록...'"
          echo '[📂] 최종 파일 목록...'
          ls -lR ./
