name: "🏦 MEGA Finance EchoOps EXT (MariaDB+Oracle+PostgreSQL+Redis+Kafka + AutoUP + Accounts)"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/finance-echo
  IMAGE_TAG: latest
  BACKUP_VOLUME: finance_backup_vol
  BACKUP_DIR: /backup
  KAFKA_LOG: kafka.log
  ECHO_DIR: .github/echo_services
  # echoe 함수 전역 등록
  BASH_ENV: ${{ github.workspace }}/.bash_env

jobs:
  mega-finance-echoops:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v5

      - name: 🛠️ echoe 함수 전역 등록
        run: |
          echo 'echoe(){ echo "[ECHO] $@"; }' >> $BASH_ENV
          source $BASH_ENV
          echoe "echoe 함수가 전역으로 등록되었습니다."

      - name: 📂 Echo 디렉토리 및 파일 생성
        run: |
          source $BASH_ENV
          echoe "Echo 디렉토리 및 계정/권한 파일 생성"
          mkdir -p $ECHO_DIR/{mariadb,oracle,postgres,redis,kafka,accounts,logs,perm}
          for svc in mariadb oracle postgres redis kafka; do
            echo "[ACCOUNT] $svc -> user=finance_${svc}, password=secret_${svc}" > $ECHO_DIR/accounts/$svc.account
            echo "[PERM] $svc -> 권한: ALL PRIVILEGES" > $ECHO_DIR/perm/$svc.perm
            echo "[CONF] $svc 서비스 구성 에코" > $ECHO_DIR/$svc/config.txt
            echo "[LOG] $svc 초기화 로그" > $ECHO_DIR/logs/$svc.log
          done

      - name: 🛠️ Dockerfile (에코 이미지 생성)
        run: |
          source $BASH_ENV
          echoe "Dockerfile 생성"
          cat > Dockerfile <<'DOCKER'
          FROM alpine:3.18
          RUN apk add --no-cache bash mariadb-client postgresql-client redis
          RUN mkdir -p /app /data
          RUN echo "# 재무 거래 로그 (에코)" > /app/transactions.log
          RUN echo "$(date) 거래유형: 계좌이체, 금액: 100000KRW, 상태: 완료" >> /app/transactions.log
          RUN echo "$(date) 거래유형: 신용카드, 금액: 250000KRW, 상태: 완료" >> /app/transactions.log
          RUN echo "$(date) 거래유형: 비트코인, 금액: 0.03BTC, 상태: 완료" >> /app/transactions.log
          CMD ["bash","-c","cp /app/transactions.log /data/statement-$(date +%Y%m%d%H%M%S).txt && sleep 30"]
          DOCKER

      - name: 🔐 Docker 로그인 (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Docker 이미지 빌드 및 푸시
        run: |
          source $BASH_ENV
          echoe "이미지 빌드 & 푸시"
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker push $IMAGE_NAME:$IMAGE_TAG

      - name: 📦 백업 볼륨 생성
        run: |
          source $BASH_ENV
          echoe "Docker 볼륨 생성"
          docker volume create $BACKUP_VOLUME

      # ─────────────── MariaDB ───────────────
      - name: 🗄️ MariaDB 컨테이너 실행 및 계정/테이블 생성
        run: |
          source $BASH_ENV
          echoe "MariaDB 실행"
          docker run -d --name mariadb-echo -e MYSQL_ROOT_PASSWORD=secret mariadb:10.11
          sleep 25
          docker exec mariadb-echo mysql -uroot -psecret <<'SQL'
          CREATE DATABASE IF NOT EXISTS finance;
          CREATE USER IF NOT EXISTS 'finance_mariadb'@'%' IDENTIFIED BY 'secret_mariadb';
          GRANT ALL PRIVILEGES ON finance.* TO 'finance_mariadb'@'%';
          USE finance;
          CREATE TABLE IF NOT EXISTS statements (id INT AUTO_INCREMENT PRIMARY KEY, note VARCHAR(255), created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);
          INSERT INTO statements(note) VALUES ('MariaDB Echo Statement');
          SQL

      # ─────────────── Oracle ───────────────
      - name: 🗄️ Oracle XE 컨테이너 실행 및 계정/테이블 생성
        run: |
          source $BASH_ENV
          echoe "Oracle XE 실행"
          docker run -d --name oracle-echo -e ORACLE_PASSWORD=secret gvenzl/oracle-xe:21-slim
          sleep 40
          docker exec oracle-echo bash -c "echo \"CREATE USER finance_oracle IDENTIFIED BY secret_oracle; GRANT CONNECT, RESOURCE TO finance_oracle;\" | sqlplus -s system/secret@localhost:1521/XEPDB1"
          docker exec oracle-echo bash -c "echo \"CREATE TABLE statements (id NUMBER GENERATED BY DEFAULT AS IDENTITY, note VARCHAR2(255), created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP); INSERT INTO statements(note) VALUES ('Oracle Echo Statement');\" | sqlplus -s finance_oracle/secret_oracle@localhost:1521/XEPDB1"

      # ─────────────── PostgreSQL ───────────────
      - name: 🗄️ PostgreSQL 컨테이너 실행 및 계정/테이블 생성
        run: |
          source $BASH_ENV
          echoe "PostgreSQL 실행"
          docker run -d --name postgres-echo -e POSTGRES_PASSWORD=secret postgres:15
          sleep 20
          docker exec postgres-echo psql -U postgres -c "CREATE DATABASE finance;"
          docker exec postgres-echo psql -U postgres -d finance -c "CREATE USER finance_postgres WITH PASSWORD 'secret_postgres';"
          docker exec postgres-echo psql -U postgres -d finance -c "GRANT ALL PRIVILEGES ON DATABASE finance TO finance_postgres;"
          docker exec postgres-echo psql -U postgres -d finance -c "CREATE TABLE IF NOT EXISTS statements (id SERIAL PRIMARY KEY, note TEXT, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"
          docker exec postgres-echo psql -U postgres -d finance -c "INSERT INTO statements(note) VALUES ('PostgreSQL Echo Statement');"

      # ─────────────── Redis ───────────────
      - name: 🗄️ Redis 컨테이너 실행 및 키 생성
        run: |
          source $BASH_ENV
          echoe "Redis 실행"
          docker run -d --name redis-echo redis:7
          sleep 10
          docker exec redis-echo redis-cli SET finance:statement "Redis Echo Statement"
          echoe "Redis 가상 계정=finance_redis / 패스워드=secret_redis (에코 기록)"

      # ─────────────── Kafka ───────────────
      - name: 🗄️ Kafka 컨테이너 실행 및 토픽 생성
        run: |
          source $BASH_ENV
          echoe "Kafka 실행"
          docker network create kafka-net || true
          docker run -d --name zookeeper --network kafka-net -e ZOOKEEPER_CLIENT_PORT=2181 wurstmeister/zookeeper
          docker run -d --name kafka --network kafka-net -e KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181 -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT wurstmeister/kafka
          sleep 25
          docker exec kafka kafka-topics.sh --create --topic finance-statements --bootstrap-server localhost:9092 || true
          echo "Kafka Echo Statement" | docker exec -i kafka kafka-console-producer.sh --topic finance-statements --bootstrap-server localhost:9092
          echoe "Kafka 가상 계정=finance_kafka / 패스워드=secret_kafka (에코 기록)"

      # ─────────────── Finance 에코 백업 ───────────────
      - name: 🚀 Finance 컨테이너 실행 (에코 + 백업)
        run: |
          source $BASH_ENV
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          docker run --rm -v $BACKUP_VOLUME:$BACKUP_DIR $IMAGE_NAME:$IMAGE_TAG \
            bash -c "
              echo '📊 재무제표 백업 [$TIMESTAMP]' > $BACKUP_DIR/backup-$TIMESTAMP.txt;
              cat /app/transactions.log >> $BACKUP_DIR/backup-$TIMESTAMP.txt;
              echo '✅ 백업 완료' >> $BACKUP_DIR/backup-$TIMESTAMP.txt;
              echo '$TIMESTAMP [backup] 거래 로그 백업 완료' >> /app/kafka.log;
            "
          echo "$TIMESTAMP [backup] 완료" >> $KAFKA_LOG

      # ─────────────── Auto Upgrade ───────────────
      - name: 📦 서비스별 패키지 업그레이드
        run: |
          source $BASH_ENV
          echoe "서비스 업그레이드 실행"
          sudo apt-get update
          sudo apt-get -y upgrade
          echoe "시스템 패키지 업그레이드 완료"

      - name: 📊 DB 쿼리 확인
        run: |
          source $BASH_ENV
          echoe "MariaDB SELECT"
          docker exec mariadb-echo mysql -uroot -psecret -e "USE finance; SELECT * FROM statements;"
          echoe "Oracle SELECT"
          docker exec oracle-echo bash -c "echo \"SELECT * FROM statements;\" | sqlplus -s finance_oracle/secret_oracle@localhost:1521/XEPDB1"
          echoe "PostgreSQL SELECT"
          docker exec postgres-echo psql -U postgres -d finance -c "SELECT * FROM statements;"
          echoe "Redis GET"
          docker exec redis-echo redis-cli GET finance:statement

      - name: 📄 Kafka-style 로그 출력
        run: |
          source $BASH_ENV
          echo "🪵 Kafka-style 로그 출력:"
          cat $KAFKA_LOG || echo "⚠️ 로그 없음"

      - name: 📦 Echo 결과 아카이브 업로드
        uses: actions/upload-artifact@v4
        with:
          name: finance-echo-artifacts
          path: ${{ env.ECHO_DIR }}
