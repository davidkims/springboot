name: 🚀 Copy Workflows from External Repo

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "agentic-doc main 브랜치에서 특정 커밋 또는 브랜치 (default: main)"
        required: false
        default: main

jobs:
  copy-workflows:
    runs-on: ubuntu-latest
    env:
      EXT_REPO: "davidkims/agentic-doc"
      EXT_PATH: ".github/workflows"
      TARGET_PATH: ".github/workflows"

    steps:
      - name: "📥 Checkout Current Repo"
        uses: actions/checkout@v4

      - name: "🐙 Clone External Workflows Directory Only"
        run: |
          echo "[🐙] 외부 워크플로우 복사: $EXT_REPO/$EXT_PATH"
          rm -rf tmp_agentic_workflows
          git clone --depth=1 --filter=blob:none --sparse https://github.com/${EXT_REPO}.git tmp_agentic_workflows
          cd tmp_agentic_workflows
          git sparse-checkout set $EXT_PATH
          git checkout ${{ github.event.inputs.commit || 'main' }}
          cd ..

      - name: "📁 Copy and Overwrite .github/workflows"
        run: |
          echo "[📁] 복사 시작"
          mkdir -p $TARGET_PATH
          cp -af tmp_agentic_workflows/$EXT_PATH/* $TARGET_PATH/ || echo "No files to copy"
          ls -al $TARGET_PATH

      - name: "✅ Check Git Diff"
        run: |
          if git diff --exit-code $TARGET_PATH; then
            echo "[✅] 변경 없음"
            exit 0
          fi
          echo "[🚩] 변경 감지됨"

      - name: "🚀 Commit and Push Changes"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "[🚀] Git 커밋/푸시"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add $TARGET_PATH
          git commit -m "🔄 Update workflows from $EXT_REPO (${{ github.event.inputs.commit || 'main' }})" || exit 0
          git push "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }} || echo "[⚠️] Push 실패 시 수동 확인"

      - name: "🧹 Cleanup"
        run: rm -rf tmp_agentic_workflows
