# yamllint disable rule:line-length
name: Update Program Data (No-Skip Auto-discover)

on:
  workflow_dispatch:
    inputs:
      program:
        description: "업데이트할 프로그램 이름 (all=전체, 부분문자열 매칭)"
        required: false
        default: "all"
      commit_mode:
        description: "commit-and-pr | commit-direct | none"
        required: false
        default: "commit-and-pr"
  schedule:
    - cron: '0 0 * * 0'  # 매주 일요일 00:00 UTC

concurrency:
  group: update-program-data
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      LOG_DIR: .github/logs
      BRANCH_PREFIX: chore/auto-update
      DEFAULT_AUTHOR_NAME: repo-bot
      DEFAULT_AUTHOR_EMAIL: repo-bot@users.noreply.github.com
      PROGRAM_IN: ${{ github.event.inputs.program || 'all' }}
      COMMIT_MODE: ${{ github.event.inputs.commit_mode || 'commit-and-pr' }}

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 📁 Prepare log & tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR"
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq jq coreutils make python3 python3-venv

      - name: 🟨 Setup Node (always, no-skip)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 Make common updaters executable
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -f workflow/update_all_data.sh ] && chmod +x workflow/update_all_data.sh || true
          while IFS= read -r -d '' f; do
            chmod +x "$f" || true
          done < <(find . -type f -iname "update*.sh" -print0 2>/dev/null || true)

      - name: 🔎 Discover update targets (no-skip)
        id: discover
        shell: bash
        run: |
          set -Eeuo pipefail

          # 후보 수집
          mapfile -t CANDIDATES < <( \
            { [ -f "workflow/update_all_data.sh" ] && echo "sh::workflow/update_all_data.sh"; } ; \
            find . -type f -iname "update*.sh" -printf "sh::%p\n" 2>/dev/null || true ; \
            { for pkg in $(git ls-files "**/package.json" 2>/dev/null || true); do
                if jq -e '.scripts["update-data"]' "$pkg" >/dev/null 2>&1; then
                  echo "npm::$pkg";
                fi
              done; } ; \
            {
              while IFS= read -r mk; do
                if grep -qE '^[[:space:]]*update-data:' "$mk"; then
                  echo "make::$mk"
                fi
              done < <(git ls-files "**/Makefile" 2>/dev/null || true)
            } ; \
            { for py in $(git ls-files "**/updater.py" 2>/dev/null || true); do echo "py::${py}"; done } \
          )

          # 중복 제거
          UNIQUE=()
          declare -A seen
          for c in "${CANDIDATES[@]}"; do
            [[ -z "${c:-}" ]] && continue
            if [[ -z "${seen[$c]+x}" ]]; then
              UNIQUE+=("$c"); seen[$c]=1
            fi
          done

          # program 필터링 (부분문자열 매칭)
          FILTERED=()
          if [[ "${PROGRAM_IN}" == "all" || -z "${PROGRAM_IN}" ]]; then
            FILTERED=("${UNIQUE[@]}")
          else
            for c in "${UNIQUE[@]}"; do
              [[ "${c,,}" == *"${PROGRAM_IN,,}"* ]] && FILTERED+=("$c")
            done
          fi

          # 1개도 못 찾았으면 최소 보호 장치로 update_all_data.sh만이라도 추가
          if [[ ${#FILTERED[@]} -eq 0 && -f "workflow/update_all_data.sh" ]]; then
            FILTERED=("sh::workflow/update_all_data.sh")
          fi

          # 결과 JSON
          {
            printf '{ "targets": ['
            sep=""
            for x in "${FILTERED[@]}"; do
              printf '%s"%s"' "$sep" "$x"; sep=","
            done
            printf '] }'
          } | tee "$LOG_DIR/targets.json"

          echo "count=${#FILTERED[@]}" >> "$GITHUB_OUTPUT"
          echo "targets_json=$(tr -d '\n' < "$LOG_DIR/targets.json")" >> "$GITHUB_OUTPUT"

      - name: 🚀 Run targets sequentially (no-skip; continue on error)
        shell: bash
        run: |
          set -Eeuo pipefail
          ts(){ date '+%F %T'; }
          echo "## Update Program Data — Run Summary ($(ts))" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          TARGETS=$(jq -r '.targets[]' "$LOG_DIR/targets.json" 2>/dev/null || true)
          if [[ -z "${TARGETS:-}" ]]; then
            echo "_대상이 없어 스킵 없이 종료(탐지 실패)._"
            echo "_대상이 없어 스킵 없이 종료(탐지 실패)._">> "$GITHUB_STEP_SUMMARY"
          fi

          FAIL=0

          run_sh()   { local path="$1"; ( set -Eeuo pipefail; bash "$path" ); }
          run_npm()  { local pkg="$1"; ( set -Eeuo pipefail; cd "$(dirname "$pkg")"; npm ci --no-audit --no-fund; npm run update-data --if-present ); }
          run_make() { local mkf="$1"; ( set -Eeuo pipefail; cd "$(dirname "$mkf")"; make update-data ); }
          run_py()   { local pyf="$1"; ( set -Eeuo pipefail; cd "$(dirname "$pyf")"; python3 "$(basename "$pyf")" ); }

          idx=0
          while IFS= read -r target; do
            [[ -z "$target" ]] && continue
            idx=$((idx+1))
            kind="${target%%::*}"
            path="${target#*::}"
            safe="$(echo "$path" | tr '/ .' '__')"
            log="$LOG_DIR/run_${idx}_${kind}_${safe}.log"

            echo "[ECHO] ($idx) kind=$kind path=$path → 로그: $log"
            {
              echo "[RUN] kind=$kind path=$path @ $(ts)"
              case "$kind" in
                sh)   run_sh "$path" ;;
                npm)  run_npm "$path" ;;
                make) run_make "$path" ;;
                py)   run_py "$path" ;;
                *)    echo "[WARN] Unknown kind: $kind (skip logical)";;
              esac
              echo "[OK ] $path @ $(ts)"
            } > >(tee "$log") 2>&1 || {
              echo "[ERR] $path 실패 @ $(ts)" | tee -a "$log"
              FAIL=$((FAIL+1))
            }

            echo "- \`$kind\` → \`$path\` → [log](./$log)" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$TARGETS"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**실패 수:** $FAIL" >> "$GITHUB_STEP_SUMMARY"
          # 실패가 있어도 종료코드 0을 반환하여 다음 단계로 진행 (No-Skip)
          exit 0

      - name: 🧹 Normalize line endings (optional; no-skip)
        shell: bash
        run: |
          set -Eeuo pipefail
          git config core.autocrlf input || true

      - name: 💾 Commit / Push / PR (single step; no-skip)
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          echo "[ECHO] Detect changes..."
          if git diff --quiet; then
            echo "[ECHO] 변경사항 없음 → 커밋/푸시/PR 생략"
            echo "PR_BRANCH=" >> "$GITHUB_OUTPUT"
            echo "NO_CHANGES=1" >> "$GITHUB_ENV"
          else
            echo "[ECHO] 변경사항 감지됨 → 커밋 진행"
            git config user.name  "${DEFAULT_AUTHOR_NAME}"
            git config user.email "${DEFAULT_AUTHOR_EMAIL}"
            stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
            git add -A
            git commit -m "chore(data): auto update ($stamp)"

            MODE="${COMMIT_MODE}"
            REF_NAME="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD || echo main)}"
            if [[ "$MODE" == "commit-direct" ]]; then
              echo "[ECHO] commit-direct 모드 → 현재 브랜치로 푸시"
              git push origin "HEAD:${REF_NAME}" || true
              echo "PR_BRANCH=" >> "$GITHUB_OUTPUT"
            elif [[ "$MODE" == "none" ]]; then
              echo "[ECHO] none 모드 → 커밋만 하고 푸시/PR 생략"
              echo "PR_BRANCH=" >> "$GITHUB_OUTPUT"
            else
              echo "[ECHO] commit-and-pr 모드 → 새 브랜치 생성 후 푸시"
              BR="${BRANCH_PREFIX}/${stamp}"
              git branch "$BR"
              git push -u origin "$BR" || true
              echo "PR_BRANCH=$BR" >> "$GITHUB_OUTPUT"
            fi
            echo "NO_CHANGES=0" >> "$GITHUB_ENV"
          fi

      - name: 🔁 Open pull request (always; safe)
        uses: actions/github-script@v7
        env:
          PR_BRANCH: ${{ steps.publish.outputs.PR_BRANCH }}
        with:
          script: |
            try {
              const prBranch = process.env.PR_BRANCH || "";
              const noChanges = process.env.NO_CHANGES === "1";
              if (!prBranch || noChanges) {
                core.info("No PR branch or no changes → skip PR creation (no-skip step).");
                return;
              }
              const { repo, owner } = context.repo;
              const base = context.payload?.repository?.default_branch || 'main';
              const title = `chore(data): auto update (${new Date().toISOString()})`;
              const body  = [
                '자동 데이터 업데이트 결과입니다.',
                '',
                '- 워크플로우: Update Program Data (No-Skip Auto-discover)',
                `- 브랜치: ${prBranch}`,
                '',
                '변경 내역과 실행 로그는 `.github/logs/` 디렉토리를 참조하세요.'
              ].join('\n');
              const res = await github.rest.pulls.create({
                owner, repo,
                title, head: prBranch, base, body
              });
              core.notice(`PR created: ${res.data.html_url}`);
            } catch (e) {
              core.warning(`PR create failed (no-skip): ${e.message}`);
            }

      - name: 📎 Upload logs (artifact; always)
        uses: actions/upload-artifact@v4
        with:
          name: update-logs-${{ github.run_id }}
          path: .github/logs
          if-no-files-found: warn
