name: 🔒 Integrated Blacklist Generator (Every 1 min · Mandatory DC · Fail-safe · Echo · Mass Dirs · No setup-* actions)

on:
  schedule:
    - cron: "*/1 * * * *"   # 1분마다 (GitHub이 지연/스킵할 수 있음)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: blacklist-integrated
  cancel-in-progress: true

env:
  BLACKLIST_DIR: .github/blacklist
  REPORT_DIR: .github/blacklist/report
  EXPORT_DIR: .github/blacklist/export
  SNAPSHOT_DIR: .github/blacklist/snapshots
  ARCHIVE_DIR: .github/blacklist/archive
  LATEST_DIR: .github/blacklist/latest
  NET_DIR: .github/blacklist/networks
  PKG_DIR: .github/blacklist/packages
  CODE_DIR: .github/blacklist/code
  SUMMARY_DIR: .github/blacklist/summary

  ENABLE_SPAMHAUS: "true"
  ENABLE_EMERGING_THREATS: "true"
  ENABLE_PY_AUDIT: "auto"
  ENABLE_NPM_AUDIT: "auto"
  ENABLE_SEMGREP: "true"

  DC_VERSION: "9.2.0"
  DC_HOME: /opt/dependency-check
  DC_DATA: /opt/dependency-check/data

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🧭 Echo start & env
        run: |
          echo "[ECHO] ▶ 통합 블랙리스트 워크플로우 시작"
          echo "[ECHO] 브랜치: $(git rev-parse --abbrev-ref HEAD)"
          echo "[ECHO] 커밋: $(git rev-parse --short HEAD)"
          echo "RUN_DATE_UTC=$(date -u +%Y%m%dT%H%M%SZ)" >> $GITHUB_ENV
          echo "LOGFILE=.github/blacklist/logs/run_$(date -u +%Y%m%dT%H%M%SZ).log" >> $GITHUB_ENV
          echo "[ECHO] 실행 시각(UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: 📁 Create mass directories
        run: |
          set -e
          mkdir -p \
            "$BLACKLIST_DIR"/{raw,dist,logs} \
            "$REPORT_DIR" \
            "$EXPORT_DIR"/{json,txt,csv,html} \
            "$SNAPSHOT_DIR" "$ARCHIVE_DIR" "$LATEST_DIR" \
            "$NET_DIR"/{spamhaus,et,all} \
            "$PKG_DIR"/{python,npm,dc} \
            "$CODE_DIR"/semgrep \
            "$SUMMARY_DIR"
          SNAP_DIR="$SNAPSHOT_DIR/$RUN_DATE_UTC"
          mkdir -p "$SNAP_DIR"/{networks,packages,code,summary,logs}
          echo "SNAP_DIR=$SNAP_DIR" >> $GITHUB_ENV
          echo "[ECHO] 디렉터리 생성 완료 (스냅샷: $SNAP_DIR)" | tee -a "$LOGFILE"

      - name: 🗂️ Bootstrap placeholder files via echo
        run: |
          set -e
          echo "# Blacklist Outputs" > "$BLACKLIST_DIR/README.md"
          echo "{ \"generated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"version\": 1 }" > "$BLACKLIST_DIR/manifest.json"
          for d in "$BLACKLIST_DIR" "$REPORT_DIR" "$EXPORT_DIR" "$SNAPSHOT_DIR" "$ARCHIVE_DIR" "$LATEST_DIR" \
                   "$NET_DIR/spamhaus" "$NET_DIR/et" "$NET_DIR/all" \
                   "$PKG_DIR/python" "$PKG_DIR/npm" "$PKG_DIR/dc" \
                   "$CODE_DIR/semgrep" "$SUMMARY_DIR" \
                   "$SNAP_DIR" "$SNAP_DIR/networks" "$SNAP_DIR/packages" "$SNAP_DIR/code" "$SNAP_DIR/summary" "$SNAP_DIR/logs"; do
            touch "$d/.gitkeep"
          done
          echo "[ECHO] 플레이스홀더/매니페스트 생성" | tee -a "$LOGFILE"

      # ✅ setup-python/setup-node 액션 제거 → APT로 보장
      - name: 🧰 Ensure system Python/Node via APT (no GHCR downloads)
        run: |
          set -e
          echo "[ECHO] APT 패키지 설치 시작" | tee -a "$LOGFILE"
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends python3 python3-pip python3-venv jq yq unzip curl ca-certificates gnupg nodejs npm
          python3 --version || true
          pip3 --version || true
          node --version || true
          npm --version || true
          echo "[ECHO] APT 설치 완료" | tee -a "$LOGFILE"

      - name: ⬆️ Install/Upgrade CLI tools (pip/npm)
        run: |
          set -e
          echo "[ECHO] CLI 도구 설치 시작" | tee -a "$LOGFILE"
          python3 -m pip install --upgrade pip
          pip3 install -U pip-audit safety semgrep
          npm i -g npm@latest || true
          echo "[ECHO] CLI 도구 설치 완료 (pip-audit, safety, semgrep, npm)" | tee -a "$LOGFILE"

      # -----------------------------
      # OWASP Dependency-Check (필수)
      # -----------------------------
      - name: ♻️ Cache OWASP DC Data (NVD DB)
        id: cache-dc
        uses: actions/cache@v4
        with:
          path: ${{ env.DC_DATA }}
          key: dc-data-${{ env.DC_VERSION }}-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/build.gradle*', '**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml', '**/requirements*.txt', '**/Pipfile.lock', '**/poetry.lock') }}
          restore-keys: |
            dc-data-${{ env.DC_VERSION }}-${{ runner.os }}-

      - name: 🛠 Install OWASP Dependency-Check CLI (resilient)
        run: |
          set -e
          echo "[ECHO] DC 설치 시작 v${DC_VERSION}" | tee -a "$LOGFILE"
          sudo rm -rf "${DC_HOME}"
          curl -sSL -o dc.zip "https://github.com/jeremylong/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip" || {
            echo "[WARN] DC ZIP 다운로드 실패 → 재시도 3회" | tee -a "$LOGFILE"
            for i in 1 2 3; do
              sleep $((i*2))
              curl -sSL -o dc.zip "https://github.com/jeremylong/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip" && break
            done
          }
          sudo mkdir -p "${DC_HOME}" "${DC_DATA}"
          if unzip -q dc.zip -d /opt; then
            # 동적 폴더명 처리
            CANDIDATE="$(find /opt -maxdepth 1 -type d -name 'dependency-check*' | head -n1 || true)"
            if [ -n "$CANDIDATE" ]; then
              sudo rm -rf "${DC_HOME}"
              sudo mv "$CANDIDATE" "${DC_HOME}"
              sudo chmod +x "${DC_HOME}/bin/dependency-check.sh" || true
              echo "DC_READY=true" >> $GITHUB_ENV
              echo "[ECHO] DC 설치 성공 (HOME=${DC_HOME})" | tee -a "$LOGFILE"
            else
              echo "DC_READY=false" >> $GITHUB_ENV
              echo "[WARN] DC 설치 폴더 탐색 실패 → 자리표시자 모드" | tee -a "$LOGFILE"
            fi
          else
            echo "DC_READY=false" >> $GITHUB_ENV
            echo "[WARN] DC ZIP 해제 실패 → 자리표시자 모드" | tee -a "$LOGFILE"
          fi
          rm -f dc.zip

      - name: 🔎 DC 실행 (JSON+HTML, 다중 --format, fail-safe, echo/복사 보장)
        run: |
          set -e
          echo "[ECHO] DC 실행 단계 시작" | tee -a "$LOGFILE"
          mkdir -p "$PKG_DIR/dc" "$EXPORT_DIR/json" "$EXPORT_DIR/html"
          if [ "${DC_READY:-false}" != "true" ]; then
            echo "[WARN] DC_READY=false → 실행 생략, 자리표시자 유지" | tee -a "$LOGFILE"
          else
            if ! "${DC_HOME}/bin/dependency-check.sh" \
                  --project "BlacklistScan" \
                  --scan . \
                  --format JSON \
                  --format HTML \
                  --out "$PKG_DIR/dc" \
                  --data "$DC_DATA" \
                  --failOnCVSS 0 ; then
              echo "[WARN] DC 실행 경고/오류 발생(계속 진행)" | tee -a "$LOGFILE"
            fi
            [ -f "$PKG_DIR/dc/dependency-check-report.json" ] && mv -f "$PKG_DIR/dc/dependency-check-report.json" "$PKG_DIR/dc/dc_report.json"
            [ -f "$PKG_DIR/dc/dependency-check-report.html" ] && mv -f "$PKG_DIR/dc/dependency-check-report.html" "$PKG_DIR/dc/dc_report.html"
          fi
          [ -f "$PKG_DIR/dc/dc_report.json" ] || echo "{}" > "$PKG_DIR/dc/dc_report.json"
          [ -f "$PKG_DIR/dc/dc_report.html" ] || echo "<html><body>no report</body></html>" > "$PKG_DIR/dc/dc_report.html"
          cp -f "$PKG_DIR/dc/dc_report.json" "$EXPORT_DIR/json/dc_report.json" || true
          cp -f "$PKG_DIR/dc/dc_report.html" "$EXPORT_DIR/html/dc_report.html" || true
          echo "[ECHO] DC 실행/표준화/복사 완료" | tee -a "$LOGFILE"

      # -----------------------------
      # 공개 블랙리스트 수집 (fail-safe)
      # -----------------------------
      - name: 🌐 Spamhaus (DROP/EDROP) — fail-safe
        if: env.ENABLE_SPAMHAUS == 'true'
        run: |
          set -u
          echo "[ECHO] Spamhaus 수집 시작" | tee -a "$LOGFILE"
          mkdir -p "$NET_DIR/spamhaus" "$NET_DIR/all"
          DROP="$NET_DIR/spamhaus/drop.txt"
          EDROP="$NET_DIR/spamhaus/edrop.txt"
          OUT="$NET_DIR/all/ip_blacklist_spamhaus.txt"
          (curl -fsSL https://www.spamhaus.org/drop/drop.txt  | grep -v '^;' > "$DROP"  ) || { echo "[WARN] drop 실패 → 빈 파일"; > "$DROP"; }
          (curl -fsSL https://www.spamhaus.org/drop/edrop.txt | grep -v '^;' > "$EDROP" ) || { echo "[WARN] edrop 실패 → 빈 파일"; > "$EDROP"; }
          cat "$DROP" "$EDROP" 2>/dev/null | sort -u > "$OUT" || true
          CNT=$( [ -f "$OUT" ] && wc -l < "$OUT" || echo 0 )
          echo "[ECHO] Spamhaus IP 수: ${CNT}" | tee -a "$LOGFILE"
          echo "[ECHO] Spamhaus 수집 종료" | tee -a "$LOGFILE"

      - name: 🌐 Emerging Threats (Compromised IPs) — fail-safe
        if: env.ENABLE_EMERGING_THREATS == 'true'
        run: |
          set -u
          echo "[ECHO] Emerging Threats 수집 시작" | tee -a "$LOGFILE"
          mkdir -p "$NET_DIR/et" "$NET_DIR/all"
          ET="$NET_DIR/et/compromised-ips.txt"
          OUT="$NET_DIR/all/ip_blacklist_et.txt"
          (curl -fsSL https://rules.emergingthreats.net/blockrules/compromised-ips.txt > "$ET") || { echo "[WARN] ET 다운로드 실패 → 빈 파일"; > "$ET"; }
          sort -u "$ET" > "$OUT" || true
          CNT=$( [ -f "$OUT" ] && wc -l < "$OUT" || echo 0 )
          echo "[ECHO] ET IP 수: ${CNT}" | tee -a "$LOGFILE"
          echo "[ECHO] Emerging Threats 수집 종료" | tee -a "$LOGFILE"

      # -----------------------------
      # 종속성/코드 점검 (무료만)
      # -----------------------------
      - name: 🐍 pip-audit (auto) — fail-safe
        run: |
          set -e
          echo "[ECHO] pip-audit 사전 점검" | tee -a "$LOGFILE"
          if ls requirements*.txt Pipfile.lock poetry.lock 2>/dev/null | grep -q .; then
            (pip-audit -f json || true) | tee "$PKG_DIR/python/pip_audit.json" >/dev/null
          else
            echo "[ECHO] Python 종속성 파일이 없어 pip-audit 건너뜀" | tee -a "$LOGFILE"
            echo "{}" > "$PKG_DIR/python/pip_audit.json"
          fi

      - name: 🛡 safety (충돌옵션 제거) — fail-safe
        run: |
          set -e
          echo "[ECHO] safety 실행" | tee -a "$LOGFILE"
          if ls requirements*.txt Pipfile.lock poetry.lock 2>/dev/null | grep -q .; then
            safety check --json > "$PKG_DIR/python/safety.json" || { echo "{}" > "$PKG_DIR/python/safety.json"; }
          else
            echo "{}" > "$PKG_DIR/python/safety.json"
          fi

      - name: 📦 npm audit (auto) — fail-safe
        run: |
          set -e
          echo "[ECHO] npm audit 사전 점검" | tee -a "$LOGFILE"
          if ls package-lock.json yarn.lock pnpm-lock.yaml 2>/dev/null | grep -q .; then
            (npm audit --json || true) | tee "$PKG_DIR/npm/npm_audit.json" >/dev/null
          else
            echo "[ECHO] JS 락파일이 없어 npm audit 건너뜀" | tee -a "$LOGFILE"
            echo "{}" > "$PKG_DIR/npm/npm_audit.json"
          fi

      - name: 🔍 Semgrep (p/ci, 로컬) — fail-safe
        if: env.ENABLE_SEMGREP == 'true'
        run: |
          set -e
          echo "[ECHO] Semgrep 실행 (p/ci, 로컬 전용)" | tee -a "$LOGFILE"
          semgrep ci --config p/ci --json --no-rewrite-rule-ids > "$CODE_DIR/semgrep/semgrep.json" || {
            echo "[WARN] Semgrep 실패 → 빈 결과 생성" | tee -a "$LOGFILE"
            echo '{"results":[]}' > "$CODE_DIR/semgrep/semgrep.json"
          }
          echo "[ECHO] Semgrep 결과 생성" | tee -a "$LOGFILE"

      # -----------------------------
      # 산출물 동기화(SNAPSHOT/LATEST/EXPORT)
      # -----------------------------
      - name: 🗃️ Copy artifacts into snapshot & latest/export
        run: |
          set -e
          echo "[ECHO] 산출물 스냅샷/익스포트 복사" | tee -a "$LOGFILE"
          # 네트워크 리스트
          cp -f "$NET_DIR/all/"*.txt "$SNAP_DIR/networks/" 2>/dev/null || true
          cp -f "$NET_DIR/all/"*.txt "$LATEST_DIR/" 2>/dev/null || true
          cp -f "$NET_DIR/all/ip_blacklist_spamhaus.txt" "$EXPORT_DIR/txt/spamhaus.txt" 2>/dev/null || echo "" > "$EXPORT_DIR/txt/spamhaus.txt"
          cp -f "$NET_DIR/all/ip_blacklist_et.txt" "$EXPORT_DIR/txt/et.txt" 2>/dev/null || echo "" > "$EXPORT_DIR/txt/et.txt"
          # 패키지/코드 리포트
          cp -f "$PKG_DIR/python/"*.json "$SNAP_DIR/packages/" 2>/dev/null || true
          cp -f "$PKG_DIR/npm/"*.json "$SNAP_DIR/packages/" 2>/dev/null || true
          cp -f "$PKG_DIR/dc/"*.{json,html} "$SNAP_DIR/packages/" 2>/dev/null || true
          cp -f "$CODE_DIR/semgrep/semgrep.json" "$SNAP_DIR/code/semgrep.json" 2>/dev/null || true
          # export 표준
          cp -f "$PKG_DIR/python/pip_audit.json" "$EXPORT_DIR/json/pip_audit.json" 2>/dev/null || echo "{}" > "$EXPORT_DIR/json/pip_audit.json"
          cp -f "$PKG_DIR/python/safety.json" "$EXPORT_DIR/json/safety.json" 2>/dev/null || echo "{}" > "$EXPORT_DIR/json/safety.json"
          cp -f "$PKG_DIR/npm/npm_audit.json" "$EXPORT_DIR/json/npm_audit.json" 2>/dev/null || echo "{}" > "$EXPORT_DIR/json/npm_audit.json"
          cp -f "$PKG_DIR/dc/dc_report.json" "$EXPORT_DIR/json/dc_report.json" 2>/dev/null || echo "{}" > "$EXPORT_DIR/json/dc_report.json"
          cp -f "$PKG_DIR/dc/dc_report.html" "$EXPORT_DIR/html/dc_report.html" 2>/dev/null || echo "<html><body>no report</body></html>" > "$EXPORT_DIR/html/dc_report.html"
          echo "[ECHO] 산출물 복사 완료" | tee -a "$LOGFILE"

      # -----------------------------
      # 요약 파일(JSON/MD) — 안전 구현
      # -----------------------------
      - name: 🧾 요약 파일 생성 (jq 사용 · 안전한 JSON/MD · echo 보장)
        run: |
          set -euo pipefail
          shopt -s nullglob
          echo "[ECHO] 요약 파일 생성 시작" | tee -a "$LOGFILE"
          SUMMARY_JSON="$SUMMARY_DIR/summary_${RUN_DATE_UTC}.json"
          SUMMARY_MD="$SUMMARY_DIR/summary_${RUN_DATE_UTC}.md"
          SPAM_FILE="$NET_DIR/all/ip_blacklist_spamhaus.txt"
          ET_FILE="$NET_DIR/all/ip_blacklist_et.txt"
          if [ -f "$SPAM_FILE" ]; then SPAM_CT="$(wc -l < "$SPAM_FILE" | tr -d '[:space:]')"; else SPAM_CT="0"; fi
          if [ -f "$ET_FILE" ]; then ET_CT="$(wc -l < "$ET_FILE" | tr -d '[:space:]')"; else ET_CT="0"; fi
          jq -n --arg run "$RUN_DATE_UTC" --argjson spam "${SPAM_CT:-0}" --argjson et "${ET_CT:-0}" \
            '{ run_at_utc: $run, spamhaus_count: $spam, et_count: $et, files: {} }' > "$SUMMARY_JSON"
          mapfile -t FILES < <(find "$EXPORT_DIR" -type f -print 2>/dev/null; [ -f "$PKG_DIR/dc/dc_report.html" ] && echo "$PKG_DIR/dc/dc_report.html" || true)
          for f in "${FILES[@]}"; do
            rel="${f#./}"; sz="$(wc -c < "$f" | tr -d '[:space:]' || echo 0)"
            tmp="${SUMMARY_JSON}.tmp"
            jq --arg k "$rel" --argjson v "${sz:-0}" '.files[$k] = $v' "$SUMMARY_JSON" > "$tmp" && mv "$tmp" "$SUMMARY_JSON"
          done
          {
            echo "# Blacklist Summary (${RUN_DATE_UTC})"
            echo
            echo "- Spamhaus: ${SPAM_CT} IPs"
            echo "- EmergingThreats: ${ET_CT} IPs"
            echo
            echo "## Files (bytes)"
            for f in "${FILES[@]}"; do
              rel="${f#./}"; sz="$(wc -c < "$f" | tr -d '[:space:]' || echo 0)"
              echo "- ${rel}: ${sz}"
            done
          } > "$SUMMARY_MD"
          echo "[ECHO] ===== 결과 요약 ====="
          for f in "${FILES[@]}"; do rel="${f#./}"; sz="$(wc -c < "$f" | tr -d '[:space:]' || echo 0)"; echo "[ECHO] 파일: ${rel}, 크기(bytes): ${sz}"; done
          echo "[ECHO] ====================="
          [ -s "$SUMMARY_JSON" ] || echo '{"run_at_utc":"'${RUN_DATE_UTC}'","spamhaus_count":0,"et_count":0,"files":{}}' > "$SUMMARY_JSON"
          [ -s "$SUMMARY_MD" ] || { echo "# Blacklist Summary (${RUN_DATE_UTC})"; echo; echo "- Spamhaus: 0 IPs"; echo "- EmergingThreats: 0 IPs"; } > "$SUMMARY_MD"
          echo "[ECHO] 요약 파일 생성 완료 → $SUMMARY_JSON, $SUMMARY_MD" | tee -a "$LOGFILE"

      # -----------------------------
      # 변경 시 커밋/PR
      # -----------------------------
      - name: 🧪 변경사항 검사
        run: |
          set -e
          echo "[ECHO] 변경사항 검사 시작" | tee -a "$LOGFILE"
          git status --porcelain
          echo "[ECHO] 변경사항 검사 종료" | tee -a "$LOGFILE"

      - name: 💾 Commit changes
        run: |
          set -e
          echo "[ECHO] 커밋 준비" | tee -a "$LOGFILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$BLACKLIST_DIR" "$REPORT_DIR" || true
          if git diff --cached --quiet; then
            echo "[ECHO] 커밋할 변경 없음" | tee -a "$LOGFILE"
          else
            git commit -m "chore(blacklist): ${RUN_DATE_UTC} auto snapshot/export (echo mass dirs, DC, feeds)"
            echo "[ECHO] 커밋 완료" | tee -a "$LOGFILE"
          fi

      - name: 🔀 Create PR (if needed)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(blacklist): ${RUN_DATE_UTC} auto snapshot/export"
          title: "Blacklist auto-update ${RUN_DATE_UTC}"
          body: "자동 생성된 블랙리스트/리포트 업데이트입니다."
          branch: "chore/blacklist-${{ env.RUN_DATE_UTC }}"
          delete-branch: true
