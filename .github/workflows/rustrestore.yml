name: "🦀 Rust CI — no-skip, POSIX-safe, echo logs, self-heal, artifacts"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rustci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"

jobs:
  rust-ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
        toolchain: [stable]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 Prepare echo log dirs (always exist)
        shell: bash
        run: |
          set -euo pipefail
          for d in .github/rust_logs .github/security_logs artifacts; do
            echo "[ECHO] mkdir -p $d"; mkdir -p "$d"
            echo "[ECHO] chmod 755 $d"; chmod 755 "$d" || true
          done
          echo "[ECHO] seed log" | tee .github/rust_logs/seed.log
          echo "placeholder" > artifacts/.keep

      - name: 🧰 System deps (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] apt-get update/install"
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cmake clang llvm curl git ca-certificates tar

      - name: 🦀 Install Rust (${{ matrix.toolchain }} + clippy/rustfmt)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy,rustfmt

      # Detect Cargo.toml / 없으면 샘플 crate 자동 생성(자가복구)
      - name: 🔎 Detect crates (self-heal if none) — POSIX-safe
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          echo "[ECHO] Cargo.toml scan start" | tee -a .github/rust_logs/summary_detect.log

          FOUND_FILE=".found_cargo_toml.txt"
          : > "$FOUND_FILE"
          find . -type f -name Cargo.toml \
            -not -path "*/target/*" -not -path "*/node_modules/*" \
            | sort > "$FOUND_FILE" || true

          if [ ! -s "$FOUND_FILE" ]; then
            echo "[WARN] No Cargo.toml → create sample crate 'rust-example'" | tee -a .github/rust_logs/summary_detect.log
            rm -rf rust-example || true
            cargo new --bin rust-example
            mkdir -p rust-example/src
            printf 'fn main() {\n    println!("hello from rust-example");\n}\n' > rust-example/src/main.rs
            printf '%s\n' "./rust-example/Cargo.toml" > "$FOUND_FILE"
          fi

          : > .wslist.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            dirname "$f"
          done < "$FOUND_FILE" | sort -u > .wslist.txt

          echo "count=$(wc -l < .wslist.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          {
            echo 'list<<__WS__'
            cat .wslist.txt
            echo '__WS__'
          } >> "$GITHUB_OUTPUT"

          echo "[ECHO] detected crates:" | tee -a .github/rust_logs/summary_detect.log
          awk '{printf("%4d  %s\n", NR, $0)}' .wslist.txt | tee -a .github/rust_logs/summary_detect.log

      - name: 🔐 Ensure lockfiles & metadata (per crate)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            echo "[ECHO] lockfile/metadata: $dir" | tee -a .github/rust_logs/summary_detect.log
            cd "$dir"
            cargo generate-lockfile || true
            cargo metadata --format-version 1 --no-deps >/dev/null
            cd - >/dev/null
          done < .wslist.txt

      - name: 🔎 Show tool versions
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv  2>&1 | tee -a .github/rust_logs/versions.log
          cargo -V   2>&1 | tee -a .github/rust_logs/versions.log
          echo "OS=${{ matrix.os }}, toolchain=${{ matrix.toolchain }}" | tee -a .github/rust_logs/versions.log

      - name: 🚀 Full pipeline (fmt, clippy, test, build, doc) for all crates
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0
          run_step () {
            dir="$1"; shift
            name="$1"; shift
            echo "[RUN] $name @ $dir"
            if (cd "$dir" && "$@"); then
              echo "[OK]  $name @ $dir"
            else
              echo "[ERR] $name @ $dir" >&2
              FAIL=1
            fi
          }

          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            safe="$(echo "$dir" | tr '/.' '_')"
            echo "==================== CRATE: $dir ====================" \
              | tee -a ".github/rust_logs/summary_${{ matrix.os }}_${{ matrix.toolchain }}.log"

            run_step "$dir" "fmt"    bash -lc "cargo fmt --all --check" \
              2>&1 | tee ".github/rust_logs/${safe}_${{ matrix.os }}_${{ matrix.toolchain }}_fmt.log"
            run_step "$dir" "clippy" bash -lc "cargo clippy --all-targets --all-features -- -D warnings" \
              2>&1 | tee ".github/rust_logs/${safe}_${{ matrix.os }}_${{ matrix.toolchain }}_clippy.log"
            run_step "$dir" "test"   bash -lc "cargo test --all-features --verbose" \
              2>&1 | tee ".github/rust_logs/${safe}_${{ matrix.os }}_${{ matrix.toolchain }}_test.log"
            run_step "$dir" "build"  bash -lc "cargo build --release --verbose" \
              2>&1 | tee ".github/rust_logs/${safe}_${{ matrix.os }}_${{ matrix.toolchain }}_build.log"
            run_step "$dir" "doc"    bash -lc "cargo doc --no-deps" \
              2>&1 | tee ".github/rust_logs/${safe}_${{ matrix.os }}_${{ matrix.toolchain }}_doc.log"

            # ── 아티팩트 수집 (OS별 안전 처리) ──
            if [ -d "$dir/target/release" ]; then
              echo "[ECHO] collect artifacts from $dir/target/release" \
                | tee -a ".github/rust_logs/summary_${{ matrix.os }}_${{ matrix.toolchain }}.log"

              case "${{ matrix.os }}" in
                ubuntu-latest|macos-14)
                  find "$dir/target/release" -maxdepth 1 -type f 2>/dev/null \
                    | while IFS= read -r f; do
                        [ -f "$f" ] && [ -x "$f" ] && cp "$f" "artifacts/$(basename "$f")_${{ matrix.os }}_${{ matrix.toolchain }}" || true
                      done
                  ;;
                windows-2022)
                  find "$dir/target/release" -maxdepth 1 -type f -name '*.exe' 2>/dev/null \
                    | while IFS= read -r f; do
                        cp "$f" "artifacts/$(basename "$f")_${{ matrix.os }}_${{ matrix.toolchain }}" || true
                      done
                  ;;
              esac

              # 아무것도 복사하지 못했으면 tar.gz 보장
              if ! ls artifacts 2>/dev/null | grep -q "${{ matrix.os }}_${{ matrix.toolchain }}"; then
                tgz="artifacts/$(echo "$safe" | sed 's/^_//')_${{ matrix.os }}_${{ matrix.toolchain }}_release.tgz"
                (cd "$dir/target/release" && tar -czf "../../$tgz" .) || true
              fi
            fi
          done < .wslist.txt

          echo "FAIL=$FAIL" | tee -a ".github/rust_logs/summary_${{ matrix.os }}_${{ matrix.toolchain }}.log"
          exit $FAIL

      # 업로드 직전에 artifacts를 한 번 더 보장(어떤 경우에도 경로 존재)
      - name: 🔒 Ensure artifacts dir for upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          [ -e artifacts/.keep ] || echo "placeholder" > artifacts/.keep

      - name: 📦 Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ matrix.toolchain }}-${{ github.run_id }}
          path: .github/rust_logs/
          if-no-files-found: error   # 항상 존재

      - name: 📦 Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.toolchain }}-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error   # .keep 또는 tgz로 항상 존재
