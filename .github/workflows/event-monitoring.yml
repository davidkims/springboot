name: 📦 전문가 분산/메일서버/ELK/DB/도커/암호화/스냅샷 통합 자동화

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  all-in-one:
    runs-on: ubuntu-latest

    steps:
      # 0. 디렉토리/초기화/백업
      - name: 📦 [백업/로그/분산 디렉토리 초기화]
        run: |
          for d in .github/package-backup .github/email_logs .github/email_echo .github/email_accounts collector-data elk-data docker-data encrypted-data snapshot runs-details jobs-details steps-details collector-tmp remake-batch remake-batch/sample remake-batch/logs; do
            echo "echo 'mkdir -p $d'"
            mkdir -p $d
          done
          find .github/package-backup -type f -delete
          echo "[OK] .github/package-backup 초기화" > .github/package-backup/echo_init.txt

      # 1. 가상 메일계정
      - name: 📧 [메일 가상계정/비번 echo]
        run: |
          EMAIL_USER="testuser"
          EMAIL_DOMAIN="example.com"
          EMAIL_ADDR="$EMAIL_USER@$EMAIL_DOMAIN"
          EMAIL_PASS="$(date +%s | sha256sum | head -c 12)"
          echo "$EMAIL_ADDR:$EMAIL_PASS" > .github/email_accounts/test_account.txt
          echo "[가상메일 계정] $EMAIL_ADDR / PW: $EMAIL_PASS" > .github/email_accounts/echo_account.txt

      # 2. 메일서버 방화벽(권한)
      - name: 🔥 [메일서버 방화벽 설정/echo]
        run: |
          for port in 25 465 587 993 995 110 143; do
            echo "[방화벽: 포트 허용] $port" | tee -a .github/email_echo/echo_firewall.txt
            sudo ufw allow $port/tcp 2>&1 | tee -a .github/email_echo/echo_firewall.txt || echo "[WARN] ufw $port 실패" >> .github/email_echo/echo_firewall.txt
          done
          sudo ufw reload 2>&1 | tee -a .github/email_echo/echo_firewall.txt || true
          echo "[방화벽 적용 완료]" | tee -a .github/email_echo/echo_firewall.txt

      # 3. 메일서버 8종 설치/테스트/echo
      - name: 📮 [메일서버 8종 설치/테스트/echo]
        run: |
          set -e
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postfix mailutils
          sudo systemctl enable postfix || true
          sudo systemctl start postfix || true
          echo "Test mail from Postfix" | mail -s "Postfix test" root && echo "[OK] Postfix 메일 전송 완료" || echo "[WARN] Postfix 메일 전송 오류"
          sudo apt-get install -y exim4 mailutils
          sudo systemctl enable exim4 || true
          sudo systemctl start exim4 || true
          echo "Test mail from Exim" | mail -s "Exim test" root && echo "[OK] Exim 메일 전송 완료" || echo "[WARN] Exim 메일 전송 오류"
          sudo apt-get install -y sendmail mailutils
          sudo systemctl enable sendmail || true
          sudo systemctl start sendmail || true
          echo "Test mail from Sendmail" | mail -s "Sendmail test" root && echo "[OK] Sendmail 메일 전송 완료" || echo "[WARN] Sendmail 메일 전송 오류"
          sudo apt-get install -y opensmtpd mailutils
          sudo systemctl enable smtpd || true
          sudo systemctl start smtpd || true
          echo "Test mail from OpenSMTPD" | mail -s "OpenSMTPD test" root && echo "[OK] OpenSMTPD 메일 전송 완료" || echo "[WARN] OpenSMTPD 메일 전송 오류"
          sudo apt-get install -y courier-mta courier-imap courier-pop
          sudo systemctl enable courier-mta || true
          sudo systemctl start courier-mta || true
          sudo apt-get install -y npm
          sudo npm install -g Haraka
          mkdir -p haraka-test
          cd haraka-test && haraka -i . && nohup haraka -c . > ../.github/email_logs/haraka_run.log 2>&1 &
          cd ..

      # 4. Mailu compose.yaml (echo 변환, 누락 없이)
      - name: 📦 [Mailu Docker compose.yaml/echo]
        run: |
          echo "echo '[Mailu compose.yaml/echo]'"
          mkdir -p .github/email_logs/mailu
          echo "echo \"version: '2.4'\"" > .github/email_logs/mailu/compose.yaml
          echo "version: '2.4'" >> .github/email_logs/mailu/compose.yaml
          echo "echo 'services:'" >> .github/email_logs/mailu/compose.yaml
          echo "services:" >> .github/email_logs/mailu/compose.yaml
          echo "echo '  mail:'" >> .github/email_logs/mailu/compose.yaml
          echo "  mail:" >> .github/email_logs/mailu/compose.yaml
          echo "echo '    image: mailu/mailu:1.9'" >> .github/email_logs/mailu/compose.yaml
          echo "    image: mailu/mailu:1.9" >> .github/email_logs/mailu/compose.yaml
          echo "echo '    env_file: mailu.env'" >> .github/email_logs/mailu/compose.yaml
          echo "    env_file: mailu.env" >> .github/email_logs/mailu/compose.yaml
          echo "echo '    ports:'" >> .github/email_logs/mailu/compose.yaml
          echo "    ports:" >> .github/email_logs/mailu/compose.yaml
          echo "echo '      - \"25:25\"'" >> .github/email_logs/mailu/compose.yaml
          echo "      - \"25:25\"" >> .github/email_logs/mailu/compose.yaml
          echo "echo '      - \"465:465\"'" >> .github/email_logs/mailu/compose.yaml
          echo "      - \"465:465\"" >> .github/email_logs/mailu/compose.yaml
          echo "echo '      - \"587:587\"'" >> .github/email_logs/mailu/compose.yaml
          echo "      - \"587:587\"" >> .github/email_logs/mailu/compose.yaml

      # 5. Mailcow compose.yaml (echo 변환, 누락 없이)
      - name: 📦 [Mailcow Docker compose.yaml/echo]
        run: |
          echo "echo '[Mailcow compose.yaml/echo]'"
          mkdir -p .github/email_logs/mailcow
          echo "echo \"version: '2.4'\"" > .github/email_logs/mailcow/docker-compose.yml
          echo "version: '2.4'" >> .github/email_logs/mailcow/docker-compose.yml
          echo "echo 'services:'" >> .github/email_logs/mailcow/docker-compose.yml
          echo "services:" >> .github/email_logs/mailcow/docker-compose.yml
          echo "echo '  mailcow:'" >> .github/email_logs/mailcow/docker-compose.yml
          echo "  mailcow:" >> .github/email_logs/mailcow/docker-compose.yml
          echo "echo '    image: mailcow/mailcow:latest'" >> .github/email_logs/mailcow/docker-compose.yml
          echo "    image: mailcow/mailcow:latest" >> .github/email_logs/mailcow/docker-compose.yml
          echo "echo '    ports:'" >> .github/email_logs/mailcow/docker-compose.yml
          echo "    ports:" >> .github/email_logs/mailcow/docker-compose.yml
          echo "echo '      - \"25:25\"'" >> .github/email_logs/mailcow/docker-compose.yml
          echo "      - \"25:25\"" >> .github/email_logs/mailcow/docker-compose.yml

      # 6. Haraka, Courier echo 등 나머지 메일서버도 echo, 로깅 유지
      - name: 🔐 [가상 패스워드/권한 echo]
        run: |
          EMAIL_PASS="$(cat .github/email_accounts/test_account.txt | cut -d: -f2)"
          echo "[패스워드] $EMAIL_PASS" > .github/email_accounts/echo_password.txt
          ls -al .github/email_accounts > .github/email_accounts/echo_accounts_ls.txt

      # 7. 이하 분산/샘플/암호화/리메이크/스냅샷/ELK/DB/도커/전체 업로드/요약 예시 (전과 동일)
      - name: 📂 [분산 디렉토리/샘플/스냅샷 생성]
        run: |
          dirs="collector-data elk-data docker-data encrypted-data snapshot runs-details jobs-details steps-details collector-tmp remake-batch remake-batch/sample remake-batch/logs"
          echo $dirs | xargs -n 1 -P 8 bash -c 'mkdir -p "$0"; echo "[생성] $0" > "$0/echo_dir.txt"'
          tree -a > snapshot/dirs_tree_init.txt || ls -lR > snapshot/dirs_tree_init.txt

      - name: 🔐 [데이터 생성+암호화] 병렬화
        run: |
          (
            echo '기존 데이터 샘플 1' > collector-data/old-data-1.txt
            echo '기존 데이터 샘플 2' > collector-data/old-data-2.txt
            sha256sum collector-data/old-data-1.txt > collector-data/old-data-1-sha256.txt
            sha256sum collector-data/old-data-2.txt > collector-data/old-data-2-sha256.txt
            cp collector-data/old-data-1.txt encrypted-data/old-data-1.txt
            cp collector-data/old-data-2.txt encrypted-data/old-data-2.txt
            openssl enc -aes-256-cbc -pbkdf2 -salt -in encrypted-data/old-data-1.txt -out encrypted-data/old-data-1.txt.enc -k oldpassword &
            openssl enc -aes-256-cbc -pbkdf2 -salt -in encrypted-data/old-data-2.txt -out encrypted-data/old-data-2.txt.enc -k oldpassword &
            wait
            rm -f encrypted-data/old-data-1.txt encrypted-data/old-data-2.txt
            sha256sum encrypted-data/old-data-1.txt.enc > encrypted-data/old-data-1-sha256.txt
            sha256sum encrypted-data/old-data-2.txt.enc > encrypted-data/old-data-2-sha256.txt
          ) &
          (
            echo '신규 데이터 샘플 1' > collector-data/new-data-1.txt
            echo '신규 데이터 샘플 2' > collector-data/new-data-2.txt
            sha256sum collector-data/new-data-1.txt > collector-data/new-data-1-sha256.txt
            sha256sum collector-data/new-data-2.txt > collector-data/new-data-2-sha256.txt
            cp collector-data/new-data-1.txt encrypted-data/new-data-1.txt
            cp collector-data/new-data-2.txt encrypted-data/new-data-2.txt
            openssl enc -aes-256-cbc -pbkdf2 -salt -in encrypted-data/new-data-1.txt -out encrypted-data/new-data-1.txt.enc -k newpassword &
            openssl enc -aes-256-cbc -pbkdf2 -salt -in encrypted-data/new-data-2.txt -out encrypted-data/new-data-2.txt.enc -k newpassword &
            wait
            rm -f encrypted-data/new-data-1.txt encrypted-data/new-data-2.txt
            sha256sum encrypted-data/new-data-1.txt.enc > encrypted-data/new-data-1-sha256.txt
            sha256sum encrypted-data/new-data-2.txt.enc > encrypted-data/new-data-2-sha256.txt
          ) &
          wait
          echo "[OK] 기존/신규 데이터 암호화 완료" > encrypted-data/echo_encrypt.txt

      - name: 🧹 [리메이크 배치/로그/샘플]
        run: |
          seq 1 10 | xargs -I{} -P 5 bash -c 'echo "샘플 데이터 {} - $(date +%Y%m%d%H%M%S)" > remake-batch/sample/sample_data_{}.txt'
          seq 1 5 | xargs -I{} -P 5 bash -c 'echo "로그 기록 {} - $(date +%Y-%m-%dT%H:%M:%S)" > remake-batch/logs/log_{}.log'
          echo "[샘플/로그 데이터 생성 완료]" > remake-batch/batch_done.txt

      - name: 🐘 [TimescaleDB/Postgres 15 설치(GPG 최신화)]
        run: |
          wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor | sudo tee /usr/share/keyrings/postgresql.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-15 postgresql-server-dev-15
          wget --quiet -O - https://packagecloud.io/timescale/timescaledb/gpgkey | gpg --dearmor | sudo tee /usr/share/keyrings/timescale-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/timescale-archive-keyring.gpg] https://packagecloud.io/timescale/timescaledb/ubuntu/ $(lsb_release -c -s) main" | sudo tee /etc/apt/sources.list.d/timescaledb.list
          sudo apt-get update -y
          sudo apt-get install -y timescaledb-2-postgresql-15 timescaledb-2-loader-postgresql-15 timescaledb-tools timescaledb-toolkit-postgresql-15
          echo '샘플 TimescaleDB 데이터' > collector-data/sample-tsdb.txt
          sha256sum collector-data/sample-tsdb.txt > collector-data/sample-tsdb-sha256.txt

      - name: 🔎 [ELK Stack 설치]
        run: |
          wget -qO - https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor | sudo tee /usr/share/keyrings/elasticsearch.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/elasticsearch.gpg] https://artifacts.elastic.co/packages/7.x/apt stable main" | sudo tee /etc/apt/sources.list.d/elastic-7.x.list
          sudo apt-get update -y
          sudo apt-get install -y elasticsearch logstash kibana
          sudo systemctl enable elasticsearch.service kibana.service logstash.service
          sudo systemctl start elasticsearch.service kibana.service logstash.service
          (elasticsearch --version > elk-data/elasticsearch_version.txt 2>&1 || echo "elasticsearch not found" >> elk-data/elasticsearch_version.txt)
          (kibana --version > elk-data/kibana_version.txt 2>&1 || echo "kibana not found" >> elk-data/kibana_version.txt)
          (logstash --version > elk-data/logstash_version.txt 2>&1 || echo "logstash not found" >> elk-data/logstash_version.txt)
          echo '샘플 ELK 로그' > elk-data/sample-elk-log.txt
          sha256sum elk-data/sample-elk-log.txt > elk-data/sample-elk-log-sha256.txt

      - name: 🐳 [Docker 설치/이미지]
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sh get-docker.sh
          sudo systemctl enable docker
          sudo systemctl start docker
          sudo docker --version > docker-data/docker_version.txt
          IMAGE_NAME="elk-timescale-test"
          IMAGE_TAG="latest"
          echo -e 'FROM ubuntu:22.04\nRUN apt-get update && apt-get install -y curl' > docker-data/Dockerfile
          sudo docker build -t $IMAGE_NAME:$IMAGE_TAG docker-data
          sudo docker images > docker-data/docker_images.txt
          sudo docker image inspect $IMAGE_NAME:$IMAGE_TAG > docker-data/docker_image_inspect_${IMAGE_NAME}.json
          IMG_TAR=docker-data/${IMAGE_NAME}_${IMAGE_TAG}_$(date +%Y%m%d%H%M%S).tar
          sudo docker save -o $IMG_TAR $IMAGE_NAME:$IMAGE_TAG
          sudo chmod 644 "$IMG_TAR" || true

      - name: 📦 [전체 업로드]
        uses: actions/upload-artifact@v4
        with:
          name: all-artifacts-distributed-batch-encrypted-with-echo
          path: |
            collector-data/
            elk-data/
            docker-data/
            encrypted-data/
            snapshot/
            remake-batch/
            runs-details/
            jobs-details/
            steps-details/
            collector-tmp/
            .github/package-backup/
            .github/email_logs/
            .github/email_echo/
            .github/email_accounts/

      - name: 📊 [요약] 최신 데이터 현황
        run: |
          echo "▶️ [collector-data/*]"; ls -lh collector-data | head -20 || true
          echo "▶️ [encrypted-data]"; ls -lh encrypted-data | grep '\.enc' || echo '[⚠️] 없음'
          echo "▶️ [remake-batch/sample]"; ls -l remake-batch/sample | grep sample_data_ || echo '[⚠️] 없음'
          echo "▶️ [remake-batch/logs]"; ls -l remake-batch/logs | grep log_ || echo '[⚠️] 없음'
          echo "▶️ [docker-data/*]"; ls -lh docker-data | head -20 || true
