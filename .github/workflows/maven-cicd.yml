name: "🏦 Teradata + DW + Omni EchoOps v8.5.0 (Multi-Service+DB+Release+Slots+NIC+Kernel+Storage+GHCR+Archives)"

on:
  workflow_dispatch:
    inputs:
      generate_rows:
        description: "샘플 거래 데이터 생성 건수"
        required: true
        default: "1000"
      run_network:
        description: "Nginx 리버스프록시 실행 (true/false)"
        required: true
        default: "true"
      run_omni:
        description: "옴니채널 서버(FastAPI) 실행 (true/false)"
        required: true
        default: "true"
      run_analytics:
        description: "애널리틱스 서비스 실행 (true/false)"
        required: true
        default: "true"
      run_notification:
        description: "알림 서비스 실행 (true/false)"
        required: true
        default: "true"
      run_audit:
        description: "감사 서비스 실행 (true/false)"
        required: true
        default: "true"
      run_scheduler:
        description: "스케줄러 서비스 실행 (true/false)"
        required: true
        default: "true"
      push_images:
        description: "모든 이미지를 GHCR 푸시/서명 (true/false)"
        required: true
        default: "false"
      create_release:
        description: "GitHub Release 생성 (true/false)"
        required: true
        default: "false"
      release_type:
        description: "릴리즈 타입 (patch|minor|major)"
        required: true
        default: "patch"
      commit_changes:
        description: "에코 산출물 커밋/푸시 (true/false)"
        required: true
        default: "true"
      enable_firewall:
        description: "UFW 방화벽 활성화"
        required: true
        default: "false"
      slots_omni:
        description: "Omni 서버 슬롯 수(컨테이너 복제 개수)"
        required: true
        default: "2"
      slots_analytics:
        description: "Analytics 서버 슬롯 수"
        required: true
        default: "1"
      slots_notification:
        description: "Notification 서버 슬롯 수"
        required: true
        default: "1"
      slots_audit:
        description: "Audit 서버 슬롯 수"
        required: true
        default: "1"
      install_nic_tools:
        description: "NIC 툴/드라이버 설치 (true/false)"
        required: true
        default: "true"
      upgrade_kernel:
        description: "커널 설치/업그레이드 (true/false)"
        required: true
        default: "false"
      storage_profile:
        description: "스토리지 클라이언트 프로파일(none|minio|s3|gcs|azure)"
        required: true
        default: "none"
      database_type:
        description: "데이터베이스 타입 (postgres|mysql|oracle)"
        required: true
        default: "postgres"
      enable_monitoring:
        description: "전체 모니터링 스택 활성화 (true/false)"
        required: true
        default: "true"
      enable_security:
        description: "보안 스캔 및 강화 (true/false)"
        required: true
        default: "true"

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  packages: write
  actions: read
  id-token: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Base directories
  ECHO_TD: .github/echo_td
  ECHO_DW: .github/echo_dw
  ECHO_NET: .github/echo_net
  ECHO_OMNI: .github/echo_omni
  ECHO_ANALYTICS: .github/echo_analytics
  ECHO_NOTIFICATION: .github/echo_notification
  ECHO_AUDIT: .github/echo_audit
  ECHO_SCHEDULER: .github/echo_scheduler
  ECHO_LOG: .github/echo_logs
  ECHO_ARC: .github/echo_archives
  ECHO_RELEASE: .github/echo_releases
  ECHO_SECURITY: .github/echo_security
  
  # Registry settings
  IMAGE_REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  
  # Service images
  OMNI_IMAGE: omni-echo
  ANALYTICS_IMAGE: analytics-echo
  NOTIFICATION_IMAGE: notification-echo
  AUDIT_IMAGE: audit-echo
  SCHEDULER_IMAGE: scheduler-echo
  
  # Network
  DOCKER_NET: echo-net
  
  # Service slots
  SLOTS_OMNI: ${{ github.event.inputs.slots_omni || '2' }}
  SLOTS_ANALYTICS: ${{ github.event.inputs.slots_analytics || '1' }}
  SLOTS_NOTIFICATION: ${{ github.event.inputs.slots_notification || '1' }}
  SLOTS_AUDIT: ${{ github.event.inputs.slots_audit || '1' }}
  
  # Feature flags
  RUN_NETWORK: ${{ github.event.inputs.run_network }}
  RUN_OMNI: ${{ github.event.inputs.run_omni }}
  RUN_ANALYTICS: ${{ github.event.inputs.run_analytics }}
  RUN_NOTIFICATION: ${{ github.event.inputs.run_notification }}
  RUN_AUDIT: ${{ github.event.inputs.run_audit }}
  RUN_SCHEDULER: ${{ github.event.inputs.run_scheduler }}
  PUSH_IMAGES: ${{ github.event.inputs.push_images }}
  CREATE_RELEASE: ${{ github.event.inputs.create_release }}
  ENABLE_FIREWALL: ${{ github.event.inputs.enable_firewall }}
  INSTALL_NIC: ${{ github.event.inputs.install_nic_tools }}
  UPGRADE_KERNEL: ${{ github.event.inputs.upgrade_kernel }}
  STORAGE_PROFILE: ${{ github.event.inputs.storage_profile }}
  DATABASE_TYPE: ${{ github.event.inputs.database_type }}
  ENABLE_MONITORING: ${{ github.event.inputs.enable_monitoring }}
  ENABLE_SECURITY: ${{ github.event.inputs.enable_security }}
  
  # Data generation
  GENERATE_ROWS: ${{ github.event.inputs.generate_rows || '1000' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      release-version: ${{ steps.version.outputs.version }}
      release-tag: ${{ steps.version.outputs.tag }}
      
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧰 Enhanced Engine utils + Service dirs + Advanced helpers
        shell: bash
        run: |
          set -Eeuo pipefail
          
          # Create all service directories
          mkdir -p "${ECHO_TD}/sql/teradata" "${ECHO_TD}/sql/td_sim" \
                   "${ECHO_DW}/db" "${ECHO_DW}/queries" "${ECHO_DW}/schemas" \
                   "${ECHO_NET}/nginx" "${ECHO_NET}/logs" "${ECHO_NET}/promtail" "${ECHO_NET}/prometheus" \
                   "${ECHO_OMNI}" "${ECHO_ANALYTICS}" "${ECHO_NOTIFICATION}" "${ECHO_AUDIT}" "${ECHO_SCHEDULER}" \
                   "${ECHO_LOG}" "${ECHO_ARC}" "${ECHO_RELEASE}" "${ECHO_SECURITY}"

          cat > .github/echo_tools.sh <<'BASH'
          set -Eeuo pipefail
          
          # Enhanced utilities
          TS(){ date +%Y%m%d_%H%M%S; }
          ISO_TS(){ date -Iseconds; }
          echoe(){ echo "[ECHO] $*"; }
          warn(){ echo "[ECHO][WARN] $*" >&2; }
          faile(){ echo "[ECHO][FAIL] $*" >&2; exit 1; }
          have(){ command -v "$1" >/dev/null 2>&1; }
          
          retry(){ 
            local t="$1"; shift; local s="$1"; shift
            [ "${1:-}" = "--" ] && shift || true
            local n=0
            until "$@"; do 
              n=$((n+1))
              [ "$n" -ge "$t" ] && return 1
              sleep "$s"
            done
          }
          
          wait_http(){ 
            local url="$1"; local max="${2:-60}"; local i=0
            while true; do 
              curl -fsS --max-time 3 "$url" >/dev/null 2>&1 && return 0
              i=$((i+1)); [ "$i" -ge "$max" ] && return 1
              sleep 1
            done
          }
          
          ensure_podman(){
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends podman podman-docker slirp4netns uidmap containernetworking-plugins
            have podman || faile "podman not installed"
            podman info >/dev/null 2>&1 || true
          }
          
          resolve(){
            DOCKER_BIN="$(command -v /usr/bin/docker || true)"
            [ -z "$DOCKER_BIN" ] && DOCKER_BIN="$(command -v docker || true)"
            PODMAN_BIN="$(command -v podman || true)"
            export DOCKER_BIN PODMAN_BIN
          }
          
          ctr(){ 
            if [ "${USE_PODMAN:-0}" = "1" ]; then
              [ -n "${PODMAN_BIN:-}" ] || faile "podman NA"
              "$PODMAN_BIN" "$@"
            else
              [ -n "${DOCKER_BIN:-}" ] || faile "docker NA"
              "$DOCKER_BIN" "$@"
            fi
          }
          
          start_docker(){
            resolve
            if [ -n "${DOCKER_BIN:-}" ]; then
              set +e; "$DOCKER_BIN" info >/dev/null 2>&1; rc=$?; set -e
              if [ $rc -eq 0 ]; then
                USE_PODMAN=0; export USE_PODMAN; echo "USE_PODMAN=0" >> "$GITHUB_ENV"
                echoe "engine=docker"; return 0
              fi
              command -v service >/dev/null 2>&1 && {
                set +e; sudo -n service docker start >/dev/null 2>&1
                "$DOCKER_BIN" info >/dev/null 2>&1 && {
                  USE_PODMAN=0; export USE_PODMAN; echo "USE_PODMAN=0" >> "$GITHUB_ENV"
                  echoe "engine=docker"; return 0
                }; set -e
              }
            fi
            ensure_podman; resolve
            USE_PODMAN=1; export USE_PODMAN; echo "USE_PODMAN=1" >> "$GITHUB_ENV"
            echoe "engine=podman"
          }
          
          # Advanced service management
          create_service_schema(){
            local service="$1"
            local db_host="${2:-td-sim}"
            local port="${3:-5432}"
            
            cat > "${ECHO_DW}/schemas/${service}_schema.sql" <<SQL
          -- Enhanced ${service} service schema
          CREATE SCHEMA IF NOT EXISTS ${service};
          
          -- Service metadata
          CREATE TABLE IF NOT EXISTS ${service}.service_info(
            id SERIAL PRIMARY KEY,
            service_name VARCHAR(50) NOT NULL,
            version VARCHAR(20),
            build_time TIMESTAMP DEFAULT NOW(),
            config JSONB,
            status VARCHAR(20) DEFAULT 'active'
          );
          
          -- Service events
          CREATE TABLE IF NOT EXISTS ${service}.service_events(
            id BIGSERIAL PRIMARY KEY,
            event_time TIMESTAMP DEFAULT NOW(),
            event_type VARCHAR(50) NOT NULL,
            event_data JSONB,
            severity VARCHAR(20) DEFAULT 'info',
            source VARCHAR(100)
          );
          
          -- Service metrics
          CREATE TABLE IF NOT EXISTS ${service}.service_metrics(
            id BIGSERIAL PRIMARY KEY,
            metric_time TIMESTAMP DEFAULT NOW(),
            metric_name VARCHAR(100) NOT NULL,
            metric_value NUMERIC(20,6),
            metric_labels JSONB,
            service_instance VARCHAR(50)
          );
          
          -- Service health checks
          CREATE TABLE IF NOT EXISTS ${service}.health_checks(
            id BIGSERIAL PRIMARY KEY,
            check_time TIMESTAMP DEFAULT NOW(),
            status VARCHAR(20) NOT NULL,
            response_time_ms INTEGER,
            error_message TEXT,
            service_instance VARCHAR(50)
          );
          SQL
          
            echoe "Created schema for ${service}"
          }
          
          create_service_queries(){
            local service="$1"
            
            # Health status query
            cat > "${ECHO_DW}/queries/${service}_health.sql" <<SQL
          SELECT 
            service_instance,
            COUNT(*) as total_checks,
            COUNT(CASE WHEN status = 'healthy' THEN 1 END) as healthy_checks,
            AVG(response_time_ms) as avg_response_time,
            MAX(check_time) as last_check
          FROM ${service}.health_checks 
          WHERE check_time >= NOW() - INTERVAL '1 hour'
          GROUP BY service_instance
          ORDER BY last_check DESC;
          SQL
          
            # Performance metrics query
            cat > "${ECHO_DW}/queries/${service}_metrics.sql" <<SQL
          SELECT 
            metric_name,
            service_instance,
            AVG(metric_value) as avg_value,
            MIN(metric_value) as min_value,
            MAX(metric_value) as max_value,
            COUNT(*) as data_points
          FROM ${service}.service_metrics
          WHERE metric_time >= NOW() - INTERVAL '1 hour'
          GROUP BY metric_name, service_instance
          ORDER BY metric_name, service_instance;
          SQL
          
            # Error analysis query
            cat > "${ECHO_DW}/queries/${service}_errors.sql" <<SQL
          SELECT 
            event_type,
            severity,
            COUNT(*) as error_count,
            MAX(event_time) as last_occurrence,
            string_agg(DISTINCT source, ', ') as sources
          FROM ${service}.service_events
          WHERE severity IN ('error', 'critical', 'warning')
            AND event_time >= NOW() - INTERVAL '24 hours'
          GROUP BY event_type, severity
          ORDER BY error_count DESC;
          SQL
          
            echoe "Created queries for ${service}"
          }
          
          # Storage installers (enhanced)
          install_awscli(){ 
            if have aws; then echoe "awscli: $(aws --version 2>&1)"; return 0; fi
            set +e
            sudo apt-get update -y && sudo apt-get install -y awscli
            rc=$?; set -e
            if [ $rc -ne 0 ]; then
              echoe "awscli APT not found, installing via pip"
              python3 -m pip install --upgrade --user pip >/dev/null 2>&1 || true
              python3 -m pip install --user awscli || warn "awscli pip install failed (non-fatal)"
              if have aws; then return 0; fi
              [ -d "$HOME/.local/bin" ] && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            fi
          }
          
          install_s3fs(){ 
            have s3fs && { echoe "s3fs present"; return 0; }
            sudo apt-get update -y
            sudo apt-get install -y s3fs || sudo apt-get install -y s3fs-fuse || warn "s3fs install failed (non-fatal)"
          }
          
          install_gcsfuse(){
            if have gcsfuse; then echoe "gcsfuse present: $(gcsfuse --version 2>/dev/null || echo v2)"; return 0; fi
            . /etc/os-release
            CODENAME="${UBUNTU_CODENAME:-${VERSION_CODENAME:-}}"
            [ -z "$CODENAME" ] && CODENAME="$(lsb_release -cs 2>/dev/null || echo jammy)"
            REPO_CODENAME="$CODENAME"; [ "$CODENAME" = "noble" ] && REPO_CODENAME="jammy"
            
            sudo mkdir -p /usr/share/keyrings
            curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo tee /usr/share/keyrings/cloud.google.gpg >/dev/null
            echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt gcsfuse-${REPO_CODENAME} main" | sudo tee /etc/apt/sources.list.d/gcsfuse.list >/dev/null
            
            set +e; sudo apt-get update -y; sudo apt-get install -y fuse3 gcsfuse; rc=$?; set -e
            if [ $rc -ne 0 ]; then
              warn "gcsfuse APT install failed; trying release binary"
              tmpdir="$(mktemp -d)"
              url="https://github.com/GoogleCloudPlatform/gcsfuse/releases/latest/download/gcsfuse_linux_amd64.tar.gz"
              if curl -fsSL "$url" -o "${tmpdir}/gcsfuse.tgz"; then
                tar -xzf "${tmpdir}/gcsfuse.tgz" -C "${tmpdir}" || true
                found="$(find "${tmpdir}" -maxdepth 2 -type f -name gcsfuse | head -n1 || true)"
                [ -n "$found" ] && sudo install -m 0755 "$found" /usr/local/bin/gcsfuse || true
              fi
              have gcsfuse || warn "gcsfuse install failed (non-fatal)."
            fi
          }
          
          install_blobfuse2(){
            if have blobfuse2; then echoe "blobfuse2 present"; return 0; fi
            . /etc/os-release
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft.gpg >/dev/null
            echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/${VERSION_ID}/prod ${UBUNTU_CODENAME} main" | sudo tee /etc/apt/sources.list.d/microsoft-prod.list >/dev/null
            sudo apt-get update -y || true
            sudo apt-get install -y fuse3 blobfuse2 || warn "blobfuse2 install failed (non-fatal)"
          }
          
          # Enhanced archive with metadata
          make_archive(){ 
            local label="$1"; shift
            local ts="$(TS)"
            local outdir="${ECHO_ARC:-.github/echo_archives}"
            mkdir -p "$outdir"
            local tgt="${outdir}/${label}_${ts}.tar.gz"
            
            # Create metadata
            cat > "${outdir}/${label}_${ts}.metadata.json" <<JSON
          {
            "label": "${label}",
            "timestamp": "${ts}",
            "iso_timestamp": "$(ISO_TS)",
            "paths": [$(printf '"%s",' "$@" | sed 's/,$//')],
            "workflow": "${GITHUB_WORKFLOW:-unknown}",
            "run_id": "${GITHUB_RUN_ID:-unknown}",
            "commit": "${GITHUB_SHA:-unknown}"
          }
          JSON
          
            tar -czf "$tgt" "$@" 2>/dev/null || tar -czf "$tgt" $(printf "%q " "$@") || true
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$tgt" > "${tgt}.sha256"
            fi
            echoe "archive => ${tgt}"
          }
          
          # Release utilities
          calculate_version(){
            local type="${1:-patch}"
            local current="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")"
            
            IFS='.' read -r major minor patch <<< "$current"
            case "$type" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            
            echo "${major}.${minor}.${patch}"
          }
          
          BASH
          
          chmod +x .github/echo_tools.sh
          
          # Initial layout archive
          . .github/echo_tools.sh
          make_archive "00_enhanced_init_layout" \
            "${ECHO_TD}" "${ECHO_DW}" "${ECHO_NET}" \
            "${ECHO_OMNI}" "${ECHO_ANALYTICS}" "${ECHO_NOTIFICATION}" \
            "${ECHO_AUDIT}" "${ECHO_SCHEDULER}" "${ECHO_SECURITY}"

      - name: 🔢 Version calculation
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          
          if [ "${CREATE_RELEASE}" = "true" ]; then
            VERSION="$(calculate_version "${{ github.event.inputs.release_type }}")"
            TAG="v${VERSION}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echoe "Calculated version: ${VERSION} (tag: ${TAG})"
          else
            echo "version=" >> $GITHUB_OUTPUT
            echo "tag=" >> $GITHUB_OUTPUT
            echoe "Release creation disabled"
          fi

      - name: 🧯 Enhanced containerd guard & base packages
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          
          # Remove conflicting Docker sources
          for f in /etc/apt/sources.list.d/docker*.list /etc/apt/sources.list.d/*docker*.list; do
            [ -f "$f" ] && sudo mv -f "$f" "${f}.disabled"
          done
          
          # Pin containerd
          printf "Package: containerd.io\nPin: release *\nPin-Priority: -1\n" | sudo tee /etc/apt/preferences.d/99-docker-containerd-pin >/dev/null
          
          sudo apt-get update -y
          sudo apt-get -y remove --purge containerd.io || true
          sudo apt-get -y -f install || true
          sudo dpkg --configure -a || true
          
          # Enhanced base packages
          sudo apt-get install -y --no-install-recommends \
            sqlite3 jq python3 python3-pip curl ca-certificates ufw gawk skopeo lsb-release \
            git git-lfs unzip zip wget htop tree ncdu \
            build-essential pkg-config libssl-dev
            
          make_archive "01_enhanced_base_pkgs" "/etc/apt" "/var/lib/dpkg/status"

      - name: 🔧 Enhanced NIC installation + Kernel upgrade + Hardware inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          
          if [ "${INSTALL_NIC}" = "true" ]; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends \
              ethtool net-tools iproute2 pciutils usbutils lshw bridge-utils vlan ifenslave \
              iperf3 linux-firmware "linux-modules-extra-$(uname -r)" \
              wireless-tools wpasupplicant hostapd || true
              
            # Load network modules
            sudo modprobe 8021q || true
            sudo modprobe bonding || true
            sudo modprobe bridge || true
            
            # Hardware inventory
            lshw -json > "${ECHO_LOG}/hardware_inventory.json" 2>/dev/null || echo '{}' > "${ECHO_LOG}/hardware_inventory.json"
            lspci -v > "${ECHO_LOG}/pci_devices.txt" 2>/dev/null || true
            lsusb -v > "${ECHO_LOG}/usb_devices.txt" 2>/dev/null || true
          fi
          
          if [ "${UPGRADE_KERNEL}" = "true" ]; then
            if apt-cache policy linux-generic-hwe-24.04 | grep -q Candidate; then
              sudo apt-get install -y linux-generic-hwe-24.04
            elif apt-cache policy linux-generic-hwe-22.04 | grep -q Candidate; then
              sudo apt-get install -y linux-generic-hwe-22.04  
            else
              sudo apt-get install -y linux-image-generic linux-headers-generic
            fi
            uname -a | tee -a "${ECHO_LOG}/kernel_upgrade.log"
            echo "[KERNEL] kernel packages installed (reboot required)" | tee -a "${ECHO_LOG}/kernel_upgrade.log"
          fi
          
          make_archive "02_enhanced_nic_kernel" "${ECHO_LOG}"

      - name: 🛞 Container engine preparation + Registry setup
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          
          start_docker
          echoe "USE_PODMAN=${USE_PODMAN:-0}"
          
          # Configure registry mirrors and security
          if [ "${USE_PODMAN:-0}" = "1" ]; then
            sudo mkdir -p /etc/containers/registries.conf.d
            cat > /tmp/mirrors.conf <<EOF
          [[registry]]
          location = "docker.io"
          [[registry.mirror]]
          location = "mirror.gcr.io"
          EOF
            sudo mv /tmp/mirrors.conf /etc/containers/registries.conf.d/
          else
            sudo mkdir -p /etc/docker
            cat > /tmp/daemon.json <<EOF
          {
            "registry-mirrors": ["https://mirror.gcr.io"],
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
          EOF
            sudo mv /tmp/daemon.json /etc/docker/daemon.json
            sudo systemctl reload docker || true
          fi
          
          make_archive "03_enhanced_engine" "/etc/containers" "/etc/docker" || true

      - name: 🐍 Enhanced TD Python client + Additional DB clients
        shell: bash
        run: |
          set +e
          
          # Teradata clients
          python3 -m pip install --upgrade pip >/dev/null 2>&1
          python3 -m pip install teradatasql teradatasqlalchemy >/dev/null 2>&1 || true
          
          # Additional database clients based on DATABASE_TYPE
          case "${DATABASE_TYPE}" in
            postgres)
              python3 -m pip install psycopg2-binary sqlalchemy >/dev/null 2>&1 || true
              ;;
            mysql)  
              python3 -m pip install mysql-connector-python pymysql >/dev/null 2>&1 || true
              ;;
            oracle)
              python3 -m pip install cx_Oracle >/dev/null 2>&1 || true
              ;;
          esac
          
          # Data science and monitoring libraries
          python3 -m pip install pandas numpy scipy matplotlib seaborn >/dev/null 2>&1 || true
          python3 -m pip install prometheus-client grafana-api >/dev/null 2>&1 || true
          
          exit 0

      - name: 📝 Enhanced DDL/Query generation for all services
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          
          # Create enhanced base schema
          cat > "${ECHO_TD}/sql/td_sim/001_enhanced_schema.sql" <<'SQL'
          -- Enhanced base schema
          CREATE SCHEMA IF NOT EXISTS td;
          CREATE SCHEMA IF NOT EXISTS ledger;
          CREATE SCHEMA IF NOT EXISTS audit;
          CREATE SCHEMA IF NOT EXISTS analytics;
          CREATE SCHEMA IF NOT EXISTS notification;
          CREATE SCHEMA IF NOT EXISTS scheduler;
          
          -- Enhanced customer dimension
          CREATE TABLE IF NOT EXISTS td.dim_customer(
            customer_id BIGSERIAL PRIMARY KEY,
            name VARCHAR(100) NOT NULL,
            email VARCHAR(200),
            phone VARCHAR(20),
            address TEXT,
            city VARCHAR(50),
            country VARCHAR(50),
            customer_type VARCHAR(20) DEFAULT 'individual',
            risk_score NUMERIC(5,2) DEFAULT 0,
            created_ts TIMESTAMP DEFAULT NOW(),
            updated_ts TIMESTAMP DEFAULT NOW()
          );
          
          -- Enhanced account dimension  
          CREATE TABLE IF NOT EXISTS td.dim_account(
            account_id BIGSERIAL PRIMARY KEY,
            customer_id BIGINT NOT NULL REFERENCES td.dim_customer(customer_id),
            account_number VARCHAR(20) UNIQUE NOT NULL,
            bank_code VARCHAR(10),
            branch_code VARCHAR(10),
            currency CHAR(3) DEFAULT 'KRW',
            account_type VARCHAR(20) DEFAULT 'checking',
            balance NUMERIC(18,2) DEFAULT 0,
            status VARCHAR(20) DEFAULT 'active',
            opened_ts TIMESTAMP DEFAULT NOW(),
            closed_ts TIMESTAMP
          );
          
          -- Enhanced transaction fact table
          CREATE TABLE IF NOT EXISTS td.fact_transaction(
            txn_id BIGSERIAL PRIMARY KEY,
            account_id BIGINT NOT NULL REFERENCES td.dim_account(account_id),
            amount NUMERIC(18,2) NOT NULL,
            txn_type VARCHAR(16) CHECK (txn_type IN ('DEBIT','CREDIT')),
            txn_category VARCHAR(50),
            description TEXT,
            merchant_name VARCHAR(100),
            merchant_category VARCHAR(50),
            channel VARCHAR(20) DEFAULT 'online',
            status VARCHAR(20) DEFAULT 'completed',
            risk_score NUMERIC(5,2) DEFAULT 0,
            txn_ts TIMESTAMP DEFAULT NOW(),
            processed_ts TIMESTAMP,
            settled_ts TIMESTAMP
          );
          
          -- Audit trail table
          CREATE TABLE IF NOT EXISTS audit.audit_trail(
            audit_id BIGSERIAL PRIMARY KEY,
            table_name VARCHAR(50) NOT NULL,
            record_id BIGINT NOT NULL,
            action VARCHAR(10) NOT NULL,
            old_values JSONB,
            new_values JSONB,
            user_id VARCHAR(50),
            session_id VARCHAR(100),
            ip_address INET,
            user_agent TEXT,
            audit_ts TIMESTAMP DEFAULT NOW()
          );
          
          -- System events
          CREATE TABLE IF NOT EXISTS ledger.system_events(
            event_id BIGSERIAL PRIMARY KEY,
            event_type VARCHAR(50) NOT NULL,
            service_name VARCHAR(50) NOT NULL,
            event_data JSONB,
            severity VARCHAR(20) DEFAULT 'info',
            event_ts TIMESTAMP DEFAULT NOW()
          );
          
          -- Create indexes
          CREATE INDEX IF NOT EXISTS idx_customer_email ON td.dim_customer(email);
          CREATE INDEX IF NOT EXISTS idx_account_customer ON td.dim_account(customer_id);
          CREATE INDEX IF NOT EXISTS idx_transaction_account ON td.fact_transaction(account_id);
          CREATE INDEX IF NOT EXISTS idx_transaction_ts ON td.fact_transaction(txn_ts);
          CREATE INDEX IF NOT EXISTS idx_audit_table_record ON audit.audit_trail(table_name, record_id);
          CREATE INDEX IF NOT EXISTS idx_system_events_ts ON ledger.system_events(event_ts);
          SQL
          
          # Generate service-specific schemas
          for service in omni analytics notification audit scheduler; do
            create_service_schema "$service"
            create_service_queries "$service"
          done
          
          # Enhanced DW queries
          cat > "${ECHO_DW}/queries/01_enhanced_daily_volume.sql" <<'SQL'
          SELECT 
            date_trunc('day', txn_ts)::date AS day,
            COUNT(*) AS txn_count,
            SUM(CASE WHEN txn_type='CREDIT' THEN amount ELSE 0 END) AS credit_amount,
            SUM(CASE WHEN txn_type='DEBIT' THEN amount ELSE 0 END) AS debit_amount,
            SUM(amount) AS total_amount,
            AVG(amount) AS avg_amount,
            COUNT(DISTINCT account_id) AS active_accounts,
            AVG(risk_score) AS avg_risk_score
          FROM td.fact_transaction 
          WHERE txn_ts >= CURRENT_DATE - INTERVAL '30 days'
          GROUP BY 1 
          ORDER BY 1 DESC;
          SQL
          
          cat > "${ECHO_DW}/queries/02_enhanced_top_customers.sql" <<'SQL'
          SELECT 
            c.customer_id,
            c.name,
            c.customer_type,
            c.risk_score,
            COUNT(DISTINCT a.account_id) AS account_count,
            COUNT(f.txn_id) AS txn_count,
            SUM(CASE WHEN f.txn_type='CREDIT' THEN f.amount ELSE -f.amount END) AS net_flow,
            SUM(f.amount) AS total_volume,
            AVG(f.risk_score) AS avg_txn_risk
          FROM td.fact_transaction f
          JOIN td.dim_account a ON a.account_id = f.account_id
          JOIN td.dim_customer c ON c.customer_id = a.customer_id
          WHERE f.txn_ts >= CURRENT_DATE - INTERVAL '7 days'
          GROUP BY 1,2,3,4
          ORDER BY total_volume DESC 
          LIMIT 50;
          SQL
          
          cat > "${ECHO_DW}/queries/03_risk_analysis.sql" <<'SQL'
          SELECT 
            txn_category,
            channel,
            COUNT(*) AS txn_count,
            SUM(amount) AS total_amount,
            AVG(risk_score) AS avg_risk,
            COUNT(CASE WHEN risk_score > 7 THEN 1 END) AS high_risk_count,
            PERCENTILE_CONT(0.95) WITHIN GROUP (ORDER BY amount) AS p95_amount
          FROM td.fact_transaction
          WHERE txn_ts >= CURRENT_DATE - INTERVAL '7 days'
          GROUP BY 1,2
          HAVING COUNT(*) >= 10
          ORDER BY avg_risk DESC;
          SQL
          
          cat > "${ECHO_DW}/queries/04_channel_performance.sql" <<'SQL'
          SELECT 
            channel,
            DATE(txn_ts) AS txn_date,
            COUNT(*) AS txn_count,
            SUM(amount) AS volume,
            COUNT(CASE WHEN status='completed' THEN 1 END) AS completed_count,
            COUNT(CASE WHEN status='failed' THEN 1 END) AS failed_count,
            AVG(EXTRACT(EPOCH FROM (processed_ts - txn_ts))) AS avg_processing_time
          FROM td.fact_transaction
          WHERE txn_ts >= CURRENT_DATE - INTERVAL '7 days'
          GROUP BY 1,2
          ORDER BY 1,2;
          SQL
          
          make_archive "04_enhanced_sql_templates" "${ECHO_TD}" "${ECHO_DW}"

