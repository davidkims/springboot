name: 🌐 .github 모든 경로/에코/워크플로우/환경/로그/설정/업로드 (에러 절대 발생불가)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  all-in-one-info:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 .github/echo_path 선제 생성 + 모든 폴더/필수 파일(루트 포함) + dummy 강제 업로드
        run: |
          set -e

          # 1. .github/echo_path, 루트, 워크플로우, error_logs 등 기본 디렉토리 선제 생성
          mkdir -p .github/echo_path
          mkdir -p .github/workflows
          mkdir -p .github/error_logs

          # 2. 주요 echo/설정/권한/로그/에코/백업 폴더 반복 생성 및 각 폴더마다 실제 파일 보장
          dirs=".github/echo_system .github/echo_network .github/echo_dns .github/echo_route \
                .github/echo_docker .github/echo_containers .github/echo_volume .github/echo_logs \
                .github/echo_permission .github/echo_user .github/echo_key .github/echo_fileperm \
                .github/echo_pkg .github/echo_env .github/echo_build .github/echo_git \
                .github/echo_backup .github/echo_monitor .github/echo_misc \
                .github/workflows .github/scripts .github/cli_test .github/error_logs .github/echo_db .github/echo_path"
          for d in $dirs; do
            mkdir -p $d
            echo "[dummy]" > $d/dummy.txt
            echo "[keep]"  > $d/.keep
            echo "echo '[에코] $d 생성'" > $d/echo_dir.sh
            echo "$d" >> .github/echo_path/dir_path_list.txt
          done

          # 3. .github 루트에 반드시 파일 존재하게
          echo "# Github Meta" > .github/README.md
          echo "[meta]" > .github/.keep
          echo "[dummy-root]" > .github/dummy.txt
          echo "This file guarantees upload!" > .github/dummy_forceupload.txt
          echo ".github" >> .github/echo_path/dir_path_list.txt

          # 4. 워크플로우 예시 및 강제 파일
          echo "name: dummy-wf" > .github/workflows/dummy.yml
          echo "# dummy workflow" > .github/workflows/dummy.md

          # 5. 필수 로그/상태파일
          touch .github/error_logs/disabled_workflows.txt
          touch .github/error_logs/init_check.log
          touch .github/echo_misc/health.txt

          # 6. 환경 echo, 시스템 변수 echo
          printenv | sort > .github/echo_env/env_all.txt
          env > .github/echo_env/env.txt
          echo $SHELL > .github/echo_env/shell.txt
          echo $USER > .github/echo_env/user.txt
          uname -a > .github/echo_env/uname.txt
          cat /etc/os-release > .github/echo_env/os-release.txt
          date > .github/echo_env/date.txt
          locale > .github/echo_env/locale.txt

          # 7. 모든 디렉토리/파일 리스트 기록
          find .github -type d | sort > .github/echo_path/all_dir_list.txt
          find .github -type f | sort > .github/echo_path/all_file_list.txt

          # 8. 폴더/파일 echo (워크플로우 로그 검증)
          echo "[폴더 전체 목록]"
          cat .github/echo_path/all_dir_list.txt
          echo "[파일 전체 목록]"
          cat .github/echo_path/all_file_list.txt

          # 9. 강제 업로드 보장: 최소 하나의 파일이 실제로 있는지 확인 (없으면 강제 에러로 워크플로우 중단)
          total_files=$(find .github -type f | wc -l)
          if [ "$total_files" -eq 0 ]; then
            echo "::error ::.github 폴더에 파일이 실제로 생성되지 않음!"
            exit 1
          fi

      - name: 🔍 [진단] .github 하위 실제 파일 목록 (업로드 직전)
        run: |
          echo "==== 실제 업로드 파일 리스트 ===="
          find .github -type f | sort

      - name: 📦 [최종] .github 전체 폴더/파일/워크플로우/에코/경로/설정/로그/환경 업로드
        uses: actions/upload-artifact@v4
        with:
          name: all-github-artifacts
          path: .github/**
          if-no-files-found: error
