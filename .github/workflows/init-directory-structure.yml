name: 🚀 Init Full Directory Structure with Slot Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'  # 매 1분마다 실행

permissions:
  contents: write

concurrency:
  group: init-directory-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  setup-directories:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧱 Create Base Directory Structure
        run: |
          echo "[+] Creating all base directories..."

          # 기본 디렉토리들 생성
          mkdir -p .github/{workflows,scripts,logs,global,provenance,artifacts}
          mkdir -p data/{transactions,provenance}
          mkdir -p docker/{mysql,postgres,logs}
          mkdir -p site output

          # Slot 디렉토리 생성
          mkdir -p disk/slot-001
          mkdir -p disk/slot-001/.github
          mkdir -p disk/slot-001/data
          mkdir -p disk/slot-001/docker
          mkdir -p disk/slot-001/output
          mkdir -p disk/slot-001/site
          mkdir -p disk/slot-001/logs

          echo "[✔] All required directories created"

      - name: 📝 Generate Dummy Files for Testing
        run: |
          echo "[+] Generating test files..."

          echo "Test log file" > .github/logs/test.log
          echo "Sample data" > data/transactions/test.csv
          echo "Sample docker info" > docker/mysql/info.txt
          echo "Exported output" > output/result.txt
          echo "Site index" > site/index.html

          echo "[✔] Dummy files created"

      - name: 📁 Move Files to disk/slot-001
        run: |
          echo "[+] Copying files into disk/slot-001..."

          cp -r .github disk/slot-001/
          cp -r data disk/slot-001/
          cp -r docker disk/slot-001/
          cp -r output disk/slot-001/
          cp -r site disk/slot-001/

          echo "[✔] Files copied to disk/slot-001"

      - name: 📂 Verify Final Structure
        run: |
          echo "[+] Verifying disk/slot-001 contents..."
          tree disk/slot-001 || ls -R disk/slot-001
