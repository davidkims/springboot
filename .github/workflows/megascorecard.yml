name: "🚀 MEGA Extended CI + Docker Fix + DB Servers + TransferLog + AutoUpgrade"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *" # 5분마다 실행

permissions:
  contents: write

jobs:
  mega-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TRANSFER_LOG_DIR: /opt/logs/transfer
      BACKUP_DIR: /opt/backup/transfer
      PROVENANCE_DIR: provenance
      PROVENANCE_STORE_DIR: provenance/store

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Install Docker (containerd 충돌 방지)
        run: |
          set -Eeuo pipefail
          echo "[ECHO] 기존 containerd.io 제거"
          sudo apt-get remove -y containerd.io || true
          echo "[ECHO] Docker 설치 시작"
          curl -fsSL https://get.docker.com | sh
          sudo systemctl enable docker
          sudo systemctl start docker
          docker --version

      - name: 🛠 Install PostgreSQL/MySQL/Redis
        run: |
          set -Eeuo pipefail
          echo "[ECHO] DB 서버 설치 시작"
          sudo apt-get update -y
          sudo apt-get install -y postgresql mysql-server redis-server
          sudo systemctl start postgresql mysql redis
          sudo systemctl enable postgresql mysql redis
          echo "[ECHO] DB 서버 상태 확인"
          systemctl status postgresql --no-pager || true
          systemctl status mysql --no-pager || true
          systemctl status redis --no-pager || true

      - name: 📜 Create Directories for TransferLog
        run: |
          set -Eeuo pipefail
          echo "[ECHO] 필수 디렉토리 생성"
          mkdir -p "$TRANSFER_LOG_DIR" "$BACKUP_DIR" "$PROVENANCE_DIR" "$PROVENANCE_STORE_DIR"
          ls -alh "$TRANSFER_LOG_DIR" "$BACKUP_DIR" "$PROVENANCE_DIR"

      - name: 📥 Download TransferLog with curl fallback
        run: |
          set -Eeuo pipefail
          FILE_NAME=".provenance_transfer_$(date +%Y%m%d_%H%M%S).json"
          FILE_PATH="$PROVENANCE_DIR/$FILE_NAME"
          echo "[ECHO] 전송 로그 다운로드 시도: $FILE_PATH"
          URLS=(
            "https://example.com/provenance/latest.json"
            "https://mirror.example.com/provenance/latest.json"
            "https://backup.example.org/provenance/latest.json"
          )
          SUCCESS=false
          for URL in "${URLS[@]}"; do
            echo "[ECHO] 시도: $URL"
            if curl -sSfL "$URL" -o "$FILE_PATH"; then
              echo "[ECHO] 다운로드 성공: $URL"
              SUCCESS=true
              break
            else
              echo "[WARN] 다운로드 실패: $URL"
            fi
          done
          if [ "$SUCCESS" = false ]; then
            echo "[ECHO] 모든 다운로드 실패 → 로컬 더미 로그 생성"
            echo "{\"status\":\"dummy\"}" > "$FILE_PATH"
          fi
          ls -l "$FILE_PATH"

      - name: 💾 Disk I/O Test (no pv dependency)
        run: |
          set -Eeuo pipefail
          echo "[ECHO] 대량 파일 생성 시작 (/tmp/io_test)"
          mkdir -p /tmp/io_test
          fallocate -l 100M /tmp/io_test/testfile1.bin
          dd if=/dev/zero of=/tmp/io_test/testfile2.bin bs=10M count=10 status=progress
          echo "[ECHO] Disk I/O Test 완료"
          ls -lh /tmp/io_test

      - name: 🔄 AutoUpgrade Packages
        run: |
          set -Eeuo pipefail
          echo "[ECHO] 시스템 패키지 자동 업데이트 시작"
          sudo apt-get update -y
          sudo apt-get upgrade -y
          sudo apt-get autoremove -y
          echo "[ECHO] 업데이트 완료"

      - name: 📤 Simulated External Server Transfer (No Secrets)
        run: |
          set -Eeuo pipefail
          echo "[ECHO] 외부 서버 전송 시뮬레이션 시작"
          mkdir -p /tmp/external_server
          cp -v "$PROVENANCE_DIR"/*.json /tmp/external_server/
          echo "[ECHO] 외부 서버 전송 시뮬레이션 완료: /tmp/external_server"

      - name: 📦 Upload TransferLog Artifact
        uses: actions/upload-artifact@v4
        with:
          name: provenance-transfer-${{ github.run_id }}
          path: provenance/*.json
          if-no-files-found: warn
          compression-level: 6
