name: "🐧 Linux 최신 설치 & Cloud-Init Seed ISO + Echo 권한 (ALL Versions + AutoUpdate + FullAuto v3)"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      distro:
        description: "배포판 (ubuntu|debian|rocky|alma|fedora)"
        default: "ubuntu"
        required: true
      release_hint:
        description: "버전 힌트 (예: ubuntu: 24.04 / debian: 12 등, 비우면 최신 탐색)"
        default: ""
        required: false
      hostname:
        description: "호스트명"
        default: "fin-linux"
        required: true
      username:
        description: "관리자 사용자명"
        default: "finops"
        required: true
      ssh_public_key:
        description: "접속용 공개키 (ssh-ed25519/ssh-rsa)"
        default: ""
        required: false
      packages:
        description: "설치 패키지 목록(공백/콤마 구분)"
        default: "vim curl git htop unzip"
        required: false
      region:
        description: "타임존/로케일 (예: Asia/Seoul|en_US.UTF-8)"
        default: "Asia/Seoul|en_US.UTF-8"
        required: true
      upload_artifacts:
        description: "생성물 아티팩트 업로드"
        default: "true"
        required: true
      do_upgrade:
        description: "런너 apt full-upgrade 실행"
        default: "false"
        required: true
      combine_base_iso:
        description: "배포판 ISO 자동 다운로드 후 seed 합본 ISO 생성"
        default: "true"
        required: true
  schedule:
    - cron: "0 3 * * 0"

jobs:
  build-seed-iso:
    runs-on: ubuntu-latest
    env:
      AUTO_UPDATE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
    steps:
      - name: "[ECHO] 시작"
        run: |
          set -euo pipefail
          echo "[INIT] Linux Seed ISO + 권한 에코 워크플로우 시작 (${GITHUB_WORKFLOW})"

      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "환경 변수/디렉토리 준비 + Echo Helper"
        id: prep
        run: |
          set -euo pipefail
          export ECHO_ROOT=".github/echo_linux"
          mkdir -p "$ECHO_ROOT"/{logs,seed,out,snippets,scripts,ssh,dirs,iso_src,records,tmp,templates}
          echo "ECHO_ROOT=$ECHO_ROOT" >> $GITHUB_ENV
          cat > "$ECHO_ROOT/echo.sh" <<'EOS'
          echoe(){ printf "%s %s\n" "[$(date +'%F %T')]" "$*"; }
          EOS
          . "$ECHO_ROOT/echo.sh"
          echoe "[DIR] 구조 생성 완료: $ECHO_ROOT"
          echo "CREATE_DIRS=true" >> $GITHUB_ENV

      - name: "선택적 시스템 업그레이드 (런너)"
        if: ${{ github.event.inputs.do_upgrade == 'true' }}
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          echoe "[UPGRADE] apt update/upgrade 실행"
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y dist-upgrade || true
          sudo apt-get -y autoremove || true
          echoe "[UPGRADE] 완료"

      - name: "도구 설치 (genisoimage/xorriso + GPG/7z/squashfs/isoinfo)"
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          echoe "[PKG] 도구 설치"
          sudo apt-get update -y
          sudo apt-get install -y curl wget jq sed file \
            genisoimage xorriso cloud-guest-utils \
            p7zip-full gnupg squashfs-tools gawk libcdio-utils
          echoe "[PKG] 설치 완료"

      - name: "입력값 정규화 및 기본값 계산"
        id: inputs
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          DISTRO="${{ github.event.inputs.distro }}"
          REL_HINT="${{ github.event.inputs.release_hint }}"
          HN="${{ github.event.inputs.hostname }}"
          USERNAME="${{ github.event.inputs.username }}"
          SSH_KEY="${{ github.event.inputs.ssh_public_key }}"
          PKGS="${{ github.event.inputs.packages }}"
          REGION="${{ github.event.inputs.region }}"
          TZ="${REGION%%|*}"
          LOCALE="${REGION##*|}"
          COMBINE="${{ github.event.inputs.combine_base_iso }}"
          case "$DISTRO" in
            ubuntu)  [ -z "$REL_HINT" ] && REL_HINT="24.04" ;;
            debian)  [ -z "$REL_HINT" ] && REL_HINT="12" ;;
            rocky)   [ -z "$REL_HINT" ] && REL_HINT="9" ;;
            alma)    [ -z "$REL_HINT" ] && REL_HINT="9" ;;
            fedora)  [ -z "$REL_HINT" ] && REL_HINT="40" ;;
            *) echo "지원하지 않는 distro: $DISTRO" >&2; exit 1 ;;
          esac
          echo "DISTRO=$DISTRO"     >> $GITHUB_ENV
          echo "REL_HINT=$REL_HINT" >> $GITHUB_ENV
          echo "HOSTNAME=$HN"       >> $GITHUB_ENV
          echo "USERNAME=$USERNAME" >> $GITHUB_ENV
          echo "SSH_KEY=$SSH_KEY"   >> $GITHUB_ENV
          echo "TZ=$TZ"             >> $GITHUB_ENV
          echo "LOCALE=$LOCALE"     >> $GITHUB_ENV
          echo "PKGS=$PKGS"         >> $GITHUB_ENV
          echo "COMBINE=$COMBINE"   >> $GITHUB_ENV
          if [ "$DISTRO" = "ubuntu" ]; then echo "CODENAME=noble" >> $GITHUB_ENV; fi
          echoe "[INPUT] DISTRO=$DISTRO REL_HINT=$REL_HINT HOSTNAME=$HN USER=$USERNAME TZ=$TZ LOCALE=$LOCALE"

      - name: "서버 접근 권한 에코 스니펫 생성 (sudo/sshd/firewall)"
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          SNIP="${ECHO_ROOT}/snippets"
          echoe "[SNIPPET] sudoers"
          cat > "${SNIP}/sudoers_${USERNAME}" <<EOF
          # /etc/sudoers.d/${USERNAME}
          ${USERNAME} ALL=(ALL) NOPASSWD:ALL
          EOF
          echoe "[SNIPPET] sshd_config.d"
          cat > "${SNIP}/sshd_${USERNAME}.conf" <<'EOF'
          # /etc/ssh/sshd_config.d/99-custom.conf
          PasswordAuthentication no
          PermitRootLogin no
          PubkeyAuthentication yes
          ChallengeResponseAuthentication no
          UsePAM yes
          EOF
          echoe "[SNIPPET] 방화벽(ufw) 초기 규칙"
          cat > "${SNIP}/ufw_init.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ufw --force reset || true
          ufw default deny incoming
          ufw default allow outgoing
          ufw allow 22/tcp
          ufw --force enable
          ufw status verbose || true
          EOF
          chmod +x "${SNIP}/ufw_init.sh"
          echoe "[SNIPPET] 완료"

      - name: "권한 적용 스크립트(배포 후 서버에서 실행) 생성"
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          SCRIPTS="${ECHO_ROOT}/scripts"
          echoe "[SCRIPT] 사용자/권한/디렉토리 스크립트 생성"
          cat > "${SCRIPTS}/apply_permissions.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          echo "[RUN] 사용자/권한/디렉토리/sshd/ufw 구성"
          USERNAME="${USERNAME:-finops}"
          adduser --disabled-password --gecos "" "$USERNAME" || true
          usermod -aG sudo "$USERNAME" || true
          install -d -m 700 -o "$USERNAME" -g "$USERNAME" "/home/$USERNAME/.ssh"
          if [ -f /root/seed/ssh/authorized_keys ]; then
            install -m 600 -o "$USERNAME" -g "$USERNAME" /root/seed/ssh/authorized_keys "/home/$USERNAME/.ssh/authorized_keys"
          fi
          install -m 440 /root/seed/snippets/sudoers_${USERNAME} /etc/sudoers.d/${USERNAME}
          install -d -m 755 /etc/ssh/sshd_config.d
          install -m 644 /root/seed/snippets/sshd_${USERNAME}.conf /etc/ssh/sshd_config.d/99-custom.conf
          systemctl restart ssh || systemctl restart sshd || true
          bash /root/seed/snippets/ufw_init.sh || true
          if [ "${CREATE_DIRS:-true}" = "true" ]; then
            mkdir -p /srv/app /var/log/app /opt/fin && chown -R "$USERNAME":"$USERNAME" /srv/app /var/log/app /opt/fin
          fi
          echo "[DONE] 권한/디렉토리 구성 완료"
          EOF
          chmod +x "${SCRIPTS}/apply_permissions.sh"
          cat > "${SCRIPTS}/env.seed" <<EOF
          export USERNAME="${USERNAME}"
          export CREATE_DIRS="${CREATE_DIRS}"
          EOF

      - name: "cloud-init user-data / meta-data 생성 (Seed ISO 내용)"
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          SEED="${ECHO_ROOT}/seed"
          mkdir -p "$SEED"/{nocloud,ssh,snippets}
          if [ -n "${SSH_KEY}" ]; then
            echo "${SSH_KEY}" > "${SEED}/ssh/authorized_keys"
          else
            echo "# 여기에 ssh 공개키를 넣으세요" > "${SEED}/ssh/authorized_keys"
          fi
          PKG_LINE=$(echo "$PKGS" | sed 's/[ ,]\+/ /g' | sed 's/ /, /g')
          cat > "${SEED}/nocloud/user-data" <<EOF
          #cloud-config
          hostname: ${HOSTNAME}
          manage_etc_hosts: true
          locale: ${LOCALE}
          timezone: ${TZ}
          package_update: true
          package_upgrade: true
          users:
            - default
            - name: ${USERNAME}
              groups: [sudo, adm, netdev]
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              ssh_authorized_keys:
                - $(head -n1 "${SEED}/ssh/authorized_keys")
          packages: [ ${PKG_LINE} ]
          runcmd:
            - [ bash, -lc, "echo '[CLOUD-INIT] seed 배치 시작'" ]
            - [ bash, -lc, "install -d -m 755 /root/seed/snippets /root/seed/ssh /root/seed/scripts" ]
            - [ bash, -lc, "cp -a /media/seed/snippets/* /root/seed/snippets/ || true" ]
            - [ bash, -lc, "cp -a /media/seed/ssh/* /root/seed/ssh/ || true" ]
            - [ bash, -lc, "cp -a /media/seed/scripts/* /root/seed/scripts/ || true" ]
            - [ bash, -lc, "USERNAME='${USERNAME}' CREATE_DIRS='${CREATE_DIRS}' bash /root/seed/scripts/apply_permissions.sh" ]
            - [ bash, -lc, "echo '[CLOUD-INIT] 완료'" ]
          final_message: "Seed 완료: ${HOSTNAME} (user: ${USERNAME})"
          EOF
          cat > "${SEED}/nocloud/meta-data" <<EOF
          instance-id: iid-${HOSTNAME}-$(date +%s)
          local-hostname: ${HOSTNAME}
          EOF
          cp -a "${ECHO_ROOT}/snippets" "${SEED}/"
          cp -a "${ECHO_ROOT}/scripts"  "${SEED}/"
          echoe "[SEED] user-data/meta-data 생성 완료"

      - name: "Seed ISO 생성 (NoCloud)"
        id: seed
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          OUT="${ECHO_ROOT}/out"
          mkdir -p "${ECHO_ROOT}/iso_src/seed"
          cp -a "${ECHO_ROOT}/seed/nocloud" "${ECHO_ROOT}/iso_src/seed/"
          cp -a "${ECHO_ROOT}/seed/snippets" "${ECHO_ROOT}/iso_src/seed/"
          cp -a "${ECHO_ROOT}/seed/ssh"      "${ECHO_ROOT}/iso_src/seed/"
          cp -a "${ECHO_ROOT}/seed/scripts"  "${ECHO_ROOT}/iso_src/seed/"
          genisoimage -output "${OUT}/seed.iso" -volid cidata -joliet -rock "${ECHO_ROOT}/iso_src/seed"
          echo "seed_iso=${OUT}/seed.iso" >> $GITHUB_OUTPUT
          echoe "[ISO] Seed ISO 생성: ${OUT}/seed.iso"

      - name: "배포판 ISO URL 계산 및 자동 다운로드 (ALL VERSIONS, 견고화)"
        id: baseiso
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          mkdir -p ${ECHO_ROOT}/out
          DISTRO="${DISTRO}"
          REL_HINT="${REL_HINT}"

          try_fetch() { 
            local url="$1" out="$2"
            echoe "[FETCH] $url"
            if curl -fL --retry 3 --retry-delay 2 -o "$out.tmp" "$url"; then
              local size; size=$(stat -c%s "$out.tmp" || echo 0)
              if [ "$size" -lt 524288000 ] && ! isoinfo -d -i "$out.tmp" >/dev/null 2>&1; then
                echoe "[MISS] ISO 유효성 실패(size=${size})"; rm -f "$out.tmp"; return 1
              fi
              mv "$out.tmp" "$out"
              echoe "[OK] $out ($(du -h "$out" | awk '{print $1}'))"
              # ✅ 실제 성공 URL/파일명 기록 (검증/로그 일관성)
              ISO_URL_USED="$url"
              ISO_NAME_USED="${url##*/}"
              BASE_INDEX_URL_USED="${url%/*}/"
              {
                echo "ISO_URL_USED=$ISO_URL_USED"
                echo "ISO_NAME_USED=$ISO_NAME_USED"
                echo "BASE_INDEX_URL=$BASE_INDEX_URL_USED"
              } >> $GITHUB_ENV
              printf "%s\n" "$url" > "${ECHO_ROOT}/logs/iso_url.txt"
              printf "%s\n" "$ISO_NAME_USED" > "${ECHO_ROOT}/logs/iso_name.txt"
              return 0
            fi
            echoe "[MISS] $url"; rm -f "$out.tmp" || true; return 1
          }
          head_ok(){ curl -fsI "$1" >/dev/null 2>&1; }
          latest_from_index(){ curl -fsSL "$1" | grep -oE "$2" | sort -V | tail -n1 || true; }
          fetch_optional(){ head_ok "$1" && curl -fL --retry 2 -o "$2" "$1" || true; }

          ISO_NAME=""; INDEX_URL=""; SUCCESS=0

          fetch_ubuntu() {
            local SERIES=()
            [ -n "${REL_HINT}" ] && case "${REL_HINT}" in 24.*) SERIES=("noble");; 22.*) SERIES=("jammy");; 20.*) SERIES=("focal");; *) SERIES=("noble" "jammy" "focal");; esac || SERIES=("noble" "jammy" "focal")
            for CODENAME in "${SERIES[@]}"; do
              INDEX_URL="https://cdimage.ubuntu.com/releases/${CODENAME}/release/"
              head_ok "${INDEX_URL}" || continue
              [ -n "${REL_HINT}" ] && ISO_NAME="$(curl -fsSL "${INDEX_URL}" | grep -oE "ubuntu-${REL_HINT//./\\.}(\\.[0-9]+)?-live-server-amd64\\.iso" | sort -V | tail -n1 || true)"
              [ -z "${ISO_NAME}" ] && ISO_NAME="$(latest_from_index "${INDEX_URL}" "ubuntu-[0-9]+\\.[0-9]+(\\.[0-9]+)?-live-server-amd64\\.iso")"
              [ -n "${ISO_NAME}" ] && break
            done
            [ -z "${ISO_NAME}" ] && { echoe "[WARN] Ubuntu 최신 ISO 탐지 실패 → releases 경로 사용(보수)"; INDEX_URL="https://releases.ubuntu.com/24.04/"; ISO_NAME="ubuntu-24.04.3-live-server-amd64.iso"; }
            for U in "${INDEX_URL}${ISO_NAME}" \
                      "https://ftp.usf.edu/pub/ubuntu-releases/${ISO_NAME%%-live-server-amd64.iso}/${ISO_NAME}" \
                      "https://mirror.unix-solutions.be/ubuntu-cdimage/releases/${ISO_NAME%%-live-server-amd64.iso}/release/${ISO_NAME}" \
                      "https://releases.ubuntu.com/${ISO_NAME%%-live-server-amd64.iso}/${ISO_NAME}"; do
              try_fetch "$U" "${ECHO_ROOT}/out/base.iso" && { SUCCESS=1; break; }
            done
            # 체크 파일(있을 때만) — ✅ 실제 성공 디렉터리 기준(BASE_INDEX_URL from try_fetch)
            if [ -n "${BASE_INDEX_URL:-}" ]; then
              fetch_optional "${BASE_INDEX_URL}SHA256SUMS"      "${ECHO_ROOT}/out/SHA256SUMS"
              fetch_optional "${BASE_INDEX_URL}SHA256SUMS.gpg"  "${ECHO_ROOT}/out/SHA256SUMS.gpg"
              for ext in zsync list manifest; do
                [ -n "${ISO_NAME_USED:-}" ] && fetch_optional "${BASE_INDEX_URL}${ISO_NAME_USED}.${ext}" "${ECHO_ROOT}/out/${ISO_NAME_USED}.${ext}"
              done
            fi
          }

          fetch_debian() {
            local BASE="https://cdimage.debian.org/debian-cd"
            local PATH_DVD="${BASE}/current/amd64/iso-dvd/"
            local PATH_CD="${BASE}/current/amd64/iso-cd/"
            [ -n "${REL_HINT}" ] && PATH_DVD="${BASE}/${REL_HINT}.0.0/amd64/iso-dvd/" && PATH_CD="${BASE}/${REL_HINT}.0.0/amd64/iso-cd/"
            ISO_NAME="$(latest_from_index "${PATH_DVD}" "debian-[0-9]+(\\.[0-9]+)*-amd64-DVD-1\\.iso")"
            [ -z "${ISO_NAME}" ] && ISO_NAME="$(latest_from_index "${PATH_CD}" "debian-[0-9]+(\\.[0-9]+)*-amd64-netinst\\.iso")"
            [ -z "${ISO_NAME}" ] && { echoe "[WARN] Debian ISO 탐지 실패"; return; }
            try_fetch "${PATH_DVD}${ISO_NAME}" "${ECHO_ROOT}/out/base.iso" || try_fetch "${PATH_CD}${ISO_NAME}" "${ECHO_ROOT}/out/base.iso" || true
            # 체크 파일은 실제 성공 디렉터리 기준
            if [ -n "${BASE_INDEX_URL:-}" ]; then
              fetch_optional "${BASE_INDEX_URL}SHA256SUMS"      "${ECHO_ROOT}/out/SHA256SUMS"
              fetch_optional "${BASE_INDEX_URL}SHA256SUMS.sign" "${ECHO_ROOT}/out/SHA256SUMS.sign"
            end
          }

          fetch_rocky_or_alma() {
            local vendor="$1"; local ROOT_URL
            [ "$vendor" = "rocky" ] && ROOT_URL="https://download.rockylinux.org/pub/rocky/" || ROOT_URL="https://repo.almalinux.org/almalinux/"
            local VER_DIR; [ -n "${REL_HINT}" ] && VER_DIR="${REL_HINT}/" || VER_DIR="$(curl -fsSL "${ROOT_URL}" | grep -oE 'href=\"[0-9]+/' | grep -oE '[0-9]+' | sort -V | tail -n1)/"
            [ -z "${VER_DIR}" ] && VER_DIR="9/"
            local ISO_DIR="${ROOT_URL}${VER_DIR}isos/x86_64/"
            local PATTERN; [ "$vendor" = "rocky" ] && PATTERN="Rocky-[0-9]+(\\.[0-9]+)?-x86_64-minimal\\.iso" || PATTERN="AlmaLinux-[0-9]+(\\.[0-9]+)?-x86_64-minimal\\.iso"
            ISO_NAME="$(latest_from_index "${ISO_DIR}" "${PATTERN}")"
            [ -z "${ISO_NAME}" ] && { echoe "[WARN] ${vendor} ISO 탐지 실패"; return; }
            try_fetch "${ISO_DIR}${ISO_NAME}" "${ECHO_ROOT}/out/base.iso" || true
          }

          fetch_fedora() {
            local REL="${REL_HINT}"
            [ -z "${REL}" ] && REL="$(curl -fsSL "https://download.fedoraproject.org/pub/fedora/linux/releases/" | grep -oE 'href=\"[0-9]+/' | grep -oE '[0-9]+' | sort -V | tail -n1 || true)"
            [ -z "${REL}" ] && REL="40"
            local ISO_DIR="https://download.fedoraproject.org/pub/fedora/linux/releases/${REL}/Server/x86_64/iso/"
            ISO_NAME="$(latest_from_index "${ISO_DIR}" "Fedora-Server-dvd-x86_64-${REL}-[0-9]+\\.[0-9]+\\.iso|Fedora-Server-dvd-x86_64-${REL}-[0-9]+\\.iso|Fedora-Server-dvd-x86_64-${REL}\\.iso")"
            [ -z "${ISO_NAME}" ] && { echoe "[WARN] Fedora ISO 탐지 실패"; return; }
            try_fetch "${ISO_DIR}${ISO_NAME}" "${ECHO_ROOT}/out/base.iso" || true
            if [ -n "${BASE_INDEX_URL:-}" ]; then
              fetch_optional "${BASE_INDEX_URL}CHECKSUM"     "${ECHO_ROOT}/out/CHECKSUM"
              fetch_optional "${BASE_INDEX_URL}CHECKSUM.sig" "${ECHO_ROOT}/out/CHECKSUM.sig"
            fi
          }

          case "${DISTRO}" in
            ubuntu) fetch_ubuntu ;;
            debian) fetch_debian ;;
            rocky)  fetch_rocky_or_alma rocky ;;
            alma)   fetch_rocky_or_alma alma ;;
            fedora) fetch_fedora ;;
            *) echoe "[ERR] 지원하지 않는 distro: ${DISTRO}"; exit 1 ;;
          esac

          # 로그/공유 (ISO_NAME_USED가 최우선)
          if [ -n "${ISO_NAME_USED:-}" ]; then
            echo "ISO_NAME=${ISO_NAME_USED}" >> $GITHUB_ENV
          elif [ -n "${ISO_NAME:-}" ]; then
            echo "ISO_NAME=${ISO_NAME}" >> $GITHUB_ENV
          fi
          if [ ! -s "${ECHO_ROOT}/out/base.iso" ]; then
            echoe "[WARN] base.iso 미생성 → 이후 합본/리빌드 건너뜀"
          fi

      - name: "체크섬 및 서명 검증 (Ubuntu 정식 키) — 실제 디렉토리 기준 & 유연 매칭"
        if: env.DISTRO == 'ubuntu'
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          if [ ! -s "${ECHO_ROOT}/out/base.iso" ]; then echoe "[SKIP] base.iso 없음"; exit 0; fi

          # BASE_INDEX_URL은 try_fetch 성공 시 설정됨
          if [ -z "${BASE_INDEX_URL:-}" ]; then
            echoe "[WARN] BASE_INDEX_URL 미지정 → 검증 스킵"; exit 0;
          fi

          # 최신 디렉토리에서 체크파일 확보(있을 때만)
          curl -fsIL "${BASE_INDEX_URL}SHA256SUMS"     >/dev/null 2>&1 && curl -fsSL -o "${ECHO_ROOT}/out/SHA256SUMS"     "${BASE_INDEX_URL}SHA256SUMS"     || true
          curl -fsIL "${BASE_INDEX_URL}SHA256SUMS.gpg" >/dev/null 2>&1 && curl -fsSL -o "${ECHO_ROOT}/out/SHA256SUMS.gpg" "${BASE_INDEX_URL}SHA256SUMS.gpg" || true
          if [ ! -s "${ECHO_ROOT}/out/SHA256SUMS" ]; then
            echoe "[INFO] SHA256SUMS 없음(미러/일시 이슈) → SHA 검증 스킵"; exit 0
          fi

          echoe "[GPG] Ubuntu CD Image Automatic Signing Keys 가져오기"
          gpg --keyid-format long --keyserver hkps://keyserver.ubuntu.com --recv-keys \
            0xC5986B4F1257FFA86632CBA746181433FBB75451 \
            0x843938DF228D22F7B3742BC0D94AA3F0EFE21092 || true

          if [ -s "${ECHO_ROOT}/out/SHA256SUMS.gpg" ]; then
            echoe "[VERIFY] SHA256SUMS 서명 확인"
            if ! gpg --keyid-format long --verify "${ECHO_ROOT}/out/SHA256SUMS.gpg" "${ECHO_ROOT}/out/SHA256SUMS"; then
              echoe "[WARN] GPG 검증 실패(키서버/네트워크 가능) → SHA 비교만 진행"
            fi
          fi

          echoe "[SHA256] ISO 체크"
          ACTUAL="$(sha256sum ${ECHO_ROOT}/out/base.iso | awk '{print $1}')"

          # 1) 정확 파일명으로 기대치 탐색 (ISO_NAME는 ISO_NAME_USED 우선)
          ISO_TARGET="${ISO_NAME:-}"
          EXPECT="$(grep -F " ${ISO_TARGET}" ${ECHO_ROOT}/out/SHA256SUMS | awk '{print $1}' || true)"

          # 2) 없으면 같은 디렉토리의 최신 live-server 항목으로 대체
          if [ -z "${EXPECT}" ]; then
            echoe "[WARN] SHA256SUMS에 ${ISO_TARGET} 항목 없음 → 최신 live-server 항목으로 대체 시도"
            ALT_LINE="$(grep -E 'ubuntu-[0-9]+\.[0-9]+(\.[0-9]+)?-live-server-amd64\.iso$' ${ECHO_ROOT}/out/SHA256SUMS | sort -V | tail -n1 || true)"
            EXPECT="$(echo "${ALT_LINE}" | awk '{print $1}')"
            ALT_NAME="$(echo "${ALT_LINE}" | awk '{print $2}')"
            if [ -n "${EXPECT}" ]; then
              echoe "[INFO] 대체 항목: ${ALT_NAME}"
            fi
          fi

          if [ -z "${EXPECT}" ]; then
            echoe "[INFO] SHA256SUMS에서 매칭 항목 없음 → SHA 검증 스킵(다운로드/미러 이슈일 수 있음)"
            exit 0
          fi

          echoe "[SHA256] EXPECT=${EXPECT} ACTUAL=${ACTUAL}"
          if [ "${EXPECT}" != "${ACTUAL}" ]; then
            echoe "[FAIL] SHA256 불일치 → 파일 폐기 권장"
            exit 1
          fi

          echoe "[OK] SHA256(및 가능 시 GPG) 검증 통과"
          printf "OK %s\n" "${ISO_TARGET}" > "${ECHO_ROOT}/logs/sha256_check.txt"

      - name: "Kickstart(Anaconda) & Preseed 템플릿 생성/에코"
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          TPL="${ECHO_ROOT}/templates"
          cat > "${TPL}/kickstart.ks" <<EOF
          #version=RHEL9
          lang en_US.UTF-8
          keyboard us
          timezone ${TZ} --isUtc
          rootpw --lock
          user --name=${USERNAME} --groups=wheel --shell=/bin/bash --gecos="${USERNAME}" --plaintext --password ''
          sshkey --username=${USERNAME} "$(head -n1 ${ECHO_ROOT}/seed/ssh/authorized_keys || true)"
          network --bootproto=dhcp --hostname=${HOSTNAME}
          services --enabled=sshd
          firewall --enabled --service=ssh
          bootloader --location=mbr
          autopart --type=lvm
          reboot
          %post --log=/root/ks-post.log
          echo "[KS] post 시작"
          echo "[KS] 완료"
          %end
          EOF
          cat > "${TPL}/preseed.cfg" <<EOF
          d-i debian-installer/locale string ${LOCALE}
          d-i time/zone string ${TZ}
          d-i clock-setup/utc boolean true
          d-i netcfg/choose_interface select auto
          d-i netcfg/get_hostname string ${HOSTNAME}
          d-i passwd/user-fullname string ${USERNAME}
          d-i passwd/username string ${USERNAME}
          d-i passwd/user-password-crypted password *
          d-i user-setup/allow-password-weak boolean true
          d-i passwd/disable-password boolean true
          d-i preseed/late_command string in-target /usr/bin/mkdir -p /root/seed; cp -a /cdrom/seed /target/root/seed || true
          d-i pkgsel/include string openssh-server sudo
          d-i finish-install/reboot_in_progress note
          EOF
          mkdir -p "${ECHO_ROOT}/iso_src/ks_preseed"
          cp -a "${TPL}/kickstart.ks" "${ECHO_ROOT}/iso_src/ks_preseed/ks.cfg"
          cp -a "${TPL}/preseed.cfg"  "${ECHO_ROOT}/iso_src/ks_preseed/preseed.cfg"
          echoe "[TPL] Kickstart/Preseed 생성 및 iso_src 반영 완료"
          cat > ${ECHO_ROOT}/logs/auto_templates_hint.txt <<'HINT'
          [자동화 템플릿 커널 파라미터 힌트]
          - Fedora/RHEL계열:  inst.ks=cdrom:/ks.cfg
          - Debian:           auto=true priority=critical preseed/file=/cdrom/preseed.cfg
          HINT

      - name: "합본 ISO 생성 (xorriso graft, /seed + /ks.cfg + /preseed.cfg)"
        if: ${{ github.event.inputs.combine_base_iso == 'true' }}
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          if [ ! -s "${ECHO_ROOT}/out/base.iso" ]; then
            echoe "[SKIP] base.iso 미존재 → 합본 생략"
            exit 0
          fi
          xorriso \
            -indev  "${ECHO_ROOT}/out/base.iso" \
            -outdev "${ECHO_ROOT}/out/base-with-seed.iso" \
            -map "${ECHO_ROOT}/iso_src/seed" /seed \
            -map "${ECHO_ROOT}/iso_src/ks_preseed/ks.cfg" /ks.cfg \
            -map "${ECHO_ROOT}/iso_src/ks_preseed/preseed.cfg" /preseed.cfg \
            -boot_image any keep
          echoe "[ISO] 합본 생성: ${ECHO_ROOT}/out/base-with-seed.iso"
          cat > ${ECHO_ROOT}/logs/autoinstall_hint.txt <<'EOF'
          [Ubuntu Autoinstall 힌트]
          부팅 메뉴에서 'e' → 커널 라인 끝 '---' 뒤에 추가:
            autoinstall ds=nocloud;s=/cdrom/seed/
          EOF

      - name: "Ubuntu 전용: 부트 엔트리 주입(완전 자동 ISO 리빌드, GRUB 보강)"
        if: env.DISTRO == 'ubuntu'
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          if [ ! -s "${ECHO_ROOT}/out/base.iso" ]; then echoe "[SKIP] base.iso 없음"; exit 0; fi
          rm -rf "${ECHO_ROOT}/tmp/grub" && mkdir -p "${ECHO_ROOT}/tmp/grub/boot/grub" "${ECHO_ROOT}/tmp/grub/EFI/BOOT"
          7z x -o"${ECHO_ROOT}/tmp/grub" "${ECHO_ROOT}/out/base.iso" boot/grub/grub.cfg EFI/BOOT/grub.cfg -y || true
          [ -f "${ECHO_ROOT}/tmp/grub/boot/grub/grub.cfg" ] || touch "${ECHO_ROOT}/tmp/grub/boot/grub/grub.cfg"
          [ -f "${ECHO_ROOT}/tmp/grub/EFI/BOOT/grub.cfg" ] || touch "${ECHO_ROOT}/tmp/grub/EFI/BOOT/grub.cfg"
          mv "${ECHO_ROOT}/tmp/grub/boot/grub/grub.cfg" "${ECHO_ROOT}/tmp/grub/boot/grub/grub.cfg.orig"
          mv "${ECHO_ROOT}/tmp/grub/EFI/BOOT/grub.cfg"  "${ECHO_ROOT}/tmp/grub/EFI/BOOT/grub.cfg.orig"
          mkdir -p "${ECHO_ROOT}/iso_src/autoinstall"
          cat > "${ECHO_ROOT}/iso_src/autoinstall/grub.cfg" <<'GRUB'
          set timeout=5
          set default=0
          menuentry "Ubuntu Server Autoinstall (NoCloud /cdrom/seed)" {
              set gfxpayload=keep
              linux   /casper/vmlinuz autoinstall ds=nocloud;s=/cdrom/seed/ ---
              initrd  /casper/initrd
          }
          menuentry "Original installer menu" {
              if [ -f (cd0)/boot/grub/grub.cfg.orig ]; then
                configfile (cd0)/boot/grub/grub.cfg.orig
              elif [ -f (cd0)/EFI/BOOT/grub.cfg.orig ]; then
                configfile (cd0)/EFI/BOOT/grub.cfg.orig
              fi
          }
          GRUB
          xorriso \
            -indev  "${ECHO_ROOT}/out/base.iso" \
            -outdev "${ECHO_ROOT}/out/base-with-seed-autoinstall.iso" \
            -map "${ECHO_ROOT}/iso_src/seed" /seed \
            -map "${ECHO_ROOT}/tmp/grub/boot/grub/grub.cfg.orig" /boot/grub/grub.cfg.orig \
            -map "${ECHO_ROOT}/tmp/grub/EFI/BOOT/grub.cfg.orig"  /EFI/BOOT/grub.cfg.orig \
            -map "${ECHO_ROOT}/iso_src/autoinstall/grub.cfg"     /boot/grub/grub.cfg \
            -map "${ECHO_ROOT}/iso_src/autoinstall/grub.cfg"     /EFI/BOOT/grub.cfg \
            -boot_image any keep
          echoe "[ISO] Ubuntu 완전 자동 ISO 생성: ${ECHO_ROOT}/out/base-with-seed-autoinstall.iso"

      - name: "자동 업데이트(주기 실행 시 최신 ISO 기록/커밋)"
        if: env.AUTO_UPDATE == 'true'
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          DISTRO="${DISTRO}"
          REC_DIR="${ECHO_ROOT}/records"
          mkdir -p "${REC_DIR}"
          CURR_ISO_NAME=""
          [ -f "${ECHO_ROOT}/logs/iso_name.txt" ] && CURR_ISO_NAME="$(cat ${ECHO_ROOT}/logs/iso_name.txt)" || true
          TARGET_FILE="${REC_DIR}/${DISTRO}_latest.txt"
          PREV=""; [ -f "${TARGET_FILE}" ] && PREV="$(cat ${TARGET_FILE})" || true
          echoe "[AUTO-UPDATE] 이전=${PREV:-<none>} / 현재=${CURR_ISO_NAME:-<none>}"
          if [ -n "${CURR_ISO_NAME}" ] && [ "${CURR_ISO_NAME}" != "${PREV}" ]; then
            echo "${CURR_ISO_NAME}" > "${TARGET_FILE}"
            git config user.name  "gh-actions"
            git config user.email "actions@users.noreply.github.com"
            git add "${TARGET_FILE}"
            git commit -m "chore(iso): ${DISTRO} 최신 ISO 갱신 → ${CURR_ISO_NAME}" || true
            git push || true
            echoe "[AUTO-UPDATE] 커밋/푸시 완료"
          else
            echoe "[AUTO-UPDATE] 갱신 없음"
          fi

      - name: "로그/결과 요약"
        run: |
          set -euo pipefail
          . ${ECHO_ROOT}/echo.sh
          echoe "[SUMMARY] 생성 파일"
          ls -alh ${ECHO_ROOT}/out || true
          ls -alh ${ECHO_ROOT}/seed || true
          echoe "[HINT] 두-ISO: 1) 배포판 ISO 2) seed.iso (NoCloud)"
          echoe "[HINT] Fedora/RHEL: 커널 'inst.ks=cdrom:/ks.cfg'"
          echoe "[HINT] Debian:      'auto=true priority=critical preseed/file=/cdrom/preseed.cfg'"
          echoe "[HINT] Ubuntu 합본: 'autoinstall ds=nocloud;s=/cdrom/seed/'"
          echoe "[HINT] Ubuntu 완전 자동 ISO: base-with-seed-autoinstall.iso 그대로 부팅"

      - name: "아티팩트 업로드"
        if: ${{ github.event.inputs.upload_artifacts == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-seed-iso-and-echo
          path: |
            .github/echo_linux/out/seed.iso
            .github/echo_linux/out/base.iso
            .github/echo_linux/out/base-with-seed.iso
            .github/echo_linux/out/base-with-seed-autoinstall.iso
            .github/echo_linux/seed/**
            .github/echo_linux/snippets/**
            .github/echo_linux/scripts/**
            .github/echo_linux/logs/**
            .github/echo_linux/iso_src/**
            .github/echo_linux/templates/**
            .github/echo_linux/records/**
          retention-days: 14
