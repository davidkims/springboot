name: 📦 전문가 분산 집계/설치/대량 데이터 수집/BS 리메이크/배치 자동화

on:
  workflow_dispatch:
  repository_dispatch:
    types: [workflow_run]
  schedule:
    - cron: '*/5 * * * *'

jobs:
  all-in-one-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 📛 기존 데이터/분산 디렉토리/워크플로우 데이터 삭제 (Clean All)
        run: |
          rm -rf collector-data elk-data docker-data encrypted-data snapshot
          rm -rf runs-details jobs-details steps-details collector-tmp
          rm -f all-runs-*.json
          echo '[초기화] 기존 분산/워크플로우/스냅샷 데이터 전부 삭제됨' > clean.log

      - name: 📂 역할별 분산/워크플로우/스냅샷/리메이크 디렉토리 재생성 및 echo
        run: |
          mkdir -p collector-data elk-data docker-data encrypted-data snapshot
          mkdir -p runs-details jobs-details steps-details collector-tmp
          mkdir -p remake-batch remake-batch/sample remake-batch/logs
          echo '[생성] collector-data' > collector-data/echo_dir.txt
          echo '[생성] elk-data' > elk-data/echo_dir.txt
          echo '[생성] docker-data' > docker-data/echo_dir.txt
          echo '[생성] encrypted-data' > encrypted-data/echo_dir.txt
          echo '[생성] snapshot' > snapshot/echo_dir.txt
          echo '[생성] runs-details' > runs-details/echo_dir.txt
          echo '[생성] jobs-details' > jobs-details/echo_dir.txt
          echo '[생성] steps-details' > steps-details/echo_dir.txt
          echo '[생성] collector-tmp' > collector-tmp/echo_dir.txt
          echo '[생성] remake-batch' > remake-batch/echo_dir.txt
          echo '[생성] remake-batch/sample' > remake-batch/sample/echo_dir.txt
          echo '[생성] remake-batch/logs' > remake-batch/logs/echo_dir.txt
          tree -a > snapshot/dirs_tree_init.txt || ls -lR > snapshot/dirs_tree_init.txt

      - name: 🧹 bs 리메이크/초기화 - 샘플/로그/테스트 데이터 신규 생성(Batch)
        run: |
          for i in $(seq 1 10); do
            echo "샘플 데이터 $i - $(date +%Y%m%d%H%M%S)" > remake-batch/sample/sample_data_$i.txt
            echo "[샘플] sample_data_$i.txt 생성" >> remake-batch/sample/echo_create.txt
          done
          for i in $(seq 1 5); do
            echo "로그 기록 $i - $(date +%Y-%m-%dT%H:%M:%S)" > remake-batch/logs/log_$i.log
            echo "[로그] log_$i.log 생성" >> remake-batch/logs/echo_create.txt
          done
          echo "[배치] 샘플/로그 1차 데이터 생성 완료" > remake-batch/batch_done.txt

      - name: 🐘 TimescaleDB(Postgres 15) 분산 설치 (GPG 최신화)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get upgrade -y || true
          sudo apt-get install -y wget gnupg ca-certificates lsb-release
          sudo mkdir -p /usr/share/keyrings
          wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor | sudo tee /usr/share/keyrings/postgresql.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-15 postgresql-server-dev-15 || true
          wget --quiet -O - https://packagecloud.io/timescale/timescaledb/gpgkey | gpg --dearmor | sudo tee /usr/share/keyrings/timescale-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/timescale-archive-keyring.gpg] https://packagecloud.io/timescale/timescaledb/ubuntu/ $(lsb_release -c -s) main" | sudo tee /etc/apt/sources.list.d/timescaledb.list
          sudo apt-get update
          sudo apt-get install -y timescaledb-2-postgresql-15 timescaledb-2-loader-postgresql-15 timescaledb-tools timescaledb-toolkit-postgresql-15 || (sudo apt-get -f install -y && sudo apt-get install -y timescaledb-2-postgresql-15 timescaledb-2-loader-postgresql-15 timescaledb-tools timescaledb-toolkit-postgresql-15)
          sudo apt-get upgrade -y || true
          echo '[설치/업그레이드 완료] TimescaleDB/PostgreSQL' > collector-data/echo_timescaledb.txt
          dpkg -l | grep postgresql > collector-data/dpkg_postgres.txt || true
          dpkg -l | grep timescaledb > collector-data/dpkg_timescaledb.txt || true
          psql --version > collector-data/psql_version.txt || true
          echo '샘플 TimescaleDB 데이터' > collector-data/sample-tsdb.txt
          sha256sum collector-data/sample-tsdb.txt > collector-data/sample-tsdb-sha256.txt

      - name: 🔎 ELK Stack 분산 설치 및 snapshot
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y || true
          sudo apt-get install -y openjdk-11-jre wget apt-transport-https
          wget -qO - https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor | sudo tee /usr/share/keyrings/elasticsearch.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/elasticsearch.gpg] https://artifacts.elastic.co/packages/7.x/apt stable main" | sudo tee /etc/apt/sources.list.d/elastic-7.x.list
          sudo apt-get update
          sudo apt-get install -y elasticsearch logstash kibana
          sudo apt-get upgrade -y || true
          sudo systemctl daemon-reload
          sudo systemctl enable elasticsearch.service || true
          sudo systemctl enable kibana.service || true
          sudo systemctl enable logstash.service || true
          sudo systemctl start elasticsearch.service || true
          sudo systemctl start kibana.service || true
          sudo systemctl start logstash.service || true
          (elasticsearch --version > elk-data/elasticsearch_version.txt 2>&1 || /usr/share/elasticsearch/bin/elasticsearch --version >> elk-data/elasticsearch_version.txt 2>&1 || echo "elasticsearch not found" >> elk-data/elasticsearch_version.txt)
          (kibana --version > elk-data/kibana_version.txt 2>&1 || /usr/share/kibana/bin/kibana --version >> elk-data/kibana_version.txt 2>&1 || echo "kibana not found" >> elk-data/kibana_version.txt)
          (logstash --version > elk-data/logstash_version.txt 2>&1 || /usr/share/logstash/bin/logstash --version >> elk-data/logstash_version.txt 2>&1 || echo "logstash not found" >> elk-data/logstash_version.txt)
          dpkg -l | grep elasticsearch > elk-data/dpkg_elasticsearch.txt || true
          dpkg -l | grep kibana > elk-data/dpkg_kibana.txt || true
          dpkg -l | grep logstash > elk-data/dpkg_logstash.txt || true
          sudo systemctl status elasticsearch.service > elk-data/elasticsearch_systemctl.txt || true
          sudo systemctl status kibana.service > elk-data/kibana_systemctl.txt || true
          sudo systemctl status logstash.service > elk-data/logstash_systemctl.txt || true
          echo '샘플 ELK 로그' > elk-data/sample-elk-log.txt
          sha256sum elk-data/sample-elk-log.txt > elk-data/sample-elk-log-sha256.txt

      - name: 🐳 Docker 분산 설치, 이미지 및 snapshot
        run: |
          sudo apt-get remove -y docker docker-engine docker.io containerd runc containerd.io || true
          sudo apt-get purge -y docker docker-engine docker.io containerd runc containerd.io || true
          sudo apt-get autoremove -y || true
          curl -fsSL https://get.docker.com -o get-docker.sh
          sh get-docker.sh
          sudo systemctl enable docker
          sudo systemctl start docker
          sudo docker --version > docker-data/docker_version.txt
          sudo docker images > docker-data/docker_images.txt
          echo -e 'FROM ubuntu:22.04\nRUN apt-get update && apt-get install -y curl' > docker-data/Dockerfile
          echo '[이미지 Dockerfile 생성] docker-data/Dockerfile' > docker-data/echo_dockerfile.txt
          sudo docker build -t elk-timescale-test:latest docker-data
          echo '[도커 이미지 빌드 완료] elk-timescale-test:latest' > docker-data/echo_build.txt

      - name: 🧹 메모리 누수 방지(GC/캐시 해제) 및 snapshot
        run: |
          sync; sudo sysctl -w vm.drop_caches=3
          echo '[메모리 캐시 정리, GC 완료]' > snapshot/echo_gc.txt
          free -h > snapshot/memory_after_gc.txt
          vmstat 1 3 > snapshot/vmstat_after_gc.txt

      - name: 📝 집계 샘플 데이터 분산 저장 및 암호화
        run: |
          echo '샘플 집계 데이터' > collector-data/sample-data.txt
          echo '[파일 생성] collector-data/sample-data.txt' > collector-data/echo_sample.txt
          sha256sum collector-data/sample-data.txt > collector-data/sample-data-sha256.txt
          cp collector-data/sample-data.txt encrypted-data/sample-data.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in encrypted-data/sample-data.txt -out encrypted-data/sample-data.txt.enc -k testpassword
          echo '[암호화] encrypted-data/sample-data.txt.enc' > encrypted-data/echo_encrypt.txt
          rm -f encrypted-data/sample-data.txt
          sha256sum encrypted-data/sample-data.txt.enc > encrypted-data/sample-data-enc-sha256.txt

      - name: 최신 1000건 워크플로우 실행 목록 수집 및 저장 (rate-limit-safe)
        run: |
          > all-runs-arrays.json
          RATE_LIMITED=0
          for page in $(seq 1 10); do
            resp=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100&page=$page")
            msg=$(echo "$resp" | jq -r '.message // empty')
            if [[ "$msg" == *"rate limit"* ]] || [[ "$msg" == *"API rate limit exceeded"* ]]; then
              RATE_LIMITED=1
              break
            fi
            runs=$(echo "$resp" | jq '.workflow_runs // []')
            echo "$runs" >> all-runs-arrays.json
          done
          if [ "$RATE_LIMITED" -eq 1 ]; then
            echo '[]' > all-runs-flat.json
            echo '[]' > all-runs-summary.json
            echo "RATE_LIMITED=1" >> $GITHUB_ENV
          else
            cat all-runs-arrays.json | jq -s 'add' > all-runs-flat.json || echo "[]" > all-runs-flat.json
            if [ ! -s all-runs-flat.json ]; then
              echo "[]" > all-runs-flat.json
            fi
            jq '[.[] | {id, name, display_title, status, conclusion, run_number, html_url, created_at, updated_at, actor: (if .actor then .actor.login else "" end)}]' all-runs-flat.json > all-runs-summary.json || echo "[]" > all-runs-summary.json
            if [ ! -s all-runs-summary.json ]; then
              echo "[]" > all-runs-summary.json
            fi
          fi

      - name: 각 워크플로우 실행 상세 감지 및 파일 생성 (null-safe)
        run: |
          ids=$(cat all-runs-summary.json 2>/dev/null | jq -r '.[].id' | head -1000 || true)
          i=0
          for rid in $ids; do
            run_resp=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$rid")
            if [ -n "$run_resp" ] && [ "$(echo "$run_resp" | jq -r '.id // empty')" != "" ]; then
              echo "$run_resp" > runs-details/run-$rid.json
            else
              echo '{ "error": "수집 실패 또는 RateLimit" }' > runs-details/run-$rid.json
            fi
            jobs_resp=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$rid/jobs")
            if [ -n "$jobs_resp" ] && [ "$(echo "$jobs_resp" | jq -r '.jobs // empty')" != "" ]; then
              echo "$jobs_resp" > jobs-details/jobs-$rid.json
              cat jobs-details/jobs-$rid.json | jq '[.jobs // [] | .[] | {id, name, status, conclusion, started_at, completed_at, steps: [.steps // [] | .[] | {name, status, conclusion}] }]' > steps-details/steps-$rid.json
            else
              echo '{ "error": "수집 실패 또는 RateLimit" }' > jobs-details/jobs-$rid.json
              echo '[]' > steps-details/steps-$rid.json
            fi
            i=$((i+1))
            if [ $i -ge 1000 ]; then break; fi
          done

      - name: Python 집계 서버 CLI 환경 준비 (requests 설치)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3 python3-pip
          pip3 install requests

      - name: 📦 전체 분산/워크플로우/echo/snapshot/리메이크 배치 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: all-artifacts-distributed-batch-with-echo
          path: |
            collector-data/
            elk-data/
            docker-data/
            encrypted-data/
            snapshot/
            remake-batch/
            runs-details/
            jobs-details/
            steps-details/
            collector-tmp/

      - name: 최신 상태 요약 (워크플로우+분산+리메이크 배치)
        run: |
          echo "▶️ [collector-data/sample-data.txt] (샘플 집계 데이터 20줄 요약):"
          if [ -s collector-data/sample-data.txt ]; then
            head -20 collector-data/sample-data.txt
          else
            echo '[⚠️] collector-data/sample-data.txt 없음'
          fi
          echo ""
          echo "▶️ [remake-batch/sample] (샘플 데이터 10개):"
          ls -l remake-batch/sample | grep sample_data_ || echo '[⚠️] 샘플 데이터 없음'
          head -5 remake-batch/sample/sample_data_1.txt 2>/dev/null || true
          echo ""
          echo "▶️ [remake-batch/logs] (로그 5개):"
          ls -l remake-batch/logs | grep log_ || echo '[⚠️] 로그 없음'
          head -5 remake-batch/logs/log_1.log 2>/dev/null || true
          echo ""
          echo "▶️ [all-runs-summary.json] (최근 40건 워크플로우 요약):"
          if [ -s all-runs-summary.json ]; then
            jq -r '.[] | "워크플로: \(.display_title // .name) (#\(.run_number))\n상태: \(.status)/\(.conclusion)\nURL: \(.html_url)\n-----"' all-runs-summary.json | head -40
          else
            echo '[⚠️] 워크플로우 데이터 없음'
          fi
