name: 🛡️ Scorecard Install, Copy, and Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # 매주 일요일 실행

permissions:
  contents: read

env:
  SCORECARD_VERSION: "4.10.5"
  INSTALL_DIR: "/opt/scorecard"
  OUT_DIR: .github/scorecard
  TARGET_REPO: ${{ github.repository }}

jobs:
  scorecard-job:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Create install directory
        run: |
          echo "[+] Creating install directory..."
          sudo mkdir -p $INSTALL_DIR
          sudo chmod -R 777 $INSTALL_DIR

      - name: 🧾 Download & Install Scorecard CLI
        run: |
          echo "[+] Fetching Scorecard v${SCORECARD_VERSION}..."
          ASSET="scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz"
          URL="https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/${ASSET}"
          wget -qO scorecard.tar.gz "$URL"
          tar -xzf scorecard.tar.gz
          
          DIR_NAME="scorecard_${SCORECARD_VERSION}_linux_amd64"
          chmod +x "$DIR_NAME/scorecard"
          mv "$DIR_NAME/scorecard" $INSTALL_DIR/
          echo "$INSTALL_DIR" >> $GITHUB_PATH
          scorecard --version

      - name: 📂 Prepare Output Directory
        run: mkdir -p $OUT_DIR

      - name: 🧪 Run Scorecard JSON Scan
        run: |
          echo "[+] Running Scorecard JSON scan..."
          scorecard --repo=https://github.com/${TARGET_REPO} \
                    --format=json \
                    --show-details > $OUT_DIR/results.json

      - name: 📄 Convert to SARIF
        run: |
          echo "[+] Converting to SARIF format..."
          scorecard --repo=https://github.com/${TARGET_REPO} \
                    --format=sarif > $OUT_DIR/scorecard-results.sarif

      - name: 📤 Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.OUT_DIR }}/scorecard-results.sarif

      - name: 📦 Upload JSON Results
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-json
          path: ${{ env.OUT_DIR }}/results.json
