name: 🚀 Full Finance + Provenance + Pages Deployment

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # 매시간 정각 실행

permissions:
  contents: write
  id-token: write
  attestations: write
  pages: write

env:
  ARTIFACT_NAME: ledger-${{ github.run_id }}-${{ github.run_number }}
  OUT_DIR: output
  LEDGER_BATCH: ${{ github.run_number }}

jobs:
  full-job:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Docker & CLI 설치 및 시스템 정보 로그 생성
        run: |
          echo "[docker] Docker 설치 중..."
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo systemctl start docker
          docker --version

          echo "[cli] CLI 도구 설치 중..."
          sudo apt-get update
          sudo apt-get install -y jq curl unzip bc
          echo "[cli] 설치 완료"

          echo "[sysinfo] 시스템 정보 디렉토리 및 파일 생성"
          mkdir -p .github/sysinfo
          {
            echo "Docker 버전:"
            docker --version
            echo
            echo "jq 버전:"
            jq --version
            echo
            echo "curl 버전:"
            curl --version | head -n 1
            echo
            echo "unzip 버전:"
            unzip -v | head -n 1
            echo
            echo "bc 버전:"
            bc --version | head -n 1
            echo
            echo "설치 시간: $(date -u)"
          } > .github/sysinfo/sysinfo.txt

          echo "[sysinfo] Pages 업로드용 디렉토리에 복사"
          mkdir -p site
          cp .github/sysinfo/sysinfo.txt site/sysinfo.txt

      - name: 🗂️ 필수 디렉토리 생성 (동적 배치)
        run: |
          echo "[mkdir] 디렉토리 생성 중..."
          mkdir -p .github/finance/ledgers_credit/batch-${LEDGER_BATCH}
          mkdir -p .github/finance/ledgers_check/batch-${LEDGER_BATCH}
          mkdir -p .github/finance/files
          mkdir -p .github/scorecard/ledgers
          mkdir -p .github/scorecard/files
          mkdir -p site
          mkdir -p $OUT_DIR
          echo "[mkdir] 디렉토리 생성 완료"

      - name: 📄 신용/체크카드 거래 원장 생성
        run: |
          echo "[ledger] 배치 ${LEDGER_BATCH} 생성 시작..."
          for i in $(seq 1 10); do
            CREDIT_FILE=".github/finance/ledgers_credit/batch-${LEDGER_BATCH}/ledger_credit_${i}.csv"
            CHECK_FILE=".github/finance/ledgers_check/batch-${LEDGER_BATCH}/ledger_check_${i}.csv"
            echo "name,date,amount,type,card_number" > $CREDIT_FILE
            echo "name,date,amount,type,card_number" > $CHECK_FILE
            for j in $(seq 1 50); do
              NAME="Customer${j}"
              DATE=$(date -d "$j days ago" +%F)
              AMOUNT=$(echo "scale=2; $((RANDOM % 9000 + 1000))" | bc)
              if [ $((RANDOM % 2)) -eq 0 ]; then
                TYPE="신용"
                CARD_NUMBER="4111$(printf '%012d' $((RANDOM % 1000000000000)))"
                echo "$NAME,$DATE,$AMOUNT,$TYPE,$CARD_NUMBER" >> $CREDIT_FILE
              else
                TYPE="체크"
                CARD_NUMBER="CHK$((10000000 + RANDOM % 90000000))"
                echo "$NAME,$DATE,$AMOUNT,$TYPE,$CARD_NUMBER" >> $CHECK_FILE
              fi
            done
            echo "[ledger] ledger_credit_${i}.csv / ledger_check_${i}.csv 생성 완료"
          done

      - name: 💳 거래 시뮬레이션 (재시도 포함)
        run: |
          echo "[simulate] 거래 시뮬레이션 시작..."
          for file in .github/finance/ledgers_credit/batch-${LEDGER_BATCH}/*.csv .github/finance/ledgers_check/batch-${LEDGER_BATCH}/*.csv; do
            echo "[simulate] 파일: $file"
            tail -n +2 "$file" | while IFS=',' read -r name date amount type card_number; do
              attempt=1
              max_attempts=3
              success=false
              while [ $attempt -le $max_attempts ]; do
                echo "🟢 거래 시도 $attempt: 고객=$name | ₩$amount | $type | ${card_number:0:4}****"
                FAIL=$((RANDOM % 100))
                if [[ $FAIL -lt 5 ]]; then
                  echo "❌ 실패 (시도 $attempt)"
                  attempt=$((attempt+1))
                  sleep 0.2
                else
                  echo "✅ 승인 완료 (시도 $attempt)"
                  success=true
                  break
                fi
              done
              if [[ $success == false ]]; then
                echo "::warning::💥 최종 실패: $name ₩$amount"
              fi
              sleep 0.1
            done
          done
          echo "[simulate] 모든 거래 완료"

      - name: 🛠️ 거래 증명서 파일 생성
        run: |
          echo "이 거래 증명서는 $(date -u)에 생성되었습니다." > $OUT_DIR/build.txt

      - name: 🧾 거래 증명서 생성
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ env.OUT_DIR }}/build.txt

      - name: 📄 SARIF 및 JSON 변환 인증서
        run: |
          echo "[provenance] SARIF/JSON 생성 중..."
          echo '{
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [{"name": "build.txt", "digest": {"sha256": "dummyhashvalue1234567890"}}],
            "predicateType": "https://slsa.dev/provenance/v0.2",
            "predicate": {
              "buildType": "https://example.com/github-actions",
              "builder": {"id": "github.com/actions/attest-build-provenance"},
              "invocation": {"configSource": {"uri": "https://github.com/example/repo"}}
            }
          }' > site/${{ env.ARTIFACT_NAME }}.json

          echo '{
            "version": "2.1.0",
            "runs": [{
              "tool": {
                "driver": {
                  "name": "Provenance Converter",
                  "informationUri": "https://github.com/actions/attest-build-provenance",
                  "version": "1.0.0"
                }
              },
              "results": []
            }]
          }' > site/${{ env.ARTIFACT_NAME }}.sarif

      - name: 🛰️ KFTC 상태 점검 리포트 생성
        run: |
          echo "[KFTC] 상태 점검 시작..."
          STATUS_FILE="site/kftc_status_report.txt"
          function check_mock_status() {
            SERVICE=$1
            STATUS=$((RANDOM % 2))
            if [[ $STATUS -eq 0 ]]; then
              echo "✅ $SERVICE: 정상" >> "$STATUS_FILE"
            else
              echo "❌ $SERVICE: 장애" >> "$STATUS_FILE"
            fi
          }
          echo "KFTC 상태 리포트 ($(date -u))" > "$STATUS_FILE"
          check_mock_status "전자금융공동망"
          check_mock_status "CD/ATM 공동망"
          check_mock_status "어음교환망"
          echo "[KFTC] 상태 점검 완료"

      - name: 📤 GitHub Pages용으로 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: full-job
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    permissions:
      pages: write
      id-token: write

    steps:
      - name: 🚀 GitHub 페이지에 배포
        uses: actions/deploy-pages@v4
