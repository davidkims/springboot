name: 🗂️ All Workflow YAMLs → DB+LOB+DB별마이그레이션+SQL+자동업그레이드(다중ALTER/DB별정책/echo)

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  workflow-dbify:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 .github/sql 디렉토리 및 준비
        run: |
          echo "echo '[준비] .github/workflows, .github/sql 디렉토리 리스트:'"
          echo '[준비] .github/workflows, .github/sql 디렉토리 리스트:'
          echo "ls -l .github/workflows || true"
          ls -l .github/workflows || true
          echo "ls -l .github/sql || true"
          ls -l .github/sql || true
          echo "mkdir -p .github/sql"
          mkdir -p .github/sql
          echo "mkdir -p .github"
          mkdir -p .github

      - name: 📄 requirements.txt 생성 (echo)
        run: |
          echo "echo 'pyyaml' > requirements.txt"
          echo 'pyyaml' > requirements.txt

      - name: 🐍 workflow2db.py 전체 echo 생성 (실제 .sql 업그레이드/DB별정책/다중ALTER)
        run: |
          echo "echo 'import os' > workflow2db.py"
          echo 'import os' > workflow2db.py
          echo "echo 'import sqlite3' >> workflow2db.py"
          echo 'import sqlite3' >> workflow2db.py
          echo "echo 'import yaml' >> workflow2db.py"
          echo 'import yaml' >> workflow2db.py
          echo "echo 'import zlib' >> workflow2db.py"
          echo 'import zlib' >> workflow2db.py
          echo "echo 'from datetime import datetime' >> workflow2db.py"
          echo 'from datetime import datetime' >> workflow2db.py
          echo "echo 'import binascii' >> workflow2db.py"
          echo 'import binascii' >> workflow2db.py
          echo '' >> workflow2db.py
          echo "WORKFLOWS_DIR = '.github/workflows'" >> workflow2db.py
          echo "DB_PATH = '.github/workflows.db'" >> workflow2db.py
          echo "SQL_DIR = '.github/sql'" >> workflow2db.py
          echo '' >> workflow2db.py
          echo 'def init_db():' >> workflow2db.py
          echo '    conn = sqlite3.connect(DB_PATH)' >> workflow2db.py
          echo '    c = conn.cursor()' >> workflow2db.py
          echo '    c.execute("CREATE TABLE IF NOT EXISTS workflow (id INTEGER PRIMARY KEY AUTOINCREMENT, filename TEXT, name TEXT, triggers TEXT, created_at TEXT, updated_at TEXT, raw_yaml TEXT, raw_yaml_blob BLOB, yaml_crc INTEGER, yaml_size INTEGER);")' >> workflow2db.py
          echo '    c.execute("CREATE TABLE IF NOT EXISTS job (id INTEGER PRIMARY KEY AUTOINCREMENT, workflow_id INTEGER, job_name TEXT, runs_on TEXT, created_at TEXT, updated_at TEXT, job_yaml TEXT, job_yaml_blob BLOB, job_crc INTEGER, job_size INTEGER, FOREIGN KEY(workflow_id) REFERENCES workflow(id));")' >> workflow2db.py
          echo '    c.execute("CREATE TABLE IF NOT EXISTS workflow_lob (id INTEGER PRIMARY KEY AUTOINCREMENT, workflow_id INTEGER, lob_type TEXT, data_text TEXT, data_blob BLOB, blob_crc INTEGER, blob_size INTEGER, comp_blob BLOB, comp_size INTEGER, created_at TEXT, updated_at TEXT, note TEXT, FOREIGN KEY(workflow_id) REFERENCES workflow(id));")' >> workflow2db.py
          echo '    c.execute("CREATE TABLE IF NOT EXISTS migration (id INTEGER PRIMARY KEY AUTOINCREMENT, workflow_id INTEGER, filename TEXT, migration_text TEXT, migration_type TEXT, db_type TEXT, created_at TEXT, updated_at TEXT, note TEXT, FOREIGN KEY(workflow_id) REFERENCES workflow(id));")' >> workflow2db.py
          echo '    c.execute("CREATE TABLE IF NOT EXISTS migration_result (id INTEGER PRIMARY KEY AUTOINCREMENT, sqlfile TEXT, db_type TEXT, sql_stmt TEXT, result TEXT, success INTEGER, executed_at TEXT, error_msg TEXT);")' >> workflow2db.py
          echo '    c.execute("CREATE INDEX IF NOT EXISTS idx_workflow_filename ON workflow(filename);")' >> workflow2db.py
          echo '    c.execute("CREATE INDEX IF NOT EXISTS idx_job_workflow_id ON job(workflow_id);")' >> workflow2db.py
          echo '    c.execute("CREATE INDEX IF NOT EXISTS idx_lob_type ON workflow_lob(lob_type);")' >> workflow2db.py
          echo '    c.execute("CREATE INDEX IF NOT EXISTS idx_migration_type ON migration(migration_type);")' >> workflow2db.py
          echo '    c.execute("CREATE INDEX IF NOT EXISTS idx_migration_dbtype ON migration(db_type);")' >> workflow2db.py
          echo '    c.execute("CREATE INDEX IF NOT EXISTS idx_sqlfile ON migration_result(sqlfile);")' >> workflow2db.py
          echo '    conn.commit()' >> workflow2db.py
          echo '    conn.close()' >> workflow2db.py
          echo '' >> workflow2db.py
          echo 'def parse_workflows():' >> workflow2db.py
          echo '    files = [f for f in os.listdir(WORKFLOWS_DIR) if f.endswith(".yml") or f.endswith(".yaml")]' >> workflow2db.py
          echo '    workflows = []' >> workflow2db.py
          echo '    migration_keywords = ["db", "database", "schema", "sql", "migrate", "migration", "upgrade", "alter"]' >> workflow2db.py
          echo '    db_types = ["mysql", "postgresql", "mariadb", "sqlite", "mssql", "oracle"]' >> workflow2db.py
          echo '    upgrade_lines = []' >> workflow2db.py
          echo '    for filename in files:' >> workflow2db.py
          echo '        path = os.path.join(WORKFLOWS_DIR, filename)' >> workflow2db.py
          echo '        with open(path, "rb") as frb:' >> workflow2db.py
          echo '            raw_bytes = frb.read()' >> workflow2db.py
          echo '        with open(path, "r", encoding="utf-8") as f:' >> workflow2db.py
          echo '            try:' >> workflow2db.py
          echo '                y = yaml.safe_load(f)' >> workflow2db.py
          echo '            except Exception as e:' >> workflow2db.py
          echo '                print(f"[WARN] {filename} 파싱 실패: {e}")' >> workflow2db.py
          echo '                continue' >> workflow2db.py
          echo '            if not y:' >> workflow2db.py
          echo '                continue' >> workflow2db.py
          echo '            name = y.get("name", "")' >> workflow2db.py
          echo '            triggers = list(y.get("on", {}).keys()) if isinstance(y.get("on"), dict) else y.get("on")' >> workflow2db.py
          echo '            jobs = y.get("jobs", {})' >> workflow2db.py
          echo '            with open(path, "r", encoding="utf-8") as fr:' >> workflow2db.py
          echo '                raw_yaml = fr.read()' >> workflow2db.py
          echo '            yaml_crc = binascii.crc32(raw_bytes)' >> workflow2db.py
          echo '            yaml_size = len(raw_bytes)' >> workflow2db.py
          echo '            comp_blob = zlib.compress(raw_bytes)' >> workflow2db.py
          echo '            comp_size = len(comp_blob)' >> workflow2db.py
          echo '            migration_sections = []' >> workflow2db.py
          echo '            db_type_found = ""' >> workflow2db.py
          echo '            for db_type in db_types:' >> workflow2db.py
          echo '                if db_type in raw_yaml.lower():' >> workflow2db.py
          echo '                    db_type_found = db_type' >> workflow2db.py
          echo '                    break' >> workflow2db.py
          echo '            for k in migration_keywords:' >> workflow2db.py
          echo '                if k in raw_yaml.lower():' >> workflow2db.py
          echo '                    migration_sections.append(k)' >> workflow2db.py
          echo '            migration_texts = []' >> workflow2db.py
          echo '            if migration_sections:' >> workflow2db.py
          echo '                for line in raw_yaml.split("\\n"):' >> workflow2db.py
          echo '                    lowerline = line.lower()' >> workflow2db.py
          echo '                    if any(kw in lowerline for kw in migration_sections):' >> workflow2db.py
          echo '                        migration_texts.append(line.strip())' >> workflow2db.py
          echo '                        if "alter table" in lowerline or "upgrade" in lowerline or ("create table" in lowerline and "if not exists" not in lowerline):' >> workflow2db.py
          echo '                            upgrade_lines.append((db_type_found, line.strip()))' >> workflow2db.py
          echo '            workflows.append({' >> workflow2db.py
          echo '                "filename": filename,' >> workflow2db.py
          echo '                "name": name,' >> workflow2db.py
          echo '                "triggers": triggers,' >> workflow2db.py
          echo '                "jobs": jobs,' >> workflow2db.py
          echo '                "raw_yaml": raw_yaml,' >> workflow2db.py
          echo '                "raw_yaml_blob": raw_bytes,' >> workflow2db.py
          echo '                "yaml_crc": yaml_crc,' >> workflow2db.py
          echo '                "yaml_size": yaml_size,' >> workflow2db.py
          echo '                "comp_blob": comp_blob,' >> workflow2db.py
          echo '                "comp_size": comp_size,' >> workflow2db.py
          echo '                "migration_lines": migration_texts,' >> workflow2db.py
          echo '                "db_type": db_type_found' >> workflow2db.py
          echo '            })' >> workflow2db.py
          echo '    return workflows, upgrade_lines' >> workflow2db.py
          echo '' >> workflow2db.py
          echo 'def save_to_db(workflows):' >> workflow2db.py
          echo '    conn = sqlite3.connect(DB_PATH)' >> workflow2db.py
          echo '    c = conn.cursor()' >> workflow2db.py
          echo '    now = datetime.now().isoformat()' >> workflow2db.py
          echo '    c.execute("BEGIN TRANSACTION;")' >> workflow2db.py
          echo '    for wf in workflows:' >> workflow2db.py
          echo '        c.execute("INSERT INTO workflow (filename, name, triggers, created_at, updated_at, raw_yaml, raw_yaml_blob, yaml_crc, yaml_size) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)", (wf["filename"], wf["name"], str(wf["triggers"]), now, now, wf["raw_yaml"], wf["raw_yaml_blob"], wf["yaml_crc"], wf["yaml_size"]))' >> workflow2db.py
          echo '        wf_id = c.lastrowid' >> workflow2db.py
          echo '        c.execute("INSERT INTO workflow_lob (workflow_id, lob_type, data_text, data_blob, blob_crc, blob_size, comp_blob, comp_size, created_at, updated_at, note) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)", (wf_id, "yaml", wf["raw_yaml"], wf["raw_yaml_blob"], wf["yaml_crc"], wf["yaml_size"], wf["comp_blob"], wf["comp_size"], now, now, "full yaml lob"))' >> workflow2db.py
          echo '        for line in wf.get("migration_lines", []):' >> workflow2db.py
          echo '            c.execute("INSERT INTO migration (workflow_id, filename, migration_text, migration_type, db_type, created_at, updated_at, note) VALUES (?, ?, ?, ?, ?, ?, ?, ?)", (wf_id, wf["filename"], line, "auto", wf.get("db_type", ""), now, now, "db/migration keyword"))' >> workflow2db.py
          echo '        for job_name, job_info in wf["jobs"].items():' >> workflow2db.py
          echo '            job_yaml = str(job_info)' >> workflow2db.py
          echo '            job_yaml_blob = bytes(job_yaml, "utf-8")' >> workflow2db.py
          echo '            job_crc = binascii.crc32(job_yaml_blob)' >> workflow2db.py
          echo '            job_size = len(job_yaml_blob)' >> workflow2db.py
          echo '            c.execute("INSERT INTO job (workflow_id, job_name, runs_on, created_at, updated_at, job_yaml, job_yaml_blob, job_crc, job_size) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)", (wf_id, job_name, job_info.get("runs-on", ""), now, now, job_yaml, job_yaml_blob, job_crc, job_size))' >> workflow2db.py
          echo '    c.execute("COMMIT;")' >> workflow2db.py
          echo '    conn.commit()' >> workflow2db.py
          echo '    conn.close()' >> workflow2db.py
          echo '' >> workflow2db.py
          echo 'def execute_sqlfiles(db_type_set):' >> workflow2db.py
          echo '    conn = sqlite3.connect(DB_PATH)' >> workflow2db.py
          echo '    c = conn.cursor()' >> workflow2db.py
          echo '    now = datetime.now().isoformat()' >> workflow2db.py
          echo '    if not os.path.exists(SQL_DIR):' >> workflow2db.py
          echo '        return' >> workflow2db.py
          echo '    sqlfiles = [f for f in os.listdir(SQL_DIR) if f.endswith(".sql")]' >> workflow2db.py
          echo '    for sqlfile in sqlfiles:' >> workflow2db.py
          echo '        lowerfile = sqlfile.lower()' >> workflow2db.py
          echo '        file_dbtype = None' >> workflow2db.py
          echo '        for dbtype in ["mysql", "postgresql", "sqlite", "oracle", "mariadb", "mssql"]:' >> workflow2db.py
          echo '            if dbtype in lowerfile:' >> workflow2db.py
          echo '                file_dbtype = dbtype' >> workflow2db.py
          echo '                break' >> workflow2db.py
          echo '        if file_dbtype and file_dbtype not in db_type_set:' >> workflow2db.py
          echo '            continue' >> workflow2db.py
          echo '        with open(os.path.join(SQL_DIR, sqlfile), "r", encoding="utf-8") as f:' >> workflow2db.py
          echo '            sql_raw = f.read()' >> workflow2db.py
          echo '            # 다중 ALTER/CREATE/DDL도 모두 세미콜론으로 분리 실행' >> workflow2db.py
          echo '            sql_stmts = [s.strip() for s in sql_raw.split(";") if s.strip()]' >> workflow2db.py
          echo '            for stmt in sql_stmts:' >> workflow2db.py
          echo '                # DB별 업그레이드 룰 예시' >> workflow2db.py
          echo '                if file_dbtype == "mysql":' >> workflow2db.py
          echo '                    stmt = stmt.replace("AUTO_INCREMENT", "AUTOINCREMENT").replace("`", "\"")' >> workflow2db.py
          echo '                elif file_dbtype == "postgresql":' >> workflow2db.py
          echo '                    stmt = stmt.replace("SERIAL", "INTEGER").replace("::", "")' >> workflow2db.py
          echo '                elif file_dbtype == "oracle":' >> workflow2db.py
          echo '                    stmt = stmt.replace("NUMBER", "INTEGER")' >> workflow2db.py
          echo '                elif file_dbtype == "mssql":' >> workflow2db.py
          echo '                    stmt = stmt.replace("IDENTITY(1,1)", "AUTOINCREMENT")' >> workflow2db.py
          echo '                # SQLite는 그대로 실행' >> workflow2db.py
          echo '                try:' >> workflow2db.py
          echo '                    c.execute(stmt)' >> workflow2db.py
          echo '                    conn.commit()' >> workflow2db.py
          echo '                    c.execute("INSERT INTO migration_result (sqlfile, db_type, sql_stmt, result, success, executed_at, error_msg) VALUES (?, ?, ?, ?, ?, ?, ?)", (sqlfile, file_dbtype, stmt, "ok", 1, now, ""))' >> workflow2db.py
          echo '                except Exception as e:' >> workflow2db.py
          echo '                    c.execute("INSERT INTO migration_result (sqlfile, db_type, sql_stmt, result, success, executed_at, error_msg) VALUES (?, ?, ?, ?, ?, ?, ?)", (sqlfile, file_dbtype, stmt, "error", 0, now, str(e)))' >> workflow2db.py
          echo '    conn.commit()' >> workflow2db.py
          echo '    conn.close()' >> workflow2db.py
          echo '' >> workflow2db.py
          echo 'def auto_upgrade_sql(upgrade_lines):' >> workflow2db.py
          echo '    conn = sqlite3.connect(DB_PATH)' >> workflow2db.py
          echo '    c = conn.cursor()' >> workflow2db.py
          echo '    now = datetime.now().isoformat()' >> workflow2db.py
          echo '    for dbtype, line in upgrade_lines:' >> workflow2db.py
          echo '        stmt = line' >> workflow2db.py
          echo '        # DB별 업그레이드 룰 반영' >> workflow2db.py
          echo '        if dbtype == "mysql":' >> workflow2db.py
          echo '            stmt = stmt.replace("AUTO_INCREMENT", "AUTOINCREMENT").replace("`", "\"")' >> workflow2db.py
          echo '        elif dbtype == "postgresql":' >> workflow2db.py
          echo '            stmt = stmt.replace("SERIAL", "INTEGER").replace("::", "")' >> workflow2db.py
          echo '        elif dbtype == "oracle":' >> workflow2db.py
          echo '            stmt = stmt.replace("NUMBER", "INTEGER")' >> workflow2db.py
          echo '        elif dbtype == "mssql":' >> workflow2db.py
          echo '            stmt = stmt.replace("IDENTITY(1,1)", "AUTOINCREMENT")' >> workflow2db.py
          echo '        try:' >> workflow2db.py
          echo '            c.execute(stmt)' >> workflow2db.py
          echo '            conn.commit()' >> workflow2db.py
          echo '            c.execute("INSERT INTO migration_result (sqlfile, db_type, sql_stmt, result, success, executed_at, error_msg) VALUES (?, ?, ?, ?, ?, ?, ?)", ("AUTO_UPGRADE", dbtype, stmt, "ok", 1, now, ""))' >> workflow2db.py
          echo '        except Exception as e:' >> workflow2db.py
          echo '            c.execute("INSERT INTO migration_result (sqlfile, db_type, sql_stmt, result, success, executed_at, error_msg) VALUES (?, ?, ?, ?, ?, ?, ?)", ("AUTO_UPGRADE", dbtype, stmt, "error", 0, now, str(e)))' >> workflow2db.py
          echo '    conn.commit()' >> workflow2db.py
          echo '    conn.close()' >> workflow2db.py
          echo '' >> workflow2db.py
          echo 'if __name__ == "__main__":' >> workflow2db.py
          echo '    init_db()' >> workflow2db.py
          echo '    workflows, upgrade_lines = parse_workflows()' >> workflow2db.py
          echo '    save_to_db(workflows)' >> workflow2db.py
          echo '    db_type_set = set([w.get("db_type") for w in workflows if w.get("db_type")])' >> workflow2db.py
          echo '    execute_sqlfiles(db_type_set)' >> workflow2db.py
          echo '    auto_upgrade_sql(upgrade_lines)' >> workflow2db.py
          echo '    print(f"[OK] {len(workflows)}개 워크플로우 DB+LOB+Migration+SQL+자동업그레이드(다중ALTER/DB별정책) 완료! (DB: {DB_PATH})")' >> workflow2db.py

      - name: 🧪 파이썬 및 패키지 설치 (pip)
        run: |
          echo "sudo apt-get update -y"
          sudo apt-get update -y
          echo "sudo apt-get install -y python3-pip"
          sudo apt-get install -y python3-pip
          echo "pip install --upgrade pip"
          pip install --upgrade pip
          echo "pip install -r requirements.txt"
          pip install -r requirements.txt

      - name: 🚀 workflow2db.py 실행 (DB별/SQL/다중ALTER/업그레이드)
        run: |
          echo '[실행] workflow2db.py (SQL자동실행/다중ALTER/DB별업그레이드)'
          python3 workflow2db.py

      - name: 📂 결과 확인 (.github/workflows.db, 업그레이드 적용)
        run: |
          echo '[결과] .github/workflows.db 및 migration_result 업그레이드 정보'
          ls -lh .github/workflows.db
          echo '.tables' | sqlite3 .github/workflows.db
          echo 'PRAGMA table_info(migration_result);' | sqlite3 .github/workflows.db
          echo 'SELECT * FROM migration_result ORDER BY id DESC LIMIT 20;' | sqlite3 .github/workflows.db
