# 워크플로우의 이름 설정
name: Network Status Check

# 워크플로우를 실행할 조건 설정
# 여기서는 30분마다, 그리고 'workflow_dispatch'로 수동 실행 가능하게 설정
on:
  # 매일 UTC 기준 00:00(KST 09:00)에 실행
  schedule:
    - cron: '0 0 * * *'
  # GitHub UI에서 'Run workflow' 버튼으로 수동 실행 가능
  workflow_dispatch:

# 워크플로우에서 실행할 작업(jobs) 정의
jobs:
  # 'check_netstat'라는 이름의 작업 정의
  check_netstat:
    # 이 작업이 실행될 환경(운영체제) 설정
    runs-on: ubuntu-latest

    # 작업 순서(steps) 정의
    steps:
      # 1. 레포지토리 체크아웃 (코드가 필요할 경우)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. netstat 명령어 실행 및 결과 로그에 출력
      - name: Run netstat and check ports
        # 셸 명령어를 실행. 각 OS에 맞게 실행됩니다.
        run: |
          echo "========================================"
          echo "Dumping all TCP listening ports..."
          echo "========================================"
          # Linux 환경이므로 `netstat -lntp` 명령어를 사용
          # 권한이 필요한 `-p` 옵션은 생략하거나 sudo를 사용해야 함
          netstat -lnt

          echo "========================================"
          echo "Dumping all established connections..."
          echo "========================================"
          # 모든 활성 연결을 확인
          netstat -ant | grep ESTABLISHED

          echo "========================================"
          echo "Dumping connections per state..."
          echo "========================================"
          # 연결 상태별 개수 집계
          netstat -ant | awk '{print $6}' | sort | uniq -c | sort -n

      # 3. (선택 사항) 특정 포트 상태 확인
      - name: Check a specific port (e.g., Port 80)
        run: |
          PORT_TO_CHECK="80"
          if netstat -lnt | grep ":$PORT_TO_CHECK\s*LISTEN"; then
            echo "✅ Port $PORT_TO_CHECK is listening."
          else
            echo "❌ Port $PORT_TO_CHECK is NOT listening."
            # 실패 시 워크플로우를 실패 상태로 만들 수 있음
            exit 1
          fi
