name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '34 20 * * 2'
  push:
    branches: [ "main" ]

permissions:
  security-events: write
  contents: read

jobs:
  osv-scan:
    name: 🛡️ OSV-Scanner Simplified
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Update & Install Required Packages (safe mode)
        run: |
          echo "[+] Updating APT and preparing environment..."
          sudo apt-get update -y

          echo "[!] Removing problematic firefox snap packages (if exist)..."
          sudo apt-get purge -y firefox || true
          sudo snap remove firefox || true
          sudo apt-mark hold firefox

          echo "[+] Upgrading packages..."
          sudo apt-get upgrade -y

          echo "[+] Installing: jq curl unzip git"
          sudo apt-get install -y jq curl unzip git

      - name: 🧪 Download and Run OSV Scanner (single attempt)
        run: |
          echo "[🧪] Downloading osv-scanner..."

          VERSION="1.7.1"
          FILENAME="osv-scanner"
          DOWNLOAD_URL="https://github.com/google/osv-scanner/releases/download/v${VERSION}/${FILENAME}"

          curl -sSL --fail "$DOWNLOAD_URL" -o $FILENAME

          echo "[🔐] Making osv-scanner executable..."
          chmod +x $FILENAME

          echo "[🚀] Running osv-scanner..."
          ./$FILENAME -r --skip-git ./ | tee osv-results.txt

      - name: 📁 Convert to SARIF
        run: |
          echo "[📄] Converting output to SARIF..."
          ./osv-scanner -r --skip-git ./ --format sarif > osv-results.sarif
          echo "[✔] SARIF saved to osv-results.sarif"
          head -n 15 osv-results.sarif

      - name: 📤 Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
