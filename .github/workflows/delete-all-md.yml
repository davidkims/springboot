name: 🧹 Delete all .md files and verify

on:
  workflow_dispatch:

jobs:
  delete-md-files:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout springboot repository
        uses: actions/checkout@v4
        with:
          repository: 'davidkims/springboot'
          # token: ${{ secrets.YOUR_GITHUB_TOKEN }}  # private 리포는 주석 해제

      - name: 🕵️ 삭제 전 모든 .md 파일 목록 출력
        run: |
          echo "echo '[🔍] 삭제 전 .md 파일 목록:'"
          echo '[🔍] 삭제 전 .md 파일 목록:'
          find . -type f -name '*.md' | tee md_files_before.txt
          echo "echo '-----------------------------'"
          echo '-----------------------------'

      - name: 🗑️ Delete all *.md files (all directories)
        run: |
          echo "echo '[🗑️] .md 확장자로 끝나는 모든 파일 삭제 시작...'"
          echo '[🗑️] .md 확장자로 끝나는 모든 파일 삭제 시작...'
          find . -type f -name '*.md' -print -exec echo "rm {}" \; -exec rm {} \;
          echo "echo '[🗑️] 삭제 완료!'"
          echo '[🗑️] 삭제 완료!'

      - name: 🕵️ 삭제 후 .md 파일 목록 출력 (잔존 검사)
        run: |
          echo "echo '[🔍] 삭제 후 .md 파일 목록:'"
          echo '[🔍] 삭제 후 .md 파일 목록:'
          find . -type f -name '*.md' | tee md_files_after.txt
          echo "echo '-----------------------------'"
          echo '-----------------------------'

      - name: 📂 삭제 후 전체 파일 트리 출력 (상위 3레벨)
        run: |
          echo "echo '[📂] 삭제 후 디렉토리/파일 구조 (상위 3레벨):'"
          echo '[📂] 삭제 후 디렉토리/파일 구조 (상위 3레벨):'
          tree -L 3 || find . | head -100
