name: DB CLI & Virtual Account Infinite Robust Automation (All Robust/용량체크/출력보장)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  db-cli-virtual-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DBCLI_DIR: .github/dbcli
      OUTPUT_DIR: .github/dbcli/output
      VA_DIR: .github/dbcli/virtual_accounts
      ORDER_DIR: .github/dbcli/orders
      USER_DIR: .github/dbcli/users
      TMP_SAFE_DIR: /tmp/dbcli_safe_tmp
      MIN_FREE_MB: 500

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 📂 Robust Directory & Sample/User File Infinite Creation (용량체크)
        run: |
          check_free() {
            DIR="$1"
            MB=$(df -Pm "$DIR" | awk 'NR==2 {print $4}')
            if [ "$MB" -lt "$MIN_FREE_MB" ]; then
              echo "[❗][용량] $DIR 디스크 여유 $MB MB → $MIN_FREE_MB MB 이상 필요, 10초 후 재시도"
              df -h "$DIR"
              sleep 10
              return 1
            else
              echo "[✅][용량] $DIR 여유 $MB MB"
              return 0
            fi
          }
          robust_mkdir() {
            TARGET="$1"
            while true; do
              check_free "$TARGET" || continue
              mkdir -p "$TARGET" && chmod 700 "$TARGET" && echo "[✅][∞] $TARGET 생성 성공" && break
              echo "[⚠️][∞] $TARGET 생성 실패 (재시도)"
              sleep 1
            done
          }
          robust_echo() {
            CONTENT="$1"
            TARGET="$2"
            while true; do
              DIR=$(dirname "$TARGET")
              check_free "$DIR" || continue
              echo "[🔁][∞] $TARGET 파일 echo 생성 시도"
              echo "$CONTENT" > "$TARGET" && chmod 600 "$TARGET" && echo "[✅][∞] $TARGET 파일 생성 성공" && break
              echo "[⚠️][∞] $TARGET 파일 생성 실패 (재시도)"
              sleep 1
            done
          }
          robust_mkdir "$DBCLI_DIR/mysql"
          robust_mkdir "$DBCLI_DIR/mariadb"
          robust_mkdir "$DBCLI_DIR/postgresql"
          robust_mkdir "$DBCLI_DIR/sqlite"
          robust_mkdir "$DBCLI_DIR/redis"
          robust_mkdir "$DBCLI_DIR/clickhouse"
          robust_mkdir "$DBCLI_DIR/firebird"
          robust_mkdir "$DBCLI_DIR/db2"
          robust_mkdir "$OUTPUT_DIR"
          robust_mkdir "$VA_DIR"
          robust_mkdir "$TMP_SAFE_DIR"
          robust_mkdir "$ORDER_DIR"
          robust_mkdir "$USER_DIR"

          [ -f $DBCLI_DIR/mysql/demo.sql ]      || robust_echo "SELECT VERSION();"        $DBCLI_DIR/mysql/demo.sql
          [ -f $DBCLI_DIR/mariadb/demo.sql ]    || robust_echo "SELECT VERSION();"        $DBCLI_DIR/mariadb/demo.sql
          [ -f $DBCLI_DIR/postgresql/demo.sql ] || robust_echo "SELECT version();"        $DBCLI_DIR/postgresql/demo.sql
          [ -f $DBCLI_DIR/sqlite/demo.sql ]     || robust_echo "SELECT sqlite_version();" $DBCLI_DIR/sqlite/demo.sql
          [ -f $DBCLI_DIR/redis/demo.redis ]    || { robust_echo "PING" $DBCLI_DIR/redis/demo.redis; echo "INFO" >> $DBCLI_DIR/redis/demo.redis; chmod 600 $DBCLI_DIR/redis/demo.redis; }
          [ -f $DBCLI_DIR/clickhouse/demo.sql ] || robust_echo "SELECT version();"        $DBCLI_DIR/clickhouse/demo.sql
          [ -f $DBCLI_DIR/firebird/demo.sql ]   || robust_echo "SELECT * FROM RDB$DATABASE;" $DBCLI_DIR/firebird/demo.sql
          [ -f $DBCLI_DIR/db2/demo.sql ]        || robust_echo "SELECT service_level, fixpack_num FROM sysibmadm.env_inst_info;" $DBCLI_DIR/db2/demo.sql

          robust_echo "user_id,user_name,permission,enabled" "$USER_DIR/users.csv"
          robust_echo "U001,홍길동,ADMIN,1" "$USER_DIR/users.csv"
          robust_echo "U002,김철수,USER,1" "$USER_DIR/users.csv"
          robust_echo "U003,이영희,USER,0" "$USER_DIR/users.csv"

          echo "[🧹][∞] 기존 가상계좌 파일 전체 삭제"
          rm -f $VA_DIR/virtual_accounts_*.txt
          TS=$(date '+%Y%m%d_%H%M%S')
          VA_FILE="$TMP_SAFE_DIR/virtual_accounts_${TS}_$$.txt"
          robust_echo "account_id,account_number,customer_name,bank_code,open_date" "$VA_FILE"
          for i in $(seq 1 10000); do
            ACC_NUM="7000$(printf '%07d' $i)"
            CUST="User$(printf '%05d' $i)"
            BANK="B$(printf '%04d' $((1000 + ($i % 9000))))"
            DATE="$(date '+%Y-%m-%d')"
            echo "VA${i},${ACC_NUM},${CUST},${BANK},${DATE}" >> "$VA_FILE"
          done
          chmod 600 "$VA_FILE"
          mv "$VA_FILE" "$VA_DIR/"
          echo "[✅][∞] $VA_FILE → $VA_DIR 이동 및 권한 최소화"
          ls -lh $VA_DIR/virtual_accounts_*.txt
          rm -rf $TMP_SAFE_DIR

      - name: 🏃 DB CLI Install & Run Infinite Retry (Firebird robust output)
        run: |
          MIN_FREE_MB=500
          check_free() {
            DIR="$1"
            MB=$(df -Pm "$DIR" | awk 'NR==2 {print $4}')
            if [ "$MB" -lt "$MIN_FREE_MB" ]; then
              echo "[❗][용량] $DIR 디스크 여유 $MB MB → $MIN_FREE_MB MB 이상 필요, 10초 후 재시도"
              df -h "$DIR"
              sleep 10
              return 1
            else
              echo "[✅][용량] $DIR 여유 $MB MB"
              return 0
            fi
          }
          robust_mkdir() {
            TARGET="$1"
            while true; do
              check_free "$TARGET" || continue
              mkdir -p "$TARGET" && chmod 700 "$TARGET" && break
              sleep 1
            done
          }
          robust_touch() {
            FILE="$1"
            DIR=$(dirname "$FILE")
            robust_mkdir "$DIR"
            while true; do
              check_free "$DIR" || continue
              touch "$FILE" && chmod 600 "$FILE" && break
              sleep 1
            done
          }
          is_service_pkg() {
            case "$1" in
              mysql-client|mariadb-client|postgresql-client|redis-tools|clickhouse-client|firebird-utils|db2-client) return 0 ;;
              *) return 1 ;;
            esac
          }
          retry_install_infinite() {
            PKG="$1"
            CMD="$2"
            DESC="$3"
            while true; do
              check_free "/" || continue
              echo "[🔁][∞] $PKG 설치 시도 (999999999999%)"
              sudo apt-get update -y
              sudo apt-get install -y "$PKG" && command -v "$CMD" && echo "[✅][∞] $PKG ($DESC) 설치 성공"
              if command -v "$CMD" > /dev/null; then
                if is_service_pkg "$PKG"; then
                  echo "[🔄][∞] $PKG 설치 후 systemctl daemon-reload"
                  sudo systemctl daemon-reload && echo "[✅][∞] systemctl daemon-reload 성공" || echo "[❗][∞] systemctl daemon-reload 실패"
                fi
                break
              fi
              echo "[⚠️][∞] $PKG ($DESC) 설치 실패 (재시도)"
              sleep 1
            done
          }
          run_or_generate_and_retry_infinite() {
            PKG="$1"
            CMD="$2"
            DESC="$3"
            FILE="$4"
            GEN="$5"
            OUT="$6"
            robust_mkdir "$(dirname "$OUT")"
            robust_touch "$OUT"
            while [ ! -f "$FILE" ]; do
              DIR=$(dirname "$FILE")
              check_free "$DIR" || continue
              echo "[🔁][∞] $DESC 샘플 파일 없음. 안전 임시파일 생성"
              eval "$GEN > \$FILE" && chmod 600 "$FILE" && echo "[✅][∞] $FILE 생성 성공" && break
              echo "[⚠️][∞] $FILE 생성 실패 (재시도)"
              sleep 1
            done
            if ! command -v "$CMD" > /dev/null; then
              check_free "/" || continue
              echo "[AUTO][∞] $CMD 미설치. 무한 재시도 설치"
              retry_install_infinite "$PKG" "$CMD" "$DESC"
            fi
            if command -v "$CMD" > /dev/null && [ -f "$FILE" ]; then
              if [ "$CMD" = "isql-fb" ]; then
                echo "[⚠️][∞] Firebird isql-fb는 --version 미지원. 직접 DB 연결 없이 테스트 생략. (출력 빈파일 robust 생성)"
                echo "[info] Firebird CLI 샘플은 연결정보 필요. 실행 생략됨." > "$OUT"
                chmod 600 "$OUT"
              else
                $CMD --version || true
                case "$CMD" in
                  mysql|mariadb)
                    sudo $CMD -u root < "$FILE" > "$OUT" 2>&1 || echo "[⚠️][∞] $DESC 실행 실패"
                    ;;
                  psql)
                    sudo -u postgres psql -f "$FILE" > "$OUT" 2>&1 || echo "[⚠️][∞] PostgreSQL 실행 실패"
                    ;;
                  sqlite3)
                    sqlite3 :memory: < "$FILE" > "$OUT" 2>&1 || echo "[⚠️][∞] SQLite 실행 실패"
                    ;;
                  redis-cli)
                    while read line; do redis-cli $line; done < "$FILE" > "$OUT" 2>&1 || echo "[⚠️][∞] Redis 실행 실패"
                    ;;
                  clickhouse-client)
                    clickhouse-client --multiquery < "$FILE" > "$OUT" 2>&1 || echo "[⚠️][∞] ClickHouse 실행 실패"
                    ;;
                esac
                chmod 600 "$OUT"
              fi
            else
              echo "[❌][∞] $DESC 실행불가(설치/샘플파일 모두 없음)"
              echo "[info] 실행불가" > "$OUT"
              chmod 600 "$OUT"
            fi
          }
          run_or_generate_and_retry_infinite "mysql-client" "mysql" "MySQL" "$DBCLI_DIR/mysql/demo.sql" "echo 'SELECT VERSION();'" "$OUTPUT_DIR/mysql_demo.out"
          run_or_generate_and_retry_infinite "mariadb-client" "mariadb" "MariaDB" "$DBCLI_DIR/mariadb/demo.sql" "echo 'SELECT VERSION();'" "$OUTPUT_DIR/mariadb_demo.out"
          run_or_generate_and_retry_infinite "postgresql-client" "psql" "PostgreSQL" "$DBCLI_DIR/postgresql/demo.sql" "echo 'SELECT version();'" "$OUTPUT_DIR/psql_demo.out"
          run_or_generate_and_retry_infinite "sqlite3" "sqlite3" "SQLite" "$DBCLI_DIR/sqlite/demo.sql" "echo 'SELECT sqlite_version();'" "$OUTPUT_DIR/sqlite_demo.out"
          run_or_generate_and_retry_infinite "redis-tools" "redis-cli" "Redis" "$DBCLI_DIR/redis/demo.redis" "echo -e 'PING\nINFO'" "$OUTPUT_DIR/redis_demo.out"
          run_or_generate_and_retry_infinite "clickhouse-client" "clickhouse-client" "ClickHouse" "$DBCLI_DIR/clickhouse/demo.sql" "echo 'SELECT version();'" "$OUTPUT_DIR/clickhouse_demo.out"
          run_or_generate_and_retry_infinite "firebird-utils" "isql-fb" "Firebird" "$DBCLI_DIR/firebird/demo.sql" "echo 'SELECT * FROM RDB\$DATABASE;'" "$OUTPUT_DIR/firebird_demo.out"
          run_or_generate_and_retry_infinite "db2-client" "db2" "DB2" "$DBCLI_DIR/db2/demo.sql" "echo 'SELECT service_level, fixpack_num FROM sysibmadm.env_inst_info;'" "$OUTPUT_DIR/db2_demo.out"

          find /tmp -maxdepth 1 -type d -name "dbcli_safe_tmp*" -exec rm -rf {} +
          find $HOME -type f -name "*.tmp" -delete
          find . -type f -name "*~" -delete
          echo "[✅][∞] 임시파일/디렉토리/백업 삭제, 데이터 누수 방지 완료"

      - name: 💳 Virtual Account Payment Infinite Robust Automation (사용자/조건 시나리오, 용량체크)
        run: |
          MIN_FREE_MB=500
          check_free() {
            DIR="$1"
            MB=$(df -Pm "$DIR" | awk 'NR==2 {print $4}')
            if [ "$MB" -lt "$MIN_FREE_MB" ]; then
              echo "[❗][용량] $DIR 디스크 여유 $MB MB → $MIN_FREE_MB MB 이상 필요, 10초 후 재시도"
              df -h "$DIR"
              sleep 10
              return 1
            else
              echo "[✅][용량] $DIR 여유 $MB MB"
              return 0
            fi
          }
          robust_mkdir() {
            TARGET="$1"
            while true; do
              check_free "$TARGET" || continue
              mkdir -p "$TARGET" && chmod 700 "$TARGET" && break
              sleep 1
            done
          }
          robust_echo() {
            CONTENT="$1"
            TARGET="$2"
            while true; do
              DIR=$(dirname "$TARGET")
              check_free "$DIR" || continue
              echo "$CONTENT" > "$TARGET" && chmod 600 "$TARGET" && break
              sleep 1
            done
          }
          robust_mkdir "$ORDER_DIR"
          USER_FILE=".github/dbcli/users/users.csv"
          USER_ID="U001"
          USER_ENABLED=$(awk -F',' -v id="$USER_ID" '$1==id{print $4}' $USER_FILE)
          if [ "$USER_ENABLED" != "1" ]; then
            echo "[❌][∞] 사용자 $USER_ID 비활성. 결제 시나리오 스킵"
            exit 0
          fi
          while true; do
            ORDER_ID="ORD$(date +%H%M%S)$$"
            VA_FILE=$(ls -1t $VA_DIR/virtual_accounts_*.txt | head -n 1)
            [ -f "$VA_FILE" ] || { echo "[❌][∞] 가상계좌 파일 없음! (재시도)"; sleep 1; continue; }
            VA=$(awk 'NR==RANDOM%10000+2{print $2}' RANDOM=$(date +%S) $VA_FILE)
            AMOUNT=$((RANDOM%99000 + 1000))
            CUST=$(awk -F',' -v acc="$VA" '$2==acc{print $3}' $VA_FILE | head -n1)
            robust_echo "order_id,account_number,customer_name,amount,status,created_at" "$ORDER_DIR/order_${ORDER_ID}.csv"
            robust_echo "$ORDER_ID,$VA,$CUST,$AMOUNT,REQUEST,$(date '+%Y-%m-%d %H:%M:%S')" "$ORDER_DIR/order_${ORDER_ID}.csv"
            echo "[💳][∞] 주문생성: $ORDER_ID ($VA, $AMOUNT원)"
            sleep 5
            robust_echo "$ORDER_ID,$VA,$CUST,$AMOUNT,DEPOSITED,$(date '+%Y-%m-%d %H:%M:%S')" "$ORDER_DIR/order_${ORDER_ID}_paid.csv"
            echo "[🏦][∞] 입금완료: $ORDER_ID ($VA, $AMOUNT원)"
            sleep 5
            robust_echo "$ORDER_ID,$VA,$CUST,$AMOUNT,PAID,$(date '+%Y-%m-%d %H:%M:%S')" "$ORDER_DIR/order_${ORDER_ID}_completed.csv"
            echo "[✅][∞] 결제완료: $ORDER_ID ($VA, $AMOUNT원)"
            rm -f "$ORDER_DIR/order_${ORDER_ID}.csv" "$ORDER_DIR/order_${ORDER_ID}_paid.csv"
            ls -lh $ORDER_DIR
            break
          done

      - name: 📝 Show Output Directory Structure & Virtual Account/Order/User File
        run: |
          echo "[📝][∞] $OUTPUT_DIR 디렉토리와 파일 리스트"
          tree $OUTPUT_DIR || ls -R $OUTPUT_DIR
          echo "[📝][∞] 가상계좌 생성 결과:"
          ls -lh $VA_DIR || true
          head -5 $VA_DIR/virtual_accounts_*.txt || true
          echo "[📝][∞] 결제 완료된 주문 파일:"
          ls -lh $ORDER_DIR || true
          head -5 $ORDER_DIR/order_*_completed.csv || true
          echo "[📝][∞] 사용자 목록 파일:"
          cat .github/dbcli/users/users.csv || true
