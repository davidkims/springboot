name: 🟦 AWS CLI Install Test

on:
  workflow_dispatch:

jobs:
  awscli-install:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟦 [echo] AWS CLI 설치 (최신 v2, 공식)
        run: |
          echo "echo '[🟦] AWS CLI 설치 시작...'"
          echo '[🟦] AWS CLI 설치 시작...'

          echo "echo '[🟦] 필요 패키지 설치...'"
          echo '[🟦] 필요 패키지 설치...'
          sudo apt-get update -y
          sudo apt-get install -y unzip curl

          echo "echo '[🟦] AWS CLI v2 다운로드...'"
          echo '[🟦] AWS CLI v2 다운로드...'
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"

          echo "echo '[🟦] 압축 해제...'"
          echo '[🟦] 압축 해제...'
          unzip -q awscliv2.zip

          echo "echo '[🟦] AWS CLI 설치...'"
          echo '[🟦] AWS CLI 설치...'
          sudo ./aws/install --update

          echo "echo '[🟦] 버전 확인...'"
          echo '[🟦] 버전 확인...'
          aws --version
