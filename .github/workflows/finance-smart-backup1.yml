name: "🔐 MEGA Secure CI + AutoUP + EchoOps + Pages + Backups + Security + ServiceFiles (ULTRA+++ ECHO FULL)"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/1 * * * *"

permissions:
  contents: write
  pull-requests: write
  id-token: write
  security-events: write
  pages: write

concurrency:
  group: mega-secure-ci
  cancel-in-progress: true

jobs:
  mega-secure-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    env:
      DB_USER: root
      DB_PASS: rootpass123
      DB_NAME: sample_db
      SPARK_VERSION: "3.5.1"
      VAULT_VERSION: "1.15.2"
      VAULT_DEV_TOKEN: root-token-123

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      # 1) 디렉토리 전부 echo 스크립트로 생성
      - name: 📁 Echo 디렉토리 생성
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .github/echo_logs
          exec > >(tee .github/echo_logs/01_create_dirs.log) 2>&1
          echo '#!/usr/bin/env bash' > .github/create_dirs.sh
          echo 'set -Eeuo pipefail' >> .github/create_dirs.sh
          echo 'DIRS="\
          .github/scripts .github/firewall .github/downloads \
          .github/echo_logs .github/echo_scorecard .github/echo_codeql .github/echo_security \
          .github/echo_upgrade .github/echo_autoup .github/echo_pages .github/echo_templates \
          .github/echo_backup .github/echo_monitoring .github/echo_services .github/echo_db \
          .github/echo_permissions .github/echo_containers .github/echo_auth \
          .github/services/mysql .github/services/postgres .github/services/redis \
          .github/services/kafka .github/services/vault .github/services/spark/cfg \
          .github/services/camunda .github/services/airflow/dags .github/services/auth \
          site/scorecard site/security site/upgrade site/pr site/backup site/html \
          site/containers site/logs site/templates site/downloads site/db_backup_html \
          site/spark_results site/auth"' >> .github/create_dirs.sh
          echo 'for d in $DIRS; do echo "[ECHO][mkdir] $d"; mkdir -p "$d"; done' >> .github/create_dirs.sh
          chmod +x .github/create_dirs.sh
          bash .github/create_dirs.sh

      # 2) 가상 계정 200명 echo → 파이썬 실행
      - name: 👥 가상 계정 200명 생성 (echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee .github/echo_logs/02_users.log) 2>&1
          echo '#!/usr/bin/env python3' > .github/echo_auth/gen_users.py
          echo 'import csv, random, string, json, os' >> .github/echo_auth/gen_users.py
          echo 'os.makedirs(".github/services/auth", exist_ok=True)' >> .github/echo_auth/gen_users.py
          echo 'os.makedirs("site/auth", exist_ok=True)' >> .github/echo_auth/gen_users.py
          echo 'users=[(f"user{str(i).zfill(3)}@example.local","".join(random.choices(string.ascii_letters+string.digits,k=16))) for i in range(1,201)]' >> .github/echo_auth/gen_users.py
          echo 'with open(".github/services/auth/users.csv","w",newline="") as f:' >> .github/echo_auth/gen_users.py
          echo '    w=csv.writer(f); w.writerow(["email","password"]); w.writerows(users)' >> .github/echo_auth/gen_users.py
          echo 'with open("site/auth/users.json","w") as f:' >> .github/echo_auth/gen_users.py
          echo '    json.dump([{"email":u,"password":p} for u,p in users], f, indent=2)' >> .github/echo_auth/gen_users.py
          chmod +x .github/echo_auth/gen_users.py
          python3 .github/echo_auth/gen_users.py
          echo "[ECHO] 가상 계정 200명 생성 완료"

      # 3) 서비스 초기 파일들 전부 echo로 생성
      - name: 🛠 서비스 초기 파일/설정 생성 (echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee .github/echo_logs/03_service_files.log) 2>&1

          # MySQL init.sql
          echo '#!/usr/bin/env bash' > .github/echo_services/mysql_init.sh
          echo 'cat > .github/services/mysql/init.sql <<SQL' >> .github/echo_services/mysql_init.sh
          echo 'CREATE DATABASE IF NOT EXISTS sample_db;' >> .github/echo_services/mysql_init.sh
          echo 'CREATE TABLE IF NOT EXISTS sample_db.test (id INT PRIMARY KEY, val VARCHAR(64));' >> .github/echo_services/mysql_init.sh
          echo 'INSERT INTO sample_db.test VALUES (1,"hello"),(2,"world") ON DUPLICATE KEY UPDATE val=VALUES(val);' >> .github/echo_services/mysql_init.sh
          echo 'SQL' >> .github/echo_services/mysql_init.sh
          chmod +x .github/echo_services/mysql_init.sh
          bash .github/echo_services/mysql_init.sh

          # Postgres init.sql
          echo '#!/usr/bin/env bash' > .github/echo_services/pg_init.sh
          echo 'cat > .github/services/postgres/init.sql <<SQL' >> .github/echo_services/pg_init.sh
          echo 'CREATE DATABASE sample_db;' >> .github/echo_services/pg_init.sh
          echo '\connect sample_db;' >> .github/echo_services/pg_init.sh
          echo 'CREATE TABLE IF NOT EXISTS test (id INT PRIMARY KEY, val VARCHAR(64));' >> .github/echo_services/pg_init.sh
          echo 'INSERT INTO test (id,val) VALUES (1,\'hello\'),(2,\'world\') ON CONFLICT (id) DO UPDATE SET val=EXCLUDED.val;' >> .github/echo_services/pg_init.sh
          echo 'SQL' >> .github/echo_services/pg_init.sh
          chmod +x .github/echo_services/pg_init.sh
          bash .github/echo_services/pg_init.sh

          # Redis conf
          echo '#!/usr/bin/env bash' > .github/echo_services/redis_conf.sh
          echo 'cat > .github/services/redis/redis.conf <<CONF' >> .github/echo_services/redis_conf.sh
          echo 'protected-mode no' >> .github/echo_services/redis_conf.sh
          echo 'port 6379' >> .github/echo_services/redis_conf.sh
          echo 'tcp-keepalive 300' >> .github/echo_services/redis_conf.sh
          echo 'save 300 10' >> .github/echo_services/redis_conf.sh
          echo 'appendonly yes' >> .github/echo_services/redis_conf.sh
          echo 'CONF' >> .github/echo_services/redis_conf.sh
          chmod +x .github/echo_services/redis_conf.sh
          bash .github/echo_services/redis_conf.sh

          echo "[ECHO] 서비스 파일 생성 완료"

      # 4) 기본 패키지/보안툴 설치 echo
      - name: 🔧 기본 패키지 & 보안툴 설치 (echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee .github/echo_logs/04_basics.log) 2>&1
          echo '#!/usr/bin/env bash' > .github/scripts/install_basics.sh
          echo 'set -Eeuo pipefail' >> .github/scripts/install_basics.sh
          echo 'sudo apt-get update -y' >> .github/scripts/install_basics.sh
          echo 'sudo apt-get install -y jq curl unzip tar git mysql-client postgresql-client default-jdk scala ufw iptables' >> .github/scripts/install_basics.sh
          echo 'python3 -m pip install --upgrade pip' >> .github/scripts/install_basics.sh
          echo 'pip install --no-cache-dir bandit pip-audit' >> .github/scripts/install_basics.sh
          chmod +x .github/scripts/install_basics.sh
          bash .github/scripts/install_basics.sh
          echo "[ECHO] 기본 패키지/보안툴 설치 완료"

      # 5) Docker 설치 echo
      - name: 🐳 Docker 설치 (echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee .github/echo_logs/05_docker.log) 2>&1
          echo '#!/usr/bin/env bash' > .github/scripts/install_docker.sh
          echo 'set -Eeuo pipefail' >> .github/scripts/install_docker.sh
          echo 'if ! command -v docker >/dev/null 2>&1; then curl -fsSL https://get.docker.com | sh; fi' >> .github/scripts/install_docker.sh
          echo 'sudo usermod -aG docker "$USER" || true' >> .github/scripts/install_docker.sh
          echo 'sudo docker --version || true' >> .github/scripts/install_docker.sh
          chmod +x .github/scripts/install_docker.sh
          bash .github/scripts/install_docker.sh
          echo "[ECHO] Docker 설치/확인 완료"

      # 6) 컨테이너 실행/초기화 echo (MySQL/Postgres/Redis)
      - name: 🐳 컨테이너 실행 + 초기화 (echo)
        shell: bash
        env:
          DB_USER: ${{ env.DB_USER }}
          DB_PASS: ${{ env.DB_PASS }}
          DB_NAME: ${{ env.DB_NAME }}
        run: |
          set -Eeuo pipefail
          exec > >(tee .github/echo_logs/06_containers.log) 2>&1
          echo '#!/usr/bin/env bash' > .github/echo_containers/run.sh
          echo 'set -Eeuo pipefail' >> .github/echo_containers/run.sh
          echo 'for c in mysql_ci postgres_ci redis_ci; do sudo docker rm -f "$c" >/dev/null 2>&1 || true; done' >> .github/echo_containers/run.sh
          echo 'sudo docker run -d --name mysql_ci -e MYSQL_ROOT_PASSWORD="'"$DB_PASS"'" -p 3306:3306 mysql:8.0.37' >> .github/echo_containers/run.sh
          echo 'sudo docker run -d --name postgres_ci -e POSTGRES_PASSWORD="'"$DB_PASS"'" -p 5432:5432 postgres:16.3' >> .github/echo_containers/run.sh
          echo 'sudo docker run -d --name redis_ci -p 6379:6379 -v "$PWD/.github/services/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro" redis:7.2.5 redis-server /usr/local/etc/redis/redis.conf' >> .github/echo_containers/run.sh
          echo 'sleep 12' >> .github/echo_containers/run.sh
          echo 'sudo docker exec -i mysql_ci  mysql -u"'"$DB_USER"'" -p"'"$DB_PASS"'" < .github/services/mysql/init.sql || echo "[WARN] MySQL init 실패"' >> .github/echo_containers/run.sh
          echo 'sudo docker exec -i postgres_ci psql -U postgres -f /dev/stdin < .github/services/postgres/init.sql || echo "[WARN] PostgreSQL init 실패"' >> .github/echo_containers/run.sh
          chmod +x .github/echo_containers/run.sh
          bash .github/echo_containers/run.sh
          echo "[ECHO] 컨테이너 실행/초기화 완료"

      # 7) DB 백업 + HTML 변환 echo
      - name: 🗄 DB 백업 + HTML 변환 (echo)
        shell: bash
        env:
          DB_USER: ${{ env.DB_USER }}
          DB_PASS: ${{ env.DB_PASS }}
          DB_NAME: ${{ env.DB_NAME }}
        run: |
          set -Eeuo pipefail
          exec > >(tee .github/echo_logs/07_backup.log) 2>&1
          echo '#!/usr/bin/env bash' > .github/echo_backup/backup.sh
          echo 'set -Eeuo pipefail' >> .github/echo_backup/backup.sh
          echo 'mkdir -p site/backup site/db_backup_html' >> .github/echo_backup/backup.sh
          echo 'mysqldump -h 127.0.0.1 -P 3306 -u"'"$DB_USER"'" -p"'"$DB_PASS"'" "'"$DB_NAME"'" > site/backup/mysqldump.sql || echo "[WARN] MySQL 백업 실패"' >> .github/echo_backup/backup.sh
          echo 'PGPASSWORD="'"$DB_PASS"'" pg_dump -h 127.0.0.1 -p 5432 -U postgres -d "'"$DB_NAME"'" > site/backup/pgdump.sql || echo "[WARN] PostgreSQL 백업 실패"' >> .github/echo_backup/backup.sh
          echo 'for f in site/backup/*; do [ -f "$f" ] || continue; b=$(basename "$f"); { echo "<html><body><h3>$b</h3><pre>"; sed -e "s/&/\&amp;/g" -e "s/</\&lt;/g" "$f"; echo "</pre></body></html>"; } > "site/db_backup_html/${b}.html"; done' >> .github/echo_backup/backup.sh
          chmod +x .github/echo_backup/backup.sh
          bash .github/echo_backup/backup.sh
          echo "[ECHO] DB 백업 & HTML 변환 완료"

      # 8) Trivy & Scorecard 설치 (ROBUST) + 스캔 echo
      - name: 🛡️ Trivy & Scorecard 설치 (echo-robust)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .github/echo_logs
          exec > >(tee .github/echo_logs/06_scanners.log) 2>&1

          echo '#!/usr/bin/env bash' > .github/scripts/install_scanners.sh
          echo 'set -Eeuo pipefail' >> .github/scripts/install_scanners.sh

          # ---- Trivy 설치
          echo 'curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin' >> .github/scripts/install_scanners.sh

          # ---- Scorecard 설치 (robust)
          echo 'mkdir -p /tmp/scorecard && cd /tmp/scorecard' >> .github/scripts/install_scanners.sh
          echo 'ASSET=""' >> .github/scripts/install_scanners.sh
          echo 'if command -v gh >/dev/null 2>&1; then' >> .github/scripts/install_scanners.sh
          echo '  gh release download -R ossf/scorecard -p "scorecard_*_linux_amd64.tar.gz" -D . || true' >> .github/scripts/install_scanners.sh
          echo '  ASSET=$(ls -1 scorecard_*_linux_amd64.tar.gz 2>/dev/null | head -n1 || true)' >> .github/scripts/install_scanners.sh
          echo '  if [ -z "$ASSET" ]; then gh release download -R ossf/scorecard -p "scorecard_*_Linux_x86_64.tar.gz" -D . || true; ASSET=$(ls -1 scorecard_*_Linux_x86_64.tar.gz 2>/dev/null | head -n1 || true); fi' >> .github/scripts/install_scanners.sh
          echo 'else' >> .github/scripts/install_scanners.sh
          echo '  VER="4.13.3"' >> .github/scripts/install_scanners.sh
          echo '  curl -fSLo "scorecard_${VER}_linux_amd64.tar.gz" "https://github.com/ossf/scorecard/releases/download/v${VER}/scorecard_${VER}_linux_amd64.tar.gz" || true' >> .github/scripts/install_scanners.sh
          echo '  [ -f "scorecard_${VER}_linux_amd64.tar.gz" ] || curl -fSLo "scorecard_${VER}_Linux_x86_64.tar.gz" "https://github.com/ossf/scorecard/releases/download/v${VER}/scorecard_${VER}_Linux_x86_64.tar.gz" || true' >> .github/scripts/install_scanners.sh
          echo '  ASSET=$(ls -1 scorecard_*_*_*.tar.gz 2>/dev/null | head -n1 || true)' >> .github/scripts/install_scanners.sh
          echo 'fi' >> .github/scripts/install_scanners.sh

          echo 'if [ -z "$ASSET" ]; then echo "::error ::Scorecard asset download failed"; exit 1; fi' >> .github/scripts/install_scanners.sh
          echo 'tar -xzf "$ASSET" || { echo "::error ::Scorecard tar extract failed"; exit 1; }' >> .github/scripts/install_scanners.sh

          echo 'CANDIDATES="scorecard ossf-scorecard scorecard-linux-amd64 scorecard_linux_amd64"' >> .github/scripts/install_scanners.sh
          echo 'BIN=""' >> .github/scripts/install_scanners.sh
          echo 'for b in $CANDIDATES; do f=$(find . -type f -name "$b" -perm -u+x 2>/dev/null | head -n1 || true); [ -z "$f" ] || { BIN="$f"; break; }; done' >> .github/scripts/install_scanners.sh
          echo 'if [ -z "$BIN" ]; then BIN=$(find . -type f -name scorecard 2>/dev/null | head -n1 || true); fi' >> .github/scripts/install_scanners.sh
          echo 'if [ -z "$BIN" ]; then echo "::error ::Scorecard binary not found after extract"; exit 1; fi' >> .github/scripts/install_scanners.sh

          echo 'sudo mv "$BIN" /usr/local/bin/scorecard' >> .github/scripts/install_scanners.sh
          echo 'sudo chmod +x /usr/local/bin/scorecard' >> .github/scripts/install_scanners.sh
          echo '/usr/local/bin/scorecard version || /usr/local/bin/scorecard --version || true' >> .github/scripts/install_scanners.sh

          echo 'if ! command -v scorecard >/dev/null 2>&1; then' >> .github/scripts/install_scanners.sh
          echo '  if command -v go >/dev/null 2>&1; then' >> .github/scripts/install_scanners.sh
          echo '    echo "[FALLBACK] installing via go install...]' >> .github/scripts/install_scanners.sh
          echo '    GO111MODULE=on go install github.com/ossf/scorecard/v4@latest || true' >> .github/scripts/install_scanners.sh
          echo '    [ -x "$HOME/go/bin/scorecard" ] && sudo mv "$HOME/go/bin/scorecard" /usr/local/bin/scorecard || true' >> .github/scripts/install_scanners.sh
          echo '  fi' >> .github/scripts/install_scanners.sh
          echo 'fi' >> .github/scripts/install_scanners.sh

          echo 'if command -v scorecard >/dev/null 2>&1; then scorecard --version | tee .github/echo_logs/scorecard_version.txt; else echo "::error ::Scorecard installation failed"; exit 1; fi' >> .github/scripts/install_scanners.sh

          chmod +x .github/scripts/install_scanners.sh
          bash .github/scripts/install_scanners.sh
          echo "[ECHO] Trivy/Scorecard 설치 완료"

      - name: 🔎 보안 스캔 (Scorecard / Bandit / pip-audit / Trivy) - echo
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee .github/echo_logs/08_scans_run.log) 2>&1
          echo '#!/usr/bin/env bash' > .github/echo_security/scan_all.sh
          echo 'set -Eeuo pipefail' >> .github/echo_security/scan_all.sh
          echo 'mkdir -p site/security' >> .github/echo_security/scan_all.sh
          echo 'scorecard --repo="https://github.com/${GITHUB_REPOSITORY}" --format sarif --no-upload > site/security/scorecard.sarif || true' >> .github/echo_security/scan_all.sh
          echo 'scorecard --repo="https://github.com/${GITHUB_REPOSITORY}" --format json  --no-upload > site/security/scorecard.json  || true' >> .github/echo_security/scan_all.sh
          echo 'pip-audit -f json -o site/security/pip-audit.json || true' >> .github/echo_security/scan_all.sh
          echo 'bandit -r . -f json -o site/security/bandit.json || true' >> .github/echo_security/scan_all.sh
          echo 'trivy fs . --format json --output site/security/trivy.json || true' >> .github/echo_security/scan_all.sh
          chmod +x .github/echo_security/scan_all.sh
          bash .github/echo_security/scan_all.sh
          echo "[ECHO] 보안 스캔 완료"

      # 9) CodeQL (액션은 uses, 앞뒤 echo)
      - name: 🧰 CodeQL Init (pre-echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO][pre] CodeQL init" | tee -a .github/echo_logs/09_codeql.log

      - name: 🧰 CodeQL Init
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: 🧰 CodeQL Init (post-echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO][post] CodeQL init done" | tee -a .github/echo_logs/09_codeql.log

      - name: 📊 CodeQL Analyze (pre-echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO][pre] CodeQL analyze" | tee -a .github/echo_logs/09_codeql.log

      - name: 📊 CodeQL Analyze
        uses: github/codeql-action/analyze@v3
        with:
          output: site/security/codeql-results.sarif
          category: codeql-security-scan

      - name: 📊 CodeQL Analyze (post-echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO][post] CodeQL analyze done" | tee -a .github/echo_logs/09_codeql.log

      # 10) 업그레이드(전/실행/후) echo
      - name: ⬆️ 업그레이드 사전 수집 (echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee .github/echo_logs/10_upgrade_before.log) 2>&1
          echo '#!/usr/bin/env bash' > .github/echo_upgrade/before.sh
          echo 'set -Eeuo pipefail' >> .github/echo_upgrade/before.sh
          echo 'mkdir -p site/upgrade' >> .github/echo_upgrade/before.sh
          echo 'apt list --upgradable 2>/dev/null | tee site/upgrade/upgradable.before.txt' >> .github/echo_upgrade/before.sh
          echo 'pip list --outdated --format=columns > site/upgrade/pip-upgradable.before.txt || true' >> .github/echo_upgrade/before.sh
          echo 'sudo docker images --format "{{.Repository}}:{{.Tag}}" > site/upgrade/docker-images.before.txt || true' >> .github/echo_upgrade/before.sh
          chmod +x .github/echo_upgrade/before.sh
          bash .github/echo_upgrade/before.sh
          echo "[ECHO] Upgrade BEFORE 수집 완료"

      - name: ⬆️ 대량 업그레이드 실행 (echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee .github/echo_logs/11_upgrade_run.log) 2>&1
          echo '#!/usr/bin/env bash' > .github/echo_upgrade/run.sh
          echo 'set -Eeuo pipefail' >> .github/echo_upgrade/run.sh
          echo 'sudo apt-get update -y && sudo apt-get upgrade -y && sudo apt-get autoremove -y && sudo apt-get clean' >> .github/echo_upgrade/run.sh
          echo 'pip install --upgrade pip' >> .github/echo_upgrade/run.sh
          echo 'pip list --outdated --format=freeze | cut -d= -f1 | xargs -n1 -r pip install -U || true' >> .github/echo_upgrade/run.sh
          echo 'while read -r img; do [ -n "$img" ] && sudo docker pull "$img" || true; done < site/upgrade/docker-images.before.txt' >> .github/echo_upgrade/run.sh
          chmod +x .github/echo_upgrade/run.sh
          bash .github/echo_upgrade/run.sh
          echo "[ECHO] 전체 업그레이드 완료"

      - name: ⬆️ 업그레이드 사후 & Diff (echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee .github/echo_logs/12_upgrade_after.log) 2>&1
          echo '#!/usr/bin/env bash' > .github/echo_upgrade/after.sh
          echo 'set -Eeuo pipefail' >> .github/echo_upgrade/after.sh
          echo 'apt list --upgradable 2>/dev/null | tee site/upgrade/upgradable.after.txt' >> .github/echo_upgrade/after.sh
          echo 'pip list --outdated --format=columns > site/upgrade/pip-upgradable.after.txt || true' >> .github/echo_upgrade/after.sh
          echo 'sudo docker images --format "{{.Repository}}:{{.Tag}}" > site/upgrade/docker-images.after.txt || true' >> .github/echo_upgrade/after.sh
          echo '{ echo "<html><body><h2>Upgrade Diff</h2><h3>APT</h3><pre>"; diff -u site/upgrade/upgradable.before.txt site/upgrade/upgradable.after.txt || true; echo "</pre><h3>PIP</h3><pre>"; diff -u site/upgrade/pip-upgradable.before.txt site/upgrade/pip-upgradable.after.txt || true; echo "</pre><h3>Docker Images</h3><pre>"; diff -u site/upgrade/docker-images.before.txt site/upgrade/docker-images.after.txt || true; echo "</pre></body></html>"; } > site/upgrade/report.html' >> .github/echo_upgrade/after.sh
          chmod +x .github/echo_upgrade/after.sh
          bash .github/echo_upgrade/after.sh
          echo "[ECHO] Upgrade AFTER & Diff 완료"

      # 11) 변경 시 자동 PR echo
      - name: 🔁 업그레이드 자동 PR(변경시) - echo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee .github/echo_logs/13_auto_pr.log) 2>&1
          echo '#!/usr/bin/env bash' > .github/echo_upgrade/auto_pr.sh
          echo 'set -Eeuo pipefail' >> .github/echo_upgrade/auto_pr.sh
          echo 'if [ -s site/upgrade/upgradable.after.txt ] || [ -s site/upgrade/pip-upgradable.after.txt ]; then' >> .github/echo_upgrade/auto_pr.sh
          echo '  git config --global user.email "actions@github.com"' >> .github/echo_upgrade/auto_pr.sh
          echo '  git config --global user.name "github-actions"' >> .github/echo_upgrade/auto_pr.sh
          echo '  BR="auto/upgrade-$(date -u +%Y%m%d%H%M%S)"' >> .github/echo_upgrade/auto_pr.sh
          echo '  git checkout -b "$BR"' >> .github/echo_upgrade/auto_pr.sh
          echo '  git add site/upgrade/ .github/echo_upgrade/ .github/echo_logs/ .github/services/ || true' >> .github/echo_upgrade/auto_pr.sh
          echo '  git commit -m "chore: auto upgrade & service files & reports" || true' >> .github/echo_upgrade/auto_pr.sh
          echo '  git push -u origin HEAD || true' >> .github/echo_upgrade/auto_pr.sh
          echo '  gh pr create --title "⬆️ Auto Upgrade" --body "자동 업그레이드/리포트/서비스 파일 반영" || true' >> .github/echo_upgrade/auto_pr.sh
          echo '  echo "[ECHO] Auto PR 생성 완료"' >> .github/echo_upgrade/auto_pr.sh
          echo 'else' >> .github/echo_upgrade/auto_pr.sh
          echo '  echo "[ECHO] 변경 없음, PR 생략"' >> .github/echo_upgrade/auto_pr.sh
          echo 'fi' >> .github/echo_upgrade/auto_pr.sh
          chmod +x .github/echo_upgrade/auto_pr.sh
          bash .github/echo_upgrade/auto_pr.sh

      # 12) 아티팩트 업로드 (uses, 앞뒤 echo)
      - name: 📦 아티팩트 업로드 (pre-echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO][pre] upload-artifact start" | tee -a .github/echo_logs/14_artifacts.log

      - name: 📦 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: mega-artifacts
          path: |
            site/**
            .github/services/**
            .github/echo_logs/**
            .github/echo_upgrade/**

      - name: 📦 아티팩트 업로드 (post-echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO][post] upload-artifact done" | tee -a .github/echo_logs/14_artifacts.log

      # 13) GitHub Pages 업로드/배포 (uses, 앞뒤 echo)
      - name: 🌐 Upload Pages Artifact (pre-echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO][pre] pages artifact upload" | tee -a .github/echo_logs/15_pages.log

      - name: 🌐 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: 🌐 Upload Pages Artifact (post-echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO][post] pages artifact uploaded" | tee -a .github/echo_logs/15_pages.log

      - name: 🚀 Deploy to GitHub Pages (pre-echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO][pre] deploy pages" | tee -a .github/echo_logs/15_pages.log

      - name: 🚀 Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 🚀 Deploy to GitHub Pages (post-echo)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO][post] deploy pages done" | tee -a .github/echo_logs/15_pages.log
