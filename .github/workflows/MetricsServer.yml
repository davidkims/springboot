name: 📊 Metrics Server Setup & Real-time Data Collection

on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'  # 매분 실행

jobs:
  setup_and_collect:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup & Install Metrics Server
        run: |
          # Update & Upgrade
          echo "[🛠️] Updating package lists..."
          echo "[🛠️] Running: sudo apt-get update"
          sudo apt-get update

          echo "[🛠️] Upgrading all packages..."
          echo "[🛠️] Running: sudo apt-get upgrade -y"
          sudo apt-get upgrade -y
          echo "[✅] System packages upgraded."

          # Backup existing data
          echo "[🛡️] Backing up existing data and config..."
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          for DIR in /opt/prometheus/data /opt/grafana/data /opt/elasticsearch/data \
                    /opt/logstash/config /opt/kibana/config /opt/influxdb/data /opt/telegraf/conf; do
            echo "[🛡️] Processing $DIR"
            if [ -d "$DIR" ]; then
              BK="${DIR}_backup_$TIMESTAMP"
              echo "[🛡️] Creating backup dir: $BK"
              sudo mkdir -p "$BK"
              echo "[🛡️] Copying data from $DIR to $BK"
              sudo cp -a "$DIR/." "$BK/"
              echo "[✅] Backed up $DIR → $BK"
            else
              echo "[⚪️] $DIR not found, skipping backup"
            fi
          done

          # Create directories
          echo "[🛠️] Creating required directories..."
          echo "[🛠️] Running: sudo mkdir -p /opt/prometheus/data /opt/grafana/data /opt/elasticsearch/data /opt/logstash/config /opt/kibana/config /opt/influxdb/data /opt/telegraf/conf"
          sudo mkdir -p /opt/prometheus/data /opt/grafana/data /opt/elasticsearch/data \
                          /opt/logstash/config /opt/kibana/config /opt/influxdb/data \
                          /opt/telegraf/conf
          echo "[✅] Directories created."

          # Install Prometheus
          echo "[🛠️] Installing Prometheus..."
          echo "[🛠️] Running: sudo apt-get install -y prometheus"
          sudo apt-get install -y prometheus
          echo "[✅] Prometheus installed."

          # Install Grafana
          echo "[🛠️] Installing Grafana prerequisites..."
          echo "[🛠️] Running: sudo apt-get install -y apt-transport-https software-properties-common wget gnupg"
          sudo apt-get install -y apt-transport-https software-properties-common wget gnupg
          echo "[🛠️] Adding Grafana key..."
          curl -sL https://apt.grafana.com/gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/grafana.gpg > /dev/null
          echo "[🛠️] Adding Grafana repo..."
          echo "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main" | sudo tee /etc/apt/sources.list.d/grafana.list
          echo "[🛠️] Updating package lists for Grafana..."
          echo "[🛠️] Running: sudo apt-get update"
          sudo apt-get update
          echo "[🛠️] Running: sudo apt-get install -y grafana"
          sudo apt-get install -y grafana
          echo "[✅] Grafana installed."

          # Install Elasticsearch
          echo "[🛠️] Installing Elasticsearch..."
          echo "[🛠️] Running: curl -sL https://artifacts.elastic.co/GPG-KEY-elasticsearch"
          curl -sL https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor | sudo tee /usr/share/keyrings/elasticsearch-archive-keyring.gpg > /dev/null
          echo "[🛠️] Adding Elasticsearch repo..."
          echo "deb [signed-by=/usr/share/keyrings/elasticsearch-archive-keyring.gpg] https://artifacts.elastic.co/packages/7.x/apt stable main" | sudo tee /etc/apt/sources.list.d/elasticsearch.list
          echo "[🛠️] Updating package lists for Elasticsearch..."
          echo "[🛠️] Running: sudo apt-get update"
          sudo apt-get update
          echo "[🛠️] Running: sudo apt-get install -y openjdk-11-jdk elasticsearch"
          sudo apt-get install -y openjdk-11-jdk elasticsearch
          echo "[✅] Elasticsearch installed."

          # Install Logstash
          echo "[🛠️] Installing Logstash..."
          echo "[🛠️] Running: sudo apt-get update"
          sudo apt-get update
          echo "[🛠️] Running: sudo apt-get install -y logstash"
          sudo apt-get install -y logstash
          echo "[✅] Logstash installed."

          # Install Kibana
          echo "[🛠️] Installing Kibana..."
          echo "[🛠️] Running: sudo apt-get update"
          sudo apt-get update
          echo "[🛠️] Running: sudo apt-get install -y kibana"
          sudo apt-get install -y kibana
          echo "[✅] Kibana installed."

          # Install InfluxDB & Telegraf
          echo "[🛠️] Installing InfluxDB & Telegraf..."
          echo "[🛠️] Running: curl -sL https://repos.influxdata.com/influxdata-archive_compat.key"
          curl -sL https://repos.influxdata.com/influxdata-archive_compat.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/influxdata-archive_compat.gpg > /dev/null
          echo "[🛠️] Adding InfluxDB repo..."
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/influxdata-archive_compat.gpg] https://repos.influxdata.com/ubuntu jammy stable" | sudo tee /etc/apt/sources.list.d/influxdb.list
          echo "[🛠️] Updating package lists for InfluxDB & Telegraf..."
          echo "[🛠️] Running: sudo apt-get update"
          sudo apt-get update
          echo "[🛠️] Running: sudo apt-get install -y influxdb telegraf"
          sudo apt-get install -y influxdb telegraf
          echo "[✅] InfluxDB & Telegraf installed."

      - name: 📡 Collect real-time workflow metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[📡] Fetching latest 5 workflow runs from GitHub API..."
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=5" \
            > workflow_metrics.json
          echo "[✅] Metrics saved to workflow_metrics.json"
          head -n 20 workflow_metrics.json || true
