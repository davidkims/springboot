name: 🏢 MEGA DB Echo FullOps + 설치 + Eco + 실행 통합

on:
  workflow_dispatch:
    inputs:
      COUNT:
        description: "테이블/사용자 수 (default: 100)"
        required: false
        default: "100"
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  mega-echo:
    runs-on: ubuntu-latest
    env:
      COUNT: ${{ github.event.inputs.COUNT || 100 }}

    steps:
      - name: 파일 채팅
        uses: actions/checkout@v4

      - name: MySQL + SQLite + PSQL + Upgrade + Firewall + .my.cnf + Echo init
        run: |
          sudo apt-get update -y && sudo apt-get upgrade -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server sqlite3 postgresql-client net-tools curl lsb-release ufw
          sudo sed -i 's/^bind-address.*/bind-address = 0.0.0.0/' /etc/mysql/mysql.conf.d/mysqld.cnf || true
          sudo systemctl restart mysql || sudo service mysql restart
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpass123'; FLUSH PRIVILEGES;"

          mkdir -p .github/echo_db/{echo_mysql,echo_dirs,logs,run_scripts,backup,sarif,stats,permissions,firewall,results}

          echo '[client]' > .github/echo_db/echo_mysql/my.cnf
          echo 'user=root' >> .github/echo_db/echo_mysql/my.cnf
          echo 'password=rootpass123' >> .github/echo_db/echo_mysql/my.cnf
          echo 'host=127.0.0.1' >> .github/echo_db/echo_mysql/my.cnf
          echo 'protocol=TCP' >> .github/echo_db/echo_mysql/my.cnf

          mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf -e "SHOW GRANTS FOR 'root'@'localhost'" | tee .github/echo_db/permissions/root_grants.txt
          sudo ufw status verbose | tee .github/echo_db/firewall/ufw_status_verbose.txt || echo 'ufw 불가용'
          netstat -ntlp | tee .github/echo_db/firewall/netstat_output.txt

          mysql --version | tee .github/echo_db/logs/mysql_version.txt
          sqlite3 --version | tee .github/echo_db/logs/sqlite_version.txt
          psql --version | tee .github/echo_db/logs/psql_version.txt
          curl --version | tee .github/echo_db/logs/curl_version.txt
          lsb_release -a 2>/dev/null | tee .github/echo_db/logs/os_release.txt

      - name: Echo SQL/User/Table/권한 대량 생성
        run: |
          COUNT=${COUNT:-100}
          for d in echo_table echo_sql echo_user echo_grant echo_drop echo_alter echo_truncate echo_analyze echo_run_scripts grants results; do
            mkdir -p ".github/echo_db/$d"
          done

          for i in $(seq 1 $COUNT); do
            T="mega_table_$i"
            echo "CREATE TABLE IF NOT EXISTS $T (id INT AUTO_INCREMENT PRIMARY KEY, data VARCHAR(255));" > .github/echo_db/echo_table/$T.sql
            echo "INSERT INTO $T (data) VALUES ('sample_data_$i');" > .github/echo_db/echo_sql/insert_$T.sql
            echo "SELECT * FROM $T;" > .github/echo_db/echo_sql/select_$T.sql
            echo "CREATE USER IF NOT EXISTS 'user_$i'@'%' IDENTIFIED BY 'pw_$i'; GRANT SELECT, INSERT ON test_db.$T TO 'user_$i'@'%';" > .github/echo_db/echo_user/user_$i.sql
            echo "REVOKE ALL ON $T FROM 'user_$i'@'%';" > .github/echo_db/echo_grant/revoke_$T.sql
            echo "DROP TABLE IF EXISTS $T;" > .github/echo_db/echo_drop/drop_$T.sql
            echo "ALTER TABLE $T ADD COLUMN created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP;" > .github/echo_db/echo_alter/alter_$T.sql
            echo "TRUNCATE TABLE $T;" > .github/echo_db/echo_truncate/trunc_$T.sql
            echo "ANALYZE TABLE $T;" > .github/echo_db/echo_analyze/analyze_$T.sql
            echo "SHOW GRANTS FOR 'user_$i'@'%';" > .github/echo_db/grants/grants_user_$i.sql
          done

      - name: 실행 스크립트 + SELECT 결과 + GRANT 로그
        run: |
          for kind in table insert select drop alter truncate analyze; do
            echo "#!/bin/bash" > .github/echo_db/run_scripts/init_${kind}.sh
            chmod +x .github/echo_db/run_scripts/init_${kind}.sh
          done

          for i in $(seq 1 $COUNT); do
            T="mega_table_$i"
            echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf test_db < .github/echo_db/echo_table/$T.sql" >> .github/echo_db/run_scripts/init_table.sh
            echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf test_db < .github/echo_db/echo_sql/insert_$T.sql" >> .github/echo_db/run_scripts/init_insert.sh
            echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf test_db < .github/echo_db/echo_sql/select_$T.sql | tee .github/echo_db/results/${T}_select.csv" >> .github/echo_db/run_scripts/init_select.sh
            echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf test_db < .github/echo_db/echo_drop/drop_$T.sql" >> .github/echo_db/run_scripts/init_drop.sh
            echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf test_db < .github/echo_db/echo_alter/alter_$T.sql" >> .github/echo_db/run_scripts/init_alter.sh
            echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf test_db < .github/echo_db/echo_truncate/trunc_$T.sql" >> .github/echo_db/run_scripts/init_truncate.sh
            echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf test_db < .github/echo_db/echo_analyze/analyze_$T.sql" >> .github/echo_db/run_scripts/init_analyze.sh
            echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf -e \"$(cat .github/echo_db/grants/grants_user_$i.sql)\" | tee .github/echo_db/results/grants_user_$i.log" >> .github/echo_db/run_scripts/init_grant.sh
            echo "mysql --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf test_db < .github/echo_db/echo_user/user_$i.sql" >> .github/echo_db/run_scripts/init_user.sh
          done

      - name: 바크업 + SARIF + 통계
        run: |
          mysqldump --defaults-extra-file=.github/echo_db/echo_mysql/my.cnf test_db > .github/echo_db/backup/mysql_backup.sql || echo '[ERROR] mysqldump failed'
          echo '-- mock PSQL backup' > .github/echo_db/backup/psql_backup.sql
          echo '.dump test_db' | sqlite3 /tmp/test.db > .github/echo_db/backup/sqlite_backup.sql || true

          echo '{ "version": "2.1.0", "runs": [{ "tool": { "driver": { "name": "mockql" }, "results": [{ "message": { "text": "SQL valid." } }] } }] }' > .github/echo_db/sarif/mock_result.sarif
          echo "Total tables: $COUNT" > .github/echo_db/stats/table_count.log
          grep -r "INSERT INTO" .github/echo_db/echo_sql | wc -l > .github/echo_db/stats/insert_count.log

      - name: 게이지 페이지 갱신
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .github/echo_db
          publish_branch: gh-pages

      - name: AWS S3 업로드 (optional)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'ap-northeast-2'
        run: |
          aws s3 cp --recursive .github/echo_db/backup/ s3://your-bucket-name/echo_db/backup/ || echo '[WARN] S3 upload failed'

      - name: 결과 보기
        run: |
          find .github/echo_db -type f | sort | while read f; do
            echo "--- $f"
            cat "$f" || echo "(read error)"
          done
