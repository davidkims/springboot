name: ♾️ Transfer Log Backup - Cron (60건 Infinite)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  transfer_log_backup:
    runs-on: ubuntu-latest

    env:
      TRANSFER_LOG_DIR: /opt/logs/transfer
      BACKUP_DIR: /opt/backup/transfer
      PROVENANCE_DIR: provenance
      PROVENANCE_STORE_DIR: provenance/store

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🧪 Install Java & JDBC Drivers and Test Connections
        run: |
          echo "[☕] Installing Java JDK..."
          sudo apt-get install -y openjdk-17-jdk
          java -version
          javac -version

          echo "[📁] Creating JDBC directories..."
          mkdir -p /opt/jdbc /opt/jdbc/test

          echo "[⬇️] Downloading JDBC Drivers..."
          curl -L -o /opt/jdbc/mysql-connector-j.jar https://repo1.maven.org/maven2/mysql/mysql-connector-java/8.3.0/mysql-connector-java-8.3.0.jar
          curl -L -o /opt/jdbc/postgresql-jdbc.jar https://jdbc.postgresql.org/download/postgresql-42.7.3.jar
          curl -L -o /opt/jdbc/oracle-jdbc.jar https://repo1.maven.org/maven2/com/zaxxer/HikariCP/5.1.0/HikariCP-5.1.0.jar || echo "[ℹ️] Oracle JDBC 대체용"

          echo "[📄] Generating JDBC Test Java File (with echo)..."
          {
            echo 'import java.sql.Connection;'
            echo 'import java.sql.DriverManager;'
            echo ''
            echo 'public class JDBCTest {'
            echo '    public static void main(String[] args) {'
            echo '        String type = args[0];'
            echo '        String url = "";'
            echo '        String user = "testuser";'
            echo '        String password = "testpass";'
            echo ''
            echo '        switch (type) {'
            echo '            case "mysql":'
            echo '                url = "jdbc:mysql://localhost:3306/testdb";'
            echo '                break;'
            echo '            case "postgres":'
            echo '                url = "jdbc:postgresql://localhost:5432/testdb";'
            echo '                break;'
            echo '            case "oracle":'
            echo '                url = "jdbc:oracle:thin:@localhost:1521:xe";'
            echo '                break;'
            echo '            default:'
            echo '                System.err.println("Unsupported type: " + type);'
            echo '                System.exit(1);'
            echo '        }'
            echo ''
            echo '        try (Connection conn = DriverManager.getConnection(url, user, password)) {'
            echo '            System.out.println("[\u2705] Connected to " + type + " successfully.");'
            echo '        } catch (Exception e) {'
            echo '            System.err.println("[\u274c] Connection to " + type + " failed: " + e.getMessage());'
            echo '        }'
            echo '    }'
            echo '}'
          } | tee /opt/jdbc/test/JDBCTest.java

          echo "[📜] JDBCTest.java contents:"
          cat /opt/jdbc/test/JDBCTest.java

          echo "[🚰] Compiling JDBC Test Code..."
          javac -cp "/opt/jdbc/*" /opt/jdbc/test/JDBCTest.java

          echo "[🧲] Testing MySQL JDBC connection..."
          java -cp "/opt/jdbc/*:/opt/jdbc/test" JDBCTest mysql || true

          echo "[🧲] Testing PostgreSQL JDBC connection..."
          java -cp "/opt/jdbc/*:/opt/jdbc/test" JDBCTest postgres || true

          echo "[🧲] Testing Oracle JDBC connection..."
          java -cp "/opt/jdbc/*:/opt/jdbc/test" JDBCTest oracle || true

          echo "[📂] Listing JDBC contents:"
          tree /opt/jdbc || ls -lh /opt/jdbc/
