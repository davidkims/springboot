name: 📂 MEGA DB/Tx/FullOps/에코옵스 완전체

on:
  workflow_dispatch:
    inputs:
      COUNT:
        description: "생성할 테이블/사용자 수"
        required: false
        default: "100"
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  mega-db-echo:
    runs-on: ubuntu-latest
    env:
      COUNT: ${{ inputs.COUNT || 100 }}

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 모든 에코 디렉토리 생성
        run: |
          ECHO_DIRS="dwh teradata bteq elk firewall mysqldump psql_backup csv_export sarif logs output run_scripts samples \
                     echo_sql echo_table echo_grant echo_user echo_drop echo_alter echo_truncate echo_analyze backup"
          mkdir -p .github/echo_db
          for d in $ECHO_DIRS; do
            echo "echo 'mkdir -p .github/echo_db/$d'" >> mkdir_echo.sh
            mkdir -p ".github/echo_db/$d"
          done
          bash mkdir_echo.sh

      - name: 🧱 SQL/계정/권한/ALTER/TRUNCATE/ANALYZE 대량 생성
        run: |
          COUNT=${COUNT:-100}
          for i in $(seq 1 $COUNT); do
            TBL="mega_table_$i"

            # 기본 테이블 및 쿼리
            echo "CREATE TABLE IF NOT EXISTS $TBL (id INT PRIMARY KEY AUTO_INCREMENT, data VARCHAR(255));" > .github/echo_db/echo_table/$TBL.sql
            echo "INSERT INTO $TBL (data) VALUES ('샘플데이터_$i');" > .github/echo_db/echo_sql/insert_$TBL.sql
            echo "SELECT * FROM $TBL;" > .github/echo_db/echo_sql/select_$TBL.sql

            # 권한/사용자
            echo "CREATE USER 'user_$i'@'%' IDENTIFIED BY 'pw_$i';" > .github/echo_db/echo_user/create_user_$i.sql
            echo "GRANT SELECT, INSERT ON test_db.$TBL TO 'user_$i'@'%';" >> .github/echo_db/echo_user/create_user_$i.sql
            echo "REVOKE ALL ON $TBL FROM 'user_$i'@'%';" > .github/echo_db/echo_grant/revoke_user_$i.sql

            # DROP
            echo "DROP TABLE IF EXISTS $TBL;" > .github/echo_db/echo_drop/drop_$TBL.sql

            # 🔁 신규: ALTER, TRUNCATE, ANALYZE
            echo "ALTER TABLE $TBL ADD COLUMN created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP;" > .github/echo_db/echo_alter/alter_$TBL.sql
            echo "TRUNCATE TABLE $TBL;" > .github/echo_db/echo_truncate/truncate_$TBL.sql
            echo "ANALYZE TABLE $TBL;" > .github/echo_db/echo_analyze/analyze_$TBL.sql

            # 실행 스크립트 추가
            echo "mysql -uroot -prootpass123 test_db < .github/echo_db/echo_table/$TBL.sql" >> .github/echo_db/run_scripts/init_tables.sh
            echo "mysql -uroot -prootpass123 test_db < .github/echo_db/echo_sql/insert_$TBL.sql" >> .github/echo_db/run_scripts/init_insert.sh
            echo "mysql -uroot -prootpass123 test_db < .github/echo_db/echo_sql/select_$TBL.sql" >> .github/echo_db/run_scripts/init_select.sh
            echo "mysql -uroot -prootpass123 test_db < .github/echo_db/echo_user/create_user_$i.sql" >> .github/echo_db/run_scripts/create_users.sh
            echo "mysql -uroot -prootpass123 test_db < .github/echo_db/echo_grant/revoke_user_$i.sql" >> .github/echo_db/run_scripts/revoke_users.sh
            echo "mysql -uroot -prootpass123 test_db < .github/echo_db/echo_drop/drop_$TBL.sql" >> .github/echo_db/run_scripts/drop_tables.sh
            echo "mysql -uroot -prootpass123 test_db < .github/echo_db/echo_alter/alter_$TBL.sql" >> .github/echo_db/run_scripts/init_alter.sh
            echo "mysql -uroot -prootpass123 test_db < .github/echo_db/echo_truncate/truncate_$TBL.sql" >> .github/echo_db/run_scripts/init_truncate.sh
            echo "mysql -uroot -prootpass123 test_db < .github/echo_db/echo_analyze/analyze_$TBL.sql" >> .github/echo_db/run_scripts/init_analyze.sh
          done
          chmod +x .github/echo_db/run_scripts/*.sh

      - name: 🗄️ 백업 스크립트 생성
        run: |
          echo "#!/bin/bash" > .github/echo_db/backup/mysqldump_backup.sh
          echo "mysqldump -uroot -prootpass123 test_db > .github/echo_db/backup/mysql_backup.sql || echo '[ERROR] mysqldump 실패'" >> .github/echo_db/backup/mysqldump_backup.sh
          chmod +x .github/echo_db/backup/mysqldump_backup.sh

          echo "#!/bin/bash" > .github/echo_db/backup/psql_backup.sh
          echo "echo '-- PSQL 백업 (모의 실행)' > .github/echo_db/backup/psql_backup.sql" >> .github/echo_db/backup/psql_backup.sh
          chmod +x .github/echo_db/backup/psql_backup.sh

      - name: 🔄 모든 SQL 실행 자동화 (init_*.sh)
        run: |
          for script in init_tables init_insert init_select create_users revoke_users drop_tables init_alter init_truncate init_analyze; do
            echo "[RUN] $script.sh"
            bash .github/echo_db/run_scripts/$script.sh || echo "[WARN] $script 실행 실패"
          done

          echo "[RUN] mysqldump"
          bash .github/echo_db/backup/mysqldump_backup.sh || echo "[WARN] 백업 실패"

          echo "[RUN] psql 백업"
          bash .github/echo_db/backup/psql_backup.sh || echo "[WARN] psql 백업 실패"

      - name: 📃 전체 에코 파일 출력
        run: |
          echo "[ECHO] 생성된 에코 파일 목록:"
          find .github/echo_db -type f | sort | while read f; do
            echo "--- $f"
            cat "$f" || echo "(읽기 실패)"
            echo
          done
