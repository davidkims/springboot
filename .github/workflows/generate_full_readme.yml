name: 📓 포트폴리오 + 워크플로 통계로 README & SECURITY 업데이트

on:
  schedule:
    - cron: '*/1 * * * *'  # 매분 실행
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update_docs:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [16, 18, 20]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_LATENCY_MS: 1000

    steps:
      - name: 📅 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 캐시 설정 (apt, pip, Prometheus)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            /var/cache/apt
            /tmp/prometheus-cache
          key: ${{ runner.os }}-cache-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-cache-

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: 🔧 시스템 패키지, GitHub CLI, jq, parallel 설치 및 업그레이드
        shell: bash
        run: |
          echo "[🔧] 시스템 패키지, GitHub CLI, jq, parallel 최신화 및 업그레이드 중..."
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            sudo apt-get update -y
            sudo apt-get dist-upgrade -y
            sudo apt-get install -y gh jq parallel
            sudo apt-get install --only-upgrade -y parallel
          fi
          gh --version || echo "[ℹ️] gh CLI not available"
          jq --version || echo "[ℹ️] jq not available"
          parallel --version

      - name: 🔄 Prometheus 설치 (재시도 로직)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "[🔄] Prometheus 다운로드 및 설치 (재시도 로직)"
          for i in {1..3}; do
            if wget --timeout=30 https://github.com/prometheus/prometheus/releases/download/v2.53.5/prometheus-2.53.5.linux-amd64.tar.gz -O prometheus.tar.gz; then
              break
            fi
            echo "재시도 $i/3..."
            sleep 5
          done
          tar xzf prometheus.tar.gz
          sudo mv prometheus-2.53.5.linux-amd64 /opt/prometheus

      - name: 📂 Prometheus 데이터 저장 디렉토리 생성
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "[📂] Prometheus 데이터 저장 디렉토리 생성 중..."
          sudo useradd --no-create-home --shell /bin/false prometheus || true
          sudo mkdir -p /opt/prometheus/data
          sudo chown -R prometheus:prometheus /opt/prometheus/data
          echo "[✅] Prometheus 서버 및 데이터 디렉토리 생성 완료."

      - name: 🛡️ Generate SECURITY.md
        shell: bash
        run: |
          echo "[🛡️] SECURITY.md 생성 및 워크플로우 검증 체크리스트 추가 중..."
          echo "# Security Policy" > SECURITY.md
          echo "## Supported Versions" >> SECURITY.md
          echo "| Version | Supported          |" >> SECURITY.md
          echo "| ------- | ------------------ |" >> SECURITY.md
          echo "| 5.1.x   | :white_check_mark: |" >> SECURITY.md
          echo "| 5.0.x   | :x:                |" >> SECURITY.md
          echo "| 4.0.x   | :white_check_mark: |" >> SECURITY.md
          echo "| < 4.0   | :x:                |" >> SECURITY.md
          echo "" >> SECURITY.md
          echo "## Reporting a Vulnerability" >> SECURITY.md
          echo "Use this section to tell people how to report a vulnerability." >> SECURITY.md
          echo "Tell them where to go, how often they can expect updates, and what to expect if it’s accepted or declined." >> SECURITY.md
          echo "" >> SECURITY.md
          echo "## Workflow Validation Checklist" >> SECURITY.md
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            base=$(basename "$f")
            echo "[🗒️] Adding checks for $base"
            echo "- [ ] $base: YAML syntax validation"         >> SECURITY.md
            echo "- [ ] $base: Permissions review"             >> SECURITY.md
            echo "- [ ] $base: Secret detection scan"           >> SECURITY.md
            echo "- [ ] $base: Dependency scanning enabled"     >> SECURITY.md
            echo "- [ ] $base: Container scanning enabled"      >> SECURITY.md
          done
          echo "[✅] SECURITY.md 업데이트 완료"

      - name: 📋 Ensure .tmp Directory
        shell: bash
        run: |
          echo "[📁] .tmp 디렉토리 생성 확인"
          mkdir -p .tmp

      - name: 📈 추가 메트릭 수집
        shell: bash
        run: |
          echo "[📈] 저장소 통계 수집 중..."
          {
            echo "## 📊 저장소 통계"
            echo "- 총 커밋 수: $(git rev-list --count HEAD)"
            echo "- 브랜치 수: $(git branch -r | wc -l)"
            echo "- 기여자 수: $(git shortlog -sn | wc -l)"
            echo "- 마지막 커밋: $(git log -1 --format='%h - %s (%cr)')"
          } >> .tmp/repo-stats.md

      - name: 📊 병렬 워크플로우 통계 수집
        shell: bash
        run: |
          echo "[📊] 워크플로우 통계 수집 (병렬) 중..."
          OUTPUT_FILE=".tmp/workflows.md"
          {
            echo "## ⚙️ GitHub Actions 워크플로우 목록 및 통계"
            echo ""
            echo "| 워크플로우 이름 | 실행 수 | 성공 수 | 실패 수 | 성공률 |"
            echo "|----------------|--------:|--------:|--------:|--------:|"
          } > "$OUTPUT_FILE"

          parallel_stats() {
            f="$1"
            NAME=$(grep '^name:' "$f" | head -n1 | cut -d ':' -f2- | xargs)
            FILENAME=$(basename "$f")
            RUNS=$(gh run list --workflow="$FILENAME" --limit 100 --json conclusion -q '.[] | .conclusion')
            TOTAL=$(echo "$RUNS" | wc -l)
            SUCCESS=$(echo "$RUNS" | grep -c success || true)
            FAILURE=$((TOTAL - SUCCESS))
            if [ "$TOTAL" -gt 0 ]; then
              RATE=$(awk "BEGIN {printf \"%.1f\", ($SUCCESS/$TOTAL)*100}")
            else
              RATE="N/A"
            fi
            echo "| $NAME | $TOTAL | $SUCCESS | $FAILURE | $RATE% |"
          }

          export -f parallel_stats
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) \
            | parallel -j $(nproc) parallel_stats {} >> "$OUTPUT_FILE"

          cat "$OUTPUT_FILE"

      - name: 📂 Prometheus 데이터 디렉토리에 통계 저장
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "[📂] 통계 파일을 Prometheus 데이터 디렉토리로 복사 중..."
          sudo cp .tmp/workflows.md /opt/prometheus/data/workflows.md
          mkdir -p prometheus_data
          cp .tmp/workflows.md prometheus_data/workflows.md
          echo "[✅] 통계가 prometheus_data/ 와 /opt/prometheus/data/ 에 저장되었습니다."

      - name: 📦 Upload Prometheus metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-metrics-data
          path: |
            prometheus_data/
            /opt/prometheus/data/workflows.md

      - name: 🔍 보안 취약점 스캔
        uses: github/super-linter@v5
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_YAML: true
          VALIDATE_DOCKERFILE: true

      - name: 🔐 시크릿 스캔
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

      - name: 📢 실패 시 알림 전송
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          message: "워크플로우 실패: ${{ github.workflow }}"

      - name: 🏷️ 동적 배지 생성
        shell: bash
        run: |
          echo "[🏷️] 동적 배지 생성 중..."
          curl -X POST "https://img.shields.io/badge/build-passing-brightgreen"

      - name: 🏷️ 자동 태그 생성
        shell: bash
        run: |
          echo "[🏷️] 자동 릴리즈 태그 생성 중..."
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            TAG="v$(date +%Y.%m.%d.%H%M)"
            git tag "$TAG"
            git push origin "$TAG"
            echo "[✅] 태그 $TAG 생성 및 푸시 완료"
          fi

      - name: ⚡ 병렬 처리 최적화 (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          echo "[⚡] 병렬 처리 최적화 설정 중..."
          CORES=$(nproc)
          echo "사용 가능한 코어: $CORES"
          parallel -j $((CORES * 2)) echo "병렬 테스트 {}" ::: {1..10}

      - name: ⚡ 병렬 처리 최적화 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "[⚡] (Windows) 병렬 처리 최적화 설정 중..."
          CORES=$(nproc)
          echo "사용 가능한 코어: $CORES"
          parallel -j $((CORES * 2)) echo "병렬 테스트 {}" ::: {1..10}

      - name: 🧹 임시 파일 정리 (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          echo "[🧹] 임시 파일 정리 중..."
          rm -rf .tmp/ || true
          rm -f prometheus-*.tar.gz || true

      - name: 🧹 임시 파일 정리 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "[🧹] (Windows) 임시 파일 정리 중..."
          Remove-Item -Recurse -Force .tmp\ -ErrorAction SilentlyContinue
          Remove-Item -Force prometheus-*.tar.gz -ErrorAction SilentlyContinue

      - name: 🔁 Commit / Push or PR
        shell: bash
        run: |
          echo "[🔁] 변경사항 확인 및 Git 설정"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --exit-code --quiet README.md SECURITY.md; then
            echo "[⏭️] 변경사항 없음"
            exit 0
          fi
          echo "[✅] 변경사항 감지됨"
          git stash --include-untracked
          git pull --rebase origin main || echo "[⚠️] rebase 실패"
          git stash pop || echo "[⚠️] stash pop 실패"
          git add README.md SECURITY.md
          git commit -m "문서: README & SECURITY 업데이트 [skip ci]"
          if git push origin HEAD:main; then
            echo "[🚀] 정상 Push 완료"
          else
            echo "[⚠️] 직접 Push 권한 없음 — PR 생성 시도"
            BRANCH="update-docs-$(date +%s)"
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
            gh pr create \
              --title "문서: README & SECURITY 업데이트" \
              --body "자동 생성된 PR입니다." \
              --base main \
              --label documentation,auto-generated \
              || echo "[⚠️] 라벨 생성 실패"
            echo "[📦] PR 생성 완료"
          fi
