- name: 🚑 MySQL Healthcheck & Auto-Restart
  run: |
    echo "[HEALTHCHECK] Waiting for MySQL health..."
    CID=$(docker ps -q --filter "ancestor=mysql:8.0")
    for i in {1..30}; do
      STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CID")
      echo "[HEALTH] Status: $STATUS"
      if [ "$STATUS" == "healthy" ]; then exit 0; fi
      sleep 2
    done
    echo "[RESTART] Restarting unhealthy container..."
    docker restart "$CID"
    sleep 15

- name: 🔧 Install mysql-client
  run: |
    echo "[INSTALL] Installing mysql-client"
    sudo apt-get update && sudo apt-get install -y mysql-client

- name: 📂 Prepare Directories
  run: |
    echo "[DIR] Creating .github/migration and sql directories"
    mkdir -p .github/migration sql

- name: 🔋 Echo init.sql
  run: |
    echo "[ECHO] Generating sql/init.sql"
    cat <<'EOF' > sql/init.sql
CREATE DATABASE IF NOT EXISTS sample_db;
USE sample_db;

CREATE TABLE IF NOT EXISTS users (
  id INT AUTO_INCREMENT PRIMARY KEY,
  name VARCHAR(100)
);
INSERT INTO users (name) VALUES ('Alice'), ('Bob'), ('Charlie');

CREATE TABLE IF NOT EXISTS customers (
  customer_id INT AUTO_INCREMENT PRIMARY KEY,
  customer_name VARCHAR(100),
  registered_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);
INSERT INTO customers (customer_name) VALUES ('Alice'), ('Bob');

CREATE TABLE IF NOT EXISTS transactions (
  id INT AUTO_INCREMENT PRIMARY KEY,
  customer_id INT,
  amount DECIMAL(10,2),
  transaction_time TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);
INSERT INTO transactions (customer_id, amount)
VALUES (1, 300000), (2, 150000);
EOF

- name: 🔄 Remove and Regenerate Daily Queries (00:00, 08:00)
  if: github.event.schedule == '0 0 * * *' || github.event.schedule == '0 8 * * *'
  run: |
    echo "[CLEAN] Removing old migration files"
    rm -f .github/migration/*.{sql,log,csv}

    echo "[ECHO] checkcard_query.sql"
    cat <<'EOF' > .github/migration/checkcard_query.sql
-- Recent 3 months check card transactions
SELECT 
  c.customer_name,
  t.amount,
  t.transaction_time,
  CASE
    WHEN t.amount >= 500000 THEN 'High'
    WHEN t.amount >= 100000 THEN 'Medium'
    ELSE 'Low'
  END AS amount_category,
  DATE_FORMAT(t.transaction_time, '%Y-%m') AS month,
  COUNT(*) OVER(PARTITION BY c.customer_name) AS txn_count,
  RANK() OVER(PARTITION BY c.customer_name ORDER BY t.amount DESC) AS rank_amt
FROM customers c
JOIN transactions t ON c.customer_id = t.customer_id
WHERE t.transaction_time >= CURDATE() - INTERVAL 3 MONTH
ORDER BY month DESC, t.amount DESC;
EOF
