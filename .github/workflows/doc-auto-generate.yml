name: 📄 문서 자동화 & echo 로그 (구문 오류 완벽 제거 버전)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  auto-doc:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 [echo] echo 디렉토리 생성
        run: |
          echo "echo 'mkdir -p .github/echo'"
          mkdir -p .github/echo
          echo "echo '[📁] .github/echo 디렉토리 생성...'" | tee .github/echo/step-01.txt
          echo '[📁] .github/echo 디렉토리 생성...' >> .github/echo/step-01.txt

      - name: 📥 [echo] 저장소 체크아웃
        run: |
          echo "echo 'Checkout source...'"
          echo "Checkout source..." | tee .github/echo/step-02.txt
      - uses: actions/checkout@v4

      - name: 🐍 [echo] Python, pip, 필요 패키지 설치
        run: |
          echo "echo 'sudo apt-get update -y'"
          sudo apt-get update -y | tee .github/echo/step-03.txt
          echo "echo 'sudo apt-get install -y python3 python3-pip'"
          sudo apt-get install -y python3 python3-pip | tee -a .github/echo/step-03.txt
          echo "echo 'pip3 install --upgrade pip'"
          pip3 install --upgrade pip | tee -a .github/echo/step-03.txt

      - name: 📝 [echo] README.md 자동 생성/수정 (구문 오류 없는 echo)
        run: |
          echo "echo '[📝] README.md 자동 생성/수정...'"
          echo '[📝] README.md 자동 생성/수정...' > .github/echo/step-04.txt

          # 각 줄 로그만 echo로 기록(파이썬 파일에 shell 명령 들어가지 않음)
          echo "import datetime"         | tee -a .github/echo/step-04.txt
          echo "now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')" | tee -a .github/echo/step-04.txt
          echo "with open('README.md', 'a', encoding='utf-8') as f:"         | tee -a .github/echo/step-04.txt
          echo "    f.write(f'\\n## 워크플로우 자동 실행 로그\\n- 실행시각: {now}\\n')" | tee -a .github/echo/step-04.txt
          echo "print('[완료] README.md 자동 업데이트')"                        | tee -a .github/echo/step-04.txt

          cat <<EOF > gen_doc.py
import datetime
now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')
with open('README.md', 'a', encoding='utf-8') as f:
    f.write(f'\n## 워크플로우 자동 실행 로그\n- 실행시각: {now}\n')
print('[완료] README.md 자동 업데이트')
EOF

          echo "python3 gen_doc.py | tee -a .github/echo/step-04.txt"
          python3 gen_doc.py | tee -a .github/echo/step-04.txt

      - name: 🔄 [echo] 변경 파일 커밋 & 토큰 인증 푸시
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "echo 'git config --global user.name \"github-actions[bot]\"'"
          git config --global user.name "github-actions[bot]"
          echo "echo 'git config --global user.email \"github-actions[bot]@users.noreply.github.com\"'"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "echo 'git add README.md'"
          git add README.md
          echo "echo 'git commit -m \"docs: README.md 자동 업데이트 [skip ci]\" || echo \"No changes\"'"
          git commit -m "docs: README.md 자동 업데이트 [skip ci]" || echo "No changes"
          echo "echo 'git push https://x-access-token:\${GH_TOKEN}@github.com/\${GITHUB_REPOSITORY}.git HEAD:main || echo \"Push skipped\"'"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || echo "Push skipped"

      - name: 🗂️ [echo] 생성 파일 목록 확인
        run: |
          echo "echo 'ls -al .github/echo'"
          ls -al .github/echo | tee .github/echo/step-06.txt
          echo "echo 'ls -al'"
          ls -al | tee -a .github/echo/step-06.txt
