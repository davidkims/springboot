name: ✨ Backup & Echo All Workflow Files

  Automatically copies all workflow files from `.github/workflows` into a backup directory,
  prints `echo` output per file, sets permissions, and optionally commits changes.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # 매 정각 실행

permissions:
  contents: write
  pull-requests: write

jobs:
  backup-and-echo:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 📂 Create backup directory
        run: |
          echo "[+] Creating backup directory..."
          BACKUP_DIR="/opt/github_workflows_backup"
          mkdir -p "$BACKUP_DIR"
          echo "[+] Directory created at $BACKUP_DIR"

      - name: 📃 Copy all workflow files
        run: |
          BACKUP_DIR="/opt/github_workflows_backup"
          echo "[+] Copying .github/workflows/*.y*ml to $BACKUP_DIR"
          cp .github/workflows/*.y*ml "$BACKUP_DIR/"
          echo "[+] Copy completed"

      - name: 📄 Echo each file
        run: |
          BACKUP_DIR="/opt/github_workflows_backup"
          for f in "$BACKUP_DIR"/*.y*ml; do
            echo "[-->] Copied: $f"
            echo "[INFO] First 5 lines of $f:"
            head -n 5 "$f"
            echo "----------------------------------"
          done

      - name: ⚖️ Set permissions
        run: |
          echo "[+] Setting permissions to 777"
          chmod -R 777 /opt/github_workflows_backup
          echo "[✔] Permissions set"

      - name: 📅 Optional Git commit
        run: |
          if [ -d .git ]; then
            echo "[+] Git detected. Committing changes."
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add /opt/github_workflows_backup
            git commit -m "📃 Backup workflow files with echo outputs"
          else
            echo "[!] Not a git repo. Skipping commit."
          fi
        continue-on-error: true
