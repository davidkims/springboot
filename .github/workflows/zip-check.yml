name: 📦 저장소 전체 ZIP 백업 + _provenance 전체 파일 완전 삭제 + 에코/로그 통합

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  zip-and-delete-provenance:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 📁 에코/백업/로그 디렉토리 생성 (echo)
        run: |
          mkdir -p .github/echo_zip .github/zip_backup .github/echo_logs
          echo "mkdir -p .github/echo_zip .github/zip_backup .github/echo_logs" > .github/echo_zip/echo_dirs.sh

      - name: 🗑️ _provenance 전체 파일 완전 삭제 (공백/특수문자/폴더 안전, echo/로그)
        run: |
          PROV_DIR="_provenance"
          LOG_FILE=".github/echo_logs/delete_provenance.log"
          ECHO_FILE=".github/echo_zip/delete_provenance.sh"

          if [ -d "$PROV_DIR" ]; then
            # find: 하위 폴더까지, 파일명 공백/특수문자 안전하게 삭제
            find "$PROV_DIR" -type f | while IFS= read -r file; do
              echo "echo '[DELETE] $file'" | tee -a "$ECHO_FILE"
              echo "[DELETE] $file" | tee -a "$LOG_FILE"
              rm -f -- "$file"
            done
            REMAIN=$(find "$PROV_DIR" -type f | wc -l)
            echo "echo '[INFO] 삭제 후 남은 파일 수: $REMAIN'" | tee -a "$ECHO_FILE"
            echo "[INFO] 삭제 후 남은 파일 수: $REMAIN" | tee -a "$LOG_FILE"
          else
            echo "echo '[WARN] $PROV_DIR 디렉토리 없음'" | tee -a "$ECHO_FILE"
            echo "[WARN] $PROV_DIR 디렉토리 없음" | tee -a "$LOG_FILE"
          fi

      - name: 🗂️ 저장소 전체/폴더별/워크플로우별 zip 압축 (에코/로그)
        run: |
          TS=$(date +%Y%m%d_%H%M%S)

          # [1] 저장소 전체 zip
          ZIP_FILE=".github/zip_backup/repo_root_all_$TS.zip"
          ECHO_SH=".github/echo_zip/zip_repo_root_all_$TS.sh"
          LOG_FILE=".github/echo_logs/zip_repo_root_all_$TS.log"
          echo "echo 'zip -r $ZIP_FILE .'" | tee -a "$ECHO_SH"
          echo "zip -r $ZIP_FILE ." >> "$ECHO_SH"
          echo "[INFO] $(date '+%F %T') zip -r $ZIP_FILE ." | tee -a "$LOG_FILE"
          zip -r "$ZIP_FILE" . | tee -a "$LOG_FILE"
          echo "echo '[OK] 저장소 루트 전체 ZIP → $ZIP_FILE'" | tee -a "$ECHO_SH"
          echo "[OK] 저장소 루트 전체 ZIP → $ZIP_FILE" | tee -a "$LOG_FILE"
          chmod +x "$ECHO_SH"

          # [2] .github 폴더 zip
          ZIP_FILE2=".github/zip_backup/dotgithub_$TS.zip"
          ECHO_SH2=".github/echo_zip/zip_dotgithub_$TS.sh"
          LOG_FILE2=".github/echo_logs/zip_dotgithub_$TS.log"
          echo "echo 'zip -r $ZIP_FILE2 .github'" | tee -a "$ECHO_SH2"
          echo "zip -r $ZIP_FILE2 .github" >> "$ECHO_SH2"
          echo "[INFO] $(date '+%F %T') zip -r $ZIP_FILE2 .github" | tee -a "$LOG_FILE2"
          zip -r "$ZIP_FILE2" .github | tee -a "$LOG_FILE2"
          echo "echo '[OK] .github 전체 ZIP → $ZIP_FILE2'" | tee -a "$ECHO_SH2"
          echo "[OK] .github 전체 ZIP → $ZIP_FILE2" | tee -a "$LOG_FILE2"
          chmod +x "$ECHO_SH2"

          # [3] .github/workflows 폴더 zip
          ZIP_FILE3=".github/zip_backup/github_workflows_$TS.zip"
          ECHO_SH3=".github/echo_zip/zip_github_workflows_$TS.sh"
          LOG_FILE3=".github/echo_logs/zip_github_workflows_$TS.log"
          if [ -d ".github/workflows" ]; then
            echo "echo 'zip -r $ZIP_FILE3 .github/workflows'" | tee -a "$ECHO_SH3"
            echo "zip -r $ZIP_FILE3 .github/workflows" >> "$ECHO_SH3"
            echo "[INFO] $(date '+%F %T') zip -r $ZIP_FILE3 .github/workflows" | tee -a "$LOG_FILE3"
            zip -r "$ZIP_FILE3" .github/workflows | tee -a "$LOG_FILE3"
            echo "echo '[OK] .github/workflows ZIP → $ZIP_FILE3'" | tee -a "$ECHO_SH3"
            echo "[OK] .github/workflows ZIP → $ZIP_FILE3" | tee -a "$LOG_FILE3"
            chmod +x "$ECHO_SH3"
          else
            echo "echo '[SKIP] .github/workflows 폴더 없음'" | tee -a "$ECHO_SH3"
            echo "[SKIP] .github/workflows 폴더 없음" | tee -a "$LOG_FILE3"
          fi

          # [4] 주요 폴더별 개별 zip
          for dir in src config app scripts docs public backend frontend server client; do
            if [ -d "$dir" ]; then
              ZIP_FILE4=".github/zip_backup/${dir}_$TS.zip"
              ECHO_SH4=".github/echo_zip/zip_${dir}_$TS.sh"
              LOG_FILE4=".github/echo_logs/zip_${dir}_$TS.log"
              echo "echo 'zip -r $ZIP_FILE4 $dir'" | tee -a "$ECHO_SH4"
              echo "zip -r $ZIP_FILE4 $dir" >> "$ECHO_SH4"
              echo "[INFO] $(date '+%F %T') zip -r $ZIP_FILE4 $dir" | tee -a "$LOG_FILE4"
              zip -r "$ZIP_FILE4" "$dir" | tee -a "$LOG_FILE4"
              echo "echo '[OK] $dir ZIP → $ZIP_FILE4'" | tee -a "$ECHO_SH4"
              echo "[OK] $dir ZIP → $ZIP_FILE4" | tee -a "$LOG_FILE4"
              chmod +x "$ECHO_SH4"
            fi
          done

      - name: 📋 결과 확인/검증(에코/로그/ls)
        run: |
          echo "echo 'ls -al .github/zip_backup'" | tee -a .github/echo_zip/ls_zip_backup.sh
          ls -al .github/zip_backup | tee -a .github/echo_logs/ls_zip_backup.log
          echo "echo 'ls -al .github/echo_zip'" | tee -a .github/echo_zip/ls_echo_zip.sh
          ls -al .github/echo_zip | tee -a .github/echo_logs/ls_echo_zip.log
          echo "echo 'ls -al .github/echo_logs'" | tee -a .github/echo_zip/ls_echo_logs.sh
          ls -al .github/echo_logs | tee -a .github/echo_logs/ls_echo_logs.log
          echo "echo 'ls -al _provenance'" | tee -a .github/echo_zip/ls_provenance.sh
          if [ -d _provenance ]; then ls -al _provenance | tee -a .github/echo_logs/ls_provenance.log; fi
