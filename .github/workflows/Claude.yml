name: 🤖 Claude CLI Install & Test

on:
  workflow_dispatch:

jobs:
  install-claude-cli:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟩 Install Node.js & npm
        run: |
          echo "echo '[🟩] Node.js & npm 설치...'"
          echo '[🟩] Node.js & npm 설치...'
          sudo apt-get update -y
          sudo apt-get install -y nodejs npm
          node -v
          npm -v

      - name: 🤖 Install Claude CLI & Check Version
        run: |
          echo "echo '[🤖] Claude CLI 설치...'"
          echo '[🤖] Claude CLI 설치...'
          npm install -g --unsafe-perm claude
          echo "echo '[🤖] PATH 확인 및 설치 경로...'"
          echo '[🤖] PATH 확인 및 설치 경로...'
          export PATH="$(npm bin -g):$PATH"
          which node
          which npm
          which claude || true
          echo "echo '[🤖] Claude CLI 버전 확인...'"
          echo '[🤖] Claude CLI 버전 확인...'
          claude --version || npx claude --version || echo '[⚠️] Claude CLI 버전 확인 실패'
