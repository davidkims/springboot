name: 📤 Upload MySQL Manual with PR Creation

on:
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 📝 Generate download_manual.sh Script
        shell: bash
        run: |
          echo "[📝] .github/download_manual.sh 생성 시작"
          mkdir -p .github
          echo '#!/bin/bash' > .github/download_manual.sh
          echo 'echo "[📥] MySQL 명령어 매뉴얼 다운로드 시작"' >> .github/download_manual.sh
          echo 'mkdir -p .github/manuals' >> .github/download_manual.sh
          echo 'curl -L -o .github/manuals/mysql_commands_manual.txt https://raw.githubusercontent.com/datacharmer/test_db/master/load_employees.dump' >> .github/download_manual.sh
          echo 'echo "[✔] 다운로드 완료: .github/manuals/mysql_commands_manual.txt"' >> .github/download_manual.sh
          chmod +x .github/download_manual.sh

      - name: 📥 Run Download Script
        run: |
          echo "[📥] 다운로드 스크립트 실행"
          bash .github/download_manual.sh

      - name: 📦 Copy Manual to docs/
        run: |
          echo "[📦] docs 디렉토리 생성 및 파일 복사"
          mkdir -p docs
          cp .github/manuals/mysql_commands_manual.txt docs/

      - name: 🚀 Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "📘 Add MySQL command manual and download script"
          title: "📘 Update MySQL manual and script"
          body: |
            자동 생성된 매뉴얼과 스크립트를 추가하는 PR입니다.
          base: main
          branch: mysql-manual-update-${{ github.run_id }}
          delete-branch: true
