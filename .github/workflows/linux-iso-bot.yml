name: "🏦 Teradata + DW + Omni EchoOps v8.0.2 (다중 서비스+릴리스+슬롯+NIC+커널+스토리지+GHCR+아카이브)"

on:
  workflow_dispatch:
    inputs:
      generate_rows:
        description: "샘플 제공 데이터 생성 건수"
        required: true
        default: "1000"
      flags_json:
        description: >-
          실행 명령(JSON)입니다. 예:
          {"run_network":true,"run_omni":true,"run_analytics":true,"run_notification":true,"run_audit":true,"run_scheduler":true,"push_images":false,"create_release":false,"commit_changes":true,"enable_firewall":false,"install_nic_tools":true,"upgrade_kernel":false}
        required: true
        default: '{"run_network":true,"run_omni":true,"run_analytics":true,"run_notification":true,"run_audit":true,"run_scheduler":true,"push_images":false,"create_release":false,"commit_changes":true,"enable_firewall":false,"install_nic_tools":true,"upgrade_kernel":false}'
      slots_json:
        description: >-
          플레이 설정(JSON). 예:
          {"slots_omni":1,"slots_analytics":1,"slots_notification":1,"slots_audit":1}
        required: true
        default: '{"slots_omni":1,"slots_analytics":1,"slots_notification":1,"slots_audit":1}'
      storage_profile:
        description: "스토리지 클라이언트 약력(none|minio|s3|gcs|azure)"
        required: true
        default: "none"

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  packages: write
  actions: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ECHO_TD: .github/echo_td
      ECHO_DW: .github/echo_dw
      ECHO_NET: .github/echo_net
      ECHO_OMNI: .github/echo_omni
      ECHO_ANALYTICS: .github/echo_analytics
      ECHO_NOTIFICATION: .github/echo_notification
      ECHO_AUDIT: .github/echo_audit
      ECHO_SCHEDULER: .github/echo_scheduler
      ECHO_RELEASE: .github/echo_releases
      ECHO_LOG: .github/echo_logs
      ECHO_ARC: .github/echo_archives
      IMAGE_REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      OMNI_IMAGE: omni-echo
      ANALYTICS_IMAGE: analytics-echo
      NOTIFICATION_IMAGE: notification-echo
      AUDIT_IMAGE: audit-echo
      SCHEDULER_IMAGE: scheduler-echo
      DOCKER_NET: echo-net
      PROV_DIR: .github/echo_omni

      GENERATE_ROWS: ${{ github.event.inputs.generate_rows || '1000' }}
      STORAGE_PROFILE: ${{ github.event.inputs.storage_profile || 'none' }}

      RUN_NETWORK: ${{ fromJSON(github.event.inputs.flags_json || '{"run_network":true}').run_network || true }}
      RUN_OMNI: ${{ fromJSON(github.event.inputs.flags_json || '{"run_omni":true}').run_omni || true }}
      RUN_ANALYTICS: ${{ fromJSON(github.event.inputs.flags_json || '{"run_analytics":true}').run_analytics || true }}
      RUN_NOTIFICATION: ${{ fromJSON(github.event.inputs.flags_json || '{"run_notification":true}').run_notification || true }}
      RUN_AUDIT: ${{ fromJSON(github.event.inputs.flags_json || '{"run_audit":true}').run_audit || true }}
      RUN_SCHEDULER: ${{ fromJSON(github.event.inputs.flags_json || '{"run_scheduler":true}').run_scheduler || true }}
      PUSH_IMAGES: ${{ fromJSON(github.event.inputs.flags_json || '{"push_images":false}').push_images || false }}
      CREATE_RELEASE: ${{ fromJSON(github.event.inputs.flags_json || '{"create_release":false}').create_release || false }}
      COMMIT_CHANGES: ${{ fromJSON(github.event.inputs.flags_json || '{"commit_changes":true}').commit_changes || true }}
      ENABLE_FIREWALL: ${{ fromJSON(github.event.inputs.flags_json || '{"enable_firewall":false}').enable_firewall || false }}
      INSTALL_NIC: ${{ fromJSON(github.event.inputs.flags_json || '{"install_nic_tools":true}').install_nic_tools || true }}
      UPGRADE_KERNEL: ${{ fromJSON(github.event.inputs.flags_json || '{"upgrade_kernel":false}').upgrade_kernel || false }}

      SLOTS_OMNI: ${{ fromJSON(github.event.inputs.slots_json || '{"slots_omni":1}').slots_omni || 1 }}
      SLOTS_ANALYTICS: ${{ fromJSON(github.event.inputs.slots_json || '{"slots_analytics":1}').slots_analytics || 1 }}
      SLOTS_NOTIFICATION: ${{ fromJSON(github.event.inputs.slots_json || '{"slots_notification":1}').slots_notification || 1 }}
      SLOTS_AUDIT: ${{ fromJSON(github.event.inputs.slots_json || '{"slots_audit":1}').slots_audit || 1 }}

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v5

      - name: 🧰 Engine utils + dirs (+ common helpers)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${ECHO_TD}/sql/teradata" "${ECHO_TD}/sql/td_sim" \
                   "${ECHO_DW}/db" "${ECHO_DW}/queries" \
                   "${ECHO_NET}/nginx" "${ECHO_NET}/logs" "${ECHO_NET}/promtail" "${ECHO_NET}/prometheus" \
                   "${ECHO_OMNI}" "${ECHO_ANALYTICS}" "${ECHO_NOTIFICATION}" "${ECHO_AUDIT}" "${ECHO_SCHEDULER}" \
                   "${ECHO_LOG}" "${ECHO_ARC}" "${ECHO_RELEASE}"
          cat > .github/echo_tools.sh <<'BASH'
          set -Eeuo pipefail
          TS(){ date +%Y%m%d_%H%M%S; }
          echoe(){ echo "[ECHO] $*"; }
          warn(){ echo "[ECHO][WARN] $*" >&2; }
          faile(){ echo "[ECHO][FAIL] $*" >&2; exit 1; }
          have(){ command -v "$1" >/dev/null 2>&1; }
          retry(){ local t="$1"; shift; local s="$1"; shift; [ "${1:-}" = "--" ] && shift || true; local n=0; until "$@"; do n=$((n+1)); [ "$n" -ge "$t" ] && return 1; sleep "$s"; done; }
          wait_http(){ local url="$1"; local max="${2:-60}"; local i=0; while true; do curl -fsS --max-time 3 "$url" >/dev/null 2>&1 && return 0; i=$((i+1)); [ "$i" -ge "$max" ] && return 1; sleep 1; done; }
          ensure_podman(){
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends podman podman-docker slirp4netns uidmap containernetworking-plugins
            have podman || faile "podman not installed"
            podman info >/dev/null 2>&1 || true
          }
          resolve(){
            DOCKER_BIN="$(command -v /usr/bin/docker || true)"; [ -z "$DOCKER_BIN" ] && DOCKER_BIN="$(command -v docker || true)"
            PODMAN_BIN="$(command -v podman || true)"
            export DOCKER_BIN PODMAN_BIN
          }
          resolve
          ctr(){ if [ "${USE_PODMAN:-0}" = "1" ]; then [ -n "${PODMAN_BIN:-}" ] || faile "podman NA"; "$PODMAN_BIN" "$@"; else [ -n "${DOCKER_BIN:-}" ] || faile "docker NA"; "$DOCKER_BIN" "$@"; fi; }
          start_docker(){
            resolve
            if [ -n "${DOCKER_BIN:-}" ]; then
              set +e; "$DOCKER_BIN" info >/dev/null 2>&1; rc=$?; set -e
              if [ $rc -eq 0 ]; then USE_PODMAN=0; export USE_PODMAN; echo "USE_PODMAN=0" >> "$GITHUB_ENV"; echoe "engine=docker"; return 0; fi
              command -v service >/dev/null 2>&1 && { set +e; sudo -n service docker start >/dev/null 2>&1; "$DOCKER_BIN" info >/dev/null 2>&1 && { USE_PODMAN=0; export USE_PODMAN; echo "USE_PODMAN=0" >> "$GITHUB_ENV"; echoe "engine=docker"; return 0; }; set -e; }
            fi
            ensure_podman
            resolve
            USE_PODMAN=1; export USE_PODMAN; echo "USE_PODMAN=1" >> "$GITHUB_ENV"; echoe "engine=podman"
          }
          # ---------- Archive helper (robust) ----------
          make_archive(){
            local label="$1"; shift
            local ts="$(date +%Y%m%d_%H%M%S)"
            local outdir="${ECHO_ARC:-.github/echo_archives}"
            mkdir -p "$outdir"
            local tgt="${outdir}/${label}_${ts}.tar.gz"
            local existing=()
            for p in "$@"; do [ -e "$p" ] && existing+=("$p"); done
            if [ ${#existing[@]} -eq 0 ]; then
              echo "[ECHO] archive(skip: no existing paths) => ${tgt}"
              return 0
            fi
            if command -v realpath >/dev/null 2>&1; then
              tmpfile="$(mktemp)"
              for p in "${existing[@]}"; do rp="$(realpath -m "$p")"; printf "%s\n" "${rp#/}" >> "$tmpfile"; done
              tar -C / --ignore-failed-read --warning=no-file-ignored -czf "$tgt" -T "$tmpfile" || true
              rm -f "$tmpfile"
            else
              tar --ignore-failed-read --warning=no-file-ignored -czf "$tgt" "${existing[@]}" || true
            fi
            command -v sha256sum >/dev/null 2>&1 && sha256sum "$tgt" > "${tgt}.sha256" || true
            echo "[ECHO] archive => ${tgt}"
          }
          # Storage installer functions
          install_awscli(){
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
            rm -rf aws awscliv2.zip
          }
          install_s3fs(){
            sudo apt-get install -y s3fs
          }
          install_gcsfuse(){
            echo "deb https://packages.cloud.google.com/apt gcsfuse-bionic main" | sudo tee /etc/apt/sources.list.d/gcsfuse.list
            curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key add -
            sudo apt-get update
            sudo apt-get install -y gcsfuse
          }
          install_blobfuse2(){
            curl -sL https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
            echo "deb [arch=amd64] https://packages.microsoft.com/repos/microsoft-ubuntu-$(lsb_release -cs)-prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/microsoft-prod.list
            sudo apt-get update
            sudo apt-get install -y blobfuse2
          }
          BASH
          chmod +x .github/echo_tools.sh
          . .github/echo_tools.sh
          make_archive "00_init_layout" ".github/echo_td" ".github/echo_dw" ".github/echo_net" ".github/echo_omni"

      - name: 🧯 containerd 충돌 가드 & 기본 패키지
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          for f in /etc/apt/sources.list.d/docker*.list /etc/apt/sources.list.d/*docker*.list; do [ -f "$f" ] && sudo mv -f "$f" "${f}.disabled"; done
          printf "Package: containerd.io\nPin: release *\nPin-Priority: -1\n" | sudo tee /etc/apt/preferences.d/99-docker-containerd-pin >/dev/null
          sudo apt-get update -y
          sudo apt-get -y remove --purge containerd.io || true
          sudo apt-get -y -f install || true
          sudo dpkg --configure -a || true
          sudo apt-get install -y --no-install-recommends sqlite3 jq python3 python3-pip curl ca-certificates ufw gawk skopeo lsb-release
          make_archive "01_base_pkgs" "/etc/apt" "/var/lib/dpkg/status"

      - name: 🔧 NIC 설치 + 커널 업그레이드(옵션)
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          if [ "${INSTALL_NIC}" = "true" ]; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends ethtool net-tools iproute2 pciutils usbutils lshw bridge-utils vlan ifenslave iperf3 linux-firmware "linux-modules-extra-$(uname -r)" || true
            sudo modprobe 8021q || true; sudo modprobe bonding || true
          fi
          if [ "${UPGRADE_KERNEL}" = "true" ]; then
            if apt-cache policy linux-generic-hwe-24.04 | grep -q Candidate; then sudo apt-get install -y linux-generic-hwe-24.04
            elif apt-cache policy linux-generic-hwe-22.04 | grep -q Candidate; then sudo apt-get install -y linux-generic-hwe-22.04
            else sudo apt-get install -y linux-image-generic linux-headers-generic; fi
            uname -a | tee -a "${ECHO_LOG}/kernel_upgrade.log"
            echo "[KERNEL] kernel packages installed (reboot required)" | tee -a "${ECHO_LOG}/kernel_upgrade.log"
          fi
          make_archive "02_nic_kernel" "${ECHO_LOG}"

      - name: 🛞 컨테이너 엔진 준비
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          start_docker
          echoe "USE_PODMAN=${USE_PODMAN:-0}"
          make_archive "03_engine" "/etc/containers" "/etc/docker" || true

      - name: 🐍 TD Python 클라이언트
        shell: bash
        run: |
          set +e
          python3 -m pip install --upgrade pip >/dev/null 2>&1
          python3 -m pip install teradatasql teradatasqlalchemy >/dev/null 2>&1 || true
          exit 0

      - name: 📝 DDL/쿼리 생성
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "${ECHO_TD}/sql/td_sim/001_schema.sql" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS td;
          CREATE TABLE IF NOT EXISTS td.dim_customer( customer_id BIGSERIAL PRIMARY KEY, name VARCHAR(100) NOT NULL, email VARCHAR(200), created_ts TIMESTAMP DEFAULT NOW() );
          CREATE TABLE IF NOT EXISTS td.dim_account( account_id BIGSERIAL PRIMARY KEY, customer_id BIGINT NOT NULL REFERENCES td.dim_customer(customer_id), bank_code VARCHAR(10), currency CHAR(3) DEFAULT 'KRW', opened_ts TIMESTAMP DEFAULT NOW() );
          CREATE TABLE IF NOT EXISTS td.fact_transaction( txn_id BIGSERIAL PRIMARY KEY, account_id BIGINT NOT NULL REFERENCES td.dim_account(account_id), amount NUMERIC(18,2) NOT NULL, txn_type VARCHAR(16) CHECK (txn_type IN ('DEBIT','CREDIT')), txn_ts TIMESTAMP DEFAULT NOW() );
          CREATE TABLE IF NOT EXISTS td.echo_install_log( installed_at TIMESTAMP DEFAULT NOW(), component TEXT, detail TEXT );
          CREATE SCHEMA IF NOT EXISTS analytics;
          CREATE TABLE IF NOT EXISTS analytics.event_log(
            event_id BIGSERIAL PRIMARY KEY,
            service TEXT,
            payload JSONB,
            created_ts TIMESTAMP DEFAULT NOW()
          );
          CREATE SCHEMA IF NOT EXISTS notification;
          CREATE TABLE IF NOT EXISTS notification.message_queue(
            msg_id BIGSERIAL PRIMARY KEY,
            recipient TEXT,
            message TEXT,
            created_ts TIMESTAMP DEFAULT NOW(),
            sent_ts TIMESTAMP
          );
          CREATE SCHEMA IF NOT EXISTS audit;
          CREATE TABLE IF NOT EXISTS audit.audit_trail(
            audit_id BIGSERIAL PRIMARY KEY,
            actor TEXT,
            action TEXT,
            audit_ts TIMESTAMP DEFAULT NOW()
          );
          CREATE SCHEMA IF NOT EXISTS scheduler;
          CREATE TABLE IF NOT EXISTS scheduler.job_schedule(
            job_id BIGSERIAL PRIMARY KEY,
            job_name TEXT,
            scheduled_ts TIMESTAMP DEFAULT NOW(),
            status TEXT DEFAULT 'pending'
          );
          SQL
          cat > "${ECHO_DW}/queries/01_daily_volume.sql" <<'SQL'
          SELECT date_trunc('day', txn_ts) AS day, COUNT(*) AS txn_count, SUM(amount) AS total_amount FROM td.fact_transaction GROUP BY 1 ORDER BY 1 DESC;
          SQL
          cat > "${ECHO_DW}/queries/02_top_customers.sql" <<'SQL'
          SELECT c.customer_id, c.name, SUM(CASE WHEN f.txn_type='CREDIT' THEN f.amount ELSE -f.amount END) AS net_flow
          FROM td.fact_transaction f JOIN td.dim_account a ON a.account_id=f.account_id JOIN td.dim_customer c ON c.customer_id=a.customer_id
          GROUP BY 1,2 ORDER BY net_flow DESC LIMIT 20;
          SQL
          cat > "${ECHO_DW}/queries/03_analytics_summary.sql" <<'SQL'
          SELECT service, COUNT(*) AS event_count FROM analytics.event_log GROUP BY 1 ORDER BY 2 DESC;
          SQL
          cat > "${ECHO_DW}/queries/04_notification_pending.sql" <<'SQL'
          SELECT COUNT(*) AS pending_messages FROM notification.message_queue WHERE sent_ts IS NULL;
          SQL
          cat > "${ECHO_DW}/queries/05_audit_recent.sql" <<'SQL'
          SELECT actor, action, audit_ts FROM audit.audit_trail ORDER BY audit_ts DESC LIMIT 50;
          SQL
          cat > "${ECHO_DW}/queries/06_scheduler_tasks.sql" <<'SQL'
          SELECT status, COUNT(*) AS cnt FROM scheduler.job_schedule GROUP BY 1;
          SQL
          . .github/echo_tools.sh
          make_archive "04_sql_templates" "${ECHO_TD}" "${ECHO_DW}"

      - name: 📦 Storage clients (robust installers)
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          case "${STORAGE_PROFILE}" in
            none) echo "[STORAGE] skip";;
            s3|minio) install_awscli; install_s3fs;;
            gcs) install_gcsfuse;;
            azure) install_blobfuse2;;
            *) warn "unknown STORAGE_PROFILE='${STORAGE_PROFILE}', skip";;
          esac
          echo "[STORAGE] note: GitHub 러너는 ephemeral VM. 영구보관은 Artifacts/Cache/원격(S3/GCS/Azure) 권장."
          make_archive "05_storage_clients" "/etc/apt/sources.list.d" "/usr/share/keyrings" || true

      - name: 🧾 장치 인벤토리(JSON) 생성 → 모든 컨테이너에 전파
        shell: bash
        run: |
          set -Eeuo pipefail
          export SLOTS_OMNI="${SLOTS_OMNI:-1}"
          [[ "${SLOTS_OMNI}" =~ ^[0-9]+$ ]] || export SLOTS_OMNI=1
          mkdir -p "${ECHO_NET}"
          NIC_JSON="$(ip -j link show 2>/dev/null || echo '[]')"
          OS_NAME="$(. /etc/os-release; echo "${NAME} ${VERSION_ID}")"
          jq -n --arg kernel "$(uname -r)" \
                --arg uname "$(uname -a)" \
                --arg os "$OS_NAME" \
                --argjson nic "$NIC_JSON" \
                --argjson slots "$(jq -n --argjson omni ${SLOTS_OMNI} '{omni:$omni}')" \
                '{ts: now|todate, kernel:$kernel, uname:$uname, os:$os, nic:$nic, slots:$slots}' \
            > "${ECHO_NET}/device_info.json"
          . .github/echo_tools.sh
          make_archive "06_device_info" "${ECHO_NET}/device_info.json"

      - name: 🕸️ 네트워크
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          ctr network create "${DOCKER_NET}" >/dev/null 2>&1 || true
          make_archive "07_network_net" "/etc/cni" || true

      - name: 🧱 TD-SIM(Postgres) 기동 + 적재
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          retry 3 3 -- ctr pull postgres:16
          ctr rm -f td-sim >/dev/null 2>&1 || true
          ctr run -d --name td-sim --network "${DOCKER_NET}" --restart unless-stopped \
            -p 5432:5432 \
            -v "$PWD/${ECHO_TD}/sql/td_sim":/td:ro \
            -v "$PWD/${ECHO_NET}/device_info.json":/echo/device_info.json:ro \
            -e POSTGRES_PASSWORD=postgres postgres:16
          for i in $(seq 1 60); do ctr exec td-sim pg_isready -U postgres >/dev/null 2>&1 && break; sleep 2; done
          ctr exec -u postgres td-sim psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /td/001_schema.sql
          COUNT="${GENERATE_ROWS:-1000}"
          ctr exec -u postgres td-sim bash -lc "psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO td.dim_customer(name,email) SELECT '고객'||i, 'user'||i||'@bank.local' FROM generate_series(1,10) AS s(i);
          INSERT INTO td.dim_account(customer_id, bank_code, currency)
          SELECT customer_id, CASE WHEN customer_id%5=0 THEN 'NH' WHEN customer_id%4=0 THEN 'KB' WHEN customer_id%3=0 THEN 'WR' WHEN customer_id%2=0 THEN 'HN' ELSE 'SH' END, 'KRW'
          FROM td.dim_customer;
          INSERT INTO td.fact_transaction(account_id, amount, txn_type, txn_ts)
          SELECT (SELECT account_id FROM td.dim_account ORDER BY random() LIMIT 1),
                 (random()*100000)::numeric(18,2),
                 CASE WHEN random() > 0.5 THEN 'CREDIT' ELSE 'DEBIT' END,
                 NOW() - (random()*interval '10 days')
          FROM generate_series(1, ${COUNT});
          SQL"
          make_archive "08_tdsim_seed" "${ECHO_TD}"

      - name: 🧩 Omni(FastAPI) 이미지 빌드 + 슬롯 수만큼 기동
        if: ${{ env.RUN_OMNI == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          . .github/echo_tools.sh
          cat > "${ECHO_OMNI}/app.py" <<'PY'
          import os
          from datetime import datetime
          from typing import List, Dict, Any
          import psycopg2
          from psycopg2.pool import SimpleConnectionPool
          from fastapi import FastAPI, HTTPException, Query
          from fastapi.responses import JSONResponse, Response
          from prometheus_client import Counter, generate_latest, CONTENT_TYPE_LATEST
          DB_HOST=os.getenv("DB_HOST","td-sim"); DB_PORT=int(os.getenv("DB_PORT","5432"))
          DB_NAME=os.getenv("DB_NAME","postgres"); DB_USER=os.getenv("DB_USER","postgres"); DB_PASS=os.getenv("DB_PASS","postgres")
          QUERIES_DIR=os.getenv("QUERIES_DIR","/queries"); SERVICE=os.getenv("SERVICE_NAME","omni")
          app=FastAPI(title="Omni Echo API (DW+Metrics+Slots)")
          pool=None
          REQ_COUNTER=Counter("omni_requests_total","HTTP requests",["path"])
          @app.on_event("startup")
          def _startup():
            global pool
            pool=SimpleConnectionPool(minconn=1,maxconn=8, host=DB_HOST,port=DB_PORT,dbname=DB_NAME,user=DB_USER,password=DB_PASS)
            with pool.getconn() as c:
              with c.cursor() as cur:
                cur.execute("""CREATE SCHEMA IF NOT EXISTS ledger;
                               CREATE TABLE IF NOT EXISTS ledger.service_event(
                                 id BIGSERIAL PRIMARY KEY, at TIMESTAMP DEFAULT NOW(),
                                 service TEXT, event TEXT, detail TEXT);
                               CREATE TABLE IF NOT EXISTS ledger.service_slot(
                                 service TEXT, slot_id INT, state TEXT DEFAULT 'ready',
                                 created_at TIMESTAMP DEFAULT NOW(),
                                 PRIMARY KEY(service,slot_id));
                            """)
                cur.execute("INSERT INTO ledger.service_event(service,event,detail) VALUES (%s,%s,%s)", (SERVICE,"startup","uvicorn up"))
                c.commit()
          @app.on_event("shutdown")
          def _shutdown():
            global pool
            if pool: pool.closeall()
          def run_sql_file(path:str)->List[Dict[str,Any]]:
            import os
            sql_path=os.path.join(QUERIES_DIR,path)
            if not os.path.isfile(sql_path): raise HTTPException(status_code=404, detail=f"SQL not found: {path}")
            with open(sql_path,"r",encoding="utf-8") as f: sql=f.read()
            try:
              conn=pool.getconn(); cur=conn.cursor(); cur.execute(sql)
              cols=[c[0] for c in cur.description]; rows=cur.fetchall()
              cur.close(); pool.putconn(conn)
              out=[]
              from decimal import Decimal
              for r in rows:
                item={}
                for k,v in zip(cols,r):
                  if isinstance(v, datetime): item[k]=v.isoformat()
                  elif isinstance(v, Decimal): item[k]=float(v)
                  else: item[k]=v
                out.append(item)
              return out
            except Exception as e:
              raise HTTPException(status_code=500, detail=str(e))
          @app.get("/health")
          def health(): REQ_COUNTER.labels("/health").inc(); return {"status":"ok","ts":datetime.utcnow().isoformat(),"svc":SERVICE}
          @app.get("/dw/daily-volume")
          def dw_daily_volume(): REQ_COUNTER.labels("/dw/daily-volume").inc(); return JSONResponse(run_sql_file("01_daily_volume.sql"), headers={"Cache-Control":"public, max-age=60"})
          @app.get("/dw/top-customers")
          def dw_top_customers(): REQ_COUNTER.labels("/dw/top-customers").inc(); return JSONResponse(run_sql_file("02_top_customers.sql"), headers={"Cache-Control":"public, max-age=60"})
          @app.get("/metrics")
          def metrics(): return Response(content=generate_latest(), media_type=CONTENT_TYPE_LATEST)
          @app.get("/slots")
          def list_slots():
            conn=pool.getconn(); cur=conn.cursor()
            cur.execute("SELECT service, slot_id, state, created_at FROM ledger.service_slot ORDER BY service, slot_id")
            rows=cur.fetchall(); cur.close(); pool.putconn(conn)
            return [{"service":r[0], "slot_id":r[1], "state":r[2], "created_at":r[3].isoformat()} for r in rows]
          @app.get("/slots/{service}/create")
          def create_slots(service:str, count:int=Query(1, ge=1, le=100)):
            conn=pool.getconn(); cur=conn.cursor()
            cur.execute("SELECT COALESCE(MAX(slot_id),0) FROM ledger.service_slot WHERE service=%s",(service,))
            base=cur.fetchone()[0]
            for i in range(1, count+1):
              cur.execute("INSERT INTO ledger.service_slot(service,slot_id,state) VALUES (%s,%s,%s) ON CONFLICT DO NOTHING",(service, base+i, "ready"))
            conn.commit(); cur.close(); pool.putconn(conn)
            return {"created":count, "service":service}
          PY
          cat > "${ECHO_OMNI}/Dockerfile" <<'DOCKER'
          FROM python:3.11-slim
          RUN apt-get update && apt-get install -y --no-install-recommends curl && rm -rf /var/lib/apt/lists/*
