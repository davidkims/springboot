version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "🔄 actions"
    reviewers:
      - github-actions
    labels:
      - "automerge"
      - "dependencies"
  - package-ecosystem: "cargo"
    directory: "/rust-example"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "🔄 cargo"
    labels:
      - "dependencies"
  - package-ecosystem: "docker"
    directory: "/finance_app"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "🔄 docker"
    labels:
      - "dependencies"
