name: 📓 Update README with Portfolio + Workflow Stats

on:
  schedule:
    - cron: '*/1 * * * *'    # 매분 간격으로 실행
  workflow_dispatch:

permissions:
  contents: write
  workflows: write    # 워크플로우 파일 업데이트 권한 추가

jobs:
  update_readme:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📅 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Update System & GitHub CLI
        run: |
          echo "[🔧] 시스템 패키지 및 GitHub CLI 최신화 중..."
          sudo apt-get update -y && sudo apt-get upgrade -y
          sudo apt-get install -y gh
          gh --version

      - name: 🔄 Retry Failed Workflows
        run: |
          echo "[🔄] 실패한 워크플로우 자동 재실행 중..."
          for f in .github/workflows/*.yml; do
            FILENAME=$(basename "$f")
            echo "[🔍] $FILENAME 워크플로우 실패 목록 조회"
            FAILED_IDS=$(gh run list --workflow="$FILENAME" --limit 20 --json databaseId,conclusion \
              -q '.[] | select(.conclusion=="failure") | .databaseId' || echo "")
            for id in $FAILED_IDS; do
              echo "[🔄] Run ID $id 재실행 시도"
              gh run rerun "$id" || echo "[⚠️] Run ID $id 재실행 실패"
            done
          done

      - name: 📋 Ensure .tmp Directory
        run: |
          echo "[📁] .tmp 디렉토리 생성 확인"
          mkdir -p .tmp

      - name: 📊 Collect Workflow Stats
        run: |
          echo "[📊] 워크플로우 통계 수집 중..."
          OUTPUT_FILE=".tmp/workflows.md"
          echo "## ⚙️ GitHub Actions 워크플로우 목록 및 통계" > "$OUTPUT_FILE"
          echo "" >> "$OUTPUT_FILE"
          echo "| 워크플로우 이름 | 실행 수 | 성공 수 | 실패 수 | 성공률 |" >> "$OUTPUT_FILE"
          echo "|----------------|--------:|--------:|--------:|--------:|" >> "$OUTPUT_FILE"
          for f in .github/workflows/*.yml; do
            NAME=$(grep '^name:' "$f" | head -n1 | cut -d ':' -f2- | xargs)
            FILENAME=$(basename "$f")
            echo "[🔍] 처리 중: $NAME ($FILENAME)"
            RUNS=$(gh run list --workflow="$FILENAME" --limit 100 --json conclusion -q '.[] | .conclusion' || echo "")
            TOTAL=$(echo "$RUNS" | wc -l)
            SUCCESS=$(echo "$RUNS" | grep -c "success" || true)
            FAILURE=$((TOTAL - SUCCESS))
            if [ "$TOTAL" -gt 0 ]; then
              RATE=$(awk "BEGIN {printf \"%.1f\", ($SUCCESS/$TOTAL)*100}")
            else
              RATE="N/A"
            fi
            echo "| $NAME | $TOTAL | $SUCCESS | $FAILURE | $RATE% |" >> "$OUTPUT_FILE"
          done
          cat "$OUTPUT_FILE"

      - name: 📄 Generate README.md
        run: |
          echo "[📄] README.md 생성 중..."
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S KST')
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          {
            echo "# 👨‍💻 김병권 포토포리오"
            echo ""
            # 모든 워크플로우에 대한 배지 자동 생성
            for f in .github/workflows/*.yml; do
              BADGE_NAME=$(basename "$f")
              echo "[![${BADGE_NAME}](https://github.com/${REPO}/actions/workflows/${BADGE_NAME}/badge.svg)](https://github.com/${REPO}/actions/workflows/${BADGE_NAME})"
            done
            echo ""
            echo "자동으로 관리되는 프로젝트입니다. 매분 간격으로 업데이트됩니다."
            echo ""
            echo "## 🤖 디바이저 소개"
            echo "- 이름: 김병권"
            echo "- 이메일1: byungkwonkim95@gmail.com"
            echo "- 이메일2: kwonny1302@gmail.com"
            echo "- 전문 범위: 백업, GitHub Actions 자동화, DevOps"
            echo "- 스택: Python, Java, Spring Boot, Docker, PostgreSQL, MySQL"
            echo "- 자기개발 메시지: https://www.youtube.com/watch?v=G8lvQRALa6s"
            echo ""
            echo "## 📅 마지막 업데이트"
            echo "- $TIMESTAMP"
            echo ""
            echo "## ✅ 현재 브랜치"
            echo "- $BRANCH"
            echo ""
            echo "## 🔧 빌드 방식 배지"
            echo "![Build](https://github.com/${REPO}/actions/workflows/generate_full_readme.yml/badge.svg)"
            echo ""
            cat .tmp/workflows.md
          } > README.md

      - name: 🔁 Commit / Push or PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[🔁] 변경사항 확인 및 Git 설정"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --exit-code --quiet README.md; then
            echo "[⏭️] 변경사항 없음"
            exit 0
          fi

          echo "[✅] 변경사항 감지됨"
          # 언스테이지드 파일 임시 스태시
          git stash --include-untracked

          # 메인 브랜치 최신화
          if git pull --rebase origin main; then
            echo "[🔄] rebase 성공"
          else
            echo "[⚠️] rebase 실패"
          fi

          # 스태시 복원 (README만 반영되도록 충돌 무시)
          git stash pop || echo "[⚠️] stash pop 실패"

          # 커밋 및 푸시
          git add README.md
          git commit -m "Docs: Update README with workflow stats [skip ci]"

          if git push origin HEAD:main; then
            echo "[🚀] 정상 Push 완료"
          else
            echo "[⚠️] 직접 Push 권한 없음 — PR 생성 시도"
            BRANCH="update-readme-$(date +%s)"
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
            gh pr create \
              --title "Docs: Update README with workflow stats" \
              --body "자동 생성된 PR입니다." \
              --base main \
              --label documentation,auto-generated \
              || echo "[⚠️] 라벨 생성 실패"
            echo "[📦] PR 생성 완료"
          fi
