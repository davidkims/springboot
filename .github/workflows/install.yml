name: 🗂️ MEGA-DB/Transaction/Account/Transfer/User/Sim/Install/Permission/Mass/Operate/Util/Compose

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  db-echo-mega:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📁 Create all echo folders (Full Coverage + Teradata + DWH + Containers + Images)
        run: |
          mkdir -p .github/echo_db
          for d in dirs files installs upgrade permissions scripts logs services compose homebrew choco snap marketplace backup init test migration import export serverinfo errorlog util mass_db mass_script mass_query ddl ledger vaccount transfer user sim teradata dwh containers cli api runtime bin output verify auth sql db select exec transfer_exec images image_build image_manifest; do
            echo "echo 'mkdir -p .github/echo_db/$d'" >> .github/echo_db/echo_dir_create.sh
            mkdir -p ".github/echo_db/$d"
          done

      - name: 📝 Generate all SQL/scripts + Transfers + Ledgers + Echoes + Images (massive + integrated)
        run: |
          set -e
          SERVICES="mysql postgresql sqlite3"
          MASS_CNT=130000
          TX_TYPES="DEPOSIT WITHDRAWAL TRANSFER PAYMENT FEE"
          echo "{" > .github/echo_db/image_manifest/image_manifest.json

          for svc in $SERVICES; do
            echo "-- System-wide upgrade script for $svc" > .github/echo_db/upgrade/${svc}_upgrade.sql
            echo "ALTER SYSTEM SET maintenance_work_mem = '64MB';" >> .github/echo_db/upgrade/${svc}_upgrade.sql

            echo "  \"$svc\": [" >> .github/echo_db/image_manifest/image_manifest.json

            for i in $(seq 1 $MASS_CNT); do
              acct="account_${svc}_$i"
              ledger_tbl="ledger_${svc}_$i"
              transfer_tbl="transfer_${svc}_$i"

              echo "INSERT INTO $ledger_tbl (tx_id, account_no, tx_type, amount, balance, note, ts) VALUES ($i, 'ACC${svc}$(printf %06d $i)', 'TRANSFER', 5000, 95000, 'Transfer Tx $i', CURRENT_TIMESTAMP);" >> .github/echo_db/ledger/${svc}_${ledger_tbl}_insert.sql

              echo "INSERT INTO $transfer_tbl (tx_id, from_acc, to_acc, amount, tx_type, ts) VALUES ($i, 'ACC${svc}$(printf %06d $i)', 'ACC${svc}$(printf %06d $((i+1)))', 5000, 'TRANSFER', CURRENT_TIMESTAMP);" >> .github/echo_db/transfer/${svc}_${transfer_tbl}_insert.sql

              # 이미지 에코 빌드 Dockerfile + metadata
              imgdir=.github/echo_db/images/${svc}_img_$i
              mkdir -p $imgdir
              echo "FROM alpine" > $imgdir/Dockerfile
              echo "LABEL svc=$svc index=$i" >> $imgdir/Dockerfile
              echo "CMD echo \"[IMG][$svc][$i] Hello from image $i\"" >> $imgdir/Dockerfile
              echo "docker build -t ${svc}_img_$i -f $imgdir/Dockerfile ." > .github/echo_db/image_build/${svc}_build_$i.sh

              echo "    {\"tag\": \"${svc}_img_$i\", \"dockerfile\": \"$imgdir/Dockerfile\" }," >> .github/echo_db/image_manifest/image_manifest.json
            done

            echo "  ]," >> .github/echo_db/image_manifest/image_manifest.json

            echo "echo '[TRANSFER EXEC] $svc transfers execution'" > .github/echo_db/transfer_exec/${svc}_transfer_exec.sh
            echo "for sql in .github/echo_db/transfer/${svc}_*transfer_*.sql; do" >> .github/echo_db/transfer_exec/${svc}_transfer_exec.sh
            if [ "$svc" = "mysql" ]; then
              echo "  mysql -uroot -prootpass123 test_db < \$sql | tee -a .github/echo_db/output/${svc}_transfers.csv" >> .github/echo_db/transfer_exec/${svc}_transfer_exec.sh
            elif [ "$svc" = "postgresql" ]; then
              echo "  psql -U postgres -d test_db -f \$sql | tee -a .github/echo_db/output/${svc}_transfers.csv" >> .github/echo_db/transfer_exec/${svc}_transfer_exec.sh
            elif [ "$svc" = "sqlite3" ]; then
              echo "  sqlite3 test.db < \$sql | tee -a .github/echo_db/output/${svc}_transfers.csv" >> .github/echo_db/transfer_exec/${svc}_transfer_exec.sh
            fi
            echo "done" >> .github/echo_db/transfer_exec/${svc}_transfer_exec.sh
          done

          echo "  \"end\": true" >> .github/echo_db/image_manifest/image_manifest.json
          echo "}" >> .github/echo_db/image_manifest/image_manifest.json

      - name: 🏷️ Show all echo outputs
        run: |
          echo "[ECHO] Dumping all echo outputs"
          find .github/echo_db -type f | sort | while read f; do
            echo "-----"
            echo "[FILE] $f"
            cat "$f"
            echo
          done
