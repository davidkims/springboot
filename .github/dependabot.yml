version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "⬆️ deps"
    labels:
      - "dependencies"
      - "github-actions"
    ignore:
      - dependency-name: "actions/checkout"
        versions: ["<4.0.0"]  # 예시: 하위 버전 무시
