name: "🧰 SAP Logon Enterprise Deploy (Echo Scaffold + Silent Install + Artifact)"

on:
  workflow_dispatch:
    inputs:
      sap_gui_installer_url:
        description: "SAP GUI 설치파일 URL (사내 N/W 또는 SAP SMP URL). 비우면 설치 스킵"
        required: false
        default: ""
      sap_gui_sha256:
        description: "설치파일 SHA256(선택). 지정 시 무결성 검증"
        required: false
        default: ""
      landscape_name:
        description: "Landscape 표시명 (템플릿 주석용)"
        required: false
        default: "Company Landscape"
      deploy_scope:
        description: "배포 범위 (PerMachine|PerUser)"
        required: false
        default: "PerMachine"
      create_shortcuts:
        description: "바탕화면/시작메뉴 바로가기 생성 (true/false)"
        required: false
        default: "true"
      dry_run:
        description: "드라이런(설치 미수행, 파일만 생성) (true/false)"
        required: false
        default: "false"
      create_release:
        description: "배포 ZIP로 GitHub Release 생성 (true/false)"
        required: false
        default: "false"
      commit_branch:
        description: "생성물 커밋 대상 브랜치"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  sap-logon-deploy:
    runs-on: windows-latest
    env:
      ECHO_ROOT: .github/echo_sap
      OUT_DIR: .github/echo_sap/out
      SCRIPTS_DIR: .github/echo_sap/scripts
      TPL_DIR: .github/echo_sap/templates
      DOC_DIR: .github/echo_sap/docs
      LOG_DIR: .github/echo_sap/logs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare echo folders
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach($p in @("$env:ECHO_ROOT",$env:OUT_DIR,$env:SCRIPTS_DIR,$env:TPL_DIR,$env:DOC_DIR,$env:LOG_DIR")){
            New-Item -ItemType Directory -Force -Path $p | Out-Null
          }
          Write-Host "[ECHO][OK] Directories prepared"

      - name: Generate PowerShell deploy script (echo)
        shell: pwsh
        run: |
          $deploy = @'
          [CmdletBinding()]
          param(
            [string]$InstallerPath = "",
            [string]$LandscapeXml = "",
            [string]$SapLogonIni = "",
            [ValidateSet("PerMachine","PerUser")]
            [string]$Scope = "PerMachine",
            [switch]$CreateShortcuts,
            [switch]$DryRun
          )

          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $Script:LogDir = "$PSScriptRoot\..\logs"
          $Script:LogFile = Join-Path $Script:LogDir ("deploy-" + (Get-Date -Format "yyyyMMdd-HHmmss") + ".log")
          if(!(Test-Path $Script:LogDir)){ New-Item -ItemType Directory -Force -Path $Script:LogDir | Out-Null }

          function Write-Log {
            param([string]$Message,[string]$Level="INFO")
            $ts = (Get-Date).ToString("u")
            $line = "[{0}][{1}] {2}" -f $ts,$Level,$Message
            Write-Host $line
            Add-Content -LiteralPath $Script:LogFile -Value $line
          }

          function Ensure-Dir { param([string]$Path) if(!(Test-Path $Path)){ New-Item -ItemType Directory -Force -Path $Path | Out-Null } }

          function Install-SapGui {
            param([string]$Path)
            if([string]::IsNullOrWhiteSpace($Path) -or !(Test-Path $Path)){
              Write-Log "Installer not provided or not found. Skip install." "WARN"; return
            }
            if($DryRun){ Write-Log "DryRun: would install $Path" "INFO"; return }

            $ext = [IO.Path]::GetExtension($Path).ToLowerInvariant()
            if($ext -eq ".msi"){
              Write-Log "Installing MSI: $Path" "INFO"
              $p = Start-Process msiexec.exe -ArgumentList "/i `"$Path`" /qn /norestart" -Wait -PassThru
              if($p.ExitCode -ne 0){ throw "MSI install failed (rc=$($p.ExitCode))" }
              Write-Log "MSI install OK" "INFO"
              return
            }

            if($ext -eq ".exe"){
              Write-Log "Installing EXE (try silent flags): $Path" "INFO"
              $candidates = @(
                "/silent",
                "/verysilent",
                "/s",
                "/qn",
                "/quiet",
                "/passive /norestart"
              )
              foreach($arg in $candidates){
                Write-Log "Try args: $arg" "INFO"
                try{
                  $p = Start-Process -FilePath $Path -ArgumentList $arg -Wait -PassThru
                  if($p.ExitCode -eq 0){
                    Write-Log "EXE install OK with args: $arg" "INFO"; return
                  } else {
                    Write-Log "ExitCode=$($p.ExitCode) with args: $arg" "WARN"
                  }
                } catch {
                  Write-Log "Install attempt failed: $($_.Exception.Message)" "WARN"
                }
              }
              Write-Log "EXE silent install did not succeed; trying SAP specific setup binary discovery" "WARN"
            }

            # SAP GUI 배포 폴더 내 SAP*Setup 검색
            $dir = (Get-Item $Path).Directory.FullName
            $setup = Get-ChildItem -Path $dir -Recurse -Include *SAP*Setup*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if($setup){
              Write-Log "Found SAP setup candidate: $($setup.FullName)" "INFO"
              if($DryRun){ Write-Log "DryRun: would run $($setup.FullName) /Silent" "INFO"; return }
              $p = Start-Process -FilePath $setup.FullName -ArgumentList "/Silent" -Wait -PassThru
              if($p.ExitCode -ne 0){ throw "SAP setup failed (rc=$($p.ExitCode))" }
              Write-Log "SAP setup OK" "INFO"
            } else {
              Write-Log "No SAP*Setup*.exe found; installation skipped" "WARN"
            }
          }

          function Deploy-Landscape {
            param([string]$Xml,[string]$Ini,[string]$Scope)
            $ProgramDataSAP = Join-Path $env:ProgramData "SAP"
            $AppDataSAP = Join-Path $env:AppData "SAP"

            if($Scope -eq "PerMachine"){
              Ensure-Dir $ProgramDataSAP
              if($Xml -and (Test-Path $Xml)){
                Copy-Item -Force -LiteralPath $Xml -Destination (Join-Path $ProgramDataSAP "SAPUILandscape.xml")
                Write-Log "SAPUILandscape.xml -> $ProgramDataSAP" "INFO"
              } else { Write-Log "Landscape XML not provided; skipped" "WARN" }

              if($Ini -and (Test-Path $Ini)){
                Ensure-Dir $AppDataSAP
                Copy-Item -Force -LiteralPath $Ini -Destination (Join-Path $AppDataSAP "saplogon.ini")
                Write-Log "saplogon.ini -> $AppDataSAP (legacy clients)" "INFO"
              }
            } else {
              Ensure-Dir $AppDataSAP
              if($Xml -and (Test-Path $Xml)){
                Copy-Item -Force -LiteralPath $Xml -Destination (Join-Path $AppDataSAP "SAPUILandscape.xml")
                Write-Log "SAPUILandscape.xml -> $AppDataSAP" "INFO"
              }
              if($Ini -and (Test-Path $Ini)){
                Copy-Item -Force -LiteralPath $Ini -Destination (Join-Path $AppDataSAP "saplogon.ini")
                Write-Log "saplogon.ini -> $AppDataSAP (legacy clients)" "INFO"
              }
            }
          }

          function Create-Shortcuts {
            # 대표 경로들 확인
            $candidates = @(
              "C:\Program Files (x86)\SAP\FrontEnd\SAPgui\saplogon.exe",
              "C:\Program Files\SAP\FrontEnd\SAPgui\saplogon.exe"
            )
            $exe = $null
            foreach($c in $candidates){ if(Test-Path $c){ $exe = $c; break } }
            if(-not $exe){ Write-Log "saplogon.exe not found; skip shortcuts" "WARN"; return }

            $w = New-Object -ComObject WScript.Shell
            $publicDesktop = "$env:Public\Desktop"
            $startMenu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs"
            Ensure-Dir $publicDesktop
            Ensure-Dir $startMenu

            $link1 = Join-Path $publicDesktop "SAP Logon.lnk"
            $s1 = $w.CreateShortcut($link1)
            $s1.TargetPath = $exe
            $s1.WorkingDirectory = (Split-Path $exe)
            $s1.Description = "SAP Logon"
            $s1.Save()
            Write-Log "Shortcut created: $link1" "INFO"

            $link2 = Join-Path $startMenu "SAP Logon.lnk"
            $s2 = $w.CreateShortcut($link2)
            $s2.TargetPath = $exe
            $s2.WorkingDirectory = (Split-Path $exe)
            $s2.Description = "SAP Logon"
            $s2.Save()
            Write-Log "Shortcut created: $link2" "INFO"
          }

          Write-Log "==== SAP Logon Deploy start ====" "INFO"
          Write-Log "Scope=$Scope, DryRun=$DryRun, CreateShortcuts=$CreateShortcuts" "INFO"

          Install-SapGui -Path $InstallerPath
          Deploy-Landscape -Xml $LandscapeXml -Ini $SapLogonIni -Scope $Scope
          if($CreateShortcuts){ Create-Shortcuts }

          Write-Log "==== Done ====" "INFO"
          Write-Host ("[ECHO][LOG] " + $Script:LogFile)
          '@

          $path = Join-Path $env:SCRIPTS_DIR "deploy_sap_logon.ps1"
          $deploy | Set-Content -Encoding UTF8 -LiteralPath $path
          Write-Host "[ECHO][OK] Generated: $path"

      - name: Generate templates and docs (echo)
        shell: pwsh
        run: |
          # README
          @"
          # SAP Logon Enterprise Deploy Scaffold

          이 폴더는 GitHub Actions가 **에코** 방식으로 자동 생성했습니다.

          - `scripts/deploy_sap_logon.ps1` : 무인 설치 + Landscape 배포 + 바로가기 생성
          - `templates/SAPUILandscape.xml` : 샘플(빈 골격). 실제 환경에선 SAP Logon에서 Export한 파일 사용 권장
          - `templates/saplogon.ini`       : 레거시 클라이언트용 샘플
          - `logs/`                        : 실행 로그
          - `out/`                         : 산출물(압축/다운로드)

          **주의**  
          - SAP GUI 설치 파일은 SAP의 라이선스 및 배포 정책을 준수해야 합니다. 저장소에 업로드하지 말고, 내부 배포 URL 또는 사내 공유 경로를 입력하여 사용하세요.
          - 최신 SAP GUI는 `SAPUILandscape.xml` 기반 구성이 표준입니다. `saplogon.ini`는 구형 호환용입니다.
          "@ | Set-Content -Encoding UTF8 $env:DOC_DIR\README_DEPLOY.md

          # Landscape 템플릿 (빈 골격 + 주석)
          @"
          <!--
            TEMPLATE ONLY — 실제로는 SAP Logon에서 내보낸 SAPUILandscape.xml을 사용하세요.
            Landscape: ${{ github.event.inputs.landscape_name }}
          -->
          <?xml version="1.0" encoding="UTF-8"?>
          <Landscape>
            <Services>
              <!-- 예시: SAPGUI 항목들 배치 -->
              <!--
              <Service name="SAPGUI">
                <Item name="PRD" description="ECC Production" type="SAPGUI">
                  <Server>prd.example.internal</Server>
                  <SystemID>PRD</SystemID>
                  <SystemNumber>00</SystemNumber>
                  <RouterString/>
                </Item>
              </Service>
              -->
            </Services>
          </Landscape>
          "@ | Set-Content -Encoding UTF8 $env:TPL_DIR\SAPUILandscape.xml

          # saplogon.ini 샘플(선택)
          @";
          ; TEMPLATE ONLY — 구형/레거시 호환용 샘플
          ; 실제 환경에 맞게 수정하거나 XML을 표준으로 사용하세요.
          [Description]
          ENTRIES=1
          [Entry1]
          Name=PRD
          ApplicationServer=prd.example.internal
          SystemNumber=00
          SAPRouter=
          "@ | Set-Content -Encoding UTF8 $env:TPL_DIR\saplogon.ini

          Write-Host "[ECHO][OK] Generated templates and docs"

      - name: Optionally download SAP GUI installer & verify (if URL provided)
        shell: pwsh
        run: |
          $url = "${{ github.event.inputs.sap_gui_installer_url }}"
          if([string]::IsNullOrWhiteSpace($url)){
            Write-Host "[ECHO][SKIP] No installer URL provided"
            exit 0
          }
          $dl = Join-Path $env:OUT_DIR "SAP_GUI_Setup.exe"
          Write-Host "[ECHO][GET] $url -> $dl"
          try{
            Invoke-WebRequest -Uri $url -OutFile $dl -UseBasicParsing -TimeoutSec 600
          } catch {
            Write-Error "Download failed: $($_.Exception.Message)"
          }
          if(!(Test-Path $dl)){ throw "Installer not downloaded." }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $dl).Hash.ToLower()
          $exp = "${{ github.event.inputs.sap_gui_sha256 }}".ToLower()
          if($exp){
            if($sha -ne $exp){ throw "SHA256 mismatch. got=$sha expected=$exp" }
            Write-Host "[ECHO][OK] SHA256 verified"
          } else {
            Write-Host "[ECHO][WARN] SHA256 not provided. got=$sha"
          }
          "SAP_GUI_INSTALLER=$dl" | Out-File -FilePath $env:OUT_DIR\env.properties -Encoding ascii

      - name: Run deploy script (install/landscape/shortcuts)
        shell: pwsh
        run: |
          $installer = ""
          $envFile = "$env:OUT_DIR\env.properties"
          if(Test-Path $envFile){
            $kv = Get-Content $envFile | Where-Object { $_ -match "=" } | ForEach-Object {
              $p=$_.Split("=",2); [PSCustomObject]@{ K=$p[0]; V=$p[1] }
            } | Group-Object -AsHashTable -AsString K,V
            if($kv.ContainsKey("SAP_GUI_INSTALLER")){ $installer = $kv["SAP_GUI_INSTALLER"]["V"] }
          }

          $script = Join-Path $env:SCRIPTS_DIR "deploy_sap_logon.ps1"
          $xml = Join-Path $env:TPL_DIR "SAPUILandscape.xml"
          $ini = Join-Path $env:TPL_DIR "saplogon.ini"

          $scope = "${{ github.event.inputs.deploy_scope }}"
          $mkShort = [bool]::Parse("${{ github.event.inputs.create_shortcuts }}")
          $dry = [bool]::Parse("${{ github.event.inputs.dry_run }}")

          Write-Host "[ECHO][RUN] $script"
          & $script `
            -InstallerPath $installer `
            -LandscapeXml $xml `
            -SapLogonIni $ini `
            -Scope $scope `
            -CreateShortcuts:($mkShort) `
            -DryRun:($dry)

      - name: Package artifact (zip)
        shell: pwsh
        run: |
          $zip = "$env:OUT_DIR\sap-logon-deploy.zip"
          if(Test-Path $zip){ Remove-Item -Force $zip }
          Compress-Archive -Path "$env:ECHO_ROOT\*" -DestinationPath $zip
          Write-Host "[ECHO][OK] Packed -> $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sap-logon-deploy
          path: .github/echo_sap/out/sap-logon-deploy.zip
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated scaffold to repo
        if: ${{ github.event.inputs.commit_branch != '' }}
        shell: pwsh
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git checkout "${{ github.event.inputs.commit_branch }}"
          git add $env:ECHO_ROOT
          if((git status --porcelain) -ne $null){
            git commit -m "chore(sap): echo scaffold + deploy script [auto]"
            git push
            Write-Host "[ECHO][OK] committed/pushed"
          } else {
            Write-Host "[ECHO][SKIP] nothing to commit"
          }

      - name: Create GitHub Release (optional)
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "sap-deploy-${{ github.run_number }}"
          name: "SAP Logon Deploy Scaffold #${{ github.run_number }}"
          body: "Auto-generated SAP Logon deployment scaffold and package."
          files: |
            .github/echo_sap/out/sap-logon-deploy.zip
