name: 🏢 MEGA DB + Middleware + Upgrade + EchoOps

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  mega-deploy:
    runs-on: ubuntu-latest
    env:
      DB_USER: root
      DB_PASS: rootpass123
      DB_NAME: sample_db
      BASE: /opt/email
      DOMAIN: example.local
      USER_COUNT: 50
      TEST_COUNT: 3
      MIDDLEWARE: mysql postgres oracle redis kafka vault airflow spark camunda

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 디렉토리 및 에코 스크립트 생성
        run: |
          set -e
          mkdir -p .github/echo_logs
          for dir in \
            .github/scripts \
            .github/firewall \
            .github/echo_{scorecard,codeql,logs,security,upgrade,autoup,pages,templates,backup,monitoring,services,db,permissions} \
            site/{scorecard,security,upgrade,pr,backup,logs,templates}; do
            mkdir -p "$dir"
            echo "echo '[ECHO] 디렉토리 생성: $dir'" >> .github/echo_logs/create_dirs.sh
          done
          chmod +x .github/echo_logs/create_dirs.sh
          bash .github/echo_logs/create_dirs.sh

      - name: ⬆️ 모든 패키지 업데이트
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get upgrade -y
          echo "echo '[ECHO] 시스템 패키지 업데이트 완료'" >> .github/echo_logs/upgrade.log

      - name: 🔥 방화벽 권한 파일 생성
        run: |
          set -e
          FW_FILE=".github/firewall/firewall_rules.sh"
          echo "#!/bin/bash" > "$FW_FILE"
          echo "ufw allow 22" >> "$FW_FILE"
          echo "ufw allow 80" >> "$FW_FILE"
          echo "ufw allow 443" >> "$FW_FILE"
          echo "ufw allow 3306" >> "$FW_FILE"
          echo "ufw allow 5432" >> "$FW_FILE"
          echo "ufw allow 6379" >> "$FW_FILE"
          echo "ufw allow 9092" >> "$FW_FILE"
          echo "ufw allow 8200" >> "$FW_FILE"
          echo "ufw allow 8080" >> "$FW_FILE"
          echo "ufw allow 7077" >> "$FW_FILE"
          echo "ufw allow 8081" >> "$FW_FILE"
          chmod +x "$FW_FILE"
          echo "echo '[ECHO] 방화벽 규칙 파일 생성 완료: $FW_FILE'" >> .github/echo_logs/firewall.log

      - name: 🐳 Docker 컨테이너 설치 (기본 설치 활용)
        run: |
          set -e
          docker --version
          sudo systemctl start docker
          sudo systemctl enable docker

          docker run -d --name mysql -e MYSQL_ROOT_PASSWORD=$DB_PASS -p 3306:3306 mysql:8
          docker run -d --name postgres -e POSTGRES_PASSWORD=$DB_PASS -p 5432:5432 postgres:15
          docker run -d --name redis -p 6379:6379 redis:7
          docker run -d --name kafka -p 9092:9092 bitnami/kafka:latest
          docker run -d --name vault -p 8200:8200 vault:latest
          docker run -d --name airflow -p 8080:8080 apache/airflow:2.9.3
          docker run -d --name spark -p 7077:7077 bitnami/spark:latest
          docker run -d --name camunda -p 8081:8080 camunda/camunda-bpm-platform:latest

          echo "echo '[ECHO] DB 및 미들웨어 컨테이너 설치 완료'" >> .github/echo_logs/install.log

      - name: 📜 설치 및 실행 로그 출력
        run: |
          set -e
          echo "===== 생성된 로그 목록 ====="
          ls -R .github/echo_logs || true
          echo "===== 로그 파일 내용 ====="
          cat .github/echo_logs/*.log || true
