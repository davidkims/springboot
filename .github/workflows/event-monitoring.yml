# .github/workflows/event-monitoring.yml
name: 📡 워크플로 이벤트 모니터링 (Dispatch 방식)

on:
  repository_dispatch:
    types:
      - workflow_run

jobs:
  monitor-run:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Run 데이터 가져오기
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.client_payload.run_id }} \
            > run-${{ github.event.client_payload.run_id }}.json

      - name: 📝 워크플로 실행 세부 정보 로그
        run: |
          NAME=$(jq -r .name run-${{ github.event.client_payload.run_id }}.json)
          RN=$(jq -r .run_number run-${{ github.event.client_payload.run_id }}.json)
          STATUS=$(jq -r .status run-${{ github.event.client_payload.run_id }}.json)
          CONCL=$(jq -r .conclusion run-${{ github.event.client_payload.run_id }}.json)
          URL=$(jq -r .html_url run-${{ github.event.client_payload.run_id }}.json)
          echo "워크플로: $NAME (#$RN)"
          echo "상태: $STATUS / 결론: $CONCL"
          echo "URL: $URL"

      - name: 📁 실행 메타데이터 저장
        run: |
          jq -r '"워크플로: "+.name+" (#"+(.run_number|tostring)+")","상태: "+.status+" / 결론: "+.conclusion,"URL: "+.html_url' \
            run-${{ github.event.client_payload.run_id }}.json \
          > run-${{ github.event.client_payload.run_id }}.txt

      - name: 📂 런 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: workflow-run-${{ github.event.client_payload.run_id }}
          path: run-${{ github.event.client_payload.run_id }}.txt

      - name: 🔍 잡 목록 조회 및 저장
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.client_payload.run_id }}/jobs \
            > jobs-${{ github.event.client_payload.run_id }}.json

      - name: 📂 잡 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: workflow-jobs-${{ github.event.client_payload.run_id }}
          path: jobs-${{ github.event.client_payload.run_id }}.json
