name: 📓 포트폴리오 + 워크플로 통계로 README & SECURITY 업데이트

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update_docs:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [16, 18, 20]
      max-parallel: 3  # 병렬 3개까지 허용
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_LATENCY_MS: 1000
      TMP_DIR: .tmp/${{ matrix.os }}-${{ matrix.node-version }}

    steps:
      - name: 🖥️ 환경 정보
        run: |
          echo "[🖥️] 실행 환경 정보 확인"
          echo "OS: ${{ runner.os }}"
          echo "Node.js 버전: ${{ matrix.node-version }}"

      - name: 📅 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 📅 Checkout 완료
        run: echo "[📅] 레포지토리 체크아웃 완료"

      - name: 📦 캐시 설정 (pip, Prometheus)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            /tmp/prometheus-cache
          key: ${{ runner.os }}-cache-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-cache-
      - name: 📦 캐시 설정 완료
        run: echo "[📦] 캐시 설정 완료"

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 📦 Node.js 설치 완료
        run: echo "[📦] Node.js ${{ matrix.node-version }} 설치 완료"

      - name: 🔧 패키지 설치 (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "[🔧] Linux: apt-get로 시스템 패키지 설치 중..."
          sudo apt-get update -y
          echo "[🔧] apt 업데이트 완료"
          sudo apt-get install -y gh jq parallel
          echo "[✅] Linux 패키지 설치 완료"

      - name: 🔧 패키지 설치 (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "[🔧] macOS: brew로 시스템 패키지 설치 중..."
          brew update
          echo "[🔧] brew 업데이트 완료"
          brew install gh jq parallel
          echo "[✅] macOS 패키지 설치 완료"

      - name: 🔧 패키지 설치 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "[🔧] Windows: Chocolatey로 시스템 패키지 설치 중..."
          choco install git.install jq -y || Write-Host "[⚠️] git 또는 jq 설치 실패"
          Write-Host "[ℹ️] parallel 패키지가 Chocolatey에 없어 설치를 생략합니다."
          # Windows PowerShell에서는 ForEach-Object -Parallel 또는 PSWorkflow 모듈 사용을 권장합니다.
          Write-Host "[✅] Windows 패키지 설치 완료 (parallel 생략)"

      - name: 🔍 패키지 버전 확인
        run: |
          echo "[🔍] gh 버전:" && gh --version || echo "[ℹ️] gh CLI not available"
          echo "[🔍] jq 버전:" && jq --version || echo "[ℹ️] jq not available"
          echo "[🔍] parallel 버전:" && parallel --version || echo "[ℹ️] parallel not available"

      - name: 🔄 Prometheus 설치 (Linux, 재시도 3회)
        if: runner.os == 'Linux'
        run: |
          echo "[🔄] Prometheus 다운로드 및 설치 (재시도 로직)"
          for i in {1..3}; do
            echo "[🔄] 시도 $i/3"
            if wget --timeout=30 https://github.com/prometheus/prometheus/releases/download/v2.53.5/prometheus-2.53.5.linux-amd64.tar.gz -O prometheus.tar.gz; then
              echo "[✅] Prometheus 패키지 다운로드 성공"
              break
            fi
            echo "[⚠️] 다운로드 실패, 재시도 중..."
            sleep 5
          done
          echo "[📂] 압축 해제 중..."
          tar xzf prometheus.tar.gz
          echo "[📂] /opt/prometheus 디렉토리 생성 중..."
          sudo mkdir -p /opt/prometheus
          sudo mv prometheus-2.53.5.linux-amd64 /opt/prometheus
          echo "[✅] Prometheus 설치 완료"

      - name: 📂 Prometheus 데이터 디렉토리 생성 (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "[📂] Prometheus 데이터 디렉토리 생성 중..."
          sudo useradd --no-create-home --shell /bin/false prometheus || true
          sudo mkdir -p /opt/prometheus/data
          sudo chown -R prometheus:prometheus /opt/prometheus/data
          echo "[✅] Prometheus 데이터 디렉토리 생성 완료"

      - name: 🛡️ Generate SECURITY.md
        run: |
          echo "[🛡️] SECURITY.md 생성 및 검증 체크리스트 작성 중..."
          echo "# Security Policy" > SECURITY.md
          echo "## Supported Versions" >> SECURITY.md
          echo "| Version | Supported          |" >> SECURITY.md
          echo "| ------- | ------------------ |" >> SECURITY.md
          echo "| 5.1.x   | :white_check_mark: |" >> SECURITY.md
          echo "| 5.0.x   | :x:                |" >> SECURITY.md
          echo "| 4.0.x   | :white_check_mark: |" >> SECURITY.md
          echo "| < 4.0   | :x:                |" >> SECURITY.md
          echo "" >> SECURITY.md
          echo "## Reporting a Vulnerability" >> SECURITY.md
          echo "Use this section to tell people how to report vulnerabilities." >> SECURITY.md
          echo "" >> SECURITY.md
          echo "## Workflow Validation Checklist" >> SECURITY.md
          for f in .github/workflows/*.{yml,yaml}; do
            base=$(basename "$f")
            echo "[🗒️] Adding checks for $base"
            echo "- [ ] $base: YAML syntax validation"      >> SECURITY.md
            echo "- [ ] $base: Permissions review"          >> SECURITY.md
            echo "- [ ] $base: Secret detection scan"        >> SECURITY.md
            echo "- [ ] $base: Dependency scanning enabled"  >> SECURITY.md
            echo "- [ ] $base: Container scanning enabled"   >> SECURITY.md
          done
          echo "[✅] SECURITY.md 업데이트 완료"

      - name: 📋 Ensure TMP_DIR
        run: |
          echo "[📋] TMP_DIR 생성 확인: $TMP_DIR"
          mkdir -p "$TMP_DIR"
          echo "[✅] $TMP_DIR 준비 완료"

      - name: 📊 병렬 워크플로우 통계 수집
        run: |
          echo "[📊] 워크플로우 통계 수집 시작..."
          OUTPUT_FILE="$TMP_DIR/workflows.md"
          echo "## ⚙️ GitHub Actions 워크플로우 목록 및 통계" > "$OUTPUT_FILE"
          echo "" >> "$OUTPUT_FILE"
          echo "| 워크플로우 이름 | 실행 수 | 성공 수 | 실패 수 | 성공률 |" >> "$OUTPUT_FILE"
          echo "|----------------|--------:|--------:|--------:|--------:|" >> "$OUTPUT_FILE`
