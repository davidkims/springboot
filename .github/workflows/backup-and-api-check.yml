name: DB CLI Remake & CodeQL Fallback Robust Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  db-cli-remake-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DBCLI_DIR: .github/dbcli
      OUTPUT_DIR: .github/dbcli/output
      VA_DIR: .github/dbcli/virtual_accounts
      ORDER_DIR: .github/dbcli/orders
      USER_DIR: .github/dbcli/users
      TMP_SAFE_DIR: /tmp/dbcli_safe_tmp
      DB2_CLI_URL: "https://public.dhe.ibm.com/ibmdl/export/pub/software/data/db2/drivers/odbc_cli/linuxx64_odbc_cli.tar.gz"
      DB2_CLI_DIR: /opt/ibm/db2_cli
      MIN_FREE_MB: 500
      DBECHO_SAMPLE: .github/workflows/codeql-db-echo-template.txt

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ robust 디렉토리/파일 생성 (생략)

      - name: CodeQL DB Echo robust 복제/생성
        run: |
          set -e
          CODEQL_OUT_DIR=".github/codeql-out"
          DBQL_DIR="$CODEQL_OUT_DIR/db-ql-dummy"
          ECHO_FILE="$DBQL_DIR/codeql-db-echo.txt"
          SAMPLE="$DBECHO_SAMPLE"

          mkdir -p "$DBQL_DIR"
          if [ -f "$SAMPLE" ]; then
            cp "$SAMPLE" "$ECHO_FILE"
            chmod 600 "$ECHO_FILE"
            echo "[✅] CodeQL DB Echo 파일 robust 복제: $ECHO_FILE ← $SAMPLE"
          else
            echo "[⚠️] 템플릿 파일 없음, robust fallback으로 생성"
            echo "==== CodeQL DB Echo Batch ====" > "$ECHO_FILE"
            echo "timestamp: $(date '+%Y-%m-%d %H:%M:%S')" >> "$ECHO_FILE"
            echo "repository: $GITHUB_REPOSITORY" >> "$ECHO_FILE"
            echo "commit_sha: $GITHUB_SHA" >> "$ECHO_FILE"
            echo "run_id: $GITHUB_RUN_ID" >> "$ECHO_FILE"
            echo "run_number: $GITHUB_RUN_NUMBER" >> "$ECHO_FILE"
            echo "workflow: $GITHUB_WORKFLOW" >> "$ECHO_FILE"
            echo "generated_by: DB CLI Remake Automation" >> "$ECHO_FILE"
            echo "----" >> "$ECHO_FILE"
            chmod 600 "$ECHO_FILE"
          fi

      - name: 최신 DB CLI 추가 설치 (옵션, 에러 무시)
        run: |
          sudo apt-get install -y mysql-client-8.0 mysql-client-core-8.0 mariadb-client-10.6 || true
          sudo apt-get install -y postgresql-client-16 postgresql-client-common || true
          sudo apt-get install -y clickhouse-client || true
          sudo apt-get install -y firebird-utils || true
