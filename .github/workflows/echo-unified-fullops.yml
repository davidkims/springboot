name: 🧩 Echo FullOps:설치+권한+디렉토리+실행 완전 자동화

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  echo-fullops:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 리포지토리 체크아웃
        uses: actions/checkout@v4

      - name: 📁 모든 디렉토리 생성 (echo 포함)
        run: |
          set -e
          mkdir -p .github/echo_{pkgs,dirs,install,permissions,exec,logs}
          echo "echo '[ECHO] 디렉토리 생성 완료'" | tee .github/echo_dirs/create_dirs.sh

      - name: 📦 패키지 목록 에코 대통합 생성 (APT/PIP/NPM/BREW/CHOCO/SNAP)
        run: |
          set -e

          declare -A pkgs
          pkgs[apt]="curl wget git vim python3 python3-pip default-jdk mysql-client nodejs npm"
          pkgs[pip]="requests flask pandas numpy"
          pkgs[npm]="eslint typescript http-server"
          pkgs[brew]="wget mysql node"
          pkgs[choco]="git vscode python nodejs"
          pkgs[snap]="code postman spotify"

          for mgr in "${!pkgs[@]}"; do
            OUT=".github/echo_pkgs/${mgr}.txt"
            echo "echo '[ECHO] 생성 중: ${mgr} 패키지 목록'" | tee -a .github/echo_pkgs/log_${mgr}.sh
            for p in ${pkgs[$mgr]}; do
              echo "$p" >> "$OUT"
              echo "echo '$p'" >> ".github/echo_pkgs/log_${mgr}.sh"
            done
          done

      - name: 🛠️ 설치 스크립트 자동 생성 (에코 포함)
        run: |
          set -e
          for mgr in apt pip npm brew choco snap; do
            IN=".github/echo_pkgs/${mgr}.txt"
            OUT=".github/echo_install/install_${mgr}.sh"
            LOG=".github/echo_install/install_${mgr}_echo.sh"

            echo "#!/bin/bash" > "$OUT"
            echo "#!/bin/bash" > "$LOG"
            echo "echo '[INSTALL] $mgr 패키지 설치'" >> "$OUT"
            echo "echo '[ECHO] $mgr 설치 명령어 로깅'" >> "$LOG"

            while read -r pkg || [[ -n "$pkg" ]]; do
              echo "echo '설치: $pkg'" >> "$LOG"
              echo "echo '[INSTALL] $pkg'" >> "$OUT"
              case "$mgr" in
                apt) echo "sudo apt-get install -y $pkg" >> "$OUT" ;;
                pip) echo "pip install $pkg" >> "$OUT" ;;
                npm) echo "npm install -g $pkg" >> "$OUT" ;;
                brew) echo "brew install $pkg" >> "$OUT" ;;
                choco) echo "choco install -y $pkg" >> "$OUT" ;;
                snap) echo "sudo snap install $pkg" >> "$OUT" ;;
              esac
            done < "$IN"

            chmod +x "$OUT" "$LOG"
          done

      - name: 🔐 권한 설정 에코 스크립트 생성
        run: |
          set -e
          PERM=".github/echo_permissions/set_permissions.sh"
          echo "#!/bin/bash" > "$PERM"
          echo "echo '[PERMISSIONS] 디렉토리 권한 설정'" >> "$PERM"

          for d in .github .github/echo_pkgs .github/echo_install .github/echo_logs; do
            echo "echo 'chmod 755 $d && chown \$USER:\$USER $d'" >> "$PERM"
            echo "chmod -R 755 $d" >> "$PERM"
            echo "chown -R \$USER:\$USER $d" >> "$PERM"
          done

          chmod +x "$PERM"

      - name: 🧬 전체 실행 스크립트 자동 생성 (echo 기반)
        run: |
          set -e
          OUT=".github/echo_exec/echo_run_all.sh"
          echo "#!/bin/bash" > "$OUT"
          echo "echo '[RUN] 모든 설치 및 권한 적용 실행'" >> "$OUT"

          for s in .github/echo_install/install_*.sh; do
            echo "bash $s | tee -a .github/echo_logs/$(basename $s .sh).log" >> "$OUT"
          done

          echo "bash .github/echo_permissions/set_permissions.sh | tee -a .github/echo_logs/permissions.log" >> "$OUT"
          chmod +x "$OUT"

      - name: ✅ echo_run_all.sh 실행 시뮬레이션 로그
        run: |
          cat .github/echo_exec/echo_run_all.sh
