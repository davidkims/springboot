name: ✨ Tmax 전체 코드 생성기 및 배포자

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'  # 매주 일요일 3시 실행

permissions:
  contents: write
  actions: write

jobs:
  full-tmax-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 체크아웃 저장소
        uses: actions/checkout@v4

      - name: ✨ SSH 키 설정
        run: |
          echo "[CALL] Create SSH directory"
          mkdir -p ~/.ssh

          echo "[CALL] Save JEUS SSH private key"
          echo "${{ secrets.GITHUB_SECRET_JEUS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "[CALL] Read secret values"
          SSH_PORT="${{ secrets.GITHUB_SECRET_JEUS_SSH_PORT }}"
          SSH_HOST="${{ secrets.GITHUB_SECRET_JEUS_SSH_HOST }}"

          if [[ -z "$SSH_PORT" || -z "$SSH_HOST" ]]; then
            echo "❌ [ERROR] SSH HOST 또는 PORT 시크릿이 비어 있습니다. 스캔을 건너뜁니다."
          else
            echo "[DEBUG] SSH HOST: $SSH_HOST"
            echo "[DEBUG] SSH PORT: $SSH_PORT"
            echo "[CALL] Scan SSH host key"
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
            echo "[✔] SSH host key 등록 완료"
          fi
