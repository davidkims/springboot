name: 🏁 All-in-One 업로드/다운로드/홈페이지/에코/배너/서버별 패키지 업데이트 자동화

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  allinone:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ 모든 디렉토리/에코/백업/복구/홈페이지/업로드/다운로드/서버별/로그 생성
        run: |
          set -e
          DIRS=(
            ".github/ts_doc_autofill"
            ".github/ts_doc_autofill/logs"
            ".github/ts_doc_autofill/echo"
            ".github/ts_doc_autofill/sample_docs"
            ".github/echo_permission"
            ".github/echo_network"
            ".github/echo_upload"
            ".github/echo_download"
            ".github/echo_upgrade"
            ".github/echo_homepage"
            ".github/echo_banner"
            ".github/echo_security"
            ".github/echo_recovery"
            ".github/echo_backup"
            ".github/echo_tmp"
            ".github/echo_server"
            "site/uploads"
            "site/downloads"
            "site/public"
            "site/tmp"
            "site/logs"
            "site/email"
          )
          for d in "${DIRS[@]}"; do
            mkdir -p "$d"
            echo "echo 'mkdir -p $d'" > ".github/ts_doc_autofill/echo/mkdir_$(basename $d).txt"
          done
          # 홈페이지/배너/버튼별 echo (사이트 배너/네비/메뉴/바로가기 등)
          echo "<html>
          <head><title>All-in-One Portal</title></head>
          <body>
          <div id='header'>
            <h1>All-in-One 자동화 포털</h1>
            <nav>
              <a href='/public/index.html' id='home_link'>홈</a> |
              <a href='/uploads' id='upload_link'>업로드</a> |
              <a href='/downloads' id='download_link'>다운로드</a>
            </nav>
          </div>
          <div id='banner'><h2>🚀 배너: 자동화 & 보안 & 복구</h2></div>
          <div id='main'>
            <form action='/upload' method='post' enctype='multipart/form-data'>
              <label for='file'>파일 업로드:</label>
              <input type='file' name='file' id='file'>
              <button type='submit' id='upload_btn'>업로드</button>
            </form>
            <a href='/downloads' id='go_downloads'>업로드된 파일 목록/다운로드</a>
          </div>
          <div id='footer'><small>Powered by Actions All-in-One</small></div>
          </body></html>" > site/public/index.html

          # 각 주요 메뉴/배너/버튼/링크 에코
          echo "echo '홈 배너 표시'" > .github/echo_banner/home_banner.sh
          echo "echo '업로드 버튼 클릭'" > .github/echo_banner/upload_btn.sh
          echo "echo '다운로드 바로가기 클릭'" > .github/echo_banner/download_btn.sh
          echo "echo '홈페이지 네비게이션 클릭'" > .github/echo_banner/nav_click.sh

          # 홈페이지 URL 파일 에코
          echo "https://github.com/${{ github.repository }}/tree/gh-pages/public/index.html" > .github/echo_homepage/homepage_url.txt

      - name: 🟢 서버별 패키지 업데이트/업그레이드 (운영/테스트/로컬 가상화)
        run: |
          set -e
          # 서버 환경별 echo/로깅
          SERVERS=("prod" "test" "local")
          for S in "${SERVERS[@]}"; do
            E=".github/echo_server"
            echo "echo '[$S] sudo apt-get update -y && sudo apt-get upgrade -y'" > $E/${S}_apt_upgrade.sh
            sudo apt-get update -y | tee $E/${S}_apt_update.log
            sudo apt-get upgrade -y | tee $E/${S}_apt_upgrade.log
          done

      - name: ⚙️ tsconfig.json 자동 생성/백업
        run: |
          cat <<EOF | tee tsconfig.json
          {
            "compilerOptions": {
              "target": "ES6",
              "module": "commonjs",
              "outDir": "dist",
              "esModuleInterop": true
            }
          }
          EOF
          echo "echo 'tsconfig.json 생성'" > .github/ts_doc_autofill/echo/tsconfig.txt
          cp tsconfig.json .github/echo_backup/backup_tsconfig_$(date +%Y%m%d_%H%M%S).json

      - name: 📝 업로드/다운로드/홈페이지/자동보완 서버코드 자동생성/백업
        run: |
          cat <<'EOF' | tee .github/ts_doc_autofill/autofill-server.ts
          import express from 'express';
          import fs from 'fs';
          import path from 'path';
          import bodyParser from 'body-parser';
          import multer from 'multer';

          const app = express();
          const PORT = process.env.PORT || 3070;
          const upload = multer({ dest: 'site/uploads/' });

          app.use(bodyParser.json({ limit: '5mb' }));
          app.use('/public', express.static('site/public'));
          app.use('/uploads', express.static('site/uploads'));
          app.use('/downloads', express.static('site/downloads'));

          // 자동보완 API
          app.post('/autofill', (req, res) => {
            const { docContent } = req.body;
            if (typeof docContent !== 'string') return res.status(400).json({ error: 'docContent required' });
            let result = docContent;
            if (docContent.length < 20) result += "\n\n[자동보완 예시] 더 많은 내용을 입력해 주세요.";
            else result += "\n\n[AI 자동보완]: 내용이 더 풍부해졌습니다. 감사합니다.";
            fs.writeFileSync('.github/ts_doc_autofill/logs/last_autofill.txt', `입력: ${docContent}\n\n출력: ${result}\n`);
            return res.json({ autofilled: result });
          });

          // 파일 업로드
          app.post('/upload', upload.single('file'), (req, res) => {
            if (!req.file) return res.status(400).send('파일이 업로드되지 않았습니다.');
            // 업로드 로그 기록
            fs.appendFileSync('.github/echo_upload/upload.log', `[${new Date().toISOString()}] 업로드: ${req.file.originalname} => ${req.file.path}\n`);
            // 업로드된 파일을 downloads로 복사(다운로드 페이지 노출)
            fs.copyFileSync(req.file.path, path.join('site/downloads', req.file.originalname));
            return res.send('업로드 완료! <a href="/public/index.html">홈으로</a>');
          });

          // 다운로드(목록)
          app.get('/downloads', (req, res) => {
            const files = fs.readdirSync('site/downloads').map(fn => `<li><a href="/downloads/${fn}">${fn}</a></li>`).join('');
            res.send(`<h1>다운로드 목록</h1><ul>${files}</ul><a href="/public/index.html">홈으로</a>`);
          });

          app.listen(PORT, () => {
            fs.appendFileSync('.github/ts_doc_autofill/logs/server.log', `[${new Date().toISOString()}] 서버 시작\n`);
            console.log(`🚀 All-in-One Server: http://localhost:${PORT}/public/index.html`);
          });
          EOF
          echo "echo 'autofill-server.ts 생성'" > .github/ts_doc_autofill/echo/autofill-server.txt
          cp .github/ts_doc_autofill/autofill-server.ts .github/echo_backup/backup_autofill-server_$(date +%Y%m%d_%H%M%S).ts

      - name: ⚡ npm 프로젝트/필수 패키지 설치
        run: |
          if [ ! -f package.json ]; then
            echo "echo 'npm init -y'" > .github/ts_doc_autofill/echo/npm_init.txt
            npm init -y
          else
            echo "[info] package.json 이미 존재" > .github/ts_doc_autofill/echo/npm_init_info.txt
          fi
          echo "echo 'npm install express multer body-parser @types/express @types/node ts-node typescript --save'" > .github/ts_doc_autofill/echo/npm_install.txt
          npm install express multer body-parser @types/express @types/node ts-node typescript --save \
            2>&1 | tee .github/ts_doc_autofill/echo/npm_install.log || \
            { echo "[WARN] npm install 1차 실패 → --force 재시도" | tee -a .github/ts_doc_autofill/echo/npm_install.log; npm install --force; }
          cp package.json .github/echo_backup/backup_package_$(date +%Y%m%d_%H%M%S).json

      - name: 🟢 서버 실행/테스트 curl/에코/로깅
        run: |
          echo "echo 'npx ts-node .github/ts_doc_autofill/autofill-server.ts'" > .github/ts_doc_autofill/echo/run_server.txt
          echo "echo 'curl -X POST http://localhost:3070/autofill -H \"Content-Type: application/json\" -d \"{\\\"docContent\\\":\\\"예시 입력\\\"}\"'" > .github/ts_doc_autofill/echo/curl_test.txt

      - name: 🧪 업로드/다운로드/홈페이지/자동보완 서버 기동 (백그라운드)
        run: |
          nohup npx ts-node .github/ts_doc_autofill/autofill-server.ts > .github/ts_doc_autofill/logs/server_run.log 2>&1 &
          sleep 6

      - name: 🛠️ API/업로드/다운로드 테스트 (curl)
        run: |
          curl -X POST http://localhost:3070/autofill -H "Content-Type: application/json" -d '{"docContent":"이력서 자기소개는"}' | tee .github/ts_doc_autofill/logs/curl_autofill.log
          # 업로드 테스트 (echo 방식 파일 생성)
          echo "파일 업로드 테스트" > site/tmp/testfile.txt
          curl -F "file=@site/tmp/testfile.txt" http://localhost:3070/upload | tee .github/echo_upload/upload_test_result.txt
          # 다운로드 목록 확인
          curl http://localhost:3070/downloads | tee .github/echo_download/downloads_test_result.html

      - name: 🚀 GitHub Pages 홈페이지 업로드/배포 자동화 (public/index.html 등)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/public
          publish_branch: gh-pages

      - name: 🕵️‍♂️ 최종 상태 점검 (echo/백업/다운로드/업로드/홈페이지)
        run: |
          echo "[CHECK] .github/ts_doc_autofill"
          tree .github/ts_doc_autofill || ls -lR .github/ts_doc_autofill
          echo "[CHECK] site/public"
          ls -l site/public || true
          echo "[CHECK] site/uploads"
          ls -l site/uploads || true
          echo "[CHECK] site/downloads"
          ls -l site/downloads || true
          echo "[CHECK] .github/echo_backup"
          ls -l .github/echo_backup || true
          echo "[CHECK] .github/echo_banner"
          ls -l .github/echo_banner || true
          echo "[CHECK] .github/echo_upload"
          ls -l .github/echo_upload || true
