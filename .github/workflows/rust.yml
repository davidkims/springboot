name: Rust & CLI Setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Install Rust toolchain
        run: |
          echo "[🔧] rustup 설치 스크립트 다운로드 중..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "[🔧] Rust 환경 변수 추가 중..."
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV
          echo "[🔧] stable 툴체인 설치 중..."
          rustup default stable
          echo "[✅] Rust 설치 완료"

      - name: 🔄 Update Rust toolchain (optional)
        run: |
          echo "[🔄] Rust 툴체인 업데이트 중..."
          rustup update
          echo "[✅] Rust 툴체인 최신 상태 완료"

      - name: 📁 Create directories
        run: |
          echo "[📁] logs, artifacts, bin 디렉토리 생성 중..."
          mkdir -p logs artifacts bin
          echo "[✅] 디렉토리 생성 완료"

      - name: 📄 Create sample Rust file
        run: |
          echo "[📄] src/main.rs 파일 생성 중..."
          mkdir -p src
          echo "// Sample Rust application" > src/main.rs
          echo "fn main() { println!(\"Hello, world!\"); }" >> src/main.rs
          echo "[✅] src/main.rs 생성 완료"

      - name: 🔐 Set permissions
        run: |
          echo "[🔐] scripts/setup.sh 실행 권한 부여 중..."
          chmod +x scripts/setup.sh 2>/dev/null || echo "[⚠️] scripts/setup.sh 파일이 없습니다."
          echo "[🔐] src/main.rs 권한 설정 중..."
          chmod 755 src/main.rs
          echo "[✅] 권한 설정 완료"

      - name: 🔧 Install GitHub CLI
        run: |
          echo "[🔧] GitHub CLI 저장소 및 키 추가 중..."
          sudo apt-get update
          sudo apt-get install -y curl gnupg
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] \
            https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh
          echo "[✅] GitHub CLI 설치 완료"

      - name: 🔄 Update GitHub CLI to latest
        run: |
          echo "[🔄] GitHub CLI 최신 버전 확인 및 업데이트 중..."
          if gh upgrade --yes; then
            echo "[✅] GitHub CLI 직접 업그레이드 완료"
          else
            echo "[⚠️] gh upgrade 지원 안됨. apt-get으로 업그레이드 시도..."
            sudo apt-get install --only-upgrade -y gh
            echo "[✅] apt-get을 통한 GitHub CLI 업그레이드 완료"
          fi
