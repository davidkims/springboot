name: "🔐 Account Rotation Docker CI + Echo (5min + Multi-Arch + Sec)"

on:
  workflow_dispatch:
  schedule:
    # 24x7, 5분 간격
    - cron: "*/5 * * * *"
    # 1분 크론으로 바꾸고 싶으면 위 라인을 주석 처리하고 아래 라인 주석 해제
    # - cron: "*/1 * * * *"

permissions:
  contents: write
  security-events: write   # Scorecard SARIF 업로드용

jobs:
  build-test-sec:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      LOG: .github/echo_logs/account-rotation.log
      # DO_COMMIT="true" 로 주면 Heartbeat 커밋(봇)이 활성화됩니다.
      DO_COMMIT: "false"
      GIT_USER_NAME: "repo-bot"
      GIT_USER_EMAIL: "repo-bot@example.local"

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🧱 Echo env & tree
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .github/echo_logs
          {
            echo "[ECHO] date: $(date -u +'%F %T %Z')"
            echo "[ECHO] runner: $(uname -a)"
            echo "[ECHO] pwd: $(pwd)"
            echo "[ECHO] ls -al:"
            ls -al
            echo "[ECHO] workflow tree:"
            (command -v tree >/dev/null 2>&1 && tree -a workflow || find workflow -maxdepth 2 -print)
          } | tee -a "$LOG"

      - name: 🧰 (opt) QEMU & Buildx for multi-arch
        uses: docker/setup-qemu-action@v3

      - name: 🧰 Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐍 Python syntax check
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile workflow/rotate_accounts.py
          echo "[ECHO] py_compile OK" | tee -a "$LOG"

      - name: 🐚 Bash syntax check + ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n workflow/bootstrap.sh
          bash -n workflow/automation.sh
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          # ShellCheck (경고만 기록, 실패하지 않음)
          (shellcheck -f tty workflow/bootstrap.sh || true) | tee -a "$LOG"
          (shellcheck -f tty workflow/automation.sh || true) | tee -a "$LOG"
          echo "[ECHO] bash -n & ShellCheck OK" | tee -a "$LOG"

      - name: 🐳 Build Docker image (amd64, load)
        shell: bash
        run: |
          set -Eeuo pipefail
          docker buildx build \
            --platform linux/amd64 \
            -t workflow-image:ci \
            -f workflow/Dockerfile \
            --load \
            workflow
          echo "[ECHO] docker build (amd64) OK" | tee -a "$LOG"

      - name: ▶️ Smoke test (container up & cron alive)
        shell: bash
        run: |
          set -Eeuo pipefail
          docker rm -f workflow-container-test >/dev/null 2>&1 || true
          docker run -d --name workflow-container-test workflow-image:ci
          sleep 5
          docker ps --filter "name=workflow-container-test" --format '{{.Names}} {{.Status}}' | tee -a "$LOG"
          docker logs --tail 100 workflow-container-test | tee -a "$LOG"
          docker rm -f workflow-container-test || true

      - name: 🐳 Build Docker image (arm64, OCI tar export)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .github/artifacts
          docker buildx build \
            --platform linux/arm64 \
            -t workflow-image:arm64 \
            -f workflow/Dockerfile \
            --output type=oci,dest=.github/artifacts/workflow-image-arm64.tar \
            workflow
          echo "[ECHO] docker build (arm64) tar exported" | tee -a "$LOG"

      - name: 🔍 Trivy scan (image:amd64)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "workflow-image:ci"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"            # 취약점 있어도 파이프라인 실패하지 않음
          vuln-type: "os,library"

      - name: 🛡️ OSSF Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          publish_results: false
        continue-on-error: true

      - name: ⏫ Upload Scorecard SARIF (Code Scanning)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

      - name: 📦 Upload artifacts (logs & arm64 image)
        uses: actions/upload-artifact@v4
        with:
          name: account-rotation-logs-and-arm64
          path: |
            .github/echo_logs/account-rotation.log
            .github/artifacts/workflow-image-arm64.tar

      - name: 🤖 Bot heartbeat commit (optional)
        if: ${{ env.DO_COMMIT == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p .github/bot
          date -u +'%F %T %Z' > .github/bot/heartbeat.txt
          git config user.name  "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"
          git add .github/bot/heartbeat.txt
          git commit -m "🤖 bot: heartbeat $(date -u +'%F %T %Z')" || { echo "[ECHO] nothing to commit" | tee -a "$LOG"; exit 0; }
          git push || { echo "[WARN] push failed (likely missing token/permission)"; exit 0; }
