name: 📡 대량 집계 서버 CLI 설치 및 echo 선출력 전체 자동화

on:
  repository_dispatch:
    types: [workflow_run]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  monitor-and-collect:
    runs-on: ubuntu-latest

    steps:
      - name: ▶️ 디렉토리 및 echo 안내 파일 생성
        run: |
          echo "mkdir -p runs-details jobs-details steps-details collector-tmp"
          mkdir -p runs-details jobs-details steps-details collector-tmp
          echo "echo '[ℹ️] runs-details 상세정보 디렉토리' > runs-details/README.txt"
          echo '[ℹ️] runs-details 상세정보 디렉토리' > runs-details/README.txt
          echo "echo '[ℹ️] jobs-details job상태 디렉토리' > jobs-details/README.txt"
          echo '[ℹ️] jobs-details job상태 디렉토리' > jobs-details/README.txt
          echo "echo '[ℹ️] steps-details step상태 디렉토리' > steps-details/README.txt"
          echo '[ℹ️] steps-details step상태 디렉토리' > steps-details/README.txt
          echo "echo '[ℹ️] collector-tmp 집계 전송 임시 디렉토리' > collector-tmp/README.txt"
          echo '[ℹ️] collector-tmp 집계 전송 임시 디렉토리' > collector-tmp/README.txt

      - name: ▶️ 최신 1000건 워크플로우 실행 목록 수집 (echo 및 null-safe, rate-limit-safe)
        run: |
          echo "echo '[🔍] 최신 1000건 워크플로우 실행 목록 수집...'"
          echo '[🔍] 최신 1000건 워크플로우 실행 목록 수집...'
          echo "> all-runs-arrays.json"
          > all-runs-arrays.json
          echo "RATE_LIMITED=0"
          RATE_LIMITED=0
          for page in $(seq 1 10); do
            echo "echo '[🔎] 페이지: $page'"
            echo "[🔎] 페이지: $page"
            echo "resp=\$(curl -s -H 'Authorization: token \$GITHUB_TOKEN' -H 'Accept: application/vnd.github.v3+json' \"https://api.github.com/repos/\${GITHUB_REPOSITORY}/actions/runs?per_page=100&page=\$page\")"
            resp=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100&page=$page")
            echo "msg=\$(echo \"\$resp\" | jq -r '.message // empty')"
            msg=$(echo "$resp" | jq -r '.message // empty')
            echo "if rate-limit 감지"
            if [[ "$msg" == *"rate limit"* ]] || [[ "$msg" == *"API rate limit exceeded"* ]]; then
              echo "echo '[🚨] API Rate Limit 초과 - 수집 중단'"
              echo '[🚨] API Rate Limit 초과 - 수집 중단'
              RATE_LIMITED=1
              break
            fi
            echo "runs=\$(echo \"\$resp\" | jq '.workflow_runs // []')"
            runs=$(echo "$resp" | jq '.workflow_runs // []')
            echo "echo \"\$runs\" >> all-runs-arrays.json"
            echo "$runs" >> all-runs-arrays.json
          done
          echo "if [ \"\$RATE_LIMITED\" -eq 1 ]; then ..."
          if [ "$RATE_LIMITED" -eq 1 ]; then
            echo "echo '[]' > all-runs-flat.json"
            echo '[]' > all-runs-flat.json
            echo "echo '[]' > all-runs-summary.json"
            echo '[]' > all-runs-summary.json
            echo "echo 'RATE_LIMITED=1' >> \$GITHUB_ENV"
            echo "RATE_LIMITED=1" >> $GITHUB_ENV
            echo "echo \"echo '[⚠️] all-runs-flat.json, all-runs-summary.json 빈 배열로 생성'\" > collector-tmp/echo_allruns.txt"
            echo "echo '[⚠️] all-runs-flat.json, all-runs-summary.json 빈 배열로 생성'" > collector-tmp/echo_allruns.txt
          else
            echo "cat all-runs-arrays.json | jq -s 'add' > all-runs-flat.json || echo '[]' > all-runs-flat.json"
            cat all-runs-arrays.json | jq -s 'add' > all-runs-flat.json || echo "[]" > all-runs-flat.json
            echo "if [ ! -s all-runs-flat.json ]; then echo '[]' > all-runs-flat.json; fi"
            if [ ! -s all-runs-flat.json ]; then
              echo "echo '[]' > all-runs-flat.json"
              echo "[]" > all-runs-flat.json
            fi
            echo "jq '[.[] | {id, name, display_title, status, conclusion, run_number, html_url, created_at, updated_at, actor: (if .actor then .actor.login else \"\" end)}]' all-runs-flat.json > all-runs-summary.json || echo '[]' > all-runs-summary.json"
            jq '[.[] | {id, name, display_title, status, conclusion, run_number, html_url, created_at, updated_at, actor: (if .actor then .actor.login else "" end)}]' all-runs-flat.json > all-runs-summary.json || echo "[]" > all-runs-summary.json
            echo "if [ ! -s all-runs-summary.json ]; then echo '[]' > all-runs-summary.json; fi"
            if [ ! -s all-runs-summary.json ]; then
              echo "echo '[]' > all-runs-summary.json"
              echo "[]" > all-runs-summary.json
            fi
            echo "echo \"echo '[✅] all-runs-flat.json, all-runs-summary.json 생성 완료'\" > collector-tmp/echo_allruns.txt"
            echo "echo '[✅] all-runs-flat.json, all-runs-summary.json 생성 완료'" > collector-tmp/echo_allruns.txt
          fi

      - name: 🔄 각 워크플로우 실행 상세 감지 및 파일 생성 (echo 및 null-safe)
        run: |
          echo "echo '[🔄] 각 워크플로우 실행 상세 감지 및 파일 생성(최대 1000건)...'"
          echo '[🔄] 각 워크플로우 실행 상세 감지 및 파일 생성(최대 1000건)...'
          echo "ids=\$(cat all-runs-summary.json 2>/dev/null | jq -r '.[].id' | head -1000 || true)"
          ids=$(cat all-runs-summary.json 2>/dev/null | jq -r '.[].id' | head -1000 || true)
          i=0
          for rid in $ids; do
            echo "echo '[🟢] 워크플로우 실행 상세정보: \$rid 파일 생성'"
            echo "[🟢] 워크플로우 실행 상세정보: $rid 파일 생성"
            echo "run_resp=\$(curl -s -H 'Authorization: token \$GITHUB_TOKEN' -H 'Accept: application/vnd.github.v3+json' \"https://api.github.com/repos/\${GITHUB_REPOSITORY}/actions/runs/\$rid\")"
            run_resp=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$rid")
            echo "if [ -n \"\$run_resp\" ] && [ \"\$(echo \"\$run_resp\" | jq -r '.id // empty')\" != \"\" ]; then ..."
            if [ -n "$run_resp" ] && [ "$(echo "$run_resp" | jq -r '.id // empty')" != "" ]; then
              echo "echo \"\$run_resp\" > runs-details/run-\$rid.json"
              echo "$run_resp" > runs-details/run-$rid.json
              echo "echo \"echo '[✅] runs-details/run-\$rid.json 생성'\" > runs-details/echo-run-\$rid.txt"
              echo "echo '[✅] runs-details/run-$rid.json 생성'" > runs-details/echo-run-$rid.txt
            else
              echo "echo '{ \"error\": \"수집 실패 또는 RateLimit\" }' > runs-details/run-\$rid.json"
              echo '{ "error": "수집 실패 또는 RateLimit" }' > runs-details/run-$rid.json
              echo "echo \"echo '[❌] runs-details/run-\$rid.json 생성(수집 실패 또는 RateLimit)'\" > runs-details/echo-run-\$rid.txt"
              echo "echo '[❌] runs-details/run-$rid.json 생성(수집 실패 또는 RateLimit)'" > runs-details/echo-run-$rid.txt
            fi
            echo "echo '[🔹] jobs-details/jobs-\$rid.json 생성' > jobs-details/echo-jobs-\$rid.txt"
            echo "[🔹] jobs-details/jobs-$rid.json 생성"
            echo "jobs_resp=\$(curl -s -H 'Authorization: token \$GITHUB_TOKEN' -H 'Accept: application/vnd.github.v3+json' \"https://api.github.com/repos/\${GITHUB_REPOSITORY}/actions/runs/\$rid/jobs\")"
            jobs_resp=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$rid/jobs")
            echo "if [ -n \"\$jobs_resp\" ] && [ \"\$(echo \"\$jobs_resp\" | jq -r '.jobs // empty')\" != \"\" ]; then ..."
            if [ -n "$jobs_resp" ] && [ "$(echo "$jobs_resp" | jq -r '.jobs // empty')" != "" ]; then
              echo "echo \"\$jobs_resp\" > jobs-details/jobs-\$rid.json"
              echo "$jobs_resp" > jobs-details/jobs-$rid.json
              echo "cat jobs-details/jobs-\$rid.json | jq '[.jobs // [] | .[] | {id, name, status, conclusion, started_at, completed_at, steps: [.steps // [] | .[] | {name, status, conclusion}] }]' > steps-details/steps-\$rid.json"
              cat jobs-details/jobs-$rid.json | jq '[.jobs // [] | .[] | {id, name, status, conclusion, started_at, completed_at, steps: [.steps // [] | .[] | {name, status, conclusion}] }]' > steps-details/steps-$rid.json
              echo "echo \"echo '[✅] jobs-details/jobs-\$rid.json, steps-details/steps-\$rid.json 생성'\" > jobs-details/echo-jobs-\$rid.txt"
              echo "echo '[✅] jobs-details/jobs-$rid.json, steps-details/steps-$rid.json 생성'" > jobs-details/echo-jobs-$rid.txt
            else
              echo "echo '{ \"error\": \"수집 실패 또는 RateLimit\" }' > jobs-details/jobs-\$rid.json"
              echo '{ "error": "수집 실패 또는 RateLimit" }' > jobs-details/jobs-$rid.json
              echo "echo '[]' > steps-details/steps-\$rid.json"
              echo '[]' > steps-details/steps-$rid.json
              echo "echo \"echo '[❌] jobs-details/jobs-\$rid.json, steps-details/steps-\$rid.json 생성(수집 실패 또는 RateLimit)'\" > jobs-details/echo-jobs-\$rid.txt"
              echo "echo '[❌] jobs-details/jobs-$rid.json, steps-details/steps-$rid.json 생성(수집 실패 또는 RateLimit)'" > jobs-details/echo-jobs-$rid.txt
            fi
            i=$((i+1))
            if [ $i -ge 1000 ]; then break; fi
          done

      - name: 🏗️ Python 집계 서버 CLI 환경 준비 (requests 설치)
        run: |
          echo "echo '[🏗️] Python3 및 requests 설치...'"
          echo '[🏗️] Python3 및 requests 설치...'
          echo "sudo apt-get update -y"
          sudo apt-get update -y
          echo "sudo apt-get install -y python3 python3-pip"
          sudo apt-get install -y python3 python3-pip
          echo "pip3 install requests"
          pip3 install requests
          echo "echo '[✅] Python 환경 준비 완료' > collector-tmp/echo_python.txt"
          echo '[✅] Python 환경 준비 완료' > collector-tmp/echo_python.txt

      - name: 📊 집계 서버로 워크플로우 요약/상세 데이터 전송(Python REST 예시)
        env:
          COLLECTOR_URL: ${{ secrets.COLLECTOR_URL }}
        run: |
          echo "echo '[📊] 집계 서버로 워크플로우 데이터 전송...'"
          echo '[📊] 집계 서버로 워크플로우 데이터 전송...'
          echo "echo 'Python 스크립트 collector-tmp/send_to_collector.py 생성'"
          echo 'Python 스크립트 collector-tmp/send_to_collector.py 생성'
          echo "cat <<EOF > collector-tmp/send_to_collector.py"
cat <<EOF > collector-tmp/send_to_collector.py
import requests, json, os
files = []
for d in ['runs-details', 'jobs-details', 'steps-details']:
    files += [os.path.join(d, f) for f in os.listdir(d) if f.endswith('.json')]
data = []
for f in files:
    try:
        with open(f) as fp:
            content = json.load(fp)
        data.append({"file": f, "content": content})
    except Exception as e:
        data.append({"file": f, "error": str(e)})
if os.environ.get('COLLECTOR_URL'):
    try:
        r = requests.post(os.environ['COLLECTOR_URL'], json=data)
        print("집계 서버 응답:", r.status_code, r.text)
    except Exception as e:
        print("집계 서버 전송 오류:", e)
else:
    print("COLLECTOR_URL 환경변수 미설정, 전송 생략")
EOF
          echo "echo 'python3 collector-tmp/send_to_collector.py | tee collector-tmp/echo_collector_push.txt'"
          echo 'python3 collector-tmp/send_to_collector.py | tee collector-tmp/echo_collector_push.txt'
          python3 collector-tmp/send_to_collector.py | tee collector-tmp/echo_collector_push.txt

      - name: 📦 모든 워크플로우 실행/잡/스텝/echo 파일 아티팩트 업로드
        run: |
          echo "echo '[📦] 아티팩트 업로드...'"
          echo '[📦] 아티팩트 업로드...'
          echo "runs-details/"
          echo "jobs-details/"
          echo "steps-details/"
          echo "collector-tmp/"
        uses: actions/upload-artifact@v4
        with:
          name: all-workflow-details-with-echo
          path: |
            runs-details/
            jobs-details/
            steps-details/
            collector-tmp/

      - name: 📋 최신 상태 요약 및 echo
        run: |
          echo "echo '[📋] 최신 40건 워크플로우 상태 집계...'"
          echo '[📋] 최신 40건 워크플로우 상태 집계...'
          echo "if [ -s all-runs-summary.json ]; then ..."
          if [ -s all-runs-summary.json ]; then
            echo "jq -r '.[] | \"워크플로: \(.display_title // .name) (#\(.run_number))\n상태: \(.status)/\(.conclusion)\nURL: \(.html_url)\n-----\"' all-runs-summary.json | head -40"
            jq -r '.[] | "워크플로: \(.display_title // .name) (#\(.run_number))\n상태: \(.status)/\(.conclusion)\nURL: \(.html_url)\n-----"' all-runs-summary.json | head -40
          else
            echo "echo '[⚠️] 워크플로우 데이터 없음'"
            echo '[⚠️] 워크플로우 데이터 없음'
