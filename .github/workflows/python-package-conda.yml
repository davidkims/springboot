name: 🐍 Conda Python Package with Flask/FastAPI

on: [push]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: 📦 Step 1:Checkout repository
      uses: actions/checkout@v4

    - name: 📁 Step 2:Generate project files
      run: |
        echo "[📁] Creating necessary directories..."
        mkdir -p src tests server .github/workflows

        echo "[🧾] Generating environment.yml..."
        echo "name: base" > environment.yml
        echo "channels:" >> environment.yml
        echo "  - defaults" >> environment.yml
        echo "dependencies:" >> environment.yml
        echo "  - python=3.10" >> environment.yml
        echo "  - flask" >> environment.yml
        echo "  - fastapi" >> environment.yml
        echo "  - uvicorn" >> environment.yml
        echo "  - flake8" >> environment.yml
        echo "  - pytest" >> environment.yml
        echo "  - pip" >> environment.yml

        echo "[🧾] Generating requirements.txt..."
        echo "flask" > requirements.txt
        echo "fastapi" >> requirements.txt
        echo "uvicorn" >> requirements.txt

        echo "[🧾] Generating src/main.py..."
        echo "def add(a, b):" > src/main.py
        echo "    return a + b" >> src/main.py

        echo "[🧾] Generating tests/test_main.py..."
        echo "from src.main import add" > tests/test_main.py
        echo "" >> tests/test_main.py
        echo "def test_add():" >> tests/test_main.py
        echo "    assert add(1, 2) == 3" >> tests/test_main.py

        echo "[🧾] Generating Flask server: server/flask_app.py..."
        echo "from flask import Flask" > server/flask_app.py
        echo "app = Flask(__name__)" >> server/flask_app.py
        echo "" >> server/flask_app.py
        echo "@app.route('/')" >> server/flask_app.py
        echo "def home():" >> server/flask_app.py
        echo "    return 'Hello from Flask!'" >> server/flask_app.py
        echo "" >> server/flask_app.py
        echo "if __name__ == '__main__':" >> server/flask_app.py
        echo "    app.run(host='127.0.0.1', port=5000)" >> server/flask_app.py

        echo "[🧾] Generating FastAPI server: server/fastapi_app.py..."
        echo "from fastapi import FastAPI" > server/fastapi_app.py
        echo "app = FastAPI()" >> server/fastapi_app.py
        echo "" >> server/fastapi_app.py
        echo "@app.get('/')" >> server/fastapi_app.py
        echo "def read_root():" >> server/fastapi_app.py
        echo "    return {'message': 'Hello from FastAPI!'}" >> server/fastapi_app.py

    - name: 🐍 Step 3:Setup Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'

    - name: 🛠️ Step 4:Install Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: 3.10          # ← 올바른 버전으로 설정됨
        activate-environment: base
        auto-activate-base: true
        remove-profiles: true
        conda-solver: libmamba
        clean-patched-environment-file: true
        run-post: true

    - name: 📥 Step 5:Update Conda and install dependencies
      run: |
        echo "[🔄] Updating conda..."
        conda update -n base -c defaults conda -y

        echo "[📦] Installing dependencies from environment.yml..."
        conda env update --file environment.yml --name base

    - name: 📃 Step 6:Generate requirements.lock.txt
      run: |
        echo "[🔐] Generating requirements.lock.txt via pip freeze..."
        pip freeze > requirements.lock.txt
        cat requirements.lock.txt

    - name: 🔎 Step 7:Lint with flake8
      run: |
        echo "[🔍] Running lint check..."
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 🧪 Step 8:Run tests with pytest
      run: |
        echo "[✅] Running tests..."
        pytest

    - name: 🧪 Step 9:Run Flask app (background test)
      run: |
        echo "[🚀] Launching Flask app in background for test..."
        python server/flask_app.py &
        sleep 3
        echo "[🌐] Flask server started. Sending test request..."
        curl --retry 3 --max-time 5 http://127.0.0.1:5000 || echo "[⚠️] Flask server curl failed"

    - name: 🧪 Step 10:Run FastAPI app (background test)
      run: |
        echo "[🚀] Launching FastAPI app in background for test..."
        uvicorn server.fastapi_app:app --host 127.0.0.1 --port 8000 --log-level warning &
        sleep 3
        echo "[🌐] FastAPI server started. Sending test request..."
        curl --retry 3 --max-time 5 http://127.0.0.1:8000 || echo "[⚠️] FastAPI server curl failed"
