name: 🔒 Blacklist Generator

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-blacklist:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 📜 Install Tools
        run: |
          pip install safety
          sudo apt-get install -y jq curl

      - name: 📡 Fetch IP Blacklist
        run: |
          mkdir -p .github/blacklist
          curl -s https://www.spamhaus.org/drop/drop.txt \
            | grep -v '^;' > .github/blacklist/ip_blacklist.txt
          echo "[ECHO] IP 블랙리스트 생성 완료"

      - name: 🐍 Python Package Blacklist
        run: |
          safety check --full-report --output .github/blacklist/package_blacklist.json
          echo "[ECHO] 패키지 블랙리스트 생성 완료"

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blacklist-files
          path: .github/blacklist/
