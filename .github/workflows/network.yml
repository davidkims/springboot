name: 🌏 Ultimate FullOps All-in-One Echo/Install/Track/CI (All Echo Dir Fix)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2,8,14,20 * * *'

jobs:
  ops-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7

      - name: 🏗️ 대규모 에코/설치/진단/환경설정/분산/트래킹 자동화 (모든 echo 디렉토리 강제생성)
        run: |
          BASE=".github/workflows"
          # [1] 모든 echo_ 디렉토리 및 보고/알림/CI/상태 디렉토리 포함, 누락 0%
          for d in $BASE/echo_{java,python,go,node,typescript,ruby,php,swift,rust,dotnet,perl,scala, \
            docker,compose,k8s,nginx,apache,tomcat,redis,mongo,postgres,mysql,oracle,sqlite,elasticsearch,kafka,hadoop,spark,airflow,jenkins,github,actions,ci,cd,build,deploy, \
            pkg,env,secret,token,ssl,ssh,firewall,network,network_setup,route,dns,proxy,vpn, \
            aws,gcp,azure,cloud_run,lambda,ec2,rds,s3,iam, \
            ai,llm,openai,claude,vertexai,bedrock,chatgpt,vision, \
            monitor,metrics,alert,fail,stats,backup,restore,rsync,ftp,s3backup,azureblob,gcs,log, \
            test,report,benchmark,security,scan,policy,guard,auth,audit,trace,debug,path,meta,init,misc, \
            git,actions,ci,report,fail,stats,health,backup,restore,actions,fail,stats,health,actions,report}; do
            mkdir -p "$d"
            echo "[dummy]" > $d/dummy.txt
            echo "[keep]"  > $d/.keep
            echo "echo '[에코] $d 디렉토리 생성'" > $d/echo_dir.sh
            echo "export PATH=\$PATH:/usr/local/bin" > $d/echo_env.sh
            echo "echo '권한 진단:';id;groups;whoami" > $d/echo_perm.sh
          done

          # [2] CI/CD/배포/빌드/워크플로우/트래킹/상태 echo 파일
          mkdir -p $BASE/echo_ci $BASE/echo_git $BASE/echo_report $BASE/echo_fail $BASE/echo_stats $BASE/echo_health $BASE/echo_actions
          echo "$GITHUB_WORKFLOW" > $BASE/echo_ci/workflow.txt
          echo "$GITHUB_RUN_ID" > $BASE/echo_ci/runid.txt
          echo "$GITHUB_JOB" > $BASE/echo_ci/job.txt
          echo "$GITHUB_SHA" > $BASE/echo_ci/sha.txt
          echo "$GITHUB_REF" > $BASE/echo_ci/ref.txt
          echo "$GITHUB_REPOSITORY" > $BASE/echo_ci/repo.txt
          echo "$GITHUB_ACTOR" > $BASE/echo_ci/actor.txt
          git log -5 > $BASE/echo_git/log.txt 2>&1 || true
          git status > $BASE/echo_git/status.txt 2>&1 || true
          git branch -a > $BASE/echo_git/branch.txt 2>&1 || true

          # [3] 언어/DB/서비스 서버 설치(테스트/진단 포함)
          sudo apt-get update -y
          sudo apt-get install -y openjdk-17-jdk python3 python3-pip golang nodejs npm \
            ruby-full php php-cli php-mysql php-pgsql swift-lang rustc cargo dotnet-sdk-6.0 perl scala git \
            docker.io docker-compose kubectl minikube nginx apache2 redis-server mongodb postgresql-client postgresql mysql-client mysql-server \
            sqlite3 elasticsearch lsof net-tools iproute2 ufw jq zip unzip rsync ftp awscli google-cloud-sdk azure-cli

          # [4] 주요 서버/DB/서비스/AI 진단 및 echo
          java -version > $BASE/echo_java/version.txt 2>&1 || echo fail>$BASE/echo_java/version.txt
          python3 --version > $BASE/echo_python/version.txt 2>&1 || echo fail>$BASE/echo_python/version.txt
          go version > $BASE/echo_go/version.txt 2>&1 || echo fail>$BASE/echo_go/version.txt
          node --version > $BASE/echo_node/version.txt 2>&1 || echo fail>$BASE/echo_node/version.txt
          php -v > $BASE/echo_php/version.txt 2>&1 || echo fail>$BASE/echo_php/version.txt
          swift --version > $BASE/echo_swift/version.txt 2>&1 || echo fail>$BASE/echo_swift/version.txt
          rustc --version > $BASE/echo_rust/version.txt 2>&1 || echo fail>$BASE/echo_rust/version.txt
          dotnet --info > $BASE/echo_dotnet/version.txt 2>&1 || echo fail>$BASE/echo_dotnet/version.txt
          perl -v > $BASE/echo_perl/version.txt 2>&1 || echo fail>$BASE/echo_perl/version.txt
          scala -version > $BASE/echo_scala/version.txt 2>&1 || echo fail>$BASE/echo_scala/version.txt
          docker --version > $BASE/echo_docker/version.txt 2>&1 || echo fail>$BASE/echo_docker/version.txt
          docker info > $BASE/echo_docker/info.txt 2>&1 || echo fail>$BASE/echo_docker/info.txt
          docker ps -a > $BASE/echo_docker/ps.txt 2>&1 || echo fail>$BASE/echo_docker/ps.txt
          docker images > $BASE/echo_docker/images.txt 2>&1 || echo fail>$BASE/echo_docker/images.txt
          docker-compose version > $BASE/echo_compose/version.txt 2>&1 || echo fail>$BASE/echo_compose/version.txt
          kubectl version --client > $BASE/echo_k8s/version.txt 2>&1 || echo fail>$BASE/echo_k8s/version.txt
          minikube status > $BASE/echo_k8s/minikube_status.txt 2>&1 || echo fail>$BASE/echo_k8s/minikube_status.txt
          nginx -v > $BASE/echo_nginx/version.txt 2>&1 || echo fail>$BASE/echo_nginx/version.txt
          apache2 -v > $BASE/echo_apache/version.txt 2>&1 || echo fail>$BASE/echo_apache/version.txt
          redis-server --version > $BASE/echo_redis/version.txt 2>&1 || echo fail>$BASE/echo_redis/version.txt
          mongod --version > $BASE/echo_mongo/version.txt 2>&1 || echo fail>$BASE/echo_mongo/version.txt
          psql --version > $BASE/echo_postgres/version.txt 2>&1 || echo fail>$BASE/echo_postgres/version.txt
          mysql --version > $BASE/echo_mysql/version.txt 2>&1 || echo fail>$BASE/echo_mysql/version.txt
          sqlite3 --version > $BASE/echo_sqlite/version.txt 2>&1 || echo fail>$BASE/echo_sqlite/version.txt
          elasticsearch --version > $BASE/echo_elasticsearch/version.txt 2>&1 || echo fail>$BASE/echo_elasticsearch/version.txt

          pip3 install --upgrade openai anthropic google-cloud-aiplatform transformers > $BASE/echo_ai/pip_ai.log 2>&1 || true
          python3 -c 'import openai;print(openai.__version__)' > $BASE/echo_ai/openai_ver.txt 2>&1 || true
          python3 -c 'import anthropic;print(anthropic.__version__)' > $BASE/echo_ai/claude_ver.txt 2>&1 || true

          ip a > $BASE/echo_network/ip_a.txt
          ip r > $BASE/echo_network/ip_r.txt
          ss -ntlp > $BASE/echo_network/ss.txt 2>&1 || true
          netstat -ntlp > $BASE/echo_network/netstat.txt 2>&1 || true
          traceroute 8.8.8.8 > $BASE/echo_network/traceroute.txt 2>&1 || true
          dig google.com > $BASE/echo_dns/dig.txt 2>&1 || true
          cat /etc/resolv.conf > $BASE/echo_dns/resolv.txt || true
          sudo iptables -L -n -v > $BASE/echo_firewall/iptables.txt 2>&1 || true
          sudo ufw status verbose > $BASE/echo_firewall/ufw.txt 2>&1 || true
          env > $BASE/echo_env/env.txt
          printenv | sort > $BASE/echo_env/env_sorted.txt
          uname -a > $BASE/echo_env/uname.txt
          cat /etc/os-release > $BASE/echo_env/release.txt
          id > $BASE/echo_permission/id.txt
          groups > $BASE/echo_permission/groups.txt
          sudo -l > $BASE/echo_permission/sudo_l.txt 2>&1 || true
          whoami > $BASE/echo_permission/whoami.txt

          tar czf $BASE/backup_$(date +%F).tar.gz .github || true
          docker save $(docker images -q|head -n1) -o $BASE/docker_image_backup.tar || true
          rsync -av .github $BASE/echo_backup/rsync 2>&1 || true
          cp -a .github/*.yml $BASE/echo_actions/ 2>/dev/null || true

          echo "실행시각: $(date)" > $BASE/echo_stats/time.txt
          echo "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" > $BASE/echo_stats/run_attempt.txt
          echo "GITHUB_STATUS=$GITHUB_STATUS" > $BASE/echo_stats/status.txt
          echo "실패알림: $GITHUB_RUN_ATTEMPT" > $BASE/echo_fail/alert.txt
          echo "health: ok" > $BASE/echo_health/health.txt

          ls -lhR $BASE > $BASE/echo_report/ls.txt
          du -sh $BASE > $BASE/echo_report/size.txt
          find $BASE -type f | sort > $BASE/echo_path/all_files.txt
          find $BASE -type d | sort > $BASE/echo_path/all_dirs.txt
          FILECOUNT=$(find $BASE -type f | wc -l); echo "Total files: $FILECOUNT"; [ "$FILECOUNT" -gt 0 ] || exit 1

      - name: 📄 업로드 전 전체 파일 목록
        run: find .github/workflows -type f

      - uses: actions/upload-artifact@v4.3.3
        with:
          name: fullops-artifacts
          path: .github/workflows/**
          if-no-files-found: error
