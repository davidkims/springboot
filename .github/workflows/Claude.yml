name: 🤖 Claude CLI Install & Version Test (npm 10.x 지원)

on:
  workflow_dispatch:

jobs:
  install-claude-cli:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟩 Install Node.js & npm
        run: |
          echo "echo '[🟩] Node.js & npm 설치...'"
          echo '[🟩] Node.js & npm 설치...'
          sudo apt-get update -y
          sudo apt-get install -y nodejs npm
          node -v
          npm -v

      - name: 🤖 Install Claude CLI (npx fallback) & Check Version
        run: |
          echo "echo '[🤖] Claude CLI 설치 (npx fallback 포함)...'"
          echo '[🤖] Claude CLI 설치 (npx fallback 포함)...'
          npm install -g --unsafe-perm claude || echo '[⚠️] 글로벌 설치 실패, npx로 대체'
          echo "echo '[🤖] PATH 및 글로벌 바이너리 위치 확인...'"
          echo '[🤖] PATH 및 글로벌 바이너리 위치 확인...'
          echo "PATH=$PATH"
          GLOBAL_BIN_PATH=$(node -p 'require("global-dirs").npm.bin')
          echo "GLOBAL_BIN_PATH=$GLOBAL_BIN_PATH"
          ls -al "$GLOBAL_BIN_PATH" || true
          ls -al "$GLOBAL_BIN_PATH/claude" || true
          export PATH="$GLOBAL_BIN_PATH:/usr/local/bin:$PATH"
          echo "echo '[🤖] Claude CLI 명령어 위치 및 npx 버전 확인...'"
          echo '[🤖] Claude CLI 명령어 위치 및 npx 버전 확인...'
          which claude || echo '[❌] which claude 실패'
          echo "echo '[🤖] Claude CLI 버전 (npx) 확인...'"
          echo '[🤖] Claude CLI 버전 (npx) 확인...'
          npx --yes claude --version || echo '[⚠️] Claude CLI 버전(npx) 확인 실패'
