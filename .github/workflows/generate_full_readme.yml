name: 🧾 Update README with Portfolio + Workflow Stats

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_readme:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Install or Update GitHub CLI
        run: |
          echo "[🔧] GitHub CLI 설치 또는 업데이트 시작..."
          sudo apt-get update -y
          sudo apt-get install -y --only-upgrade gh || {
            echo "[📎] gh 미설치 상태 → 새로 설치"
            sudo apt-get install -y gh
          }
          echo "[✅] 설치 완료 - 현재 gh 버전:"
          gh --version

      - name: 📊 Collect Workflow Stats
        run: |
          echo "[📊] 워크플로우 통계 수집 중..."
          mkdir -p .tmp
          OUTPUT_FILE=".tmp/workflows.md"
          SUCCESS_LIST=".tmp/success_list.md"

          echo "## ⚙️ GitHub Actions 워크플로우 목록 및 통계" > "$OUTPUT_FILE"
          echo "" >> "$OUTPUT_FILE"
          echo "| 워크플로우 이름 | 실행 수 | 성공 수 | 실패 수 | 성공률 |" >> "$OUTPUT_FILE"
          echo "|----------------|--------:|--------:|--------:|--------:|" >> "$OUTPUT_FILE"

          echo "## ✅ 최근 정상 실행된 워크플로우" > "$SUCCESS_LIST"
          echo "" >> "$SUCCESS_LIST"

          for f in .github/workflows/*.yml; do
            NAME=$(grep '^name:' "$f" | head -n1 | cut -d ':' -f2- | xargs)
            FILENAME=$(basename "$f")
            echo "[🔍] 처리 중: $NAME ($FILENAME)"

            RUNS=$(gh run list --workflow="$FILENAME" --limit 20 --json conclusion -q '.[] | .conclusion' || echo "")
            TOTAL=$(echo "$RUNS" | wc -l)
            SUCCESS=$(echo "$RUNS" | grep -c "success" || true)
            FAILURE=$(($TOTAL - $SUCCESS))
            if [ "$TOTAL" -gt 0 ]; then
              RATE=$(awk "BEGIN {printf \"%.1f\", ($SUCCESS/$TOTAL)*100}")
            else
              RATE="N/A"
            fi

            echo "| $NAME | $TOTAL | $SUCCESS | $FAILURE | $RATE% |" >> "$OUTPUT_FILE"

            if [ "$SUCCESS" -ge 1 ]; then
              echo "- $NAME (\`$FILENAME\`)" >> "$SUCCESS_LIST"
            fi
          done

          cat "$OUTPUT_FILE"
          cat "$SUCCESS_LIST"

      - name: 🏷️ Generate Workflow Badges
        run: |
          echo "[🏷️] 워크플로우 배지 생성 중..."
          mkdir -p .tmp
          BADGE_FILE=".tmp/badges.md"
          REPO="davidkims/springboot"

          echo "## 🏷️ 워크플로우 상태 배지" > "$BADGE_FILE"
          echo "" >> "$BADGE_FILE"

          for file in .github/workflows/*.yml; do
            NAME=$(grep '^name:' "$file" | head -n1 | cut -d ':' -f2- | xargs)
            FILENAME=$(basename "$file")
            echo "[🔖] 추가 중: $NAME → $FILENAME"

            echo "[![${NAME}](https://github.com/${REPO}/actions/workflows/${FILENAME}/badge.svg)](https://github.com/${REPO}/actions/workflows/${FILENAME})" >> "$BADGE_FILE"
            echo "" >> "$BADGE_FILE"
          done

          cat "$BADGE_FILE"

      - name: 🧾 Generate README.md
        run: |
          echo "[📄] README.md 생성 중..."
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S KST')
          REPO="davidkims/springboot"
          BRANCH="${{ github.ref_name }}"

          {
            echo "# 👨‍💻 김병권 포트폴리오"
            echo ""
            echo "[![🧾 Update README with Portfolio + Workflow Stats](https://github.com/${REPO}/actions/workflows/generate_full_readme.yml/badge.svg)](https://github.com/${REPO}/actions/workflows/generate_full_readme.yml)"
            echo ""
            echo "자동으로 관리되는 프로젝트입니다. 매 시간 정각에 업데이트됩니다."
            echo ""
            echo "## 🧑‍💻 개발자 소개"
            echo "- 이름: 김병권"
            echo "- 전문 분야: 백엔드 개발, GitHub Actions 자동화, 보안 자동화, DevOps"
            echo "- 스택: Python, Java, Spring Boot, FastAPI, Docker, PostgreSQL, MySQL"
            echo ""
            echo "## 📅 마지막 업데이트"
            echo "- $TIMESTAMP"
            echo ""
            echo "## ✅ 현재 브랜치"
            echo "- $BRANCH"
            echo ""
            cat .tmp/badges.md
            echo ""
            cat .tmp/success_list.md
            echo ""
            cat .tmp/workflows.md
          } > README.md

      - name: 📤 Commit & Push (Safe)
        run: |
          echo "[🔁] 변경사항 확인 및 Git 설정"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --exit-code --quiet README.md; then
            echo "[⏭️] 변경사항 없음"
          else
            echo "[✅] 변경사항 감지됨 - Pull 후 Push 시도"

            git stash push -m "pre-rebase" || echo "[ℹ️] stash 실패 무시"

            if git pull --rebase origin main; then
              echo "[🔄] rebase 성공 - stash 복원"
              git stash pop || echo "[ℹ️] stash 비어있음 또는 충돌 무시"
              git add README.md
              git commit -m "Docs: Update README with workflow stats and badges [skip ci]"
              git push
              echo "[🚀] 정상 Push 완료"
            else
              echo "[❌] rebase 실패 - 강제 push 불가 → 종료"
              exit 1
            fi
          fi
