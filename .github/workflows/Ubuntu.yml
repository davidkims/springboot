name: Ubuntu 설치 및 PowerShell 작업 실행

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # 매시간 정각 실행

jobs:
  setup-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Docker 설치
        run: |
          echo "[+] Docker 설치 시작"
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo systemctl start docker
          docker --version
          echo "[✔] Docker 설치 완료"

      - name: 📦 Docker 컨테이너 시작 (우분투)
        run: |
          echo "[+] Ubuntu Docker 컨테이너 시작 중..."
          docker pull ubuntu:latest
          docker run -d --name ubuntu-container ubuntu:latest
          echo "[✔] Ubuntu 컨테이너 시작 완료"

      - name: 📂 디렉토리 생성 및 echo 코드 호출
        run: |
          echo "[+] 디렉토리 생성 중..."
          docker exec ubuntu-container bash -c "mkdir -p /app/working_directory"
          echo "[✔] 디렉토리 생성 완료"
          
          echo "[+] echo 코드 호출 중..."
          docker exec ubuntu-container bash -c "echo 'Hello, GitHub Actions!' > /app/working_directory/hello.txt"
          docker exec ubuntu-container bash -c "cat /app/working_directory/hello.txt"
          echo "[✔] echo 코드 완료"

      - name: 🖥️ PowerShell에서 sc query 실행
        run: |
          echo "[+] PowerShell 명령 실행 시작"
          docker exec ubuntu-container bash -c "apt-get update -y && apt-get install -y powershell"
          docker exec ubuntu-container bash -c "pwsh -Command 'sc query'"
          echo "[✔] PowerShell 명령 실행 완료"

      - name: 📂 작업 완료 후 컨테이너 정리
        run: |
          echo "[+] Docker 컨테이너 정리 중..."
          docker stop ubuntu-container
          docker rm ubuntu-container
          echo "[✔] 컨테이너 정리 완료"
