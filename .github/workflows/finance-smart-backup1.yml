name: email-servers-mass-setup

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Base domain for virtual accounts"
        required: false
        default: "example.local"
      user_count:
        description: "Number of virtual accounts per service"
        required: false
        default: "50"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: /opt/email
      DOMAIN: ${{ github.event.inputs.domain || 'example.local' }}
      USER_COUNT: ${{ github.event.inputs.user_count || '50' }}
      # 서비스 명세(필요시 추가/삭제)
      SERVICES: "postfix exim4 opensmtpd mailhog mailcatcher smtp-sink maildev"

    steps:
      - name: Prepare massive directory tree per service
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo mkdir -p "$BASE"
          sudo chown -R "$USER:$USER" "$BASE"
          # 표준 트리 + 대량 더미 디렉토리(100개)
          for SVC in $SERVICES; do
            for d in bin config logs pid run spool queue tmp data certs keys users inbox outbox archive scripts env acl docs policies backups reports; do
              mkdir -p "$BASE/$SVC/$d"
            done
            # 대량 더미 디렉토리
            for i in $(seq -w 001 100); do
              mkdir -p "$BASE/$SVC/bulk/dir_$i"
            done
          done
          chmod -R 755 "$BASE"

      - name: Install prerequisites and tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates apt-transport-https software-properties-common \
            curl wget git build-essential jq \
            ruby-full libsqlite3-dev \
            docker.io \
            apache2-utils openssl
          # htpasswd(bcrypt) 제공: apache2-utils

      - name: Base README and global policy via echo/heredoc
        shell: bash
        run: |
          set -Eeuo pipefail
          cat <<'EOF' | tee "$BASE/README.txt" >/dev/null
          Email test sandbox generated by GitHub Actions.
          MTA services are installed but not auto-started to avoid port-25 conflicts.
          Test servers (MailHog/MailCatcher/smtp-sink/MailDev) run on high ports.
          EOF
          cat <<'EOF' | tee "$BASE/policies/SECURITY.md" >/dev/null
          # Security Policy (Test Only)
          - This environment is ephemeral for CI testing.
          - Do not store real credentials.
          - Virtual users are randomly generated.
          EOF
          chmod 644 "$BASE/README.txt" "$BASE/policies/SECURITY.md"

      - name: Install & configure Postfix (no auto-start) + upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          echo "postfix postfix/main_mailer_type select No configuration" | sudo debconf-set-selections
          sudo apt-get install -y --no-install-recommends postfix
          sudo apt-get install -y --only-upgrade postfix || true

          sudo cp -n /etc/postfix/main.cf /etc/postfix/main.cf.bak || true
          cat <<'EOF' | sudo tee /etc/postfix/main.cf >/dev/null
          # Generated for CI
          myhostname = localhost
          myorigin = localhost
          inet_interfaces = loopback-only
          inet_protocols = all
          mydestination =
          local_transport = error:local delivery disabled
          relayhost =
          smtp_tls_security_level = may
          smtpd_banner = $myhostname ESMTP
          EOF
          sudo service postfix stop || true

          cat <<EOF | tee "$BASE/postfix/env/.env" >/dev/null
          DOMAIN=${DOMAIN}
          USER_COUNT=${USER_COUNT}
          EOF
          chmod 640 "$BASE/postfix/env/.env"

      - name: Install & configure Exim4 (no auto-start) + upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get install -y --no-install-recommends exim4 exim4-daemon-light
          sudo apt-get install -y --only-upgrade exim4 exim4-daemon-light || true

          sudo cp -n /etc/exim4/update-exim4.conf.conf /etc/exim4/update-exim4.conf.conf.bak || true
          cat <<'EOF' | sudo tee /etc/exim4/update-exim4.conf.conf >/dev/null
          dc_eximconfig_configtype='internet'
          dc_local_interfaces='127.0.0.1.25'
          dc_other_hostnames=''
          dc_readhost=''
          dc_relay_domains=''
          dc_minimaldns='false'
          dc_relay_nets=''
          dc_smarthost=''
          CFILEMODE='644'
          dc_use_split_config='true'
          dc_hide_mailname=''
          EOF
          sudo update-exim4.conf
          sudo service exim4 stop || true

          cat <<EOF | tee "$BASE/exim4/env/.env" >/dev/null
          DOMAIN=${DOMAIN}
          USER_COUNT=${USER_COUNT}
          EOF
          chmod 640 "$BASE/exim4/env/.env"

      - name: Install & configure OpenSMTPD (no auto-start) + upgrade (best-effort)
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get install -y --no-install-recommends opensmtpd || true
          sudo apt-get install -y --only-upgrade opensmtpd || true

          if [ -f /etc/smtpd/smtpd.conf ]; then
            sudo cp -n /etc/smtpd/smtpd.conf /etc/smtpd/smtpd.conf.bak || true
            cat <<'EOF' | sudo tee /etc/smtpd/smtpd.conf >/dev/null
            pki localhost cert "/etc/ssl/certs/ssl-cert-snakeoil.pem"
            pki localhost key  "/etc/ssl/private/ssl-cert-snakeoil.key"
            listen on 127.0.0.1 port 25
            action "local" mta host smtp://127.0.0.1
            match from any for any action "local"
            EOF
            sudo service opensmtpd stop || true
          fi

          cat <<EOF | tee "$BASE/opensmtpd/env/.env" >/dev/null
          DOMAIN=${DOMAIN}
          USER_COUNT=${USER_COUNT}
          EOF
          chmod 640 "$BASE/opensmtpd/env/.env"

      - name: Install & run MailHog + upgrade (binary refresh)
        shell: bash
        run: |
          set -Eeuo pipefail
          pushd "$BASE/mailhog/bin"
          # 최신 릴리즈 바이너리 갱신(간단 업그레이드)
          MH_URL="https://github.com/mailhog/MailHog/releases/download/v1.0.1/MailHog_linux_amd64"
          curl -L "$MH_URL" -o MailHog || wget -O MailHog "$MH_URL"
          chmod +x MailHog
          popd
          nohup "$BASE/mailhog/bin/MailHog" -smtp-bind-addr 0.0.0.0:1025 -ui-bind-addr 0.0.0.0:8025 > "$BASE/mailhog/logs/mailhog.log" 2>&1 &
          echo "MailHog started (SMTP:1025, Web:8025)"

          cat <<EOF | tee "$BASE/mailhog/env/.env" >/dev/null
          DOMAIN=${DOMAIN}
          USER_COUNT=${USER_COUNT}
          EOF
          chmod 640 "$BASE/mailhog/env/.env"

      - name: Install & run MailCatcher + upgrade (gem update)
        shell: bash
        run: |
          set -Eeuo pipefail
          gem install --no-document mailcatcher
          gem update mailcatcher || true
          nohup mailcatcher --smtp-ip 0.0.0.0 --smtp-port 1026 --http-ip 0.0.0.0 --http-port 8026 > "$BASE/mailcatcher/logs/mailcatcher.log" 2>&1 &
          echo "MailCatcher started (SMTP:1026, Web:8026)"

          cat <<EOF | tee "$BASE/mailcatcher/env/.env" >/dev/null
          DOMAIN=${DOMAIN}
          USER_COUNT=${USER_COUNT}
          EOF
          chmod 640 "$BASE/mailcatcher/env/.env"

      - name: Run smtp-sink (from postfix package) on 2525
        shell: bash
        run: |
          set -Eeuo pipefail
          nohup smtp-sink -v 0.0.0.0:2525 1000 > "$BASE/smtp-sink/logs/smtp-sink.log" 2>&1 &
          echo "smtp-sink started (SMTP:2525)"
          cat <<EOF | tee "$BASE/smtp-sink/env/.env" >/dev/null
          DOMAIN=${DOMAIN}
          USER_COUNT=${USER_COUNT}
          EOF
          chmod 640 "$BASE/smtp-sink/env/.env"

      - name: Pull & run MailDev (docker) + upgrade (docker pull)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo systemctl enable --now docker || true
          sudo docker pull maildev/maildev:latest
          # 호스트 1027->컨테이너 1025, 호스트 1081->컨테이너 1080
          sudo docker rm -f maildev || true
          sudo docker run -d --name maildev \
            -p 1027:1025 -p 1081:1080 \
            -e MAILDEV_INCOMING_USER=dev -e MAILDEV_INCOMING_PASS=dev \
            maildev/maildev:latest
          echo "MailDev started (SMTP:1027, Web:1081)"

          cat <<EOF | tee "$BASE/maildev/env/.env" >/dev/null
          DOMAIN=${DOMAIN}
          USER_COUNT=${USER_COUNT}
          EOF
          chmod 640 "$BASE/maildev/env/.env"

      - name: Massive echo:permission/policy/env templates per service
        shell: bash
        run: |
          set -Eeuo pipefail
          for SVC in $SERVICES; do
            cat <<'TPL' | tee "$BASE/$SVC/policies/ACCESS_CONTROL.md" >/dev/null
            # Access Control (Test)
            - Principle: least privilege
            - Files under /acl and /keys are 640 or stricter
            - Logs readable by owner and group only
            TPL
            cat <<'TPL' | tee "$BASE/$SVC/acl/permissions.list" >/dev/null
            /config 750
            /keys   640
            /certs  640
            /logs   640
            /users  750
            TPL
            cat <<'TPL' | tee "$BASE/$SVC/docs/NOTES.md" >/dev/null
            This is a CI-only service folder. Do not use for production secrets.
            TPL
            chmod 640 "$BASE/$SVC/policies/ACCESS_CONTROL.md" "$BASE/$SVC/acl/permissions.list" "$BASE/$SVC/docs/NOTES.md"
          done

      - name: Apply ACLs and strict permissions
        shell: bash
        run: |
          set -Eeuo pipefail
          # 공통 권한
          chmod -R 755 "$BASE"
          for SVC in $SERVICES; do
            chmod 750 "$BASE/$SVC/config" "$BASE/$SVC/users" "$BASE/$SVC/scripts" || true
            chmod 750 "$BASE/$SVC/acl" "$BASE/$SVC/env" || true
            chmod 700 "$BASE/$SVC/keys" || true
            chmod 700 "$BASE/$SVC/pid" "$BASE/$SVC/run" || true
            chmod 640 "$BASE/$SVC/policies/ACCESS_CONTROL.md" "$BASE/$SVC/acl/permissions.list" || true
          done

      - name: Generate massive virtual users & passwords per service (CSV/HTPASSWD/JSON)
        shell: bash
        run: |
          set -Eeuo pipefail
          # 계정 생성 도구: apache2-utils(htpasswd), openssl, jq
          for SVC in $SERVICES; do
            UDIR="$BASE/$SVC/users"
            CSV="$UDIR/users.csv"
            JN="$UDIR/users.json"
            HTP="$UDIR/users.htpasswd"
            : > "$CSV"
            : > "$HTP"
            echo "[]" > "$JN"

            for i in $(seq 1 "$USER_COUNT"); do
              user=$(printf "%s_user%03d" "$SVC" "$i")
              email="${user}@${DOMAIN}"
              pass_plain=$(openssl rand -base64 18 | tr -d '\n' | tr '/' '_' | tr '+' '-')
              # bcrypt 해시
              hash_line=$(htpasswd -nbBC 10 "$user" "$pass_plain")
              # htpasswd 파일 추가
              echo "$hash_line" >> "$HTP"
              # CSV
              echo "$user,$email,$pass_plain" >> "$CSV"
              # JSON 누적
              tmp=$(mktemp)
              jq --arg u "$user" --arg e "$email" --arg p "$pass_plain" \
                 '. += [{"username":$u,"email":$e,"password":$p}]' "$JN" > "$tmp" && mv "$tmp" "$JN"
            done

            # 권한 강화
            chmod 640 "$CSV" "$HTP" "$JN"

            # 서비스용 계정 안내 파일
            cat <<EOF | tee "$UDIR/README.md" >/dev/null
            # Virtual Users for $SVC
            - Domain: ${DOMAIN}
            - Count : ${USER_COUNT}
            - Files :
              - users.csv (username,email,plain_password)
              - users.htpasswd (bcrypt)
              - users.json (username/email/plain_password)
            EOF
            chmod 640 "$UDIR/README.md"
          done

      - name: Output quick summary
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "== Summary =="
          echo "Base       : $BASE"
          echo "Domain     : $DOMAIN"
          echo "User Count : $USER_COUNT"
          for SVC in $SERVICES; do
            echo "--- $SVC ---"
            ls -al "$BASE/$SVC" | sed 's/^/  /'
            echo "Users samples:"
            head -n 3 "$BASE/$SVC/users/users.csv" | sed 's/^/  /'
          done
