name: 🟢 FullOps Echo/Network/Firewall/Upgrade/Env/Upload

on: 
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  echo-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - name: 🏗️ 에코/네트워크/방화벽/서비스/업그레이드/환경/권한/더미/경로 자동생성
        run: |
          WF=".github/workflows"
          for d in $WF/echo_{java,python,docker,node,nginx,postgres,mysql,firewall,network,network_setup,env,upgrade,permission,debug,path,misc};do
            mkdir -p $d
            echo "[dummy]" > $d/dummy.txt
            echo "[keep]"  > $d/.keep
            echo "echo '[에코] $d 생성됨'" > $d/echo_dir.sh
          done
          IF=$(ip r|awk '/default/{print$5;exit}')
          echo "기본 인터페이스: $IF" > $WF/echo_network_setup/default_iface.txt
          sudo ip link set $IF up 2>&1 | tee $WF/echo_network_setup/iface_up.log || echo "인터페이스 활성화 실패" > $WF/echo_network_setup/iface_up_error.txt
          if systemctl list-unit-files | grep -qw networking.service; then
            sudo systemctl restart networking 2>&1 | tee $WF/echo_network_setup/networking_restart.log
          else
            echo "networking.service not found, restart skipped." > $WF/echo_network_setup/networking_restart_skipped.txt
          fi
          ip route > $WF/echo_network_setup/ip_route.txt
          cat /etc/resolv.conf > $WF/echo_network_setup/resolv_conf.txt
          cat /etc/hosts > $WF/echo_network_setup/hosts.txt
          GATEWAY=$(ip route | grep default | awk '{print $3}' | head -n1)
          echo "현재 게이트웨이: $GATEWAY" > $WF/echo_network_setup/gateway.txt
          grep "nameserver" /etc/resolv.conf > $WF/echo_network_setup/nameserver.txt || true
          hostname > $WF/echo_network_setup/hostname.txt
          ping -c 3 127.0.0.1 > $WF/echo_network_setup/ping_localhost.txt || echo "ping 실패" > $WF/echo_network_setup/ping_localhost.txt
          ping -c 3 8.8.8.8 > $WF/echo_network_setup/ping_8888.txt || echo "ping 실패" > $WF/echo_network_setup/ping_8888.txt
          ping -c 3 www.google.com > $WF/echo_network_setup/ping_google.txt || echo "ping 실패" > $WF/echo_network_setup/ping_google.txt
          ip addr > $WF/echo_network_setup/ip_addr.txt
          ip link > $WF/echo_network_setup/ip_link.txt
          java -version > $WF/echo_java/java_version.txt 2>&1 || echo "java not found" > $WF/echo_java/java_version.txt
          which java > $WF/echo_java/java_path.txt 2>&1 || echo "not found" > $WF/echo_java/java_path.txt
          python3 --version > $WF/echo_python/python_version.txt 2>&1 || echo "python3 not found" > $WF/echo_python/python_version.txt
          which python3 > $WF/echo_python/python_path.txt 2>&1 || echo "not found" > $WF/echo_python/python_path.txt
          docker --version > $WF/echo_docker/docker_version.txt 2>&1 || echo "docker not found" > $WF/echo_docker/docker_version.txt
          docker info > $WF/echo_docker/docker_info.txt 2>&1 || echo "docker info not found" > $WF/echo_docker/docker_info.txt
          node --version > $WF/echo_node/node_version.txt 2>&1 || echo "node not found" > $WF/echo_node/node_version.txt
          which node > $WF/echo_node/node_path.txt 2>&1 || echo "not found" > $WF/echo_node/node_path.txt
          psql --version > $WF/echo_postgres/postgres_version.txt 2>&1 || echo "psql not found" > $WF/echo_postgres/postgres_version.txt
          which psql > $WF/echo_postgres/postgres_path.txt 2>&1 || echo "not found" > $WF/echo_postgres/postgres_path.txt
          mysql --version > $WF/echo_mysql/mysql_version.txt 2>&1 || echo "mysql not found" > $WF/echo_mysql/mysql_version.txt
          which mysql > $WF/echo_mysql/mysql_path.txt 2>&1 || echo "not found" > $WF/echo_mysql/mysql_path.txt
          nginx -v > $WF/echo_nginx/nginx_version.txt 2>&1 || echo "nginx not found" > $WF/echo_nginx/nginx_version.txt
          which nginx > $WF/echo_nginx/nginx_path.txt 2>&1 || echo "not found" > $WF/echo_nginx/nginx_path.txt
          ip a > $WF/echo_network/ip_a.txt
          ip route > $WF/echo_network/ip_route.txt
          ss -ntlp > $WF/echo_network/ss.txt 2>&1 || echo "ss not found" > $WF/echo_network/ss.txt
          netstat -ntlp > $WF/echo_network/netstat.txt 2>&1 || echo "netstat not found" > $WF/echo_network/netstat.txt
          ufw status verbose > $WF/echo_firewall/ufw_status.txt 2>&1 || echo "ufw not found" > $WF/echo_firewall/ufw_status.txt
          sudo iptables -L -n -v > $WF/echo_firewall/iptables.txt 2>&1 || echo "iptables not found" > $WF/echo_firewall/iptables.txt
          systemctl status firewalld > $WF/echo_firewall/firewalld_status.txt 2>&1 || echo "firewalld not found" > $WF/echo_firewall/firewalld_status.txt
          sudo apt-get update | tee $WF/echo_upgrade/apt_update.log
          sudo apt-get upgrade -y | tee $WF/echo_upgrade/apt_upgrade.log
          sudo apt-get dist-upgrade -y | tee $WF/echo_upgrade/apt_dist_upgrade.log
          sudo apt-get autoremove -y | tee $WF/echo_upgrade/apt_autoremove.log
          sudo apt-get install -y openjdk-17-jdk python3 python3-pip docker.io nodejs npm postgresql-client mysql-client nginx | tee $WF/echo_upgrade/pkg_install.log
          sudo apt-get install -y net-tools iproute2 iputils-ping lsof ufw | tee $WF/echo_upgrade/pkg_net_tools.log
          pip3 install --upgrade pip | tee $WF/echo_upgrade/pip_upgrade.log
          (sudo npm install -g npm | tee $WF/echo_upgrade/npm_upgrade.log) || (echo "npm upgrade failed: EACCES or 권한 문제" > $WF/echo_upgrade/npm_upgrade_error.log)
          docker --version > $WF/echo_upgrade/docker_after.txt 2>&1 || echo "docker not found" > $WF/echo_upgrade/docker_after.txt
          env > $WF/echo_env/env.txt
          printenv | sort > $WF/echo_env/env_all.txt
          uname -a > $WF/echo_env/uname.txt
          cat /etc/os-release > $WF/echo_env/os-release.txt
          date > $WF/echo_env/date.txt
          whoami > $WF/echo_permission/whoami.txt
          id > $WF/echo_permission/id.txt
          groups > $WF/echo_permission/groups.txt
          echo "dummy workflow" > $WF/dummy.yml
          echo "[keep]" > $WF/.keep
          echo "[dummy]" > $WF/echo_misc/dummy.txt
          find $WF -type d | sort > $WF/echo_path/all_dir_list.txt
          find $WF -type f | sort > $WF/echo_path/all_file_list.txt
          FILECOUNT=$(find $WF -type f | wc -l)
          echo "생성된 .github/workflows 하위 파일 개수: $FILECOUNT"
          if [ "$FILECOUNT" -eq 0 ]; then
            echo "::error ::.github/workflows 폴더에 파일이 1개도 없습니다!"
            ls -alR .github
            exit 1
          fi
      - name: 📄 업로드 전 파일 목록 진단
        run: find .github/workflows -type f
      - uses: actions/upload-artifact@v4.3.3
        with:
          name: all-echo
          path: .github/workflows/**
          if-no-files-found: error
