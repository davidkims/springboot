name: 🧠 .github 대규모 모니터링 + 디렉토리/에코 자동화

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  github-monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 성격별 echo 디렉토리 선 생성 + 에코 스크립트 파일 준비
        run: |
          BASE_DIR=".github"
          ECHO_DIRS="echo_logs echo_monitoring echo_infra echo_commands echo_summary echo_reports echo_metrics echo_system"

          for d in $ECHO_DIRS; do
            mkdir -p "$BASE_DIR/$d"
          done

          mkdir -p "$BASE_DIR/echo_infra/logs"
          echo "#!/bin/bash" > "$BASE_DIR/echo_infra/logs/create_dirs.sh"

          SUBDIRS="infra monitoring commands summary workflows reports metrics system security usage tmp data logs"

          for s in $SUBDIRS; do
            DIR="$BASE_DIR/$s"
            mkdir -p "$DIR"
            echo "echo '[CREATE] 디렉토리 생성: $DIR'" >> "$BASE_DIR/echo_infra/logs/create_dirs.sh"
          done

          chmod +x "$BASE_DIR/echo_infra/logs/create_dirs.sh"
          bash "$BASE_DIR/echo_infra/logs/create_dirs.sh"

      - name: 📦 .github 전체 파일 크기 및 리포트 생성
        run: |
          mkdir -p .github/echo_monitoring/logs
          du -ah .github | sort -hr | head -n 30 > .github/echo_monitoring/logs/github_file_sizes.txt
          du -sh .github > .github/echo_monitoring/logs/github_total_size.txt

      - name: 🧠 리소스 상태 수집 (CPU/MEM/DISK)
        run: |
          echo "[RESOURCE STATUS]" > .github/echo_monitoring/logs/system_usage.txt
          echo "\n🧠 CPU:" >> .github/echo_monitoring/logs/system_usage.txt
          top -b -n 1 | head -n 5 >> .github/echo_monitoring/logs/system_usage.txt
          echo "\n🧠 Memory:" >> .github/echo_monitoring/logs/system_usage.txt
          free -h >> .github/echo_monitoring/logs/system_usage.txt
          echo "\n🧠 Disk:" >> .github/echo_monitoring/logs/system_usage.txt
          df -h >> .github/echo_monitoring/logs/system_usage.txt

      - name: 📜 요약 summary 에코 리포트 생성
        run: |
          mkdir -p .github/echo_summary/logs
          {
            echo "📦 .github 용량 리포트 요약"
            echo "⏰ 실행 시각: $(date -u)"
            echo ""
            cat .github/echo_monitoring/logs/github_total_size.txt
            echo ""
            echo "🧠 시스템 자원 사용 현황"
            head -n 15 .github/echo_monitoring/logs/system_usage.txt
          } > .github/echo_summary/logs/summary.txt

      - name: 📤 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: github-monitoring-and-directories
          path: |
            .github/echo_*/**/*.txt
            .github/echo_*/**/*.sh

      - name: 💬 PR 코멘트 작성
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summaryPath = '.github/echo_summary/logs/summary.txt';
            const content = fs.readFileSync(summaryPath, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `📊 **.github 디렉토리 상태 및 설치 에코 로그 요약**\n\n\`\`\`\n${content}\n\`\`\``
            });
