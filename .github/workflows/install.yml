# 🗂️ MEGA-DB/거래/계좌/이체/유저/시뮬/설치/권한/대량/운영/유틸/Compose-통합

name: 🗂️ MEGA-DB/거래/계좌/이체/유저/시뮬/설치/권한/대량/운영/유틸/Compose-통합

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

jobs:
  db-echo-mega:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 체크아웃
        uses: actions/checkout@v4

      - name: 📁 모든 echo 이벤트 및 echo_dir_create.sh 자동 생성
        run: |
          set -e
          mkdir -p .github/echo_db
          echo "#!/bin/bash" > .github/echo_db/echo_dir_create.sh
          for d in \
            .github/echo_db/{dirs,files,logs,scripts,services,compose,homebrew,choco,snap,marketplace,backup,init,test,migration,import,export,serverinfo,errorlog,util,mass_db,mass_script,mass_query,ledger,vaccount,transfer,user,sim,teradata,dwh,ddl,output,image,dockerfile,installer,analytics,parallel,summary,workflow,api,sql_exec,echo_log,result,report,history,metrics,accounting,dispatch,task,upgrade,transfer_exec,select,polestar,bteq,elk,grafana,firewall}; do
            echo "echo 'mkdir -p $d'" | tee -a .github/echo_db/echo_dir_create.sh
            mkdir -p "$d"
          done
          chmod +x .github/echo_db/echo_dir_create.sh

      - name: 📄 친환경 기반 파일 및 실행기 생성
        run: |
          echo "echo '[에코] 사용자 당연한 이체 원장 자동생성 시작'" > .github/echo_db/logs/init_echo.log
          echo "#!/bin/bash" > .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/echo_dir_create.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_users.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_accounts.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_ledgers.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_transfers.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_selects.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/gen_dockerfiles.sh" >> .github/echo_db/scripts/full_init_run.sh
          echo "bash .github/echo_db/scripts/setup_polestar.sh" >> .github/echo_db/scripts/full_init_run.sh
          chmod +x .github/echo_db/scripts/full_init_run.sh

      - name: 🔁 BTEQ 시뮬레이션 + ELK 연동
        run: |
          echo "#!/bin/bash" > .github/echo_db/bteq/run_bteq_simulation.sh
          echo "bteq < .github/echo_db/teradata/tx_simulation.btq || echo '[WARN] BTEQ 실행 실패'" >> .github/echo_db/bteq/run_bteq_simulation.sh
          chmod +x .github/echo_db/bteq/run_bteq_simulation.sh
          echo "-- Teradata BTEQ 샘플" > .github/echo_db/teradata/tx_simulation.btq
          echo "SELECT * FROM accounts WHERE balance > 100000;" >> .github/echo_db/teradata/tx_simulation.btq
          echo "cat .github/echo_db/output/bteq_result.csv | curl -XPOST http://localhost:9200/bteq/_bulk -H 'Content-Type: application/json' --data-binary @- || echo '[WARN] ELK 전송 실패'" > .github/echo_db/elk/send_to_elk.sh
          chmod +x .github/echo_db/elk/send_to_elk.sh

      - name: 📊 Grafana 대시보드 자동 Import
        run: |
          echo "#!/bin/bash" > .github/echo_db/grafana/import_dashboard.sh
          echo "curl -X POST http://localhost:3000/api/dashboards/db -H 'Authorization: Bearer GRAFANA_API_KEY' -H 'Content-Type: application/json' -d @.github/echo_db/grafana/sample_dashboard.json || echo '[WARN] Grafana import 실패'" >> .github/echo_db/grafana/import_dashboard.sh
          echo '{ "dashboard": { "title": "Account Monitor", "panels": [] }, "overwrite": true }' > .github/echo_db/grafana/sample_dashboard.json
          chmod +x .github/echo_db/grafana/import_dashboard.sh

      - name: 🔒 방화벽 및 포트 점검
        run: |
          echo "#!/bin/bash" > .github/echo_db/firewall/check_ports.sh
          for port in 22 80 443 9092 9200 3000; do
            echo "Checking port $port..." >> .github/echo_db/firewall/check_ports.sh
            echo "nc -zv localhost $port || echo '[WARN] Port $port 접속 실패'" >> .github/echo_db/firewall/check_ports.sh
          done
          chmod +x .github/echo_db/firewall/check_ports.sh
          bash .github/echo_db/firewall/check_ports.sh

      - name: 🏷️ 모든 에코 출력표시
        run: |
          echo "[ECHO] 모든 친환경 출력을 덤프합니다"
          find .github/echo_db -type f | sort | while read f; do
            echo "-----"
            echo "[파일] $f"
            cat "$f"
            echo
          done
