name: "🦀 Rust CI — no-skip, auto-detect, safe rust-cache"

on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }

permissions:
  contents: read

concurrency:
  group: rustci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable + clippy/rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          profile: minimal

      # 1) 리포 전수 스캔: 루트/워크스페이스/다중 크레이트 모두 탐지
      - name: Detect Cargo manifests (workspace or crates)
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[ECHO] Cargo.toml 탐색 시작"

          # 1) 루트 우선 검사
          if [[ -f Cargo.toml ]]; then
            if grep -q "^\[workspace\]" Cargo.toml; then
              echo "mode=workspace" >>"$GITHUB_OUTPUT"
              echo "root=."         >>"$GITHUB_OUTPUT"
              echo "[ECHO] 루트 워크스페이스 모드"
              exit 0
            else
              echo "mode=single"    >>"$GITHUB_OUTPUT"
              echo "dir=."          >>"$GITHUB_OUTPUT"
              echo "manifest=./Cargo.toml" >>"$GITHUB_OUTPUT"
              echo "[ECHO] 루트 단일 크레이트 모드"
              exit 0
            fi
          fi

          # 2) 전체에서 Cargo.toml 수집 (빌드 산출물/노드 제외)
          mapfile -t found < <(find . -type f -name Cargo.toml \
            -not -path "*/target/*" -not -path "*/node_modules/*" | sort)

          if (( ${#found[@]} == 0 )); then
            echo "::error ::No Cargo.toml found anywhere in the repo."
            exit 1
          fi

          # [workspace] 파일이 있으면 가장 얕은 깊이를 워크스페이스 루트로
          ws_candidates=()
          for f in "${found[@]}"; do
            grep -q "^\[workspace\]" "$f" && ws_candidates+=("$f") || true
          done

          if (( ${#ws_candidates[@]} )); then
            ws_root="$(dirname "$(printf '%s\n' "${ws_candidates[@]}" \
              | awk -F/ '{print NF "\t"$0}' | sort -n | cut -f2- | head -n1)")"
            echo "mode=workspace" >>"$GITHUB_OUTPUT"
            echo "root=${ws_root}" >>"$GITHUB_OUTPUT"
            echo "[ECHO] 워크스페이스 루트: ${ws_root}"
            exit 0
          fi

          # 워크스페이스가 없다면, 모든 크레이트 디렉터리를 나열
          printf '%s\n' "${found[@]}" | xargs -I{} dirname "{}" | sort -u > crates.txt
          echo "mode=multi" >>"$GITHUB_OUTPUT"
          echo "crates<<__CRATES__" >>"$GITHUB_OUTPUT"
          cat crates.txt             >>"$GITHUB_OUTPUT"
          echo "__CRATES__"          >>"$GITHUB_OUTPUT"
          echo "[ECHO] 다중 크레이트 모드: $(wc -l < crates.txt)개"

      # 2) rust-cache에 '반드시' 유효한 workspaces 목록을 넘겨줍니다.
      - name: Prepare workspace list for rust-cache
        id: wslist
        shell: bash
        run: |
          set -Eeuo pipefail
          mode="${{ steps.detect.outputs.mode }}"
          list=""
          case "$mode" in
            workspace)
              list="${{ steps.detect.outputs.root }}"
              ;;
            single)
              # 단일 크레이트 디렉터리
              list="${{ steps.detect.outputs.dir }}"
              ;;
            multi)
              # crates(줄바꿈 목록)를 그대로 사용
              list="${{ steps.detect.outputs.crates }}"
              ;;
            *)
              echo "::error ::Unknown mode: $mode"
              exit 1
              ;;
          esac

          # 비어있지 않은 라인만 남기기
          echo "$list" | awk 'NF' > .wslist.txt
          echo "list<<__WS__" >>"$GITHUB_OUTPUT"
          cat .wslist.txt      >>"$GITHUB_OUTPUT"
          echo "__WS__"        >>"$GITHUB_OUTPUT"

          echo "[ECHO] rust-cache 대상:"
          nl -ba .wslist.txt || true

      - name: Cache (targets via rust-cache)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ steps.wslist.outputs.list }}
          # 캐시 미스여도 실패하지 않도록 (기본값: true)
          cache-on-failure: true

      - name: Show Rust versions
        shell: bash
        run: |
          rustc -Vv
          cargo -V

      # ===== 실행 파이프라인 (모드 별로 전체 과정 실행) =====

      # 워크스페이스 모드
      - name: Format (workspace)
        if: ${{ steps.detect.outputs.mode == 'workspace' }}
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.root }}"
          cargo fmt --all --check

      - name: Clippy (workspace)
        if: ${{ steps.detect.outputs.mode == 'workspace' }}
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.root }}"
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (workspace)
        if: ${{ steps.detect.outputs.mode == 'workspace' }}
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.root }}"
          cargo test --all-features --verbose

      - name: Build (workspace, release)
        if: ${{ steps.detect.outputs.mode == 'workspace' }}
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.root }}"
          cargo build --release --verbose

      # 단일 크레이트 모드
      - name: Format (single)
        if: ${{ steps.detect.outputs.mode == 'single' }}
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.dir }}"
          cargo fmt --all --check

      - name: Clippy (single)
        if: ${{ steps.detect.outputs.mode == 'single' }}
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.dir }}"
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (single)
        if: ${{ steps.detect.outputs.mode == 'single' }}
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.dir }}"
          cargo test --all-features --verbose

      - name: Build (single, release)
        if: ${{ steps.detect.outputs.mode == 'single' }}
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.dir }}"
          cargo build --release --verbose

      # 다중 크레이트 모드 (모든 크레이트에 전 과정 수행)
      - name: Format/Clippy/Test/Build (multi; loop all crates)
        if: ${{ steps.detect.outputs.mode == 'multi' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r dir; do
            echo "[ECHO] >>> crate: $dir"
            cd "$dir"
            cargo fmt --all --check
            cargo clippy --all-targets --all-features -- -D warnings
            cargo test --all-features --verbose
            cargo build --release --verbose
            cd - >/dev/null
          done < .wslist.txt
