name: Docker 금융 고객 정보 생성

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # 매시간 정각 실행

jobs:
  generate-customer-info:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Docker 설치
        run: |
          echo "[+] Docker 설치 시작"
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo systemctl start docker
          docker --version
          echo "[✔] Docker 설치 완료"

      - name: 📦 Docker 컨테이너 시작 (우분투)
        run: |
          echo "[+] Ubuntu Docker 컨테이너 시작 중..."
          docker pull ubuntu:latest
          docker run -d --name ubuntu-container ubuntu:latest tail -f /dev/null
          echo "[✔] Ubuntu 컨테이너 시작 완료"

      - name: 🧰 Python 및 Faker 설치
        run: |
          echo "[+] Python 및 Faker 설치 중..."
          docker exec ubuntu-container bash -c "apt-get update && apt-get install -y python3 python3-pip"
          docker exec ubuntu-container bash -c "pip3 install --break-system-packages faker"
          echo "[✔] Python 및 Faker 설치 완료"

      - name: 📝 금융 고객 정보 생성 파이썬 스크립트 생성
        run: |
          echo "[+] Python 스크립트 생성 중..."
          docker exec ubuntu-container bash -c "mkdir -p /app"

          docker exec ubuntu-container bash -c "echo 'import csv' > /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo 'from faker import Faker' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo 'fake = Faker()' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c "echo '' >> /app/generate_customers.py"
          docker exec ubuntu-container bash -c \"echo 'with open(\"/app/customers.csv\", \"w\", newline=\"\") as f:' >> /app/generate_customers.py\"
          docker exec ubuntu-container bash -c \"echo '    writer = csv.writer(f)' >> /app/generate_customers.py\"
          docker exec ubuntu-container bash -c \"echo '    writer.writerow([\"이름\", \"계좌번호\", \"잔액\"])' >> /app/generate_customers.py\"
          docker exec ubuntu-container bash -c \"echo '    for _ in range(10):' >> /app/generate_customers.py\"
          docker exec ubuntu-container bash -c \"echo '        name = fake.name()' >> /app/generate_customers.py\"
          docker exec ubuntu-container bash -c \"echo '        account = fake.bban()' >> /app/generate_customers.py\"
          docker exec ubuntu-container bash -c \"echo '        balance = round(fake.pyfloat(left_digits=6, right_digits=2, positive=True), 2)' >> /app/generate_customers.py\"
          docker exec ubuntu-container bash -c \"echo '        writer.writerow([name, account, balance])' >> /app/generate_customers.py\"
          docker exec ubuntu-container bash -c \"echo 'print(\"[✔] 고객 CSV 생성 완료\")' >> /app/generate_customers.py\"

          echo "[✔] 스크립트 작성 완료"

      - name: 🏃 Python 스크립트 실행
        run: |
          echo "[+] 고객 정보 생성 스크립트 실행 중..."
          docker exec ubuntu-container python3 /app/generate_customers.py
          echo "[✔] 고객 정보 생성 완료"

      - name: 📄 생성된 고객 CSV 확인
        run: |
          echo "[+] 생성된 고객 CSV 확인 중..."
          docker exec ubuntu-container cat /app/customers.csv

      - name: 🧹 작업 완료 후 컨테이너 정리
        run: |
          echo "[+] Docker 컨테이너 정리 중..."
          docker stop ubuntu-container
          docker rm ubuntu-container
          echo "[✔] 컨테이너 정리 완료"
