name: DB CLI Auto Install & Safe Execution (No key/repo registration)

on:
  workflow_dispatch:

jobs:
  db-cli-tools-no-key:
    runs-on: ubuntu-latest

    env:
      DBCLI_DIR: .github/dbcli
      OUTPUT_DIR: .github/dbcli/output

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 📂 Ensure Sample SQL/Command Files Exist
        run: |
          mkdir -p $DBCLI_DIR/mysql
          mkdir -p $DBCLI_DIR/postgresql
          mkdir -p $DBCLI_DIR/sqlite
          mkdir -p $DBCLI_DIR/redis
          mkdir -p $DBCLI_DIR/clickhouse

          if [ ! -f $DBCLI_DIR/mysql/demo.sql ]; then
            echo "[AUTO] Generating MySQL demo.sql"
            echo "SELECT VERSION();" > $DBCLI_DIR/mysql/demo.sql
          fi

          if [ ! -f $DBCLI_DIR/postgresql/demo.sql ]; then
            echo "[AUTO] Generating PostgreSQL demo.sql"
            echo "SELECT version();" > $DBCLI_DIR/postgresql/demo.sql
          fi

          if [ ! -f $DBCLI_DIR/sqlite/demo.sql ]; then
            echo "[AUTO] Generating SQLite demo.sql"
            echo "SELECT sqlite_version();" > $DBCLI_DIR/sqlite/demo.sql
          fi

          if [ ! -f $DBCLI_DIR/redis/demo.redis ]; then
            echo "[AUTO] Generating Redis demo.redis"
            echo "PING" > $DBCLI_DIR/redis/demo.redis
            echo "INFO" >> $DBCLI_DIR/redis/demo.redis
          fi

          if [ ! -f $DBCLI_DIR/clickhouse/demo.sql ]; then
            echo "[AUTO] Generating ClickHouse demo.sql"
            echo "SELECT version();" > $DBCLI_DIR/clickhouse/demo.sql
          fi

          mkdir -p $OUTPUT_DIR

      - name: 🏃 Auto-install & Safely Run DB CLI Samples (NO key registration)
        run: |
          # MySQL (mysql-client, 기본 apt)
          echo "[🏃] Run MySQL sample"
          if ! command -v mysql > /dev/null; then
            echo "[⚠️] mysql CLI not found, installing..."
            sudo apt-get update && sudo apt-get install -y mysql-client
          fi
          if command -v mysql > /dev/null && [ -f $DBCLI_DIR/mysql/demo.sql ]; then
            mysql --version
            sudo mysql -u root < $DBCLI_DIR/mysql/demo.sql > $OUTPUT_DIR/mysql_demo.out 2>&1 || echo "[⚠️] MySQL 실행 실패"
          else
            echo "[❌] mysql CLI 또는 샘플 SQL 미존재 - 실행 스킵"
          fi

          # PostgreSQL (postgresql-client, 기본 apt)
          echo "[🏃] Run PostgreSQL sample"
          if ! command -v psql > /dev/null; then
            echo "[⚠️] psql CLI not found, installing..."
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          if command -v psql > /dev/null && [ -f $DBCLI_DIR/postgresql/demo.sql ]; then
            psql --version
            sudo -u postgres psql -f $DBCLI_DIR/postgresql/demo.sql > $OUTPUT_DIR/psql_demo.out 2>&1 || echo "[⚠️] PostgreSQL 실행 실패"
          else
            echo "[❌] psql CLI 또는 샘플 SQL 미존재 - 실행 스킵"
          fi

          # SQLite (sqlite3, 기본 apt)
          echo "[🏃] Run SQLite sample"
          if ! command -v sqlite3 > /dev/null; then
            echo "[⚠️] sqlite3 CLI not found, installing..."
            sudo apt-get update && sudo apt-get install -y sqlite3
          fi
          if command -v sqlite3 > /dev/null && [ -f $DBCLI_DIR/sqlite/demo.sql ]; then
            sqlite3 --version
            sqlite3 :memory: < $DBCLI_DIR/sqlite/demo.sql > $OUTPUT_DIR/sqlite_demo.out 2>&1 || echo "[⚠️] SQLite 실행 실패"
          else
            echo "[❌] sqlite3 CLI 또는 샘플 SQL 미존재 - 실행 스킵"
          fi

          # Redis (redis-tools, 기본 apt)
          echo "[🏃] Run Redis sample"
          if ! command -v redis-cli > /dev/null; then
            echo "[⚠️] redis-cli not found, installing..."
            sudo apt-get update && sudo apt-get install -y redis-tools
          fi
          if command -v redis-cli > /dev/null && [ -f $DBCLI_DIR/redis/demo.redis ]; then
            redis-cli --version
            while read line; do redis-cli $line; done < $DBCLI_DIR/redis/demo.redis > $OUTPUT_DIR/redis_demo.out 2>&1 || echo "[⚠️] Redis 실행 실패"
          else
            echo "[❌] redis-cli 또는 샘플 파일 미존재 - 실행 스킵"
          fi

          # ClickHouse (clickhouse-client, 기본 apt)
          echo "[🏃] Run ClickHouse sample"
          if ! command -v clickhouse-client > /dev/null; then
            echo "[⚠️] clickhouse-client not found, installing..."
            sudo apt-get update && sudo apt-get install -y clickhouse-client
          fi
          if command -v clickhouse-client > /dev/null && [ -f $DBCLI_DIR/clickhouse/demo.sql ]; then
            clickhouse-client --version
            clickhouse-client --multiquery < $DBCLI_DIR/clickhouse/demo.sql > $OUTPUT_DIR/clickhouse_demo.out 2>&1 || echo "[⚠️] ClickHouse 실행 실패"
          else
            echo "[❌] clickhouse-client 또는 샘플 SQL 미존재 - 실행 스킵"
          fi

      - name: 📝 Show Output Directory Structure
        run: |
          echo "[📝] $OUTPUT_DIR 디렉토리와 파일 리스트"
          tree $OUTPUT_DIR || ls -R $OUTPUT_DIR
