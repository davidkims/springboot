---
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "21:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    groups:
      actions-all:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/workflow"
    schedule:
      interval: "daily"
      time: "21:10"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    groups:
      docker-all:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "21:20"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    insecure-external-code-execution: deny
    groups:
      pip-all:
        patterns: ["*"]

  # 추가된 npm 의존성 업데이트
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "21:30"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    groups:
      npm-all:
        patterns: ["*"]
