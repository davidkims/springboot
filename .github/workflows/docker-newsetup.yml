name: 🏦 금융 대량거래/원장/도커/DB/테스트/에코 ALL-IN-ONE (pip debian 문제 방지)

on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * *'

jobs:
  fintech-ultimate-fullops:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 모든 디렉토리/에코/DB/원장/거래/로그/테스트 대량 생성
        run: |
          set -e
          # 1. 모든 echo/로그/DB/거래/원장/도커 디렉토리
          for d in \
            .github/echo .github/logs .github/backup .github/snapshot .github/fin_ledger .github/fin_txn .github/fin_db .github/fin_api .github/fin_export \
            .github/echo/db .github/echo/db/sql .github/echo/db/query .github/echo/ledger .github/echo/ledger/bulk .github/echo/ledger/log \
            .github/echo/txn .github/echo/txn/bulk .github/echo/txn/log .github/echo/test .github/echo/test/fin \
            .github/echo/docker .github/echo/docker/install .github/echo/docker/env .github/echo/docker/compose .github/echo/dockerfile; do
            mkdir -p "$d" 2>/dev/null || true
            echo "echo 'mkdir -p $d'" | tee -a .github/echo/dir_create_fin.log || true
          done

          # 2. 금융 원장/거래 에코 대량 생성
          for i in $(seq 1 100); do
            echo "echo '[원장 레코드 $i] 거래ID: TXN$(printf "%05d" $i), 금액: $((RANDOM%1000000+100)), 상태: 정상'" | tee .github/echo/ledger/bulk/ledger_$i.txt || true
            echo "[원장 레코드 $i] 거래ID: TXN$(printf "%05d" $i), 금액: $((RANDOM%1000000+100)), 상태: 정상" > .github/echo/ledger/bulk/ledger_$i.txt || true

            echo "echo '거래ID: TXN$(printf "%05d" $i), 금액: $((RANDOM%1000000+100)), 승인: Y, 실패: N'" | tee .github/echo/txn/bulk/txn_$i.txt || true
            echo "거래ID: TXN$(printf "%05d" $i), 금액: $((RANDOM%1000000+100)), 승인: Y, 실패: N" > .github/echo/txn/bulk/txn_$i.txt || true
          done

          # 3. 금융 DB/SQL/Query 샘플/에코
          echo "echo 'CREATE TABLE IF NOT EXISTS ledger (id INT PRIMARY KEY AUTO_INCREMENT, txid VARCHAR(32), amount INT, status VARCHAR(16), ts TIMESTAMP DEFAULT CURRENT_TIMESTAMP);'" | tee .github/echo/db/sql/ledger_table.sql || true
          echo "CREATE TABLE IF NOT EXISTS ledger (id INT PRIMARY KEY AUTO_INCREMENT, txid VARCHAR(32), amount INT, status VARCHAR(16), ts TIMESTAMP DEFAULT CURRENT_TIMESTAMP);" > .github/echo/db/sql/ledger_table.sql || true

          echo "echo 'CREATE TABLE IF NOT EXISTS transactions (id INT PRIMARY KEY AUTO_INCREMENT, txid VARCHAR(32), amount INT, approved CHAR(1), failed CHAR(1), ts TIMESTAMP DEFAULT CURRENT_TIMESTAMP);'" | tee .github/echo/db/sql/txn_table.sql || true
          echo "CREATE TABLE IF NOT EXISTS transactions (id INT PRIMARY KEY AUTO_INCREMENT, txid VARCHAR(32), amount INT, approved CHAR(1), failed CHAR(1), ts TIMESTAMP DEFAULT CURRENT_TIMESTAMP);" > .github/echo/db/sql/txn_table.sql || true

          echo "echo 'INSERT INTO ledger (txid, amount, status) VALUES (\"TXN99999\", 1000000, \"정상\");'" | tee .github/echo/db/query/ledger_insert.sql || true
          echo 'INSERT INTO ledger (txid, amount, status) VALUES ("TXN99999", 1000000, "정상");' > .github/echo/db/query/ledger_insert.sql || true

          echo "echo 'SELECT * FROM ledger WHERE amount > 100000;'" | tee .github/echo/db/query/ledger_select.sql || true
          echo "SELECT * FROM ledger WHERE amount > 100000;" > .github/echo/db/query/ledger_select.sql || true

          echo "echo 'SELECT * FROM transactions WHERE approved=\"Y\";'" | tee .github/echo/db/query/txn_approved.sql || true
          echo "SELECT * FROM transactions WHERE approved=\"Y\";" > .github/echo/db/query/txn_approved.sql || true

          # 4. 금융 로그/테스트/샘플
          echo "echo '거래 처리 결과: 전체 100건, 성공 98, 실패 2'" | tee .github/echo/ledger/log/ledger_bulk_summary.log || true
          echo "거래 처리 결과: 전체 100건, 성공 98, 실패 2" > .github/echo/ledger/log/ledger_bulk_summary.log || true

          echo "echo '{ \"batch_result\": \"ok\", \"count\": 100, \"fail\": 2 }'" | tee .github/echo/test/fin/batch_result.json || true
          echo '{ "batch_result": "ok", "count": 100, "fail": 2 }' > .github/echo/test/fin/batch_result.json || true

          echo "echo '{ \"api\": \"ledger_export\", \"result\": \"ok\", \"export_count\": 100 }'" | tee .github/fin_export/ledger_export.json || true
          echo '{ "api": "ledger_export", "result": "ok", "export_count": 100 }' > .github/fin_export/ledger_export.json || true

          # 5. Docker/Compose/Env/Dockerfile 샘플(금융 특화)
          echo "echo 'DOCKER_SERVICE=ledger-api'" | tee .github/echo/docker/env/ledger.env || true
          echo "DOCKER_SERVICE=ledger-api" > .github/echo/docker/env/ledger.env || true
          echo "echo 'DOCKER_PORT=18080'" | tee -a .github/echo/docker/env/ledger.env || true
          echo "DOCKER_PORT=18080" >> .github/echo/docker/env/ledger.env || true

          echo "echo 'version: \"3\"'" | tee .github/echo/docker/compose/docker-compose-fin.yml || true
          echo "version: \"3\"" > .github/echo/docker/compose/docker-compose-fin.yml || true
          echo "echo 'services:'" | tee -a .github/echo/docker/compose/docker-compose-fin.yml || true
          echo "services:" >> .github/echo/docker/compose/docker-compose-fin.yml || true
          echo "echo '  ledger-api:'" | tee -a .github/echo/docker/compose/docker-compose-fin.yml || true
          echo "  ledger-api:" >> .github/echo/docker/compose/docker-compose-fin.yml || true
          echo "echo '    image: nginx:latest'" | tee -a .github/echo/docker/compose/docker-compose-fin.yml || true
          echo "    image: nginx:latest" >> .github/echo/docker/compose/docker-compose-fin.yml || true
          echo "echo '    ports:'" | tee -a .github/echo/docker/compose/docker-compose-fin.yml || true
          echo "    ports:" >> .github/echo/docker/compose/docker-compose-fin.yml || true
          echo "echo '      - \"18080:80\"'" | tee -a .github/echo/docker/compose/docker-compose-fin.yml || true
          echo "      - \"18080:80\"" >> .github/echo/docker/compose/docker-compose-fin.yml || true

          echo "echo 'FROM ubuntu:24.04'" | tee .github/echo/dockerfile/ledger.Dockerfile || true
          echo "FROM ubuntu:24.04" > .github/echo/dockerfile/ledger.Dockerfile || true
          echo "echo 'RUN apt-get update && apt-get install -y postgresql-client'" | tee -a .github/echo/dockerfile/ledger.Dockerfile || true
          echo "RUN apt-get update && apt-get install -y postgresql-client" >> .github/echo/dockerfile/ledger.Dockerfile || true
          echo "echo 'CMD [\"sleep\", \"infinity\"]'" | tee -a .github/echo/dockerfile/ledger.Dockerfile || true
          echo "CMD [\"sleep\", \"infinity\"]" >> .github/echo/dockerfile/ledger.Dockerfile || true

          echo "ls -alR .github/echo" | tee -a .github/echo/ledger/log/final_dirlist.log || true
          ls -alR .github/echo | tee -a .github/echo/ledger/log/final_dirlist.log || true

      - name: 📦 패키지 전체 업그레이드 (pip debian 체크, 권한/경고/에러 자동)
        run: |
          set +e
          mkdir -p .github/echo/docker || true

          echo "echo '[APT upgrade]'" | tee -a .github/echo/docker/dir_create.log
          sudo apt-get update -y | tee -a .github/echo/docker/apt_upgrade.log
          sudo apt-get upgrade -y | tee -a .github/echo/docker/apt_upgrade.log

          echo "echo '[pip upgrade]'" | tee -a .github/echo/docker/dir_create.log

          IS_DEBIAN_PIP=0
          PIP_PATH="$(which pip3 || which pip || echo '')"
          if [ -n "$PIP_PATH" ] && "$PIP_PATH" --version 2>/dev/null | grep -q '/usr/lib/python3/dist-packages'; then
            IS_DEBIAN_PIP=1
          fi

          if [ "$IS_DEBIAN_PIP" = "1" ]; then
            echo "[SKIP] pip is installed by Debian package. Upgrade skipped, error is normal." | tee -a .github/echo/docker/pip_upgrade.log
          else
            (sudo python3 -m pip install --upgrade pip | tee -a .github/echo/docker/pip_upgrade.log) || \
            (echo "[pip upgrade error, possibly RECORD/metadata. Safe to ignore.]" | tee -a .github/echo/docker/pip_upgrade.log)
          fi

          (sudo python3 -m pip list --outdated | tee -a .github/echo/docker/pip_upgrade.log) || \
          (echo "[pip list error, skipping.]" | tee -a .github/echo/docker/pip_upgrade.log)
          OUTDATED_PKGS=$(sudo python3 -m pip list --outdated 2>/dev/null | awk 'NR>2 {print $1}')
          if [ -n "$OUTDATED_PKGS" ]; then
            (sudo python3 -m pip install --upgrade $OUTDATED_PKGS | tee -a .github/echo/docker/pip_upgrade.log) || \
            (echo "[pip package upgrade error, possibly due to RECORD or metadata. Ignored.]" | tee -a .github/echo/docker/pip_upgrade.log)
          fi

          echo "echo '[npm upgrade]'" | tee -a .github/echo/docker/dir_create.log
          if command -v npm > /dev/null 2>&1; then
            (sudo npm install -g npm | tee -a .github/echo/docker/npm_upgrade.log) || \
            (echo "[npm install -g error]" | tee -a .github/echo/docker/npm_upgrade.log)
            (sudo npm update -g 2>&1 | tee -a .github/echo/docker/npm_upgrade.log) || \
            (echo "[npm update -g error]" | tee -a .github/echo/docker/npm_upgrade.log)
            sudo npm list -g --depth=0 --json 2>/dev/null | jq . > .github/echo/docker/npm_global_list.json || true
            sudo npm outdated -g 2>&1 | tee .github/echo/docker/npm_outdated.log || true
            sudo npm fund 2>&1 | tee .github/echo/docker/npm_fund.log || true
            for d in /usr/local/lib /usr/local/bin /usr/local/share; do
              sudo chown -R $(whoami):$(whoami) $d 2>/dev/null || true
              sudo chmod -R a+rwx $d 2>/dev/null || true
            done
          fi

          echo "echo '[conda upgrade]'" | tee -a .github/echo/docker/dir_create.log
          if command -v conda > /dev/null 2>&1; then
            (conda update -y conda | tee -a .github/echo/docker/conda_upgrade.log) || \
            (echo "[conda update error]" | tee -a .github/echo/docker/conda_upgrade.log)
            (conda update -y --all | tee -a .github/echo/docker/conda_upgrade.log) || \
            (echo "[conda full update error]" | tee -a .github/echo/docker/conda_upgrade.log)
          fi

      - name: 🐳 Docker 설치/샘플(금융) echo/실제 설치/권한 복구
        run: |
          set -e
          {
            echo "echo '[Docker install/upgrade]'"
            echo "echo 'sudo apt-get update -y'"
            echo "sudo apt-get update -y"
            echo "echo 'sudo apt-get install -y ca-certificates curl gnupg lsb-release'"
            echo "sudo apt-get install -y ca-certificates curl gnupg lsb-release"
            echo "echo 'sudo install -m 0755 -d /etc/apt/keyrings'"
            echo "sudo install -m 0755 -d /etc/apt/keyrings"
            echo "echo 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg'"
            echo "curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg"
            echo "echo 'echo \"deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \$(lsb_release -cs) stable\" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null'"
            echo "echo \"deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \$(lsb_release -cs) stable\" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null"
            echo "echo 'sudo apt-get update -y'"
            echo "sudo apt-get update -y"
            echo "echo 'sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin'"
            echo "sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"
          } > .github/echo/docker/install/docker_install.sh
          chmod +x .github/echo/docker/install/docker_install.sh || true

          echo '[Docker install/upgrade]' | tee -a .github/echo/docker/install/docker_install.log || true
          echo 'sudo apt-get update -y' | tee -a .github/echo/docker/install/docker_install.log || true
          sudo apt-get update -y 2>&1 | tee -a .github/echo/docker/install/docker_install.log || true
          echo 'sudo apt-get install -y ca-certificates curl gnupg lsb-release' | tee -a .github/echo/docker/install/docker_install.log || true
          sudo apt-get install -y ca-certificates curl gnupg lsb-release 2>&1 | tee -a .github/echo/docker/install/docker_install.log || true
          echo 'sudo install -m 0755 -d /etc/apt/keyrings' | tee -a .github/echo/docker/install/docker_install.log || true
          sudo install -m 0755 -d /etc/apt/keyrings 2>&1 | tee -a .github/echo/docker/install/docker_install.log || true
          echo 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg' | tee -a .github/echo/docker/install/docker_install.log || true
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg 2>&1 | tee -a .github/echo/docker/install/docker_install.log || true
          echo 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null' | tee -a .github/echo/docker/install/docker_install.log || true
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null 2>&1 | tee -a .github/echo/docker/install/docker_install.log || true
          echo 'sudo apt-get update -y' | tee -a .github/echo/docker/install/docker_install.log || true
          sudo apt-get update -y 2>&1 | tee -a .github/echo/docker/install/docker_install.log || true
          echo 'sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin' | tee -a .github/echo/docker/install/docker_install.log || true
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin 2>&1 | tee -a .github/echo/docker/install/docker_install.log || true
          echo '[Docker install steps complete]' | tee -a .github/echo/docker/install/docker_install.log || true
