name: 🛡️ OpenSSF Scorecard Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # 매일 오전 10시(KST 기준) 자동 실행

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  setup-and-run-scorecard:
    runs-on: ubuntu-latest

    env:
      TARGET_REPO: davidkims/springboot
      OUT_DIR: .github/scorecard

    steps:
      - name: 📁 리포지토리 체크아웃
        uses: actions/checkout@v4

      - name: 📂 디렉토리 생성 및 echo 테스트
        run: |
          echo "[+] 디렉토리 생성 중: $OUT_DIR"
          mkdir -p $OUT_DIR/bin
          echo "[+] 디렉토리 구조:"
          tree .github || true

      - name: 🧰 Scorecard CLI 설치 (Release에서 직접 다운로드)
        run: |
          echo "[+] Scorecard CLI 설치 시작"
          curl -sLO https://github.com/ossf/scorecard/releases/latest/download/scorecard-linux-amd64
          chmod +x scorecard-linux-amd64
          mv scorecard-linux-amd64 $OUT_DIR/bin/scorecard
          echo "[✔] Scorecard 설치 완료: $OUT_DIR/bin/scorecard"

      - name: 🧪 Scorecard 실행 (전체 평가)
        run: |
          echo "[+] Scorecard 보안 점수 평가 시작"
          $OUT_DIR/bin/scorecard --repo=https://github.com/$TARGET_REPO --format=json --show-details > $OUT_DIR/scorecard-report.json
          echo "[✔] scorecard-report.json 생성 완료"

      - name: 📄 결과 요약 저장 (Echo)
        run: |
          echo "[+] 주요 Scorecard 평가 결과 요약:"
          jq '.checks[] | {name: .name, score: .score, reason: .reason}' $OUT_DIR/scorecard-report.json | tee $OUT_DIR/scorecard-summary.json

      - name: 📦 SARIF 파일 생성 (보안 점수 -> GitHub Code Scanning 연동용)
        run: |
          echo "[+] SARIF 파일 변환 시작"
          $OUT_DIR/bin/scorecard --repo=https://github.com/$TARGET_REPO --format=sarif > $OUT_DIR/scorecard-results.sarif
          echo "[✔] SARIF 파일 생성 완료: $OUT_DIR/scorecard-results.sarif"

      - name: 📊 Scorecard SARIF 업로드 (Code Scanning Results)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.OUT_DIR }}/scorecard-results.sarif
