name: "🌱 Spring Boot Bootstrap + Maven Build + Echo/Perm (auto scaffold if missing)"

on:
  workflow_dispatch:
    inputs:
      scaffold_if_missing:
        description: "pom.xml 없으면 Spring Boot 자동 생성"
        required: true
        default: "true"
      group_id:
        description: "Maven groupId (스캐폴딩용)"
        required: true
        default: "com.example"
      artifact_id:
        description: "Maven artifactId (스캐폴딩용)"
        required: true
        default: "demo"
      package_name:
        description: "패키지명 (스캐폴딩용)"
        required: true
        default: "com.example.demo"
      java_version:
        description: "Java version"
        required: true
        default: "21"
      boot_version:
        description: "Spring Boot 버전 (빈 값이면 최신)"
        required: false
        default: ""
      commit_scaffold:
        description: "스캐폴딩된 파일을 커밋"
        required: true
        default: "true"

permissions:
  contents: write
  actions: read

env:
  ECHO_ROOT: .github/echo_sb
  ECHO_LOG: .github/echo_sb/logs
  ECHO_OUT: .github/echo_sb/out
  SITE_DIR: site/springboot
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 0) 공통 디렉토리 보증 + 기본 정보 에코
      - name: Prepare echo dirs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"/{logs,out,cc,perm,scaffold}
          echo "[ECHO] Repo: $GITHUB_REPOSITORY  SHA=$GITHUB_SHA" | tee -a "$ECHO_LOG/main.log"

      # 1) Spring Boot 스캐폴딩(없을 때만)
      - name: Detect pom.xml (and optionally scaffold)
        shell: bash
        env:
          GROUP_ID:     ${{ inputs.group_id }}
          ARTIFACT_ID:  ${{ inputs.artifact_id }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          JAVA_VERSION: ${{ inputs.java_version }}
          BOOT_VERSION: ${{ inputs.boot_version }}
          DO_SCAFFOLD:  ${{ inputs.scaffold_if_missing }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"/scaffold
          if find . -maxdepth 3 -name "pom.xml" | grep -q pom.xml; then
            echo "[ECHO] Found existing pom.xml" | tee -a "$ECHO_LOG/main.log"
            exit 0
          fi

          if [[ "$DO_SCAFFOLD" != "true" ]]; then
            echo "[ECHO][FAIL] No pom.xml and scaffold_if_missing=false" | tee -a "$ECHO_LOG/main.log"
            exit 22
          fi

          echo "[ECHO] Scaffolding Spring Boot project (Initializr)..." | tee -a "$ECHO_LOG/main.log"

          # Spring Initializr zip 생성
          # 외부 네트워크가 차단된 Runner라면 사내 미러 URL로 변경하세요.
          BOOT_PARAM=""
          if [[ -n "$BOOT_VERSION" ]]; then BOOT_PARAM="&bootVersion=${BOOT_VERSION}"; fi
          curl -fsSL "https://start.spring.io/starter.zip?type=maven-project&language=java&groupId=${GROUP_ID}&artifactId=${ARTIFACT_ID}&name=${ARTIFACT_ID}&packageName=${PACKAGE_NAME}&javaVersion=${JAVA_VERSION}&dependencies=web,actuator${BOOT_PARAM}" \
            -o "$ECHO_OUT/sb_starter.zip"
          unzip -q "$ECHO_OUT/sb_starter.zip" -d "$ECHO_OUT/sb_init"
          shopt -s dotglob
          mv "$ECHO_OUT/sb_init"/* ./
          shopt -u dotglob

          # 샘플 Controller/설정 보강
          mkdir -p src/main/java/$(echo "$PACKAGE_NAME" | tr . /)/controller
          cat > src/main/java/$(echo "$PACKAGE_NAME" | tr . /)/controller/HelloController.java <<'JAVA'
          package REPLACE_PACKAGE.controller;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RestController;
          @RestController
          public class HelloController {
              @GetMapping("/hello")
              public String hello() { return "Hello, Spring Boot!"; }
          }
          JAVA
          sed -i "s|REPLACE_PACKAGE|${PACKAGE_NAME}|g" src/main/java/$(echo "$PACKAGE_NAME" | tr . /)/controller/HelloController.java

          mkdir -p src/main/resources
          cat > src/main/resources/application.yml <<'YAML'
          server:
            port: 8080
          management:
            endpoints:
              web:
                exposure:
                  include: health,info
          YAML

          echo "[ECHO] Scaffolded Spring Boot project." | tee -a "$ECHO_LOG/main.log"
          cp -a pom.xml "$SITE_DIR/scaffold/pom.xml"
          cp -a src "$SITE_DIR/scaffold/src"

      # 2) (옵션) 스캐폴딩 커밋
      - name: Commit scaffold (optional)
        if: ${{ inputs.commit_scaffold == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"
          if ! git diff --quiet --exit-code; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore(springboot): initial scaffold via CI [${{ github.run_id }}]"
            git push
            echo "[ECHO] Scaffold committed." | tee -a "$ECHO_LOG/main.log"
          else
            echo "[ECHO] Nothing to commit." | tee -a "$ECHO_LOG/main.log"
          fi

      # 3) JDK 세팅 (setup-java는 server-id 설정을 주지 않아 settings.xml 충돌을 피함)
      - name: Setup Java (Temurin ${{ inputs.java_version }})
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      # 4) 기업 권한/설정 파일 생성 (settings.xml, 권한 매니페스트, 크리덴셜 템플릿 등)
      - name: Create enterprise settings & permission files
        shell: bash
        env:
          MAVEN_SERVER_ID: ${{ secrets.MAVEN_SERVER_ID }}
          MAVEN_USERNAME:  ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD:  ${{ secrets.MAVEN_PASSWORD }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR" ~/.m2 "$SITE_DIR"/perm "$SITE_DIR"/cc/credentials

          # ~/.m2/settings.xml (민감값은 Secrets로만 주입)
          cat > ~/.m2/settings.xml <<XML
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>${MAVEN_SERVER_ID:-github}</id>
                <username>${MAVEN_USERNAME}</username>
                <password>${MAVEN_PASSWORD}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>corp-default</id>
                <properties>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
                </properties>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>corp-default</activeProfile>
            </activeProfiles>
          </settings>
          XML

          # 권한 매니페스트 (문서/감사용)
          cat > "$SITE_DIR/perm/permission-manifest.yaml" <<'YAML'
          required_secrets:
            - MAVEN_SERVER_ID
            - MAVEN_USERNAME
            - MAVEN_PASSWORD
          required_permissions:
            - contents:write
          notes:
            - "settings.xml은 Runner 홈(~/.m2)에만 존재해야 하며 VCS에 포함시키지 말 것"
          YAML

          # 크리덴셜 템플릿(민감정보 없이 배포)
          cat > "$SITE_DIR/cc/credentials/settings.template.xml" <<'XML'
          <!-- Fill with CI secrets; do not commit real credentials -->
          <settings>
            <servers>
              <server>
                <id>${MAVEN_SERVER_ID}</id>
                <username>${MAVEN_USERNAME}</username>
                <password>${MAVEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          XML

          echo "[ECHO] settings.xml & permission/credential templates generated." | tee -a "$ECHO_LOG/main.log"

      # 5) 빌드/테스트/패키징
      - name: Build & Test (mvn -B -ntp clean verify)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"/out
          mvn -B -ntp -DskipTests=false clean verify | tee -a "$ECHO_LOG/build.log"
          find target -maxdepth 1 -type f \( -name "*.jar" -o -name "*.war" -o -name "*.pom" \) -print0 \
            | xargs -0 -I{} cp -a "{}" "$SITE_DIR/out/" || true
          echo "[ECHO] Copied artifacts to $SITE_DIR/out" | tee -a "$ECHO_LOG/build.log"

      # 6) C/C 파일(라이선스/체크섬 등) 대량 생성
      - name: Generate C/C (licenses & checksums)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$SITE_DIR/cc" "$ECHO_LOG"
          # 라이선스 스캔(간이 버전) — 필요 시 license-maven-plugin으로 대체
          mvn -B -ntp org.codehaus.mojo:license-maven-plugin:2.3.0:aggregate-add-third-party \
            -DthirdPartyFilename="$SITE_DIR/cc/THIRD-PARTY.txt" -DskipTests=true | tee -a "$ECHO_LOG/cc.log" || true

          # 체크섬
          : > "$SITE_DIR/cc/CHECKSUMS.sha256"
          find "$SITE_DIR/out" -type f -print0 | xargs -0 -I{} sha256sum "{}" >> "$SITE_DIR/cc/CHECKSUMS.sha256" || true

      # 7) 아카이브/아티팩트 업로드
      - name: Archive echo/site
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$SITE_DIR/releases" "$ECHO_LOG"
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          tar -C site -czf "site/springboot/releases/echo_${TS}.tar.gz" "springboot"
          echo "[ECHO] Archived to site/springboot/releases/echo_${TS}.tar.gz" | tee -a "$ECHO_LOG/main.log"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: springboot-echo-${{ github.run_id }}
          path: |
            site/springboot/**
            .github/echo_sb/logs/*

      # (선택) 변경사항 커밋
      - name: Commit site/ (only on dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ECHO_LOG" "$ECHO_OUT" "$SITE_DIR"
          if ! git diff --quiet --exit-code -- site/; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site/
            git commit -m "chore(springboot): echo/perm outputs [${{ github.run_id }}]"
            git push
            echo "[ECHO] site/ committed" | tee -a "$ECHO_LOG/main.log"
          else
            echo "[ECHO] No changes to commit" | tee -a "$ECHO_LOG/main.log"
          fi
